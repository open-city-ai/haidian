<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" width="400" height="244" role="img" aria-labelledby="t d">
  <title id="t">MEND Corridor Logo</title>
  <desc id="d">Rail spike and stitch: a Zhan Tianyou-era rail spike silhouette being sewn by suture thread — deep-green spike with stitch-red thread, monochrome-readable.</desc>

  <!-- Rail spike body (deep green #1F5C42, matching the green-spine palette) -->
  <g id="spike">
    <!-- Head (rounded cap) -->
    <path d="M168 28 Q168 22 174 22 L226 22 Q232 22 232 28 L232 52 Q232 58 226 58 L174 58 Q168 58 168 52 Z"
          fill="#1F5C42"/>
    <!-- Tapered shaft to chisel tip -->
    <path d="M176 58 L224 58 L205 186 L195 186 Z" fill="#1F5C42"/>
    <!-- Chisel-tip bevel -->
    <path d="M195 186 L197 193 L203 193 L205 186 Z" fill="#1F5C42"/>
    <!-- Herringbone 'ren' etching on the head (tribute to the Jing-Zhang herringbone railway) -->
    <path d="M196 34 L204 47 L212 34" fill="none" stroke="#A9CBA1" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fracture to be mended (light green) -->
  <path id="crack" d="M182 80 L190 96 L185 104 L197 122 L191 130 L205 148 L199 156 L210 166"
        fill="none" stroke="#A9CBA1" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round" opacity="0.9"/>

  <!-- Suture thread (stitch red #B54534), zig-zag across the fracture -->
  <g id="stitch">
    <path d="M177.0 88.8 L199.2 98.6 L187.1 119.6 L209.3 129.4 L197.2 150.4 L219.4 160.2"
          fill="none" stroke="#B54534" stroke-width="4.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Thread tail (dashed, suggesting the seam can be continued) -->
    <path d="M219.4 160.2 C 225 166, 231 170, 239 176" fill="none" stroke="#B54534"
          stroke-width="2.6" stroke-dasharray="4 3.5" stroke-linecap="round"/>
    <!-- Stitch knots -->
    <circle cx="177.0" cy="88.8" r="2.6" fill="#B54534"/>
    <circle cx="199.2" cy="98.6" r="2.6" fill="#B54534"/>
    <circle cx="187.1" cy="119.6" r="2.6" fill="#B54534"/>
    <circle cx="209.3" cy="129.4" r="2.6" fill="#B54534"/>
    <circle cx="197.2" cy="150.4" r="2.6" fill="#B54534"/>
    <circle cx="219.4" cy="160.2" r="2.6" fill="#B54534"/>
  </g>

  <!-- English wordmark -->
  <g id="wordmark" text-anchor="middle">
    <text x="200" y="216" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="26" font-weight="700" fill="#1F5C42" letter-spacing="3">MEND CORRIDOR</text>
    <text x="200" y="236" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="10.5" font-weight="500" fill="#66707B" letter-spacing="2">CARE · REPAIR · CONNECT</text>
  </g>
</svg>
