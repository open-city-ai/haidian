<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Jing-Zhang Commons Line logo</title>
  <desc id="desc">Two parallel railway lines meet an open node, representing traceable history, open contribution and human review.</desc>
  <rect width="960" height="240" rx="24" fill="#0d2037"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 70H360L470 120L360 170H70" stroke="#55d6d2" stroke-width="18"/>
    <path d="M70 104H344L422 120L344 136H70" stroke="#f07d67" stroke-width="7" opacity=".95"/>
    <circle cx="470" cy="120" r="31" stroke="#f6f7f2" stroke-width="8"/>
    <path d="M470 89V151M439 120H501" stroke="#f6f7f2" stroke-width="5"/>
  </g>
  <text x="548" y="106" fill="#f6f7f2" font-family="Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="2">JING-ZHANG</text>
  <text x="548" y="148" fill="#55d6d2" font-family="Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="2">COMMONS LINE</text>
  <text x="548" y="181" fill="#d8e2ed" font-family="Arial, sans-serif" font-size="15" letter-spacing="1">TRACE · TEST · TRUST</text>
</svg>
