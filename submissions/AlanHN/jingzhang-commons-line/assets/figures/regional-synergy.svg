<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">京张共智线区域协同接口图</title>
  <desc id="desc">The Jing-Zhang Commons Line is the central public protocol and exchanges authorized resources with five external regional interfaces.</desc>
  <rect width="1400" height="650" fill="#f5f7f9"/>
  <text x="60" y="58" fill="#0d2037" font-family="Arial, sans-serif" font-size="28" font-weight="700">区域协同接口 · exchange, review, reuse</text>
  <text x="60" y="88" fill="#64748b" font-family="Arial, sans-serif" font-size="15">外部区域是可选接口，不是新增红线；所有交换均需授权、脱敏、人工复核。</text>
  <rect x="485" y="158" width="430" height="330" rx="24" fill="#0d2037"/>
  <text x="700" y="235" text-anchor="middle" fill="#f6f7f2" font-family="Arial, sans-serif" font-size="30" font-weight="700">京张共智线</text>
  <text x="700" y="274" text-anchor="middle" fill="#55d6d2" font-family="Arial, sans-serif" font-size="20">公共主脉 / Commons Protocol</text>
  <text x="700" y="330" text-anchor="middle" fill="#d8e2ed" font-family="Arial, sans-serif" font-size="17">授权输入 · 沙盒测试 · 人工复核</text>
  <text x="700" y="362" text-anchor="middle" fill="#d8e2ed" font-family="Arial, sans-serif" font-size="17">公共体验 · 版本记录 · 可退出</text>
  <rect x="555" y="407" width="290" height="48" rx="24" fill="#f07d67"/>
  <text x="700" y="438" text-anchor="middle" fill="#0d2037" font-family="Arial, sans-serif" font-size="17" font-weight="700">不转移敏感数据 / 不替代审批</text>
  <g fill="none" stroke="#55d6d2" stroke-width="4" stroke-linecap="round">
    <path d="M485 245H350"/><path d="M915 245H1050"/>
    <path d="M485 395H350"/><path d="M915 395H1050"/>
    <path d="M595 158L480 105"/><path d="M805 158L920 105"/>
  </g>
  <g font-family="Arial, sans-serif">
    <g><rect x="60" y="185" width="290" height="105" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="85" y="222" fill="#0d2037" font-size="21" font-weight="700">北纬社区</text><text x="85" y="253" fill="#64748b" font-size="15">居民问题 / 线下反馈</text><text x="85" y="276" fill="#64748b" font-size="14">输出：公共服务原型</text></g>
    <g><rect x="1050" y="185" width="290" height="105" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="1075" y="222" fill="#0d2037" font-size="21" font-weight="700">未来科学城</text><text x="1075" y="253" fill="#64748b" font-size="15">科研成果 / 验证需求</text><text x="1075" y="276" fill="#64748b" font-size="14">输出：合规预审模板</text></g>
    <g><rect x="60" y="345" width="290" height="105" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="85" y="382" fill="#0d2037" font-size="21" font-weight="700">怀柔科学城</text><text x="85" y="413" fill="#64748b" font-size="15">观测方法 / 生态议题</text><text x="85" y="436" fill="#64748b" font-size="14">输出：城市可读指标</text></g>
    <g><rect x="1050" y="345" width="290" height="105" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="1075" y="382" fill="#0d2037" font-size="21" font-weight="700">经开区</text><text x="1075" y="413" fill="#64748b" font-size="15">制造 / 机器人测试</text><text x="1075" y="436" fill="#64748b" font-size="14">输出：安全测试记录</text></g>
    <g><rect x="485" y="30" width="430" height="75" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="700" y="62" text-anchor="middle" fill="#0d2037" font-size="21" font-weight="700">京津冀</text><text x="700" y="88" text-anchor="middle" fill="#64748b" font-size="14">文化线路 / 开放标准 / 场景案例</text></g>
  </g>
  <text x="60" y="585" fill="#64748b" font-family="Arial, sans-serif" font-size="15">判断标准：有授权记录 · 有人工复核/退出记录 · 方法可在不交换敏感数据时复用。</text>
</svg>
