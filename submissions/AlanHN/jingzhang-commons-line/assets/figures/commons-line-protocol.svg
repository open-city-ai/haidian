<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 490" role="img" aria-labelledby="title desc">
  <title id="title">Commons Line 场景运行协议</title>
  <desc id="desc">Six gates take an urban issue from registration through compliance review, sandbox testing, human review, small public release and a versioned decision to continue, change, pause or exit.</desc>
  <rect width="1400" height="490" fill="#f5f7f9"/>
  <text x="60" y="58" fill="#0d2037" font-family="Arial, sans-serif" font-size="28" font-weight="700">Commons Line Protocol</text>
  <text x="60" y="88" fill="#64748b" font-family="Arial, sans-serif" font-size="15">每一站都必须能说明：依据什么、测试什么、谁复核、如何暂停。</text>
  <g font-family="Arial, sans-serif">
    <g><rect x="60" y="145" width="190" height="145" rx="16" fill="#0d2037"/><text x="155" y="190" text-anchor="middle" fill="#55d6d2" font-size="18" font-weight="700">01</text><text x="155" y="225" text-anchor="middle" fill="#f6f7f2" font-size="21" font-weight="700">Issue</text><text x="155" y="258" text-anchor="middle" fill="#d8e2ed" font-size="14">问题登记</text><text x="155" y="278" text-anchor="middle" fill="#d8e2ed" font-size="13">来源 / 影响 / 线下入口</text></g>
    <g><rect x="280" y="145" width="190" height="145" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="375" y="190" text-anchor="middle" fill="#0d2037" font-size="18" font-weight="700">02</text><text x="375" y="225" text-anchor="middle" fill="#0d2037" font-size="21" font-weight="700">Branch</text><text x="375" y="258" text-anchor="middle" fill="#64748b" font-size="14">合规预审</text><text x="375" y="278" text-anchor="middle" fill="#64748b" font-size="13">数据 / 权利 / 无障碍</text></g>
    <g><rect x="500" y="145" width="190" height="145" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="595" y="190" text-anchor="middle" fill="#0d2037" font-size="18" font-weight="700">03</text><text x="595" y="225" text-anchor="middle" fill="#0d2037" font-size="21" font-weight="700">Sandbox</text><text x="595" y="258" text-anchor="middle" fill="#64748b" font-size="14">沙盒测试</text><text x="595" y="278" text-anchor="middle" fill="#64748b" font-size="13">版本 / 失败日志 / 边界</text></g>
    <g><rect x="720" y="145" width="190" height="145" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="815" y="190" text-anchor="middle" fill="#0d2037" font-size="18" font-weight="700">04</text><text x="815" y="225" text-anchor="middle" fill="#0d2037" font-size="21" font-weight="700">Review</text><text x="815" y="258" text-anchor="middle" fill="#64748b" font-size="14">人工评审</text><text x="815" y="278" text-anchor="middle" fill="#64748b" font-size="13">专业意见 / 异议 / 申诉</text></g>
    <g><rect x="940" y="145" width="190" height="145" rx="16" fill="#ffffff" stroke="#d5dee8"/><text x="1035" y="190" text-anchor="middle" fill="#0d2037" font-size="18" font-weight="700">05</text><text x="1035" y="225" text-anchor="middle" fill="#0d2037" font-size="21" font-weight="700">Public</text><text x="1035" y="258" text-anchor="middle" fill="#64748b" font-size="14">小规模公开</text><text x="1035" y="278" text-anchor="middle" fill="#64748b" font-size="13">范围 / 时段 / 替代服务</text></g>
    <g><rect x="1160" y="145" width="180" height="145" rx="16" fill="#f07d67"/><text x="1250" y="190" text-anchor="middle" fill="#0d2037" font-size="18" font-weight="700">06</text><text x="1250" y="225" text-anchor="middle" fill="#0d2037" font-size="21" font-weight="700">Changelog</text><text x="1250" y="258" text-anchor="middle" fill="#0d2037" font-size="14">评估 / 暂停 / 退出</text><text x="1250" y="278" text-anchor="middle" fill="#0d2037" font-size="13">版本差异与恢复责任</text></g>
  </g>
  <path d="M250 218H280M470 218H500M690 218H720M910 218H940M1130 218H1160" stroke="#55d6d2" stroke-width="5" stroke-linecap="round"/>
  <rect x="60" y="355" width="1280" height="62" rx="31" fill="#0d2037"/>
  <text x="700" y="394" text-anchor="middle" fill="#f6f7f2" font-family="Arial, sans-serif" font-size="18">任何现场人工责任人可暂停；暂停期间必须保留人工或纸面替代服务。</text>
</svg>
