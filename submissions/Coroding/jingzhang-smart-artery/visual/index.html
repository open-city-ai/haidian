<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>轨迹共生｜正式图纸</title>
  <style>
*{box-sizing:border-box}body{margin:0;background:#e6eaea;color:#534346;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif}header{position:sticky;top:0;z-index:1;background:#ffffff;border-bottom:1px solid #ab9fa6}.wrap{width:min(1480px,calc(100% - 36px));margin:auto}header .wrap{padding:22px 0}h1{margin:0 0 8px;color:#697d83;font-size:38px;letter-spacing:0}p{margin:0;color:#697d83;line-height:1.65}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.metric{background:#fff;border:1px solid #ab9fa6;border-radius:8px;padding:14px 16px;min-width:0}.metric span{display:block;color:#697d83;font-size:13px}.metric strong{display:block;margin-top:4px;font-size:24px;color:#66a5b8;word-break:break-word}figure{margin:26px 0;background:#fff;border:1px solid #ab9fa6;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(83,67,70,.08)}figcaption{padding:14px 18px;border-bottom:1px solid #ab9fa6;font-size:20px;font-weight:800;line-height:1.35}img{display:block;width:100%;height:auto}.note{background:#fff;border:1px solid #ab9fa6;border-radius:8px;padding:14px 18px;color:#697d83;line-height:1.7}@media(max-width:760px){.metrics{grid-template-columns:1fr}h1{font-size:30px}figcaption{font-size:17px}}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>轨迹共生｜百年京张的创新日常</h1>
      <p>以京张遗址公共脊缝合城市割裂，以 AI 新型基础设施提升公共服务韧性，以社区友好型空间让创新转化为日常公共品。五张图按赛方正式要求输出；点位落在道路交叉口，轴线和面边界服从自有底图控制线。</p>
    </div>
  </header>
  <main class="wrap">
    <section class="metrics">
      <div class="metric">
        <span>site_area_sqm</span>
        <strong data-metric="site_area_sqm" data-value="11412825.386">11,412,825.386</strong>
      </div>
      <div class="metric">
        <span>green_ratio</span>
        <strong data-metric="green_ratio" data-value="0.123423">0.123423</strong>
      </div>
      <div class="metric">
        <span>public_space_ratio</span>
        <strong data-metric="public_space_ratio" data-value="0.073281">0.073281</strong>
      </div>
    </section>
    <div class="note">规划目标 · 规划策略 · 规划意义 · 三层范围 · 重点区域 · 用地分区 · 交通慢行 · 蓝绿公共空间 · 建筑 · 更新项目 · AI 场景 · 核心指标 · 任务覆盖 · 自检状态 · 来源 · 假设</div>
    <figure>
      <figcaption>自有规划底图</figcaption>
      <img src="../assets/figures/custom-base-map.png" alt="自有规划底图">
    </figure>
    <figure>
      <figcaption>01 总览地图：底图对齐与总体概念</figcaption>
      <img src="../assets/figures/site-overview.png" alt="01 总览地图：底图对齐与总体概念">
    </figure>
    <figure>
      <figcaption>02 用地结构：道路控制下的功能复合</figcaption>
      <img src="../assets/figures/land-use-structure.png" alt="02 用地结构：道路控制下的功能复合">
    </figure>
    <figure>
      <figcaption>03 重点区域：三处交叉口更新地块</figcaption>
      <img src="../assets/figures/key-areas.png" alt="03 重点区域：三处交叉口更新地块">
    </figure>
    <figure>
      <figcaption>04 交通慢行：蓝绿公共空间与AI场景</figcaption>
      <img src="../assets/figures/mobility-bluegreen.png" alt="04 交通慢行：蓝绿公共空间与AI场景">
    </figure>
    <figure>
      <figcaption>05 指标证据：复算链条与预期评估</figcaption>
      <img src="../assets/figures/metrics-evidence.png" alt="05 指标证据：复算链条与预期评估">
    </figure>
  </main>
</body>
</html>
