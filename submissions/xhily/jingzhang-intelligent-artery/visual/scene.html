const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
let scale=1, ox=0, oy=0, tilt=false;
const layers={site:true,keyareas:true,landuse:true,public:true,roads:true,landmarks:true,scenarios:true};
let selected=null;

function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);fit();draw();}
function fit(){const b=bound();const pad=40;const sx=(W-pad*2)/(b.w||1),sy=(H-pad*2)/(b.h||1);scale=Math.min(sx,sy);ox=pad-b.x*scale+(W-pad*2-b.w*scale)/2;oy=pad-b.y*scale+(H-pad*2-b.h*scale)/2;}
function bound(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const add=(pt)=>{x0=Math.min(x0,pt[0]);y0=Math.min(y0,pt[1]);x1=Math.max(x1,pt[0]);y1=Math.max(y1,pt[1]);};
  for(const k of DATA.keyareas)for(const p of k.polys)for(const pt of p)add(pt);
  for(const p of DATA.site)for(const pt of p)add(pt);
  for(const p of DATA.public)for(const pt of p)add(pt);
  for(const m of DATA.landmarks.concat(DATA.scenarios))add(m.pos);
  return{x:x0,y:y0,w:x1-x0,h:y1-y0};}

// virtual -> screen (with optional iso tilt)
function P(v){
  let x=v[0], y=v[1];
  if(tilt){ // isometric-ish: rotate 30deg + vertical squash
    const a=Math.PI/6, ca=Math.cos(a), sa=Math.sin(a);
    const rx=x*ca - y*sa, ry=(x*sa + y*ca)*0.55;
    return [ox+rx*scale, oy+ry*scale];
  }
  return [ox+x*scale, oy+y*scale];
}
function extrude(poly,h){ // returns top ring raised by h (screen units) using tilt
  return poly.map(pt=>{const s=P(pt); if(tilt){s[1]-=h*scale*0.9;} else {s[1]-=h*scale;} return s;});
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#dfe7f1';ctx.fillRect(0,0,W,H);
  // land use (painter sorted by y for tilt)
  if(layers.landuse){
    const items=DATA.landuse.slice();
    if(tilt) items.sort((a,b)=>centroidY(b)-centroidY(a));
    for(const it of items){
      for(const poly of it.polys){
        drawPoly(poly,it.color,it.h,0.92);
      }
    }
  }
  if(layers.public){for(const poly of DATA.public)drawPoly(poly,'#9fe0b0',0.02,0.95);}
  if(layers.keyareas){for(const k of DATA.keyareas){for(const poly of k.polys)strokePoly(poly,'#1f4e79',2.2);}}
  if(layers.site){for(const poly of DATA.site)strokePoly(poly,'#10243d',3);}
  if(layers.roads){ctx.strokeStyle='#ffffff';ctx.lineWidth=2.4;ctx.setLineDash([6,5]);for(const ln of DATA.roads){ctx.beginPath();ln.forEach((pt,i)=>{const s=P(pt);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);});ctx.stroke();}ctx.setLineDash([]);}
  if(layers.landmarks)for(const m of DATA.landmarks)drawMarker(m,'LM',m.pos,'#c0392b');
  if(layers.scenarios)for(const m of DATA.scenarios)drawMarker(m,'SC',m.pos,'#16a085');
}
function centroidY(it){let s=0,n=0;for(const poly of it.polys)for(const pt of poly){s+=pt[1];n++;}return s/(n||1);}
function drawPoly(poly,fill,h,alpha){
  if(!poly.length)return;
  const top=extrude(poly,h);
  // walls
  if(tilt && h>0.001){
    ctx.fillStyle=shade(fill,-0.25);ctx.globalAlpha=alpha;
    for(let i=0;i<poly.length;i++){
      const a=P(poly[i]), b=P(poly[(i+1)%poly.length]); const ta=top[i], tb=top[(i+1)%poly.length];
      ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(tb[0],tb[1]);ctx.lineTo(ta[0],ta[1]);ctx.closePath();ctx.fill();
    }
  }
  ctx.globalAlpha=alpha;ctx.fillStyle=fill;ctx.beginPath();
  top.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]));ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
}
function strokePoly(poly,stroke,w){if(!poly.length)return;ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.beginPath();poly.forEach((pt,i)=>{const s=P(pt);i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);});ctx.closePath();ctx.stroke();}
function drawMarker(m,tag,pos,color){
  const s=P(pos);
  ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(s[0],s[1],6,0,7);ctx.fill();ctx.stroke();
  // label
  ctx.fillStyle='#10243d';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
  ctx.fillText(tag+'-'+m.code.split('-')[1], s[0], s[1]-9);
  if(selected===m.code){ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(s[0],s[1],10,0,7);ctx.stroke();}
}
function shade(hex,amt){const c=hex.replace('#','');let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);r=Math.max(0,Math.min(255,r+amt*255));g=Math.max(0,Math.min(255,g+amt*255));b=Math.max(0,Math.min(255,b+amt*255));return `rgb(${r|0},${g|0},${b|0})`;}

// interaction
let drag=false,lx=0,ly=0;
cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{if(drag){ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;draw();}});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;ox=mx-(mx-ox)*f;oy=my-(my-oy)*f;scale*=f;draw();},{passive:false});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  let hit=null,best=1e9;
  for(const m of DATA.landmarks.concat(DATA.scenarios)){const s=P(m.pos);const d=Math.hypot(s[0]-mx,s[1]-my);if(d<best&&d<12){best=d;hit=m;}}
  if(hit){selected=hit.code;show(hit);draw();}
});
function show(m){const t=m.code.startsWith('LM')?'地标':'场景卡';document.getElementById('p-title').textContent=m.code+' '+m.title;document.getElementById('p-meta').textContent=t+' · 概念落位（参考方案）';document.getElementById('p-desc').textContent=m.desc;}

const defs=[['site','总体范围'],['keyareas','重点区域(三区)'],['landuse','用地性质'],['public','公共空间'],['roads','路网'],['landmarks','地标 LM'],['scenarios','场景卡 SC']];
const ctl=document.getElementById('controls');
defs.forEach(([k,label])=>{const b=document.createElement('button');b.textContent=label;b.className='on';b.onclick=()=>{layers[k]=!layers[k];b.className=layers[k]?'on':'';draw();};ctl.appendChild(b);});
const tb=document.createElement('button');tb.textContent='立体';tb.onclick=()=>{tilt=!tilt;tb.className=tilt?'on':'';fit();draw();};ctl.appendChild(tb);
const rb=document.createElement('button');rb.textContent='复位';rb.onclick=()=>{selected=null;fit();draw();};ctl.appendChild(rb);
// legend
const lg=document.getElementById('legend');lg.innerHTML='<b>用地性质</b><br>'+Object.entries(DATA.cats).map(([k,v])=>`<i style="background:${v}"></i>${k}`).join('<br>');
window.addEventListener('resize',resize);resize();
</script></body></html>
