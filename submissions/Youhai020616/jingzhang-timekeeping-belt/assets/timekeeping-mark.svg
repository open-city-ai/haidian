<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="京张授时带标志：水平基准线、表盘轮廓与未闭合的缺口 / Jing-Zhang Timekeeping Belt mark">
  <!-- 京张授时带概念主标 · 本次投稿原创，基础矢量几何手写生成，无外部素材 -->
  <!-- 三元素：基准线（贯穿全带的公共基准）· 表盘轮廓（周期对时）· 未闭合缺口（永远存在下一次对时）-->
  <title>京张授时带 / Jing-Zhang Timekeeping Belt</title>
  <!-- 基准线 -->
  <line x1="24" y1="100" x2="616" y2="100" stroke="#26221F" stroke-width="6" stroke-linecap="round"/>
  <!-- 表盘轮廓（325° 弧，缺口位于右上方 40°–75°）-->
  <path d="M 156.6 38.2 A 64 64 0 1 0 189.0 58.9" fill="none" stroke="#26221F" stroke-width="10" stroke-linecap="round"/>
  <!-- 缺口内的准点青刻度：指向下一次对时 -->
  <line x1="167.9" y1="56.2" x2="180.8" y2="35.9" stroke="#1F7A72" stroke-width="7" stroke-linecap="round"/>
  <!-- 表盘中心点 -->
  <circle cx="140" cy="100" r="7" fill="#26221F"/>
  <!-- 中英文标准组合 -->
  <text x="248" y="88" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="600" fill="#26221F">京张授时带</text>
  <text x="250" y="128" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" letter-spacing="3.2" fill="#6B625A">JING-ZHANG TIMEKEEPING BELT</text>
</svg>
