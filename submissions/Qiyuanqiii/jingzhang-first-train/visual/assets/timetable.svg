<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">京张·首班车城市时刻表 / JZ First Train Urban Timetable</title>
  <desc id="desc">A bilingual conceptual six-stop operating sequence for the JZ First Train urban design proposal. It is a presentation diagram, not an official plan or implementation commitment.</desc>
  <rect width="1200" height="720" fill="#0f1927"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="70" y="70" fill="#eb5042" font-size="18" font-weight="700" letter-spacing="3">JZ FIRST TRAIN · URBAN TIMETABLE</text>
    <text x="70" y="122" fill="#f5f0e0" font-size="40" font-weight="800">京张·首班车城市时刻表</text>
    <text x="70" y="158" fill="#a8b8c8" font-size="22">JZ First Train — six-stop urban operating sequence</text>
    <rect x="70" y="190" width="1060" height="64" rx="10" fill="#142234" stroke="#435a70"/>
    <text x="92" y="216" fill="#f5f0e0" font-size="15" font-weight="700">概念表达 / CONCEPT ONLY</text>
    <text x="92" y="240" fill="#a8b8c8" font-size="14">非现场实景、非官方效果图、非正式规划或工程承诺；空间证据仍以提交包 GeoJSON、metrics 与矩阵为准。</text>
    <line x1="120" y1="340" x2="1080" y2="340" stroke="#d8ddd9" stroke-width="6" stroke-linecap="round"/>
    <g>
      <circle cx="130" cy="340" r="16" fill="#f5f0e0" stroke="#eb5042" stroke-width="6"/>
      <rect x="72" y="382" width="176" height="192" rx="14" fill="#162538" stroke="#30465e"/>
      <text x="88" y="410" fill="#eb5042" font-size="12" font-weight="700">00 · MEMORY</text>
      <text x="88" y="438" fill="#f5f0e0" font-size="17" font-weight="700">百年京张 · 文化启程</text>
      <text x="88" y="461" fill="#d5dfe7" font-size="13">Jing-Zhang Memory</text>
      <text x="88" y="493" fill="#a8b8c8" font-size="12">铁路自主建造与公共服务精神</text>
      <text x="88" y="512" fill="#a8b8c8" font-size="12">转译为 AI 时代公共创新伦理。</text>
      <text x="88" y="548" fill="#d5dfe7" font-size="11">Gate / 门槛：史实可核验</text>
    </g>
    <g>
      <circle cx="318" cy="340" r="16" fill="#f5f0e0" stroke="#eb5042" stroke-width="6"/>
      <rect x="260" y="382" width="176" height="192" rx="14" fill="#162538" stroke="#30465e"/>
      <text x="276" y="410" fill="#eb5042" font-size="12" font-weight="700">01 · BACKSTAGE</text>
      <text x="276" y="438" fill="#f5f0e0" font-size="17" font-weight="700">众智园 · 始发站</text>
      <text x="276" y="461" fill="#d5dfe7" font-size="13">Zhongzhiyuan</text>
      <text x="276" y="493" fill="#a8b8c8" font-size="12">全栈创新、安全评测与互操作</text>
      <text x="276" y="512" fill="#a8b8c8" font-size="12">先后台测试，再进入公共空间。</text>
      <text x="276" y="548" fill="#d5dfe7" font-size="11">Gate：测试与风险记录</text>
    </g>
    <g>
      <circle cx="506" cy="340" r="16" fill="#f5f0e0" stroke="#eb5042" stroke-width="6"/>
      <rect x="448" y="382" width="176" height="192" rx="14" fill="#162538" stroke="#30465e"/>
      <text x="464" y="410" fill="#eb5042" font-size="12" font-weight="700">02 · PREMIERE</text>
      <text x="464" y="438" fill="#f5f0e0" font-size="17" font-weight="700">AI 原点 · 发车台</text>
      <text x="464" y="461" fill="#d5dfe7" font-size="13">AI Origin Platform</text>
      <text x="464" y="493" fill="#a8b8c8" font-size="12">高校、开发者与初创团队发布</text>
      <text x="464" y="512" fill="#a8b8c8" font-size="12">小规模、可撤回的 AI 原型。</text>
      <text x="464" y="548" fill="#d5dfe7" font-size="11">Gate：公开说明与退出</text>
    </g>
    <g>
      <circle cx="694" cy="340" r="16" fill="#f5f0e0" stroke="#eb5042" stroke-width="6"/>
      <rect x="636" y="382" width="176" height="192" rx="14" fill="#162538" stroke="#30465e"/>
      <text x="652" y="410" fill="#eb5042" font-size="12" font-weight="700">03 · CITY TEST</text>
      <text x="652" y="438" fill="#f5f0e0" font-size="17" font-weight="700">小月河 · 沿线试乘</text>
      <text x="652" y="461" fill="#d5dfe7" font-size="13">Xiaoyuehe Test Ride</text>
      <text x="652" y="493" fill="#a8b8c8" font-size="12">慢行、无障碍、生态与社区服务</text>
      <text x="652" y="512" fill="#a8b8c8" font-size="12">低侵入试演，保留非 AI 选项。</text>
      <text x="652" y="548" fill="#d5dfe7" font-size="11">Gate：公共利益与人工复核</text>
    </g>
    <g>
      <circle cx="882" cy="340" r="16" fill="#f5f0e0" stroke="#eb5042" stroke-width="6"/>
      <rect x="824" y="382" width="176" height="192" rx="14" fill="#162538" stroke="#30465e"/>
      <text x="840" y="410" fill="#eb5042" font-size="12" font-weight="700">04 · TRANSFER</text>
      <text x="840" y="438" fill="#f5f0e0" font-size="17" font-weight="700">大钟寺 · 换乘站</text>
      <text x="840" y="461" fill="#d5dfe7" font-size="13">Dazhongsi Transfer</text>
      <text x="840" y="493" fill="#a8b8c8" font-size="12">智能原生消费、商务与国际</text>
      <text x="840" y="512" fill="#a8b8c8" font-size="12">路演接受真实使用反馈。</text>
      <text x="840" y="548" fill="#d5dfe7" font-size="11">Gate：可用性与合规复核</text>
    </g>
    <g>
      <circle cx="1070" cy="340" r="16" fill="#f5f0e0" stroke="#eb5042" stroke-width="6"/>
      <rect x="1012" y="382" width="116" height="192" rx="14" fill="#162538" stroke="#30465e"/>
      <text x="1028" y="410" fill="#eb5042" font-size="12" font-weight="700">05 · NETWORK</text>
      <text x="1028" y="438" fill="#f5f0e0" font-size="15" font-weight="700">中关村翼</text>
      <text x="1028" y="460" fill="#d5dfe7" font-size="12">Global Network</text>
      <text x="1028" y="493" fill="#a8b8c8" font-size="11">IP、人才、资本、</text>
      <text x="1028" y="511" fill="#a8b8c8" font-size="11">标准与国际合作。</text>
      <text x="1028" y="548" fill="#d5dfe7" font-size="10">Gate：证据与归因</text>
    </g>
    <text x="70" y="626" fill="#f5f0e0" font-size="15" font-weight="700">运营原则 / OPERATING PRINCIPLE</text>
    <text x="70" y="652" fill="#a8b8c8" font-size="14">研究 → 测试 → 公开体验 → 合规复核 → 协作扩散；每一站都要求可解释、可退出、可人工接管。</text>
    <text x="70" y="676" fill="#a8b8c8" font-size="13">Research → test → public experience → compliance review → networked collaboration; explainable, reversible, human-reviewable.</text>
  </g>
</svg>
