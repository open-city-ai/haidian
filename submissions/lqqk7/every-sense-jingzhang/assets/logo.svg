<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="esjz-t esjz-d">
  <title id="esjz-t">万感京张 / EVERY SENSE JING-ZHANG</title>
  <desc id="esjz-d">四条平行感知线自两侧进入一个留有开口的圆形节点，节点中心是一枚原点。图形由京张铁路“统一轨距”抽象为通用设计：统一轨距使不同列车共享同一网络，通用设计使不同身体共享同一座城市。</desc>
  <style>
    .esjz-line { fill: none; stroke: #177c78; stroke-linecap: round; }
    .esjz-rail { stroke-width: 9; }
    .esjz-tactile { stroke-width: 6; stroke-dasharray: 0.5 13.5; }
    .esjz-node { fill: none; stroke: #10383d; stroke-width: 7; stroke-linecap: round; }
    .esjz-origin { fill: #d76450; }
    .esjz-rule { stroke: #cbd3cf; stroke-width: 1.5; }
    .esjz-cn { fill: #10383d; font-family: Georgia, "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", SimSun, serif; font-size: 62px; letter-spacing: 10px; }
    .esjz-en { fill: #177c78; font-family: "Helvetica Neue", Helvetica, Arial, "Source Han Sans SC", "Noto Sans CJK SC", sans-serif; font-size: 18.5px; font-weight: 700; letter-spacing: 2.8px; }
    @media (prefers-color-scheme: dark) {
      .esjz-line { stroke: #5fb3ab; }
      .esjz-node { stroke: #f2efe7; }
      .esjz-origin { fill: #e08975; }
      .esjz-rule { stroke: #3f6165; }
      .esjz-cn { fill: #f2efe7; }
      .esjz-en { fill: #9ecdc7; }
    }
  </style>

  <g class="esjz-line esjz-tactile">
    <path d="M34 61H118.41"/>
    <path d="M234 61H149.59"/>
    <path d="M34 139H118.41"/>
    <path d="M234 139H149.59"/>
  </g>
  <g class="esjz-line esjz-rail">
    <path d="M34 87H94.06"/>
    <path d="M234 87H173.94"/>
    <path d="M34 113H94.06"/>
    <path d="M234 113H173.94"/>
  </g>
  <g class="esjz-node">
    <path d="M106.18 88.76A30 30 0 0 1 161.82 88.76"/>
    <path d="M161.82 111.24A30 30 0 0 1 106.18 111.24"/>
  </g>
  <circle class="esjz-origin" cx="134" cy="100" r="6.5"/>

  <path class="esjz-rule" d="M262 52V146"/>
  <text class="esjz-cn" x="288" y="106">万感京张</text>
  <text class="esjz-en" x="288" y="142">EVERY SENSE JING-ZHANG</text>
</svg>
