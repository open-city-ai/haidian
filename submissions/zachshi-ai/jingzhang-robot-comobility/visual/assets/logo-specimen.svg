<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img" aria-label="Jingzhang Smart Mobility Network logo specimen">
  <title>JZ CoMobility Logo Specimen (original geometric composition)</title>
  <!-- background safe-area guide (not part of the mark) -->
  <rect x="4" y="4" width="392" height="152" fill="none" stroke="#dfe6ee" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- rail arc (the heritage railway line) -->
  <path d="M 40 120 Q 140 120 200 70 T 360 40" fill="none" stroke="#1F7A5C" stroke-width="10" stroke-linecap="round"/>
  <!-- ren chevron (人字形铁路 abstraction, splitting from the rail) -->
  <path d="M 130 108 L 160 70 M 160 70 L 190 108" fill="none" stroke="#8E9BA8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wheel dot (robot) -->
  <circle cx="232" cy="62" r="13" fill="#E86A33"/>
  <circle cx="232" cy="62" r="5.5" fill="#ffffff"/>
  <!-- wordmark -->
  <text x="270" y="76" font-family="PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1a2733">京张智行网</text>
  <text x="270" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#5b6b7b">JZ COMOBILITY</text>
  <!-- application rules annotation -->
  <text x="20" y="146" font-family="PingFang SC, sans-serif" font-size="9" fill="#8a94a6">样张 1/1：主标志（最小尺寸 12mm/32px，安全间距 ≥ 1/4 主形高；禁用渐变与描边）</text>
</svg>
