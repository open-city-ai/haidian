<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-label="智脉一带 AI Pulse Belt logo">
  <!-- 智脉一带 · AI Pulse Belt — 铁轨渐变为示波器波形 -->
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4e55"/>
      <stop offset="1" stop-color="#22a7b8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22a7b8"/>
      <stop offset="1" stop-color="#59c3d0"/>
    </linearGradient>
  </defs>

  <!-- 轨道段：三条平行铁轨，从左向右渐变 -->
  <rect x="20" y="86" width="180" height="6" rx="3" fill="url(#rail)"/>
  <rect x="20" y="114" width="180" height="6" rx="3" fill="url(#rail)"/>
  <rect x="20" y="142" width="180" height="6" rx="3" fill="url(#rail)"/>

  <!-- 枕木（铁轨记忆点） -->
  <g fill="#8a8f98">
    <rect x="46"  y="80" width="4" height="74" rx="1"/>
    <rect x="86"  y="80" width="4" height="74" rx="1"/>
    <rect x="126" y="80" width="4" height="74" rx="1"/>
    <rect x="166" y="80" width="4" height="74" rx="1"/>
  </g>

  <!-- 波形段：铁轨汇入示波器脉冲（AI 智脉） -->
  <path d="M 214 114
           C 246 114, 246 74,  276 74
           C 306 74,  306 154, 336 154
           C 366 154, 366 94,  396 94
           C 418 94,  424 102, 452 102"
        fill="none" stroke="url(#wave)" stroke-width="6" stroke-linecap="round"/>

  <!-- 脉冲节点（沿波形传播的 AI 光点） -->
  <circle cx="396" cy="94" r="9" fill="#22a7b8"/>
  <circle cx="396" cy="94" r="14" fill="none" stroke="#22a7b8" stroke-width="2" opacity="0.45"/>
  <circle cx="452" cy="102" r="6" fill="#59c3d0"/>

  <!-- 中心圆点：原点（AI 原点之钟意象） -->
  <circle cx="396" cy="94" r="3" fill="#ffffff"/>

  <!-- 文字 -->
  <text x="20" y="205" font-family="'SimHei','Heiti SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="bold" fill="#2b2f36">智脉一带</text>
  <text x="20" y="228" font-family="'Arial','Helvetica',sans-serif" font-size="15" letter-spacing="2.5" fill="#22a7b8">AI PULSE BELT</text>
</svg>
