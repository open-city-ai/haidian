<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#f7f5ef" stroke="none" stroke-width="0" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#17323d"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#b7d8d4" stroke-width="3"/></pattern></defs><text x="54" y="59" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17323d" text-anchor="start">WORKING FIGURE C | DAZHONGSI ARRIVAL - MARKET INTERFACE</text><text x="54" y="89" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5d747a" text-anchor="start">A concept arrival chain for high-frequency noon transfer: arrive, decide, pause, cross or reroute, then enter daily life.</text><rect x="1274" y="42" width="272" height="24" rx="3" fill="#e6f0ee" stroke="#ccd8d5" stroke-width="1" /><text x="1282" y="59" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">CONCEPT / NOT FIELD VERIFIED</text><rect x="54" y="130" width="900" height="850" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="78" y="164" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17323d" text-anchor="start">CONCEPT ARRIVAL PLAN</text><text x="78" y="187" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#118c83" text-anchor="start">SECTION-04 | ARRIVAL THRESHOLD / FIRST DECISION / SHORT PAUSE / CROSSING / DAILY SERVICE</text><rect x="96" y="238" width="218" height="122" rx="5" fill="#dbe8f5" stroke="#4d83bf" stroke-width="1.5" /><text x="116" y="268" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="start">CONCEPT ARRIVAL EDGE</text><text x="116" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">N11: fixed station-to-spine marker</text><text x="116" y="307" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">do not assert a verified station entry</text><g transform="translate(271 330)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><g transform="translate(160 331) scale(0.9)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><path d="M314 303 H830" stroke="#17323d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="337" y="250" width="176" height="113" rx="5" fill="#f7e5ea" stroke="#c84b70" stroke-width="1.5" /><text x="356" y="280" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#c84b70" text-anchor="start">FIRST DECISION</text><text x="356" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">N10 / F04 human handover</text><text x="356" y="319" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">crossing and access check</text><g transform="translate(474 333) scale(0.85)"><circle cx="0" cy="-10" r="4" fill="#c84b70"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#c84b70" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="548" y="247" width="185" height="116" rx="5" fill="#f7cfb7" stroke="#ed8454" stroke-width="1.5" /><text x="568" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17323d" text-anchor="start">SHORT-PAUSE POCKET</text><text x="568" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">N09: wait, sit, hydration</text><text x="568" y="317" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">proposed reservation only</text><g transform="translate(590 336)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(657 336)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="96" y="432" width="739" height="90" rx="4" fill="#fff0a8" stroke="#17323d" stroke-width="1.5" /><text x="116" y="463" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17323d" text-anchor="start">PUBLIC CLEARWAY | fixed direction + rapid orientation</text><path d="M150 491 H786" stroke="#17323d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g transform="translate(235 485) scale(0.9)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(405 485) scale(0.8)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="96" y="557" width="285" height="145" rx="5" fill="#edf3f2" stroke="#118c83" stroke-width="1.5" /><text x="116" y="587" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#118c83" text-anchor="start">CROSSING / ACCESSIBLE DECISION</text><text x="116" y="610" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">not a verified crossing claim</text><text x="116" y="626" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">show fixed choice: proceed only if confirmed</text><text x="116" y="642" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">or take signed accessible alternative</text><g transform="translate(270 635)"><rect x="0" y="0" width="74" height="7" fill="#ffffff"/><rect x="0" y="14" width="74" height="7" fill="#ffffff"/><rect x="0" y="28" width="74" height="7" fill="#ffffff"/><rect x="0" y="42" width="74" height="7" fill="#ffffff"/></g><path d="M374 630 C470 630 468 748 620 748 H815" stroke="#118c83" stroke-width="3" fill="none" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="513" y="733" width="202" height="24" rx="3" fill="#ffffff" stroke="#ccd8d5" stroke-width="1" /><text x="521" y="750" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">ACCESSIBLE ALTERNATIVE: TBC</text><rect x="565" y="557" width="270" height="145" rx="5" fill="#e5ece9" stroke="#709d79" stroke-width="1.5" /><text x="584" y="587" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17323d" text-anchor="start">DAILY SERVICE FRONTAGE</text><text x="584" y="610" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">N12 / F05: market-facing threshold</text><text x="584" y="626" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">event edge must not consume clearway</text><text x="584" y="642" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">human help holds the public route</text><rect x="96" y="742" width="739" height="117" rx="5" fill="#f6f1dd" stroke="#f5d45b" stroke-width="1.5" /><g transform="translate(130 773)"><circle r="9" fill="#f5d45b" stroke="#17323d" stroke-width="1.5"/><line x1="14" y1="0" x2="20" y2="0" stroke="#17323d" stroke-width="1.5"/><line x1="9.899494936611665" y1="9.899494936611664" x2="14.142135623730951" y2="14.14213562373095" stroke="#17323d" stroke-width="1.5"/><line x1="8.572527594031472e-16" y1="14" x2="1.2246467991473533e-15" y2="20" stroke="#17323d" stroke-width="1.5"/><line x1="-9.899494936611664" y1="9.899494936611665" x2="-14.14213562373095" y2="14.142135623730951" stroke="#17323d" stroke-width="1.5"/><line x1="-14" y1="1.7145055188062944e-15" x2="-20" y2="2.4492935982947065e-15" stroke="#17323d" stroke-width="1.5"/><line x1="-9.899494936611667" y1="-9.899494936611664" x2="-14.142135623730955" y2="-14.14213562373095" stroke="#17323d" stroke-width="1.5"/><line x1="-2.5717582782094417e-15" y1="-14" x2="-3.673940397442059e-15" y2="-20" stroke="#17323d" stroke-width="1.5"/><line x1="9.899494936611664" y1="-9.899494936611667" x2="14.142135623730947" y2="-14.142135623730955" stroke="#17323d" stroke-width="1.5"/></g><text x="153" y="771" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17323d" text-anchor="start">NOON STRESS TEST</text><text x="153" y="792" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">arrival crowd + short time + heat + crossing uncertainty. The physical route and F04/F05 remain</text><text x="153" y="809" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">the baseline; AI can report disruption but cannot certify access or replace human handover.</text><rect x="96" y="883" width="739" height="44" rx="4" fill="#eee8f6" stroke="#8064a8" stroke-width="1.5" /><text x="116" y="910" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8064a8" text-anchor="start">AI OFF: follow marker -&gt; F04 -&gt; fixed decision sign -&gt; confirmed alternative or F05 daily-service threshold.</text><rect x="992" y="130" width="554" height="850" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="1016" y="164" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17323d" text-anchor="start">SECTION-04: ARRIVAL DECISION BEFORE MARKET USE</text><text x="1016" y="187" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#118c83" text-anchor="start">RELATIVE PROPORTIONS ONLY | TBC AFTER FIELD SURVEY</text><line x1="1025" y1="727" x2="1514" y2="727" stroke="#17323d" stroke-width="3" /><rect x="1028" y="456" width="101" height="271" rx="0" fill="#dbe8f5" stroke="#17323d" stroke-width="1" /><text x="1078" y="488" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">ARRIVAL</text><text x="1078" y="504" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">MARKER</text><rect x="1129" y="544" width="97" height="183" rx="0" fill="#f7e5ea" stroke="#c84b70" stroke-width="1" /><text x="1177" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="middle">F04</text><text x="1177" y="592" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="middle">HUMAN</text><rect x="1226" y="565" width="82" height="162" rx="0" fill="#f7cfb7" stroke="#ed8454" stroke-width="1" /><text x="1267" y="595" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">SHORT</text><text x="1267" y="611" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">PAUSE</text><rect x="1308" y="510" width="73" height="217" rx="0" fill="#fff0a8" stroke="#17323d" stroke-width="1" /><text x="1344" y="543" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="1344" y="559" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">CLEARWAY</text><rect x="1381" y="557" width="51" height="170" rx="0" fill="#edf3f2" stroke="#118c83" stroke-width="1" /><text x="1406" y="587" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#118c83" text-anchor="middle">WAIT /</text><text x="1406" y="601" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#118c83" text-anchor="middle">DECIDE</text><rect x="1432" y="472" width="68" height="255" rx="0" fill="#e5ece9" stroke="#709d79" stroke-width="1" /><text x="1466" y="505" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">DAILY</text><text x="1466" y="521" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">FRONTAGE</text><path d="M1406 674 H1482" stroke="#118c83" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="1028" y="766" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="start">AN ACCESSIBLE FAILURE PATH IS A SPATIAL RULE, NOT AN APP SCREEN</text><text x="1028" y="784" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#5d747a" text-anchor="start">If a crossing, station-facing entry or detour is unverified, suspend it and retain the fixed public baseline.</text><rect x="1028" y="820" width="472" height="67" rx="5" fill="#f6f8f7" stroke="#118c83" stroke-width="1.5" /><text x="1040" y="843" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#118c83" text-anchor="start">JING-ZHANG RULE: RELIABLE ARRIVAL IS A CHAIN OF HANDOVERS</text><text x="1040" y="862" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">Arrival marker -&gt; pause -&gt; human decision -&gt; public clearway -&gt; daily frontage.</text><text x="1040" y="877" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">The chain remains legible when AI, service data or an event interface is unavailable.</text><line x1="54" y1="1025" x2="1546" y2="1025" stroke="#ccd8d5" stroke-width="1" /><text x="54" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">Concept spatial proof only. Proposed reservations, public access and operations require field and responsible-party verification.</text><text x="1546" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="end">JING-ZHANG NOONLINE SLA | V4-P1.5 WORKING FIGURE</text></svg>