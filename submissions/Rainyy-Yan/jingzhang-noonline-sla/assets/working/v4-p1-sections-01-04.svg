<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#f7f5ef" stroke="none" stroke-width="0" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#17323d"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#b7d8d4" stroke-width="3"/></pattern></defs><text x="54" y="59" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17323d" text-anchor="start">WORKING FIGURE D | SECTION-01-04 | PUBLIC SPACE BEFORE AI</text><text x="54" y="89" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5d747a" text-anchor="start">Four spatial rules drawn as transverse relationships. Relative widths only; all installed conditions remain to be verified.</text><rect x="1274" y="42" width="272" height="24" rx="3" fill="#e6f0ee" stroke="#ccd8d5" stroke-width="1" /><text x="1282" y="59" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">CONCEPT / NOT FIELD VERIFIED</text><text x="54" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5d747a" text-anchor="start">READ LEFT TO RIGHT: frontage / use edge / climate or safety layer / public clearway / information or access condition.</text><rect x="54" y="152" width="716" height="392" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="76" y="183" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17323d" text-anchor="start">SECTION-01 | MAIN SPINE</text><text x="76" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">A continuous public edge: service and shade reservations sit beside, never inside, the clearway.</text><line x1="76" y1="434" x2="746" y2="434" stroke="#17323d" stroke-width="2.5" /><rect x="86" y="260" width="114" height="174" rx="0" fill="#dde8e7" stroke="#17323d" stroke-width="1" /><text x="143" y="285" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">FRONTAGE</text><text x="143" y="300" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">TBC</text><rect x="200" y="308" width="128" height="126" rx="0" fill="#ed8454" stroke="#17323d" stroke-width="1" /><text x="264" y="333" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">STOP +</text><text x="264" y="348" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">HUMAN HELP</text><g transform="translate(249 395)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="328" y="290" width="86" height="144" rx="0" fill="#d8ead8" stroke="#17323d" stroke-width="1" /><text x="371" y="315" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">SHADE</text><text x="371" y="330" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">RESERV.</text><g transform="translate(371 392)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><rect x="414" y="322" width="182" height="112" rx="0" fill="#f5d45b" stroke="#17323d" stroke-width="1" /><text x="505" y="347" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">PEDESTRIAN</text><text x="505" y="362" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">CLEAR ZONE</text><g transform="translate(505 384) scale(0.65)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="596" y="289" width="80" height="145" rx="0" fill="#dbe8f5" stroke="#17323d" stroke-width="1" /><text x="636" y="314" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">FIXED</text><text x="636" y="329" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">INFO</text><g transform="translate(636 390)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><rect x="676" y="345" width="70" height="89" rx="0" fill="#e5ece9" stroke="#17323d" stroke-width="1" /><text x="711" y="370" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">ACCESS</text><text x="711" y="385" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">TBC</text><rect x="76" y="462" width="670" height="26" rx="3" fill="#edf3f2" stroke="#118c83" stroke-width="1" /><text x="86" y="480" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">AI-OFF: fixed markers and designated human-help reference remain useful without AI.</text><rect x="76" y="496" width="670" height="29" rx="3" fill="#f7e5ea" stroke="#c84b70" stroke-width="1" /><text x="86" y="515" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="start">FAILURE: if the public clearway or service condition cannot be confirmed, downgrade the claim rather than route by app.</text><rect x="830" y="152" width="716" height="392" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="852" y="183" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17323d" text-anchor="start">SECTION-02 | ZHONGZHIYUAN</text><text x="852" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">A research-test frontage where the public route survives a test stop.</text><line x1="852" y1="434" x2="1522" y2="434" stroke="#17323d" stroke-width="2.5" /><rect x="862" y="260" width="116" height="174" rx="0" fill="#dde8e7" stroke="#17323d" stroke-width="1" /><text x="920" y="285" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">R&amp;D</text><text x="920" y="300" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">FRONTAGE</text><rect x="978" y="285" width="122" height="149" rx="0" fill="#244b5a" stroke="#17323d" stroke-width="1" /><text x="1039" y="310" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">CONTROLLED</text><text x="1039" y="325" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">TEST</text><rect x="1022" y="378" width="34" height="18" rx="3" fill="#4d83bf"/><circle cx="1030" cy="401" r="4" fill="#ffffff"/><circle cx="1048" cy="401" r="4" fill="#ffffff"/><rect x="1100" y="265" width="58" height="169" rx="0" fill="url(#hatch)" stroke="#17323d" stroke-width="1" /><text x="1129" y="290" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">SAFE</text><text x="1129" y="305" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">BUFFER</text><rect x="1158" y="313" width="124" height="121" rx="0" fill="#f7cfb7" stroke="#17323d" stroke-width="1" /><text x="1220" y="338" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">F01 HUMAN</text><text x="1220" y="353" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">VIEW + STAY</text><g transform="translate(1205 395)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="1282" y="294" width="78" height="140" rx="0" fill="#d8ead8" stroke="#17323d" stroke-width="1" /><text x="1321" y="319" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">SHADE</text><text x="1321" y="334" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">RESERV.</text><g transform="translate(1321 392)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><rect x="1360" y="325" width="155" height="109" rx="0" fill="#f5d45b" stroke="#17323d" stroke-width="1" /><text x="1437.5" y="350" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="1437.5" y="365" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">CLEARWAY</text><g transform="translate(1437.5 384) scale(0.65)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="852" y="462" width="670" height="26" rx="3" fill="#edf3f2" stroke="#118c83" stroke-width="1" /><text x="862" y="480" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">AI-OFF: close the controlled test; retain public clearway, fixed route marker and F01 handover.</text><rect x="852" y="496" width="670" height="29" rx="3" fill="#f7e5ea" stroke="#c84b70" stroke-width="1" /><text x="862" y="515" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="start">FAILURE: buffer, permit or operator failure stops test display before it changes public access.</text><rect x="54" y="570" width="716" height="392" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="76" y="601" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17323d" text-anchor="start">SECTION-03 | AI ORIGIN</text><text x="76" y="622" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">A civic knowledge room where physical information, sitting and human enquiry precede optional AI.</text><line x1="76" y1="852" x2="746" y2="852" stroke="#17323d" stroke-width="2.5" /><rect x="86" y="681" width="94" height="171" rx="0" fill="#dde8e7" stroke="#17323d" stroke-width="1" /><text x="133" y="706" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="133" y="721" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">ENTRY</text><rect x="180" y="701" width="99" height="151" rx="0" fill="#4d83bf" stroke="#17323d" stroke-width="1" /><text x="229.5" y="726" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">FIXED</text><text x="229.5" y="741" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">KNOWLEDGE</text><g transform="translate(229.5 808)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#ffffff"/><path d="M0 5 V16" stroke="#ffffff" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><rect x="279" y="736" width="132" height="116" rx="0" fill="#f7cfb7" stroke="#17323d" stroke-width="1" /><text x="345" y="761" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">CIVIC</text><text x="345" y="776" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">SITTING</text><g transform="translate(330 813)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="411" y="711" width="97" height="141" rx="0" fill="#f7e5ea" stroke="#17323d" stroke-width="1" /><text x="459.5" y="736" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">HUMAN</text><text x="459.5" y="751" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">HELP</text><g transform="translate(459.5 802) scale(0.65)"><circle cx="0" cy="-10" r="4" fill="#c84b70"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#c84b70" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="508" y="749" width="62" height="103" rx="0" fill="#eee8f6" stroke="#17323d" stroke-width="1" /><text x="539" y="774" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">AI</text><text x="539" y="789" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">OPTIONAL</text><rect x="570" y="743" width="169" height="109" rx="0" fill="#f5d45b" stroke="#17323d" stroke-width="1" /><text x="654.5" y="768" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="654.5" y="783" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">CLEARWAY</text><g transform="translate(654.5 802) scale(0.65)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="76" y="880" width="670" height="26" rx="3" fill="#edf3f2" stroke="#118c83" stroke-width="1" /><text x="86" y="898" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">AI-OFF: people read, sit, ask F02 and exit by the physical route without a screen or phone.</text><rect x="76" y="914" width="670" height="29" rx="3" fill="#f7e5ea" stroke="#c84b70" stroke-width="1" /><text x="86" y="933" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="start">FAILURE: if AI or staffed service is unavailable, remove that service claim but preserve fixed knowledge and clearway.</text><rect x="830" y="570" width="716" height="392" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="852" y="601" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17323d" text-anchor="start">SECTION-04 | DAZHONGSI</text><text x="852" y="622" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">A transfer and daily-service interface that makes the crossing or accessible alternative an explicit decision.</text><line x1="852" y1="852" x2="1522" y2="852" stroke="#17323d" stroke-width="2.5" /><rect x="862" y="685" width="100" height="167" rx="0" fill="#dbe8f5" stroke="#17323d" stroke-width="1" /><text x="912" y="710" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">ARRIVAL</text><text x="912" y="725" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">MARKER</text><g transform="translate(912 808)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><rect x="962" y="710" width="90" height="142" rx="0" fill="#f7e5ea" stroke="#17323d" stroke-width="1" /><text x="1007" y="735" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">F04</text><text x="1007" y="750" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">HUMAN</text><g transform="translate(1007 802) scale(0.65)"><circle cx="0" cy="-10" r="4" fill="#c84b70"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#c84b70" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="1052" y="742" width="107" height="110" rx="0" fill="#f7cfb7" stroke="#17323d" stroke-width="1" /><text x="1105.5" y="767" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">SHORT</text><text x="1105.5" y="782" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">PAUSE</text><g transform="translate(1090.5 813)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="1159" y="716" width="134" height="136" rx="0" fill="#f5d45b" stroke="#17323d" stroke-width="1" /><text x="1226" y="741" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="1226" y="756" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">CLEARWAY</text><g transform="translate(1226 802) scale(0.65)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="1293" y="749" width="79" height="103" rx="0" fill="#edf3f2" stroke="#17323d" stroke-width="1" /><text x="1332.5" y="774" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">ACCESS.</text><text x="1332.5" y="789" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">WAIT / DECIDE</text><rect x="1372" y="697" width="143" height="155" rx="0" fill="#e5ece9" stroke="#17323d" stroke-width="1" /><text x="1443.5" y="722" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">DAILY</text><text x="1443.5" y="737" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#17323d" text-anchor="middle">FRONTAGE</text><g transform="translate(1443.5 802) scale(0.65)"><circle cx="0" cy="-10" r="4" fill="#709d79"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#709d79" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="852" y="880" width="670" height="26" rx="3" fill="#edf3f2" stroke="#118c83" stroke-width="1" /><text x="862" y="898" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">AI-OFF: fixed arrival marker and F04/F05 carry orientation; no dynamic system is required to understand the route.</text><rect x="852" y="914" width="670" height="29" rx="3" fill="#f7e5ea" stroke="#c84b70" stroke-width="1" /><text x="862" y="933" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="start">FAILURE: if a crossing, entry or accessible detour is unverified, suspend it and maintain only the confirmed public baseline.</text><line x1="54" y1="1025" x2="1546" y2="1025" stroke="#ccd8d5" stroke-width="1" /><text x="54" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">Concept spatial proof only. Proposed reservations, public access and operations require field and responsible-party verification.</text><text x="1546" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="end">JING-ZHANG NOONLINE SLA | V4-P1.5 WORKING FIGURE</text></svg>