e="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(620 486)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(700 481) scale(0.8)"><circle cx="0" cy="-10" r="4" fill="#ed8454"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><text x="120" y="489" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">proposed sitting / waiting reservation; not an existing facility</text><rect x="100" y="534" width="762" height="44" rx="0" fill="#d8ead8" stroke="#709d79" stroke-width="1.5" /><g transform="translate(205 560)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><g transform="translate(328 560)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><g transform="translate(451 560)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><g transform="translate(574 560)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><g transform="translate(697 560)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><g transform="translate(820 560)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><text x="120" y="559" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="start">PLANTING + SHADE RESERVATION | continuity must be field-verified</text><rect x="100" y="606" width="762" height="86" rx="4" fill="#fff0a8" stroke="#f5d45b" stroke-width="1.5" /><text x="120" y="638" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17323d" text-anchor="start">PUBLIC PEDESTRIAN CLEARWAY | fixed route + maintainable markers</text><path d="M155 666 H805" stroke="#17323d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g transform="translate(230 662) scale(1)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(390 662) scale(0.8)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(690 662) scale(0.9)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(290 651)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><g transform="translate(540 651)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><g transform="translate(760 651)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><rect x="100" y="724" width="762" height="74" rx="4" fill="#eef3f0" stroke="#ccd8d5" stroke-width="1.5" /><text x="120" y="752" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17323d" text-anchor="start">NOON STRESS TEST</text><g transform="translate(282 747)"><circle r="9" fill="#f5d45b" stroke="#17323d" stroke-width="1.5"/><line x1="14" y1="0" x2="20" y2="0" stroke="#17323d" stroke-width="1.5"/><line x1="9.899494936611665" y1="9.899494936611664" x2="14.142135623730951" y2="14.14213562373095" stroke="#17323d" stroke-width="1.5"/><line x1="8.572527594031472e-16" y1="14" x2="1.2246467991473533e-15" y2="20" stroke="#17323d" stroke-width="1.5"/><line x1="-9.899494936611664" y1="9.899494936611665" x2="-14.14213562373095" y2="14.142135623730951" stroke="#17323d" stroke-width="1.5"/><line x1="-14" y1="1.7145055188062944e-15" x2="-20" y2="2.4492935982947065e-15" stroke="#17323d" stroke-width="1.5"/><line x1="-9.899494936611667" y1="-9.899494936611664" x2="-14.142135623730955" y2="-14.14213562373095" stroke="#17323d" stroke-width="1.5"/><line x1="-2.5717582782094417e-15" y1="-14" x2="-3.673940397442059e-15" y2="-20" stroke="#17323d" stroke-width="1.5"/><line x1="9.899494936611664" y1="-9.899494936611667" x2="14.142135623730947" y2="-14.142135623730955" stroke="#17323d" stroke-width="1.5"/></g><text x="315" y="744" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">short walk + heat + waiting; shade and stopping are proposed reservations,</text><text x="315" y="761" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">while the buffer keeps crowd and test activity apart.</text><rect x="102" y="824" width="246" height="93" rx="5" fill="#f7e5ea" stroke="#c84b70" stroke-width="1.5" /><text x="118" y="850" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#c84b70" text-anchor="start">F01 HUMAN VERIFICATION</text><text x="118" y="870" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">public entry, permission check,</text><text x="118" y="886" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">test-stop handover</text><rect x="610" y="824" width="252" height="93" rx="5" fill="#edf3f2" stroke="#118c83" stroke-width="1.5" /><text x="626" y="850" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#118c83" text-anchor="start">AI OFF / TEST STOP</text><text x="626" y="870" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">close controlled test; preserve</text><text x="626" y="886" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">clearway + fixed markers + F01</text><rect x="112" y="710" width="210" height="24" rx="3" fill="#ffffff" stroke="#ccd8d5" stroke-width="1" /><text x="120" y="727" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="start">PUBLIC: no device gate</text><rect x="472" y="366" width="222" height="24" rx="3" fill="#ffffff" stroke="#ccd8d5" stroke-width="1" /><text x="480" y="383" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="start">VIEW ONLY: no buffer crossing</text><rect x="650" y="230" width="168" height="24" rx="3" fill="#244b5a" stroke="#ccd8d5" stroke-width="1" /><text x="658" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">CONTROLLED: staff only</text><rect x="992" y="130" width="554" height="850" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="1016" y="164" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17323d" text-anchor="start">SECTION-02: A TEST EDGE THAT CAN STOP</text><text x="1016" y="187" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#118c83" text-anchor="start">RELATIVE PROPORTIONS ONLY | TBC AFTER FIELD SURVEY</text><line x1="1025" y1="727" x2="1514" y2="727" stroke="#17323d" stroke-width="3" /><rect x="1028" y="410" width="75" height="317" rx="0" fill="#dde8e7" stroke="#17323d" stroke-width="1" /><text x="1065" y="446" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle">R&amp;D</text><text x="1065" y="464" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#17323d" text-anchor="middle">frontage</text><rect x="1110" y="474" width="112" height="253" rx="0" fill="#244b5a" stroke="#17323d" stroke-width="1" /><text x="1166" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CONTROLLED</text><text x="1166" y="527" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">TEST</text><rect x="1134" y="575" width="38" height="20" rx="3" fill="#4d83bf"/><circle cx="1143" cy="600" r="5" fill="#ffffff"/><circle cx="1163" cy="600" r="5" fill="#ffffff"/><rect x="1222" y="450" width="39" height="277" rx="0" fill="url(#hatch)" stroke="#118c83" stroke-width="1" /><text x="1242" y="433" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="middle">BUFFER</text><rect x="1262" y="540" width="84" height="187" rx="0" fill="#f7cfb7" stroke="#ed8454" stroke-width="1" /><text x="1304" y="574" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">VIEW +</text><text x="1304" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">STAY</text><rect x="1346" y="500" width="48" height="227" rx="0" fill="#d8ead8" stroke="#709d79" stroke-width="1" /><g transform="translate(1370 625)"><circle cx="0" cy="-12" r="11" fill="#709d79"/><path d="M0 -2 V16" stroke="#17323d" stroke-width="2"/></g><rect x="1394" y="552" width="106" height="175" rx="0" fill="#fff0a8" stroke="#17323d" stroke-width="1" /><text x="1447" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="1447" y="606" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">CLEARWAY</text><text x="1028" y="766" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="start">PUBLIC / SEMI-PUBLIC / CONTROLLED ARE SPATIALLY SEPARATE</text><text x="1028" y="784" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#5d747a" text-anchor="start">The public route does not cross the buffer or depend on operator permission.</text><rect x="1028" y="820" width="472" height="67" rx="5" fill="#f6f8f7" stroke="#c84b70" stroke-width="1.5" /><text x="1040" y="843" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#c84b70" text-anchor="start">JING-ZHANG RULE: MAINTAINABLE HANDOVER</text><text x="1040" y="862" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">Fixed markers make the route legible; F01 makes responsibility visible when</text><text x="1040" y="877" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">AI, telemetry, access permission or test operations fail.</text><line x1="54" y1="1025" x2="1546" y2="1025" stroke="#ccd8d5" stroke-width="1" /><text x="54" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">Concept spatial proof only. Proposed reservations, public access and operations require field and responsible-party verification.</text><text x="1546" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="end">JING-ZHANG NOONLINE SLA | V4-P1.5 WORKING FIGURE</text></svg>