<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#f7f5ef" stroke="none" stroke-width="0" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#17323d"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#b7d8d4" stroke-width="3"/></pattern></defs><text x="54" y="59" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17323d" text-anchor="start">WORKING FIGURE B | AI ORIGIN CIVIC KNOWLEDGE ROOM</text><text x="54" y="89" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#5d747a" text-anchor="start">A public knowledge room where people can read, sit, ask and leave without a device or an AI account.</text><rect x="1274" y="42" width="272" height="24" rx="3" fill="#e6f0ee" stroke="#ccd8d5" stroke-width="1" /><text x="1282" y="59" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start">CONCEPT / NOT FIELD VERIFIED</text><rect x="54" y="130" width="900" height="850" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="78" y="164" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17323d" text-anchor="start">CONCEPT CIVIC PLAN</text><text x="78" y="187" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#118c83" text-anchor="start">SECTION-03 | PUBLIC ENTRY / PHYSICAL KNOWLEDGE / CIVIC ROOM / HUMAN HELP / OPTIONAL AI</text><rect x="96" y="235" width="165" height="137" rx="5" fill="#fff0a8" stroke="#f5d45b" stroke-width="1.5" /><text x="116" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17323d" text-anchor="start">PUBLIC ENTRY</text><text x="116" y="289" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">N08 proposed threshold</text><text x="116" y="306" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">fixed bilingual marker</text><text x="116" y="323" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">no device check-in</text><g transform="translate(222 333)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><g transform="translate(148 337) scale(0.9)"><circle cx="0" cy="-10" r="4" fill="#17323d"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#17323d" stroke-width="3" stroke-linecap="round" fill="none"/></g><path d="M261 303 H830" stroke="#17323d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="276" y="262" width="500" height="81" rx="4" fill="#dbe8f5" stroke="#4d83bf" stroke-width="1.5" /><text x="294" y="291" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">PHYSICAL KNOWLEDGE LINE</text><text x="294" y="314" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">repairable markers: route record + Jing-Zhang continuity + public service directions</text><g transform="translate(340 356)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><text x="340" y="383" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#4d83bf" text-anchor="middle">M1</text><g transform="translate(470 356)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><text x="470" y="383" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#4d83bf" text-anchor="middle">M2</text><g transform="translate(600 356)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><text x="600" y="383" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#4d83bf" text-anchor="middle">M3</text><g transform="translate(730 356)"><rect x="-7" y="-20" width="14" height="25" rx="2" fill="#4d83bf"/><path d="M0 5 V16" stroke="#4d83bf" stroke-width="3"/><circle cx="0" cy="-13" r="2.5" fill="#ffffff"/></g><text x="730" y="383" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#4d83bf" text-anchor="middle">M4</text><rect x="283" y="420" width="325" height="222" rx="6" fill="#f7cfb7" stroke="#ed8454" stroke-width="1.5" /><text x="306" y="452" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="start">CIVIC SITTING / DISCUSSION ROOM</text><text x="306" y="475" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">N05: pause, wait, meet, discuss</text><text x="306" y="492" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">seating is a proposed reservation</text><circle cx="391" cy="548" r="32" fill="#ffffff" stroke="#ed8454" stroke-width="3"/><circle cx="514" cy="548" r="32" fill="#ffffff" stroke="#ed8454" stroke-width="3"/><g transform="translate(350 591)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><g transform="translate(466 591)"><path d="M0 0 H30 M4 0 V10 M26 0 V10 M0 7 H30" stroke="#ed8454" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="638" y="414" width="202" height="102" rx="5" fill="#f7e5ea" stroke="#c84b70" stroke-width="1.5" /><text x="658" y="444" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#c84b70" text-anchor="start">F02 HUMAN ENQUIRY</text><text x="658" y="466" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">ask a person; route +</text><text x="658" y="483" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">access explanation</text><g transform="translate(798 477) scale(0.8)"><circle cx="0" cy="-10" r="4" fill="#c84b70"/><path d="M0 -5 L0 8 M0 0 L-6 5 M0 0 L6 5 M0 8 L-5 16 M0 8 L5 16" stroke="#c84b70" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="638" y="548" width="202" height="94" rx="5" fill="#eee8f6" stroke="#8064a8" stroke-width="1.5" /><text x="658" y="578" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#8064a8" text-anchor="start">OPTIONAL AI</text><text x="658" y="600" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">translation / feedback</text><text x="658" y="617" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">never blocks entry or exit</text><path d="M739 516 V548" stroke="#8064a8" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="96" y="698" width="744" height="76" rx="5" fill="#edf3f2" stroke="#118c83" stroke-width="1.5" /><text x="116" y="728" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#118c83" text-anchor="start">AI-OFF USE PATH</text><text x="282" y="720" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">enter -&gt; read physical markers -&gt; sit / discuss -&gt; ask F02 -&gt; leave or connect laterally</text><text x="282" y="737" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">F03 retains a human explanation at the heritage/crossing decision; no unverified crossing is asserted.</text><rect x="96" y="807" width="744" height="76" rx="5" fill="#f6f1dd" stroke="#f5d45b" stroke-width="1.5" /><g transform="translate(128 834)"><circle r="9" fill="#f5d45b" stroke="#17323d" stroke-width="1.5"/><line x1="14" y1="0" x2="20" y2="0" stroke="#17323d" stroke-width="1.5"/><line x1="9.899494936611665" y1="9.899494936611664" x2="14.142135623730951" y2="14.14213562373095" stroke="#17323d" stroke-width="1.5"/><line x1="8.572527594031472e-16" y1="14" x2="1.2246467991473533e-15" y2="20" stroke="#17323d" stroke-width="1.5"/><line x1="-9.899494936611664" y1="9.899494936611665" x2="-14.14213562373095" y2="14.142135623730951" stroke="#17323d" stroke-width="1.5"/><line x1="-14" y1="1.7145055188062944e-15" x2="-20" y2="2.4492935982947065e-15" stroke="#17323d" stroke-width="1.5"/><line x1="-9.899494936611667" y1="-9.899494936611664" x2="-14.142135623730955" y2="-14.14213562373095" stroke="#17323d" stroke-width="1.5"/><line x1="-2.5717582782094417e-15" y1="-14" x2="-3.673940397442059e-15" y2="-20" stroke="#17323d" stroke-width="1.5"/><line x1="9.899494936611664" y1="-9.899494936611667" x2="14.142135623730947" y2="-14.142135623730955" stroke="#17323d" stroke-width="1.5"/></g><text x="150" y="831" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="start">NOON STRESS: rapid orientation + short wait + heat.</text><text x="150" y="852" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">Shade, water and seating remain design reservations until field-verified; the knowledge line remains readable without a screen.</text><rect x="99" y="391" width="212" height="24" rx="3" fill="#ffffff" stroke="#ccd8d5" stroke-width="1" /><text x="107" y="408" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="start">PUBLIC: enter and leave freely</text><rect x="638" y="660" width="242" height="24" rx="3" fill="#ffffff" stroke="#ccd8d5" stroke-width="1" /><text x="646" y="677" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="start">F03: decision / crossing handover</text><path d="M738 642 V681 H676" stroke="#c84b70" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="992" y="130" width="554" height="850" rx="8" fill="#ffffff" stroke="#ccd8d5" stroke-width="1.5" /><text x="1016" y="164" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17323d" text-anchor="start">SECTION-03: KNOWLEDGE WITHOUT A DEVICE GATE</text><text x="1016" y="187" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#118c83" text-anchor="start">RELATIVE PROPORTIONS ONLY | TBC AFTER FIELD SURVEY</text><line x1="1025" y1="727" x2="1514" y2="727" stroke="#17323d" stroke-width="3" /><rect x="1028" y="430" width="94" height="297" rx="0" fill="#dde8e7" stroke="#17323d" stroke-width="1" /><text x="1075" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="1075" y="481" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">FRONTAGE</text><rect x="1122" y="468" width="73" height="259" rx="0" fill="#dbe8f5" stroke="#4d83bf" stroke-width="1" /><text x="1158" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">FIXED</text><text x="1158" y="516" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">KNOWLEDGE</text><rect x="1195" y="536" width="117" height="191" rx="0" fill="#f7cfb7" stroke="#ed8454" stroke-width="1" /><text x="1253" y="570" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">SIT +</text><text x="1253" y="586" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">DISCUSS</text><rect x="1312" y="492" width="76" height="235" rx="0" fill="#f7e5ea" stroke="#c84b70" stroke-width="1" /><text x="1350" y="522" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="middle">HUMAN</text><text x="1350" y="538" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#c84b70" text-anchor="middle">HELP</text><rect x="1388" y="568" width="47" height="159" rx="0" fill="#eee8f6" stroke="#8064a8" stroke-width="1" /><text x="1411" y="599" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#8064a8" text-anchor="middle">AI</text><text x="1411" y="615" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#8064a8" text-anchor="middle">OPT.</text><rect x="1435" y="536" width="65" height="191" rx="0" fill="#fff0a8" stroke="#17323d" stroke-width="1" /><text x="1467" y="568" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">PUBLIC</text><text x="1467" y="584" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#17323d" text-anchor="middle">CLEARWAY</text><path d="M1460 674 H1110" stroke="#118c83" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="1028" y="766" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="start">AI IS A SIDE-BY-SIDE SERVICE, NOT THE THRESHOLD</text><text x="1028" y="784" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#5d747a" text-anchor="start">A person can bypass AI, use fixed information, ask F02 and exit through the same clearway.</text><rect x="1028" y="820" width="472" height="67" rx="5" fill="#f6f8f7" stroke="#4d83bf" stroke-width="1.5" /><text x="1040" y="843" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4d83bf" text-anchor="start">JING-ZHANG RULE: LEGIBLE MARKER-TO-MARKER HANDOVER</text><text x="1040" y="862" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">The knowledge line carries route, maintenance and public-service information as a</text><text x="1040" y="877" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#17323d" text-anchor="start">physical record; F02/F03 make a person accountable for the unclear moment.</text><line x1="54" y1="1025" x2="1546" y2="1025" stroke="#ccd8d5" stroke-width="1" /><text x="54" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#5d747a" text-anchor="start">Concept spatial proof only. Proposed reservations, public access and operations require field and responsible-party verification.</text><text x="1546" y="1053" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="end">JING-ZHANG NOONLINE SLA | V4-P1.5 WORKING FIGURE</text></svg>