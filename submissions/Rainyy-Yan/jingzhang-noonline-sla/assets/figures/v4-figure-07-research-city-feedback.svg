ext-anchor="middle" >解释 / 提问 / 公共反馈</text><path d="M 636 672.67 L 636 737.23" stroke="#d89a16" stroke-width="4" marker-end="url(#arrowInk)"/><rect x="514" y="784" width="244" height="84" rx="6" fill="#ffffff" stroke="#d89a16" stroke-width="2" /><text x="636" y="817" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="middle" >大钟寺</text><text x="636" y="843" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="middle" >使用 / 采用 / 日常观察</text><path d="M 543.12 614.19 L 491.28 646.11" stroke="#3c77b8" stroke-width="4" marker-end="url(#arrowInk)"/><rect x="298" y="648" width="244" height="84" rx="6" fill="#ffffff" stroke="#3c77b8" stroke-width="2" /><text x="420" y="681" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="middle" >治理</text><text x="420" y="707" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="middle" >维护 / 纠错 / 公开回应</text><path d="M 543.12 492.07 L 491.28 455.83" stroke="#6c946f" stroke-width="4" marker-end="url(#arrowInk)"/><rect x="298" y="364" width="244" height="84" rx="6" fill="#ffffff" stroke="#6c946f" stroke-width="2" /><text x="420" y="397" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="middle" >众智园</text><text x="420" y="423" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="middle" >回到迭代</text>
