  </defs> <rect x="0" y="0" width="1800" height="1125" rx="0" fill="#f7f5ef" stroke="none" stroke-width="1" /> <rect x="0" y="0" width="1800" height="122" rx="0" fill="#17323d" stroke="none" stroke-width="1" />
  <text x="60" y="59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" >FIGURE 07  Research → City → Feedback → Iterate</text>
  <text x="60" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#c9dadb" text-anchor="start" >从研发、验证到公共反馈的城市闭环</text>
  <rect x="1480" y="39" width="245" height="27" rx="4" fill="#244f58" stroke="#9cdddd" stroke-width="1" /><text x="1490" y="58" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9cdddd" text-anchor="start" >V4 / CONCEPT</text>
  <text x="60" y="110" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9cdddd" text-anchor="start" >每一步都有空间、人工责任与失败触发，不以“展示”终止创新。</text>
  <rect x="60" y="154" width="1680" height="850" rx="6" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.4" />
    <text x="90" y="200" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#17323d" text-anchor="start" >把 AI 创新链嵌入可被公众质询、使用与纠错的城市空间。</text>
    <text x="90" y="229" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#587078" text-anchor="start" >三区不是同类园区：它们是同一循环中不同的空间责任。</text>
