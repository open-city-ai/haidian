    <rect x="1380" y="342" width="270" height="116" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1380" y="342" width="7" height="116" rx="4" fill="#7b5b8c" stroke="#7b5b8c" stroke-width="0" /><text x="1402" y="372" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >WP-03</text><text x="1402" y="398" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >AI 原点知识客厅</text><text x="1402" y="417" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >不使用 AI 仍可进入、阅读、提问</text><rect x="1522" y="359" width="110" height="27" rx="4" fill="#dcefeb" stroke="#7b5b8c" stroke-width="1" /><text x="1532" y="378" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#7b5b8c" text-anchor="start" >试点</text>
    <rect x="1075" y="482" width="280" height="116" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1075" y="482" width="7" height="116" rx="4" fill="#d85a43" stroke="#d85a43" stroke-width="0" /><text x="1097" y="512" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >WP-04</text><text x="1097" y="538" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >大钟寺到达界面</text><text x="1097" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >先测真实过街与无障碍再深化</text><rect x="1227" y="499" width="110" height="27" rx="4" fill="#fae3dc" stroke="#d85a43" stroke-width="1" /><text x="1237" y="518" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#d85a43" text-anchor="start" >核验</text>
    <rect x="1380" y="482" width="270" height="116" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1380" y="482" width="7" height="116" rx="4" fill="#3c77b8" stroke="#3c77b8" stroke-width="0" /><text x="1402" y="512" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >WP-06</text><text x="1402" y="538" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >现场核验与重算</text><text x="1402" y="557" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >拒绝自动升级 SLA</text><rect x="1522" y="499" width="110" height="27" rx="4" fill="#dcefeb" stroke="#3c77b8" stroke-width="1" /><text x="1532" y="518" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#3c77b8" text-anchor="start" >治理</text>
    <rect x="1075" y="630" width="575" height="102" rx="4" fill="#f9ecee" stroke="#b6455a" stroke-width="1" />
    <text x="1100" y="662" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#b6455a" text-anchor="start" >不是普通 AI 科技园，因为公共反馈可以改变下一轮测试。</text>
    <text x="1100" y="691" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >研究不绕过公众；使用不绕过人工责任；算法不绕过证据门槛。</text>
    <rect x="90" y="902" width="1560" height="42" rx="4" fill="#fbefd0" stroke="#d89a16" stroke-width="1" />
    <text x="110" y="930" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#17323d" text-anchor="start" >京张转译：连接不是图标，而是把方向、维护、责任和可恢复性做成公共空间规则。</text>
    <rect x="1270" y="792" width="410" height="182" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.2" /><text x="1288" y="819" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="start" >视觉证据语法</text><line x1="1290" y1="843" x2="1312" y2="843" stroke="#17323d" stroke-width="3"  /><text x="1325" y="847" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >实线｜公开支持的背景</text><line x1="1290" y1="867" x2="1312" y2="867" stroke="#d85a43" stroke-width="3" stroke-dasharray="7 5" /><text x="1325" y="871" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >珊瑚虚线｜概念设计叠加</text><line x1="1290" y1="891" x2="1312" y2="891" stroke="#587078" stroke-width="3" stroke-dasharray="7 5" /><text x="1325" y="895" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >灰虚线｜暂定范围或关系</text><circle cx="1299" cy="915" r="5" fill="#d89a16"/><text x="1325" y="919" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >黄点｜待现场核验</text><rect x="1290" y="932" width="19" height="12" rx="0" fill="url(#hatch)" stroke="#7b5b8c" stroke-width="1" /><text x="1325" y="943" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >紫色斜线｜需专业研究</text>
  <line x1="60" y1="1072" x2="1740" y2="1072" stroke="#c8d2d1" stroke-width="1"  />
  <text x="60" y="1100" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#587078" text-anchor="start" >所有工作包均为可逆试点建议，具体责任、许可、位置与维护安排需按 Site Evidence Ladder 核验。</text>
