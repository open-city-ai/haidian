  <text x="60" y="59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" >FIGURE 06  AI-ON / AI-OFF | URBAN RESILIENCE</text>
  <text x="60" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#c9dadb" text-anchor="start" >Physical space → human responsibility → digital service → AI assistance</text>
  <rect x="1480" y="39" width="245" height="27" rx="4" fill="#244f58" stroke="#9cdddd" stroke-width="1" /><text x="1490" y="58" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9cdddd" text-anchor="start" >V4 / CONCEPT</text>
  <text x="60" y="110" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9cdddd" text-anchor="start" >When AI withdraws, fixed space and human responsibility retain minimum public service</text>
  <rect x="60" y="154" width="1680" height="850" rx="6" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.4" />
    <text x="90" y="200" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17323d" text-anchor="start" >AI ENHANCES THE CITY. THE CITY MUST STILL WORK WHEN AI DOES NOT.</text>
    <text x="90" y="229" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#587078" text-anchor="start" >From AI on to off, service degrades through evidence and responsibility rather than pretending to remain complete.</text>
    <rect x="90" y="260" width="1120" height="510" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.3" /><rect x="90" y="260" width="1120" height="62" rx="5" fill="#17323d" stroke="#17323d" stroke-width="0" /><text x="110" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >LAYER</text><text x="330" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >SPATIALLY ANCHORED IN THE CITY</text><text x="820" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >AI ON</text><text x="978" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >AI DEGRADED</text><text x="1132" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >AI OFF</text><rect x="90" y="322" width="1120" height="112" rx="0" fill="#ffffff" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="322" width="10" height="112" rx="0" fill="#dcefeb" stroke="#dcefeb" stroke-width="0" /><text x="120" y="364" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >PHYSICAL</text><text x="330" y="359" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >route, clearway, stay reservation, fixed signs</text><rect x="752" y="352" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="381" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >retain</text><rect x="912" y="352" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="381" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >retain</text><rect x="1067" y="352" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="381" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >retain</text><rect x="90" y="434" width="1120" height="112" rx="0" fill="#fbfcfa" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="434" width="10" height="112" rx="0" fill="#fae3dc" stroke="#fae3dc" stroke-width="0" /><text x="120" y="476" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >HUMAN</text><text x="330" y="471" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >F01–F05, verification and handover</text><rect x="752" y="464" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >retain</text><rect x="912" y="464" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >priority</text><rect x="1067" y="464" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >core</text><rect x="90" y="546" width="1120" height="112" rx="0" fill="#ffffff" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="546" width="10" height="112" rx="0" fill="#dce9f6" stroke="#dce9f6" stroke-width="0" /><text x="120" y="588" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >DIGITAL</text><text x="330" y="583" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >ordinary information and updates</text><rect x="752" y="576" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >retain</text><rect x="912" y="576" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >partly unavailable</text><rect x="1067" y="576" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >not prerequisite</text><rect x="90" y="658" width="1120" height="112" rx="0" fill="#fbfcfa" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="658" width="10" height="112" rx="0" fill="#eadfee" stroke="#eadfee" stroke-width="0" /><text x="120" y="700" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >AI</text><text x="330" y="695" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >prediction, explanation, prompts, maintenance assist</text><rect x="752" y="688" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="717" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >available</text><rect x="912" y="688" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="717" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >disable unreliable item</text><rect x="1067" y="688" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="717" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >off</text>
    <rect x="1260" y="260" width="430" height="510" rx="5" fill="#f4f7f5" stroke="#c8d2d1" stroke-width="1.2" />
    <text x="1288" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#17323d" text-anchor="start" >AI-OFF IN THREE SPATIAL PROTOTYPES</text>
    <rect x="1285" y="332" width="380" height="112" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1285" y="332" width="7" height="112" rx="4" fill="#118c83" stroke="#118c83" stroke-width="0" /><text x="1307" y="362" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >ZHONGZHIYUAN</text><text x="1307" y="388" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >test stops; public clearway, fixed wayfinding and F01 handover remain.</text><rect x="1537" y="349" width="110" height="27" rx="4" fill="#dcefeb" stroke="#118c83" stroke-width="1" /><text x="1547" y="368" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start" >TEST CAN STOP</text>
    <rect x="1285" y="462" width="380" height="112" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1285" y="462" width="7" height="112" rx="4" fill="#7b5b8c" stroke="#7b5b8c" stroke-width="0" /><text x="1307" y="492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >AI ORIGIN</text><text x="1307" y="518" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >physical knowledge line, staying and human enquiry keep phone-free use complete.</text><rect x="1537" y="479" width="110" height="27" rx="4" fill="#dcefeb" stroke="#7b5b8c" stroke-width="1" /><text x="1547" y="498" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#7b5b8c" text-anchor="start" >OPT OUT</text>
    <rect x="1285" y="592" width="380" height="112" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1285" y="592" width="7" height="112" rx="4" fill="#d85a43" stroke="#d85a43" stroke-width="0" /><text x="1307" y="622" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >DAZHONGSI</text><text x="1307" y="648" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >unverified external conditions lead to reroute / downgrade / suspend.</text><rect x="1537" y="609" width="110" height="27" rx="4" fill="#fae3dc" stroke="#d85a43" stroke-width="1" /><text x="1547" y="628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#d85a43" text-anchor="start" >NO FALSE CONTINUITY</text>
    <rect x="90" y="824" width="1600" height="104" rx="4" fill="#edf6f4" stroke="#118c83" stroke-width="1" />
    <text x="116" y="858" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#118c83" text-anchor="start" >AI_OFF_TEST = PASS_WITH_PROVISIONAL_PHYSICAL_NETWORK</text>
    <text x="116" y="887" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >PASS means the concept network retains fixed signs, physical-route logic, stay reservations, public-entry logic and human-service roles when AI is off; it does not confirm those conditions exist or operate today.</text>
