  <text x="60" y="1100" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#587078" text-anchor="start" >The AI-OFF result is a pass for the concept physical network, still limited by field verification of facilities, entry, crossings and duty periods.</text>
