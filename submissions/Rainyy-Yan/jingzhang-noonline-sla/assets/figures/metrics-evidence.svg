  <text x="60" y="110" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9cdddd" text-anchor="start" >从概念几何、服务网络到人工现场核验的可追溯边界</text>
  <rect x="60" y="154" width="1680" height="850" rx="6" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.4" /><text x="90" y="200" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#17323d" text-anchor="start" >指标用于解释方案，不用于掩盖证据缺口。</text><circle cx="210" cy="330" r="72" fill="#118c83"/><text x="210" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle" >11</text><text x="210" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >概念路线段</text><circle cx="500" cy="330" r="72" fill="#17323d"/><text x="500" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle" >12</text><text x="500" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >主服务节点</text><circle cx="790" cy="330" r="72" fill="#d89a16"/><text x="790" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle" >8</text><text x="790" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >次级支持点</text><circle cx="1080" cy="330" r="72" fill="#d85a43"/><text x="1080" y="350" font-family="Arial, Microsoft YaHei, sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="1080" y="430" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >人工兜底点</text><rect x="1350" y="252" width="270" height="178" rx="5" fill="#f4f7f5" stroke="#c8d2d1" stroke-width="1" /><text x="1380" y="291" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#17323d" text-anchor="start" >SLA 证据上限</text><text x="1380" y="326" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#118c83" text-anchor="start" >Target SLA = A</text><text x="1380" y="356" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#d85a43" text-anchor="start" >Verified SLA = B</text><text x="1380" y="390" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >缺少现场核验，不能越级</text><rect x="120" y="510" width="760" height="308" rx="5" fill="#f4f7f5" stroke="#c8d2d1" stroke-width="1.2" /><text x="150" y="548" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#17323d" text-anchor="start" >从设计目标到现实验证的门槛</text><text x="150" y="588" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >遮阴连续性｜连续暴晒距离｜饮水与座椅状态｜公共入口开放｜</text><text x="150" y="618" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >关键过街｜夏季实际绕行｜人工服务责任与时段</text><text x="150" y="648" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >任一关键证据缺失：维持 B / C / UNKNOWN，而非自动提升。</text><rect x="150" y="716" width="680" height="62" rx="4" fill="#fae3dc" stroke="#d85a43" stroke-width="1" /><text x="490" y="751" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#d85a43" text-anchor="middle" >AI_OFF_TEST = PASS_WITH_PROVISIONAL_PHYSICAL_NETWORK</text><rect x="930" y="510" width="690" height="308" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.2" /><text x="960" y="548" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#17323d" text-anchor="start" >现场核验工作流</text><line x1="990" y1="600" x2="1550" y2="600" stroke="#17323d" stroke-width="2"  marker-end="url(#arrowInk)"/><circle cx="1010" cy="600" r="16" fill="#fbefd0" stroke="#d89a16" stroke-width="2"/><text x="1010" y="606" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >1</text><text x="1010" y="650" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#587078" text-anchor="middle" >位置</text><circle cx="1115" cy="600" r="16" fill="#fbefd0" stroke="#d89a16" stroke-width="2"/><text x="1115" y="606" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >2</text><text x="1115" y="650" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#587078" text-anchor="middle" >遮阴</text><circle cx="1220" cy="600" r="16" fill="#fbefd0" stroke="#d89a16" stroke-width="2"/><text x="1220" y="606" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >3</text><text x="1220" y="650" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#587078" text-anchor="middle" >入口</text><circle cx="1325" cy="600" r="16" fill="#fbefd0" stroke="#d89a16" stroke-width="2"/><text x="1325" y="606" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >4</text><text x="1325" y="650" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#587078" text-anchor="middle" >过街</text><circle cx="1430" cy="600" r="16" fill="#fbefd0" stroke="#d89a16" stroke-width="2"/><text x="1430" y="606" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >5</text><text x="1430" y="650" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#587078" text-anchor="middle" >设施</text><circle cx="1535" cy="600" r="16" fill="#fbefd0" stroke="#d89a16" stroke-width="2"/><text x="1535" y="606" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >6</text><text x="1535" y="650" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#587078" text-anchor="middle" >责任</text><text x="960" y="708" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#587078" text-anchor="start" >只有授权的人类核验记录可以改变 ledger；AI、模型或效果图不能把 unknown 变为 verified。</text><rect x="960" y="760" width="600" height="28" rx="3" fill="#edf6f4" stroke="#118c83" stroke-width="1" /><text x="980" y="780" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#118c83" text-anchor="start" >可审计，但不越过证据上限。</text><rect x="1210" y="870" width="410" height="182" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.2" /><text x="1228" y="897" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="start" >视觉证据语法</text><line x1="1230" y1="921" x2="1252" y2="921" stroke="#17323d" stroke-width="3"  /><text x="1265" y="925" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >实线｜公开支持的背景</text><line x1="1230" y1="945" x2="1252" y2="945" stroke="#d85a43" stroke-width="3" stroke-dasharray="7 5" /><text x="1265" y="949" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >珊瑚虚线｜概念设计叠加</text><line x1="1230" y1="969" x2="1252" y2="969" stroke="#587078" stroke-width="3" stroke-dasharray="7 5" /><text x="1265" y="973" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >灰虚线｜暂定范围或关系</text><circle cx="1239" cy="993" r="5" fill="#d89a16"/><text x="1265" y="997" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >黄点｜待现场核验</text><rect x="1230" y="1010" width="19" height="12" rx="0" fill="url(#hatch)" stroke="#7b5b8c" stroke-width="1" /><text x="1265" y="1021" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >紫色斜线｜需专业研究</text>
  <line x1="60" y1="1072" x2="1740" y2="1072" stroke="#c8d2d1" stroke-width="1"  />
  <text x="60" y="1100" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#587078" text-anchor="start" >全部计数来自提交的概念 GeoJSON；不是现状设施存量。Engine 不会因数据缺失将 UNKNOWN / provisional 自动判定为满足。</text>
