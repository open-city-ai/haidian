  <text x="60" y="59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" >FIGURE 06  AI-ON / AI-OFF｜城市韧性</text>
  <text x="60" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#c9dadb" text-anchor="start" >物理空间 → 人工责任 → 数字服务 → AI 辅助</text>
  <rect x="1480" y="39" width="245" height="27" rx="4" fill="#244f58" stroke="#9cdddd" stroke-width="1" /><text x="1490" y="58" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9cdddd" text-anchor="start" >V4 / CONCEPT</text>
  <text x="60" y="110" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9cdddd" text-anchor="start" >AI 退场时，城市通过固定空间与人工责任保持最小公共服务</text>
  <rect x="60" y="154" width="1680" height="850" rx="6" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.4" />
    <text x="90" y="200" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#17323d" text-anchor="start" >AI 只能增强城市，不能成为城市使用的前置条件。</text>
    <text x="90" y="229" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#587078" text-anchor="start" >从 AI 正常到关闭，服务按证据与责任逐层退化，不伪装为完整运行。</text>
    <rect x="90" y="260" width="1120" height="510" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.3" /><rect x="90" y="260" width="1120" height="62" rx="5" fill="#17323d" stroke="#17323d" stroke-width="0" /><text x="110" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >层</text><text x="330" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >城市中的空间绑定</text><text x="820" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >AI 正常</text><text x="978" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >AI 降级</text><text x="1132" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >AI 关闭</text><rect x="90" y="322" width="1120" height="112" rx="0" fill="#ffffff" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="322" width="10" height="112" rx="0" fill="#dcefeb" stroke="#dcefeb" stroke-width="0" /><text x="120" y="364" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >物理空间</text><text x="330" y="359" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >路线、清晰带、停留预留、固定标识</text><rect x="752" y="352" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="381" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >保持</text><rect x="912" y="352" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="381" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >保持</text><rect x="1067" y="352" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="381" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >保持</text><rect x="90" y="434" width="1120" height="112" rx="0" fill="#fbfcfa" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="434" width="10" height="112" rx="0" fill="#fae3dc" stroke="#fae3dc" stroke-width="0" /><text x="120" y="476" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >人工责任</text><text x="330" y="471" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >F01–F05、核验与交接</text><rect x="752" y="464" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >保持</text><rect x="912" y="464" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >优先</text><rect x="1067" y="464" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="493" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >核心</text><rect x="90" y="546" width="1120" height="112" rx="0" fill="#ffffff" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="546" width="10" height="112" rx="0" fill="#dce9f6" stroke="#dce9f6" stroke-width="0" /><text x="120" y="588" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >数字服务</text><text x="330" y="583" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >普通信息与更新</text><rect x="752" y="576" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >保持</text><rect x="912" y="576" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >局部不可用</text><rect x="1067" y="576" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="605" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >不作为前置条件</text><rect x="90" y="658" width="1120" height="112" rx="0" fill="#fbfcfa" stroke="#c8d2d1" stroke-width="0.6" /><rect x="90" y="658" width="10" height="112" rx="0" fill="#eadfee" stroke="#eadfee" stroke-width="0" /><text x="120" y="700" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >AI 辅助</text><text x="330" y="695" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >预测、解释、提示、维护辅助</text><rect x="752" y="688" width="136" height="45" rx="3" fill="#dcefeb" stroke="#d85a43" stroke-width="1" /><text x="820" y="717" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >可用</text><rect x="912" y="688" width="131" height="45" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="977.5" y="717" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >停用不可靠项</text><rect x="1067" y="688" width="131" height="45" rx="3" fill="#fae3dc" stroke="#118c83" stroke-width="1" /><text x="1132.5" y="717" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >关闭</text>
    <rect x="1260" y="260" width="430" height="510" rx="5" fill="#f4f7f5" stroke="#c8d2d1" stroke-width="1.2" />
    <text x="1288" y="298" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#17323d" text-anchor="start" >三区中的 AI-OFF 落点</text>
    <rect x="1285" y="332" width="380" height="112" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1285" y="332" width="7" height="112" rx="4" fill="#118c83" stroke="#118c83" stroke-width="0" /><text x="1307" y="362" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >众智园</text><text x="1307" y="388" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >测试停，公共清晰带、固定导向、F01 交接保留。</text><rect x="1537" y="349" width="110" height="27" rx="4" fill="#dcefeb" stroke="#118c83" stroke-width="1" /><text x="1547" y="368" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#118c83" text-anchor="start" >测试可停</text>
    <rect x="1285" y="462" width="380" height="112" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1285" y="462" width="7" height="112" rx="4" fill="#7b5b8c" stroke="#7b5b8c" stroke-width="0" /><text x="1307" y="492" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >AI 原点</text><text x="1307" y="518" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >实体知识线、停留与人工提问使无手机使用完整。</text><rect x="1537" y="479" width="110" height="27" rx="4" fill="#dcefeb" stroke="#7b5b8c" stroke-width="1" /><text x="1547" y="498" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#7b5b8c" text-anchor="start" >可退出 AI</text>
    <rect x="1285" y="592" width="380" height="112" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="1285" y="592" width="7" height="112" rx="4" fill="#d85a43" stroke="#d85a43" stroke-width="0" /><text x="1307" y="622" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >大钟寺</text><text x="1307" y="648" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >未核验站外条件时，导向到 reroute / downgrade / suspend。</text><rect x="1537" y="609" width="110" height="27" rx="4" fill="#fae3dc" stroke="#d85a43" stroke-width="1" /><text x="1547" y="628" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#d85a43" text-anchor="start" >不假装连通</text>
    <rect x="90" y="824" width="1600" height="104" rx="4" fill="#edf6f4" stroke="#118c83" stroke-width="1" />
    <text x="116" y="858" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#118c83" text-anchor="start" >AI_OFF_TEST = PASS_WITH_PROVISIONAL_PHYSICAL_NETWORK</text>
    <text x="116" y="887" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >通过表示概念网络在 AI 关闭时仍保留固定标识、实体路线、停留预留、公共入口逻辑与人工服务角色；不表示这些实体条件已经现场确认或现实运营。</text>
    <rect x="1280" y="824" width="410" height="182" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.2" /><text x="1298" y="851" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="start" >视觉证据语法</text><line x1="1300" y1="875" x2="1322" y2="875" stroke="#17323d" stroke-width="3"  /><text x="1335" y="879" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >实线｜公开支持的背景</text><line x1="1300" y1="899" x2="1322" y2="899" stroke="#d85a43" stroke-width="3" stroke-dasharray="7 5" /><text x="1335" y="903" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >珊瑚虚线｜概念设计叠加</text><line x1="1300" y1="923" x2="1322" y2="923" stroke="#587078" stroke-width="3" stroke-dasharray="7 5" /><text x="1335" y="927" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >灰虚线｜暂定范围或关系</text><circle cx="1309" cy="947" r="5" fill="#d89a16"/><text x="1335" y="951" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >黄点｜待现场核验</text><rect x="1300" y="964" width="19" height="12" rx="0" fill="url(#hatch)" stroke="#7b5b8c" stroke-width="1" /><text x="1335" y="975" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >紫色斜线｜需专业研究</text>
  <line x1="60" y1="1072" x2="1740" y2="1072" stroke="#c8d2d1" stroke-width="1"  />
  <text x="60" y="1100" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#587078" text-anchor="start" >AI-OFF 结论属于概念物理网络的通过状态，仍受设施、入口、过街与责任时段现场核验限制。</text>
