    <rect x="995" y="356" width="630" height="96" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.5" /><rect x="995" y="356" width="7" height="96" rx="4" fill="#6c946f" stroke="#6c946f" stroke-width="0" /><text x="1017" y="386" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#17323d" text-anchor="start" >遮阴 / 种植</text><text x="1017" y="412" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >作为设计预留和现场核验对象；不以概念绿带声称现状连续遮阴。</text><rect x="1497" y="373" width="110" height="27" rx="4" fill="#dcefeb" stroke="#6c946f" stroke-width="1" /><text x="1507" y="392" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#6c946f" text-anchor="start" >VERIFY</text>
