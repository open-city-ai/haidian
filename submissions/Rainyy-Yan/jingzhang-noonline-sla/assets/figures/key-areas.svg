  <text x="60" y="59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" >SUPPORT 02  三区空间原型</text>
  <text x="60" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#c9dadb" text-anchor="start" >Three different urban responsibilities</text>
  <rect x="1480" y="39" width="245" height="27" rx="4" fill="#244f58" stroke="#9cdddd" stroke-width="1" /><text x="1490" y="58" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="700" fill="#9cdddd" text-anchor="start" >V4 / CONCEPT</text>
  <text x="60" y="110" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9cdddd" text-anchor="start" >从测试、公共知识到到达转换，三区不使用同一套节点模板。</text>
  <rect x="60" y="154" width="1680" height="850" rx="6" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.4" /><text x="90" y="200" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#17323d" text-anchor="start" >三区不是三个标签，而是三种不同的公共责任。</text><rect x="150" y="284" width="400" height="480" rx="5" fill="#f6f7f4" stroke="#118c83" stroke-width="2" /><rect x="150" y="284" width="400" height="13" rx="0" fill="#118c83" stroke="none" stroke-width="1" /><text x="174" y="336" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#17323d" text-anchor="start" >众智园</text><text x="174" y="375" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >公共通行</text><text x="174" y="400" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >可观看的测试</text><text x="174" y="425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >测试可停止</text><rect x="198" y="470" width="152" height="98" rx="2" fill="#244f58" stroke="#17323d" stroke-width="1" /><text x="274" y="508" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >受控测试</text><rect x="350" y="470" width="44" height="98" rx="0" fill="url(#hatch)" stroke="#118c83" stroke-width="1" /><rect x="394" y="502" width="108" height="66" rx="2" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="448" y="530" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >公共通行</text><rect x="198" y="604" width="304" height="74" rx="3" fill="#dcefeb" stroke="#118c83" stroke-width="1" /><text x="220" y="633" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="start" >F01：人工核验与停测交接</text><rect x="640" y="284" width="400" height="480" rx="5" fill="#f6f7f4" stroke="#7b5b8c" stroke-width="2" /><rect x="640" y="284" width="400" height="13" rx="0" fill="#7b5b8c" stroke="none" stroke-width="1" /><text x="664" y="336" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#17323d" text-anchor="start" >AI 原点</text><text x="664" y="375" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >可进入的知识</text><text x="664" y="400" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >可停留的客厅</text><text x="664" y="425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >可退出的 AI</text><rect x="688" y="470" width="300" height="70" rx="3" fill="#dce9da" stroke="#6c946f" stroke-width="1" /><text x="838" y="500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >N06｜遗产解释点（非遗存）</text><rect x="688" y="562" width="300" height="80" rx="3" fill="#fae3dc" stroke="#d85a43" stroke-width="1" /><text x="838" y="593" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >N05｜坐、等、谈、人工提问</text><rect x="688" y="664" width="300" height="42" rx="3" fill="#dce9f6" stroke="#3c77b8" stroke-width="1" /><text x="838" y="691" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >AI 可选，不是入口条件</text><rect x="1130" y="284" width="400" height="480" rx="5" fill="#f6f7f4" stroke="#d85a43" stroke-width="2" /><rect x="1130" y="284" width="400" height="13" rx="0" fill="#d85a43" stroke="none" stroke-width="1" /><text x="1154" y="336" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#17323d" text-anchor="start" >大钟寺</text><text x="1154" y="375" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >可读的到达</text><text x="1154" y="400" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >可判断的转换</text><text x="1154" y="425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >不假装连通</text><rect x="1178" y="470" width="300" height="72" rx="3" fill="#dce7e6" stroke="#17323d" stroke-width="1" /><text x="1328" y="500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >真实背景：13号线大钟寺站 A / B 口</text><rect x="1178" y="564" width="300" height="78" rx="3" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="1328" y="595" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >概念：方向、短停、人工帮助</text><rect x="1178" y="664" width="300" height="42" rx="3" fill="#fae3dc" stroke="#d85a43" stroke-width="1" /><text x="1328" y="691" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >过街 / 无障碍：现场核验后再决定</text><rect x="1300" y="810" width="410" height="182" rx="5" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.2" /><text x="1318" y="837" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#17323d" text-anchor="start" >视觉证据语法</text><line x1="1320" y1="861" x2="1342" y2="861" stroke="#17323d" stroke-width="3"  /><text x="1355" y="865" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >实线｜公开支持的背景</text><line x1="1320" y1="885" x2="1342" y2="885" stroke="#d85a43" stroke-width="3" stroke-dasharray="7 5" /><text x="1355" y="889" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >珊瑚虚线｜概念设计叠加</text><line x1="1320" y1="909" x2="1342" y2="909" stroke="#587078" stroke-width="3" stroke-dasharray="7 5" /><text x="1355" y="913" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >灰虚线｜暂定范围或关系</text><circle cx="1329" cy="933" r="5" fill="#d89a16"/><text x="1355" y="937" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >黄点｜待现场核验</text><rect x="1320" y="950" width="19" height="12" rx="0" fill="url(#hatch)" stroke="#7b5b8c" stroke-width="1" /><text x="1355" y="961" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >紫色斜线｜需专业研究</text>
  <line x1="60" y1="1072" x2="1740" y2="1072" stroke="#c8d2d1" stroke-width="1"  />
  <text x="60" y="1100" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#587078" text-anchor="start" >所有节点位置与服务条件均为概念设计；真实入口、设施、责任时段与路线合法性有待现场和专业核验。</text>
