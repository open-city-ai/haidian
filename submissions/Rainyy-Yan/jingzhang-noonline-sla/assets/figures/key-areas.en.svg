  <text x="60" y="110" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#9cdddd" text-anchor="start" >From testing to public knowledge to arrival transfer, the three areas do not reuse one node template.</text>
  <rect x="60" y="154" width="1680" height="850" rx="6" fill="#ffffff" stroke="#c8d2d1" stroke-width="1.4" /><text x="90" y="200" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#17323d" text-anchor="start" >THREE AREAS ARE NOT THREE LABELS; THEY HOLD THREE DIFFERENT PUBLIC RESPONSIBILITIES.</text><rect x="150" y="284" width="400" height="480" rx="5" fill="#f6f7f4" stroke="#118c83" stroke-width="2" /><rect x="150" y="284" width="400" height="13" rx="0" fill="#118c83" stroke="none" stroke-width="1" /><text x="174" y="336" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#17323d" text-anchor="start" >ZHONGZHIYUAN</text><text x="174" y="375" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >public passage</text><text x="174" y="400" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >observable testing</text><text x="174" y="425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >test can stop</text><rect x="198" y="470" width="152" height="98" rx="2" fill="#244f58" stroke="#17323d" stroke-width="1" /><text x="274" y="508" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >CONTROLLED TEST</text><rect x="350" y="470" width="44" height="98" rx="0" fill="url(#hatch)" stroke="#118c83" stroke-width="1" /><rect x="394" y="502" width="108" height="66" rx="2" fill="#fbefd0" stroke="#d89a16" stroke-width="1" /><text x="448" y="530" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >PUBLIC WAY</text><rect x="198" y="604" width="304" height="74" rx="3" fill="#dcefeb" stroke="#118c83" stroke-width="1" /><text x="220" y="633" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="start" >F01: human verification + stop-test handover</text><rect x="640" y="284" width="400" height="480" rx="5" fill="#f6f7f4" stroke="#7b5b8c" stroke-width="2" /><rect x="640" y="284" width="400" height="13" rx="0" fill="#7b5b8c" stroke="none" stroke-width="1" /><text x="664" y="336" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#17323d" text-anchor="start" >AI ORIGIN</text><text x="664" y="375" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >enterable knowledge</text><text x="664" y="400" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >stayable civic room</text><text x="664" y="425" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#587078" text-anchor="start" >AI can be refused</text><rect x="688" y="470" width="300" height="70" rx="3" fill="#dce9da" stroke="#6c946f" stroke-width="1" /><text x="838" y="500" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >N06 | interpretation point (not relic)</text><rect x="688" y="562" width="300" height="80" rx="3" fill="#fae3dc" stroke="#d85a43" stroke-width="1" /><text x="838" y="593" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#17323d" text-anchor="middle" >N05 | sit, wait, talk, ask a person</text><rect x="688" y="664" width="300" height="42" rx="3" fill="#dce9f6" stroke="#3c77b8" stroke-width="1" /><text x="838" y="691" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#17323d" text-anchor="middle" >AI optional, never an entry condition</text><rect x="1130" y="284" width="400" height="480" rx="5" fill="#f6f7f4" stroke="#d85a43" stroke-width="2" /><rect x="1130" y="284" width="400" height="13" rx