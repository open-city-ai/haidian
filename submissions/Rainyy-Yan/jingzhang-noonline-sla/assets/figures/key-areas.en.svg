osoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >Solid | publicly supported context</text><line x1="1320" y1="885" x2="1342" y2="885" stroke="#d85a43" stroke-width="3" stroke-dasharray="7 5" /><text x="1355" y="889" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >Coral dash | conceptual intervention</text><line x1="1320" y1="909" x2="1342" y2="909" stroke="#587078" stroke-width="3" stroke-dasharray="7 5" /><text x="1355" y="913" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >Grey dash | provisional relation</text><circle cx="1329" cy="933" r="5" fill="#d89a16"/><text x="1355" y="937" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >Gold point | field verification required</text><rect x="1320" y="950" width="19" height="12" rx="0" fill="url(#hatch)" stroke="#7b5b8c" stroke-width="1" /><text x="1355" y="961" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#587078" text-anchor="start" >Purple hatch | professional study required</text>
