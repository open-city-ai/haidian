  <text x="60" y="59" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" >FIGURE 07  RESEARCH → CITY → FEEDBACK → ITERATE</text>
  <text x="60" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#c9dadb" text-anchor="start" >A spatial loop from research and validation to public feedback</text>
