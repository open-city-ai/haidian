    <text x="1100" y="691" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#587078" text-anchor="start" >Research does not bypass the public; use does not bypass human responsibility; algorithms do not bypass evidence gates.</text>
