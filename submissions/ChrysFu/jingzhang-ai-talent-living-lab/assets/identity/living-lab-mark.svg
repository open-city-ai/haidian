    <path d="M40 215 H250 L330 135 L410 215 H650" fill="none" stroke="#009E73" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M5 45 V245" fill="none" stroke="#E69F00" stroke-width="16"/>
