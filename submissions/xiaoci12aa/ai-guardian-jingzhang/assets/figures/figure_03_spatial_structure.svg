<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" style="background:#f8f9fa;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="axis1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="axis2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="850" fill="#f8f9fa"/>
  
  <text x="600" y="45" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a2e">AI守望京张 · 空间结构图</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#607d8b">Spatial Structure Diagram</text>
  
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="1000" height="650" rx="8" fill="#fff" stroke="#37474f" stroke-width="2"/>
    
    <line x1="500" y1="40" x2="500" y2="610" stroke="url(#axis1)" stroke-width="4" stroke-dasharray="0" filter="url(#glow)"/>
    <text x="515" y="40" font-size="11" font-weight="bold" fill="#00d4ff">AI创新主轴</text>
    <text x="515" y="55" font-size="9" fill="#00d4ff">AI Innovation Axis</text>
    
    <line x1="40" y1="570" x2="960" y2="570" stroke="url(#axis2)" stroke-width="4" filter="url(#glow)"/>
    <text x="40" y="555" font-size="11" font-weight="bold" fill="#ec4899">京张文化副轴</text>
    <text x="40" y="542" font-size="9" fill="#ec4899">Jing-Zhang Heritage Axis</text>
    
    <g transform="translate(350, 60)">
      <polygon points="150,0 300,40 300,140 150,180 0,140 0,40" fill="#ede7f6" stroke="#5e35b2" stroke-width="2"/>
      <circle cx="150" cy="90" r="40" fill="#5e35b2" opacity="0.9"/>
      <text x="150" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">众智园</text>
      <text x="150" y="102" text-anchor="middle" font-size="8" fill="#fff">AI研发核心</text>
      <text x="150" y="160" text-anchor="middle" font-size="10" fill="#5e35b2">192.1 ha</text>
    </g>
    
    <g transform="translate(350, 260)">
      <polygon points="150,0 250,30 250,110 150,140 50,110 50,30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
      <circle cx="150" cy="70" r="30" fill="#2e7d32" opacity="0.9"/>
      <text x="150" y="67" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">AI原点</text>
      <text x="150" y="80" text-anchor="middle" font-size="8" fill="#fff">社区</text>
      <text x="150" y="125" text-anchor="middle" font-size="10" fill="#2e7d32">104.3 ha</text>
    </g>
    
    <g transform="translate(350, 440)">
      <polygon points="150,0 240,25 240,95 150,120 60,95 60,25" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
      <circle cx="150" cy="60" r="25" fill="#e65100" opacity="0.9"/>
      <text x="150" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">大钟寺</text>
      <text x="150" y="70" text-anchor="middle" font-size="7" fill="#fff">AI产业</text>
      <text x="150" y="108" text-anchor="middle" font-size="10" fill="#e65100">72 ha</text>
    </g>
    
    <g transform="translate(780, 280)">
