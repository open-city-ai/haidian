      <text x="90" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#880e4f">中关村</text>
      <text x="90" y="40" text-anchor="middle" font-size="9" fill="#880e4f">科技服务翼</text>
    </g>
    
    <g transform="translate(780, 370)">
      <rect x="0" y="0" width="180" height="60" rx="30" fill="#e1bee7" stroke="#8e24aa" stroke-width="2"/>
      <text x="90" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a148c">小月河</text>
      <text x="90" y="40" text-anchor="middle" font-size="9" fill="#4a148c">场景赋能翼</text>
    </g>
    
    <g transform="translate(40, 280)">
      <rect x="0" y="0" width="100" height="60" rx="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
      <text x="50" y="25" text-anchor="middle" font-size="9" font-weight="bold" fill="#0d47a1">京张遗址</text>
      <text x="50" y="40" text-anchor="middle" font-size="8" fill="#0d47a1">文化带</text>
    </g>
    
    <g transform="translate(40, 370)">
      <rect x="0" y="0" width="100" height="60" rx="30" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
      <text x="50" y="25" text-anchor="middle" font-size="9" font-weight="bold" fill="#1b5e20">AI生态</text>
      <text x="50" y="40" text-anchor="middle" font-size="8" fill="#1b5e20">走廊</text>
    </g>
    
    <circle cx="500" cy="150" r="12" fill="#ff5722" opacity="0.8" filter="url(#glow)"/>
    <circle cx="500" cy="330" r="12" fill="#4caf50" opacity="0.8" filter="url(#glow)"/>
    <circle cx="500" cy="500" r="12" fill="#ff9800" opacity="0.8" filter="url(#glow)"/>
    <circle cx="620" cy="310" r="8" fill="#00bcd4" opacity="0.8"/>
    <circle cx="380" cy="310" r="8" fill="#9c27b0" opacity="0.8"/>
    
    <line x1="500" y1="162" x2="500" y2="318" stroke="#ff5722" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="500" y1="342" x2="500" y2="488" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="512" y1="150" x2="780" y2="300" stroke="#ff9800" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="512" y1="330" x2="780" y2="370" stroke="#4caf50" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="488" y1="330" x2="140" y2="310" stroke="#00bcd4" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    
    <g transform="translate(10, 10)">
      <rect x="0" y="0" width="220" height="200" rx="6" fill="#fafafa" stroke="#b0bec5"/>
      <text x="110" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">规划结构</text>
      <g transform="translate(15, 30)">
        <circle cx="15" cy="12" r="8" fill="#00d4ff"/>
        <text x="30" y="16" font-size="9" fill="#424242">一带：AI创新主轴</text>
      </g>
      <g transform="translate(15, 50)">
        <circle cx="15" cy="12" r="8" fill="#5e35b2"/>
        <text x="30" y="16" font-size="9" fill="#424242">三心：三个核心片区</text>
      </g>
      <g transform="translate(15, 70)">
        <circle cx="15" cy="12" r="8" fill="#ec407a"/>
        <text x="30" y="16" font-size="9" fill="#424242">两翼：东西赋能翼</text>
      </g>
      <g transform="translate(15, 90)">
        <circle cx="15" cy="12" r="8" fill="#66bb6a"/>
        <text x="30" y="16" font-size="9" fill="#424242">多节点：公共空间网络</text>
      </g>
      <g transform="translate(15, 115)">
        <rect x="0" y="0" width="190" height="65" rx="5" fill="#fff3e0" stroke="#fb8c00"/>
        <text x="95" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="#e65100">核心指标</text>
        <text x="95" y="35" text-anchor="middle" font-size="8" fill="#e65100">AI产业占比 41%</text>
        <text x="95" y="48" text-anchor="middle" font-size="8" fill="#e65100">绿地率 35%</text>
      </g>
    </g>
