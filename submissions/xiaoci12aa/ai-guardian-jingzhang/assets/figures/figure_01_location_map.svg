    <rect x="20" y="55" width="260" height="130" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="150" y="120" text-anchor="middle" font-size="18" fill="#2e7d32">海淀区</text>
    <polygon points="100,80 200,80 220,100 220,160 180,180 120,180 80,160 80,100" fill="#00d4ff" fill-opacity="0.3" stroke="#00d4ff" stroke-width="2"/>
    <text x="150" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f3460">设计范围</text>
    <text x="150" y="152" text-anchor="middle" font-size="11" fill="#0f3460">11.4 km²</text>
  </g>
  
  <g transform="translate(500, 120)">
