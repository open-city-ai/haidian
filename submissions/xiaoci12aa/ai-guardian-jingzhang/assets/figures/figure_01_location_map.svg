      <text x="90" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#0d47a1">5 min</text>
      <text x="90" y="62" text-anchor="middle" font-size="9" fill="#1565c0">步行</text>
    </g>
    
    <g transform="translate(280, 50)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="#e8f5e9" stroke="#388e3c"/>
      <text x="90" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">五道口站</text>
      <text x="90" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b5e20">8 min</text>
      <text x="90" y="62" text-anchor="middle" font-size="9" fill="#1b5e20">步行</text>
    </g>
    
    <g transform="translate(500, 50)">
      <rect x="0" y="0" width="180" height="80" rx="8" fill="#fff3e0" stroke="#f57c00"/>
      <text x="90" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">首都机场</text>
      <text x="90" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">45 min</text>
      <text x="90" y="62" text-anchor="middle" font-size="9" fill="#e65100">车程</text>
    </g>
    
    <g transform="translate(720, 50)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="#f3e5f5" stroke="#7b1fa2"/>
      <text x="75" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">雄安新区</text>
      <text x="75" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a148c">90 min</text>
      <text x="75" y="62" text-anchor="middle" font-size="9" fill="#4a148c">高铁</text>
    </g>
    
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="810" height="70" rx="8" fill="#fafafa" stroke="#78909c"/>
      <text x="405" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474f">区位优势</text>
      <text x="405" y="42" text-anchor="middle" font-size="10" fill="#607d8b">紧邻中关村科技创新核心区 · 坐拥京张铁路百年文化品牌 · 汇聚清华北大顶级科研资源 · 交通网络四通八达</text>
    </g>
