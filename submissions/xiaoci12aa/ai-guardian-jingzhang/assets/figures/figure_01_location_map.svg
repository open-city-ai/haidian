    <text x="420" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">范围</text>
    
    <line x1="150" y1="160" x2="205" y2="120" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="295" y1="120" x2="365" y2="160" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5,3"/>
    
    <circle cx="250" cy="250" r="35" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
