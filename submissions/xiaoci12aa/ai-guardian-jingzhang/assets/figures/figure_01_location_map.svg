<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background:#f8f9fa;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e5f5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a2e">AI守望京张 · 区位图</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" fill="#607d8b">Location Map</text>
  
  <g transform="translate(150, 120)">
