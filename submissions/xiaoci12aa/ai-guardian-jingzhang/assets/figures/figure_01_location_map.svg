    <text x="420" y="290" text-anchor="middle" font-size="8" fill="#6a1b9a">遗址公园</text>
    
    <line x1="250" y1="250" x2="400" y2="270" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="420" y1="225" x2="420" y2="250" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,2"/>
  </g>
  
  <g transform="translate(150, 500)">
