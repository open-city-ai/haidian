<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">通勤共益调度台：交通系统的品牌与公共体验入口</title><desc id="desc">三处重点区组成一条可观察、可使用、可复核的未来体验路线；当前未排期、未授权</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123E4A"/></linearGradient><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.title{font-size:31px;font-weight:850;fill:#F5FBFF}.sub{font-size:15px;fill:#A9C7D4}.brand{font-size:42px;font-weight:900;fill:#F5FBFF;letter-spacing:2px}.brandEn{font-size:16px;font-weight:800;fill:#66E3CA;letter-spacing:3px}.nodeId{font:900 13px Arial,sans-serif}.nodeTitle{font:800 20px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#F5FBFF}.label{font:800 11px Arial,PingFang SC,sans-serif;letter-spacing:1px}.body{font:500 15px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#D8EAF0}.status{font:800 11px Arial,PingFang SC,sans-serif;fill:#9CF2DE}</style></defs><rect width="1600" height="980" fill="url(#bg)"/><circle cx="1470" cy="80" r="310" fill="#2A9D8F" opacity=".14"/><circle cx="80" cy="900" r="260" fill="#5B8DEF" opacity=".12"/><text x="70" y="56" class="sans" fill="#66E3CA" font-size="17" font-weight="900" letter-spacing="3">COMMUTE CO-BENEFIT COMMONS / BRAND SYSTEM</text><text x="70" y="98" class="sans title">通勤共益调度台：交通系统的品牌与公共体验入口</text><text x="70" y="125" class="sans sub">三处重点区组成一条可观察、可使用、可复核的未来体验路线；当前未排期、未授权</text><g transform="translate(110 180)"><circle cx="70" cy="70" r="58" fill="none" stroke="#55E4C1" stroke-width="10" stroke-dasharray="220 90"/><circle cx="70" cy="8" r="13" fill="#7DA8FF"/><circle cx="16" cy="104" r="13" fill="#F082A7"/><circle cx="124" cy="104" r="13" fill="#F7BF63"/><path d="M70 8 L16 104 L124 104 Z" fill="none" stroke="#D8EAF0" stroke-width="3" opacity=".9"/><circle cx="70" cy="70" r="10" fill="#F5FBFF"/><path d="M70 70 L70 8" stroke="#F5FBFF" stroke-width="4"/></g><text x="280" y="230" class="brand">通勤共益调度台</text><text x="282" y="263" class="brandEn">COMMUTE CO-BENEFIT NETWORK</text><text x="282" y="310" class="sub">让企业到岗、居民日常和轨道换乘共享一条可回退的活动链</text><text x="282" y="356" class="body">企业、居民、轨道三类入口共用一条保持人工出口的活动链</text><path d="M280 390 H1320" stroke="#2D5366"/><text x="90" y="425" class="label" fill="#66E3CA">三处公共体验节点</text><g><rect x="90" y="450" width="430" height="318" rx="24" fill="#102A3A" stroke="#2D5366" stroke-width="2"/><rect x="90" y="450" width="10" height="318" rx="5" fill="#55E4C1"/><circle cx="144" cy="510" r="24" fill="#071A2B" stroke="#55E4C1" stroke-width="5"/><text x="144" y="517" text-anchor="middle" class="nodeId" fill="#55E4C1">P-01</text><text x="186" y="512" class="nodeTitle">众智园 · 企业交通台</text><text x="120" y="570" class="label" fill="#55E4C1">它让人看见</text><text x="120" y="600" class="body">看懂分组通勤与路缘状态</text><text x="120" y="648" class="label" fill="#55E4C1">体验入口</text><text x="120" y="678" class="body">公开看板、电话和纸面入口；不展示员工个人轨迹</text><text x="120" y="726" class="status">设计目标 · unknown_until_authorized</text></g><g><rect x="580" y="450" width="430" height="318" rx="24" fill="#102A3A" stroke="#2D5366" stroke-width="2"/><rect x="580" y="450" width="10" height="318" rx="5" fill="#7DA8FF"/><circle cx="634" cy="510" r="24" fill="#071A2B" stroke="#7DA8FF" stroke-width="5"/><text x="634" y="517" text-anchor="middle" class="nodeId" fill="#7DA8FF">P-02</text><text x="676" y="512" class="nodeTitle">AI 原点社区 · 人工服务台</text><text x="610" y="570" class="label" fill="#7DA8FF">它让人看见</text><text x="610" y="600" class="body">用同一条日常路线比较 AI、人工、电话和纸面入口</text><text x="610" y="648" class="label" fill="#7DA8FF">体验入口</text><text x="610" y="678" class="body">居民可以不注册、不使用 App，直接提出需求和异议</text><text x="610" y="726" class="status">设计目标 · unknown_until_authorized</text></g><g><rect x="1070" y="450" width="430" height="318" rx="24" fill="#102A3A" stroke="#2D5366" stroke-width="2"/><rect x="1070" y="450" width="10" height="318" rx="5" fill="#F082A7"/><circle cx="1124" cy="510" r="24" fill="#071A2B" stroke="#F082A7" stroke-width="5"/><text x="1124" y="517" text-anchor="middle" class="nodeId" fill="#F082A7">P-03</text><text x="1166" y="512" class="nodeTitle">大钟寺 · 轨道换乘展台</text><text x="1100" y="570" class="label" fill="#F082A7">它让人看见</text><text x="1100" y="600" class="body">看见地铁、公交、骑行、步行与无障碍如何交接</text><text x="1100" y="648" class="label" fill="#F082A7">体验入口</text><text x="1100" y="678" class="body">展示五种路缘状态和停止条件，不展示未授权的航线或绩效</text><text x="1100" y="726" class="status">设计目标 · unknown_until_authorized</text></g><path d="M290 832 C540 900 1060 900 1310 832" fill="none" stroke="#55E4C1" stroke-width="4" stroke-dasharray="12 12"/><text x="800" y="865" text-anchor="middle" class="body">观察企业问题 → 体验居民入口 → 复核轨道与路缘</text><text x="800" y="902" text-anchor="middle" class="sub">把 AI 朝圣理解成公开学习和复核路线，不把它写成已建成景点或活动品牌</text><text x="800" y="950" text-anchor="middle" class="status">这是品牌与公共体验合同，不是官方 Logo、活动、景点、合作或运营结果。</text></svg>