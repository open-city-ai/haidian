  <text x="92" y="788" class="section" text-anchor="start">DECISION RULE</text><text x="92" y="830" class="row" text-anchor="start">An enterprise benefit is admissible only when protected-group access, fallback, capacity, privacy and public review remain inside the same gate.</text><text x="92" y="862" class="foot" text-anchor="start">This is a design contract over synthetic aggregates. It does not prove resident acceptance, enterprise adoption, local OD, capacity, service quality or permission.</text>
