dth="472" height="54" rx="12" fill="#102f42"/><text x="1260" y="390" class="row">air candidate  BLOCKED</text><rect x="1242" y="432" width="472" height="54" rx="12" fill="#102f42"/><text x="1260" y="466" class="row row-tight">external commute  UNKNOWN until grouped OD</text><rect x="1242" y="508" width="472" height="54" rx="12" fill="#102f42"/><text x="1260" y="542" class="row row-tight">any failure  FREEZE → P0; fallback retained</text>
