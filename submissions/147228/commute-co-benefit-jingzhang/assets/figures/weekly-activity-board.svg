  <text x="880" y="622" fill="#66E3CA" font-family="Arial, sans-serif" font-size="13" font-weight="700">读图顺序</text>
  <text x="880" y="650" fill="#D6EEF0" font-family="Arial, sans-serif" font-size="13">每天都处理每个群组。活动单元是</text>
