<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">运力缺口：每种方式补多少服务单元才过运营门槛</title>
  <desc id="desc">对 O4 合成需求逐方式扫描最小服务单元放大倍数；六种方式均可在声明的 1.35 倍峰值负荷和零残余队列门槛下通过，但结果不是本地运营或采购结论。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#173a4b"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#32c5aa"/><stop offset="1" stop-color="#70e1c3"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111f" flood-opacity=".22"/></filter>
    <style>
      .sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.white{fill:#f4fbfb}.muted{fill:#a8c2c7}.teal{fill:#70e1c3}.amber{fill:#ffd37a}.ink{fill:#102b3b}.small{font-size:20px}.label{font-size:24px;font-weight:750}.value{font-size:46px;font-weight:850;letter-spacing:-1px}.title{font-size:56px;font-weight:850;letter-spacing:-2px}.card{fill:#f4f8f9}.line{stroke:#cfe2e2;stroke-width:2}.pill{font-size:20px;font-weight:850}.row{font-size:22px;font-weight:750}.bar{fill:#dcebec}.barfill{fill:#39c4aa}.note{font-size:19px}
    </style>
  </defs>
  <rect width="2400" height="1500" fill="url(#bg)"/>
  <text x="110" y="92" class="sans teal" font-size="25" font-weight="800" letter-spacing="4">COMMUTE CO-BENEFIT COMMONS / CAPACITY CLOSURE / v2.17</text>
  <text x="110" y="172" class="sans white title">运力缺口：先算过门槛需要补多少</text>
  <text x="110" y="220" class="sans muted" font-size="25">O4 合成压力屏 · 每种方式独立最小服务单元扫描 · 不是采购、班次或现状绩效结论</text>
  <rect x="1880" y="78" width="410" height="76" rx="38" fill="#3e2d2d" stroke="#ff9b8e" stroke-width="2"/>
  <text x="2085" y="126" text-anchor="middle" class="sans" fill="#ffb1a5" font-size="22" font-weight="850">SYNTHETIC / NOT OPERATING</text>

  <g filter="url(#shadow)">
    <rect x="110" y="285" width="535" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/>
    <rect x="670" y="285" width="535" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/>
    <rect x="1230" y="285" width="535" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/>
    <rect x="1790" y="285" width="500" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/>
  </g>
  <text x="145" y="330" class="sans muted small">当前运营屏 / CURRENT SCREEN</text><text x="145" y="395" class="sans coral value" fill="#ff9b8e">3.24× → 1.35×</text><text x="145" y="425" class="sans white" font-size="21">峰值负荷门槛</text>
  <text x="705" y="330" class="sans muted small">合计闭合 / COMBINED CLOSURE</text><text x="705" y="395" class="sans teal value">+301,925</text><text x="705" y="425" class="sans white" font-size="21">声明服务单元</text>
  <text x="1265" y="330" class="sans muted small">残余队列 / RESIDUAL QUEUE</text><text x="1265" y="395" class="sans teal value">0</text><text x="1265" y="425" class="sans white" font-size="21">六种方式均过屏</text>
  <text x="1825" y="330" class="sans muted small">规模 / COVERAGE</text><text x="1825" y="395" class="sans amber value">3.122M</text><text x="1825" y="425" class="sans white" font-size="21">合成代理全量</text>

  <rect x="110" y="490" width="1480" height="820" rx="30" class="card" filter="url(#shadow)"/>
  <text x="155" y="550" class="sans ink" font-size="32" font-weight="850">六种方式：从 1.00× 扫到最小可闭合点</text>
  <text x="155" y="588" class="sans" fill="#668095" font-size="20">每种方式独立扫描 0.01× 步长；条件是 3 个 15 分钟片段无残余队列且峰值 ≤ 1.35×</text>
  <text x="165" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">方式 / MODE</text><text x="560" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">最小放大倍数 / MULTIPLIER</text><text x="1000" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">新增服务单元 / GAP</text><text x="1260" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">峰值 / PEAK</text><text x="1450" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">状态</text>
  <line x1="165" y1="675" x2="1535" y2="675" class="line"/>

  <g class="sans">
    <text x="165" y="740" class="ink row">地铁 <tspan fill="#668095" font-size="18">METRO</tspan></text><rect x="560" y="720" width="320" height="22" rx="11" class="bar"/><rect x="560" y="720" width="267" height="22" rx="11" class="barfill"/><line x1="869" y1="712" x2="869" y2="750" stroke="#e1a83f" stroke-width="3"/><text x="895" y="742" class="mono ink pill">1.17×</text><text x="1000" y="740" class="mono ink row">+803</text><text x="1260" y="740" class="mono ink row">1.12×</text><rect x="1435" y="714" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="740" text-anchor="middle" class="teal pill">PASS</text>
    <line x1="165" y1="775" x2="1535" y2="775" class="line"/>
    <text x="165" y="820" class="ink row">公交 <tspan fill="#668095" font-size="18">BUS</tspan></text><rect x="560" y="800" width="320" height="22" rx="11" class="bar"/><rect x="560" y="800" width="256" height="22" rx="11" class="barfill"/><line x1="869" y1="792" x2="869" y2="830" stroke="#e1a83f" stroke-width="3"/><text x="895" y="822" class="mono ink pill">1.12×</text><text x="1000" y="820" class="mono ink row">+1,122</text><text x="1260" y="820" class="mono ink row">1.01×</text><rect x="1435" y="794" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="820" text-anchor="middle" class="teal pill">PASS</text>
    <line x1="165" y1="855" x2="1535" y2="855" class="line"/>
    <text x="165" y="900" class="ink row">自行车 <tspan fill="#668095" font-size="18">BICYCLE</tspan></text><rect x="560" y="880" width="320" height="22" rx="11" class="bar"/><rect x="560" y="880" width="301" height="22" rx="11" class="barfill"/><line x1="869" y1="872" x2="869" y2="910" stroke="#e1a83f" stroke-width="3"/><text x="895" y="902" class="mono ink pill">1.32×</text><text x="1000" y="900" class="mono ink row">+115,200</text><text x="1260" y="900" class="mono ink row">1.20×</text><rect x="1435" y="874" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="900" text-anchor="middle" class="teal pill">PASS</text>
    <line x1="165" y1="935" x2="1535" y2="935" class="line"/>
    <text x="165" y="980" class="ink row">步行 / 无障碍 <tspan fill="#668095" font-size="18">ACCESS</tspan></text><rect x="560" y="960" width="320" height="22" rx="11" class="bar"/><rect x="560" y="960" width="306" height="22" rx="11" class="barfill"/><line x1="869" y1="952" x2="869" y2="990" stroke="#e1a83f" stroke-width="3"/><text x="895" y="982" class="mono ink pill">1.34×</text><text x="1000" y="980" class="mono ink row">+183,600</text><text x="1260" y="980" class="mono ink row">1.11×</text><rect x="1435" y="954" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="980" text-anchor="middle" class="teal pill">PASS</text>
    <line x1="165" y1="1015" x2="1535" y2="1015" class="line"/>
    <text x="165" y="1060" class="ink row">汽车 <tspan fill="#668095" font-size="18">CAR</tspan></text><rect x="560" y="1040" width="320" height="22" rx="11" class="bar"/><rect x="560" y="1040" width="229" height="22" rx="11" class="barfill"/><line x1="869" y1="1032" x2="869" y2="1070" stroke="#e1a83f" stroke-width="3"/><text x="895" y="1062" class="mono ink pill">1.00×</text><text x="1000" y="1060" class="mono ink row">+0</text><text x="1260" y="1060" class="mono ink row">0.90×</text><rect x="1435" y="1034" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="1060" text-anchor="middle" class="teal pill">PASS</text>
    <line x1="165" y1="1095" x2="1535" y2="1095" class="line"/>
    <text x="165" y="1140" class="ink row">企业接驳 <tspan fill="#668095" font-size="18">SHUTTLE</tspan></text><rect x="560" y="1120" width="320" height="22" rx="11" class="bar"/><rect x="560" y="1120" width="265" height="22" rx="11" class="barfill"/><line x1="869" y1="1112" x2="869" y2="1150" stroke="#e1a83f" stroke-width="3"/><text x="895" y="1142" class="mono ink pill">1.16×</text><text x="1000" y="1140" class="mono ink row">+1,200</text><text x="1260" y="1140" class="mono ink row">1.15×</text><rect x="1435" y="1114" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="1140" text-anchor="middle" class="teal pill">PASS</text>
  </g>
  <text x="165" y="1210" class="sans" fill="#668095" font-size="18">金线 = 1.35× gate · 彩色条 = 最小放大倍数 · +gap = 跨三个时间片段的新增声明服务单元</text>

  <rect x="1630" y="490" width="660" height="820" rx="30" class="card" filter="url(#shadow)"/>
  <text x="1675" y="550" class="sans ink" font-size="32" font-weight="850">这张图回答什么？</text>
  <text x="1675" y="588" class="sans" fill="#668095" font-size="20">WHAT THIS SCREEN DOES / DOES NOT SAY</text>
  <rect x="1675" y="635" width="570" height="150" rx="20" fill="#e8faf5" stroke="#53d7bb" stroke-width="2"/>
  <text x="1710" y="680" class="sans" fill="#0f806e" font-size="22" font-weight="850">回答 / ANSWER</text>
  <text x="1710" y="722" class="sans ink note">在声明输入下，指出每种方式</text><text x="1710" y="752" class="sans ink note">最小可闭合的服务单元增量。</text>
  <rect x="1675" y="815" width="570" height="205" rx="20" fill="#fff0ed" stroke="#ff9b8e" stroke-width="2"/>
  <text x="1710" y="860" class="sans" fill="#b55043" font-size="22" font-weight="850">不回答 / NOT AN ANSWER</text>
  <text x="1710" y="902" class="sans ink note">不是实际班次、车队、采购数量，</text><text x="1710" y="932" class="sans ink note">不是居民满意度或本地运营绩效，</text><text x="1710" y="962" class="sans ink note">也不是自动推进 P1 / P2 的许可。</text>
  <rect x="1675" y="1050" width="570" height="145" rx="20" fill="#102d43" stroke="#2c6370"/>
  <text x="1710" y="1095" class="sans teal" font-size="22" font-weight="850">NEXT / 下一步</text>
  <text x="1710" y="1135" class="sans white note">补日期 OD、班次、容量、拒载、</text><text x="1710" y="1165" class="sans white note">无障碍审计和责任运营者，再复算。</text>
  <text x="1675" y="1245" class="sans" fill="#668095" font-size="18">air candidate: BLOCKED · ground modes remain primary</text>

  <rect x="110" y="1370" width="2180" height="62" rx="18" fill="#102d43" stroke="#2c6370"/>
  <text x="150" y="1410" class="sans white" font-size="19" font-weight="750">CAPACITY CLOSURE PASS = synthetic gate closure only　·　not timetable proof　·　not procurement advice　·　not local performance</text>
<g id="evidence-chain-ribbon"><rect x="0" y="1390" width="2400" height="110" fill="#071A2B" opacity=".96"/><text x="40" y="1407" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#66E3CA">同一份区域 runner · 五个读出视角</text><text x="2360" y="1407" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#9FC0CF">同源聚合证据，不是五组独立的现场结果</text><rect x="40.0" y="1408" width="457.6" height="38" rx="10" fill="#4DE1BF22" stroke="#4DE1BF" stroke-width="1.5"/><text x="54.0" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">1  区域覆盖</text><rect x="505.6" y="1408" width="457.6" height="38" rx="10" fill="#6EA5FF22" stroke="#6EA5FF" stroke-width="1.5"/><text x="519.6" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">2  网络边节点</text><rect x="971.2" y="1408" width="457.6" height="38" rx="10" fill="#F7BF6322" stroke="#F7BF63" stroke-width="1.5"/><text x="985.2" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">3  运力缺口</text><rect x="1436.8" y="1408" width="457.6" height="38" rx="10" fill="#F07D9E22" stroke="#F07D9E" stroke-width="1.5"/><text x="1450.8" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">4  资源敏感性</text><rect x="1902.4" y="1408" width="457.6" height="38" rx="10" fill="#B8A1FF22" stroke="#B8A1FF" stroke-width="1.5"/><text x="1916.4" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">5  稳健性</text></g></svg>
