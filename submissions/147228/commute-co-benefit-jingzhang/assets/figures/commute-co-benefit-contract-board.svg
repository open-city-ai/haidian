  <rect x="62" y="190" width="520" height="500" rx="24" fill="#0e2a3c" stroke="#77e3c0" stroke-width="3"/><text x="90" y="242" class="section" text-anchor="start">企业得到什么</text><rect x="86" y="280" width="472" height="54" rx="12" fill="#102f42"/><text x="104" y="314" class="row">代理分  91.28 → 91.87  （+0.59）</text><rect x="86" y="356" width="472" height="54" rx="12" fill="#102f42"/><text x="104" y="390" class="row">活动链完成  72.1% → 100.0%</text><rect x="86" y="432" width="472" height="54" rx="12" fill="#102f42"/><text x="104" y="466" class="row">车辆公里代理  4,023,920 → 994,510</text><rect x="86" y="508" width="472" height="54" rx="12" fill="#102f42"/><text x="104" y="542" class="row">错峰输入  18% · 不是实测行为</text><rect x="640" y="190" width="520" height="500" rx="24" fill="#0e2a3c" stroke="#79a9ff" stroke-width="3"/><text x="668" y="242" class="section" text-anchor="start">居民如何不被牺牲</text><rect x="664" y="280" width="472" height="54" rx="12" fill="#102f42"/><text x="682" y="314" class="row">最弱可达代理  0.928 → 0.963</text><rect x="664" y="356" width="472" height="54" rx="12" fill="#102f42"/><text x="682" y="390" class="row">最弱保护组代理分  91.64</text><rect x="664" y="432" width="472" height="54" rx="12" fill="#102f42"/><text x="682" y="466" class="row">保护群组错峰  按合同为 0%</text><rect x="664" y="508" width="472" height="54" rx="12" fill="#102f42"/><text x="682" y="542" class="row">人工 / 地铁 / 公交回退  必须保留</text><rect x="1218" y="190" width="520" height="500" rx="24" fill="#0e2a3c" stroke="#f6c76b" stroke-width="3"/><text x="1246" y="242" class="section" text-anchor="start">何时必须停</text><rect x="1242" y="280" width="472" height="54" rx="12" fill="#102f42"/><text x="1260" y="314" class="row">硬门  10/10 通过</text><rect x="1242" y="356" width="472" height="54" rx="12" fill="#102f42"/><text x="1260" y="390" class="row">空中候选  阻断</text><rect x="1242" y="432" width="472" height="54" rx="12" fill="#102f42"/><text x="1260" y="466" class="row">对外通勤  待分组 OD，当前未知</text><rect x="1242" y="508" width="472" height="54" rx="12" fill="#102f42"/><text x="1260" y="542" class="row">任一失败  冻结 → 回 P0；保留回退</text>
