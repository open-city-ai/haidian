<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1495" viewBox="0 0 1600 1495" role="img" aria-labelledby="title desc"><title id="title">十张交通场景卡：从需求登记到停止条件</title><desc id="desc">每张卡都回答空间、对象、触发、输入、动作、读数、责任、回退与停止；当前均未授权、未运行</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123E4A"/></linearGradient><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.title{font-size:30px;font-weight:850;fill:#F5FBFF}.sub{font-size:15px;fill:#A9C7D4}.cardId{font:800 16px Arial,sans-serif;letter-spacing:1px}.cardTitle{font:800 18px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#F6FBFF}.label{font:800 10px Arial,PingFang SC,sans-serif;letter-spacing:.6px}.field{font:500 11px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#D8EAF0}.status{font:800 10px Arial,PingFang SC,sans-serif;fill:#9CF2DE;letter-spacing:.3px}.stopLabel{font:800 10px Arial,PingFang SC,sans-serif;letter-spacing:.5px}.stopText{font:500 11px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#F5C4CB}</style></defs><rect width="1600" height="1495" fill="url(#bg)"/><circle cx="1500" cy="40" r="300" fill="#2A9D8F" opacity=".12"/><circle cx="70" cy="1395" r="260" fill="#5B8DEF" opacity=".12"/><text x="60" y="54" class="sans" fill="#66E3CA" font-size="17" font-weight="900" letter-spacing="3">COMMUTE CO-BENEFIT COMMONS / SCENARIO CONTRACTS</text><text x="60" y="94" class="sans title">十张交通场景卡：从需求登记到停止条件</text><text x="60" y="120" class="sans sub">每张卡都回答空间、对象、触发、输入、动作、读数、责任、回退与停止；当前均未授权、未运行</text><g class="card"><rect x="60" y="142" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="60" y="142" width="8" height="245" rx="4" fill="#55E4C1"/><text x="84" y="171" class="cardId" fill="#55E4C1">M-01</text><text x="138" y="171" class="cardTitle">企业合并班车</text><rect x="570" y="154" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="668" y="170" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="78" y="198" class="label" fill="#55E4C1">空间</text><text x="160" y="198" class="field">众智园入口—轨道站口—路缘窗口</text><text x="78" y="219" class="label" fill="#55E4C1">对象</text><text x="160" y="219" class="field">企业员工；受路缘变化影响的居民</text><text x="78" y="240" class="label" fill="#55E4C1">触发</text><text x="160" y="240" class="field">工作日早高峰出现两个以上企业聚合需求时段</text><text x="78" y="261" class="label" fill="#55E4C1">输入</text><text x="160" y="261" class="field">15 分钟分组需求、车队与站点、消防净空、居民异议台账</text><text x="78" y="282" class="label" fill="#55E4C1">动作</text><text x="160" y="282" class="field">比较合并班车、地铁/公交、骑行和步行的接驳组合</text><text x="78" y="303" class="label" fill="#55E4C1">读数</text><text x="160" y="303" class="field">方式份额、站口负荷、路缘冲突、投诉首响</text><text x="78" y="324" class="label" fill="#55E4C1">责任</text><text x="160" y="324" class="field">企业交通协调；轨道公交；现场维护</text><text x="78" y="345" class="label" fill="#55E4C1">回退</text><text x="160" y="345" class="field">保留公共交通和人工回家服务，不开共享预约</text><text x="78" y="372" class="stopLabel" fill="#F39BAE">停止</text><text x="160" y="372" class="stopText">需求未日期化、无运营接管人或居民冲突无法回读</text></g><g class="card"><rect x="810" y="142" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="810" y="142" width="8" height="245" rx="4" fill="#7DA8FF"/><text x="834" y="171" class="cardId" fill="#7DA8FF">M-02</text><text x="888" y="171" class="cardTitle">员工公共交通补贴</text><rect x="1320" y="154" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="1418" y="170" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="828" y="198" class="label" fill="#7DA8FF">空间</text><text x="910" y="198" class="field">企业入口—地铁/公交换乘界面</text><text x="828" y="219" class="label" fill="#7DA8FF">对象</text><text x="910" y="219" class="field">企业员工；低汽车依赖员工；无障碍出行者</text><text x="828" y="240" class="label" fill="#7DA8FF">触发</text><text x="910" y="240" class="field">企业提出分组方式基线和可退出的补贴试验</text><text x="828" y="261" class="label" fill="#7DA8FF">输入</text><text x="910" y="261" class="field">方式份额、票制、无障碍入口、员工同意与退出方式</text><text x="828" y="282" class="label" fill="#7DA8FF">动作</text><text x="910" y="282" class="field">并列比较补贴、人工咨询、电话和纸面入口，不把研究效果当成本地转移</text><text x="828" y="303" class="label" fill="#7DA8FF">读数</text><text x="910" y="303" class="field">分组方式变化、非数字入口使用、等待与拒绝率</text><text x="828" y="324" class="label" fill="#7DA8FF">责任</text><text x="910" y="324" class="field">企业交通协调；轨道公交；隐私安全复核</text><text x="828" y="345" class="label" fill="#7DA8FF">回退</text><text x="910" y="345" class="field">不启用补贴试验，保留普通票务和人工窗口</text><text x="828" y="372" class="stopLabel" fill="#F39BAE">停止</text><text x="910" y="372" class="stopText">无员工退出、票制、分组基线或无障碍等价入口</text></g><g class="card"><rect x="60" y="401" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="60" y="401" width="8" height="245" rx="4" fill="#F7BF63"/><text x="84" y="430" class="cardId" fill="#F7BF63">M-03</text><text x="138" y="430" class="cardTitle">夜班保证回家</text><rect x="570" y="413" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="668" y="429" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="78" y="457" class="label" fill="#F7BF63">空间</text><text x="160" y="457" class="field">企业入口—夜间站点—社区服务台</text><text x="78" y="478" class="label" fill="#F7BF63">对象</text><text x="160" y="478" class="field">夜班员工；晚间照护者；夜间维护人员</text><text x="78" y="499" class="label" fill="#F7BF63">触发</text><text x="160" y="499" class="field">夜间班次出现有日期的分组回家需求</text><text x="78" y="520" class="label" fill="#F7BF63">输入</text><text x="160" y="520" class="field">需求区间、值守电话、接管人、安全等候点和地面回家路线</text><text x="78" y="541" class="label" fill="#F7BF63">动作</text><text x="160" y="541" class="field">先给轨道公交和人工电话入口，再评估低速接驳缺口</text><text x="78" y="562" class="label" fill="#F7BF63">读数</text><text x="160" y="562" class="field">接通率、等候时长、人工接管率、路线完成</text><text x="78" y="583" class="label" fill="#F7BF63">责任</text><text x="160" y="583" class="field">企业交通协调；社区服务；现场维护</text><text x="78" y="604" class="label" fill="#F7BF63">回退</text><text x="160" y="604" class="field">没有真人接电话就停在调查，不开启预约</text><text x="78" y="631" class="stopLabel" fill="#F39BAE">停止</text><text x="160" y="631" class="stopText">无值守电话、等候点、安全复核或返程安排</text></g><g class="card"><rect x="810" y="401" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="810" y="401" width="8" height="245" rx="4" fill="#F082A7"/><text x="834" y="430" class="cardId" fill="#F082A7">M-04</text><text x="888" y="430" class="cardTitle">园区装卸预约</text><rect x="1320" y="413" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="1418" y="429" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="828" y="457" class="label" fill="#F082A7">空间</text><text x="910" y="457" class="field">企业入口—服务路缘—消防通道</text><text x="828" y="478" class="label" fill="#F082A7">对象</text><text x="910" y="478" class="field">物流与维护人员；居民；应急响应者</text><text x="828" y="499" class="label" fill="#F082A7">触发</text><text x="910" y="499" class="field">服务车辆需要短时装卸且不应占用公共连续路线</text><text x="828" y="520" class="label" fill="#F082A7">输入</text><text x="910" y="520" class="field">车型、路缘责任、清场时限、消防和无障碍绕行</text><text x="828" y="541" class="label" fill="#F082A7">动作</text><text x="910" y="541" class="field">把服务路缘变成有责任人和结束时刻的短时窗口</text><text x="828" y="562" class="label" fill="#F082A7">读数</text><text x="910" y="562" class="field">按时清场、消防净空、无障碍绕行、居民投诉</text><text x="828" y="583" class="label" fill="#F082A7">责任</text><text x="910" y="583" class="field">企业交通协调；现场维护；交通无障碍复核</text><text x="828" y="604" class="label" fill="#F082A7">回退</text><text x="910" y="604" class="field">只登记装卸，不锁定公共路缘</text><text x="828" y="631" class="stopLabel" fill="#F39BAE">停止</text><text x="910" y="631" class="stopText">责任边界、清场证据或消防/无障碍绕行缺失</text></g><g class="card"><rect x="60" y="660" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="60" y="660" width="8" height="245" rx="4" fill="#B7A4FF"/><text x="84" y="689" class="cardId" fill="#B7A4FF">M-05</text><text x="138" y="689" class="cardTitle">居民就医人工接驳</text><rect x="570" y="672" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="668" y="688" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="78" y="716" class="label" fill="#B7A4FF">空间</text><text x="160" y="716" class="field">AI 原点社区—社区服务台—医院方向换乘</text><text x="78" y="737" class="label" fill="#B7A4FF">对象</text><text x="160" y="737" class="field">居民；照护者；儿童；老年人</text><text x="78" y="758" class="label" fill="#B7A4FF">触发</text><text x="160" y="758" class="field">居民按服务类型提出有回程安排的就医需求</text><text x="78" y="779" class="label" fill="#B7A4FF">输入</text><text x="160" y="779" class="field">聚合服务类型、人工/电话/纸面入口、照护规则和回程安排</text><text x="78" y="800" class="label" fill="#B7A4FF">动作</text><text x="160" y="800" class="field">把 AI 推荐和人工等价路线并列，基本通行不要求 App</text><text x="78" y="821" class="label" fill="#B7A4FF">读数</text><text x="160" y="821" class="field">路线完成、等待、拒绝、照护回程连续性</text><text x="78" y="842" class="label" fill="#B7A4FF">责任</text><text x="160" y="842" class="field">社区服务；居民照护观察；无障碍复核</text><text x="78" y="863" class="label" fill="#B7A4FF">回退</text><text x="160" y="863" class="field">保留普通公共交通和人工窗口，不要求注册</text><text x="78" y="890" class="stopLabel" fill="#F39BAE">停止</text><text x="160" y="890" class="stopText">无非数字入口、回程安排或隐私最小化规则</text></g><g class="card"><rect x="810" y="660" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="810" y="660" width="8" height="245" rx="4" fill="#5ED6D0"/><text x="834" y="689" class="cardId" fill="#5ED6D0">M-06</text><text x="888" y="689" class="cardTitle">轮椅等价路线</text><rect x="1320" y="672" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="1418" y="688" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="828" y="716" class="label" fill="#5ED6D0">空间</text><text x="910" y="716" class="field">社区—站口—公共服务点连续人行线</text><text x="828" y="737" class="label" fill="#5ED6D0">对象</text><text x="910" y="737" class="field">轮椅使用者；助行器使用者；照护者</text><text x="828" y="758" class="label" fill="#5ED6D0">触发</text><text x="910" y="758" class="field">任何推荐路线涉及坡道、电梯、过街或天气变化</text><text x="828" y="779" class="label" fill="#5ED6D0">输入</text><text x="910" y="779" class="field">连续路线走查、电梯/坡道状态、过街、坡度和天气回退</text><text x="828" y="800" class="label" fill="#5ED6D0">动作</text><text x="910" y="800" class="field">先验证等价地面路线，再允许任何数字推荐进入候选</text><text x="828" y="821" class="label" fill="#5ED6D0">读数</text><text x="910" y="821" class="field">路线完成率、断点数、绕行时间、人工协助需求</text><text x="828" y="842" class="label" fill="#5ED6D0">责任</text><text x="910" y="842" class="field">交通无障碍复核；现场维护；居民照护观察</text><text x="828" y="863" class="label" fill="#5ED6D0">回退</text><text x="910" y="863" class="field">任一段没有等价回退就关闭推荐</text><text x="828" y="890" class="stopLabel" fill="#F39BAE">停止</text><text x="910" y="890" class="stopText">电梯、坡道、过街或天气回退未被日期化核验</text></g><g class="card"><rect x="60" y="919" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="60" y="919" width="8" height="245" rx="4" fill="#FF9F68"/><text x="84" y="948" class="cardId" fill="#FF9F68">M-07</text><text x="138" y="948" class="cardTitle">轨道站最后 500 米</text><rect x="570" y="931" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="668" y="947" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="78" y="975" class="label" fill="#FF9F68">空间</text><text x="160" y="975" class="field">大钟寺站口—骑行停放—企业/居民入口</text><text x="78" y="996" class="label" fill="#FF9F68">对象</text><text x="160" y="996" class="field">轨道通勤者；居民；访客；无障碍出行者</text><text x="78" y="1017" class="label" fill="#FF9F68">触发</text><text x="160" y="1017" class="field">站口换乘和最后一段出现可计数的时段压力</text><text x="78" y="1038" class="label" fill="#FF9F68">输入</text><text x="160" y="1038" class="field">站口/换乘计数、最后一段审计、骑行停放和时段基线</text><text x="78" y="1059" class="label" fill="#FF9F68">动作</text><text x="160" y="1059" class="field">把地铁、公交、骑行、步行和无障碍接驳放在同一站口账本里</text><text x="78" y="1080" class="label" fill="#FF9F68">读数</text><text x="160" y="1080" class="field">换乘可靠、站口负荷、停放占用、无障碍完成</text><text x="78" y="1101" class="label" fill="#FF9F68">责任</text><text x="160" y="1101" class="field">轨道公交；交通无障碍；现场维护</text><text x="78" y="1122" class="label" fill="#FF9F68">回退</text><text x="160" y="1122" class="field">不以合成时间替代站口和路段计数，维持地面公共交通</text><text x="78" y="1149" class="stopLabel" fill="#F39BAE">停止</text><text x="160" y="1149" class="stopText">无站口、路段、停放和无障碍基线</text></g><g class="card"><rect x="810" y="919" width="730" height="245" rx="18" fill="#102A3A" stroke="#2D5366" stroke-width="1.5"/><rect x="810" y="919" width="8" height="245" rx="4" fill="#8CB6FF"/><text x="834" y="948" class="cardId" fill="#8CB6FF">M-08</text><text x="888" y="948" class="cardTitle">活动日人车分流</text><rect x="1320" y="931" width="196" height="24" rx="12" fill="#173E4C" stroke="#2A9D8F"/><text x="1418" y="947" text-anchor="middle" class="status">设计合同 · 未运行</text><text x="828" y="975" class="label" fill="#8CB6FF">空间</text><text x="910" y="975" class="field">公共空间—站口—物流与应急通道</text><text x="828" y="996" class="label" fill="#8CB6FF">对象</text><text x="910" y="996" class="field">居民；访客；物流维护；应急响应者</text><text x="828" y="1017" class="label" fill="#8CB6FF">触发</text><text x="910" y="1017" class="field">活动日人数范围和居民回家需求都能先行登记</text><text x="828" y="1038" class="label" fill="#8CB6FF">输入</text><text x="910" y="1038" class="field">活动人数、居民回家、物流/应急路线和清场责任</text><text x="828" y="1059" class="label" fill="#8CB6FF">动作</text><text x="910" y="1059" class="field">按时段分开人行、服务、接驳与应急动线，不封死公共连续路线</text><text x="828" y="1080" class="label" fill="#8CB6FF">读数</text><text x="910" y="1080" class="field">应急连续、清场准时、居民回家、冲突事件</text><text x="828" y="1101" class="label" fill="#8CB6FF">责任</text><text x="910" y="1101" class="field">社区服务；交通安全；现场维护；独立复核</text><text x="828" y="11