<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">企业到岗弹性敏感性：B1 错峰效果</title>
  <desc id="desc">450 个企业设计单元中 20% 延后到岗，峰值排队与平均排队人分钟下降；居民、照护、访客、物流和夜班需求保持保护。</desc>
  <rect width="1200" height="850" fill="#f7f3ed"/>
  <text x="62" y="62" fill="#2a9d8f" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="2">COMMUTE CO-BENEFIT COMMONS / 147228</text>
  <text x="1138" y="62" text-anchor="end" fill="#2a9d8f" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">B1 / MODEL v1.3</text>
  <text x="62" y="124" fill="#10233f" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700">企业到岗弹性敏感性</text>
  <text x="62" y="158" fill="#7890af" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18">错峰释放高峰压力 · 合成设计敏感性 · 不是本地实测效果</text>
  <rect x="62" y="194" width="1076" height="112" rx="18" fill="#10233f"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="92" y="231" fill="#a7f3d0" font-size="14" font-weight="700">ELIGIBLE GROUP</text>
    <text x="92" y="276" fill="#fff" font-size="34" font-weight="700">450</text>
    <text x="166" y="270" fill="#c7d2fe" font-size="15">企业员工设计单元</text>
    <line x1="390" y1="218" x2="390" y2="284" stroke="#4b6381"/>
    <text x="430" y="231" fill="#a7f3d0" font-size="14" font-weight="700">POLICY</text>
    <text x="430" y="276" fill="#fff" font-size="34" font-weight="700">20%</text>
    <text x="545" y="270" fill="#c7d2fe" font-size="15">弹性窗口占比</text>
    <line x1="754" y1="218" x2="754" y2="284" stroke="#4b6381"/>
    <text x="794" y="231" fill="#a7f3d0" font-size="14" font-weight="700">SHIFTED</text>
    <text x="794" y="276" fill="#fff" font-size="34" font-weight="700">90</text>
    <text x="870" y="270" fill="#c7d2fe" font-size="15">错峰设计单元</text>
  </g>
  <rect x="62" y="334" width="692" height="394" rx="18" fill="#fff" stroke="#d9e2e8"/>
  <text x="92" y="378" fill="#10233f" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">队列压力 / QUEUE PRESSURE</text>
  <text x="92" y="407" fill="#7890af" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">同一 1,000 人设计单位，适应组只改变企业到岗时间窗</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334e68">
    <text x="92" y="462">峰值排队人数</text><text x="92" y="548">平均排队人分钟</text>
    <text x="694" y="462" text-anchor="end" fill="#e76f51" font-weight="700">174 → 164</text>
    <text x="694" y="548" text-anchor="end" fill="#e76f51" font-weight="700">75.8 → 71.8</text>
  </g>
  <g>
    <rect x="222" y="438" width="430" height="22" rx="11" fill="#edf2f4"/><rect x="222" y="438" width="430" height="22" rx="11" fill="#e76f51"/><text x="662" y="455" fill="#e76f51" font-family="Arial" font-size="15" font-weight="700">baseline</text>
    <rect x="222" y="468" width="430" height="22" rx="11" fill="#edf2f4"/><rect x="222" y="468" width="405" height="22" rx="11" fill="#2a9d8f"/><text x="637" y="485" fill="#2a9d8f" font-family="Arial" font-size="15" font-weight="700">adaptive</text>
    <rect x="222" y="524" width="430" height="22" rx="11" fill="#edf2f4"/><rect x="222" y="524" width="430" height="22" rx="11" fill="#e76f51"/><text x="662" y="541" fill="#e76f51" font-family="Arial" font-size="15" font-weight="700">baseline</text>
    <rect x="222" y="554" width="430" height="22" rx="11" fill="#edf2f4"/><rect x="222" y="554" width="407" height="22" rx="11" fill="#2a9d8f"/><text x="639" y="571" fill="#2a9d8f" font-family="Arial" font-size="15" font-weight="700">adaptive</text>
  </g>
  <rect x="92" y="626" width="604" height="58" rx="12" fill="#e8f6f3"/>
  <text x="112" y="662" fill="#0e8f83" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">峰值 -10 人 · 平均排队人分钟 -4.0082 · 汽车路缘队列不变</text>
  <rect x="778" y="334" width="360" height="394" rx="18" fill="#10233f"/>
  <text x="812" y="378" fill="#a7f3d0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">方式负载 / MODE LOAD</text>
  <text x="812" y="407" fill="#c7d2fe" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">baseline → adaptive</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">
    <text x="812" y="468" fill="#fff">地铁</text><text x="1088" y="468" text-anchor="end" fill="#a7f3d0" font-weight="700">43.89% → 41.11%</text>
    <line x1="812" y1="484" x2="1102" y2="484" stroke="#4b6381"/>
    <text x="812" y="536" fill="#fff">公交</text><text x="1088" y="536" text-anchor="end" fill="#a7f3d0" font-weight="700">56.67% → 50.00%</text>
    <line x1="812" y1="552" x2="1102" y2="552" stroke="#4b6381"/>
    <text x="812" y="604" fill="#fff">汽车路缘</text><text x="1088" y="604" text-anchor="end" fill="#f9b267" font-weight="700">60 → 60 辆</text>
    <line x1="812" y1="620" x2="1102" y2="620" stroke="#4b6381"/>
    <text x="812" y="672" fill="#fff">未满足需求</text><text x="1088" y="672" text-anchor="end" fill="#f9b267" font-weight="700">89 → 89</text>
  </g>
  <text x="62" y="786" fill="#7890af" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">Protected: residents · carers/children · visitors · logistics/maintenance · night workers</text>
  <text x="1138" y="786" text-anchor="end" fill="#7890af" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">Source: movement-simulation.json · synthetic sensitivity</text>
</svg>
