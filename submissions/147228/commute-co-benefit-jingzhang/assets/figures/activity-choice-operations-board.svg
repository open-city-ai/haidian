<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">出发时段选择与服务单元账本：区域人口规模综合模拟</title>
  <desc id="desc">在 3,122,000 个合成代理上执行独立的分组出发时段敏感性屏查，并将 O4 容量平衡候选的地铁、公交、自行车、无障碍、汽车和企业接驳服务单元负荷放在同一张可审计图板中。数值是合成屏查，不是本地行为观测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081827"/><stop offset="1" stop-color="#102d43"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4de1bf"/><stop offset="1" stop-color="#20a89b"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".22"/></filter>
    <style>
      .sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.mono{font-family:SFMono-Regular,Menlo,monospace}.white{fill:#f4f8fb}.muted{fill:#9bb4c6}.teal{fill:#4de1bf}.amber{fill:#f7bf63}.pink{fill:#f07d9e}.blue{fill:#6ea5ff}.ink{fill:#10283c}.small{font-size:21px}.label{font-size:24px;font-weight:700}.value{font-size:46px;font-weight:800;letter-spacing:-1px}.tiny{font-size:17px}.axis{fill:#7895a9;font-size:18px}.mode{font-size:18px;font-weight:700}.arrow{fill:none;stroke:#4de1bf;stroke-width:5;stroke-linecap:round;stroke-dasharray:8 12}
    </style>
  </defs>
  <rect width="2400" height="1500" fill="url(#bg)"/>
  <circle cx="2250" cy="-80" r="360" fill="#1a6f76" opacity=".28"/><circle cx="2120" cy="1450" r="420" fill="#294575" opacity=".22"/>
  <text x="130" y="100" class="sans teal" font-size="25" font-weight="800" letter-spacing="4">COMMUTE CO-BENEFIT COMMONS / CHOICE × OPERATIONS / v2.9</text>
  <text x="130" y="177" class="sans white" font-size="60" font-weight="800">出发时段选择 × 服务单元账本</text>
  <text x="130" y="228" class="sans muted" font-size="25">3,122,000 个合成代理 · 企业弹性窗口与受保护群体分开处理 · O4 地铁 / 公交 / 骑行 / 无障碍 / 汽车 / 接驳负荷 · 只发布聚合结果</text>
  <rect x="1930" y="92" width="320" height="72" rx="36" fill="#173f50" stroke="#4de1bf" stroke-width="2"/><text x="2090" y="138" text-anchor="middle" class="sans teal" font-size="22" font-weight="800">GROUPED / NO TRACE</text>

  <g filter="url(#shadow)">
    <rect x="130" y="292" width="660" height="170" rx="24" fill="#12384c" stroke="#2e6b73"/>
    <rect x="820" y="292" width="660" height="170" rx="24" fill="#12384c" stroke="#2e6b73"/>
    <rect x="1510" y="292" width="740" height="170" rx="24" fill="#12384c" stroke="#2e6b73"/>
  </g>
  <text x="170" y="337" class="sans muted small">全量行为屏查</text><text x="170" y="414" class="sans white value">3.122M / 100%</text><text x="170" y="445" class="sans teal tiny">AM 分组时段 × 方式；不是员工样本</text>
  <text x="860" y="337" class="sans muted small">企业弹性窗口 / O4</text><text x="860" y="414" class="sans teal value">218,266</text><text x="860" y="445" class="sans teal tiny">19.97% enterprise agents · early window</text>
  <text x="1550" y="337" class="sans muted small">受保护群体被移位</text><text x="1550" y="414" class="sans white value">0</text><text x="1550" y="445" class="sans amber tiny">residents / care / visitors / logistics / night workers</text>

  <rect x="130" y="510" width="1060" height="610" rx="28" fill="#0d2538" stroke="#24465b"/>
  <text x="175" y="565" class="sans white" font-size="30" font-weight="800">A. 到达窗口重分布 / TIME BANDS</text>
  <text x="175" y="600" class="sans muted small">同一 3,122,000 人群；preferred = 首选窗口，early = 企业可调整窗口，late = 夜班活动带</text>
  <text x="175" y="684" class="sans amber label">B0 压力参考</text>
  <rect x="390" y="650" width="570" height="58" rx="10" fill="#1a3549"/>
  <rect x="390" y="650" width="541.5" height="58" rx="10" fill="#6ea5ff"/><rect x="931.5" y="650" width="28" height="58" fill="#f7bf63"/>
  <text x="390" y="750" class="sans muted small">early 0%　 preferred 95%　 late 5%</text>
  <text x="175" y="844" class="sans teal label">O4 容量平衡</text>
  <rect x="390" y="810" width="570" height="58" rx="10" fill="#1a3549"/>
  <rect x="390" y="810" width="39.8" height="58" rx="10" fill="#4de1bf"/><rect x="429.8" y="810" width="501.7" height="58" fill="#6ea5ff"/><rect x="931.5" y="810" width="28" height="58" fill="#f7bf63"/>
  <text x="390" y="910" class="sans teal small">early 6.99%　 preferred 88.01%　 late 5%</text>
  <line x1="175" y1="958" x2="1140" y2="958" stroke="#24465b"/>
  <text x="175" y="1007" class="sans muted small">重排成本代理</text><text x="420" y="1007" class="sans white label">4.365M person-min</text><text x="175" y="1058" class="sans muted tiny">只计企业从首选窗口移动 20 分钟的合成成本；居民照护、访客、物流和夜班不被强行错峰。</text>
  <text x="175" y="1092" class="sans muted tiny">这是独立敏感性屏查，不参与 O1/O2/O3/O4 排名；需员工接受度、班次与 15 分钟容量数据后校准。</text>

  <rect x="1230" y="510" width="1020" height="610" rx="28" fill="#f3f7f8" filter="url(#shadow)"/>
  <text x="1275" y="565" class="sans ink" font-size="30" font-weight="800">B. O4 服务单元负荷 / SERVICE LEDGER</text>
  <text x="1275" y="600" class="sans" fill="#668095" font-size="19">required units ÷ available units · 1.35× hard gate · synthetic, not observed fleet or timetable</text>
  <line x1="2010" y1="630" x2="2010" y2="1030" stroke="#10283c" stroke-width="3" stroke-dasharray="8 8"/><text x="2010" y="1060" text-anchor="middle" class="sans ink tiny">1.35× gate</text>
  <g class="sans mode">
    <text x="1275" y="676" class="blue">地铁列次</text><rect x="1515" y="650" width="500" height="36" rx="18" fill="#e3ebf3"/><rect x="1515" y="650" width="373" height="36" rx="18" fill="#6ea5ff"/><text x="2040" y="677" class="ink">1.12×</text>
    <text x="1275" y="740" fill="#5d9fc1">公交发车</text><rect x="1515" y="714" width="500" height="36" rx="18" fill="#e3ebf3"/><rect x="1515" y="714" width="359" height="36" rx="18" fill="#5d9fc1"/><text x="2040" y="741" class="ink">1.08×</text>
    <text x="1275" y="804" class="teal">自行车槽位</text><rect x="1515" y="778" width="500" height="36" rx="18" fill="#e3ebf3"/><rect x="1515" y="778" width="391" height="36" rx="18" fill="#4de1bf"/><text x="2040" y="805" class="ink">1.17×</text>
    <text x="1275" y="868" fill="#76a77e">无障碍槽位</text><rect x="1515" y="842" width="500" height="36" rx="18" fill="#e3ebf3"/><rect x="1515" y="842" width="403" height="36" rx="18" fill="#76a77e"/><text x="2040" y="869" class="ink">1.21×</text>
    <text x="1275" y="932" fill="#e77c65">汽车等效</text><rect x="1515" y="906" width="500" height="36" rx="18" fill="#e3ebf3"/><rect x="1515" y="906" width="243" height="36" rx="18" fill="#e77c65"/><text x="2040" y="933" class="ink">0.73×</text>
    <text x="1275" y="996" class="amber">企业接驳车</text><rect x="1515" y="970" width="500" height="36" rx="18" fill="#e3ebf3"/><rect x="1515" y="970" width="356" height="36" rx="18" fill="#f7bf63"/><text x="2040" y="997" class="ink">1.07×</text>
  </g>
  <text x="1275" y="1090" class="sans" fill="#668095" font-size="18">单元：列次 / 发车 / 槽位 / 车辆等效；负荷超过 1.0× 表示合成需求超过声明可用单元，需现场核验与扩容或重分配。</text>

  <rect x="130" y="1170" width="2120" height="250" rx="28" fill="#102f42" stroke="#28576a"/>
  <text x="175" y="1225" class="sans white" font-size="27" font-weight="800">C. 从人群到行动 / FROM PEOPLE TO ACCOUNTABLE ACTION</text>
  <g class="sans" font-size="20" font-weight="700">
    <rect x="175" y="1305" width="330" height="56" rx="28" fill="#214d67"/><text x="340" y="1341" text-anchor="middle" class="white">分组需求 / grouped demand</text>
    <path d="M520 1333 H620" class="arrow"/><polygon points="620,1325 640,1333 620,1341" fill="#4de1bf"/>
    <rect x="650" y="1305" width="350" height="56" rx="28" fill="#1e635f"/><text x="825" y="1341" text-anchor="middle" class="white">方式 × 时段选择</text>
    <path d="M1015 1333 H1115" class="arrow"/><polygon points="1115,1325 1135,1333 1115,1341" fill="#4de1bf"/>
    <rect x="1145" y="1305" width="350" height="56" rx="28" fill="#315a8b"/><text x="1320" y="1341" text-anchor="middle" class="white">服务单元 / 路缘账本</text>
    <path d="M1510 1333 H1610" class="arrow"/><polygon points="1610,1325 1630,1333 1610,1341" fill="#4de1bf"/>
    <rect x="1640" y="1305" width="500" height="56" rx="28" fill="#7b4d63"/><text x="1890" y="1341" text-anchor="middle" class="white">人工复核 → 试点 / 停止 / 回退</text>
  </g>
  <text x="175" y="1395" class="sans muted tiny">Source: regional-scale-commute.json + run-regional-commute-simulation.js · v2.9 · AM full coverage · synthetic grouped screen · air candidate remains blocked · no personal schedule or trace</text>
</svg>
