  <rect x="332" y="738" width="226" height="55" rx="15" fill="#12354b"/><text x="354" y="763" class="muted">公交车等效</text><text x="538" y="775" class="smallmetric" text-anchor="end">10,042</text>
  <rect x="578" y="738" width="226" height="55" rx="15" fill="#3b243d"/><text x="600" y="763" class="muted">汽车车辆等效</text><text x="784" y="775" class="smallmetric" text-anchor="end">176,095</text>
  <rect x="824" y="738" width="226" height="55" rx="15" fill="#30304a"/><text x="846" y="763" class="muted">企业接驳车等效</text><text x="1030" y="775" class="smallmetric" text-anchor="end">8,019</text>
  <rect x="1070" y="738" width="226" height="55" rx="15" fill="#153f3e"/><text x="1092" y="763" class="muted">无障碍路径守恒</text><text x="1276" y="775" class="smallmetric" text-anchor="end">65.3 万人</text>
  <rect x="1316" y="738" width="192" height="55" rx="15" fill="#153f3e"/><text x="1412" y="762" class="chip" text-anchor="middle">空中路径</text><text x="1412" y="781" class="smallmetric" text-anchor="middle">BLOCKED</text>

  <text x="68" y="868" class="footer">边界：合成网络 / 合成容量 / 合成群体权重；不代表现状 OD、道路断面、站点能力、居民满意度或运营许可。下一步校准：日期化 15 分钟 OD、班次容量、路缘/交叉口、人行无障碍和班车证据。</text>
  <text x="68" y="894" class="footer">可复核：node visual/assets/run-network-flow-screen.js　|　screen MOB-NETWORK-FLOW-888　|　隐私：仅发布分组、区域、方式、时段、节点和边聚合</text>
  <rect x="1370" y="850" width="172" height="48" rx="24" fill="#0f3a38" stroke="#34d399"/><text x="1456" y="879" class="chip" text-anchor="middle">PASS · 仅沙盘</text>
