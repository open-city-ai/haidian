<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">全量人员动线与网络压力屏查</title>
  <desc id="desc">3,122,000 个合成代理在声明的地铁、公交、自行车、步行无障碍、汽车和企业接驳节点边网络中的聚合人流与车辆等效流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#0f2437"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#39d8ff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .bg{fill:url(#bg)} .panel{fill:#10283b;stroke:#1f455d;stroke-width:1.5} .panel2{fill:#0d2033;stroke:#1b4058;stroke-width:1.5}
      .title{font:700 33px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#f4fbff;letter-spacing:1px}
      .sub{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#8fb7c9;letter-spacing:.5px}
      .label{font:600 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#d8f3ff}
      .muted{font:500 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#79a2b5}
      .metric{font:800 31px -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;fill:#f7fdff;letter-spacing:.5px}
      .smallmetric{font:800 21px -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;fill:#e9fbff}
      .chip{font:700 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#c9f5ff;letter-spacing:.4px}
      .node{fill:#15354a;stroke:#2d6a84;stroke-width:1.5} .nodeHot{fill:#203b48;stroke:#fbbf24;stroke-width:2}
      .nodeText{font:700 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#e9fbff}
      .edge{fill:none;stroke-linecap:round;opacity:.72} .edgeGlow{fill:none;stroke-linecap:round;opacity:.16;filter:url(#soft)}
      .barbg{fill:#17384c} .bar{fill:url(#cyan)} .barHot{fill:url(#amber)}
      .footer{font:500 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#86aebe}
    </style>
  </defs>
