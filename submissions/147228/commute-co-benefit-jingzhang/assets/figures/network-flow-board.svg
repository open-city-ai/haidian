  <rect x="1216" y="126" width="326" height="484" rx="20" class="panel2"/>
  <text x="1244" y="164" class="label">热点节点与边</text>
  <text x="1244" y="188" class="muted">O4 首选切片 / 负荷 ÷ 声明容量</text>
  <text x="1244" y="234" class="label">外部→地铁骨干</text><text x="1508" y="234" class="smallmetric" text-anchor="end">1.264×</text><rect x="1244" y="246" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="246" width="247" height="10" rx="5" class="barHot"/><text x="1244" y="275" class="muted">25.4 万人 · 1,409 列车等效</text>
  <text x="1244" y="318" class="label">物流维护关口</text><text x="1508" y="318" class="smallmetric" text-anchor="end">1.076×</text><rect x="1244" y="330" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="330" width="210" height="10" rx="5" fill="#f59e0b"/><text x="1244" y="359" class="muted">29.3 万人 · 19,131 车辆等效</text>
  <text x="1244" y="402" class="label">大钟寺换乘节点</text><text x="1508" y="402" class="smallmetric" text-anchor="end">0.866×</text><rect x="1244" y="414" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="414" width="169" height="10" rx="5" fill="#38bdf8"/><text x="1244" y="443" class="muted">155.5 万人流入 · 流量守恒</text>
  <text x="1244" y="486" class="label">受保护骑行链</text><text x="1508" y="486" class="smallmetric" text-anchor="end">0.730×</text><rect x="1244" y="498" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="498" width="143" height="10" rx="5" fill="#4ade80"/><text x="1244" y="527" class="muted">42.3 万人 · 无车辆等效</text>
