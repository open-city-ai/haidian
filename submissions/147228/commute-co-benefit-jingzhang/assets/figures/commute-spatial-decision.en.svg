<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Spatial decision: protect the public return before dispatch</title>
  <desc id="desc">Three spatial alternatives, five design scales, three key nodes and five public rights. The current decision is HOLD; the boundary and field result are not authorised.</desc>
  <rect width="1600" height="1000" fill="#071a2b"/>
  <rect x="52" y="48" width="1496" height="108" rx="20" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="88" y="94" fill="#77e3c0" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">COMMUTE COMMONS / SPATIAL DECISION</text>
  <text x="88" y="136" fill="#f4fbff" font-family="Arial, sans-serif" font-size="36" font-weight="800">Protect the public return before dispatch</text>
  <rect x="1260" y="82" width="230" height="52" rx="26" fill="#6b3f2a" stroke="#f6c76b" stroke-width="2"/>
  <text x="1375" y="116" text-anchor="middle" fill="#f6c76b" font-family="Arial, sans-serif" font-size="22" font-weight="800">HOLD · NOT FIELD-RUN</text>

  <rect x="52" y="190" width="520" height="610" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="84" y="238" fill="#77e3c0" font-family="Arial, sans-serif" font-size="21" font-weight="800">01 / Three alternatives, no preference as proof</text>
  <rect x="84" y="274" width="456" height="132" rx="16" fill="#34252a" stroke="#d76b55" stroke-width="2"/>
  <text x="110" y="312" fill="#f6c76b" font-family="Arial, sans-serif" font-size="18" font-weight="800">ALT-A  Enterprise-first booked curb</text>
  <text x="110" y="348" fill="#f4fbff" font-family="Arial, sans-serif" font-size="16">REJECT / displaces ordinary and accessible return</text>
  <text x="110" y="379" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">One digital queue cannot replace an independent public path</text>
  <rect x="84" y="430" width="456" height="132" rx="16" fill="#403624" stroke="#f6c76b" stroke-width="2"/>
  <text x="110" y="468" fill="#f6c76b" font-family="Arial, sans-serif" font-size="18" font-weight="800">ALT-B  Three independent feeder windows</text>
  <text x="110" y="504" fill="#f4fbff" font-family="Arial, sans-serif" font-size="16">REVISE / handoff, appeal and blackout ownership split</text>
  <text x="110" y="535" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">Needs a shared receipt, maintenance roster and closeout card</text>
  <rect x="84" y="586" width="456" height="170" rx="16" fill="#123c3c" stroke="#77e3c0" stroke-width="2"/>
  <text x="110" y="624" fill="#77e3c0" font-family="Arial, sans-serif" font-size="18" font-weight="800">ALT-C  Public spine + reversible curb window</text>
  <text x="110" y="660" fill="#f4fbff" font-family="Arial, sans-serif" font-size="16">ADVANCE TO DESIGN REVIEW / professional deepening</text>
  <text x="110" y="694" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">Rail, bus, ordinary return, accessible and human paths come first</text>
  <text x="110" y="722" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">Booked service can pause and be removed; not authorised or operated</text>

  <rect x="604" y="190" width="430" height="610" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="636" y="238" fill="#77e3c0" font-family="Arial, sans-serif" font-size="21" font-weight="800">02 / Five scales, one question at each</text>
  <g font-family="Arial, sans-serif">
    <rect x="636" y="274" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="305" fill="#f4fbff" font-size="17" font-weight="800">1:5000  Rail—bus—public spine</text><text x="660" y="330" fill="#91b5bf" font-size="13">Read the regional full-day backbone</text>
    <rect x="636" y="362" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="393" fill="#f4fbff" font-size="17" font-weight="800">1:2000  Three nodes and handoffs</text><text x="660" y="418" fill="#91b5bf" font-size="13">Read care, arrival and maintenance encounters</text>
    <rect x="636" y="450" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="481" fill="#f4fbff" font-size="17" font-weight="800">1:500  Station / curb interface</text><text x="660" y="506" fill="#91b5bf" font-size="13">Read ordinary, accessible and human paths</text>
    <rect x="636" y="538" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="569" fill="#f4fbff" font-size="17" font-weight="800">1:200  Wait—handoff—retreat section</text><text x="660" y="594" fill="#91b5bf" font-size="13">Keep booked/service off the public route</text>
    <rect x="636" y="626" width="366" height="100" rx="12" fill="#102f42"/><text x="660" y="657" fill="#f4fbff" font-size="17" font-weight="800">1:50  Paper receipt and removable edge</text><text x="660" y="682" fill="#91b5bf" font-size="13">Read takeover, blackout and appeal</text><text x="660" y="706" fill="#f6c76b" font-size="13" font-weight="700">Concept scales; survey and professional review pending</text>
  </g>

  <rect x="1066" y="190" width="482" height="610" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="1098" y="238" fill="#77e3c0" font-family="Arial, sans-serif" font-size="21" font-weight="800">03 / Three nodes × five rights</text>
  <g font-family="Arial, sans-serif">
    <path d="M1136 318 C1230 270, 1330 270, 1430 318 C1330 366, 1230 366, 1136 318Z" fill="none" stroke="#77e3c0" stroke-width="5"/>
    <circle cx="1136" cy="318" r="22" fill="#e76f51"/><circle cx="1282" cy="318" r="22" fill="#f6c76b"/><circle cx="1430" cy="318" r="22" fill="#77e3c0"/>
    <text x="1136" y="370" text-anchor="middle" fill="#f4fbff" font-size="14" font-weight="700">Zhongzhiyuan</text><text x="1282" y="370" text-anchor="middle" fill="#f4fbff" font-size="14" font-weight="700">AI Origin</text><text x="1430" y="370" text-anchor="middle" fill="#f4fbff" font-size="14" font-weight="700">Dazhongsi</text>
    <text x="1100" y="430" fill="#f4fbff" font-size="16" font-weight="800">Public rights before efficiency readouts:</text>
    <text x="1100" y="466" fill="#a9c8d1" font-size="15">01  Ordinary walking, bus and rail access</text>
    <text x="1100" y="500" fill="#a9c8d1" font-size="15">02  Continuous accessible route and help</text>
    <text x="1100" y="534" fill="#a9c8d1" font-size="15">03  Rail and bus stay in the denominator</text>
    <text x="1100" y="568" fill="#a9c8d1" font-size="15">04  Paper, phone, appeal and pause</text>
    <text x="1100" y="602" fill="#a9c8d1" font-size="15">05  Aggregated need, exit and deletion receipt</text>
    <rect x="1100" y="648" width="414" height="98" rx="14" fill="#102f42" stroke="#f6c76b" stroke-width="2"/>
    <text x="1124" y="684" fill="#f6c76b" font-size="16" font-weight="800">CURRENT STATE</text>
    <text x="1124" y="714" fill="#f4fbff" font-size="14">HOLD · provisional · authorization 0 · field claims 0</text>
  </g>
  <rect x="52" y="842" width="1496" height="98" rx="18" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="84" y="882" fill="#77e3c0" font-family="Arial, sans-serif" font-size="16" font-weight="800">READ THIS BOARD AS A DESIGN CONTRACT</text>
  <text x="84" y="912" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">Source: local package contract and provisional geometry. No field observation, operating permit, resident sample, capacity result, public ranking or implementation claim.</text>
</svg>
