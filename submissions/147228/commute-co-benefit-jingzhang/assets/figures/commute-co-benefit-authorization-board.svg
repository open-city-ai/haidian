  <title id="title">从合成屏查到现场授权：通勤共益的证据阶梯</title><desc id="desc">当前停在 P0 · 先补证据，再谈小试；空中候选保持阻断</desc>
  <style>.bg{fill:#071a2b}.panel{fill:#0e2a3c;stroke:#275369;stroke-width:2}.title{font:800 36px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f4fbff}.sub{font:500 18px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#a9c8d1}.stage-id{font:900 15px SFMono-Regular,Consolas,monospace;fill:#071a2b}.stage-title{font:800 21px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f4fbff}.status{font:800 13px SFMono-Regular,Consolas,monospace;fill:#77e3c0;letter-spacing:1px}.stage-copy{font:600 15px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#dceef2}.stage-copy-tight{font:600 13px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#dceef2}.small{font:600 13px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#91b5bf}.value{font:800 20px SFMono-Regular,Consolas,monospace;fill:#f4fbff}.section{font:800 18px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#77e3c0}.evidence-row{font:600 16px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#e0eff2}.foot{font:500 14px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#a9c8d1}.warning{font:600 14px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f6c76b}.footer{font:700 16px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f4fbff}</style>
  <rect width="1800" height="1000" class="bg"/><circle cx="1700" cy="60" r="280" fill="#2a9d8f" opacity=".12"/><circle cx="90" cy="940" r="260" fill="#5b8def" opacity=".11"/>
  <text x="64" y="64" class="title" text-anchor="start">从合成屏查到现场授权：通勤共益的证据阶梯</text><text x="66" y="100" class="sub" text-anchor="start">当前停在 P0 · 先补证据，再谈小试；空中候选保持阻断</text>
  <rect x="52" y="140" width="1696" height="290" rx="26" class="panel"/><path d="M 428 272 H 436" stroke="#52758a" stroke-width="4" stroke-linecap="round"/><path d="M 422 260 L 438 272 L 422 284" fill="none" stroke="#52758a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="64" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#77e3c0" stroke-width="3"/><circle cx="100" cy="216" r="20" fill="#77e3c0"/><text x="100" y="223" class="stage-id" text-anchor="middle">P0</text><text x="134" y="221" class="stage-title" text-anchor="start">登记与基线</text><text x="90" y="260" class="status" text-anchor="start">当前停留</text><text x="90" y="305" class="stage-copy" text-anchor="start">当前停在这里：补日期化分组证据</text><text x="90" y="348" class="small" text-anchor="start">进入证据</text><text x="90" y="372" class="value" text-anchor="start">5 项</text></g><path d="M 806 272 H 814" stroke="#52758a" stroke-width="4" stroke-linecap="round"/><path d="M 800 260 L 816 272 L 800 284" fill="none" stroke="#52758a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="442" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#79a9ff" stroke-width="3"/><circle cx="478" cy="216" r="20" fill="#79a9ff"/><text x="478" y="223" class="stage-id" text-anchor="middle">P1</text><text x="512" y="221" class="stage-title" text-anchor="start">可逆小试</text><text x="468" y="260" class="status" text-anchor="start">待前一阶段</text><text x="468" y="305" class="stage-copy" text-anchor="start">只试一条最小活动链，现场人员可以随时接管</text><text x="468" y="348" class="small" text-anchor="start">进入证据</text><text x="468" y="372" class="value" text-anchor="start">4 项</text></g><path d="M 1184 272 H 1192" stroke="#52758a" stroke-width="4" stroke-linecap="round"/><path d="M 1178 260 L 1194 272 L 1178 284" fill="none" stroke="#52758a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="820" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#f6c76b" stroke-width="3"/><circle cx="856" cy="216" r="20" fill="#f6c76b"/><text x="856" y="223" class="stage-id" text-anchor="middle">P2</text><text x="890" y="221" class="stage-title" text-anchor="start">条件扩展</text><text x="846" y="260" class="status" text-anchor="start">待前一阶段</text><text x="846" y="305" class="stage-copy" text-anchor="start">只有证据闭合后，才讨论扩大时段、方式和服务范围</text><text x="846" y="348" class="small" text-anchor="start">进入证据</text><text x="846" y="372" class="value" text-anchor="start">5 项</text></g><g><rect x="1198" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#ef829d" stroke-width="3"/><circle cx="1234" cy="216" r="20" fill="#ef829d"/><text x="1234" y="223" class="stage-id" text-anchor="middle">A1</text><text x="1268" y="221" class="stage-title" text-anchor="start">空中候选</text><text x="1224" y="260" class="status" text-anchor="start">阻断</text><text x="1224" y="305" class="stage-copy" text-anchor="start">不用于填补地面证据缺口，不进入当前政策排名</text><text x="1224" y="348" class="small" text-anchor="start">进入证据</text><text x="1224" y="372" class="value" text-anchor="start">3 项</text></g>
  <rect x="52" y="462" width="820" height="340" rx="24" class="panel"/><rect x="900" y="462" width="848" height="340" rx="24" class="panel"/>
  <text x="84" y="510" class="section" text-anchor="start">P0 必须先补齐的证据</text><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">分组 OD 与企业错峰接受</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">地铁公交班次、站点和路缘容量</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">居民照护、无障碍和夜间回家验证</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">投诉处理与人工回退演练</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">隐私抑制、留存和删除证明</text></g>
  <text x="932" y="510" class="section" text-anchor="start">模型现在能说什么</text><text x="970" y="520" class="foot" text-anchor="start">1. 全量合成屏查可复算</text><text x="970" y="548" class="foot" text-anchor="start">2. 地面政策包通过声明硬门</text><text x="970" y="576" class="foot" text-anchor="start">3. 下一步责任、字段和停止动作明确</text><text x="932" y="622" class="section" text-anchor="start">模型现在不能说什么</text><text x="970" y="650" class="warning" text-anchor="start">1. 居民同意或员工采纳</text><text x="970" y="678" class="warning" text-anchor="start">2. 本地 OD、运力或运行改善</text><text x="970" y="706" class="warning" text-anchor="start">3. 许可、合作、公众参与或空中审批</text>
  <rect x="52" y="844" width="1696" height="92" rx="20" fill="#102f42" stroke="#f6c76b" stroke-width="2"/><text x="82" y="886" class="footer" text-anchor="start">决策规则：当前只登记，不预约，不扩容。任一证据过期、保护组变差或责任缺位，回到 P0；所有地面与人工回退继续保留。</text><text x="82" y="914" class="small" text-anchor="start">来源：commute-co-benefit-contract.json · authorization register · aggregate only · no operating approval</text>
</svg>