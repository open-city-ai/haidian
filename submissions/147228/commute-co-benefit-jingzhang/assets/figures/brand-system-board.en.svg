<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">COMMUTE CO-BENEFIT COMMONS: IDENTITY AND PUBLIC EXPERIENCE ENTRIES</title><desc id="desc">Three key areas form a future route for observing, using and reviewing the system; unscheduled and unauthorised</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123E4A"/></linearGradient><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.title{font-size:31px;font-weight:850;fill:#F5FBFF}.sub{font-size:15px;fill:#A9C7D4}.brand{font-size:42px;font-weight:900;fill:#F5FBFF;letter-spacing:2px}.brandEn{font-size:16px;font-weight:800;fill:#66E3CA;letter-spacing:3px}.nodeId{font:900 13px Arial,sans-serif}.nodeTitle{font:800 20px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#F5FBFF}.label{font:800 11px Arial,PingFang SC,sans-serif;letter-spacing:1px}.body{font:500 15px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#D8EAF0}.status{font:800 11px Arial,PingFang SC,sans-serif;fill:#9CF2DE}</style></defs><rect width="1600" height="980" fill="url(#bg)"/><circle cx="1470" cy="80" r="310" fill="#2A9D8F" opacity=".14"/><circle cx="80" cy="900" r="260" fill="#5B8DEF" opacity=".12"/><text x="70" y="56" class="sans" fill="#66E3CA" font-size="17" font-weight="900" letter-spacing="3">COMMUTE CO-BENEFIT COMMONS / BRAND SYSTEM</text><text x="70" y="98" class="sans title">COMMUTE CO-BENEFIT COMMONS: IDENTITY AND PUBLIC EXPERIENCE ENTRIES</text><text x="70" y="125" class="sans sub">Three key areas form a future route for observing, using and reviewing the system; unscheduled and unauthorised</text><g transform="translate(110 180)"><circle cx="70" cy="70" r="58" fill="none" stroke="#55E4C1" stroke-width="10" stroke-dasharray="220 90"/><circle cx="70" cy="8" r="13" fill="#7DA8FF"/><circle cx="16" cy="104" r="13" fill="#F082A7"/><circle cx="124" cy="104" r="13" fill="#F7BF63"/><path d="M70 8 L16 104 L124 104 Z" fill="none" stroke="#D8EAF0" stroke-width="3" opacity=".9"/><circle cx="70" cy="70" r="10" fill="#F5FBFF"/><path d="M70 70 L70 8" stroke="#F5FBFF" stroke-width="4"/></g><text x="280" y="230" class="brand">通勤共益调度台</text><text x="282" y="263" class="brandEn">COMMUTE CO-BENEFIT NETWORK</text><text x="282" y="310" class="sub">One reversible activity chain for enterprise arrival, daily life and rail transfer</text><text x="282" y="356" class="body">Enterprise, resident and rail entrances share an activity chain that keeps a human exit</text><path d="M280 390 H1320" stroke="#2D5366"/><text x="90" y="425" class="label" fill="#66E3CA">THREE PUBLIC EXPERIENCE NODES</text><g><rect x="90" y="450" width="430" height="318" rx="24" fill="#102A3A" stroke="#2D5366" stroke-width="2"/><rect x="90" y="450" width="10" height="318" rx="5" fill="#55E4C1"/><circle cx="144" cy="510" r="24" fill="#071A2B" stroke="#55E4C1" stroke-width="5"/><text x="144" y="517" text-anchor="middle" class="nodeId" fill="#55E4C1">P-01</text><text x="186" y="512" class="nodeTitle">Zhongzhiyuan · enterprise mobility desk</text><text x="120" y="570" class="label" fill="#55E4C1">PUBLIC ROLE</text><text x="120" y="600" class="body">Read grouped commuting and curb status</text><text x="120" y="648" class="label" fill="#55E4C1">ACCESS</text><text x="120" y="678" class="body">Public board, phone and paper access; no employee trajectories</text><text x="120" y="726" class="status">DESIGN TARGET · unknown_until_authorized</text></g><g><rect x="580" y="450" width="430" height="318" rx="24" fill="#102A3A" stroke="#2D5366" stroke-width="2"/><rect x="580" y="450" width="10" height="318" rx="5" fill="#7DA8FF"/><circle cx="634" cy="510" r="24" fill="#071A2B" stroke="#7DA8FF" stroke-width="5"/><text x="634" y="517" text-anchor="middle" class="nodeId" fill="#7DA8FF">P-02</text><text x="676" y="512" class="nodeTitle">AI Origin community · human access desk</text><text x="610" y="570" class="label" fill="#7DA8FF">PUBLIC ROLE</text><text x="610" y="600" class="body">Compare AI, human, telephone and paper access on the same daily route</text><text x="610" y="648" class="label" fill="#7DA8FF">ACCESS</text><text x="610" y="678" class="body">Residents can raise a request or objection without registration or an app</text><text x="610" y="726" class="status">DESIGN TARGET · unknown_until_authorized</text></g><g><rect x="1070" y="450" width="430" height="318" rx="24" fill="#102A3A" stroke="#2D5366" stroke-width="2"/><rect x="1070" y="450" width="10" height="318" rx="5" fill="#F082A7"/><circle cx="1124" cy="510" r="24" fill="#071A2B" stroke="#F082A7" stroke-width="5"/><text x="1124" y="517" text-anchor="middle" class="nodeId" fill="#F082A7">P-03</text><text x="1166" y="512" class="nodeTitle">Dazhongsi · rail transfer gallery</text><text x="1100" y="570" class="label" fill="#F082A7">PUBLIC ROLE</text><text x="1100" y="600" class="body">See how metro, bus, bicycle, walking and accessible routes connect</text><text x="1100" y="648" class="label" fill="#F082A7">ACCESS</text><text x="1100" y="678" class="body">Show five curb states and stop conditions, not an unauthorised air route or performance</text><text x="1100" y="726" class="status">DESIGN TARGET · unknown_until_authorized</text></g><path d="M290 832 C540 900 1060 900 1310 832" fill="none" stroke="#55E4C1" stroke-width="4" stroke-dasharray="12 12"/><text x="800" y="865" text-anchor="middle" class="body">Observe enterprise needs → use the resident entry → review rail and curb</text><text x="800" y="902" text-anchor="middle" class="sub">Treat AI pilgrimage as a public learning and review route, not a built attraction or event brand</text><text x="800" y="950" text-anchor="middle" class="status">This is an identity and public-experience contract, not an official logo, event, attraction, partnership or operating result.</text></svg>