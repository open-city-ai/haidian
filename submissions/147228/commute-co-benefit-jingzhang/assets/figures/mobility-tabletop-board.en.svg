<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">M-09 Storm/Outage Fallback: Human-Service Tabletop</title>
  <desc id="desc">Four synthetic service requests pass through trigger, freeze, human or public-transit fallback, logging and review; a tabletop pass is not service performance or authorization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#173a4b"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111f" flood-opacity=".22"/></filter>
    <style>
      .sans{font-family:"Helvetica Neue",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.white{fill:#f4fbfb}.muted{fill:#a8c2c7}.teal{fill:#70e1c3}.amber{fill:#ffd37a}.coral{fill:#ff9b8e}.ink{fill:#102b3b}.small{font-size:20px}.label{font-size:24px;font-weight:750}.value{font-size:48px;font-weight:850;letter-spacing:-1px}.title{font-size:56px;font-weight:850;letter-spacing:-2px}.card{fill:#f4f8f9}.line{stroke:#cfe2e2;stroke-width:2}.arrow{stroke:#53d7bb;stroke-width:5;fill:none;stroke-linecap:round}.number{font-size:22px;font-weight:850}.route{font-size:21px;font-weight:700}.state{font-size:20px;font-weight:800}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#53d7bb"/></marker>
  </defs>
  <rect width="2400" height="1500" fill="url(#bg)"/>
  <text x="110" y="92" class="sans teal" font-size="25" font-weight="800" letter-spacing="4">COMMUTE CO-BENEFIT COMMONS / M-09 TABLETOP / v2.16</text>
  <text x="110" y="172" class="sans white title">Storm / outage: get people through first</text>
  <text x="110" y="220" class="sans muted" font-size="25">Four synthetic requests · human and public-transit fallback · offline state replay · no performance claim</text>
  <rect x="1910" y="78" width="380" height="76" rx="38" fill="#3e2d2d" stroke="#ff9b8e" stroke-width="2"/>
  <text x="2100" y="126" text-anchor="middle" class="sans coral" font-size="22" font-weight="850">NOT AUTHORIZED / NOT RUN</text>

  <g filter="url(#shadow)">
    <rect x="110" y="285" width="515" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/><rect x="650" y="285" width="515" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/><rect x="1190" y="285" width="515" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/><rect x="1730" y="285" width="560" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/>
  </g>
  <text x="145" y="330" class="sans muted small">TABLETOP</text><text x="145" y="395" class="sans teal value">M-09</text><text x="305" y="395" class="sans white" font-size="24">storm / outage</text>
  <text x="685" y="330" class="sans muted small">REQUESTS</text><text x="685" y="395" class="sans white value">4 / 4</text><text x="900" y="395" class="sans teal" font-size="24">fallback retained</text>
  <text x="1225" y="330" class="sans muted small">ACCEPTANCE</text><text x="1225" y="395" class="sans white value">6 / 6</text><text x="1440" y="395" class="sans teal" font-size="24">checks pass</text>
  <text x="1765" y="330" class="sans muted small">ROLLBACK</text><text x="1765" y="395" class="sans amber value">5 / 5</text><text x="1980" y="395" class="sans amber" font-size="24">reversible steps</text>

  <rect x="110" y="490" width="1490" height="820" rx="30" class="card" filter="url(#shadow)"/>
  <text x="155" y="550" class="sans ink" font-size="32" font-weight="850">Read it left to right: trigger → freeze → fallback → log → review</text>
  <text x="155" y="588" class="sans" fill="#668095" font-size="20">PASS replays state and rollback logic only; it does not prove staffing, access, safety or public acceptance</text>
  <g>
    <rect x="155" y="635" width="220" height="165" rx="22" fill="#fff0ed" stroke="#ff9b8e" stroke-width="2"/><circle cx="195" cy="680" r="24" fill="#ef806c"/><text x="195" y="688" text-anchor="middle" class="sans white number">01</text><text x="235" y="687" class="sans ink label">Trigger</text><text x="180" y="735" class="sans" fill="#765d5a" font-size="19">outage / storm /</text><text x="180" y="764" class="sans" fill="#765d5a" font-size="19">stale audit / no owner</text>
    <path d="M395 718 H420" class="arrow" marker-end="url(#arrow)"/>
    <rect x="445" y="635" width="220" height="165" rx="22" fill="#fff8e5" stroke="#f6c36a" stroke-width="2"/><circle cx="485" cy="680" r="24" fill="#dda94b"/><text x="485" y="688" text-anchor="middle" class="sans white number">02</text><text x="525" y="687" class="sans ink label">Freeze</text><text x="470" y="735" class="sans" fill="#765d5a" font-size="19">freeze new bookings</text><text x="470" y="764" class="sans" fill="#765d5a" font-size="19">keep emergency clearance</text>
    <path d="M685 718 H710" class="arrow" marker-end="url(#arrow)"/>
    <rect x="735" y="635" width="220" height="165" rx="22" fill="#e8faf5" stroke="#53d7bb" stroke-width="2"/><circle cx="775" cy="680" r="24" fill="#2db79d"/><text x="775" y="688" text-anchor="middle" class="sans white number">03</text><text x="815" y="687" class="sans ink label">Fallback</text><text x="760" y="735" class="sans" fill="#416c69" font-size="19">human / phone / paper</text><text x="760" y="764" class="sans" fill="#416c69" font-size="19">public transit / wayfinding</text>
    <path d="M975 718 H1000" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1025" y="635" width="220" height="165" rx="22" fill="#edf5ff" stroke="#6da7ff" stroke-width="2"/><circle cx="1065" cy="680" r="24" fill="#548fe0"/><text x="1065" y="688" text-anchor="middle" class="sans white number">04</text><text x="1105" y="687" class="sans ink label">Log</text><text x="1050" y="735" class="sans" fill="#506b8d" font-size="19">unresolved requests</text><text x="1050" y="764" class="sans" fill="#506b8d" font-size="19">owner / gap / date</text>
    <path d="M1265 718 H1290" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1315" y="635" width="220" height="165" rx="22" fill="#f1edff" stroke="#9d8be8" stroke-width="2"/><circle cx="1355" cy="680" r="24" fill="#806bd1"/><text x="1355" y="688" text-anchor="middle" class="sans white number">05</text><text x="1395" y="687" class="sans ink label">Review</text><text x="1340" y="730" class="sans" fill="#62558e" font-size="18">dated baseline /</text><text x="1340" y="758" class="sans" fill="#62558e" font-size="18">accessibility audit</text><text x="1340" y="786" class="sans" fill="#62558e" font-size="18">no P1 / P2 advance</text>
  </g>
  <rect x="155" y="850" width="1365" height="390" rx="20" fill="#f9fbfb" stroke="#d6e6e8"/>
  <text x="195" y="900" class="sans" fill="#668095" font-size="18" font-weight="800">SERVICE REQUEST / GROUP</text><text x="555" y="900" class="sans" fill="#668095" font-size="18" font-weight="800">RETAINED FALLBACK</text><text x="1255" y="900" class="sans" fill="#668095" font-size="18" font-weight="800">STATE</text><line x1="195" y1="925" x2="1480" y2="925" class="line"/>
  <text x="195" y="975" class="sans ink route">Resident daily care</text><text x="555" y="975" class="sans" fill="#416c69" font-size="20">human / bus / phone / paper</text><rect x="1255" y="948" width="190" height="38" rx="19" fill="#e8faf5"/><text x="1350" y="974" text-anchor="middle" class="sans teal state">FALLBACK</text><line x1="195" y1="1005" x2="1480" y2="1005" class="line"/>
  <text x="195" y="1055" class="sans ink route">Wheelchair-accessible route</text><text x="555" y="1055" class="sans" fill="#416c69" font-size="20">human route audit / assistance</text><rect x="1255" y="1028" width="190" height="38" rx="19" fill="#e8faf5"/><text x="1350" y="1054" text-anchor="middle" class="sans teal state">FALLBACK</text><line x1="195" y1="1085" x2="1480" y2="1085" class="line"/>
  <text x="195" y="1135" class="sans ink route">Enterprise shuttle window</text><text x="555" y="1135" class="sans" fill="#765d5a" font-size="20">public transit / manual dispatch</text><rect x="1255" y="1108" width="190" height="38" rx="19" fill="#fff8e5"/><text x="1350" y="1134" text-anchor="middle" class="sans state" fill="#a67821">RESERVATION FROZEN</text><line x1="195" y1="1165" x2="1480" y2="1165" class="line"/>
  <text x="195" y="1215" class="sans ink route">Rail last-mile transfer</text><text x="555" y="1215" class="sans" fill="#416c69" font-size="20">staffed wayfinding / public transit</text><rect x="1255" y="1188" width="190" height="38" rx="19" fill="#e8faf5"/><text x="1350" y="1214" text-anchor="middle" class="sans teal state">FALLBACK</text>

  <rect x="1640" y="490" width="650" height="820" rx="30" class="card" filter="url(#shadow)"/>
  <text x="1685" y="550" class="sans ink" font-size="32" font-weight="850">Boundary before beauty</text><text x="1685" y="588" class="sans" fill="#668095" font-size="20">WHAT THIS PASS DOES / DOES NOT SAY</text>
  <rect x="1685" y="635" width="560" height="105" rx="18" fill="#fff0ed" stroke="#ff9b8e" stroke-width="2"/><text x="1720" y="676" class="sans" fill="#b55043" font-size="20" font-weight="850">PERFORMANCE_RESULTS</text><text x="1720" y="716" class="mono" fill="#b55043" font-size="30" font-weight="850">null</text>
  <rect x="1685" y="765" width="560" height="105" rx="18" fill="#f5f8fa" stroke="#d6e6e8"/><text x="1720" y="806" class="sans" fill="#668095" font-size="20" font-weight="850">LOCAL_BASELINE</text><text x="1720" y="846" class="mono ink" font-size="30" font-weight="850">unknown</text>
  <rect x="1685" y="895" width="560" height="105" rx="18" fill="#f5f8fa" stroke="#d6e6e8"/><text x="1720" y="936" class="sans" fill="#668095" font-size="20" font-weight="850">GATE_EFFECT</text><text x="1720" y="976" class="mono ink" font-size="30" font-weight="850">none</text>
  <rect x="1685" y="1030" width="560" height="135" rx="18" fill="#102d43" stroke="#2c6370"/><text x="1720" y="1074" class="sans teal" font-size="21" font-weight="850">NEXT</text><text x="1720" y="1115" class="sans white" font-size="21">Collect dated baseline, owners and</text><text x="1720" y="1149" class="sans white" font-size="21">accessibility audit; no P1 / P2 advance</text>
  <text x="1685" y="1220" class="sans" fill="#668095" font-size="18">network calls 0 · external systems none · state in-memory only</text>
  <rect x="110" y="1370" width="2180" height="62" rx="18" fill="#102d43" stroke="#2c6370"/><text x="150" y="1410" class="sans white" font-size="19" font-weight="750">M-09 TABLETOP PASS = fallback / freeze / rollback logic replayed　·　not service availability　·　not accessibility performance　·　not safety authorization</text>
</svg>
