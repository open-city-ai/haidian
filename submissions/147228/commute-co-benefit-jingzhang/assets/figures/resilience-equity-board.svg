<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="title desc">
  <title id="title">中断与天气压力测试：地面回退、最弱群体与空中硬门</title>
  <desc id="desc">三种合成压力事件、地面回退覆盖率、轮椅使用者差距和恢复时间代理，以及空中交通硬门。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFF"/><stop offset="1" stop-color="#EAF3F8"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1830"/><stop offset="1" stop-color="#163B5B"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17A398"/><stop offset="1" stop-color="#64D4BF"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3A63B"/><stop offset="1" stop-color="#FFD07A"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0B1830" flood-opacity=".12"/></filter>
    <style>
      .sans{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:58px;font-weight:800;fill:#F7FBFF}.subtitle{font-size:25px;fill:#B8D4E3}.kicker{font-size:20px;font-weight:800;letter-spacing:3px;fill:#70D7C5}.h2{font-size:30px;font-weight:800;fill:#10243B}.body{font-size:23px;fill:#486176}.small{font-size:19px;fill:#638097}.tiny{font-size:16px;fill:#7691A3}.num{font-size:52px;font-weight:800;fill:#10243B}.card{fill:#FFFFFF;stroke:#D6E5EC;stroke-width:2}.chip{font-size:18px;font-weight:700;fill:#0F6B68}.label{font-size:19px;font-weight:700;fill:#486176}.white{fill:#F7FBFF}.axis{stroke:#D5E3EB;stroke-width:2}.line{stroke:#C7D9E3;stroke-width:4}.good{fill:#18A398}.warn{fill:#F3A63B}.bad{fill:#E56B6F}.muted{fill:#BFD2DD}
    </style>
  </defs>
  <rect width="2400" height="1700" fill="url(#bg)"/>
  <rect x="70" y="65" width="2260" height="330" rx="34" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="135" y="125" class="sans kicker">B3  /  MODEL v1.3  /  GROUND-FIRST RESILIENCE</text>
  <text x="135" y="205" class="sans title">中断与天气压力测试</text>
  <text x="135" y="265" class="sans subtitle">地面回退覆盖率 × 最弱群体 × 恢复时间　|　1000 人归一化设计单位 · 合成敏感性，不是现状基线</text>
  <rect x="1965" y="115" width="285" height="76" rx="38" fill="#123E4B" stroke="#5ED6C2" stroke-width="2"/>
  <text x="2107" y="163" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#7EE5D0">AIR CANDIDATE</text>
  <text x="2107" y="224" text-anchor="middle" class="sans" font-size="28" font-weight="800" fill="#FFD07A">BLOCKED / 闸门未通过</text>
  <text x="135" y="338" class="sans small" fill="#CFE5EF">先保住地铁、公交、步行/轮椅和人工服务，再谈未来空中层；不使用个人轨迹。</text>

  <rect x="70" y="440" width="1050" height="770" rx="28" class="card" filter="url(#shadow)"/>
  <text x="125" y="510" class="sans h2">三种事件：回退是否接得住？</text>
  <text x="125" y="552" class="sans small">受影响方式的未满足需求进入声明的地面回退；覆盖率不是全网完成率。</text>
  <line x1="125" y1="625" x2="1030" y2="625" class="axis"/>
  <text x="125" y="605" class="sans tiny">地面回退覆盖率</text>
  <text x="1030" y="605" text-anchor="end" class="sans tiny">目标 ≥ 70%</text>
  <line x1="760" y1="640" x2="760" y2="1035" stroke="#F3A63B" stroke-width="3" stroke-dasharray="10 12"/>
  <text x="760" y="1066" text-anchor="middle" class="sans tiny" fill="#B27616">70% 闸值</text>
  <g class="sans">
    <text x="125" y="700" class="label">R0  正常地面优先</text><text x="1030" y="700" text-anchor="end" class="num">100%</text>
    <rect x="125" y="720" width="850" height="34" rx="17" fill="#E5F1F2"/><rect x="125" y="720" width="850" height="34" rx="17" fill="url(#teal)"/>
    <text x="125" y="792" class="small">无中断 · 空中候选仍关闭 · 保持地面网络</text>
    <text x="125" y="865" class="label">R1  地铁区段中断 30 min</text><text x="1030" y="865" text-anchor="end" class="num">76.92%</text>
    <rect x="125" y="885" width="850" height="34" rx="17" fill="#E5F1F2"/><rect x="125" y="885" width="654" height="34" rx="17" fill="url(#teal)"/>
    <text x="125" y="957" class="small">metro → bus · 公交临时增能 · 优先轮椅/照护链</text>
    <text x="125" y="1030" class="label">R2  强天气：自行车退出</text><text x="1030" y="1030" text-anchor="end" class="num">72.14%</text>
    <rect x="125" y="1050" width="850" height="34" rx="17" fill="#E5F1F2"/><rect x="125" y="1050" width="613" height="34" rx="17" fill="url(#amber)"/>
    <text x="125" y="1122" class="small">bicycle → bus · 步行/轮椅连续性不交给空中候选</text>
  </g>

  <rect x="1160" y="440" width="1170" height="770" rx="28" class="card" filter="url(#shadow)"/>
  <text x="1215" y="510" class="sans h2">最弱群体护栏：不只看平均效率</text>
  <text x="1215" y="552" class="sans small">差距与恢复为透明代理分；正式运行前必须换成分组 p90 与路线审计。</text>
  <text x="1215" y="635" class="sans label">轮椅使用者（两种压力事件均为最弱组）</text>
  <rect x="1215" y="675" width="1010" height="210" rx="22" fill="#F5F9FB" stroke="#DDEAF0" stroke-width="2"/>
  <text x="1260" y="730" class="sans small">差距代理分</text><text x="1260" y="790" class="sans num">12.20</text><text x="1450" y="790" class="sans small">R1 地铁中断</text>
  <text x="1780" y="790" class="sans num">13.36</text><text x="1980" y="790" class="sans small">R2 强天气</text>
  <rect x="1260" y="820" width="840" height="12" rx="6" fill="#E5EDF1"/><rect x="1260" y="820" width="427" height="12" rx="6" fill="url(#teal)"/><rect x="1260" y="852" width="840" height="12" rx="6" fill="#E5EDF1"/><rect x="1260" y="852" width="468" height="12" rx="6" fill="url(#amber)"/>
  <text x="2130" y="830" class="sans tiny">24 上限</text><text x="2130" y="862" class="sans tiny">24 上限</text>
  <text x="1215" y="950" class="sans label">恢复时间代理</text>
  <rect x="1215" y="985" width="1010" height="150" rx="22" fill="#F5F9FB" stroke="#DDEAF0" stroke-width="2"/>
  <text x="1260" y="1045" class="sans num">27.30 min</text><text x="1610" y="1045" class="sans small">R1 metro disruption</text>
  <text x="1260" y="1100" class="sans num">30.04 min</text><text x="1610" y="1100" class="sans small">R2 severe weather</text>
  <rect x="2030" y="1018" width="155" height="76" rx="38" fill="#E2F4EF"/><text x="2107" y="1065" text-anchor="middle" class="sans" font-size="21" font-weight="800" fill="#10766D">≤ 45 min</text>

  <rect x="70" y="1270" width="2260" height="320" rx="28" fill="#10243B" filter="url(#shadow)"/>
  <text x="125" y="1340" class="sans" font-size="28" font-weight="800" fill="#F7FBFF">回退链：事件 → 地面服务 → 复核</text>
  <g class="sans">
    <rect x="125" y="1380" width="400" height="120" rx="18" fill="#193A54"/><text x="155" y="1430" font-size="22" font-weight="800" fill="#7EE5D0">01  检测</text><text x="155" y="1470" font-size="18" fill="#CFE5EF">中断 / 天气 / 取消记录</text>
    <path d="M550 1440 H650" stroke="#70D7C5" stroke-width="5"/><path d="M650 1440 l-18 -12 v24 z" fill="#70D7C5"/>
    <rect x="680" y="1380" width="520" height="120" rx="18" fill="#193A54"/><text x="710" y="1430" font-size="22" font-weight="800" fill="#7EE5D0">02  回退</text><text x="710" y="1470" font-size="18" fill="#CFE5EF">metro / bicycle → bus；人工服务优先</text>
    <path d="M1225 1440 H1325" stroke="#70D7C5" stroke-width="5"/><path d="M1325 1440 l-18 -12 v24 z" fill="#70D7C5"/>
    <rect x="1355" y="1380" width="430" height="120" rx="18" fill="#193A54"/><text x="1385" y="1430" font-size="22" font-weight="800" fill="#7EE5D0">03  复核</text><text x="1385" y="1470" font-size="18" fill="#CFE5EF">覆盖率 / gap / p90 / 投诉闭环</text>
    <path d="M1810 1440 H1910" stroke="#F3A63B" stroke-width="5"/><path d="M1910 1440 l-18 -12 v24 z" fill="#F3A63B"/>
    <rect x="1940" y="1380" width="330" height="120" rx="18" fill="#3C2D29" stroke="#F3A63B" stroke-width="2"/><text x="1970" y="1430" font-size="22" font-weight="800" fill="#FFD07A">STOP / GO</text><text x="1970" y="1470" font-size="18" fill="#FFE4B0">不达标就重设计</text>
  </g>
  <text x="125" y="1555" class="sans" font-size="18" fill="#A7C7D5">合成压力测试 · 分组 OD · 无个人轨迹 · 空中候选仅为受门禁的未来实验，不替代许可、保险、噪声、消防与运营证据</text>
</svg>
