<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Cross-boundary commute and people flow: multimodal choice contract</title>
  <desc id="desc">Grouped enterprise, resident, care, logistics and night-worker journeys share a mode and departure-time choice framework; all values await local calibration and the air candidate remains blocked.</desc>
  <rect width="1200" height="900" fill="#f7f3ed"/>
  <text x="62" y="58" fill="#2a9d8f" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">COMMUTE CO-BENEFIT COMMONS / 147228</text>
  <text x="1138" y="58" text-anchor="end" fill="#2a9d8f" font-family="Arial, sans-serif" font-size="16" font-weight="700">CHOICE CONTRACT / v1.3</text>
  <text x="62" y="116" fill="#10233f" font-family="Arial, sans-serif" font-size="36" font-weight="700">Cross-boundary commute &amp; people flow</text>
  <text x="62" y="150" fill="#7890af" font-family="Arial, sans-serif" font-size="18">Mode × departure time × transfer crowding · grouped OD · not a local performance claim</text>
  <g font-family="Arial, sans-serif">
    <rect x="62" y="184" width="247" height="84" rx="16" fill="#10233f"/><text x="88" y="214" fill="#a7f3d0" font-size="13" font-weight="700">CHOICE SET</text><text x="88" y="251" fill="#fff" font-size="28" font-weight="700">7</text><text x="132" y="247" fill="#c7d2fe" font-size="14">mode alternatives</text>
    <rect x="325" y="184" width="247" height="84" rx="16" fill="#fff" stroke="#d9e2e8"/><text x="351" y="214" fill="#2a9d8f" font-size="13" font-weight="700">GROUPED AGENTS</text><text x="351" y="251" fill="#10233f" font-size="28" font-weight="700">9</text><text x="395" y="247" fill="#7890af" font-size="14">journey cohorts</text>
    <rect x="588" y="184" width="247" height="84" rx="16" fill="#fff" stroke="#d9e2e8"/><text x="614" y="214" fill="#e76f51" font-size="13" font-weight="700">HARD GATES</text><text x="614" y="251" fill="#10233f" font-size="28" font-weight="700">5</text><text x="658" y="247" fill="#7890af" font-size="14">pre-screen rules</text>
    <rect x="851" y="184" width="287" height="84" rx="16" fill="#e8f6f3" stroke="#b7e4dc"/><text x="877" y="214" fill="#0e8f83" font-size="13" font-weight="700">PRIVACY</text><text x="877" y="251" fill="#10233f" font-size="28" font-weight="700">0</text><text x="921" y="247" fill="#7890af" font-size="14">personal trajectories</text>
  </g>
  <rect x="62" y="296" width="724" height="440" rx="18" fill="#fff" stroke="#d9e2e8"/>
  <text x="92" y="337" fill="#10233f" font-family="Arial, sans-serif" font-size="22" font-weight="700">GROUPED JOURNEYS</text>
  <text x="92" y="364" fill="#7890af" font-family="Arial, sans-serif" font-size="14">Every chain records boundary direction, time window, mode, transfer and fallback; only aggregate changes are published.</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <text x="92" y="407" fill="#10233f" font-weight="700">External enterprise commute</text><text x="92" y="425" fill="#7890af" font-size="11">OD / arrival window</text>
    <line x1="254" y1="414" x2="694" y2="414" stroke="#d8e5e5" stroke-width="6" stroke-linecap="round"/><circle cx="270" cy="414" r="12" fill="#e76f51"/><circle cx="405" cy="414" r="12" fill="#2a9d8f"/><circle cx="535" cy="414" r="12" fill="#667eea"/><circle cx="680" cy="414" r="12" fill="#10233f"/>
    <text x="270" y="393" text-anchor="middle" fill="#e76f51" font-weight="700">boundary</text><text x="405" y="393" text-anchor="middle" fill="#0e8f83">metro / bus</text><text x="535" y="393" text-anchor="middle" fill="#667eea">transfer buffer</text><text x="680" y="393" text-anchor="middle" fill="#10233f">enterprise gate</text>
    <text x="92" y="489" fill="#10233f" font-weight="700">Resident daily service</text><text x="92" y="507" fill="#7890af" font-size="11">care / school / health</text>
    <line x1="254" y1="496" x2="694" y2="496" stroke="#d8e5e5" stroke-width="6" stroke-linecap="round"/><circle cx="270" cy="496" r="12" fill="#f4a261"/><circle cx="405" cy="496" r="12" fill="#2a9d8f"/><circle cx="535" cy="496" r="12" fill="#f4a261"/><circle cx="680" cy="496" r="12" fill="#10233f"/>
    <text x="270" y="475" text-anchor="middle" fill="#f4a261" font-weight="700">service origin</text><text x="405" y="475" text-anchor="middle" fill="#0e8f83">walk / access</text><text x="535" y="475" text-anchor="middle" fill="#c87924">bus / rail</text><text x="680" y="475" text-anchor="middle" fill="#10233f">complete / fallback</text>
    <text x="92" y="571" fill="#10233f" font-weight="700">Carers &amp; children</text><text x="92" y="589" fill="#7890af" font-size="11">human-equivalent route</text>
    <line x1="254" y1="578" x2="694" y2="578" stroke="#d8e5e5" stroke-width="6" stroke-linecap="round"/><circle cx="270" cy="578" r="12" fill="#d45087"/><circle cx="405" cy="578" r="12" fill="#d45087"/><circle cx="535" cy="578" r="12" fill="#667eea"/><circle cx="680" cy="578" r="12" fill="#10233f"/>
    <text x="270" y="557" text-anchor="middle" fill="#d45087" font-weight="700">care chain</text><text x="405" y="557" text-anchor="middle" fill="#d45087">human assist</text><text x="535" y="557" text-anchor="middle" fill="#667eea">safe crossing</text><text x="680" y="557" text-anchor="middle" fill="#10233f">no downgrade</text>
    <text x="92" y="653" fill="#10233f" font-weight="700">Logistics &amp; night work</text><text x="92" y="671" fill="#7890af" font-size="11">curb window / safe return</text>
    <line x1="254" y1="660" x2="694" y2="660" stroke="#d8e5e5" stroke-width="6" stroke-linecap="round"/><circle cx="270" cy="660" r="12" fill="#f4a261"/><circle cx="405" cy="660" r="12" fill="#e76f51"/><circle cx="535" cy="660" r="12" fill="#2a9d8f"/><circle cx="680" cy="660" r="12" fill="#10233f"/>
    <text x="270" y="639" text-anchor="middle" fill="#c87924" font-weight="700">boundary</text><text x="405" y="639" text-anchor="middle" fill="#e76f51">car / service</text><text x="535" y="639" text-anchor="middle" fill="#0e8f83">window / human</text><text x="680" y="639" text-anchor="middle" fill="#10233f">clear / return</text>
  </g>
  <rect x="812" y="296" width="326" height="440" rx="18" fill="#10233f"/>
  <text x="842" y="337" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="22" font-weight="700">GENERALIZED COST</text>
  <text x="842" y="364" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="14">Hard gates first, Pareto comparison second</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <text x="842" y="407" fill="#fff">Door-to-door time</text><text x="1108" y="407" text-anchor="end" fill="#a7f3d0">p50 / p90</text><line x1="842" y1="421" x2="1108" y2="421" stroke="#4b6381"/>
    <text x="842" y="455" fill="#fff">Schedule flexibility</text><text x="1108" y="455" text-anchor="end" fill="#a7f3d0">schedule</text><line x1="842" y1="469" x2="1108" y2="469" stroke="#4b6381"/>
    <text x="842" y="503" fill="#fff">Crowding / transfer</text><text x="1108" y="503" text-anchor="end" fill="#a7f3d0">load + wait</text><line x1="842" y1="517" x2="1108" y2="517" stroke="#4b6381"/>
    <text x="842" y="551" fill="#fff">Curb / parking</text><text x="1108" y="551" text-anchor="end" fill="#a7f3d0">curb + park</text><line x1="842" y1="565" x2="1108" y2="565" stroke="#4b6381"/>
    <text x="842" y="599" fill="#fff">Equity / slowest group</text><text x="1108" y="599" text-anchor="end" fill="#f9b267">equity</text>
  </g>
  <rect x="842" y="632" width="266" height="72" rx="12" fill="#1d385d"/><text x="862" y="657" fill="#f9b267" font-family="Arial, sans-serif" font-size="13" font-weight="700">BLOCKED AIR CANDIDATE</text><text x="862" y="682" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="12">ground first · weather cancel · no route drawn</text>
  <rect x="62" y="764" width="1076" height="76" rx="16" fill="#e8f6f3" stroke="#b7e4dc"/>
  <text x="92" y="795" fill="#0e8f83" font-family="Arial, sans-serif" font-size="15" font-weight="700">LOCAL CALIBRATION BEFORE SCORE</text>
  <text x="92" y="821" fill="#456b70" font-family="Arial, sans-serif" font-size="14">Cross-boundary OD · headways / capacity · station / crossing counts · curb queues · accessibility audits · mode shares · grouped time choice</text>
  <text x="62" y="875" fill="#7890af" font-family="Arial, sans-serif" font-size="13">Source: movement-simulation.json / behavioral_choice_contract · synthetic architecture only</text>
  <text x="1138" y="875" text-anchor="end" fill="#7890af" font-family="Arial, sans-serif" font-size="13">PROVISIONAL · NO PERSONAL TRACE · GROUND FIRST</text>
</svg>
