<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Capacity gap: the smallest service-unit addition that closes the synthetic operations gate</title>
  <desc id="desc">Each O4 mode is swept for the smallest declared service-unit multiplier that removes the synthetic FIFO residual queue and stays at or below the 1.35x peak-load gate. The result is not a local timetable, procurement or performance claim.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#173a4b"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#32c5aa"/><stop offset="1" stop-color="#70e1c3"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111f" flood-opacity=".22"/></filter>
    <style>
      .sans{font-family:"Helvetica Neue",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.white{fill:#f4fbfb}.muted{fill:#a8c2c7}.teal{fill:#70e1c3}.amber{fill:#ffd37a}.ink{fill:#102b3b}.small{font-size:20px}.label{font-size:24px;font-weight:750}.value{font-size:46px;font-weight:850;letter-spacing:-1px}.title{font-size:56px;font-weight:850;letter-spacing:-2px}.card{fill:#f4f8f9}.line{stroke:#cfe2e2;stroke-width:2}.pill{font-size:20px;font-weight:850}.row{font-size:22px;font-weight:750}.bar{fill:#dcebec}.barfill{fill:#39c4aa}.note{font-size:19px}
    </style>
  </defs>
  <rect width="2400" height="1500" fill="url(#bg)"/>
  <text x="110" y="92" class="sans teal" font-size="25" font-weight="800" letter-spacing="4">COMMUTE CO-BENEFIT COMMONS / CAPACITY CLOSURE / v2.17</text>
  <text x="110" y="172" class="sans white title">Capacity gap: close the gate before scaling</text>
  <text x="110" y="220" class="sans muted" font-size="25">O4 synthetic stress screen · smallest per-mode service-unit sweep · not a procurement, timetable or local-performance claim</text>
  <rect x="1880" y="78" width="410" height="76" rx="38" fill="#3e2d2d" stroke="#ff9b8e" stroke-width="2"/>
  <text x="2085" y="126" text-anchor="middle" class="sans" fill="#ffb1a5" font-size="22" font-weight="850">SYNTHETIC / NOT OPERATING</text>

  <g filter="url(#shadow)">
    <rect x="110" y="285" width="535" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/><rect x="670" y="285" width="535" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/><rect x="1230" y="285" width="535" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/><rect x="1790" y="285" width="500" height="155" rx="24" fill="#143c4c" stroke="#2d6e73"/>
  </g>
  <text x="145" y="330" class="sans muted small">CURRENT OPERATIONS SCREEN</text><text x="145" y="395" class="sans value" fill="#ff9b8e">3.24× → 1.35×</text><text x="145" y="425" class="sans white" font-size="21">peak-load gate</text>
  <text x="705" y="330" class="sans muted small">COMBINED CLOSURE</text><text x="705" y="395" class="sans teal value">+301,925</text><text x="705" y="425" class="sans white" font-size="21">declared service units</text>
  <text x="1265" y="330" class="sans muted small">RESIDUAL QUEUE</text><text x="1265" y="395" class="sans teal value">0</text><text x="1265" y="425" class="sans white" font-size="21">all six modes pass the screen</text>
  <text x="1825" y="330" class="sans muted small">COVERAGE</text><text x="1825" y="395" class="sans amber value">3.122M</text><text x="1825" y="425" class="sans white" font-size="21">synthetic agents</text>

  <rect x="110" y="490" width="1480" height="820" rx="30" class="card" filter="url(#shadow)"/>
  <text x="155" y="550" class="sans ink" font-size="32" font-weight="850">Six modes: scan from 1.00× to the smallest closure point</text>
  <text x="155" y="588" class="sans" fill="#668095" font-size="20">Independent 0.01× steps; pass requires zero residual queue across three 15-minute slices and peak load ≤ 1.35×</text>
  <text x="165" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">MODE</text><text x="560" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">MIN MULTIPLIER</text><text x="1000" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">ADDED SERVICE UNITS</text><text x="1260" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">PEAK</text><text x="1450" y="650" class="sans" fill="#668095" font-size="18" font-weight="850">STATE</text>
  <line x1="165" y1="675" x2="1535" y2="675" class="line"/>
  <g class="sans">
    <text x="165" y="740" class="ink row">Metro</text><rect x="560" y="720" width="320" height="22" rx="11" class="bar"/><rect x="560" y="720" width="267" height="22" rx="11" class="barfill"/><line x1="869" y1="712" x2="869" y2="750" stroke="#e1a83f" stroke-width="3"/><text x="895" y="742" class="mono ink pill">1.17×</text><text x="1000" y="740" class="mono ink row">+803</text><text x="1260" y="740" class="mono ink row">1.12×</text><rect x="1435" y="714" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="740" text-anchor="middle" class="teal pill">PASS</text><line x1="165" y1="775" x2="1535" y2="775" class="line"/>
    <text x="165" y="820" class="ink row">Bus</text><rect x="560" y="800" width="320" height="22" rx="11" class="bar"/><rect x="560" y="800" width="256" height="22" rx="11" class="barfill"/><line x1="869" y1="792" x2="869" y2="830" stroke="#e1a83f" stroke-width="3"/><text x="895" y="822" class="mono ink pill">1.12×</text><text x="1000" y="820" class="mono ink row">+1,122</text><text x="1260" y="820" class="mono ink row">1.01×</text><rect x="1435" y="794" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="820" text-anchor="middle" class="teal pill">PASS</text><line x1="165" y1="855" x2="1535" y2="855" class="line"/>
    <text x="165" y="900" class="ink row">Bicycle</text><rect x="560" y="880" width="320" height="22" rx="11" class="bar"/><rect x="560" y="880" width="301" height="22" rx="11" class="barfill"/><line x1="869" y1="872" x2="869" y2="910" stroke="#e1a83f" stroke-width="3"/><text x="895" y="902" class="mono ink pill">1.32×</text><text x="1000" y="900" class="mono ink row">+115,200</text><text x="1260" y="900" class="mono ink row">1.20×</text><rect x="1435" y="874" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="900" text-anchor="middle" class="teal pill">PASS</text><line x1="165" y1="935" x2="1535" y2="935" class="line"/>
    <text x="165" y="980" class="ink row">Walking / access</text><rect x="560" y="960" width="320" height="22" rx="11" class="bar"/><rect x="560" y="960" width="306" height="22" rx="11" class="barfill"/><line x1="869" y1="952" x2="869" y2="990" stroke="#e1a83f" stroke-width="3"/><text x="895" y="982" class="mono ink pill">1.34×</text><text x="1000" y="980" class="mono ink row">+183,600</text><text x="1260" y="980" class="mono ink row">1.11×</text><rect x="1435" y="954" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="980" text-anchor="middle" class="teal pill">PASS</text><line x1="165" y1="1015" x2="1535" y2="1015" class="line"/>
    <text x="165" y="1060" class="ink row">Car</text><rect x="560" y="1040" width="320" height="22" rx="11" class="bar"/><rect x="560" y="1040" width="229" height="22" rx="11" class="barfill"/><line x1="869" y1="1032" x2="869" y2="1070" stroke="#e1a83f" stroke-width="3"/><text x="895" y="1062" class="mono ink pill">1.00×</text><text x="1000" y="1060" class="mono ink row">+0</text><text x="1260" y="1060" class="mono ink row">0.90×</text><rect x="1435" y="1034" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="1060" text-anchor="middle" class="teal pill">PASS</text><line x1="165" y1="1095" x2="1535" y2="1095" class="line"/>
    <text x="165" y="1140" class="ink row">Enterprise shuttle</text><rect x="560" y="1120" width="320" height="22" rx="11" class="bar"/><rect x="560" y="1120" width="265" height="22" rx="11" class="barfill"/><line x1="869" y1="1112" x2="869" y2="1150" stroke="#e1a83f" stroke-width="3"/><text x="895" y="1142" class="mono ink pill">1.16×</text><text x="1000" y="1140" class="mono ink row">+1,200</text><text x="1260" y="1140" class="mono ink row">1.15×</text><rect x="1435" y="1114" width="100" height="38" rx="19" fill="#e8faf5"/><text x="1485" y="1140" text-anchor="middle" class="teal pill">PASS</text>
  </g>
  <text x="165" y="1210" class="sans" fill="#668095" font-size="18">Gold line = 1.35× gate · bars = minimum multiplier · +gap = added declared service units across three slices</text>

  <rect x="1630" y="490" width="660" height="820" rx="30" class="card" filter="url(#shadow)"/>
  <text x="1675" y="550" class="sans ink" font-size="32" font-weight="850">What does this screen answer?</text>
  <text x="1675" y="588" class="sans" fill="#668095" font-size="20">WHAT THIS SCREEN DOES / DOES NOT SAY</text>
  <rect x="1675" y="635" width="570" height="150" rx="20" fill="#e8faf5" stroke="#53d7bb" stroke-width="2"/><text x="1710" y="680" class="sans" fill="#0f806e" font-size="22" font-weight="850">ANSWER</text><text x="1710" y="722" class="sans ink note">Under the declared inputs, it identifies</text><text x="1710" y="752" class="sans ink note">the smallest per-mode service-unit gap.</text>
  <rect x="1675" y="815" width="570" height="205" rx="20" fill="#fff0ed" stroke="#ff9b8e" stroke-width="2"/><text x="1710" y="860" class="sans" fill="#b55043" font-size="22" font-weight="850">NOT AN ANSWER</text><text x="1710" y="902" class="sans ink note">Not an actual timetable, fleet or purchase</text><text x="1710" y="932" class="sans ink note">quantity; not resident satisfaction or local</text><text x="1710" y="962" class="sans ink note">performance; no automatic P1 / P2 approval.</text>
  <rect x="1675" y="1050" width="570" height="145" rx="20" fill="#102d43" stroke="#2c6370"/><text x="1710" y="1095" class="sans teal" font-size="22" font-weight="850">NEXT</text><text x="1710" y="1135" class="sans white note">Collect dated OD, headways, capacity, denied</text><text x="1710" y="1165" class="sans white note">boarding, access audits and accountable owners.</text>
  <text x="1675" y="1245" class="sans" fill="#668095" font-size="18">air candidate: BLOCKED · ground modes remain primary</text>
  <rect x="110" y="1370" width="2180" height="62" rx="18" fill="#102d43" stroke="#2c6370"/><text x="150" y="1410" class="sans white" font-size="19" font-weight="750">CAPACITY CLOSURE PASS = synthetic gate closure only　·　not timetable proof　·　not procurement advice　·　not local performance</text>
<g id="evidence-chain-ribbon"><rect x="0" y="1390" width="2400" height="110" fill="#071A2B" opacity=".96"/><text x="40" y="1407" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#66E3CA">ONE REGIONAL RUNNER · FIVE READOUT VIEWS</text><text x="2360" y="1407" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#9FC0CF">one aggregate evidence chain, not five independent field results</text><rect x="40.0" y="1408" width="457.6" height="38" rx="10" fill="#4DE1BF22" stroke="#4DE1BF" stroke-width="1.5"/><text x="54.0" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">1  regional scale</text><rect x="505.6" y="1408" width="457.6" height="38" rx="10" fill="#6EA5FF22" stroke="#6EA5FF" stroke-width="1.5"/><text x="519.6" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">2  network flow</text><rect x="971.2" y="1408" width="457.6" height="38" rx="10" fill="#F7BF6322" stroke="#F7BF63" stroke-width="1.5"/><text x="985.2" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">3  capacity gap</text><rect x="1436.8" y="1408" width="457.6" height="38" rx="10" fill="#F07D9E22" stroke="#F07D9E" stroke-width="1.5"/><text x="1450.8" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">4  resource sensitivity</text><rect x="1902.4" y="1408" width="457.6" height="38" rx="10" fill="#B8A1FF22" stroke="#B8A1FF" stroke-width="1.5"/><text x="1916.4" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">5  robustness</text></g></svg>
