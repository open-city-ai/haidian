<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f7f3ed"/>
  <rect x="42" y="36" width="1516" height="928" rx="28" fill="#10233f"/>
  <text x="90" y="100" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">JING-ZHANG COMMUTE COMMONS / 147228</text>
  <text x="90" y="155" fill="#ffffff" font-family="Arial,sans-serif" font-size="42" font-weight="700">全日活动链服务等价回执</text>
  <text x="90" y="197" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="21">先验收普通路径、人工接管与维护回写，再比较 AI 选项。六个交接点均为设计合同。</text>
  <rect x="1245" y="72" width="245" height="82" rx="40" fill="#e76f51"/>
  <text x="1367" y="108" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700">DESIGN ONLY</text>
  <text x="1367" y="135" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17">HOLD / 0 field observations</text>
  <line x1="124" y1="300" x2="1475" y2="300" stroke="#66e3ca" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(90 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">01</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">出门</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">选择</text></g>
    <g transform="translate(335 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">02</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">接驳</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">换乘</text></g>
    <g transform="translate(580 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">03</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">到达</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">到岗 / 装卸</text></g>
    <g transform="translate(825 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">04</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">午间</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">照护 / 服务</text></g>
    <g transform="translate(1070 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">05</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">返程</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">夜间回家</text></g>
    <g transform="translate(1315 250)"><circle cx="55" cy="50" r="34" fill="#e76f51"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">06</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">复核</text><text x="55" y="140" text-anchor="middle" fill="#ffd8cf" font-size="15">投诉 / 维修</text></g>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="470" width="1420" height="190" rx="18" fill="#f8fafc"/>
    <text x="122" y="515" fill="#10233f" font-size="24" font-weight="700">每个交接点都要同时留下四件东西</text>
    <g fill="#1f2a37" font-size="19">
      <text x="135" y="565">① 现场分母</text><text x="430" y="565">② 无 AI 等价路径</text><text x="800" y="565">③ 拒绝与回退动作</text><text x="1190" y="565">④ 维护回写字段</text>
      <text x="135" y="610" fill="#64748b" font-size="16">选择、完成、投诉和复核的分组口径</text><text x="430" y="610" fill="#64748b" font-size="16">纸面、电话、有人服务或公共交通</text><text x="800" y="610" fill="#64748b" font-size="16">证据缺失就冻结、不预约、回到 P0</text><text x="1190" y="610" fill="#64748b" font-size="16">责任人、版本、日期、未决项与复审</text>
    </g>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="715" width="430" height="172" rx="18" fill="#123b50" stroke="#2a9d8f" stroke-width="2"/>
    <rect x="585" y="715" width="430" height="172" rx="18" fill="#123b50" stroke="#2a9d8f" stroke-width="2"/>
    <rect x="1080" y="715" width="430" height="172" rx="18" fill="#3b2630" stroke="#e76f51" stroke-width="2"/>
    <text x="120" y="760" fill="#66e3ca" font-size="20" font-weight="700">普通路径</text><text x="120" y="800" fill="#fff" font-size="18">纸面 / 电话 / 有人服务台</text><text x="120" y="835" fill="#b6d3dc" font-size="15">无需账号、网络或模型才能进入</text>
    <text x="615" y="760" fill="#66e3ca" font-size="20" font-weight="700">扩展前的五道门</text><text x="615" y="800" fill="#fff" font-size="18">基线 · 责任 · 等价 · 撤回 · 独立复核</text><text x="615" y="835" fill="#b6d3dc" font-size="15">任何一门缺证，保持 HOLD</text>
    <text x="1110" y="760" fill="#ffb5a5" font-size="20" font-weight="700">当前读数</text><text x="1110" y="800" fill="#fff" font-size="18">授权 0 · 现场观察 0</text><text x="1110" y="835" fill="#ffd8cf" font-size="15">本地基线 unknown · 绩效 null</text>
  </g>
  <text x="90" y="930" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Source: package-local contract and provisional key areas. The atlas supports design review only; it is not a field survey, operating result, permit or approval.</text>
</svg>
