<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">From synthetic screen to field authorisation: the evidence ladder</title><desc id="desc">Current hold at P0 · collect evidence before a pilot; the air candidate stays blocked</desc>
  <style>.bg{fill:#071a2b}.panel{fill:#0e2a3c;stroke:#275369;stroke-width:2}.title{font:800 36px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f4fbff}.sub{font:500 18px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#a9c8d1}.stage-id{font:900 15px SFMono-Regular,Consolas,monospace;fill:#071a2b}.stage-title{font:800 21px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f4fbff}.status{font:800 13px SFMono-Regular,Consolas,monospace;fill:#77e3c0;letter-spacing:1px}.stage-copy{font:600 15px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#dceef2}.stage-copy-tight{font:600 13px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#dceef2}.small{font:600 13px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#91b5bf}.value{font:800 20px SFMono-Regular,Consolas,monospace;fill:#f4fbff}.section{font:800 18px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#77e3c0}.evidence-row{font:600 16px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#e0eff2}.foot{font:500 14px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#a9c8d1}.warning{font:600 14px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f6c76b}.footer{font:700 16px PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#f4fbff}</style>
  <rect width="1800" height="1000" class="bg"/><circle cx="1700" cy="60" r="280" fill="#2a9d8f" opacity=".12"/><circle cx="90" cy="940" r="260" fill="#5b8def" opacity=".11"/>
  <text x="64" y="64" class="title" text-anchor="start">From synthetic screen to field authorisation: the evidence ladder</text><text x="66" y="100" class="sub" text-anchor="start">Current hold at P0 · collect evidence before a pilot; the air candidate stays blocked</text>
  <rect x="52" y="140" width="1696" height="290" rx="26" class="panel"/><path d="M 428 272 H 436" stroke="#52758a" stroke-width="4" stroke-linecap="round"/><path d="M 422 260 L 438 272 L 422 284" fill="none" stroke="#52758a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="64" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#77e3c0" stroke-width="3"/><circle cx="100" cy="216" r="20" fill="#77e3c0"/><text x="100" y="223" class="stage-id" text-anchor="middle">P0</text><text x="134" y="221" class="stage-title" text-anchor="start">register + baseline</text><text x="90" y="260" class="status" text-anchor="start">CURRENT HOLD</text><text x="90" y="305" class="stage-copy" text-anchor="start">current hold: collect dated grouped evidence</text><text x="90" y="348" class="small" text-anchor="start">entry evidence</text><text x="90" y="372" class="value" text-anchor="start">5 items</text></g><path d="M 806 272 H 814" stroke="#52758a" stroke-width="4" stroke-linecap="round"/><path d="M 800 260 L 816 272 L 800 284" fill="none" stroke="#52758a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="442" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#79a9ff" stroke-width="3"/><circle cx="478" cy="216" r="20" fill="#79a9ff"/><text x="478" y="223" class="stage-id" text-anchor="middle">P1</text><text x="512" y="221" class="stage-title" text-anchor="start">reversible pilot</text><text x="468" y="260" class="status" text-anchor="start">WAITING</text><text x="468" y="305" class="stage-copy-tight" text-anchor="start">test one minimum activity chain; people can take over at any time</text><text x="468" y="348" class="small" text-anchor="start">entry evidence</text><text x="468" y="372" class="value" text-anchor="start">4 items</text></g><path d="M 1184 272 H 1192" stroke="#52758a" stroke-width="4" stroke-linecap="round"/><path d="M 1178 260 L 1194 272 L 1178 284" fill="none" stroke="#52758a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="820" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#f6c76b" stroke-width="3"/><circle cx="856" cy="216" r="20" fill="#f6c76b"/><text x="856" y="223" class="stage-id" text-anchor="middle">P2</text><text x="890" y="221" class="stage-title" text-anchor="start">conditional expansion</text><text x="846" y="260" class="status" text-anchor="start">WAITING</text><text x="846" y="305" class="stage-copy-tight" text-anchor="start">expand time windows, modes and service scope only after evidence closes</text><text x="846" y="348" class="small" text-anchor="start">entry evidence</text><text x="846" y="372" class="value" text-anchor="start">5 items</text></g><g><rect x="1198" y="176" width="360" height="210" rx="22" fill="#0e2a3c" stroke="#ef829d" stroke-width="3"/><circle cx="1234" cy="216" r="20" fill="#ef829d"/><text x="1234" y="223" class="stage-id" text-anchor="middle">A1</text><text x="1268" y="221" class="stage-title" text-anchor="start">air candidate</text><text x="1224" y="260" class="status" text-anchor="start">BLOCKED</text><text x="1224" y="305" class="stage-copy-tight" text-anchor="start">does not fill a ground-evidence gap and stays out of the current policy ranking</text><text x="1224" y="348" class="small" text-anchor="start">entry evidence</text><text x="1224" y="372" class="value" text-anchor="start">3 items</text></g>
  <rect x="52" y="462" width="820" height="340" rx="24" class="panel"/><rect x="900" y="462" width="848" height="340" rx="24" class="panel"/>
  <text x="84" y="510" class="section" text-anchor="start">Evidence required at P0</text><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">dated_grouped_OD_and_enterprise_shift_acceptance</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">metro_bus_headway_station_stop_and_curb_capacity</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">resident_care_accessibility_and_night_return_validation</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">complaint_redress_and_human_fallback_rehearsal</text></g><g><circle cx="92" cy="520" r="8" fill="#77e3c0"/><text x="116" y="526" class="evidence-row">privacy_suppression_retention_and_deletion_proof</text></g>
  <text x="932" y="510" class="section" text-anchor="start">What the model may claim now</text><text x="970" y="520" class="foot" text-anchor="start">1. the checked-in population-scale synthetic screen is deterministic and aggregate only</text><text x="970" y="548" class="foot" text-anchor="start">2. the selected ground policy passes its declared hard gates under synthetic inputs</text><text x="970" y="576" class="foot" text-anchor="start">3. the next evidence owners, fields and stop actions are explicit</text><text x="932" y="622" class="section" text-anchor="start">What the model must not claim now</text><text x="970" y="650" class="warning" text-anchor="start">1. resident acceptance or employee adoption</text><text x="970" y="678" class="warning" text-anchor="start">2. local OD, timetable capacity, service quality or traffic improvement</text><text x="970" y="706" class="warning" text-anchor="start">3. permission, procurement, partnership, public consultation completion or air-service approval</text>
  <rect x="52" y="844" width="1696" height="92" rx="20" fill="#102f42" stroke="#f6c76b" stroke-width="2"/><text x="82" y="886" class="footer" text-anchor="start">Decision rule: register only; no booking or expansion. Expired evidence, protected-group decline or missing ownership returns to P0; ground and human fallback stays available.</text><text x="82" y="914" class="small" text-anchor="start">Source: commute-co-benefit-contract.json · authorization register · aggregate only · no operating approval</text>
</svg>