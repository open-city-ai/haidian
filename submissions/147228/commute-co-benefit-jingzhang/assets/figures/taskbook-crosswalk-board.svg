<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">任务书六项任务与交通主题包交付交叉表</title>
  <desc id="desc">A readable crosswalk from the six agent taskbook tasks to the mobility package's evidence and boundaries. It is a navigation aid, not a score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#102F42"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".24"/></filter>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif}.ink{fill:#E9FFFB}.muted{fill:#9CC5C8}.small{font-size:18px}.body{font-size:20px}.task{font-size:23px;font-weight:700}.id{font-size:17px;font-weight:800;letter-spacing:2px}.status{font-size:16px;font-weight:700}.foot{font-size:15px}</style>
  </defs>
  <rect width="1600" height="1040" rx="28" fill="url(#bg)"/><circle cx="1460" cy="90" r="220" fill="#1C6670" opacity=".18"/><circle cx="1510" cy="120" r="130" fill="none" stroke="#5EEAD4" stroke-opacity=".25" stroke-width="2"/>
  <text x="82" y="78" class="sans id" fill="#78E7D0">OPEN CITY / HAIDIAN / 147228</text><text x="82" y="138" class="sans ink" font-size="48" font-weight="800">任务书六项任务，交通包交付到哪里</text><text x="82" y="178" class="sans muted" font-size="22">TASKBOOK CROSSWALK · COMMUTE CO-BENEFIT COMMONS · v2.34</text><rect x="1155" y="103" width="345" height="58" rx="29" fill="#133E4B" stroke="#45D6C5"/><text x="1327" y="139" text-anchor="middle" class="sans status" fill="#9CFFE9">导航用 · 不代表评分</text>
  <text x="86" y="230" class="sans" font-size="15" fill="#78E7D0">任务书要求</text><text x="420" y="230" class="sans" font-size="15" fill="#78E7D0">本包真正交付</text><text x="1192" y="230" class="sans" font-size="15" fill="#78E7D0">仍然不能推出</text><path d="M82 246H1518" stroke="#2A9D8F" stroke-width="2" opacity=".8"/>
  <g class="sans">
    <rect x="82" y="268" width="1436" height="100" rx="16" fill="#123A4A" filter="url(#shadow)"/><rect x="82" y="268" width="9" height="100" rx="4" fill="#45D6C5"/><text x="112" y="300" class="id" fill="#78E7D0">AGENT.1</text><text x="112" y="338" class="task ink">总体概念与功能统筹</text><text x="420" y="302" class="body ink">三层范围 · 三处节点 · 轨道公交骨干</text><text x="420" y="334" class="small muted">慢行、汽车、人工入口组成可回退服务链</text><rect x="1180" y="291" width="290" height="48" rx="24" fill="#174F50"/><text x="1325" y="321" text-anchor="middle" class="status" fill="#A7F3D0">不替代整带总规划</text>
    <rect x="82" y="386" width="1436" height="100" rx="16" fill="#123A4A" filter="url(#shadow)"/><rect x="82" y="386" width="9" height="100" rx="4" fill="#F3B562"/><text x="112" y="418" class="id" fill="#FFD39B">AGENT.2</text><text x="112" y="456" class="task ink">AI 生态与创新体系</text><text x="420" y="420" class="body ink">需求、资源、车辆、节点、维护责任</text><text x="420" y="452" class="small muted">交通侧压力筛查，未知字段原样保留</text><rect x="1180" y="409" width="290" height="48" rx="24" fill="#5A4127"/><text x="1325" y="439" text-anchor="middle" class="status" fill="#FFE3B5">不替代产业承诺</text>
    <rect x="82" y="504" width="1436" height="100" rx="16" fill="#123A4A" filter="url(#shadow)"/><rect x="82" y="504" width="9" height="100" rx="4" fill="#45D6C5"/><text x="112" y="536" class="id" fill="#78E7D0">AGENT.3</text><text x="112" y="574" class="task ink">AI+ 场景与活力城市</text><text x="420" y="538" class="body ink">十张卡 · 六类人 · 三项产业测试</text><text x="420" y="570" class="small muted">每卡写清触发、责任、回退和停止</text><rect x="1180" y="527" width="290" height="48" rx="24" fill="#174F50"/><text x="1325" y="557" text-anchor="middle" class="status" fill="#A7F3D0">不替代居民验证</text>
    <rect x="82" y="622" width="1436" height="100" rx="16" fill="#123A4A" filter="url(#shadow)"/><rect x="82" y="622" width="9" height="100" rx="4" fill="#F3B562"/><text x="112" y="654" class="id" fill="#FFD39B">AGENT.4</text><text x="112" y="692" class="task ink">公共空间与地标</text><text x="420" y="656" class="body ink">站口、候车、坡道、路缘、维护点</text><text x="420" y="688" class="small muted">公共接口可看、可走、可求助、可退出</text><rect x="1180" y="645" width="290" height="48" rx="24" fill="#5A4127"/><text x="1325" y="675" text-anchor="middle" class="status" fill="#FFE3B5">不声称三处地标</text>
    <rect x="82" y="740" width="1436" height="100" rx="16" fill="#123A4A" filter="url(#shadow)"/><rect x="82" y="740" width="9" height="100" rx="4" fill="#F3B562"/><text x="112" y="772" class="id" fill="#FFD39B">AGENT.5</text><text x="112" y="810" class="task ink">文化融合与传播</text><text x="420" y="774" class="body ink">到站、换乘、等候、维护、回家叙事</text><text x="420" y="806" class="small muted">双语导视与公共服务接口方向</text><rect x="1180" y="763" width="290" height="48" rx="24" fill="#5A4127"/><text x="1325" y="793" text-anchor="middle" class="status" fill="#FFE3B5">不替代历史核验</text>
    <rect x="82" y="858" width="1436" height="100" rx="16" fill="#123A4A" filter="url(#shadow)"/><rect x="82" y="858" width="9" height="100" rx="4" fill="#45D6C5"/><text x="112" y="890" class="id" fill="#78E7D0">AGENT.6</text><text x="112" y="928" class="task ink">长期运营与活动体系</text><text x="420" y="892" class="body ink">P0 登记 · P1 小试 · P2 复核 · 失败回退</text><text x="420" y="924" class="small muted">责任、验收、申诉、保留和停止都留痕</text><rect x="1180" y="881" width="290" height="48" rx="24" fill="#174F50"/><text x="1325" y="911" text-anchor="middle" class="status" fill="#A7F3D0">不声称已有活动</text>
  </g>
  <path d="M82 982H1518" stroke="#2A9D8F" stroke-width="1" opacity=".7"/><text x="82" y="1012" class="sans foot" fill="#9CC5C8">绿色：交通主题有明确交付　琥珀：只覆盖交通接口　所有模拟值、合成代理和 provisional 几何仍待专业与现场证据</text>
</svg>
