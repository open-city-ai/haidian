<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f7f3ed"/>
  <rect x="42" y="36" width="1516" height="928" rx="28" fill="#10233f"/>
  <text x="90" y="100" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">JING-ZHANG COMMUTE COMMONS / 147228</text>
  <text x="90" y="155" fill="#ffffff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Full-Day Activity-Chain Service-Equivalence Receipt</text>
  <text x="90" y="197" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="21">Accept the ordinary route, human takeover and maintenance write-back before comparing AI options.</text>
  <rect x="1245" y="72" width="245" height="82" rx="40" fill="#e76f51"/>
  <text x="1367" y="108" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700">DESIGN ONLY</text>
  <text x="1367" y="135" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17">HOLD / 0 field observations</text>
  <line x1="124" y1="300" x2="1475" y2="300" stroke="#66e3ca" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(90 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">01</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">LEAVE</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">choose</text></g>
    <g transform="translate(335 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">02</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">FEEDER</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">transfer</text></g>
    <g transform="translate(580 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">03</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">ARRIVE</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">work / loading</text></g>
    <g transform="translate(825 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">04</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">MIDDAY</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">care / service</text></g>
    <g transform="translate(1070 250)"><circle cx="55" cy="50" r="34" fill="#2a9d8f"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">05</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">RETURN</text><text x="55" y="140" text-anchor="middle" fill="#b6d3dc" font-size="15">night arrival</text></g>
    <g transform="translate(1315 250)"><circle cx="55" cy="50" r="34" fill="#e76f51"/><text x="55" y="60" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">06</text><text x="55" y="112" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">REVIEW</text><text x="55" y="140" text-anchor="middle" fill="#ffd8cf" font-size="15">complaint / repair</text></g>
  </g>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="470" width="1420" height="190" rx="18" fill="#f8fafc"/>
    <text x="122" y="515" fill="#10233f" font-size="24" font-weight="700">Every handoff leaves four records</text>
    <g fill="#1f2a37" font-size="19"><text x="135" y="565">1. Field denominator</text><text x="430" y="565">2. Non-AI equivalent</text><text x="800" y="565">3. Refusal and fallback</text><text x="1190" y="565">4. Maintenance write-back</text>
      <text x="135" y="600" fill="#64748b" font-size="14"><tspan x="135" dy="0">Grouped basis for choice, completion,</tspan><tspan x="135" dy="20">complaint and review</tspan></text><text x="430" y="600" fill="#64748b" font-size="14"><tspan x="430" dy="0">Paper, phone, staffed service</tspan><tspan x="430" dy="20">or public transport</tspan></text><text x="800" y="600" fill="#64748b" font-size="14"><tspan x="800" dy="0">Missing evidence freezes service</tspan><tspan x="800" dy="20">and returns to P0</tspan></text><text x="1190" y="600" fill="#64748b" font-size="14"><tspan x="1190" dy="0">Owner, version, date and unresolved item</tspan><tspan x="1190" dy="20">plus review</tspan></text></g>
  </g>
  <g font-family="Arial,sans-serif"><rect x="90" y="715" width="430" height="172" rx="18" fill="#123b50" stroke="#2a9d8f" stroke-width="2"/><rect x="585" y="715" width="430" height="172" rx="18" fill="#123b50" stroke="#2a9d8f" stroke-width="2"/><rect x="1080" y="715" width="430" height="172" rx="18" fill="#3b2630" stroke="#e76f51" stroke-width="2"/>
    <text x="120" y="760" fill="#66e3ca" font-size="20" font-weight="700">Ordinary route</text><text x="120" y="800" fill="#fff" font-size="18">Paper / phone / staffed desk</text><text x="120" y="835" fill="#b6d3dc" font-size="15">Entry without an account, network or model</text>
    <text x="615" y="760" fill="#66e3ca" font-size="20" font-weight="700">Five gates before expansion</text><text x="615" y="800" fill="#fff" font-size="18">Baseline · role · equivalence · withdrawal · review</text><text x="615" y="835" fill="#b6d3dc" font-size="15">Any missing gate keeps the decision at HOLD</text>
    <text x="1110" y="760" fill="#ffb5a5" font-size="20" font-weight="700">Current status</text><text x="1110" y="800" fill="#fff" font-size="18">Authorisation 0 · field observations 0</text><text x="1110" y="835" fill="#ffd8cf" font-size="15">Local baseline unknown · performance null</text></g>
  <text x="90" y="930" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Source: package-local contract and provisional key areas. Design review only; not a field survey, operating result, permit or approval.</text>
</svg>
