<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#F5F1E9" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#0B263D" stroke="none" stroke-width="0"/><text x="60" y="50" font-size="18" fill="#77E7D3" font-weight="800" text-anchor="start">COMMUTE COMMONS / TASKBOOK DELIVERY / v2.35</text><text x="60" y="100" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">通勤共益公地任务书交付图谱</text><rect x="1495" y="42" width="245" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1617.5" y="65" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">概念成果 · 非承诺</text><text x="1740" y="124" font-size="15" fill="#A9C3D2" font-weight="600" text-anchor="end">六项任务有独立可见成果</text><rect x="60" y="180" width="420" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">01 · IDENTITY</text><text x="88" y="267" font-size="55" fill="#F17457" font-weight="900" text-anchor="start">C↔C</text><text x="205" y="252" font-size="24" fill="#0B263D" font-weight="800" text-anchor="start">京张通勤共益公地</text><text x="215" y="283" font-size="17" fill="#617487" font-weight="600" text-anchor="start">企业请求 ↔ 居民回程</text><line x1="100" y1="318" x2="430" y2="318" stroke="#D8E3E7" stroke-width="2" /><text x="88" y="350" font-size="15" fill="#29BFA8" font-weight="800" text-anchor="start">标志逻辑</text><text x="88" y="380" font-size="17" fill="#173047" font-weight="600" text-anchor="start">相反方向，共享一个发布门；</text><text x="88" y="407" font-size="17" fill="#173047" font-weight="600" text-anchor="start">没有公共回程，就没有企业窗口。</text><circle cx="318" cy="363" r="11" fill="#46D7BC"/><circle cx="354" cy="363" r="11" fill="#F37A5A"/><circle cx="390" cy="363" r="11" fill="#F2C66D"/><circle cx="426" cy="363" r="11" fill="#102B46"/><rect x="500" y="180" width="1240" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="528" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">02 · 三大定位 / 五大功能 / 三区两翼</text><rect x="528" y="242" width="370" height="66" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="546" y="269" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">P1</text><text x="582" y="269" font-size="17" fill="#0B263D" font-weight="800" text-anchor="start">百年京张文化带</text><text x="546" y="294" font-size="13" fill="#617487" font-weight="500" text-anchor="start">把京张工程、到站、换乘、维护和回家组织成可</text><rect x="918" y="242" width="370" height="66" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="936" y="269" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">P2</text><text x="972" y="269" font-size="17" fill="#0B263D" font-weight="800" text-anchor="start">都市 AI 生活体验带</text><text x="936" y="294" font-size="13" fill="#617487" font-weight="500" text-anchor="start">每个数字调度同时展示普通路线、无障碍替代、</text><rect x="1308" y="242" width="370" height="66" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="1326" y="269" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">P3</text><text x="1362" y="269" font-size="17" fill="#0B263D" font-weight="800" text-anchor="start">AI 融合创新带</text><text x="1326" y="294" font-size="13" fill="#617487" font-weight="500" text-anchor="start">企业到岗、路缘和接驳测试先过公共交通、公平</text><rect x="528" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="635.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F1 AI 全栈自主创新体系</text><rect x="763" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="870.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F2 世界级 AI 创新生态</text><rect x="998" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1105.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F3 AI+ 场景赋能新范式</text><rect x="1233" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1340.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F4 智能化 AI 活力城市</text><rect x="1468" y="326" width="215" height="34" rx="17" fill="#EEEFFE" stroke="none" stroke-width="0"/><text x="1575.5" y="349" font-size="14" fill="#777AF2" font-weight="800" text-anchor="middle">F5 AI 治理全球话语权</text><rect x="528" y="374" width="215" height="45" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="635.5" y="402" font-size="12" fill="#FFFFFF" font-weight="750" text-anchor="middle">A1 众智园 AI 自主创新加速区</text><text x="753" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="763" y="374" width="215" height="45" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="870.5" y="402" font-size="12" fill="#FFFFFF" font-weight="750" text-anchor="middle">A2 AI 原点社区</text><text x="988" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="998" y="374" width="215" height="45" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="1105.5" y="402" font-size="12" fill="#FFFFFF" font-weight="750" text-anchor="middle">A3 大钟寺 AI 产业集聚区</text><text x="1223" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1233" y="374" width="215" height="45" rx="12" fill="#EEF0FF" stroke="none" stroke-width="0"/><text x="1340.5" y="402" font-size="12" fill="#777AF2" font-weight="750" text-anchor="middle">W1 中关村科技服务翼</text><text x="1458" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1468" y="374" width="215" height="45" rx="12" fill="#EEF0FF" stroke="none" stroke-width="0"/><text x="1575.5" y="402" font-size="12" fill="#777AF2" font-weight="750" text-anchor="middle">W2 小月河场景赋能翼</text><rect x="60" y="470" width="1040" height="430" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="508" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">03 · 六个全球机制案例 → 八要素生态回路</text><rect x="88" y="532" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="104" y="557" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-01</text><text x="172" y="557" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Helsinki AI Register</text><text x="104" y="582" font-size="13" fill="#617487" font-weight="550" text-anchor="start">给每个交通试点一张状态卡和投诉入口</text><text x="104" y="601" font-size="11" fill="#F17457" font-weight="600" text-anchor="start">不照搬：登记册不能替代安全、无障碍和居民同意</text><rect x="583" y="532" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="599" y="557" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-02</text><text x="667" y="557" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Amsterdam Algorithm Register</text><text x="599" y="582" font-size="13" fill="#617487" font-weight="550" text-anchor="start">把人工等价服务、申诉和停止状态放在同一页</text><text x="599" y="601" font-size="11" fill="#F17457" font-weight="600" text-anchor="start">不照搬：不把海外登记当本地合规证明</text><rect x="88" y="622" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="104" y="647" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-03</text><text x="172" y="647" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Singapore AI Verify</text><text x="104" y="672" font-size="13" fill="#617487" font-weight="550" text-anchor="start">把众智园窗口绑定模型卡、接管演练和撤回回执</text><text x="104" y="691" font-size="11" fill="#F17457" font-weight="600" text-anchor="start">不照搬：测试工具不是认证或运营许可</text><rect x="583" y="622" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="599" y="647" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-04</text><text x="667" y="647" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Decidim Barcelona</text><text x="599" y="672" font-size="13" fill="#617487" font-weight="550" text-anchor="start">数字台账配套纸面、电话、步入式反馈和变更回读</text><text x="599" y="691" font-size="11" fill="#F17457" font-weight="600" text-anchor="start">不照搬：数字参与不能替代无设备和语言支持</text><rect x="88" y="712" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="104" y="737" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-05</text><text x="172" y="737" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">UK Algorithmic Transparency Recording Standard</text><text x="104" y="762" font-size="13" fill="#617487" font-weight="550" text-anchor="start">形成企业—居民窗口的九字段公开预检单</text><text x="104" y="781" font-size="11" fill="#F17457" font-weight="600" text-anchor="start">不照搬：英国标准不是北京法定要求</text><rect x="583" y="712" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="599" y="737" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-06</text><text x="667" y="737" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Seoul AI Foundation</text><text x="599" y="762" font-size="13" fill="#617487" font-weight="550" text-anchor="start">把年度活动接到真实问题、试点回执和人才后续路径</text><text x="599" y="781" font-size="11" fill="#F17457" font-weight="600" text-anchor="start">不照搬：不声称机构合作、资金或同级授权</text><text x="88" y="826" font-size="14" fill="#0B263D" font-weight="700" text-anchor="start">八要素先交换条件，再回传证据：</text><rect x="88" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="143" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">LAND</text><rect x="210" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="265" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">SPACE</text><rect x="332" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="387" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">INDUSTRY</text><rect x="454" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="509" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">CAPITAL</text><rect x="576" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="631" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">TALENT</text><rect x="698" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="753" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">COMPUTE</text><rect x="820" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="875" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">DATA</text><rect x="942" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="997" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">SCENARIO</text><text x="88" y="890" font-size="11" fill="#617487" font-weight="650" text-anchor="start">区域接口 · 北纬社区 · 未来科学城 · 怀柔科学城 · 经开区 · 京津冀（均待验证）</text><rect x="1120" y="470" width="620" height="430" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="1148" y="508" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">04 · 地标—文化—年度运营</text><circle cx="1172" cy="555" r="20" fill="#F17457"/><text x="1172" y="561" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">L1</text><text x="1205" y="551" font-size="16" fill="#0B263D" font-weight="800" text-anchor="start">京张工程回程标</text><text x="1205" y="575" font-size="12" fill="#617487" font-weight="550" text-anchor="start">显示一个工程问题、来源、普通路线和撤下入口</text><circle cx="1172" cy="625" r="20" fill="#29BFA8"/><text x="1172" y="631" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">L2</text><text x="1205" y="621" font-size="16" fill="#0B263D" font-weight="800" text-anchor="start">原点贡献换乘台</text><text x="1205" y="645" font-size="12" fill="#617487" font-weight="550" text-anchor="start">把开发者贡献与居民问题、人工帮助和更正记录配对</text><circle cx="1172" cy="695" r="20" fill="#777AF2"/><text x="1172" y="701" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">L3</text><text x="1205" y="691" font-size="16" fill="#0B263D" font-weight="800" text-anchor="start">四象限责任灯塔</text><text x="1205" y="715" font-size="12" fill="#617487" font-weight="550" text-anchor="start">显示活动容量、普通回程、责任人、暂停与复原状态</text><rect x="1148" y="752" width="564" height="42" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="1430" y="779" font-size="16" fill="#FFFFFF" font-weight="750" text-anchor="middle">Every intelligent commute owes the city a public way home.</text><rect x="1148" y="812" width="266" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1281" y="835" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">Q1 问题开放季</text><rect x="1430" y="812" width="266" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1563" y="835" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">Q2 照护与通勤共测周</text><rect x="1148" y="851" width="266" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1281" y="874" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">Q3 城市智能体公开复盘</text><rect x="1430" y="851" width="266" height="34" rx="17" fill="#EEEFFE" stroke="none" stroke-width="0"/><text x="1563" y="874" font-size="14" fill="#777AF2" font-weight="800" text-anchor="middle">Q4 京张回程论坛</text><text x="1148" y="895" font-size="12" fill="#617487" font-weight="600" text-anchor="start">每季必须留下公开工件、停止条件和后续责任；到场量不等于公共收益。</text><rect x="60" y="930" width="1680" height="200" rx="24" fill="#0B263D" stroke="none" stroke-width="0"/><text x="88" y="970" font-size="16" fill="#77E7D3" font-weight="800" text-anchor="start">05 · 六项任务唯一成果索引</text><rect x="88" y="992" width="252" height="104" rx="14" fill="#173F54" stroke="none" stroke-width="0"/><text x="104" y="1022" font-size="15" fill="#29BFA8" font-weight="850" text-anchor="start">agent.1</text><text x="104" y="1048" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• identity</text><text x="104" y="1066" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• positioning</text><text x="104" y="1084" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• functions</text><rect x="358" y="992" width="252" height="104" rx="14" fill="#143A50" stroke="none" stroke-width="0"/><text x="374" y="1022" font-size="15" fill="#29BFA8" font-weight="850" text-anchor="start">agent.2</text><text x="374" y="1048" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• six global mechanisms</text><text x="374" y="1066" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• eight ecosystem resources</text><text x="374" y="1084" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• five regional interfaces</text><rect x="628" y="992" width="252" height="104" rx="14" fill="#173F54" stroke="none" stroke-width="0"/><text x="644" y="1022" font-size="15" fill="#29BFA8" font-weight="850" text-anchor="start">agent.3</text><text x="644" y="1048" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• ten scenario cards</text><text x="644" y="1066" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• three industry tests</text><text x="644" y="1084" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• six participant groups</text><rect x="898" y="992" width="252" height="104" rx="14" fill="#143A50" stroke="none" stroke-width="0"/><text x="914" y="1022" font-size="15" fill="#F0C769" font-weight="850" text-anchor="start">agent.4</text><text x="914" y="1048" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• three responsibility landmarks</text><text x="914" y="1066" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• ordinary-accessible-human route</text><text x="914" y="1084" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• honor/correction/removal protoc</text><rect x="1168" y="992" width="252" height="104" rx="14" fill="#173F54" stroke="none" stroke-width="0"/><text x="1184" y="1022" font-size="15" fill="#F0C769" font-weight="850" text-anchor="start">agent.5</text><text x="1184" y="1048" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• commute culture story</text><text x="1184" y="1066" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• five-layer wayfinding</text><text x="1184" y="1084" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• international copy</text><rect x="1438" y="992" width="252" height="104" rx="14" fill="#143A50" stroke="none" stroke-width="0"/><text x="1454" y="1022" font-size="15" fill="#F0C769" font-weight="850" text-anchor="start">agent.6</text><text x="1454" y="1048" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• four-season operations</text><text x="1454" y="1066" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• P0-to-P2 conversion</text><text x="1454" y="1084" font-size="11" fill="#D4E1E8" font-weight="550" text-anchor="start">• public review</text><text x="60" y="1170" font-size="13" fill="#617487" font-weight="600" text-anchor="start">品牌、区域协同、案例转译、地标和活动均为概念成果，不代表合作、投资、审批、建设、运营或活动承诺。</text><text x="1740" y="1170" font-size="13" fill="#617487" font-weight="700" text-anchor="end">147228 · PROVISIONAL · SOURCED CASES · HUMAN RELEASE</text></svg>
