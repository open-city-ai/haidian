<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise–resident mobility system efficiency v1.3</title>
  <desc id="desc">Candidate efficiency, grouped demand composition, hard gates and key readouts for a 1000-unit design sandbox. Values are synthetic sensitivities, not a Haidian baseline.</desc>
  <defs>
    <pattern id="blocked" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#fff4f7"/><rect width="5" height="18" fill="#ef6c96" opacity=".42"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173555" flood-opacity=".10"/></filter>
    <style>
      .sans{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .ink{fill:#102744}.muted{fill:#6e8eac}.teal{fill:#0e9f95}.white{fill:#fff}.small{font-size:22px}.body{font-size:28px}.label{font-size:30px;font-weight:700}.value{font-size:48px;font-weight:800}.title{font-size:68px;font-weight:800}
    </style>
  </defs>
  <rect width="2400" height="1600" fill="#f4f8f9"/>
  <rect x="70" y="60" width="2260" height="270" rx="34" fill="#102744" filter="url(#shadow)"/>
  <text x="120" y="116" class="sans teal" font-size="28" font-weight="800" letter-spacing="3">COMMUTE CO-BENEFIT COMMONS / MODEL v1.3 / SYSTEM READOUT</text>
  <text x="120" y="205" class="sans white title">Enterprise–resident mobility system efficiency</text>
  <text x="120" y="263" class="sans" font-size="30" fill="#b7ccdf">1,000 normalized design units · gates first, then service, resource and equity comparison · synthetic sensitivity, not a local baseline</text>
  <rect x="1900" y="112" width="340" height="58" rx="29" fill="#174462"/><text x="2070" y="150" text-anchor="middle" class="sans" font-size="23" fill="#7fe1d4" font-weight="800">PROVISIONAL / LOCAL AUDIT OPEN</text>

  <rect x="70" y="375" width="1480" height="610" rx="30" fill="#fff" stroke="#d8e6ea" stroke-width="3" filter="url(#shadow)"/>
  <text x="120" y="440" class="sans ink" font-size="34" font-weight="800">CANDIDATE EFFICIENCY</text>
  <text x="120" y="480" class="sans muted body">efficiency_index is for design comparison only; the dashed line marks the proposed 75 screening floor</text>
  <line x1="120" y1="520" x2="1420" y2="520" stroke="#d8e6ea" stroke-width="3"/><line x1="1095" y1="535" x2="1095" y2="900" stroke="#ef715a" stroke-width="3" stroke-dasharray="12 12"/>
  <text x="1095" y="550" text-anchor="middle" class="sans" font-size="22" fill="#ef715a" font-weight="700">75 / SCREENING FLOOR</text>
  <text x="120" y="610" class="sans ink label">S0</text><text x="205" y="610" class="sans ink" font-size="29">UNMANAGED PEAK</text><rect x="540" y="580" width="880" height="54" rx="27" fill="#eaf2f4"/><rect x="540" y="580" width="458" height="54" rx="27" fill="#ef715a"/><text x="1460" y="619" text-anchor="end" class="mono" font-size="44" fill="#ef715a" font-weight="800">52</text>
  <text x="120" y="725" class="sans teal label">S1</text><text x="205" y="725" class="sans ink" font-size="29">MULTIMODAL + CURB</text><rect x="540" y="695" width="880" height="54" rx="27" fill="#eaf2f4"/><rect x="540" y="695" width="722" height="54" rx="27" fill="#0e9f95"/><text x="1460" y="734" text-anchor="end" class="mono" font-size="44" fill="#0e9f95" font-weight="800">82</text>
  <text x="120" y="840" class="sans" fill="#f0a23f" font-size="30" font-weight="800">S3</text><text x="205" y="840" class="sans ink" font-size="29">GROUND FALLBACK</text><rect x="540" y="810" width="880" height="54" rx="27" fill="#eaf2f4"/><rect x="540" y="810" width="651" height="54" rx="27" fill="#f0a23f"/><text x="1460" y="849" text-anchor="end" class="mono" font-size="44" fill="#f0a23f" font-weight="800">74</text>
  <text x="120" y="925" class="sans" fill="#db4f87" font-size="30" font-weight="800">S2</text><text x="205" y="925" class="sans ink" font-size="29">AIR CANDIDATE</text><rect x="540" y="895" width="880" height="54" rx="27" fill="url(#blocked)" stroke="#db4f87" stroke-width="3"/><rect x="1210" y="902" width="172" height="40" rx="20" fill="#fff" stroke="#db4f87" stroke-width="2"/><text x="1296" y="929" text-anchor="middle" class="sans" font-size="20" fill="#db4f87" font-weight="800">BLOCKED</text><text x="1460" y="934" text-anchor="end" class="mono" font-size="40" fill="#db4f87" font-weight="800">—</text>

  <rect x="1590" y="375" width="740" height="610" rx="30" fill="#102744" filter="url(#shadow)"/>
  <text x="1640" y="440" class="sans white" font-size="34" font-weight="800">WHO MOVES / 谁在网络里</text><text x="1640" y="480" class="sans" font-size="25" fill="#b7ccdf">Grouped OD, no personal continuous traces · total = 1,000</text>
  <rect x="1640" y="535" width="640" height="38" rx="19" fill="#23445f"/><rect x="1640" y="535" width="288" height="38" rx="19" fill="#0e9f95"/><rect x="1928" y="535" width="243" height="38" fill="#6981e9"/><rect x="2171" y="535" width="38" height="38" fill="#ef715a"/><rect x="2209" y="535" width="32" height="38" fill="#f0a23f"/><rect x="2241" y="535" width="26" height="38" fill="#db4f87"/><rect x="2267" y="535" width="13" height="38" rx="7" fill="#67d6c5"/>
  <text x="1640" y="620" class="sans" font-size="25" fill="#7fe1d4">Enterprise employees</text><text x="1940" y="620" class="mono" font-size="29" fill="#fff" font-weight="800">450</text><text x="1640" y="673" class="sans" font-size="25" fill="#9eb5ef">Residents</text><text x="1940" y="673" class="mono" font-size="29" fill="#fff" font-weight="800">380</text>
  <text x="1640" y="726" class="sans" font-size="25" fill="#ffaf9c">Carers / children</text><text x="1940" y="726" class="mono" font-size="29" fill="#fff" font-weight="800">60</text><text x="2080" y="620" class="sans" font-size="25" fill="#ffc56f">Visitors</text><text x="2240" y="620" class="mono" font-size="29" fill="#fff" font-weight="800">50</text><text x="2080" y="673" class="sans" font-size="25" fill="#ef8db2">Logistics</text><text x="2240" y="673" class="mono" font-size="29" fill="#fff" font-weight="800">40</text><text x="2080" y="726" class="sans" font-size="25" fill="#7fe1d4">Night workers</text><text x="2240" y="726" class="mono" font-size="29" fill="#fff" font-weight="800">20</text>
  <line x1="1640" y1="770" x2="2280" y2="770" stroke="#31546e" stroke-width="2"/><text x="1640" y="820" class="sans" font-size="25" fill="#b7ccdf">S2 air candidate: excluded from the choice set</text><text x="1640" y="865" class="sans" font-size="24" fill="#fff">Airspace · airworthiness · operator · insurance · weather · noise · fire · public review</text><rect x="1640" y="900" width="640" height="48" rx="24" fill="#173d59" stroke="#db4f87" stroke-width="2"/><text x="1960" y="932" text-anchor="middle" class="sans" font-size="23" fill="#ffabc5" font-weight="800">GROUND-FIRST / HUMAN SERVICE / RECALLABLE</text>

  <rect x="70" y="1030" width="2260" height="425" rx="30" fill="#fff" stroke="#d8e6ea" stroke-width="3" filter="url(#shadow)"/>
  <text x="120" y="1095" class="sans ink" font-size="34" font-weight="800">WHAT MOVES / S1 KEY READOUTS</text><text x="120" y="1135" class="sans muted body">Design sensitivity versus S0; each value must be replaced by dated local observations before operational use</text>
  <g class="sans"><rect x="120" y="1180" width="335" height="190" rx="22" fill="#eef7f5"/><text x="150" y="1230" class="muted small">Generalized cost index ↓</text><text x="150" y="1300" class="ink value">100 → 78</text><text x="150" y="1340" class="teal small" font-weight="700">−22 / synthetic</text><rect x="475" y="1180" width="335" height="190" rx="22" fill="#f1f3fb"/><text x="505" y="1230" class="muted small">Transfer reliability ↑</text><text x="505" y="1300" class="ink value">72 → 88%</text><text x="505" y="1340" fill="#6981e9" class="small" font-weight="700">+16 pp / synthetic</text><rect x="830" y="1180" width="335" height="190" rx="22" fill="#fff3ef"/><text x="860" y="1230" class="muted small">People-flow conflicts ↓</text><text x="860" y="1300" class="ink value">12.4 → 5.8</text><text x="860" y="1340" fill="#ef715a" class="small" font-weight="700">per 1,000 units</text><rect x="1185" y="1180" width="335" height="190" rx="22" fill="#fff7e9"/><text x="1215" y="1230" class="muted small">External car inflow ↓</text><text x="1215" y="1300" class="ink value">42 → 25%</text><text x="1215" y="1340" fill="#f0a23f" class="small" font-weight="700">−17 pp / synthetic</text><rect x="1540" y="1180" width="335" height="190" rx="22" fill="#fff0f5"/><text x="1570" y="1230" class="muted small">Worst-group gap ↓</text><text x="1570" y="1300" class="ink value">22 → 9</text><text x="1570" y="1340" fill="#db4f87" class="small" font-weight="700">points / guardrail</text><rect x="1895" y="1180" width="335" height="190" rx="22" fill="#eef7f5"/><text x="1925" y="1230" class="muted small">Energy index ↓</text><text x="1925" y="1300" class="ink value">100 → 77</text><text x="1925" y="1340" class="teal small" font-weight="700">−23 / synthetic</text></g>
  <text x="120" y="1415" class="sans muted" font-size="22">Source: visual/assets/movement-simulation.json · v1.3 · grouped OD · no personal trajectory · S2 remains blocked until regulatory, safety and public-interest review.</text>
</svg>
