<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-labelledby="title desc">
  <title id="title">Where to stop when a test fails, and who takes over</title>
  <desc id="desc">Three design gates connect capacity pressure, missing hard evidence and weak fallback coverage to freezing bookings, human or public-transport takeover, logging and a return to P0. Thresholds are design targets or synthetic stress-screen inputs, not field operating results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091b31"/><stop offset="1" stop-color="#153f4d"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111f" flood-opacity=".24"/></filter>
    <style>
      .sans{font-family:"Helvetica Neue",Arial,sans-serif}.white{fill:#f5fbfb}.muted{fill:#a9c4c9}.teal{fill:#74e1c5}.ink{fill:#102c3c}.title{font-size:60px;font-weight:850;letter-spacing:-2px}.label{font-size:27px;font-weight:850}.card{fill:#f5f9fa}.arrow{stroke:#59d9bd;stroke-width:6;fill:none;stroke-linecap:round}
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 z" fill="#59d9bd"/></marker>
  </defs>
  <rect width="2400" height="1400" fill="url(#bg)"/>
  <text x="110" y="82" class="sans teal" font-size="25" font-weight="800" letter-spacing="4">COMMUTE CO-BENEFIT COMMONS / FAILURE AND RECOURSE / v2.26</text>
  <text x="110" y="165" class="sans white title">Where to stop when a test fails, and who takes over</text>
  <text x="110" y="215" class="sans muted" font-size="25">Capacity, accessibility, fire, privacy and human-service gates form one replayable fallback chain</text>
  <rect x="1900" y="70" width="390" height="78" rx="39" fill="#3d2d2d" stroke="#ff9d91" stroke-width="2"/>
  <text x="2095" y="119" text-anchor="middle" class="sans" fill="#ff9d91" font-size="21" font-weight="850">DESIGN GATES / NOT FIELD RESULTS</text>

  <g filter="url(#shadow)">
    <rect x="110" y="285" width="700" height="310" rx="28" fill="#fdf3f1" stroke="#ff9d91" stroke-width="3"/>
    <rect x="850" y="285" width="700" height="310" rx="28" fill="#fff8e6" stroke="#f6c96f" stroke-width="3"/>
    <rect x="1590" y="285" width="700" height="310" rx="28" fill="#eaf9f5" stroke="#5bd7bd" stroke-width="3"/>
  </g>
  <text x="155" y="355" class="sans ink label">01  Capacity pressure</text><text x="150" y="410" class="sans" fill="#735b58" font-size="22">Edge or node pressure above 1.35x</text><text x="150" y="448" class="sans" fill="#735b58" font-size="22">or a residual queue remains</text><text x="150" y="510" class="sans" fill="#b64f43" font-size="22" font-weight="850">Stop at calibration</text><text x="150" y="548" class="sans" fill="#735b58" font-size="20">Add dated headway, service and capacity evidence</text>
  <text x="895" y="355" class="sans ink label">02  Hard evidence missing</text><text x="890" y="410" class="sans" fill="#765d43" font-size="22">Fire, accessibility, privacy, owner</text><text x="890" y="448" class="sans" fill="#765d43" font-size="22">or human-equivalent service is unproven</text><text x="890" y="510" class="sans" fill="#a87921" font-size="22" font-weight="850">Freeze new bookings</text><text x="890" y="548" class="sans" fill="#765d43" font-size="20">Keep human, phone, paper and public-transport access</text>
  <text x="1635" y="355" class="sans ink label">03  Fallback is too weak</text><text x="1630" y="410" class="sans" fill="#416d69" font-size="22">Coverage below 0.70, recovery above 45 min</text><text x="1630" y="448" class="sans" fill="#416d69" font-size="22">or worst-group gap above 24 points</text><text x="1630" y="510" class="sans" fill="#148873" font-size="22" font-weight="850">Return to P0</text><text x="1630" y="548" class="sans" fill="#416d69" font-size="20">Collect evidence, audit access and publish response</text>

  <rect x="110" y="680" width="2180" height="430" rx="30" class="card" filter="url(#shadow)"/>
  <text x="155" y="745" class="sans ink" font-size="33" font-weight="850">Read it in one line: trigger → freeze → take over → log → review</text>
  <text x="155" y="785" class="sans" fill="#668095" font-size="20">Every step keeps a human entry point; thresholds are design targets or synthetic stress-screen inputs, not pilot approval</text>
  <g>
    <rect x="155" y="850" width="300" height="170" rx="22" fill="#fff0ed" stroke="#ff9d91" stroke-width="2"/><text x="205" y="905" class="sans" fill="#b64f43" font-size="23" font-weight="850">TRIGGER</text><text x="205" y="950" class="sans ink" font-size="23">Pressure, conflict, gap</text><text x="205" y="990" class="sans" fill="#735b58" font-size="19">Date and accountable role</text>
    <path d="M475 935 H525" class="arrow" marker-end="url(#arrow)"/>
    <rect x="555" y="850" width="300" height="170" rx="22" fill="#fff8e6" stroke="#f6c96f" stroke-width="2"/><text x="605" y="905" class="sans" fill="#a87921" font-size="23" font-weight="850">FREEZE</text><text x="605" y="950" class="sans ink" font-size="23">Stop new bookings</text><text x="605" y="990" class="sans" fill="#765d43" font-size="19">Keep emergency clearance</text>
    <path d="M875 935 H925" class="arrow" marker-end="url(#arrow)"/>
    <rect x="955" y="850" width="300" height="170" rx="22" fill="#eaf9f5" stroke="#5bd7bd" stroke-width="2"/><text x="1005" y="905" class="sans" fill="#148873" font-size="23" font-weight="850">TAKE OVER</text><text x="1005" y="950" class="sans ink" font-size="23">Human / bus / metro</text><text x="1005" y="990" class="sans" fill="#416d69" font-size="19">Accessibility route first</text>
    <path d="M1275 935 H1325" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1355" y="850" width="300" height="170" rx="22" fill="#edf5ff" stroke="#6da7ff" stroke-width="2"/><text x="1405" y="905" class="sans" fill="#4374bc" font-size="23" font-weight="850">LOG</text><text x="1405" y="950" class="sans ink" font-size="23">Gap, complaint, handoff</text><text x="1405" y="990" class="sans" fill="#506b8d" font-size="19">Publish aggregates only</text>
    <path d="M1675 935 H1725" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1755" y="850" width="440" height="170" rx="22" fill="#f1edff" stroke="#9d8be8" stroke-width="2"/><text x="1805" y="905" class="sans" fill="#7160bc" font-size="23" font-weight="850">REVIEW</text><text x="1805" y="950" class="sans ink" font-size="23">Collect, repair or withdraw</text><text x="1805" y="990" class="sans" fill="#62558e" font-size="19">No baseline, remain at P0</text>
  </g>
  <rect x="110" y="1180" width="2180" height="105" rx="22" fill="#102d43" stroke="#2c6370"/>
  <text x="155" y="1224" class="sans teal" font-size="21" font-weight="850">M-09 / NETWORK / RESILIENCE</text><text x="155" y="1263" class="sans white" font-size="20">PASS means state and fallback logic can be replayed　·　not field access, staffing, public acceptance, operating approval or real performance</text>
</svg>
