    <text x="832" y="586" class="ink label">地铁</text><rect x="950" y="568" width="132" height="14" rx="7" fill="#dce8eb"/><rect x="950" y="568" width="75" height="14" rx="7" fill="#50bdf2"/><text x="1120" y="586" class="mono ink" font-size="17">8.99M</text><text x="1290" y="586" class="mono ink" font-size="17">0.79×</text><text x="1488" y="586" text-anchor="end" class="mono ink" font-size="17" font-weight="800">7.07M</text>
    <text x="832" y="652" class="ink label">公交</text><rect x="950" y="634" width="132" height="14" rx="7" fill="#dce8eb"/><rect x="950" y="634" width="47" height="14" rx="7" fill="#73a9ff"/><text x="1120" y="652" class="mono ink" font-size="17">5.69M</text><text x="1290" y="652" class="mono ink" font-size="17">1.24×</text><text x="1488" y="652" text-anchor="end" class="mono ink" font-size="17" font-weight="800">7.02M</text>
