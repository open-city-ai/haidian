  </g>
  <rect x="832" y="866" width="656" height="42" rx="13" fill="#fff4d7" stroke="#e5af2f"/><text x="850" y="892" class="sans" fill="#916d10" font-size="15" font-weight="700">企业接驳 1.82M pkm：因燃料/电力/载客率未知，保留 UNKNOWN，不计入已知指数。</text>

  <rect x="78" y="934" width="1444" height="102" rx="20" fill="#102d43" stroke="#2c6971"/>
  <text x="110" y="970" class="sans white" font-size="18" font-weight="800">边界：这是“方法强度 × 合成人均公里”的相对压力屏，不是本地 kWh、MJ、gCO₂e、车队、班次或环境收益证明。</text>
  <text x="110" y="1002" class="sans muted" font-size="15">下一步：用日期化电力/燃料、车队里程、载客率、15 分钟客流和生命周期边界替换外部方法因子；不因指数下降绕过容量、无障碍、安全和人工服务硬门。</text>
  <text x="110" y="1025" class="sans muted" font-size="14">Source: EEA-GHG-PASSENGER-MODES · NCHRP-2024-59-ENERGY · regional-scale-commute-readout.json · synthetic, aggregate only</text>
