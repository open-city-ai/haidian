  <text x="78" y="130" class="sans white title">居民—企业交通：相对资源压力账本</text>
  <text x="78" y="171" class="sans muted" font-size="20">O4 容量平衡候选 · 已知方式 = 合成人均公里 × 外部方法强度 · 只发布聚合值</text>
