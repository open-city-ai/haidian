      .white{fill:#f5fbfc}.muted{fill:#9dbbc7}.teal{fill:#5be2c1}.ink{fill:#0c263a}.blue{fill:#50bdf2}.blue2{fill:#73a9ff}.green{fill:#45d58e}.amber{fill:#f6c55e}.coral{fill:#fb778d}.violet{fill:#b68cff}
      .title{font-size:48px;font-weight:800}.h2{font-size:27px;font-weight:800}.label{font-size:21px;font-weight:700}.small{font-size:17px}.tiny{font-size:15px}.value{font-size:39px;font-weight:800}
    </style>
