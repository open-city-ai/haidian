ss="mono ink" font-size="17">1.00×</text><text x="1488" y="850" text-anchor="end" class="mono ink" font-size="17" font-weight="800">5.98M</text></g><rect x="832" y="866" width="656" height="42" rx="13" fill="#fff4d7" stroke="#e5af2f"/><text x="850" y="892" class="sans" fill="#916d10" font-size="15" font-weight="700">Enterprise shuttle 1.82M pkm: fuel/power/occupancy unknown, so it stays UNKNOWN and is excluded.</text>

  <rect x="78" y="934" width="1444" height="102" rx="20" fill="#102d43" stroke="#2c6971"/><text x="110" y="970" class="sans white" font-size="18" font-weight="800">Boundary: this is relative “method intensity × synthetic passenger-km”, not local kWh, MJ, gCO₂e, fleet, timetable or environmental-benefit proof.</text><text x="110" y="1002" class="sans muted" font-size="15">Next: replace external factors with dated electricity/fuel, fleet-km, occupancy, 15-minute passenger flow and life-cycle boundaries; no index reduction overrides capacity, accessibility, safety or human-service gates.</text><text x="110" y="1025" class="sans muted" font-size="14">Source: EEA-GHG-PASSENGER-MODES · NCHRP-2024-59-ENERGY · regional-scale-commute-readout.json · synthetic, aggregate only</text>
