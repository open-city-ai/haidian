<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise–resident mobility: relative resource-pressure ledger</title>
  <desc id="desc">A relative resource-pressure screen using synthetic passenger-kilometres and external method intensities. O4 reduces the known-mode relative index by 30.4% versus B0; enterprise shuttle intensity remains unknown.</desc>
