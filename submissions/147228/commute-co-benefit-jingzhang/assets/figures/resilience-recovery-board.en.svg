<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc">
  <title id="title">Recovery-time ledger: residents, metro and ground fallback</title>
  <desc id="desc">Three synthetic events, fallback coverage, slowest-group recovery proxy and a seven-group matrix. Values are synthetic stress-test outputs, not local incidents or resilience observations.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1830"/><stop offset="1" stop-color="#174f63"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#11a79d"/><stop offset="1" stop-color="#62d9bd"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e79a37"/><stop offset="1" stop-color="#ffd37d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0b1830" flood-opacity=".14"/></filter>
    <style>
      .sans{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}.ink{fill:#10243b}.muted{fill:#6f8799}.white{fill:#f7fbff}.tealText{fill:#0d8f87}.amberText{fill:#b36d17}.redText{fill:#cf5c5b}.line{stroke:#dce8ee;stroke-width:2}.title{font-size:54px;font-weight:800}.subtitle{font-size:24px}.kicker{font-size:19px;font-weight:800;letter-spacing:3px}.h2{font-size:29px;font-weight:800}.body{font-size:21px}.small{font-size:18px}.tiny{font-size:15px}.num{font-size:42px;font-weight:800}.label{font-size:18px;font-weight:700}.card{fill:#fff;stroke:#d8e5eb;stroke-width:2}.chip{font-size:16px;font-weight:800}.matrix{font-size:17px;font-weight:700}
    </style>
  </defs>
  <rect width="2000" height="1400" fill="#f3f7fa"/><rect width="2000" height="310" fill="url(#hero)"/>
  <circle cx="1840" cy="-20" r="360" fill="#49cdb5" opacity=".08"/><circle cx="1690" cy="250" r="230" fill="#f4be5b" opacity=".08"/>
  <text x="82" y="68" class="sans kicker" fill="#70d7c5">COMMUTE CO-BENEFIT COMMONS / B3 / REVIEW BOARD</text>
  <text x="82" y="142" class="sans title white">Recovery-time ledger</text>
  <text x="82" y="190" class="sans subtitle" fill="#bdd6e0">Residents, enterprise, metro disruption and ground fallback: making TTR proxy legible</text>
  <rect x="82" y="226" width="270" height="42" rx="21" fill="#f4be5b"/><text x="217" y="254" text-anchor="middle" class="sans chip" fill="#1b2e3a">SYNTHETIC · NOT LOCAL</text>
  <text x="1870" y="103" text-anchor="end" class="sans small" fill="#c9e2e8">GROUPED FULL-REPLAY STRESS SCREEN</text><text x="1870" y="137" text-anchor="end" class="mono small" fill="#70d7c5">3 EVENTS / 7 GROUPS / AIR BLOCKED</text>

  <rect x="82" y="350" width="410" height="145" rx="18" class="card" filter="url(#shadow)"/><text x="112" y="389" class="sans label muted">Recovery-time gate</text><text x="112" y="448" class="sans num ink">45 min</text><text x="310" y="448" class="sans small tealText">MAX TTR PROXY</text>
  <rect x="525" y="350" width="410" height="145" rx="18" class="card" filter="url(#shadow)"/><text x="555" y="389" class="sans label muted">Minimum fallback</text><text x="555" y="448" class="sans num ink">70%</text><text x="755" y="448" class="sans small tealText">FALLBACK FLOOR</text>
  <rect x="968" y="350" width="410" height="145" rx="18" class="card" filter="url(#shadow)"/><text x="998" y="389" class="sans label muted">Slowest event</text><text x="998" y="448" class="sans num redText">30.04 min</text><text x="1250" y="448" class="sans small redText">R2 / wheelchair</text>
  <rect x="1410" y="350" width="508" height="145" rx="18" fill="#10243b" filter="url(#shadow)"/><text x="1442" y="389" class="sans label" fill="#a9c8d4">Evidence status</text><text x="1442" y="438" class="sans h2 white">Synthetic gates passed</text><text x="1442" y="471" class="sans small" fill="#70d7c5">Not a local resilience / p90 result</text>

  <rect x="82" y="535" width="1296" height="630" rx="22" class="card" filter="url(#shadow)"/><text x="120" y="590" class="sans h2 ink">Event ledger · fallback coverage and slowest group</text><text x="120" y="625" class="sans small muted">70% coverage floor · 45-minute TTR gate · direct B3 runner output</text><line x1="120" y1="656" x2="1340" y2="656" class="line"/>
  <text x="120" y="690" class="sans tiny muted">EVENT</text><text x="490" y="690" class="sans tiny muted">FALLBACK COVERAGE</text><text x="900" y="690" class="sans tiny muted">SLOWEST GROUP / TTR PROXY</text><text x="1260" y="690" text-anchor="end" class="sans tiny muted">STATUS</text>
  <rect x="120" y="716" width="1220" height="116" rx="14" fill="#f6fafb"/><rect x="120" y="716" width="8" height="116" rx="4" fill="#11a79d"/><text x="154" y="753" class="sans h2 ink">R0</text><text x="220" y="753" class="sans body ink">Nominal operation</text><text x="220" y="786" class="sans small muted">No disruption / ground-first baseline</text><rect x="490" y="750" width="310" height="16" rx="8" fill="#dcebed"/><rect x="490" y="750" width="310" height="16" rx="8" fill="url(#teal)"/><text x="820" y="765" class="sans label tealText">100.00%</text><text x="900" y="753" class="sans body ink">Enterprise</text><text x="900" y="786" class="sans num tealText">2.84 min</text><rect x="1262" y="746" width="68" height="32" rx="16" fill="#d8f4ea"/><text x="1296" y="768" text-anchor="middle" class="sans chip tealText">PASS</text>
  <rect x="120" y="848" width="1220" height="116" rx="14" fill="#f6fafb"/><rect x="120" y="848" width="8" height="116" rx="4" fill="#e79a37"/><text x="154" y="885" class="sans h2 ink">R1</text><text x="220" y="885" class="sans body ink">Metro segment disruption · 30 min</text><text x="220" y="918" class="sans small muted">Declared metro → bus fallback</text><rect x="490" y="882" width="310" height="16" rx="8" fill="#dcebed"/><rect x="490" y="882" width="238" height="16" rx="8" fill="url(#amber)"/><line x1="707" y1="873" x2="707" y2="906" stroke="#cf5c5b" stroke-width="3"/><text x="742" y="897" class="sans label amberText">76.92%</text><text x="900" y="885" class="sans body ink">Wheelchair users</text><text x="900" y="918" class="sans num amberText">27.30 min</text><rect x="1262" y="878" width="68" height="32" rx="16" fill="#fff0d1"/><text x="1296" y="900" text-anchor="middle" class="sans chip amberText">PASS</text>
  <rect x="120" y="980" width="1220" height="116" rx="14" fill="#f6fafb"/><rect x="120" y="980" width="8" height="116" rx="4" fill="#e79a37"/><text x="154" y="1017" class="sans h2 ink">R2</text><text x="220" y="1017" class="sans body ink">Severe weather · bicycle to ground fallback</text><text x="220" y="1050" class="sans small muted">Declared bicycle / accessible → bus fallback</text><rect x="490" y="1014" width="310" height="16" rx="8" fill="#dcebed"/><rect x="490" y="1014" width="224" height="16" rx="8" fill="url(#amber)"/><line x1="707" y1="1005" x2="707" y2="1038" stroke="#cf5c5b" stroke-width="3"/><text x="728" y="1029" class="sans label amberText">72.14%</text><text x="900" y="1017" class="sans body ink">Wheelchair users</text><text x="900" y="1050" class="sans num amberText">30.04 min</text><rect x="1262" y="1010" width="68" height="32" rx="16" fill="#fff0d1"/><text x="1296" y="1032" text-anchor="middle" class="sans chip amberText">PASS</text>
  <text x="120" y="1135" class="sans tiny muted">TTR is derived from grouped exposure, queues and declared fallback fractions; it is not incident response time or a resident survey.</text>

  <rect x="1410" y="535" width="508" height="630" rx="22" class="card" filter="url(#shadow)"/><text x="1448" y="590" class="sans h2 ink">Seven groups · TTR matrix</text><text x="1448" y="625" class="sans small muted">minutes · darker means longer recovery proxy</text><rect x="1448" y="652" width="430" height="34" rx="10" fill="#eef5f7"/><text x="1526" y="675" text-anchor="middle" class="sans matrix tealText">R0</text><text x="1642" y="675" text-anchor="middle" class="sans matrix amberText">R1</text><text x="1758" y="675" text-anchor="middle" class="sans matrix amberText">R2</text>
  <g class="sans matrix ink"><text x="1448" y="722">Residents</text><rect x="1492" y="702" width="68" height="30" rx="8" fill="#d8f4ea"/><text x="1526" y="723" text-anchor="middle">2.36</text><rect x="1608" y="702" width="68" height="30" rx="8" fill="#f8d9a0"/><text x="1642" y="723" text-anchor="middle">16.33</text><rect x="1724" y="702" width="68" height="30" rx="8" fill="#f7cb80"/><text x="1758" y="723" text-anchor="middle">15.90</text>
    <text x="1448" y="782">Enterprise</text><rect x="1492" y="762" width="68" height="30" rx="8" fill="#d8f4ea"/><text x="1526" y="783" text-anchor="middle">2.84</text><rect x="1608" y="762" width="68" height="30" rx="8" fill="#f8d9a0"/><text x="1642" y="783" text-anchor="middle">15.79</text><rect x="1724" y="762" width="68" height="30" rx="8" fill="#f7c778"/><text x="1758" y="783" text-anchor="middle">14.79</text>
    <text x="1448" y="842">Carer / child</text><rect x="1492" y="822" width="68" height="30" rx="8" fill="#d8f4ea"/><text x="1526" y="843" text-anchor="middle">2.21</text><rect x="1608" y="822" width="68" height="30" rx="8" fill="#f4c77a"/><text x="1642" y="843" text-anchor="middle">23.62</text><rect x="1724" y="822" width="68" height="30" rx="8" fill="#f3b45f"/><text x="1758" y="843" text-anchor="middle">25.39</text>
    <text x="1448" y="902">Wheelchair users</text><rect x="1492" y="882" width="68" height="30" rx="8" fill="#d8f4ea"/><text x="1526" y="903" text-anchor="middle">2.04</text><rect x="1608" y="882" width="68" height="30" rx="8" fill="#f1b463"/><text x="1642" y="903" text-anchor="middle">27.30</text><rect x="1724" y="882" width="68" height="30" rx="8" fill="#eea44a"/><text x="1758" y="903" text-anchor="middle">30.04</text>
    <text x="1448" y="962">Visitors</text><rect x="1492" y="942" width="68" height="30" rx="8" fill="#d8f4ea"/><text x="1526" y="963" text-anchor="middle">2.32</text><rect x="1608" y="942" width="68" height="30" rx="8" fill="#f8d9a0"/><text x="1642" y="963" text-anchor="middle">16.42</text><rect x="1724" y="942" width="68" height="30" rx="8" fill="#f2c071"/><text x="1758" y="963" text-anchor="middle">20.04</text>
    <text x="1448" y="1022">Logistics / maintenance</text><rect x="1492" y="1002" width="68" height="30" rx="8" fill="#d8f4ea"/><text x="1526" y="1023" text-anchor="middle">1.16</text><rect x="1608" y="1002" width="68" height="30" rx="8" fill="#f7dca8"/><text x="1642" y="1023" text-anchor="middle">17.16</text><rect x="1724" y="1002" width="68" height="30" rx="8" fill="#f6cd8b"/><text x="1758" y="1023" text-anchor="middle">16.16</text>
    <text x="1448" y="1082">Night workers</text><rect x="1492" y="1062" width="68" height="30" rx="8" fill="#d8f4ea"/><text x="1526" y="1083" text-anchor="middle">2.66</text><rect x="1608" y="1062" width="68" height="30" rx="8" fill="#f2c071"/><text x="1642" y="1083" text-anchor="middle">26.20</text><rect x="1724" y="1062" width="68" height="30" rx="8" fill="#f4c77a"/><text x="1758" y="1083" text-anchor="middle">22.66</text></g>
  <line x1="1448" y1="1120" x2="1878" y2="1120" class="line"/><text x="1448" y="1150" class="sans tiny muted">R1 / R2 slowest group: wheelchair users</text>

  <rect x="82" y="1200" width="1836" height="132" rx="18" fill="#10243b"/><circle cx="124" cy="1244" r="10" fill="#70d7c5"/><text x="150" y="1252" class="sans body white">Next: replace proxies with dated disruption logs, weather cancellations, accessible-route completion and grouped door-to-door p90.</text><circle cx="124" cy="1290" r="10" fill="#f4be5b"/><text x="150" y="1298" class="sans body white">Protection order: wheelchair users → carers / children → residents → night workers; air candidate stays BLOCKED.</text><text x="1872" y="1252" text-anchor="end" class="mono tiny" fill="#70d7c5">MOB-RESILIENCE-RECOVERY-888</text><text x="1872" y="1298" text-anchor="end" class="sans tiny" fill="#a9c8d4">synthetic stress screen · no local resilience claim</text>
</svg>
