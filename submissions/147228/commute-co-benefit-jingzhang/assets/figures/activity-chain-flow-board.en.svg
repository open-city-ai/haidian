oke="#77e3c0" stroke-width="4"/><text x="724" y="398" class="node" text-anchor="middle">3</text><text x="791" y="445" class="nodeTitle" text-anchor="middle">work or school</text><text x="791" y="490" class="nodeSmall" text-anchor="middle">3,122,000</text><text x="791" y="520" class="nodeSmall" text-anchor="middle">synthetic agents</text><text x="791" y="548" class="nodeTiny" text-anchor="middle">ground / human fallback</text></g><g><path d="M 1184 465 H 1230" stroke="#77e3c0" stroke-width="6" stroke-linecap="round"/><path d="M 1214 450 L 1236 465 L 1214 480" fill="none" stroke="#77e3c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="970" y="350" width="214" height="230" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/><circle cx="1010" cy="390" r="25" fill="#071a2b" stroke="#77e3c0" stroke-width="4"/><text x="1010" y="398" class="node" text-anchor="middle">4</text><text x="1077" y="445" class="nodeTitle" text-anchor="middle">midday service</text><text x="1077" y="490" class="nodeSmall" text-anchor="middle">3,122,000</text><text x="1077" y="520" class="nodeSmall" text-anchor="middle">synthetic agents</text><text x="1077" y="548" class="nodeTiny" text-anchor="middle">ground / human fallback</text></g><g><path d="M 1470 465 H 1516" stroke="#77e3c0" stroke-width="6" stroke-linecap="round"/><path d="M 1500 450 L 1522 465 L 1500 480" fill="none" stroke="#77e3c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1256" y="350" width="214" height="230" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/><circle cx="1296" cy="390" r="25" fill="#071a2b" stroke="#77e3c0" stroke-width="4"/><text x="1296" y="398" class="node" text-anchor="middle">5</text><text x="1363" y="445" class="nodeTitle" text-anchor="middle">return transfer</text><text x="1363" y="490" class="nodeSmall" text-anchor="middle">3,122,000</text><text x="1363" y="520" class="nodeSmall" text-anchor="middle">synthetic agents</text><text x="1363" y="548" class="nodeTiny" text-anchor="middle">ground / human fallback</text></g><g><rect x="1542" y="350" width="214" height="230" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/><circle cx="1582" cy="390" r="25" fill="#071a2b" stroke="#77e3c0" stroke-width="4"/><text x="1582" y="398" class="node" text-anchor="middle">6</text><text x="1649" y="445" class="nodeTitle" text-anchor="middle">home arrival</text><text x="1649" y="490" class="nodeSmall" text-anchor="middle">3,122,000</text><text x="1649" y="520" class="nodeSmall" text-anchor="middle">synthetic agents</text><text x="1649" y="548" class="nodeTiny" text-anchor="middle">ground / human fallback</text></g>
  <rect x="110" y="690" width="1678" height="132" rx="22" fill="#102f42" stroke="#2f6672" stroke-width="2"/>
  <text x="142" y="736" class="nodeTiny" text-anchor="start">Replay rule</text><text x="142" y="776" class="nodeSmall" text-anchor="start">Each agent is counted on every declared activity link; only grouped counts are retained.</text>
  <text x="142" y="852" class="foot" text-anchor="start">The chain is a design contract. It does not describe observed household schedules, local demand, or completed services.</text>
