<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-labelledby="title desc">
  <title id="title">失败时先停在哪里，下一步由谁接手</title>
  <desc id="desc">三类设计闸门把容量压力、硬门缺证和回退不足连接到冻结、人工或公共交通接管、记录与回到 P0。阈值属于设计目标或合成压力屏查，不代表现场运行结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091b31"/><stop offset="1" stop-color="#153f4d"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38c6ab"/><stop offset="1" stop-color="#7be3c9"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00111f" flood-opacity=".24"/></filter>
    <style>
      .sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.white{fill:#f5fbfb}.muted{fill:#a9c4c9}.teal{fill:#74e1c5}.amber{fill:#ffd37a}.coral{fill:#ff9d91}.ink{fill:#102c3c}.small{font-size:20px}.label{font-size:27px;font-weight:850}.value{font-size:43px;font-weight:850}.title{font-size:60px;font-weight:850;letter-spacing:-2px}.card{fill:#f5f9fa}.line{stroke:#d4e4e7;stroke-width:2}.arrow{stroke:#59d9bd;stroke-width:6;fill:none;stroke-linecap:round}.state{font-size:19px;font-weight:850}
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 z" fill="#59d9bd"/></marker>
  </defs>
  <rect width="2400" height="1400" fill="url(#bg)"/>
  <text x="110" y="82" class="sans teal" font-size="25" font-weight="800" letter-spacing="4">COMMUTE CO-BENEFIT COMMONS / FAILURE AND RECOURSE / v2.26</text>
  <text x="110" y="165" class="sans white title">失败时先停在哪里，下一步由谁接手</text>
  <text x="110" y="215" class="sans muted" font-size="25">把容量、无障碍、消防、隐私和人工服务门槛画成一条可回放的回退链</text>
  <rect x="1900" y="70" width="390" height="78" rx="39" fill="#3d2d2d" stroke="#ff9d91" stroke-width="2"/>
  <text x="2095" y="119" text-anchor="middle" class="sans coral" font-size="21" font-weight="850">DESIGN GATES / NOT FIELD RESULTS</text>

  <g filter="url(#shadow)">
    <rect x="110" y="285" width="700" height="310" rx="28" fill="#fdf3f1" stroke="#ff9d91" stroke-width="3"/>
    <rect x="850" y="285" width="700" height="310" rx="28" fill="#fff8e6" stroke="#f6c96f" stroke-width="3"/>
    <rect x="1590" y="285" width="700" height="310" rx="28" fill="#eaf9f5" stroke="#5bd7bd" stroke-width="3"/>
  </g>
  <circle cx="160" cy="345" r="27" fill="#e87667"/><text x="160" y="353" text-anchor="middle" class="sans white" font-size="23" font-weight="850">01</text>
  <text x="210" y="355" class="sans ink label">容量压力</text><text x="150" y="410" class="sans" fill="#735b58" font-size="22">边或节点压力超过 1.35 倍</text><text x="150" y="448" class="sans" fill="#735b58" font-size="22">或存在剩余队列</text>
  <text x="150" y="510" class="sans" fill="#b64f43" font-size="22" font-weight="850">先停在校准</text><text x="150" y="548" class="sans" fill="#735b58" font-size="20">补时段、班次和容量证据，再比较候选</text>

  <circle cx="900" cy="345" r="27" fill="#d7a845"/><text x="900" y="353" text-anchor="middle" class="sans white" font-size="23" font-weight="850">02</text>
  <text x="950" y="355" class="sans ink label">硬门缺证</text><text x="890" y="410" class="sans" fill="#765d43" font-size="22">消防、无障碍、隐私、责任人</text><text x="890" y="448" class="sans" fill="#765d43" font-size="22">或人工等价服务没有证据</text>
  <text x="890" y="510" class="sans" fill="#a87921" font-size="22" font-weight="850">冻结新预约</text><text x="890" y="548" class="sans" fill="#765d43" font-size="20">保留人工、电话、纸面和公共交通入口</text>

  <circle cx="1640" cy="345" r="27" fill="#2daf99"/><text x="1640" y="353" text-anchor="middle" class="sans white" font-size="23" font-weight="850">03</text>
  <text x="1690" y="355" class="sans ink label">回退撑不住</text><text x="1630" y="410" class="sans" fill="#416d69" font-size="22">覆盖低于 0.70，恢复超过 45 分钟</text><text x="1630" y="448" class="sans" fill="#416d69" font-size="22">或最差群体差距超过 24 分</text>
  <text x="1630" y="510" class="sans" fill="#148873" font-size="22" font-weight="850">回到 P0</text><text x="1630" y="548" class="sans" fill="#416d69" font-size="20">调查、审计、人工服务和公开回应先补齐</text>

  <rect x="110" y="680" width="2180" height="430" rx="30" class="card" filter="url(#shadow)"/>
  <text x="155" y="745" class="sans ink" font-size="33" font-weight="850">一眼看懂：触发 → 冻结 → 接管 → 记录 → 复核</text>
  <text x="155" y="785" class="sans" fill="#668095" font-size="20">每一步都有人工入口；阈值是设计目标或合成屏查输入，不能单独批准试点</text>
  <g>
    <rect x="155" y="850" width="300" height="170" rx="22" fill="#fff0ed" stroke="#ff9d91" stroke-width="2"/><text x="205" y="905" class="sans" fill="#b64f43" font-size="23" font-weight="850">触发</text><text x="205" y="950" class="sans ink" font-size="23">压力、冲突、缺证</text><text x="205" y="990" class="sans" fill="#735b58" font-size="19">记录日期与责任人</text>
    <path d="M475 935 H525" class="arrow" marker-end="url(#arrow)"/>
    <rect x="555" y="850" width="300" height="170" rx="22" fill="#fff8e6" stroke="#f6c96f" stroke-width="2"/><text x="605" y="905" class="sans" fill="#a87921" font-size="23" font-weight="850">冻结</text><text x="605" y="950" class="sans ink" font-size="23">停止新预约</text><text x="605" y="990" class="sans" fill="#765d43" font-size="19">保留应急净空</text>
    <path d="M875 935 H925" class="arrow" marker-end="url(#arrow)"/>
    <rect x="955" y="850" width="300" height="170" rx="22" fill="#eaf9f5" stroke="#5bd7bd" stroke-width="2"/><text x="1005" y="905" class="sans" fill="#148873" font-size="23" font-weight="850">接管</text><text x="1005" y="950" class="sans ink" font-size="23">人工 / 公交 / 地铁</text><text x="1005" y="990" class="sans" fill="#416d69" font-size="19">无障碍路线优先</text>
    <path d="M1275 935 H1325" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1355" y="850" width="300" height="170" rx="22" fill="#edf5ff" stroke="#6da7ff" stroke-width="2"/><text x="1405" y="905" class="sans" fill="#4374bc" font-size="23" font-weight="850">记录</text><text x="1405" y="950" class="sans ink" font-size="23">缺口、投诉、交接</text><text x="1405" y="990" class="sans" fill="#506b8d" font-size="19">只发布聚合结果</text>
    <path d="M1675 935 H1725" class="arrow" marker-end="url(#arrow)"/>
    <rect x="1755" y="850" width="440" height="170" rx="22" fill="#f1edff" stroke="#9d8be8" stroke-width="2"/><text x="1805" y="905" class="sans" fill="#7160bc" font-size="23" font-weight="850">复核</text><text x="1805" y="950" class="sans ink" font-size="23">补证据，修复或撤回</text><text x="1805" y="990" class="sans" fill="#62558e" font-size="19">没有基线就停在 P0</text>
  </g>

  <rect x="110" y="1180" width="2180" height="105" rx="22" fill="#102d43" stroke="#2c6370"/>
  <text x="155" y="1224" class="sans teal" font-size="21" font-weight="850">M-09 / NETWORK / RESILIENCE</text><text x="155" y="1263" class="sans white" font-size="20">PASS 只说明状态与回退逻辑可复演　·　不说明现场可达、人员值守、公众接受、运营批准或真实绩效</text>
</svg>
