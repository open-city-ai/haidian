<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">一次空间裁决：通勤共益的公共回程优先</title>
  <desc id="desc">三种空间替代方案、五级设计尺度、三个重点节点与五项公共权利。当前决策为 HOLD，边界和现场结果均未授权。</desc>
  <rect width="1600" height="1000" fill="#071a2b"/>
  <rect x="52" y="48" width="1496" height="108" rx="20" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="88" y="94" fill="#77e3c0" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">COMMUTE COMMONS / SPATIAL DECISION</text>
  <text x="88" y="136" fill="#f4fbff" font-family="Arial, sans-serif" font-size="36" font-weight="800">一次空间裁决：先保护公共回程，再决定如何调度</text>
  <rect x="1260" y="82" width="230" height="52" rx="26" fill="#6b3f2a" stroke="#f6c76b" stroke-width="2"/>
  <text x="1375" y="116" text-anchor="middle" fill="#f6c76b" font-family="Arial, sans-serif" font-size="22" font-weight="800">HOLD · NOT FIELD-RUN</text>

  <rect x="52" y="190" width="520" height="610" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="84" y="238" fill="#77e3c0" font-family="Arial, sans-serif" font-size="21" font-weight="800">01 / 三种候选，不把偏好冒充结论</text>
  <rect x="84" y="274" width="456" height="132" rx="16" fill="#34252a" stroke="#d76b55" stroke-width="2"/>
  <text x="110" y="312" fill="#f6c76b" font-family="Arial, sans-serif" font-size="18" font-weight="800">ALT-A  企业优先预约路缘</text>
  <text x="110" y="348" fill="#f4fbff" font-family="Arial, sans-serif" font-size="16">REJECT / 挤压普通与无障碍回程</text>
  <text x="110" y="379" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">单一数字队列不能替代独立公共路径与人工接收人</text>
  <rect x="84" y="430" width="456" height="132" rx="16" fill="#403624" stroke="#f6c76b" stroke-width="2"/>
  <text x="110" y="468" fill="#f6c76b" font-family="Arial, sans-serif" font-size="18" font-weight="800">ALT-B  三处独立接驳窗口</text>
  <text x="110" y="504" fill="#f4fbff" font-family="Arial, sans-serif" font-size="16">REVISE / 交接、申诉与熄火责任分散</text>
  <text x="110" y="535" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">需要共用回执、维护名单与公共关闭卡</text>
  <rect x="84" y="586" width="456" height="170" rx="16" fill="#123c3c" stroke="#77e3c0" stroke-width="2"/>
  <text x="110" y="624" fill="#77e3c0" font-family="Arial, sans-serif" font-size="18" font-weight="800">ALT-C  公共脊 + 可逆路缘窗口</text>
  <text x="110" y="660" fill="#f4fbff" font-family="Arial, sans-serif" font-size="16">ADVANCE TO DESIGN REVIEW / 进入专业深化</text>
  <text x="110" y="694" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">轨道公交、普通回程、无障碍和人工路径先成立</text>
  <text x="110" y="722" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">预约服务可暂停、可撤除；当前仍不授权、不运行</text>

  <rect x="604" y="190" width="430" height="610" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="636" y="238" fill="#77e3c0" font-family="Arial, sans-serif" font-size="21" font-weight="800">02 / 五级尺度，逐级问一个问题</text>
  <g font-family="Arial, sans-serif">
    <rect x="636" y="274" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="305" fill="#f4fbff" font-size="17" font-weight="800">1:5000  轨道—公交—公共脊</text><text x="660" y="330" fill="#91b5bf" font-size="13">看全天活动链的区域骨架</text>
    <rect x="636" y="362" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="393" fill="#f4fbff" font-size="17" font-weight="800">1:2000  三处重点区与交接</text><text x="660" y="418" fill="#91b5bf" font-size="13">看照护、到岗、维护如何相遇</text>
    <rect x="636" y="450" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="481" fill="#f4fbff" font-size="17" font-weight="800">1:500  站口 / 路缘公共界面</text><text x="660" y="506" fill="#91b5bf" font-size="13">看普通、无障碍、人工三条路径</text>
    <rect x="636" y="538" width="366" height="74" rx="12" fill="#102f42"/><text x="660" y="569" fill="#f4fbff" font-size="17" font-weight="800">1:200  等候—交接—撤退断面</text><text x="660" y="594" fill="#91b5bf" font-size="13">看 booked / service 不堵公共路</text>
    <rect x="636" y="626" width="366" height="100" rx="12" fill="#102f42"/><text x="660" y="657" fill="#f4fbff" font-size="17" font-weight="800">1:50  纸本回执与可拆界面</text><text x="660" y="682" fill="#91b5bf" font-size="13">看谁接管、何时熄火、如何申诉</text><text x="660" y="706" fill="#f6c76b" font-size="13" font-weight="700">全部为概念尺度，待测绘与专业复核</text>
  </g>

  <rect x="1066" y="190" width="482" height="610" rx="22" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="1098" y="238" fill="#77e3c0" font-family="Arial, sans-serif" font-size="21" font-weight="800">03 / 三节点 × 五项权利</text>
  <g font-family="Arial, sans-serif">
    <path d="M1136 318 C1230 270, 1330 270, 1430 318 C1330 366, 1230 366, 1136 318Z" fill="none" stroke="#77e3c0" stroke-width="5"/>
    <circle cx="1136" cy="318" r="22" fill="#e76f51"/><circle cx="1282" cy="318" r="22" fill="#f6c76b"/><circle cx="1430" cy="318" r="22" fill="#77e3c0"/>
    <text x="1136" y="370" text-anchor="middle" fill="#f4fbff" font-size="14" font-weight="700">众智园</text><text x="1282" y="370" text-anchor="middle" fill="#f4fbff" font-size="14" font-weight="700">AI 原点</text><text x="1430" y="370" text-anchor="middle" fill="#f4fbff" font-size="14" font-weight="700">大钟寺</text>
    <text x="1100" y="430" fill="#f4fbff" font-size="16" font-weight="800">公共权利先于效率读数：</text>
    <text x="1100" y="466" fill="#a9c8d1" font-size="15">01  普通步行、公交与轨道可达</text>
    <text x="1100" y="500" fill="#a9c8d1" font-size="15">02  连续无障碍路径与人工帮助</text>
    <text x="1100" y="534" fill="#a9c8d1" font-size="15">03  轨道公交骨干留在分母里</text>
    <text x="1100" y="568" fill="#a9c8d1" font-size="15">04  纸本、电话、申诉与暂停</text>
    <text x="1100" y="602" fill="#a9c8d1" font-size="15">05  聚合需求、退出与删除凭证</text>
    <rect x="1100" y="648" width="414" height="98" rx="14" fill="#102f42" stroke="#f6c76b" stroke-width="2"/>
    <text x="1124" y="684" fill="#f6c76b" font-size="16" font-weight="800">当前状态 / CURRENT STATE</text>
    <text x="1124" y="714" fill="#f4fbff" font-size="14">HOLD · provisional · authorization 0 · field claims 0</text>
  </g>
  <rect x="52" y="842" width="1496" height="98" rx="18" fill="#0e2a3c" stroke="#2f6672" stroke-width="2"/>
  <text x="84" y="882" fill="#77e3c0" font-family="Arial, sans-serif" font-size="16" font-weight="800">READ THIS BOARD AS A DESIGN CONTRACT</text>
  <text x="84" y="912" fill="#a9c8d1" font-family="Arial, sans-serif" font-size="14">Source: local package contract and provisional geometry. No field observation, operating permit, resident sample, capacity result, public ranking or implementation claim.</text>
</svg>
