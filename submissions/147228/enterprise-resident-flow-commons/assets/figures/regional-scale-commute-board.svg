<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">区域人口规模通勤综合模拟：312.2 万合成人口代理与服务单元账本</title>
  <desc id="desc">B0 压力场景与 O4 容量平衡候选的聚合对比；早高峰去程和晚高峰返程覆盖屏查均处理全部 3,122,000 个合成代理。图中区分乘客公里与车辆或服务单元公里；数值是模型代理，不是海淀现状观测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081827"/><stop offset="1" stop-color="#102d43"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4de1bf"/><stop offset="1" stop-color="#20a89b"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".22"/></filter>
    <style>
      .sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.mono{font-family:SFMono-Regular,Menlo,monospace}.white{fill:#f4f8fb}.muted{fill:#9bb4c6}.teal{fill:#4de1bf}.amber{fill:#f7bf63}.pink{fill:#f07d9e}.blue{fill:#6ea5ff}.card{fill:#f3f7f8}.ink{fill:#10283c}.small{font-size:21px}.label{font-size:24px;font-weight:700}.value{font-size:46px;font-weight:800;letter-spacing:-1px}.tiny{font-size:17px}.axis{fill:#7895a9;font-size:18px}.mode{font-size:18px;font-weight:700}.arrow{fill:none;stroke:#4de1bf;stroke-width:5;stroke-linecap:round;stroke-dasharray:8 12}
    </style>
  </defs>
  <rect width="2400" height="1500" fill="url(#bg)"/>
  <circle cx="2240" cy="-80" r="360" fill="#1a6f76" opacity=".28"/><circle cx="2150" cy="1450" r="420" fill="#294575" opacity=".22"/>
  <text x="130" y="100" class="sans teal" font-size="25" font-weight="800" letter-spacing="4">MOBILITY COMMONS / REGIONAL SCALE / v2.43</text>
  <text x="130" y="177" class="sans white" font-size="62" font-weight="800">区域人口规模压力测试：合成早去晚回全量回放</text>
  <text x="130" y="228" class="sans muted" font-size="25">3,122,000 个合成代理 × AM 上班去程 + PM 返程屏查 × 地铁 / 公交 / 骑行 / 步行无障碍 / 汽车 / 企业接驳 · 只发布汇总流量</text>
  <rect x="1930" y="92" width="320" height="72" rx="36" fill="#173f50" stroke="#4de1bf" stroke-width="2"/><text x="2090" y="138" text-anchor="middle" class="sans teal" font-size="22" font-weight="800">合成回放完成</text>

  <g filter="url(#shadow)">
    <rect x="130" y="292" width="660" height="170" rx="24" fill="#12384c" stroke="#2e6b73"/>
    <rect x="820" y="292" width="660" height="170" rx="24" fill="#12384c" stroke="#2e6b73"/>
    <rect x="1510" y="292" width="740" height="170" rx="24" fill="#12384c" stroke="#2e6b73"/>
  </g>
  <text x="170" y="337" class="sans muted small">区域人口覆盖校验</text><text x="170" y="414" class="sans white value">3.122M / 100%</text><text x="170" y="445" class="sans teal tiny">官方常住人口参考；不是 workforce / OD 基线</text>
  <text x="860" y="337" class="sans muted small">O4 容量平衡选中 · 满意度代理</text><text x="860" y="414" class="sans teal value">54.67 → 66.44</text><text x="860" y="445" class="sans teal tiny">+11.77 points · synthetic proxy</text>
  <text x="1550" y="337" class="sans muted small">O4 容量平衡选中 · 出行成本代理</text><text x="1550" y="414" class="sans white value">60.34 → 49.44</text><text x="1550" y="445" class="sans amber tiny">−10.90 generalized-cost proxy</text>

  <rect x="130" y="510" width="1190" height="610" rx="28" fill="#0d2538" stroke="#24465b"/>
  <text x="175" y="565" class="sans white" font-size="30" font-weight="800">方式重分配 / MODE MIX</text>
  <text x="175" y="600" class="sans muted small">每条横条 = 3,122,000 人的 AM 去程；PM 返程屏查同样逐人守恒，不是实际调查份额</text>
  <text x="175" y="680" class="sans amber label">B0 压力场景</text><text x="175" y="815" class="sans teal label">O4 容量平衡 / 全量搜索选中</text>
  <g>
    <rect x="365" y="645" width="251" height="56" fill="#4b79b8"/><rect x="616" y="645" width="181" height="56" fill="#5d9fc1"/><rect x="797" y="645" width="87" height="56" fill="#4db49e"/><rect x="884" y="645" width="163" height="56" fill="#b9d7b1"/><rect x="1047" y="645" width="263" height="56" fill="#e77c65"/><rect x="1310" y="645" width="55" height="56" fill="#f4bd63"/>
    <rect x="365" y="780" width="305" height="56" fill="#4b79b8"/><rect x="670" y="780" width="193" height="56" fill="#5d9fc1"/><rect x="863" y="780" width="135" height="56" fill="#4db49e"/><rect x="998" y="780" width="209" height="56" fill="#b9d7b1"/><rect x="1207" y="780" width="96" height="56" fill="#e77c65"/><rect x="1303" y="780" width="62" height="56" fill="#f4bd63"/>
    <text x="365" y="735" class="sans muted small">25.1%　18.1%　8.7%　16.3%　26.3%　5.5%</text>
    <text x="365" y="870" class="sans teal small">30.5%　19.3%　13.5%　20.9%　9.6%　6.2%</text>
  </g>
  <g class="sans mode"><text x="175" y="1000" class="blue">地铁</text><text x="335" y="1000" class="blue">公交</text><text x="495" y="1000" class="teal">自行车</text><text x="700" y="1000" fill="#b9d7b1">步行/无障碍</text><text x="965" y="1000" fill="#e77c65">汽车</text><text x="1125" y="1000" class="amber">企业接驳</text></g>
  <text x="175" y="1066" class="sans muted tiny">O4 先过峰值方式负荷 1.35× 硬门，再按满意度与成本排序；O3 虽然纸面满意度更高，但自行车负荷达 1.57×，不入选。</text>
  <text x="175" y="1094" class="sans muted tiny">服务单元账本：地铁列次 / 公交发车 / 自行车槽位 / 无障碍槽位 / 汽车车辆等效 / 企业接驳车；乘客公里 34.86 → 28.40M；空中出行仍 blocked。</text>

  <rect x="1370" y="510" width="880" height="610" rx="28" fill="#f3f7f8" filter="url(#shadow)"/>
  <text x="1415" y="565" class="sans ink" font-size="30" font-weight="800">系统读数 / SYSTEM READOUT</text>
  <text x="1415" y="600" class="sans" fill="#668095" font-size="19">B0 → O4 · full replay selected · capacity gate ≤ 1.35× · synthetic proxies</text>
  <g class="sans">
    <rect x="1415" y="640" width="395" height="125" rx="18" fill="#e6f4f1"/><text x="1445" y="680" class="ink small">P90 通勤时间代理 ↓</text><text x="1445" y="735" class="ink value">90 → 60 min</text>
    <rect x="1830" y="640" width="380" height="125" rx="18" fill="#eef2ff"/><text x="1860" y="680" class="ink small">无障碍完成代理 ↑</text><text x="1860" y="735" class="ink value">91.24 → 93.43%</text>
    <rect x="1415" y="795" width="395" height="125" rx="18" fill="#fff0ee"/><text x="1445" y="835" class="ink small">人流冲突 / 1000 ↓</text><text x="1445" y="890" class="ink value">5.74 → 3.13</text>
    <rect x="1830" y="795" width="380" height="125" rx="18" fill="#fff5e5"/><text x="1860" y="835" class="ink small">外部汽车流入 ↓</text><text x="1860" y="890" class="ink value">26.95 → 8.47%</text>
    <rect x="1415" y="950" width="395" height="125" rx="18" fill="#edf3fb"/><text x="1445" y="990" class="ink small">车辆/服务公里代理 ↓</text><text x="1445" y="1045" class="ink value">9.00 → 3.51M</text>
    <rect x="1830" y="950" width="380" height="125" rx="18" fill="#fcecf2"/><text x="1860" y="990" class="ink small">峰值方式负荷 ↓</text><text x="1860" y="1045" class="ink value">1.57× → 1.21×</text>
  </g>

  <rect x="130" y="1170" width="2120" height="250" rx="28" fill="#102f42" stroke="#28576a"/>
  <text x="175" y="1225" class="sans white" font-size="27" font-weight="800">聚合动线模板 / AGGREGATE ROUTE CHAINS</text>
  <text x="175" y="1265" class="sans muted small">所有代理均完成一条 morning chain；最终只保留路线模板与流量，不保留个人连续轨迹</text>
  <g class="sans" font-size="20" font-weight="700">
    <rect x="175" y="1305" width="270" height="56" rx="28" fill="#214d67"/><text x="310" y="1341" text-anchor="middle" class="white">居住 / 边界</text>
    <path d="M455 1333 H555" class="arrow"/><polygon points="555,1325 575,1333 555,1341" fill="#4de1bf"/>
    <rect x="585" y="1305" width="280" height="56" rx="28" fill="#1e635f"/><text x="725" y="1341" text-anchor="middle" class="white">首公里：步行/骑行</text>
    <path d="M875 1333 H975" class="arrow"/><polygon points="975,1325 995,1333 975,1341" fill="#4de1bf"/>
    <rect x="1005" y="1305" width="280" height="56" rx="28" fill="#315a8b"/><text x="1145" y="1341" text-anchor="middle" class="white">骨干：地铁/公交</text>
    <path d="M1295 1333 H1395" class="arrow"/><polygon points="1395,1325 1415,1333 1395,1341" fill="#4de1bf"/>
    <rect x="1425" y="1305" width="280" height="56" rx="28" fill="#527c61"/><text x="1565" y="1341" text-anchor="middle" class="white">末公里：无障碍接入</text>
    <path d="M1715 1333 H1815" class="arrow"/><polygon points="1815,1325 1835,1333 1815,1341" fill="#4de1bf"/>
    <rect x="1845" y="1305" width="340" height="56" rx="28" fill="#7b4d63"/><text x="2015" y="1341" text-anchor="middle" class="white">工作 / 服务目的地</text>
  </g>
  <text x="175" y="1395" class="sans muted tiny">Source: regional-scale-commute.json + run-regional-commute-simulation.js · v2.9 service-unit ledger + time-band screen · AM/PM each 3.122M coverage · synthetic, not local observed performance</text>
<g id="evidence-chain-ribbon"><rect x="0" y="1390" width="2400" height="110" fill="#071A2B" opacity=".96"/><text x="40" y="1407" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#66E3CA">同一份区域 runner · 七个读出视角</text><text x="2360" y="1407" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#9FC0CF">同源聚合证据，不是七组独立的现场结果</text><rect x="40.0" y="1408" width="324.6" height="38" rx="10" fill="#4DE1BF22" stroke="#4DE1BF" stroke-width="1.5"/><text x="54.0" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">1  区域覆盖</text><rect x="372.6" y="1408" width="324.6" height="38" rx="10" fill="#6EA5FF22" stroke="#6EA5FF" stroke-width="1.5"/><text x="386.6" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">2  网络边节点</text><rect x="705.1" y="1408" width="324.6" height="38" rx="10" fill="#F7BF6322" stroke="#F7BF63" stroke-width="1.5"/><text x="719.1" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">3  运力缺口</text><rect x="1037.7" y="1408" width="324.6" height="38" rx="10" fill="#F07D9E22" stroke="#F07D9E" stroke-width="1.5"/><text x="1051.7" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">4  群体分布</text><rect x="1370.3" y="1408" width="324.6" height="38" rx="10" fill="#F4A26122" stroke="#F4A261" stroke-width="1.5"/><text x="1384.3" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">5  可达性尾部</text><rect x="1702.9" y="1408" width="324.6" height="38" rx="10" fill="#B8A1FF22" stroke="#B8A1FF" stroke-width="1.5"/><text x="1716.9" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">6  资源敏感性</text><rect x="2035.4" y="1408" width="324.6" height="38" rx="10" fill="#5ED6D022" stroke="#5ED6D0" stroke-width="1.5"/><text x="2049.4" y="1433" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">7  稳健性</text></g></svg>
