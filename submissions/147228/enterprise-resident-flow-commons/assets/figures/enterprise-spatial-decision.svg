<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5f2ea"/>
  <rect width="1600" height="104" fill="#0b2638"/>
  <text x="62" y="48" fill="#89e0c7" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">JING-ZHANG FLOW COMMONS · 147228</text>
  <text x="62" y="84" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">企业—居民互惠 · 一次空间裁决</text>
  <text x="62" y="132" fill="#486172" font-family="Arial, sans-serif" font-size="20">三种候选空间，五级设计尺度，居民权利始终留在图上</text>
  <rect x="1270" y="38" width="260" height="42" rx="21" fill="#592e34" stroke="#f18a73" stroke-width="2"/>
  <text x="1400" y="66" text-anchor="middle" fill="#ffd5cc" font-family="Arial, sans-serif" font-size="17" font-weight="700">HOLD · NOT FIELD-RUN</text>

  <text x="62" y="190" fill="#0b2638" font-family="Arial, sans-serif" font-size="24" font-weight="700">01 / 空间备选与裁决</text>
  <rect x="62" y="216" width="470" height="220" rx="18" fill="#fff" stroke="#d7c9c2" stroke-width="2"/>
  <rect x="82" y="238" width="88" height="34" rx="17" fill="#d96755"/><text x="126" y="262" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">ALT-A</text>
  <text x="190" y="263" fill="#233b4a" font-family="Arial, sans-serif" font-size="22" font-weight="700">企业优先共享路缘</text>
  <text x="86" y="306" fill="#6b4a48" font-family="Arial, sans-serif" font-size="18">REJECT · 挤占普通与无障碍路径</text>
  <text x="86" y="345" fill="#526776" font-family="Arial, sans-serif" font-size="17">企业到岗与装卸共用一个数字优先队列</text>
  <text x="86" y="382" fill="#526776" font-family="Arial, sans-serif" font-size="17">失败门：无替代路线、无人工接管、队列溢出</text>
  <rect x="566" y="216" width="470" height="220" rx="18" fill="#fff" stroke="#d7c9c2" stroke-width="2"/>
  <rect x="586" y="238" width="88" height="34" rx="17" fill="#c78f33"/><text x="630" y="262" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">ALT-B</text>
  <text x="694" y="263" fill="#233b4a" font-family="Arial, sans-serif" font-size="22" font-weight="700">三处独立窗口</text>
  <text x="590" y="306" fill="#755d31" font-family="Arial, sans-serif" font-size="18">REVISE · 责任与申诉被拆散</text>
  <text x="590" y="345" fill="#526776" font-family="Arial, sans-serif" font-size="17">局部冲突减少，但没有共同结案回执</text>
  <text x="590" y="382" fill="#526776" font-family="Arial, sans-serif" font-size="17">失败门：跨节点移交、黑名单与申诉无人负责</text>
  <rect x="1070" y="216" width="468" height="220" rx="18" fill="#e8f5ef" stroke="#3e9c83" stroke-width="3"/>
  <rect x="1090" y="238" width="88" height="34" rx="17" fill="#23836e"/><text x="1134" y="262" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">ALT-C</text>
  <text x="1198" y="263" fill="#174e45" font-family="Arial, sans-serif" font-size="22" font-weight="700">互惠节点链</text>
  <text x="1094" y="306" fill="#176a5b" font-family="Arial, sans-serif" font-size="18">ADVANCE TO DESIGN REVIEW</text>
  <text x="1094" y="345" fill="#315e5c" font-family="Arial, sans-serif" font-size="17">企业请求、居民回程、人工接管成对交付</text>
  <text x="1094" y="382" fill="#315e5c" font-family="Arial, sans-serif" font-size="17">共享回执语法，维护边界独立，可撤回</text>

  <text x="62" y="493" fill="#0b2638" font-family="Arial, sans-serif" font-size="24" font-weight="700">02 / 五级尺度与三个节点</text>
  <rect x="62" y="520" width="750" height="280" rx="18" fill="#fff" stroke="#d5dde0" stroke-width="2"/>
  <line x1="126" y1="630" x2="750" y2="630" stroke="#23836e" stroke-width="7"/>
  <circle cx="148" cy="630" r="20" fill="#23836e"/><circle cx="300" cy="630" r="20" fill="#23836e"/><circle cx="452" cy="630" r="20" fill="#23836e"/><circle cx="604" cy="630" r="20" fill="#23836e"/><circle cx="756" cy="630" r="20" fill="#23836e"/>
  <text x="148" y="584" text-anchor="middle" fill="#174e45" font-family="Arial, sans-serif" font-size="19" font-weight="700">1:5000</text><text x="148" y="689" text-anchor="middle" fill="#526776" font-family="Arial, sans-serif" font-size="16">区域关系</text>
  <text x="300" y="584" text-anchor="middle" fill="#174e45" font-family="Arial, sans-serif" font-size="19" font-weight="700">1:2000</text><text x="300" y="689" text-anchor="middle" fill="#526776" font-family="Arial, sans-serif" font-size="16">网络接口</text>
  <text x="452" y="584" text-anchor="middle" fill="#174e45" font-family="Arial, sans-serif" font-size="19" font-weight="700">1:500</text><text x="452" y="689" text-anchor="middle" fill="#526776" font-family="Arial, sans-serif" font-size="16">节点平面</text>
  <text x="604" y="584" text-anchor="middle" fill="#174e45" font-family="Arial, sans-serif" font-size="19" font-weight="700">1:200</text><text x="604" y="689" text-anchor="middle" fill="#526776" font-family="Arial, sans-serif" font-size="16">断面与回退</text>
  <text x="756" y="584" text-anchor="middle" fill="#174e45" font-family="Arial, sans-serif" font-size="19" font-weight="700">1:50</text><text x="756" y="689" text-anchor="middle" fill="#526776" font-family="Arial, sans-serif" font-size="16">边缘回执</text>
  <text x="92" y="755" fill="#526776" font-family="Arial, sans-serif" font-size="17">每一级都只回答一个空间问题，正式测绘与工程复核完成前保持概念状态。</text>
  <rect x="846" y="520" width="692" height="280" rx="18" fill="#0f3949"/>
  <text x="878" y="560" fill="#89e0c7" font-family="Arial, sans-serif" font-size="19" font-weight="700">THREE NODES / 三处节点</text>
  <text x="878" y="615" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">众智园 · 清河前厅</text><text x="1135" y="615" fill="#c2d9df" font-family="Arial, sans-serif" font-size="17">到岗与装卸</text>
  <text x="878" y="672" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">AI 原点 · 照护环</text><text x="1135" y="672" fill="#c2d9df" font-family="Arial, sans-serif" font-size="17">日常与照护</text>
  <text x="878" y="729" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="700">大钟寺 · 换乘厅</text><text x="1135" y="729" fill="#c2d9df" font-family="Arial, sans-serif" font-size="17">轨道与路缘</text>

  <text x="62" y="853" fill="#0b2638" font-family="Arial, sans-serif" font-size="24" font-weight="700">03 / 居民权利保持第一顺位</text>
  <rect x="62" y="878" width="1476" height="74" rx="16" fill="#fff" stroke="#d7c9c2" stroke-width="2"/>
  <text x="88" y="923" fill="#174e45" font-family="Arial, sans-serif" font-size="18" font-weight="700">普通通行</text><text x="235" y="923" fill="#526776" font-family="Arial, sans-serif" font-size="17">无障碍与人工路线</text><text x="500" y="923" fill="#174e45" font-family="Arial, sans-serif" font-size="18" font-weight="700">轨道公交</text><text x="650" y="923" fill="#526776" font-family="Arial, sans-serif" font-size="17">申诉暂停</text><text x="850" y="923" fill="#174e45" font-family="Arial, sans-serif" font-size="18" font-weight="700">隐私退出</text><text x="1000" y="923" fill="#526776" font-family="Arial, sans-serif" font-size="17">都必须有失败动作与公开回执</text>
</svg>
