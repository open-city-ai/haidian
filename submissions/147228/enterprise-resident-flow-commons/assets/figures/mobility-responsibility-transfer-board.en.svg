<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc"><title id="title">Mobility responsibility transfer screen</title><desc id="desc">Eight mobility interfaces check receiver, non-AI equivalent, affected groups, failure and withdrawal denominators, stop evidence and recovery evidence. Real transfers remain zero and air mobility is excluded.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081B2D"/><stop offset="1" stop-color="#174B54"/></linearGradient><style>.title{font:900 38px Arial,PingFang SC,sans-serif}.sub{font:600 16px Arial,PingFang SC,sans-serif}.kicker{font:900 15px Arial,sans-serif;letter-spacing:1px}.row{font:850 17px Arial,PingFang SC,sans-serif}.small{font:600 12px Arial,PingFang SC,sans-serif}.value{font:900 19px Arial,sans-serif}.cost{font:700 13px Arial,PingFang SC,sans-serif}</style></defs><rect width="1800" height="1050" fill="url(#bg)"/><circle cx="1650" cy="80" r="300" fill="#63E6BE" opacity=".12"/><circle cx="80" cy="980" r="260" fill="#82A7FF" opacity=".12"/><text x="70" y="58" class="kicker" fill="#63E6BE">MOBILITY COMMONS / RESPONSIBILITY TRANSFER / v1.0</text><text x="70" y="112" class="title" fill="#F4FBFF">Mobility responsibility transfer screen</text><text x="70" y="147" class="sub" fill="#B7D4DC">Ask who can carry the service before transfer; refusal keeps the burden with the originator and failed or withdrawn work stays in the denominator</text><rect x="70" y="178" width="1660" height="72" rx="18" fill="#102D3D" stroke="#2A9D8F" stroke-width="2"/><text x="98" y="209" class="sub" fill="#D8EEEE">8 mobility interfaces · 7 burden classes · 0 field receipts · 0 accepted transfers · 0 operating authorizations</text><text x="98" y="234" class="small" fill="#A9C7D4">Transfer discussion requires dated acceptance, a non-AI equivalent, stop evidence and recovery evidence; air mobility stays outside the transfer denominator</text><text x="70" y="293" class="kicker" fill="#63E6BE">EIGHT INTERFACES / 八类交通接口</text><g><rect x="70" y="315" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="315" width="8" height="60" rx="4" fill="#63E6BE"/><text x="98" y="343" class="row" fill="#F4FBFF">T-01 Rail stop transfer</text><text x="360" y="343" class="small" fill="#B7D4DC">rail/accessibility review</text><text x="760" y="343" class="small" fill="#B7D4DC">failed + withdrawn in denominator</text><text x="1015" y="343" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="383" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="383" width="8" height="60" rx="4" fill="#82A7FF"/><text x="98" y="411" class="row" fill="#F4FBFF">T-02 Bus-stop waiting</text><text x="360" y="411" class="small" fill="#B7D4DC">bus operations</text><text x="760" y="411" class="small" fill="#B7D4DC">paper + staffed fallback</text><text x="1015" y="411" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="451" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="451" width="8" height="60" rx="4" fill="#55D6BE"/><text x="98" y="479" class="row" fill="#F4FBFF">T-03 Protected cycle link</text><text x="360" y="479" class="small" fill="#B7D4DC">field maintenance</text><text x="760" y="479" class="small" fill="#B7D4DC">do not block public route</text><text x="1015" y="479" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="519" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="519" width="8" height="60" rx="4" fill="#F7C66A"/><text x="98" y="547" class="row" fill="#F4FBFF">T-04 Continuous accessible route</text><text x="390" y="547" class="small" fill="#B7D4DC">accessibility service</text><text x="760" y="547" class="small" fill="#B7D4DC">human-equivalent path</text><text x="1015" y="547" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="587" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="587" width="8" height="60" rx="4" fill="#F38BA8"/><text x="98" y="615" class="row" fill="#F4FBFF">T-05 Managed curb service</text><text x="390" y="615" class="small" fill="#B7D4DC">curb service</text><text x="760" y="615" class="small" fill="#B7D4DC">freeze booking + clear</text><text x="1015" y="615" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="655" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="655" width="8" height="60" rx="4" fill="#B9A6FF"/><text x="98" y="683" class="row" fill="#F4FBFF">T-06 Enterprise shuttle</text><text x="390" y="683" class="small" fill="#B7D4DC">enterprise mobility</text><text x="760" y="683" class="small" fill="#B7D4DC">rail / bus fallback</text><text x="1015" y="683" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="723" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="723" width="8" height="60" rx="4" fill="#E8A66B"/><text x="98" y="751" class="row" fill="#F4FBFF">T-07 Logistics maintenance gate</text><text x="440" y="751" class="small" fill="#B7D4DC">logistics / maintenance</text><text x="760" y="751" class="small" fill="#B7D4DC">off-peak + staffed coordination</text><text x="1015" y="751" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="791" width="1050" height="60" rx="14" fill="#3B2935" stroke="#F38BA8"/><rect x="70" y="791" width="8" height="60" rx="4" fill="#F38BA8"/><text x="98" y="819" class="row" fill="#F4FBFF">T-08 Air-experiment ground gate</text><text x="430" y="819" class="small" fill="#F9B2BF">professional safety review</text><text x="760" y="819" class="small" fill="#F9B2BF">ground system remains open</text><text x="1015" y="819" text-anchor="end" class="value" fill="#FF9FAF">BLOCKED</text></g><text x="1190" y="293" class="kicker" fill="#63E6BE">SEVEN BURDENS / 七类资源负担</text><g><rect x="1190" y="315" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="347" class="cost" fill="#173A43">01 Space and route opportunity</text><text x="1698" y="347" text-anchor="end" class="value" fill="#173A43">4</text></g><g><rect x="1190" y="377" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="409" class="cost" fill="#173A43">02 Energy, water and heat load</text><text x="1698" y="409" text-anchor="end" class="value" fill="#173A43">2</text></g><g><rect x="1190" y="439" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="471" class="cost" fill="#173A43">03 Equipment, materials and replacement</text><text x="1698" y="471" text-anchor="end" class="value" fill="#173A43">5</text></g><g><rect x="1190" y="501" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="533" class="cost" fill="#173A43">04 Data, compute and deletion</text><text x="1698" y="533" text-anchor="end" class="value" fill="#173A43">2</text></g><g><rect x="1190" y="563" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="595" class="cost" fill="#173A43">05 Labor, maintenance and takeover</text><text x="1698" y="595" text-anchor="end" class="value" fill="#173A43">8</text></g><g><rect x="1190" y="625" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="657" class="cost" fill="#173A43">06 Public attention, waiting and appeals</text><text x="1698" y="657" text-anchor="end" class="value" fill="#173A43">8</text></g><g><rect x="1190" y="687" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="719" class="cost" fill="#173A43">07 Public funding and tail liability</text><text x="1698" y="719" text-anchor="end" class="value" fill="#173A43">5</text></g><rect x="1190" y="765" width="540" height="86" rx="16" fill="#102B3B" stroke="#2C5566"/><text x="1216" y="798" class="small" fill="#63E6BE">TRANSFER CHAIN / 移交链</text><text x="1216" y="828" class="sub" fill="#F4FBFF">Originator → receiver → failure denominator → restoration closeout</text><rect x="70" y="900" width="1660" height="90" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="98" y="936" class="kicker" fill="#63E6BE">REFUSE TRANSFER / 拒收动作</text><text x="98" y="968" class="sub" fill="#F4FBFF">Keep accountability with the originator · freeze the proposed service · retain public route and staffed/public-transport fallback · do not hide failure inside a success rate</text></svg>
