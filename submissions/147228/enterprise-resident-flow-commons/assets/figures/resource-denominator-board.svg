<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1550" viewBox="0 0 2400 1550" role="img" aria-labelledby="title desc"><title id="title">交通资源分母合同：没有分母，不发布强度值</title><desc id="desc">5 个压力场景 × 8 个发布前条件 · 3,122,000 只是合成参考，不是本地人口. 当前强度值 0 · 本地计量 0 · 运行授权 0 · 空中出行 BLOCKED</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#17485a"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00111f" flood-opacity=".22"/></filter><style>.sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.title{font-size:52px;font-weight:900;letter-spacing:-2px}.muted{font-size:22px;font-weight:600}.number{font-size:20px;font-weight:900}.rowTitle{font-size:24px;font-weight:850}.rowText{font-size:17px;font-weight:650}.rowSmall{font-size:14px;font-weight:600}.status{font-size:13px;font-weight:900}.owner{font-size:13px;font-weight:650}.gateNo{font-size:14px;font-weight:900}.gateLabel{font-size:16px;font-weight:800}.flow{font-size:21px;font-weight:850}</style></defs><rect width="2400" height="1550" fill="url(#bg)"/><text x="90" y="75" class="sans" font-size="22" font-weight="900" letter-spacing="4" fill="#70e1c3">MOBILITY COMMONS / DENOMINATOR CONTRACT / v1.0</text><text x="90" y="150" class="sans title" fill="#f4fbfb">交通资源分母合同：没有分母，不发布强度值</text><text x="90" y="198" class="sans muted" fill="#a8c2c7">5 个压力场景 × 8 个发布前条件 · 3,122,000 只是合成参考，不是本地人口</text><rect x="1950" y="58" width="370" height="62" rx="31" fill="#3e2d2d" stroke="#ff9b8e" stroke-width="2"/><text x="2135" y="97" text-anchor="middle" class="sans" font-size="17" font-weight="900" fill="#ffb1a5">DESIGN CONTRACT / NOT OPERATING</text><g filter="url(#shadow)"><rect x="90" y="250" width="490" height="105" rx="20" fill="#143c4c"/><rect x="605" y="250" width="490" height="105" rx="20" fill="#143c4c"/><rect x="1120" y="250" width="490" height="105" rx="20" fill="#143c4c"/><rect x="1635" y="250" width="685" height="105" rx="20" fill="#143c4c"/></g><text x="120" y="290" class="sans" font-size="18" fill="#a8c2c7">STRESS CONTRACTS</text><text x="120" y="335" class="sans" font-size="39" font-weight="900" fill="#70e1c3">5</text><text x="635" y="290" class="sans" font-size="18" fill="#a8c2c7">LOCKED CONTRACTS</text><text x="635" y="335" class="sans" font-size="39" font-weight="900" fill="#ffd37a">0</text><text x="1150" y="290" class="sans" font-size="18" fill="#a8c2c7">DATED LOCAL MEASUREMENTS</text><text x="1150" y="335" class="sans" font-size="39" font-weight="900" fill="#ffd37a">0 / UNKNOWN</text><text x="1665" y="290" class="sans" font-size="18" fill="#a8c2c7">SYNTHETIC POPULATION REFERENCE</text><text x="1665" y="335" class="sans" font-size="39" font-weight="900" fill="#70e1c3">3,122,000 / NOT LOCAL</text><rect x="90" y="390" width="1440" height="1030" rx="30" fill="#eaf4f5" filter="url(#shadow)"/><text x="130" y="435" class="sans" font-size="28" font-weight="900" fill="#102d43">五个压力场景：每个服务单位都要有对照和边界</text><g><rect x="90" y="455" width="1440" height="140" rx="20" fill="#f4fafb" stroke="#b5d3d7" stroke-width="2"/><circle cx="128" cy="493" r="22" fill="#f0b45c"/><text x="128" y="500" text-anchor="middle" class="sans number" fill="#102d43">1</text><text x="170" y="490" class="sans rowTitle" fill="#102d43">地铁中断时的一次完成通勤请求</text><text x="170" y="523" class="sans rowText" fill="#29465a">单位：每名完成的跨方式到岗请求</text><text x="170" y="567" class="sans rowSmall" fill="#607b86">对照：既有站务告知 + 公交、步行或无障碍人工绕行</text><rect x="1165" y="479" width="325" height="40" rx="20" fill="#fff0d8"/><text x="1327" y="506" text-anchor="middle" class="sans status" fill="#985f00">DENOMINATOR NOT LOCKED</text><text x="1168" y="549" class="sans owner" fill="#47636f">责任：轨道/公交运营、企业服务和街道人工服务责任角</text><text x="1168" y="567" class="sans owner" fill="#47636f">色</text></g><g><rect x="90" y="625" width="1440" height="140" rx="20" fill="#e8f2f4" stroke="#b5d3d7" stroke-width="2"/><circle cx="128" cy="663" r="22" fill="#f0b45c"/><text x="128" y="670" text-anchor="middle" class="sans number" fill="#102d43">2</text><text x="170" y="660" class="sans rowTitle" fill="#102d43">公交中断时的一次完成居民服务请求</text><text x="170" y="693" class="sans rowText" fill="#29465a">单位：每名完成的门到门居民服务请求</text><text x="170" y="737" class="sans rowSmall" fill="#607b86">对照：人工站点问询 + 既有轨道、步行/无障碍和电话服务</text><rect x="1165" y="649" width="325" height="40" rx="20" fill="#fff0d8"/><text x="1327" y="676" text-anchor="middle" class="sans status" fill="#985f00">DENOMINATOR NOT LOCKED</text><text x="1168" y="719" class="sans owner" fill="#47636f">责任：公交/轨道运营、社区服务和人工电话入口责任角</text><text x="1168" y="737" class="sans owner" fill="#47636f">色</text></g><g><rect x="90" y="795" width="1440" height="140" rx="20" fill="#f4fafb" stroke="#b5d3d7" stroke-width="2"/><circle cx="128" cy="833" r="22" fill="#f0b45c"/><text x="128" y="840" text-anchor="middle" class="sans number" fill="#102d43">3</text><text x="170" y="830" class="sans rowTitle" fill="#102d43">雨雪天气的一次安全到达请求</text><text x="170" y="863" class="sans rowText" fill="#29465a">单位：每名完成的安全门到门出行请求</text><text x="170" y="907" class="sans rowSmall" fill="#607b86">对照：人工天气告知 + 可走的无障碍/步行路线 + 公共交通回退</text><rect x="1165" y="819" width="325" height="40" rx="20" fill="#fff0d8"/><text x="1327" y="846" text-anchor="middle" class="sans status" fill="#985f00">DENOMINATOR NOT LOCKED</text><text x="1168" y="889" class="sans owner" fill="#47636f">责任：道路维护、公共交通、照明和人工接管责任角色</text></g><g><rect x="90" y="965" width="1440" height="140" rx="20" fill="#e8f2f4" stroke="#b5d3d7" stroke-width="2"/><circle cx="128" cy="1003" r="22" fill="#f0b45c"/><text x="128" y="1010" text-anchor="middle" class="sans number" fill="#102d43">4</text><text x="170" y="1000" class="sans rowTitle" fill="#102d43">路缘服务失效时的一次装卸或接驳请求</text><text x="170" y="1033" class="sans rowText" fill="#29465a">单位：每次完成且不占用消防/无障碍通道的路缘服务请求</text><text x="170" y="1077" class="sans rowSmall" fill="#607b86">对照：人工排班 + 公开路缘规则 + 现场人工清场</text><rect x="1165" y="989" width="325" height="40" rx="20" fill="#fff0d8"/><text x="1327" y="1016" text-anchor="middle" class="sans status" fill="#985f00">DENOMINATOR NOT LOCKED</text><text x="1168" y="1059" class="sans owner" fill="#47636f">责任：路缘管理、企业车队、物流和现场清场责任角色</text></g><g><rect x="90" y="1135" width="1440" height="140" rx="20" fill="#f4fafb" stroke="#b5d3d7" stroke-width="2"/><circle cx="128" cy="1173" r="22" fill="#f0b45c"/><text x="128" y="1180" text-anchor="middle" class="sans number" fill="#102d43">5</text><text x="170" y="1170" class="sans rowTitle" fill="#102d43">跨边界通勤返程的一次完成请求</text><text x="170" y="1203" class="sans rowText" fill="#29465a">单位：每名完成的跨边界返程请求</text><text x="170" y="1247" class="sans rowSmall" fill="#607b86">对照：人工班次确认 + 轨道/公交 + 企业班车或电话回退</text><rect x="1165" y="1159" width="325" height="40" rx="20" fill="#fff0d8"/><text x="1327" y="1186" text-anchor="middle" class="sans status" fill="#985f00">DENOMINATOR NOT LOCKED</text><text x="1168" y="1229" class="sans owner" fill="#47636f">责任：轨道/公交运营、企业班车和夜间人工服务责任角</text><text x="1168" y="1247" class="sans owner" fill="#47636f">色</text></g><rect x="1580" y="390" width="740" height="1030" rx="30" fill="#102d43" filter="url(#shadow)"/><text x="1620" y="435" class="sans" font-size="28" font-weight="900" fill="#70e1c3">八道发布前条件</text><g><rect x="1610" y="455" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1644" cy="490" r="14" fill="#ff9b8e"/><text x="1644" y="496" text-anchor="middle" class="sans gateNo" fill="#3d2b32">1</text><text x="1672" y="497" class="sans gateLabel" fill="#ffe7e3">服务单位</text></g><g><rect x="1960" y="455" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1994" cy="490" r="14" fill="#ff9b8e"/><text x="1994" y="496" text-anchor="middle" class="sans gateNo" fill="#3d2b32">2</text><text x="2022" y="497" class="sans gateLabel" fill="#ffe7e3">非 AI 对照</text></g><g><rect x="1610" y="560" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1644" cy="595" r="14" fill="#ff9b8e"/><text x="1644" y="601" text-anchor="middle" class="sans gateNo" fill="#3d2b32">3</text><text x="1672" y="602" class="sans gateLabel" fill="#ffe7e3">系统边界</text></g><g><rect x="1960" y="560" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1994" cy="595" r="14" fill="#ff9b8e"/><text x="1994" y="601" text-anchor="middle" class="sans gateNo" fill="#3d2b32">4</text><text x="2022" y="602" class="sans gateLabel" fill="#ffe7e3">时间窗口</text></g><g><rect x="1610" y="665" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1644" cy="700" r="14" fill="#ff9b8e"/><text x="1644" y="706" text-anchor="middle" class="sans gateNo" fill="#3d2b32">5</text><text x="1672" y="707" class="sans gateLabel" fill="#ffe7e3">完成规则</text></g><g><rect x="1960" y="665" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1994" cy="700" r="14" fill="#ff9b8e"/><text x="1994" y="706" text-anchor="middle" class="sans gateNo" fill="#3d2b32">6</text><text x="2022" y="707" class="sans gateLabel" fill="#ffe7e3">分组拆分</text></g><g><rect x="1610" y="770" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1644" cy="805" r="14" fill="#ff9b8e"/><text x="1644" y="811" text-anchor="middle" class="sans gateNo" fill="#3d2b32">7</text><text x="1672" y="812" class="sans gateLabel" fill="#ffe7e3">有日期证据</text></g><g><rect x="1960" y="770" width="300" height="70" rx="35" fill="#3d2b32" stroke="#ff9b8e" stroke-width="2"/><circle cx="1994" cy="805" r="14" fill="#ff9b8e"/><text x="1994" y="811" text-anchor="middle" class="sans gateNo" fill="#3d2b32">8</text><text x="2022" y="812" class="sans gateLabel" fill="#ffe7e3">责任确认</text></g><text x="1620" y="930" class="sans" font-size="20" font-weight="900" fill="#ffb1a5">缺一项，强度值保持阻断</text><text x="1620" y="980" class="sans" fill="#d5e6e8">合成压力屏可以比较路径和恢复规则，但不能替代有日期的本地计量、</text><text x="1620" y="1000" class="sans" fill="#d5e6e8">人工对照、责任确认或公众参与。</text><rect x="1620" y="1100" width="660" height="230" rx="24" fill="#173f53" stroke="#3e7d86" stroke-width="2"/><text x="1650" y="1140" class="sans" font-size="18" font-weight="900" fill="#70e1c3">发布前账面状态</text><text x="1650" y="1185" class="sans" fill="#f4fbfb">当前强度值 0 · 本地计量 0 · 运行授权 0 · 空中出行 BL</text><text x="1650" y="1209" class="sans" fill="#f4fbfb">OCKED</text><text x="1650" y="1260" class="sans" fill="#ffb1a5">空中出行不进入任何分母或强度比较。</text><text x="130" y="1485" class="sans" font-size="17" font-weight="800" fill="#a8c2c7">合同字段齐全只说明准备记录已写清，不说明已测量、已获批或已经运行。</text><g><rect x="160" y="1390" width="275" height="78" rx="39" fill="#123a4f" stroke="#4b8991" stroke-width="2"/><text x="297" y="1438" text-anchor="middle" class="sans flow" fill="#f4fbfb">声明单位</text><path d="M435 1430 H550 l-18 -12 M550 1430 l-18 12" fill="none" stroke="#70e1c3" stroke-width="4"/></g><g><rect x="610" y="1390" width="275" height="78" rx="39" fill="#123a4f" stroke="#4b8991" stroke-width="2"/><text x="747" y="1438" text-anchor="middle" class="sans flow" fill="#f4fbfb">锁定对照</text><path d="M885 1430 H1000 l-18 -12 M1000 1430 l-18 12" fill="none" stroke="#70e1c3" stroke-width="4"/></g><g><rect x="1060" y="1390" width="275" height="78" rx="39" fill="#123a4f" stroke="#4b8991" stroke-width="2"/><text x="1197" y="1438" text-anchor="middle" class="sans flow" fill="#f4fbfb">划清边界</text><path d="M1335 1430 H1450 l-18 -12 M1450 1430 l-18 12" fill="none" stroke="#70e1c3" stroke-width="4"/></g><g><rect x="1510" y="1390" width="275" height="78" rx="39" fill="#123a4f" stroke="#4b8991" stroke-width="2"/><text x="1647" y="1438" text-anchor="middle" class="sans flow" fill="#f4fbfb">收集证据</text><path d="M1785 1430 H1900 l-18 -12 M1900 1430 l-18 12" fill="none" stroke="#70e1c3" stroke-width="4"/></g><g><rect x="1960" y="1390" width="275" height="78" rx="39" fill="#123a4f" stroke="#4b8991" stroke-width="2"/><text x="2097" y="1438" text-anchor="middle" class="sans flow" fill="#f4fbfb">发布或停</text></g></svg>
