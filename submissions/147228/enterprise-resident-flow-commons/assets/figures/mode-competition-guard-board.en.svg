<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">Mode competition guard for shared feeders</title><desc id="desc">Four synthetic counterfactual scenarios compare transit index, feeder share, vehicle-kilometre ratio and worst-group access; the capped feeder passes while unmanaged expansion and the air candidate are blocked.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071B2D"/><stop offset="1" stop-color="#203E5E"/></linearGradient><style>.t{font:900 38px Arial,PingFang SC,sans-serif}.s{font:600 17px Arial,PingFang SC,sans-serif}.h{font:900 16px Arial,sans-serif;letter-spacing:1px}.r{font:850 20px Arial,PingFang SC,sans-serif}.sm{font:600 13px Arial,PingFang SC,sans-serif}.v{font:900 21px Arial,sans-serif}.tiny{font:600 11px Arial,PingFang SC,sans-serif}</style></defs>
<rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1670" cy="90" r="300" fill="#63E6BE" opacity=".12"/><circle cx="100" cy="920" r="260" fill="#F38BA8" opacity=".10"/>
<text x="70" y="60" class="h" fill="#63E6BE">MOBILITY COMMONS / MODE COMPETITION GUARD / v1.0</text><text x="70" y="116" class="t" fill="#F4FBFF">Mode competition guard for shared feeders</text><text x="70" y="151" class="s" fill="#C8D8E5">Protect rail and bus first; stop when a feeder displaces transit, raises vehicle-km or harms the slowest group</text>
<rect x="70" y="180" width="1660" height="78" rx="18" fill="#12283C" stroke="#F7C66A" stroke-width="2"/><text x="98" y="213" class="s" fill="#F4FBFF">Synthetic counterfactual replay · 3,122,000-agent reference · field measurements 0 · operating authorizations 0 · satisfaction measurements 0</text><text x="98" y="240" class="sm" fill="#B7D4DC">Illustrative guard values, not Haidian ridership, vehicle-kilometres, satisfaction or operating results; air stays ground-fallback</text>
<text x="70" y="302" class="h" fill="#63E6BE">HARD GUARDS / 四道硬门</text>
<g><rect x="70" y="330" width="380" height="112" rx="18" fill="#EAF6F2"/><text x="98" y="366" class="h" fill="#173A43">TRANSIT INDEX</text><text x="98" y="405" class="v" fill="#0E8F83">≥ 0.95</text><text x="270" y="405" class="sm" fill="#48616C">no transit displacement</text></g>
<g><rect x="470" y="330" width="380" height="112" rx="18" fill="#EAF6F2"/><text x="498" y="366" class="h" fill="#173A43">FEEDER SHARE</text><text x="498" y="405" class="v" fill="#0E8F83">≤ 8%</text><text x="670" y="405" class="sm" fill="#48616C">cap is required</text></g>
<g><rect x="870" y="330" width="380" height="112" rx="18" fill="#EAF6F2"/><text x="898" y="366" class="h" fill="#173A43">VEHICLE-KM</text><text x="898" y="405" class="v" fill="#0E8F83">≤ 1.10×</text><text x="1074" y="405" class="sm" fill="#48616C">versus synthetic reference</text></g>
<g><rect x="1270" y="330" width="460" height="112" rx="18" fill="#EAF6F2"/><text x="1298" y="366" class="h" fill="#173A43">WORST-GROUP ACCESS</text><text x="1298" y="405" class="v" fill="#0E8F83">≥ −0.03</text><text x="1480" y="405" class="sm" fill="#48616C">worst-group delta</text></g>
<text x="70" y="490" class="h" fill="#63E6BE">COUNTERFACTUAL SCENARIOS / 情景比较</text>
<g><rect x="70" y="520" width="1660" height="76" rx="15" fill="#123A49" stroke="#2C5566"/><text x="98" y="566" class="r" fill="#F4FBFF">O0 Rail-bus-first reference</text><text x="580" y="557" class="sm" fill="#A9C7D4">Transit 1.00</text><text x="780" y="557" class="sm" fill="#A9C7D4">Feeder 0%</text><text x="970" y="557" class="sm" fill="#A9C7D4">Vehicle-km 1.00×</text><text x="1190" y="557" class="sm" fill="#A9C7D4">Worst group 0.00</text><rect x="1510" y="538" width="170" height="40" rx="20" fill="#63E6BE"/><text x="1595" y="564" text-anchor="middle" class="h" fill="#083B3B">REFERENCE</text></g>
<g><rect x="70" y="610" width="1660" height="76" rx="15" fill="#123A49" stroke="#63E6BE" stroke-width="2"/><text x="98" y="656" class="r" fill="#F4FBFF">O1 Managed capped feeder</text><text x="580" y="647" class="sm" fill="#A9C7D4">Transit 0.98</text><text x="780" y="647" class="sm" fill="#A9C7D4">Feeder 4%</text><text x="970" y="647" class="sm" fill="#A9C7D4">Vehicle-km 1.03×</text><text x="1190" y="647" class="sm" fill="#A9C7D4">Worst group −0.01</text><rect x="1510" y="628" width="170" height="40" rx="20" fill="#63E6BE"/><text x="1595" y="654" text-anchor="middle" class="h" fill="#083B3B">PASS / REVIEW</text></g>
<g><rect x="70" y="700" width="1660" height="76" rx="15" fill="#3B2935" stroke="#F38BA8" stroke-width="2"/><text x="98" y="746" class="r" fill="#FFB6C2">O2 Unmanaged feeder expansion</text><text x="580" y="737" class="sm" fill="#F9D0D6">Transit 0.78</text><text x="780" y="737" class="sm" fill="#F9D0D6">Feeder 18%</text><text x="970" y="737" class="sm" fill="#F9D0D6">Vehicle-km 1.26×</text><text x="1190" y="737" class="sm" fill="#F9D0D6">Worst group −0.11</text><rect x="1510" y="718" width="170" height="40" rx="20" fill="#F38BA8"/><text x="1595" y="744" text-anchor="middle" class="h" fill="#4A1F32">BLOCKED</text></g>
<g><rect x="70" y="790" width="1660" height="76" rx="15" fill="#3B2935" stroke="#F38BA8" stroke-width="2"/><text x="98" y="836" class="r" fill="#FFB6C2">O3 Ground-first air candidate</text><text x="580" y="827" class="sm" fill="#F9D0D6">Transit 0.97</text><text x="780" y="827" class="sm" fill="#F9D0D6">Feeder 3%</text><text x="970" y="827" class="sm" fill="#F9D0D6">Vehicle-km 1.02×</text><text x="1190" y="827" class="sm" fill="#F9D0D6">Air agents 0</text><rect x="1510" y="808" width="170" height="40" rx="20" fill="#F38BA8"/><text x="1595" y="834" text-anchor="middle" class="h" fill="#4A1F32">BLOCKED</text></g>
<rect x="70" y="900" width="1660" height="52" rx="15" fill="#102B3B" stroke="#2C5566"/><text x="98" y="932" class="sm" fill="#F4FBFF">Read it this way: O1 is conditional only with a cap and transit priority; O2 is closed for displacement and extra vehicle-km; O3 has no air authorization and keeps ground fallback.</text>
</svg>
