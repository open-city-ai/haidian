<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Population-scale people flow and network pressure screen</title>
  <desc id="desc">Aggregate people and vehicle-equivalent flow for 3,122,000 synthetic agents across declared metro, bus, bicycle, walking/accessibility, car and enterprise-shuttle network paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#0f2437"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#39d8ff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <style>
      .bg{fill:url(#bg)} .panel{fill:#10283b;stroke:#1f455d;stroke-width:1.5} .panel2{fill:#0d2033;stroke:#1b4058;stroke-width:1.5}
      .title{font:700 33px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;fill:#f4fbff;letter-spacing:1px}
      .sub{font:500 14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#8fb7c9;letter-spacing:.5px}
      .label{font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#d8f3ff}
      .muted{font:500 12px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#79a2b5}
      .metric{font:800 31px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;fill:#f7fdff;letter-spacing:.5px}
      .smallmetric{font:800 21px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;fill:#e9fbff}
      .chip{font:700 12px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#c9f5ff;letter-spacing:.4px}
      .node{fill:#15354a;stroke:#2d6a84;stroke-width:1.5} .nodeHot{fill:#203b48;stroke:#fbbf24;stroke-width:2}
      .nodeText{font:700 14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#e9fbff}
      .edge{fill:none;stroke-linecap:round;opacity:.72} .edgeGlow{fill:none;stroke-linecap:round;opacity:.16;filter:url(#soft)}
      .barbg{fill:#17384c} .bar{fill:url(#cyan)} .barHot{fill:url(#amber)}
      .footer{font:500 12px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:#86aebe}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980" rx="28"/>
  <circle cx="1370" cy="80" r="190" fill="#1bc4dc" opacity=".06"/><circle cx="230" cy="820" r="230" fill="#34d399" opacity=".04"/>
  <text x="66" y="66" class="title">Population-scale people flow · network pressure</text>
  <text x="67" y="94" class="sub">O4 capacity-balanced candidate / 3,122,000 synthetic agents / AM peak / aggregate only</text>
  <rect x="1215" y="44" width="148" height="32" rx="16" fill="#123a4d" stroke="#2aa6c5"/><text x="1289" y="65" class="chip" text-anchor="middle">NETWORK PASS</text>
  <rect x="1375" y="44" width="158" height="32" rx="16" fill="#173a36" stroke="#34d399"/><text x="1454" y="65" class="chip" text-anchor="middle">SYNTHETIC ONLY</text>

  <rect x="58" y="126" width="342" height="206" rx="20" class="panel" filter="url(#shadow)"/>
  <text x="84" y="164" class="label">Read the whole screen in one glance</text><text x="84" y="207" class="metric">3.122M</text>
  <text x="84" y="232" class="muted">population-scale coverage reference · one AM path per agent</text><line x1="84" y1="253" x2="372" y2="253" stroke="#1f5269"/>
  <text x="84" y="281" class="smallmetric">1.264×</text><text x="180" y="281" class="muted">maximum edge pressure</text>
  <text x="84" y="307" class="smallmetric" fill="#5eead4">≤ 1.35×</text><text x="180" y="307" class="muted">declared screen gate</text>
  <rect x="290" y="273" width="78" height="38" rx="19" fill="#124c48" stroke="#34d399"/><text x="329" y="297" class="chip" text-anchor="middle">PASS</text>

  <rect x="58" y="352" width="342" height="258" rx="20" class="panel2"/>
  <text x="84" y="390" class="label">Mode split · person trips</text><text x="84" y="421" class="muted">line width ∝ people assigned to the mode</text>
  <text x="84" y="460" class="label">Metro</text><rect x="145" y="447" width="180" height="12" rx="6" class="barbg"/><rect x="145" y="447" width="132" height="12" rx="6" fill="#38bdf8"/><text x="336" y="459" class="smallmetric" text-anchor="end">0.952M</text>
  <text x="84" y="495" class="label">Bus</text><rect x="145" y="482" width="180" height="12" rx="6" class="barbg"/><rect x="145" y="482" width="84" height="12" rx="6" fill="#60a5fa"/><text x="336" y="494" class="smallmetric" text-anchor="end">0.603M</text>
  <text x="84" y="530" class="label">Walk / access</text><rect x="145" y="517" width="180" height="12" rx="6" class="barbg"/><rect x="145" y="517" width="91" height="12" rx="6" fill="#fbbf24"/><text x="336" y="529" class="smallmetric" text-anchor="end">0.653M</text>
  <text x="84" y="565" class="label">Bicycle</text><rect x="145" y="552" width="180" height="12" rx="6" class="barbg"/><rect x="145" y="552" width="59" height="12" rx="6" fill="#4ade80"/><text x="336" y="564" class="smallmetric" text-anchor="end">0.423M</text>
  <text x="84" y="600" class="label">Car</text><rect x="145" y="587" width="180" height="12" rx="6" class="barbg"/><rect x="145" y="587" width="42" height="12" rx="6" fill="#fb7185"/><text x="336" y="599" class="smallmetric" text-anchor="end">0.299M</text>

  <rect x="428" y="126" width="760" height="484" rx="20" class="panel"/>
  <text x="458" y="164" class="label">Declared analytical graph · source → mode spine → node / destination</text><text x="458" y="188" class="muted">Not a current map; paths, capacities and boundaries are explicit in network-flow-screen.json</text>
  <text x="474" y="235" class="muted">Sources</text><text x="645" y="235" class="muted">Mode spines</text><text x="840" y="235" class="muted">Key node</text><text x="1044" y="235" class="muted">Service destinations</text>
  <rect x="467" y="263" width="116" height="52" rx="16" class="node"/><text x="525" y="294" class="nodeText" text-anchor="middle">Residents / edge</text>
  <rect x="467" y="351" width="116" height="52" rx="16" class="node"/><text x="525" y="382" class="nodeText" text-anchor="middle">Cross-boundary</text>
  <rect x="625" y="248" width="142" height="42" rx="15" class="node"/><text x="696" y="274" class="nodeText" text-anchor="middle">Metro 0.952M</text>
  <rect x="625" y="306" width="142" height="42" rx="15" class="node"/><text x="696" y="332" class="nodeText" text-anchor="middle">Bus 0.603M</text>
  <rect x="625" y="364" width="142" height="42" rx="15" class="node"/><text x="696" y="390" class="nodeText" text-anchor="middle">Active 1.075M</text>
  <rect x="625" y="422" width="142" height="42" rx="15" class="node"/><text x="696" y="448" class="nodeText" text-anchor="middle">Car 0.299M</text>
  <rect x="625" y="480" width="142" height="42" rx="15" class="node"/><text x="696" y="506" class="nodeText" text-anchor="middle">Shuttle 0.192M</text>
  <rect x="825" y="322" width="154" height="72" rx="20" class="nodeHot"/><text x="902" y="354" class="nodeText" text-anchor="middle">Dazhongsi transfer</text><text x="902" y="378" class="smallmetric" text-anchor="middle">0.866×</text>
  <rect x="1025" y="267" width="126" height="48" rx="15" class="node"/><text x="1088" y="296" class="nodeText" text-anchor="middle">Enterprise</text>
  <rect x="1025" y="342" width="126" height="48" rx="15" class="node"/><text x="1088" y="371" class="nodeText" text-anchor="middle">Resident service</text>
  <rect x="1025" y="417" width="126" height="48" rx="15" class="nodeHot"/><text x="1088" y="446" class="nodeText" text-anchor="middle">Logistics</text>
  <path d="M583 289 C600 280 605 269 625 269" class="edgeGlow" stroke="#38bdf8" stroke-width="25"/><path d="M583 289 C600 280 605 269 625 269" class="edge" stroke="#38bdf8" stroke-width="15"/>
  <path d="M583 289 C600 310 605 327 625 327" class="edge" stroke="#60a5fa" stroke-width="10"/><path d="M583 289 C600 345 605 385 625 385" class="edge" stroke="#4ade80" stroke-width="8"/><path d="M583 289 C600 395 605 443 625 443" class="edge" stroke="#fb7185" stroke-width="6"/><path d="M583 289 C600 430 605 501 625 501" class="edge" stroke="#c084fc" stroke-width="6"/>
  <path d="M583 377 C600 350 607 270 625 269" class="edge" stroke="#38bdf8" stroke-width="5" stroke-dasharray="8 8"/><path d="M583 377 C600 390 607 327 625 327" class="edge" stroke="#60a5fa" stroke-width="7" stroke-dasharray="8 8"/>
  <path d="M767 269 C795 269 802 348 825 348" class="edge" stroke="#38bdf8" stroke-width="15"/><path d="M767 327 C795 327 802 366 825 366" class="edge" stroke="#60a5fa" stroke-width="10"/><path d="M767 385 C795 385 802 376 825 376" class="edge" stroke="#4ade80" stroke-width="17"/><path d="M767 443 C795 443 802 390 825 390" class="edge" stroke="#fb7185" stroke-width="8"/><path d="M767 501 C795 501 802 406 825 394" class="edge" stroke="#c084fc" stroke-width="7"/>
  <path d="M979 352 C998 332 1008 291 1025 291" class="edge" stroke="#38bdf8" stroke-width="14"/><path d="M979 365 C1000 365 1007 366 1025 366" class="edge" stroke="#60a5fa" stroke-width="9"/><path d="M979 381 C1000 407 1008 441 1025 441" class="edge" stroke="#fbbf24" stroke-width="7"/>
  <text x="470" y="555" class="muted">Solid = resident / edge source · dashed = external enterprise commute · width = person flow</text>

  <rect x="1216" y="126" width="326" height="484" rx="20" class="panel2"/>
  <text x="1244" y="164" class="label">Hot nodes and edges</text><text x="1244" y="188" class="muted">O4 preferred slice / flow ÷ declared capacity</text>
  <text x="1244" y="234" class="label">External → metro spine</text><text x="1508" y="234" class="smallmetric" text-anchor="end">1.264×</text><rect x="1244" y="246" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="246" width="247" height="10" rx="5" class="barHot"/><text x="1244" y="275" class="muted">0.254M people · 1,409 train equivalents</text>
  <text x="1244" y="318" class="label">Logistics gate</text><text x="1508" y="318" class="smallmetric" text-anchor="end">1.076×</text><rect x="1244" y="330" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="330" width="210" height="10" rx="5" fill="#f59e0b"/><text x="1244" y="359" class="muted">0.293M people · 19,131 vehicle equivalents</text>
  <text x="1244" y="402" class="label">Dazhongsi transfer</text><text x="1508" y="402" class="smallmetric" text-anchor="end">0.866×</text><rect x="1244" y="414" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="414" width="169" height="10" rx="5" fill="#38bdf8"/><text x="1244" y="443" class="muted">1.555M inflow · balanced flow ledger</text>
  <text x="1244" y="486" class="label">Protected cycle link</text><text x="1508" y="486" class="smallmetric" text-anchor="end">0.730×</text><rect x="1244" y="498" width="264" height="10" rx="5" class="barbg"/><rect x="1244" y="498" width="143" height="10" rx="5" fill="#4ade80"/><text x="1244" y="527" class="muted">0.423M people · no vehicle equivalent</text>
  <rect x="1244" y="553" width="264" height="32" rx="16" fill="#123c3b" stroke="#2aa477"/><text x="1376" y="574" class="chip" text-anchor="middle">Every edge / node ≤ 1.35×</text>

  <rect x="58" y="638" width="1484" height="178" rx="20" class="panel"/>
  <text x="86" y="677" class="label">Vehicle / service-equivalent ledger (not a fleet or timetable fact)</text><text x="86" y="708" class="muted">Convert people flow into auditable mode service-unit proxies; walking and cycling stay at zero vehicle equivalents</text>
  <rect x="86" y="738" width="226" height="55" rx="15" fill="#12354b"/><text x="108" y="763" class="muted">Metro train equivalent</text><text x="292" y="775" class="smallmetric" text-anchor="end">5,291</text>
  <rect x="332" y="738" width="226" height="55" rx="15" fill="#12354b"/><text x="354" y="763" class="muted">Bus equivalent</text><text x="538" y="775" class="smallmetric" text-anchor="end">10,042</text>
  <rect x="578" y="738" width="226" height="55" rx="15" fill="#3b243d"/><text x="600" y="763" class="muted">Car equivalent</text><text x="784" y="775" class="smallmetric" text-anchor="end">176,095</text>
  <rect x="824" y="738" width="226" height="55" rx="15" fill="#30304a"/><text x="846" y="763" class="muted">Enterprise shuttle</text><text x="1030" y="775" class="smallmetric" text-anchor="end">8,019</text>
  <rect x="1070" y="738" width="226" height="55" rx="15" fill="#153f3e"/><text x="1092" y="763" class="muted">Accessible corridor</text><text x="1276" y="775" class="smallmetric" text-anchor="end">0.653M</text>
  <rect x="1316" y="738" width="192" height="55" rx="15" fill="#153f3e"/><text x="1412" y="762" class="chip" text-anchor="middle">Air path</text><text x="1412" y="781" class="smallmetric" text-anchor="middle">BLOCKED</text>

  <text x="68" y="868" class="footer">Boundary: synthetic graph / synthetic capacities / synthetic group weights; no claim about current OD, road sections, station capacity, resident satisfaction or operating permission. Next calibration: dated 15-minute OD, service capacity, curb/intersection, accessibility and shuttle evidence.</text>
  <text x="68" y="894" class="footer">Re-run: node visual/assets/run-network-flow-screen.js  |  screen MOB-NETWORK-FLOW-888  |  privacy: aggregate group, zone, mode, time, node and edge counts only</text>
  <rect x="1370" y="850" width="172" height="48" rx="24" fill="#0f3a38" stroke="#34d399"/><text x="1456" y="879" class="chip" text-anchor="middle">PASS · SANDBOX</text>
<g id="evidence-chain-ribbon"><rect x="0" y="870" width="1600" height="110" fill="#071A2B" opacity=".96"/><text x="40" y="887" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#66E3CA">ONE REGIONAL RUNNER · SEVEN READOUT VIEWS</text><text x="1560" y="887" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#9FC0CF">one aggregate evidence chain, not seven independent field results</text><rect x="40.0" y="888" width="210.3" height="38" rx="10" fill="#4DE1BF22" stroke="#4DE1BF" stroke-width="1.5"/><text x="54.0" y="913" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">1  regional scale</text><rect x="258.3" y="888" width="210.3" height="38" rx="10" fill="#6EA5FF22" stroke="#6EA5FF" stroke-width="1.5"/><text x="272.3" y="913" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">2  network flow</text><rect x="476.6" y="888" width="210.3" height="38" rx="10" fill="#F7BF6322" stroke="#F7BF63" stroke-width="1.5"/><text x="490.6" y="913" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">3  capacity gap</text><rect x="694.9" y="888" width="210.3" height="38" rx="10" fill="#F07D9E22" stroke="#F07D9E" stroke-width="1.5"/><text x="708.9" y="913" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">4  group distribution</text><rect x="913.1" y="888" width="210.3" height="38" rx="10" fill="#F4A26122" stroke="#F4A261" stroke-width="1.5"/><text x="927.1" y="913" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">5  accessibility tail</text><rect x="1131.4" y="888" width="210.3" height="38" rx="10" fill="#B8A1FF22" stroke="#B8A1FF" stroke-width="1.5"/><text x="1145.4" y="913" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">6  resource sensitivity</text><rect x="1349.7" y="888" width="210.3" height="38" rx="10" fill="#5ED6D022" stroke="#5ED6D0" stroke-width="1.5"/><text x="1363.7" y="913" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#E8F8FA">7  robustness</text></g></svg>
