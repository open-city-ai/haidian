<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">Accessible service state contract</title><desc id="desc">Three synthetic routes remain UNKNOWN. READY requires dated audit, accountable owner, accessible alternative and human handoff evidence. Expiry returns to UNKNOWN. Air mobility is excluded from the denominator.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081B2D"/><stop offset="1" stop-color="#174B54"/></linearGradient><style>.t{font:900 38px Arial,PingFang SC,sans-serif}.s{font:600 17px Arial,PingFang SC,sans-serif}.h{font:900 16px Arial,sans-serif;letter-spacing:1px}.r{font:850 20px Arial,PingFang SC,sans-serif}.sm{font:600 14px Arial,PingFang SC,sans-serif}.v{font:900 23px Arial,sans-serif}</style></defs><rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1670" cy="90" r="290" fill="#63E6BE" opacity=".12"/><circle cx="120" cy="920" r="250" fill="#82A7FF" opacity=".12"/><text x="70" y="60" class="h" fill="#63E6BE">MOBILITY COMMONS / ACCESSIBLE SERVICE STATE / v1.0</text><text x="70" y="116" class="t" fill="#F4FBFF">Accessible service state contract</text><text x="70" y="151" class="s" fill="#B7D4DC">Lock state, validity, owner, alternative and recheck before calling a route usable</text><rect x="70" y="180" width="1660" height="76" rx="18" fill="#102D3D" stroke="#2A9D8F" stroke-width="2"/><text x="98" y="211" class="s" fill="#D8EEEE">Offline screen: 3 synthetic routes are UNKNOWN · field audits 0 · operating authorizations 0 · AI cannot repair, release or publish READY</text><text x="98" y="239" class="sm" fill="#A9C7D4">Expired confirmation → UNKNOWN; critical obstacle, missing alternative or missing handoff → CLOSED / STOP</text><text x="70" y="300" class="h" fill="#63E6BE">THREE PUBLIC SERVICE ROUTES</text><g><rect x="70" y="325" width="1040" height="112" rx="18" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="325" width="10" height="112" rx="5" fill="#F7C66A"/><text x="105" y="361" class="r" fill="#F4FBFF">A-01 Rail stop → enterprise entrance</text><text x="105" y="390" class="sm" fill="#B7D4DC">Continuous accessible route · dated audit / owner / alternative / handoff</text><rect x="900" y="352" width="165" height="42" rx="21" fill="#493B2A" stroke="#F7C66A"/><text x="982" y="380" text-anchor="middle" class="v" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="459" width="1040" height="112" rx="18" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="459" width="10" height="112" rx="5" fill="#82A7FF"/><text x="105" y="495" class="r" fill="#F4FBFF">A-02 Community daily service</text><text x="105" y="524" class="sm" fill="#B7D4DC">Human-equivalent route · paper/phone entry · human handoff · public notice</text><rect x="900" y="486" width="165" height="42" rx="21" fill="#493B2A" stroke="#F7C66A"/><text x="982" y="514" text-anchor="middle" class="v" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="593" width="1040" height="112" rx="18" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="593" width="10" height="112" rx="5" fill="#F38BA8"/><text x="105" y="629" class="r" fill="#F4FBFF">A-03 Night-return fallback</text><text x="105" y="658" class="sm" fill="#B7D4DC">Last-service check · usable waiting point · phone/paper help · safe handoff</text><rect x="900" y="620" width="165" height="42" rx="21" fill="#493B2A" stroke="#F7C66A"/><text x="982" y="648" text-anchor="middle" class="v" fill="#F7C66A">UNKNOWN</text></g><text x="1190" y="300" class="h" fill="#63E6BE">PUBLIC GATE</text><g><rect x="1190" y="335" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="371" class="sm" fill="#173A43">01 Current route audit</text><text x="1660" y="371" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><g><rect x="1190" y="409" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="445" class="sm" fill="#173A43">02 Accountable owner confirmation</text><text x="1660" y="445" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><g><rect x="1190" y="483" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="519" class="sm" fill="#173A43">03 Usable alternative route</text><text x="1660" y="519" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><g><rect x="1190" y="557" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="593" class="sm" fill="#173A43">04 Human handoff and recheck</text><text x="1660" y="593" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><rect x="1190" y="655" width="540" height="94" rx="18" fill="#3B2935" stroke="#F38BA8"/><text x="1218" y="690" class="sm" fill="#F9B2BF">Air-mobility candidate</text><text x="1218" y="724" class="v" fill="#FF9FAF">EXCLUDED FROM ACCESS DENOMINATOR</text><rect x="70" y="790" width="1660" height="126" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="96" y="833" class="h" fill="#63E6BE">STATE CHAIN</text><text x="245" y="833" class="s" fill="#F4FBFF">UNKNOWN → AUDITED → READY</text><text x="720" y="833" class="s" fill="#F7C66A">READY → DEGRADED / CLOSED</text><text x="1190" y="833" class="s" fill="#B7D4DC">CLOSED → REPAIR → RECHECK → READY</text><text x="96" y="875" class="sm" fill="#A9C7D4">Any expired confirmation returns to UNKNOWN. This is a structural replay, not a field accessibility rate, equipment availability, staffing or satisfaction result.</text></svg>
