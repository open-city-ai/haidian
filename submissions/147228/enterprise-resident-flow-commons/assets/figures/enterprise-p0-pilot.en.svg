<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#F5F1E9" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#0B263D" stroke="none" stroke-width="0"/><text x="60" y="50" font-size="18" fill="#77E7D3" font-weight="800" text-anchor="start">FLOW COMMONS / MINIMUM P0 EVIDENCE / v1.0</text><text x="60" y="100" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">AI Origin Care Loop Minimum P0 Evidence Pack</text><rect x="1510" y="42" width="230" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1625" y="65" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD · 0 FIELD RECORDS</text><rect x="60" y="180" width="500" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">01 · WHY THIS NODE FIRST</text><text x="88" y="260" font-size="27" fill="#0B263D" font-weight="850" text-anchor="start">AI Origin Community Care Loop</text><text x="88" y="305" font-size="16" fill="#173047" font-weight="600" text-anchor="start">• Validate daily resident access and a human-equivalent entry;</text><text x="88" y="336" font-size="16" fill="#173047" font-weight="600" text-anchor="start">• no dependence on the unresolved Dazhongsi anchor;</text><text x="88" y="367" font-size="16" fill="#173047" font-weight="600" text-anchor="start">• no enterprise-vehicle expansion as a pilot prerequisite.</text><rect x="88" y="392" width="205" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="190.5" y="415" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">ordinary chain</text><rect x="305" y="392" width="220" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="415" y="415" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">accessible alternative</text><rect x="590" y="180" width="1150" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="618" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">02 · FOUR WINDOWS · ONE VERSION AND STOP CONTRACT</text><rect x="618" y="248" width="250" height="94" rx="14" fill="#EEF7F5" stroke="#D8E3E7" stroke-width="1"/><text x="636" y="277" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">T1</text><text x="670" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">weekday AM peak</text><text x="636" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">07:00-09:00</text><text x="636" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">design window · not scheduled</text><text x="879" y="302" font-size="19" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="888" y="248" width="250" height="94" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="906" y="277" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">T2</text><text x="940" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">community daytime service</text><text x="906" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">10:00-12:00</text><text x="906" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">design window · not scheduled</text><text x="1149" y="302" font-size="19" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1158" y="248" width="250" height="94" rx="14" fill="#EEF7F5" stroke="#D8E3E7" stroke-width="1"/><text x="1176" y="277" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">T3</text><text x="1210" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">PM peak and care return</text><text x="1176" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">17:00-20:00</text><text x="1176" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">design window · not scheduled</text><text x="1419" y="302" font-size="19" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1428" y="248" width="250" height="94" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="1446" y="277" font-size="14" fill="#777AF2" font-weight="800" text-anchor="start">T4</text><text x="1480" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">night human fallback</text><text x="1446" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">20:00-22:00</text><text x="1446" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">design window · not scheduled</text><text x="618" y="390" font-size="14" fill="#617487" font-weight="600" text-anchor="start">Every record carries date, weather, counter role, missing interval and spatial version; incomparable windows do not enter calibration.</text><rect x="60" y="470" width="1100" height="520" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="508" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">03 · SEVEN EVIDENCE STREAMS · TEMPLATES READY · FIELD RECORDS 0</text><circle cx="112" cy="553" r="20" fill="#29BFA8"/><text x="112" y="559" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E1</text><text x="148" y="549" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">grouped flow and request</text><text x="148" y="572" font-size="11" fill="#617487" font-weight="550" text-anchor="start">2 weekdays + 1 stress window before calibration</text><rect x="1008" y="537" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="560" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="589" x2="1128" y2="589" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="615" r="20" fill="#F17457"/><text x="112" y="621" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E2</text><text x="148" y="611" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">segment accessibility walk</text><text x="148" y="634" font-size="11" fill="#617487" font-weight="550" text-anchor="start">ordinary + accessible chains walked by day and night</text><rect x="1008" y="599" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="622" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="651" x2="1128" y2="651" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="677" r="20" fill="#F0C769"/><text x="112" y="683" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E3</text><text x="148" y="673" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">curb and public-route responsibility</text><text x="148" y="696" font-size="11" fill="#617487" font-weight="550" text-anchor="start">accepted receiver + public-route restoration check</text><rect x="1008" y="661" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="684" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="713" x2="1128" y2="713" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="739" r="20" fill="#777AF2"/><text x="112" y="745" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E4</text><text x="148" y="735" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">human and public-transport fallback</text><text x="148" y="758" font-size="11" fill="#617487" font-weight="550" text-anchor="start">one outage/weather human takeover per window</text><rect x="1008" y="723" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="746" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="775" x2="1128" y2="775" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="801" r="20" fill="#29BFA8"/><text x="112" y="807" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E5</text><text x="148" y="797" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">data minimisation and retention</text><text x="148" y="820" font-size="11" fill="#617487" font-weight="550" text-anchor="start">purpose + expiry locked before collection</text><rect x="1008" y="785" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="808" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="837" x2="1128" y2="837" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="863" r="20" fill="#F17457"/><text x="112" y="869" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E6</text><text x="148" y="859" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">participatory threshold sign-off</text><text x="148" y="882" font-size="11" fill="#617487" font-weight="550" text-anchor="start">each affected group can disagree and correct</text><rect x="1008" y="847" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="870" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="899" x2="1128" y2="899" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="925" r="20" fill="#F0C769"/><text x="112" y="931" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E7</text><text x="148" y="921" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">public status and closeout</text><text x="148" y="944" font-size="11" fill="#617487" font-weight="550" text-anchor="start">readable board + paper/phone correction route</text><rect x="1008" y="909" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="932" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><text x="88" y="972" font-size="13" fill="#F17457" font-weight="700" text-anchor="start">UNKNOWN never becomes zero; any group hidden by an average triggers a block.</text><rect x="1180" y="470" width="560" height="540" rx="24" fill="#0B263D" stroke="none" stroke-width="0"/><text x="1208" y="508" font-size="16" fill="#77E7D3" font-weight="800" text-anchor="start">04 · RACI AND FIVE RELEASE GATES</text><text x="1208" y="535" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="start">site and data steward</text><rect x="1578" y="513" width="130" height="34" rx="17" fill="#3C3037" stroke="none" stroke-width="0"/><text x="1643" y="536" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">UNASSIGNED</text><text x="1208" y="583" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="start">transport and accessibility reviewer</text><rect x="1578" y="561" width="130" height="34" rx="17" fill="#3C3037" stroke="none" stroke-width="0"/><text x="1643" y="584" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">UNASSIGNED</text><text x="1208" y="631" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="start">resident carer disabled user panel</text><rect x="1578" y="609" width="130" height="34" rx="17" fill="#3C3037" stroke="none" stroke-width="0"/><text x="1643" y="632" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">UNASSIGNED</text><text x="1208" y="679" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="start">human service and transit handoff</text><rect x="1578" y="657" width="130" height="34" rx="17" fill="#3C3037" stroke="none" stroke-width="0"/><text x="1643" y="680" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">UNASSIGNED</text><text x="1208" y="727" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="start">independent closeout reviewer</text><rect x="1578" y="705" width="130" height="34" rx="17" fill="#3C3037" stroke="none" stroke-width="0"/><text x="1643" y="728" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">UNASSIGNED</text><line x1="1208" y1="780" x2="1712" y2="780" stroke="#35556A" stroke-width="2" /><text x="1208" y="810" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G1 scope and rights</text><rect x="1602" y="788" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="811" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><text x="1208" y="841" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G2 dated grouped baseline</text><rect x="1602" y="819" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="842" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><text x="1208" y="872" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G3 accessible and human fallback</text><rect x="1602" y="850" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="873" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><text x="1208" y="903" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G4 responsibility and resources</text><rect x="1602" y="881" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="904" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><text x="1208" y="934" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G5 participatory review and closeout</text><rect x="1602" y="912" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="935" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><rect x="1208" y="966" width="500" height="1" rx="0" fill="#35556A" stroke="none" stroke-width="0"/><text x="1208" y="993" font-size="12" fill="#A9C3D2" font-weight="600" text-anchor="start">Current: 0 confirmed roles · 0 group sign-offs · 0 passed gates</text><rect x="60" y="1020" width="1680" height="110" rx="18" fill="#4A3034" stroke="none" stroke-width="0"/><text x="88" y="1056" font-size="15" fill="#FFB29F" font-weight="850" text-anchor="start">MODEL INVALID → STOP:</text><text x="350" y="1056" font-size="14" fill="#FFFFFF" font-weight="650" text-anchor="start">incomparable window / missing group denominator / route version changed / missing interval / unmodeled barrier</text><text x="88" y="1095" font-size="13" fill="#E7D5D2" font-weight="600" text-anchor="start">This is a participant-controlled field protocol, not a field result. Missing official geometry does not block the protocol, but zero records never advance to P1.</text><text x="60" y="1170" font-size="13" fill="#617487" font-weight="600" text-anchor="start">Sources: p0-pilot-evidence-pack.json · taskbook · accessibility / data-governance standards</text><text x="1740" y="1170" font-size="13" fill="#617487" font-weight="750" text-anchor="end">NOT AUTHORIZED · NOT RUN · NO PERSONAL TRACES</text></svg>
