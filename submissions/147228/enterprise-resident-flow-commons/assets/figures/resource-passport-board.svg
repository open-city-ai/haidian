<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc"><title id="title">AI 交通服务资源护照：先问负担，再开闸</title><desc id="desc">10 张场景卡 × 7 类资源 · 现实测量、授权与运行结果均为 UNKNOWN. 不是能耗、碳排、采购数量、现场绩效、许可或公众接受度。所有现实字段先保持 unknown。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#17485a"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00111f" flood-opacity=".22"/></filter><style>.sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.label{font-size:27px;font-weight:850}.body{font-size:19px;font-weight:650}.tiny{font-size:15px;font-weight:600}.status{font-size:15px;font-weight:900}.flow{font-size:24px;font-weight:850}.title{font-size:54px;font-weight:900;letter-spacing:-2px}.muted{font-size:23px;font-weight:600}</style></defs><rect width="2400" height="1500" fill="url(#bg)"/><text x="80" y="75" class="sans" font-size="23" font-weight="900" letter-spacing="4" fill="#70e1c3">MOBILITY COMMONS / RESOURCE PASSPORT / v1.0</text><text x="80" y="150" class="sans title" fill="#f4fbfb">AI 交通服务资源护照：先问负担，再开闸</text><text x="80" y="198" class="sans muted" fill="#a8c2c7">10 张场景卡 × 7 类资源 · 现实测量、授权与运行结果均为 UNKNOWN</text><rect x="1965" y="58" width="350" height="62" rx="31" fill="#3e2d2d" stroke="#ff9b8e" stroke-width="2"/><text x="2140" y="97" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#ffb1a5">DESIGN LEDGER / NOT OPERATING</text><g filter="url(#shadow)"><rect x="80" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="620" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="1160" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="1700" y="250" width="615" height="105" rx="20" fill="#143c4c"/></g><text x="110" y="290" class="sans" font-size="18" fill="#a8c2c7">SCENARIO CARDS</text><text x="110" y="335" class="sans" font-size="39" font-weight="900" fill="#70e1c3">10</text><text x="650" y="290" class="sans" font-size="18" fill="#a8c2c7">RESOURCE CLASSES</text><text x="650" y="335" class="sans" font-size="39" font-weight="900" fill="#70e1c3">7</text><text x="1190" y="290" class="sans" font-size="18" fill="#a8c2c7">LOCAL MEASUREMENTS</text><text x="1190" y="335" class="sans" font-size="39" font-weight="900" fill="#ffd37a">0 / UNKNOWN</text><text x="1730" y="290" class="sans" font-size="18" fill="#a8c2c7">OPERATIONS AUTHORIZED</text><text x="1730" y="335" class="sans" font-size="39" font-weight="900" fill="#ff9b8e">NO · AIR BLOCKED</text><rect x="80" y="380" width="2235" height="810" rx="30" fill="#eaf4f5" filter="url(#shadow)"/><text x="120" y="430" class="sans" font-size="30" font-weight="900" fill="#102d43">七类资源：每张场景卡都必须逐项过账</text><g><rect x="80" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="116" cy="443" r="18" fill="#f0b45c"/><text x="116" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">1</text><text x="150" y="451" class="sans label" fill="#102d43">算力与网络</text><rect x="150" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="209" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="108" y="537" class="sans body" fill="#29465a">记录模型调用、网络与边缘设备；合成 PASS 不得自动</text><text x="108" y="562" class="sans body" fill="#29465a">扩容</text><text x="108" y="610" class="sans tiny" fill="#6b8190">需补：按场景记录日期、调用量、延迟、设备和非 AI 等价路径</text></g><g><rect x="655" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="691" cy="443" r="18" fill="#f0b45c"/><text x="691" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">2</text><text x="725" y="451" class="sans label" fill="#102d43">能源与燃料</text><rect x="725" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="784" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="683" y="537" class="sans body" fill="#29465a">没有计量边界，不报 kWh、燃料、碳排或节能</text><text x="683" y="610" class="sans tiny" fill="#6b8190">需补：地铁、公交、班车、汽车与设备的有日期计量边界</text></g><g><rect x="1230" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="1266" cy="443" r="18" fill="#f0b45c"/><text x="1266" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">3</text><text x="1300" y="451" class="sans label" fill="#102d43">设备与材料</text><rect x="1300" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="1359" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1258" y="537" class="sans body" fill="#29465a">设备必须可撤回、有资产 ID、维护人和回收去向</text><text x="1258" y="610" class="sans tiny" fill="#6b8190">需补：闸机、信息牌、传感器、充电与可移动设施清单</text></g><g><rect x="1805" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="1841" cy="443" r="18" fill="#f0b45c"/><text x="1841" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">4</text><text x="1875" y="451" class="sans label" fill="#102d43">数据与隐私</text><rect x="1875" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="1934" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1833" y="537" class="sans body" fill="#29465a">只保留分组聚合；目的、保留、删除和申诉责任先公开</text><text x="1833" y="610" class="sans tiny" fill="#6b8190">需补：同意、分组阈值、保留周期、删除日志和人工入口</text></g><g><rect x="80" y="690" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="116" cy="728" r="18" fill="#f0b45c"/><text x="116" y="735" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">5</text><text x="150" y="736" class="sans label" fill="#102d43">人工复核</text><rect x="150" y="755" width="118" height="30" rx="15" fill="#fff0d8"/><text x="209" y="776" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="108" y="822" class="sans body" fill="#29465a">每个自动建议都有人工、电话和纸面等价服务</text><text x="108" y="895" class="sans tiny" fill="#6b8190">需补：复核分钟数、值守角色、拒绝权、申诉与无障碍服务记录</text></g><g><rect x="655" y="690" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="691" cy="728" r="18" fill="#f0b45c"/><text x="691" y="735" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">6</text><text x="725" y="736" class="sans label" fill="#102d43">供应商与维护</text><rect x="725" y="755" width="118" height="30" rx="15" fill="#fff0d8"/><text x="784" y="776" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="683" y="822" class="sans body" fill="#29465a">没有具名运营、维护 SLA 和供应商退出路径，不进入扩</text><text x="683" y="847" class="sans body" fill="#29465a">展</text><text x="683" y="895" class="sans tiny" fill="#6b8190">需补：责任矩阵、巡检、故障响应、供应商替代和保险接口</text></g><g><rect x="1230" y="690" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="1266" cy="728" r="18" fill="#f0b45c"/><text x="1266" y="735" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">7</text><text x="1300" y="736" class="sans label" fill="#102d43">失败与退出</text><rect x="1300" y="755" width="118" height="30" rx="15" fill="#fff0d8"/><text x="1359" y="776" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1258" y="822" class="sans body" fill="#29465a">先写停机、回退、拆除、恢复公共路线和投诉关闭动作</text><text x="1258" y="895" class="sans tiny" fill="#6b8190">需补：触发条件、撤回工时、存储/拆除、恢复和复盘记录</text></g><rect x="80" y="1208" width="2235" height="265" rx="30" fill="#102d43"/><text x="120" y="1250" class="sans" font-size="19" font-weight="900" fill="#70e1c3">它回答什么？</text><text x="120" y="1285" class="sans" font-size="17" fill="#d5e6e8">把算力、设备、人工和退出责任放到交通模型旁边，避免合成分数遮住现实负担。</text><text x="120" y="1328" class="sans" font-size="19" font-weight="900" fill="#ffb1a5">它不回答什么？</text><text x="120" y="1363" class="sans" font-size="17" fill="#f4d8d4">不是能耗、碳排、采购数量、现场绩效、许可或公众接受度。所有现实字段先保持 unknown。</text><g><rect x="150" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="300" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">分组需求</text><path d="M450 1280 H620 l-22 -14 M620 1280 l-22 14" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="720" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="870" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">AI 选择</text><path d="M1020 1280 H1190 l-22 -14 M1190 1280 l-22 14" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="1290" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="1440" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">人工/公交回退</text><path d="M1590 1280 H1760 l-22 -14 M1760 1280 l-22 14" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="1860" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="2010" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">复核与撤回</text></g><text x="120" y="1460" class="sans" font-size="15" font-weight="750" fill="#a8c2c7">五道 NO-GO 门：无等价人工服务 · 需要个人轨迹 · 无维护退出 · 破坏消防/无障碍/安静界面 · 未登记失败与恢复</text></svg>
