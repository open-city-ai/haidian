<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">交通失败治理与申诉回写屏</title><desc id="desc">六类交通失败、五条治理轴和四个回写载体组成追加式协议。当前没有现场事故、申诉、纠错或退役发布记录；空中出行仍被挡在运营与事故分母之外。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081B2D"/><stop offset="1" stop-color="#3C315B"/></linearGradient><style>.t{font:900 38px PingFang SC,Microsoft YaHei,Arial,sans-serif}.s{font:600 17px PingFang SC,Microsoft YaHei,Arial,sans-serif}.h{font:900 16px Arial,PingFang SC,sans-serif;letter-spacing:1px}.r{font:850 19px PingFang SC,Microsoft YaHei,Arial,sans-serif}.sm{font:600 13px PingFang SC,Microsoft YaHei,Arial,sans-serif}.v{font:900 20px Arial,sans-serif}</style></defs><rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1680" cy="90" r="300" fill="#F38BA8" opacity=".13"/><circle cx="80" cy="920" r="260" fill="#63E6BE" opacity=".11"/><text x="70" y="60" class="h" fill="#63E6BE">MOBILITY COMMONS / FAILURE GOVERNANCE / v1.0</text><text x="70" y="116" class="t" fill="#F4FBFF">交通失败治理与申诉回写屏</text><text x="70" y="151" class="s" fill="#C8D8E5">故障不靠一句“已修复”结束：状态、群体影响、人工决定与版本退役都要留下可追的链</text><rect x="70" y="180" width="1660" height="76" rx="18" fill="#12283C" stroke="#F38BA8" stroke-width="2"/><text x="98" y="211" class="s" fill="#F4FBFF">当前离线协议：现场事故 0 · 申诉 0 · 纠错 0 · 退役发布 0 · 运营授权 0</text><text x="98" y="239" class="sm" fill="#B7D4DC">合成压力屏查不能冒充事故；新版本追加旧版本，申诉可以暂停发布，不能抹掉原记录</text><text x="70" y="300" class="h" fill="#63E6BE">追加式状态链</text><g><rect x="70" y="330" width="500" height="110" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="100" y="366" class="r" fill="#F4FBFF">DRAFT → REVIEW</text><text x="100" y="398" class="sm" fill="#B7D4DC">记录失败类、受影响群体、证据和责任角色</text><text x="100" y="422" class="sm" fill="#F7C66A">没有日期与人工责任 → UNKNOWN</text></g><path d="M570 385 H620" stroke="#63E6BE" stroke-width="5"/><path d="M610 373 l18 12 -18 12" fill="none" stroke="#63E6BE" stroke-width="5"/><g><rect x="70" y="468" width="500" height="110" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="100" y="504" class="r" fill="#F4FBFF">STOP → RECOVERY</text><text x="100" y="536" class="sm" fill="#B7D4DC">人工决定、替代路线、恢复责任与复验窗口</text><text x="100" y="560" class="sm" fill="#F38BA8">未接管 → STOP；无回退 → 不发布</text></g><path d="M570 523 H620" stroke="#63E6BE" stroke-width="5"/><path d="M610 511 l18 12 -18 12" fill="none" stroke="#63E6BE" stroke-width="5"/><g><rect x="70" y="606" width="500" height="110" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="100" y="642" class="r" fill="#F4FBFF">CORRECTION → RETIRED</text><text x="100" y="674" class="sm" fill="#B7D4DC">保留 prior_record_id、理由、申诉窗口和替代载体</text><text x="100" y="698" class="sm" fill="#63E6BE">退役不是删除：要有继任或地面回退</text></g><text x="70" y="778" class="h" fill="#63E6BE">四个回写载体</text><text x="70" y="814" class="sm" fill="#F4FBFF">服务状态　群体影响　人工决定　申诉与退役</text><text x="70" y="850" class="sm" fill="#A9C7D4">无个人轨迹 · 不记录真实事故 · 不声称居民申诉已经发生</text><text x="650" y="300" class="h" fill="#63E6BE">六类失败 / FAILURE CLASSES</text><g><rect x="650" y="330" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="674" y="365" class="r" fill="#F4FBFF">F-01 轨道 / 公交中断</text><text x="674" y="397" class="sm" fill="#B7D4DC">到岗、照护、外部通勤</text></g><g><rect x="990" y="330" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="1014" y="365" class="r" fill="#F4FBFF">F-02 无障碍断裂</text><text x="1014" y="397" class="sm" fill="#B7D4DC">连续路线与人工交接</text></g><g><rect x="650" y="450" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="674" y="485" class="r" fill="#F4FBFF">F-03 路缘 / 骑行冲突</text><text x="674" y="517" class="sm" fill="#B7D4DC">装卸、骑行与步行</text></g><g><rect x="990" y="450" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="1014" y="485" class="r" fill="#F4FBFF">F-04 接驳失约</text><text x="1014" y="517" class="sm" fill="#B7D4DC">夜班与企业到岗</text></g><g><rect x="650" y="570" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="674" y="605" class="r" fill="#F4FBFF">F-05 物流维护失效</text><text x="674" y="637" class="sm" fill="#B7D4DC">维修、居民与无障碍</text></g><g><rect x="990" y="570" width="320" height="100" rx="16" fill="#3B2935" stroke="#F38BA8"/><text x="1014" y="605" class="r" fill="#FFB6C2">F-06 空中闸门拒绝</text><text x="1014" y="637" class="sm" fill="#F9D0D6">地面回退，不进运营分母</text></g><text x="650" y="730" class="sm" fill="#A9C7D4">每类失败都必须指出受影响群体、观察角色、替代路线和停止条件。</text><text x="1350" y="300" class="h" fill="#63E6BE">五条治理轴 / FIVE AXES</text><g><rect x="1350" y="330" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="364" class="sm" fill="#173A43">SERVICE STATE</text><text x="1698" y="364" text-anchor="end" class="v" fill="#173A43">UNKNOWN</text></g><g><rect x="1350" y="398" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="432" class="sm" fill="#173A43">GROUP IMPACT</text><text x="1698" y="432" text-anchor="end" class="v" fill="#173A43">NOT ASSESSED</text></g><g><rect x="1350" y="466" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="500" class="sm" fill="#173A43">EVIDENCE</text><text x="1698" y="500" text-anchor="end" class="v" fill="#173A43">UNKNOWN</text></g><g><rect x="1350" y="534" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="568" class="sm" fill="#173A43">HUMAN DECISION</text><text x="1698" y="568" text-anchor="end" class="v" fill="#173A43">UNASSIGNED</text></g><g><rect x="1350" y="602" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="636" class="sm" fill="#173A43">RELEASE</text><text x="1698" y="636" text-anchor="end" class="v" fill="#173A43">DRAFT</text></g><rect x="1350" y="704" width="380" height="94" rx="18" fill="#3B2935" stroke="#F38BA8"/><text x="1374" y="740" class="sm" fill="#FFB6C2">空中出行候选</text><text x="1374" y="774" class="v" fill="#FF9FAF">BLOCKED / GROUND FALLBACK</text><rect x="650" y="790" width="1080" height="126" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="680" y="829" class="h" fill="#63E6BE">读法</text><text x="790" y="829" class="s" fill="#F4FBFF">这张图证明字段和拒绝规则可离线复核，不证明事故发生、申诉完成、服务质量或公众满意度。</text><text x="680" y="868" class="sm" fill="#A9C7D4">版本纠错追加而非覆盖；受影响群体可以提出聚合申诉，申诉先暂停发布，再由人工角色处理。</text></svg>
