<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#08121f"/>
  <rect x="42" y="34" width="1516" height="102" rx="18" fill="#12283d" stroke="#3e6d91" stroke-width="2"/>
  <text x="76" y="78" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="31" font-weight="700">企业—居民互惠 · 首 100 天交付合同</text>
  <text x="76" y="111" fill="#a8c5dc" font-family="Arial, sans-serif" font-size="17">企业请求、居民回程、人工接管、公共交通保护与申诉暂停权必须在同一条时间线上留下回执</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="1012" y="58" width="120" height="40" rx="11" fill="#2b658f"/><text x="1033" y="84" fill="#f5f7fb">G0 包内回放</text>
    <rect x="1144" y="58" width="160" height="40" rx="11" fill="#704351"/><text x="1164" y="84" fill="#f5f7fb">G1 现场 HOLD</text>
    <rect x="1316" y="58" width="220" height="40" rx="11" fill="#26364a"/><text x="1335" y="84" fill="#f5f7fb">0 授权 · 0 现场观察</text>
  </g>

  <text x="64" y="181" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="23" font-weight="700">五个时间窗，先把居民回程交付出来</text>
  <line x1="100" y1="315" x2="1500" y2="315" stroke="#416d8e" stroke-width="6"/>
  <g font-family="Arial, sans-serif">
    <rect x="56" y="212" width="276" height="230" rx="16" fill="#142b40" stroke="#4f8db4" stroke-width="2"/>
    <text x="78" y="248" fill="#9dd8ff" font-size="19" font-weight="700">D00-07 · BASE</text>
    <text x="78" y="280" fill="#f5f7fb" font-size="18" font-weight="700">只登记，不预约</text>
    <text x="78" y="312" fill="#c4d7e9" font-size="15">企业需求台账</text><text x="78" y="337" fill="#c4d7e9" font-size="15">普通、无障碍、人工路线</text>
    <text x="78" y="372" fill="#f6c56c" font-size="15" font-weight="700">缺责任人即停止</text><text x="78" y="402" fill="#9eb7cf" font-size="14">公众状态卡 · 无个人轨迹</text>

    <rect x="366" y="212" width="276" height="230" rx="16" fill="#182e43" stroke="#4f8db4" stroke-width="2"/>
    <text x="388" y="248" fill="#9dd8ff" font-size="19" font-weight="700">D08-30 · PILOT</text>
    <text x="388" y="280" fill="#f5f7fb" font-size="18" font-weight="700">一处窗口先试</text>
    <text x="388" y="312" fill="#c4d7e9" font-size="15">到岗或装卸窗口</text><text x="388" y="337" fill="#c4d7e9" font-size="15">同窗公共路线与接管人</text>
    <text x="388" y="372" fill="#f6c56c" font-size="15" font-weight="700">慢群体变差即暂停</text><text x="388" y="402" fill="#9eb7cf" font-size="14">走查 · 维护 · 回退回执</text>

    <rect x="676" y="212" width="276" height="230" rx="16" fill="#1a3045" stroke="#4f8db4" stroke-width="2"/>
    <text x="698" y="248" fill="#9dd8ff" font-size="19" font-weight="700">D31-60 · PILOT</text>
    <text x="698" y="280" fill="#f5f7fb" font-size="18" font-weight="700">冲突时先保回程</text>
    <text x="698" y="312" fill="#c4d7e9" font-size="15">断网、雨雪、错过换乘</text><text x="698" y="337" fill="#c4d7e9" font-size="15">清场、维修与人工申诉</text>
    <text x="698" y="372" fill="#f6c56c" font-size="15" font-weight="700">无人接管即冻结</text><text x="698" y="402" fill="#9eb7cf" font-size="14">转交记录 · 维修窗口</text>

    <rect x="986" y="212" width="276" height="230" rx="16" fill="#2c2634" stroke="#9b6b74" stroke-width="2"/>
    <text x="1008" y="248" fill="#ffcfb0" font-size="19" font-weight="700">D61-90 · BLACKOUT</text>
    <text x="1008" y="280" fill="#f5f7fb" font-size="18" font-weight="700">停数字层，公共服务继续</text>
    <text x="1008" y="312" fill="#e2cbd0" font-size="15">停止预约、清理资产</text><text x="1008" y="337" fill="#e2cbd0" font-size="15">轨道、公交、步行和人工</text>
    <text x="1008" y="372" fill="#ffb271" font-size="15" font-weight="700">回程不可见即不放行</text><text x="1008" y="402" fill="#cbaeb7" font-size="14">触发记录 · 受影响群体通知</text>

    <rect x="1296" y="212" width="248" height="230" rx="16" fill="#263142" stroke="#768ca5" stroke-width="2"/>
    <text x="1318" y="248" fill="#b9d8ee" font-size="19" font-weight="700">D91-100 · CLOSEOUT</text>
    <text x="1318" y="280" fill="#f5f7fb" font-size="18" font-weight="700">公开决定</text>
    <text x="1318" y="312" fill="#c4d7e9" font-size="15">继续、修复或撤回</text><text x="1318" y="337" fill="#c4d7e9" font-size="15">投诉、维护债务、清权</text>
    <text x="1318" y="372" fill="#f6c56c" font-size="15" font-weight="700">解释不清即退出</text><text x="1318" y="402" fill="#9eb7cf" font-size="14">公众结案卡 · 可申诉</text>
  </g>

  <text x="64" y="500" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="23" font-weight="700">三个空间节点，共用同一份互惠账</text>
  <g font-family="Arial, sans-serif">
    <rect x="56" y="532" width="470" height="220" rx="16" fill="#10283a" stroke="#3b789a" stroke-width="2"/>
    <text x="82" y="570" fill="#9dd8ff" font-size="20" font-weight="700">众智园 · 清河前厅</text>
    <text x="82" y="608" fill="#f5f7fb" font-size="16">企业到岗 / 装卸窗口</text><text x="82" y="636" fill="#c4d7e9" font-size="16">居民回报：连续步行、人工导视、清场回执</text>
    <text x="82" y="680" fill="#f6c56c" font-size="15" font-weight="700">硬门：路缘冲突未清、接收人缺失，停止窗口</text>
    <text x="82" y="715" fill="#9eb7cf" font-size="14">概念原型，不代表现状设施或路权</text>

    <rect x="564" y="532" width="470" height="220" rx="16" fill="#122b3d" stroke="#3b789a" stroke-width="2"/>
    <text x="590" y="570" fill="#9dd8ff" font-size="20" font-weight="700">AI 原点 · 照护环</text>
    <text x="590" y="608" fill="#f5f7fb" font-size="16">企业班次 / 居民日常照护</text><text x="590" y="636" fill="#c4d7e9" font-size="16">居民回报：纸面、电话、人工服务与申诉</text>
    <text x="590" y="680" fill="#f6c56c" font-size="15" font-weight="700">硬门：照护路径被挤掉、申诉无人接，退回 BASE</text>
    <text x="590" y="715" fill="#9eb7cf" font-size="14">概念原型，不代表人员值守或服务绩效</text>

    <rect x="1072" y="532" width="472" height="220" rx="16" fill="#172b3e" stroke="#3b789a" stroke-width="2"/>
    <text x="1098" y="570" fill="#9dd8ff" font-size="20" font-weight="700">大钟寺 · 四象限换乘厅</text>
    <text x="1098" y="608" fill="#f5f7fb" font-size="16">轨道到路缘转交 / 活动复位</text><text x="1098" y="636" fill="#c4d7e9" font-size="16">居民回报：公共穿越、公交骨干、回到日常</text>
    <text x="1098" y="680" fill="#f6c56c" font-size="15" font-weight="700">硬门：公交骨干变弱、复位不明，停止扩展</text>
    <text x="1098" y="715" fill="#9eb7cf" font-size="14">概念原型，不代表交通组织或建设许可</text>
  </g>

  <rect x="56" y="795" width="1488" height="150" rx="16" fill="#0f1f31" stroke="#35536d" stroke-width="2"/>
  <text x="82" y="833" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">当前状态</text>
  <text x="82" y="872" fill="#c4d7e9" font-family="Arial, sans-serif" font-size="16">5 个时间窗 · 3 个空间节点 · 5 道共同闸门 · 5 个负例 · 3 个正例</text>
  <text x="82" y="906" fill="#f6c56c" font-family="Arial, sans-serif" font-size="16" font-weight="700">HOLD · 授权 0 · 现场观察 0 · baseline unknown · result not_run · performance null</text>
  <text x="1055" y="872" fill="#9eb7cf" font-family="Arial, sans-serif" font-size="15">AI 只整理分组需求与版本说明</text>
  <text x="1055" y="906" fill="#9eb7cf" font-family="Arial, sans-serif" font-size="15">企业请求不能单独换取公共路权</text>
</svg>
