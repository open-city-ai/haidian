th="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="842" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><text x="1208" y="872" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G3 accessible and human fallback</text><rect x="1602" y="850" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="873" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><text x="1208" y="903" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G4 responsibility and resources</text><rect x="1602" y="881" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="904" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><text x="1208" y="934" font-size="12" fill="#D9E5EB" font-weight="600" text-anchor="start">G5 participatory review and closeout</text><rect x="1602" y="912" width="106" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1655" y="935" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD</text><rect x="1208" y="966" width="500" height="1" rx="0" fill="#35556A" stroke="none" stroke-width="0"/><text x="1208" y="993" font-size="12" fill="#A9C3D2" font-weight="600" text-anchor="start">当前：0 角色确认 · 0 分组签收 · 0 放行门</text><rect x="60" y="1020" width="1680" height="110" rx="18" fill="#4A3034" stroke="none" stroke-width="0"/><text x="88" y="1056" font-size="15" fill="#FFB29F" font-weight="850" text-anchor="start">校准失效即停：</text><text x="250" y="1056" font-size="14" fill="#FFFFFF" font-weight="650" text-anchor="start">窗口不可比 / 分组分母缺失 / 路线版本改变 / 漏记区间 / 出现未建模障碍</text><text x="88" y="1095" font-size="13" fill="#E7D5D2" font-weight="600" text-anchor="start">本图是参与者可控制的现场协议，不是现场结果；正式边界缺失不阻断编制协议，但 0 记录绝不升级为 P1。</text><text x="60" y="1170" font-size="13" fill="#617487" font-weight="600" text-anchor="start">Sources: p0-pilot-evidence-pack.json · taskbook · accessibility / data-governance standards</text><text x="1740" y="1170" font-size="13" fill="#617487" font-weight="750" text-anchor="end">NOT AUTHORIZED · NOT RUN · NO PERSONAL TRACES</text></svg>
