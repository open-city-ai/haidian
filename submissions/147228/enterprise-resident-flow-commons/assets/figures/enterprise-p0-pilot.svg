<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#F5F1E9" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#0B263D" stroke="none" stroke-width="0"/><text x="60" y="50" font-size="18" fill="#77E7D3" font-weight="800" text-anchor="start">FLOW COMMONS / MINIMUM P0 EVIDENCE / v1.0</text><text x="60" y="100" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">AI 原点照护环最小 P0 证据包</text><rect x="1510" y="42" width="230" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1625" y="65" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">HOLD · 0 FIELD RECORDS</text><rect x="60" y="180" width="500" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">01 · 为什么先做这里</text><text x="88" y="260" font-size="27" fill="#0B263D" font-weight="850" text-anchor="start">AI 原点社区照护环</text><text x="88" y="305" font-size="16" fill="#173047" font-weight="600" text-anchor="start">• 先验收居民日常和人工等价入口；</text><text x="88" y="336" font-size="16" fill="#173047" font-weight="600" text-anchor="start">• 不依赖大钟寺未定锚点；</text><text x="88" y="367" font-size="16" fill="#173047" font-weight="600" text-anchor="start">• 不以企业车辆扩容作为试点前提。</text><rect x="88" y="392" width="205" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="190.5" y="415" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">一条普通链</text><rect x="305" y="392" width="220" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="415" y="415" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">一条无障碍替代链</text><rect x="590" y="180" width="1150" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="618" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">02 · 四个观察窗，同一套版本与停止规则</text><rect x="618" y="248" width="250" height="94" rx="14" fill="#EEF7F5" stroke="#D8E3E7" stroke-width="1"/><text x="636" y="277" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">T1</text><text x="670" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">工作日早高峰</text><text x="636" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">07:00-09:00</text><text x="636" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">设计观察窗 · 非已排期</text><text x="879" y="302" font-size="19" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="888" y="248" width="250" height="94" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="906" y="277" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">T2</text><text x="940" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">社区日常服务</text><text x="906" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">10:00-12:00</text><text x="906" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">设计观察窗 · 非已排期</text><text x="1149" y="302" font-size="19" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1158" y="248" width="250" height="94" rx="14" fill="#EEF7F5" stroke="#D8E3E7" stroke-width="1"/><text x="1176" y="277" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">T3</text><text x="1210" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">晚高峰与照护返程</text><text x="1176" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">17:00-20:00</text><text x="1176" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">设计观察窗 · 非已排期</text><text x="1419" y="302" font-size="19" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1428" y="248" width="250" height="94" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="1446" y="277" font-size="14" fill="#777AF2" font-weight="800" text-anchor="start">T4</text><text x="1480" y="277" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">夜间人工回退</text><text x="1446" y="310" font-size="22" fill="#29BFA8" font-weight="850" text-anchor="start">20:00-22:00</text><text x="1446" y="330" font-size="11" fill="#617487" font-weight="600" text-anchor="start">设计观察窗 · 非已排期</text><text x="618" y="390" font-size="14" fill="#617487" font-weight="600" text-anchor="start">每次记录日期、天气、计数角色、缺失区间和空间版本；不可比较的窗口不进入校准。</text><rect x="60" y="470" width="1100" height="520" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="508" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">03 · 七条证据流：模板已备，现场记录仍为 0</text><circle cx="112" cy="553" r="20" fill="#29BFA8"/><text x="112" y="559" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E1</text><text x="148" y="549" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">分组流量与请求</text><text x="148" y="572" font-size="12" fill="#617487" font-weight="550" text-anchor="start">两工作日 + 一压力窗；15 分钟分组计数</text><rect x="1008" y="537" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="560" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="589" x2="1128" y2="589" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="615" r="20" fill="#F17457"/><text x="112" y="621" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E2</text><text x="148" y="611" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">逐段无障碍走查</text><text x="148" y="634" font-size="12" fill="#617487" font-weight="550" text-anchor="start">日/夜普通链和无障碍链共同走查</text><rect x="1008" y="599" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="622" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="651" x2="1128" y2="651" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="677" r="20" fill="#F0C769"/><text x="112" y="683" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E3</text><text x="148" y="673" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">路缘与公共路线责任</text><text x="148" y="696" font-size="12" fill="#617487" font-weight="550" text-anchor="start">每个企业窗口有接收人和公共路线复原</text><rect x="1008" y="661" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="684" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="713" x2="1128" y2="713" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="739" r="20" fill="#777AF2"/><text x="112" y="745" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E4</text><text x="148" y="735" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">人工与公共交通回退</text><text x="148" y="758" font-size="12" fill="#617487" font-weight="550" text-anchor="start">每个时窗做断网/天气人工接管回放</text><rect x="1008" y="723" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="746" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="775" x2="1128" y2="775" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="801" r="20" fill="#29BFA8"/><text x="112" y="807" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E5</text><text x="148" y="797" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">数据最小化与保留</text><text x="148" y="820" font-size="12" fill="#617487" font-weight="550" text-anchor="start">字段先有目的、期限和删除责任</text><rect x="1008" y="785" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="808" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="837" x2="1128" y2="837" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="863" r="20" fill="#F17457"/><text x="112" y="869" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E6</text><text x="148" y="859" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">参与式阈值签收</text><text x="148" y="882" font-size="12" fill="#617487" font-weight="550" text-anchor="start">居民/照护者/无障碍/夜班可反对和更正</text><rect x="1008" y="847" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="870" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><line x1="148" y1="899" x2="1128" y2="899" stroke="#D8E3E7" stroke-width="1" /><circle cx="112" cy="925" r="20" fill="#F0C769"/><text x="112" y="931" font-size="12" fill="#FFFFFF" font-weight="850" text-anchor="middle">E7</text><text x="148" y="921" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">公开状态与结案</text><text x="148" y="944" font-size="12" fill="#617487" font-weight="550" text-anchor="start">公开状态板 + 纸面/电话更正入口</text><rect x="1008" y="909" width="112" height="34" rx="17" fill="#F5E9E7" stroke="none" stroke-width="0"/><text x="1064" y="932" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">0 RECORDS</text><text x="88" y="972" font-size="13" fill="#F17457" font-weight="700" text-anchor="start">UNKNOWN 不填零；任一分组被平均值遮蔽，立即阻断。</text><rect x="1180" y="470" width="560" height="540" rx="24" fill="#0B263D" stroke="none" stroke-width="0"/><text x="1208" y="508" font-size="16" fill="#77E7D3" font-weight="800" text-anchor="start">04 · RACI 与五道放行门</text><text x="1208" y="535" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="start">site and data steward</text><rect x="1578" y="513" width="130" height="34" rx="17" fill="#3C3037" stroke="none" stroke-width="0"/><text x="1643" y="536" font-