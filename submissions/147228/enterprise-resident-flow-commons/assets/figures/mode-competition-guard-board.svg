<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
<title id="title">共享接驳模式竞争护栏</title><desc id="desc">四个合成反事实情景比较公共交通指数、接驳份额、车公里比和最差群体可达性；封顶接驳通过，无封顶扩张与空中候选被阻断。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071B2D"/><stop offset="1" stop-color="#203E5E"/></linearGradient><style>.t{font:900 38px PingFang SC,Microsoft YaHei,Arial,sans-serif}.s{font:600 17px PingFang SC,Microsoft YaHei,Arial,sans-serif}.h{font:900 16px Arial,PingFang SC,sans-serif;letter-spacing:1px}.r{font:850 20px PingFang SC,Microsoft YaHei,Arial,sans-serif}.sm{font:600 13px PingFang SC,Microsoft YaHei,Arial,sans-serif}.v{font:900 21px Arial,sans-serif}.tiny{font:600 11px PingFang SC,Microsoft YaHei,Arial,sans-serif}</style></defs>
<rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1670" cy="90" r="300" fill="#63E6BE" opacity=".12"/><circle cx="100" cy="920" r="260" fill="#F38BA8" opacity=".10"/>
<text x="70" y="60" class="h" fill="#63E6BE">MOBILITY COMMONS / MODE COMPETITION GUARD / v1.0</text><text x="70" y="116" class="t" fill="#F4FBFF">共享接驳模式竞争护栏</text><text x="70" y="151" class="s" fill="#C8D8E5">先守轨道公交，再看接驳；只要挤出公共交通、抬高车公里或伤害最慢群体，就停在屏上</text>
<rect x="70" y="180" width="1660" height="78" rx="18" fill="#12283C" stroke="#F7C66A" stroke-width="2"/><text x="98" y="213" class="s" fill="#F4FBFF">合成反事实回放 · 3,122,000 agents reference · 现场测量 0 · 运营授权 0 · 满意度测量 0</text><text x="98" y="240" class="sm" fill="#B7D4DC">数值是护栏示例，不是海淀客流、车公里、满意度或运营结果；空中候选保持地面回退</text>
<text x="70" y="302" class="h" fill="#63E6BE">四道硬门 / HARD GUARDS</text>
<g><rect x="70" y="330" width="380" height="112" rx="18" fill="#EAF6F2"/><text x="98" y="366" class="h" fill="#173A43">TRANSIT INDEX</text><text x="98" y="405" class="v" fill="#0E8F83">≥ 0.95</text><text x="270" y="405" class="sm" fill="#48616C">公共交通不被挤出</text></g>
<g><rect x="470" y="330" width="380" height="112" rx="18" fill="#EAF6F2"/><text x="498" y="366" class="h" fill="#173A43">FEEDER SHARE</text><text x="498" y="405" class="v" fill="#0E8F83">≤ 8%</text><text x="670" y="405" class="sm" fill="#48616C">必须封顶</text></g>
<g><rect x="870" y="330" width="380" height="112" rx="18" fill="#EAF6F2"/><text x="898" y="366" class="h" fill="#173A43">VEHICLE-KM</text><text x="898" y="405" class="v" fill="#0E8F83">≤ 1.10×</text><text x="1074" y="405" class="sm" fill="#48616C">相对合成基线</text></g>
<g><rect x="1270" y="330" width="460" height="112" rx="18" fill="#EAF6F2"/><text x="1298" y="366" class="h" fill="#173A43">WORST-GROUP ACCESS</text><text x="1298" y="405" class="v" fill="#0E8F83">≥ −0.03</text><text x="1480" y="405" class="sm" fill="#48616C">最差群体差值</text></g>
<text x="70" y="490" class="h" fill="#63E6BE">情景比较 / COUNTERFACTUAL SCENARIOS</text>
<g><rect x="70" y="520" width="1660" height="76" rx="15" fill="#123A49" stroke="#2C5566"/><text x="98" y="566" class="r" fill="#F4FBFF">O0 轨道公交优先基线</text><text x="580" y="557" class="sm" fill="#A9C7D4">Transit 1.00</text><text x="780" y="557" class="sm" fill="#A9C7D4">接驳 0%</text><text x="970" y="557" class="sm" fill="#A9C7D4">车公里 1.00×</text><text x="1190" y="557" class="sm" fill="#A9C7D4">最差群体 0.00</text><rect x="1510" y="538" width="170" height="40" rx="20" fill="#63E6BE"/><text x="1595" y="564" text-anchor="middle" class="h" fill="#083B3B">REFERENCE</text></g>
<g><rect x="70" y="610" width="1660" height="76" rx="15" fill="#123A49" stroke="#63E6BE" stroke-width="2"/><text x="98" y="656" class="r" fill="#F4FBFF">O1 封顶式接驳</text><text x="580" y="647" class="sm" fill="#A9C7D4">Transit 0.98</text><text x="780" y="647" class="sm" fill="#A9C7D4">接驳 4%</text><text x="970" y="647" class="sm" fill="#A9C7D4">车公里 1.03×</text><text x="1190" y="647" class="sm" fill="#A9C7D4">最差群体 −0.01</text><rect x="1510" y="628" width="170" height="40" rx="20" fill="#63E6BE"/><text x="1595" y="654" text-anchor="middle" class="h" fill="#083B3B">PASS / REVIEW</text></g>
<g><rect x="70" y="700" width="1660" height="76" rx="15" fill="#3B2935" stroke="#F38BA8" stroke-width="2"/><text x="98" y="746" class="r" fill="#FFB6C2">O2 无封顶接驳扩张</text><text x="580" y="737" class="sm" fill="#F9D0D6">Transit 0.78</text><text x="780" y="737" class="sm" fill="#F9D0D6">接驳 18%</text><text x="970" y="737" class="sm" fill="#F9D0D6">车公里 1.26×</text><text x="1190" y="737" class="sm" fill="#F9D0D6">最差群体 −0.11</text><rect x="1510" y="718" width="170" height="40" rx="20" fill="#F38BA8"/><text x="1595" y="744" text-anchor="middle" class="h" fill="#4A1F32">BLOCKED</text></g>
<g><rect x="70" y="790" width="1660" height="76" rx="15" fill="#3B2935" stroke="#F38BA8" stroke-width="2"/><text x="98" y="836" class="r" fill="#FFB6C2">O3 地面优先的空中候选</text><text x="580" y="827" class="sm" fill="#F9D0D6">Transit 0.97</text><text x="780" y="827" class="sm" fill="#F9D0D6">接驳 3%</text><text x="970" y="827" class="sm" fill="#F9D0D6">车公里 1.02×</text><text x="1190" y="827" class="sm" fill="#F9D0D6">空中 agents 0</text><rect x="1510" y="808" width="170" height="40" rx="20" fill="#F38BA8"/><text x="1595" y="834" text-anchor="middle" class="h" fill="#4A1F32">BLOCKED</text></g>
<rect x="70" y="900" width="1660" height="52" rx="15" fill="#102B3B" stroke="#2C5566"/><text x="98" y="932" class="sm" fill="#F4FBFF">读法：O1 只是有封顶、有公共交通优先的条件候选；O2 因挤出与增量车公里闭锁；O3 没有空中运营授权，地面回退先行。</text>
</svg>
