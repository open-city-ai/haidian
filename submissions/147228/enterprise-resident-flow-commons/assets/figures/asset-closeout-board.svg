ll="#102d43">公交站候车界面</text><text x="720" y="541" class="sans small" fill="#55717d">工作日 / 夜间</text><text x="1170" y="541" class="sans small" fill="#55717d">bus_operations_role</text><rect x="1685" y="519" width="126" height="30" rx="15" fill="#fff0d8"/><text x="1748" y="540" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1860" y="541" class="sans small" fill="#55717d">电话确认 + 人工候车</text></g><g><line x1="95" y1="630" x2="2305" y2="630" stroke="#d6e6e7" stroke-width="1"/><text x="105" y="617" class="sans id" fill="#0d6f70">R-003</text><text x="220" y="617" class="sans row" fill="#102d43">受保护骑行链</text><text x="720" y="617" class="sans small" fill="#55717d">日常 / 雨雪后</text><text x="1170" y="617" class="sans small" fill="#55717d">field_maintenance_role</text><rect x="1685" y="595" width="126" height="30" rx="15" fill="#fff0d8"/><text x="1748" y="616" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1860" y="617" class="sans small" fill="#55717d">步行/公交替代，不强迫绕行</text></g><g><line x1="95" y1="706" x2="2305" y2="706" stroke="#d6e6e7" stroke-width="1"/><text x="105" y="693" class="sans id" fill="#0d6f70">R-004</text><text x="220" y="693" class="sans row" fill="#102d43">连续无障碍路线</text><text x="720" y="693" class="sans small" fill="#55717d">全天 / 照护时段</text><text x="1170" y="693" class="sans small" fill="#55717d">accessibility_service_role</text><rect x="1685" y="671" width="126" height="30" rx="15" fill="#fff0d8"/><text x="1748" y="692" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1860" y="693" class="sans small" fill="#55717d">人工带行 + 公共路线</text></g><g><line x1="95" y1="782" x2="2305" y2="782" stroke="#d6e6e7" stroke-width="1"/><text x="105" y="769" class="sans id" fill="#0d6f70">R-005</text><text x="220" y="769" class="sans row" fill="#102d43">时段路缘服务位</text><text x="720" y="769" class="sans small" fill="#55717d">接送 / 装卸窗口</text><text x="1170" y="769" class="sans small" fill="#55717d">curb_service_role</text><rect x="1685" y="747" width="126" height="30" rx="15" fill="#fff0d8"/><text x="1748" y="768" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1860" y="769" class="sans small" fill="#55717d">冻结预约 + 人工清场</text></g><g><line x1="95" y1="858" x2="2305" y2="858" stroke="#d6e6e7" stroke-width="1"/><text x="105" y="845" class="sans id" fill="#0d6f70">R-006</text><text x="220" y="845" class="sans row" fill="#102d43">企业接驳服务</text><text x="720" y="845" class="sans small" fill="#55717d">企业时窗 / 夜班</text><text x="1170" y="845" class="sans small" fill="#55717d">enterprise_mobility_coordinator_role</text><rect x="1685" y="823" width="126" height="30" rx="15" fill="#fff0d8"/><text x="1748" y="844" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1860" y="845" class="sans small" fill="#55717d">地铁/公交 + 人工确认</text></g><g><line x1="95" y1="934" x2="2305" y2="934" stroke="#d6e6e7" stroke-width="1"/><text x="105" y="921" class="sans id" fill="#0d6f70">R-007</text><text x="220" y="921" class="sans row" fill="#102d43">物流维护关口</text><text x="720" y="921" class="sans small" fill="#55717d">午间 / 低峰维护</text><text x="1170" y="921" class="sans small" fill="#55717d">logistics_and_maintenance_role</text><rect x="1685" y="899" width="126" height="30" rx="15" fill="#fff0d8"/><text x="1748" y="920" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1860" y="921" class="sans small" fill="#55717d">改时段 + 人工路缘协调</text></g><g><line x1="95" y1="1010" x2="2305" y2="1010" stroke="#d6e6e7" stroke-width="1"/><text x="105" y="997" class="sans id" fill="#0d6f70">R-008</text><text x="220" y="997" class="sans row" fill="#102d43">空中实验地面闸门</text><text x="720" y="997" class="sans small" fill="#55717d">仅获批测试窗口</text><text x="1170" y="997" class="sans small" fill="#55717d">professional_safety_review_role</text><rect x="1685" y="975" width="126" height="30" rx="15" fill="#fff0d8"/><text x="1748" y="996" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1860" y="997" class="sans small" fill="#55717d">保持地面系统，空中候选关闭</text></g><rect x="80" y="1118" width="2235" height="350" rx="30" fill="#102d43"/><text x="120" y="1160" class="sans" font-size="20" font-weight="900" fill="#70e1c3">闭合链 / CLOSEOUT CHAIN</text><text x="120" y="1200" class="sans small" fill="#d5e6e8">M-10 投诉—维修—复核不再只是叙述：回执必须以日期证据、人工回退和公共路线恢复为闭合条件</text><text x="120" y="1226" class="sans small" fill="#d5e6e8">。</text><g><rect x="120" y="1325" width="275" height="88" rx="44" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="257.5" y="1380" text-anchor="middle" class="sans chain" fill="#f4fbfb">发现</text><path d="M395 1370 H530 l-18 -12 M530 1370 l-18 12" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="605" y="1325" width="275" height="88" rx="44" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="742.5" y="1380" text-anchor="middle" class="sans chain" fill="#f4fbfb">派单</text><path d="M880 1370 H1015 l-18 -12 M1015 1370 l-18 12" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="1090" y="1325" width="275" height="88" rx="44" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="1227.5" y="1380" text-anchor="middle" class="sans chain" fill="#f4fbfb">维修/清场</text><path d="M1365 1370 H1500 l-18 -12 M1500 1370 l-18 12" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="1575" y="1325" width="275" height="88" rx="44" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="1712.5" y="1380" text-anchor="middle" class="sans chain" fill="#f4fbfb">无障碍复核</text><path d="M1850 1370 H1985 l-18 -12 M1985 1370 l-18 12" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="2060" y="1325" width="275" height="88" rx="44" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="2197.5" y="1380" text-anchor="middle" class="sans chain" fill="#f4fbfb">关闭或撤回</text></g><text x="120" y="1460" class="sans" font-size="15" font-weight="750" fill="#a