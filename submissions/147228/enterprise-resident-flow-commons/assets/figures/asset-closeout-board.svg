<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc"><title id="title">交通资产闭合回执：让投诉真正有去处</title><desc id="desc">8 类交通资产 × 5 道闭合门 · 这是空回执模板，不是现场工单. 五道门：责任与窗口 · 日期证据 · 无障碍/人工回退 · 公共路线与消防恢复 · 复核后关闭</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#17485a"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00111f" flood-opacity=".22"/></filter><style>.sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.title{font-size:54px;font-weight:900;letter-spacing:-2px}.muted{font-size:22px;font-weight:600}.row{font-size:22px;font-weight:850}.small{font-size:17px;font-weight:600}.id{font-size:20px;font-weight:900}.status{font-size:15px;font-weight:900}.chain{font-size:22px;font-weight:850}</style></defs><rect width="2400" height="1500" fill="url(#bg)"/><text x="80" y="75" class="sans" font-size="23" font-weight="900" letter-spacing="4" fill="#70e1c3">MOBILITY COMMONS / CLOSEOUT RECEIPTS / v1.0</text><text x="80" y="150" class="sans title" fill="#f4fbfb">交通资产闭合回执：让投诉真正有去处</text><text x="80" y="198" class="sans muted" fill="#a8c2c7">8 类交通资产 × 5 道闭合门 · 这是空回执模板，不是现场工单</text><rect x="1980" y="58" width="335" height="62" rx="31" fill="#3e2d2d" stroke="#ff9b8e" stroke-width="2"/><text x="2147" y="97" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#ffb1a5">SYNTHETIC / NOT FIELD LOG</text><g filter="url(#shadow)"><rect x="80" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="620" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="1160" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="1700" y="250" width="615" height="105" rx="20" fill="#143c4c"/></g><text x="110" y="290" class="sans" font-size="18" fill="#a8c2c7">RECEIPT TEMPLATES</text