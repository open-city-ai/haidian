<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">无障碍服务状态契约</title><desc id="desc">三条合成路线保持 UNKNOWN，只有在日期、责任、替代路线和人工交接证据齐备后才可发布 READY。过期自动回到 UNKNOWN，空中出行排除在分母之外。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081B2D"/><stop offset="1" stop-color="#174B54"/></linearGradient><style>.t{font:900 38px PingFang SC,Microsoft YaHei,Arial,sans-serif}.s{font:600 17px PingFang SC,Microsoft YaHei,Arial,sans-serif}.h{font:900 16px Arial,PingFang SC,sans-serif;letter-spacing:1px}.r{font:850 20px PingFang SC,Microsoft YaHei,Arial,sans-serif}.sm{font:600 14px PingFang SC,Microsoft YaHei,Arial,sans-serif}.v{font:900 23px Arial,sans-serif}</style></defs><rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1670" cy="90" r="290" fill="#63E6BE" opacity=".12"/><circle cx="120" cy="920" r="250" fill="#82A7FF" opacity=".12"/><text x="70" y="60" class="h" fill="#63E6BE">MOBILITY COMMONS / ACCESSIBLE SERVICE STATE / v1.0</text><text x="70" y="116" class="t" fill="#F4FBFF">无障碍服务状态契约</text><text x="70" y="151" class="s" fill="#B7D4DC">先锁状态、有效期、责任、替代路线和复验，再谈一条路“可用”</text><rect x="70" y="180" width="1660" height="76" rx="18" fill="#102D3D" stroke="#2A9D8F" stroke-width="2"/><text x="98" y="211" class="s" fill="#D8EEEE">当前离线屏查：3 条合成路线全部 UNKNOWN · 现场审计 0 · 运行授权 0 · AI 不能维修、放行或发布 READY</text><text x="98" y="239" class="sm" fill="#A9C7D4">过期确认 → UNKNOWN；关键障碍、没有替代路线或无人接管 → CLOSED / STOP</text><text x="70" y="300" class="h" fill="#63E6BE">三条公共服务路线</text><g><rect x="70" y="325" width="1040" height="112" rx="18" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="325" width="10" height="112" rx="5" fill="#F7C66A"/><text x="105" y="361" class="r" fill="#F4FBFF">A-01 轨道站 → 企业入口</text><text x="105" y="390" class="sm" fill="#B7D4DC">连续无障碍路线 · 日期审计 / 责任确认 / 替代路线 / 人工交接</text><rect x="900" y="352" width="165" height="42" rx="21" fill="#493B2A" stroke="#F7C66A"/><text x="982" y="380" text-anchor="middle" class="v" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="459" width="1040" height="112" rx="18" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="459" width="10" height="112" rx="5" fill="#82A7FF"/><text x="105" y="495" class="r" fill="#F4FBFF">A-02 社区日常服务</text><text x="105" y="524" class="sm" fill="#B7D4DC">人工等价路线 · 纸面/电话入口 · 人工交接 · 公开告知</text><rect x="900" y="486" width="165" height="42" rx="21" fill="#493B2A" stroke="#F7C66A"/><text x="982" y="514" text-anchor="middle" class="v" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="593" width="1040" height="112" rx="18" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="593" width="10" height="112" rx="5" fill="#F38BA8"/><text x="105" y="629" class="r" fill="#F4FBFF">A-03 夜班返程回退</text><text x="105" y="658" class="sm" fill="#B7D4DC">末班核验 · 可到达候车点 · 电话/纸面求助 · 安全交接</text><rect x="900" y="620" width="165" height="42" rx="21" fill="#493B2A" stroke="#F7C66A"/><text x="982" y="648" text-anchor="middle" class="v" fill="#F7C66A">UNKNOWN</text></g><text x="1190" y="300" class="h" fill="#63E6BE">发布闸门 / PUBLIC GATE</text><g><rect x="1190" y="335" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="371" class="sm" fill="#173A43">01 近期路线审计</text><text x="1660" y="371" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><g><rect x="1190" y="409" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="445" class="sm" fill="#173A43">02 责任角色确认</text><text x="1660" y="445" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><g><rect x="1190" y="483" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="519" class="sm" fill="#173A43">03 可用替代路线</text><text x="1660" y="519" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><g><rect x="1190" y="557" width="540" height="58" rx="14" fill="#EAF6F2"/><text x="1218" y="593" class="sm" fill="#173A43">04 人工接管与复验</text><text x="1660" y="593" text-anchor="end" class="v" fill="#173A43">REQUIRED</text></g><rect x="1190" y="655" width="540" height="94" rx="18" fill="#3B2935" stroke="#F38BA8"/><text x="1218" y="690" class="sm" fill="#F9B2BF">空中出行候选</text><text x="1218" y="724" class="v" fill="#FF9FAF">EXCLUDED FROM ACCESS DENOMINATOR</text><rect x="70" y="790" width="1660" height="126" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="96" y="833" class="h" fill="#63E6BE">状态链</text><text x="245" y="833" class="s" fill="#F4FBFF">UNKNOWN → AUDITED → READY</text><text x="720" y="833" class="s" fill="#F7C66A">READY → DEGRADED / CLOSED</text><text x="1190" y="833" class="s" fill="#B7D4DC">CLOSED → REPAIR → RECHECK → READY</text><text x="96" y="875" class="sm" fill="#A9C7D4">任何确认过期都回到 UNKNOWN。该图是结构回放，不是现场可达率、设备可用率、人员配置或公众满意度。</text></svg>
