<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">TWO CLOCKS: PROTECT PEOPLE FIRST, THEN RESTORE ASSETS</title><desc id="desc">3,122,000 synthetic agents × 5 stress cases × 3 response policies · aggregate readout only. A staged-recovery screen: the passenger clock tracks notice, handoff and arrival; the asset clock tracks ownership, repair, accessibility verification and public-route restoration. Not an incident forecast, field satisfaction or operating promise.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123E4A"/></linearGradient><style>.title{font:900 34px PingFang SC,Microsoft YaHei,Arial,sans-serif}.sub{font:600 15px PingFang SC,Microsoft YaHei,Arial,sans-serif}.row{font:850 18px PingFang SC,Microsoft YaHei,Arial,sans-serif}.small{font:550 13px PingFang SC,Microsoft YaHei,Arial,sans-serif}.value{font:900 21px Arial,sans-serif}.status{font:900 12px Arial,PingFang SC,sans-serif}.cardTitle{font:850 13px Arial,PingFang SC,sans-serif;letter-spacing:.4px}.cardValue{font:900 30px Arial,sans-serif}.smallDark{font:600 13px PingFang SC,Arial,sans-serif}.tinyDark{font:600 12px PingFang SC,Arial,sans-serif}.clockNo{font:900 15px Arial,sans-serif}.clockLabel{font:700 14px PingFang SC,Arial,sans-serif}</style></defs><rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1690" cy="20" r="300" fill="#2A9D8F" opacity=".14"/><circle cx="80" cy="960" r="260" fill="#5B8DEF" opacity=".12"/><text x="70" y="52" font-family="Arial" font-size="16" font-weight="900" letter-spacing="3" fill="#63E6BE">MOBILITY COMMONS / SERVICE CONTINUITY / v1.0</text><text x="70" y="101" class="title" fill="#F4FBFF">TWO CLOCKS: PROTECT PEOPLE FIRST, THEN RESTORE ASSETS</text><text x="70" y="130" class="sub" fill="#A9C7D4">3,122,000 synthetic agents × 5 stress cases × 3 response policies · aggregate readout only</text><rect x="70" y="153" width="1660" height="56" rx="14" fill="#0B2738" stroke="#2A9D8F"/><text x="92" y="188" class="sub" fill="#D9ECEC">A staged-recovery screen: the passenger clock tracks notice, handoff and arrival; the asset clock tracks ownership, repair, accessibility verification and public-route restoration. Not an incident forecast, field satisfaction or operating promise.</text><g><rect x="70" y="235" width="320" height="58" rx="14" fill="#143C4D"/><text x="92" y="259" class="small" fill="#A9C7D4">POPULATION REFERENCE</text><text x="92" y="282" font-size="25" font-weight="900" fill="#63E6BE">3,122,000</text><rect x="410" y="235" width="320" height="58" rx="14" fill="#143C4D"/><text x="432" y="259" class="small" fill="#A9C7D4">STRESS CASES</text><text x="432" y="282" font-size="25" font-weight="900" fill="#82A7FF">5</text><rect x="750" y="235" width="320" height="58" rx="14" fill="#143C4D"/><text x="772" y="259" class="small" fill="#A9C7D4">TWO CLOCKS</text><text x="772" y="282" font-size="25" font-weight="900" fill="#F7C66A">2</text><rect x="1090" y="235" width="640" height="58" rx="14" fill="#3B2935" stroke="#F38BA8"/><text x="1112" y="259" class="small" fill="#F9B2BF">AIR CANDIDATE</text><text x="1112" y="282" font-size="25" font-weight="900" fill="#FF9FAF">BLOCKED</text></g><text x="70" y="315" font-family="Arial" font-size="13" font-weight="900" letter-spacing="1.2" fill="#63E6BE">SELECTED RESPONSE × SCENARIO READOUT</text><g><rect x="70" y="287" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="287" width="7" height="62" rx="3" fill="#63E6BE"/><text x="95" y="315" class="row" fill="#F4FBFF">metro disruption</text><text x="420" y="315" class="small" fill="#B6D3DC">metro</text><text x="700" y="315" class="value" fill="#F4FBFF">99.1%</text><text x="815" y="315" class="small" fill="#B6D3DC">worst-group gap 0.2 pt</text><rect x="1000" y="298" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="319" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="369" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="369" width="7" height="62" rx="3" fill="#82A7FF"/><text x="95" y="397" class="row" fill="#F4FBFF">bus disruption</text><text x="420" y="397" class="small" fill="#B6D3DC">bus</text><text x="700" y="397" class="value" fill="#F4FBFF">99.4%</text><text x="815" y="397" class="small" fill="#B6D3DC">worst-group gap 0.1 pt</text><rect x="1000" y="380" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="401" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="451" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="451" width="7" height="62" rx="3" fill="#F7C66A"/><text x="95" y="479" class="row" fill="#F4FBFF">severe weather</text><text x="420" y="479" class="small" fill="#B6D3DC">bicycle + walking_wheelchair</text><text x="700" y="479" class="value" fill="#F4FBFF">98.8%</text><text x="815" y="479" class="small" fill="#B6D3DC">worst-group gap 0.3 pt</text><rect x="1000" y="462" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="483" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="533" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="533" width="7" height="62" rx="3" fill="#F38BA8"/><text x="95" y="561" class="row" fill="#F4FBFF">curb-service failure</text><text x="420" y="561" class="small" fill="#B6D3DC">car + enterprise_shuttle</text><text x="700" y="561" class="value" fill="#F4FBFF">99.4%</text><text x="815" y="561" class="small" fill="#B6D3DC">worst-group gap 0.1 pt</text><rect x="1000" y="544" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="565" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="615" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="615" width="7" height="62" rx="3" fill="#B9A6FF"/><text x="95" y="643" class="row" fill="#F4FBFF">cross-boundary return</text><text x="420" y="643" class="small" fill="#B6D3DC">metro + bus + enterprise_shuttle</text><text x="700" y="643" class="value" fill="#F4FBFF">99.2%</text><text x="815" y="643" class="small" fill="#B6D3DC">worst-group gap 0.2 pt</text><rect x="1000" y="626" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="647" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><text x="1180" y="315" font-family="Arial" font-size="13" font-weight="900" letter-spacing="1.2" fill="#63E6BE">THREE POLICY TRADE-OFFS</text><g><rect x="1180" y="285" width="550" height="94" rx="16" fill="#F2F8F8"/><rect x="1180" y="285" width="8" height="94" rx="4" fill="#82A7FF"/><text x="1208" y="312" class="cardTitle" fill="#54727D">P0 late notice</text><text x="1208" y="342" class="cardValue" fill="#102B3B">95.7%</text><text x="1368" y="341" class="smallDark" fill="#54727D">mean continuity</text><text x="1208" y="366" class="tinyDark" fill="#54727D">worst gap 1.4 pt · recovery P50 193 min</text></g><g><rect x="1180" y="403" width="550" height="94" rx="16" fill="#F2F8F8"/><rect x="1180" y="403" width="8" height="94" rx="4" fill="#F7C66A"/><text x="1208" y="430" class="cardTitle" fill="#54727D">P1 early notice + bounded shift</text><text x="1208" y="460" class="cardValue" fill="#102B3B">98.7%</text><text x="1368" y="459" class="smallDark" fill="#54727D">mean continuity</text><text x="1208" y="484" class="tinyDark" fill="#54727D">worst gap 0.5 pt · recovery P50 155 min</text></g><g><rect x="1180" y="521" width="550" height="94" rx="16" fill="#F2F8F8"/><rect x="1180" y="521" width="8" height="94" rx="4" fill="#F38BA8"/><text x="1208" y="548" class="cardTitle" fill="#54727D">P2 human first</text><text x="1208" y="578" class="cardValue" fill="#102B3B">99.2%</text><text x="1368" y="577" class="smallDark" fill="#54727D">mean continuity</text><text x="1208" y="602" class="tinyDark" fill="#54727D">worst gap 0.3 pt · recovery P50 134 min</text></g><rect x="70" y="745" width="1660" height="170" rx="20" fill="#102B3B" stroke="#2C5566"/><text x="95" y="785" font-family="Arial" font-size="13" font-weight="900" letter-spacing="1.2" fill="#63E6BE">RECOVERY CHAIN: PASSENGER SERVICE CLOCK + ASSET RECOVERY CLOCK</text><g><circle cx="140" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="140" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">1</text><text x="177" y="861" class="clockLabel" fill="#D9ECEC">notice</text><path d="M275 855 H325 l-12 -8 M325 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="405" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="405" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">2</text><text x="442" y="861" class="clockLabel" fill="#D9ECEC">disruption</text><path d="M540 855 H590 l-12 -8 M590 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="670" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="670" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">3</text><text x="707" y="861" class="clockLabel" fill="#D9ECEC">human handoff</text><path d="M805 855 H855 l-12 -8 M855 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="935" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="935" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">4</text><text x="972" y="861" class="clockLabel" fill="#D9ECEC">repair</text><path d="M1070 855 H1120 l-12 -8 M1120 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="1200" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="1200" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">5</text><text x="1237" y="861" class="clockLabel" fill="#D9ECEC">access verify</text><path d="M1335 855 H1385 l-12 -8 M1385 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="1465" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="1465" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">6</text><text x="1502" y="861" class="clockLabel" fill="#D9ECEC">route restored</text></g><text x="95" y="955" class="sub" fill="#A9C7D4">P2 is only preferred inside this synthetic screen; field use requires dated notice, fallback, repair, accessibility verification and public-route restoration evidence.</text></svg>
