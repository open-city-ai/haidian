<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc"><title id="title">AI MOBILITY RESOURCE PASSPORT: ACCOUNT FOR BURDEN BEFORE SCALE</title><desc id="desc">10 scenario cards × 7 resource classes · real measurements, approvals and operations remain UNKNOWN. Not energy, emissions, procurement quantities, field performance, permissions or public acceptance. Real fields remain unknown.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#17485a"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00111f" flood-opacity=".22"/></filter><style>.sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.label{font-size:27px;font-weight:850}.body{font-size:19px;font-weight:650}.tiny{font-size:15px;font-weight:600}.status{font-size:15px;font-weight:900}.flow{font-size:24px;font-weight:850}.title{font-size:54px;font-weight:900;letter-spacing:-2px}.muted{font-size:23px;font-weight:600}</style></defs><rect width="2400" height="1500" fill="url(#bg)"/><text x="80" y="75" class="sans" font-size="23" font-weight="900" letter-spacing="4" fill="#70e1c3">MOBILITY COMMONS / RESOURCE PASSPORT / v1.0</text><text x="80" y="150" class="sans title" fill="#f4fbfb">AI MOBILITY RESOURCE PASSPORT: ACCOUNT FOR BURDEN BEFORE SCALE</text><text x="80" y="198" class="sans muted" fill="#a8c2c7">10 scenario cards × 7 resource classes · real measurements, approvals and operations remain UNKNOWN</text><rect x="1965" y="58" width="350" height="62" rx="31" fill="#3e2d2d" stroke="#ff9b8e" stroke-width="2"/><text x="2140" y="97" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#ffb1a5">DESIGN LEDGER / NOT OPERATING</text><g filter="url(#shadow)"><rect x="80" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="620" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="1160" y="250" width="515" height="105" rx="20" fill="#143c4c"/><rect x="1700" y="250" width="615" height="105" rx="20" fill="#143c4c"/></g><text x="110" y="290" class="sans" font-size="18" fill="#a8c2c7">SCENARIO CARDS</text><text x="110" y="335" class="sans" font-size="39" font-weight="900" fill="#70e1c3">10</text><text x="650" y="290" class="sans" font-size="18" fill="#a8c2c7">RESOURCE CLASSES</text><text x="650" y="335" class="sans" font-size="39" font-weight="900" fill="#70e1c3">7</text><text x="1190" y="290" class="sans" font-size="18" fill="#a8c2c7">LOCAL MEASUREMENTS</text><text x="1190" y="335" class="sans" font-size="39" font-weight="900" fill="#ffd37a">0 / UNKNOWN</text><text x="1730" y="290" class="sans" font-size="18" fill="#a8c2c7">OPERATIONS AUTHORIZED</text><text x="1730" y="335" class="sans" font-size="39" font-weight="900" fill="#ff9b8e">NO · AIR BLOCKED</text><rect x="80" y="380" width="2235" height="810" rx="30" fill="#eaf4f5" filter="url(#shadow)"/><text x="120" y="430" class="sans" font-size="30" font-weight="900" fill="#102d43">Seven resources: every scenario card must carry the full ledger</text><g><rect x="80" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="116" cy="443" r="18" fill="#f0b45c"/><text x="116" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">1</text><text x="150" y="451" class="sans label" fill="#102d43">compute and network</text><rect x="150" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="209" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="108" y="537" class="sans body" fill="#29465a">Record model calls, network and edge de</text><text x="108" y="562" class="sans body" fill="#29465a">vices; a synthetic PASS cannot scale se</text><text x="108" y="587" class="sans body" fill="#29465a">rvice.</text><text x="108" y="610" class="sans tiny" fill="#6b8190">NEED: Dated calls, latency, devices and a </text><text x="108" y="630" class="sans tiny" fill="#6b8190">non-AI equivalent path by scenario.</text></g><g><rect x="655" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="691" cy="443" r="18" fill="#f0b45c"/><text x="691" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">2</text><text x="725" y="451" class="sans label" fill="#102d43">energy and fuel</text><rect x="725" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="784" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="683" y="537" class="sans body" fill="#29465a">Without a metering boundary, report no </text><text x="683" y="562" class="sans body" fill="#29465a">kWh, fuel, carbon or savings.</text><text x="683" y="610" class="sans tiny" fill="#6b8190">NEED: Dated accounting boundaries for rail</text><text x="683" y="630" class="sans tiny" fill="#6b8190">, bus, shuttle, car and equipment.</text></g><g><rect x="1230" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="1266" cy="443" r="18" fill="#f0b45c"/><text x="1266" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">3</text><text x="1300" y="451" class="sans label" fill="#102d43">physical devices</text><rect x="1300" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="1359" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1258" y="537" class="sans body" fill="#29465a">Devices must be removable, identified, </text><text x="1258" y="562" class="sans body" fill="#29465a">maintained and assigned a return path.</text><text x="1258" y="610" class="sans tiny" fill="#6b8190">NEED: Inventories for gates, signs, sensor</text><text x="1258" y="630" class="sans tiny" fill="#6b8190">s, charging and removable kit.</text></g><g><rect x="1805" y="405" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="1841" cy="443" r="18" fill="#f0b45c"/><text x="1841" y="450" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">4</text><text x="1875" y="451" class="sans label" fill="#102d43">data and privacy</text><rect x="1875" y="470" width="118" height="30" rx="15" fill="#fff0d8"/><text x="1934" y="491" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1833" y="537" class="sans body" fill="#29465a">Retain grouped aggregates only; publish</text><text x="1833" y="562" class="sans body" fill="#29465a"> purpose, retention, deletion and appea</text><text x="1833" y="587" class="sans body" fill="#29465a">l ownership.</text><text x="1833" y="610" class="sans tiny" fill="#6b8190">NEED: Consent, group thresholds, retention</text><text x="1833" y="630" class="sans tiny" fill="#6b8190">, deletion logs and human entry.</text></g><g><rect x="80" y="690" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="116" cy="728" r="18" fill="#f0b45c"/><text x="116" y="735" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">5</text><text x="150" y="736" class="sans label" fill="#102d43">human review</text><rect x="150" y="755" width="118" height="30" rx="15" fill="#fff0d8"/><text x="209" y="776" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="108" y="822" class="sans body" fill="#29465a">Every automated suggestion keeps a huma</text><text x="108" y="847" class="sans body" fill="#29465a">n, telephone and paper equivalent.</text><text x="108" y="895" class="sans tiny" fill="#6b8190">NEED: Review minutes, staffed roles, veto,</text><text x="108" y="915" class="sans tiny" fill="#6b8190"> appeal and accessibility records.</text></g><g><rect x="655" y="690" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="691" cy="728" r="18" fill="#f0b45c"/><text x="691" y="735" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">6</text><text x="725" y="736" class="sans label" fill="#102d43">supplier and maintenance</text><rect x="725" y="755" width="118" height="30" rx="15" fill="#fff0d8"/><text x="784" y="776" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="683" y="822" class="sans body" fill="#29465a">No expansion without a named operator, </text><text x="683" y="847" class="sans body" fill="#29465a">maintenance SLA and supplier exit path.</text><text x="683" y="895" class="sans tiny" fill="#6b8190">NEED: RACI, inspections, incident response</text><text x="683" y="915" class="sans tiny" fill="#6b8190">, vendor substitution and insurance interf</text><text x="683" y="935" class="sans tiny" fill="#6b8190">ace.</text></g><g><rect x="1230" y="690" width="525" height="245" rx="24" fill="#f7fbfc" stroke="#b9d5d8" stroke-width="2"/><circle cx="1266" cy="728" r="18" fill="#f0b45c"/><text x="1266" y="735" text-anchor="middle" class="sans" font-size="18" font-weight="900" fill="#102d43">7</text><text x="1300" y="736" class="sans label" fill="#102d43">failure and exit</text><rect x="1300" y="755" width="118" height="30" rx="15" fill="#fff0d8"/><text x="1359" y="776" text-anchor="middle" class="sans status" fill="#985f00">UNKNOWN</text><text x="1258" y="822" class="sans body" fill="#29465a">Define stop, rollback, removal, public-</text><text x="1258" y="847" class="sans body" fill="#29465a">route restoration and complaint closure</text><text x="1258" y="872" class="sans body" fill="#29465a"> first.</text><text x="1258" y="895" class="sans tiny" fill="#6b8190">NEED: Triggers, withdrawal labour, storage</text><text x="1258" y="915" class="sans tiny" fill="#6b8190">/removal, restoration and review records.</text></g><rect x="80" y="1208" width="2235" height="265" rx="30" fill="#102d43"/><text x="120" y="1250" class="sans" font-size="19" font-weight="900" fill="#70e1c3">WHAT IT ANSWERS</text><text x="120" y="1285" class="sans" font-size="17" fill="#d5e6e8">It places compute, devices, human work and exit responsibility beside the mobility model so synthetic scores cannot hide operational burden.</text><text x="120" y="1328" class="sans" font-size="19" font-weight="900" fill="#ffb1a5">WHAT IT DOES NOT ANSWER</text><text x="120" y="1363" class="sans" font-size="17" fill="#f4d8d4">Not energy, emissions, procurement quantities, field performance, permissions or public acceptance. Real fields remain unknown.</text><g><rect x="150" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="300" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">grouped demand</text><path d="M450 1280 H620 l-22 -14 M620 1280 l-22 14" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="720" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="870" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">AI choice</text><path d="M1020 1280 H1190 l-22 -14 M1190 1280 l-22 14" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="1290" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="1440" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">human/transit fallback</text><path d="M1590 1280 H1760 l-22 -14 M1760 1280 l-22 14" fill="none" stroke="#62ddc4" stroke-width="4"/></g><g><rect x="1860" y="1230" width="300" height="96" rx="48" fill="#14384d" stroke="#3c7b85" stroke-width="2"/><text x="2010" y="1288" text-anchor="middle" class="sans flow" fill="#f4fbfb">review and withdrawal</text></g><text x="120" y="1460" class="sans" font-size="15" font-weight="750" fill="#a8c2c7">FIVE NO-GO GATES: no equivalent human service · personal traces required · no maintenance exit · fire/access/quiet harm · failure and restoration unregistered</text></svg>
