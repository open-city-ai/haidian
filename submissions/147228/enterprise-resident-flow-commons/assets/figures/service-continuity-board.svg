<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">两只时钟：中断时先保住人，再修复资产</title><desc id="desc">3,122,000 个合成代理 × 5 个压力场景 × 3 个处置策略 · 只发布聚合回读. 这是一张 staged-recovery 屏查：乘客服务时钟看通知、接管和到达；资产恢复时钟看责任、维修、无障碍复核和公共路线恢复。不是事故预测、现场满意度或运营承诺。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123E4A"/></linearGradient><style>.title{font:900 34px PingFang SC,Microsoft YaHei,Arial,sans-serif}.sub{font:600 15px PingFang SC,Microsoft YaHei,Arial,sans-serif}.row{font:850 18px PingFang SC,Microsoft YaHei,Arial,sans-serif}.small{font:550 13px PingFang SC,Microsoft YaHei,Arial,sans-serif}.value{font:900 21px Arial,sans-serif}.status{font:900 12px Arial,PingFang SC,sans-serif}.cardTitle{font:850 13px Arial,PingFang SC,sans-serif;letter-spacing:.4px}.cardValue{font:900 30px Arial,sans-serif}.smallDark{font:600 13px PingFang SC,Arial,sans-serif}.tinyDark{font:600 12px PingFang SC,Arial,sans-serif}.clockNo{font:900 15px Arial,sans-serif}.clockLabel{font:700 14px PingFang SC,Arial,sans-serif}</style></defs><rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1690" cy="20" r="300" fill="#2A9D8F" opacity=".14"/><circle cx="80" cy="960" r="260" fill="#5B8DEF" opacity=".12"/><text x="70" y="52" font-family="Arial" font-size="16" font-weight="900" letter-spacing="3" fill="#63E6BE">MOBILITY COMMONS / SERVICE CONTINUITY / v1.0</text><text x="70" y="101" class="title" fill="#F4FBFF">两只时钟：中断时先保住人，再修复资产</text><text x="70" y="130" class="sub" fill="#A9C7D4">3,122,000 个合成代理 × 5 个压力场景 × 3 个处置策略 · 只发布聚合回读</text><rect x="70" y="153" width="1660" height="56" rx="14" fill="#0B2738" stroke="#2A9D8F"/><text x="92" y="188" class="sub" fill="#D9ECEC">这是一张 staged-recovery 屏查：乘客服务时钟看通知、接管和到达；资产恢复时钟看责任、维修、无障碍复核和公共路线恢复。不是事故预测、现场满意度或运营承诺。</text><g><rect x="70" y="235" width="320" height="58" rx="14" fill="#143C4D"/><text x="92" y="259" class="small" fill="#A9C7D4">人口规模参照</text><text x="92" y="282" font-size="25" font-weight="900" fill="#63E6BE">3,122,000</text><rect x="410" y="235" width="320" height="58" rx="14" fill="#143C4D"/><text x="432" y="259" class="small" fill="#A9C7D4">压力场景</text><text x="432" y="282" font-size="25" font-weight="900" fill="#82A7FF">5</text><rect x="750" y="235" width="320" height="58" rx="14" fill="#143C4D"/><text x="772" y="259" class="small" fill="#A9C7D4">双时钟</text><text x="772" y="282" font-size="25" font-weight="900" fill="#F7C66A">2</text><rect x="1090" y="235" width="640" height="58" rx="14" fill="#3B2935" stroke="#F38BA8"/><text x="1112" y="259" class="small" fill="#F9B2BF">空中候选</text><text x="1112" y="282" font-size="25" font-weight="900" fill="#FF9FAF">BLOCKED</text></g><text x="70" y="315" font-family="Arial" font-size="13" font-weight="900" letter-spacing="1.2" fill="#63E6BE">选定策略 × 场景回读</text><g><rect x="70" y="287" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="287" width="7" height="62" rx="3" fill="#63E6BE"/><text x="95" y="315" class="row" fill="#F4FBFF">地铁中断</text><text x="420" y="315" class="small" fill="#B6D3DC">地铁</text><text x="700" y="315" class="value" fill="#F4FBFF">99.1%</text><text x="815" y="315" class="small" fill="#B6D3DC">最差组差距 0.2 pt</text><rect x="1000" y="298" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="319" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="369" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="369" width="7" height="62" rx="3" fill="#82A7FF"/><text x="95" y="397" class="row" fill="#F4FBFF">公交中断</text><text x="420" y="397" class="small" fill="#B6D3DC">公交</text><text x="700" y="397" class="value" fill="#F4FBFF">99.4%</text><text x="815" y="397" class="small" fill="#B6D3DC">最差组差距 0.1 pt</text><rect x="1000" y="380" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="401" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="451" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="451" width="7" height="62" rx="3" fill="#F7C66A"/><text x="95" y="479" class="row" fill="#F4FBFF">强天气</text><text x="420" y="479" class="small" fill="#B6D3DC">自行车 + 步行/无障碍</text><text x="700" y="479" class="value" fill="#F4FBFF">98.8%</text><text x="815" y="479" class="small" fill="#B6D3DC">最差组差距 0.3 pt</text><rect x="1000" y="462" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="483" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="533" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="533" width="7" height="62" rx="3" fill="#F38BA8"/><text x="95" y="561" class="row" fill="#F4FBFF">路缘服务故障</text><text x="420" y="561" class="small" fill="#B6D3DC">汽车 + 企业接驳</text><text x="700" y="561" class="value" fill="#F4FBFF">99.4%</text><text x="815" y="561" class="small" fill="#B6D3DC">最差组差距 0.1 pt</text><rect x="1000" y="544" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="565" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><g><rect x="70" y="615" width="1050" height="62" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="615" width="7" height="62" rx="3" fill="#B9A6FF"/><text x="95" y="643" class="row" fill="#F4FBFF">跨边界返程</text><text x="420" y="643" class="small" fill="#B6D3DC">地铁 + 公交 + 企业接驳</text><text x="700" y="643" class="value" fill="#F4FBFF">99.2%</text><text x="815" y="643" class="small" fill="#B6D3DC">最差组差距 0.2 pt</text><rect x="1000" y="626" width="100" height="30" rx="15" fill="#154A43"/><text x="1050" y="647" text-anchor="middle" class="status" fill="#63E6BE">PASS</text></g><text x="1180" y="315" font-family="Arial" font-size="13" font-weight="900" letter-spacing="1.2" fill="#63E6BE">三种策略的效率—公平—恢复折中</text><g><rect x="1180" y="285" width="550" height="94" rx="16" fill="#F2F8F8"/><rect x="1180" y="285" width="8" height="94" rx="4" fill="#82A7FF"/><text x="1208" y="312" class="cardTitle" fill="#54727D">P0 晚通知</text><text x="1208" y="342" class="cardValue" fill="#102B3B">95.7%</text><text x="1368" y="341" class="smallDark" fill="#54727D">平均连续性</text><text x="1208" y="366" class="tinyDark" fill="#54727D">最差组差距 1.4 pt · 恢复 P50 193 min</text></g><g><rect x="1180" y="403" width="550" height="94" rx="16" fill="#F2F8F8"/><rect x="1180" y="403" width="8" height="94" rx="4" fill="#F7C66A"/><text x="1208" y="430" class="cardTitle" fill="#54727D">P1 提前通知 + 有界换乘</text><text x="1208" y="460" class="cardValue" fill="#102B3B">98.7%</text><text x="1368" y="459" class="smallDark" fill="#54727D">平均连续性</text><text x="1208" y="484" class="tinyDark" fill="#54727D">最差组差距 0.5 pt · 恢复 P50 155 min</text></g><g><rect x="1180" y="521" width="550" height="94" rx="16" fill="#F2F8F8"/><rect x="1180" y="521" width="8" height="94" rx="4" fill="#F38BA8"/><text x="1208" y="548" class="cardTitle" fill="#54727D">P2 人工优先</text><text x="1208" y="578" class="cardValue" fill="#102B3B">99.2%</text><text x="1368" y="577" class="smallDark" fill="#54727D">平均连续性</text><text x="1208" y="602" class="tinyDark" fill="#54727D">最差组差距 0.3 pt · 恢复 P50 134 min</text></g><rect x="70" y="745" width="1660" height="170" rx="20" fill="#102B3B" stroke="#2C5566"/><text x="95" y="785" font-family="Arial" font-size="13" font-weight="900" letter-spacing="1.2" fill="#63E6BE">恢复链：乘客服务时钟 + 资产恢复时钟</text><g><circle cx="140" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="140" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">1</text><text x="177" y="861" class="clockLabel" fill="#D9ECEC">通知</text><path d="M275 855 H325 l-12 -8 M325 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="405" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="405" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">2</text><text x="442" y="861" class="clockLabel" fill="#D9ECEC">中断</text><path d="M540 855 H590 l-12 -8 M590 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="670" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="670" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">3</text><text x="707" y="861" class="clockLabel" fill="#D9ECEC">人工接管</text><path d="M805 855 H855 l-12 -8 M855 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="935" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="935" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">4</text><text x="972" y="861" class="clockLabel" fill="#D9ECEC">维修</text><path d="M1070 855 H1120 l-12 -8 M1120 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="1200" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="1200" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">5</text><text x="1237" y="861" class="clockLabel" fill="#D9ECEC">无障碍复核</text><path d="M1335 855 H1385 l-12 -8 M1385 855 l-12 8" fill="none" stroke="#63E6BE" stroke-width="3"/></g><g><circle cx="1465" cy="855" r="24" fill="#163F4E" stroke="#63E6BE" stroke-width="2"/><text x="1465" y="862" text-anchor="middle" class="clockNo" fill="#F4FBFF">6</text><text x="1502" y="861" class="clockLabel" fill="#D9ECEC">公共路线恢复</text></g><text x="95" y="955" class="sub" fill="#A9C7D4">P2 只在合成屏查中优先；现场必须补齐有日期的通知、回退、维修、无障碍复核和公共路线恢复证据。</text></svg>
