<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">Mobility failure governance and appeal writeback</title><desc id="desc">Six mobility failure classes, five governance axes and four writeback carriers form an append-only protocol. There are currently no field incidents, appeals, corrections or retired releases; air mobility remains outside operational and incident denominators.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081B2D"/><stop offset="1" stop-color="#3C315B"/></linearGradient><style>.t{font:900 38px Arial,PingFang SC,sans-serif}.s{font:600 17px Arial,PingFang SC,sans-serif}.h{font:900 16px Arial,sans-serif;letter-spacing:1px}.r{font:850 19px Arial,PingFang SC,sans-serif}.sm{font:600 13px Arial,PingFang SC,sans-serif}.v{font:900 20px Arial,sans-serif}</style></defs><rect width="1800" height="1000" fill="url(#bg)"/><circle cx="1680" cy="90" r="300" fill="#F38BA8" opacity=".13"/><circle cx="80" cy="920" r="260" fill="#63E6BE" opacity=".11"/><text x="70" y="60" class="h" fill="#63E6BE">MOBILITY COMMONS / FAILURE GOVERNANCE / v1.0</text><text x="70" y="116" class="t" fill="#F4FBFF">Mobility Failure Governance and Appeal Writeback</text><text x="70" y="151" class="s" fill="#C8D8E5">A failure is not closed by saying “fixed”: state, group impact, human decision and retirement must remain traceable</text><rect x="70" y="180" width="1660" height="76" rx="18" fill="#12283C" stroke="#F38BA8" stroke-width="2"/><text x="98" y="211" class="s" fill="#F4FBFF">Offline protocol now: 0 field incidents · 0 appeals · 0 corrections · 0 retired releases · 0 operating authorizations</text><text x="98" y="239" class="sm" fill="#B7D4DC">A synthetic stress screen is not an incident; new versions append to prior versions; an appeal may pause release but never erases a record</text><text x="70" y="300" class="h" fill="#63E6BE">APPEND-ONLY STATE CHAIN</text><g><rect x="70" y="330" width="500" height="110" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="100" y="366" class="r" fill="#F4FBFF">DRAFT → REVIEW</text><text x="100" y="398" class="sm" fill="#B7D4DC">Write failure class, affected groups, evidence and owner</text><text x="100" y="422" class="sm" fill="#F7C66A">No date or human owner → UNKNOWN</text></g><path d="M570 385 H620" stroke="#63E6BE" stroke-width="5"/><path d="M610 373 l18 12 -18 12" fill="none" stroke="#63E6BE" stroke-width="5"/><g><rect x="70" y="468" width="500" height="110" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="100" y="504" class="r" fill="#F4FBFF">STOP → RECOVERY</text><text x="100" y="536" class="sm" fill="#B7D4DC">Human decision, fallback route, recovery owner and recheck window</text><text x="100" y="560" class="sm" fill="#F38BA8">No handoff → STOP; no fallback → do not release</text></g><path d="M570 523 H620" stroke="#63E6BE" stroke-width="5"/><path d="M610 511 l18 12 -18 12" fill="none" stroke="#63E6BE" stroke-width="5"/><g><rect x="70" y="606" width="500" height="110" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="100" y="642" class="r" fill="#F4FBFF">CORRECTION → RETIRED</text><text x="100" y="674" class="sm" fill="#B7D4DC">Keep prior_record_id, reason, appeal window and successor carrier</text><text x="100" y="698" class="sm" fill="#63E6BE">Retirement is not deletion: successor or ground fallback is required</text></g><text x="70" y="778" class="h" fill="#63E6BE">FOUR WRITEBACK CARRIERS</text><text x="70" y="814" class="sm" fill="#F4FBFF">SERVICE STATE　GROUP IMPACT　HUMAN DECISION　APPEAL AND RETIREMENT</text><text x="70" y="850" class="sm" fill="#A9C7D4">No personal traces · no real incident log · no claim that resident appeals have occurred</text><text x="650" y="300" class="h" fill="#63E6BE">SIX FAILURE CLASSES</text><g><rect x="650" y="330" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="674" y="365" class="r" fill="#F4FBFF">F-01 Metro / bus interruption</text><text x="674" y="397" class="sm" fill="#B7D4DC">Arrivals, care and external commute</text></g><g><rect x="990" y="330" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="1014" y="365" class="r" fill="#F4FBFF">F-02 Accessible break</text><text x="1014" y="397" class="sm" fill="#B7D4DC">Continuous route and handoff</text></g><g><rect x="650" y="450" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="674" y="485" class="r" fill="#F4FBFF">F-03 Curb / cycle conflict</text><text x="674" y="517" class="sm" fill="#B7D4DC">Loading, cycling and walking</text></g><g><rect x="990" y="450" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="1014" y="485" class="r" fill="#F4FBFF">F-04 Shuttle no-show</text><text x="1014" y="517" class="sm" fill="#B7D4DC">Night shift and enterprise arrival</text></g><g><rect x="650" y="570" width="320" height="100" rx="16" fill="#163447" stroke="#2C5566"/><text x="674" y="605" class="r" fill="#F4FBFF">F-05 Logistics failure</text><text x="674" y="637" class="sm" fill="#B7D4DC">Maintenance, residents and access</text></g><g><rect x="990" y="570" width="320" height="100" rx="16" fill="#3B2935" stroke="#F38BA8"/><text x="1014" y="605" class="r" fill="#FFB6C2">F-06 Air gate refusal</text><text x="1014" y="637" class="sm" fill="#F9D0D6">Ground fallback; outside operations denominator</text></g><text x="650" y="730" class="sm" fill="#A9C7D4">Each failure names affected groups, an observer role, a fallback and a stop condition.</text><text x="1350" y="300" class="h" fill="#63E6BE">FIVE GOVERNANCE AXES</text><g><rect x="1350" y="330" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="364" class="sm" fill="#173A43">SERVICE STATE</text><text x="1698" y="364" text-anchor="end" class="v" fill="#173A43">UNKNOWN</text></g><g><rect x="1350" y="398" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="432" class="sm" fill="#173A43">GROUP IMPACT</text><text x="1698" y="432" text-anchor="end" class="v" fill="#173A43">NOT ASSESSED</text></g><g><rect x="1350" y="466" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="500" class="sm" fill="#173A43">EVIDENCE</text><text x="1698" y="500" text-anchor="end" class="v" fill="#173A43">UNKNOWN</text></g><g><rect x="1350" y="534" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="568" class="sm" fill="#173A43">HUMAN DECISION</text><text x="1698" y="568" text-anchor="end" class="v" fill="#173A43">UNASSIGNED</text></g><g><rect x="1350" y="602" width="380" height="54" rx="13" fill="#EAF6F2"/><text x="1372" y="636" class="sm" fill="#173A43">RELEASE</text><text x="1698" y="636" text-anchor="end" class="v" fill="#173A43">DRAFT</text></g><rect x="1350" y="704" width="380" height="94" rx="18" fill="#3B2935" stroke="#F38BA8"/><text x="1374" y="740" class="sm" fill="#FFB6C2">Air mobility candidate</text><text x="1374" y="774" class="v" fill="#FF9FAF">BLOCKED / GROUND FALLBACK</text><rect x="650" y="790" width="1080" height="126" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="680" y="829" class="h" fill="#63E6BE">READING</text><text x="790" y="829" class="s" fill="#F4FBFF">This board proves that fields and refusal rules are reviewable offline; it does not prove incidents, completed appeals, service quality or satisfaction.</text><text x="680" y="868" class="sm" fill="#A9C7D4">Corrections append rather than overwrite; affected groups may submit an aggregate appeal, which pauses release for human review.</text></svg>
