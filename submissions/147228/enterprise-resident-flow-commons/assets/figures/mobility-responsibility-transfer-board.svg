<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc"><title id="title">交通责任移交屏</title><desc id="desc">八类交通接口统一检查接收角色、非 AI 等价路径、受影响群体、失败和撤回分母、停止证据与恢复证据。所有现实移交为零，空中候选被排除。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081B2D"/><stop offset="1" stop-color="#174B54"/></linearGradient><style>.title{font:900 38px PingFang SC,Microsoft YaHei,Arial,sans-serif}.sub{font:600 16px PingFang SC,Microsoft YaHei,Arial,sans-serif}.kicker{font:900 15px Arial,PingFang SC,sans-serif;letter-spacing:1px}.row{font:850 17px PingFang SC,Microsoft YaHei,Arial,sans-serif}.small{font:600 12px PingFang SC,Microsoft YaHei,Arial,sans-serif}.value{font:900 19px Arial,sans-serif}.cost{font:700 13px PingFang SC,Microsoft YaHei,Arial,sans-serif}</style></defs><rect width="1800" height="1050" fill="url(#bg)"/><circle cx="1650" cy="80" r="300" fill="#63E6BE" opacity=".12"/><circle cx="80" cy="980" r="260" fill="#82A7FF" opacity=".12"/><text x="70" y="58" class="kicker" fill="#63E6BE">MOBILITY COMMONS / RESPONSIBILITY TRANSFER / v1.0</text><text x="70" y="112" class="title" fill="#F4FBFF">交通责任移交屏</text><text x="70" y="147" class="sub" fill="#B7D4DC">服务先问谁接得住；拒收时责任留在发起方，失败和撤回仍进分母</text><rect x="70" y="178" width="1660" height="72" rx="18" fill="#102D3D" stroke="#2A9D8F" stroke-width="2"/><text x="98" y="209" class="sub" fill="#D8EEEE">8 类交通接口 · 7 类资源负担 · 0 项现场回执 · 0 项已接受移交 · 0 项运行授权</text><text x="98" y="234" class="small" fill="#A9C7D4">只有日期化接收、非 AI 等价路径、停止证据和恢复证据齐备，才可讨论移交；空中候选不进入移交分母</text><text x="70" y="293" class="kicker" fill="#63E6BE">八类交通接口 / EIGHT INTERFACES</text><g><rect x="70" y="315" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="315" width="8" height="60" rx="4" fill="#63E6BE"/><text x="98" y="343" class="row" fill="#F4FBFF">T-01 地铁站口换乘</text><text x="360" y="343" class="small" fill="#B7D4DC">rail/accessibility review</text><text x="760" y="343" class="small" fill="#B7D4DC">失败 + 撤回进分母</text><text x="1015" y="343" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="383" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="383" width="8" height="60" rx="4" fill="#82A7FF"/><text x="98" y="411" class="row" fill="#F4FBFF">T-02 公交站候车</text><text x="360" y="411" class="small" fill="#B7D4DC">bus operations</text><text x="760" y="411" class="small" fill="#B7D4DC">纸面 + 人工回退</text><text x="1015" y="411" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="451" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="451" width="8" height="60" rx="4" fill="#55D6BE"/><text x="98" y="479" class="row" fill="#F4FBFF">T-03 受保护骑行链</text><text x="360" y="479" class="small" fill="#B7D4DC">field maintenance</text><text x="760" y="479" class="small" fill="#B7D4DC">不以试点堵住公共路</text><text x="1015" y="479" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="519" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="519" width="8" height="60" rx="4" fill="#F7C66A"/><text x="98" y="547" class="row" fill="#F4FBFF">T-04 连续无障碍路线</text><text x="360" y="547" class="small" fill="#B7D4DC">accessibility service</text><text x="760" y="547" class="small" fill="#B7D4DC">人工等价路径</text><text x="1015" y="547" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="587" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="587" width="8" height="60" rx="4" fill="#F38BA8"/><text x="98" y="615" class="row" fill="#F4FBFF">T-05 时段路缘服务位</text><text x="360" y="615" class="small" fill="#B7D4DC">curb service</text><text x="760" y="615" class="small" fill="#B7D4DC">冻结预约 + 清场</text><text x="1015" y="615" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="655" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="655" width="8" height="60" rx="4" fill="#B9A6FF"/><text x="98" y="683" class="row" fill="#F4FBFF">T-06 企业接驳服务</text><text x="360" y="683" class="small" fill="#B7D4DC">enterprise mobility</text><text x="760" y="683" class="small" fill="#B7D4DC">地铁 / 公交回退</text><text x="1015" y="683" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="723" width="1050" height="60" rx="14" fill="#102B3B" stroke="#2C5566"/><rect x="70" y="723" width="8" height="60" rx="4" fill="#E8A66B"/><text x="98" y="751" class="row" fill="#F4FBFF">T-07 物流维护关口</text><text x="360" y="751" class="small" fill="#B7D4DC">logistics / maintenance</text><text x="760" y="751" class="small" fill="#B7D4DC">错时 + 人工协调</text><text x="1015" y="751" text-anchor="end" class="value" fill="#F7C66A">UNKNOWN</text></g><g><rect x="70" y="791" width="1050" height="60" rx="14" fill="#3B2935" stroke="#F38BA8"/><rect x="70" y="791" width="8" height="60" rx="4" fill="#F38BA8"/><text x="98" y="819" class="row" fill="#F4FBFF">T-08 空中实验地面闸门</text><text x="390" y="819" class="small" fill="#F9B2BF">professional safety review</text><text x="760" y="819" class="small" fill="#F9B2BF">地面系统保持开放</text><text x="1015" y="819" text-anchor="end" class="value" fill="#FF9FAF">BLOCKED</text></g><text x="1190" y="293" class="kicker" fill="#63E6BE">七类负担 / SEVEN BURDENS</text><g><rect x="1190" y="315" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="347" class="cost" fill="#173A43">01 空间与通行机会</text><text x="1698" y="347" text-anchor="end" class="value" fill="#173A43">4</text></g><g><rect x="1190" y="377" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="409" class="cost" fill="#173A43">02 能源、水与热负荷</text><text x="1698" y="409" text-anchor="end" class="value" fill="#173A43">2</text></g><g><rect x="1190" y="439" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="471" class="cost" fill="#173A43">03 设备、材料与替换</text><text x="1698" y="471" text-anchor="end" class="value" fill="#173A43">5</text></g><g><rect x="1190" y="501" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="533" class="cost" fill="#173A43">04 数据、算力与删除</text><text x="1698" y="533" text-anchor="end" class="value" fill="#173A43">2</text></g><g><rect x="1190" y="563" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="595" class="cost" fill="#173A43">05 劳动、维护与接管</text><text x="1698" y="595" text-anchor="end" class="value" fill="#173A43">8</text></g><g><rect x="1190" y="625" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="657" class="cost" fill="#173A43">06 公众注意、等待与申诉</text><text x="1698" y="657" text-anchor="end" class="value" fill="#173A43">8</text></g><g><rect x="1190" y="687" width="540" height="52" rx="12" fill="#EAF6F2"/><text x="1216" y="719" class="cost" fill="#173A43">07 公共资金与尾部责任</text><text x="1698" y="719" text-anchor="end" class="value" fill="#173A43">5</text></g><rect x="1190" y="765" width="540" height="86" rx="16" fill="#102B3B" stroke="#2C5566"/><text x="1216" y="798" class="small" fill="#63E6BE">移交链 / TRANSFER CHAIN</text><text x="1216" y="828" class="sub" fill="#F4FBFF">发起方 → 接收方 → 失败分母 → 恢复关单</text><rect x="70" y="900" width="1660" height="90" rx="18" fill="#102B3B" stroke="#2C5566"/><text x="98" y="936" class="kicker" fill="#63E6BE">拒收动作 / REFUSE TRANSFER</text><text x="98" y="968" class="sub" fill="#F4FBFF">责任留在发起方 · 冻结拟议服务 · 保留公共路线和人工/公共交通回退 · 不把失败隐藏在成功率之外</text></svg>
