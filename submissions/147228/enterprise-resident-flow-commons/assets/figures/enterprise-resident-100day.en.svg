<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#08121f"/>
  <rect x="42" y="34" width="1516" height="102" rx="18" fill="#12283d" stroke="#3e6d91" stroke-width="2"/>
  <text x="76" y="78" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="31" font-weight="700">Enterprise–Resident Reciprocity · 100-Day Delivery Contract</text>
  <text x="76" y="111" fill="#a8c5dc" font-family="Arial, sans-serif" font-size="17">enterprise request, resident return, human takeover, transit protection and appeal pause leave one time-ordered receipt</text>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="1012" y="58" width="120" height="40" rx="11" fill="#2b658f"/><text x="1033" y="84" fill="#f5f7fb">G0 package replay</text>
    <rect x="1144" y="58" width="160" height="40" rx="11" fill="#704351"/><text x="1164" y="84" fill="#f5f7fb">G1 field HOLD</text>
    <rect x="1316" y="58" width="220" height="40" rx="11" fill="#26364a"/><text x="1335" y="84" fill="#f5f7fb">0 authorisation · 0 field</text>
  </g>

  <text x="64" y="181" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="23" font-weight="700">Five windows deliver the resident return first</text>
  <line x1="100" y1="315" x2="1500" y2="315" stroke="#416d8e" stroke-width="6"/>
  <g font-family="Arial, sans-serif">
    <rect x="56" y="212" width="276" height="230" rx="16" fill="#142b40" stroke="#4f8db4" stroke-width="2"/>
    <text x="78" y="248" fill="#9dd8ff" font-size="19" font-weight="700">D00-07 · BASE</text>
    <text x="78" y="280" fill="#f5f7fb" font-size="18" font-weight="700">Register, do not book</text>
    <text x="78" y="312" fill="#c4d7e9" font-size="15">enterprise need register</text><text x="78" y="337" fill="#c4d7e9" font-size="15">ordinary, accessible, human route</text>
    <text x="78" y="372" fill="#f6c56c" font-size="15" font-weight="700">missing owner means stop</text><text x="78" y="402" fill="#9eb7cf" font-size="14">public status card · no personal trace</text>

    <rect x="366" y="212" width="276" height="230" rx="16" fill="#182e43" stroke="#4f8db4" stroke-width="2"/>
    <text x="388" y="248" fill="#9dd8ff" font-size="19" font-weight="700">D08-30 · PILOT</text>
    <text x="388" y="280" fill="#f5f7fb" font-size="18" font-weight="700">Test one window</text>
    <text x="388" y="312" fill="#c4d7e9" font-size="15">arrival or loading window</text><text x="388" y="337" fill="#c4d7e9" font-size="15">public route and receiver together</text>
    <text x="388" y="372" fill="#f6c56c" font-size="15" font-weight="700">pause if the slowest group worsens</text><text x="388" y="402" fill="#9eb7cf" font-size="14">walk audit · maintenance · fallback receipt</text>

    <rect x="676" y="212" width="276" height="230" rx="16" fill="#1a3045" stroke="#4f8db4" stroke-width="2"/>
    <text x="698" y="248" fill="#9dd8ff" font-size="19" font-weight="700">D31-60 · PILOT</text>
    <text x="698" y="280" fill="#f5f7fb" font-size="18" font-weight="700">Protect return during conflict</text>
    <text x="698" y="312" fill="#c4d7e9" font-size="15">outage, weather, missed transfer</text><text x="698" y="337" fill="#c4d7e9" font-size="15">clearance, repair and human appeal</text>
    <text x="698" y="372" fill="#f6c56c" font-size="15" font-weight="700">no receiver means freeze</text><text x="698" y="402" fill="#9eb7cf" font-size="14">handoff record · repair window</text>

    <rect x="986" y="212" width="276" height="230" rx="16" fill="#2c2634" stroke="#9b6b74" stroke-width="2"/>
    <text x="1008" y="248" fill="#ffcfb0" font-size="19" font-weight="700">D61-90 · BLACKOUT</text>
    <text x="1008" y="280" fill="#f5f7fb" font-size="18" font-weight="700">Stop digital layer, keep service</text>
    <text x="1008" y="312" fill="#e2cbd0" font-size="15">stop booking, clear assets</text><text x="1008" y="337" fill="#e2cbd0" font-size="15">rail, bus, walking and staffed route</text>
    <text x="1008" y="372" fill="#ffb271" font-size="15" font-weight="700">invisible return means no release</text><text x="1008" y="402" fill="#cbaeb7" font-size="14">trigger record · affected-group notice</text>

    <rect x="1296" y="212" width="248" height="230" rx="16" fill="#263142" stroke="#768ca5" stroke-width="2"/>
    <text x="1318" y="248" fill="#b9d8ee" font-size="19" font-weight="700">D91-100 · CLOSEOUT</text>
    <text x="1318" y="280" fill="#f5f7fb" font-size="18" font-weight="700">Publish the decision</text>
    <text x="1318" y="312" fill="#c4d7e9" font-size="15">continue, repair or withdraw</text><text x="1318" y="337" fill="#c4d7e9" font-size="15">complaint, maintenance debt, clearance</text>
    <text x="1318" y="372" fill="#f6c56c" font-size="15" font-weight="700">unclear reasons mean exit</text><text x="1318" y="402" fill="#9eb7cf" font-size="14">public closeout card · appealable</text>
  </g>

  <text x="64" y="500" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="23" font-weight="700">Three spatial nodes share one reciprocity ledger</text>
  <g font-family="Arial, sans-serif">
    <rect x="56" y="532" width="470" height="220" rx="16" fill="#10283a" stroke="#3b789a" stroke-width="2"/>
    <text x="82" y="570" fill="#9dd8ff" font-size="20" font-weight="700">Zhongzhiyuan · River Forecourt</text>
    <text x="82" y="608" fill="#f5f7fb" font-size="16">enterprise arrival / loading window</text><text x="82" y="636" fill="#c4d7e9" font-size="16">resident return: continuous walk, staffed wayfinding, clearance receipt</text>
    <text x="82" y="680" fill="#f6c56c" font-size="15" font-weight="700">gate: unresolved curb conflict or missing receiver stops the window</text>
    <text x="82" y="715" fill="#9eb7cf" font-size="14">concept prototype, not existing facility or right-of-way</text>

    <rect x="564" y="532" width="470" height="220" rx="16" fill="#122b3d" stroke="#3b789a" stroke-width="2"/>
    <text x="590" y="570" fill="#9dd8ff" font-size="20" font-weight="700">AI Origin · Care Loop</text>
    <text x="590" y="608" fill="#f5f7fb" font-size="16">enterprise shift / resident daily care</text><text x="590" y="636" fill="#c4d7e9" font-size="16">resident return: paper, phone, staffed service and appeal</text>
    <text x="590" y="680" fill="#f6c56c" font-size="15" font-weight="700">gate: displaced care route or ownerless appeal returns to BASE</text>
    <text x="590" y="715" fill="#9eb7cf" font-size="14">concept prototype, not staffing or service performance</text>

    <rect x="1072" y="532" width="472" height="220" rx="16" fill="#172b3e" stroke="#3b789a" stroke-width="2"/>
    <text x="1098" y="570" fill="#9dd8ff" font-size="20" font-weight="700">Dazhongsi · Four-Quadrant Hall</text>
    <text x="1098" y="608" fill="#f5f7fb" font-size="16">rail-to-curb handoff / event reset</text><text x="1098" y="636" fill="#c4d7e9" font-size="16">resident return: public crossing, transit backbone, return to normal</text>
    <text x="1098" y="680" fill="#f6c56c" font-size="15" font-weight="700">gate: weaker transit backbone or unclear reset stops expansion</text>
    <text x="1098" y="715" fill="#9eb7cf" font-size="14">concept prototype, not traffic organization or construction permit</text>
  </g>

  <rect x="56" y="795" width="1488" height="150" rx="16" fill="#0f1f31" stroke="#35536d" stroke-width="2"/>
  <text x="82" y="833" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Current boundary</text>
  <text x="82" y="872" fill="#c4d7e9" font-family="Arial, sans-serif" font-size="16">5 windows · 3 spatial nodes · 5 shared gates · 5 negative fixtures · 3 positive controls</text>
  <text x="82" y="906" fill="#f6c56c" font-family="Arial, sans-serif" font-size="16" font-weight="700">HOLD · authorisation 0 · field observations 0 · baseline unknown · result not_run · performance null</text>
  <text x="1055" y="872" fill="#9eb7cf" font-family="Arial, sans-serif" font-size="15">AI only organizes grouped demand and version notes</text>
  <text x="1055" y="906" fill="#9eb7cf" font-family="Arial, sans-serif" font-size="15">an enterprise request cannot buy public right-of-way</text>
</svg>
