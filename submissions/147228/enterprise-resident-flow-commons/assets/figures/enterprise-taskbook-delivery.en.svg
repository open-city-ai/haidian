<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><style>text{font-family:Arial,"PingFang SC","Hiragino Sans GB",sans-serif}</style><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#F5F1E9" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1800" height="150" rx="0" fill="#0B263D" stroke="none" stroke-width="0"/><text x="60" y="50" font-size="18" fill="#77E7D3" font-weight="800" text-anchor="start">FLOW COMMONS / TASKBOOK DELIVERY / v2.5</text><text x="60" y="100" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">Flow Commons Taskbook Delivery Atlas</text><rect x="1495" y="42" width="245" height="34" rx="17" fill="#4A3034" stroke="none" stroke-width="0"/><text x="1617.5" y="65" font-size="14" fill="#FFB29F" font-weight="800" text-anchor="middle">CONCEPT · NO COMMITMENT</text><text x="1740" y="124" font-size="15" fill="#A9C3D2" font-weight="600" text-anchor="end">six tasks · distinct visible outputs</text><rect x="60" y="180" width="420" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">01 · IDENTITY</text><text x="88" y="267" font-size="55" fill="#F17457" font-weight="900" text-anchor="start">F↔C</text><text x="215" y="252" font-size="21" fill="#0B263D" font-weight="800" text-anchor="start">Jing-Zhang Flow Commons</text><text x="215" y="283" font-size="17" fill="#617487" font-weight="600" text-anchor="start">enterprise request ↔ resident return</text><line x1="100" y1="318" x2="430" y2="318" stroke="#D8E3E7" stroke-width="2" /><text x="88" y="350" font-size="15" fill="#29BFA8" font-weight="800" text-anchor="start">mark logic</text><text x="88" y="380" font-size="17" fill="#173047" font-weight="600" text-anchor="start">Opposing directions share one release gate;</text><text x="88" y="407" font-size="17" fill="#173047" font-weight="600" text-anchor="start">no public return means no enterprise window.</text><circle cx="318" cy="363" r="11" fill="#46D7BC"/><circle cx="354" cy="363" r="11" fill="#F37A5A"/><circle cx="390" cy="363" r="11" fill="#F2C66D"/><circle cx="426" cy="363" r="11" fill="#102B46"/><rect x="500" y="180" width="1240" height="260" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="528" y="218" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">02 · 3 POSITIONS / 5 FUNCTIONS / 3 AREAS + 2 WINGS</text><rect x="528" y="242" width="370" height="66" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="546" y="269" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">P1</text><text x="582" y="269" font-size="17" fill="#0B263D" font-weight="800" text-anchor="start">Centennial Jing-Zhang culture belt</text><text x="546" y="294" font-size="12" fill="#617487" font-weight="500" text-anchor="start">Questions and repairs become a correctable archive</text><rect x="918" y="242" width="370" height="66" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="936" y="269" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">P2</text><text x="972" y="269" font-size="17" fill="#0B263D" font-weight="800" text-anchor="start">Urban AI life-experience belt</text><text x="936" y="294" font-size="12" fill="#617487" font-weight="500" text-anchor="start">Human entry, public return and exit stay visible</text><rect x="1308" y="242" width="370" height="66" rx="14" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="1326" y="269" font-size="14" fill="#F17457" font-weight="800" text-anchor="start">P3</text><text x="1362" y="269" font-size="17" fill="#0B263D" font-weight="800" text-anchor="start">AI convergence-innovation belt</text><text x="1326" y="294" font-size="12" fill="#617487" font-weight="500" text-anchor="start">Mobility, equity, responsibility and withdrawal gates</text><rect x="528" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="635.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F1 full-stack AI innovation</text><rect x="763" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="870.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F2 world-class AI ecosystem</text><rect x="998" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1105.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F3 AI+ scenario enablement</text><rect x="1233" y="326" width="215" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1340.5" y="349" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">F4 AI-enabled active city</text><rect x="1468" y="326" width="215" height="34" rx="17" fill="#EEEFFE" stroke="none" stroke-width="0"/><text x="1575.5" y="349" font-size="14" fill="#777AF2" font-weight="800" text-anchor="middle">F5 global AI-governance voice</text><rect x="528" y="374" width="215" height="45" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="635.5" y="402" font-size="11" fill="#FFFFFF" font-weight="750" text-anchor="middle">A1 Zhongzhiyuan</text><text x="753" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="763" y="374" width="215" height="45" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="870.5" y="402" font-size="11" fill="#FFFFFF" font-weight="750" text-anchor="middle">A2 AI Origin</text><text x="988" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="998" y="374" width="215" height="45" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="1105.5" y="402" font-size="11" fill="#FFFFFF" font-weight="750" text-anchor="middle">A3 Dazhongsi</text><text x="1223" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1233" y="374" width="215" height="45" rx="12" fill="#EEF0FF" stroke="none" stroke-width="0"/><text x="1340.5" y="402" font-size="11" fill="#777AF2" font-weight="750" text-anchor="middle">W1 Tech Service Wing</text><text x="1458" y="403" font-size="17" fill="#F17457" font-weight="800" text-anchor="middle">→</text><rect x="1468" y="374" width="215" height="45" rx="12" fill="#EEF0FF" stroke="none" stroke-width="0"/><text x="1575.5" y="402" font-size="11" fill="#777AF2" font-weight="750" text-anchor="middle">W2 Xiaoyuehe Wing</text><rect x="60" y="470" width="1040" height="430" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="88" y="508" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">03 · SIX GLOBAL MECHANISMS → EIGHT-RESOURCE LOOP</text><rect x="88" y="532" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="104" y="557" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-01</text><text x="172" y="557" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Helsinki AI Register</text><text x="104" y="582" font-size="12" fill="#617487" font-weight="550" text-anchor="start">mobility status card + complaint route</text><text x="104" y="601" font-size="10" fill="#F17457" font-weight="600" text-anchor="start">do not copy · register ≠ safety, access or consent</text><rect x="583" y="532" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="599" y="557" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-02</text><text x="667" y="557" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Amsterdam Algorithm Register</text><text x="599" y="582" font-size="12" fill="#617487" font-weight="550" text-anchor="start">human equivalent + appeal + stop state</text><text x="599" y="601" font-size="10" fill="#F17457" font-weight="600" text-anchor="start">do not copy · foreign register ≠ local compliance</text><rect x="88" y="622" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="104" y="647" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-03</text><text x="172" y="647" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Singapore AI Verify</text><text x="104" y="672" font-size="12" fill="#617487" font-weight="550" text-anchor="start">model card + takeover drill + withdrawal receipt</text><text x="104" y="691" font-size="10" fill="#F17457" font-weight="600" text-anchor="start">do not copy · test tool ≠ certification or permission</text><rect x="583" y="622" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="599" y="647" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-04</text><text x="667" y="647" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Decidim Barcelona</text><text x="599" y="672" font-size="12" fill="#617487" font-weight="550" text-anchor="start">paper + phone + walk-in feedback + readback</text><text x="599" y="691" font-size="10" fill="#F17457" font-weight="600" text-anchor="start">do not copy · digital access ≠ device-free access</text><rect x="88" y="712" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="104" y="737" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-05</text><text x="172" y="737" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">UK Algorithmic Transparency Recording Standard</text><text x="104" y="762" font-size="12" fill="#617487" font-weight="550" text-anchor="start">nine-field public preflight for every window</text><text x="104" y="781" font-size="10" fill="#F17457" font-weight="600" text-anchor="start">do not copy · UK standard ≠ Beijing statutory rule</text><rect x="583" y="712" width="470" height="76" rx="13" fill="#F7FAFA" stroke="#D8E3E7" stroke-width="1"/><text x="599" y="737" font-size="13" fill="#F17457" font-weight="800" text-anchor="start">CASE-06</text><text x="667" y="737" font-size="15" fill="#0B263D" font-weight="800" text-anchor="start">Seoul AI Foundation</text><text x="599" y="762" font-size="12" fill="#617487" font-weight="550" text-anchor="start">real problem → pilot receipt → follow-through</text><text x="599" y="781" font-size="10" fill="#F17457" font-weight="600" text-anchor="start">do not copy · no partnership, funding or equal mandate</text><text x="88" y="826" font-size="14" fill="#0B263D" font-weight="700" text-anchor="start">Eight resources exchange conditions, then return evidence:</text><rect x="88" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="143" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">LAND</text><rect x="210" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="265" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">SPACE</text><rect x="332" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="387" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">INDUSTRY</text><rect x="454" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="509" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">CAPITAL</text><rect x="576" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="631" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">TALENT</text><rect x="698" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="753" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">COMPUTE</text><rect x="820" y="844" width="110" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="875" y="867" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">DATA</text><rect x="942" y="844" width="110" height="34" rx="17" fill="#FFF2ED" stroke="none" stroke-width="0"/><text x="997" y="867" font-size="14" fill="#F17457" font-weight="800" text-anchor="middle">SCENARIO</text><text x="1070" y="888" font-size="12" fill="#617487" font-weight="600" text-anchor="end">no partnership / funding / investment claim</text><rect x="1120" y="470" width="620" height="430" rx="24" fill="#FFFFFF" stroke="#D8E3E7" stroke-width="2"/><text x="1148" y="508" font-size="16" fill="#29BFA8" font-weight="800" text-anchor="start">04 · LANDMARKS · CULTURE · ANNUAL OPS</text><circle cx="1172" cy="555" r="20" fill="#F17457"/><text x="1172" y="561" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">L1</text><text x="1205" y="551" font-size="16" fill="#0B263D" font-weight="800" text-anchor="start">Jing-Zhang Return Marker</text><text x="1205" y="575" font-size="11" fill="#617487" font-weight="550" text-anchor="start">one question · source · ordinary route · removal</text><circle cx="1172" cy="625" r="20" fill="#29BFA8"/><text x="1172" y="631" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">L2</text><text x="1205" y="621" font-size="16" fill="#0B263D" font-weight="800" text-anchor="start">Origin Contribution Exchange</text><text x="1205" y="645" font-size="11" fill="#617487" font-weight="550" text-anchor="start">developer contribution ↔ resident question + help</text><circle cx="1172" cy="695" r="20" fill="#777AF2"/><text x="1172" y="701" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">L3</text><text x="1205" y="691" font-size="16" fill="#0B263D" font-weight="800" text-anchor="start">Four-Quadrant Responsibility Beacon</text><text x="1205" y="715" font-size="11" fill="#617487" font-weight="550" text-anchor="start">capacity · return · owner · pause · restoration</text><rect x="1148" y="752" width="564" height="42" rx="12" fill="#123A50" stroke="none" stroke-width="0"/><text x="1430" y="779" font-size="16" fill="#FFFFFF" font-weight="750" text-anchor="middle">Every intelligent service owes the city a public way back.</text><rect x="1148" y="812" width="266" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1281" y="835" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">Q1 Open Questions Season</text><rect x="1430" y="812" width="266" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1563" y="835" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">Q2 Care and Commute Co-test Week</text><rect x="1148" y="851" width="266" height="34" rx="17" fill="#EAF5F3" stroke="none" stroke-width="0"/><text x="1281" y="874" font-size="14" fill="#29BFA8" font-weight="800" text-anchor="middle">Q3 Public Urban-Agent Review</text><rect x="1430" y="851" width="266" height="34" rx="17" fill="#EEEFFE" stroke="none" stroke-width="0"/><text x="1563" y="874" font-size="14" fill="#777AF2" font-weight="800" text-anchor="middle">Q4 Jing-Zhang Return Forum</text><text x="1148" y="895" font-size="12" fill="#617487" font-weight="600" text-anchor="start">Every season leaves a public artifact, stop rule and owned follow-up; attendance is not public benefit.</text><rect x="60" y="930" width="1680" height="200" rx="24" fill="#0B263D" stroke="none" stroke-width="0"/><text x="88" y="970" font-size="16" fill="#77E7D3" font-weight="800" text-anchor="start">05 · DISTINCT OUTPUT INDEX FOR SIX TASKS</text><rect x="88" y="992" width="252" height="104" rx="14" fill="#173F54" stroke="none" stroke-width="0"/><text x="104" y="1022" font-size="15" fill="#29BFA8" font-weight="850" text-anchor="start">agent.1</text><text x="104" y="1048" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• identity</text><text x="104" y="1066" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• positioning</text><text x="104" y="1084" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• functions</text><rect x="358" y="992" width="252" height="104" rx="14" fill="#143A50" stroke="none" stroke-width="0"/><text x="374" y="1022" font-size="15" fill="#29BFA8" font-weight="850" text-anchor="start">agent.2</text><text x="374" y="1048" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• global cases</text><text x="374" y="1066" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• ecosystem resources</text><text x="374" y="1084" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• industry-space mapping</text><rect x="628" y="992" width="252" height="104" rx="14" fill="#173F54" stroke="none" stroke-width="0"/><text x="644" y="1022" font-size="15" fill="#29BFA8" font-weight="850" text-anchor="start">agent.3</text><text x="644" y="1048" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• ten scenario cards</text><text x="644" y="1066" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• three industry tests</text><text x="644" y="1084" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• eight participant groups</text><rect x="898" y="992" width="252" height="104" rx="14" fill="#143A50" stroke="none" stroke-width="0"/><text x="914" y="1022" font-size="15" fill="#F0C769" font-weight="850" text-anchor="start">agent.4</text><text x="914" y="1048" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• three landmark interfaces</text><text x="914" y="1066" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• public-route rules</text><text x="914" y="1084" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• honor / correct / remove</text><rect x="1168" y="992" width="252" height="104" rx="14" fill="#173F54" stroke="none" stroke-width="0"/><text x="1184" y="1022" font-size="15" fill="#F0C769" font-weight="850" text-anchor="start">agent.5</text><text x="1184" y="1048" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• culture story</text><text x="1184" y="1066" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• five-layer signage</text><text x="1184" y="1084" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• international copy</text><rect x="1438" y="992" width="252" height="104" rx="14" fill="#143A50" stroke="none" stroke-width="0"/><text x="1454" y="1022" font-size="15" fill="#F0C769" font-weight="850" text-anchor="start">agent.6</text><text x="1454" y="1048" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• four-quarter operations</text><text x="1454" y="1066" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• developer-to-pilot path</text><text x="1454" y="1084" font-size="10" fill="#D4E1E8" font-weight="550" text-anchor="start">• review + retirement loop</text><text x="60" y="1170" font-size="13" fill="#617487" font-weight="600" text-anchor="start">Brand, collaboration, case transfer, landmarks and events are conceptual outputs, not partnership, investment, approval, construction or event commitments.</text><text x="1740" y="1170" font-size="13" fill="#617487" font-weight="700" text-anchor="end">147228 · PROVISIONAL · SOURCED CASES · HUMAN RELEASE</text></svg>
