<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">众智园企业到岗地面界面概念图</title>
  <desc id="desc">无尺度概念图，展示企业交通台、候车、装卸、骑行和连续无障碍路径如何共用一个可关闭的地面界面，不表达现状道路、容量或产权。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123B4A"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter>
    <style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.title{font-size:32px;font-weight:800;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.label{font-size:18px;font-weight:800;fill:#F5FBFF}.small{font-size:14px;fill:#B8D2DB}.note{font-size:16px;fill:#D9EEF1}.head{font-size:17px;font-weight:800;fill:#66E3CA}.tag{font-size:13px;font-weight:800;fill:#0B2738}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="58" class="sans" fill="#66E3CA" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / KEY AREA INTERFACE</text>
  <text x="70" y="105" class="sans title">众智园：企业到岗先落在地面</text>
  <text x="70" y="138" class="sans sub">无尺度概念界面 · 可撤回设施 · 不表达现状道路、站点容量或产权</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="1040" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect x="1150" y="180" width="380" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/></g>
  <rect x="120" y="235" width="930" height="250" rx="20" fill="#1D3444" stroke="#608396" stroke-width="2"/>
  <text x="155" y="280" class="sans label">企业首层与交通台</text><text x="155" y="310" class="sans small">企业入口、人工咨询和公共观察席相邻；上部体量不在本图中</text>
  <rect x="155" y="355" width="245" height="82" rx="14" fill="#5B8DEF"/><text x="277" y="390" text-anchor="middle" class="sans tag">企业交通台</text><text x="277" y="416" text-anchor="middle" class="sans tag">人工 / 电话 / 纸面</text>
  <rect x="445" y="355" width="240" height="82" rx="14" fill="#2A9D8F"/><text x="565" y="390" text-anchor="middle" class="sans tag">公共观察席</text><text x="565" y="416" text-anchor="middle" class="sans tag">看得到责任与回退</text>
  <rect x="730" y="355" width="270" height="82" rx="14" fill="#7C3AED"/><text x="865" y="390" text-anchor="middle" class="sans tag">可关闭测试后场</text><text x="865" y="416" text-anchor="middle" class="sans tag">不占公共慢行主链</text>
  <rect x="120" y="520" width="930" height="88" rx="18" fill="#172B38" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="155" y="573" class="sans label">连续公共步行 / 无障碍主链</text><text x="720" y="573" class="sans small">优先保持直达；受阻时转人工，不把人推入车道</text>
  <path d="M180 700 H1000" stroke="#66E3CA" stroke-width="22" stroke-linecap="round"/><circle cx="260" cy="700" r="14" fill="#fff"/><circle cx="560" cy="700" r="14" fill="#fff"/><circle cx="860" cy="700" r="14" fill="#fff"/>
  <rect x="155" y="750" width="230" height="70" rx="14" fill="#FBBF24"/><text x="270" y="792" text-anchor="middle" class="sans tag">骑行停放</text>
  <rect x="430" y="750" width="245" height="70" rx="14" fill="#5B8DEF"/><text x="552" y="792" text-anchor="middle" class="sans tag">班车候车窗口</text>
  <rect x="720" y="750" width="280" height="70" rx="14" fill="#E76F51"/><text x="860" y="792" text-anchor="middle" class="sans tag">装卸服务 / 消防净空</text>
  <path d="M270 437 V520 M565 437 V520 M865 437 V520" stroke="#9FC0CF" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1190" y="235" class="sans head">普通人先看到什么</text>
  <text x="1190" y="285" class="sans note">1 先到企业交通台</text><text x="1190" y="318" class="sans small">有人可以解释选择，数字入口不是唯一入口</text>
  <text x="1190" y="375" class="sans note">2 再走连续主链</text><text x="1190" y="408" class="sans small">班车、骑行和装卸不截断无障碍路线</text>
  <text x="1190" y="465" class="sans note">3 出现冲突就关闭窗口</text><text x="1190" y="498" class="sans small">人工或公共交通接管，未解决就停</text>
  <line x1="1190" y1="550" x2="1485" y2="550" stroke="#24556B"/>
  <text x="1190" y="605" class="sans head">本图仍不能证明</text>
  <text x="1190" y="650" class="sans small">现状建筑、产权、路权与班次</text><text x="1190" y="682" class="sans small">真实企业 OD、容量和消防净空</text><text x="1190" y="714" class="sans small">已获许可的班车或共享接驳</text>
  <rect x="1190" y="770" width="285" height="54" rx="14" fill="#3B1F3A" stroke="#F472B6" stroke-width="2"/><text x="1332" y="803" text-anchor="middle" class="sans" fill="#FBCFE8" font-size="15" font-weight="800">PROVISIONAL / 待现场核查</text>
  <text x="70" y="940" class="sans small">交通界面图 · 只画可撤回地面动作；正式方案需补测绘、权属、消防、OD、班次和公众参与证据</text>
</svg>
