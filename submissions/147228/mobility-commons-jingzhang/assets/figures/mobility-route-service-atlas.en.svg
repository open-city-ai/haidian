<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5f8f7"/>
  <rect width="1600" height="132" fill="#102744"/>
  <text x="72" y="58" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">One route, three accountable interfaces</text>
  <text x="72" y="101" fill="#b9d8d1" font-family="Arial, sans-serif" font-size="21">Provisional key areas · design-only · field observations 0 · authorization 0 · HOLD</text>
  <rect x="1280" y="36" width="230" height="62" rx="31" fill="#d96c4b"/>
  <text x="1395" y="76" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">DO NOT ADVANCE</text>
  <text x="72" y="177" fill="#102744" font-family="Arial, sans-serif" font-size="24" font-weight="700">Each key area receives one part of the responsibility</text>
  <text x="72" y="213" fill="#3d556b" font-family="Arial, sans-serif" font-size="19">Every interface names a denominator, a non-AI equivalent, a refusal rule and a fallback.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(72,266)"><rect width="440" height="290" rx="18" fill="#fff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="46" fill="#0e8f83" font-size="23" font-weight="700">01 Zhongzhiyuan</text><text x="24" y="86" fill="#102744" font-size="18">Enterprise arrival · loading · protected routes</text><text x="24" y="130" fill="#3d556b" font-size="17">Denominators: arrivals, curb minutes, protected minutes</text><text x="24" y="170" fill="#3d556b" font-size="17">Equivalent: paper register, marshal, public transport</text><text x="24" y="214" fill="#d96c4b" font-size="17" font-weight="700">Missing role/capacity → refuse booking</text><text x="24" y="250" fill="#d96c4b" font-size="17" font-weight="700">Fallback: freeze and return to staffed transit</text></g>
    <g transform="translate(580,266)"><rect width="440" height="290" rx="18" fill="#fff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="46" fill="#0e8f83" font-size="23" font-weight="700">02 AI Origin Community</text><text x="24" y="86" fill="#102744" font-size="18">Daily services · care · accessible continuity</text><text x="24" y="130" fill="#3d556b" font-size="17">Denominators: grouped attempts, route segments, staff windows</text><text x="24" y="170" fill="#3d556b" font-size="17">Equivalent: walk-in, telephone, paper, public transport</text><text x="24" y="214" fill="#d96c4b" font-size="17" font-weight="700">Basic access harmed → disable recommendation</text><text x="24" y="250" fill="#d96c4b" font-size="17" font-weight="700">Fallback: keep staffed route and return to P0</text></g>
    <g transform="translate(1088,266)"><rect width="440" height="290" rx="18" fill="#fff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="46" fill="#0e8f83" font-size="23" font-weight="700">03 Dazhongsi</text><text x="24" y="86" fill="#102744" font-size="18">Rail transfer · curb separation · event days</text><text x="24" y="130" fill="#3d556b" font-size="17">Denominators: headways, observations, crossings, curb minutes</text><text x="24" y="170" fill="#3d556b" font-size="17">Equivalent: timetable, staffed wayfinding, crossing information</text><text x="24" y="214" fill="#d96c4b" font-size="17" font-weight="700">Unknown capacity → remove feeder demand</text><text x="24" y="250" fill="#d96c4b" font-size="17" font-weight="700">Fallback: preserve public route, staffed wayfinding</text></g>
  </g>
  <line x1="300" y1="620" x2="1300" y2="620" stroke="#2d9c8f" stroke-width="8"/>
  <circle cx="300" cy="620" r="17" fill="#d96c4b"/><circle cx="800" cy="620" r="17" fill="#d96c4b"/><circle cx="1300" cy="620" r="17" fill="#d96c4b"/>
  <text x="72" y="690" fill="#102744" font-family="Arial, sans-serif" font-size="24" font-weight="700">Five gates before any reversible trial</text>
  <text x="72" y="735" fill="#3d556b" font-family="Arial, sans-serif" font-size="18">1 geometry version · 2 grouped demand and consent · 3 safety/accessibility audit · 4 receiving role and maintenance · 5 negative cases and equity review</text>
  <rect x="72" y="786" width="1456" height="110" rx="16" fill="#e6f2ef" stroke="#9bd6c9"/>
  <text x="98" y="830" fill="#102744" font-family="Arial, sans-serif" font-size="20" font-weight="700">Writeback</text>
  <text x="98" y="866" fill="#3d556b" font-family="Arial, sans-serif" font-size="18">event_id · node_id · group · mode · accepted/refused · fallback · responsible role · evidence version · next decision</text>
</svg>
