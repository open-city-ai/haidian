<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Dazhongsi rail-transfer and curb interface concept section</title>
  <desc id="desc">A scale-free concept section showing a rail-transfer interface, public ground floor, bicycle parking, an accessible walking path and time-windowed curb separation. It is not a station drawing.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123B4A"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter><style>.sans{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif}.title{font-size:32px;font-weight:800;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.label{font-size:18px;font-weight:800;fill:#F5FBFF}.small{font-size:14px;fill:#B8D2DB}.note{font-size:16px;fill:#D9EEF1}.head{font-size:17px;font-weight:800;fill:#66E3CA}.tag{font-size:13px;font-weight:800;fill:#0B2738}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="70" y="58" class="sans" fill="#66E3CA" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / KEY AREA INTERFACE</text><text x="70" y="105" class="sans title">Dazhongsi: separate transfer, parking and curb space</text><text x="70" y="138" class="sans sub">Scale-free concept section · rail-transfer interface pending review · not a station, line, flow or right-of-way plan</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="1040" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect x="1150" y="180" width="380" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/></g>
  <rect x="120" y="245" width="920" height="180" rx="18" fill="#1D3444" stroke="#608396" stroke-width="2"/><text x="155" y="285" class="sans label">Rail-transfer interface (concept relation, not a station plan)</text><rect x="165" y="330" width="260" height="58" rx="12" fill="#5B8DEF"/><text x="295" y="366" text-anchor="middle" class="sans tag">Rail arrival / bus link</text><rect x="460" y="330" width="250" height="58" rx="12" fill="#2A9D8F"/><text x="585" y="366" text-anchor="middle" class="sans tag">Public ground floor / human wayfinding</text><rect x="745" y="330" width="250" height="58" rx="12" fill="#7C3AED"/><text x="870" y="366" text-anchor="middle" class="sans tag">Removable event display</text>
  <path d="M165 500 H1000" stroke="#66E3CA" stroke-width="20" stroke-linecap="round"/><text x="165" y="470" class="sans label">Continuous walking / accessible crossing</text><text x="690" y="470" class="sans small">Daily route first; return to human or public transport when blocked</text><path d="M220 500 C290 560 330 630 400 700" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/><path d="M520 500 C580 560 620 630 690 700" fill="none" stroke="#5B8DEF" stroke-width="12" stroke-linecap="round"/><path d="M820 500 C850 560 910 630 960 700" fill="none" stroke="#E76F51" stroke-width="12" stroke-linecap="round"/>
  <rect x="145" y="745" width="250" height="70" rx="14" fill="#FBBF24"/><text x="270" y="787" text-anchor="middle" class="sans tag">Bicycle parking / transfer</text><rect x="445" y="745" width="250" height="70" rx="14" fill="#5B8DEF"/><text x="570" y="787" text-anchor="middle" class="sans tag">Human wayfinding / help</text><rect x="745" y="745" width="250" height="70" rx="14" fill="#E76F51"/><text x="870" y="787" text-anchor="middle" class="sans tag">Curb window / clear-out</text>
  <text x="1190" y="235" class="sans head">What a person sees first</text><text x="1190" y="285" class="sans note">1  A clear direction after rail arrival</text><text x="1190" y="318" class="sans small">Bus, walking, bicycle and human access do not compete for one path</text><text x="1190" y="375" class="sans note">2  Curb states change by time window</text><text x="1190" y="408" class="sans small">Loading, visitors and events cannot block the daily spine</text><text x="1190" y="465" class="sans note">3  Return to fallback when blocked</text><text x="1190" y="498" class="sans small">Station, accessibility and fire boundaries come first</text><line x1="1190" y1="550" x2="1485" y2="550" stroke="#24556B"/><text x="1190" y="605" class="sans head">This drawing does not prove</text><text x="1190" y="650" class="sans small">A specific entrance, line, flow or transfer capacity</text><text x="1190" y="682" class="sans small">Existing right-of-way, fire clearance or event control</text><text x="1190" y="714" class="sans small">Autonomous-driving or air-mobility permission</text><rect x="1190" y="770" width="285" height="54" rx="14" fill="#3B1F3A" stroke="#F472B6" stroke-width="2"/><text x="1332" y="803" text-anchor="middle" class="sans" fill="#FBCFE8" font-size="15" font-weight="800">PROVISIONAL / PROFESSIONAL REVIEW PENDING</text><text x="70" y="940" class="sans small">Interface section · removable ground separation only; entrance, curb, fire, accessibility and public-participation evidence remain required</text>
</svg>
