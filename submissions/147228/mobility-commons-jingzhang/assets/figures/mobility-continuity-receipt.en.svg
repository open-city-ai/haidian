<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5f8f7"/>
  <rect width="1600" height="142" fill="#102744"/>
  <text x="72" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Four Windows, One Ordinary Route</text>
  <text x="72" y="104" fill="#b9d8d1" font-family="Arial, sans-serif" font-size="21">Ordinary service first · AI for aggregation and explanation · authorization 0 · field observations 0 · not_run · HOLD</text>
  <rect x="1280" y="38" width="230" height="62" rx="31" fill="#d96c4b"/>
  <text x="1395" y="77" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">DO NOT ADVANCE</text>
  <text x="72" y="190" fill="#102744" font-family="Arial, sans-serif" font-size="25" font-weight="700">One door-to-door chain, four service windows that can refuse entry</text>
  <text x="72" y="228" fill="#3d556b" font-family="Arial, sans-serif" font-size="19">Each window keeps an ordinary route, a human equivalent, a named receiver and a stop action.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(72,278)"><rect width="348" height="330" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="44" fill="#0e8f83" font-size="22" font-weight="700">01 AM ARRIVAL</text><text x="24" y="76" fill="#3d556b" font-size="16">Zhongzhiyuan · weekday arrival</text><text x="24" y="122" fill="#102744" font-size="17">Ordinary: rail/bus + curb window</text><text x="24" y="158" fill="#3d556b" font-size="16">AI: grouped windows and conflicts</text><text x="24" y="194" fill="#3d556b" font-size="16">Equivalent: paper + staffed marshal</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">No receiver/capacity → refuse</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">Keep public route open</text></g>
    <g transform="translate(452,278)"><rect width="348" height="330" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="44" fill="#0e8f83" font-size="22" font-weight="700">02 DAILY ACCESS</text><text x="24" y="76" fill="#3d556b" font-size="16">AI Origin · daily services</text><text x="24" y="122" fill="#102744" font-size="17">Ordinary: walk-in/phone/paper desk</text><text x="24" y="158" fill="#3d556b" font-size="16">AI: grouped windows, no traces</text><text x="24" y="194" fill="#3d556b" font-size="16">Equivalent: continuous access route</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">Basic access harmed → disable</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">Return to P0 route review</text></g>
    <g transform="translate(832,278)"><rect width="348" height="330" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="44" fill="#0e8f83" font-size="22" font-weight="700">03 PM RETURN</text><text x="24" y="76" fill="#3d556b" font-size="16">Dazhongsi · evening transfer</text><text x="24" y="122" fill="#102744" font-size="17">Ordinary: timetable + staffed wayfinding</text><text x="24" y="158" fill="#3d556b" font-size="16">AI: explain conflict, suggest separation</text><text x="24" y="194" fill="#3d556b" font-size="16">Equivalent: public crossing information</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">Capacity unknown → remove feeder</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">Keep public route open</text></g>
    <g transform="translate(1212,278)"><rect width="316" height="330" rx="18" fill="#ffffff" stroke="#d96c4b" stroke-width="3"/><text x="24" y="44" fill="#d96c4b" font-size="22" font-weight="700">04 OUTAGE / WEATHER</text><text x="24" y="76" fill="#3d556b" font-size="16">Whole chain · disruption fallback</text><text x="24" y="122" fill="#102744" font-size="17">Ordinary: human/rail/bus/paper</text><text x="24" y="158" fill="#3d556b" font-size="16">AI: offline rollback checklist</text><text x="24" y="194" fill="#3d556b" font-size="16">Equivalent: staffed handoff + public info</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">No safe handoff → freeze</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">Keep HOLD</text></g>
  </g>
  <line x1="160" y1="674" x2="1440" y2="674" stroke="#2d9c8f" stroke-width="8"/>
  <circle cx="160" cy="674" r="17" fill="#d96c4b"/><circle cx="586" cy="674" r="17" fill="#d96c4b"/><circle cx="1014" cy="674" r="17" fill="#d96c4b"/><circle cx="1440" cy="674" r="17" fill="#d96c4b"/>
  <text x="72" y="746" fill="#102744" font-family="Arial, sans-serif" font-size="24" font-weight="700">Every handoff leaves the same receipt fields</text>
  <text x="72" y="786" fill="#3d556b" font-family="Arial, sans-serif" font-size="18">state · node · service group · ordinary route · AI used or not · human equivalent · receiver · accepted/refused · fallback · version · next decision</text>
  <rect x="72" y="824" width="1456" height="94" rx="16" fill="#e6f2ef" stroke="#9bd6c9"/>
  <text x="98" y="863" fill="#102744" font-family="Arial, sans-serif" font-size="19" font-weight="700">Current boundary</text>
  <text x="98" y="897" fill="#3d556b" font-family="Arial, sans-serif" font-size="17">4 states · 4 handoff seams · 4 positive controls · 6 negative HOLD fixtures · synthetic review only · no field result</text>
</svg>
