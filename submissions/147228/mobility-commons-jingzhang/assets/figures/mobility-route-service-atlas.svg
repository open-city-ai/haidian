<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5f8f7"/>
  <rect width="1600" height="132" fill="#102744"/>
  <text x="72" y="58" fill="#fff" font-family="Arial, 'PingFang SC', sans-serif" font-size="32" font-weight="700">一条到站—到家服务链 / One route, three accountable interfaces</text>
  <text x="72" y="101" fill="#b9d8d1" font-family="Arial, 'PingFang SC', sans-serif" font-size="21">Provisional key areas · design-only · field observations 0 · authorization 0 · HOLD</text>
  <rect x="1280" y="36" width="230" height="62" rx="31" fill="#d96c4b"/>
  <text x="1395" y="76" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">DO NOT ADVANCE</text>
  <text x="72" y="177" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">三处重点区各接住一段责任</text>
  <text x="72" y="213" fill="#3d556b" font-family="Arial, sans-serif" font-size="19">Each interface names a denominator, a non-AI equivalent, a refusal rule and a fallback.</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <g transform="translate(72,266)"><rect width="440" height="290" rx="18" fill="#fff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="46" fill="#0e8f83" font-size="23" font-weight="700">01 众智园 / Zhongzhiyuan</text><text x="24" y="86" fill="#102744" font-size="18">企业到岗 · 装卸 · 消防/无障碍净空</text><text x="24" y="130" fill="#3d556b" font-size="17">分母：到岗尝试、可用路缘分钟、受保护分钟</text><text x="24" y="170" fill="#3d556b" font-size="17">等价：纸面登记、现场引导、公共交通</text><text x="24" y="214" fill="#d96c4b" font-size="17" font-weight="700">缺责任或容量 → 拒收预约</text><text x="24" y="250" fill="#d96c4b" font-size="17" font-weight="700">回退：冻结并回到公共交通/人工台</text></g>
    <g transform="translate(580,266)"><rect width="440" height="290" rx="18" fill="#fff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="46" fill="#0e8f83" font-size="23" font-weight="700">02 AI 原点 / AI Origin</text><text x="24" y="86" fill="#102744" font-size="18">日常服务 · 照护 · 无障碍连续</text><text x="24" y="130" fill="#3d556b" font-size="17">分母：分组尝试、路线段、人工服务窗</text><text x="24" y="170" fill="#3d556b" font-size="17">等价：步入、电话、纸面、公共交通</text><text x="24" y="214" fill="#d96c4b" font-size="17" font-weight="700">基本通行受损 → 关闭推荐</text><text x="24" y="250" fill="#d96c4b" font-size="17" font-weight="700">回退：保持值守路线，回到 P0</text></g>
    <g transform="translate(1088,266)"><rect width="440" height="290" rx="18" fill="#fff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="46" fill="#0e8f83" font-size="23" font-weight="700">03 大钟寺 / Dazhongsi</text><text x="24" y="86" fill="#102744" font-size="18">轨道换乘 · 路缘分流 · 活动日</text><text x="24" y="130" fill="#3d556b" font-size="17">分母：班次、换乘观察窗、过街窗、路缘分钟</text><text x="24" y="170" fill="#3d556b" font-size="17">等价：时刻表、站内人工台、公共过街信息</text><text x="24" y="214" fill="#d96c4b" font-size="17" font-weight="700">容量未知 → 删除 feeder 需求</text><text x="24" y="250" fill="#d96c4b" font-size="17" font-weight="700">回退：保持公共路线，人工引导</text></g>
  </g>
  <line x1="300" y1="620" x2="1300" y2="620" stroke="#2d9c8f" stroke-width="8"/>
  <circle cx="300" cy="620" r="17" fill="#d96c4b"/><circle cx="800" cy="620" r="17" fill="#d96c4b"/><circle cx="1300" cy="620" r="17" fill="#d96c4b"/>
  <text x="72" y="690" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">五道门 / Five gates before any reversible trial</text>
  <text x="72" y="735" fill="#3d556b" font-family="Arial, sans-serif" font-size="18">1 geometry version · 2 grouped demand and consent · 3 safety/accessibility audit · 4 receiving role and maintenance · 5 negative cases and equity review</text>
  <rect x="72" y="786" width="1456" height="110" rx="16" fill="#e6f2ef" stroke="#9bd6c9"/>
  <text x="98" y="830" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">回写 / Writeback</text>
  <text x="98" y="866" fill="#3d556b" font-family="Arial, sans-serif" font-size="18">event_id · node_id · group · mode · accepted/refused · fallback · responsible role · evidence version · next decision</text>
</svg>
