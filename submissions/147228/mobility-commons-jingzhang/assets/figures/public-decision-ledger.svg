<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">企业—居民公共决策凭证</title>
  <desc id="desc">把公开问题、合成筛查、授权输入、责任人、决定状态、回复凭证和回退动作放进同一条可复核链。</desc>
  <defs><linearGradient id="bg-zh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#103C50"/></linearGradient><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:900;letter-spacing:1.1px;fill:#66E3CA}.title{font-size:31px;font-weight:900;fill:#F5FBFF}.sub{font-size:16px;fill:#B9D0D9}.step{font-size:15px;font-weight:900;fill:#E8F8FA}.step-sub{font-size:12px;fill:#9FC0CF}.card-title{font-size:16px;font-weight:900;fill:#F5FBFF}.mini-label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:900;letter-spacing:.5px;fill:#66E3CA}.mini-label.warm{fill:#F0A45D}.body{font-size:13px;fill:#DCEEF5}.footer{font-size:14px;fill:#A9C7D4}</style></defs>
  <rect width="1600" height="1240" fill="url(#bg-zh)"/><circle cx="1510" cy="80" r="270" fill="#1C7771" opacity=".16"/><circle cx="55" cy="1210" r="250" fill="#4D3A83" opacity=".14"/>
  <text x="60" y="52" class="sans eyebrow">MOBILITY COMMONS / PUBLIC DECISION LEDGER</text>
  <text x="60" y="99" class="sans title">企业—居民公共决策凭证</text><text x="60" y="130" class="sans sub">把公开问题、合成筛查、授权输入、责任人、决定状态、回复凭证和回退动作放进同一条可复核链。</text>
  <g transform="translate(60 178)"><rect width="1480" height="104" rx="24" fill="#071A2B" stroke="#2A9D8F" stroke-width="2"/>
    <g transform="translate(35 22)"><circle cx="16" cy="26" r="16" fill="#27C499"/><text x="45" y="21" class="sans step">公开问题</text><text x="45" y="43" class="sans step-sub">先登记问题和边界</text></g>
    <path d="M400 48H500" stroke="#66E3CA" stroke-width="3"/><path d="M495 42l10 6-10 6" fill="none" stroke="#66E3CA" stroke-width="3"/>
    <g transform="translate(535 22)"><circle cx="16" cy="26" r="16" fill="#5EA7FF"/><text x="45" y="21" class="sans step">合成筛查</text><text x="45" y="43" class="sans step-sub">合成读数只标出待查冲突</text></g>
    <path d="M900 48H1000" stroke="#66E3CA" stroke-width="3"/><path d="M995 42l10 6-10 6" fill="none" stroke="#66E3CA" stroke-width="3"/>
    <g transform="translate(1035 22)"><circle cx="16" cy="26" r="16" fill="#F0A45D"/><text x="45" y="21" class="sans step">授权输入</text><text x="45" y="43" class="sans step-sub">有权组织才可开启窗口</text></g>
    <path d="M1360 48H1430" stroke="#66E3CA" stroke-width="3"/><path d="M1425 42l10 6-10 6" fill="none" stroke="#66E3CA" stroke-width="3"/>
    <text x="1340" y="91" class="sans step-sub">回复凭证</text>
  </g>
  <text x="60" y="316" class="sans eyebrow">八个问题入口 · 统一字段 · 同一条暂停回退链</text>
  <g transform="translate(60 330)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#27C499"/>
      <text x="28" y="31" class="eyebrow">PDL-01 · 居民日常</text>
      <text x="28" y="57" class="card-title">上学、就医、买菜和回家是否被换乘打断</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成路网只标出可能的换乘断点和替代链，不代表居民经历</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">有日期的分时方式计数、服务点走查、投诉原始登记和授权的聚合意见</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">日常路线被截断、没有人工等价入口或回复凭证缺失 · 普通地铁公交、现</text><text x="118" y="174" class="body">场人工台、电话和纸面路线</text>
    </g><g transform="translate(820 330)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#F0A45D"/>
      <text x="28" y="31" class="eyebrow">PDL-02 · 照护与无障碍</text>
      <text x="28" y="57" class="card-title">照护链和连续无障碍路线能否保持</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成压力屏只找路线和资源冲突，不代替无障碍走查</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">连续路线走查、坡道电梯状态、照护者参与、人工接管记录和独立复核</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">任一路线被占用、替代入口不可达或没有独立复核 · 人工引导、普通公共</text><text x="118" y="174" class="body">交通和可撤回的临时设施</text>
    </g><g transform="translate(60 548)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#27C499"/>
      <text x="28" y="31" class="eyebrow">PDL-03 · 企业到岗</text>
      <text x="28" y="57" class="card-title">企业时窗会不会把公共空间挤给车辆</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成场景只比较时窗冲突和可回退顺序，不证明班车减车</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">企业聚合需求、班次与车辆类别、路权文件、消防净空核验和员工方式计数</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">企业优先挤占居民、无障碍或消防通道，或没有保证回家回退 · 普通公共</text><text x="118" y="174" class="body">交通、人工调度、撤销路缘预约和保证回家安排</text>
    </g><g transform="translate(820 548)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#F0A45D"/>
      <text x="28" y="31" class="eyebrow">PDL-04 · 路缘与维护</text>
      <text x="28" y="57" class="card-title">谁负责冲突、清场和投诉回复</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成路缘账本只检查责任和冲突字段是否齐全，不证明有人值守</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">路缘所有权、维护班表、事件日志、投诉工单、响应时间和升级路径</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">责任人、清场路径或投诉状态缺失 · 关闭自动预约，改由人工台和普通公</text><text x="118" y="174" class="body">共交通处理</text>
    </g><g transform="translate(60 766)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#27C499"/>
      <text x="28" y="31" class="eyebrow">PDL-05 · 轨道换乘</text>
      <text x="28" y="57" class="card-title">站口、公交、自行车和步行能否连起来</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成网络只检查换乘链和断点，不代表站点客流或可达性绩效</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">站点分时客流、换乘计数、自行车停放、无障碍走查和公共导视核验</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">换乘链断开、人工入口消失或应急路线不连续 · 普通轨道公交和站内人工</text><text x="118" y="174" class="body">指引</text>
    </g><g transform="translate(820 766)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#F0A45D"/>
      <text x="28" y="31" class="eyebrow">PDL-06 · 对外通勤</text>
      <text x="28" y="57" class="card-title">跨边界通勤的成本和回退是否可见</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成 OD 只用于比较路径、时段和模式冲突，不代表真实外来流量</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">脱敏聚合 OD、边界外运营协同、停车换乘计数和跨责任回复凭证</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">外部数据不可解释、责任跨界无人接管或地面回退不连续 · 普通轨道公交</text><text x="118" y="174" class="body">、公开换乘信息和人工服务台</text>
    </g><g transform="translate(60 984)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#27C499"/>
      <text x="28" y="31" class="eyebrow">PDL-07 · 夜班与晚归</text>
      <text x="28" y="57" class="card-title">晚归时段是否仍有安全和人工选择</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成时段屏只提示末班和回退冲突，不证明夜间安全</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">夜间分时走查、末班信息、照明和求助点核验、事件和投诉台账</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">末班后没有公共或人工等价路线，或安全事件没有升级路径 · 普通公共交</text><text x="118" y="174" class="body">通、现场人工台、电话求助和撤回自动服务</text>
    </g><g transform="translate(820 984)">
      <rect width="700" height="184" rx="22" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="10" height="184" rx="5" fill="#F0A45D"/>
      <text x="28" y="31" class="eyebrow">PDL-08 · 物流、应急与维护</text>
      <text x="28" y="57" class="card-title">装卸、消防和维护能否不互相堵住</text>
      <text x="28" y="84" class="mini-label">合成筛查</text>
      <text x="118" y="84" class="body">合成路缘压力只暴露冲突组合和撤回顺序，不证明现场可用</text>
      <text x="28" y="120" class="mini-label">授权输入</text>
      <text x="118" y="120" class="body">车辆类别、装卸时窗、消防与应急核验、维护班表和事件回放</text>
      <text x="28" y="156" class="mini-label warm">暂停</text>
      <text x="118" y="156" class="body">消防净空、居民通行或维护回退任一项不能保证 · 关闭试验时窗，改用普</text><text x="118" y="174" class="body">通公共路线和人工现场调度</text>
    </g>
  <rect x="60" y="1160" width="1480" height="52" rx="16" fill="#071A2B" stroke="#24556B"/><text x="88" y="1192" class="sans footer">只证明决策链可回读。现场状态、居民意见、公众支持、运营许可和交通绩效仍为未知。</text><text x="1510" y="1192" text-anchor="end" class="sans footer">当前状态 仅设计</text>
</svg>