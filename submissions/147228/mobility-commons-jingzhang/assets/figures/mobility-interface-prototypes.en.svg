    <text x="40" y="326" font-family="Arial, sans-serif" font-size="14" fill="#475569">AI explains conflict; separation stays reversible</text>
    <text x="40" y="352" font-family="Arial, sans-serif" font-size="14" fill="#475569">1:500 station, crossing and curb interface</text>
    <text x="40" y="376" font-family="Arial, sans-serif" font-size="14" fill="#475569">1:50 staffed wayfinding and clearance receipt</text>
    <rect x="40" y="408" width="372" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="56" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">STOP: public route is displaced</text>
    <text x="56" y="457" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">or crossing / curb evidence is missing</text>
