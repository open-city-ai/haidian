  <text x="72" y="58" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#a7f3d0">MOBILITY COMMONS / 147228</text>
  <text x="72" y="104" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Three spatial interfaces: 1:500 concept → 1:50 handoff detail</text>
  <text x="1320" y="64" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0">DESIGN ONLY</text>
  <text x="1320" y="91" font-family="Arial, sans-serif" font-size="14" fill="#c7d2fe">HOLD · 0 authorization · 0 field observations</text>
  <rect x="72" y="158" width="1456" height="54" rx="10" fill="#e0f2fe" stroke="#93c5fd"/>
  <text x="98" y="192" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">Shared rule: ordinary or staffed routes come first; each interface has a receiver, dated evidence and a return path; no field dimensions or construction claim.</text>

