    <text x="40" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#10233f">Accessible line · service desk · care pause</text>
    <text x="40" y="298" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#10233f">Appeal writes back to the receipt</text>
    <text x="40" y="326" font-family="Arial, sans-serif" font-size="14" fill="#475569">AI groups windows; access never needs an app</text>
    <text x="40" y="352" font-family="Arial, sans-serif" font-size="14" fill="#475569">1:500 daily route and human-node continuity</text>
    <text x="40" y="376" font-family="Arial, sans-serif" font-size="14" fill="#475569">1:50 ramp, service desk and carer handoff</text>
    <rect x="40" y="408" width="372" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="56" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">STOP: no human equivalent or access breaks</text>
    <text x="56" y="457" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">or the privacy boundary is unclear</text>
  </g>

