    <text x="40" y="298" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#10233f">Loading stays at HOLD</text>
    <text x="40" y="326" font-family="Arial, sans-serif" font-size="14" fill="#475569">AI explains grouped time-window conflicts only</text>
    <text x="40" y="352" font-family="Arial, sans-serif" font-size="14" fill="#475569">1:500 entry, curb and fire-access relation</text>
    <text x="40" y="376" font-family="Arial, sans-serif" font-size="14" fill="#475569">1:50 staffed takeover and clearance receipt</text>
    <rect x="40" y="408" width="372" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
