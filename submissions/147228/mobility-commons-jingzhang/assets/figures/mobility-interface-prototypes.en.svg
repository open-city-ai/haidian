  <rect x="72" y="790" width="1456" height="122" rx="16" fill="#10233f"/>
  <text x="100" y="825" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#a7f3d0">SHARED REVIEW GATES</text>
  <text x="100" y="862" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">G1 ordinary route first · G2 receiver and maintenance role · G3 dated observation and public receipt · G4 stop and return to staffed/public transport</text>
  <text x="100" y="890" font-family="Arial, sans-serif" font-size="14" fill="#c7d2fe">These are design references, not a current map; official boundary, dimensions, ownership, permits, field performance and construction conclusions await professional review.</text>
