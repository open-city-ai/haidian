<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Jing-Zhang Mobility Commons: first 168 hours to first 12 weeks</title>
  <desc id="desc">Four delivery windows, three spatial interfaces, four fallback states and a default HOLD decision.</desc>
  <rect width="1600" height="1000" fill="#f6f8fb"/>
  <rect x="50" y="42" width="1500" height="100" rx="22" fill="#102744"/>
  <text x="90" y="88" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700">JING-ZHANG MOBILITY COMMONS | 168 HOURS → 12 WEEKS</text>
  <text x="90" y="122" fill="#b8d9e8" font-family="sans-serif" font-size="18">Three spatial interfaces · ordinary service first · accountable handoffs · withdrawal before expansion</text>
  <rect x="50" y="172" width="1500" height="68" rx="16" fill="#ffe6e1" stroke="#d85a4a" stroke-width="2"/>
  <text x="84" y="202" fill="#8f2f28" font-family="sans-serif" font-size="19" font-weight="700">BOUNDARY</text>
  <text x="290" y="202" fill="#8f2f28" font-family="sans-serif" font-size="18">Design sequence, not operating authorization; authorization=0 · field observations=0 · baseline=unknown · performance=null · default HOLD</text>
  <g font-family="sans-serif">
    <rect x="50" y="280" width="355" height="300" rx="18" fill="#e5f4f1" stroke="#0e8f83" stroke-width="3"/>
    <text x="78" y="322" fill="#0e5d58" font-size="25" font-weight="700">H0 | 0–24h</text><text x="78" y="354" fill="#102744" font-size="20" font-weight="700">Make ordinary access work</text>
    <text x="78" y="392" fill="#23364d" font-size="17">• BASE: no account or model</text><text x="78" y="421" fill="#23364d" font-size="17">• human, phone and paper entry</text><text x="78" y="450" fill="#23364d" font-size="17">• name receiver and complaint route</text><text x="78" y="479" fill="#23364d" font-size="17">• stop digital layer if missing</text>
    <rect x="78" y="515" width="280" height="38" rx="10" fill="#fff"/><text x="92" y="540" fill="#0e5d58" font-size="15">Artifact: ordinary route card</text>
    <rect x="425" y="280" width="355" height="300" rx="18" fill="#e9f0fb" stroke="#3f6fae" stroke-width="3"/>
    <text x="453" y="322" fill="#284d83" font-size="25" font-weight="700">H1 | 24–72h</text><text x="453" y="354" fill="#102744" font-size="20" font-weight="700">Register space and evidence gaps</text>
    <text x="453" y="392" fill="#23364d" font-size="17">• Zhongzhiyuan / AI Origin / Dazhongsi</text><text x="453" y="421" fill="#23364d" font-size="17">• route, curb and handoff denominators</text><text x="453" y="450" fill="#23364d" font-size="17">• grouped demand, no personal traces</text><text x="453" y="479" fill="#23364d" font-size="17">• no receiver/fallback means HOLD</text>
    <rect x="453" y="515" width="280" height="38" rx="10" fill="#fff"/><text x="467" y="540" fill="#284d83" font-size="15">Artifact: route-service atlas</text>
    <rect x="800" y="280" width="355" height="300" rx="18" fill="#fff4df" stroke="#d08a2c" stroke-width="3"/>
    <text x="828" y="322" fill="#8a5b16" font-size="25" font-weight="700">H2 | 72–120h</text><text x="828" y="354" fill="#102744" font-size="20" font-weight="700">Rehearse failure offline</text>
    <text x="828" y="392" fill="#23364d" font-size="17">• BOOST / BLACKOUT / BEQUEST</text><text x="828" y="421" fill="#23364d" font-size="17">• outage, weather, conflict, refusal</text><text x="828" y="450" fill="#23364d" font-size="17">• human/public-transport takeover</text><text x="828" y="479" fill="#23364d" font-size="17">• negative cases are not outcomes</text>
    <rect x="828" y="515" width="280" height="38" rx="10" fill="#fff"/><text x="842" y="540" fill="#8a5b16" font-size="15">Artifact: handoff + withdrawal</text>
    <rect x="1175" y="280" width="375" height="300" rx="18" fill="#f0e9f7" stroke="#8055a6" stroke-width="3"/>
    <text x="1203" y="322" fill="#5d3b7c" font-size="25" font-weight="700">H3 | 120–168h</text><text x="1203" y="354" fill="#102744" font-size="20" font-weight="700">Review, then HOLD if needed</text>
    <text x="1203" y="392" fill="#23364d" font-size="17">• exact tree and evidence map</text><text x="1203" y="421" fill="#23364d" font-size="17">• maintenance / complaint / withdrawal</text><text x="1203" y="450" fill="#23364d" font-size="17">• synthetic is never field outcome</text><text x="1203" y="479" fill="#23364d" font-size="17">• missing evidence: repair or do not release</text>
    <rect x="1203" y="515" width="310" height="38" rx="10" fill="#fff"/><text x="1217" y="540" fill="#5d3b7c" font-size="15">Artifact: review / archive receipt</text>
  </g>
  <text x="50" y="636" fill="#102744" font-family="sans-serif" font-size="23" font-weight="700">THREE SPATIAL INTERFACES</text>
  <g font-family="sans-serif" font-size="17">
    <rect x="50" y="665" width="465" height="115" rx="16" fill="#fff" stroke="#b4c4d4"/><text x="75" y="703" fill="#102744" font-size="21" font-weight="700">Zhongzhiyuan</text><text x="75" y="733" fill="#3c536d">Arrival, loading, fire and accessible curb</text><text x="75" y="760" fill="#d85a4a">Refuse: no clearing owner / protected route</text>
    <rect x="535" y="665" width="465" height="115" rx="16" fill="#fff" stroke="#b4c4d4"/><text x="560" y="703" fill="#102744" font-size="21" font-weight="700">AI Origin Community</text><text x="560" y="733" fill="#3c536d">Daily access, care, wheelchair and human desk</text><text x="560" y="760" fill="#d85a4a">Refuse: digital layer becomes basic access</text>
    <rect x="1020" y="665" width="530" height="115" rx="16" fill="#fff" stroke="#b4c4d4"/><text x="1045" y="703" fill="#102744" font-size="21" font-weight="700">Dazhongsi</text><text x="1045" y="733" fill="#3c536d">Rail transfer, wayfinding and timed curb</text><text x="1045" y="760" fill="#d85a4a">Refuse: capacity / transfer / fire unknown</text>
  </g>
  <rect x="50" y="835" width="1500" height="95" rx="18" fill="#102744"/><text x="84" y="875" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">FIRST 12 WEEKS</text><text x="84" y="906" fill="#b8d9e8" font-family="sans-serif" font-size="17">W01–02 boundary/consent → W03–04 route audit → W05–07 ordinary parity → W08–09 failure tabletop → W10–11 independent review → W12 HOLD / repair / withdraw</text>
</svg>
