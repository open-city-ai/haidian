<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <rect width="1600" height="1120" fill="#f4f7fb"/>
  <rect width="1600" height="132" fill="#10233f"/>
  <text x="72" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#a7f3d0">MOBILITY COMMONS / 147228</text>
  <text x="72" y="104" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">系统级空间选项：先守地面公共基线</text>
  <text x="1270" y="58" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0">CONCEPT ONLY</text>
  <text x="1270" y="88" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe">HOLD · 0 授权 · 0 现场观察</text>
  <rect x="72" y="158" width="1456" height="62" rx="12" fill="#e0f2fe" stroke="#93c5fd"/>
  <text x="100" y="197" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a5f">裁决顺序：硬门 → 普通/无障碍路线 → 最弱群体 → 可逆交接；任何本地证据缺失都回到 HOLD。</text>

  <g transform="translate(72 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#b42318"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fee4e2">S0 / REJECT</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">无协同高峰</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">车流、装卸、接驳争同一路缘</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">✕ 普通路线未保护</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">✕ 无人工接管人</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">✕ 最弱群体不可单独回读</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9f1239">回到 P0</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#9f1239">先清点权属、路权和公共路线</text>
  </g>

  <g transform="translate(432 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#0e8f83"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d1fae5">S1 / ADVANCE TO DESIGN REVIEW</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">地面优先多方式</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">轨道 + 公交 + 步行/无障碍</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ 普通服务先可见</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ 三处接口有接收人</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ 路缘状态可暂停、可撤回</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">只进入专业设计复核</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#047857">不等于授权、施工或运营</text>
  </g>

  <g transform="translate(792 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#b7791f"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fef3c7">S2 / REVISE</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">空中优先接驳</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">先有地面基线，再谈实验</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ 空域、保险、天气未核</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ 需保留地面回退</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ 不得挤占公共换乘</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">回到 S1</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#92400e">空中层只能是条件附加项</text>
  </g>

  <g transform="translate(1152 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#2563eb"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#dbeafe">S3 / REVISE</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">极端天气地面回退</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">雨雪、断网、维护的默认层</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ 轨道/公交/人工仍在线</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ 需路线与值守回读</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ 纸面/电话撤回通知</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">回到 S1</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">作为地面系统的韧性层</text>
  </g>

  <rect x="72" y="646" width="1424" height="174" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
  <text x="100" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#10233f">五级尺度：同一裁决从走廊到交接，不把图板当施工尺寸</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="190" cy="735" r="27" fill="#0e8f83"/><text x="190" y="742" font-size="16" font-weight="800" fill="#fff">1</text><text x="190" y="783" font-size="15" font-weight="700" fill="#10233f">1:5000</text><text x="190" y="805" font-size="13" fill="#475569">走廊选项</text>
    <path d="M225 735 H405" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="450" cy="735" r="27" fill="#0e8f83"/><text x="450" y="742" font-size="16" font-weight="800" fill="#fff">2</text><text x="450" y="783" font-size="15" font-weight="700" fill="#10233f">1:2000</text><text x="450" y="805" font-size="13" fill="#475569">重点区网络</text>
    <path d="M485 735 H665" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="710" cy="735" r="27" fill="#0e8f83"/><text x="710" y="742" font-size="16" font-weight="800" fill="#fff">3</text><text x="710" y="783" font-size="15" font-weight="700" fill="#10233f">1:500</text><text x="710" y="805" font-size="13" fill="#475569">节点关系</text>
    <path d="M745 735 H925" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="970" cy="735" r="27" fill="#0e8f83"/><text x="970" y="742" font-size="16" font-weight="800" fill="#fff">4</text><text x="970" y="783" font-size="15" font-weight="700" fill="#10233f">1:100</text><text x="970" y="805" font-size="13" fill="#475569">保护区</text>
    <path d="M1005 735 H1185" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="1230" cy="735" r="27" fill="#0e8f83"/><text x="1230" y="742" font-size="16" font-weight="800" fill="#fff">5</text><text x="1230" y="783" font-size="15" font-weight="700" fill="#10233f">1:50</text><text x="1230" y="805" font-size="13" fill="#475569">交接细节</text>
  </g>

  <rect x="72" y="854" width="1424" height="192" rx="16" fill="#10233f"/>
  <text x="100" y="889" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#a7f3d0">五项公共权利 / FIVE RIGHTS</text>
  <text x="100" y="925" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">R1 普通通行　 R2 无障碍与照护　 R3 轨道/公交保护　 R4 申诉与暂停　 R5 隐私与退出</text>
  <text x="100" y="963" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe">S1 只获得“进入专业设计复核”的资格；官方边界、权属、路权、许可、现场性能和施工尺寸仍未确认。</text>
  <text x="100" y="997" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe">任何负向证据都冻结 feeder、保留普通路线，并回到 P0 清点；这张板是可审计的概念比较，不是运营或排名结论。</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94a3b8"/></marker></defs>
</svg>
