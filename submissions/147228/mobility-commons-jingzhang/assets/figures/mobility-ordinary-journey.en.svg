<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">One synthetic resident's day: outbound, disruption, return and complaint replay</title>
  <desc id="desc">A synthetic care journey from AI Origin Community to Dazhongsi with ordinary human channels and six stop conditions.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#0E3448"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><style>.sans{font-family:Arial,Helvetica,sans-serif}.title{font-size:31px;font-weight:900;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.card{font-size:18px;font-weight:900;fill:#F5FBFF}.body{font-size:15px;fill:#DCEEF5}.small{font-size:13px;fill:#9FC0CF}.green{fill:#66E3CA}.orange{fill:#F0A45D}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#A9C7D4}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1480" cy="90" r="290" fill="#1C7771" opacity=".18"/><circle cx="100" cy="930" r="280" fill="#3C4F89" opacity=".17"/>
  <text x="70" y="58" class="sans green" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / ORDINARY JOURNEY</text>
  <text x="70" y="105" class="sans title">One synthetic resident's day: outbound, disruption, return and complaint replay</text>
  <text x="70" y="137" class="sans sub">Synthetic carer · AI Origin Community → Dazhongsi · human and public transport remain available · unknown stays unknown</text>
  <rect x="70" y="185" width="1460" height="520" rx="28" fill="#0B2738" stroke="#24556B" filter="url(#shadow)"/>
  <line x1="170" y1="420" x2="1420" y2="420" stroke="#66E3CA" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(110 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">01 Before departure</text><text x="22" y="62" class="sans body">Community desk</text><text x="22" y="86" class="sans body">Paper / telephone route</text><text x="22" y="112" class="sans small">M-05 · PROV-KEY-002</text></g>
  <g transform="translate(345 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">02 Walk to station</text><text x="22" y="62" class="sans body">Accessibility check</text><text x="22" y="86" class="sans body">Stop if undated</text><text x="22" y="112" class="sans small">M-06 · unknown</text></g>
  <g transform="translate(580 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">03 Station transfer</text><text x="22" y="62" class="sans body">Staffed Dazhongsi handoff</text><text x="22" y="86" class="sans body">Rail / bus choice</text><text x="22" y="112" class="sans small">M-07 · PROV-KEY-003</text></g>
  <g transform="translate(815 265)"><circle cx="60" cy="155" r="20" fill="#F0A45D" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#3A2E2A" stroke="#F0A45D" stroke-width="2"/><text x="22" y="34" class="sans card">04 Disruption</text><text x="22" y="62" class="sans body">Freeze booking</text><text x="22" y="86" class="sans body">Human / ground transit</text><text x="22" y="112" class="sans small">M-09 · STOP</text></g>
  <g transform="translate(1050 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">05 Return trip</text><text x="22" y="62" class="sans body">Register return first</text><text x="22" y="86" class="sans body">Care handoff can exit</text><text x="22" y="112" class="sans small">M-05 · return plan</text></g>
  <g transform="translate(1285 265)"><circle cx="60" cy="155" r="20" fill="#F0A45D" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#3A2E2A" stroke="#F0A45D" stroke-width="2"/><text x="22" y="34" class="sans card">06 Complaint replay</text><text x="22" y="62" class="sans body">Owner + timestamp</text><text x="22" y="86" class="sans body">Replay before restart</text><text x="22" y="112" class="sans small">M-10 · DO NOT CLOSE</text></g>
  <text x="110" y="480" class="sans green" font-size="16" font-weight="900">Ordinary equivalents</text><text x="110" y="512" class="sans body">Staffed desk · telephone · paper · rail / public transport</text><text x="110" y="548" class="sans green" font-size="16" font-weight="900">Four field gaps exposed by this replay</text><text x="110" y="580" class="sans body">Undated walk-through · return register · station owner · response time</text><text x="110" y="620" class="sans small">All six negative fixtures stop, freeze or return to P0; no field result is filled in</text>
  <rect x="70" y="760" width="1460" height="130" rx="22" fill="#071A2B" stroke="#24556B"/><text x="100" y="805" class="sans orange" font-size="17" font-weight="900">Boundary</text><text x="100" y="840" class="sans body">This is a synthetic journey, not an interview or operating record. It shows that the human path and stop actions can be replayed.</text><text x="100" y="868" class="sans body">Field accessibility, staffing, return service, complaint time, public acceptance and professional approval remain unknown / not_authorized_not_run.</text>
  <text x="1530" y="950" text-anchor="end" class="sans mono">MOB-ORDINARY-JOURNEY-001 · local synthetic tabletop</text>
