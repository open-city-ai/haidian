  <rect x="72" y="790" width="1456" height="122" rx="16" fill="#10233f"/>
  <text x="100" y="825" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#a7f3d0">SHARED REVIEW GATES / 共同评审闸门</text>
  <text x="100" y="862" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">G1 普通路线先行　 G2 接收人与维护责任　 G3 日期化观察与公开回执　 G4 失败即停止并回到人工/公共交通</text>
  <text x="100" y="890" font-family="Arial, sans-serif" font-size="14" fill="#c7d2fe">三处原型是设计参考，不是现状地图；官方边界、尺寸、权属、许可、现场性能和建设结论仍待专业复核。</text>
