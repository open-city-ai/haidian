    <text x="40" y="382" font-family="Arial, sans-serif" font-size="16" fill="#475569">1:50：坡道、服务台与照护者停歇交接</text>
    <rect x="40" y="416" width="372" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="56" y="446" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">停：无人工等价 / 无障碍断裂 / 隐私边界不清</text>
