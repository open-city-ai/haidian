    <text x="40" y="350" font-family="Arial, sans-serif" font-size="16" fill="#475569">1:500：站口—过街—路缘的公共界面关系</text>
    <text x="40" y="382" font-family="Arial, sans-serif" font-size="16" fill="#475569">1:50：人工导向、清场与换乘回执交接</text>
