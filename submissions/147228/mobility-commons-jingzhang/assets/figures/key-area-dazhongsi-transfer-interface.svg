<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">大钟寺轨道换乘与路缘界面概念剖面</title>
  <desc id="desc">无尺度概念剖面，展示轨道换乘接口、公共首层、骑行停放、步行无障碍路径和按时段管理的路缘如何分流，不是车站施工图。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123B4A"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.title{font-size:32px;font-weight:800;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.label{font-size:18px;font-weight:800;fill:#F5FBFF}.small{font-size:14px;fill:#B8D2DB}.note{font-size:16px;fill:#D9EEF1}.head{font-size:17px;font-weight:800;fill:#66E3CA}.tag{font-size:13px;font-weight:800;fill:#0B2738}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="70" y="58" class="sans" fill="#66E3CA" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / KEY AREA INTERFACE</text><text x="70" y="105" class="sans title">大钟寺：把换乘、停放和路缘分开</text><text x="70" y="138" class="sans sub">无尺度概念剖面 · 轨道换乘接口待核查 · 不表达车站施工、线路、客流或路权</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="1040" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect x="1150" y="180" width="380" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/></g>
  <rect x="120" y="245" width="920" height="180" rx="18" fill="#1D3444" stroke="#608396" stroke-width="2"/><text x="155" y="285" class="sans label">轨道换乘接口（概念关系，不是车站平面）</text><rect x="165" y="330" width="260" height="58" rx="12" fill="#5B8DEF"/><text x="295" y="366" text-anchor="middle" class="sans tag">轨道到达 / 公交衔接</text><rect x="460" y="330" width="250" height="58" rx="12" fill="#2A9D8F"/><text x="585" y="366" text-anchor="middle" class="sans tag">公共首层与人工导向</text><rect x="745" y="330" width="250" height="58" rx="12" fill="#7C3AED"/><text x="870" y="366" text-anchor="middle" class="sans tag">活动展示可撤回</text>
  <path d="M165 500 H1000" stroke="#66E3CA" stroke-width="20" stroke-linecap="round"/><text x="165" y="470" class="sans label">连续步行 / 无障碍穿越</text><text x="690" y="470" class="sans small">日常路线优先，冲突时回到人工或公共交通</text>
  <path d="M220 500 C290 560 330 630 400 700" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/><path d="M520 500 C580 560 620 630 690 700" fill="none" stroke="#5B8DEF" stroke-width="12" stroke-linecap="round"/><path d="M820 500 C850 560 910 630 960 700" fill="none" stroke="#E76F51" stroke-width="12" stroke-linecap="round"/>
  <rect x="145" y="745" width="250" height="70" rx="14" fill="#FBBF24"/><text x="270" y="787" text-anchor="middle" class="sans tag">自行车停放与换乘</text><rect x="445" y="745" width="250" height="70" rx="14" fill="#5B8DEF"/><text x="570" y="787" text-anchor="middle" class="sans tag">人工导向与求助</text><rect x="745" y="745" width="250" height="70" rx="14" fill="#E76F51"/><text x="870" y="787" text-anchor="middle" class="sans tag">路缘窗口 / 清场</text>
  <text x="1190" y="235" class="sans head">普通人先看到什么</text><text x="1190" y="285" class="sans note">1  轨道到达后有明确方向</text><text x="1190" y="318" class="sans small">公交、步行、骑行和人工入口不互相抢路</text><text x="1190" y="375" class="sans note">2  路缘按时段变换状态</text><text x="1190" y="408" class="sans small">装卸、访客和活动不能堵住日常主链</text><text x="1190" y="465" class="sans note">3  受阻就回退，不把车推入人行路</text><text x="1190" y="498" class="sans small">站口、无障碍和消防边界优先</text><line x1="1190" y1="550" x2="1485" y2="550" stroke="#24556B"/><text x="1190" y="605" class="sans head">本图仍不能证明</text><text x="1190" y="650" class="sans small">具体站口、线路、客流或换乘容量</text><text x="1190" y="682" class="sans small">现状路权、消防净空和活动日组织</text><text x="1190" y="714" class="sans small">自动驾驶或空中出行许可</text><rect x="1190" y="770" width="285" height="54" rx="14" fill="#3B1F3A" stroke="#F472B6" stroke-width="2"/><text x="1332" y="803" text-anchor="middle" class="sans" fill="#FBCFE8" font-size="15" font-weight="800">PROVISIONAL / 待专业核验</text><text x="70" y="940" class="sans small">交通剖面图 · 只表达可逆的地面分流关系；正式方案需补站口、路缘、消防、无障碍和公众参与证据</text>
</svg>
