<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <rect width="2400" height="1500" fill="#091a2b"/>
  <rect x="56" y="48" width="2288" height="1404" rx="30" fill="#0d2235" stroke="#24445a" stroke-width="2"/>
  <text x="112" y="130" fill="#78f2d2" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">v2.10 / 15-MIN SERVICE-TIME OPERATIONS LEDGER</text>
  <text x="112" y="190" fill="#f5fafb" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">Time-slice service ledger: can demand actually board and move?</text>
  <text x="112" y="235" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="24">3,122,000 synthetic agents × three 15-minute slices; FIFO residual queues. Synthetic supply, not a current timetable.</text>

  <rect x="112" y="278" width="470" height="160" rx="20" fill="#143148" stroke="#244b63"/>
  <text x="144" y="325" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="22">Population-scale stress test</text>
  <text x="144" y="390" fill="#f5fafb" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">3.122M</text>
  <text x="430" y="390" fill="#78f2d2" font-family="Inter, Arial, sans-serif" font-size="22">agents</text>

  <rect x="604" y="278" width="470" height="160" rx="20" fill="#143148" stroke="#244b63"/>
  <text x="636" y="325" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="22">O4 end-of-window queue</text>
  <text x="636" y="390" fill="#ff8a7a" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">452,668</text>
  <text x="636" y="420" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="18">person-trips not served in window</text>

  <rect x="1096" y="278" width="470" height="160" rx="20" fill="#143148" stroke="#244b63"/>
  <text x="1128" y="325" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="22">Peak slice load</text>
  <text x="1128" y="390" fill="#ff8a7a" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">3.24×</text>
  <text x="1128" y="420" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="18">hard reference 1.35× · gate not passed</text>

  <rect x="1588" y="278" width="764" height="160" rx="20" fill="#2b1f2b" stroke="#704353"/>
  <text x="1620" y="325" fill="#ffb2a7" font-family="Inter, Arial, sans-serif" font-size="22">Operations status</text>
  <text x="1620" y="389" fill="#ff8a7a" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700">STOP / CALIBRATE</text>
  <text x="1620" y="420" fill="#e6c6ca" font-family="Inter, Arial, sans-serif" font-size="18">mode candidate ≠ operable timetable</text>

  <rect x="112" y="486" width="1280" height="570" rx="24" fill="#102b40" stroke="#244b63"/>
  <text x="152" y="550" fill="#f5fafb" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">O4 demand vs. synthetic supply / 15-minute slices</text>
  <text x="152" y="590" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="20">Mint = available capacity; coral = new demand; labels include carried queue.</text>
  <line x1="430" y1="645" x2="1290" y2="645" stroke="#3a5870" stroke-width="2"/>
  <text x="430" y="630" fill="#9db4c5" font-family="IBM Plex Mono, Menlo, monospace" font-size="18">0</text>
  <text x="1240" y="630" fill="#9db4c5" font-family="IBM Plex Mono, Menlo, monospace" font-size="18">2.8M</text>
  <g font-family="Inter, Arial, sans-serif">
    <text x="152" y="700" fill="#f5fafb" font-size="25" font-weight="700">Early 07:40–07:55</text>
    <text x="152" y="742" fill="#9db4c5" font-size="19">demand 218k · end queue 0</text>
    <rect x="430" y="676" width="116" height="34" rx="8" fill="#ff8a7a"/>
    <rect x="430" y="720" width="116" height="34" rx="8" fill="#78f2d2"/>
    <text x="565" y="701" fill="#ffb2a7" font-size="18">demand 218k</text>
    <text x="565" y="745" fill="#78f2d2" font-size="18">capacity 380k</text>
    <text x="1290" y="745" fill="#78f2d2" font-size="20" text-anchor="end">spare</text>

    <text x="152" y="828" fill="#f5fafb" font-size="25" font-weight="700">Preferred 08:00–08:15</text>
    <text x="152" y="870" fill="#ffb2a7" font-size="19">demand 2.748M · end queue 630k</text>
    <rect x="430" y="804" width="842" height="34" rx="8" fill="#ff8a7a"/>
    <rect x="430" y="848" width="657" height="34" rx="8" fill="#78f2d2"/>
    <text x="1290" y="829" fill="#f5fafb" font-size="20" text-anchor="end">gap 602k</text>
    <text x="1290" y="873" fill="#78f2d2" font-size="18" text-anchor="end">capacity 2.146M</text>

    <text x="152" y="956" fill="#f5fafb" font-size="25" font-weight="700">Late 08:20–08:35</text>
    <text x="152" y="998" fill="#ffb2a7" font-size="19">new demand 156k · end queue 453k</text>
    <rect x="430" y="932" width="48" height="34" rx="8" fill="#ff8a7a"/>
    <rect x="430" y="976" width="114" height="34" rx="8" fill="#78f2d2"/>
    <text x="565" y="957" fill="#ffb2a7" font-size="18">new 156k</text>
    <text x="565" y="1001" fill="#78f2d2" font-size="18">capacity 374k</text>
    <text x="1290" y="1001" fill="#ff8a7a" font-size="20" text-anchor="end">queue carries 453k</text>
  </g>

  <rect x="1424" y="486" width="928" height="570" rx="24" fill="#102b40" stroke="#244b63"/>
  <text x="1464" y="550" fill="#f5fafb" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">O4 end queue / by mode</text>
  <text x="1464" y="590" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="20">Same agents and declared service units; no personal or vehicle IDs.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="21">
    <text x="1464" y="662" fill="#f5fafb">walk / accessible</text><rect x="1670" y="640" width="502" height="30" rx="8" fill="#ff8a7a"/><text x="2200" y="663" fill="#ffb2a7">157,016</text>
    <text x="1464" y="732" fill="#f5fafb">metro</text><rect x="1670" y="710" width="389" height="30" rx="8" fill="#ff8a7a"/><text x="2200" y="733" fill="#ffb2a7">121,654</text>
    <text x="1464" y="802" fill="#f5fafb">bicycle</text><rect x="1670" y="780" width="298" height="30" rx="8" fill="#ff8a7a"/><text x="2200" y="803" fill="#ffb2a7">93,102</text>
    <text x="1464" y="872" fill="#f5fafb">bus</text><rect x="1670" y="850" width="184" height="30" rx="8" fill="#ff8a7a"/><text x="2200" y="873" fill="#ffb2a7">57,436</text>
    <text x="1464" y="942" fill="#f5fafb">enterprise shuttle</text><rect x="1670" y="920" width="75" height="30" rx="8" fill="#ff8a7a"/><text x="2200" y="943" fill="#ffb2a7">23,460</text>
    <text x="1464" y="1012" fill="#f5fafb">car</text><rect x="1670" y="990" width="6" height="30" rx="3" fill="#78f2d2"/><text x="2200" y="1013" fill="#78f2d2">0</text>
  </g>

  <rect x="112" y="1092" width="1040" height="282" rx="22" fill="#143148" stroke="#244b63"/>
  <text x="148" y="1145" fill="#f5fafb" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Auditable operating chain</text>
  <text x="148" y="1205" fill="#78f2d2" font-family="Inter, Arial, sans-serif" font-size="22">group demand</text><text x="335" y="1205" fill="#9db4c5" font-size="28">→</text><text x="375" y="1205" fill="#78f2d2" font-size="22">time × mode</text><text x="555" y="1205" fill="#9db4c5" font-size="28">→</text><text x="595" y="1205" fill="#78f2d2" font-size="22">runs / vehicles / slots</text><text x="880" y="1205" fill="#9db4c5" font-size="28">→</text><text x="920" y="1205" fill="#ff8a7a" font-size="22">board / carry</text>
  <text x="148" y="1260" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="20">Every step retains demand, capacity, boarded, queue and service-km; FIFO is reproducible.</text>
  <text x="148" y="1305" fill="#ffb2a7" font-family="Inter, Arial, sans-serif" font-size="20">Current finding: candidates compare; the service gate is not ready for deployment.</text>

  <rect x="1184" y="1092" width="1168" height="282" rx="22" fill="#2b1f2b" stroke="#704353"/>
  <text x="1220" y="1145" fill="#f5fafb" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">What closes STOP?</text>
  <text x="1220" y="1198" fill="#ffb2a7" font-family="Inter, Arial, sans-serif" font-size="20">01  Dated metro/bus services and headways</text>
  <text x="1220" y="1238" fill="#ffb2a7" font-family="Inter, Arial, sans-serif" font-size="20">02  15-minute station, stop, curb and accessible-path capacity</text>
  <text x="1220" y="1278" fill="#ffb2a7" font-family="Inter, Arial, sans-serif" font-size="20">03  Boarding / denied-boarding / queue / transfer counts</text>
  <text x="1220" y="1318" fill="#ffb2a7" font-family="Inter, Arial, sans-serif" font-size="20">04  Fleet, service-distance and maintenance responsibility</text>
  <text x="1220" y="1358" fill="#9db4c5" font-family="Inter, Arial, sans-serif" font-size="18">synthetic screen · aggregate only · air candidate remains blocked</text>

  <text x="112" y="1420" fill="#7693a6" font-family="IBM Plex Mono, Menlo, monospace" font-size="17">MODEL STATUS: TRANSPARENT SANDBOX / NOT OBSERVED TIMETABLE / NOT RESIDENT SATISFACTION / NOT A CONSTRUCTION OR OPERATING COMMITMENT</text>
</svg>
