<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">一个合成居民的一天：去程、受阻、回程和投诉复核</title>
  <desc id="desc">AI 原点社区到大钟寺的普通人照护路线，人工等价通道与六个负例停止点。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#0E3448"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.title{font-size:31px;font-weight:900;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.card{font-size:18px;font-weight:900;fill:#F5FBFF}.body{font-size:15px;fill:#DCEEF5}.small{font-size:13px;fill:#9FC0CF}.green{fill:#66E3CA}.orange{fill:#F0A45D}.red{fill:#FF8A7A}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;fill:#A9C7D4}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1480" cy="90" r="290" fill="#1C7771" opacity=".18"/><circle cx="100" cy="930" r="280" fill="#3C4F89" opacity=".17"/>
  <text x="70" y="58" class="sans green" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / ORDINARY JOURNEY</text>
  <text x="70" y="105" class="sans title">一个合成居民的一天：去程、受阻、回程和投诉复核</text>
  <text x="70" y="137" class="sans sub">合成照护者 · AI 原点社区 → 大钟寺 · 人工与公共交通始终保留 · unknown 不填成结果</text>
  <rect x="70" y="185" width="1460" height="520" rx="28" fill="#0B2738" stroke="#24556B" filter="url(#shadow)"/>
  <line x1="170" y1="420" x2="1420" y2="420" stroke="#66E3CA" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(110 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">01 出发前</text><text x="22" y="62" class="sans body">社区服务台</text><text x="22" y="86" class="sans body">纸面 / 电话路线</text><text x="22" y="112" class="sans small">M-05 · PROV-KEY-002</text></g>
  <g transform="translate(345 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">02 走到站口</text><text x="22" y="62" class="sans body">无障碍走查</text><text x="22" y="86" class="sans body">日期缺失就停</text><text x="22" y="112" class="sans small">M-06 · unknown</text></g>
  <g transform="translate(580 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">03 站口换乘</text><text x="22" y="62" class="sans body">大钟寺人工交接</text><text x="22" y="86" class="sans body">轨道 / 公交可选</text><text x="22" y="112" class="sans small">M-07 · PROV-KEY-003</text></g>
  <g transform="translate(815 265)"><circle cx="60" cy="155" r="20" fill="#F0A45D" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#3A2E2A" stroke="#F0A45D" stroke-width="2"/><text x="22" y="34" class="sans card">04 发生中断</text><text x="22" y="62" class="sans body">冻结预约</text><text x="22" y="86" class="sans body">人工 / 地面交通</text><text x="22" y="112" class="sans small">M-09 · STOP</text></g>
  <g transform="translate(1050 265)"><circle cx="60" cy="155" r="20" fill="#66E3CA" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#123B4A" stroke="#2A9D8F" stroke-width="2"/><text x="22" y="34" class="sans card">05 返程</text><text x="22" y="62" class="sans body">返程先登记</text><text x="22" y="86" class="sans body">照护交接可退出</text><text x="22" y="112" class="sans small">M-05 · return plan</text></g>
  <g transform="translate(1285 265)"><circle cx="60" cy="155" r="20" fill="#F0A45D" stroke="#fff" stroke-width="4"/><rect width="210" height="130" rx="18" fill="#3A2E2A" stroke="#F0A45D" stroke-width="2"/><text x="22" y="34" class="sans card">06 投诉复核</text><text x="22" y="62" class="sans body">责任人 + 时间戳</text><text x="22" y="86" class="sans body">独立回放再重启</text><text x="22" y="112" class="sans small">M-10 · DO NOT CLOSE</text></g>
  <text x="110" y="480" class="sans green" font-size="16" font-weight="900">普通等价通道</text><text x="110" y="512" class="sans body">人工服务台 · 电话 · 纸面 · 轨道 / 公共交通</text><text x="110" y="548" class="sans green" font-size="16" font-weight="900">本次回放主动暴露的四个现场缺口</text><text x="110" y="580" class="sans body">无日期走查 · 返程登记 · 站口责任 · 投诉回应时长</text><text x="110" y="620" class="sans small">六个负例全部停止、冻结或回到 P0；没有任何现场结果被填入</text>
  <rect x="70" y="760" width="1460" height="130" rx="22" fill="#071A2B" stroke="#24556B"/><text x="100" y="805" class="sans orange" font-size="17" font-weight="900">边界</text><text x="100" y="840" class="sans body">这是合成经历，不是访谈或运营记录。它只证明普通人路径、人工等价和失败动作能被回放。</text><text x="100" y="868" class="sans body">现场可达性、值守、返程服务、投诉时长、公众接受、专业批准仍为 unknown / not_authorized_not_run。</text>
  <text x="1530" y="950" text-anchor="end" class="sans mono">MOB-ORDINARY-JOURNEY-001 · local synthetic tabletop</text>
</svg>
