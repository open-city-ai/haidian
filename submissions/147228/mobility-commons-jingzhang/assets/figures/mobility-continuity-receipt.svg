<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5f8f7"/>
  <rect width="1600" height="142" fill="#102744"/>
  <text x="72" y="58" fill="#ffffff" font-family="Arial, 'PingFang SC', sans-serif" font-size="32" font-weight="700">一日四段服务回执 / Four windows, one ordinary route</text>
  <text x="72" y="104" fill="#b9d8d1" font-family="Arial, 'PingFang SC', sans-serif" font-size="21">普通服务优先 · AI 只做聚合与解释 · 0 授权 · 0 现场观察 · not_run · HOLD</text>
  <rect x="1280" y="38" width="230" height="62" rx="31" fill="#d96c4b"/>
  <text x="1395" y="77" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">DO NOT ADVANCE</text>
  <text x="72" y="190" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="700">同一条出行链，四个可拒收的服务窗口</text>
  <text x="72" y="228" fill="#3d556b" font-family="Arial, sans-serif" font-size="19">Each window keeps an ordinary route, a human equivalent, a named receiver and a stop action.</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <g transform="translate(72,278)"><rect width="348" height="330" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="44" fill="#0e8f83" font-size="22" font-weight="700">01 早高峰到岗</text><text x="24" y="76" fill="#3d556b" font-size="16">AM ARRIVAL · 众智园</text><text x="24" y="122" fill="#102744" font-size="17">普通：轨道/公交 + 路缘窗口</text><text x="24" y="158" fill="#3d556b" font-size="16">AI：分组时段与冲突提示</text><text x="24" y="194" fill="#3d556b" font-size="16">等价：纸面登记 + 现场引导</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">无接收人 / 容量 → 拒收</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">公共路线保持开放</text></g>
    <g transform="translate(452,278)"><rect width="348" height="330" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="44" fill="#0e8f83" font-size="22" font-weight="700">02 日常到达</text><text x="24" y="76" fill="#3d556b" font-size="16">DAILY ACCESS · AI 原点</text><text x="24" y="122" fill="#102744" font-size="17">普通：步入/电话/纸面服务台</text><text x="24" y="158" fill="#3d556b" font-size="16">AI：聚合时段，不留连续轨迹</text><text x="24" y="194" fill="#3d556b" font-size="16">等价：连续无障碍路线</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">基本通行受损 → 关闭推荐</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">回到 P0 路线复核</text></g>
    <g transform="translate(832,278)"><rect width="348" height="330" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="24" y="44" fill="#0e8f83" font-size="22" font-weight="700">03 晚间换乘</text><text x="24" y="76" fill="#3d556b" font-size="16">PM RETURN · 大钟寺</text><text x="24" y="122" fill="#102744" font-size="17">普通：时刻表 + 人工引导</text><text x="24" y="158" fill="#3d556b" font-size="16">AI：解释冲突，提出可逆分流</text><text x="24" y="194" fill="#3d556b" font-size="16">等价：公共过街信息</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">容量未知 → 删除 feeder</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">保持公共路线</text></g>
    <g transform="translate(1212,278)"><rect width="316" height="330" rx="18" fill="#ffffff" stroke="#d96c4b" stroke-width="3"/><text x="24" y="44" fill="#d96c4b" font-size="22" font-weight="700">04 断网雨雪</text><text x="24" y="76" fill="#3d556b" font-size="16">OUTAGE · WEATHER · 全链</text><text x="24" y="122" fill="#102744" font-size="17">普通：人 / 轨道 / 公交 / 纸面</text><text x="24" y="158" fill="#3d556b" font-size="16">AI：离线整理回退清单</text><text x="24" y="194" fill="#3d556b" font-size="16">等价：值守交接 + 公共信息</text><text x="24" y="246" fill="#d96c4b" font-size="16" font-weight="700">无安全交接 → 冻结</text><text x="24" y="282" fill="#d96c4b" font-size="16" font-weight="700">保持 HOLD</text></g>
  </g>
  <line x1="160" y1="674" x2="1440" y2="674" stroke="#2d9c8f" stroke-width="8"/>
  <circle cx="160" cy="674" r="17" fill="#d96c4b"/><circle cx="586" cy="674" r="17" fill="#d96c4b"/><circle cx="1014" cy="674" r="17" fill="#d96c4b"/><circle cx="1440" cy="674" r="17" fill="#d96c4b"/>
  <text x="72" y="746" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">每次交接留下同一组回执字段</text>
  <text x="72" y="786" fill="#3d556b" font-family="Arial, sans-serif" font-size="18">state · node · service group · ordinary route · AI used or not · human equivalent · receiver · accepted/refused · fallback · version · next decision</text>
  <rect x="72" y="824" width="1456" height="94" rx="16" fill="#e6f2ef" stroke="#9bd6c9"/>
  <text x="98" y="863" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700">当前状态 / Current boundary</text>
  <text x="98" y="897" fill="#3d556b" font-family="Arial, sans-serif" font-size="17">4 states · 4 handoff seams · 4 positive controls · 6 negative HOLD fixtures · synthetic review only · no field result</text>
</svg>
