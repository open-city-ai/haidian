<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5f8f7"/>
  <rect x="0" y="0" width="1600" height="132" fill="#102744"/>
  <text x="72" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">Mobility Responsibility Transfer</text>
  <text x="72" y="101" fill="#b9d8d1" font-family="Arial, sans-serif" font-size="22">7 resource units · 8 groups · field HOLD · no real transfer accepted</text>
  <rect x="1220" y="36" width="290" height="62" rx="31" fill="#d96c4b"/>
  <text x="1365" y="76" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">REAL TRANSFERS 0</text>
  <text x="72" y="176" fill="#102744" font-family="Arial, sans-serif" font-size="24" font-weight="700">Every service must answer three questions</text>
  <text x="72" y="213" fill="#3d556b" font-family="Arial, sans-serif" font-size="20">Who receives the burden? What is the non-AI equivalent? What record permits refusal or rollback?</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(72,260)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">01 Route and curb</text><text x="26" y="90" fill="#102744" font-size="19">Recipient: transport/accessibility review</text><text x="26" y="126" fill="#3d556b" font-size="18">Denominator: segments, crossings, staffed windows</text><text x="26" y="162" fill="#3d556b" font-size="18">Equivalent: signs, staff, public transport</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">Missing record → freeze reservation, return to P0</text></g>
    <g transform="translate(575,260)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">02 Rail and bus</text><text x="26" y="90" fill="#102744" font-size="19">Recipient: rail/bus operations</text><text x="26" y="126" fill="#3d556b" font-size="18">Denominator: headways, capacity, transfer windows</text><text x="26" y="162" fill="#3d556b" font-size="18">Equivalent: timetable and staffed desk</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">Unknown capacity → remove feeder demand</text></g>
    <g transform="translate(1078,260)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">03 Enterprise booking</text><text x="26" y="90" fill="#102744" font-size="19">Recipient: enterprise mobility coordinator</text><text x="26" y="126" fill="#3d556b" font-size="18">Denominator: curb minutes and clearing staff</text><text x="26" y="162" fill="#3d556b" font-size="18">Equivalent: paper register and marshal</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">Public route displaced → refuse request</text></g>
    <g transform="translate(72,568)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">04 Resident daily access</text><text x="26" y="90" fill="#102744" font-size="19">Recipient: community and carer observers</text><text x="26" y="126" fill="#3d556b" font-size="18">Denominator: group attempts and human windows</text><text x="26" y="162" fill="#3d556b" font-size="18">Equivalent: walk-in, telephone, paper</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">Basic access harmed → disable recommendation</text></g>
    <g transform="translate(575,568)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">05 Maintenance and assets</text><text x="26" y="90" fill="#102744" font-size="19">Recipient: field maintenance</text><text x="26" y="126" fill="#3d556b" font-size="18">Denominator: inspection hours, repairs, assets</text><text x="26" y="162" fill="#3d556b" font-size="18">Equivalent: manual ticket and removable asset</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">No maintainer → remove, return to safe state</text></g>
    <g transform="translate(1078,568)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">06 Data and equity</text><text x="26" y="90" fill="#102744" font-size="19">Recipient: data and independent review</text><text x="26" y="126" fill="#3d556b" font-size="18">Denominator: groups, negatives, valid windows</text><text x="26" y="162" fill="#3d556b" font-size="18">Equivalent: aggregate paper register</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">Average hides gaps → hold expansion</text></g>
  </g>
  <text x="72" y="900" fill="#102744" font-family="Arial, sans-serif" font-size="20" font-weight="700">Writeback fields</text>
  <text x="72" y="936" fill="#3d556b" font-family="Arial, sans-serif" font-size="18">event ID · group · interface · resource · accepted/refused · fallback · responsible role · evidence version · next decision</text>
</svg>
