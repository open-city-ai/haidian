<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5f8f7"/>
  <rect x="0" y="0" width="1600" height="132" fill="#102744"/>
  <text x="72" y="58" fill="#ffffff" font-family="Arial, 'PingFang SC', sans-serif" font-size="32" font-weight="700">交通责任移交屏</text>
  <text x="72" y="101" fill="#b9d8d1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22">Mobility responsibility transfer · 7 resource units · 8 groups · field HOLD</text>
  <rect x="1220" y="36" width="290" height="62" rx="31" fill="#d96c4b"/>
  <text x="1365" y="76" text-anchor="middle" fill="#ffffff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">REAL TRANSFERS 0</text>
  <text x="72" y="176" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">每一项服务先回答三个问题</text>
  <text x="72" y="213" fill="#3d556b" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Who receives the burden? What is the non-AI equivalent? What record allows refusal or rollback?</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <g transform="translate(72,260)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">01 路线与路缘</text><text x="26" y="90" fill="#102744" font-size="19">接收角色：交通 / 无障碍复核</text><text x="26" y="126" fill="#3d556b" font-size="18">分母：路线段、过街窗、值守窗</text><text x="26" y="162" fill="#3d556b" font-size="18">等价路径：标线、人工引导、公交</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">缺记录 → 冻结预约，回到 P0</text></g>
    <g transform="translate(575,260)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">02 轨道与公交</text><text x="26" y="90" fill="#102744" font-size="19">接收角色：轨道 / 公交运营</text><text x="26" y="126" fill="#3d556b" font-size="18">分母：班次、容量、换乘观察窗</text><text x="26" y="162" fill="#3d556b" font-size="18">等价路径：时刻表、站内人工台</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">容量未知 → 删除 feeder 需求</text></g>
    <g transform="translate(1078,260)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">03 企业预约</text><text x="26" y="90" fill="#102744" font-size="19">接收角色：企业交通协调</text><text x="26" y="126" fill="#3d556b" font-size="18">分母：可用分钟、清场人力</text><text x="26" y="162" fill="#3d556b" font-size="18">等价路径：纸面登记、现场引导</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">挤占公共路 → 拒收请求</text></g>
    <g transform="translate(72,568)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">04 居民日常</text><text x="26" y="90" fill="#102744" font-size="19">接收角色：社区 / 照护观察</text><text x="26" y="126" fill="#3d556b" font-size="18">分母：分组尝试、人工服务窗</text><text x="26" y="162" fill="#3d556b" font-size="18">等价路径：步入、电话、纸面</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">基本通行受损 → 关闭推荐</text></g>
    <g transform="translate(575,568)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">05 维护与设备</text><text x="26" y="90" fill="#102744" font-size="19">接收角色：现场维护</text><text x="26" y="126" fill="#3d556b" font-size="18">分母：巡检时、维修量、资产数</text><text x="26" y="162" fill="#3d556b" font-size="18">等价路径：人工工单、可移设施</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">无人维护 → 拆除，回到安全态</text></g>
    <g transform="translate(1078,568)"><rect width="450" height="260" rx="18" fill="#ffffff" stroke="#2d9c8f" stroke-width="3"/><text x="26" y="48" fill="#0e8f83" font-size="24" font-weight="700">06 数据与公平</text><text x="26" y="90" fill="#102744" font-size="19">接收角色：数据 / 独立复核</text><text x="26" y="126" fill="#3d556b" font-size="18">分母：分组、负例、有效窗口</text><text x="26" y="162" fill="#3d556b" font-size="18">等价路径：聚合纸账、公开申诉</text><text x="26" y="210" fill="#d96c4b" font-size="18" font-weight="700">平均值掩盖差距 → 暂停扩展</text></g>
  </g>
  <text x="72" y="900" fill="#102744" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">可回写字段 / writeback</text>
  <text x="72" y="936" fill="#3d556b" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">event ID · group · interface · resource · accepted/refused · fallback · responsible role · evidence version · next decision</text>
</svg>
