<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI Origin Community resident daily ground interface concept</title>
  <desc id="desc">A scale-free concept interface showing a community desk, continuous accessible route, care pause, weather shelter and non-digital entry as a human-first fallback chain.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123B4A"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter><style>.sans{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif}.title{font-size:32px;font-weight:800;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.label{font-size:18px;font-weight:800;fill:#F5FBFF}.small{font-size:14px;fill:#B8D2DB}.note{font-size:16px;fill:#D9EEF1}.head{font-size:17px;font-weight:800;fill:#66E3CA}.tag{font-size:13px;font-weight:800;fill:#0B2738}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="70" y="58" class="sans" fill="#66E3CA" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / KEY AREA INTERFACE</text><text x="70" y="105" class="sans title">AI Origin Community: make human help reachable first</text><text x="70" y="138" class="sans sub">Scale-free concept interface · human-first · not an existing road, population, capacity or consent claim</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="1040" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect x="1150" y="180" width="380" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/></g>
  <rect x="120" y="235" width="930" height="250" rx="20" fill="#1D3444" stroke="#608396" stroke-width="2"/><text x="155" y="280" class="sans label">Community desk and daily access</text><text x="155" y="310" class="sans small">The desk faces the ordinary route; household information, personal traces and enterprise accounts stay outside</text>
  <rect x="155" y="355" width="245" height="82" rx="14" fill="#5B8DEF"/><text x="277" y="390" text-anchor="middle" class="sans tag">Community desk</text><text x="277" y="416" text-anchor="middle" class="sans tag">human / phone / paper</text><rect x="445" y="355" width="240" height="82" rx="14" fill="#2A9D8F"/><text x="565" y="390" text-anchor="middle" class="sans tag">Care and rest point</text><text x="565" y="416" text-anchor="middle" class="sans tag">pause and ask for help</text><rect x="730" y="355" width="270" height="82" rx="14" fill="#34D399"/><text x="865" y="390" text-anchor="middle" class="sans tag">Weather shelter interface</text><text x="865" y="416" text-anchor="middle" class="sans tag">human takeover when weather turns</text>
  <rect x="120" y="520" width="930" height="88" rx="18" fill="#172B38" stroke="#66E3CA" stroke-width="4" stroke-dasharray="12 8"/><text x="155" y="573" class="sans label">Continuous walking / wheelchair / care spine</text><text x="720" y="573" class="sans small">No app is required; keep an exit when offline, blocked or unsafe</text><path d="M180 700 H1000" stroke="#66E3CA" stroke-width="22" stroke-linecap="round"/><circle cx="260" cy="700" r="14" fill="#fff"/><circle cx="560" cy="700" r="14" fill="#fff"/><circle cx="860" cy="700" r="14" fill="#fff"/>
  <rect x="155" y="750" width="230" height="70" rx="14" fill="#E76F51"/><text x="270" y="792" text-anchor="middle" class="sans tag">Human help point</text><rect x="430" y="750" width="245" height="70" rx="14" fill="#FBBF24"/><text x="552" y="792" text-anchor="middle" class="sans tag">Bicycle and cart parking</text><rect x="720" y="750" width="280" height="70" rx="14" fill="#5B8DEF"/><text x="860" y="792" text-anchor="middle" class="sans tag">Public transport fallback</text><path d="M270 437 V520 M565 437 V520 M865 437 V520" stroke="#9FC0CF" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1190" y="235" class="sans head">What a person sees first</text><text x="1190" y="285" class="sans note">1  Enter without an app</text><text x="1190" y="318" class="sans small">Human, phone and paper entry sit beside the digital entry</text><text x="1190" y="375" class="sans note">2  Follow one continuous route</text><text x="1190" y="408" class="sans small">Care, wheelchair access and night return retain pause and help</text><text x="1190" y="465" class="sans note">3  Return to a person when the route breaks</text><text x="1190" y="498" class="sans small">The slowest person is not handed to a model score</text><line x1="1190" y1="550" x2="1485" y2="550" stroke="#24556B"/><text x="1190" y="605" class="sans head">This drawing does not prove</text><text x="1190" y="650" class="sans small">Resident demand, community consent or night safety</text><text x="1190" y="682" class="sans small">Field accessibility completion, staffing or duty cover</text><text x="1190" y="714" class="sans small">Any household trajectory or personal profile</text><rect x="1190" y="770" width="285" height="54" rx="14" fill="#3B1F3A" stroke="#F472B6" stroke-width="2"/><text x="1332" y="803" text-anchor="middle" class="sans" fill="#FBCFE8" font-size="15" font-weight="800">PROVISIONAL / PUBLIC REVIEW PENDING</text><text x="70" y="940" class="sans small">Interface drawing · human-first removable actions only; accessibility walk, participation, service baseline and owner evidence remain required</text>
</svg>
