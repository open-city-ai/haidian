<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <rect width="1600" height="1120" fill="#f4f7fb"/>
  <rect width="1600" height="132" fill="#10233f"/>
  <text x="72" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#a7f3d0">MOBILITY COMMONS / 147228</text>
  <text x="72" y="104" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff">System spatial options: protect the ground baseline first</text>
  <text x="1270" y="58" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0">CONCEPT ONLY</text>
  <text x="1270" y="88" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe">HOLD · 0 authorization · 0 field observations</text>
  <rect x="72" y="158" width="1456" height="62" rx="12" fill="#e0f2fe" stroke="#93c5fd"/>
  <text x="100" y="197" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e3a5f">Decision order: hard gates → ordinary/accessibility route → most exposed group → reversible handoff; missing local evidence returns to HOLD.</text>

  <g transform="translate(72 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#b42318"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fee4e2">S0 / REJECT</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Unmanaged peak</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">Cars, loading and feeders share one curb</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">✕ ordinary route unprotected</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">✕ no human receiver</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">✕ exposed groups not read back</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9f1239">Return to P0</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#9f1239">inventory rights, curb and public route</text>
  </g>

  <g transform="translate(432 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#0e8f83"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d1fae5">S1 / ADVANCE TO DESIGN REVIEW</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Ground-first multimodal</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">Rail + bus + walking/accessibility</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ ordinary service is visible first</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ each node has a receiver</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ curb states pause and withdraw</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">Design review only</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#047857">not authorization, construction or operation</text>
  </g>

  <g transform="translate(792 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#b7791f"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fef3c7">S2 / REVISE</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Air-first feeder</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">Ground baseline before experiment</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ airspace, insurance, weather unknown</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ ground fallback must remain</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ public interchange cannot be displaced</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Return to S1</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#92400e">air layer remains conditional</text>
  </g>

  <g transform="translate(1152 252)">
    <rect width="344" height="356" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
    <rect width="344" height="66" rx="16" fill="#2563eb"/>
    <text x="22" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#dbeafe">S3 / REVISE</text>
    <text x="22" y="53" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Extreme-weather fallback</text>
    <text x="22" y="104" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#10233f">Default layer for rain, outage and repair</text>
    <text x="22" y="138" font-family="Arial, sans-serif" font-size="16" fill="#475569">✓ rail/bus/human service stays online</text>
    <text x="22" y="168" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ route and roster need readback</text>
    <text x="22" y="198" font-family="Arial, sans-serif" font-size="16" fill="#475569">△ paper/telephone withdrawal notice</text>
    <rect x="22" y="248" width="300" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="38" y="276" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Return to S1</text>
    <text x="38" y="301" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">resilience layer around ground service</text>
  </g>

  <rect x="72" y="646" width="1424" height="174" rx="16" fill="#ffffff" stroke="#d6dee8" stroke-width="2"/>
  <text x="100" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#10233f">Five scales: the same decision from corridor to handoff; no construction dimensions</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="190" cy="735" r="27" fill="#0e8f83"/><text x="190" y="742" font-size="16" font-weight="800" fill="#fff">1</text><text x="190" y="783" font-size="15" font-weight="700" fill="#10233f">1:5000</text><text x="190" y="805" font-size="13" fill="#475569">corridor choice</text>
    <path d="M225 735 H405" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="450" cy="735" r="27" fill="#0e8f83"/><text x="450" y="742" font-size="16" font-weight="800" fill="#fff">2</text><text x="450" y="783" font-size="15" font-weight="700" fill="#10233f">1:2000</text><text x="450" y="805" font-size="13" fill="#475569">key-area network</text>
    <path d="M485 735 H665" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="710" cy="735" r="27" fill="#0e8f83"/><text x="710" y="742" font-size="16" font-weight="800" fill="#fff">3</text><text x="710" y="783" font-size="15" font-weight="700" fill="#10233f">1:500</text><text x="710" y="805" font-size="13" fill="#475569">node relation</text>
    <path d="M745 735 H925" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="970" cy="735" r="27" fill="#0e8f83"/><text x="970" y="742" font-size="16" font-weight="800" fill="#fff">4</text><text x="970" y="783" font-size="15" font-weight="700" fill="#10233f">1:100</text><text x="970" y="805" font-size="13" fill="#475569">protected zone</text>
    <path d="M1005 735 H1185" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="1230" cy="735" r="27" fill="#0e8f83"/><text x="1230" y="742" font-size="16" font-weight="800" fill="#fff">5</text><text x="1230" y="783" font-size="15" font-weight="700" fill="#10233f">1:50</text><text x="1230" y="805" font-size="13" fill="#475569">handoff detail</text>
  </g>

  <rect x="72" y="854" width="1424" height="192" rx="16" fill="#10233f"/>
  <text x="100" y="889" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#a7f3d0">FIVE PUBLIC RIGHTS / 五项公共权利</text>
  <text x="100" y="925" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">R1 ordinary access　 R2 accessibility and care　 R3 rail/bus protection　 R4 appeal and pause　 R5 privacy and exit</text>
  <text x="100" y="963" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe">S1 earns only entry to professional design review; official boundary, ownership, right-of-way, permission and performance remain unconfirmed.</text>
  <text x="100" y="997" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe">Any negative evidence freezes the feeder, keeps the ordinary route and returns to P0; this is an auditable concept comparison, not an operating or ranking claim.</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#94a3b8"/></marker></defs>
</svg>
