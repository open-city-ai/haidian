<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">京张共行环：首168小时到首12周的可逆交付链</title>
  <desc id="desc">四个交付窗口、两处正式几何绑定、一处外部锚点、四状态回退与默认 HOLD 决策。</desc>
  <rect width="1600" height="1000" fill="#f6f8fb"/>
  <rect x="50" y="42" width="1500" height="100" rx="22" fill="#102744"/>
  <text x="90" y="88" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700">京张共行环｜首 168 小时 → 首 12 周</text>
  <text x="90" y="122" fill="#b8d9e8" font-family="sans-serif" font-size="18">2 处正式绑定 + 1 处外部锚点 · 普通服务优先 · 退出先于扩展</text>
  <rect x="50" y="172" width="1500" height="68" rx="16" fill="#ffe6e1" stroke="#d85a4a" stroke-width="2"/>
  <text x="84" y="202" fill="#8f2f28" font-family="sans-serif" font-size="19" font-weight="700">边界 / BOUNDARY</text>
  <text x="290" y="202" fill="#8f2f28" font-family="sans-serif" font-size="18">设计时序，不是运营许可；授权=0 · 现场观察=0 · baseline=unknown · performance=null · 默认 HOLD</text>
  <g font-family="sans-serif">
    <rect x="50" y="280" width="355" height="300" rx="18" fill="#e5f4f1" stroke="#0e8f83" stroke-width="3"/>
    <text x="78" y="322" fill="#0e5d58" font-size="25" font-weight="700">H0｜0–24h</text>
    <text x="78" y="354" fill="#102744" font-size="20" font-weight="700">先让普通路线可用</text>
    <text x="78" y="392" fill="#23364d" font-size="17">• BASE：不用账号/模型</text>
    <text x="78" y="421" fill="#23364d" font-size="17">• 人工、电话、纸面等价入口</text>
    <text x="78" y="450" fill="#23364d" font-size="17">• 命名接收角色与投诉入口</text>
    <text x="78" y="479" fill="#23364d" font-size="17">• 缺失即停止数字层</text>
    <rect x="78" y="515" width="280" height="38" rx="10" fill="#fff"/>
    <text x="92" y="540" fill="#0e5d58" font-size="15">产物：ordinary route card</text>

    <rect x="425" y="280" width="355" height="300" rx="18" fill="#e9f0fb" stroke="#3f6fae" stroke-width="3"/>
    <text x="453" y="322" fill="#284d83" font-size="25" font-weight="700">H1｜24–72h</text>
    <text x="453" y="354" fill="#102744" font-size="20" font-weight="700">绑定 8 个正式几何对象</text>
    <text x="453" y="392" fill="#23364d" font-size="17">• 众智园 + AI 原点：2 线 6 点</text>
    <text x="453" y="421" fill="#23364d" font-size="17">• 引用回读 roads / public_space</text>
    <text x="453" y="450" fill="#23364d" font-size="17">• 大钟寺：外部锚点 / WITHHELD</text>
    <text x="453" y="479" fill="#23364d" font-size="17">• 无接收者 / 无回退即 HOLD</text>
    <rect x="453" y="515" width="280" height="38" rx="10" fill="#fff"/>
    <text x="467" y="540" fill="#284d83" font-size="15">产物：8-object binding receipt</text>

    <rect x="800" y="280" width="355" height="300" rx="18" fill="#fff4df" stroke="#d08a2c" stroke-width="3"/>
    <text x="828" y="322" fill="#8a5b16" font-size="25" font-weight="700">H2｜72–120h</text>
    <text x="828" y="354" fill="#102744" font-size="20" font-weight="700">离线复演失效情景</text>
    <text x="828" y="392" fill="#23364d" font-size="17">• BOOST / BLACKOUT / BEQUEST</text>
    <text x="828" y="421" fill="#23364d" font-size="17">• 断网、雨雪、冲突、拒收</text>
    <text x="828" y="450" fill="#23364d" font-size="17">• 人工/公交优先接管</text>
    <text x="828" y="479" fill="#23364d" font-size="17">• 负例不计为现场成绩</text>
    <rect x="828" y="515" width="280" height="38" rx="10" fill="#fff"/>
    <text x="842" y="540" fill="#8a5b16" font-size="15">产物：handoff + withdrawal</text>

    <rect x="1175" y="280" width="375" height="300" rx="18" fill="#f0e9f7" stroke="#8055a6" stroke-width="3"/>
    <text x="1203" y="322" fill="#5d3b7c" font-size="25" font-weight="700">H3｜120–168h</text>
    <text x="1203" y="354" fill="#102744" font-size="20" font-weight="700">独立复核后仍可 HOLD</text>
    <text x="1203" y="392" fill="#23364d" font-size="17">• exact tree 与证据地图</text>
    <text x="1203" y="421" fill="#23364d" font-size="17">• 维护 / 申诉 / 撤回票据</text>
    <text x="1203" y="450" fill="#23364d" font-size="17">• 不把 synthetic 写成 outcome</text>
    <text x="1203" y="479" fill="#23364d" font-size="17">• 缺证据：修复或不发布</text>
    <rect x="1203" y="515" width="310" height="38" rx="10" fill="#fff"/>
    <text x="1217" y="540" fill="#5d3b7c" font-size="15">产物：review / archive receipt</text>
  </g>
  <text x="50" y="636" fill="#102744" font-family="sans-serif" font-size="23" font-weight="700">2 处正式绑定 + 1 处外部锚点 / SPATIAL BINDING</text>
  <g font-family="sans-serif" font-size="17">
    <rect x="50" y="665" width="465" height="115" rx="16" fill="#fff" stroke="#b4c4d4"/>
    <text x="75" y="703" fill="#102744" font-size="21" font-weight="700">众智园 / Zhongzhiyuan</text>
    <text x="75" y="733" fill="#3c536d">1 条待核顺序 + 3 个候选点</text>
    <text x="75" y="760" fill="#d85a4a">拒收：没有清场责任 / protected route</text>
    <rect x="535" y="665" width="465" height="115" rx="16" fill="#fff" stroke="#b4c4d4"/>
    <text x="560" y="703" fill="#102744" font-size="21" font-weight="700">AI 原点 / AI Origin</text>
    <text x="560" y="733" fill="#3c536d">1 条待核顺序 + 3 个候选点</text>
    <text x="560" y="760" fill="#d85a4a">拒收：数字层成为基本 access</text>
    <rect x="1020" y="665" width="530" height="115" rx="16" fill="#fff" stroke="#b4c4d4"/>
    <text x="1045" y="703" fill="#102744" font-size="21" font-weight="700">大钟寺 / 外部锚点</text>
    <text x="1045" y="733" fill="#3c536d">3 点 + 1 线仅作视觉筛查</text>
    <text x="1045" y="760" fill="#d85a4a">约 2.31 km 冲突 · 正式几何 WITHHELD</text>
  </g>
  <rect x="50" y="835" width="1500" height="95" rx="18" fill="#102744"/>
  <text x="84" y="875" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">首 12 周 / FIRST 12 WEEKS</text>
  <text x="84" y="906" fill="#b8d9e8" font-family="sans-serif" font-size="17">W01–02 边界与同意 → W03–04 路线审计 → W05–07 普通服务等价 → W08–09 失效桌演 → W10–11 独立复核 → W12 HOLD / 修复 / 撤回</text>
</svg>
