<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI 原点社区居民日常地面界面概念图</title>
  <desc id="desc">无尺度概念图，展示社区服务台、连续无障碍路线、照护停留、遮雨候车和非数字入口如何组成一个人工优先的可回退界面。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123B4A"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.title{font-size:32px;font-weight:800;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.label{font-size:18px;font-weight:800;fill:#F5FBFF}.small{font-size:14px;fill:#B8D2DB}.note{font-size:16px;fill:#D9EEF1}.head{font-size:17px;font-weight:800;fill:#66E3CA}.tag{font-size:13px;font-weight:800;fill:#0B2738}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="70" y="58" class="sans" fill="#66E3CA" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / KEY AREA INTERFACE</text><text x="70" y="105" class="sans title">AI 原点社区：先保证有人能带你走</text><text x="70" y="138" class="sans sub">无尺度概念界面 · 人工优先 · 不表达现状道路、人口、容量或社区同意</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="1040" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect x="1150" y="180" width="380" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/></g>
  <rect x="120" y="235" width="930" height="250" rx="20" fill="#1D3444" stroke="#608396" stroke-width="2"/><text x="155" y="280" class="sans label">社区服务台与日常入口</text><text x="155" y="310" class="sans small">服务台面向普通路径；家庭信息、个人轨迹和企业账号不进入这张图</text>
  <rect x="155" y="355" width="245" height="82" rx="14" fill="#5B8DEF"/><text x="277" y="390" text-anchor="middle" class="sans tag">社区服务台</text><text x="277" y="416" text-anchor="middle" class="sans tag">人工 / 电话 / 纸面</text><rect x="445" y="355" width="240" height="82" rx="14" fill="#2A9D8F"/><text x="565" y="390" text-anchor="middle" class="sans tag">照护与休息点</text><text x="565" y="416" text-anchor="middle" class="sans tag">可停留、可求助</text><rect x="730" y="355" width="270" height="82" rx="14" fill="#34D399"/><text x="865" y="390" text-anchor="middle" class="sans tag">遮雨候车界面</text><text x="865" y="416" text-anchor="middle" class="sans tag">天气变坏时人工接管</text>
  <rect x="120" y="520" width="930" height="88" rx="18" fill="#172B38" stroke="#66E3CA" stroke-width="4" stroke-dasharray="12 8"/><text x="155" y="573" class="sans label">连续步行 / 轮椅 / 照护主链</text><text x="720" y="573" class="sans small">不要求下载应用；断网、受阻或不安时保留退出路径</text><path d="M180 700 H1000" stroke="#66E3CA" stroke-width="22" stroke-linecap="round"/><circle cx="260" cy="700" r="14" fill="#fff"/><circle cx="560" cy="700" r="14" fill="#fff"/><circle cx="860" cy="700" r="14" fill="#fff"/>
  <rect x="155" y="750" width="230" height="70" rx="14" fill="#E76F51"/><text x="270" y="792" text-anchor="middle" class="sans tag">人工求助点</text><rect x="430" y="750" width="245" height="70" rx="14" fill="#FBBF24"/><text x="552" y="792" text-anchor="middle" class="sans tag">自行车与推车停放</text><rect x="720" y="750" width="280" height="70" rx="14" fill="#5B8DEF"/><text x="860" y="792" text-anchor="middle" class="sans tag">公共交通回退方向</text><path d="M270 437 V520 M565 437 V520 M865 437 V520" stroke="#9FC0CF" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1190" y="235" class="sans head">普通人先看到什么</text><text x="1190" y="285" class="sans note">1  不会用 App 也能进来</text><text x="1190" y="318" class="sans small">人工、电话和纸面入口与数字入口并列</text><text x="1190" y="375" class="sans note">2  先走一条连续路线</text><text x="1190" y="408" class="sans small">照护、轮椅和夜间回家保留停留与求助</text><text x="1190" y="465" class="sans note">3  路线断了就退回人工</text><text x="1190" y="498" class="sans small">不能把最慢的人交给一个模型分数</text><line x1="1190" y1="550" x2="1485" y2="550" stroke="#24556B"/><text x="1190" y="605" class="sans head">本图仍不能证明</text><text x="1190" y="650" class="sans small">居民真实需求、社区同意或夜间安全</text><text x="1190" y="682" class="sans small">无障碍现场完成率、服务人员和值守</text><text x="1190" y="714" class="sans small">任何家庭轨迹或个人画像</text><rect x="1190" y="770" width="285" height="54" rx="14" fill="#3B1F3A" stroke="#F472B6" stroke-width="2"/><text x="1332" y="803" text-anchor="middle" class="sans" fill="#FBCFE8" font-size="15" font-weight="800">PROVISIONAL / 待公众参与</text><text x="70" y="940" class="sans small">交通界面图 · 只画人工优先的可撤回动作；正式方案需补无障碍走查、居民参与、服务基线和责任人</text>
</svg>
