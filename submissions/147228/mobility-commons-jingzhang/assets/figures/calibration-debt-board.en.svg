<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Calibration debt and parameter provenance</title><desc id="desc">Every mode parameter and mode weight has a status, source boundary and next calibration dependency</desc><defs><linearGradient id="bg-en" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#103C50"/></linearGradient><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:900;letter-spacing:1px;fill:#9FC0CF}.title{font-size:31px;font-weight:900;fill:#F5FBFF}.sub{font-size:16px;fill:#B9D0D9}.card-title{font-size:17px;font-weight:900;fill:#F5FBFF}.number{font-size:46px;font-weight:900;fill:#F5FBFF}.big-number{font-size:42px;font-weight:900}.unit{font-size:14px;fill:#66E3CA}.body{font-size:14px;fill:#DCEEF5}.small{font-size:12px;fill:#F0A45D}.footer{font-size:14px;fill:#A9C7D4}</style></defs><rect width="1600" height="760" fill="url(#bg-en)"/><circle cx="1510" cy="60" r="230" fill="#1C7771" opacity=".16"/><text x="60" y="54" class="sans eyebrow">MOBILITY COMMONS / INPUT PROVENANCE</text><text x="60" y="104" class="sans title">Calibration debt and parameter provenance</text><text x="60" y="136" class="sans sub">Every mode parameter and mode weight has a status, source boundary and next calibration dependency</text><g transform="translate(60 190)"><rect width="330" height="130" rx="20" fill="#071A2B" stroke="#5EA7FF" stroke-width="2"/><text x="24" y="38" class="eyebrow">DECLARED INPUTS</text><text x="24" y="92" class="big-number" fill="#5EA7FF">234</text></g><g transform="translate(430 190)"><rect width="330" height="130" rx="20" fill="#071A2B" stroke="#27C499" stroke-width="2"/><text x="24" y="38" class="eyebrow">METHOD REFERENCES</text><text x="24" y="92" class="big-number" fill="#27C499">6</text></g><g transform="translate(800 190)"><rect width="330" height="130" rx="20" fill="#071A2B" stroke="#F0A45D" stroke-width="2"/><text x="24" y="38" class="eyebrow">CALIBRATION DEBT</text><text x="24" y="92" class="big-number" fill="#F0A45D">234</text></g><g transform="translate(1170 190)"><rect width="330" height="130" rx="20" fill="#071A2B" stroke="#B56CFF" stroke-width="2"/><text x="24" y="38" class="eyebrow">FIELD OBSERVATIONS</text><text x="24" y="92" class="big-number" fill="#B56CFF">0</text></g><g transform="translate(60 420)"><rect width="440" height="200" rx="24" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect width="440" height="10" rx="5" fill="#5EA7FF"/><text x="28" y="48" class="card-title">MODE PARAMETERS</text><text x="28" y="92" class="number">48</text><text x="112" y="88" class="unit">declared fields</text><text x="28" y="132" class="body">Capacity, base time, reliability, conflict proxy</text><text x="28" y="152" class="body"> and service-unit fields</text><text x="28" y="180" class="small">all observed_count = 0</text></g><g transform="translate(560 420)"><rect width="440" height="200" rx="24" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect width="440" height="10" rx="5" fill="#27C499"/><text x="28" y="48" class="card-title">MODE WEIGHTS</text><text x="28" y="92" class="number">180</text><text x="112" y="88" class="unit">declared fields</text><text x="28" y="132" class="body">Five candidate/stress profiles, six groups and s</text><text x="28" y="152" class="body">ix modes</text><text x="28" y="180" class="small">all observed_count = 0</text></g><g transform="translate(1060 420)"><rect width="440" height="200" rx="24" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect width="440" height="10" rx="5" fill="#F0A45D"/><text x="28" y="48" class="card-title">SYNTHETIC GROUPS</text><text x="28" y="92" class="number">6</text><text x="112" y="88" class="unit">declared fields</text><text x="28" y="132" class="body">Synthetic quotas from the regional reference, no</text><text x="28" y="152" class="body">t workforce counts</text><text x="28" y="180" class="small">all observed_count = 0</text></g><rect x="60" y="665" width="1480" height="54" rx="16" fill="#071A2B" stroke="#24556B"/><text x="88" y="698" class="sans footer">This is an auditable ledger for synthetic inputs. Complete provenance is not field calibration.</text><text x="1510" y="698" text-anchor="end" class="sans footer">field_status = not_authorized_not_run</text></svg>