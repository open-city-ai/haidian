  <g font-family="Arial, sans-serif" font-size="18">
    <text x="150" y="1075" fill="#B8C7DC">Metro</text><rect x="320" y="1048" width="780" height="34" rx="8" fill="#1F3A5B"/><rect x="320" y="1048" width="263" height="34" rx="8" fill="#69D3C5"/><text x="1140" y="1075" fill="#FFFFFF" font-weight="700">52,839.1</text>
