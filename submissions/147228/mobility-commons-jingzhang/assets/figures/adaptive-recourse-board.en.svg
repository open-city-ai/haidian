  <text x="110" y="130" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">OPERATIONS / V2.11 / BOUNDED RECOURSE</text>
  <text x="110" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="54" font-weight="800">Bounded recourse turns spare capacity into an auditable choice</text>
  <text x="110" y="250" fill="#B8C7DC" font-family="Arial, sans-serif" font-size="23">O4 synthetic screen · same-slice spare capacity · no personal route or acceptance claim</text>
