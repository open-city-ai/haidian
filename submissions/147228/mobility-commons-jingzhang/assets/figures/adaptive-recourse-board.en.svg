  <text x="1220" y="830" fill="#B8C7DC" font-family="Arial, sans-serif" font-size="18">Enterprise employees 28,354</text><text x="1220" y="865" fill="#B8C7DC" font-family="Arial, sans-serif" font-size="18">Visitors / service users 40,460.9</text>
