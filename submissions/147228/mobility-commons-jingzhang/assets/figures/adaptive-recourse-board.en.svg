  <text x="150" y="570" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="800">O4 · END-OF-WINDOW QUEUE</text><text x="150" y="610" fill="#9FB4CE" font-family="Arial, sans-serif" font-size="19">Recourse removes a bounded slice of residual demand; it does not make the timetable operable.</text>
  <text x="150" y="690" fill="#9FB4CE" font-family="Arial, sans-serif" font-size="18">v2.10 residual</text><rect x="350" y="650" width="610" height="52" rx="12" fill="#E76F51" opacity=".92"/><text x="990" y="689" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="700">452,668</text>
  <text x="150" y="770" fill="#9FB4CE" font-family="Arial, sans-serif" font-size="18">v2.11 residual</text><rect x="350" y="730" width="610" height="52" rx="12" fill="#F4A261" opacity=".95"/><text x="895" y="769" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="700">383,853.1</text>
  <text x="150" y="850" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="22" font-weight="800">−68,814.9  bounded transfers</text><text x="690" y="850" fill="#B8C7DC" font-family="Arial, sans-serif" font-size="19">cost proxy 550,519.2 person-min</text>
