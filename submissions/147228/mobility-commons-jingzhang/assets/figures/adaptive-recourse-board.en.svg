  <rect x="1770" y="695" width="450" height="54" rx="27" fill="#123A3B"/><text x="1800" y="731" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="19" font-weight="800">PASS</text><text x="1900" y="731" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19">capacity / conservation</text>
  <rect x="1770" y="770" width="450" height="54" rx="27" fill="#123A3B"/><text x="1800" y="806" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="19" font-weight="800">0 MOVED</text><text x="1985" y="806" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19">walking/access source</text>
  <text x="1770" y="870" fill="#FFB4A2" font-family="Arial, sans-serif" font-size="18">Still required: denied-boarding,</text><text x="1770" y="897" fill="#FFB4A2" font-family="Arial, sans-serif" font-size="18">acceptance, accessible fallback evidence</text>
