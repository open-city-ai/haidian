    <text x="150" y="1350" fill="#B8C7DC">Enterprise shuttle</text><rect x="320" y="1323" width="780" height="34" rx="8" fill="#1F3A5B"/><rect x="320" y="1323" width="147" height="34" rx="8" fill="#F4A261"/><text x="1140" y="1350" fill="#FFFFFF" font-weight="700">23,460</text>
  </g>
  <line x1="1460" y1="1040" x2="1460" y2="1320" stroke="#294363" stroke-width="2"/>
  <text x="1510" y="1085" fill="#9FB4CE" font-family="Arial, sans-serif" font-size="18">WHAT THIS BOARD PROVES</text><text x="1510" y="1135" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21">• A bounded fallback can be audited</text><text x="1510" y="1180" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21">• Protected access is not silently traded</text><text x="1510" y="1225" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21">• Spare capacity is not a timetable</text><text x="1510" y="1270" fill="#FFB4A2" font-family="Arial, sans-serif" font-size="21" font-weight="800">• Residual queue keeps the gate closed</text><text x="1510" y="1330" fill="#9FB4CE" font-family="Arial, sans-serif" font-size="16">Synthetic aggregate sensitivity · not local OD,</text><text x="1510" y="1355" fill="#9FB4CE" font-family="Arial, sans-serif" font-size="16">route choice, acceptance or operating performance</text>
</svg>
