<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">三条状态轴。先看包，再看评审资格</title>
  <desc id="desc">同一份投稿同时说明包完整性、内容评审资格和官方空间数据依赖的正式专业评分资格</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#0E3448"/></linearGradient><style>.sans{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif}.eyebrow{font-size:18px;font-weight:900;letter-spacing:3px;fill:#66E3CA}.title{font-size:31px;font-weight:900;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.card-title{font-size:18px;font-weight:900;fill:#E8F8FA}.status{font-size:18px;font-weight:900;fill:#F5FBFF}.machine{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#A9C7D4}.section{font-size:15px;font-weight:900;fill:#66E3CA}.section.warm{fill:#F0A45D}.body{font-size:15px;fill:#DCEEF5}.footer{font-size:14px;fill:#9FC0CF}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1500" cy="70" r="280" fill="#1C7771" opacity=".16"/><circle cx="90" cy="950" r="260" fill="#3C4F89" opacity=".16"/>
  <text x="60" y="58" class="sans eyebrow">MOBILITY COMMONS / REVIEW STATUS CONTRACT</text>
  <text x="60" y="103" class="sans title">三条状态轴。先看包，再看评审资格</text><text x="60" y="133" class="sans sub">同一份投稿同时说明包完整性、内容评审资格和官方空间数据依赖的正式专业评分资格</text>
  <g transform="translate(60 190)">
      <rect width="470" height="560" rx="26" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="470" height="12" rx="6" fill="#27C499"/>
      <text x="32" y="62" class="card-title">机器门禁</text>
      <rect x="32" y="88" width="406" height="58" rx="16" fill="#27C49920" stroke="#27C499" stroke-width="2"/>
      <circle cx="60" cy="117" r="9" fill="#27C499"/>
      <text x="84" y="124" class="status">通过</text>
      <text x="32" y="184" class="machine">package_state=ready_for_review</text>
      <line x1="32" y1="214" x2="438" y2="214" stroke="#24556B"/>
      <text x="32" y="256" class="section">当前状态可以支持</text>
      <text x="32" y="292" class="body">包完整性</text><text x="32" y="324" class="body">结构、双语、图件、GeoJSON、指标、矩阵和 manifest 已通过包内门禁。</text>
      <text x="32" y="392" class="section warm">仍然需要</text>
      <text x="32" y="428" class="body">官方边界、现场资料和专业判断仍需单独取得。</text>
    </g><g transform="translate(570 190)">
      <rect width="470" height="560" rx="26" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="470" height="12" rx="6" fill="#5EA7FF"/>
      <text x="32" y="62" class="card-title">内容评审</text>
      <rect x="32" y="88" width="406" height="58" rx="16" fill="#5EA7FF20" stroke="#5EA7FF" stroke-width="2"/>
      <circle cx="60" cy="117" r="9" fill="#5EA7FF"/>
      <text x="84" y="124" class="status">可进入</text>
      <text x="32" y="184" class="machine">content_review_eligible=true</text>
      <line x1="32" y1="214" x2="438" y2="214" stroke="#24556B"/>
      <text x="32" y="256" class="section">当前状态可以支持</text>
      <text x="32" y="292" class="body">内容评审资格</text><text x="32" y="324" class="body">组织方 polygon 缺口不阻断维护者和 Review Agent 对包内内容的评审。</text>
      <text x="32" y="392" class="section warm">仍然需要</text>
      <text x="32" y="428" class="body">内容评审分数不等于现场绩效、专业签字或实施许可。</text>
    </g><g transform="translate(1080 190)">
      <rect width="470" height="560" rx="26" fill="#0B2738" stroke="#24556B" stroke-width="2"/>
      <rect width="470" height="12" rx="6" fill="#F0A45D"/>
      <text x="32" y="62" class="card-title">正式专业评分</text>
      <rect x="32" y="88" width="406" height="58" rx="16" fill="#F0A45D20" stroke="#F0A45D" stroke-width="2"/>
      <circle cx="60" cy="117" r="9" fill="#F0A45D"/>
      <text x="84" y="124" class="status">等待官方空间数据</text>
      <text x="32" y="184" class="machine">professional_scoring_eligible=false</text>
      <line x1="32" y1="214" x2="438" y2="214" stroke="#24556B"/>
      <text x="32" y="256" class="section">当前状态可以支持</text>
      <text x="32" y="292" class="body">正式专业评分资格</text><text x="32" y="324" class="body">正式专业评分轴仍保留在等待官方 SITE_BOUNDARY 和 KEY_AREA polygon 的状态。</text>
      <text x="32" y="392" class="section warm">仍然需要</text>
      <text x="32" y="428" class="body">补齐官方空间数据后，必须联动重算几何、指标、图纸和报告。</text>
    </g>
  <rect x="60" y="790" width="1480" height="116" rx="22" fill="#071A2B" stroke="#24556B"/>
  <text x="88" y="832" class="sans footer">内容评审可以回读包内设计证据。它与 official-geometry-dependent professional scoring 分开记录。</text><text x="88" y="866" class="sans footer">来源。manifest · self_check · provisional GeoJSON · review-status-contract.json</text>
  <text x="1540" y="952" text-anchor="end" class="sans footer">机器门禁与内容评审就绪，正式专业评分资格等待官方空间数据</text>
</svg>