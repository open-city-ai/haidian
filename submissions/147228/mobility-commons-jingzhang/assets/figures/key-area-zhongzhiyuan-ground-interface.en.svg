<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Zhongzhiyuan enterprise-arrival ground interface concept</title>
  <desc id="desc">A scale-free concept interface showing an enterprise mobility desk, waiting, loading, bicycle parking and a continuous accessible route. It is not an existing road, capacity or ownership plan.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2B"/><stop offset="1" stop-color="#123B4A"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".22"/></filter><style>.sans{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif}.title{font-size:32px;font-weight:800;fill:#F5FBFF}.sub{font-size:16px;fill:#A9C7D4}.label{font-size:18px;font-weight:800;fill:#F5FBFF}.small{font-size:14px;fill:#B8D2DB}.note{font-size:16px;fill:#D9EEF1}.head{font-size:17px;font-weight:800;fill:#66E3CA}.tag{font-size:13px;font-weight:800;fill:#0B2738}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><text x="70" y="58" class="sans" fill="#66E3CA" font-size="18" font-weight="900" letter-spacing="3">MOBILITY COMMONS / KEY AREA INTERFACE</text><text x="70" y="105" class="sans title">Zhongzhiyuan: put enterprise arrival on the ground</text><text x="70" y="138" class="sans sub">Scale-free concept interface · removable actions · not an existing road, station capacity or ownership plan</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="1040" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/><rect x="1150" y="180" width="380" height="700" rx="28" fill="#0B2738" stroke="#24556B" stroke-width="2"/></g>
  <rect x="120" y="235" width="930" height="250" rx="20" fill="#1D3444" stroke="#608396" stroke-width="2"/><text x="155" y="280" class="sans label">Enterprise ground floor and mobility desk</text><text x="155" y="310" class="sans small">Enterprise entry, human advice and public observation stay adjacent; upper massing is outside this drawing</text>
  <rect x="155" y="355" width="245" height="82" rx="14" fill="#5B8DEF"/><text x="277" y="390" text-anchor="middle" class="sans tag">Enterprise desk</text><text x="277" y="416" text-anchor="middle" class="sans tag">human / phone / paper</text><rect x="445" y="355" width="240" height="82" rx="14" fill="#2A9D8F"/><text x="565" y="390" text-anchor="middle" class="sans tag">Public observation</text><text x="565" y="416" text-anchor="middle" class="sans tag">owner and fallback visible</text><rect x="730" y="355" width="270" height="82" rx="14" fill="#7C3AED"/><text x="865" y="390" text-anchor="middle" class="sans tag">Closable test back-of-house</text><text x="865" y="416" text-anchor="middle" class="sans tag">keeps the public spine open</text>
  <rect x="120" y="520" width="930" height="88" rx="18" fill="#172B38" stroke="#FBBF24" stroke-width="4" stroke-dasharray="12 8"/><text x="155" y="573" class="sans label">Continuous public walking / accessible spine</text><text x="720" y="573" class="sans small">Keep a direct path first; hand over to a person when blocked</text><path d="M180 700 H1000" stroke="#66E3CA" stroke-width="22" stroke-linecap="round"/><circle cx="260" cy="700" r="14" fill="#fff"/><circle cx="560" cy="700" r="14" fill="#fff"/><circle cx="860" cy="700" r="14" fill="#fff"/>
  <rect x="155" y="750" width="230" height="70" rx="14" fill="#FBBF24"/><text x="270" y="792" text-anchor="middle" class="sans tag">Bicycle parking</text><rect x="430" y="750" width="245" height="70" rx="14" fill="#5B8DEF"/><text x="552" y="792" text-anchor="middle" class="sans tag">Shuttle waiting window</text><rect x="720" y="750" width="280" height="70" rx="14" fill="#E76F51"/><text x="860" y="792" text-anchor="middle" class="sans tag">Loading / fire clearance</text><path d="M270 437 V520 M565 437 V520 M865 437 V520" stroke="#9FC0CF" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="1190" y="235" class="sans head">What a person sees first</text><text x="1190" y="285" class="sans note">1  Start at the mobility desk</text><text x="1190" y="318" class="sans small">A person can explain the choice; digital access is not the only door</text><text x="1190" y="375" class="sans note">2  Keep the continuous spine</text><text x="1190" y="408" class="sans small">Shuttles, bicycles and loading do not cut the accessible route</text><text x="1190" y="465" class="sans note">3  Close the window when it conflicts</text><text x="1190" y="498" class="sans small">Human or public transport takes over; unresolved means stop</text><line x1="1190" y1="550" x2="1485" y2="550" stroke="#24556B"/><text x="1190" y="605" class="sans head">This drawing does not prove</text><text x="1190" y="650" class="sans small">Existing buildings, ownership, right-of-way or headways</text><text x="1190" y="682" class="sans small">Observed enterprise OD, capacity or fire clearance</text><text x="1190" y="714" class="sans small">An authorised shuttle or shared feeder service</text><rect x="1190" y="770" width="285" height="54" rx="14" fill="#3B1F3A" stroke="#F472B6" stroke-width="2"/><text x="1332" y="803" text-anchor="middle" class="sans" fill="#FBCFE8" font-size="15" font-weight="800">PROVISIONAL / FIELD REVIEW PENDING</text><text x="70" y="940" class="sans small">Interface drawing · removable ground actions only; survey, ownership, fire, OD, headway and public-participation evidence remain required</text>
</svg>
