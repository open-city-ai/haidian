<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="title desc">
  <title id="title">Disruption and weather stress test: ground fallback, slowest group and air gate</title>
  <desc id="desc">Three synthetic stress events, fallback coverage, slowest-group gap and recovery proxies, with an air-mobility hard gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFF"/><stop offset="1" stop-color="#EAF3F8"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1830"/><stop offset="1" stop-color="#163B5B"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17A398"/><stop offset="1" stop-color="#64D4BF"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3A63B"/><stop offset="1" stop-color="#FFD07A"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0B1830" flood-opacity=".12"/></filter>
    <style>
      .sans{font-family:Arial,sans-serif}.title{font-size:58px;font-weight:800;fill:#F7FBFF}.subtitle{font-size:25px;fill:#B8D4E3}.kicker{font-size:20px;font-weight:800;letter-spacing:3px;fill:#70D7C5}.h2{font-size:30px;font-weight:800;fill:#10243B}.small{font-size:19px;fill:#638097}.num{font-size:52px;font-weight:800;fill:#10243B}.label{font-size:19px;font-weight:700;fill:#486176}.tiny{font-size:16px;fill:#7691A3}.card{fill:#FFFFFF;stroke:#D6E5EC;stroke-width:2}.axis{stroke:#D5E3EB;stroke-width:2}
    </style>
  </defs>
  <rect width="2400" height="1700" fill="url(#bg)"/>
  <rect x="70" y="65" width="2260" height="330" rx="34" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="135" y="125" class="sans kicker">B3  /  MODEL v1.3  /  GROUND-FIRST RESILIENCE</text>
  <text x="135" y="205" class="sans title">Disruption and weather stress test</text>
  <text x="135" y="265" class="sans subtitle">Fallback coverage × slowest group × recovery time  |  1,000 normalized design units · synthetic sensitivity, not a baseline</text>
  <rect x="1965" y="115" width="285" height="76" rx="38" fill="#123E4B" stroke="#5ED6C2" stroke-width="2"/>
  <text x="2107" y="163" text-anchor="middle" class="sans" font-size="24" font-weight="800" fill="#7EE5D0">AIR CANDIDATE</text>
  <text x="2107" y="224" text-anchor="middle" class="sans" font-size="28" font-weight="800" fill="#FFD07A">BLOCKED / GATED</text>
  <text x="135" y="338" class="sans small" fill="#CFE5EF">Protect metro, bus, walking/wheelchair and human service first; the air layer is not a shortcut around evidence.</text>
  <rect x="70" y="440" width="1050" height="770" rx="28" class="card" filter="url(#shadow)"/>
  <text x="125" y="510" class="sans h2">Three events: can fallback absorb the shock?</text>
  <text x="125" y="552" class="sans small">Only unmet demand from an affected mode enters the declared ground fallback; coverage is not network completion.</text>
  <line x1="125" y1="625" x2="1030" y2="625" class="axis"/>
  <text x="125" y="605" class="sans tiny">Ground fallback coverage</text><text x="1030" y="605" text-anchor="end" class="sans tiny">target ≥ 70%</text>
  <line x1="760" y1="640" x2="760" y2="1035" stroke="#F3A63B" stroke-width="3" stroke-dasharray="10 12"/><text x="760" y="1066" text-anchor="middle" class="sans tiny" fill="#B27616">70% gate</text>
  <g class="sans">
    <text x="125" y="700" class="label">R0  Nominal ground-first</text><text x="1030" y="700" text-anchor="end" class="num">100%</text><rect x="125" y="720" width="850" height="34" rx="17" fill="#E5F1F2"/><rect x="125" y="720" width="850" height="34" rx="17" fill="url(#teal)"/><text x="125" y="792" class="small">No disruption · air candidate remains closed · ground network preserved</text>
    <text x="125" y="865" class="label">R1  Metro segment disruption · 30 min</text><text x="1030" y="865" text-anchor="end" class="num">76.92%</text><rect x="125" y="885" width="850" height="34" rx="17" fill="#E5F1F2"/><rect x="125" y="885" width="654" height="34" rx="17" fill="url(#teal)"/><text x="125" y="957" class="small">metro → bus · temporary bus reinforcement · wheelchair/care chains first</text>
    <text x="125" y="1030" class="label">R2  Severe weather: bicycle suppressed</text><text x="1030" y="1030" text-anchor="end" class="num">72.14%</text><rect x="125" y="1050" width="850" height="34" rx="17" fill="#E5F1F2"/><rect x="125" y="1050" width="613" height="34" rx="17" fill="url(#amber)"/><text x="125" y="1122" class="small">bicycle → bus · walking/wheelchair continuity does not depend on air mobility</text>
  </g>
  <rect x="1160" y="440" width="1170" height="770" rx="28" class="card" filter="url(#shadow)"/>
  <text x="1215" y="510" class="sans h2">Slowest-group guardrail: do not optimize averages alone</text>
  <text x="1215" y="552" class="sans small">Transparent proxy points must be replaced by grouped p90 and route audits before operation.</text>
  <text x="1215" y="635" class="sans label">Wheelchair-user group (slowest in both stress events)</text>
  <rect x="1215" y="675" width="1010" height="210" rx="22" fill="#F5F9FB" stroke="#DDEAF0" stroke-width="2"/>
  <text x="1260" y="730" class="sans small">Gap proxy points</text><text x="1260" y="790" class="sans num">12.20</text><text x="1450" y="790" class="sans small">R1 metro disruption</text><text x="1780" y="790" class="sans num">13.36</text><text x="1980" y="790" class="sans small">R2 severe weather</text>
  <rect x="1260" y="820" width="840" height="12" rx="6" fill="#E5EDF1"/><rect x="1260" y="820" width="427" height="12" rx="6" fill="url(#teal)"/><rect x="1260" y="852" width="840" height="12" rx="6" fill="#E5EDF1"/><rect x="1260" y="852" width="468" height="12" rx="6" fill="url(#amber)"/><text x="2130" y="830" class="sans tiny">24 max</text><text x="2130" y="862" class="sans tiny">24 max</text>
  <text x="1215" y="950" class="sans label">Recovery-time proxy</text><rect x="1215" y="985" width="1010" height="150" rx="22" fill="#F5F9FB" stroke="#DDEAF0" stroke-width="2"/>
  <text x="1260" y="1045" class="sans num">27.30 min</text><text x="1610" y="1045" class="sans small">R1 metro disruption</text><text x="1260" y="1100" class="sans num">30.04 min</text><text x="1610" y="1100" class="sans small">R2 severe weather</text><rect x="2030" y="1018" width="155" height="76" rx="38" fill="#E2F4EF"/><text x="2107" y="1065" text-anchor="middle" class="sans" font-size="21" font-weight="800" fill="#10766D">≤ 45 min</text>
  <rect x="70" y="1270" width="2260" height="320" rx="28" fill="#10243B" filter="url(#shadow)"/><text x="125" y="1340" class="sans" font-size="28" font-weight="800" fill="#F7FBFF">Fallback chain: event → ground service → review</text>
  <g class="sans"><rect x="125" y="1380" width="400" height="120" rx="18" fill="#193A54"/><text x="155" y="1430" font-size="22" font-weight="800" fill="#7EE5D0">01  Detect</text><text x="155" y="1470" font-size="18" fill="#CFE5EF">disruption / weather / cancellation log</text><path d="M550 1440 H650" stroke="#70D7C5" stroke-width="5"/><path d="M650 1440 l-18 -12 v24 z" fill="#70D7C5"/><rect x="680" y="1380" width="520" height="120" rx="18" fill="#193A54"/><text x="710" y="1430" font-size="22" font-weight="800" fill="#7EE5D0">02  Fallback</text><text x="710" y="1470" font-size="18" fill="#CFE5EF">metro / bicycle → bus; human service first</text><path d="M1225 1440 H1325" stroke="#70D7C5" stroke-width="5"/><path d="M1325 1440 l-18 -12 v24 z" fill="#70D7C5"/><rect x="1355" y="1380" width="430" height="120" rx="18" fill="#193A54"/><text x="1385" y="1430" font-size="22" font-weight="800" fill="#7EE5D0">03  Review</text><text x="1385" y="1470" font-size="18" fill="#CFE5EF">coverage / gap / p90 / complaints</text><path d="M1810 1440 H1910" stroke="#F3A63B" stroke-width="5"/><path d="M1910 1440 l-18 -12 v24 z" fill="#F3A63B"/><rect x="1940" y="1380" width="330" height="120" rx="18" fill="#3C2D29" stroke="#F3A63B" stroke-width="2"/><text x="1970" y="1430" font-size="22" font-weight="800" fill="#FFD07A">STOP / GO</text><text x="1970" y="1470" font-size="18" fill="#FFE4B0">redesign if a gate fails</text></g>
  <text x="125" y="1555" class="sans" font-size="18" fill="#A7C7D5">Synthetic stress test · grouped OD · no personal trajectories · air candidate is a gated future experiment, not a substitute for permits, insurance, noise, fire or operating evidence</text>
</svg>
