  <rect x="70" y="1240" width="2260" height="190" rx="28" fill="#102744" filter="url(#shadow)"/>
  <text x="115" y="1295" class="sans" fill="#7fe1d4" font-size="23" font-weight="800">READ THE TRADE-OFF</text>
  <text x="115" y="1350" class="sans white" font-size="27">Keep O4 as the nominal efficiency candidate; carry O2 as the stress-resilient shortlist.</text>
  <text x="115" y="1385" class="sans" fill="#b7ccdf" font-size="22">Both remain synthetic design-sandbox results, not local OD, capacity, weather, accessibility or satisfaction evidence.</text>
  <text x="115" y="1415" class="sans" fill="#b7ccdf" font-size="21">Any hard-gate breach stops expansion. Air remains outside the mode choice set. Source: regional-scale-commute.json / readout · 2026-08-09 · provisional boundary.</text>
