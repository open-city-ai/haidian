<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Robustness screen: enterprise–resident mobility under stress</title>
  <desc id="desc">Synthetic satisfaction and peak-load comparison for four candidate policies across nominal, metro disruption, severe weather and capacity shock scenarios. Not observed Haidian performance.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173555" flood-opacity=".12"/></filter>
    <linearGradient id="hero" x1="0" x2="1"><stop offset="0" stop-color="#102744"/><stop offset="1" stop-color="#174d61"/></linearGradient>
    <style>
      .sans{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .ink{fill:#102744}.muted{fill:#6e8eac}.white{fill:#fff}.teal{fill:#0e9f95}.coral{fill:#ef715a}
      .title{font-size:68px;font-weight:800}.h2{font-size:36px;font-weight:800}.body{font-size:27px}.small{font-size:22px}.value{font-size:48px;font-weight:800}
    </style>
  </defs>
  <rect width="2400" height="1500" fill="#f4f8f9"/>
  <rect x="70" y="60" width="2260" height="260" rx="34" fill="url(#hero)" filter="url(#shadow)"/>
    <text x="120" y="118" class="sans teal" font-size="27" font-weight="800" letter-spacing="3">MOBILITY COMMONS / v2.14 / ROBUSTNESS READOUT</text>
  <text x="120" y="204" class="sans white title">High satisfaction must survive stress</text>
  <text x="120" y="263" class="sans" font-size="29" fill="#b7ccdf">O1–O4 × four scenarios × 3.122M synthetic agents · worst case before efficiency · synthetic stress screen</text>
  <rect x="1900" y="104" width="340" height="58" rx="29" fill="#174462"/><text x="2070" y="142" text-anchor="middle" class="sans" font-size="22" fill="#7fe1d4" font-weight="800">LOCAL CALIBRATION OPEN</text>

  <g filter="url(#shadow)">
    <rect x="70" y="365" width="510" height="170" rx="26" fill="#fff"/><rect x="605" y="365" width="510" height="170" rx="26" fill="#eef7f5"/><rect x="1140" y="365" width="510" height="170" rx="26" fill="#fff3ef"/><rect x="1675" y="365" width="655" height="170" rx="26" fill="#102744"/>
  </g>
  <text x="110" y="420" class="sans muted small">NOMINAL WINNER</text><text x="110" y="488" class="sans ink value">O4 · 66.44</text><text x="110" y="520" class="sans muted small">capacity-balanced satisfaction proxy</text>
  <text x="645" y="420" class="sans muted small">ROBUST SCREEN WINNER</text><text x="645" y="488" class="sans teal value">O2 · 49.37</text><text x="645" y="520" class="sans muted small">worst-case satisfaction proxy</text>
  <text x="1180" y="420" class="sans muted small">GATE EXIT</text><text x="1180" y="488" class="sans coral value">O3 · 2.016×</text><text x="1180" y="520" class="sans muted small">capacity-shock peak load</text>
  <text x="1715" y="420" class="sans" fill="#b7ccdf" font-size="22">FULL REPLAY / AGGREGATE</text><text x="1715" y="488" class="sans white value">16 × 3.122M</text><text x="1715" y="520" class="sans" fill="#7fe1d4" font-size="22">no personal traces · air candidate blocked</text>

  <rect x="70" y="580" width="2260" height="610" rx="30" fill="#fff" stroke="#d8e6ea" stroke-width="3" filter="url(#shadow)"/>
  <text x="115" y="645" class="sans ink h2">CANDIDATE × STRESS MATRIX</text>
  <text x="115" y="687" class="sans muted body">Each cell: satisfaction proxy / peak mode load. Green dot = robust gate pass; red dot = stop and calibrate.</text>
  <text x="820" y="745" text-anchor="middle" class="sans ink" font-size="27" font-weight="800">N0 NOMINAL</text><text x="1190" y="745" text-anchor="middle" class="sans ink" font-size="27" font-weight="800">R1 METRO OUTAGE</text><text x="1560" y="745" text-anchor="middle" class="sans ink" font-size="27" font-weight="800">W1 WEATHER</text><text x="1930" y="745" text-anchor="middle" class="sans ink" font-size="27" font-weight="800">D1 CAPACITY SHOCK</text>
  <text x="2245" y="745" text-anchor="middle" class="sans muted" font-size="21">WORST</text>
  <line x1="700" y1="770" x2="2290" y2="770" stroke="#d8e6ea" stroke-width="3"/><line x1="700" y1="770" x2="700" y2="1125" stroke="#d8e6ea" stroke-width="3"/>
