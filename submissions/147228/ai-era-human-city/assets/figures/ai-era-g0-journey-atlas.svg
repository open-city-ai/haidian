<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#0b1324"/>
  <rect x="48" y="42" width="1504" height="94" rx="18" fill="#13213a" stroke="#38567f" stroke-width="2"/>
  <text x="82" y="84" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="31" font-weight="700">AI时代人的城 · G0普通人任务链回执</text>
  <text x="82" y="116" fill="#9eb5d7" font-family="Arial, sans-serif" font-size="17">进入 · 选择 · 有限服务 · 人工接管 · 申诉撤回 · 独立复演</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="1010" y="64" width="116" height="42" rx="12" fill="#2d5a86"/><text x="1028" y="91" fill="#f4f7fb">G0 概念</text>
    <rect x="1140" y="64" width="136" height="42" rx="12" fill="#6a3f45"/><text x="1158" y="91" fill="#f4f7fb">HOLD 未放行</text>
    <rect x="1290" y="64" width="230" height="42" rx="12" fill="#24344c"/><text x="1311" y="91" fill="#f4f7fb">0授权 · 0现场观察</text>
  </g>

  <text x="74" y="178" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="22" font-weight="700">四条路线先保留普通服务</text>
  <text x="74" y="207" fill="#9eb5d7" font-family="Arial, sans-serif" font-size="16">路线卡来自既有 ordinary journey contract，空间引用仍是概念层</text>
  <g font-family="Arial, sans-serif">
    <rect x="74" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="98" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-01 · SCN-03</text>
    <text x="98" y="296" fill="#f4f7fb" font-size="17">代际共学与人工入口</text>
    <text x="98" y="326" fill="#b9cbe3" font-size="15">P-01 · P-06 · PUBLIC-03</text>
    <text x="98" y="352" fill="#b9cbe3" font-size="15">普通路径 纸面 / 语音 / 人工</text>
    <text x="98" y="382" fill="#f5c26b" font-size="15" font-weight="700">缺人工接管即回到 G0</text>

    <rect x="446" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="470" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-02 · SCN-06</text>
    <text x="470" y="296" fill="#f4f7fb" font-size="17">市政服务与数据边界</text>
    <text x="470" y="326" fill="#b9cbe3" font-size="15">P-05 · SCN-06 · SERVICE-ZONE-02</text>
    <text x="470" y="352" fill="#b9cbe3" font-size="15">无数据调用的人工服务</text>
    <text x="470" y="382" fill="#f5c26b" font-size="15" font-weight="700">目的不清即暂停数据请求</text>

    <rect x="818" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="842" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-03 · SCN-04</text>
    <text x="842" y="296" fill="#f4f7fb" font-size="17">夜间服务与安全复核</text>
    <text x="842" y="326" fill="#b9cbe3" font-size="15">P-03 · PUBLIC-04 · LAND-07</text>
    <text x="842" y="352" fill="#b9cbe3" font-size="15">值守人员先确认普通路径</text>
    <text x="842" y="382" fill="#f5c26b" font-size="15" font-weight="700">缺安全复核不扩展时段</text>

    <rect x="1190" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="1214" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-04 · SCN-02</text>
    <text x="1214" y="296" fill="#f4f7fb" font-size="17">技能再造与自主选择</text>
    <text x="1214" y="326" fill="#b9cbe3" font-size="15">P-02 · PUBLIC-02 · LAND-03</text>
    <text x="1214" y="352" fill="#b9cbe3" font-size="15">人工咨询与选择权并列</text>
    <text x="1214" y="382" fill="#f5c26b" font-size="15" font-weight="700">退出不清即不自动分流</text>
  </g>

  <text x="74" y="474" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="22" font-weight="700">五步回执把服务交接写到动作里</text>
  <line x1="150" y1="585" x2="1450" y2="585" stroke="#4d76a7" stroke-width="6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="180" cy="585" r="30" fill="#4e9bd5"/><text x="180" y="592" fill="#0b1324" font-size="20" font-weight="700">01</text>
    <text x="180" y="535" fill="#f4f7fb" font-size="18" font-weight="700">进入并选择</text><text x="180" y="628" fill="#9eb5d7" font-size="14">普通路线保持可见</text>
    <circle cx="500" cy="585" r="30" fill="#4e9bd5"/><text x="500" y="592" fill="#0b1324" font-size="20" font-weight="700">02</text>
    <text x="500" y="535" fill="#f4f7fb" font-size="18" font-weight="700">请求有限服务</text><text x="500" y="628" fill="#9eb5d7" font-size="14">目的和数据范围先写清</text>
    <circle cx="820" cy="585" r="30" fill="#efb85d"/><text x="820" y="592" fill="#0b1324" font-size="20" font-weight="700">03</text>
    <text x="820" y="535" fill="#f4f7fb" font-size="18" font-weight="700">人工接管或冻结</text><text x="820" y="628" fill="#9eb5d7" font-size="14">危险延续前先停</text>
    <circle cx="1140" cy="585" r="30" fill="#efb85d"/><text x="1140" y="592" fill="#0b1324" font-size="20" font-weight="700">04</text>
    <text x="1140" y="535" fill="#f4f7fb" font-size="18" font-weight="700">申诉撤回并离开</text><text x="1140" y="628" fill="#9eb5d7" font-size="14">纸面、语音、人工可回退</text>
    <circle cx="1460" cy="585" r="30" fill="#efb85d"/><text x="1460" y="592" fill="#0b1324" font-size="20" font-weight="700">05</text>
    <text x="1460" y="535" fill="#f4f7fb" font-size="18" font-weight="700">独立复演</text><text x="1460" y="628" fill="#9eb5d7" font-size="14">扩展、返修或退出</text>
  </g>

  <rect x="74" y="690" width="700" height="238" rx="16" fill="#172b43" stroke="#496d98" stroke-width="2"/>
  <text x="100" y="728" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="21" font-weight="700">离线回放读数</text>
  <text x="100" y="766" fill="#c4d4e8" font-family="Arial, sans-serif" font-size="17">负例 5 / 5 · 控制 3 / 3 · 验收 6 / 6</text>
  <text x="100" y="800" fill="#c4d4e8" font-family="Arial, sans-serif" font-size="17">回退 5 / 5 · 路线 4 / 4 · 网络调用 0</text>
  <text x="100" y="838" fill="#f5c26b" font-family="Arial, sans-serif" font-size="17" font-weight="700">结果 not_run · 现场观察 0 · 性能 null</text>
  <text x="100" y="874" fill="#9eb5d7" font-family="Arial, sans-serif" font-size="15">结构回放只说明契约可读，不能替代现场证据</text>

  <rect x="802" y="690" width="738" height="238" rx="16" fill="#2a1d2e" stroke="#875767" stroke-width="2"/>
  <text x="828" y="728" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="21" font-weight="700">当前边界与写回位置</text>
  <text x="828" y="766" fill="#f6d9dc" font-family="Arial, sans-serif" font-size="17">授权 0 · baseline unknown · operational not_authorized_not_run</text>
  <text x="828" y="800" fill="#f6d9dc" font-family="Arial, sans-serif" font-size="17">每次选择、目的、接管、申诉、撤回和复演都留有字段</text>
  <text x="828" y="834" fill="#f6d9dc" font-family="Arial, sans-serif" font-size="17">缺少普通路径、人工角色或独立复演时保持 HOLD</text>
  <text x="828" y="874" fill="#cfa7b1" font-family="Arial, sans-serif" font-size="15">不提供居民体验、服务绩效、许可或实施结论</text>
</svg>
