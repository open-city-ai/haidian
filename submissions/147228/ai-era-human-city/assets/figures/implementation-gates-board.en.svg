<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 09 | Five project families: G0/G1 gates and exit actions</title>
<desc id="desc">Project families express responsibility, evidence and exit order only; no institution, budget, permit, procurement or implementation commitment The board is generated from local JSON contracts; it is not field performance, authorization, or an official score.</desc>
<rect width="1600" height="1000" fill="#f5f7fb"/>
<rect x="0" y="0" width="1600" height="124" rx="0" fill="#152442" stroke="none" stroke-width="2"/>
<text x="64" y="61" fill="#ffffff" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Figure 09 | Five project families: G0/G1 gates and exit actions</tspan></text>
<text x="66" y="99" fill="#c8d5ec" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="66" dy="0">Project families express responsibility, evidence and exit order only; no institution, budget, permit, procurement or implementation commitment</tspan></text>
<rect x="60" y="150" width="1480" height="62" rx="10" fill="#eaf2ff" stroke="#c9d8ed" stroke-width="2"/>
<text x="84" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="84" dy="0">Project family</tspan></text>
<text x="419" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="419" dy="0">G0 / G1 gate</tspan></text>
<text x="759" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="759" dy="0">Acceptance focus</tspan></text>
<text x="1079" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1079" dy="0">Exit action</tspan></text>
<rect x="60" y="224" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="254" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-01 Human buffer and</tspan><tspan x="84" dy="21">community retention</tspan></text>
<text x="419" y="254" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 规则公开与共创样本；G1: 专业复核</tspan></text>
<text x="759" y="254" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="759" dy="0">人工服务可达、退出协议、社区席位</tspan></text>
<text x="1079" y="254" fill="#7f3f32" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">投诉/不平等风险即暂停并公开修订</tspan></text>
<rect x="60" y="340" width="1480" height="98" rx="10" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="370" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-02 Reskilling and</tspan><tspan x="84" dy="21">night wellbeing</tspan></text>
<text x="419" y="370" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 导航原型；G1: 无障碍与夜间安全复核</tspan></text>
<text x="759" y="370" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="759" dy="0">人工咨询、可解释路径、夜间反馈</tspan></text>
<text x="1079" y="370" fill="#7f3f32" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">无人工兜底或风险无法解释即退出</tspan></text>
<rect x="60" y="456" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="486" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-03 City API and data</tspan><tspan x="84" dy="21">governance</tspan></text>
<text x="419" y="486" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 纸面协议；G1: 授权与安全审查</tspan></text>
<text x="759" y="486" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="759" dy="0">目的限定、撤销按钮、审计日志</tspan></text>
<text x="1079" y="486" fill="#7f3f32" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">授权失效/偏差投诉即冻结</tspan></text>
<rect x="60" y="572" width="1480" height="98" rx="10" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="602" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-04 Xiaoyue River</tspan><tspan x="84" dy="21">blue-green and</tspan><tspan x="84" dy="21">human-machine test</tspan></text>
<text x="419" y="602" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 图上规则；G1: 专项安全复核</tspan></text>
<text x="759" y="602" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="759" dy="0">人优先、停机、事件记录、生态边界</tspan></text>
<text x="1079" y="602" fill="#7f3f32" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">无许可/安全阈值/水文资料即不进入现场</tspan></text>
<rect x="60" y="688" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="718" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-05 Culture, landmarks</tspan><tspan x="84" dy="21">and global co-creation</tspan><tspan x="84" dy="21">loop</tspan></text>
<text x="419" y="718" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 叙事与活动原型；G1: 权利和场地复核</tspan></text>
<text x="759" y="718" fill="#36506f" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="759" dy="0">来源可追溯、文化审校、活动后 release note</tspan></text>
<text x="1079" y="718" fill="#7f3f32" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">来源无法证明或误导风险出现即撤展/修订</tspan></text>
<rect x="60" y="850" width="1480" height="78" rx="10" fill="#fff6dc" stroke="#e4a735" stroke-width="2"/>
<text x="82" y="884" fill="#6a4b00" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Public-service order: publish the problem and human route first, then authorize and review professionally; any missing</tspan><tspan x="82" dy="20">responsibility, evidence, rights or safety gate keeps G0, freezes or exits.</tspan></text>
</svg>
