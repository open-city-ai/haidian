<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">图 07｜普通人任务链与停止回路</title>
<desc id="desc">5 步任务 · 5 步回退 · 6 项验收 · 4/4 路线 · G0 概念回放，result_status=not_run The board is generated from local JSON contracts; it is not field performance, authorization, or an official score.</desc>
<rect width="1600" height="1000" fill="#f5f7fb"/>
<rect x="0" y="0" width="1600" height="124" rx="0" fill="#152442" stroke="none" stroke-width="2"/>
<text x="64" y="61" fill="#ffffff" font-family="Arial Unicode MS,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start"><tspan x="64" dy="0">图 07｜普通人任务链与停止回路</tspan></text>
<text x="66" y="99" fill="#c8d5ec" font-family="Arial Unicode MS,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="66" dy="0">5 步任务 · 5 步回退 · 6 项验收 · 4/4 路线 · G0 概念回放，result_status=not_run</tspan></text>
<rect x="70" y="154" width="1460" height="64" rx="12" fill="#eaf2ff" stroke="#c9d8ed" stroke-width="2"/>
<text x="88" y="194" fill="#172033" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="88" dy="0">步骤</tspan></text>
<text x="198" y="194" fill="#172033" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="198" dy="0">普通人要做什么</tspan></text>
<text x="668" y="194" fill="#172033" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="668" dy="0">必须留下什么</tspan></text>
<text x="1118" y="194" fill="#172033" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="1118" dy="0">不通过时的回退</tspan></text>
<rect x="70" y="236" width="1460" height="110" rx="12" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="90" y="281" fill="#245b8f" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="90" dy="0">J-01</tspan></text>
<text x="180" y="266" fill="#172033" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="180" dy="0">enter and choose an ordinary or</tspan><tspan x="180" dy="28">AI-assisted route</tspan></text>
<text x="650" y="266" fill="#36506f" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="650" dy="0">AC-01 · AC-02 · 4 fixture(s)</tspan></text>
<text x="1100" y="266" fill="#7f3f32" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1100" dy="0">freeze the AI-assisted route and keep</tspan><tspan x="1100" dy="27">ordinary service available</tspan></text>
<rect x="70" y="362" width="1460" height="110" rx="12" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="90" y="407" fill="#245b8f" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="90" dy="0">J-02</tspan></text>
<text x="180" y="392" fill="#172033" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="180" dy="0">request one bounded public service</tspan><tspan x="180" dy="28">with purpose and data scope</tspan></text>
<text x="650" y="392" fill="#36506f" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="650" dy="0">AC-01 · AC-03 · AC-06 · 3 fixture(s)</tspan></text>
<text x="1100" y="392" fill="#7f3f32" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1100" dy="0">remove the temporary data request and</tspan><tspan x="1100" dy="27">retain only the decision record</tspan></text>
<rect x="70" y="488" width="1460" height="110" rx="12" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="90" y="533" fill="#245b8f" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="90" dy="0">J-03</tspan></text>
<text x="180" y="518" fill="#172033" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="180" dy="0">trigger human takeover or freeze</tspan><tspan x="180" dy="28">before an unsafe continuation</tspan></text>
<text x="650" y="518" fill="#36506f" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="650" dy="0">AC-02 · AC-03 · 4 fixture(s)</tspan></text>
<text x="1100" y="518" fill="#7f3f32" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1100" dy="0">offer paper, voice, staffed, or</tspan><tspan x="1100" dy="27">physical-wayfinding alternatives</tspan></text>
<rect x="70" y="614" width="1460" height="110" rx="12" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="90" y="659" fill="#245b8f" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="90" dy="0">J-04</tspan></text>
<text x="180" y="644" fill="#172033" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="180" dy="0">appeal, delete, withdraw, or return to</tspan><tspan x="180" dy="28">a paper route</tspan></text>
<text x="650" y="644" fill="#36506f" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="650" dy="0">AC-04 · AC-06 · 4 fixture(s)</tspan></text>
<text x="1100" y="644" fill="#7f3f32" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1100" dy="0">publish the hold, complaint, and next</tspan><tspan x="1100" dy="27">review state</tspan></text>
<rect x="70" y="740" width="1460" height="110" rx="12" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="90" y="785" fill="#245b8f" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="90" dy="0">J-05</tspan></text>
<text x="180" y="770" fill="#172033" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="180" dy="0">independently replay evidence before</tspan><tspan x="180" dy="28">expand, repair, or exit</tspan></text>
<text x="650" y="770" fill="#36506f" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="650" dy="0">AC-05 · AC-06 · 1 fixture(s)</tspan></text>
<text x="1100" y="770" fill="#7f3f32" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1100" dy="0">return to G0 and reopen only after</tspan><tspan x="1100" dy="27">independent replay</tspan></text>
<rect x="70" y="882" width="1460" height="62" rx="12" fill="#fff6dc" stroke="#e4a735" stroke-width="2"/>
<text x="92" y="921" fill="#6a4b00" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="92" dy="0">回放证据：4/4 路线、6/6 验收、5/5 负例；全部保持 not_authorized_not_run，不是现场服务结果。</tspan></text>
</svg>
