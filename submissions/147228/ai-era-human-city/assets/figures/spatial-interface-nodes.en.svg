<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Figure 06 Node-level public interfaces for three key areas</title>
  <desc id="desc">Author-generated conceptual diagram using scale-free functional bands for ordinary arrival, human service, bounded state and freeze/exit; it does not represent statutory boundaries or engineering dimensions.</desc>
  <rect width="1600" height="1000" fill="#f5f7fb"/>
  <rect width="1600" height="132" fill="#152442"/>
  <text x="64" y="68" fill="#ffffff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Figure 06 | Node-level public interfaces</text>
  <text x="66" y="106" fill="#c8d5ec" font-family="Arial,sans-serif" font-size="20">Arrival → human service → bounded state → freeze/exit · functional_bands_only · provisional readout=min gap</text>
  <rect x="62" y="170" width="1476" height="680" rx="24" fill="#ffffff" stroke="#d0d9e8" stroke-width="3"/>
  <text x="270" y="218" fill="#5f708d" font-family="Arial,sans-serif" font-size="22">Relational reading of existing provisional anchors (not a map, redline, section, or massing)</text>
  <g font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#152442">
    <text x="270" y="282">Ordinary</text><text x="565" y="282">Human service</text><text x="885" y="282">Bounded</text><text x="1190" y="282">Freeze / exit</text>
  </g>
  <g stroke="#ffffff" stroke-width="4">
    <rect x="250" y="330" width="270" height="112" rx="16" fill="#2e66e6"/><rect x="535" y="330" width="290" height="112" rx="16" fill="#16847e"/><rect x="840" y="330" width="290" height="112" rx="16" fill="#e4a735"/><rect x="1145" y="330" width="300" height="112" rx="16" fill="#d65b3f"/>
    <rect x="250" y="500" width="270" height="112" rx="16" fill="#2e66e6"/><rect x="535" y="500" width="290" height="112" rx="16" fill="#16847e"/><rect x="840" y="500" width="290" height="112" rx="16" fill="#e4a735"/><rect x="1145" y="500" width="300" height="112" rx="16" fill="#d65b3f"/>
    <rect x="250" y="670" width="270" height="112" rx="16" fill="#2e66e6"/><rect x="535" y="670" width="290" height="112" rx="16" fill="#16847e"/><rect x="840" y="670" width="290" height="112" rx="16" fill="#e4a735"/><rect x="1145" y="670" width="300" height="112" rx="16" fill="#d65b3f"/>
  </g>
  <g fill="#ffffff" font-family="Arial,sans-serif" font-size="25" font-weight="700">
    <text x="280" y="378">Ordinary route / see</text><text x="565" y="378">Staff desk / explain</text><text x="870" y="378">Limited consent / test</text><text x="1175" y="378">Stop / fallback</text>
    <text x="280" y="548">Daily arrival / stay</text><text x="565" y="548">Paper / phone / staff</text><text x="870" y="548">Voluntary learning</text><text x="1175" y="548">Recover / exit</text>
    <text x="280" y="718">Cultural arrival</text><text x="565" y="718">Multilingual consent</text><text x="870" y="718">Withdrawable display</text><text x="1175" y="718">Redress / night</text>
  </g>
  <g fill="#5f708d" font-family="Arial,sans-serif" font-size="16">
    <text x="250" y="468">GeoJSON anchor minimum vertex separation: 1.97 / 2.54 / 2.33 km (not route length)</text>
    <text x="250" y="638">GeoJSON anchor minimum vertex separation: 3.24 / 0.09 / 3.42 km (not route length)</text>
    <text x="250" y="808">GeoJSON anchor minimum vertex separation: 0.12 / 1.62 / 0.33 km (not route length)</text>
  </g>
  <g fill="#152442" font-family="Arial,sans-serif" font-size="24" font-weight="700">
    <text x="92" y="396">01 ZHONG</text><text x="92" y="566">02 AI ORIGIN</text><text x="92" y="736">03 DAZHONGSI</text>
  </g>
  <g fill="#5f708d" font-family="Arial,sans-serif" font-size="19">
    <text x="250" y="892">Readout = provisional GeoJSON minimum gaps, rounded to 10 m; not an access distance; recompute with formal data.</text>
    <text x="250" y="926">Evidence: anchors + package JSON + human fallback. No route, permit, deployment, operator, or performance claim.</text>
  </g>
</svg>
