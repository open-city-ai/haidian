<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>v2.1 Seven-dimension professional review evidence map</title>
  <desc>Submission-owned evidence map, not an official score; provisional boundary and not-run status remain visible.</desc>
  <rect width="1600" height="1000" fill="#f5f8fc"/>
  <rect x="36" y="30" width="1528" height="120" rx="24" fill="#14213d"/>
  <text x="76" y="78" fill="#8bd3ff" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">AI-ERA HUMAN CITY · V2.1</text>
  <text x="76" y="119" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Seven-dimension professional review evidence map</text>
  <text x="1160" y="82" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">REVIEW MAP</text>
  <text x="1160" y="112" fill="#d7e8f7" font-family="Arial, sans-serif" font-size="16">28 evidence refs · 7 questions</text>
  <text x="1160" y="137" fill="#ffd27d" font-family="Arial, sans-serif" font-size="14">not an official score</text>

  <g font-family="Arial, sans-serif">
    <rect x="36" y="176" width="368" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/><rect x="36" y="176" width="368" height="12" rx="6" fill="#1976d2"/>
    <text x="62" y="225" fill="#1976d2" font-size="22" font-weight="700">01 · Brief alignment</text><text x="62" y="260" fill="#1b2938" font-size="18">Does the brief become a traceable chain?</text><text x="62" y="303" fill="#50607a" font-size="15">taskbook · scenarios · spatial anchors</text><text x="62" y="328" fill="#50607a" font-size="15">compliance matrix · GeoJSON</text><text x="62" y="379" fill="#7d4b00" font-size="14">Next gate: official boundary and annexes</text><text x="62" y="422" fill="#6b7280" font-size="13">Structural evidence, not an official score</text>

    <rect x="424" y="176" width="368" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/><rect x="424" y="176" width="368" height="12" rx="6" fill="#7b61a8"/>
    <text x="450" y="225" fill="#684e94" font-size="22" font-weight="700">02 · Differentiation</text><text x="450" y="260" fill="#1b2938" font-size="18">More than an AI label on a plan?</text><text x="450" y="303" fill="#50607a" font-size="15">ordinary arrival → staffed takeover</text><text x="450" y="328" fill="#50607a" font-size="15">bounded simulation → freeze/exit</text><text x="450" y="379" fill="#7d4b00" font-size="14">Next gate: entry conditions and observers</text><text x="450" y="422" fill="#6b7280" font-size="13">Counterfactual option, not a site result</text>

    <rect x="812" y="176" width="368" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/><rect x="812" y="176" width="368" height="12" rx="6" fill="#00897b"/>
    <text x="838" y="225" fill="#00796b" font-size="22" font-weight="700">03 · AI-native innovation</text><text x="838" y="260" fill="#1b2938" font-size="18">Can machine interfaces stop and be liable?</text><text x="838" y="303" fill="#50607a" font-size="15">authorization · logs · human takeover · G0</text><text x="838" y="328" fill="#50607a" font-size="15">ordinary movement stays protected</text><text x="838" y="379" fill="#7d4b00" font-size="14">Next gate: data and safety rehearsal</text><text x="838" y="422" fill="#6b7280" font-size="13">Rule prototype, not deployment or permit</text>

    <rect x="1200" y="176" width="364" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/><rect x="1200" y="176" width="364" height="12" rx="6" fill="#ef8a25"/>
    <text x="1226" y="225" fill="#c56508" font-size="22" font-weight="700">04 · Deepening path</text><text x="1226" y="260" fill="#1b2938" font-size="18">What is the G0-to-review order?</text><text x="1226" y="303" fill="#50607a" font-size="15">roles · acceptance · freeze · exit</text><text x="1226" y="328" fill="#50607a" font-size="15">no construction or funding promise</text><text x="1226" y="379" fill="#7d4b00" font-size="14">Next gate: rights, fire, accessibility</text><text x="1226" y="422" fill="#6b7280" font-size="13">Process evidence, not engineering commitment</text>

    <rect x="36" y="500" width="480" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/><rect x="36" y="500" width="480" height="12" rx="6" fill="#d64b73"/>
    <text x="62" y="549" fill="#b8325b" font-size="22" font-weight="700">05 · Public interest</text><text x="62" y="584" fill="#1b2938" font-size="18">Who stays outside an automated gate?</text><text x="62" y="627" fill="#50607a" font-size="15">residents/older people · at-risk workers</text><text x="62" y="652" fill="#50607a" font-size="15">paper/voice · staff · appeal · exit</text><text x="62" y="703" fill="#7d4b00" font-size="14">Next gate: community and access walk-through</text><text x="62" y="746" fill="#6b7280" font-size="13">Design lens, not demographic or jobs data</text>

    <rect x="536" y="500" width="480" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/><rect x="536" y="500" width="480" height="12" rx="6" fill="#4d8d5d"/>
    <text x="562" y="549" fill="#317141" font-size="22" font-weight="700">06 · Risk and compliance</text><text x="562" y="584" fill="#1b2938" font-size="18">Are formal, background and provisional layers clear?</text><text x="562" y="627" fill="#50607a" font-size="15">source registry · rights ledger</text><text x="562" y="652" fill="#50607a" font-size="15">no authorization/responsibility/safety → G0</text><text x="562" y="703" fill="#7d4b00" font-size="14">Next gate: official annexes and responsibility</text><text x="562" y="746" fill="#6b7280" font-size="13">Boundary disclosure, not compliance approval</text>

    <rect x="1036" y="500" width="528" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/><rect x="1036" y="500" width="528" height="12" rx="6" fill="#3f6791"/>
    <text x="1062" y="549" fill="#2c5277" font-size="22" font-weight="700">07 · Expression and traceability</text><text x="1062" y="584" fill="#1b2938" font-size="18">Can maps, HTML and PDF return to one evidence set?</text><text x="1062" y="627" fill="#50607a" font-size="15">GeoJSON · metrics · bilingual · 28 refs</text><text x="1062" y="652" fill="#50607a" font-size="15">deterministic runner · full-recompute trigger</text><text x="1062" y="703" fill="#7d4b00" font-size="14">Next gate: professional visual and text review</text><text x="1062" y="746" fill="#6b7280" font-size="13">Traceable expression, not merge or publication</text>
  </g>

  <rect x="36" y="836" width="1528" height="110" rx="18" fill="#e9f2fb" stroke="#b9cbe0"/>
  <text x="64" y="878" fill="#14213d" font-family="Arial, sans-serif" font-size="17" font-weight="700">Review order</text>
  <text x="64" y="910" fill="#32445a" font-family="Arial, sans-serif" font-size="15">Brief → differentiation → spatial rules → G0 gates → public interest → risk layers → visual readback; any official-data change triggers geometry / metrics / figures / HTML / PDF / self-check together.</text>
  <text x="64" y="934" fill="#7d4b00" font-family="Arial, sans-serif" font-size="14">official_boundary=false · geometry_role=provisional_constraint · operational_status=not_authorized_not_run · performance_results=null · not_an_official_score=true</text>
</svg>
