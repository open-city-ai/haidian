<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#080b12"/>
  <g font-family="Arial, 'Noto Sans CJK SC', sans-serif" fill="#f4f0e8">
    <text x="80" y="78" font-size="32" font-weight="700">AI 时代人的城｜空间裁决回执</text>
    <text x="80" y="114" font-size="16" fill="#9da8b8">先保留普通路径，再决定 AI 如何进入空间 · HOLD / 概念桌面回放</text>
    <text x="80" y="165" font-size="18" fill="#ffc46b">三种空间组织</text>
    <g transform="translate(80 195)">
      <rect width="450" height="300" rx="10" fill="#151a24" stroke="#d96b6b" stroke-width="2"/>
      <text x="26" y="48" font-size="22" font-weight="700">ALT-A  AI 展台脊</text>
      <text x="26" y="84" font-size="17" fill="#ff9c9c">REJECT</text>
      <text x="26" y="125" font-size="16">设备前台占据公共主界面</text>
      <text x="26" y="158" font-size="16">普通、无屏和人工路径被降级</text>
      <text x="26" y="214" font-size="15" fill="#ffb2b2">普通路径未独立保护</text>
      <text x="26" y="250" font-size="14" fill="#9da8b8">拒绝：不得用展示效果换取公共入口</text>
    </g>
    <g transform="translate(575 195)">
      <rect width="450" height="300" rx="10" fill="#151a24" stroke="#e0a45c" stroke-width="2"/>
      <text x="26" y="48" font-size="22" font-weight="700">ALT-B  三个 AI 房间</text>
      <text x="26" y="84" font-size="17" fill="#ffc46b">REVISE</text>
      <text x="26" y="125" font-size="16">各自封闭，能隔离测试风险</text>
      <text x="26" y="158" font-size="16">但维护、申诉和公共资产无共用回执</text>
      <text x="26" y="214" font-size="15" fill="#ffd18d">交接责任被拆散</text>
      <text x="26" y="250" font-size="14" fill="#9da8b8">返修：先补跨节点公共 closeout</text>
    </g>
    <g transform="translate(1070 195)">
      <rect width="450" height="300" rx="10" fill="#111f24" stroke="#64d5b5" stroke-width="3"/>
      <text x="26" y="48" font-size="22" font-weight="700">ALT-C  人本脊 + 可撤回岛</text>
      <text x="26" y="84" font-size="17" fill="#72e1bd">ADVANCE TO DESIGN REVIEW</text>
      <text x="26" y="125" font-size="16">普通、纸面、人工和无障碍先行</text>
      <text x="26" y="158" font-size="16">AI 组件可暂停、可移除、可复演</text>
      <text x="26" y="214" font-size="15" fill="#9bffe0">选中：进入专业深化，但仍 HOLD</text>
      <text x="26" y="250" font-size="14" fill="#9da8b8">先补：节点走读、接管、申诉回读</text>
    </g>
    <text x="80" y="555" font-size="18" fill="#ffc46b">尺度链：先问城市关系，再问可读的交接界面</text>
    <g stroke="#5dabff" stroke-width="3" fill="none">
      <path d="M115 650 H1480"/>
      <path d="M1480 650 l-18 -10 M1480 650 l-18 10"/>
    </g>
    <g fill="#5dabff">
      <circle cx="180" cy="650" r="11"/><circle cx="490" cy="650" r="11"/><circle cx="800" cy="650" r="11"/><circle cx="1110" cy="650" r="11"/><circle cx="1420" cy="650" r="11"/>
    </g>
    <g font-size="16">
      <text x="150" y="690">1:5000</text><text x="458" y="690">1:2000</text><text x="770" y="690">1:500</text><text x="1080" y="690">1:100</text><text x="1390" y="690">1:50</text>
      <text x="125" y="725" fill="#9da8b8">人本脊</text><text x="430" y="725" fill="#9da8b8">三节点</text><text x="720" y="725" fill="#9da8b8">普通入口</text><text x="1030" y="725" fill="#9da8b8">接管/申诉</text><text x="1350" y="725" fill="#9da8b8">可拆组件</text>
    </g>
    <text x="80" y="790" font-size="17" fill="#ffc46b">五项公共权利</text>
    <text x="300" y="790" font-size="16">普通可达 · 非数字等价 · 无障碍连续 · 同意/申诉/退出 · 公共资产/隐私</text>
    <text x="80" y="835" font-size="16" fill="#9da8b8">0 授权 · 0 现场观察 · baseline unknown · not_authorized_not_run · 无现场声明</text>
  </g>
</svg>
