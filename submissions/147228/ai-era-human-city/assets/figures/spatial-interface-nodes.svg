<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">图06 三处重点区节点级公共接口</title>
  <desc id="desc">原创概念示意图，以无尺度功能带表达普通到达、人工服务、受控状态和冻结退出，不表示法定边界或工程尺寸。</desc>
  <rect width="1600" height="1000" fill="#f5f7fb"/>
  <rect width="1600" height="132" fill="#152442"/>
  <text x="64" y="68" fill="#ffffff" font-family="Arial Unicode MS,Arial,sans-serif" font-size="48" font-weight="700">图 06｜三处重点区：节点级公共接口</text>
  <text x="66" y="106" fill="#c8d5ec" font-family="Arial Unicode MS,Arial,sans-serif" font-size="21">普通到达 → 人工解释/服务 → 受控状态 → 冻结复盘/退出 · functional_bands_only · provisional readout=最小顶点间距</text>
  <rect x="62" y="170" width="1476" height="680" rx="24" fill="#ffffff" stroke="#d0d9e8" stroke-width="3"/>
  <text x="270" y="218" fill="#5f708d" font-family="Arial Unicode MS,Arial,sans-serif" font-size="22">既有 provisional 锚点的关系阅读（不是地图、红线、断面或体量）</text>
  <g font-family="Arial Unicode MS,Arial,sans-serif" font-size="24" font-weight="700" fill="#152442">
    <text x="270" y="282">普通到达</text><text x="565" y="282">人工解释/服务</text><text x="885" y="282">受控状态</text><text x="1190" y="282">冻结/复盘/退出</text>
  </g>
  <g stroke="#ffffff" stroke-width="4">
    <rect x="250" y="330" width="270" height="112" rx="16" fill="#2e66e6"/><rect x="535" y="330" width="290" height="112" rx="16" fill="#16847e"/><rect x="840" y="330" width="290" height="112" rx="16" fill="#e4a735"/><rect x="1145" y="330" width="300" height="112" rx="16" fill="#d65b3f"/>
    <rect x="250" y="500" width="270" height="112" rx="16" fill="#2e66e6"/><rect x="535" y="500" width="290" height="112" rx="16" fill="#16847e"/><rect x="840" y="500" width="290" height="112" rx="16" fill="#e4a735"/><rect x="1145" y="500" width="300" height="112" rx="16" fill="#d65b3f"/>
    <rect x="250" y="670" width="270" height="112" rx="16" fill="#2e66e6"/><rect x="535" y="670" width="290" height="112" rx="16" fill="#16847e"/><rect x="840" y="670" width="290" height="112" rx="16" fill="#e4a735"/><rect x="1145" y="670" width="300" height="112" rx="16" fill="#d65b3f"/>
  </g>
  <g fill="#ffffff" font-family="Arial Unicode MS,Arial,sans-serif" font-size="25" font-weight="700">
    <text x="280" y="378">普通路径 / 观察</text><text x="565" y="378">人工台 / 解释</text><text x="870" y="378">有限授权 / 模拟</text><text x="1175" y="378">停止 / 回退</text>
    <text x="280" y="548">日常到达 / 停留</text><text x="565" y="548">纸面 / 电话 / 人工</text><text x="870" y="548">自愿学习 / 辅助</text><text x="1175" y="548">恢复 / 退出</text>
    <text x="280" y="718">文化到达 / 通行</text><text x="565" y="718">多语解释 / 授权</text><text x="870" y="718">可撤回展示</text><text x="1175" y="718">申诉 / 夜间回退</text>
  </g>
  <g fill="#5f708d" font-family="Arial Unicode MS,Arial,sans-serif" font-size="16">
    <text x="250" y="468">GeoJSON 锚点最小顶点间距：1.97 / 2.54 / 2.33 km（不是路线长度）</text>
    <text x="250" y="638">GeoJSON 锚点最小顶点间距：3.24 / 0.09 / 3.42 km（不是路线长度）</text>
    <text x="250" y="808">GeoJSON 锚点最小顶点间距：0.12 / 1.62 / 0.33 km（不是路线长度）</text>
  </g>
  <g fill="#152442" font-family="Arial Unicode MS,Arial,sans-serif" font-size="24" font-weight="700">
    <text x="92" y="396">01 众智园</text><text x="92" y="566">02 原点社区</text><text x="92" y="736">03 大钟寺</text>
  </g>
  <g fill="#5f708d" font-family="Arial Unicode MS,Arial,sans-serif" font-size="19">
    <text x="250" y="892">读数由现有 provisional GeoJSON 派生并四舍五入到 10 m；相邻段不可相加成通行距离，正式资料到位后必须重算。</text>
    <text x="250" y="926">Evidence chain: GeoJSON anchors + package JSON + human fallback. No route, permit, deployment, operator, or performance claim.</text>
  </g>
</svg>
