<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#080b12"/>
  <g font-family="Arial, sans-serif" fill="#f4f0e8">
    <text x="80" y="78" font-size="32" font-weight="700">A City for People in the AI Era | Spatial Decision Receipt</text>
    <text x="80" y="114" font-size="16" fill="#9da8b8">Protect ordinary routes first, then decide how AI enters space · HOLD / synthetic tabletop</text>
    <text x="80" y="165" font-size="18" fill="#ffc46b">Three spatial organizations</text>
    <g transform="translate(80 195)"><rect width="450" height="300" rx="10" fill="#151a24" stroke="#d96b6b" stroke-width="2"/><text x="26" y="48" font-size="22" font-weight="700">ALT-A  AI showcase spine</text><text x="26" y="84" font-size="17" fill="#ff9c9c">REJECT</text><text x="26" y="125" font-size="16">Device frontage becomes the default</text><text x="26" y="158" font-size="16">Ordinary and staffed routes are secondary</text><text x="26" y="214" font-size="15" fill="#ffb2b2">Ordinary route not independently protected</text><text x="26" y="250" font-size="14" fill="#9da8b8">Reject: display value cannot buy the public entrance</text></g>
    <g transform="translate(575 195)"><rect width="450" height="300" rx="10" fill="#151a24" stroke="#e0a45c" stroke-width="2"/><text x="26" y="48" font-size="22" font-weight="700">ALT-B  Three AI rooms</text><text x="26" y="84" font-size="17" fill="#ffc46b">REVISE</text><text x="26" y="125" font-size="16">Separate rooms contain test risk</text><text x="26" y="158" font-size="16">Maintenance, appeal and public assets split</text><text x="26" y="214" font-size="15" fill="#ffd18d">Handoff ownership is fragmented</text><text x="26" y="250" font-size="14" fill="#9da8b8">Revise: add a shared public closeout</text></g>
    <g transform="translate(1070 195)"><rect width="450" height="300" rx="10" fill="#111f24" stroke="#64d5b5" stroke-width="3"/><text x="26" y="48" font-size="22" font-weight="700">ALT-C  Human spine + reversible islands</text><text x="26" y="84" font-size="17" fill="#72e1bd">ADVANCE TO DESIGN REVIEW</text><text x="26" y="125" font-size="16">Ordinary, paper, staffed and accessible first</text><text x="26" y="158" font-size="16">AI components pause, withdraw and replay</text><text x="26" y="214" font-size="15" fill="#9bffe0">Selected: deepen, but remain HOLD</text><text x="26" y="250" font-size="14" fill="#9da8b8">Next: node walk, takeover, appeal readback</text></g>
    <text x="80" y="555" font-size="18" fill="#ffc46b">Scale chain: from city relationship to readable handoff</text>
    <g stroke="#5dabff" stroke-width="3" fill="none"><path d="M115 650 H1480"/><path d="M1480 650 l-18 -10 M1480 650 l-18 10"/></g><g fill="#5dabff"><circle cx="180" cy="650" r="11"/><circle cx="490" cy="650" r="11"/><circle cx="800" cy="650" r="11"/><circle cx="1110" cy="650" r="11"/><circle cx="1420" cy="650" r="11"/></g>
    <g font-size="16"><text x="150" y="690">1:5000</text><text x="458" y="690">1:2000</text><text x="770" y="690">1:500</text><text x="1080" y="690">1:100</text><text x="1390" y="690">1:50</text><text x="125" y="725" fill="#9da8b8">commons spine</text><text x="430" y="725" fill="#9da8b8">three nodes</text><text x="720" y="725" fill="#9da8b8">ordinary entry</text><text x="1030" y="725" fill="#9da8b8">takeover/appeal</text><text x="1350" y="725" fill="#9da8b8">removable part</text></g>
    <text x="80" y="790" font-size="17" fill="#ffc46b">Five public rights</text><text x="300" y="790" font-size="16">ordinary access · non-digital equivalence · accessible continuity · consent/appeal/exit · public asset/privacy</text>
    <text x="80" y="835" font-size="16" fill="#9da8b8">0 authorizations · 0 field observations · baseline unknown · not_authorized_not_run · no field claims</text>
  </g>
</svg>
