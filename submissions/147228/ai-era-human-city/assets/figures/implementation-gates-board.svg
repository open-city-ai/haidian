<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">图 09｜五个项目族的 G0/G1 门与退出动作</title>
<desc id="desc">项目族只表达责任、证据和退出顺序；不构成机构、预算、许可、采购或实施承诺 The board is generated from local JSON contracts; it is not field performance, authorization, or an official score.</desc>
<rect width="1600" height="1000" fill="#f5f7fb"/>
<rect x="0" y="0" width="1600" height="124" rx="0" fill="#152442" stroke="none" stroke-width="2"/>
<text x="64" y="61" fill="#ffffff" font-family="Arial Unicode MS,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start"><tspan x="64" dy="0">图 09｜五个项目族的 G0/G1 门与退出动作</tspan></text>
<text x="66" y="99" fill="#c8d5ec" font-family="Arial Unicode MS,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="66" dy="0">项目族只表达责任、证据和退出顺序；不构成机构、预算、许可、采购或实施承诺</tspan></text>
<rect x="60" y="150" width="1480" height="62" rx="10" fill="#eaf2ff" stroke="#c9d8ed" stroke-width="2"/>
<text x="84" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="84" dy="0">项目族</tspan></text>
<text x="419" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="419" dy="0">G0 / G1 时间门</tspan></text>
<text x="759" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="759" dy="0">验收焦点</tspan></text>
<text x="1079" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1079" dy="0">退出动作</tspan></text>
<rect x="60" y="224" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="254" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-01 人本缓冲与社区保留</tspan></text>
<text x="419" y="254" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 规则公开与共创样本；G1: 专业复核</tspan></text>
<text x="759" y="254" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="759" dy="0">人工服务可达、退出协议、社区席位</tspan></text>
<text x="1079" y="254" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">投诉/不平等风险即暂停并公开修订</tspan></text>
<rect x="60" y="340" width="1480" height="98" rx="10" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="370" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-02 技能再造与夜间健康</tspan></text>
<text x="419" y="370" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 导航原型；G1: 无障碍与夜间安全复</tspan><tspan x="419" dy="20">核</tspan></text>
<text x="759" y="370" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="759" dy="0">人工咨询、可解释路径、夜间反馈</tspan></text>
<text x="1079" y="370" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">无人工兜底或风险无法解释即退出</tspan></text>
<rect x="60" y="456" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="486" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-03 城市 API 与数据治理</tspan></text>
<text x="419" y="486" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 纸面协议；G1: 授权与安全审查</tspan></text>
<text x="759" y="486" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="759" dy="0">目的限定、撤销按钮、审计日志</tspan></text>
<text x="1079" y="486" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">授权失效/偏差投诉即冻结</tspan></text>
<rect x="60" y="572" width="1480" height="98" rx="10" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="602" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-04 小月河蓝绿与人机测试</tspan></text>
<text x="419" y="602" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 图上规则；G1: 专项安全复核</tspan></text>
<text x="759" y="602" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="759" dy="0">人优先、停机、事件记录、生态边界</tspan></text>
<text x="1079" y="602" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">无许可/安全阈值/水文资料即不进入现场</tspan></text>
<rect x="60" y="688" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="718" fill="#172033" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-05 文化、地标与全球共创循环</tspan></text>
<text x="419" y="718" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="419" dy="0">G0: 叙事与活动原型；G1: 权利和场地复</tspan><tspan x="419" dy="20">核</tspan></text>
<text x="759" y="718" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="759" dy="0">来源可追溯、文化审校、活动后</tspan><tspan x="759" dy="20">release note</tspan></text>
<text x="1079" y="718" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1079" dy="0">来源无法证明或误导风险出现即撤展/修订</tspan></text>
<rect x="60" y="850" width="1480" height="78" rx="10" fill="#fff6dc" stroke="#e4a735" stroke-width="2"/>
<text x="82" y="884" fill="#6a4b00" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="82" dy="0">公共服务顺序：先公开问题与人工入口，再做授权/专业复核；任何责任、证据、权利或安全门缺失，保持 G0、冻结或退出。</tspan></text>
</svg>
