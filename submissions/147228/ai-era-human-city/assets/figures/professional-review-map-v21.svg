<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>v2.1 七维专业审阅证据地图</title>
  <desc>投稿自有的证据回读地图，不是官方评分；临时边界与未运行状态保持可见。</desc>
  <rect width="1600" height="1000" fill="#f5f8fc"/>
  <rect x="36" y="30" width="1528" height="120" rx="24" fill="#14213d"/>
  <text x="76" y="78" fill="#8bd3ff" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">AI-ERA HUMAN CITY · V2.1</text>
  <text x="76" y="119" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">七维专业审阅证据地图</text>
  <text x="1160" y="82" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">REVIEW MAP</text>
  <text x="1160" y="112" fill="#d7e8f7" font-family="Arial, sans-serif" font-size="16">28 evidence refs · 7 questions</text>
  <text x="1160" y="137" fill="#ffd27d" font-family="Arial, sans-serif" font-size="14">not an official score</text>

  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="36" y="176" width="368" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/>
    <rect x="36" y="176" width="368" height="12" rx="6" fill="#1976d2"/>
    <text x="62" y="225" fill="#1976d2" font-size="22" font-weight="700">01 · 任务对齐</text>
    <text x="62" y="260" fill="#1b2938" font-size="18">任务是否落成可回读链？</text>
    <text x="62" y="303" fill="#50607a" font-size="15">任务书 · 场景卡 · 空间锚点</text>
    <text x="62" y="328" fill="#50607a" font-size="15">compliance_matrix · GeoJSON</text>
    <text x="62" y="379" fill="#7d4b00" font-size="14">下一门：官方边界与公告附件</text>
    <text x="62" y="422" fill="#6b7280" font-size="13">结构对齐证据，不是官方评分</text>

    <rect x="424" y="176" width="368" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/>
    <rect x="424" y="176" width="368" height="12" rx="6" fill="#7b61a8"/>
    <text x="450" y="225" fill="#684e94" font-size="22" font-weight="700">02 · 差异化主张</text>
    <text x="450" y="260" fill="#1b2938" font-size="18">不是给传统方案贴 AI 标签</text>
    <text x="450" y="303" fill="#50607a" font-size="15">普通到达 → 人工接管</text>
    <text x="450" y="328" fill="#50607a" font-size="15">受限模拟 → 冻结退出</text>
    <text x="450" y="379" fill="#7d4b00" font-size="14">下一门：入口现状与公众观察</text>
    <text x="450" y="422" fill="#6b7280" font-size="13">反事实设计选项，不是现状结果</text>

    <rect x="812" y="176" width="368" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/>
    <rect x="812" y="176" width="368" height="12" rx="6" fill="#00897b"/>
    <text x="838" y="225" fill="#00796b" font-size="22" font-weight="700">03 · AI 原生创新</text>
    <text x="838" y="260" fill="#1b2938" font-size="18">机器接口能暂停、可追责吗？</text>
    <text x="838" y="303" fill="#50607a" font-size="15">授权 · 日志 · 人工接管 · G0</text>
    <text x="838" y="328" fill="#50607a" font-size="15">普通通行不被测试占用</text>
    <text x="838" y="379" fill="#7d4b00" font-size="14">下一门：数据授权与安全演练</text>
    <text x="838" y="422" fill="#6b7280" font-size="13">规则原型证据，不是部署许可</text>

    <rect x="1200" y="176" width="364" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/>
    <rect x="1200" y="176" width="364" height="12" rx="6" fill="#ef8a25"/>
    <text x="1226" y="225" fill="#c56508" font-size="22" font-weight="700">04 · 实施可深化性</text>
    <text x="1226" y="260" fill="#1b2938" font-size="18">G0 到专业复核的顺序？</text>
    <text x="1226" y="303" fill="#50607a" font-size="15">角色 · 验收 · 冻结 · 退出</text>
    <text x="1226" y="328" fill="#50607a" font-size="15">不承诺建设、资金或运营</text>
    <text x="1226" y="379" fill="#7d4b00" font-size="14">下一门：权属、消防、无障碍</text>
    <text x="1226" y="422" fill="#6b7280" font-size="13">实施顺序证据，不是工程承诺</text>

    <rect x="36" y="500" width="480" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/>
    <rect x="36" y="500" width="480" height="12" rx="6" fill="#d64b73"/>
    <text x="62" y="549" fill="#b8325b" font-size="22" font-weight="700">05 · 公共利益与包容</text>
    <text x="62" y="584" fill="#1b2938" font-size="18">谁能不被自动化挡在门外？</text>
    <text x="62" y="627" fill="#50607a" font-size="15">原住民/老人 · 转岗劳动者</text>
    <text x="62" y="652" fill="#50607a" font-size="15">纸本/语音 · 人工 · 申诉 · 退出</text>
    <text x="62" y="703" fill="#7d4b00" font-size="14">下一门：社区与无障碍走访</text>
    <text x="62" y="746" fill="#6b7280" font-size="13">设计画像，不是人口或就业统计</text>

    <rect x="536" y="500" width="480" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/>
    <rect x="536" y="500" width="480" height="12" rx="6" fill="#4d8d5d"/>
    <text x="562" y="549" fill="#317141" font-size="22" font-weight="700">06 · 风险与合规</text>
    <text x="562" y="584" fill="#1b2938" font-size="18">正式、背景、临时是否分层？</text>
    <text x="562" y="627" fill="#50607a" font-size="15">source registry · 权利台账</text>
    <text x="562" y="652" fill="#50607a" font-size="15">无授权/责任/安全资料即 G0</text>
    <text x="562" y="703" fill="#7d4b00" font-size="14">下一门：官方附件与责任确认</text>
    <text x="562" y="746" fill="#6b7280" font-size="13">边界披露证据，不是合规批准</text>

    <rect x="1036" y="500" width="528" height="300" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="2"/>
    <rect x="1036" y="500" width="528" height="12" rx="6" fill="#3f6791"/>
    <text x="1062" y="549" fill="#2c5277" font-size="22" font-weight="700">07 · 表达与复核完整度</text>
    <text x="1062" y="584" fill="#1b2938" font-size="18">图、HTML、PDF 能回到同一证据吗？</text>
    <text x="1062" y="627" fill="#50607a" font-size="15">GeoJSON · metrics · 双语 · 28 refs</text>
    <text x="1062" y="652" fill="#50607a" font-size="15">确定性 runner · 全包重算触发器</text>
    <text x="1062" y="703" fill="#7d4b00" font-size="14">下一门：专业图面与文字复核</text>
    <text x="1062" y="746" fill="#6b7280" font-size="13">可复核表达，不是合并或发布信号</text>
  </g>

  <rect x="36" y="836" width="1528" height="110" rx="18" fill="#e9f2fb" stroke="#b9cbe0"/>
  <text x="64" y="878" fill="#14213d" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">审阅顺序</text>
  <text x="64" y="910" fill="#32445a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">任务对齐 → 差异化 → 空间规则 → G0 门 → 公共利益 → 风险分层 → 图面回读；任何官方资料变化都触发 geometry / metrics / figures / HTML / PDF / self-check 一起重算。</text>
  <text x="64" y="934" fill="#7d4b00" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">official_boundary=false · geometry_role=provisional_constraint · operational_status=not_authorized_not_run · performance_results=null · not_an_official_score=true</text>
</svg>
