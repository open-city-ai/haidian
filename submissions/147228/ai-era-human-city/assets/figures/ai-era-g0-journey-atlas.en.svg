<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#0b1324"/>
  <rect x="48" y="42" width="1504" height="94" rx="18" fill="#13213a" stroke="#38567f" stroke-width="2"/>
  <text x="82" y="84" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="31" font-weight="700">Human City in the AI Era · G0 Ordinary-Person Journey Receipt</text>
  <text x="82" y="116" fill="#9eb5d7" font-family="Arial, sans-serif" font-size="17">enter · choose · bounded service · human takeover · appeal and withdrawal · independent replay</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="1010" y="64" width="116" height="42" rx="12" fill="#2d5a86"/><text x="1028" y="91" fill="#f4f7fb">G0 concept</text>
    <rect x="1140" y="64" width="136" height="42" rx="12" fill="#6a3f45"/><text x="1158" y="91" fill="#f4f7fb">HOLD not open</text>
    <rect x="1290" y="64" width="230" height="42" rx="12" fill="#24344c"/><text x="1311" y="91" fill="#f4f7fb">0 authorisations · 0 field observations</text>
  </g>

  <text x="74" y="178" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Four routes keep ordinary service visible</text>
  <text x="74" y="207" fill="#9eb5d7" font-family="Arial, sans-serif" font-size="16">Route cards reuse the existing ordinary journey contract and its conceptual spatial references</text>
  <g font-family="Arial, sans-serif">
    <rect x="74" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="98" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-01 · SCN-03</text>
    <text x="98" y="296" fill="#f4f7fb" font-size="17">Intergenerational learning and human entry</text>
    <text x="98" y="326" fill="#b9cbe3" font-size="15">P-01 · P-06 · PUBLIC-03</text>
    <text x="98" y="352" fill="#b9cbe3" font-size="15">ordinary route · paper / voice / staffed</text>
    <text x="98" y="382" fill="#f5c26b" font-size="15" font-weight="700">no human takeover means return to G0</text>

    <rect x="446" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="470" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-02 · SCN-06</text>
    <text x="470" y="296" fill="#f4f7fb" font-size="17">Civic service and data boundary</text>
    <text x="470" y="326" fill="#b9cbe3" font-size="15">P-05 · SCN-06 · SERVICE-ZONE-02</text>
    <text x="470" y="352" fill="#b9cbe3" font-size="15">staffed service with no data call</text>
    <text x="470" y="382" fill="#f5c26b" font-size="15" font-weight="700">unclear purpose means pause the request</text>

    <rect x="818" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="842" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-03 · SCN-04</text>
    <text x="842" y="296" fill="#f4f7fb" font-size="17">Night service and safety review</text>
    <text x="842" y="326" fill="#b9cbe3" font-size="15">P-03 · PUBLIC-04 · LAND-07</text>
    <text x="842" y="352" fill="#b9cbe3" font-size="15">staff confirm the ordinary route first</text>
    <text x="842" y="382" fill="#f5c26b" font-size="15" font-weight="700">no safety review means no time expansion</text>

    <rect x="1190" y="232" width="350" height="180" rx="16" fill="#142744" stroke="#4a78ab" stroke-width="2"/>
    <text x="1214" y="265" fill="#9ed8ff" font-size="19" font-weight="700">ROUTE-04 · SCN-02</text>
    <text x="1214" y="296" fill="#f4f7fb" font-size="17">Reskilling and autonomous choice</text>
    <text x="1214" y="326" fill="#b9cbe3" font-size="15">P-02 · PUBLIC-02 · LAND-03</text>
    <text x="1214" y="352" fill="#b9cbe3" font-size="15">human consultation beside choice</text>
    <text x="1214" y="382" fill="#f5c26b" font-size="15" font-weight="700">unclear exit means no automated routing</text>
  </g>

  <text x="74" y="474" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Five receipt steps keep handoffs actionable</text>
  <line x1="150" y1="585" x2="1450" y2="585" stroke="#4d76a7" stroke-width="6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="180" cy="585" r="30" fill="#4e9bd5"/><text x="180" y="592" fill="#0b1324" font-size="20" font-weight="700">01</text>
    <text x="180" y="535" fill="#f4f7fb" font-size="18" font-weight="700">Enter and choose</text><text x="180" y="628" fill="#9eb5d7" font-size="14">ordinary route stays visible</text>
    <circle cx="500" cy="585" r="30" fill="#4e9bd5"/><text x="500" y="592" fill="#0b1324" font-size="20" font-weight="700">02</text>
    <text x="500" y="535" fill="#f4f7fb" font-size="18" font-weight="700">Request bounded service</text><text x="500" y="628" fill="#9eb5d7" font-size="14">purpose and data scope first</text>
    <circle cx="820" cy="585" r="30" fill="#efb85d"/><text x="820" y="592" fill="#0b1324" font-size="20" font-weight="700">03</text>
    <text x="820" y="535" fill="#f4f7fb" font-size="18" font-weight="700">Take over or freeze</text><text x="820" y="628" fill="#9eb5d7" font-size="14">stop before unsafe continuation</text>
    <circle cx="1140" cy="585" r="30" fill="#efb85d"/><text x="1140" y="592" fill="#0b1324" font-size="20" font-weight="700">04</text>
    <text x="1140" y="535" fill="#f4f7fb" font-size="18" font-weight="700">Appeal, withdraw and leave</text><text x="1140" y="628" fill="#9eb5d7" font-size="14">paper, voice or staffed fallback</text>
    <circle cx="1460" cy="585" r="30" fill="#efb85d"/><text x="1460" y="592" fill="#0b1324" font-size="20" font-weight="700">05</text>
    <text x="1460" y="535" fill="#f4f7fb" font-size="18" font-weight="700">Independent replay</text><text x="1460" y="628" fill="#9eb5d7" font-size="14">expand, repair or exit</text>
  </g>

  <rect x="74" y="690" width="700" height="238" rx="16" fill="#172b43" stroke="#496d98" stroke-width="2"/>
  <text x="100" y="728" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="21" font-weight="700">Offline replay readout</text>
  <text x="100" y="766" fill="#c4d4e8" font-family="Arial, sans-serif" font-size="17">negative 5 / 5 · controls 3 / 3 · acceptance 6 / 6</text>
  <text x="100" y="800" fill="#c4d4e8" font-family="Arial, sans-serif" font-size="17">rollback 5 / 5 · routes 4 / 4 · network calls 0</text>
  <text x="100" y="838" fill="#f5c26b" font-family="Arial, sans-serif" font-size="17" font-weight="700">result not_run · field observations 0 · performance null</text>
  <text x="100" y="874" fill="#9eb5d7" font-family="Arial, sans-serif" font-size="15">structural replay makes the contract readable, not field evidence</text>

  <rect x="802" y="690" width="738" height="238" rx="16" fill="#2a1d2e" stroke="#875767" stroke-width="2"/>
  <text x="828" y="728" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="21" font-weight="700">Current boundary and write-back</text>
  <text x="828" y="766" fill="#f6d9dc" font-family="Arial, sans-serif" font-size="17">authorisations 0 · baseline unknown · operational not_authorized_not_run</text>
  <text x="828" y="800" fill="#f6d9dc" font-family="Arial, sans-serif" font-size="17">choice, purpose, takeover, appeal, withdrawal and replay fields remain</text>
  <text x="828" y="834" fill="#f6d9dc" font-family="Arial, sans-serif" font-size="17">missing ordinary route, human role or independent replay keeps HOLD</text>
  <text x="828" y="874" fill="#cfa7b1" font-family="Arial, sans-serif" font-size="15">no resident experience, service performance, permit or implementation claim</text>
</svg>
