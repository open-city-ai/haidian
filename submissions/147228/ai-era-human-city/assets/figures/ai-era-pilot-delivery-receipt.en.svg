eight="400" fill="#fffdfa" letter-spacing="0">opening and closeout checks are signed for route,</text><text x="1742" y="881" text-anchor="start" font-size="12" font-weight="400" fill="#fffdfa" letter-spacing="0">desk, paper stock, power isolation and maintenance</text><circle cx="1708" cy="945" r="17" fill="#c6534b"/><text x="1708" y="952" text-anchor="middle" font-size="13" font-weight="800" fill="#fffdfa" letter-spacing="0">5</text><text x="1742" y="942" text-anchor="start" font-size="12" font-weight="400" fill="#fffdfa" letter-spacing="0">a critical accessibility, fire, privacy or consent</text><text x="1742" y="959" text-anchor="start" font-size="12" font-weight="400" fill="#fffdfa" letter-spacing="0">failure reduces AI service capacity to zero</text><line x1="1688" y1="1040" x2="2286" y2="1040" stroke="#506982" stroke-width="2" stroke-linecap="round"/><text x="1688" y="1072" text-anchor="start" font-size="12" font-weight="700" fill="#d4a62b" letter-spacing="0">Retirement: isolate and remove the island, cap interfaces,</text><text x="1688" y="1088" text-anchor="start" font-size="12" font-weight="700" fill="#d4a62b" letter-spacing="0">restore floor, retain ordinary service, notify, close</text><rect x="78" y="1155" width="2244" height="133" rx="18" fill="#f6dfd5" stroke="#df784e" stroke-width="3"/><text x="112" y="1195" text-anchor="start" font-size="17" font-weight="800" fill="#df784e" letter-spacing="0">PROCUREMENT + RELEASE BOUNDARY</text><text x="112" y="1230" text-anchor="start" font-size="13" font-weight="400" fill="#172033" letter-spacing="0">Open only after a named owner, verified geometry, professional sign-offs, consented anonymised walkthrough evidence, confirmed cost and an independent decision. No</text><text x="112" y="1248" text-anchor="start" font-size="13" font-weight="400" fill="#172033" letter-spacing="0">organisation, budget, supplier, insurance or field result is confirmed.</text></g></svg>
