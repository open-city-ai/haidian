<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1600" viewBox="0 0 2600 1600">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8CA0B5"/></marker></defs>
<rect width="2600" height="1600" fill="#F7F9FC"/>
<style>
.title{font:700 46px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#142B4A}.sub{font:22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#60748D}.step{font:700 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#FFFFFF}.stepid{font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#FFFFFF}.label{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#142B4A}.actor{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#36526E}.body{font:17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1D3955}.small{font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#60748D}.stop{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#9E4A4A}.foot{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#C95D5D}</style>
<text x="84" y="78" class="title">Human City OS | six-step replayable city-API sequence</text>
<text x="84" y="116" class="sub">Catalogue → authorize → call → log → audit → exit · concept evidence only</text>
<text x="2515" y="78" text-anchor="end" class="small">PACKAGE v2.3</text>
<text x="2515" y="110" text-anchor="end" class="foot">CONCEPT / NOT AUTHORIZED / NOT RUN</text>
<line x1="455" y1="300" x2="478" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="74" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/>
<rect x="74" y="208" width="374" height="76" rx="18" fill="#2A9D8F"/>
<text x="98" y="239" class="step">01 · CATALOGUE</text>
<text x="98" y="265" class="stepid">API-01</text>
<text x="98" y="323" class="actor"><tspan x="98" dy="0">Public problem desk /</tspan><tspan x="98" dy="21">data-responsibility role</tspan></text>
<line x1="98" y1="365" x2="424" y2="365" stroke="#DDE5ED"/>
<text x="98" y="398" class="label">Spatial / accountability move</text>
<text x="98" y="434" class="body"><tspan x="98" dy="0">Publish the problem, data</tspan><tspan x="98" dy="24">purpose, spatial anchor, and</tspan><tspan x="98" dy="24">version; do not place</tspan><tspan x="98" dy="24">unauthorized data in the</tspan><tspan x="98" dy="24">callable catalogue.</tspan></text>
<text x="98" y="551" class="label">Human equivalent</text>
<text x="98" y="587" class="body"><tspan x="98" dy="0">Staffed explanation, a paper</tspan><tspan x="98" dy="24">catalogue, and telephone advice</tspan><tspan x="98" dy="24">remain available.</tspan></text>
<rect x="92" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="108" y="734" class="stop">STOP / RETURN</text>
<text x="108" y="769" class="stop"><tspan x="108" dy="0">Stay in observation and</tspan><tspan x="108" dy="22">evidence completion when the</tspan><tspan x="108" dy="22">problem, purpose, or</tspan><tspan x="108" dy="22">accountability is unclear.</tspan></text>
<text x="98" y="876" class="small"><tspan x="98" dy="0">…/scenario-space-operation-matrix.json#SC-B01</tspan><tspan x="98" dy="16">· …/data-readiness-register.json#DR-04</tspan></text>
<line x1="867" y1="300" x2="890" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="486" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#3D76EA" stroke-width="3"/>
<rect x="486" y="208" width="374" height="76" rx="18" fill="#3D76EA"/>
<text x="510" y="239" class="step">02 · AUTHORIZE</text>
<text x="510" y="265" class="stepid">API-02</text>
<text x="510" y="323" class="actor"><tspan x="510" dy="0">Authorization check /</tspan><tspan x="510" dy="21">independent review role</tspan></text>
<line x1="510" y1="365" x2="836" y2="365" stroke="#DDE5ED"/>
<text x="510" y="398" class="label">Spatial / accountability move</text>
<text x="510" y="434" class="body"><tspan x="510" dy="0">Check least privilege and</tspan><tspan x="510" dy="24">public explanation against</tspan><tspan x="510" dy="24">place, time, data, and</tspan><tspan x="510" dy="24">accountability bounds.</tspan></text>
<text x="510" y="551" class="label">Human equivalent</text>
<text x="510" y="587" class="body"><tspan x="510" dy="0">A staffed check, a non-digital</tspan><tspan x="510" dy="24">entry, and authorization</tspan><tspan x="510" dy="24">withdrawal can complete the</tspan><tspan x="510" dy="24">request directly.</tspan></text>
<rect x="504" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="520" y="734" class="stop">STOP / RETURN</text>
<text x="520" y="769" class="stop"><tspan x="520" dy="0">Keep only a paper protocol</tspan><tspan x="520" dy="22">when consent is absent,</tspan><tspan x="520" dy="22">privilege is exceeded, or</tspan><tspan x="520" dy="22">accountability is unconfirmed.</tspan></text>
<text x="510" y="876" class="small"><tspan x="510" dy="0">…/human-machine-interface-prototypes.json#SECTION-B-BOUNDED-TEST</tspan><tspan x="510" dy="16">· …/pilot-readiness-register.json#SC-B01</tspan></text>
<line x1="1279" y1="300" x2="1302" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="898" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#E76F51" stroke-width="3"/>
<rect x="898" y="208" width="374" height="76" rx="18" fill="#E76F51"/>
<text x="922" y="239" class="step">03 · CALL</text>
<text x="922" y="265" class="stepid">API-03</text>
<text x="922" y="323" class="actor"><tspan x="922" dy="0">Bounded scenario /</tspan><tspan x="922" dy="21">human-takeover role</tspan></text>
<line x1="922" y1="365" x2="1248" y2="365" stroke="#DDE5ED"/>
<text x="922" y="398" class="label">Spatial / accountability move</text>
<text x="922" y="434" class="body"><tspan x="922" dy="0">Call only the minimum problem</tspan><tspan x="922" dy="24">inside the declared scenario</tspan><tspan x="922" dy="24">and release gate; AI advises</tspan><tspan x="922" dy="24">but does not replace permits,</tspan><tspan x="922" dy="24">enforcement, or rights</tspan><tspan x="922" dy="24">decisions.</tspan></text>
<text x="922" y="551" class="label">Human equivalent</text>
<text x="922" y="587" class="body"><tspan x="922" dy="0">Staffed, telephone, paper, or</tspan><tspan x="922" dy="24">on-site service runs alongside</tspan><tspan x="922" dy="24">AI assistance.</tspan></text>
<rect x="916" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="932" y="734" class="stop">STOP / RETURN</text>
<text x="932" y="769" class="stop"><tspan x="932" dy="0">Freeze the call and return to</tspan><tspan x="932" dy="22">human service after a safety</tspan><tspan x="932" dy="22">event, accessibility barrier,</tspan><tspan x="932" dy="22">or unexplained recommendation.</tspan></text>
<text x="922" y="876" class="small"><tspan x="922" dy="0">…/scenario-cards.json#SC-B01 ·</tspan><tspan x="922" dy="16">…/human-city-ordinary-journey.json#J3 ·</tspan></text>
<line x1="1691" y1="300" x2="1714" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1310" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#7657C8" stroke-width="3"/>
<rect x="1310" y="208" width="374" height="76" rx="18" fill="#7657C8"/>
<text x="1334" y="239" class="step">04 · LOG</text>
<text x="1334" y="265" class="stepid">API-04</text>
<text x="1334" y="323" class="actor"><tspan x="1334" dy="0">Logging / public-issue desk</tspan></text>
<line x1="1334" y1="365" x2="1660" y2="365" stroke="#DDE5ED"/>
<text x="1334" y="398" class="label">Spatial / accountability move</text>
<text x="1334" y="434" class="body"><tspan x="1334" dy="0">Record only the minimum</tspan><tspan x="1334" dy="24">version, authorization,</tspan><tspan x="1334" dy="24">takeover, objection, and exit</tspan><tspan x="1334" dy="24">fields, with a readable version</tspan><tspan x="1334" dy="24">diff.</tspan></text>
<text x="1334" y="551" class="label">Human equivalent</text>
<text x="1334" y="587" class="body"><tspan x="1334" dy="0">Staffed answers, a paper</tspan><tspan x="1334" dy="24">receipt, and withdrawal paths</tspan><tspan x="1334" dy="24">do not depend on automated</tspan><tspan x="1334" dy="24">logs.</tspan></text>
<rect x="1328" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="1344" y="734" class="stop">STOP / RETURN</text>
<text x="1344" y="769" class="stop"><tspan x="1344" dy="0">Freeze the version when</tspan><tspan x="1344" dy="22">logging exceeds the minimum,</tspan><tspan x="1344" dy="22">cannot be explained, or cannot</tspan><tspan x="1344" dy="22">be withdrawn.</tspan></text>
<text x="1334" y="876" class="small"><tspan x="1334" dy="0">…/human-city-receipt.json#H0-H5 ·</tspan><tspan x="1334" dy="16">…/scenario-space-operation-matrix.json#SC-C05</tspan></text>
<line x1="2103" y1="300" x2="2126" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1722" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#E9A93A" stroke-width="3"/>
<rect x="1722" y="208" width="374" height="76" rx="18" fill="#E9A93A"/>
<text x="1746" y="239" class="step">05 · AUDIT</text>
<text x="1746" y="265" class="stepid">API-05</text>
<text x="1746" y="323" class="actor"><tspan x="1746" dy="0">Independent review /</tspan><tspan x="1746" dy="21">public-objection role</tspan></text>
<line x1="1746" y1="365" x2="2072" y2="365" stroke="#DDE5ED"/>
<text x="1746" y="398" class="label">Spatial / accountability move</text>
<text x="1746" y="434" class="body"><tspan x="1746" dy="0">Replay inputs, human takeover,</tspan><tspan x="1746" dy="24">objections, and unresolved</tspan><tspan x="1746" dy="24">items, distinguishing</tspan><tspan x="1746" dy="24">package-structure PASS from</tspan><tspan x="1746" dy="24">real-world performance.</tspan></text>
<text x="1746" y="551" class="label">Human equivalent</text>
<text x="1746" y="587" class="body"><tspan x="1746" dy="0">A person explains and answers,</tspan><tspan x="1746" dy="24">with objections allowed; an</tspan><tspan x="1746" dy="24">automated conclusion does not</tspan><tspan x="1746" dy="24">replace listening.</tspan></text>
<rect x="1740" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="1756" y="734" class="stop">STOP / RETURN</text>
<text x="1756" y="769" class="stop"><tspan x="1756" dy="0">Do not advance the gate when</tspan><tspan x="1756" dy="22">independent replay fails, the</tspan><tspan x="1756" dy="22">slowest group worsens, or</tspan><tspan x="1756" dy="22">objections have no answer.</tspan></text>
<text x="1746" y="876" class="small"><tspan x="1746" dy="0">…/human-city-receipt-evidence.json ·</tspan><tspan x="1746" dy="16">…/human-city-reference-audit.json</tspan></text>
<rect x="2134" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#5E9C76" stroke-width="3"/>
<rect x="2134" y="208" width="374" height="76" rx="18" fill="#5E9C76"/>
<text x="2158" y="239" class="step">06 · EXIT</text>
<text x="2158" y="265" class="stepid">API-06</text>
<text x="2158" y="323" class="actor"><tspan x="2158" dy="0">Release gate /</tspan><tspan x="2158" dy="21">accountability-to-be-confirmed</tspan><tspan x="2158" dy="21">role</tspan></text>
<line x1="2158" y1="365" x2="2484" y2="365" stroke="#DDE5ED"/>
<text x="2158" y="398" class="label">Spatial / accountability move</text>
<text x="2158" y="434" class="body"><tspan x="2158" dy="0">Withdraw the call, delete or</tspan><tspan x="2158" dy="24">freeze data, publish a release</tspan><tspan x="2158" dy="24">note, and decide whether to</tspan><tspan x="2158" dy="24">repair, hold, or return to the</tspan><tspan x="2158" dy="24">prior gate.</tspan></text>
<text x="2158" y="551" class="label">Human equivalent</text>
<text x="2158" y="587" class="body"><tspan x="2158" dy="0">Staffed, telephone, paper, and</tspan><tspan x="2158" dy="24">offline opinion routes remain</tspan><tspan x="2158" dy="24">available after exit.</tspan></text>
<rect x="2152" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="2168" y="734" class="stop">STOP / RETURN</text>
<text x="2168" y="769" class="stop"><tspan x="2168" dy="0">Do not expand without deletion</tspan><tspan x="2168" dy="22">proof, an accountable answer,</tspan><tspan x="2168" dy="22">and an equivalent human entry.</tspan></text>
<text x="2158" y="876" class="small"><tspan x="2158" dy="0">…/release-gate-ledger.json ·</tspan><tspan x="2158" dy="16">…/governance-startup-protocol.json</tspan></text>
<text x="74" y="972" class="label">Replay contract / what a reviewer can verify</text>
<rect x="74" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="98" y="1042" class="label">HUMAN</text>
<text x="98" y="1083" class="body"><tspan x="98" dy="0">Staffed / telephone / paper / offline routes</tspan><tspan x="98" dy="26">remain beside AI assistance.</tspan></text>
<rect x="704" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="728" y="1042" class="label">BOUNDARY</text>
<text x="728" y="1083" class="body"><tspan x="728" dy="0">Place · time · data · accountability are</tspan><tspan x="728" dy="26">declared before any call.</tspan></text>
<rect x="1334" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="1358" y="1042" class="label">EVIDENCE</text>
<text x="1358" y="1083" class="body"><tspan x="1358" dy="0">Scenario, anchor, release gate, log, objection</tspan><tspan x="1358" dy="26">and exit are linked.</tspan></text>
<rect x="1964" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="1988" y="1042" class="label">UNKNOWN</text>
<text x="1988" y="1083" class="body"><tspan x="1988" dy="0">Official geometry, rights, safety, energy and</tspan><tspan x="1988" dy="26">field baselines remain open.</tspan></text>
<rect x="74" y="1244" width="2452" height="190" rx="16" fill="#EEF3F8" stroke="#CBD7E3" stroke-width="2"/>
<text x="104" y="1292" class="label">Boundary</text>
<text x="104" y="1336" class="body"><tspan x="104" dy="0">This is a conceptual sequence only: official_boundary=false · geometry_role=provisional_constraint · operational_status=not_authorized_not_run ·</tspan><tspan x="104" dy="27">performance_results=null. It does not create an API, permit, engineering section, operating result, or official score.</tspan></text>
<text x="74" y="1558" class="foot">Conceptual suggestion / reference scheme for professional teams to deepen · no external requests</text>
</svg>
