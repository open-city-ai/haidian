<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">v2.9 可选互操作层：人本城市与 SEB 字段 crosswalk</title>
  <desc id="desc">四个空间锚定公共服务合同映射到服务等价基准的五个字段；所有状态保持授权前、离线合同检查和 HOLD。</desc>
  <rect width="1600" height="920" fill="#f4f7fb"/>
  <rect width="1600" height="150" fill="#10233f"/>
  <text x="70" y="62" fill="#9fd7c0" font-family="Arial, sans-serif" font-size="20" letter-spacing="3">HUMAN CITY OS · v2.9 · OPTIONAL COMPONENT</text>
  <text x="70" y="108" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">可选互操作层｜SEB 字段 crosswalk</text>
  <text x="70" y="136" fill="#d5dfeb" font-family="Arial, sans-serif" font-size="18">只回接本包已公开合同字段；不是整包采用、硬门禁、正式评分或现场服务证明</text>
  <rect x="70" y="180" width="1460" height="96" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="96" y="213" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">SEB v0.5.0 的五个字段</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="96" y="228" width="245" height="32" rx="6" fill="#e8f3ef"/><text x="116" y="250" fill="#16735b">① AI 关闭后的等价路径</text>
    <rect x="365" y="228" width="210" height="32" rx="6" fill="#e9efff"/><text x="385" y="250" fill="#3453a5">② 人工接管角色</text>
    <rect x="599" y="228" width="170" height="32" rx="6" fill="#fff2d9"/><text x="619" y="250" fill="#9a6512">③ 当前闸门</text>
    <rect x="793" y="228" width="190" height="32" rx="6" fill="#fce8ed"/><text x="813" y="250" fill="#a83d55">④ 运行方式</text>
    <rect x="1007" y="228" width="220" height="32" rx="6" fill="#ece8fb"/><text x="1027" y="250" fill="#5a4a9c">⑤ 责任角色</text>
  </g>
  <text x="1260" y="249" fill="#64748b" font-family="Arial, sans-serif" font-size="16">source-of-record：包内台账</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="306" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="306" width="12" height="108" fill="#16a085"/>
    <text x="104" y="342" fill="#10233f" font-size="24" font-weight="700">HC-T01 · 人工通道与代际共学</text>
    <text x="104" y="374" fill="#475569" font-size="18">人工 / 电话 / 纸本 / 无设备入口　|　公共服务值守角色（待指定）</text>
    <text x="104" y="400" fill="#64748b" font-size="16">SC-A03 · PHASE-V01 → SEB G0　·　等价路径逐字来自 human_alternative</text>
    <rect x="70" y="430" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="430" width="12" height="108" fill="#4c78ff"/>
    <text x="104" y="466" fill="#10233f" font-size="24" font-weight="700">HC-T02 · 城市 API 授权解释台</text>
    <text x="104" y="498" fill="#475569" font-size="18">人工复核 / 撤销授权 / 非数字说明　|　数据责任与独立复核角色（待指定）</text>
    <text x="104" y="524" fill="#64748b" font-size="16">SC-B01 · PHASE-V02 → SEB G0　·　权限越界或目的漂移时冻结</text>
    <rect x="70" y="554" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="554" width="12" height="108" fill="#f2a93b"/>
    <text x="104" y="590" fill="#10233f" font-size="24" font-weight="700">HC-T03 · 监管沙盒事故复盘台</text>
    <text x="104" y="622" fill="#475569" font-size="18">人工暂停 / 现场处置 / 公开申诉　|　测试责任与事故响应角色（待指定）</text>
    <text x="104" y="648" fill="#64748b" font-size="16">SC-C03 · PHASE-V02 → SEB G0　·　无人工停机即不进入测试</text>
    <rect x="70" y="678" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="678" width="12" height="108" fill="#e85d75"/>
    <text x="104" y="714" fill="#10233f" font-size="24" font-weight="700">HC-T04 · 多语公共服务客厅</text>
    <text x="104" y="746" fill="#475569" font-size="18">人工翻译 / 电话 / 图标 / 纸面表单　|　多语人工服务与内容校对角色（待指定）</text>
    <text x="104" y="772" fill="#64748b" font-size="16">SC-D03 · PHASE-V01 → SEB G0　·　双语不一致时停止数字导览</text>
  </g>
  <rect x="70" y="812" width="1460" height="70" rx="12" fill="#173555"/>
  <text x="96" y="842" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">HOLD · contract_check_only · authorization=0 · field_observations=0 · baseline=unknown · performance=null</text>
  <text x="96" y="868" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">5 个负例分别拒绝数字依赖、角色缺失、非法闸门、运行方式缺失与来源字段改写；PASS 不等于采用或成效。</text>
</svg>
