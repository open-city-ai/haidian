  <g transform="translate(70,190)"><rect width="500" height="690" rx="22" fill="#fff" stroke="#ed5b78" stroke-width="4"/><rect width="500" height="86" rx="22" fill="#ed5b78"/><text x="28" y="53" class="head">01  AI Origin Community</text><text x="28" y="126" class="label">Residents / elders / transition workers</text><path d="M54 190 H446" stroke="#ed5b78" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#ed5b78" stroke-width="4"><circle cx="70" cy="190" r="18"/><circle cx="190" cy="190" r="18"/><circle cx="310" cy="190" r="18"/><circle cx="430" cy="190" r="18"/></g><g class="small" text-anchor="middle"><text x="70" y="238">Arrive</text><text x="190" y="238">Staffed entry</text><text x="310" y="238">Skills / return</text><text x="430" y="238">Quiet recovery</text></g><g transform="translate(26,285)"><rect width="448" height="72" rx="12" fill="#fff1f4"/><text x="20" y="30" class="label">Spatial cue</text><text x="20" y="57" class="small">Continuous walk · visible counter · intergenerational learning · night safety</text></g><g transform="translate(26,375)"><rect width="448" height="72" rx="12" fill="#f7f9fc"/><text x="20" y="30" class="label">Machine boundary</text><text x="20" y="57" class="small">No forced scan / no training-count proxy for jobs</text></g><g transform="translate(26,465)"><rect width="448" height="72" rx="12" fill="#f7f9fc"/><text x="20" y="30" class="label">Exit action</text><text x="20" y="57" class="small">Reroute, staffed takeover, ordinary path retained</text></g><text x="26" y="620" class="tiny">Refs: PUBLIC-A-INCLUSION · BLDG-A-03</text><text x="26" y="650" class="tiny">ROAD-A-SKILL · GREEN-A-QUIET-1</text></g>
  <g transform="translate(650,190)"><rect width="500" height="690" rx="22" fill="#fff" stroke="#3d76ea" stroke-width="4"/><rect width="500" height="86" rx="22" fill="#3d76ea"/><text x="28" y="53" class="head">02  Zhongzhiyuan</text><text x="28" y="126" class="label">Pedestrians / testers / safety reviewers</text><path d="M54 190 H446" stroke="#3d76ea" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#3d76ea" stroke-width="4"><circle cx="70" cy="190" r="18"/><circle cx="190" cy="190" r="18"/><circle cx="310" cy="190" r="18"/><circle cx="430" cy="190" r="18"/></g><g class="small" text-anchor="middle"><text x="70" y="238">Slow edge</text><text x="190" y="238">Consent desk</text><text x="310" y="238">Bounded test</text><text x="430" y="238">Blue-green retreat</text></g><g transform="translate(26,285)"><rect width="448" height="72" rx="12" fill="#edf3ff"/><text x="20" y="30" class="label">Spatial cue</text><text x="20" y="57" class="small">Observation edge · stop interface · incident replay · refuge</text></g><g transform="translate(26,375)"><rect width="448" height="72" rx="12" fill="#f7f9fc"/><text x="20" y="30" class="label">Machine boundary</text><text x="20" y="57" class="small">Declare time / least privilege / no demo-to-expansion</text></g><g transform="translate(26,465)"><rect width="448" height="72" rx="12" fill="#f7f9fc"/><text x="20" y="30" class="label">Exit action</text><text x="20" y="57" class="small">Freeze, stop, return to the prior release gate</text></g><text x="26" y="620" class="tiny">Refs: ROAD-B-SILICON · PUBLIC-B-API</text><text x="26" y="650" class="tiny">PUBLIC-C-SANDBOX · GREEN-C-SPONGE</text></g>
  <g transform="translate(1230,190)"><rect width="500" height="690" rx="22" fill="#fff" stroke="#16a38e" stroke-width="4"/><rect width="500" height="86" rx="22" fill="#16a38e"/><text x="28" y="53" class="head">03  Dazhongsi</text><text x="28" y="126" class="label">Small teams / public service / global visitors</text><path d="M54 190 H446" stroke="#16a38e" stroke-width="8" stroke-linecap="round"/><g fill="#fff" stroke="#16a38e" stroke-width="4"><circle cx="70" cy="190" r="18"/><circle cx="190" cy="190" r="18"/><circle cx="310" cy="190" r="18"/><circle cx="430" cy="190" r="18"/></g><g class="small" text-anchor="middle"><text x="70" y="238">Problem desk</text><text x="190" y="238">Shared lab</text><text x="310" y="238">Version replay</text><text x="430" y="238">Multilingual lounge</text></g><g transform="translate(26,285)"><rect width="448" height="72" rx="12" fill="#e9fbf7"/><text x="20" y="30" class="label">Spatial cue</text><text x="20" y="57" class="small">Open entry · fair access · release note · assisted referral</text></g><g transform="translate(26,375)"><rect width="448" height="72" rx="12" fill="#f7f9fc"/><text x="20" y="30" class="label">Machine boundary</text><text x="20" y="57" class="small">Least problem / no vendor selection / no standard claim</text></g><g transform="translate(26,465)"><rect width="448" height="72" rx="12" fill="#f7f9fc"/><text x="20" y="30" class="label">Exit action</text><text x="20" y="57" class="small">Stop diffusion, answer by a person, ordinary service retained</text></g><text x="26" y="620" class="tiny">Refs: SC-D01 · SC-D02 · SC-D03</text><text x="26" y="650" class="tiny">BLDG-D-01 · provisional / non-scaled</text></g>
