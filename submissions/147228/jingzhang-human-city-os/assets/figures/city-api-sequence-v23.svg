<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1600" viewBox="0 0 2600 1600">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8CA0B5"/></marker></defs>
<rect width="2600" height="1600" fill="#F7F9FC"/>
<style>
.title{font:700 46px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#142B4A}.sub{font:22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#60748D}.step{font:700 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#FFFFFF}.stepid{font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#FFFFFF}.label{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#142B4A}.actor{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#36526E}.body{font:17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1D3955}.small{font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#60748D}.stop{font:600 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#9E4A4A}.foot{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#C95D5D}</style>
<text x="84" y="78" class="title">人本城市操作系统｜城市 API 六步可回放序列</text>
<text x="84" y="116" class="sub">目录 → 授权 → 调用 → 日志 → 审计 → 退出 · 仅为概念证据</text>
<text x="2515" y="78" text-anchor="end" class="small">PACKAGE v2.3</text>
<text x="2515" y="110" text-anchor="end" class="foot">概念 / 未授权 / 未运行</text>
<line x1="455" y1="300" x2="478" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="74" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/>
<rect x="74" y="208" width="374" height="76" rx="18" fill="#2A9D8F"/>
<text x="98" y="239" class="step">01 · 目录</text>
<text x="98" y="265" class="stepid">API-01</text>
<text x="98" y="323" class="actor"><tspan x="98" dy="0">公共问题台 / 资料责任角色</tspan></text>
<line x1="98" y1="365" x2="424" y2="365" stroke="#DDE5ED"/>
<text x="98" y="398" class="label">空间 / 责任动作</text>
<text x="98" y="434" class="body"><tspan x="98" dy="0">公开问题、数据用途、空间锚点和版本</tspan><tspan x="98" dy="24">，不把未授权数据写进可调用目录。</tspan></text>
<text x="98" y="551" class="label">人工等效</text>
<text x="98" y="587" class="body"><tspan x="98" dy="0">人工解释、纸面目录和电话咨询并列。</tspan></text>
<rect x="92" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="108" y="734" class="stop">停止 / 回退</text>
<text x="108" y="769" class="stop"><tspan x="108" dy="0">问题、用途或责任不清时停在观察与</tspan><tspan x="108" dy="22">补资料。</tspan></text>
<text x="98" y="876" class="small"><tspan x="98" dy="0">…/scenario-space-operation-m</tspan><tspan x="98" dy="16">atrix.json#SC-B01 · …/data-r</tspan></text>
<line x1="867" y1="300" x2="890" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="486" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#3D76EA" stroke-width="3"/>
<rect x="486" y="208" width="374" height="76" rx="18" fill="#3D76EA"/>
<text x="510" y="239" class="step">02 · 授权</text>
<text x="510" y="265" class="stepid">API-02</text>
<text x="510" y="323" class="actor"><tspan x="510" dy="0">授权核验 / 独立复核角色</tspan></text>
<line x1="510" y1="365" x2="836" y2="365" stroke="#DDE5ED"/>
<text x="510" y="398" class="label">空间 / 责任动作</text>
<text x="510" y="434" class="body"><tspan x="510" dy="0">按地点、时间、数据、责任四限定核验</tspan><tspan x="510" dy="24">最小权限与公众说明。</tspan></text>
<text x="510" y="551" class="label">人工等效</text>
<text x="510" y="587" class="body"><tspan x="510" dy="0">人工核验、非数字入口和撤销授权可直</tspan><tspan x="510" dy="24">接完成请求。</tspan></text>
<rect x="504" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="520" y="734" class="stop">停止 / 回退</text>
<text x="520" y="769" class="stop"><tspan x="520" dy="0">无同意、越权或责任待确认时只保留</tspan><tspan x="520" dy="22">纸面协议。</tspan></text>
<text x="510" y="876" class="small"><tspan x="510" dy="0">…/human-machine-interface-pr</tspan><tspan x="510" dy="16">ototypes.json#SECTION-B-BOUN</tspan></text>
<line x1="1279" y1="300" x2="1302" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="898" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#E76F51" stroke-width="3"/>
<rect x="898" y="208" width="374" height="76" rx="18" fill="#E76F51"/>
<text x="922" y="239" class="step">03 · 调用</text>
<text x="922" y="265" class="stepid">API-03</text>
<text x="922" y="323" class="actor"><tspan x="922" dy="0">受限场景 / 人工接管角色</tspan></text>
<line x1="922" y1="365" x2="1248" y2="365" stroke="#DDE5ED"/>
<text x="922" y="398" class="label">空间 / 责任动作</text>
<text x="922" y="434" class="body"><tspan x="922" dy="0">在既定场景和发布门内调用最小问题；</tspan><tspan x="922" dy="24">AI 只给建议，不替代许可、执法或</tspan><tspan x="922" dy="24">权益决定。</tspan></text>
<text x="922" y="551" class="label">人工等效</text>
<text x="922" y="587" class="body"><tspan x="922" dy="0">人工、电话、纸面或现场服务与 AI</tspan><tspan x="922" dy="24"> 辅助并列。</tspan></text>
<rect x="916" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="932" y="734" class="stop">停止 / 回退</text>
<text x="932" y="769" class="stop"><tspan x="932" dy="0">安全事件、无障碍受阻或建议不可解</tspan><tspan x="932" dy="22">释时冻结调用并回到人工。</tspan></text>
<text x="922" y="876" class="small"><tspan x="922" dy="0">…/scenario-cards.json#SC-B01</tspan><tspan x="922" dy="16"> · …/human-city-ordinary-jou</tspan></text>
<line x1="1691" y1="300" x2="1714" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1310" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#7657C8" stroke-width="3"/>
<rect x="1310" y="208" width="374" height="76" rx="18" fill="#7657C8"/>
<text x="1334" y="239" class="step">04 · 日志</text>
<text x="1334" y="265" class="stepid">API-04</text>
<text x="1334" y="323" class="actor"><tspan x="1334" dy="0">日志 / 公众问题台</tspan></text>
<line x1="1334" y1="365" x2="1660" y2="365" stroke="#DDE5ED"/>
<text x="1334" y="398" class="label">空间 / 责任动作</text>
<text x="1334" y="434" class="body"><tspan x="1334" dy="0">只记录最小必要的版本、授权、接管、</tspan><tspan x="1334" dy="24">异议和退出字段，保留可读的版本差异</tspan><tspan x="1334" dy="24">。</tspan></text>
<text x="1334" y="551" class="label">人工等效</text>
<text x="1334" y="587" class="body"><tspan x="1334" dy="0">人工答复、纸面回执和撤回路径不依赖</tspan><tspan x="1334" dy="24">自动日志。</tspan></text>
<rect x="1328" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="1344" y="734" class="stop">停止 / 回退</text>
<text x="1344" y="769" class="stop"><tspan x="1344" dy="0">超出最小记录、无法解释或无法撤回</tspan><tspan x="1344" dy="22">时冻结版本。</tspan></text>
<text x="1334" y="876" class="small"><tspan x="1334" dy="0">…/human-city-receipt.json#H0</tspan><tspan x="1334" dy="16">-H5 · …/scenario-space-opera</tspan></text>
<line x1="2103" y1="300" x2="2126" y2="300" stroke="#8CA0B5" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1722" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#E9A93A" stroke-width="3"/>
<rect x="1722" y="208" width="374" height="76" rx="18" fill="#E9A93A"/>
<text x="1746" y="239" class="step">05 · 审计</text>
<text x="1746" y="265" class="stepid">API-05</text>
<text x="1746" y="323" class="actor"><tspan x="1746" dy="0">独立复核 / 公众异议角色</tspan></text>
<line x1="1746" y1="365" x2="2072" y2="365" stroke="#DDE5ED"/>
<text x="1746" y="398" class="label">空间 / 责任动作</text>
<text x="1746" y="434" class="body"><tspan x="1746" dy="0">回放输入、人工接管、异议和未解决项</tspan><tspan x="1746" dy="24">，区分包内结构 PASS 与现实绩</tspan><tspan x="1746" dy="24">效。</tspan></text>
<text x="1746" y="551" class="label">人工等效</text>
<text x="1746" y="587" class="body"><tspan x="1746" dy="0">由人解释、答复并允许提出异议，不用</tspan><tspan x="1746" dy="24">自动结论替代听取。</tspan></text>
<rect x="1740" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="1756" y="734" class="stop">停止 / 回退</text>
<text x="1756" y="769" class="stop"><tspan x="1756" dy="0">不能独立回放、最慢群体变差或异议</tspan><tspan x="1756" dy="22">无答复时不进入下一门。</tspan></text>
<text x="1746" y="876" class="small"><tspan x="1746" dy="0">…/human-city-receipt-evidenc</tspan><tspan x="1746" dy="16">e.json · …/human-city-refere</tspan></text>
<rect x="2134" y="208" width="374" height="700" rx="18" fill="#FFFFFF" stroke="#5E9C76" stroke-width="3"/>
<rect x="2134" y="208" width="374" height="76" rx="18" fill="#5E9C76"/>
<text x="2158" y="239" class="step">06 · 退出</text>
<text x="2158" y="265" class="stepid">API-06</text>
<text x="2158" y="323" class="actor"><tspan x="2158" dy="0">发布门 / 责任待确认角色</tspan></text>
<line x1="2158" y1="365" x2="2484" y2="365" stroke="#DDE5ED"/>
<text x="2158" y="398" class="label">空间 / 责任动作</text>
<text x="2158" y="434" class="body"><tspan x="2158" dy="0">撤回调用、删除或冻结资料，发布 r</tspan><tspan x="2158" dy="24">elease note，并决定修复</tspan><tspan x="2158" dy="24">、维持或回到上一门。</tspan></text>
<text x="2158" y="551" class="label">人工等效</text>
<text x="2158" y="587" class="body"><tspan x="2158" dy="0">人工、电话、纸面和线下意见在退出后</tspan><tspan x="2158" dy="24">继续可用。</tspan></text>
<rect x="2152" y="700" width="338" height="156" rx="12" fill="#FFF5F0" stroke="#F3C7BA"/>
<text x="2168" y="734" class="stop">停止 / 回退</text>
<text x="2168" y="769" class="stop"><tspan x="2168" dy="0">没有删除证明、责任答复或人工等效</tspan><tspan x="2168" dy="22">入口时不得扩展。</tspan></text>
<text x="2158" y="876" class="small"><tspan x="2158" dy="0">…/release-gate-ledger.json ·</tspan><tspan x="2158" dy="16"> …/governance-startup-protoc</tspan></text>
<text x="74" y="972" class="label">回放契约 / 评审者可核对什么</text>
<rect x="74" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="98" y="1042" class="label">人工</text>
<text x="98" y="1083" class="body"><tspan x="98" dy="0">人工 / 电话 / 纸面 / 线下路径与 AI 辅助并列保留</tspan><tspan x="98" dy="26">。</tspan></text>
<rect x="704" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="728" y="1042" class="label">边界</text>
<text x="728" y="1083" class="body"><tspan x="728" dy="0">每次调用前先声明地点 · 时间 · 数据 · 责任四限定。</tspan></text>
<rect x="1334" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="1358" y="1042" class="label">证据</text>
<text x="1358" y="1083" class="body"><tspan x="1358" dy="0">场景、空间锚点、发布门、日志、异议和退出相互回接。</tspan></text>
<rect x="1964" y="1000" width="594" height="190" rx="16" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="1988" y="1042" class="label">缺口</text>
<text x="1988" y="1083" class="body"><tspan x="1988" dy="0">官方几何、权属、安全、能源和现场基线仍待补齐。</tspan></text>
<rect x="74" y="1244" width="2452" height="190" rx="16" fill="#EEF3F8" stroke="#CBD7E3" stroke-width="2"/>
<text x="104" y="1292" class="label">边界</text>
<text x="104" y="1336" class="body"><tspan x="104" dy="0">这是一条概念序列：official_boundary=false · geometry_role=provisional_constraint · operational_stat</tspan><tspan x="104" dy="27">us=not_authorized_not_run · performance_results=null。它不生成 API 实体、许可、工程断面、运营结果或官方分数。</tspan></text>
<text x="74" y="1558" class="foot">概念建议 / 参考方案，供专业团队深化研究 · 全离线</text>
</svg>
