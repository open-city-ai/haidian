<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#071018"/>
  <g font-family="Arial, sans-serif" fill="#f4f0e8">
    <text x="80" y="78" font-size="32" font-weight="700">Human City OS | Spatial Decision Receipt</text>
    <text x="80" y="114" font-size="16" fill="#a6b2c2">Protect the human mainline first, then decide how machines enter · HOLD / synthetic tabletop</text>
    <text x="80" y="165" font-size="18" fill="#ffc46b">Three spatial organizations</text>
    <g transform="translate(80 195)"><rect width="450" height="300" rx="10" fill="#141c25" stroke="#d96b6b" stroke-width="2"/><text x="26" y="48" font-size="22" font-weight="700">ALT-A  Machine-first belt</text><text x="26" y="84" font-size="17" fill="#ff9c9c">REJECT</text><text x="26" y="125" font-size="16">API, screens and test lanes are default</text><text x="26" y="158" font-size="16">Ordinary movement and repair move behind</text><text x="26" y="214" font-size="15" fill="#ffb2b2">Human mainline not independently protected</text><text x="26" y="250" font-size="14" fill="#a6b2c2">Reject: efficiency cannot replace dignity</text></g>
    <g transform="translate(575 195)"><rect width="450" height="300" rx="10" fill="#141c25" stroke="#e0a45c" stroke-width="2"/><text x="26" y="48" font-size="22" font-weight="700">ALT-B  Four value-chain rooms</text><text x="26" y="84" font-size="17" fill="#ffc46b">REVISE</text><text x="26" y="125" font-size="16">Rooms clarify programs and test boundaries</text><text x="26" y="158" font-size="16">Mainline, appeal, maintenance and release split</text><text x="26" y="214" font-size="15" fill="#ffd18d">The operating system stops at room edges</text><text x="26" y="250" font-size="14" fill="#a6b2c2">Revise: add a shared release receipt</text></g>
    <g transform="translate(1070 195)"><rect width="450" height="300" rx="10" fill="#102127" stroke="#64d5b5" stroke-width="3"/><text x="26" y="48" font-size="22" font-weight="700">ALT-C  Human mainline + machine lanes</text><text x="26" y="84" font-size="17" fill="#72e1bd">ADVANCE TO DESIGN REVIEW</text><text x="26" y="125" font-size="16">Ordinary, accessible, staffed and repair first</text><text x="26" y="158" font-size="16">API, robot and low-air concepts pause and replay</text><text x="26" y="214" font-size="15" fill="#9bffe0">Selected: deepen, but remain HOLD</text><text x="26" y="250" font-size="14" fill="#a6b2c2">Next: node walk, takeover, appeal readback</text></g>
    <text x="80" y="555" font-size="18" fill="#ffc46b">Scale chain: from value-chain relation to readable release handoff</text>
    <g stroke="#5dabff" stroke-width="3" fill="none"><path d="M115 650 H1480"/><path d="M1480 650 l-18 -10 M1480 650 l-18 10"/></g><g fill="#5dabff"><circle cx="180" cy="650" r="11"/><circle cx="490" cy="650" r="11"/><circle cx="800" cy="650" r="11"/><circle cx="1110" cy="650" r="11"/><circle cx="1420" cy="650" r="11"/></g>
    <g font-size="16"><text x="150" y="690">1:5000</text><text x="458" y="690">1:2000</text><text x="770" y="690">1:500</text><text x="1080" y="690">1:100</text><text x="1390" y="690">1:50</text><text x="125" y="725" fill="#a6b2c2">human mainline</text><text x="430" y="725" fill="#a6b2c2">three areas</text><text x="720" y="725" fill="#a6b2c2">ordinary entry</text><text x="1030" y="725" fill="#a6b2c2">takeover/appeal</text><text x="1350" y="725" fill="#a6b2c2">removable lane</text></g>
    <text x="80" y="790" font-size="17" fill="#ffc46b">Five public rights</text><text x="300" y="790" font-size="16">dignity/ordinary access · non-digital/accessibility · consent/pause/appeal/exit · community repair/retention · public asset/privacy</text>
    <text x="80" y="835" font-size="16" fill="#a6b2c2">0 authorizations · 0 field observations · baseline unknown · not_authorized_not_run · no field claims</text>
  </g>
</svg>
