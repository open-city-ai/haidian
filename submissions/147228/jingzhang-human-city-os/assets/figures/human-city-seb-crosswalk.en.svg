<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">v2.9 optional interoperability layer: Human City and SEB field crosswalk</title>
  <desc id="desc">Four spatially anchored public-service contracts map to five Service Equivalence Baseline fields while remaining pre-authorisation, offline contract checks, and HOLD.</desc>
  <rect width="1600" height="920" fill="#f4f7fb"/>
  <rect width="1600" height="150" fill="#10233f"/>
  <text x="70" y="62" fill="#9fd7c0" font-family="Arial, sans-serif" font-size="20" letter-spacing="3">HUMAN CITY OS · v2.9 · OPTIONAL COMPONENT</text>
  <text x="70" y="108" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Optional interoperability layer | SEB field crosswalk</text>
  <text x="70" y="136" fill="#d5dfeb" font-family="Arial, sans-serif" font-size="18">Maps already-public package fields only; it is not adoption, a hard gate, formal scoring, or proof of live service</text>
  <rect x="70" y="180" width="1460" height="96" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
  <text x="96" y="213" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Five SEB v0.5.0 fields</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="96" y="228" width="245" height="32" rx="6" fill="#e8f3ef"/><text x="116" y="250" fill="#16735b">1  AI-off equivalent route</text>
    <rect x="365" y="228" width="210" height="32" rx="6" fill="#e9efff"/><text x="385" y="250" fill="#3453a5">2  Human handoff role</text>
    <rect x="599" y="228" width="170" height="32" rx="6" fill="#fff2d9"/><text x="619" y="250" fill="#9a6512">3  Current gate</text>
    <rect x="793" y="228" width="190" height="32" rx="6" fill="#fce8ed"/><text x="813" y="250" fill="#a83d55">4  Operating mode</text>
    <rect x="1007" y="228" width="220" height="32" rx="6" fill="#ece8fb"/><text x="1027" y="250" fill="#5a4a9c">5  Responsible role</text>
  </g>
  <text x="1260" y="249" fill="#64748b" font-family="Arial, sans-serif" font-size="16">source of record: package ledgers</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="306" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="306" width="12" height="108" fill="#16a085"/>
    <text x="104" y="342" fill="#10233f" font-size="24" font-weight="700">HC-T01 · Human channel and intergenerational learning</text>
    <text x="104" y="374" fill="#475569" font-size="18">Staffed / telephone / paper / device-free entry | public-service desk role (not assigned)</text>
    <text x="104" y="400" fill="#64748b" font-size="16">SC-A03 · PHASE-V01 → SEB G0 · route copied from human_alternative</text>
    <rect x="70" y="430" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="430" width="12" height="108" fill="#4c78ff"/>
    <text x="104" y="466" fill="#10233f" font-size="24" font-weight="700">HC-T02 · City-API authorization desk</text>
    <text x="104" y="498" fill="#475569" font-size="18">Human review / revocation / non-digital explanation | data steward and independent-review role (not assigned)</text>
    <text x="104" y="524" fill="#64748b" font-size="16">SC-B01 · PHASE-V02 → SEB G0 · freeze on excess permission or purpose drift</text>
    <rect x="70" y="554" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="554" width="12" height="108" fill="#f2a93b"/>
    <text x="104" y="590" fill="#10233f" font-size="24" font-weight="700">HC-T03 · Regulatory-sandbox incident replay desk</text>
    <text x="104" y="622" fill="#475569" font-size="18">Human stop / on-site handling / public appeal | test-accountability and incident-response role (not assigned)</text>
    <text x="104" y="648" fill="#64748b" font-size="16">SC-C03 · PHASE-V02 → SEB G0 · no human stop means no test</text>
    <rect x="70" y="678" width="1460" height="108" rx="12" fill="#ffffff" stroke="#d8e0ea"/>
    <rect x="70" y="678" width="12" height="108" fill="#e85d75"/>
    <text x="104" y="714" fill="#10233f" font-size="24" font-weight="700">HC-T04 · Multilingual public-service living room</text>
    <text x="104" y="746" fill="#475569" font-size="18">Human translation / telephone / icons / paper forms | multilingual service and content-QA role (not assigned)</text>
    <text x="104" y="772" fill="#64748b" font-size="16">SC-D03 · PHASE-V01 → SEB G0 · stop digital guidance on bilingual mismatch</text>
  </g>
  <rect x="70" y="812" width="1460" height="70" rx="12" fill="#173555"/>
  <text x="96" y="842" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">HOLD · contract_check_only · authorization=0 · field_observations=0 · baseline=unknown · performance=null</text>
  <text x="96" y="868" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Five negative fixtures reject digital dependency, missing roles, invalid gates, missing mode, and changed source fields; PASS is not adoption or outcome.</text>
</svg>
