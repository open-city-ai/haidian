<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#071018"/>
  <g font-family="Arial, 'Noto Sans CJK SC', sans-serif" fill="#f4f0e8">
    <text x="80" y="78" font-size="32" font-weight="700">京张人本城市操作系统｜空间裁决回执</text>
    <text x="80" y="114" font-size="16" fill="#a6b2c2">先保住人的主线，再决定机器如何进入 · HOLD / 概念桌面回放</text>
    <text x="80" y="165" font-size="18" fill="#ffc46b">三种空间组织</text>
    <g transform="translate(80 195)"><rect width="450" height="300" rx="10" fill="#141c25" stroke="#d96b6b" stroke-width="2"/><text x="26" y="48" font-size="22" font-weight="700">ALT-A  机器优先带</text><text x="26" y="84" font-size="17" fill="#ff9c9c">REJECT</text><text x="26" y="125" font-size="16">API、屏幕和测试廊成为默认</text><text x="26" y="158" font-size="16">普通通行、社区修复被挤到后面</text><text x="26" y="214" font-size="15" fill="#ffb2b2">人的主线没有独立保护</text><text x="26" y="250" font-size="14" fill="#a6b2c2">拒绝：效率不能替代尊严和协商</text></g>
    <g transform="translate(575 195)"><rect width="450" height="300" rx="10" fill="#141c25" stroke="#e0a45c" stroke-width="2"/><text x="26" y="48" font-size="22" font-weight="700">ALT-B  四条价值链分室</text><text x="26" y="84" font-size="17" fill="#ffc46b">REVISE</text><text x="26" y="125" font-size="16">分室清楚，测试边界较易隔离</text><text x="26" y="158" font-size="16">但主线、申诉、维护和发布被拆散</text><text x="26" y="214" font-size="15" fill="#ffd18d">城市操作系统停在房间边界</text><text x="26" y="250" font-size="14" fill="#a6b2c2">返修：补一张共用发布回执</text></g>
    <g transform="translate(1070 195)"><rect width="450" height="300" rx="10" fill="#102127" stroke="#64d5b5" stroke-width="3"/><text x="26" y="48" font-size="22" font-weight="700">ALT-C  人本主线 + 机器车道</text><text x="26" y="84" font-size="17" fill="#72e1bd">ADVANCE TO DESIGN REVIEW</text><text x="26" y="125" font-size="16">普通、无障碍、人工和社区修复先行</text><text x="26" y="158" font-size="16">API、机器人和低空概念可暂停可回放</text><text x="26" y="214" font-size="15" fill="#9bffe0">选中：进入专业深化，但仍 HOLD</text><text x="26" y="250" font-size="14" fill="#a6b2c2">先补：节点走读、接管、申诉回读</text></g>
    <text x="80" y="555" font-size="18" fill="#ffc46b">尺度链：从价值链关系落到可读的发布交接</text>
    <g stroke="#5dabff" stroke-width="3" fill="none"><path d="M115 650 H1480"/><path d="M1480 650 l-18 -10 M1480 650 l-18 10"/></g><g fill="#5dabff"><circle cx="180" cy="650" r="11"/><circle cx="490" cy="650" r="11"/><circle cx="800" cy="650" r="11"/><circle cx="1110" cy="650" r="11"/><circle cx="1420" cy="650" r="11"/></g>
    <g font-size="16"><text x="150" y="690">1:5000</text><text x="458" y="690">1:2000</text><text x="770" y="690">1:500</text><text x="1080" y="690">1:100</text><text x="1390" y="690">1:50</text><text x="125" y="725" fill="#a6b2c2">人本主线</text><text x="430" y="725" fill="#a6b2c2">三重点区</text><text x="720" y="725" fill="#a6b2c2">普通入口</text><text x="1030" y="725" fill="#a6b2c2">接管/申诉</text><text x="1350" y="725" fill="#a6b2c2">可撤车道</text></g>
    <text x="80" y="790" font-size="17" fill="#ffc46b">五项公共权利</text><text x="300" y="790" font-size="16">人的尊严/普通可达 · 非数字等价/无障碍 · 同意暂停申诉退出 · 社区修复保留 · 公共资产/隐私</text>
    <text x="80" y="835" font-size="16" fill="#a6b2c2">0 授权 · 0 现场观察 · baseline unknown · not_authorized_not_run · 无现场声明</text>
  </g>
</svg>
