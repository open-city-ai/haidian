<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-label="From roles to retirement: a delivery receipt that does not pretend to be built"><rect width="2400" height="1350" fill="#f4f1e8"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="72" y="63" text-anchor="start" font-size="18" font-weight="800" fill="#16856b">HUMAN CITY OS / DELIVERY RECEIPT / 02</text><text x="2328" y="63" text-anchor="end" font-size="18" font-weight="800" fill="#d86f45">V3.0 · DESIGN TARGET · HOLD</text><text x="72" y="135" text-anchor="start" font-size="42" font-weight="760" fill="#172033">From roles to retirement: a delivery receipt that does not pretend to be built</text><text x="72" y="185" text-anchor="start" font-size="18" font-weight="400" fill="#64748b">Conditional 18-week path, quantity-rate cost, RACI, SLA, insurance and dual rollback</text><line x1="72" y1="220" x2="2328" y2="220" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><rect x="72" y="255" width="1090" height="430" rx="24" fill="#fffdfa" stroke="#16856b" stroke-width="3"/><text x="105" y="305" text-anchor="start" font-size="20" font-weight="760" fill="#172033">CONDITIONAL 18-WEEK DEPENDENCY CHAIN · STARTS AFTER G0</text><rect x="105" y="365" width="145" height="110" rx="10" fill="#dff1ea" stroke="#16856b" stroke-width="2"/><text x="177" y="396" text-anchor="middle" font-size="14" font-weight="800" fill="#172033">W00-02</text><text x="177" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">AUTH/TITLE</text><line x1="250" y1="420" x2="273" y2="420" stroke="#172033" stroke-width="2" stroke-linecap="round"/><rect x="273" y="365" width="145" height="110" rx="10" fill="#dff1ea" stroke="#16856b" stroke-width="2"/><text x="345" y="396" text-anchor="middle" font-size="14" font-weight="800" fill="#172033">W03-05</text><text x="345" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#172033">REVIEWS</t