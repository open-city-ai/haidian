="1278" y="964" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">a stop trigger isolates the AI island within 2 minutes without closing the</text><text x="1278" y="980" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">ordinary route</text><circle cx="1248" cy="1019" r="15" fill="#16856b"/><text x="1248" y="1024" text-anchor="middle" font-size="12" font-weight="800" fill="#fffdfa">3</text><text x="1278" y="1016" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">a complaint receives acknowledgment within 1 working day and a status within 5</text><text x="1278" y="1032" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">working days</text><circle cx="1248" cy="1071" r="15" fill="#16856b"/><text x="1248" y="1076" text-anchor="middle" font-size="12" font-weight="800" fill="#fffdfa">4</text><text x="1278" y="1068" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">opening and closeout checks sign route, desk, paper stock, telephone, power</text><text x="1278" y="1084" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">isolation and maintenance access</text><circle cx="1248" cy="1123" r="15" fill="#b84646"/><text x="1248" y="1128" text-anchor="middle" font-size="12" font-weight="800" fill="#fffdfa">5</text><text x="1278" y="1120" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">a critical accessibility, fire, privacy or consent failure reduces AI service</text><text x="1278" y="1136" text-anchor="start" font-size="13" font-weight="400" fill="#fffdfa">capacity to zero immediately</text><line x1="1230" y1="1182" x2="2290" y2="1182" stroke="#54708b" stroke-width="2" stroke-linecap="round"/><text x="1230" y="1215" text-anchor="start" font-size="13" font-weight="700" fill="#f0ce7b">RETIRE: isolate/remove island, cap interfaces, restore floor, retain ordinary service, notify, close complaints, archive.</text><rect x="72" y="1270" width="2256" height="55" 