<rect x="105" y="585" width="1020" height="70" rx="10" fill="#10233f" stroke="#10233f" stroke-width="2"/><text x="130" y="617" text-anchor="start" font-size="14" font-weight="700" fill="#fffdfa">PROCUREMENT: two-stage, performance-based, competitive, open quantities + rates; no preferred supplier.</text><text x="130" y="642" text-anchor="start" font-size="13" font-weight="400" fill="#b8ccdd">PAYMENT: after accepted route, blackout, handover and closeout evidence.</text><rect x="72" y="720" width="1090" height="520" rx="24" fill="#fffdfa" stroke="#d86f45" stroke-width="3"/><text x="105" y="770" text-anchor="start" font-size="19" font-weight="760" fill="#172033">QUANTITY × RATE CONCEPT COST · LOW CONFIDENCE, NOT TENDER</text><text x="108" y="810" text-anchor="start" font-size="14" font-weight="650" fill="#172033">Survey/design/reviews</text><text x="565" y="810" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">1 package</text><text x="1040" y="810" text-anchor="end" font-size="13" font-weight="700" fill="#172033">CNY 100–150k</text><text x="108" y="858" text-anchor="start" font-size="14" font-weight="650" fill="#172033">Route + reversible floor</text><text x="565" y="858" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">180 sqm × 800–1200</text><text x="1040" y="858" text-anchor="end" font-size="13" font-weight="700" fill="#172033">CNY 144–216k</text><text x="108" y="906" text-anchor="start" font-size="14" font-weight="650" fill="#172033">Staffed/paper fit-out</text><text x="565" y="906" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">24 sqm × 4500–6500</text><text x="1040" y="906" text-anchor="end" font-size="13" font-weight="700" fill="#172033">CNY 108–156k</text><text x="108" y="954" text-anchor="start" font-size="14" font-weight="650" fill="#172033">AI island/offline interface</text><text x="565" y="954" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">12 sqm × 12–18k</text><text x="1040" y="954" text-anchor="end" font-size="13" font-weight="700" fill="#172033">CNY 144–216k</text><text x="108" y="1002" text-anchor="start" font-size="14" font-weight="500" fill="#172033">Wayfinding/accessibility</text><text x="565" y="1002" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">1 package</text><text x="1040" y="1002" text-anchor="end" font-size="13" font-weight="700" fill="#172033">CNY 80–120k</text><text x="108" y="1050" text-anchor="start" font-size="14" font-weight="500" fill="#172033">Test/train/reinstate</text><text x="565" y="1050" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">1 package</text><text x="1040" y="1050" text-anchor="end" font-size="13" font-weight="700" fill="#172033">CNY 80–120k</text><line x1="105" y1="1090" x2="1125" y2="1090" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><text x="108" y="1125" text-anchor="start" font-size="16" font-weight="800" fill="#d86f45">CAPEX +15% CONTINGENCY</text><text x="1125" y="1125" text-anchor="end" font-size="16" font-weight="800" fill="#d86f45">CNY 754,400–1,124,700</text><text x="108" y="1162" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">MONTHLY OPEX: 320 staff-hours + maintenance + translation/accessibility + data/audit, plus 10% reserve</text><text x="1125" y="1195" text-anchor="end" font-size="16" font-weight="800" fill="#16856b">CNY 32,780–54,340 / month</text><rect x="1195" y="255" width="1133" height="535" rx="24" fill="#fffdfa" stroke="#bd891e" stroke-width="3"/><text x="1230" y="305" text-anchor="start" font-size="18" font-weight="760" fill="#172033">RACI ASSET HANDOFF · EVERY ORGANISATION ROLE UNCONFIRMED</text><text x="1230" y="345" text-anchor="start" font-size="13" font-weight="800" fill="#bd891e">ASSET</text><text x="1510" y="345" text-anchor="start" font-size="13" font-weight="800" fill="#bd891e">RESPONSIBLE</text><text x="1765" y="345" text-anchor="start" font-size="13" font-weight="800" fill="#bd891e">ACCOUNTABLE</text><text x="2020" y="345" text-anchor="start" font-size="13" font-weight="800" fill="#bd891e">CONSULTED</text><rect x="1222" y="365" width="1070" height="64" rx="7" fill="#f8fafb" stroke="#cbd5e1" stroke-width="1"/><text x="1230" y="388" text-anchor="start" font-size="13" font-weight="700" fill="#172033">ordinary route and</text><text x="1230" y="403" text-anchor="start" font-size="13" font-weight="700" fill="#172033">floor</text><text x="1510" y="388" text-anchor="start" font-size="13" font-weight="500" fill="#172033">site works</text><text x="1510" y="403" text-anchor="start" font-size="13" font-weight="500" fill="#172033">contractor role</text><text x="1765" y="388" text-anchor="start" font-size="13" font-weight="500" fill="#172033">public-asset</text><text x="1765" y="403" text-anchor="start" font-size="13" font-weight="500" fill="#172033">owner role</text><text x="2020" y="388" text-anchor="start" font-size="13" font-weight="500" fill="#172033">accessibility and</text><text x="2020" y="403" text-anchor="start" font-size="13" font-weight="500" fill="#172033">fire reviewers</text><rect x="1222" y="441" width="1070" height="64" rx="7" fill="#fbf8ef" stroke="#cbd5e1" stroke-width="1"/><text x="1230" y="464" text-anchor="start" font-size="13" font-weight="700" fill="#172033">staffed, telephone</text><text x="1230" y="479" text-anchor="start" font-size="13" font-weight="700" fill="#172033">and paper service</text><text x="1510" y="464" text-anchor="start" font-size="13" font-weight="500" fill="#172033">public-service</text><text x="1510" y="479" text-anchor="start" font-size="13" font-weight="500" fill="#172033">operator role</text><text x="1765" y="464" text-anchor="start" font-size="13" font-weight="500" fill="#172033">service</text><text x="1765" y="479" text-anchor="start" font-size="13" font-weight="500" fill="#172033">commissioning</text><text x="2020" y="464" text-anchor="start" font-size="13" font-weight="500" fill="#172033">community and</text><text x=