<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#718096"/></marker></defs>
<style>.title{font:700 42px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#142B4A}.sub{font:20px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#5C6F84}.label{font:700 22px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#142B4A}.body{font:17px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#334E68}.small{font:15px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#5C6F84}.warn{font:600 16px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#A84D3D}.white{font:700 18px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#fff}.tiny{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#66788A}</style>
<rect width="1800" height="1100" fill="#F5F8FB"/>
<text x="70" y="70" class="title">人本城市操作系统｜公共空间连接、组件与转化链</text>
<text x="70" y="106" class="sub">南北贯通 + 东西缝合 · 公共贡献展示 · 社群到版本发布的转化链</text>
<text x="1730" y="72" text-anchor="end" class="warn">概念 / 非评分</text>
<rect x="54" y="146" width="1000" height="680" rx="18" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="84" y="190" class="label">连接策略</text>
<text x="84" y="220" class="small">只复用既有锚点；方向是阅读规则，不是测绘线位。</text>
<line x1="250" y1="300" x2="250" y2="710" stroke="#3D76EA" stroke-width="12" stroke-linecap="round"/>
<line x1="250" y1="360" x2="900" y2="360" stroke="#E9A93A" stroke-width="8" stroke-dasharray="18 14" marker-end="url(#arrow)"/>
<line x1="250" y1="550" x2="900" y2="550" stroke="#E9A93A" stroke-width="8" stroke-dasharray="18 14" marker-end="url(#arrow)"/>
<text x="180" y="280" text-anchor="middle" class="small">南北</text>
<text x="590" y="334" text-anchor="middle" class="small">东西缝合</text>
<circle cx="250" cy="330" r="48" fill="#3D76EA"/>
<text x="250" y="336" text-anchor="middle" class="white">众智园</text>
<circle cx="250" cy="500" r="48" fill="#2A9D8F"/>
<text x="250" y="506" text-anchor="middle" class="white">AI原点社区</text>
<circle cx="250" cy="670" r="48" fill="#E9A93A"/>
<text x="250" y="676" text-anchor="middle" class="white">大钟寺</text>
<text x="340" y="310" class="body"><tspan x="340" dy="0">普通到达 → 人工选择 → 受控机器 → 蓝绿恢复 → 退出回放</tspan></text>
<text x="340" y="460" class="body"><tspan x="340" dy="0">公共问题台／共享共学／无屏停留</tspan></text>
<text x="340" y="610" class="body"><tspan x="340" dy="0">每条 AI 辅助路径旁都保留人的路径</tspan></text>
<rect x="84" y="744" width="940" height="54" rx="10" fill="#FFF4EF" stroke="#F1C5B8"/>
<text x="108" y="778" class="warn">停止：缺授权、无障碍复核、责任或回放 → 留在上一道门，不扩展。</text>
<rect x="1080" y="146" width="666" height="680" rx="18" fill="#FFFFFF" stroke="#CBD7E3" stroke-width="2"/>
<text x="1110" y="190" class="label">可复用公共空间组件</text>
<rect x="1110" y="235" width="606" height="78" rx="12" fill="#F7FAFC" stroke="#2A9D8F" stroke-width="3"/>
<circle cx="1144" cy="274" r="16" fill="#2A9D8F"/>
<text x="1175" y="282" class="body">人工入口</text>
<rect x="1110" y="337" width="606" height="78" rx="12" fill="#F7FAFC" stroke="#3D76EA" stroke-width="3"/>
<circle cx="1144" cy="376" r="16" fill="#3D76EA"/>
<text x="1175" y="384" class="body">代际共学</text>
<rect x="1110" y="439" width="606" height="78" rx="12" fill="#F7FAFC" stroke="#5E9C76" stroke-width="3"/>
<circle cx="1144" cy="478" r="16" fill="#5E9C76"/>
<text x="1175" y="486" class="body">无屏恢复</text>
<rect x="1110" y="541" width="606" height="78" rx="12" fill="#F7FAFC" stroke="#7657C8" stroke-width="3"/>
<circle cx="1144" cy="580" r="16" fill="#7657C8"/>
<text x="1175" y="588" class="body">贡献回放</text>
<rect x="1110" y="643" width="606" height="78" rx="12" fill="#F7FAFC" stroke="#E76F51" stroke-width="3"/>
<circle cx="1144" cy="682" r="16" fill="#E76F51"/>
<text x="1175" y="690" class="body">暂停回退</text>
<rect x="54" y="850" width="1692" height="180" rx="18" fill="#142B4A"/>
<text x="84" y="890" class="white">开发者／社区转化（仅为概念机制）</text>
<rect x="100" y="920" width="300" height="62" rx="10" fill="#2A9D8F"/>
<text x="250" y="951" text-anchor="middle" class="white">公开问题</text>
<line x1="410" y1="951" x2="490" y2="951" stroke="#C9D5E2" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="510" y="920" width="300" height="62" rx="10" fill="#2A9D8F"/>
<text x="660" y="951" text-anchor="middle" class="white">共学／复核</text>
<line x1="820" y1="951" x2="900" y2="951" stroke="#C9D5E2" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="920" y="920" width="300" height="62" rx="10" fill="#2A9D8F"/>
<text x="1070" y="951" text-anchor="middle" class="white">受控场景</text>
<line x1="1230" y1="951" x2="1310" y2="951" stroke="#C9D5E2" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1330" y="920" width="300" height="62" rx="10" fill="#2A9D8F"/>
<text x="1480" y="951" text-anchor="middle" class="white">回放／发布</text>
<text x="84" y="1015" class="tiny">仅为概念建议 · official_boundary=false · provisional_constraint · 不表达尺度／运营者／审批／绩效</text>
</svg>
