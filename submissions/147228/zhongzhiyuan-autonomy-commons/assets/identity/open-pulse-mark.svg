<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Jing-Zhang Open Pulse identity mark</title>
  <desc id="desc">Two parallel railway lines, three open public nodes and two switch diamonds. A concept identity direction by Xu Bingnan, not a registered trademark.</desc>
  <rect width="1200" height="600" rx="28" fill="#101923"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 222 H1080" stroke="#91b4ab" stroke-width="16"/>
    <path d="M120 310 H1080" stroke="#afc5e9" stroke-width="16"/>
    <path d="M120 222 H1080" stroke="#f1eee5" stroke-width="2" opacity=".65"/>
    <path d="M120 310 H1080" stroke="#f1eee5" stroke-width="2" opacity=".65"/>
  </g>
  <g fill="#101923" stroke="#d9c28c" stroke-width="12">
    <path d="M360 178 l44 44 -44 44 -44 -44z"/>
    <path d="M840 266 l44 44 -44 44 -44 -44z"/>
  </g>
  <g fill="#101923" stroke="#dd9c7b" stroke-width="14">
    <circle cx="200" cy="266" r="44"/>
    <circle cx="600" cy="266" r="44"/>
    <circle cx="1000" cy="266" r="44"/>
  </g>
  <g fill="#dd9c7b">
    <circle cx="200" cy="266" r="13"/><circle cx="600" cy="266" r="13"/><circle cx="1000" cy="266" r="13"/>
  </g>
  <g fill="#f1eee5" font-family="Arial, PingFang SC, sans-serif">
    <text x="120" y="110" font-size="38" letter-spacing="7">JING-ZHANG OPEN PULSE</text>
    <text x="120" y="470" font-size="30">京张开源脉冲</text>
    <text x="120" y="520" font-size="20" fill="#93a5ae">two rails · three public nodes · reversible switches</text>
    <text x="200" y="380" text-anchor="middle" font-size="20" fill="#93a5ae">众智园</text>
    <text x="600" y="380" text-anchor="middle" font-size="20" fill="#93a5ae">AI 原点</text>
    <text x="1000" y="380" text-anchor="middle" font-size="20" fill="#93a5ae">大钟寺</text>
  </g>
</svg>
