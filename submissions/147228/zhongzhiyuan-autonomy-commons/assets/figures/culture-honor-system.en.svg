<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img">
<rect width="2400" height="1500" fill="#F4F7FB"/>
<style>.title{font:700 48px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#102A43}.subtitle{font:22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#627D98}.eyebrow{font:700 16px Menlo,Consolas,monospace;letter-spacing:2px;fill:#138A7E}.head{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#16324F}.body{font:19px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27445F}.small{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#627D98}.chip{font:700 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#16324F}.light{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#FFFFFF}.lighthead{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#FFFFFF}.foot{font:15px Menlo,Consolas,monospace;fill:#C94C4C}</style>
<text x="84" y="58" class="eyebrow">AUTONOMY COMMONS / AGENT.4 + AGENT.5 / CULTURE AND HONOUR</text>
<text x="84" y="118" class="title">From railway memory to public AI return</text>
<text x="84" y="160" class="subtitle">Recognition belongs to evidence, maintenance and repair—not speed, celebrity or vendor exposure.</text>
<text x="2316" y="58" text-anchor="end" class="foot">CONCEPT · RIGHTS-CLEARED TEXT AND LINEWORK ONLY · NO APPROVED ARTWORK</text>
<rect x="84" y="210" width="720" height="255" rx="22" fill="#EAF1FF" stroke="#2F6FED" stroke-width="3"/>
<text x="118" y="270" class="head">01 · Railway public memory</text>
<text x="118" y="330" class="body" text-anchor="start"><tspan x="118" dy="0">Begin with continuous arrival, engineering care and public</tspan><tspan x="118" dy="30">passage, using rights-cleared text, linework and</tspan><tspan x="118" dy="30">public-source indexes only.</tspan></text>
<path d="M809 338 H839" stroke="#BCCCDC" stroke-width="6"/>
<rect x="844" y="210" width="720" height="255" rx="22" fill="#EAF8F5" stroke="#138A7E" stroke-width="3"/>
<text x="878" y="270" class="head">02 · Zhongguancun open collaboration</text>
<text x="878" y="330" class="body" text-anchor="start"><tspan x="878" dy="0">Record reproducible methods, maintenance contributions and</tspan><tspan x="878" dy="30">failure repairs; company exposure or model rank does not</tspan><tspan x="878" dy="30">substitute for contribution.</tspan></text>
<path d="M1569 338 H1599" stroke="#BCCCDC" stroke-width="6"/>
<rect x="1604" y="210" width="720" height="255" rx="22" fill="#FFF1EF" stroke="#E56B4A" stroke-width="3"/>
<text x="1638" y="270" class="head">03 · AI public return</text>
<text x="1638" y="330" class="body" text-anchor="start"><tspan x="1638" dy="0">Every trial returns the ordinary route, a public receipt and</tspan><tspan x="1638" dy="30">the next review date, making exit and repair visible civic</tspan><tspan x="1638" dy="30">capabilities.</tspan></text>
<rect x="84" y="520" width="720" height="430" rx="22" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
<text x="118" y="580" class="head">Zhongzhiyuan · Curb Lighthouse</text>
<text x="118" y="635" class="eyebrow">PUBLIC CARRIER</text>
<text x="118" y="675" class="body" text-anchor="start"><tspan x="118" dy="0">Show version, gate, accountable role, pause reason, repair</tspan><tspan x="118" dy="30">state and review date; never show personal trajectories.</tspan></text>
<text x="118" y="815" class="eyebrow">RECOGNITION RULE</text>
<text x="118" y="855" class="body" text-anchor="start"><tspan x="118" dy="0">Display only evidenced, replayable, rights-cleared public</tspan><tspan x="118" dy="30">contributions with an expiry date.</tspan></text>
<rect x="844" y="520" width="720" height="430" rx="22" fill="#FFFFFF" stroke="#138A7E" stroke-width="3"/>
<text x="878" y="580" class="head">AI Origin · Human-Takeover Marker</text>
<text x="878" y="635" class="eyebrow">PUBLIC CARRIER</text>
<text x="878" y="675" class="body" text-anchor="start"><tspan x="878" dy="0">Record rejected, paused, human-return and repaired</tspan><tspan x="878" dy="30">decisions, including how the ordinary route was restored.</tspan></text>
<text x="878" y="815" class="eyebrow">RECOGNITION RULE</text>
<text x="878" y="855" class="body" text-anchor="start"><tspan x="878" dy="0">Recognition goes to timely stops, accessible service and</tspan><tspan x="878" dy="30">completed repair, not unverified automation speed.</tspan></text>
<rect x="1604" y="520" width="720" height="430" rx="22" fill="#FFFFFF" stroke="#E56B4A" stroke-width="3"/>
<text x="1638" y="580" class="head">Dazhongsi · Transfer Receipt Wall</text>
<text x="1638" y="635" class="eyebrow">PUBLIC CARRIER</text>
<text x="1638" y="675" class="body" text-anchor="start"><tspan x="1638" dy="0">Place rail, walking, wheelchair, freight and staffed</tspan><tspan x="1638" dy="30">service in one readable receipt, with breaks and</tspan><tspan x="1638" dy="30">restoration shown.</tspan></text>
<text x="1638" y="815" class="eyebrow">RECOGNITION RULE</text>
<text x="1638" y="855" class="body" text-anchor="start"><tspan x="1638" dy="0">Recognise cross-disciplinary work only when the complete</tspan><tspan x="1638" dy="30">journey remains; any ordinary-route break withdraws the</tspan><tspan x="1638" dy="30">display and reopens review.</tspan></text>
<text x="84" y="1020" class="head">PUBLIC RECOGNITION RECEIPT · SIX REQUIRED FIELDS</text>
<rect x="84" y="1050" width="350" height="64" rx="32" fill="#EAF1FF" stroke="#2F6FED"/>
<text x="259" y="1091" class="chip" text-anchor="middle">contribution</text>
<rect x="464" y="1050" width="350" height="64" rx="32" fill="#EAF8F5" stroke="#138A7E"/>
<text x="639" y="1091" class="chip" text-anchor="middle">evidence receipt</text>
<rect x="844" y="1050" width="350" height="64" rx="32" fill="#EAF1FF" stroke="#2F6FED"/>
<text x="1019" y="1091" class="chip" text-anchor="middle">independent review</text>
<rect x="1224" y="1050" width="350" height="64" rx="32" fill="#EAF8F5" stroke="#138A7E"/>
<text x="1399" y="1091" class="chip" text-anchor="middle">rights / licence</text>
<rect x="1604" y="1050" width="350" height="64" rx="32" fill="#EAF1FF" stroke="#2F6FED"/>
<text x="1779" y="1091" class="chip" text-anchor="middle">maintenance owner</text>
<rect x="1984" y="1050" width="350" height="64" rx="32" fill="#EAF8F5" stroke="#138A7E"/>
<text x="2159" y="1091" class="chip" text-anchor="middle">expiry / next review</text>
<text x="84" y="1185" class="head">FIVE-LAYER PUBLIC WAYFINDING</text>
<rect x="84" y="1215" width="420" height="72" rx="14" fill="#2F6FED"/>
<text x="294" y="1260" class="light" text-anchor="middle">site + memory</text>
<rect x="540" y="1215" width="420" height="72" rx="14" fill="#138A7E"/>
<text x="750" y="1260" class="light" text-anchor="middle">ordinary route</text>
<rect x="996" y="1215" width="420" height="72" rx="14" fill="#E9A23B"/>
<text x="1206" y="1260" class="light" text-anchor="middle">status + consent</text>
<rect x="1452" y="1215" width="420" height="72" rx="14" fill="#E56B4A"/>
<text x="1662" y="1260" class="light" text-anchor="middle">service + handover</text>
<rect x="1908" y="1215" width="420" height="72" rx="14" fill="#7457C8"/>
<text x="2118" y="1260" class="light" text-anchor="middle">redress + archive + return</text>
<rect x="84" y="1335" width="2232" height="90" rx="18" fill="#16324F"/>
<text x="1200" y="1373" class="light" text-anchor="middle">Q1 calibrate → Q2 audit a route → Q3 bounded staffed demo → Q4 publish repair, withdrawal or continuation</text>
<text x="1200" y="1405" class="lighthead" text-anchor="middle">Build to test; publish to repair; return to public use.</text>
<text x="84" y="1470" class="foot">Withdraw when evidence, rights, maintenance ownership, review date or ordinary-route continuity is missing.</text></svg>
