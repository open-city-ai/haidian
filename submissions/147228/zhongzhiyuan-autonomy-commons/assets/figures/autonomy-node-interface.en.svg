<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Public interface and functional bands for three autonomous-mobility nodes</title>
  <desc id="desc">Concept-only diagram: an ordinary human route comes first, followed by public status and consent, a bounded service window, human handover or stop, and restoration of the ordinary route. Not a road section, redline, or engineering drawing.</desc>
  <rect width="1600" height="1060" fill="#f7f9fc"/><rect x="54" y="42" width="1492" height="976" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="94" y="102" fill="#0f172a" font-family="sans-serif" font-size="34" font-weight="700">Three autonomous-mobility nodes: public interfaces before vehicle paths</text>
  <text x="94" y="138" fill="#475569" font-family="sans-serif" font-size="18">CONCEPT ONLY · FUNCTIONAL BANDS ONLY · HUMAN ROUTE FIRST</text>
  <rect x="1080" y="76" width="410" height="78" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="1104" y="105" fill="#9a3412" font-family="sans-serif" font-size="16" font-weight="700">BOUNDARY</text><text x="1104" y="130" fill="#9a3412" font-family="sans-serif" font-size="15">dimensions = null · official road = false</text>
  <text x="94" y="190" fill="#334155" font-family="sans-serif" font-size="18" font-weight="700">SHARED SEQUENCE</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle"><rect x="94" y="214" width="234" height="54" rx="12" fill="#dbeafe"/><text x="211" y="247" fill="#1e3a8a">ordinary human route</text><path d="M328 241 H370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="214" width="234" height="54" rx="12" fill="#dcfce7"/><text x="487" y="247" fill="#166534">status + consent</text><path d="M604 241 H646" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="646" y="214" width="234" height="54" rx="12" fill="#fef3c7"/><text x="763" y="247" fill="#92400e">bounded service</text><path d="M880 241 H922" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="922" y="214" width="234" height="54" rx="12" fill="#fee2e2"/><text x="1039" y="247" fill="#991b1b">human handover / stop</text><path d="M1156 241 H1198" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1198" y="214" width="234" height="54" rx="12" fill="#dbeafe"/><text x="1315" y="247" fill="#1e3a8a">restore ordinary route</text></g>
  <g font-family="sans-serif"><text x="94" y="328" fill="#0f172a" font-size="22" font-weight="700">A · Zhongzhiyuan Safety Evaluation Yard</text><rect x="94" y="350" width="330" height="78" rx="12" fill="#dbeafe"/><text x="116" y="383" fill="#1e3a8a" font-size="17" font-weight="700">Human and accessible route</text><text x="116" y="408" fill="#1e3a8a" font-size="15">arrival · crossing · park return</text><rect x="454" y="350" width="330" height="78" rx="12" fill="#dcfce7"/><text x="476" y="383" fill="#166534" font-size="17" font-weight="700">Public explanation and observation</text><text x="476" y="408" fill="#166534" font-size="15">status board · consent · audit view</text><rect x="814" y="350" width="330" height="78" rx="12" fill="#fef3c7"/><text x="836" y="383" fill="#92400e" font-size="17" font-weight="700">Closable evaluation window</text><text x="836" y="408" fill="#92400e" font-size="15">booked test · operator present</text><rect x="1174" y="350" width="316" height="78" rx="12" fill="#fee2e2"/><text x="1196" y="383" fill="#991b1b" font-size="17" font-weight="700">Stop / clear / park return</text><text x="1196" y="408" fill="#991b1b" font-size="15">missing evidence → stop</text><text x="94" y="464" fill="#64748b" font-size="15">Stop if river, flood-control, traffic, ownership, fire, energy, or accessibility evidence is missing; no window without verified handover.</text>
  <text x="94" y="530" fill="#0f172a" font-size="22" font-weight="700">B · AI Origin Accessible-Service Yard</text><rect x="94" y="552" width="330" height="78" rx="12" fill="#dbeafe"/><text x="116" y="585" fill="#1e3a8a" font-size="17" font-weight="700">Ordinary walking and wheelchair route</text><text x="116" y="610" fill="#1e3a8a" font-size="15">residential edge · assisted route</text><rect x="454" y="552" width="330" height="78" rx="12" fill="#dcfce7"/><text x="476" y="585" fill="#166534" font-size="17" font-weight="700">Human desk / non-app entry</text><text x="476" y="610" fill="#166534" font-size="15">paper · phone · face to face</text><rect x="814" y="552" width="330" height="78" rx="12" fill="#fef3c7"/><text x="836" y="585" fill="#92400e" font-size="17" font-weight="700">Optional assisted service window</text><text x="836" y="610" fill="#92400e" font-size="15">assisted booking · low-speed service</text><rect x="1174" y="552" width="316" height="78" rx="12" fill="#fee2e2"/><text x="1196" y="585" fill="#991b1b" font-size="17" font-weight="700">Human equivalent / opt out</text><text x="1196" y="610" fill="#991b1b" font-size="15">no equivalent route → stop</text><text x="94" y="666" fill="#64748b" font-size="15">Stop if the service cannot be completed by an ordinary human route, or consent, accessibility, data minimisation, and offline complaint evidence is incomplete.</text>
  <text x="94" y="732" fill="#0f172a" font-size="22" font-weight="700">C · Dazhongsi Human-Machine Transfer Lounge</text><rect x="94" y="754" width="330" height="78" rx="12" fill="#dbeafe"/><text x="116" y="787" fill="#1e3a8a" font-size="17" font-weight="700">Rail arrival and crossing</text><text x="116" y="812" fill="#1e3a8a" font-size="15">rail arrival · pedestrian crossing</text><rect x="454" y="754" width="330" height="78" rx="12" fill="#dcfce7"/><text x="476" y="787" fill="#166534" font-size="17" font-weight="700">Quiet waiting and explanation</text><text x="476" y="812" fill="#166534" font-size="15">quiet seat · public explanation</text><rect x="814" y="754" width="330" height="78" rx="12" fill="#fef3c7"/><text x="836" y="787" fill="#92400e" font-size="17" font-weight="700">Loading / maintenance window</text><text x="836" y="812" fill="#92400e" font-size="15">separated loading · maintenance</text><rect x="1174" y="754" width="316" height="78" rx="12" fill="#fee2e2"/><text x="1196" y="787" fill="#991b1b" font-size="17" font-weight="700">Event-day human recovery</text><text x="1196" y="812" fill="#991b1b" font-size="15">event / rain / network loss → stop</text><text x="94" y="868" fill="#64748b" font-size="15">Stop if station, road, fire, crowd, retail, or emergency evidence is missing; no window without a human-only route and daily-use recovery.</text></g>
  <rect x="94" y="918" width="1396" height="60" rx="12" fill="#f1f5f9"/><circle cx="126" cy="948" r="10" fill="#3b82f6"/><text x="146" y="954" fill="#334155" font-family="sans-serif" font-size="15">ordinary route</text><circle cx="276" cy="948" r="10" fill="#22c55e"/><text x="296" y="954" fill="#334155" font-family="sans-serif" font-size="15">status / consent</text><circle cx="444" cy="948" r="10" fill="#f59e0b"/><text x="464" y="954" fill="#334155" font-family="sans-serif" font-size="15">bounded service</text><circle cx="610" cy="948" r="10" fill="#ef4444"/><text x="630" y="954" fill="#334155" font-family="sans-serif" font-size="15">handover / stop</text><text x="800" y="954" fill="#475569" font-family="sans-serif" font-size="15">Concept only · dimensions/capacity/speed/ROW/permit/performance = unknown · professional review required</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
