<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">三节点空间证据链</title>
  <desc id="desc">三座 provisional 试验庭从普通人路径到公开状态、受限服务、人工接管或停止，再回到普通路径的空间证据链。不是道路、红线或部署图。</desc>
  <rect width="1800" height="1260" fill="#f4f1e8"/>
  <g font-family="Arial, PingFang SC, sans-serif" fill="#18242b">
    <text x="90" y="85" font-size="42" font-weight="700">三节点空间证据链</text>
    <text x="90" y="125" font-size="20" fill="#53646b">CONCEPTUAL SPATIAL EVIDENCE · provisional 点位 / 功能带 · 不代表道路、红线、许可或部署</text>
    <g font-size="17" font-weight="700" fill="#53646b">
      <text x="455" y="195" text-anchor="middle">01 普通人路径</text>
      <text x="730" y="195" text-anchor="middle">02 公开状态与同意</text>
      <text x="1005" y="195" text-anchor="middle">03 受限服务窗口</text>
      <text x="1280" y="195" text-anchor="middle">04 人工接管 / 停止</text>
      <text x="1555" y="195" text-anchor="middle">05 恢复普通路径</text>
    </g>
  </g>
  <g stroke="#c3cbc8" stroke-width="2" fill="#ffffff">
    <rect x="320" y="220" width="270" height="74" rx="12"/><rect x="595" y="220" width="270" height="74" rx="12"/><rect x="870" y="220" width="270" height="74" rx="12"/><rect x="1145" y="220" width="270" height="74" rx="12"/><rect x="1420" y="220" width="270" height="74" rx="12"/>
  </g>
  <g fill="#53646b" font-family="Arial, PingFang SC, sans-serif" font-size="15" text-anchor="middle">
    <text x="455" y="250">到达 / 穿行 / 无障碍</text><text x="455" y="273">ordinary route</text>
    <text x="730" y="250">状态板 / 纸面 / 电话</text><text x="730" y="273">status + consent</text>
    <text x="1005" y="250">可关闭、可预约窗口</text><text x="1005" y="273">bounded window</text>
    <text x="1280" y="250">人工接管、急停、申诉</text><text x="1280" y="273">handover / stop</text>
    <text x="1555" y="250">回到日常公共使用</text><text x="1555" y="273">ordinary route restored</text>
  </g>
  <g stroke="#9baaa7" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M590 257h5M865 257h5M1140 257h5M1415 257h5"/>
    <path d="M585 248l10 9-10 9M860 248l10 9-10 9M1135 248l10 9-10 9M1410 248l10 9-10 9"/>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="90" y="350" width="1620" height="230" rx="18" fill="#e2f0ed" stroke="#6da79e" stroke-width="3"/>
    <rect x="90" y="630" width="1620" height="230" rx="18" fill="#e6ebf6" stroke="#7f93c3" stroke-width="3"/>
    <rect x="90" y="910" width="1620" height="230" rx="18" fill="#f5e8dc" stroke="#c28d6f" stroke-width="3"/>
    <g fill="#18242b"><text x="125" y="405" font-size="28" font-weight="700">AUTO-NODE-001 · 众智园安全评测庭</text><text x="125" y="444" font-size="17" fill="#53646b">PROV-KEY-001 · AV-02 / 04 / 05 / 10 / 11 · 现场调查、消防/能源、责任与无障碍证据先于窗口</text></g>
    <g fill="#18242b"><text x="125" y="685" font-size="28" font-weight="700">AUTO-NODE-002 · AI 原点无障碍服务庭</text><text x="125" y="724" font-size="17" fill="#53646b">PROV-KEY-002 · AV-01 / 08 / 09 / 12 · 纸面、电话、人工入口与撤回路径必须同等可用</text></g>
    <g fill="#18242b"><text x="125" y="965" font-size="28" font-weight="700">AUTO-NODE-003 · 大钟寺人机换乘客厅</text><text x="125" y="1004" font-size="17" fill="#53646b">PROV-KEY-003 · AV-03 / 06 / 07 · 轨道到达、安静通行、物流维护与活动日人工路线分开</text></g>
    <g fill="#b45d45" font-size="16" font-weight="700"><text x="125" y="510">STOP：缺证据、阻断无障碍链或无法验证接管 → 停止 / 清场 / 回到普通路径</text><text x="125" y="790">STOP：人工等价服务、同意、无障碍或线下申诉缺一 → 不扩容</text><text x="125" y="1070">STOP：站点、消防、人群、天气或应急路线缺证据 → 仅保留人工日常使用</text></g>
    <g fill="#53646b" font-size="15"><text x="125" y="545">空间精度：provisional test marker · point relation only · dimensions=null · official_road=false</text><text x="125" y="825">空间精度：provisional test marker · point relation only · dimensions=null · official_road=false</text><text x="125" y="1105">空间精度：provisional test marker · point relation only · dimensions=null · official_road=false</text></g>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif" fill="#53646b">
    <text x="90" y="1190" font-size="17">证据回路：geometry/key_areas.geojson → autonomy_nodes.json → node-interface-plans → autonomous-scenarios → chain checker</text>
    <text x="90" y="1223" font-size="15">本图是概念建议 / 参考方案，供专业团队深化研究；没有官方精确边界，所有点位均为 provisional_constraint。</text>
  </g>
</svg>
