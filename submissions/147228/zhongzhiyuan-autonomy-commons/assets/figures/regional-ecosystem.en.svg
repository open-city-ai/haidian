<text x="84" y="58" class="eyebrow">AUTONOMY COMMONS / AGENT.2 / REGIONAL SYNERGY</text>
<text x="84" y="118" class="title">Five regional interfaces, one auditable return loop</text>
<text x="84" y="160" class="subtitle">Resources enter a bounded public test; evidence, repair and reusable methods return. No partnership is asserted.</text>
