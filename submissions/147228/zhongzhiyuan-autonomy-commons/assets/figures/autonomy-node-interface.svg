<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">三处自动驾驶节点的公共界面与功能带</title>
  <desc id="desc">概念层示意：普通人路径先行，公开状态和同意之后才进入受限服务窗口；任一证据或安全条件不满足就由人工接管并恢复普通路径。不是道路断面、红线或工程图。</desc>
  <rect width="1600" height="1060" fill="#f7f9fc"/>
  <rect x="54" y="42" width="1492" height="976" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="94" y="102" fill="#0f172a" font-family="sans-serif" font-size="34" font-weight="700">三处自动驾驶节点：公共界面先于车辆路径</text>
  <text x="94" y="138" fill="#475569" font-family="sans-serif" font-size="18">AUTONOMY NODE INTERFACE PLANS · CONCEPT ONLY · FUNCTIONAL BANDS ONLY</text>
  <rect x="1080" y="76" width="410" height="78" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1104" y="105" fill="#9a3412" font-family="sans-serif" font-size="16" font-weight="700">边界 / BOUNDARY</text>
  <text x="1104" y="130" fill="#9a3412" font-family="sans-serif" font-size="15">dimensions = null · official road = false</text>
  <text x="94" y="190" fill="#334155" font-family="sans-serif" font-size="18" font-weight="700">共享顺序 / SHARED SEQUENCE</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <rect x="94" y="214" width="234" height="54" rx="12" fill="#dbeafe"/><text x="211" y="247" fill="#1e3a8a">普通人路径 / ordinary route</text>
    <path d="M328 241 H370" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="370" y="214" width="234" height="54" rx="12" fill="#dcfce7"/><text x="487" y="247" fill="#166534">状态与同意 / status + consent</text>
    <path d="M604 241 H646" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="646" y="214" width="234" height="54" rx="12" fill="#fef3c7"/><text x="763" y="247" fill="#92400e">受限服务 / bounded service</text>
    <path d="M880 241 H922" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="922" y="214" width="234" height="54" rx="12" fill="#fee2e2"/><text x="1039" y="247" fill="#991b1b">人工接管 / human handover</text>
    <path d="M1156 241 H1198" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1198" y="214" width="234" height="54" rx="12" fill="#dbeafe"/><text x="1315" y="247" fill="#1e3a8a">恢复普通路径 / restore route</text>
  </g>
  <g font-family="sans-serif">
    <text x="94" y="328" fill="#0f172a" font-size="22" font-weight="700">A · 众智园安全评测庭 / Zhongzhiyuan Safety Evaluation Yard</text>
    <rect x="94" y="350" width="330" height="78" rx="12" fill="#dbeafe"/><text x="116" y="383" fill="#1e3a8a" font-size="17" font-weight="700">人行与无障碍连续带</text><text x="116" y="408" fill="#1e3a8a" font-size="15">arrival · crossing · park return</text>
    <rect x="454" y="350" width="330" height="78" rx="12" fill="#dcfce7"/><text x="476" y="383" fill="#166534" font-size="17" font-weight="700">状态解释与公共观察面</text><text x="476" y="408" fill="#166534" font-size="15">status board · consent · audit view</text>
    <rect x="814" y="350" width="330" height="78" rx="12" fill="#fef3c7"/><text x="836" y="383" fill="#92400e" font-size="17" font-weight="700">可关闭评测窗口</text><text x="836" y="408" fill="#92400e" font-size="15">booked test · operator present</text>
    <rect x="1174" y="350" width="316" height="78" rx="12" fill="#fee2e2"/><text x="1196" y="383" fill="#991b1b" font-size="17" font-weight="700">急停 / 清场 / 回到公园</text><text x="1196" y="408" fill="#991b1b" font-size="15">missing evidence → stop</text>
    <text x="94" y="464" fill="#64748b" font-size="15">停止条件：河道、防洪、交通、权属、消防、能源或无障碍证据缺失；不验证远程停止或现场交接时，不进入窗口。</text>

    <text x="94" y="530" fill="#0f172a" font-size="22" font-weight="700">B · AI 原点无障碍服务庭 / AI Origin Accessible-Service Yard</text>
    <rect x="94" y="552" width="330" height="78" rx="12" fill="#dbeafe"/><text x="116" y="585" fill="#1e3a8a" font-size="17" font-weight="700">普通步行与轮椅路线</text><text x="116" y="610" fill="#1e3a8a" font-size="15">residential edge · assisted route</text>
    <rect x="454" y="552" width="330" height="78" rx="12" fill="#dcfce7"/><text x="476" y="585" fill="#166534" font-size="17" font-weight="700">人工服务台 / 非 App 入口</text><text x="476" y="610" fill="#166534" font-size="15">paper · phone · face to face</text>
    <rect x="814" y="552" width="330" height="78" rx="12" fill="#fef3c7"/><text x="836" y="585" fill="#92400e" font-size="17" font-weight="700">可选预约服务窗口</text><text x="836" y="610" fill="#92400e" font-size="15">assisted booking · low-speed service</text>
    <rect x="1174" y="552" width="316" height="78" rx="12" fill="#fee2e2"/><text x="1196" y="585" fill="#991b1b" font-size="17" font-weight="700">等价人工 / 申诉退出</text><text x="1196" y="610" fill="#991b1b" font-size="15">no equivalent route → stop</text>
    <text x="94" y="666" fill="#64748b" font-size="15">停止条件：自动服务不能被人工等价完成；同意、无障碍、数据最小化或线下申诉证据不完整；不可把数字入口设为唯一入口。</text>

    <text x="94" y="732" fill="#0f172a" font-size="22" font-weight="700">C · 大钟寺人机换乘客厅 / Dazhongsi Human-Machine Transfer Lounge</text>
    <rect x="94" y="754" width="330" height="78" rx="12" fill="#dbeafe"/><text x="116" y="787" fill="#1e3a8a" font-size="17" font-weight="700">轨道到达与过街连续带</text><text x="116" y="812" fill="#1e3a8a" font-size="15">rail arrival · pedestrian crossing</text>
    <rect x="454" y="754" width="330" height="78" rx="12" fill="#dcfce7"/><text x="476" y="787" fill="#166534" font-size="17" font-weight="700">安静候车与公共解释</text><text x="476" y="812" fill="#166534" font-size="15">quiet seat · public explanation</text>
    <rect x="814" y="754" width="330" height="78" rx="12" fill="#fef3c7"/><text x="836" y="787" fill="#92400e" font-size="17" font-weight="700">物流 / 维护时窗</text><text x="836" y="812" fill="#92400e" font-size="15">separated loading · maintenance</text>
    <rect x="1174" y="754" width="316" height="78" rx="12" fill="#fee2e2"/><text x="1196" y="787" fill="#991b1b" font-size="17" font-weight="700">活动日人本回退</text><text x="1196" y="812" fill="#991b1b" font-size="15">event / rain / network loss → stop</text>
    <text x="94" y="868" fill="#64748b" font-size="15">停止条件：站口、道路、消防、人流、商业或应急证据缺失；不能保留 human-only 路径或恢复日常使用时，不打开服务窗口。</text>
  </g>
  <rect x="94" y="918" width="1396" height="60" rx="12" fill="#f1f5f9"/>
  <circle cx="126" cy="948" r="10" fill="#3b82f6"/><text x="146" y="954" fill="#334155" font-family="sans-serif" font-size="15">普通路径</text>
  <circle cx="276" cy="948" r="10" fill="#22c55e"/><text x="296" y="954" fill="#334155" font-family="sans-serif" font-size="15">状态/同意</text>
  <circle cx="414" cy="948" r="10" fill="#f59e0b"/><text x="434" y="954" fill="#334155" font-family="sans-serif" font-size="15">受限服务</text>
  <circle cx="560" cy="948" r="10" fill="#ef4444"/><text x="580" y="954" fill="#334155" font-family="sans-serif" font-size="15">接管/停止</text>
  <text x="760" y="954" fill="#475569" font-family="sans-serif" font-size="15">概念层 · 尺寸/容量/速度/路权/许可/性能 = unknown · 需正式数据、现场证据与专业复核</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
