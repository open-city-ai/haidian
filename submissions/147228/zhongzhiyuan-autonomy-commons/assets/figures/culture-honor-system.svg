<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img">
<rect width="2400" height="1500" fill="#F4F7FB"/>
<style>.title{font:700 48px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#102A43}.subtitle{font:22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#627D98}.eyebrow{font:700 16px Menlo,Consolas,monospace;letter-spacing:2px;fill:#138A7E}.head{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#16324F}.body{font:19px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27445F}.small{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#627D98}.chip{font:700 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#16324F}.light{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#FFFFFF}.lighthead{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#FFFFFF}.foot{font:15px Menlo,Consolas,monospace;fill:#C94C4C}</style>
<text x="84" y="58" class="eyebrow">智行京张 / AGENT.4 + AGENT.5 / 文化与荣誉</text>
<text x="84" y="118" class="title">从京张铁路公共记忆，到 AI 的公共回馈</text>
<text x="84" y="160" class="subtitle">荣誉属于证据、维护与修复，不属于速度、名人榜或企业曝光。</text>
<text x="2316" y="58" text-anchor="end" class="foot">概念建议 · 仅用清权文字与线形 · 非已批准艺术品或建设项目</text>
<rect x="84" y="210" width="720" height="255" rx="22" fill="#EAF1FF" stroke="#2F6FED" stroke-width="3"/>
<text x="118" y="270" class="head">01 · 铁路公共记忆</text>
<text x="118" y="330" class="body" text-anchor="start"><tspan x="118" dy="0">以连续到达、工程维护和公共通行为叙事起点，只使用清权文字、线</tspan><tspan x="118" dy="30">形与公开来源索引。</tspan></text>
<path d="M809 338 H839" stroke="#BCCCDC" stroke-width="6"/>
<rect x="844" y="210" width="720" height="255" rx="22" fill="#EAF8F5" stroke="#138A7E" stroke-width="3"/>
<text x="878" y="270" class="head">02 · 中关村开放协作</text>
<text x="878" y="330" class="body" text-anchor="start"><tspan x="878" dy="0">把可复现方法、维护贡献和失败修复写进公共记录，不以企业曝光或</tspan><tspan x="878" dy="30">模型排名替代贡献。</tspan></text>
<path d="M1569 338 H1599" stroke="#BCCCDC" stroke-width="6"/>
<rect x="1604" y="210" width="720" height="255" rx="22" fill="#FFF1EF" stroke="#E56B4A" stroke-width="3"/>
<text x="1638" y="270" class="head">03 · AI公共回馈</text>
<text x="1638" y="330" class="body" text-anchor="start"><tspan x="1638" dy="0">每次试验结束都归还普通路线、公开回执和下一次复核日期，让退出</tspan><tspan x="1638" dy="30">和修复成为城市能力。</tspan></text>
<rect x="84" y="520" width="720" height="430" rx="22" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
<text x="118" y="580" class="head">众智园 · 路缘灯塔</text>
<text x="118" y="635" class="eyebrow">公共载体</text>
<text x="118" y="675" class="body" text-anchor="start"><tspan x="118" dy="0">显示版本、闸门、责任角色、暂停原因、修复状态和复核日期，不</tspan><tspan x="118" dy="30">显示个人轨迹。</tspan></text>
<text x="118" y="815" class="eyebrow">荣誉规则</text>
<text x="118" y="855" class="body" text-anchor="start"><tspan x="118" dy="0">只展示有证据、可复演、已清权且有到期日的公共贡献。</tspan></text>
<rect x="844" y="520" width="720" height="430" rx="22" fill="#FFFFFF" stroke="#138A7E" stroke-width="3"/>
<text x="878" y="580" class="head">AI原点 · 人工接管纪念台</text>
<text x="878" y="635" class="eyebrow">公共载体</text>
<text x="878" y="675" class="body" text-anchor="start"><tspan x="878" dy="0">记录被否决、暂停、退回人工和完成修复的决定，公开普通路线如</tspan><tspan x="878" dy="30">何恢复。</tspan></text>
<text x="878" y="815" class="eyebrow">荣誉规则</text>
<text x="878" y="855" class="body" text-anchor="start"><tspan x="878" dy="0">荣誉属于及时停止、可访问服务和完成修复，不属于未经验证的自</tspan><tspan x="878" dy="30">动化速度。</tspan></text>
<rect x="1604" y="520" width="720" height="430" rx="22" fill="#FFFFFF" stroke="#E56B4A" stroke-width="3"/>
<text x="1638" y="580" class="head">大钟寺 · 人机换乘回执墙</text>
<text x="1638" y="635" class="eyebrow">公共载体</text>
<text x="1638" y="675" class="body" text-anchor="start"><tspan x="1638" dy="0">把轨道、步行、轮椅、物流与人工服务放进一张可读回执，标明断</tspan><tspan x="1638" dy="30">点和恢复。</tspan></text>
<text x="1638" y="815" class="eyebrow">荣誉规则</text>
<text x="1638" y="855" class="body" text-anchor="start"><tspan x="1638" dy="0">只表彰保持完整旅程的跨专业协作；任一普通路线断点都撤下展示</tspan><tspan x="1638" dy="30">并重开复核。</tspan></text>
<text x="84" y="1020" class="head">公共荣誉回执 · 六个必填字段</text>
<rect x="84" y="1050" width="350" height="64" rx="32" fill="#EAF1FF" stroke="#2F6FED"/>
<text x="259" y="1091" class="chip" text-anchor="middle">贡献内容</text>
<rect x="464" y="1050" width="350" height="64" rx="32" fill="#EAF8F5" stroke="#138A7E"/>
<text x="639" y="1091" class="chip" text-anchor="middle">证据回执</text>
<rect x="844" y="1050" width="350" height="64" rx="32" fill="#EAF1FF" stroke="#2F6FED"/>
<text x="1019" y="1091" class="chip" text-anchor="middle">独立复核</text>
<rect x="1224" y="1050" width="350" height="64" rx="32" fill="#EAF8F5" stroke="#138A7E"/>
<text x="1399" y="1091" class="chip" text-anchor="middle">权利 / 许可</text>
<rect x="1604" y="1050" width="350" height="64" rx="32" fill="#EAF1FF" stroke="#2F6FED"/>
<text x="1779" y="1091" class="chip" text-anchor="middle">维护责任</text>
<rect x="1984" y="1050" width="350" height="64" rx="32" fill="#EAF8F5" stroke="#138A7E"/>
<text x="2159" y="1091" class="chip" text-anchor="middle">到期 / 复核日期</text>
<text x="84" y="1185" class="head">五层公共导视</text>
<rect x="84" y="1215" width="420" height="72" rx="14" fill="#2F6FED"/>
<text x="294" y="1260" class="light" text-anchor="middle">场地与公共记忆</text>
<rect x="540" y="1215" width="420" height="72" rx="14" fill="#138A7E"/>
<text x="750" y="1260" class="light" text-anchor="middle">普通路线</text>
<rect x="996" y="1215" width="420" height="72" rx="14" fill="#E9A23B"/>
<text x="1206" y="1260" class="light" text-anchor="middle">状态与同意</text>
<rect x="1452" y="1215" width="420" height="72" rx="14" fill="#E56B4A"/>
<text x="1662" y="1260" class="light" text-anchor="middle">服务与接管</text>
<rect x="1908" y="1215" width="420" height="72" rx="14" fill="#7457C8"/>
<text x="2118" y="1260" class="light" text-anchor="middle">申诉、归档与归还</text>
<rect x="84" y="1335" width="2232" height="90" rx="18" fill="#16324F"/>
<text x="1200" y="1373" class="light" text-anchor="middle">Q1 校准 → Q2 审计完整路线 → Q3 有界有人演示 → Q4 发布修复、撤回或条件继续</text>
<text x="1200" y="1405" class="lighthead" text-anchor="middle">为试验而建，为修复而公开，用后归还公共使用。</text>
<text x="84" y="1470" class="foot">证据、权利、维护责任、复核日期或普通路线连续性任一缺失，即撤下展示并重开复核。</text></svg>
