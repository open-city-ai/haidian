<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img">
<rect width="2400" height="1500" fill="#F4F7FB"/>
<style>.title{font:700 48px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#102A43}.subtitle{font:22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#627D98}.eyebrow{font:700 16px Menlo,Consolas,monospace;letter-spacing:2px;fill:#138A7E}.head{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#16324F}.body{font:19px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#27445F}.small{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#627D98}.chip{font:700 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#16324F}.light{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#FFFFFF}.lighthead{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#FFFFFF}.foot{font:15px Menlo,Consolas,monospace;fill:#C94C4C}</style>
<text x="84" y="58" class="eyebrow">智行京张 / AGENT.2 / 区域协同</text>
<text x="84" y="118" class="title">五个区域接口，一条可审计的能力回路</text>
<text x="84" y="160" class="subtitle">资源进入有界公共试验，证据、修复与可复用方法返回；不把协同假设写成已确定合作。</text>
<text x="2316" y="58" text-anchor="end" class="foot">概念建议 · 接口待确认 · 无资金、土地或伙伴承诺</text>
<rect x="84" y="220" width="710" height="285" rx="20" fill="#FFFFFF" stroke="#2F6FED" stroke-width="3"/>
<rect x="84" y="220" width="12" height="285" rx="6" fill="#2F6FED"/>
<text x="116" y="270" class="head" text-anchor="start"><tspan x="116" dy="0">中关村科学城 / 海淀高校院所</tspan></text>
<text x="116" y="346" class="eyebrow">带入</text>
<text x="116" y="380" class="body" text-anchor="start"><tspan x="116" dy="0">知识 · 人才 · 开源方法 · 公共问题</tspan></text>
<text x="116" y="442" class="eyebrow">返回</text>
<text x="116" y="476" class="body" text-anchor="start"><tspan x="116" dy="0">可审计街道问题 · 可复用证据</tspan></text>
<rect x="845" y="220" width="710" height="285" rx="20" fill="#FFFFFF" stroke="#138A7E" stroke-width="3"/>
<rect x="845" y="220" width="12" height="285" rx="6" fill="#138A7E"/>
<text x="877" y="270" class="head" text-anchor="start"><tspan x="877" dy="0">怀柔科学城</tspan></text>
<text x="877" y="346" class="eyebrow">带入</text>
<text x="877" y="380" class="body" text-anchor="start"><tspan x="877" dy="0">基础科学 · 大型科研设施 · 算力</tspan></text>
<text x="877" y="442" class="eyebrow">返回</text>
<text x="877" y="476" class="body" text-anchor="start"><tspan x="877" dy="0">可解释城市接口 · 有界验证问题</tspan></text>
<rect x="1606" y="220" width="710" height="285" rx="20" fill="#FFFFFF" stroke="#E56B4A" stroke-width="3"/>
<rect x="1606" y="220" width="12" height="285" rx="6" fill="#E56B4A"/>
<text x="1638" y="270" class="head" text-anchor="start"><tspan x="1638" dy="0">未来科学城</tspan></text>
<text x="1638" y="346" class="eyebrow">带入</text>
<text x="1638" y="380" class="body" text-anchor="start"><tspan x="1638" dy="0">能源 · 材料 · 工程验证</tspan></text>
<text x="1638" y="442" class="eyebrow">返回</text>
<text x="1638" y="476" class="body" text-anchor="start"><tspan x="1638" dy="0">城市接口需求 · 可维护性证据</tspan></text>
<rect x="180" y="790" width="730" height="285" rx="20" fill="#FFFFFF" stroke="#7457C8" stroke-width="3"/>
<rect x="180" y="790" width="12" height="285" rx="6" fill="#7457C8"/>
<text x="212" y="840" class="head" text-anchor="start"><tspan x="212" dy="0">北京经开区</tspan></text>
<text x="212" y="916" class="eyebrow">带入</text>
<text x="212" y="950" class="body" text-anchor="start"><tspan x="212" dy="0">制造 · 产业转化 · 规模纪律</tspan></text>
<text x="212" y="1012" class="eyebrow">返回</text>
<text x="212" y="1046" class="body" text-anchor="start"><tspan x="212" dy="0">小颗粒公共试验回执 · 停止与修复证据</tspan></text>
<rect x="1490" y="790" width="730" height="285" rx="20" fill="#FFFFFF" stroke="#4C956C" stroke-width="3"/>
<rect x="1490" y="790" width="12" height="285" rx="6" fill="#4C956C"/>
<text x="1522" y="840" class="head" text-anchor="start"><tspan x="1522" dy="0">京津冀协同网络</tspan></text>
<text x="1522" y="916" class="eyebrow">带入</text>
<text x="1522" y="950" class="body" text-anchor="start"><tspan x="1522" dy="0">多样场景 · 比较 · 扩散</tspan></text>
<text x="1522" y="1012" class="eyebrow">返回</text>
<text x="1522" y="1046" class="body" text-anchor="start"><tspan x="1522" dy="0">版本化方法 · 可比较失败与修复</tspan></text>
<rect x="790" y="535" width="820" height="220" rx="30" fill="#16324F"/>
<text x="1200" y="585" class="lighthead" text-anchor="middle">京张带 · 三座公共证明庭</text>
<text x="1200" y="625" class="light" text-anchor="middle">预约 → 试验 → 发布证据 → 扩展或退出</text>
<text x="1200" y="665" class="light" text-anchor="middle"><tspan x="1200" dy="0">内回路 · 众智园（安全）→ AI 原点（需求 / 同意 / 申诉）↔ 北纬</tspan><tspan x="1200" dy="27">社区接口（待确认）→ 大钟寺（轨道 / 路缘）· 证据原路返回</tspan></text>
