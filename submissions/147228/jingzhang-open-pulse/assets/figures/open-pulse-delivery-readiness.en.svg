<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-label="Three-station delivery receipt: responsibility, procurement, staffing, cost method and exit together"><rect width="2400" height="1350" fill="#0c2136"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="78" y="72" text-anchor="start" font-size="22" font-weight="650" fill="#e1b742" letter-spacing="1.4" opacity="1">DELIVERY + OPERATIONS RECEIPT / 07</text><text x="2322" y="72" text-anchor="end" font-size="20" font-weight="400" fill="#55c7c3" letter-spacing="0.8" opacity="1">V3.2 / PROVISIONAL / DESIGN TARGETS ONLY</text><text x="78" y="154" text-anchor="start" font-size="45" font-weight="720" fill="#fffdf8" letter-spacing="0" opacity="1">Three-station delivery receipt: responsibility, procurement, staffing, cost method and exit together</text><text x="78" y="208" text-anchor="start" font-size="20" font-weight="400" fill="#91a9bb" letter-spacing="0" opacity="1">Defines accountable archetypes and acceptance paths only; organizations, prices, permits and observed SLA remain unconfirmed</text><line x1="78" y1="238" x2="2322" y2="238" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="78" y="280" width="720" height="790" rx="26" fill="#132d48" stroke="#74ad91" stroke-width="4" opacity="1"/><text x="110" y="330" text-anchor="start" font-size="19" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">Collective Intelligence trusted test garden</text><text x="110" y="370" text-anchor="start" font-size="13" font-weight="700" fill="#74ad91" letter-spacing="0" opacity="1">SIX RESPONSIBILITY ROLES / ALL UNCONFIRMED</text><text x="126" y="415" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• planning + landscape design</text><text x="126" y="446" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• time-bounded test operator</text><text x="126" y="477" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• park asset maintenance</text><text x="126" y="508" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• rights and data steward</text><text x="126" y="539" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• independent access/fire review</text><line x1="110" y1="590" x2="766" y2="590" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="110" y="630" text-anchor="start" font-size="14" font-weight="700" fill="#e1b742" letter-spacing="0" opacity="1">PROCUREMENT + COST BOUNDARY</text><text x="126" y="670" text-anchor="start" font-size="12" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">survey → reversible mock-up → independent acceptance</text><text x="126" y="704" text-anchor="start" font-size="12" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">time-bounded service → retain / redesign / retire</text><text x="126" y="744" text-anchor="start" font-size="11" font-weight="650" fill="#ee8b55" letter-spacing="0" opacity="1">Price: unknown; QS by component, staff, upkeep and reinstatement</text><text x="110" y="800" text-anchor="start" font-size="14" font-weight="700" fill="#55c7c3" letter-spacing="0" opacity="1">SERVICE TARGETS / NOT FIELD OBSERVED</text><text x="126" y="842" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• stop on obstruction; isolate within 15 min</text><text x="126" y="876" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• update status board within 15 min</text><text x="126" y="910" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• signed route/surface check before reopening</text><rect x="110" y="958" width="656" height="76" rx="14" fill="#381f25" stroke="#dc5c50" stroke-width="2" opacity="1"/><text x="438" y="1005" text-anchor="middle" font-size="12" font-weight="750" fill="#ffc5bd" letter-spacing="0" opacity="1">UNCLEAR DUTY, CAPACITY OR RESTORE GATE: HOLD</text><rect x="850" y="280" width="720" height="790" rx="26" fill="#132d48" stroke="#78a8e8" stroke-width="4" opacity="1"/><text x="882" y="330" text-anchor="start" font-size="19" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">AI Origin open review street</text><text x="882" y="370" text-anchor="start" font-size="13" font-weight="700" fill="#78a8e8" letter-spacing="0" opacity="1">SIX RESPONSIBILITY ROLES / ALL UNCONFIRMED</text><text x="898" y="415" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• urban + service design</text><text x="898" y="446" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• staffed release-room operator</text><text x="898" y="477" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• building/public-edge maintenance</text><text x="898" y="508" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• rights and archive steward</text><text x="898" y="539" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• independent heritage/resident review</text><line x1="882" y1="590" x2="1538" y2="590" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="882" y="630" text-anchor="start" font-size="14" font-weight="700" fill="#e1b742" letter-spacing="0" opacity="1">PROCUREMENT + COST BOUNDARY</text><text x="898" y="670" text-anchor="start" font-size="12" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">survey → reversible mock-up → independent acceptance</text><text x="898" y="704" text-anchor="start" font-size="12" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">time-bounded service → retain / redesign / retire</text><text x="898" y="744" text-anchor="start" font-size="11" font-weight="650" fill="#ee8b55" letter-spacing="0" opacity="1">Price: unknown; QS by component, staff, upkeep and reinstatement</text><text x="882" y="800" text-anchor="start" font-size="14" font-weight="700" fill="#55c7c3" letter-spacing="0" opacity="1">SERVICE TARGETS / NOT FIELD OBSERVED</text><text x="898" y="842" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• hide disputed content immediately</text><text x="898" y="876" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• acknowledge in 1 day; status in 5 days</text><text x="898" y="910" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• remove/replace within 48 h after confirmation</text><rect x="882" y="958" width="656" height="76" rx="14" fill="#381f25" stroke="#dc5c50" stroke-width="2" opacity="1"/><text x="1210" y="1005" text-anchor="middle" font-size="12" font-weight="750" fill="#ffc5bd" letter-spacing="0" opacity="1">UNCLEAR DUTY, CAPACITY OR RESTORE GATE: HOLD</text><rect x="1622" y="280" width="720" height="790" rx="26" fill="#132d48" stroke="#ee8b55" stroke-width="4" opacity="1"/><text x="1654" y="330" text-anchor="start" font-size="19" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">Dazhongsi everyday release room</text><text x="1654" y="370" text-anchor="start" font-size="13" font-weight="700" fill="#ee8b55" letter-spacing="0" opacity="1">SIX RESPONSIBILITY ROLES / ALL UNCONFIRMED</text><text x="1670" y="415" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• station + event design</text><text x="1670" y="446" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• event control room</text><text x="1670" y="477" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• public/retail/cleaning maintenance</text><text x="1670" y="508" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• content and data steward</text><text x="1670" y="539" text-anchor="start" font-size="13" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• independent rail/traffic/fire review</text><line x1="1654" y1="590" x2="2310" y2="590" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="1654" y="630" text-anchor="start" font-size="14" font-weight="700" fill="#e1b742" letter-spacing="0" opacity="1">PROCUREMENT + COST BOUNDARY</text><text x="1670" y="670" text-anchor="start" font-size="12" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">survey → reversible mock-up → independent acceptance</text><text x="1670" y="704" text-anchor="start" font-size="12" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">time-bounded service → retain / redesign / retire</text><text x="1670" y="744" text-anchor="start" font-size="11" font-weight="650" fill="#ee8b55" letter-spacing="0" opacity="1">Price: unknown; QS by component, staff, upkeep and reinstatement</text><text x="1654" y="800" text-anchor="start" font-size="14" font-weight="700" fill="#55c7c3" letter-spacing="0" opacity="1">SERVICE TARGETS / NOT FIELD OBSERVED</text><text x="1670" y="842" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• zero capacity on fire/crowd/water/noise breach</text><text x="1670" y="876" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• signed recovery check within 30 min</text><text x="1670" y="910" text-anchor="start" font-size="11" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• public defect/complaint review within 14 days</text><rect x="1654" y="958" width="656" height="76" rx="14" fill="#381f25" stroke="#dc5c50" stroke-width="2" opacity="1"/><text x="1982" y="1005" text-anchor="middle" font-size="12" font-weight="750" fill="#ffc5bd" letter-spacing="0" opacity="1">UNCLEAR DUTY, CAPACITY OR RESTORE GATE: HOLD</text><rect x="78" y="1110" width="2264" height="122" rx="20" fill="#102943" stroke="#e1b742" stroke-width="3" opacity="1"/><text x="110" y="1150" text-anchor="start" font-size="16" font-weight="750" fill="#e1b742" letter-spacing="0" opacity="1">SIX SHARED DELIVERY GATES</text><text x="110" y="1196" text-anchor="start" font-size="11" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">1. replaceable dimensions</text><text x="475" y="1196" text-anchor="start" font-size="11" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">2. independent ordinary route</text><text x="840" y="1196" text-anchor="start" font-size="11" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">3. no capacity release without inputs</text><text x="1205" y="1196" text-anchor="start" font-size="11" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">4. no invented owner or price</text><text x="1570" y="1196" text-anchor="start" font-size="11" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">5. test includes blackout + closeout</text><text x="1935" y="1196" text-anchor="start" font-size="11" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">6. retention enters statutory process</text><text x="78" y="1310" text-anchor="start" font-size="16" font-weight="400" fill="#91a9bb" letter-spacing="0" opacity="1">This is a delivery question set, not a budget, procurement document, organizational commitment, permit or achieved service level.</text></g></svg>
