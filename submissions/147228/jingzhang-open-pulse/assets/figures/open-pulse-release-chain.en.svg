<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Jing-Zhang Open Pulse: first 168 hours and first 12 weeks</title>
  <desc id="desc">Ordinary service comes first. AI is only a reversible increment governed by evidence, responsibility and human takeover.</desc>
  <rect width="1600" height="1000" fill="#f6f8f5"/>
  <rect x="36" y="30" width="1528" height="106" rx="18" fill="#132b2b"/>
  <text x="72" y="78" fill="#f6f8f5" font-size="34" font-family="Arial, sans-serif" font-weight="700">JING-ZHANG OPEN PULSE | REVERSIBLE RELEASE CHAIN</text>
  <text x="72" y="112" fill="#b9d7c9" font-size="18" font-family="Arial, sans-serif">Walking, staffed service and handcart delivery come first; AI adds a reversible layer only when evidence, ownership and takeover are ready.</text>
  <rect x="36" y="158" width="1528" height="72" rx="14" fill="#e8d8a8"/>
  <text x="72" y="188" fill="#302a1d" font-size="20" font-family="Arial, sans-serif" font-weight="700">BOUNDARY: DESIGN CONTRACT, NOT FIELD OUTCOME</text>
  <text x="72" y="216" fill="#302a1d" font-size="17" font-family="Arial, sans-serif">HOLD | authorization 0 | field observations 0 | baseline unknown | not_authorized_not_run | performance null</text>
  <text x="72" y="270" fill="#132b2b" font-size="24" font-family="Arial, sans-serif" font-weight="700">FOUR STATES: BASE → BOOST → BLACKOUT → BEQUEST</text>
  <g font-family="Arial, sans-serif">
    <rect x="36" y="294" width="360" height="92" rx="14" fill="#d8eadf" stroke="#6b9b82" stroke-width="2"/><text x="58" y="326" font-size="23" fill="#173d2f" font-weight="700">BASE | ORDINARY SERVICE</text><text x="58" y="354" font-size="16" fill="#173d2f">Arrive, ask, get help and leave without AI</text><text x="58" y="377" font-size="16" fill="#173d2f">Default open; staffed and no-app routes remain</text>
    <rect x="414" y="294" width="360" height="92" rx="14" fill="#cfe4ef" stroke="#6396ad" stroke-width="2"/><text x="436" y="326" font-size="23" fill="#17344a" font-weight="700">BOOST | BOUNDED ASSIST</text><text x="436" y="354" font-size="16" fill="#17344a">One small, reversible AI assist</text><text x="436" y="377" font-size="16" fill="#17344a">Named owner, dated evidence, human takeover</text>
    <rect x="792" y="294" width="360" height="92" rx="14" fill="#f2d4c7" stroke="#bd7866" stroke-width="2"/><text x="814" y="326" font-size="23" fill="#5b2824" font-weight="700">BLACKOUT | CIRCUIT BREAK</text><text x="814" y="354" font-size="16" fill="#5b2824">Incident, uncertainty, consent or maintenance</text><text x="814" y="377" font-size="16" fill="#5b2824">AI stops; ordinary service continues</text>
    <rect x="1170" y="294" width="394" height="92" rx="14" fill="#e3d9ee" stroke="#8a6ca4" stroke-width="2"/><text x="1192" y="326" font-size="23" fill="#3c2a50" font-weight="700">BEQUEST | LEARNING ARCHIVE</text><text x="1192" y="354" font-size="16" fill="#3c2a50">Keep redacted learning, not personal traces</text><text x="1192" y="377" font-size="16" fill="#3c2a50">Withdrawable, reviewable, not automatically scaled</text>
  </g>
  <text x="72" y="432" fill="#132b2b" font-size="24" font-family="Arial, sans-serif" font-weight="700">FIRST 168 HOURS | PROVE THAT ORDINARY SERVICE IS NOT SACRIFICED</text>
  <g font-family="Arial, sans-serif">
    <rect x="36" y="456" width="368" height="190" rx="14" fill="#ffffff" stroke="#6b9b82" stroke-width="2"/><text x="58" y="490" font-size="24" fill="#173d2f" font-weight="700">H0 | 0–24h</text><text x="58" y="520" font-size="17" fill="#173d2f">Ordinary-service lead</text><text x="58" y="550" font-size="16" fill="#173d2f">Route, staffing and rights inventory</text><text x="58" y="580" font-size="16" fill="#173d2f">STOP: no owner / accessibility seam</text><text x="58" y="612" font-size="16" fill="#173d2f" font-weight="700">RECEIPT: ordinary-service card</text>
    <rect x="420" y="456" width="368" height="190" rx="14" fill="#ffffff" stroke="#6396ad" stroke-width="2"/><text x="442" y="490" font-size="24" fill="#17344a" font-weight="700">H1 | 24–72h</text><text x="442" y="520" font-size="17" fill="#17344a">Safety and accessibility lead</text><text x="442" y="550" font-size="16" fill="#17344a">Paired walk and takeover rehearsal</text><text x="442" y="580" font-size="16" fill="#17344a">STOP: takeover fails / overreach data</text><text x="442" y="612" font-size="16" fill="#17344a" font-weight="700">RECEIPT: route-and-fallback</text>
    <rect x="804" y="456" width="368" height="190" rx="14" fill="#ffffff" stroke="#6396ad" stroke-width="2"/><text x="826" y="490" font-size="24" fill="#17344a" font-weight="700">H2 | 72–120h</text><text x="826" y="520" font-size="17" fill="#17344a">Scenario steward</text><text x="826" y="550" font-size="16" fill="#17344a">One bounded assist, minimum data</text><text x="826" y="580" font-size="16" fill="#17344a">STOP: eligibility change / no maintenance</text><text x="826" y="612" font-size="16" fill="#17344a" font-weight="700">RECEIPT: bounded-assist card</text>
    <rect x="1188" y="456" width="376" height="190" rx="14" fill="#ffffff" stroke="#bd7866" stroke-width="2"/><text x="1210" y="490" font-size="24" fill="#5b2824" font-weight="700">H3 | 120–168h</text><text x="1210" y="520" font-size="17" fill="#5b2824">Review and redress lead</text><text x="1210" y="550" font-size="16" fill="#5b2824">Feedback, near-miss, publish/retire</text><text x="1210" y="580" font-size="16" fill="#5b2824">STOP: unexplained harm / no response</text><text x="1210" y="612" font-size="16" fill="#5b2824" font-weight="700">RECEIPT: release-or-retire</text>
  </g>
  <text x="72" y="700" fill="#132b2b" font-size="24" font-family="Arial, sans-serif" font-weight="700">FIRST 12 WEEKS | ONE GATE EVERY TWO WEEKS, OTHERWISE RETURN TO BASE</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="36" y="724" width="244" height="126" rx="12" fill="#d8eadf"/><text x="54" y="754" fill="#173d2f" font-weight="700">W01–02</text><text x="54" y="781" fill="#173d2f">Ordinary service &amp; rights</text><text x="54" y="808" fill="#173d2f">fallback: BASE</text>
    <rect x="296" y="724" width="244" height="126" rx="12" fill="#d8eadf"/><text x="314" y="754" fill="#173d2f" font-weight="700">W03–04</text><text x="314" y="781" fill="#173d2f">Access &amp; safety rehearsal</text><text x="314" y="808" fill="#173d2f">failure: BLACKOUT</text>
    <rect x="556" y="724" width="244" height="126" rx="12" fill="#cfe4ef"/><text x="574" y="754" fill="#17344a" font-weight="700">W05–07</text><text x="574" y="781" fill="#17344a">One bounded public assist</text><text x="574" y="808" fill="#17344a">never a service prerequisite</text>
    <rect x="816" y="724" width="244" height="126" rx="12" fill="#cfe4ef"/><text x="834" y="754" fill="#17344a" font-weight="700">W08–09</text><text x="834" y="781" fill="#17344a">Maintenance &amp; continuity</text><text x="834" y="808" fill="#17344a">overdue: remove complexity</text>
    <rect x="1076" y="724" width="244" height="126" rx="12" fill="#f2d4c7"/><text x="1094" y="754" fill="#5b2824" font-weight="700">W10–11</text><text x="1094" y="781" fill="#5b2824">Redress &amp; evidence review</text><text x="1094" y="808" fill="#5b2824">no response: BLACKOUT</text>
    <rect x="1336" y="724" width="228" height="126" rx="12" fill="#e3d9ee"/><text x="1354" y="754" fill="#3c2a50" font-weight="700">W12</text><text x="1354" y="781" fill="#3c2a50">Scale / hold / retire</text><text x="1354" y="808" fill="#3c2a50">no improvement: BEQUEST</text>
  </g>
  <text x="72" y="916" fill="#5e6d68" font-size="17" font-family="Arial, sans-serif">OPEN-PULSE-RELEASE-CHAIN-01 | Design contract only; authorization, observation and performance results are empty.</text>
</svg>
