<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">City API and compute-energy contract</title>
  <desc id="desc">Three provisional nodes connect human fallback, minimum city API fields, compute-energy gates, human-machine right-of-way and versioned governance. Spatial and energy states remain conceptual or unknown.</desc>
