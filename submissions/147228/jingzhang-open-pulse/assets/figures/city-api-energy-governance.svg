<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">城市 API 与算电协同合同</title>
  <desc id="desc">三处临时重点区通过人本接口、城市 API、算电协同、人机混行和版本化治理相连；所有空间与能源状态均标记为概念或未知。</desc>
  <rect width="1600" height="760" fill="#101923"/>
  <text x="70" y="66" fill="#f4efe5" font-family="sans-serif" font-size="36" font-weight="600">从公共脉冲到城市 API：人本缓冲 × 算电协同</text>
  <text x="70" y="104" fill="#aebdc3" font-family="sans-serif" font-size="18">概念建议 / provisional constraint / unknown 不放行；供专业团队深化研究</text>
  <g font-family="sans-serif">
    <g fill="#d9c28c"><text x="70" y="168" font-size="20">空间节点</text><text x="390" y="168" font-size="20">普通人先行</text><text x="710" y="168" font-size="20">城市 API 最小字段</text><text x="1030" y="168" font-size="20">算电与硅基通行</text><text x="1330" y="168" font-size="20">版本化治理</text></g>
    <g stroke="#405462" stroke-width="2" fill="#182832">
      <rect x="50" y="200" width="250" height="120" rx="10"/><rect x="370" y="200" width="250" height="120" rx="10"/><rect x="690" y="200" width="250" height="120" rx="10"/><rect x="1010" y="200" width="250" height="120" rx="10"/><rect x="1310" y="200" width="240" height="120" rx="10"/>
      <rect x="50" y="370" width="250" height="120" rx="10"/><rect x="370" y="370" width="250" height="120" rx="10"/><rect x="690" y="370" width="250" height="120" rx="10"/><rect x="1010" y="370" width="250" height="120" rx="10"/><rect x="1310" y="370" width="240" height="120" rx="10"/>
      <rect x="50" y="540" width="250" height="120" rx="10"/><rect x="370" y="540" width="250" height="120" rx="10"/><rect x="690" y="540" width="250" height="120" rx="10"/><rect x="1010" y="540" width="250" height="120" rx="10"/><rect x="1310" y="540" width="240" height="120" rx="10"/>
    </g>
    <g fill="#eef1ed" font-size="22">
      <text x="75" y="246">NODE-01</text><text x="75" y="278" fill="#afc5e9" font-size="18">PROV-KEY-001</text><text x="75" y="305" fill="#aebdc3" font-size="16">可信研发花园</text>
      <text x="75" y="416">NODE-02</text><text x="75" y="448" fill="#afc5e9" font-size="18">PROV-KEY-002</text><text x="75" y="475" fill="#aebdc3" font-size="16">技能再造 / 授权</text>
      <text x="75" y="586">NODE-03</text><text x="75" y="618" fill="#afc5e9" font-size="18">PROV-KEY-003</text><text x="75" y="645" fill="#aebdc3" font-size="16">人机共享 / 国际服务</text>
      <text x="395" y="246">人工窗口</text><text x="395" y="278">纸面 / 语音 / 休息</text><text x="395" y="305" fill="#d9c28c" font-size="16">无 App 也能走</text>
      <text x="395" y="416">技能与申诉</text><text x="395" y="448">再培训 / 小商户</text><text x="395" y="475" fill="#d9c28c" font-size="16">资格规则待定</text>
      <text x="395" y="586">夜间服务</text><text x="395" y="618">低噪 / 无屏幕绿地</text><text x="395" y="645" fill="#d9c28c" font-size="16">基线 unknown</text>
      <text x="715" y="246">asset_id · geometry_version</text><text x="715" y="278">state · uncertainty</text><text x="715" y="305">role · fallback · stop</text>
      <text x="715" y="416">授权状态 · 最小数据</text><text x="715" y="448">投诉回执 · release note</text><text x="715" y="475" fill="#d9c28c" font-size="16">不做个体画像</text>
      <text x="715" y="586">年度体检 · 公众回执</text><text x="715" y="618">版本可回滚</text><text x="715" y="645" fill="#d9c28c" font-size="16">证据缺口显式化</text>
      <text x="1035" y="246">PUE 分档</text><text x="1035" y="278">绿电目标 / 余热接口</text><text x="1035" y="305" fill="#d9c28c" font-size="16">项目级状态 unknown</text>
      <text x="1035" y="416">人机混行</text><text x="1035" y="448">低速 · 可见 · 急停</text><text x="1035" y="475" fill="#d9c28c" font-size="16">不授权即不运行</text>
      <text x="1035" y="586">小月河翼候选</text><text x="1035" y="618">具身测试场</text><text x="1035" y="645" fill="#d9c28c" font-size="16">安全 / 消防 / 保险待核</text>
      <text x="1335" y="246">release note</text><text x="1335" y="278">年度公开回读</text><text x="1335" y="305" fill="#d9c28c" font-size="16">保留 / 修复 / 退役</text>
      <text x="1335" y="416">阻断条件</text><text x="1335" y="448">unknown 不放行</text><text x="1335" y="475" fill="#d9c28c" font-size="16">恢复普通服务</text>
      <text x="1335" y="586">geometry v0.x</text><text x="1335" y="618">provisional</text><text x="1335" y="645" fill="#d9c28c" font-size="16">专业团队深化</text>
    </g>
    <g stroke="#afc5e9" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M300 260H370"/><path d="M620 260H690"/><path d="M940 260H1010"/><path d="M1260 260H1310"/><path d="M300 430H370"/><path d="M620 430H690"/><path d="M940 430H1010"/><path d="M1260 430H1310"/><path d="M300 600H370"/><path d="M620 600H690"/><path d="M940 600H1010"/><path d="M1260 600H1310"/></g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#afc5e9"/></marker></defs>
</svg>
