<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2250" viewBox="0 0 3600 2250" role="img" aria-label="One spine, three stations, two wings and a stoppable evidence loop"><rect width="3600" height="2250" fill="#f6f3ed"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="120" y="118" text-anchor="start" font-size="31" font-weight="400" fill="#61788b" letter-spacing="1.1">JING-ZHANG OPEN PULSE / REVIEW ENTRY 01</text><text x="3480" y="118" text-anchor="end" font-size="29" font-weight="400" fill="#ea8f5c" letter-spacing="0.8">V2.4 / PROVISIONAL / CONCEPT ONLY</text><text x="120" y="232" text-anchor="start" font-size="54" font-weight="700" fill="#14283a" letter-spacing="0">One spine, three stations, two wings and a stoppable evidence loop</text><text x="120" y="318" text-anchor="start" font-size="27" font-weight="400" fill="#61788b" letter-spacing="0">Read the whole-belt relation and S-02 state together; separate tabletop replay, field window and ordinary service</text><line x1="120" y1="365" x2="3480" y2="365" stroke="#c6d3d3" stroke-width="3" stroke-linecap="round"/><text x="120" y="425" text-anchor="start" font-size="28" font-weight="400" fill="#078f95" letter-spacing="0">Taskbook collaboration interfaces only; no partnership is claimed</text><rect x="120" y="452" width="648" height="76" rx="22" fill="#eef3f1" stroke="#c6d3d3" stroke-width="2"/><text x="444" y="502" text-anchor="middle" font-size="20" font-weight="520" fill="#14283a" letter-spacing="0">North Latitude / Haidian universities</text><rect x="792" y="452" width="648" height="76" rx="22" fill="#eef3f1" stroke="#c6d3d3" stroke-width="2"/><text x="1116" y="502" text-anchor="middle" font-size="20" font-weight="520" fill="#14283a" letter-spacing="0">Future Science City</text><rect x="1464" y="452" width="648" height="76" rx="22" fill="#eef3f1" stroke="#c6d3d3" stroke-width="2"/><text x="1788" y="502" text-anchor="middle" font-size="20" font-weight="520" fill="#14283a" letter-spacing="0">Huairou Science City</text><rect x="2136" y="452" width="648" height="76" rx="22" fill="#eef3f1" stroke="#c6d3d3" stroke-width="2"/><text x="2460" y="502" text-anchor="middle" font-size="20" font-weight="520" fill="#14283a" letter-spacing="0">Beijing E-Town</text><rect x="2808" y="452" width="648" height="76" rx="22" fill="#eef3f1" stroke="#c6d3d3" stroke-width="2"/><text x="3132" y="502" text-anchor="middle" font-size="20" font-weight="520" fill="#14283a" letter-spacing="0">Beijing-Tianjin-Hebei network</text><rect x="120" y="585" width="2150" height="1440" rx="34" fill="#fffefa" stroke="#c6d3d3" stroke-width="3"/><text x="180" y="660" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">ONE SPINE, THREE STATIONS, TWO WINGS</text><rect x="200" y="720" width="815" height="1120" rx="30" fill="#e1eee8" stroke="#73a892" stroke-width="3"/><rect x="1375" y="720" width="815" height="1120" rx="30" fill="#e3ecf8" stroke="#88ace1" stroke-width="3"/><text x="285" y="805" text-anchor="start" font-size="35" font-weight="650" fill="#14283a" letter-spacing="0">Zhongguancun service wing</text><text x="285" y="852" text-anchor="start" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">enterprise / talent / capital / services</text><text x="2105" y="805" text-anchor="end" font-size="35" font-weight="650" fill="#14283a" letter-spacing="0">Xiaoyue River scenario wing</text><text x="2105" y="852" text-anchor="end" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">community / blue-green / everyday issues</text><line x1="1195" y1="760" x2="1195" y2="1810" stroke="#14283a" stroke-width="18" stroke-linecap="round"/><rect x="760" y="820" width="870" height="180" rx="28" fill="#e1eee8" stroke="#73a892" stroke-width="5"/><line x1="760" y1="910" x2="660" y2="910" stroke="#73a892" stroke-width="6" stroke-linecap="round"/><line x1="1630" y1="910" x2="1730" y2="910" stroke="#73a892" stroke-width="6" stroke-linecap="round"/><circle cx="1195" cy="910" r="35" fill="#e3bb58" stroke="#14283a" stroke-width="5"/><text x="835" y="900" text-anchor="start" font-size="20" font-weight="680" fill="#14283a" letter-spacing="0">Collective Intelligence Garden</text><text x="835" y="955" text-anchor="start" font-size="16" font-weight="400" fill="#61788b" letter-spacing="0">trusted R&amp;D / problem validation</text><rect x="760" y="1145" width="870" height="180" rx="28" fill="#e3ecf8" stroke="#88ace1" stroke-width="5"/><line x1="760" y1="1235" x2="660" y2="1235" stroke="#88ace1" stroke-width="6" stroke-linecap="round"/><line x1="1630" y1="1235" x2="1730" y2="1235" stroke="#88ace1" stroke-width="6" stroke-linecap="round"/><circle cx="1195" cy="1235" r="35" fill="#e3bb58" stroke="#14283a" stroke-width="5"/><text x="835" y="1225" text-anchor="start" font-size="20" font-weight="680" fill="#14283a" letter-spacing="0">AI Origin</text><text x="835" y="1280" text-anchor="start" font-size="16" font-weight="400" fill="#61788b" letter-spacing="0">open-source translation / contribution receipt</text><rect x="760" y="1470" width="870" height="180" rx="28" fill="#f8e8dd" stroke="#ea8f5c" stroke-width="5"/><line x1="760" y1="1560" x2="660" y2="1560" stroke="#ea8f5c" stroke-width="6" stroke-linecap="round"/><line x1="1630" y1="1560" x2="1730" y2="1560" stroke="#ea8f5c" stroke-width="6" stroke-linecap="round"/><circle cx="1195" cy="1560" r="35" fill="#e3bb58" stroke="#14283a" stroke-width="5"/><text x="835" y="1550" text-anchor="start" font-size="20" font-weight="680" fill="#14283a" letter-spacing="0">Dazhongsi</text><text x="835" y="1605" text-anchor="start" font-size="16" font-weight="400" fill="#61788b" letter-spacing="0">urban experience / everyday meeting place</text><text x="1195" y="1905" text-anchor="middle" font-size="22" font-weight="400" fill="#61788b" letter-spacing="0">Ordinary public use stays on the spine; the wings are interfaces only</text><rect x="2350" y="585" width="1130" height="1440" rx="34" fill="#fffefa" stroke="#c6d3d3" stroke-width="3"/><text x="2410" y="660" text-anchor="start" font-size="22" font-weight="700" fill="#14283a" letter-spacing="0">S-02 SAMPLE RECEIPT / LOW-SPEED DELIVERY ROBOT</text><text x="2410" y="720" text-anchor="start" font-size="24" font-weight="650" fill="#61788b" letter-spacing="0">Question</text><text x="2410" y="765" text-anchor="start" font-size="18" font-weight="400" fill="#14283a" letter-spacing="0">Can it yield and return to its bay without blocking the accessible route?</text><rect x="2410" y="835" width="1010" height="250" rx="22" fill="#fffdf9" stroke="#c6d3d3" stroke-width="3"/><rect x="2410" y="835" width="14" height="250" rx="7" fill="#73a892"/><text x="2452" y="885" text-anchor="start" font-size="19" font-weight="650" fill="#73a892" letter-spacing="0.5">LOCAL SYNTHETIC TABLETOP</text><text x="2452" y="940" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">PASS  4/4 + 6/6 + 5/5</text><text x="2452" y="990" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Replays stop, withdrawal and restoration logic only</text><text x="2452" y="1017" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Zero network or real transaction</text><text x="2452" y="1044" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Zero field operation</text><text x="3378" y="885" text-anchor="end" font-size="17" font-weight="400" fill="#61788b" letter-spacing="0">LOCAL / SYNTHETIC</text><rect x="2410" y="1115" width="1010" height="250" rx="22" fill="#fffdf9" stroke="#c6d3d3" stroke-width="3"/><rect x="2410" y="1115" width="14" height="250" rx="7" fill="#ea8f5c"/><text x="2452" y="1165" text-anchor="start" font-size="19" font-weight="650" fill="#ea8f5c" letter-spacing="0.5">BOUNDED FIELD WINDOW</text><text x="2452" y="1220" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">HOLD / NOT AUTHORIZED / NOT RUN</text><text x="2452" y="1270" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Route, accessibility and safety evidence is absent</text><text x="2452" y="1297" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Accountable owner is not assigned</text><text x="2452" y="1324" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">No live public route or delivery may start</text><text x="3378" y="1165" text-anchor="end" font-size="17" font-weight="400" fill="#61788b" letter-spacing="0">FIELD / HOLD</text><rect x="2410" y="1395" width="1010" height="250" rx="22" fill="#fffdf9" stroke="#c6d3d3" stroke-width="3"/><rect x="2410" y="1395" width="14" height="250" rx="7" fill="#88ace1"/><text x="2452" y="1445" text-anchor="start" font-size="19" font-weight="650" fill="#88ace1" letter-spacing="0.5">NEXT GATE</text><text x="2452" y="1500" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">Independent accessibility and safety review</text><text x="2452" y="1550" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Confirm place, route and permission first</text><text x="2452" y="1577" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Assign maintenance and human takeover</text><text x="2452" y="1604" text-anchor="start" font-size="18" font-weight="400" fill="#61788b" letter-spacing="0">Only then consider one witnessed bounded test</text><text x="3378" y="1445" text-anchor="end" font-size="17" font-weight="400" fill="#61788b" letter-spacing="0">G2</text><rect x="2410" y="1675" width="1010" height="130" rx="22" fill="#e1eee8" stroke="#73a892" stroke-width="2"/><text x="2450" y="1722" text-anchor="start" font-size="24" font-weight="700" fill="#73a892" letter-spacing="0">ORDINARY SERVICE</text><text x="2450" y="1762" text-anchor="start" font-size="16" font-weight="400" fill="#14283a" letter-spacing="0">Walking stays open; hand-cart or human delivery remains available. Any person may ask to stop.</text><rect x="2410" y="1830" width="1010" height="150" rx="22" fill="#f5edda" stroke="#e3bb58" stroke-width="2"/><text x="2450" y="1878" text-anchor="start" font-size="24" font-weight="700" fill="#9c7319" letter-spacing="0">READING BOUNDARY</text><text x="2450" y="1918" text-anchor="start" font-size="15" font-weight="400" fill="#14283a" letter-spacing="0">Tabletop PASS proves an offline fixture can replay. It does not prove robot performance, safety, permission or deployment.</text><text x="120" y="2182" text-anchor="start" font-size="22" font-weight="400" fill="#61788b" letter-spacing="0.3">SOURCE  package geometry + S-02 tabletop evidence + bounded test-window record / no new claims</text><text x="3480" y="2182" text-anchor="end" font-size="22" font-weight="400" fill="#61788b" letter-spacing="0">Xu Bingnan × Codex / V2.4</text></g></svg>
