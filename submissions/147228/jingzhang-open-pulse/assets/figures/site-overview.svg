0" y="835" width="14" height="250" rx="7" fill="#73a892"/><text x="2452" y="885" text-anchor="start" font-size="25" font-weight="650" fill="#73a892" letter-spacing="0.5">本地合成桌面回放</text><text x="2452" y="940" text-anchor="start" font-size="38" font-weight="700" fill="#14283a" letter-spacing="0">PASS  4/4 + 6/6 + 5/5</text><text x="2452" y="990" text-anchor="start" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">只复现停止、撤回和恢复逻辑</text><text x="2452" y="1026" text-anchor="start" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">零网络、零真实交易、零现场运行</text><text x="3378" y="885" text-anchor="end" font-size="23" font-weight="400" fill="#61788b" letter-spacing="0">LOCAL / SYNTHETIC</text><rect x="2410" y="1115" width="1010" height="250" rx="22" fill="#fffdf9" stroke="#c6d3d3" stroke-width="3"/><rect x="2410" y="1115" width="14" height="250" rx="7" fill="#ea8f5c"/><text x="2452" y="1165" text-anchor="start" font-size="25" font-weight="650" fill="#ea8f5c" letter-spacing="0.5">有限现场窗口</text><text x="2452" y="1220" text-anchor="start" font-size="38" font-weight="700" fill="#14283a" letter-spacing="0">HOLD / 未授权 / 未运行</text><text x="2452" y="1270" text-anchor="start" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">路线、无障碍、安全和责任主体证据不足</text><text x="2452" y="1306" text-anchor="start" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">当前不得进入公共路线或开展真实配送</text><text x="3378" y="1165" text-anchor="end" font-size="23" font-weight="400" fill="#61788b" letter-spacing="0">FIELD / HOLD</text><rect x="2410" y="1395" width="1010" height="250" rx="22" fill="#fffdf9" stroke="#c6d3d3" stroke-width="3"/><rect x="2410" y="1395" width="14" height="250" rx="7" fill="#88ace1"/><text x="2452" y="1445" text-anchor="start" font-size="25" font-weight="650" fill="#88ace1" letter-spacing="0.5">下一道门</text><text x="2452" y="1500" text-anchor="start" font-size="38" font-weight="700" fill="#14283a" letter-spacing="0">独立无障碍与安全复核</text><text x="2452" y="1550" text-anchor="start" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">先确认场地、路线、许可、维护责任和人工接管</text><text x="2452" y="1586" text-anchor="start" font-size="25" font-weight="400" fill="#61788b" letter-spacing="0">通过后才可讨论一段有见证的有限测试</text><text x="3378" y="1445" text-anchor="end" font-size="23" font-weight="400" fill="#61788b" letter-spacing="0">G2</text><rect x="2410" y="1675" width="1010" height="130" rx="22" fill="#e1eee8" stroke="#73a892" stroke-width="2"/><text x="2450" y="1722" text-anchor="start" font-size="24" font-weight="700" fill="#73a892" letter-spacing="0">普通服务</text><text x="2450" y="1762" text-anchor="start" font-size="23" font-weight="400" fill="#14283a" letter-spacing="0">步行路线持续开放，手推车或人工配送保持可用；任何人可要求停止。</text><rect x="2410" y="1830" width="1010" height="150" rx="22" fill="#f5edda" stroke="#e3bb58" stroke-width="2"/><text x="2450" y="1878" text-anchor="start" font-size="24" font-weight="700" fill="#9c7319" letter-spacing="0">判读边界</text><text x="2450" y="1918" text-anchor="start" font-size="22" font-weight="400" fill="#14283a" letter-spacing="0">桌面 PASS 只证明离线夹具可复跑，不代表机器人性能、公共接受、安全、许可或部署。</text><text x="120" y="2182" text-anchor="start" font-size="22" font-weight="400" fill="#61788b" letter-spacing="0.3">来源  package geometry + S-02 tabletop evidence + bounded test-window record / no new claims</text><text x="3480" y="2182" text-anchor="end" font-size="22" font-weight="400" fill="#61788b" letter-spacing="0">许丙南 × Codex / V2.4</text></g></svg>
