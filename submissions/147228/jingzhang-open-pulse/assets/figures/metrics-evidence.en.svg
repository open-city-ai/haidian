letter-spacing="0" opacity="1">ONE MISSING: NO RELEASE</text><text x="78" y="1310" text-anchor="start" font-size="16" font-weight="400" fill="#91a9bb" letter-spacing="0" opacity="1">Recomputable spatial numbers do not establish a field service; every version publishes state, limits and exit.</text></g></svg>
