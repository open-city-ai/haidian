" fill="#a9bdcb" letter-spacing="0" opacity="1">green space</text><text x="684" y="643" text-anchor="end" font-size="34" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">12.34%</text><rect x="120" y="715" width="596" height="120" rx="20" fill="#173653" stroke="#78a8e8" stroke-width="3" opacity="1"/><text x="150" y="757" text-anchor="start" font-size="15" font-weight="600" fill="#a9bdcb" letter-spacing="0" opacity="1">public space</text><text x="684" y="798" text-anchor="end" font-size="34" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">7.33%</text><rect x="120" y="870" width="596" height="120" rx="20" fill="#173653" stroke="#e1b742" stroke-width="3" opacity="1"/><text x="150" y="912" text-anchor="start" font-size="15" font-weight="600" fill="#a9bdcb" letter-spacing="0" opacity="1">concept network</text><text x="684" y="953" text-anchor="end" font-size="34" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">13.01 km</text><text x="120" y="1085" text-anchor="start" font-size="13" font-weight="400" fill="#91a9bb" letter-spacing="0" opacity="1">Source: package GeoJSON / EPSG:4548 recalculation</text><text x="120" y="1122" text-anchor="start" font-size="13" font-weight="400" fill="#ee8b55" letter-spacing="0" opacity="1">Boundary: not statutory area, FAR or engineering capacity</text><rect x="805" y="282" width="740" height="925" rx="30" fill="#132d48" stroke="#36516a" stroke-width="2" opacity="1"/><text x="847" y="342" text-anchor="start" font-size="22" font-weight="700" fill="#fffdf8" letter-spacing="0" opacity="1">02 SERVICE ACCOUNT / UNKNOWN</text><circle cx="870" cy="410" r="12" fill="#ee8b55" stroke="#ee8b55" stroke-width="1"/><text x="905" y="418" text-anchor="start" font-size="16" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">field access and accessibility</text><text x="1495" y="418" text-anchor="end" font-size="17" font-weight="750" fill="#ee8b55" letter-spacing="0" opacity="1">HOLD</text><circle cx=