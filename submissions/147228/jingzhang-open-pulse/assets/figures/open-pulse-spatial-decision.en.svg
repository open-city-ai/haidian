<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Open Pulse spatial decision</title>
  <desc id="desc">Three spatial alternatives, five scales, five resident rights and five shared gates. The selected three-node civic release network advances only to design review.</desc>
  <style>
    .bg{fill:#101923}.panel{fill:#18242f;stroke:#42515a;stroke-width:2}.card{fill:#202f3b;stroke:#52626a;stroke-width:2}.chosen{fill:#173b39;stroke:#9bd3b0;stroke-width:3}.reject{fill:#3a272b;stroke:#c77b7b;stroke-width:2}.revise{fill:#3b3425;stroke:#d9c28c;stroke-width:2}.rule{stroke:#61727b;stroke-width:2}.accent{fill:#9bd3b0}.gold{fill:#d9c28c}.red{fill:#e49b9b}.ink{fill:#edf1ed;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.muted{fill:#b7c4c5;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.tiny{font-size:16px}.small{font-size:20px}.body{font-size:22px}.h2{font-size:28px;font-weight:600}.h1{font-size:38px;font-weight:600}</style>
  <rect class="bg" width="1200" height="760"/>
  <text x="54" y="62" class="muted small" letter-spacing="4">OPEN PULSE / SPATIAL DECISION RECEIPT</text>
  <text x="54" y="112" class="ink h1">Spatial options: choose the reversible civic network before AI release</text>
  <text x="54" y="148" class="muted small">HOLD · design reference · authorization 0 · field observations 0 · baseline unknown · not deployment</text>
  <rect x="54" y="184" width="1092" height="188" rx="10" class="panel"/>
  <text x="78" y="222" class="gold h2">Three spatial strategies</text>
  <rect x="78" y="244" width="318" height="104" rx="8" class="reject"/>
  <text x="98" y="278" class="red h2">OP-A  REJECT</text>
  <text x="98" y="310" class="ink body">Single AI spectacle spine</text>
  <text x="98" y="336" class="muted tiny">ordinary service becomes secondary · return to BASE</text>
  <rect x="424" y="244" width="318" height="104" rx="8" class="revise"/>
  <text x="444" y="278" class="gold h2">OP-B  REVISE</text>
  <text x="444" y="310" class="ink body">Single flagship release hall</text>
  <text x="444" y="336" class="muted tiny">add distributed care, appeal and maintenance</text>
  <rect x="770" y="244" width="352" height="104" rx="8" class="chosen"/>
  <text x="790" y="278" class="accent h2">OP-C  ADVANCE</text>
  <text x="790" y="310" class="ink body">Three-node civic release network</text>
  <text x="790" y="336" class="muted tiny">Zhongzhiyuan · AI Origin · Dazhongsi → design review</text>
  <rect x="54" y="398" width="1092" height="94" rx="10" class="panel"/>
  <text x="78" y="434" class="gold h2">Scale chain</text>
  <text x="78" y="470" class="ink body">1:5000</text><line x1="172" y1="462" x2="224" y2="462" class="rule"/><text x="240" y="470" class="ink body">1:2000</text><line x1="350" y1="462" x2="402" y2="462" class="rule"/><text x="418" y="470" class="ink body">1:500</text><line x1="500" y1="462" x2="552" y2="462" class="rule"/><text x="568" y="470" class="ink body">1:100</text><line x1="650" y1="462" x2="702" y2="462" class="rule"/><text x="718" y="470" class="ink body">1:50</text>
  <text x="830" y="470" class="muted tiny">regional relation → node → reachable interface</text>
  <rect x="54" y="518" width="532" height="188" rx="10" class="panel"/>
  <text x="78" y="556" class="gold h2">Five resident rights</text>
  <text x="82" y="590" class="ink small">01 ordinary access and no-app service</text>
  <text x="82" y="618" class="ink small">02 accessibility and care fallback</text>
  <text x="82" y="646" class="ink small">03 status, appeal and pause</text>
  <text x="82" y="674" class="ink small">04 privacy, refusal and exit</text>
  <text x="82" y="702" class="ink small">05 maintenance and worker safety</text>
  <rect x="614" y="518" width="532" height="188" rx="10" class="panel"/>
  <text x="638" y="556" class="gold h2">Five shared gates</text>
  <text x="638" y="590" class="ink small">G1 BASE before BOOST</text>
  <text x="638" y="618" class="ink small">G2 three-node continuity</text>
  <text x="638" y="646" class="ink small">G3 human receiver and maintainer</text>
  <text x="638" y="674" class="ink small">G4 public status and redress</text>
  <text x="638" y="702" class="ink small">G5 BLACKOUT returns to BASE; close out</text>
</svg>
