<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <rect width="3840" height="2160" fill="#f7f5ef"/>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #14283a; }
    .muted { fill: #5f7485; }
    .small { font-size: 30px; }
    .body { font-size: 34px; }
    .label { font-size: 28px; letter-spacing: 1px; }
    .card-title { font-size: 50px; font-weight: 650; }
    .step { font-size: 29px; font-weight: 550; }
  </style>

  <text x="180" y="112" class="small muted">JING-ZHANG OPEN PULSE / HUMAN-SCALE SPATIAL PROTOTYPES</text>
  <text x="180" y="245" font-size="82" font-weight="650">03 / 三处重点区：三段可走完的日常任务</text>
  <text x="180" y="330" font-size="39" class="muted">把临时几何、人的路径、人工把关、停止条件和日常返回画在同一张图上</text>
  <text x="3660" y="112" font-size="30" text-anchor="end" fill="#e86f43">V2.3 / PROVISIONAL / CONCEPT ONLY</text>
  <line x1="180" y1="382" x2="3660" y2="382" stroke="#c6d1d3" stroke-width="4"/>

  <rect x="180" y="455" width="1030" height="1430" rx="34" fill="#eef2ef" stroke="#b9c9cb" stroke-width="4"/>
  <text x="240" y="530" class="body" font-weight="650">相对位置 / RELATIONAL PLAN</text>
  <text x="240" y="578" class="small muted">只表达工作关系，不表达地块、道路红线或权属</text>

  <path d="M430 650 L1000 650 L940 1780 L390 1780 Z" fill="#f7f5ef" stroke="#789599" stroke-width="5"/>
  <line x1="690" y1="700" x2="690" y2="1725" stroke="#14283a" stroke-width="16"/>
  <line x1="665" y1="700" x2="665" y2="1725" stroke="#80a99c" stroke-width="9"/>
  <line x1="715" y1="700" x2="715" y2="1725" stroke="#9bb9e4" stroke-width="9"/>

  <g>
    <rect x="455" y="705" width="470" height="210" rx="24" fill="#dfeee8" stroke="#75a591" stroke-width="5"/>
    <circle cx="690" cy="810" r="47" fill="#91b6ac" stroke="#14283a" stroke-width="5"/>
    <text x="690" y="825" font-size="38" text-anchor="middle" fill="#ffffff">01</text>
    <text x="950" y="780" class="small" font-weight="650">众智园</text>
    <text x="950" y="825" class="label muted">可信研发花园</text>
  </g>
  <g>
    <rect x="405" y="1055" width="560" height="210" rx="24" fill="#e2ebf8" stroke="#91afe0" stroke-width="5"/>
    <circle cx="690" cy="1160" r="47" fill="#9eb9df" stroke="#14283a" stroke-width="5"/>
    <text x="690" y="1175" font-size="38" text-anchor="middle" fill="#ffffff">02</text>
    <text x="990" y="1130" class="small" font-weight="650">AI 原点</text>
    <text x="990" y="1175" class="label muted">开源转化街区</text>
  </g>
  <g>
    <rect x="430" y="1405" width="520" height="210" rx="24" fill="#f6e4d9" stroke="#e2956c" stroke-width="5"/>
    <circle cx="690" cy="1510" r="47" fill="#e39a6f" stroke="#14283a" stroke-width="5"/>
    <text x="690" y="1525" font-size="38" text-anchor="middle" fill="#ffffff">03</text>
    <text x="975" y="1480" class="small" font-weight="650">大钟寺</text>
    <text x="975" y="1525" class="label muted">城市会客厅</text>
  </g>
  <text x="240" y="1840" class="small muted">三处范围均为 provisional rough geometry；正式资料到位后整体复算。</text>

  <g transform="translate(1320 455)">
    <rect width="2340" height="420" rx="34" fill="#fbfaf6" stroke="#b9c9cb" stroke-width="4"/>
    <rect width="18" height="420" rx="9" fill="#75a591"/>
    <text x="70" y="70" class="label" fill="#5f917d">01 / PROV-KEY-001 / 北段</text>
    <text x="70" y="138" class="card-title">众智园可信研发花园</text>
    <text x="70" y="192" class="small muted">一位居民不注册账号，也能穿过、休息、看懂状态，再回到普通公园。</text>

    <g transform="translate(70 230)">
      <line x1="45" y1="42" x2="1540" y2="42" stroke="#75a591" stroke-width="8"/>
      <g transform="translate(0 0)"><circle cx="45" cy="42" r="34" fill="#75a591"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">1</text><text x="0" y="104" class="step">到达</text></g>
      <g transform="translate(280 0)"><circle cx="45" cy="42" r="34" fill="#75a591"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">2</text><text x="0" y="104" class="step">状态板</text></g>
      <g transform="translate(560 0)"><circle cx="45" cy="42" r="34" fill="#75a591"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">3</text><text x="0" y="104" class="step">缝合门槛</text></g>
      <g transform="translate(840 0)"><circle cx="45" cy="42" r="34" fill="#75a591"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">4</text><text x="0" y="104" class="step">雨水树池</text></g>
      <g transform="translate(1120 0)"><circle cx="45" cy="42" r="34" fill="#75a591"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">5</text><text x="0" y="104" class="step">预约小测</text></g>
      <g transform="translate(1400 0)"><circle cx="45" cy="42" r="34" fill="#75a591"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">6</text><text x="0" y="104" class="step">公园返回</text></g>
    </g>
    <line x1="1680" y1="235" x2="1680" y2="375" stroke="#d2d9d7" stroke-width="3"/>
    <text x="1730" y="268" class="label muted">先决条件</text>
    <text x="1730" y="315" class="small">河道、防洪、交通、权属、消防</text>
    <text x="1730" y="365" class="label" fill="#e86f43">不满足：不开放试点</text>
  </g>

  <g transform="translate(1320 930)">
    <rect width="2340" height="420" rx="34" fill="#fbfaf6" stroke="#b9c9cb" stroke-width="4"/>
    <rect width="18" height="420" rx="9" fill="#91afe0"/>
    <text x="70" y="70" class="label" fill="#6f8fc4">02 / PROV-KEY-002 / 中段</text>
    <text x="70" y="138" class="card-title">AI 原点开源转化街区</text>
    <text x="70" y="192" class="small muted">贡献可署名也可撤回；老年居民不用数字服务，也能走完同一条日常路线。</text>

    <g transform="translate(70 230)">
      <line x1="45" y1="42" x2="1540" y2="42" stroke="#91afe0" stroke-width="8"/>
      <g><circle cx="45" cy="42" r="34" fill="#91afe0"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">1</text><text x="0" y="104" class="step">校园边界</text></g>
      <g transform="translate(280 0)"><circle cx="45" cy="42" r="34" fill="#91afe0"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">2</text><text x="0" y="104" class="step">开源发布</text></g>
      <g transform="translate(560 0)"><circle cx="45" cy="42" r="34" fill="#91afe0"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">3</text><text x="0" y="104" class="step">权利服务台</text></g>
      <g transform="translate(840 0)"><circle cx="45" cy="42" r="34" fill="#91afe0"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">4</text><text x="0" y="104" class="step">贡献墙</text></g>
      <g transform="translate(1120 0)"><circle cx="45" cy="42" r="34" fill="#91afe0"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">5</text><text x="0" y="104" class="step">共享学习</text></g>
      <g transform="translate(1400 0)"><circle cx="45" cy="42" r="34" fill="#91afe0"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">6</text><text x="0" y="104" class="step">安静返回</text></g>
    </g>
    <line x1="1680" y1="235" x2="1680" y2="375" stroke="#d2d9d7" stroke-width="3"/>
    <text x="1730" y="268" class="label muted">先决条件</text>
    <text x="1730" y="315" class="small">校园通行、文保、搬迁风险、运营同意</text>
    <text x="1730" y="365" class="label" fill="#e86f43">不满足：不做空间改造</text>
  </g>

  <g transform="translate(1320 1405)">
    <rect width="2340" height="420" rx="34" fill="#fbfaf6" stroke="#b9c9cb" stroke-width="4"/>
    <rect width="18" height="420" rx="9" fill="#e2956c"/>
    <text x="70" y="70" class="label" fill="#d47d51">03 / PROV-KEY-003 / 南段</text>
    <text x="70" y="138" class="card-title">大钟寺城市会客厅</text>
    <text x="70" y="192" class="small muted">活动容量可以降到零；居民主路始终开放，空间按约定时间回到普通商业与通行。</text>

    <g transform="translate(70 230)">
      <line x1="45" y1="42" x2="1540" y2="42" stroke="#e2956c" stroke-width="8"/>
      <g><circle cx="45" cy="42" r="34" fill="#e2956c"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">1</text><text x="0" y="104" class="step">轨道到达</text></g>
      <g transform="translate(280 0)"><circle cx="45" cy="42" r="34" fill="#e2956c"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">2</text><text x="0" y="104" class="step">四向过街</text></g>
      <g transform="translate(560 0)"><circle cx="45" cy="42" r="34" fill="#e2956c"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">3</text><text x="0" y="104" class="step">安静座位</text></g>
      <g transform="translate(840 0)"><circle cx="45" cy="42" r="34" fill="#e2956c"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">4</text><text x="0" y="104" class="step">短时展览</text></g>
      <g transform="translate(1120 0)"><circle cx="45" cy="42" r="34" fill="#e2956c"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">5</text><text x="0" y="104" class="step">国际路线</text></g>
      <g transform="translate(1400 0)"><circle cx="45" cy="42" r="34" fill="#e2956c"/><text x="45" y="54" font-size="26" text-anchor="middle" fill="#fff">6</text><text x="0" y="104" class="step">日常回归</text></g>
    </g>
    <line x1="1680" y1="235" x2="1680" y2="375" stroke="#d2d9d7" stroke-width="3"/>
    <text x="1730" y="268" class="label muted">先决条件</text>
    <text x="1730" y="315" class="small">站点、道路、消防、客流、应急管理</text>
    <text x="1730" y="365" class="label" fill="#e86f43">不满足：取消活动窗口</text>
  </g>

  <rect x="180" y="1950" width="3480" height="115" rx="22" fill="#efe8d6" stroke="#dfc26e" stroke-width="3"/>
  <text x="230" y="2000" class="label" fill="#7c6a35">共同放行条件</text>
  <text x="500" y="2000" class="body">普通路径持续可用；人工责任可找到；停止后能恢复；正式边界、权属、许可和现场基线仍待专业核验。</text>
  <text x="230" y="2045" class="small muted">来源：geometry/key_areas.geojson + visual/assets/key-area-node-plans.json；桌面结构不等于批准、建设或现场绩效。</text>
</svg>
