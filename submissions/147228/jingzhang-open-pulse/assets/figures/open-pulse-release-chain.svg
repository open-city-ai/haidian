<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">京张开源脉冲：首168小时与首12周发布链</title>
  <desc id="desc">普通服务先行，AI仅作为可撤回增益；四种状态、首168小时和首12周均由证据与停止条件约束。</desc>
  <rect width="1600" height="1000" fill="#f6f8f5"/>
  <rect x="36" y="30" width="1528" height="106" rx="18" fill="#132b2b"/>
  <text x="72" y="78" fill="#f6f8f5" font-size="34" font-family="Arial, sans-serif" font-weight="700">京张开源脉冲｜可回退的公共发布链</text>
  <text x="72" y="112" fill="#b9d7c9" font-size="18" font-family="Arial, sans-serif">普通步行、人工服务、手推车配送先行；AI 只在证据、责任与人工接管齐备时加一层可撤回增益</text>
  <rect x="36" y="158" width="1528" height="72" rx="14" fill="#e8d8a8"/>
  <text x="72" y="188" fill="#302a1d" font-size="20" font-family="Arial, sans-serif" font-weight="700">边界：设计合同，不是现场结果</text>
  <text x="72" y="216" fill="#302a1d" font-size="17" font-family="Arial, sans-serif">HOLD｜授权 0｜现场观察 0｜baseline unknown｜not_authorized_not_run｜performance null</text>
  <text x="72" y="270" fill="#132b2b" font-size="24" font-family="Arial, sans-serif" font-weight="700">四种状态：BASE → BOOST → BLACKOUT → BEQUEST</text>
  <g font-family="Arial, sans-serif">
    <rect x="36" y="294" width="360" height="92" rx="14" fill="#d8eadf" stroke="#6b9b82" stroke-width="2"/>
    <text x="58" y="326" font-size="23" fill="#173d2f" font-weight="700">BASE｜普通服务</text>
    <text x="58" y="354" font-size="16" fill="#173d2f">无 AI 也能到达、询问、获得帮助、离开</text>
    <text x="58" y="377" font-size="16" fill="#173d2f">默认开放；保留人工和无 App 路径</text>
    <rect x="414" y="294" width="360" height="92" rx="14" fill="#cfe4ef" stroke="#6396ad" stroke-width="2"/>
    <text x="436" y="326" font-size="23" fill="#17344a" font-weight="700">BOOST｜有限增益</text>
    <text x="436" y="354" font-size="16" fill="#17344a">一项小而可逆的 AI 辅助</text>
    <text x="436" y="377" font-size="16" fill="#17344a">需责任人、日期证据和人工接管</text>
    <rect x="792" y="294" width="360" height="92" rx="14" fill="#f2d4c7" stroke="#bd7866" stroke-width="2"/>
    <text x="814" y="326" font-size="23" fill="#5b2824" font-weight="700">BLACKOUT｜熔断</text>
    <text x="814" y="354" font-size="16" fill="#5b2824">事件、未知、同意或维护触发</text>
    <text x="814" y="377" font-size="16" fill="#5b2824">AI 停止；普通服务继续</text>
    <rect x="1170" y="294" width="394" height="92" rx="14" fill="#e3d9ee" stroke="#8a6ca4" stroke-width="2"/>
    <text x="1192" y="326" font-size="23" fill="#3c2a50" font-weight="700">BEQUEST｜可继承学习</text>
    <text x="1192" y="354" font-size="16" fill="#3c2a50">保留去标识化经验，不保留个人轨迹</text>
    <text x="1192" y="377" font-size="16" fill="#3c2a50">可撤回、可复盘、可不扩容</text>
  </g>
  <text x="72" y="432" fill="#132b2b" font-size="24" font-family="Arial, sans-serif" font-weight="700">首 168 小时｜先证明“普通服务不被牺牲”</text>
  <g font-family="Arial, sans-serif">
    <rect x="36" y="456" width="368" height="190" rx="14" fill="#ffffff" stroke="#6b9b82" stroke-width="2"/>
    <text x="58" y="490" font-size="24" fill="#173d2f" font-weight="700">H0｜0–24h</text>
    <text x="58" y="520" font-size="17" fill="#173d2f">普通服务负责人</text>
    <text x="58" y="550" font-size="16" fill="#173d2f">路线、人工排班、清权检查</text>
    <text x="58" y="580" font-size="16" fill="#173d2f">停止：无人工责任人 / 无障碍断点</text>
    <text x="58" y="612" font-size="16" fill="#173d2f" font-weight="700">回执：普通服务卡</text>
    <rect x="420" y="456" width="368" height="190" rx="14" fill="#ffffff" stroke="#6396ad" stroke-width="2"/>
    <text x="442" y="490" font-size="24" fill="#17344a" font-weight="700">H1｜24–72h</text>
    <text x="442" y="520" font-size="17" fill="#17344a">安全与无障碍负责人</text>
    <text x="442" y="550" font-size="16" fill="#17344a">配对走查、人工接管演练</text>
    <text x="442" y="580" font-size="16" fill="#17344a">停止：接管失败 / 越权数据</text>
    <text x="442" y="612" font-size="16" fill="#17344a" font-weight="700">回执：路线—回退凭证</text>
    <rect x="804" y="456" width="368" height="190" rx="14" fill="#ffffff" stroke="#6396ad" stroke-width="2"/>
    <text x="826" y="490" font-size="24" fill="#17344a" font-weight="700">H2｜72–120h</text>
    <text x="826" y="520" font-size="17" fill="#17344a">场景负责人</text>
    <text x="826" y="550" font-size="16" fill="#17344a">一项有限辅助、最小数据</text>
    <text x="826" y="580" font-size="16" fill="#17344a">停止：改变服务资格 / 无维护窗</text>
    <text x="826" y="612" font-size="16" fill="#17344a" font-weight="700">回执：有限增益卡</text>
    <rect x="1188" y="456" width="376" height="190" rx="14" fill="#ffffff" stroke="#bd7866" stroke-width="2"/>
    <text x="1210" y="490" font-size="24" fill="#5b2824" font-weight="700">H3｜120–168h</text>
    <text x="1210" y="520" font-size="17" fill="#5b2824">复核与申诉负责人</text>
    <text x="1210" y="550" font-size="16" fill="#5b2824">反馈、近失事件、发布/退休</text>
    <text x="1210" y="580" font-size="16" fill="#5b2824">停止：无法解释 / 无人回应</text>
    <text x="1210" y="612" font-size="16" fill="#5b2824" font-weight="700">回执：发布或退休凭证</text>
  </g>
  <text x="72" y="700" fill="#132b2b" font-size="24" font-family="Arial, sans-serif" font-weight="700">首 12 周｜每两周过一扇门，不满足就退回 BASE</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="36" y="724" width="244" height="126" rx="12" fill="#d8eadf"/><text x="54" y="754" fill="#173d2f" font-weight="700">W01–02</text><text x="54" y="781" fill="#173d2f">普通服务 &amp; 清权</text><text x="54" y="808" fill="#173d2f">fallback：BASE</text>
    <rect x="296" y="724" width="244" height="126" rx="12" fill="#d8eadf"/><text x="314" y="754" fill="#173d2f" font-weight="700">W03–04</text><text x="314" y="781" fill="#173d2f">无障碍 &amp; 安全演练</text><text x="314" y="808" fill="#173d2f">失败：BLACKOUT</text>
    <rect x="556" y="724" width="244" height="126" rx="12" fill="#cfe4ef"/><text x="574" y="754" fill="#17344a" font-weight="700">W05–07</text><text x="574" y="781" fill="#17344a">一项有限公共辅助</text><text x="574" y="808" fill="#17344a">不可成为服务前提</text>
    <rect x="816" y="724" width="244" height="126" rx="12" fill="#cfe4ef"/><text x="834" y="754" fill="#17344a" font-weight="700">W08–09</text><text x="834" y="781" fill="#17344a">维护 &amp; 连续性</text><text x="834" y="808" fill="#17344a">逾期：移除复杂层</text>
    <rect x="1076" y="724" width="244" height="126" rx="12" fill="#f2d4c7"/><text x="1094" y="754" fill="#5b2824" font-weight="700">W10–11</text><text x="1094" y="781" fill="#5b2824">申诉 &amp; 证据复核</text><text x="1094" y="808" fill="#5b2824">无回应：BLACKOUT</text>
    <rect x="1336" y="724" width="228" height="126" rx="12" fill="#e3d9ee"/><text x="1354" y="754" fill="#3c2a50" font-weight="700">W12</text><text x="1354" y="781" fill="#3c2a50">扩容 / 保持 / 退休</text><text x="1354" y="808" fill="#3c2a50">无改善：BEQUEST</text>
  </g>
  <text x="72" y="916" fill="#5e6d68" font-size="17" font-family="Arial, sans-serif">OPEN-PULSE-RELEASE-CHAIN-01｜所有证据为设计合同；现场授权、观察和绩效结果当前均为空。</text>
</svg>
