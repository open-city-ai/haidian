<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <rect width="1800" height="1200" fill="#f4f7f8"/>
  <rect width="1800" height="150" fill="#102a43"/>
  <text x="70" y="68" fill="#ffffff" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="36" font-weight="700">八项公开取舍｜公共利益先于展示效率</text>
  <text x="70" y="112" fill="#bfe7dc" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="21">京张开源脉冲 · 作者明确立场、受影响群体、放行证据与退出边界</text>
  <rect x="1450" y="38" width="270" height="72" rx="12" fill="#1c9a82"/>
  <text x="1485" y="68" fill="#ffffff" font-family="Arial,sans-serif" font-size="18" font-weight="700">BASELINE</text>
  <text x="1485" y="96" fill="#ffffff" font-family="Arial,sans-serif" font-size="22" font-weight="700">UNKNOWN · NOT RUN</text>

  <g font-family="Hiragino Sans GB,Arial,sans-serif">
    <g transform="translate(60,185)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#1c9a82"/>
      <circle cx="55" cy="48" r="25" fill="#dff4ed"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">01</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">普通回家路径优先于展示动线</text>
      <text x="98" y="82" fill="#58717d" font-size="18">公共路径 ↔ 展示、活动与机器人窗口</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：先保无障碍、无账号、无屏幕的普通路径</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：09-accessible-route · 27-robot-public-route　退出：路线断点即撤回</text>
    </g>
    <g transform="translate(930,185)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#ef8b5a"/>
      <circle cx="55" cy="48" r="25" fill="#fff0e8"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">02</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">技能连续性优先于自动化替代</text>
      <text x="98" y="82" fill="#58717d" font-size="18">自动化效率 ↔ 岗位、商户与维护入口</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：人工等价、技能再造和申诉先于扩容</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：human-first-buffer · 29-non-ai-equivalence　退出：入口被垄断即冻结</text>
    </g>
    <g transform="translate(60,405)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#4479a9"/>
      <circle cx="55" cy="48" r="25" fill="#e6eff8"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">03</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">可解释公共服务优先于黑箱便利</text>
      <text x="98" y="82" fill="#58717d" font-size="18">城市 API 便捷 ↔ 资格、责任与纠错权</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：最小字段、人工解释、可纠正、可撤回</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：city-api-energy-contract · 22-privacy-minimization　退出：责任缺失即不开放</text>
    </g>
    <g transform="translate(930,405)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#d1a83e"/>
      <circle cx="55" cy="48" r="25" fill="#fff7dc"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">04</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">清凉、安静与安全优先于夜间增量</text>
      <text x="98" y="82" fill="#58717d" font-size="18">夜间活力 ↔ 热、噪声、眩光、雨洪与归家</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：安静链和普通归家是活动的先决条件</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：wind-health-validation · 16-noise-equity　退出：专业条件不足即降容</text>
    </g>
    <g transform="translate(60,625)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#8f6ab3"/>
      <circle cx="55" cy="48" r="25" fill="#f0e9f7"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">05</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">公开贡献优先于无偿抽取注意力</text>
      <text x="98" y="82" fill="#58717d" font-size="18">全球 AI 周与开源展示 ↔ 授权、归属与撤回</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：清楚目的、可撤回、补偿/支持和结果回传</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：participation-cycle · 33-rights-clearance　退出：清权不明即撤下</text>
    </g>
    <g transform="translate(930,625)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#3d9a9f"/>
      <circle cx="55" cy="48" r="25" fill="#e1f3f3"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">06</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">可维护资产优先于一次性智能装置</text>
      <text x="98" y="82" fill="#58717d" font-size="18">屏幕、传感器与接口 ↔ 备件、责任与退役</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：资产所有者、维护时钟和普通替代先行</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：resource-accounts · 35-maintenance-sla　退出：维护缺口即留在概念层</text>
    </g>
    <g transform="translate(60,845)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#4e8c66"/>
      <circle cx="55" cy="48" r="25" fill="#e5f2e8"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">07</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">分组差异优先于漂亮平均数</text>
      <text x="98" y="82" fill="#58717d" font-size="18">总体平均 ↔ 老人、残障、儿童、访客的不同体验</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：分组、昼夜、季节对照；缺基线就公开未知</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：public-interest-audit · 21-participation-differences　退出：差异不可解释即暂停</text>
    </g>
    <g transform="translate(930,845)">
      <rect width="810" height="195" rx="16" fill="#ffffff" stroke="#c9d7dc" stroke-width="2"/>
      <rect width="12" height="195" rx="6" fill="#be5d73"/>
      <circle cx="55" cy="48" r="25" fill="#fae8ed"/><text x="43" y="56" fill="#102a43" font-size="22" font-weight="700">08</text>
      <text x="98" y="45" fill="#102a43" font-size="25" font-weight="700">可撤回扩散优先于永久性承诺</text>
      <text x="98" y="82" fill="#58717d" font-size="18">品牌、采购与固定空间承诺 ↔ 纠正、退出与责任</text>
      <text x="98" y="119" fill="#163d4d" font-size="19" font-weight="700">立场：版本化证据收尾，未知项不能继承成成功</text>
      <text x="98" y="154" fill="#58717d" font-size="17">证据：39-phase-gate · 40-scale-retire　退出：证据断裂或公共伤害即退出</text>
    </g>
  </g>
  <rect x="60" y="1080" width="1680" height="62" rx="12" fill="#dce9ed"/>
  <text x="90" y="1118" fill="#163d4d" font-family="Hiragino Sans GB,Arial,sans-serif" font-size="20" font-weight="700">8 项立场 · 覆盖 14 个场景 / 8 个行动包 / 10 类公共使用者　|　全部是概念取舍登记，不是调查结果、审批、现场绩效或部署许可</text>
</svg>
