<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">京张开源脉冲系统选项决策</title>
  <desc id="desc">三种空间选项、五级尺度链、五项居民权利和五道共享闸门。选中三节点公共发布网络，仅进入设计审查。</desc>
  <style>
    .bg{fill:#101923}.panel{fill:#18242f;stroke:#42515a;stroke-width:2}.card{fill:#202f3b;stroke:#52626a;stroke-width:2}.chosen{fill:#173b39;stroke:#9bd3b0;stroke-width:3}.reject{fill:#3a272b;stroke:#c77b7b;stroke-width:2}.revise{fill:#3b3425;stroke:#d9c28c;stroke-width:2}.rule{stroke:#61727b;stroke-width:2}.accent{fill:#9bd3b0}.gold{fill:#d9c28c}.red{fill:#e49b9b}.ink{fill:#edf1ed;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif}.muted{fill:#b7c4c5;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif}.tiny{font-size:16px}.small{font-size:20px}.body{font-size:22px}.h2{font-size:28px;font-weight:600}.h1{font-size:38px;font-weight:600}</style>
  <rect class="bg" width="1200" height="760"/>
  <text x="54" y="62" class="muted small" letter-spacing="4">OPEN PULSE / SPATIAL DECISION RECEIPT</text>
  <text x="54" y="112" class="ink h1">系统选项：先选可回退的公共网络，再发布 AI</text>
  <text x="54" y="148" class="muted small">HOLD · 设计参考 · 授权 0 · 现场观察 0 · baseline unknown · 不代表部署结果</text>
  <rect x="54" y="184" width="1092" height="188" rx="10" class="panel"/>
  <text x="78" y="222" class="gold h2">三种空间策略</text>
  <rect x="78" y="244" width="318" height="104" rx="8" class="reject"/>
  <text x="98" y="278" class="red h2">OP-A  REJECT</text>
  <text x="98" y="310" class="ink body">单一 AI 展示轴</text>
  <text x="98" y="336" class="muted tiny">普通服务被降为附属 · 回到 BASE</text>
  <rect x="424" y="244" width="318" height="104" rx="8" class="revise"/>
  <text x="444" y="278" class="gold h2">OP-B  REVISE</text>
  <text x="444" y="310" class="ink body">单点旗舰发布厅</text>
  <text x="444" y="336" class="muted tiny">补足分布式照护、申诉和维护</text>
  <rect x="770" y="244" width="352" height="104" rx="8" class="chosen"/>
  <text x="790" y="278" class="accent h2">OP-C  ADVANCE</text>
  <text x="790" y="310" class="ink body">三节点公共发布网络</text>
  <text x="790" y="336" class="muted tiny">众智园 · AI 原点 · 大钟寺 → 设计审查</text>
  <rect x="54" y="398" width="1092" height="94" rx="10" class="panel"/>
  <text x="78" y="434" class="gold h2">尺度链</text>
  <text x="78" y="470" class="ink body">1:5000</text><line x1="172" y1="462" x2="224" y2="462" class="rule"/><text x="240" y="470" class="ink body">1:2000</text><line x1="350" y1="462" x2="402" y2="462" class="rule"/><text x="418" y="470" class="ink body">1:500</text><line x1="500" y1="462" x2="552" y2="462" class="rule"/><text x="568" y="470" class="ink body">1:100</text><line x1="650" y1="462" x2="702" y2="462" class="rule"/><text x="718" y="470" class="ink body">1:50</text>
  <text x="830" y="470" class="muted tiny">区域关系 → 节点 → 可进入接口</text>
  <rect x="54" y="518" width="532" height="188" rx="10" class="panel"/>
  <text x="78" y="556" class="gold h2">五项居民权利</text>
  <text x="82" y="590" class="ink small">01 普通进入与无 App 服务</text>
  <text x="82" y="618" class="ink small">02 无障碍与照护回退</text>
  <text x="82" y="646" class="ink small">03 状态、申诉与暂停</text>
  <text x="82" y="674" class="ink small">04 隐私、拒绝与退出</text>
  <text x="82" y="702" class="ink small">05 维护与劳动者安全</text>
  <rect x="614" y="518" width="532" height="188" rx="10" class="panel"/>
  <text x="638" y="556" class="gold h2">五道共享闸门</text>
  <text x="638" y="590" class="ink small">G1 BASE 先于 BOOST</text>
  <text x="638" y="618" class="ink small">G2 三节点连续可达</text>
  <text x="638" y="646" class="ink small">G3 人工接收与维护</text>
  <text x="638" y="674" class="ink small">G4 公开状态与补救</text>
  <text x="638" y="702" class="ink small">G5 BLACKOUT 回 BASE，清权收口</text>
</svg>
