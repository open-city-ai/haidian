<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-label="三站交付回执：责任、采购、人员、成本方法和退出同时入场"><rect width="2400" height="1350" fill="#0c2136"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="78" y="72" text-anchor="start" font-size="22" font-weight="650" fill="#e1b742" letter-spacing="1.4" opacity="1">DELIVERY + OPERATIONS RECEIPT / 07</text><text x="2322" y="72" text-anchor="end" font-size="20" font-weight="400" fill="#55c7c3" letter-spacing="0.8" opacity="1">V3.2 / PROVISIONAL / DESIGN TARGETS ONLY</text><text x="78" y="154" text-anchor="start" font-size="58" font-weight="720" fill="#fffdf8" letter-spacing="0" opacity="1">三站交付回执：责任、采购、人员、成本方法和退出同时入场</text><text x="78" y="208" text-anchor="start" font-size="25" font-weight="400" fill="#91a9bb" letter-spacing="0" opacity="1">只定义责任类型和验收路径；真实单位、金额、许可、SLA 实绩仍未确认</text><line x1="78" y1="238" x2="2322" y2="238" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><rect x="78" y="280" width="720" height="790" rx="26" fill="#132d48" stroke="#74ad91" stroke-width="4" opacity="1"/><text x="110" y="330" text-anchor="start" font-size="25" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">众智园可信测试花园</text><text x="110" y="370" text-anchor="start" font-size="17" font-weight="700" fill="#74ad91" letter-spacing="0" opacity="1">六类责任角色 / 全部待确认</text><text x="126" y="415" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 规划/景观设计</text><text x="126" y="446" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 限时测试运营</text><text x="126" y="477" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 公园资产维护</text><text x="126" y="508" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 权利与数据管家</text><text x="126" y="539" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 独立无障碍/消防复核</text><line x1="110" y1="590" x2="766" y2="590" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="110" y="630" text-anchor="start" font-size="18" font-weight="700" fill="#e1b742" letter-spacing="0" opacity="1">采购与成本边界</text><text x="126" y="670" text-anchor="start" font-size="15" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">勘察 → 可逆样机 → 独立验收</text><text x="126" y="704" text-anchor="start" font-size="15" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">限时服务 → 保留 / 重做 / 退出</text><text x="126" y="744" text-anchor="start" font-size="14" font-weight="650" fill="#ee8b55" letter-spacing="0" opacity="1">金额：unknown；按构件、人员、维护和复原询价</text><text x="110" y="800" text-anchor="start" font-size="18" font-weight="700" fill="#55c7c3" letter-spacing="0" opacity="1">服务目标 / 尚未现场观测</text><text x="126" y="842" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 障碍即停；15 分钟内隔离</text><text x="126" y="876" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 停止决定 15 分钟内更新状态板</text><text x="126" y="910" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 重开前签署主链与地面复原检查</text><rect x="110" y="958" width="656" height="76" rx="14" fill="#381f25" stroke="#dc5c50" stroke-width="2" opacity="1"/><text x="438" y="1005" text-anchor="middle" font-size="16" font-weight="750" fill="#ffc5bd" letter-spacing="0" opacity="1">任一责任、容量或复原门不清：保持 HOLD</text><rect x="850" y="280" width="720" height="790" rx="26" fill="#132d48" stroke="#78a8e8" stroke-width="4" opacity="1"/><text x="882" y="330" text-anchor="start" font-size="25" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">AI 原点开源复核街</text><text x="882" y="370" text-anchor="start" font-size="17" font-weight="700" fill="#78a8e8" letter-spacing="0" opacity="1">六类责任角色 / 全部待确认</text><text x="898" y="415" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 城市/服务设计</text><text x="898" y="446" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 发布室人工运营</text><text x="898" y="477" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 建筑与公共界面维护</text><text x="898" y="508" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 清权与档案管家</text><text x="898" y="539" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 独立文保/居民影响复核</text><line x1="882" y1="590" x2="1538" y2="590" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="882" y="630" text-anchor="start" font-size="18" font-weight="700" fill="#e1b742" letter-spacing="0" opacity="1">采购与成本边界</text><text x="898" y="670" text-anchor="start" font-size="15" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">勘察 → 可逆样机 → 独立验收</text><text x="898" y="704" text-anchor="start" font-size="15" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">限时服务 → 保留 / 重做 / 退出</text><text x="898" y="744" text-anchor="start" font-size="14" font-weight="650" fill="#ee8b55" letter-spacing="0" opacity="1">金额：unknown；按构件、人员、维护和复原询价</text><text x="882" y="800" text-anchor="start" font-size="18" font-weight="700" fill="#55c7c3" letter-spacing="0" opacity="1">服务目标 / 尚未现场观测</text><text x="898" y="842" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 权利争议内容立即隐藏</text><text x="898" y="876" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 1 个工作日受理，5 个工作日给状态</text><text x="898" y="910" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 确认无效后 48 小时内移除或替换</text><rect x="882" y="958" width="656" height="76" rx="14" fill="#381f25" stroke="#dc5c50" stroke-width="2" opacity="1"/><text x="1210" y="1005" text-anchor="middle" font-size="16" font-weight="750" fill="#ffc5bd" letter-spacing="0" opacity="1">任一责任、容量或复原门不清：保持 HOLD</text><rect x="1622" y="280" width="720" height="790" rx="26" fill="#132d48" stroke="#ee8b55" stroke-width="4" opacity="1"/><text x="1654" y="330" text-anchor="start" font-size="25" font-weight="750" fill="#fffdf8" letter-spacing="0" opacity="1">大钟寺日常发布客厅</text><text x="1654" y="370" text-anchor="start" font-size="17" font-weight="700" fill="#ee8b55" letter-spacing="0" opacity="1">六类责任角色 / 全部待确认</text><text x="1670" y="415" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 站区/活动设计</text><text x="1670" y="446" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 活动控制室</text><text x="1670" y="477" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 公共空间/商业/清运维护</text><text x="1670" y="508" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 内容与数据管家</text><text x="1670" y="539" text-anchor="start" font-size="16" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 独立轨道/交通/消防复核</text><line x1="1654" y1="590" x2="2310" y2="590" stroke="#36516a" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="1654" y="630" text-anchor="start" font-size="18" font-weight="700" fill="#e1b742" letter-spacing="0" opacity="1">采购与成本边界</text><text x="1670" y="670" text-anchor="start" font-size="15" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">勘察 → 可逆样机 → 独立验收</text><text x="1670" y="704" text-anchor="start" font-size="15" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">限时服务 → 保留 / 重做 / 退出</text><text x="1670" y="744" text-anchor="start" font-size="14" font-weight="650" fill="#ee8b55" letter-spacing="0" opacity="1">金额：unknown；按构件、人员、维护和复原询价</text><text x="1654" y="800" text-anchor="start" font-size="18" font-weight="700" fill="#55c7c3" letter-spacing="0" opacity="1">服务目标 / 尚未现场观测</text><text x="1670" y="842" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 消防/客流/积水/噪声越线即归零</text><text x="1670" y="876" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 计划闭场后 30 分钟内复原检查</text><text x="1670" y="910" text-anchor="start" font-size="14" font-weight="400" fill="#d5e0e8" letter-spacing="0" opacity="1">• 14 日内公开缺陷、投诉与影响复盘</text><rect x="1654" y="958" width="656" height="76" rx="14" fill="#381f25" stroke="#dc5c50" stroke-width="2" opacity="1"/><text x="1982" y="1005" text-anchor="middle" font-size="16" font-weight="750" fill="#ffc5bd" letter-spacing="0" opacity="1">任一责任、容量或复原门不清：保持 HOLD</text><rect x="78" y="1110" width="2264" height="122" rx="20" fill="#102943" stroke="#e1b742" stroke-width="3" opacity="1"/><text x="110" y="1150" text-anchor="start" font-size="20" font-weight="750" fill="#e1b742" letter-spacing="0" opacity="1">六道共享交付门</text><text x="110" y="1196" text-anchor="start" font-size="14" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">1. 尺寸可替换</text><text x="475" y="1196" text-anchor="start" font-size="14" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">2. 普通路线独立</text><text x="840" y="1196" text-anchor="start" font-size="14" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">3. 容量输入未齐不放行</text><text x="1205" y="1196" text-anchor="start" font-size="14" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">4. 单位与金额不冒认</text><text x="1570" y="1196" text-anchor="start" font-size="14" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">5. 测试必有停用与复原</text><text x="1935" y="1196" text-anchor="start" font-size="14" font-weight="600" fill="#d5e0e8" letter-spacing="0" opacity="1">6. 永久保留另走法定程序</text><text x="78" y="1310" text-anchor="start" font-size="16" font-weight="400" fill="#91a9bb" letter-spacing="0" opacity="1">本页是交付问题清单，不是预算、采购文件、组织承诺、许可或已达到的服务水平。</text></g></svg>
