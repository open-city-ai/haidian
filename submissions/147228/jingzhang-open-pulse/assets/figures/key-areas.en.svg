  <g><rect x="405" y="1055" width="560" height="210" rx="24" fill="#e2ebf8" stroke="#91afe0" stroke-width="5"/><circle cx="690" cy="1160" r="47" fill="#9eb9df" stroke="#14283a" stroke-width="5"/><text x="690" y="1175" font-size="38" text-anchor="middle" fill="#fff">02</text><text x="990" y="1130" class="small" font-weight="650">AI Origin</text><text x="990" y="1175" class="label muted">open conversion street</text></g>
