  <text x="180" y="112" class="small muted">JING-ZHANG OPEN PULSE / HUMAN-SCALE SPATIAL PROTOTYPES</text>
  <text x="180" y="245" font-size="78" font-weight="650">03 / Three key areas: three everyday journeys</text>
  <text x="180" y="330" font-size="39" class="muted">Put provisional geometry, the ordinary route, human gate, stop condition and return to daily use on one board</text>
  <text x="3660" y="112" font-size="30" text-anchor="end" fill="#e86f43">V2.3 / PROVISIONAL / CONCEPT ONLY</text>
