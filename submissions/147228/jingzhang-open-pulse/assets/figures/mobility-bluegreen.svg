<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-label="04 / 先保普通路线，再谈具身智能"><rect width="1800" height="1080" fill="#f6f3ed"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="80" y="66" text-anchor="start" font-size="19" font-weight="400" fill="#61788b" letter-spacing="0.7">JING-ZHANG OPEN PULSE / MOBILITY + PUBLIC ROUTE GATES</text><text x="1720" y="66" text-anchor="end" font-size="18" font-weight="400" fill="#ea8f5c" letter-spacing="0.5">V2.4 / PROVISIONAL / CONCEPT ONLY</text><text x="80" y="132" text-anchor="start" font-size="49" font-weight="700" fill="#14283a" letter-spacing="0">04 / 先保普通路线，再谈具身智能</text><text x="80" y="178" text-anchor="start" font-size="23" font-weight="400" fill="#61788b" letter-spacing="0">慢行、蓝绿与 S-02 共用一套放行顺序；桌面回放通过不等于现场可用</text><line x1="80" y1="205" x2="1720" y2="205" stroke="#c6d3d3" stroke-width="2" stroke-linecap="round"/><rect x="80" y="240" width="650" height="600" rx="26" fill="#fffefa" stroke="#c6d3d3" stroke-width="3"/><text x="120" y="292" text-anchor="start" font-size="25" font-weight="650" fill="#14283a" letter-spacing="0">普通慢行主轴</text><text x="690" y="292" text-anchor="end" font-size="20" font-weight="400" fill="#61788b" letter-spacing="0">两翼接口</text><line x1="250" y1="340" x2="250" y2="750" stroke="#14283a" stroke-width="10" stroke-linecap="round"/><path d="M250 360 C85 410,85 680,250 730" fill="none" stroke="#88ace1" stroke-width="5"/><path d="M250 360 C430 410,430 680,250 730" fill="none" stroke="#73a892" stroke-width="5"/><circle cx="250" cy="400" r="18" fill="#73a892" stroke="#14283a" stroke-width="3"/><line x1="270" y1="400" x2="335" y2="400" stroke="#73a892" stroke-width="4" stroke-linecap="round"/><rect x="335" y="358" width="330" height="84" rx="18" fill="#e1eee8" stroke="#73a892" stroke-width="3"/><text x="365" y="402" text-anchor="start" font-size="25" font-weight="650" fill="#14283a" letter-spacing="0">众智园</text><text x="635" y="402