a" letter-spacing="0">普通服务保持可用</text><text x="890" y="380" text-anchor="start" font-size="17" font-weight="400" fill="#61788b" letter-spacing="0">步行路线、人工服务与手推车不因测试关闭</text><circle cx="835" cy="455" r="27" fill="#88ace1" stroke="#14283a" stroke-width="3"/><text x="835" y="462" text-anchor="middle" font-size="17" font-weight="700" fill="#14283a" letter-spacing="0">G1</text><line x1="835" y1="484" x2="835" y2="531" stroke="#c6d3d3" stroke-width="4" stroke-linecap="round"/><text x="890" y="451" text-anchor="start" font-size="24" font-weight="680" fill="#14283a" letter-spacing="0">合成桌面回放 PASS</text><text x="890" y="485" text-anchor="start" font-size="17" font-weight="400" fill="#61788b" letter-spacing="0">4/4 夹具 / 6/6 检查 / 5/5 恢复步骤</text><circle cx="835" cy="560" r="27" fill="#ea8f5c" stroke="#14283a" stroke-width="3"/><text x="835" y="567" text-anchor="middle" font-size="17" font-weight="700" fill="#14283a" letter-spacing="0">G2</text><line x1="835" y1="589" x2="835" y2="636" stroke="#c6d3d3" stroke-width="4" stroke-linecap="round"/><text x="890" y="556" text-anchor="start" font-size="24" font-weight="680" fill="#14283a" letter-spacing="0">有限现场窗口 HOLD</text><text x="890" y="590" text-anchor="start" font-size="17" font-weight="400" fill="#61788b" letter-spacing="0">场地、无障碍、安全、许可、维护责任与接管证据未齐</text><circle cx="835" cy="665" r="27" fill="#e3bb58" stroke="#14283a" stroke-width="3"/><text x="835" y="672" text-anchor="middle" font-size="15" font-weight="700" fill="#14283a" letter-spacing="0">G3+</text><text x="890" y="661" text-anchor="start" font-size="24" font-weight="680" fill="#14283a" letter-spacing="0">现场绩效保持 unknown</text><text x="890" y="695" text-anchor="start" font-size="17" font-weight="400" fill="#61788b" letter-spacing="0">未授权、未运行，不给出通行、安全或服务效果结论</text><rect x="810" y="730" width="865" height="82" rx="18" fill="#f5edda" stroke="#e3bb58" stroke-width="2"/><text x="845" y="764" text-anchor="start" font-size="18" font-weight="700" fill="#9c7319" letter-spacing="0">停止触发</text><text x="845" y="793" text-anchor="start" font-size="15" font-weight="400" fill="#14283a" letter-spacing="0">行人冲突、路线变窄、停止信号失败、接管人失去视线或泊位不可用，立即清空设备并恢复普通路线。</text><rect x="80" y="875" width="390" height="125" rx="18" fill="#fffdf9" stroke="#c6d3d3" stroke-width="2"/><rect x="80" y="875" width="10" height="125" rx="5" fill="#73a892"/><text x="108" y="910" text-anchor="start" font-size="17" font-weight="600" fill="#61788b" letter-spacing="0">慢行网络</text><text x="108" y="955" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">13.01 km</text><text x="270" y="955" text-anchor="start" font-size="13" font-weight="400" fill="#61788b" letter-spacing="0">concept network</text><rect x="500" y="875" width="390" height="125" rx="18" fill="#fffdf9" stroke="#c6d3d3" stroke-width="2"/><rect x="500" y="875" width="10" height="125" rx="5" fill="#88ace1"/><text x="528" y="910" text-anchor="start" font-size="17" font-weight="600" fill="#61788b" letter-spacing="0">东西连接</text><text x="528" y="955" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">3 条</text><text x="690" y="955" text-anchor="start" font-size="13" font-weight="400" fill="#61788b" letter-spacing="0">key-area connectors</text><rect x="920" y="875" width="390" height="125" rx="18" fill="#fffdf9" stroke="#c6d3d3" stroke-width="2"/><rect x="920" y="875" width="10" height="125" rx="5" fill="#ea8f5c"/><text x="948" y="910" text-anchor="start" font-size="17" font-weight="600" fill="#61788b" letter-spacing="0">公共空间</text><text x="948" y="955" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">7.33%</text><text x="1110" y="955" text-anchor="start" font-size="13" font-weight="400" fill="#61788b" letter-spacing="0">directly recomputable</text><rect x="1340" y="875" width="390" height="125" rx="18" fill="#fffdf9" stroke="#c6d3d3" stroke-width="2"/><rect x="1340" y="875" width="10" height="125" rx="5" fill="#e3bb58"/><text x="1368" y="910" text-anchor="start" font-size="17" font-weight="600" fill="#61788b" letter-spacing="0">映射过街点</text><text x="1368" y="955" text-anchor="start" font-size="28" font-weight="700" fill="#14283a" letter-spacing="0">189</text><text x="1530" y="955" text-anchor="start" font-size="13" font-weight="400" fill="#61788b" letter-spacing="0">low-confidence OSM</text><text x="80" y="1045" text-anchor="start" font-size="14" font-weight="400" fill="#61788b" letter-spacing="0">来源  roads.geojson + metrics.json + S-02 tabletop evidence / 交通安全、无障碍和工程承载仍待现场审计</text><text x="1720" y="1045" text-anchor="end" font-size="14" font-weight="400" fill="#61788b" letter-spacing="0">许丙南 × Codex / V2.4</text></g></svg>
