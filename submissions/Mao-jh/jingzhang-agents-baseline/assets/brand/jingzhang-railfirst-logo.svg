<?xml version="1.0" encoding="UTF-8"?>
<!--
  京张·先轨后城创新带 · 主标志 (Primary Logo)
  矢量构造：一段被连续绿廊包裹的铁路轨道线（自北向南）逐渐“长出”建筑形体。
  色彩：遗址锈色 #8A4B2A（主）、海淀科技蓝 #295F9F（辅）、公园绿 #15803D（绿廊）。
  许可：原创生成资产；由提交 Agent（Mao-jh）绘制，随提交包开源共享。
  注意：本文件不内嵌字体，文字以系统字体渲染；不构成商标注册主张（见 report/copyright_statement.md 第 5.1 节）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 168" role="img" aria-label="京张·先轨后城创新带主标志：一段被绿廊包裹的轨道线逐渐长出建筑形体">
  <defs>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3a1e"/>
      <stop offset="1" stop-color="#8A4B2A"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#295F9F"/>
      <stop offset="1" stop-color="#1d4573"/>
    </linearGradient>
  </defs>

  <!-- 轨道线（自北向南延伸的铁路廊） -->
  <path d="M24 132 C120 132 150 92 232 84 C320 75 360 108 448 96 C480 90 508 82 540 74"
        fill="none" stroke="url(#railGrad)" stroke-width="11" stroke-linecap="round"/>

  <!-- 绿廊（包裹轨道、代表遗址公园绿廊） -->
  <path d="M24 132 C120 132 150 92 232 84 C320 75 360 108 448 96 C480 90 508 82 540 74"
        fill="none" stroke="#15803D" stroke-width="4.5" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.9"/>

  <!-- 锈色轨道枕木节点（历史锚点） -->
  <circle cx="232" cy="84" r="7" fill="#8A4B2A" stroke="#fff" stroke-width="2"/>
  <circle cx="448" cy="96" r="7" fill="#8A4B2A" stroke="#fff" stroke-width="2"/>

  <!-- 自轨道“长出”的建筑形体（北小南大，体现先轨后城的生长时序） -->
  <g fill="url(#buildingGrad)">
    <rect x="120" y="88" width="16" height="44" rx="2"/>
    <rect x="142" y="78" width="18" height="54" rx="2"/>
    <rect x="166" y="66" width="20" height="66" rx="2"/>
    <rect x="236" y="40" width="22" height="44" rx="2"/>
    <rect x="264" y="30" width="26" height="54" rx="2"/>
    <rect x="296" y="46" width="24" height="38" rx="2"/>
    <rect x="452" y="52" width="20" height="44" rx="2"/>
    <rect x="478" y="40" width="24" height="56" rx="2"/>
  </g>

  <!-- 建筑顶部“发光”节点（AI / 数据锚点） -->
  <g fill="#4F46E5">
    <circle cx="151" cy="78" r="3"/>
    <circle cx="277" cy="30" r="3.5"/>
    <circle cx="490" cy="40" r="3.5"/>
  </g>

  <!-- 文字标（系统字体渲染，不嵌入） -->
  <text x="24" y="34" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#162033" letter-spacing="2">京张 · 先轨后城</text>
  <text x="27" y="56" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500" fill="#667085" letter-spacing="4">百年京张 AI 创新带</text>
  <text x="27" y="158" font-family="Arial,'Helvetica Neue',sans-serif" font-size="11" font-weight="600" fill="#8A4B2A" letter-spacing="3">RAIL-FIRST INNOVATION BELT</text>
</svg>
