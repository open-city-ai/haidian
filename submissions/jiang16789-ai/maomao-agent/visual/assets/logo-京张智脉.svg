<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/><stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C79838"/><stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  <!-- 外圆 -->
  <circle cx="200" cy="200" r="185" fill="url(#logoGrad)" stroke="#C79838" stroke-width="6"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#C79838" stroke-width="0.8" opacity="0.4"/>
  <!-- 京张符号：铁路→AI -->
  <g stroke="#C79838" stroke-width="5" stroke-linecap="round" fill="none">
    <!-- 铁轨横杠（京张铁路） -->
    <line x1="110" y1="110" x2="180" y2="110"/><line x1="145" y1="100" x2="145" y2="120"/>
    <line x1="110" y1="170" x2="180" y2="170"/><line x1="145" y1="160" x2="145" y2="180"/>
    <!-- 轨道线 -->
    <line x1="80" y1="200" x2="140" y2="200"/><line x1="90" y1="190" x2="90" y2="210"/>
    <!-- AI 节点脉冲 -->
    <circle cx="220" cy="140" r="18" fill="none" stroke="#6366F1" stroke-width="3"/>
    <circle cx="260" cy="200" r="22" fill="none" stroke="#10B981" stroke-width="3"/>
    <circle cx="220" cy="260" r="18" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <!-- 连接弧 -->
    <path d="M 238 140 Q 280 170 260 200" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 260 222 Q 280 240 238 260" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
  <!-- 竖井符号 -->
  <rect x="185" y="288" width="30" height="30" rx="4" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
  <text x="200" y="310" text-anchor="middle" font-family="PingFang SC, STHeiti, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">井</text>
  <!-- 文字 -->
  <text x="200" y="355" text-anchor="middle" font-family="PingFang SC, STHeiti, sans-serif" font-size="28" font-weight="700" fill="#C79838" letter-spacing="6">京张智脉</text>
  <text x="200" y="385" text-anchor="middle" font-family="PingFang SC, STHeiti, sans-serif" font-size="12" fill="#94A3B8" letter-spacing="3">竖 井 协 同</text>
</svg>
