<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <linearGradient id="coreA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#3730A3"/></linearGradient>
    <linearGradient id="coreB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#065F46"/></linearGradient>
    <linearGradient id="coreC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#B45309"/></linearGradient>
    <filter id="softShadow"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="0.8" fill="#D1D5DB" opacity="0.4"/></pattern>
  </defs>

  <rect width="1800" height="1260" fill="#FBFBF9"/>
  <rect x="24" y="24" width="1752" height="1212" rx="12" fill="#FBFBF9" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="30" y="30" width="1740" height="1200" rx="9" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  <rect x="24" y="24" width="60" height="4" fill="#C79838"/><rect x="1716" y="24" width="60" height="4" fill="#C79838"/>
  <rect x="24" y="1232" width="60" height="4" fill="#C79838"/><rect x="1716" y="1232" width="60" height="4" fill="#C79838"/>

  <text x="900" y="90" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#0F172A" letter-spacing="8">三处重点区域 · 差异化定位</text>
  <text x="900" y="130" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="18" fill="#64748B" letter-spacing="4">研发 → 转化 → 应用 → 反馈　　三核联动不重复，功能互补形成闭环</text>
  <line x1="640" y1="150" x2="1160" y2="150" stroke="#C79838" stroke-width="2"/>
  <rect x="180" y="180" width="1440" height="900" rx="8" fill="url(#dotGrid)" opacity="0.5"/>

  <!-- 北核：众智园 -->
  <g filter="url(#softShadow)">
    <rect x="140" y="210" width="460" height="520" rx="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5"/>
  </g>
  <rect x="140" y="210" width="460" height="72" rx="18" fill="url(#coreA)"/>
  <rect x="140" y="256" width="460" height="26" fill="url(#coreA)"/>
  <text x="370" y="258" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="6">众 智 园</text>
  <text x="370" y="300" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" fill="#C7D2FE" letter-spacing="3">AI 自主创新加速区 · 北区</text>
  <line x1="190" y1="318" x2="550" y2="318" stroke="#E2E8F0" stroke-width="1"/>

  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif">
    <rect x="180" y="340" width="380" height="46" rx="6" fill="#EEF2FF"/>
    <text x="370" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#4338CA">01　开放工程院 + 花园测试庭院</text>
    <rect x="180" y="396" width="380" height="46" rx="6" fill="#F5F3FF"/>
    <text x="370" y="426" text-anchor="middle" font-size="16" font-weight="600" fill="#4F46E5">02　开放模型评测 / 机器人低速测试</text>
    <rect x="180" y="452" width="380" height="46" rx="6" fill="#EEF2FF"/>
    <text x="370" y="482" text-anchor="middle" font-size="16" font-weight="600" fill="#4338CA">03　共享中试接口 / 首层展廊</text>
    <rect x="180" y="508" width="380" height="46" rx="6" fill="#F5F3FF"/>
    <text x="370" y="538" text-anchor="middle" font-size="16" font-weight="600" fill="#4F46E5">04　封闭测试与公共游憩物理分离</text>
  </g>

  <!-- 北核 badge -->
  <circle cx="550" cy="228" r="28" fill="#4338CA" opacity="0.9"/>
  <text x="550" y="236" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">北</text>

  <!-- 中核：AI原点社区 -->
  <g filter="url(#softShadow)">
    <rect x="670" y="210" width="460" height="520" rx="18" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
  </g>
  <rect x="670" y="210" width="460" height="72" rx="18" fill="url(#coreB)"/>
  <rect x="670" y="256" width="460" height="26" fill="url(#coreB)"/>
  <text x="900" y="258" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="3">AI 原点社区</text>
  <text x="900" y="300" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" fill="#A7F3D0" letter-spacing="3">转化与人才共同体 · 中区（核心）</text>
  <line x1="720" y1="318" x2="1080" y2="318" stroke="#E2E8F0" stroke-width="1"/>

  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif">
    <rect x="710" y="340" width="380" height="46" rx="6" fill="#ECFDF5"/>
    <text x="900" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#065F46">01　校园成果到城市服务第一公里</text>
    <rect x="710" y="396" width="380" height="46" rx="6" fill="#D1FAE5"/>
    <text x="900" y="426" text-anchor="middle" font-size="16" font-weight="600" fill="#047857">02　开源发布 / 成果孵化</text>
    <rect x="710" y="452" width="380" height="46" rx="6" fill="#ECFDF5"/>
    <text x="900" y="482" text-anchor="middle" font-size="16" font-weight="600" fill="#065F46">03　知识产权与法律门诊</text>
    <rect x="710" y="508" width="380" height="46" rx="6" fill="#D1FAE5"/>
    <text x="900" y="538" text-anchor="middle" font-size="16" font-weight="600" fill="#047857">04　青年协作 / 人才生活</text>
  </g>
  <circle cx="1080" cy="228" r="28" fill="#065F46" opacity="0.9"/>
  <text x="1080" y="236" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">中</text>

  <!-- 南核：大钟寺 -->
  <g filter="url(#softShadow)">
    <rect x="1200" y="210" width="460" height="520" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  </g>
  <rect x="1200" y="210" width="460" height="72" rx="18" fill="url(#coreC)"/>
  <rect x="1200" y="256" width="460" height="26" fill="url(#coreC)"/>
  <text x="1430" y="258" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="6">大 钟 寺</text>
  <text x="1430" y="300" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" fill="#FDE68A" letter-spacing="3">AI 产业聚集区 · 南区</text>
  <line x1="1250" y1="318" x2="1610" y2="318" stroke="#E2E8F0" stroke-width="1"/>

  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif">
    <rect x="1240" y="340" width="380" height="46" rx="6" fill="#FFF7ED"/>
    <text x="1430" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#B45309">01　站点四象限门户整合</text>
    <rect x="1240" y="396" width="380" height="46" rx="6" fill="#FEF3C7"/>
    <text x="1430" y="426" text-anchor="middle" font-size="16" font-weight="600" fill="#D97706">02　智能体 / 终端 / 数字内容</text>
    <rect x="1240" y="452" width="380" height="46" rx="6" fill="#FFF7ED"/>
    <text x="1430" y="482" text-anchor="middle" font-size="16" font-weight="600" fill="#B45309">03　不消费也可停留的城市客厅</text>
    <rect x="1240" y="508" width="380" height="46" rx="6" fill="#FEF3C7"/>
    <text x="1430" y="538" text-anchor="middle" font-size="16" font-weight="600" fill="#D97706">04　国际协作 / 无障碍服务</text>
  </g>
  <circle cx="1610" cy="228" r="28" fill="#B45309" opacity="0.9"/>
  <text x="1610" y="236" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">南</text>

  <!-- 连接箭头 -->
  <path d="M 610 500 L 660 500" stroke="#DC2626" stroke-width="3.5" marker-end="url(#arrowR)"/>
  <path d="M 1140 500 L 1190 500" stroke="#DC2626" stroke-width="3.5" marker-end="url(#arrowR)"/>
  <defs><marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker></defs>

  <!-- 底部汇总 -->
  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif">
    <rect x="140" y="760" width="1520" height="80" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="240" y="806" font-size="17" font-weight="700" fill="#4338CA">研发核</text>
    <text x="320" y="806" font-size="15" fill="#475569">：承载风险最高的新技术测试，安全红区内可控验证</text>
    <text x="770" y="806" font-size="17" font-weight="700" fill="#065F46">转化核</text>
    <text x="850" y="806" font-size="15" fill="#475569">：校园成果的第一公里，人才、知产与资本的密集交汇点</text>
    <text x="1280" y="806" font-size="17" font-weight="700" fill="#B45309">应用核</text>
    <text x="1360" y="806" font-size="15" fill="#475569">：可停留、可消费、可协作的城市界面，国际会客厅</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(80, 1120)">
    <rect x="0" y="0" width="1640" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="28" r="10" fill="url(#coreA)"/>
    <text x="50" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">众智园 · 研发验证核</text>
    <circle cx="250" cy="28" r="10" fill="url(#coreB)"/>
    <text x="272" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">AI原点社区 · 转化孵化核</text>
    <circle cx="510" cy="28" r="10" fill="url(#coreC)"/>
    <text x="532" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">大钟寺 · 应用会客核</text>
    <line x1="750" y1="28" x2="800" y2="28" stroke="#DC2626" stroke-width="3"/>
    <text x="814" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">研发→转化→应用→反馈</text>
  </g>

  <text x="1766" y="1236" text-anchor="end" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8" letter-spacing="1">京张智脉 · 竖井协同　｜　2026-08</text>
</svg>
