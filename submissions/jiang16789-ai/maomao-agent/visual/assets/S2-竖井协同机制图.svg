<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <linearGradient id="tunnelGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1E293B"/><stop offset="30%" stop-color="#334155"/><stop offset="70%" stop-color="#334155"/><stop offset="100%" stop-color="#1E293B"/></linearGradient>
    <linearGradient id="shaftGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <filter id="softShadow"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <filter id="innerGlow"><feGaussianBlur stdDeviation="2"/><feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="0.8" fill="#D1D5DB" opacity="0.4"/></pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1800" height="1260" fill="#FBFBF9"/>
  <rect x="24" y="24" width="1752" height="1212" rx="12" fill="#FBFBF9" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="30" y="30" width="1740" height="1200" rx="9" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  <rect x="24" y="24" width="60" height="4" fill="#C79838"/><rect x="1716" y="24" width="60" height="4" fill="#C79838"/>
  <rect x="24" y="1232" width="60" height="4" fill="#C79838"/><rect x="1716" y="1232" width="60" height="4" fill="#C79838"/>

  <!-- 标题 -->
  <text x="900" y="90" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#0F172A" letter-spacing="8">竖井协同机制</text>
  <text x="900" y="130" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="18" fill="#64748B" letter-spacing="4">借鉴八达岭隧道竖井开凿法：中途开井 · 多工作面并行 · 分级验证</text>
  <line x1="640" y1="150" x2="1160" y2="150" stroke="#C79838" stroke-width="2"/>
  <rect x="180" y="180" width="1440" height="900" rx="8" fill="url(#dotGrid)" opacity="0.5"/>

  <!-- 地面线 -->
  <line x1="200" y1="510" x2="1600" y2="510" stroke="#475569" stroke-width="3"/>
  <text x="200" y="502" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#475569">地面</text>

  <!-- 地下隧道 -->
  <g filter="url(#softShadow)">
    <rect x="240" y="540" width="1320" height="140" rx="70" fill="url(#tunnelGrad)"/>
  </g>
  <text x="900" y="618" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#CBD5E1" letter-spacing="6">京张创新长隧道</text>
  <text x="900" y="648" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8" letter-spacing="2">封闭研发 → 开放验证：每个竖井是一个可进入、可复核、可退出的验证工作面</text>

  <!-- 四口竖井 -->
  <g filter="url(#softShadow)">
    <!-- 井1 -->
    <rect x="380" y="280" width="80" height="230" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <rect x="390" y="280" width="60" height="60" rx="8" fill="url(#shaftGrad)"/>
    <text x="420" y="318" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">井</text>
    <text x="420" y="368" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#92400E">开放评测</text>
    <text x="420" y="394" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">评测框架</text>
    <text x="420" y="416" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">安全红区</text>
    <text x="420" y="438" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">可控出口</text>

    <!-- 井2 -->
    <rect x="640" y="280" width="80" height="230" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <rect x="650" y="280" width="60" height="60" rx="8" fill="url(#shaftGrad)"/>
    <text x="680" y="318" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">井</text>
    <text x="680" y="368" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#92400E">低速测试</text>
    <text x="680" y="394" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">限速10</text>
    <text x="680" y="416" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">物理隔离</text>
    <text x="680" y="438" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">多传感器</text>

    <!-- 井3 -->
    <rect x="900" y="280" width="80" height="230" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <rect x="910" y="280" width="60" height="60" rx="8" fill="url(#shaftGrad)"/>
    <text x="940" y="318" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">井</text>
    <text x="940" y="368" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#92400E">数据沙盒</text>
    <text x="940" y="394" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">隐私保护</text>
    <text x="940" y="416" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">实时治理</text>
    <text x="940" y="438" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">脱敏共享</text>

    <!-- 井4 -->
    <rect x="1340" y="280" width="80" height="230" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
    <rect x="1350" y="280" width="60" height="60" rx="8" fill="url(#shaftGrad)"/>
    <text x="1380" y="318" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">井</text>
    <text x="1380" y="368" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#92400E">社区议事</text>
    <text x="1380" y="394" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">众意讨论</text>
    <text x="1380" y="416" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">表达汇总</text>
    <text x="1380" y="438" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#78716C">闭环</text>
  </g>

  <!-- 井到隧道连接 -->
  <line x1="420" y1="510" x2="420" y2="540" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="680" y1="510" x2="680" y2="540" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="940" y1="510" x2="940" y2="540" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="1380" y1="510" x2="1380" y2="540" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- 多工作面并行 -->
  <path d="M 460 580 L 600 580" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M 720 620 L 860 620" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M 980 660 L 1300 660" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/></marker></defs>
  <text x="920" y="570" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#3B82F6">多工作面并行推进 →</text>

  <!-- L1/L2/L3 -->
  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif">
    <!-- L1 -->
    <rect x="270" y="780" width="380" height="130" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="270" y="780" width="380" height="44" rx="14" fill="#3B82F6"/>
    <rect x="270" y="808" width="380" height="16" fill="#3B82F6"/>
    <text x="460" y="810" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="4">L1 披露 · 信息公开</text>
    <text x="460" y="852" text-anchor="middle" font-size="15" fill="#475569">每年发布 AI 创新带安全红区定义</text>
    <text x="460" y="878" text-anchor="middle" font-size="15" fill="#475569">公开可验证的决策-数据-代码链条</text>

    <!-- L2 -->
    <rect x="710" y="780" width="380" height="130" rx="14" fill="#F0FDF4" stroke="#10B981" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="710" y="780" width="380" height="44" rx="14" fill="#10B981"/>
    <rect x="710" y="808" width="380" height="16" fill="#10B981"/>
    <text x="900" y="810" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="4">L2 受控测试 · 低速验证</text>
    <text x="900" y="852" text-anchor="middle" font-size="15" fill="#475569">限定速度/地理范围/传感器感知范围</text>
    <text x="900" y="878" text-anchor="middle" font-size="15" fill="#475569">物理安全员随时可介入终止</text>

    <!-- L3 -->
    <rect x="1150" y="780" width="380" height="130" rx="14" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="1150" y="780" width="380" height="44" rx="14" fill="#F59E0B"/>
    <rect x="1150" y="808" width="380" height="16" fill="#F59E0B"/>
    <text x="1340" y="810" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="4">L3 有界运营 · 公共服务</text>
    <text x="1340" y="852" text-anchor="middle" font-size="15" fill="#475569">公共服务结合社区创新需求</text>
    <text x="1340" y="878" text-anchor="middle" font-size="15" fill="#475569">有明确有效期与退出触发条件的牌照</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(80, 1120)">
    <rect x="0" y="0" width="1640" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="24" y="16" width="24" height="24" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="58" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">竖井工作面</text>
    <rect x="210" y="16" width="24" height="24" rx="4" fill="url(#tunnelGrad)"/>
    <text x="244" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">创新长隧道</text>
    <line x1="380" y1="28" x2="430" y2="28" stroke="#D97706" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="444" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">井-隧连接</text>
    <line x1="580" y1="28" x2="630" y2="28" stroke="#3B82F6" stroke-width="3"/>
    <text x="644" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">并行推进</text>
    <rect x="770" y="16" width="24" height="24" rx="4" fill="#3B82F6"/>
    <text x="804" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">L1 披露</text>
    <rect x="916" y="16" width="24" height="24" rx="4" fill="#10B981"/>
    <text x="950" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">L2 受控测试</text>
    <rect x="1088" y="16" width="24" height="24" rx="4" fill="#F59E0B"/>
    <text x="1122" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">L3 有界运营</text>
  </g>

  <text x="1766" y="1236" text-anchor="end" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8" letter-spacing="1">京张智脉 · 竖井协同　｜　2026-08</text>
</svg>
