<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <linearGradient id="spring" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="summer" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#065F46"/></linearGradient>
    <linearGradient id="autumn" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#B45309"/></linearGradient>
    <linearGradient id="winter" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#DC2626"/><stop offset="100%" stop-color="#991B1B"/></linearGradient>
    <filter id="softShadow"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="0.8" fill="#D1D5DB" opacity="0.4"/></pattern>
  </defs>

  <rect width="1800" height="1260" fill="#FBFBF9"/>
  <rect x="24" y="24" width="1752" height="1212" rx="12" fill="#FBFBF9" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="30" y="30" width="1740" height="1200" rx="9" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  <rect x="24" y="24" width="60" height="4" fill="#C79838"/><rect x="1716" y="24" width="60" height="4" fill="#C79838"/>
  <rect x="24" y="1232" width="60" height="4" fill="#C79838"/><rect x="1716" y="1232" width="60" height="4" fill="#C79838"/>

  <text x="900" y="90" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#0F172A" letter-spacing="8">年度运营机制 · 四季一账本</text>
  <text x="900" y="130" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="18" fill="#64748B" letter-spacing="4">每季一个竖井主题 ｜ 验证周期 · 证据复用 · 晚期失败公开可查</text>
  <line x1="640" y1="150" x2="1160" y2="150" stroke="#C79838" stroke-width="2"/>
  <rect x="180" y="180" width="1440" height="900" rx="8" fill="url(#dotGrid)" opacity="0.5"/>

  <!-- 四季度卡片 -->
  <!-- 春 -->
  <g filter="url(#softShadow)">
    <rect x="120" y="220" width="350" height="480" rx="18" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5"/>
  </g>
  <rect x="120" y="220" width="350" height="80" rx="18" fill="url(#spring)"/>
  <rect x="120" y="274" width="350" height="26" fill="url(#spring)"/>
  <circle cx="200" cy="260" r="32" fill="#FFFFFF" opacity="0.2"/>
  <text x="200" y="268" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.9">春</text>
  <text x="420" y="258" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="6">开 凿 季</text>
  <text x="420" y="288" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#C7D2FE" letter-spacing="3">Shaft Opening</text>

  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">
    <text x="150" y="360" font-weight="700" fill="#4338CA">年度场景开凿申请</text>
    <text x="150" y="390">创新者提交年度场景计划书</text>
    <text x="150" y="416">说明安全红区与退出机制</text>
    <line x1="150" y1="436" x2="440" y2="436" stroke="#E2E8F0" stroke-width="1"/>
    <text x="150" y="470" font-weight="700" fill="#4338CA">验收标准公众建议</text>
    <text x="150" y="500">公开征集验收标准与测试方案</text>
    <text x="150" y="526">居民/从业者/社区委员会参与</text>
    <line x1="150" y1="546" x2="440" y2="546" stroke="#E2E8F0" stroke-width="1"/>
    <text x="150" y="580" font-weight="700" fill="#4338CA">标准修订</text>
    <text x="150" y="610">年度安全红区/验收标准更新发布</text>
    <text x="150" y="636">竖井年度数确定</text>
  </g>

  <!-- 夏 -->
  <g filter="url(#softShadow)">
    <rect x="520" y="220" width="350" height="480" rx="18" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
  </g>
  <rect x="520" y="220" width="350" height="80" rx="18" fill="url(#summer)"/>
  <rect x="520" y="274" width="350" height="26" fill="url(#summer)"/>
  <circle cx="600" cy="260" r="32" fill="#FFFFFF" opacity="0.2"/>
  <text x="600" y="268" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.9">夏</text>
  <text x="820" y="258" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="6">验 证 季</text>
  <text x="820" y="288" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#A7F3D0" letter-spacing="3">Verification Summer</text>

  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">
    <text x="550" y="360" font-weight="700" fill="#065F46">城市验证周</text>
    <text x="550" y="390">受控测试集中开跑</text>
    <text x="550" y="416">实时在线治理平台启动</text>
    <line x1="550" y1="436" x2="840" y2="436" stroke="#E2E8F0" stroke-width="1"/>
    <text x="550" y="470" font-weight="700" fill="#065F46">多工作面并行验证</text>
    <text x="550" y="500">开放评测/低速测试/数据沙盒</text>
    <text x="550" y="526">社区议事井同时运行</text>
    <line x1="550" y1="546" x2="840" y2="546" stroke="#E2E8F0" stroke-width="1"/>
    <text x="550" y="580" font-weight="700" fill="#065F46">中间决策点</text>
    <text x="550" y="610">按验收标准评估：继续/降级/退出</text>
    <text x="550" y="636">不达标竖井即时回填</text>
  </g>

  <!-- 秋 -->
  <g filter="url(#softShadow)">
    <rect x="920" y="220" width="350" height="480" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  </g>
  <rect x="920" y="220" width="350" height="80" rx="18" fill="url(#autumn)"/>
  <rect x="920" y="274" width="350" height="26" fill="url(#autumn)"/>
  <circle cx="1000" cy="260" r="32" fill="#FFFFFF" opacity="0.2"/>
  <text x="1000" y="268" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.9">秋</text>
  <text x="1220" y="258" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="6">贯 通 季</text>
  <text x="1220" y="288" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#FDE68A" letter-spacing="3">Commons Week</text>

  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">
    <text x="950" y="360" font-weight="700" fill="#B45309">全球开发者节</text>
    <text x="950" y="390">Commons Week 竞赛路演</text>
    <text x="950" y="416">国际创新社区联动</text>
    <line x1="950" y1="436" x2="1240" y2="436" stroke="#E2E8F0" stroke-width="1"/>
    <text x="950" y="470" font-weight="700" fill="#B45309">三核联动</text>
    <text x="950" y="500">研发→转化→应用成果集中展示</text>
    <text x="950" y="526">跨竖井证据串联与复用</text>
    <line x1="950" y1="546" x2="1240" y2="546" stroke="#E2E8F0" stroke-width="1"/>
    <text x="950" y="580" font-weight="700" fill="#B45309">公共价值评估</text>
    <text x="950" y="610">各竖井年度贡献评级</text>
    <text x="950" y="636">早期失败者可选择加速退出或重组授牌</text>
  </g>

  <!-- 冬 -->
  <g filter="url(#softShadow)">
    <rect x="1320" y="220" width="350" height="480" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <rect x="1320" y="220" width="350" height="80" rx="18" fill="url(#winter)"/>
  <rect x="1320" y="274" width="350" height="26" fill="url(#winter)"/>
  <circle cx="1400" cy="260" r="32" fill="#FFFFFF" opacity="0.2"/>
  <text x="1400" y="268" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.9">冬</text>
  <text x="1620" y="258" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" letter-spacing="6">回 填 季</text>
  <text x="1620" y="288" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#FECACA" letter-spacing="3">Backfill Review</text>

  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">
    <text x="1350" y="360" font-weight="700" fill="#991B1B">公共价值复盘</text>
    <text x="1350" y="390">各竖井年度贡献评级公布</text>
    <text x="1350" y="416">社区/专家/公众/媒体四方评审</text>
    <line x1="1350" y1="436" x2="1640" y2="436" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1350" y="470" font-weight="700" fill="#991B1B">未达标竖井回填</text>
    <text x="1350" y="500">贡献值低于门槛的整改/退出</text>
    <text x="1350" y="526">资源回收重新分配</text>
    <line x1="1350" y1="546" x2="1640" y2="546" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1350" y="580" font-weight="700" fill="#991B1B">次年标准制定启动</text>
    <text x="1350" y="610">基于复盘结果更新安全红区</text>
    <text x="1350" y="636">为下年开凿季提供证据基础</text>
  </g>

  <!-- 循环箭头 -->
  <path d="M 470 460 L 510 460" stroke="#64748B" stroke-width="3" marker-end="url(#arrowG)"/>
  <path d="M 870 460 L 910 460" stroke="#64748B" stroke-width="3" marker-end="url(#arrowG)"/>
  <path d="M 1270 460 L 1310 460" stroke="#64748B" stroke-width="3" marker-end="url(#arrowG)"/>
  <path d="M 1670 460 C 1720 460, 1720 260, 120 260" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <defs><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>

  <!-- 底部总结 -->
  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif">
    <rect x="120" y="730" width="1550" height="130" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="240" y="772" font-size="18" font-weight="700" fill="#0F172A" letter-spacing="4">四季一账本核心</text>
    <text x="240" y="810" font-size="15" fill="#475569">"开凿有据、验收有标、贯通可查、回填有责" —— 以社区为核心，将"数据采集-验证判断-公共价值评估-治理行动"串成一个以年为单位的闭环</text>
    <text x="240" y="840" font-size="14" fill="#94A3B8">晚期失败不丢人：冬季回填是可以公开讨论的治理常态，不是秘密研发的"烂尾工程"——公共账本让失败和成功一样有学习价值</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(80, 1120)">
    <rect x="0" y="0" width="1640" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="28" r="10" fill="url(#spring)"/>
    <text x="50" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">春·开凿</text>
    <circle cx="160" cy="28" r="10" fill="url(#summer)"/>
    <text x="182" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">夏·验证</text>
    <circle cx="292" cy="28" r="10" fill="url(#autumn)"/>
    <text x="314" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">秋·贯通</text>
    <circle cx="424" cy="28" r="10" fill="url(#winter)"/>
    <text x="446" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">冬·回填</text>
    <line x1="550" y1="28" x2="600" y2="28" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="614" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">循环反馈</text>
  </g>

  <text x="1766" y="1236" text-anchor="end" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="12" fill="#94A3B8" letter-spacing="1">京张智脉 · 竖井协同　｜　2026-08</text>
</svg>
