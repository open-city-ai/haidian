    <text x="1565" y="648" text-anchor="middle" font-size="13" fill="#64748B">汇聚平台</text>
    <rect x="1345" y="690" width="140" height="80" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="1415" y="722" text-anchor="middle" font-size="16" font-weight="600" fill="#059669">生态检验</text>
    <text x="1415" y="748" text-anchor="middle" font-size="13" fill="#64748B">城市验证</text>
