    <circle cx="900" cy="900" r="78" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="900" cy="900" r="58" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>
  <text x="900" y="886" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="4">大 钟 寺</text>
  <text x="900" y="918" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#FDE68A" letter-spacing="2">应用 · 国际会客核</text>
