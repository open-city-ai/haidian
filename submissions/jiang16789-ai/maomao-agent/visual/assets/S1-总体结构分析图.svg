  <!-- ====== 主循环箭头 ====== -->
  <g>
    <path d="M 690 420 C 500 480, 500 540, 690 570" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowRed)"/>
