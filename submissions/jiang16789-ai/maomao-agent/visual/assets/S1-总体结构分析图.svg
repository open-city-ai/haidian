    <circle cx="900" cy="360" r="98" fill="none" stroke="#0F172A" stroke-width="2"/>
    <circle cx="900" cy="360" r="78" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="900" cy="360" r="58" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>
  <text x="900" y="346" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="4">众 智 园</text>
  <text x="900" y="378" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#C7D2FE" letter-spacing="2">研发 · 可信验证核</text>
  <!-- 数据标注 -->
  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="11" fill="#6366F1">
