    <text x="900" y="703" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">校园成果 → 城市服务第一公里</text>
    <text x="900" y="725" text-anchor="middle" fill="#6B7280">开源发布 / 孵化 / 知识产权 / 人才社区</text>
