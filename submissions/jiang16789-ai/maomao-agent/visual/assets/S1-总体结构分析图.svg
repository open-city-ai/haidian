  <text x="930" y="296" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B">京张铁路遗址公园 / 南北公共活力带</text>

  <!-- ====== 三核 ====== -->
