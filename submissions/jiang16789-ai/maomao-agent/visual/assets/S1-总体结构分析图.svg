<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="50%" stop-color="#047857"/><stop offset="100%" stop-color="#064E3B"/></linearGradient>
    <linearGradient id="coreA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#3730A3"/></linearGradient>
    <linearGradient id="coreB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#065F46"/></linearGradient>
    <linearGradient id="coreC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#B45309"/></linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="0.8" fill="#D1D5DB" opacity="0.4"/></pattern>
    <pattern id="diagHatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="12" stroke="#64748B" stroke-width="0.5" opacity="0.12"/></pattern>
    <clipPath id="frameClip"><rect x="24" y="24" width="1752" height="1212" rx="12"/></clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="1800" height="1260" fill="#FBFBF9"/>
  <rect x="24" y="24" width="1752" height="1212" rx="12" fill="#FBFBF9" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="30" y="30" width="1740" height="1200" rx="9" fill="none" stroke="#1E293B" stroke-width="0.5"/>
  <!-- 角标 -->
  <rect x="24" y="24" width="60" height="4" fill="#C79838"/>
  <rect x="1716" y="24" width="60" height="4" fill="#C79838"/>
  <rect x="24" y="1232" width="60" height="4" fill="#C79838"/>
  <rect x="1716" y="1232" width="60" height="4" fill="#C79838"/>

  <!-- 标题区 -->
  <text x="900" y="90" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#0F172A" letter-spacing="8">一脊三核 · 两翼多链</text>
  <text x="900" y="130" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="18" fill="#64748B" letter-spacing="4" font-weight="300">京张智脉总体结构分析图　　京张铁路遗址公园　　竖井协同协议</text>
  <line x1="640" y1="150" x2="1160" y2="150" stroke="#C79838" stroke-width="2"/>
  <!-- 右上数据面板 -->
  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="13" fill="#475569">
    <text x="1500" y="80" font-size="11" fill="#94A3B8" letter-spacing="3">SCALE</text>
    <text x="1500" y="100">1 脊　　京张铁路遗址公园</text>
    <text x="1500" y="120">3 核　　众智园 · 原点 · 大钟寺</text>
    <text x="1500" y="140">2 翼　　科技服务 · 小月河生态</text>
    <text x="1500" y="160">N 链　　东西横向多链互联</text>
  </g>

  <!-- 点状网格底图 -->
  <rect x="180" y="180" width="1440" height="900" rx="8" fill="url(#dotGrid)" opacity="0.5"/>

  <!-- ====== 一脊：南北绿带 ====== -->
  <rect x="866" y="200" width="68" height="860" rx="34" fill="url(#spineGrad)" opacity="0.10"/>
  <rect x="882" y="200" width="36" height="860" rx="18" fill="url(#spineGrad)" opacity="0.22"/>
  <line x1="900" y1="200" x2="900" y2="1060" stroke="#047857" stroke-width="2.5" stroke-dasharray="18 12" stroke-linecap="round" opacity="0.55"/>
  <!-- 脊柱标注 -->
