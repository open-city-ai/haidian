  <!-- ====== 图例 ====== -->
  <g transform="translate(80, 1150)">
    <rect x="0" y="0" width="1640" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="24" y="16" width="24" height="24" rx="6" fill="url(#spineGrad)" opacity="0.8"/>
    <text x="58" y="35" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">公共脊柱</text>
    <circle cx="176" cy="28" r="10" fill="url(#coreA)"/>
