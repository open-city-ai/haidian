    <circle cx="900" cy="630" r="120" fill="none" stroke="#0F172A" stroke-width="2"/>
    <circle cx="900" cy="630" r="98" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="900" cy="630" r="74" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>
  <text x="900" y="614" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" letter-spacing="3">AI 原点社区</text>
  <text x="900" y="652" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="16" fill="#A7F3D0" letter-spacing="2">转化 · 孵化人才核</text>
  <g font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="11" fill="#059669">
