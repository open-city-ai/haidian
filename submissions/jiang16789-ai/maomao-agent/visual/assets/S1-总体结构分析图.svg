    <text x="562" y="1059" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">井</text>
    <rect x="1216" y="1030" width="44" height="44" rx="4" fill="#F59E0B" stroke="#92400E" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="1238" y="1059" text-anchor="middle" font-family="PingFang SC, STHeiti, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">井</text>
