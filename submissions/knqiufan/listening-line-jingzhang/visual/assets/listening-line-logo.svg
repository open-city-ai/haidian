<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">The Listening Line open repair mark</title>
  <desc id="desc">Two railway lines bend into an open ear. A deliberate break represents the right to exit, and a green point represents verified public repair.</desc>
  <rect width="960" height="320" rx="38" fill="#fffdfc"/>
  <path d="M72 105 H245 C330 105 388 126 430 168 C468 206 519 219 610 219 H678" fill="none" stroke="#bf5b35" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 160 H246 C319 160 361 171 393 202 C418 227 437 249 450 281" fill="none" stroke="#07889a" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="711" cy="219" r="18" fill="#2e8060"/>
  <path d="M745 219 H826" fill="none" stroke="#2e8060" stroke-width="28" stroke-linecap="round"/>
  <text x="72" y="58" fill="#14233e" font-size="34" font-weight="700" font-family="Microsoft YaHei, sans-serif">THE LISTENING LINE</text>
  <text x="610" y="284" fill="#63748c" font-size="20" font-family="Microsoft YaHei, sans-serif">OPEN EAR · EXIT RIGHT · VERIFIED REPAIR</text>
</svg>
