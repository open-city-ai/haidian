<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-label="Forest Rail mark">
  <title>?? / Forest Rail</title>
  <desc>Minimal mark: twin rust rails with three canopy nodes. Concept identity only, not a government seal.</desc>
  <rect width="360" height="120" fill="#F7F4EF"/>
  <!-- twin rails -->
  <g stroke="#B65A3C" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M40 48 H320"/>
    <path d="M40 68 H320"/>
  </g>
  <!-- canopy nodes: Zhongzhiyuan / Origin / Dazhongsi -->
  <g fill="#2F6B4F">
    <circle cx="90" cy="58" r="10"/>
    <circle cx="180" cy="58" r="10"/>
    <circle cx="270" cy="58" r="10"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1F2A24">
    <text x="40" y="100" font-size="18">?? Forest Rail</text>
  </g>
</svg>
