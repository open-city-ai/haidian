<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <!-- 京张智脉 Jingzhang AI Vein — 品牌 Logo（双轨中轴 + 三处 AI 朝圣节点） -->
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#c79838"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fd7c0"/>
      <stop offset="1" stop-color="#0e1420"/>
    </radialGradient>
  </defs>
  <!-- 背景 -->
  <rect width="600" height="300" rx="16" fill="#101827"/>
  <!-- 双轨中轴（京张铁路双轨 + AI 数据流） -->
  <rect x="276" y="40" width="10" height="180" rx="5" fill="url(#rail)" opacity="0.9"/>
  <rect x="314" y="40" width="10" height="180" rx="5" fill="url(#rail)" opacity="0.9"/>
  <!-- 枕木（数字脉冲） -->
  <g stroke="#4A5878" stroke-width="2" opacity="0.6">
    <line x1="276" y1="80" x2="324" y2="80"/>
    <line x1="276" y1="120" x2="324" y2="120"/>
    <line x1="276" y1="160" x2="324" y2="160"/>
    <line x1="276" y1="200" x2="324" y2="200"/>
  </g>
  <!-- 三处 AI 朝圣节点（众智园/原点社区/大钟寺） -->
  <g>
    <circle cx="300" cy="70" r="16" fill="none" stroke="#9fd7c0" stroke-width="3"/>
    <circle cx="300" cy="70" r="6" fill="#9fd7c0"/>
    <circle cx="300" cy="140" r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="300" cy="140" r="9" fill="#ffffff"/>
    <circle cx="300" cy="210" r="16" fill="none" stroke="#c79838" stroke-width="3"/>
    <circle cx="300" cy="210" r="6" fill="#c79838"/>
  </g>
  <!-- 中轴横线（镜像对称轴） -->
  <line x1="40" y1="140" x2="560" y2="140" stroke="#2a3a55" stroke-width="1" stroke-dasharray="6 6"/>
  <!-- 双翼示意（左右对称箭头） -->
  <g stroke="#9fd7c0" stroke-width="2" opacity="0.5">
    <line x1="180" y1="140" x2="120" y2="140"/>
    <polygon points="120,134 108,140 120,146" fill="#9fd7c0"/>
    <line x1="420" y1="140" x2="480" y2="140"/>
    <polygon points="480,134 492,140 480,146" fill="#9fd7c0"/>
  </g>
  <!-- 品牌文字 -->
  <text x="300" y="262" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#ffffff">京张智脉 <tspan fill="#9fd7c0">Jingzhang AI Vein</tspan></text>
  <text x="300" y="286" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8fa3bf" letter-spacing="2">CENTENNIAL JING-ZHANG AI INNOVATION BELT · 双轨中轴 · 三区两翼</text>
</svg>
