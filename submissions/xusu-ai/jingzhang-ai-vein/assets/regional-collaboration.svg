<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <!-- 区域协同图（agent.1 响应：三区两翼 × 外部协同接口） -->
  <rect width="900" height="520" rx="14" fill="#0E1420"/>
  <text x="450" y="38" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="bold" fill="#ffffff">区域协同接口 Regional Collaboration</text>
  <text x="450" y="64" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8fa3bf">京张智脉内部三区两翼 × 北五环外与京津冀协同（概念示意）</text>

  <!-- 中央方案区 -->
  <rect x="300" y="150" width="300" height="220" rx="10" fill="#101827" stroke="#2E5BFF" stroke-width="1.5"/>
  <text x="450" y="185" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#fff">京张智脉 · 三区两翼</text>
  <g font-family="'PingFang SC',sans-serif" font-size="12" fill="#b8c2d4">
    <text x="450" y="215" text-anchor="middle">北段 众智园AI加速区（192.9 ha）</text>
    <text x="450" y="240" text-anchor="middle">中段 AI原点社区（104.3 ha）</text>
    <text x="450" y="265" text-anchor="middle">南段 大钟寺AI集聚区（72.0 ha）</text>
    <text x="450" y="295" text-anchor="middle">西翼 中关村科技服务翼 · 东翼 小月河场景赋能翼</text>
    <text x="450" y="320" text-anchor="middle">中轴 京张遗址公园带（220m 绿带）</text>
    <text x="450" y="350" text-anchor="middle" font-size="11" fill="#667085">provisional 边界 · 官方 polygon 后重算</text>
  </g>

  <!-- 外部协同节点 -->
  <g font-family="'PingFang SC',sans-serif" font-size="13" fill="#e8edf5">
    <circle cx="450" cy="95" r="26" fill="#15803d"/><text x="450" y="100" text-anchor="middle" font-size="11" font-weight="bold">上地/软件园</text>
    <circle cx="130" cy="170" r="26" fill="#0f7490"/><text x="130" y="175" text-anchor="middle" font-size="11" font-weight="bold">北清路科创带</text>
    <circle cx="770" cy="170" r="26" fill="#7b5bff"/><text x="770" y="175" text-anchor="middle" font-size="11" font-weight="bold">未来科学城</text>
    <circle cx="130" cy="350" r="26" fill="#b7791f"/><text x="130" y="355" text-anchor="middle" font-size="11" font-weight="bold">学院路高校群</text>
    <circle cx="770" cy="350" r="26" fill="#b42318"/><text x="770" y="355" text-anchor="middle" font-size="11" font-weight="bold">怀柔科学城</text>
    <circle cx="450" cy="445" r="26" fill="#c79838"/><text x="450" y="450" text-anchor="middle" font-size="11" font-weight="bold">经开区/京津冀</text>
  </g>

  <!-- 协同连线（双向） -->
  <g stroke="#3a4a6a" stroke-width="1.6" opacity="0.8">
    <line x1="450" y1="121" x2="450" y2="150" stroke="#15803d"/>
    <line x1="156" y1="196" x2="296" y2="180" stroke="#0f7490"/>
    <line x1="744" y1="196" x2="604" y2="180" stroke="#7b5bff"/>
    <line x1="156" y1="324" x2="296" y2="300" stroke="#b7791f"/>
    <line x1="744" y1="324" x2="604" y2="300" stroke="#b42318"/>
    <line x1="450" y1="370" x2="450" y2="419" stroke="#c79838"/>
  </g>

  <!-- 协同机制 -->
  <g font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#b8c2d4">
    <text x="450" y="86" text-anchor="middle" font-size="10">人才/成果溢出</text>
    <text x="192" y="140" text-anchor="middle" font-size="10">科创走廊联动</text>
    <text x="708" y="140" text-anchor="middle" font-size="10">算力与研发协同</text>
    <text x="192" y="392" text-anchor="middle" font-size="10">高校源头创新</text>
    <text x="708" y="392" text-anchor="middle" font-size="10">大科学装置协同</text>
    <text x="450" y="480" text-anchor="middle" font-size="10">产业外溢与转化接口</text>
  </g>

  <text x="450" y="510" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" fill="#667085">机制为概念建议：正式协同协议/责任/成本分担需与相关主体协商 · 2026-08-08</text>
</svg>
