<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <!-- 京张智脉 AI 生态图谱（agent.3 响应：土地/空间/产业/资金/人才/算力/数据/场景 8 要素） -->
  <rect width="900" height="560" rx="14" fill="#0E1420"/>
  <text x="450" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="bold" fill="#ffffff">AI 生态要素图谱 Ecosystem Map</text>
  <text x="450" y="66" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" fill="#8fa3bf">要素 · 载体 · 机制 · 缺口（provisional 概念建议）</text>

  <!-- 8 要素节点（两圈环布） -->
  <g font-family="'PingFang SC',sans-serif" font-size="13" fill="#e8edf5">
    <!-- 中心 -->
    <circle cx="450" cy="290" r="58" fill="#2E5BFF" opacity="0.25"/>
    <circle cx="450" cy="290" r="44" fill="#2E5BFF" opacity="0.45"/>
    <text x="450" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">京张智脉</text>
    <text x="450" y="304" text-anchor="middle" font-size="11" fill="#c9d6ee">AI Innovation Belt</text>

    <!-- 要素节点（8 个，半径 200） -->
    <g>
      <circle cx="450" cy="90" r="30" fill="#4f46e5"/><text x="450" y="95" text-anchor="middle" font-size="12" font-weight="bold">土地</text>
      <circle cx="614" cy="155" r="30" fill="#15803d"/><text x="614" y="160" text-anchor="middle" font-size="12" font-weight="bold">空间</text>
      <circle cx="684" cy="290" r="30" fill="#b7791f"/><text x="684" y="295" text-anchor="middle" font-size="12" font-weight="bold">产业</text>
      <circle cx="614" cy="425" r="30" fill="#b42318"/><text x="614" y="430" text-anchor="middle" font-size="12" font-weight="bold">资金</text>
      <circle cx="450" cy="490" r="30" fill="#0f7490"/><text x="450" y="495" text-anchor="middle" font-size="12" font-weight="bold">人才</text>
      <circle cx="286" cy="425" r="30" fill="#7b5bff"/><text x="286" y="430" text-anchor="middle" font-size="12" font-weight="bold">算力</text>
      <circle cx="216" cy="290" r="30" fill="#c79838"/><text x="216" y="295" text-anchor="middle" font-size="12" font-weight="bold">数据</text>
      <circle cx="286" cy="155" r="30" fill="#e05b6d"/><text x="286" y="160" text-anchor="middle" font-size="12" font-weight="bold">场景</text>
    </g>
  </g>

  <!-- 连接线 -->
  <g stroke="#3a4a6a" stroke-width="1.2" opacity="0.7">
    <line x1="450" y1="120" x2="450" y2="246"/>
    <line x1="450" y1="334" x2="450" y2="460"/>
    <line x1="508" y1="118" x2="584" y2="140"/>
    <line x1="508" y1="462" x2="584" y2="440"/>
    <line x1="392" y1="118" x2="316" y2="140"/>
    <line x1="392" y1="462" x2="316" y2="440"/>
    <line x1="638" y1="185" x2="654" y2="262"/>
    <line x1="638" y1="395" x2="654" y2="318"/>
    <line x1="262" y1="185" x2="246" y2="262"/>
    <line x1="262" y1="395" x2="246" y2="318"/>
  </g>

  <!-- 要素说明 -->
  <g font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#b8c2d4">
    <text x="450" y="122" text-anchor="middle">土地：provisional 分区 12 地块+3 绿带</text>
    <text x="614" y="192" text-anchor="middle">空间：中轴绿带+双翼街区+慢行网络</text>
    <text x="684" y="325" text-anchor="middle">产业：AI 研发/商业/文化/居住 4 类 15 分区</text>
    <text x="614" y="457" text-anchor="middle">资金：财政引导+产业基金+运营收入（建议）</text>
    <text x="450" y="522" text-anchor="middle">人才：工程师/高校师生/创业者/居民/国际访客</text>
    <text x="286" y="457" text-anchor="middle">算力：低碳算力驿站+边缘算力舱</text>
    <text x="216" y="325" text-anchor="middle">数据：公开数据+授权数据+脱敏聚合</text>
    <text x="286" y="192" text-anchor="middle">场景：10 张 AI 场景卡+3 产业测试验证</text>
  </g>

  <text x="450" y="552" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" fill="#667085">缺口：官方控规/权属/现状数据未提供 · 场景运营主体与转化 KPI 待专业细化 · 2026-08-08</text>
</svg>
