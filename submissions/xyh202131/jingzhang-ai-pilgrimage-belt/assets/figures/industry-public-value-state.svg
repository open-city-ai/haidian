<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">产业—公共价值状态图：问题驱动的产业与人才转化</title>
  <desc id="desc">公共任务生命周期从问题发布经质量门、公平准入、离线原型、独立复测到结果回流与退出退役；四轴分离区分运行、成熟度、授权与服务状态；授权阶梯区分原型采购、有限试用、采购与常态部署，各自需要独立书面授权；公共收益回流不依赖投资额。全部内容为 G0 概念，不代表现状、批准、采购、伙伴或运营结论。</desc>
  <rect width="1800" height="1100" fill="#f5f3e9"/>
  <style>
    text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#162c2b}
    .h1{font-size:44px;font-weight:700}.h2{font-size:27px;font-weight:700}.h3{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.white{fill:#fff}.muted{fill:#556866}
    .line{stroke:#173d39;stroke-width:6;fill:none}.thin{stroke:#52736c;stroke-width:2;fill:none}.dash{stroke:#286f86;stroke-width:5;stroke-dasharray:14 12;fill:none}
  </style>
  <text x="70" y="72" class="h1">产业—公共价值状态图</text>
  <text x="70" y="108" class="h2">问题驱动的产业与人才转化：验证通过 ≠ 采购或部署授权，不是企业展示带</text>
  <rect x="1250" y="44" width="480" height="78" rx="16" fill="#173d39"/>
  <text x="1275" y="76" class="h3 white">G0 · 概念机制 · 临时边界</text>
  <text x="1275" y="103" class="body white">任务 0 · 小团队 0 · 复测 0 · 书面确认 0</text>

  <!-- A 公共任务生命周期 -->
  <rect x="60" y="150" width="1680" height="250" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="192" class="h2">A  公共任务生命周期｜问题质量门先行，任何一步失败均 fail-closed</text>
  <g>
    <rect x="90" y="220" width="205" height="130" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="110" y="252" class="h3">① 问题发布</text>
    <text x="110" y="278" class="small muted">真实公共问题</text>
    <text x="110" y="300" class="small muted">非数字渠道可获知</text>
    <text x="110" y="325" class="small" fill="#8a7338">角色待确认</text>
    <path d="M300 285 H320" class="thin"/>
    <rect x="325" y="220" width="205" height="130" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="345" y="252" class="h3">② 问题质量门</text>
    <text x="345" y="278" class="small muted">问题·人群·触点·反证</text>
    <text x="345" y="300" class="small muted">通过≠授权</text>
    <text x="345" y="325" class="small" fill="#8a7338">未过门不入队</text>
    <path d="M535 285 H555" class="thin"/>
    <rect x="560" y="220" width="205" height="130" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="580" y="252" class="h3">③ 公平准入</text>
    <text x="580" y="278" class="small muted">无账号门槛</text>
    <text x="580" y="300" class="small muted">小团队同池竞争</text>
    <text x="580" y="325" class="small" fill="#577c55">人工/非 AI 双路径</text>
    <path d="M770 285 H790" class="thin"/>
    <rect x="795" y="220" width="205" height="130" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="815" y="252" class="h3">④ 离线原型</text>
    <text x="815" y="278" class="small muted">原型≠采购</text>
    <text x="815" y="300" class="small muted">IP 边界未解决</text>
    <text x="815" y="325" class="small" fill="#577c55">G0 概念验证</text>
    <path d="M1005 285 H1025" class="thin"/>
    <rect x="1030" y="220" width="205" height="130" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1050" y="252" class="h3">⑤ 独立复测门</text>
    <text x="1050" y="278" class="small muted">独立于执行方</text>
    <text x="1050" y="300" class="small muted">复测 0 次</text>
    <text x="1050" y="325" class="small" fill="#286f86">角色待确认</text>
    <path d="M1240 285 H1260" class="thin"/>
    <rect x="1265" y="220" width="205" height="130" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1285" y="252" class="h3">⑥ 结果回流</text>
    <text x="1285" y="278" class="small muted">回到沿线普通使用者</text>
    <text x="1285" y="300" class="small muted">不依赖投资额</text>
    <text x="1285" y="325" class="small" fill="#577c55">反馈≠承诺</text>
    <path d="M1475 285 H1495" class="thin"/>
    <rect x="1500" y="220" width="210" height="130" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1520" y="252" class="h3">⑦ 退出/退役</text>
    <text x="1520" y="278" class="small muted">安全·隐私·权利任一失败</text>
    <text x="1520" y="300" class="small muted">退出记录不进人才排名</text>
    <text x="1520" y="325" class="small" fill="#b75233">普通路径不间断</text>
  </g>

  <!-- B 四轴分离 -->
  <rect x="60" y="420" width="1680" height="220" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="462" class="h2">B  四轴分离｜一个状态字段不得同时表示测试、授权、采购与部署</text>
  <g>
    <rect x="90" y="485" width="385" height="120" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="110" y="517" class="h3">运行状态 runtime</text>
    <text x="110" y="543" class="small muted">普通 · 验证 · 故障 · 恢复</text>
    <text x="110" y="568" class="small" fill="#8a7338">普通状态与人工服务始终连续</text>
    <rect x="500" y="485" width="385" height="120" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="520" y="517" class="h3">成熟度 G0–G3</text>
    <text x="520" y="543" class="small muted">概念—建议—试点—运行</text>
    <text x="520" y="568" class="small" fill="#577c55">全部保持 G0，不因图面升级</text>
    <rect x="910" y="485" width="385" height="120" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="930" y="517" class="h3">授权范围 authorization</text>
    <text x="930" y="543" class="small muted">原型·试用·采购·部署分列</text>
    <text x="930" y="568" class="small" fill="#286f86">每级独立书面授权+有效期</text>
    <rect x="1320" y="485" width="390" height="120" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1340" y="517" class="h3">服务状态 service</text>
    <text x="1340" y="543" class="small muted">公众当前可获得的服务</text>
    <text x="1340" y="568" class="small" fill="#577c55">当前 0 项，外部机构 0 书面确认</text>
  </g>

  <!-- C 授权阶梯 -->
  <rect x="60" y="660" width="1680" height="190" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="702" class="h2">C  授权阶梯｜原型采购 → 有限试用 → 采购 → 常态部署，逐级独立授权</text>
  <g>
    <rect x="90" y="725" width="370" height="95" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="110" y="757" class="h3">原型采购</text>
    <text x="110" y="783" class="small muted">验证方法可行 · 不授权部署</text>
    <text x="110" y="803" class="small" fill="#577c55">IP 归属另行书面约定</text>
    <path d="M470 772 H510" class="thin"/>
    <rect x="520" y="725" width="370" height="95" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="540" y="757" class="h3">有限试用</text>
    <text x="540" y="783" class="small muted">范围·责任·有效期书面化</text>
    <text x="540" y="803" class="small" fill="#286f86">不可推出常态运营</text>
    <path d="M900 772 H940" class="thin"/>
    <rect x="950" y="725" width="370" height="95" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="970" y="757" class="h3">采购</text>
    <text x="970" y="783" class="small muted">独立复测门通过后讨论</text>
    <text x="970" y="803" class="small" fill="#8a7338">≠ 部署 · 未发生</text>
    <path d="M1330 772 H1370" class="thin"/>
    <rect x="1380" y="725" width="330" height="95" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1400" y="757" class="h3">常态部署</text>
    <text x="1400" y="783" class="small muted">需完整授权+责任主体</text>
    <text x="1400" y="803" class="small" fill="#b75233">当前不主张</text>
  </g>

  <!-- D 公共收益回流 -->
  <rect x="60" y="870" width="1680" height="190" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="912" class="h2">D  公共收益回流｜不依赖投资额，回到沿线普通使用者</text>
  <g>
    <rect x="90" y="935" width="470" height="95" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="110" y="967" class="h3">任务结果 + 失败归档</text>
    <text x="110" y="993" class="small muted">失败公开不用于招聘/排名</text>
    <text x="110" y="1013" class="small" fill="#577c55">以可理解形式发布</text>
    <path d="M570 982 H610" class="thin"/>
    <rect x="620" y="935" width="470" height="95" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="640" y="967" class="h3">独立复测结论</text>
    <text x="640" y="993" class="small muted">决定继续·修正·停止·退役</text>
    <text x="640" y="1013" class="small" fill="#577c55">指标少而能决定</text>
    <path d="M1100 982 H1140" class="thin"/>
    <rect x="1150" y="935" width="560" height="95" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="1170" y="967" class="h3">沿线普通使用者</text>
    <text x="1170" y="993" class="small muted">无屏/非 AI/人工路径完整</text>
    <text x="1170" y="1013" class="small" fill="#8a7338">反馈只作下一轮问题输入</text>
  </g>

  <text x="70" y="1085" class="small muted">图例：▲公开史实 ◆公开报道 ●包内来源 ◎机制合同（非已发生）｜非 AI 与人工路径全程连续｜停止后恢复普通状态再讨论修订｜来源与假设见 proposal 与 sources.json</text>
</svg>
