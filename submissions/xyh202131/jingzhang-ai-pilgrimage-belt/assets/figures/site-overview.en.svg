<title id="title">One civic-ground spine links three non-interchangeable spatial prototypes</title><desc id="desc">A conceptual urban-design structure plan with one continuous civic-ground spine, six cross-links, three distinct spatial prototypes, blue-green support, maintenance clearance and bounded proof siding.</desc>
