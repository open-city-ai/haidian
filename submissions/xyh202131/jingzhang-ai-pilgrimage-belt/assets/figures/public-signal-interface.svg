<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">公共信号界面与可读时刻表</title>
  <desc id="desc">六类城市信号、普通验证故障恢复四态和三处差异化载体的 G0 关系图。现实窗口、人工在线、恢复时长保持未知，批准和现实运行计数为零。</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei","Segoe UI",Arial,sans-serif;fill:#172532}
      .title{font-size:46px;font-weight:800;fill:#fff}.subtitle{font-size:20px;font-weight:600;fill:#d8e4e7}
      .kicker{font-size:14px;font-weight:800;letter-spacing:2px;fill:#b97800}.h2{font-size:24px;font-weight:800;fill:#112b38}
      .h3{font-size:17px;font-weight:800;fill:#112b38}.body{font-size:14px;font-weight:500;fill:#425863}
      .small{font-size:12px;font-weight:600;fill:#536a75}.tiny{font-size:10px;font-weight:700;fill:#536a75;letter-spacing:.4px}
      .code{font-size:12px;font-weight:900;fill:#b97800;letter-spacing:1px}.white{fill:#fff}.muted-white{fill:#d8e4e7}
      .panel{fill:#fff;stroke:#c3cdcb;stroke-width:2}.rule{stroke:#c3cdcb;stroke-width:2}.navy{fill:#112b38}.gold{fill:#b97800}
    </style>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#b97800" opacity=".55"/></pattern>
  </defs>
  <rect width="1800" height="1100" fill="#f4f1e8"/>
  <rect width="1800" height="132" class="navy"/>
  <rect x="0" y="0" width="15" height="132" class="gold"/>
  <text x="48" y="48" class="kicker" fill="#e7bd68">TWIN-TRACK JING-ZHANG · ROUND 18 · PUBLIC READING LAYER</text>
  <text x="48" y="96" class="title">公共信号界面与可读时刻表</text>
  <text x="1275" y="48" class="subtitle">G0 概念读取器 · 非实时系统</text>
  <text x="1275" y="82" class="subtitle">临时几何 · 不按比例 · 不构成批准</text>
  <text x="1275" y="113" class="small muted-white">NO ACCOUNT · NO QR · NO AI REQUIRED</text>

