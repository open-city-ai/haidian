<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Antifragile Failure Governance: Three-Carrier Writeback and Recovery Storyboard</title>
  <desc id="desc">Six failure classes, a seven-step stop and recovery storyboard, four separate state axes, atomic writeback to scene passport, civic timetable and evidence matrix, appeals, and active retirement.</desc>
  <defs>
    <style>
      text{font-family:Arial,"Segoe UI","Noto Sans",sans-serif;fill:#12202f}.h1{font-size:39px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:13px}.tiny{font-size:12px}.white{fill:#fff}.muted{fill:#5b6975}.mono{font-family:Consolas,monospace}.line{stroke:#90a0aa;stroke-width:3;fill:none}.dash{stroke-dasharray:10 8}.arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657483"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#f3f4ef"/><rect width="1800" height="102" fill="#12202f"/>
  <text x="56" y="58" class="h1 white">ANTIFRAGILE FAILURE GOVERNANCE | THREE-CARRIER WRITEBACK</text>
  <text x="56" y="87" class="small white">Existing JZ-AIOS contract · G0 concept only · NOT TO SCALE · not a real incident, field recovery, or deployment licence</text>

  <text x="56" y="145" class="h2">01 | Classify failure before choosing stop intensity</text>
  <g>
    <rect x="56" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d96850" stroke-width="3"/><text x="76" y="204" class="h2">Safety + access</text><text x="76" y="236" class="body">collision · blocked daily route</text>
    <rect x="328" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d96850" stroke-width="3"/><text x="348" y="204" class="h2">Rights + consent</text><text x="348" y="236" class="body">prohibited data · no withdrawal</text>
    <rect x="600" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d49a36" stroke-width="3"/><text x="620" y="204" class="h2">Source + version</text><text x="620" y="236" class="body">stale · conflict · overwritten</text>
    <rect x="872" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d49a36" stroke-width="3"/><text x="892" y="204" class="h2">Service + handoff</text><text x="892" y="236" class="body">no human · daily task displaced</text>
    <rect x="1144" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#246b83" stroke-width="3"/><text x="1164" y="204" class="h2">Evidence + decision</text><text x="1164" y="236" class="body">bad denominator · ignored appeal</text>
    <rect x="1416" y="170" width="328" height="92" rx="16" fill="#fff" stroke="#246b83" stroke-width="3"/><text x="1436" y="204" class="h2">Place restoration + exit</text><text x="1436" y="236" class="body">not removable · no destination</text>
  </g>

  <text x="56" y="314" class="h2">02 | Failure—stop—recover—retest storyboard (synthetic T-02 stale-source example)</text>
  <g>
    <path d="M165 390 H1610" class="line arrow"/>
    <g transform="translate(56,338)"><circle cx="80" cy="52" r="38" fill="#246b83"/><text x="69" y="61" class="h2 white">1</text><text x="25" y="112" class="body">Detect limit</text><text x="7" y="137" class="small muted">no substantive answer</text></g>
    <g transform="translate(284,338)"><circle cx="80" cy="52" r="38" fill="#d96850"/><text x="69" y="61" class="h2 white">2</text><text x="36" y="112" class="body">Stop now</text><text x="0" y="137" class="small muted">keep ordinary / non-AI path</text></g>
    <g transform="translate(512,338)"><circle cx="80" cy="52" r="38" fill="#d49a36"/><text x="69" y="61" class="h2 white">3</text><text x="22" y="112" class="body">Staffed handoff</text><text x="1" y="137" class="small muted">role unconfirmed, no institution</text></g>
    <g transform="translate(740,338)"><circle cx="80" cy="52" r="38" fill="#12202f"/><text x="69" y="61" class="h2 white">4</text><text x="5" y="112" class="body">Write 3 carriers</text><text x="8" y="137" class="small muted">missing one = fail closed</text></g>
    <g transform="translate(968,338)"><circle cx="80" cy="52" r="38" fill="#36a269"/><text x="69" y="61" class="h2 white">5</text><text x="15" y="112" class="body">Append correction</text><text x="3" y="137" class="small muted">retain old evidence/version</text></g>
    <g transform="translate(1196,338)"><circle cx="80" cy="52" r="38" fill="#246b83"/><text x="69" y="61" class="h2 white">6</text><text x="8" y="112" class="body">Independent retest</text><text x="12" y="137" class="small muted">real count remains 0</text></g>
    <g transform="translate(1424,338)"><circle cx="80" cy="52" r="38" fill="#12202f"/><text x="69" y="61" class="h2 white">7</text><text x="10" y="112" class="body">Restore or retire</text><text x="-2" y="137" class="small muted">no automatic G0/authority gain</text></g>
  </g>

  <text x="56" y="530" class="h2">03 | One state event, three atomic writebacks</text>
  <g>
    <rect x="56" y="554" width="510" height="230" rx="20" fill="#fff" stroke="#246b83" stroke-width="4"/>
    <text x="82" y="592" class="h2">Scene passport | back-stage fact</text><text x="82" y="626" class="body">four axes · failure class · stop-authority role</text><text x="82" y="657" class="body">before/after version · evidence/appeal · expiry</text><text x="82" y="703" class="small mono">pilot-readiness-register.json#records</text><text x="82" y="744" class="small muted">Recovery never changes maturity or authority by itself.</text>
    <rect x="645" y="554" width="510" height="230" rx="20" fill="#fff" stroke="#36a269" stroke-width="4"/>
    <text x="671" y="592" class="h2">Civic timetable | what works now</text><text x="671" y="626" class="body">public runtime · ordinary/non-AI path</text><text x="671" y="657" class="body">staffed contact · next update · source/exit</text><text x="671" y="703" class="small mono">twin_track_frontend_contract.civic_timetable</text><text x="671" y="744" class="small muted">No account, QR, or AI; show the conservative state.</text>
    <rect x="1234" y="554" width="510" height="230" rx="20" fill="#fff" stroke="#d49a36" stroke-width="4"/>
    <text x="1260" y="592" class="h2">Evidence matrix | how claim changes</text><text x="1260" y="626" class="body">hold/narrow/correct · anchor + version</text><text x="1260" y="657" class="body">scope/limits · retest · go/no-go</text><text x="1260" y="703" class="small mono">antifragile_failure_governance_contract</text><text x="1260" y="744" class="small muted">Retain old evidence; every pass says what it cannot authorize.</text>
    <path d="M566 670 H642" class="line dash arrow"/><path d="M1155 670 H1231" class="line dash arrow"/>
  </g>

  <text x="56" y="835" class="h2">04 | Four separate axes + appeals + active retirement</text>
  <g>
    <rect x="56" y="858" width="274" height="112" rx="14" fill="#e8f0f3"/><text x="76" y="892" class="h2">Runtime</text><text x="76" y="924" class="body">ordinary / proof / fault / recovery</text><text x="76" y="952" class="small muted">place and service now</text>
    <rect x="346" y="858" width="274" height="112" rx="14" fill="#e9f4ed"/><text x="366" y="892" class="h2">Maturity</text><text x="366" y="924" class="body">G0 / G1 / G2 / G3</text><text x="366" y="952" class="small muted">all scenes remain G0</text>
    <rect x="636" y="858" width="274" height="112" rx="14" fill="#fbf0dc"/><text x="656" y="892" class="h2">Authorization</text><text x="656" y="924" class="body">none / limited / withdrawn / retired</text><text x="656" y="952" class="small muted">no real service authorization</text>
    <rect x="926" y="858" width="274" height="112" rx="14" fill="#f8e8e3"/><text x="946" y="892" class="h2">Service</text><text x="946" y="924" class="body">ordinary / optional AI / takeover</text><text x="946" y="952" class="small muted">concept rule, not operation</text>
    <rect x="1220" y="858" width="524" height="112" rx="14" fill="#fff" stroke="#12202f" stroke-width="3"/><text x="1242" y="890" class="h2">Appeals change decisions; retirement leaves receipts</text><text x="1242" y="921" class="small">oral/paper/staffed → hold · narrow · correct · retest · withdraw · retire</text><text x="1242" y="950" class="small muted">No identity or shame ranking; every component/data/service/place has a destination.</text>
  </g>

  <rect x="56" y="1002" width="1688" height="66" rx="14" fill="#12202f"/>
  <text x="80" y="1032" class="body white">PERMANENT AUTHORIZATION BOUNDARY | A file check, synthetic replay, machine PASS, retest, or restoration acceptance applies only to its named object and scope.</text>
  <text x="80" y="1058" class="body white">It authorizes no trial, procurement, construction, deployment, maturity gain, site/professional approval, rights clearance, or real-world outcome claim.</text>
</svg>
