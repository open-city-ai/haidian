<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">百年时间博物馆：可核验、可纠错、无屏可达的时间教育线</title>
  <desc id="desc">双轨对照图谱把京张铁路勘测、通车、高铁、遗址公园与 AI 训练、验证、失败、纠错、退役并置；来源等级表给出七级类型化证据锚点；争议纠错流程为停止、下架、纠错、版本保留、恢复五步。全部内容为 G0 概念，不代表现状、批准、馆藏档案或工程结论。</desc>
  <rect width="1800" height="1100" fill="#f5f3e9"/>
  <style>
    text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#162c2b}
    .h1{font-size:44px;font-weight:700}.h2{font-size:27px;font-weight:700}.h3{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.white{fill:#fff}.muted{fill:#556866}
    .line{stroke:#173d39;stroke-width:6;fill:none}.thin{stroke:#52736c;stroke-width:2;fill:none}.dash{stroke:#286f86;stroke-width:5;stroke-dasharray:14 12;fill:none}
  </style>
  <text x="70" y="72" class="h1">百年时间博物馆</text>
  <text x="70" y="108" class="h2">可核验 · 可纠错 · 无屏可达的城市时间教育线，不是技术崇拜展览</text>
  <rect x="1300" y="44" width="430" height="78" rx="16" fill="#173d39"/>
  <text x="1325" y="76" class="h3 white">G0 · 概念关系 · 临时边界</text>
  <text x="1325" y="103" class="body white">馆藏 0 · 口述史 0 · 实测 0 · 责任确认 0</text>

  <!-- A 双轨对照图谱 -->
  <rect x="60" y="150" width="1680" height="560" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="192" class="h2">A  双轨对照图谱｜铁路年代 × AI 门级（教学对照，不是等价声明）</text>

  <!-- 铁路轨 -->
  <path d="M120 300 H1660" class="line"/>
  <text x="120" y="262" class="h3">铁路年代轨｜史实刻度，逐条带来源等级</text>
  <g>
    <rect x="140" y="315" width="250" height="86" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="160" y="344" class="h3">1905–1909 勘测建设</text>
    <text x="160" y="370" class="small muted">詹天佑主持 · 关沟段展线</text>
    <text x="160" y="390" class="small" fill="#8a7338">▲ 公开史实 · 档案待复核</text>
    <rect x="430" y="315" width="250" height="86" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="450" y="344" class="h3">1909 全线通车</text>
    <text x="450" y="370" class="small muted">公开史实，精确日期待馆藏核验</text>
    <text x="450" y="390" class="small" fill="#8a7338">▲ 公开史实 · 档案待复核</text>
    <rect x="720" y="315" width="250" height="86" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="740" y="344" class="h3">2019 京张高铁</text>
    <text x="740" y="370" class="small muted">公开报道 · 非包内来源</text>
    <text x="740" y="390" class="small" fill="#286f86">◆ 公开报道 · 待档案复核</text>
    <rect x="1010" y="315" width="300" height="86" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="1030" y="344" class="h3">2023+ 遗址公园分期开放</text>
    <text x="1030" y="370" class="small muted">包内来源 JZ-PARK-2023</text>
    <text x="1030" y="390" class="small" fill="#577c55">● 包内登记来源</text>
    <rect x="1350" y="315" width="290" height="86" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1370" y="344" class="h3">未来：年度证据更新</text>
    <text x="1370" y="370" class="small muted">来源升级或退役清单</text>
    <text x="1370" y="390" class="small" fill="#577c55">◎ 机制合同 · 非已发生</text>
  </g>

  <!-- AI 轨 -->
  <path d="M120 545 H1660" class="line"/>
  <text x="120" y="507" class="h3">AI 生命周期轨｜训练—验证—失败—纠错—退役，对照 JZ-AIOS 门级</text>
  <g>
    <rect x="140" y="560" width="250" height="86" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="160" y="589" class="h3">训练 · 证据门先行</text>
    <text x="160" y="615" class="small muted">来源等级与允许用途先确认</text>
    <text x="160" y="635" class="small" fill="#577c55">对照：勘测与标准先行</text>
    <rect x="430" y="560" width="250" height="86" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="450" y="589" class="h3">验证 · G0–G3 门级</text>
    <text x="450" y="615" class="small muted">概念—建议—试点—运行逐级</text>
    <text x="450" y="635" class="small" fill="#577c55">对照：信号系统分灯位</text>
    <rect x="720" y="560" width="250" height="86" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="740" y="589" class="h3">失败 · 侧线 fail-closed</text>
    <text x="740" y="615" class="small muted">可停止、可公开、可恢复</text>
    <text x="740" y="635" class="small" fill="#b75233">对照：信号故障即停车</text>
    <rect x="1010" y="560" width="300" height="86" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1030" y="589" class="h3">纠错 · 人工交接</text>
    <text x="1030" y="615" class="small muted">争议可下架、版本可保留</text>
    <text x="1030" y="635" class="small" fill="#b75233">对照：维护检修记录</text>
    <rect x="1350" y="560" width="290" height="86" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1370" y="589" class="h3">退役 · 年度更新</text>
    <text x="1370" y="615" class="small muted">退出清单，不自动删除档案</text>
    <text x="1370" y="635" class="small" fill="#577c55">对照：设备退役与还场回执</text>
  </g>

  <text x="120" y="468" class="small" fill="#556866">教学对照只说明“都以可核验输入、门级停止、持续记录为纪律”，不断言风险或监管口径相当；详见包内 G0 合同。</text>

  <!-- B 来源等级表 -->
  <rect x="60" y="730" width="830" height="310" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="772" class="h2">B  史实来源等级表｜类型化证据锚点</text>
  <g>
    <rect x="90" y="796" width="26" height="24" rx="6" fill="#c9a227"/><text x="128" y="815" class="body">official_archive 官方档案/馆藏原件（包内 0）</text>
    <rect x="90" y="830" width="26" height="24" rx="6" fill="#577c55"/><text x="128" y="849" class="body">in_package_source 包内登记来源（如 JZ-PARK-2023）</text>
    <rect x="90" y="864" width="26" height="24" rx="6" fill="#4a87a0"/><text x="128" y="883" class="body">public_reporting 公开报道（非馆藏，标注待复核）</text>
    <rect x="90" y="898" width="26" height="24" rx="6" fill="#b9c7ba"/><text x="128" y="917" class="body">public_reporting_pending_archive 公开史实·档案待复核</text>
    <rect x="90" y="932" width="26" height="24" rx="6" fill="#9aa8a3"/><text x="128" y="951" class="body">osm_background OSM 背景（仅空间示意，保持 ODbL 义务）</text>
    <rect x="90" y="966" width="26" height="24" rx="6" fill="#8a5fbf"/><text x="128" y="985" class="body">generated_content 生成内容（必须可见标识，可随时下架）</text>
    <rect x="90" y="1000" width="26" height="24" rx="6" fill="#b7791f"/><text x="128" y="1019" class="body">oral_history_pending 口述史（未来采集·待同意，当前 0 条）</text>
  </g>

  <!-- C 纠错流程 + 无屏节点 -->
  <rect x="910" y="730" width="860" height="320" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="940" y="772" class="h2">C  争议纠错流程｜五步 + 无屏节点链</text>
  <g>
    <rect x="940" y="800" width="130" height="72" rx="14" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="965" y="830" class="h3">停止</text><text x="965" y="856" class="small muted">立即停止展示</text>
    <path d="M1080 836 H1110" class="thin"/>
    <rect x="1120" y="800" width="130" height="72" rx="14" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1145" y="830" class="h3">下架</text><text x="1145" y="856" class="small muted">保留版本记录</text>
    <path d="M1260 836 H1290" class="thin"/>
    <rect x="1300" y="800" width="145" height="72" rx="14" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="1340" y="830" class="h3">纠错</text><text x="1340" y="856" class="small muted">更高等级证据替换</text>
    <path d="M1440 836 H1470" class="thin"/>
    <rect x="1480" y="800" width="145" height="72" rx="14" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1520" y="830" class="h3">版本保留</text><text x="1520" y="856" class="small muted">只读存证</text>
    <path d="M1620 836 H1650" class="thin"/>
    <rect x="940" y="890" width="685" height="60" rx="14" fill="#d9e8e3" stroke="#4d736d" stroke-width="2"/>
    <text x="965" y="918" class="h3">恢复</text>
    <text x="1030" y="918" class="body">独立复核 + 公众说明后恢复；否则保持下架或主动退役（角色待确认）</text>
    <text x="965" y="940" class="small muted">停止/下架不阻断普通路径与人工服务</text>
  </g>
  <!-- 无屏节点链 -->
  <g>
    <text x="940" y="1000" class="body">★ 无屏节点链（无需账号/扫码/AI）：</text>
    <rect x="1220" y="983" width="110" height="28" rx="8" fill="#173d39"/><text x="1238" y="1002" class="small white">起点站牌</text>
    <text x="1340" y="1002" class="body">→</text>
    <rect x="1365" y="983" width="110" height="28" rx="8" fill="#173d39"/><text x="1383" y="1002" class="small white">对照图谱牌</text>
    <text x="1485" y="1002" class="body">→</text>
    <rect x="1510" y="983" width="110" height="28" rx="8" fill="#173d39"/><text x="1528" y="1002" class="small white">证据更新墙</text>
  </g>

  <!-- 底部状态条 -->
  <rect x="60" y="1058" width="1680" height="38" rx="12" fill="#e7efe9" stroke="#4d736d" stroke-width="2"/>
  <text x="90" y="1083" class="small">四态：普通—验证—故障—恢复 ｜ provisional · conceptual · not-as-built ｜ 来源：包内登记、待档案复核史实与临时几何 ｜ 全部场景 G0，无批准/实测/运行结论</text>
</svg>
