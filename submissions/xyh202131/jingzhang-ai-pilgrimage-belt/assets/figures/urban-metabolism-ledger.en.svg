<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Jing-Zhang AI Urban Metabolism Ledger</title>
  <desc id="desc">Twelve existing G0 scenes, seven whole-system resources, three differentiated burden profiles, component exit destinations, and a public NO-GO gate. No real resource result is measured.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6f2"/><stop offset="1" stop-color="#e8eef2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10243a" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#315d72"/></marker>
    <style>
      text{font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#14263b}.b{font-weight:700}.muted{fill:#5f6f7e}.white{fill:#fff}.light{fill:#d7e6ed}.warm{fill:#f5cfae}.mono{font-family:Consolas,monospace}.card{fill:#fff;stroke:#c7d2d8;stroke-width:2}.tiny{font-size:16px}.small{font-size:19px}.body{font-size:22px}.head{font-size:28px}.title{font-size:44px;font-weight:700;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <rect width="1800" height="148" fill="#142b44"/>
  <text x="58" y="66" class="title white">JING-ZHANG AI URBAN METABOLISM LEDGER</text>
  <text x="60" y="108" class="body light">12 scenes × 7 resources × whole-system boundary × accountable exit | ROUND 5</text>
  <g transform="translate(1260 34)"><rect width="482" height="78" rx="18" fill="#203e58" stroke="#7da0ad"/><text x="24" y="32" class="small b white">G0 · CONCEPT CONTRACT · NO-GO</text><text x="24" y="61" class="tiny light">measured 0 | vendors 0 | approvals 0 | operations 0</text></g>

  <g transform="translate(42 174)" filter="url(#shadow)">
    <rect width="300" height="672" rx="22" class="card"/>
    <text x="24" y="44" class="head b">SEVEN RESOURCES</text><text x="24" y="74" class="tiny muted">Never count the server alone</text>
    <g transform="translate(20 100)">
      <g><rect width="260" height="62" rx="13" fill="#dcecf0"/><circle cx="28" cy="31" r="12" fill="#176b77"/><text x="52" y="28" class="small b">Compute</text><text x="52" y="50" class="tiny muted">cloud / edge / network / device</text></g>
      <g transform="translate(0 72)"><rect width="260" height="62" rx="13" fill="#e3eedc"/><circle cx="28" cy="31" r="12" fill="#4e7c43"/><text x="52" y="28" class="small b">Energy</text><text x="52" y="50" class="tiny muted">run / idle / staffed baseline</text></g>
      <g transform="translate(0 144)"><rect width="260" height="62" rx="13" fill="#f1e9d7"/><circle cx="28" cy="31" r="12" fill="#9a6b20"/><text x="52" y="28" class="small b">Equipment + material</text><text x="52" y="50" class="tiny muted">repair / life / parts / destination</text></g>
      <g transform="translate(0 216)"><rect width="260" height="62" rx="13" fill="#e4e6f1"/><circle cx="28" cy="31" r="12" fill="#5e5d94"/><text x="52" y="28" class="small b">Data</text><text x="52" y="50" class="tiny muted">minimum / retain / export / delete</text></g>
      <g transform="translate(0 288)"><rect width="260" height="62" rx="13" fill="#f3dfdf"/><circle cx="28" cy="31" r="12" fill="#a54f54"/><text x="52" y="28" class="small b">Human review</text><text x="52" y="50" class="tiny muted">handoff / safeguard / recover</text></g>
      <g transform="translate(0 360)"><rect width="260" height="62" rx="13" fill="#e2e9ee"/><circle cx="28" cy="31" r="12" fill="#42657d"/><text x="52" y="28" class="small b">Vendor dependency</text><text x="52" y="50" class="tiny muted">interop / export / repair / exit</text></g>
      <g transform="translate(0 432)"><rect width="260" height="62" rx="13" fill="#f0ddd4"/><circle cx="28" cy="31" r="12" fill="#a7502c"/><text x="52" y="28" class="small b">Failure + exit cost</text><text x="52" y="50" class="tiny muted">stop / clear / restore baseline</text></g>
    </g>
    <rect x="20" y="612" width="260" height="40" rx="10" fill="#142b44"/><text x="150" y="638" text-anchor="middle" class="tiny b white">NO denominator → NO comparison</text>
  </g>

  <path d="M350 506H392" stroke="#315d72" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(390 174)">
    <text x="0" y="38" class="head b">TWELVE PASSPORTS IN THREE PROTOTYPES</text>
    <text x="0" y="70" class="tiny muted">Field coverage 12/12; measured resource results are all unknown or pending</text>
    <g transform="translate(0 96)" filter="url(#shadow)">
      <rect width="344" height="572" rx="22" fill="#f9fcfc" stroke="#77a5ad" stroke-width="3"/><rect width="344" height="92" rx="22" fill="#176b77"/><rect y="70" width="344" height="22" fill="#176b77"/>
      <text x="24" y="39" class="head b white">ZHONGZHIYUAN</text><text x="24" y="70" class="tiny" fill="#dff1f2">VERIFY · isolate equipment · takeover</text>
      <g transform="translate(20 116)">
        <rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-001</text><text x="16" y="47" class="tiny">delivery | vehicle, battery, observer</text>
        <g transform="translate(0 68)"><rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-002</text><text x="16" y="47" class="tiny">energy aid | whole-system comparison</text></g>
        <g transform="translate(0 136)"><rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-003</text><text x="16" y="47" class="tiny">safety | high-consequence review</text></g>
        <g transform="translate(0 204)"><rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-004</text><text x="16" y="47" class="tiny">failure archive | storage + correction</text></g>
      </g>
      <line x1="24" y1="406" x2="320" y2="406" stroke="#a6bec4"/><text x="24" y="442" class="small b">EXIT FOCUS</text><text x="24" y="472" class="tiny">isolate → repair/return/recycle</text><text x="24" y="498" class="tiny">→ minimum log → bypass → retest</text>
      <rect x="20" y="518" width="304" height="34" rx="10" fill="#dcecef"/><text x="172" y="541" text-anchor="middle" class="tiny b">measured 0 · vendors 0 · NO-GO</text>
    </g>
    <g transform="translate(366 96)" filter="url(#shadow)">
      <rect width="344" height="572" rx="22" fill="#fcfcf8" stroke="#9bad71" stroke-width="3"/><rect width="344" height="92" rx="22" fill="#5f7f43"/><rect y="70" width="344" height="22" fill="#5f7f43"/>
      <text x="24" y="39" class="head b white">ORIGIN COMMUNITY</text><text x="24" y="70" class="tiny" fill="#eaf3df">CO-CREATE · withdrawal · daily life</text>
      <g transform="translate(20 116)">
        <rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-005</text><text x="16" y="47" class="tiny">guide | source, media, curation</text>
        <g transform="translate(0 68)"><rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-006</text><text x="16" y="47" class="tiny">matching | profile withdrawal/delete</text></g>
        <g transform="translate(0 136)"><rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-007</text><text x="16" y="47" class="tiny">workshop | shared kit + safeguard</text></g>
        <g transform="translate(0 204)"><rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-008</text><text x="16" y="47" class="tiny">climate/access | co-test + calibrate</text></g>
      </g>
      <line x1="24" y1="406" x2="320" y2="406" stroke="#bdc9a3"/><text x="24" y="442" class="small b">EXIT FOCUS</text><text x="24" y="472" class="tiny">withdraw/delete → clear kit → quiet</text><text x="24" y="498" class="tiny">→ two courts + daily street first</text>
      <rect x="20" y="518" width="304" height="34" rx="10" fill="#e8efdd"/><text x="172" y="541" text-anchor="middle" class="tiny b">measured 0 · vendors 0 · NO-GO</text>
    </g>
    <g transform="translate(732 96)" filter="url(#shadow)">
      <rect width="344" height="572" rx="22" fill="#fcfaf8" stroke="#bc8f72" stroke-width="3"/><rect width="344" height="92" rx="22" fill="#9a5938"/><rect y="70" width="344" height="22" fill="#9a5938"/>
      <text x="24" y="39" class="head b white">DAZHONGSI</text><text x="24" y="70" class="tiny" fill="#fae9df">PUBLISH · source update · commute</text>
      <g transform="translate(20 116)">
        <rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-009</text><text x="16" y="47" class="tiny">access route | freshness + support</text>
        <g transform="translate(0 68)"><rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-010</text><text x="16" y="47" class="tiny">crowding | sensing, privacy, idle</text></g>
        <g transform="translate(0 136)"><rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-011</text><text x="16" y="47" class="tiny">enterprise | sources + staffed desk</text></g>
        <g transform="translate(0 204)"><rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-012</text><text x="16" y="47" class="tiny">health | sensitive inference + referral</text></g>
      </g>
      <line x1="24" y1="406" x2="320" y2="406" stroke="#d0b7a9"/><text x="24" y="442" class="small b">EXIT FOCUS</text><text x="24" y="472" class="tiny">offline → export/correct → staffed desk</text><text x="24" y="498" class="tiny">→ clear kit → four-arm retest</text>
      <rect x="20" y="518" width="304" height="34" rx="10" fill="#f2e3da"/><text x="172" y="541" text-anchor="middle" class="tiny b">measured 0 · vendors 0 · NO-GO</text>
    </g>
  </g>

  <path d="M1474 506H1514" stroke="#315d72" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(1514 174)" filter="url(#shadow)">
    <rect width="244" height="672" rx="22" class="card"/><text x="22" y="44" class="head b">EXIT ROUTES</text><text x="22" y="72" class="tiny muted">Evidence for every component</text>
    <g transform="translate(18 98)" class="tiny">
      <rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">01 RETAIN EXISTING</text><text x="14" y="46" class="muted">condition + owner</text>
      <g transform="translate(0 66)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">02 REPAIR / REUSE</text><text x="14" y="46" class="muted">parts + safety + duty</text></g>
      <g transform="translate(0 132)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">03 REDEPLOY</text><text x="14" y="46" class="muted">receiving owner accepts</text></g>
      <g transform="translate(0 198)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">04 SUPPLIER RETURN</text><text x="14" y="46" class="muted">binding term + receipt</text></g>
      <g transform="translate(0 264)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">05 RECYCLE / DISPOSE</text><text x="14" y="46" class="muted">material chain + receipt</text></g>
      <g transform="translate(0 330)"><rect width="208" height="70" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">06 DATA / LOG CLOSE</text><text x="14" y="47" class="muted">export / delete / minimum log</text></g>
      <g transform="translate(0 410)"><rect width="208" height="86" rx="12" fill="#dce9df"/><text x="14" y="25" class="b">07 RESTORE ORDINARY</text><text x="14" y="47" class="muted">clear cable / fixing / queue</text><text x="14" y="68" class="muted">restore staffed + non-AI task</text></g>
    </g>
    <rect x="18" y="616" width="208" height="36" rx="10" fill="#9a3d38"/><text x="122" y="640" text-anchor="middle" class="tiny b white">NO evidence = STOP</text>
  </g>

  <g transform="translate(42 874)">
    <rect width="1716" height="174" rx="22" fill="#142b44"/>
    <text x="28" y="40" class="head b white">PUBLIC DECISION GATE | field coverage ≠ environmental performance ≠ authorization</text>
    <text x="28" y="77" class="small light">denominator + whole boundary + sources + responsibility + same-task non-AI + vendor exit + destinations + independent retest</text>
    <line x1="28" y1="98" x2="1688" y2="98" stroke="#49647a"/>
    <text x="28" y="135" class="tiny b warm">FIVE EXPLICIT STATES:</text><text x="228" y="135" class="tiny white">not_applicable · not_measured · external_confirmation_required · not_yet_authorized · not_fully_cleared</text>
    <rect x="1350" y="112" width="338" height="40" rx="12" fill="#9a3d38"/><text x="1519" y="138" text-anchor="middle" class="small b white">ANY GAP → NO-GO / STAY G0</text>
  </g>
</svg>
