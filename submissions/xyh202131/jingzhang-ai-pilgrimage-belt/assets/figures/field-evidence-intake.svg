<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">现场证据采集与替换包</title>
  <desc id="desc">从临时基线、八类空白资料包、保管链、七类专业证据门到退回、冲突、拒绝、复算和过期处置，并展示众智园、原点社区和大钟寺三条不同的未来采集路径。现实采集、批准和专业接收均为零。</desc>
  <defs><style>.t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.w{fill:#fff}.h{font-weight:800}.m{fill:#64758a}.s{font-size:18px}.xs{font-size:16px}.box{fill:#fff;stroke:#cfdae3;stroke-width:2}.amber{fill:#fff4dd;stroke:#d5a54e;stroke-width:2}.blue{fill:#e9f3f7;stroke:#4b91ac;stroke-width:2}.green{fill:#e8f4ee;stroke:#4d9b7a;stroke-width:2}.red{fill:#fff0ec;stroke:#c76351;stroke-width:2}</style></defs>
  <rect width="1800" height="1100" fill="#f2f5f6"/><rect width="1800" height="132" fill="#17324d"/>
  <text class="t w h" x="68" y="58" font-size="38">现场证据采集与替换包</text><text class="t" x="68" y="99" font-size="22" fill="#d8e5ec">D01—D08 空白资料包 × H01—H07 专业门 × 三处差异化未来采集路</text>
  <rect x="1390" y="31" width="340" height="68" rx="14" fill="#2a465f" stroke="#88aabb"/><text class="t w h" x="1560" y="59" text-anchor="middle" font-size="19">模板 ≠ 证据</text><text class="t w" x="1560" y="86" text-anchor="middle" font-size="17">采集 0 · 批准 0 · G0 NO-GO</text>

  <rect class="box" x="50" y="165" width="1700" height="190" rx="22"/><text class="t h" x="82" y="207" font-size="23">A · 先冻结普通基线，再接收资料；没有“示例实测值”</text>
  <rect class="green" x="82" y="232" width="300" height="86" rx="14"/><text class="t h" x="232" y="263" text-anchor="middle" font-size="19">普通公共权利</text><text class="t s" x="232" y="293" text-anchor="middle">通行 / 非 AI / 无屏 / 人工</text>
  <path d="M395 275 H475" stroke="#65758a" stroke-width="3"/><polygon points="475,275 460,266 460,284" fill="#65758a"/>
  <rect class="amber" x="490" y="220" width="690" height="112" rx="14"/><text class="t h" x="835" y="252" text-anchor="middle" font-size="20">D01—D08 每包初始状态</text><text class="t s" x="835" y="282" text-anchor="middle">not_collected · artifact_count 0 · field_value null</text><text class="t s" x="835" y="309" text-anchor="middle">来源 / 时间 / 版本 / 权利 / 哈希 / 限制全部待填</text>
  <path d="M1195 275 H1275" stroke="#65758a" stroke-width="3"/><polygon points="1275,275 1260,266 1260,284" fill="#65758a"/>
  <rect class="red" x="1290" y="232" width="420" height="86" rx="14"/><text class="t h" x="1500" y="263" text-anchor="middle" font-size="19">任一缺口仍为 NO-GO</text><text class="t s" x="1500" y="293" text-anchor="middle">完整表单不等于资料已取得</text>

  <rect class="box" x="50" y="385" width="1080" height="305" rx="22"/><text class="t h" x="82" y="427" font-size="23">B · 八类替换包：能证明什么，也必须写不能证明什么</text>
  <g font-size="17">
    <rect class="amber" x="82" y="452" width="235" height="92" rx="12"/><text class="t h" x="100" y="482">D01 官方几何</text><text class="t" x="100" y="510">范围 / CRS / 版本</text><text class="t m" x="100" y="533">≠ 方案批准</text>
    <rect class="amber" x="337" y="452" width="235" height="92" rx="12"/><text class="t h" x="355" y="482">D02 现状测绘</text><text class="t" x="355" y="510">覆盖 / 方法 / 精度</text><text class="t m" x="355" y="533">≠ 全时段现状</text>
    <rect class="amber" x="592" y="452" width="235" height="92" rx="12"/><text class="t h" x="610" y="482">D03 控规权属</text><text class="t" x="610" y="510">权限 / 条件 / 有效期</text><text class="t m" x="610" y="533">≠ 建设许可</text>
    <rect class="amber" x="847" y="452" width="235" height="92" rx="12"/><text class="t h" x="865" y="482">D04 同任务同权</text><text class="t" x="865" y="510">分群 / 同意 / 撤回</text><text class="t m" x="865" y="533">≠ 普遍合规</text>
    <rect class="amber" x="82" y="568" width="235" height="92" rx="12"/><text class="t h" x="100" y="598">D05 交通高峰</text><text class="t" x="100" y="626">分母 / 时窗 / 冲突</text><text class="t m" x="100" y="649">≠ 未来需求</text>
    <rect class="amber" x="337" y="568" width="235" height="92" rx="12"/><text class="t h" x="355" y="598">D06 专项约束</text><text class="t" x="355" y="626">专业 / 范围 / 否决</text><text class="t m" x="355" y="649">≠ 全专业放行</text>
    <rect class="amber" x="592" y="568" width="235" height="92" rx="12"/><text class="t h" x="610" y="598">D07 责任运营</text><text class="t" x="610" y="626">接受 / 替补 / 资源</text><text class="t m" x="610" y="649">≠ 未来在线</text>
    <rect class="amber" x="847" y="568" width="235" height="92" rx="12"/><text class="t h" x="865" y="598">D08 权利复用</text><text class="t" x="865" y="626">对象 / 用途 / 期限</text><text class="t m" x="865" y="649">≠ 全包清权</text>
  </g>

  <rect class="box" x="1160" y="385" width="590" height="305" rx="22"/><text class="t h" x="1192" y="427" font-size="23">C · 保管链与专业处置</text>
  <text class="t s" x="1192" y="468">身份 → 来源 → 时间/版本 → 权利/隐私 → SHA-256</text><text class="t s" x="1192" y="500">→ 完整性/冲突 → H01—H07 专业判断</text>
  <rect class="blue" x="1192" y="527" width="250" height="52" rx="10"/><text class="t h" x="1317" y="560" text-anchor="middle" font-size="17">退回补全 / 冲突挂起</text>
  <rect class="red" x="1462" y="527" width="250" height="52" rx="10"/><text class="t h" x="1587" y="560" text-anchor="middle" font-size="17">专业拒绝 / 过期</text>
  <rect class="green" x="1192" y="598" width="520" height="58" rx="10"/><text class="t h" x="1452" y="623" text-anchor="middle" font-size="17">接收用于复算 ≠ 场地 / 规划 / 建设 / 运营批准</text><text class="t" x="1452" y="646" text-anchor="middle" font-size="15">专业可修改、拒绝或删除概念</text>

  <rect class="box" x="50" y="720" width="1700" height="300" rx="22"/><text class="t h" x="82" y="762" font-size="23">D · 三处不可互换的未来采集路径（完成走查 0）</text>
  <rect class="green" x="82" y="790" width="510" height="185" rx="16"/><text class="t h" x="105" y="825" font-size="21">众智园 · 隔离与还场</text><text class="t s" x="105" y="858">先冻结观察旁路和 before-state</text><text class="t s" x="105" y="888">设备不启动，仅核对隔离 / 停止 / 接管字段</text><text class="t s" x="105" y="918">缺基线或停止权 → 停验证层，旁路保持</text><text class="t m" x="105" y="950">重点：D02 / D06 / D07 · 不是居民共学路</text>
  <rect class="blue" x="645" y="790" width="510" height="185" rx="16"/><text class="t h" x="668" y="825" font-size="21">原点社区 · 同意与撤回</text><text class="t s" x="668" y="858">一条日常街和无屏同任务始终完整</text><text class="t s" x="668" y="888">纸面 / 人工同意、撤回；分群问题不记身份</text><text class="t s" x="668" y="918">保障或静音失败 → 停采集，居民日常优先</text><text class="t m" x="668" y="950">重点：D04 / D07 / D08 · 不是设备试验路</text>
  <rect class="amber" x="1208" y="790" width="510" height="185" rx="16"/><text class="t h" x="1231" y="825" font-size="21">大钟寺 · 高峰与纠错</text><text class="t s" x="1231" y="858">四向通勤连续，发布和人工服务退到路径外</text><text class="t s" x="1231" y="888">计数分母 / 高峰定义 / 来源版本先留空待填</text><text class="t s" x="1231" y="918">侵路或来源争议 → 撤发布层，保留通勤</text><text class="t m" x="1231" y="950">重点：D02 / D05 / D08 · 不是验证庭</text>
  <rect x="50" y="1042" width="1700" height="38" rx="10" fill="#17324d"/><text class="t w" x="900" y="1068" text-anchor="middle" font-size="17">G0 概念方法 · 临时边界 · 非比例 · 无现场数据 · 无批准 · 无责任接受 · 权利 not_fully_cleared</text>
</svg>
