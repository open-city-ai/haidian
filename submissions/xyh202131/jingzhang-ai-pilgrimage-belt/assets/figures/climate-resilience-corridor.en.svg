<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Climate-Resilience Proof Corridor: ordinary blue-green baseline with reversible prompting</title>
  <desc id="desc">Concept plan and section showing a continuous ordinary route, shade and rest, manual inspection, stormwater and ecological-maintenance clear zone, removable observation edge, non-AI and AI-assisted same-task prompts, a four-state vulnerable-group journey, and field unknowns. All content is G0 and is not an existing-condition, approval, or engineering claim.</desc>
  <rect width="1800" height="1100" fill="#f5f3e9"/>
  <style>
    text{font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#162c2b}
    .h1{font-size:44px;font-weight:700}.h2{font-size:27px;font-weight:700}.h2s{font-size:24px;font-weight:700}.h3{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.tiny{font-size:13px}.white{fill:#fff}.muted{fill:#556866}
    .line{stroke:#173d39;stroke-width:6;fill:none}.dash{stroke:#286f86;stroke-width:5;stroke-dasharray:14 12;fill:none}.stop{stroke:#b75233;stroke-width:5;fill:none}.thin{stroke:#52736c;stroke-width:2;fill:none}
  </style>
  <text x="70" y="72" class="h1">Climate-Resilience Proof Corridor</text>
  <text x="70" y="108" class="h2">Ordinary blue-green service first; AI remains optional, stoppable, and removable</text>
  <rect x="1325" y="44" width="405" height="78" rx="16" fill="#173d39"/>
  <text x="1350" y="76" class="h3 white">G0 · concept relation · provisional</text>
  <text x="1350" y="103" class="body white">field measures 0 · devices 0 · duties 0</text>

  <rect x="60" y="150" width="1680" height="430" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="192" class="h2">A  PLAN READING｜Layer outwards from ordinary use; do not draw proof as continuous plant</text>
  <path d="M120 355 H1660" class="line"/>
  <path d="M120 405 H1660" class="thin"/>
  <text x="120" y="335" class="h3">Continuous ordinary blue-green route</text>
  <text x="120" y="435" class="body">No account / QR / screen / sensor / AI; walking, rest, staffed help, and leaving remain complete</text>
  <g>
    <rect x="160" y="245" width="205" height="76" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="180" y="275" class="h3">Shade + rest intent</text><text x="180" y="302" class="tiny">continuity, duration, access: unknown</text>
    <rect x="455" y="245" width="205" height="76" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="475" y="275" class="h3">Static non-AI notice</text><text x="475" y="302" class="small">source / date / human / exit</text>
    <rect x="750" y="245" width="205" height="76" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="770" y="275" class="h3">Manual handoff</text><text x="770" y="302" class="tiny">landscape / water / site roles pending</text>
    <rect x="1045" y="245" width="205" height="76" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1065" y="275" class="h3">Optional AI prompt</text><text x="1065" y="302" class="tiny">same task / human-confirmed / refusible</text>
    <rect x="1340" y="245" width="245" height="76" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1360" y="275" class="h3">Xiaoyue River concept edge</text><text x="1360" y="302" class="small">removable mount; no exact location</text>
  </g>
  <path d="M1148 321 V352" class="dash"/><path d="M1460 321 V352" class="dash"/>
  <text x="1080" y="460" class="small" fill="#286f86">Blue dashes mean intermittent, optional, removable proof overlay only</text>
  <rect x="150" y="485" width="1450" height="62" rx="14" fill="#d9e8e3" stroke="#4d736d" stroke-width="2"/>
  <path d="M200 516 H1550" stroke="#4a87a0" stroke-width="13" opacity="0.45"/>
  <path d="M260 486 V546 M610 486 V546 M960 486 V546 M1310 486 V546" stroke="#fff" stroke-width="7"/>
  <text x="180" y="510" class="h3">Stormwater / ecological-maintenance clear zone</text>
  <text x="180" y="536" class="small">Infiltration, overflow, inspection, and ecology take priority; no equipment, queues, or activities｜no hydraulic or sponge-performance claim</text>

  <rect x="60" y="610" width="1040" height="430" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="652" class="h2">B  TYPICAL SECTION｜Ordinary route + clear process + removable edge</text>
  <path d="M100 910 H1050" stroke="#445b55" stroke-width="5"/>
  <rect x="125" y="778" width="310" height="132" fill="#e8ecd9" stroke="#66835f" stroke-width="2"/>
  <path d="M160 778 Q280 660 400 778" fill="#b9d39b" stroke="#66835f" stroke-width="3"/>
  <text x="155" y="822" class="h3">Ordinary route + rest</text><text x="155" y="852" class="body">continuous, screen-free, staffed help</text><text x="155" y="879" class="small">width / slope / shade / nodes: unknown</text>
  <rect x="455" y="760" width="315" height="150" fill="#d9e8e3" stroke="#4d736d" stroke-width="2"/>
  <path d="M480 850 C540 790 610 900 675 830 S735 820 750 805" stroke="#4a87a0" stroke-width="9" fill="none"/>
  <text x="485" y="798" class="h3">Stormwater + ecology clear</text><text x="485" y="882" class="small">no device base｜green ratio ≠ thermal comfort</text>
  <rect x="815" y="790" width="205" height="120" rx="14" fill="#dcebf0" stroke="#286f86" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="900" y1="790" x2="900" y2="730" stroke="#286f86" stroke-width="5"/><circle cx="900" cy="716" r="13" fill="#286f86"/>
  <text x="838" y="832" class="h3">Removable edge</text><text x="838" y="860" class="small">mount / power / network</text><text x="838" y="885" class="small">data / signs / queues all exit</text>
  <path d="M1018 835 L1060 835" class="stop"/><path d="M1042 820 L1060 835 L1042 850" class="stop"/>
  <text x="560" y="955" class="small" fill="#b75233">Conflict / extreme weather / no human → stop, remove, repair, accept restoration</text>
  <text x="90" y="1010" class="small muted">The diagram shows relationships only—not an existing building, river section, statutory setback, fire/rail/municipal conclusion, or built facility.</text>

  <rect x="1130" y="610" width="610" height="430" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="1160" y="652" class="h2s">C  FOUR STATES｜VULNERABLE-GROUP JOURNEY</text>
  <g>
    <rect x="1170" y="690" width="250" height="118" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1190" y="723" class="h3">1 Ordinary</text><text x="1190" y="750" class="body">physical cue → rest</text><text x="1190" y="778" class="small">no-tech arrival, human, and exit</text>
    <rect x="1450" y="690" width="250" height="118" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1470" y="723" class="h3">2 Optional assistance</text><text x="1470" y="750" class="body">static first; choose/refuse</text><text x="1470" y="778" class="small">same action, human, appeal, exit</text>
    <rect x="1170" y="845" width="250" height="118" rx="16" fill="#f3ddd4" stroke="#b75233" stroke-width="2"/>
    <text x="1190" y="878" class="h3">3 Extreme-weather stop</text><text x="1190" y="905" class="small">activity + optional kit stop</text><text x="1190" y="933" class="small">physical refusal → exit / human</text>
    <rect x="1450" y="845" width="250" height="118" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="1470" y="878" class="h3">4 Recovery</text><text x="1470" y="905" class="body">ordinary place accepted first</text><text x="1470" y="933" class="small">optional off; no G0 advance</text>
  </g>
  <path d="M1420 748 H1450" class="dash"/><path d="M1575 808 V845" class="stop"/><path d="M1450 904 H1420" class="stop"/>
  <text x="1160" y="1008" class="small muted">Unknown: boundary, climate, shade, rest, stormwater, people, devices, rights, group results.</text>
</svg>
