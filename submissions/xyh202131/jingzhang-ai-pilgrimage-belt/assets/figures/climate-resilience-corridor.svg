<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">气候韧性验证走廊：普通蓝绿基线与可逆提示增量</title>
  <desc id="desc">概念总图和剖面显示连续普通路径、遮阴休息、人工巡检、雨洪与生态维护净空、可拆观察边、非 AI 与 AI 辅助提示对照、脆弱群体四态旅程和现场未知。所有内容为 G0，不代表现状、批准或工程结论。</desc>
  <rect width="1800" height="1100" fill="#f5f3e9"/>
  <style>
    text{font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#162c2b}
    .h1{font-size:44px;font-weight:700}.h2{font-size:27px;font-weight:700}.h3{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.white{fill:#fff}.muted{fill:#556866}
    .line{stroke:#173d39;stroke-width:6;fill:none}.dash{stroke:#286f86;stroke-width:5;stroke-dasharray:14 12;fill:none}.stop{stroke:#b75233;stroke-width:5;fill:none}.thin{stroke:#52736c;stroke-width:2;fill:none}
  </style>
  <text x="70" y="72" class="h1">气候韧性验证走廊</text>
  <text x="70" y="108" class="h2">普通蓝绿基线先成立，AI 只作可拒绝、可停止、可拆除的提示增量</text>
  <rect x="1325" y="44" width="405" height="78" rx="16" fill="#173d39"/>
  <text x="1350" y="76" class="h3 white">G0 · 概念关系 · 临时边界</text>
  <text x="1350" y="103" class="body white">实测 0 · 设备 0 · 责任确认 0</text>

  <rect x="60" y="150" width="1680" height="430" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="192" class="h2">A  总图读法｜从普通路径向外叠加，不把验证画成连续设施</text>
  <path d="M120 355 H1660" class="line"/>
  <path d="M120 405 H1660" class="thin"/>
  <text x="120" y="335" class="h3">连续普通蓝绿路径</text>
  <text x="120" y="435" class="body">无需账户 / 扫码 / 屏幕 / 传感器 / AI；步行、休息、人工求助和离开保持完整</text>

  <g>
    <rect x="160" y="245" width="205" height="76" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="180" y="275" class="h3">遮阴与休息意图</text><text x="180" y="302" class="small">连续性、时长、可达性待测</text>
    <rect x="455" y="245" width="205" height="76" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="475" y="275" class="h3">静态非 AI 提示</text><text x="475" y="302" class="small">来源 / 日期 / 人工 / 退出</text>
    <rect x="750" y="245" width="205" height="76" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="770" y="275" class="h3">人工巡检交接</text><text x="770" y="302" class="small">园林 / 水务 / 场地角色待确认</text>
    <rect x="1045" y="245" width="205" height="76" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1065" y="275" class="h3">可选 AI 辅助提示</text><text x="1065" y="302" class="small">同任务 / 人工确认 / 可拒绝</text>
    <rect x="1340" y="245" width="245" height="76" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1360" y="275" class="h3">小月河观察翼概念边</text><text x="1360" y="302" class="small">可拆挂点；不声明精确位置</text>
  </g>
  <path d="M1148 321 V352" class="dash"/>
  <path d="M1460 321 V352" class="dash"/>
  <text x="1080" y="460" class="small" fill="#286f86">蓝色虚线只表示间歇、可选、可拆的验证叠层</text>

  <rect x="150" y="485" width="1450" height="62" rx="14" fill="#d9e8e3" stroke="#4d736d" stroke-width="2"/>
  <path d="M200 516 H1550" stroke="#4a87a0" stroke-width="13" opacity="0.45"/>
  <path d="M260 486 V546 M610 486 V546 M960 486 V546 M1310 486 V546" stroke="#fff" stroke-width="7"/>
  <text x="180" y="510" class="h3">雨洪 / 生态维护净空</text>
  <text x="180" y="536" class="small">渗透、溢流、检修和生态过程优先；设备、排队与活动不得进入｜无水文容量或海绵绩效结论</text>

  <rect x="60" y="610" width="1040" height="430" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="652" class="h2">B  典型剖面｜普通基线 + 维护净空 + 可退出服务边</text>
  <path d="M100 910 H1050" stroke="#445b55" stroke-width="5"/>
  <rect x="125" y="778" width="310" height="132" fill="#e8ecd9" stroke="#66835f" stroke-width="2"/>
  <path d="M160 778 Q280 660 400 778" fill="#b9d39b" stroke="#66835f" stroke-width="3"/>
  <text x="155" y="822" class="h3">普通路径 + 遮阴休息</text><text x="155" y="852" class="body">连续、无屏、可人工求助</text><text x="155" y="879" class="small">净宽 / 坡度 / 荫时 / 节点数：unknown</text>
  <rect x="455" y="760" width="315" height="150" fill="#d9e8e3" stroke="#4d736d" stroke-width="2"/>
  <path d="M480 850 C540 790 610 900 675 830 S735 820 750 805" stroke="#4a87a0" stroke-width="9" fill="none"/>
  <text x="485" y="798" class="h3">雨洪与生态维护净空</text><text x="485" y="882" class="small">不设设备基础｜不以绿地率代替热舒适</text>
  <rect x="815" y="790" width="205" height="120" rx="14" fill="#dcebf0" stroke="#286f86" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="900" y1="790" x2="900" y2="730" stroke="#286f86" stroke-width="5"/>
  <circle cx="900" cy="716" r="13" fill="#286f86"/>
  <text x="838" y="832" class="h3">可拆服务边</text><text x="838" y="860" class="small">挂点 / 电源 / 网络</text><text x="838" y="885" class="small">数据 / 标识 / 排队全退出</text>
  <path d="M1018 835 L1060 835" class="stop"/><path d="M1042 820 L1060 835 L1042 850" class="stop"/>
  <text x="600" y="955" class="small" fill="#b75233">冲突 / 极端天气 / 无人确认 → 停止、拆除、修复、还场验收</text>
  <text x="90" y="1010" class="small muted">图件只解释关系：不代表现状建筑、河道断面、法定退界、消防/铁路/市政结论或已建设施。</text>

  <rect x="1130" y="610" width="610" height="430" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="1160" y="652" class="h2">C  老年 / 行动不便者四态旅程</text>
  <g>
    <rect x="1170" y="690" width="250" height="118" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1190" y="723" class="h3">1 普通</text><text x="1190" y="750" class="body">实体导视 → 休息 → 人工</text><text x="1190" y="778" class="small">无需技术，完整到达与离开</text>
    <rect x="1450" y="690" width="250" height="118" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1470" y="723" class="h3">2 可选辅助</text><text x="1470" y="750" class="body">先读静态，再选择 / 拒绝</text><text x="1470" y="778" class="small">同一动作、人工、申诉与退出</text>
    <rect x="1170" y="845" width="250" height="118" rx="16" fill="#f3ddd4" stroke="#b75233" stroke-width="2"/>
    <text x="1190" y="878" class="h3">3 极端天气停止</text><text x="1190" y="905" class="body">活动和可选设备停</text><text x="1190" y="933" class="small">实体安全拒绝 → 普通出口 / 人工</text>
    <rect x="1450" y="845" width="250" height="118" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="1470" y="878" class="h3">4 恢复</text><text x="1470" y="905" class="body">先验收普通路径与场所</text><text x="1470" y="933" class="small">可选层仍关闭；不自动升级 G0</text>
  </g>
  <path d="M1420 748 H1450" class="dash"/><path d="M1575 808 V845" class="stop"/><path d="M1450 904 H1420" class="stop"/>
  <text x="1160" y="1008" class="small muted">待现场：正式边界、微气候、遮阴长度、可达休息、雨洪、人员、阈值、设备、权利与群体结果。</text>
</svg>
