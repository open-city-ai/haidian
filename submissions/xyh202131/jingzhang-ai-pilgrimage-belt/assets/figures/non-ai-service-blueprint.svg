    <rect x="745" y="355" width="174" height="65" rx="9" fill="#2769a8"/><text x="832" y="382" text-anchor="middle" class="white chip">双入口人工台</text><text x="832" y="404" text-anchor="middle" class="tiny white">受理 / 解释 / 转交</text>
    <path d="M919 388H949" stroke="#12765b" stroke-width="4" marker-end="url(#arrowG)"/>
    <rect x="959" y="365" width="165" height="45" rx="9" fill="#fff" stroke="#75ae99"/><text x="1041" y="393" text-anchor="middle">同一基本任务</text>
    <path d="M1124 388H1154" stroke="#12765b" stroke-width="4" marker-end="url(#arrowG)"/>
    <rect x="1164" y="365" width="248" height="45" rx="9" fill="#fff" stroke="#75ae99"/><text x="1288" y="393" text-anchor="middle">投诉 / 撤回 / 纠正 / 离开</text>
  </g>

  <rect x="350" y="458" width="1090" height="86" rx="14" fill="#e9f0f8" stroke="#8ba9ca" stroke-dasharray="10 7"/>
  <text x="374" y="486" class="cap blue">可选路径 / OPTIONAL AI — 易懂披露 + 单独自愿同意</text>
  <rect x="630" y="497" width="205" height="34" rx="17" fill="#fff" stroke="#8ba9ca"/><text x="732" y="520" text-anchor="middle" class="small">限域 AI 帮助</text>
  <path d="M835 514H950" stroke="#2769a8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowB)"/>
  <text x="1100" y="520" class="small">汇入同一人工台、结果与责任队列</text>

  <rect x="1464" y="322" width="240" height="258" rx="14" fill="#fff0ec" stroke="#d68d78"/>
  <text x="1584" y="354" text-anchor="middle" class="ttl orange">失败侧线</text>
  <text x="1486" y="385" class="body">1  自动化立即停止</text><text x="1486" y="414" class="body">2  普通路径保持</text><text x="1486" y="443" class="body">3  人工解释与责任队列</text><text x="1486" y="472" class="body">4  临时叠层全部退出</text><text x="1486" y="501" class="body">5  独立复测与还场</text>
  <path d="M1465 548H1428" stroke="#bd4d2d" stroke-width="4" marker-end="url(#arrowO)"/>
  <text x="1584" y="555" text-anchor="middle" class="tiny">未闭合：保持停止或退役</text>

  <text x="70" y="646" class="cap muted">三处不可机械复制的服务接口 / THREE PLACE-SPECIFIC INTERFACES</text>
  <g transform="translate(70 665)">
    <rect width="530" height="225" rx="16" fill="#fff" stroke="#8ba9ca"/>
    <rect width="530" height="48" rx="16" fill="#203955"/><rect y="32" width="530" height="16" fill="#203955"/>
    <text x="22" y="32" class="ttl white">众智园 · VERIFY</text>
    <text x="22" y="79" class="cap blue">连续绕行 + 实体状态 + 人工接管</text>
    <text x="22" y="111" class="body">普通：观察 / 通行 / 纸面停止与申诉</text>
    <text x="22" y="140" class="body">可选：未来过门后的限域离线验证</text>
    <text x="22" y="169" class="body orange">停止：隔离设备，普通路径保持</text>
    <text x="22" y="198" class="small">恢复：设备、线缆、围挡、声光、排队退出并独立复核</text>
    <rect x="565" width="530" height="225" rx="16" fill="#fff" stroke="#d4a85c"/>
    <rect x="565" width="530" height="48" rx="16" fill="#6e5521"/><rect x="565" y="32" width="530" height="16" fill="#6e5521"/>
    <text x="587" y="32" class="ttl white">原点社区 · CO-CREATE</text>
    <text x="587" y="79" class="cap amber">日常街 + 无屏等候 + 口头/纸面撤回</text>
    <text x="587" y="111" class="body">普通：居民通行 / 提问 / 人工说明</text>
    <text x="587" y="140" class="body">可选：与基本服务分离的自愿共学</text>
    <text x="587" y="169" class="body orange">停止：采集与匹配停，纸面与人工保留</text>
    <text x="587" y="198" class="small">恢复：屏幕、扩声、活动物料、采集状态退出</text>
    <rect x="1130" width="530" height="225" rx="16" fill="#fff" stroke="#75ae99"/>
    <rect x="1130" width="530" height="48" rx="16" fill="#195b4d"/><rect x="1130" y="32" width="530" height="16" fill="#195b4d"/>
    <text x="1152" y="32" class="ttl white">大钟寺 · PUBLISH</text>
    <text x="1152" y="79" class="cap green">四向步行 + 实体来源 + 双入口人工台</text>
    <text x="1152" y="111" class="body">普通：通勤 / 人工同任务 / 纸面纠错</text>
    <text x="1152" y="140" class="body">可选：人工服务旁侧的来源化导航</text>
    <text x="1152" y="169" class="body orange">停止：自动化下线，人工与来源清单保留</text>
    <text x="1152" y="198" class="small">恢复：纠正来源与队列，清场并复测四向通行</text>
  </g>

  <text x="70" y="933" class="cap muted">群体分层验收 / GROUP-SPECIFIC ACCEPTANCE — 不以总体平均掩盖排斥</text>
  <g transform="translate(70 951)">
    <rect width="390" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="20" y="31" class="chip">老年人</text><text x="20" y="56" class="small">口头询问 · 无屏等候 · 无账户完成</text><text x="342" y="34" class="cap orange">unknown</text>
    <rect x="414" width="390" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="434" y="31" class="chip">残障人士 / 行动不便者</text><text x="434" y="56" class="small">同路线 · 所需支持 · 不受活动侵占</text><text x="756" y="34" class="cap orange">unknown</text>
    <rect x="828" width="390" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="848" y="31" class="chip">低数字素养使用者</text><text x="848" y="56" class="small">先发现非 AI · 理解 · 查询 · 纠正</text><text x="1170" y="34" class="cap orange">unknown</text>
    <rect x="1242" width="418" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="1262" y="31" class="chip">无账户 / 无智能设备使用者</text><text x="1262" y="56" class="small">同结果 · 同费用 · 同队列 · 同复核</text><text x="1610" y="34" class="cap orange">unknown</text>
