<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">非 AI 优先公共服务蓝图</title>
  <desc id="desc">七项永久公共权利、同一基本任务的非 AI 主路径和可选 AI 路径、三处换轨场服务差异、四类群体验收以及停止恢复闭环。全部为 G0 概念，现实结果未知。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#14243b}.h1{font-size:38px;font-weight:800;letter-spacing:1px}.sub{font-size:18px;fill:#526178}.cap{font-size:15px;font-weight:700;letter-spacing:1.5px}.chip{font-size:16px;font-weight:700}.ttl{font-size:23px;font-weight:800}.body{font-size:16px}.small{font-size:14px;fill:#526178}.tiny{font-size:12px;fill:#637087}.num{font-size:20px;font-weight:800}.white{fill:#fff}.muted{fill:#7c8799}.green{fill:#12765b}.blue{fill:#2769a8}.amber{fill:#b56b08}.orange{fill:#bd4d2d}
    </style>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#12765b"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2769a8"/></marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd4d2d"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#f5f7f8"/>
  <rect width="1800" height="118" fill="#13253d"/>
  <text x="70" y="54" class="h1 white">非 AI 优先公共城市</text>
  <text x="70" y="88" class="sub white">同一基本任务，两条尊严平等路径 · NON-AI-FIRST PUBLIC SERVICE</text>
  <rect x="1408" y="25" width="320" height="68" rx="10" fill="#203955" stroke="#67809b"/>
  <text x="1432" y="52" class="cap white">现实边界 / REALITY GATE</text>
  <text x="1432" y="78" class="body white">G0 · 批准 0 · 人员 0 · 结果 unknown</text>

  <text x="70" y="157" class="cap muted">七项永久公共权利 / PERMANENT PUBLIC RIGHTS</text>
  <g transform="translate(70 177)">
    <g transform="translate(0)"><rect width="224" height="62" rx="12" fill="#e6f3ee" stroke="#75ae99"/><circle cx="29" cy="31" r="17" fill="#12765b"/><text x="29" y="38" text-anchor="middle" class="num white">1</text><text x="57" y="27" class="chip">无需账户或扫码</text><text x="57" y="48" class="tiny">进入 · 办事 · 申诉 · 离开</text></g>
    <g transform="translate(239)"><rect width="224" height="62" rx="12" fill="#e6f3ee" stroke="#75ae99"/><circle cx="29" cy="31" r="17" fill="#12765b"/><text x="29" y="38" text-anchor="middle" class="num white">2</text><text x="57" y="27" class="chip">完整非 AI 路径</text><text x="57" y="48" class="tiny">纸面 · 口头 · 实体 · 人工</text></g>
    <g transform="translate(478)"><rect width="224" height="62" rx="12" fill="#e6f3ee" stroke="#75ae99"/><circle cx="29" cy="31" r="17" fill="#12765b"/><text x="29" y="38" text-anchor="middle" class="num white">3</text><text x="57" y="27" class="chip">连续无障碍意图</text><text x="57" y="48" class="tiny">待勘测 · 共测 · 专业复核</text></g>
    <g transform="translate(717)"><rect width="224" height="62" rx="12" fill="#e9f0f8" stroke="#8ba9ca"/><circle cx="29" cy="31" r="17" fill="#2769a8"/><text x="29" y="38" text-anchor="middle" class="num white">4</text><text x="57" y="27" class="chip">人工服务与交接</text><text x="57" y="48" class="tiny">受理 · 解释 · 拒绝 · 转交</text></g>
    <g transform="translate(956)"><rect width="224" height="62" rx="12" fill="#fff3dc" stroke="#d4a85c"/><circle cx="29" cy="31" r="17" fill="#b56b08"/><text x="29" y="38" text-anchor="middle" class="num white">5</text><text x="57" y="27" class="chip">同意可撤回</text><text x="57" y="48" class="tiny">不影响通行与基本服务</text></g>
    <g transform="translate(1195)"><rect width="224" height="62" rx="12" fill="#fff3dc" stroke="#d4a85c"/><circle cx="29" cy="31" r="17" fill="#b56b08"/><text x="29" y="38" text-anchor="middle" class="num white">6</text><text x="57" y="27" class="chip">申诉与纠正</text><text x="57" y="48" class="tiny">同队列 · 同状态 · 同复核</text></g>
    <g transform="translate(1434)"><rect width="224" height="62" rx="12" fill="#edf0f4" stroke="#aeb7c2"/><circle cx="29" cy="31" r="17" fill="#536273"/><text x="29" y="38" text-anchor="middle" class="num white">7</text><text x="57" y="27" class="chip">无屏与安静</text><text x="57" y="48" class="tiny">普通通行和休息优先</text></g>
  </g>

  <text x="70" y="282" class="cap muted">公共服务蓝图 / SERVICE BLUEPRINT</text>
  <rect x="70" y="302" width="1660" height="300" rx="18" fill="#fff" stroke="#ced6de"/>
  <rect x="95" y="333" width="180" height="232" rx="14" fill="#eef2f5"/>
  <text x="185" y="371" text-anchor="middle" class="ttl">共用入口</text>
  <text x="185" y="401" text-anchor="middle" class="small">实体权利图例</text><text x="185" y="425" text-anchor="middle" class="small">六类城市信号</text>
  <rect x="117" y="453" width="136" height="50" rx="25" fill="#13253d"/><text x="185" y="484" text-anchor="middle" class="chip white">不注册 · 不扫码</text>
  <text x="185" y="535" text-anchor="middle" class="tiny">不默认采集</text>

  <path d="M275 420H340" stroke="#12765b" stroke-width="7" marker-end="url(#arrowG)"/>
  <path d="M275 506H340" stroke="#2769a8" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arrowB)"/>

  <rect x="350" y="322" width="1090" height="108" rx="14" fill="#e6f3ee" stroke="#75ae99"/>
  <text x="374" y="350" class="cap green">主路径 / NON-AI FIRST</text>
  <g class="body">
