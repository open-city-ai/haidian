<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Century-Time Museum: A Verifiable, Correctable, Screen-free Time Education Line</title>
  <desc id="desc">The twin-track atlas juxtaposes Jing-Zhang railway survey, opening, HSR and heritage park with AI training, validation, failure, correction and retirement; the source-grade table gives seven typed evidence anchors; the dispute-correction flow has five steps: stop, takedown, correct, retain version, recover. All content is G0 concept, not status quo, approval, archive or engineering conclusion.</desc>
  <rect width="1800" height="1100" fill="#f5f3e9"/>
  <style>
    text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#162c2b}
    .h1{font-size:40px;font-weight:700}.h2{font-size:24px;font-weight:700}.h3{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px}.foot{font-size:12px}.white{fill:#fff}.muted{fill:#556866}
    .line{stroke:#173d39;stroke-width:6;fill:none}.thin{stroke:#52736c;stroke-width:2;fill:none}.dash{stroke:#286f86;stroke-width:5;stroke-dasharray:14 12;fill:none}
  </style>
  <text x="70" y="65" class="h1">Century-Time Museum</text>
  <text x="70" y="100" class="h2">A verifiable, correctable, screen-free urban time education line</text>
  <text x="70" y="128" class="h2">— not a tech-worship exhibition</text>
  <rect x="1260" y="38" width="470" height="90" rx="16" fill="#173d39"/>
  <text x="1285" y="72" class="h3 white">G0 · conceptual · provisional</text>
  <text x="1285" y="100" class="small white">relation only · archives 0 · oral history 0</text>
  <text x="1285" y="119" class="small white">field tests 0 · confirmed roles 0</text>

  <!-- A 双轨对照图谱 -->
  <rect x="60" y="150" width="1680" height="560" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="192" class="h2">A  Twin-track atlas | railway chronology × AI gates (teaching comparison, not equivalence)</text>

  <!-- 铁路轨 -->
  <path d="M120 300 H1660" class="line"/>
  <text x="120" y="262" class="h3">Railway chronology track | historical ticks, each with a source grade</text>
  <g>
    <rect x="140" y="315" width="270" height="86" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="165" y="344" class="h3">1905–1909 Survey</text>
    <text x="160" y="370" class="small muted">Zhan Tianyou · Guanggou</text>
    <text x="160" y="390" class="small" fill="#8a7338">▲ archive pending</text>
    <rect x="430" y="315" width="270" height="86" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="455" y="344" class="h3">1909 Opening</text>
    <text x="450" y="370" class="small muted">date pending archive</text>
    <text x="450" y="390" class="small" fill="#8a7338">▲ archive pending</text>
    <rect x="720" y="315" width="270" height="86" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="745" y="344" class="h3">2019 Beijing–Zhang HSR</text>
    <text x="740" y="370" class="small muted">public report</text>
    <text x="740" y="390" class="small" fill="#286f86">◆ public report</text>
    <rect x="1010" y="315" width="300" height="86" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="1030" y="344" class="h3">2023+ Heritage Park</text>
    <text x="1030" y="370" class="small muted">source: JZ-PARK-2023</text>
    <text x="1030" y="390" class="small" fill="#577c55">● in-package source</text>
    <rect x="1350" y="315" width="290" height="86" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1370" y="344" class="h3">Annual Evidence Update</text>
    <text x="1370" y="370" class="small muted">upgrades or retirement</text>
    <text x="1370" y="390" class="small" fill="#577c55">◎ mechanism only</text>
  </g>

  <!-- AI 轨 -->
  <path d="M120 545 H1660" class="line"/>
  <text x="120" y="507" class="h3">AI lifecycle track | train–validate–fail–correct–retire against JZ-AIOS gates</text>
  <g>
    <rect x="140" y="560" width="250" height="86" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="160" y="589" class="h3">Train · gates</text>
    <text x="160" y="615" class="small muted">source grade first</text>
    <text x="160" y="635" class="small" fill="#577c55">parallel: survey &amp; standards</text>
    <rect x="430" y="560" width="250" height="86" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="450" y="589" class="h3">Validate · G0-G3</text>
    <text x="450" y="615" class="small muted">concept to operation</text>
    <text x="450" y="635" class="small" fill="#577c55">parallel: signal stages</text>
    <rect x="720" y="560" width="250" height="86" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="740" y="589" class="h3">Fail · fail-closed</text>
    <text x="740" y="615" class="small muted">stop, public, recover</text>
    <text x="740" y="635" class="small" fill="#b75233">parallel: signal fault stop</text>
    <rect x="1010" y="560" width="300" height="86" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1030" y="589" class="h3">Correct · handoff</text>
    <text x="1030" y="615" class="small muted">takedown, versions</text>
    <text x="1030" y="635" class="small" fill="#b75233">parallel: maintenance logs</text>
    <rect x="1350" y="560" width="290" height="86" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1370" y="589" class="h3">Retire · annual</text>
    <text x="1370" y="615" class="small muted">list, no auto-delete</text>
    <text x="1370" y="626" class="small" fill="#577c55">parallel: equipment retirement</text>
    <text x="1370" y="642" class="small" fill="#577c55">+ site-return receipt</text>
  </g>

  <text x="120" y="462" class="small" fill="#556866">The teaching parallel is limited to verifiable inputs, gated stops and persistent records.</text>
  <text x="120" y="480" class="small" fill="#556866">It does not claim equal risk or regulatory treatment; see the in-package G0 contract.</text>

  <!-- B 来源等级表 -->
  <rect x="60" y="730" width="830" height="310" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="772" class="h2">B  Source-grade table | typed evidence anchors</text>
  <g>
    <rect x="90" y="796" width="26" height="24" rx="6" fill="#c9a227"/><text x="128" y="815" class="body">official_archive official archives/collections (0 in package)</text>
    <rect x="90" y="830" width="26" height="24" rx="6" fill="#577c55"/><text x="128" y="849" class="body">in_package_source registered in-package sources (e.g. JZ-PARK-2023)</text>
    <rect x="90" y="864" width="26" height="24" rx="6" fill="#4a87a0"/><text x="128" y="883" class="body">public_reporting public reporting (non-archive; labelled pending)</text>
    <rect x="90" y="898" width="26" height="24" rx="6" fill="#b9c7ba"/><text x="128" y="917" class="body">public reporting pending archive</text>
    <rect x="90" y="932" width="26" height="24" rx="6" fill="#9aa8a3"/><text x="128" y="951" class="body">osm_background OSM (spatial only; ODbL duties)</text>
    <rect x="90" y="966" width="26" height="24" rx="6" fill="#8a5fbf"/><text x="128" y="985" class="body">generated_content AI-generated (visible label required; removable anytime)</text>
    <rect x="90" y="1000" width="26" height="24" rx="6" fill="#b7791f"/><text x="128" y="1019" class="body">oral_history_pending oral history (future collection · consent pending; 0 today)</text>
  </g>

  <!-- C Correct流程 + 无屏节点 -->
  <rect x="910" y="730" width="860" height="320" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="940" y="772" class="h2">C  Dispute-correction flow | five steps + screen-free node chain</text>
  <g>
    <rect x="940" y="800" width="130" height="72" rx="14" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="965" y="830" class="h3">Stop</text><text x="955" y="854" class="small muted">display off</text>
    <path d="M1080 836 H1110" class="thin"/>
    <rect x="1120" y="800" width="130" height="72" rx="14" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1135" y="830" class="h3">Takedown</text><text x="1135" y="854" class="small muted">retain version</text>
    <path d="M1260 836 H1290" class="thin"/>
    <rect x="1300" y="800" width="145" height="72" rx="14" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="1320" y="830" class="h3">Correct</text><text x="1315" y="852" class="small muted">use higher-grade</text><text x="1315" y="868" class="small muted">evidence</text>
    <path d="M1440 836 H1470" class="thin"/>
    <rect x="1480" y="800" width="145" height="72" rx="14" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1500" y="830" class="h3">Retain</text><text x="1500" y="854" class="small muted">read-only record</text>
    <path d="M1620 836 H1650" class="thin"/>
    <rect x="940" y="884" width="685" height="72" rx="14" fill="#d9e8e3" stroke="#4d736d" stroke-width="2"/>
    <text x="965" y="912" class="h3">Recover</text>
    <text x="1050" y="908" class="body">after independent review + public notice;</text>
    <text x="1050" y="928" class="small muted">otherwise stay down or retire (roles pending)</text>
    <text x="965" y="950" class="small muted">stop/takedown never blocks ordinary paths or staffed services</text>
  </g>
  <!-- Screen-free node chain (inside C) -->
  <g>
    <text x="940" y="1000" class="body">★ Screen-free chain (no account/QR/AI):</text>
    <rect x="1220" y="983" width="110" height="28" rx="8" fill="#173d39"/><text x="1238" y="1002" class="small white">origin sign</text>
    <text x="1340" y="1002" class="body">→</text>
    <rect x="1365" y="983" width="110" height="28" rx="8" fill="#173d39"/><text x="1383" y="1002" class="small white">atlas sign</text>
    <text x="1485" y="1002" class="body">→</text>
    <rect x="1510" y="983" width="110" height="28" rx="8" fill="#173d39"/><text x="1528" y="1002" class="small white">evidence wall</text>
  </g>

  <!-- 底部状态条 -->
  <rect x="60" y="1058" width="1680" height="38" rx="12" fill="#e7efe9" stroke="#4d736d" stroke-width="2"/>
  <text x="90" y="1083" class="foot">Ordinary–verify–failure–recovery | provisional · conceptual · not-as-built | in-package + archive-pending sources | all scenes G0; no approval, field or operation claim</text>
</svg>
