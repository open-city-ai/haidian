<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Public Signal Interface and Readable Civic Timetable</title>
  <desc id="desc">A G0 relationship diagram for six public signals, four runtime states and three differentiated carriers. Real windows, staffed presence and recovery duration remain unknown; approvals and real operations remain zero.</desc>
  <defs>
    <style>
      text{font-family:"Noto Sans SC","Segoe UI",Arial,sans-serif;fill:#172532}
      .title{font-size:35px;font-weight:800;fill:#fff}.subtitle{font-size:15px;font-weight:700;fill:#d8e4e7}
      .kicker{font-size:13px;font-weight:800;letter-spacing:1.6px;fill:#b97800}.h2{font-size:19px;font-weight:800;fill:#112b38}
      .h3{font-size:14px;font-weight:800;fill:#112b38}.body{font-size:11.5px;font-weight:500;fill:#425863}
      .small{font-size:10px;font-weight:600;fill:#536a75}.tiny{font-size:9px;font-weight:700;fill:#536a75;letter-spacing:.25px}
      .code{font-size:10px;font-weight:900;fill:#b97800;letter-spacing:.65px}.white{fill:#fff}.muted-white{fill:#d8e4e7}
      .panel{fill:#fff;stroke:#c3cdcb;stroke-width:2}.rule{stroke:#c3cdcb;stroke-width:2}.navy{fill:#112b38}.gold{fill:#b97800}
    </style>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#b97800" opacity=".55"/></pattern>
  </defs>
  <rect width="1800" height="1100" fill="#f4f1e8"/>
  <rect width="1800" height="132" class="navy"/><rect x="0" y="0" width="15" height="132" class="gold"/>
  <text x="48" y="48" class="kicker" fill="#e7bd68">TWIN-TRACK JING-ZHANG · ROUND 18 · PUBLIC READING LAYER</text>
  <text x="48" y="96" class="title">PUBLIC SIGNAL INTERFACE + READABLE CIVIC TIMETABLE</text>
  <text x="1320" y="48" class="subtitle">G0 DEMONSTRATION READER · NOT LIVE</text>
  <text x="1320" y="82" class="subtitle">PROVISIONAL · NOT TO SCALE · NOT APPROVAL</text>
  <text x="1290" y="113" class="small muted-white">NO ACCOUNT · NO QR · NO AI REQUIRED</text>

  <rect x="36" y="164" width="420" height="762" rx="20" class="panel"/>
  <text x="64" y="204" class="kicker">01 / SIX PUBLIC QUESTIONS</text><text x="64" y="238" class="h2">Six city signals</text>
  <text x="64" y="264" class="body">Colour is always paired with code, name, shape and text.</text>
  <g transform="translate(64 296)"><rect width="364" height="88" rx="12" fill="#f7faf9" stroke="#112b38" stroke-width="2"/><circle cx="36" cy="44" r="19" fill="none" stroke="#112b38" stroke-width="4"/><path d="M27 44h18m-7-8 8 8-8 8" fill="none" stroke="#112b38" stroke-width="3"/><text x="70" y="29" class="code">01 · ENTRY</text><text x="70" y="56" class="h3">Where can I enter?</text><text x="70" y="76" class="small">Ordinary route before proof entry</text></g>
  <g transform="translate(64 394)"><rect width="364" height="88" rx="12" fill="#f7faf9" stroke="#112b38" stroke-width="2" stroke-dasharray="8 6"/><circle cx="36" cy="44" r="19" fill="none" stroke="#b97800" stroke-width="4"/><path d="M36 31v14l10 6" fill="none" stroke="#b97800" stroke-width="3"/><text x="70" y="29" class="code">02 · TIME</text><text x="70" y="56" class="h3">What can happen now?</text><text x="70" y="76" class="small">Concept window is not opening hours</text></g>
  <g transform="translate(64 492)"><rect width="364" height="88" rx="12" fill="#f7faf9" stroke="#112b38" stroke-width="2"/><path d="M36 20 58 44 36 68 14 44Z" fill="#fff" stroke="#b97800" stroke-width="4"/><text x="70" y="29" class="code">03 · STATE</text><text x="70" y="56" class="h3">Ordinary, proof, stop, or recovery?</text><text x="70" y="76" class="small">Runtime is not maturity or authorization</text></g>
  <g transform="translate(64 590)"><rect width="364" height="88" rx="12" fill="#f7faf9" stroke="#112b38" stroke-width="2"/><circle cx="36" cy="35" r="12" fill="none" stroke="#2f735d" stroke-width="4"/><path d="M18 66c2-15 12-22 18-22s16 7 18 22" fill="none" stroke="#2f735d" stroke-width="4"/><text x="70" y="29" class="code">04 · HUMAN</text><text x="70" y="56" class="h3">Who can I ask?</text><text x="70" y="76" class="small">Show unknown if presence is unconfirmed</text></g>
  <g transform="translate(64 688)"><rect width="364" height="88" rx="12" fill="#f7faf9" stroke="#112b38" stroke-width="2"/><path d="M20 24h32v40H20zm8 10h16M28 44h16M28 54h10" fill="none" stroke="#2f6177" stroke-width="3"/><text x="70" y="29" class="code">05 · SOURCE</text><text x="70" y="56" class="h3">Where are basis, version, and update?</text><text x="70" y="76" class="small">Package contract is not a live status feed</text></g>
  <g transform="translate(64 786)"><rect width="364" height="88" rx="12" fill="#f7faf9" stroke="#112b38" stroke-width="2"/><path d="M16 23h28v42H16zm28 21h18m-8-8 8 8-8 8" fill="none" stroke="#9a3d32" stroke-width="3"/><text x="70" y="29" class="code">06 · EXIT</text><text x="70" y="56" class="h3">How do I stop, detour, withdraw, leave?</text><text x="70" y="76" class="small">The ordinary same-task route stays legible</text></g>

  <rect x="480" y="164" width="786" height="762" rx="20" class="panel"/>
  <text x="510" y="204" class="kicker">02 / FOUR STATES · ONE ORDINARY BASELINE</text>
  <text x="510" y="238" class="h2">Four states = four rejectable actions, not four colours</text>
  <g transform="translate(510 276)"><rect width="170" height="118" rx="14" fill="#e9f2ed" stroke="#2f735d" stroke-width="3"/><text x="18" y="28" class="code">01 · ORDINARY</text><text x="18" y="58" class="h3">Ordinary</text><text x="18" y="82" class="body">Civic track first</text><text x="18" y="103" class="small">Proof off by default</text></g>
  <path d="M688 335h22" stroke="#112b38" stroke-width="3"/><path d="m705 329 8 6-8 6" fill="none" stroke="#112b38" stroke-width="3"/>
  <g transform="translate(720 276)"><rect width="170" height="118" rx="14" fill="#fff5dd" stroke="#b97800" stroke-width="3" stroke-dasharray="9 6"/><text x="18" y="28" class="code">02 · PROOF</text><text x="18" y="58" class="h3">Proof</text><text x="18" y="82" class="body">Opt-in / announced</text><text x="18" y="103" class="small">bounded · 0 approvals</text></g>
  <path d="M898 335h22" stroke="#112b38" stroke-width="3"/><path d="m915 329 8 6-8 6" fill="none" stroke="#112b38" stroke-width="3"/>
  <g transform="translate(930 276)"><rect width="140" height="118" rx="14" fill="#fff0ec" stroke="#9a3d32" stroke-width="3"/><text x="16" y="28" class="code">03 · STOP</text><text x="16" y="58" class="h3">Failure / stop</text><text x="16" y="82" class="body">Isolate first</text><text x="16" y="103" class="small">0 real incidents</text></g>
  <path d="M1078 335h22" stroke="#112b38" stroke-width="3"/><path d="m1095 329 8 6-8 6" fill="none" stroke="#112b38" stroke-width="3"/>
  <g transform="translate(1110 276)"><rect width="126" height="118" rx="14" fill="#eaf2f6" stroke="#2f6177" stroke-width="3"/><text x="14" y="28" class="code">04 · RECOVER</text><text x="14" y="58" class="h3">Recover</text><text x="14" y="82" class="body">Ordinary first</text><text x="14" y="103" class="small">Restart NO-GO</text></g>

  <line x1="510" y1="428" x2="1236" y2="428" class="rule"/><text x="510" y="468" class="kicker">03 / THREE NON-INTERCHANGEABLE CARRIERS</text><text x="510" y="501" class="h2">Six questions, three different spatial carriers</text>
  <g transform="translate(510 535)"><rect width="222" height="326" rx="16" fill="#f8faf8" stroke="#112b38" stroke-width="2"/><text x="18" y="30" class="code">ZHONGZHIYUAN / VERIFY</text><text x="18" y="61" class="h3">Bypass + isolation edge</text><path d="M28 115h166" stroke="#2f735d" stroke-width="15" stroke-linecap="round"/><text x="28" y="102" class="small">continuous observation bypass</text><rect x="48" y="154" width="126" height="72" rx="8" fill="url(#dots)" stroke="#b97800" stroke-width="3" stroke-dasharray="8 5"/><text x="70" y="183" class="small">conditional proof court</text><text x="70" y="207" class="small">equipment off-route</text><path d="M40 242h142" stroke="#9a3d32" stroke-width="5"/><circle cx="182" cy="242" r="9" fill="#fff" stroke="#9a3d32" stroke-width="4"/><text x="28" y="280" class="body">physical stop → isolate</text><text x="28" y="304" class="body">bypass stays → restore</text><text x="28" y="326" class="tiny">RELATIONSHIP · NOT SITE PLAN</text></g>
  <g transform="translate(752 535)"><rect width="222" height="326" rx="16" fill="#f8faf8" stroke="#112b38" stroke-width="2"/><text x="18" y="30" class="code">ORIGIN / CO-CREATE</text><text x="18" y="61" class="h3">Street + 2 courts + 4 nodes</text><path d="M28 132h166" stroke="#2f735d" stroke-width="15" stroke-linecap="round"/><text x="28" y="111" class="small">continuous resident street</text><rect x="38" y="162" width="62" height="62" rx="8" fill="url(#dots)" stroke="#b97800" stroke-width="3"/><rect x="122" y="162" width="62" height="62" rx="8" fill="url(#dots)" stroke="#b97800" stroke-width="3"/><circle cx="45" cy="132" r="7" fill="#fff" stroke="#112b38" stroke-width="3"/><circle cx="88" cy="132" r="7" fill="#fff" stroke="#112b38" stroke-width="3"/><circle cx="132" cy="132" r="7" fill="#fff" stroke="#112b38" stroke-width="3"/><circle cx="176" cy="132" r="7" fill="#fff" stroke="#112b38" stroke-width="3"/><text x="28" y="260" class="body">consent / withdrawal by node</text><text x="28" y="284" class="body">capture stops; street stays</text><text x="28" y="326" class="tiny">RELATIONSHIP · NOT SITE PLAN</text></g>
  <g transform="translate(994 535)"><rect width="242" height="326" rx="16" fill="#f8faf8" stroke="#112b38" stroke-width="2"/><text x="18" y="30" class="code">DAZHONGSI / PUBLISH</text><text x="18" y="61" class="h3">Four-way commute + side hall</text><path d="M121 94v158M38 173h166" stroke="#2f735d" stroke-width="16" stroke-linecap="round"/><circle cx="121" cy="173" r="24" fill="#fff" stroke="#112b38" stroke-width="3"/><text x="101" y="179" class="small">CLEAR</text><rect x="154" y="94" width="62" height="58" rx="8" fill="url(#dots)" stroke="#b97800" stroke-width="3"/><text x="163" y="119" class="tiny">SOURCE</text><text x="162" y="136" class="tiny">REPAIR</text><text x="28" y="280" class="body">withdraw release; commute stays</text><text x="28" y="304" class="body">show staff only if confirmed</text><text x="28" y="326" class="tiny">RELATIONSHIP · NOT STATION PLAN</text></g>

  <rect x="1290" y="164" width="474" height="762" rx="20" class="panel"/>
  <text x="1320" y="204" class="kicker">04 / CIVIC TIMETABLE IS NOT A CLOCK</text><text x="1320" y="238" class="h2">A civic timetable never pretends</text><text x="1320" y="262" class="h2">to be an operating roster</text><text x="1320" y="282" class="body">Each row exposes concept window, reality status, and stop action.</text>
  <g transform="translate(1320 298)"><rect width="414" height="102" rx="12" fill="#e9f2ed" stroke="#2f735d" stroke-width="2"/><text x="18" y="27" class="code">ORDINARY-FIRST · TYPE WINDOW</text><text x="18" y="54" class="h3">Concept window, not operating hours</text><text x="18" y="78" class="body">Real times / opening / staff: unknown</text><text x="300" y="78" class="small">PROOF OFF</text></g>
  <g transform="translate(1320 412)"><rect width="414" height="102" rx="12" fill="#f1f2ef" stroke="#536a75" stroke-width="2" stroke-dasharray="8 6"/><text x="18" y="27" class="code">QUIET / SCREEN-FREE · TYPE WINDOW</text><text x="18" y="54" class="h3">Quiet / screen-free / resident first</text><text x="18" y="78" class="body">Real times, night shift, noise and light: unknown</text></g>
  <g transform="translate(1320 526)"><rect width="414" height="102" rx="12" fill="#fff5dd" stroke="#b97800" stroke-width="2"/><text x="18" y="27" class="code">PROOF · CONDITIONAL ONLY</text><text x="18" y="54" class="h3">Candidate after notice / approval / duty</text><text x="18" y="78" class="body">0 schedules · 0 approvals · 0 real service</text></g>
  <g transform="translate(1320 640)"><rect width="414" height="102" rx="12" fill="#fff0ec" stroke="#9a3d32" stroke-width="2"/><text x="18" y="27" class="code">FAILURE → RECOVERY</text><text x="18" y="54" class="h3">Stop proof → tell human truth → ordinary first</text><text x="18" y="78" class="body">0 real incidents · recovery duration unknown</text></g>
  <g transform="translate(1320 770)"><text x="0" y="0" class="kicker">TRUTH RULES</text><text x="0" y="30" class="body">• Never encode state by colour alone</text><text x="0" y="54" class="body">• Never show staff online without confirmation</text><text x="0" y="78" class="body">• Missing/conflicting carriers publish safest state</text><text x="0" y="102" class="body">• Ordinary non-AI route before proof restart</text></g>

