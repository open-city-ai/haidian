<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">评审收束与专业深化交接</title>
  <desc id="desc">一概念、三原型、一内核、六项任务、八类现实数据替换、七专业接手和 NO-GO 停止线。全部为 G0 概念。</desc>
  <defs>
    <style>
      .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#17324d}.h{font-weight:800}.m{fill:#65758a}.w{fill:#fff}.s{font-size:22px}.xs{font-size:18px}.label{font-size:17px;font-weight:700;letter-spacing:1px}.line{stroke:#d4dee7;stroke-width:2}.dash{stroke:#167fa5;stroke-width:4;stroke-dasharray:11 9;fill:none}.civic{stroke:#087e68;stroke-width:7;fill:none}.stop{stroke:#c74f3c;stroke-width:4;fill:none}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#f3f6f7"/>
  <rect x="0" y="0" width="1800" height="130" fill="#17324d"/>
  <text class="t w h" x="70" y="60" font-size="38">评审收束与专业深化交接</text>
  <text class="t" x="70" y="99" font-size="22" fill="#d7e5ec">双轨京张 · 冻结空间语法，只替换现实缺口</text>
  <rect x="1400" y="33" width="330" height="64" rx="14" fill="#2a465f" stroke="#7ea7b8"/>
  <text class="t w h" x="1565" y="73" text-anchor="middle" font-size="20">G0 · NO-GO · 临时边界</text>

  <rect x="55" y="165" width="820" height="380" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="85" y="204" fill="#087e68">A · 90 秒核心读法</text>
  <text class="t h" x="85" y="252" font-size="28">一概念</text>
  <text class="t h" x="240" y="252" font-size="28" fill="#087e68">双轨京张</text>
  <path class="civic" d="M90 292 H805"/>
  <path class="dash" d="M210 328 H405 M505 328 H720"/>
  <text class="t xs" x="90" y="370">连续日常轨：普通通行、非 AI、无屏、人工服务始终先成立</text>
  <text class="t xs" x="90" y="402">间歇验证轨：自愿、公告、限域、可停止、可拆除，不是连续占地</text>
  <text class="t h" x="90" y="448" font-size="22">三原型</text>
  <rect x="200" y="420" width="195" height="78" rx="14" fill="#e4f3ed" stroke="#7db7a3"/>
  <rect x="415" y="420" width="195" height="78" rx="14" fill="#e7f1f6" stroke="#82afc1"/>
  <rect x="630" y="420" width="195" height="78" rx="14" fill="#fff2dc" stroke="#d6ab62"/>
  <text class="t h" x="297" y="450" text-anchor="middle" font-size="18">众智园</text><text class="t xs" x="297" y="478" text-anchor="middle">隔离 / 停止 / 恢复</text>
  <text class="t h" x="512" y="450" text-anchor="middle" font-size="18">原点社区</text><text class="t xs" x="512" y="478" text-anchor="middle">街院 / 撤回 / 静音</text>
  <text class="t h" x="727" y="450" text-anchor="middle" font-size="18">大钟寺</text><text class="t xs" x="727" y="478" text-anchor="middle">通勤 / 纠错 / 人工</text>
  <text class="t xs h" x="90" y="526">一内核：JZ-AIOS + G0—G3 + 证据门 + 权利边界；四条状态轴始终分离</text>

  <rect x="910" y="165" width="835" height="380" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="940" y="204" fill="#167fa5">B · 六项任务，六个评审问题</text>
  <g font-size="18">
    <rect x="940" y="228" width="370" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="962" y="258">1 总体概念</text><text class="t" x="962" y="286">空间关系，还是口号？</text>
    <rect x="1330" y="228" width="385" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="1352" y="258">2 创新生态</text><text class="t" x="1352" y="286">空间、要素、公共价值是否闭合？</text>
    <rect x="940" y="328" width="370" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="962" y="358">3 AI+ 场景</text><text class="t" x="962" y="386">能否人工复核、停止并回到普通？</text>
    <rect x="1330" y="328" width="385" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="1352" y="358">4 公共空间</text><text class="t" x="1352" y="386">非 AI、无障碍、日常是否先成立？</text>
    <rect x="940" y="428" width="370" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="962" y="458">5 文化叙事</text><text class="t" x="962" y="486">可核验、可纠错、无屏可达？</text>
    <rect x="1330" y="428" width="385" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="1352" y="458">6 长期运营</text><text class="t" x="1352" y="486">服务普通日常，还是活动热度？</text>
  </g>

  <rect x="55" y="580" width="1120" height="405" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="85" y="620" fill="#b67610">C · 八类现实资料到位后，触发替换与复算</text>
  <g font-size="17">
    <rect x="85" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="105" y="680">D01 官方几何</text><text class="t" x="105" y="708">比对 / 替换 / 面积复算</text><text class="t m" x="105" y="732">当前 provisional_only</text>
    <rect x="350" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="370" y="680">D02 现状测绘</text><text class="t" x="370" y="708">核实 / 修正 / 删除关系</text><text class="t m" x="370" y="732">当前 not_measured</text>
    <rect x="615" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="635" y="680">D03 控规权属</text><text class="t" x="635" y="708">冲突审查先于落位</text><text class="t m" x="635" y="732">当前 not_authorized</text>
    <rect x="880" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="900" y="680">D04 同权共测</text><text class="t" x="900" y="708">分群验证 / 改图</text><text class="t m" x="900" y="732">当前 design intent</text>
    <rect x="85" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="105" y="800">D05 交通高峰</text><text class="t" x="105" y="828">压力测试普通通行</text><text class="t m" x="105" y="852">当前 conceptual</text>
    <rect x="350" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="370" y="800">D06 专项约束</text><text class="t" x="370" y="828">可覆盖或删除概念</text><text class="t m" x="370" y="852">当前 not verified</text>
    <rect x="615" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="635" y="800">D07 责任运营</text><text class="t" x="635" y="828">确认前不得排期试用</text><text class="t m" x="635" y="852">当前 role types only</text>
    <rect x="880" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="900" y="800">D08 权利复用</text><text class="t" x="900" y="828">清权前阻断对外复用</text><text class="t m" x="900" y="852">not_fully_cleared</text>
  </g>
  <path d="M100 914 H1130" stroke="#b67610" stroke-width="3" marker-end="url(#none)"/>
  <text class="t xs h" x="85" y="951">冻结空间语法 → 替换类型化占位 → 复算全部下游 → 专业复核 → 同步三载体、PDF、manifest 与权利台账</text>

  <rect x="1210" y="580" width="535" height="405" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="1240" y="620" fill="#c74f3c">D · 七专业接手与停止线</text>
  <g font-size="18">
    <text class="t" x="1240" y="662">01 规划 / 城市设计</text><text class="t" x="1490" y="662">02 景观 / 无障碍</text>
    <text class="t" x="1240" y="700">03 交通</text><text class="t" x="1490" y="700">04 建筑 / 公共界面</text>
    <text class="t" x="1240" y="738">05 铁路 / 文保 / 市政 / 消防</text>
    <text class="t" x="1240" y="776">06 数据 / AI / 权利</text><text class="t" x="1490" y="776">07 运营 / 社区</text>
  </g>
  <rect x="1240" y="815" width="475" height="82" rx="14" fill="#fff0ec" stroke="#cf6a58" stroke-width="2"/>
  <text class="t h" x="1477" y="848" text-anchor="middle" font-size="23" fill="#b53e2f">任一重大缺口 = NO-GO</text>
  <text class="t" x="1477" y="877" text-anchor="middle" font-size="17">先保普通权利，停验证叠层，再修正或退役</text>
  <text class="t xs" x="1240" y="932">现实替换材料 0 · 专业责任接受 0</text>
  <text class="t xs" x="1240" y="960">99 槽已提交 0 · 批准 0 · 现场测试 0 · GO 0</text>

  <rect x="55" y="1015" width="1690" height="55" rx="12" fill="#17324d"/>
  <text class="t w" x="80" y="1050" font-size="18">概念建议 / G0 / 临时边界 / 非比例 · 文件或 PR 通过不等于场地、规划、建设、运营、权利或部署授权</text>
</svg>
