<text x="970" y="392" text-anchor="start" fill="#112233" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="970" dy="0">连续日常基底</tspan></text>
<text x="970" y="425" text-anchor="start" fill="#657487" font-family="Noto Sans SC, Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" text-rendering="geometricPrecision"><tspan x="970" dy="0">步行、停留、办事、静音、无屏、人工与离开先完整</tspan><tspan x="970" dy="23">活动和设备不得切断。</tspan></text>
