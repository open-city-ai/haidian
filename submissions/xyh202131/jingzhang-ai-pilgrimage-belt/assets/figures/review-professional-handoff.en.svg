<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Review Synthesis and Professional Handoff</title>
  <desc id="desc">One concept, three prototypes, one kernel, six duties, eight real-data replacements, seven disciplines, and a NO-GO stop line. All content remains G0 concept.</desc>
  <defs>
    <style>
      .t{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#17324d}.h{font-weight:800}.m{fill:#65758a}.w{fill:#fff}.xs{font-size:17px}.label{font-size:17px;font-weight:800;letter-spacing:1px}.dash{stroke:#167fa5;stroke-width:4;stroke-dasharray:11 9;fill:none}.civic{stroke:#087e68;stroke-width:7;fill:none}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#f3f6f7"/>
  <rect width="1800" height="130" fill="#17324d"/>
  <text class="t w h" x="70" y="60" font-size="36">Review Synthesis and Professional Handoff</text>
  <text x="70" y="99" font-family="Inter,Segoe UI,Arial" font-size="21" fill="#d7e5ec">Twin-track Jing-Zhang · freeze the spatial grammar, replace real-world gaps</text>
  <rect x="1400" y="33" width="330" height="64" rx="14" fill="#2a465f" stroke="#7ea7b8"/>
  <text class="t w h" x="1565" y="73" text-anchor="middle" font-size="20">G0 · NO-GO · provisional</text>

  <rect x="55" y="165" width="820" height="380" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="85" y="204" fill="#087e68">A · THE 90-SECOND READING</text>
  <text class="t h" x="85" y="252" font-size="27">ONE CONCEPT</text><text class="t h" x="315" y="252" font-size="27" fill="#087e68">TWIN-TRACK JING-ZHANG</text>
  <path class="civic" d="M90 292 H805"/><path class="dash" d="M210 328 H405 M505 328 H720"/>
  <text class="t xs" x="90" y="370">Civic track: ordinary movement, non-AI, screen-free and staffed service work first</text>
  <text class="t xs" x="90" y="402">Proof track: voluntary, announced, bounded, stoppable and removable—not continuous land</text>
  <text class="t h" x="90" y="463" font-size="18">3 PROTOTYPES</text>
  <rect x="245" y="420" width="185" height="78" rx="14" fill="#e4f3ed" stroke="#7db7a3"/>
  <rect x="465" y="420" width="175" height="78" rx="14" fill="#e7f1f6" stroke="#82afc1"/>
  <rect x="655" y="420" width="175" height="78" rx="14" fill="#fff2dc" stroke="#d6ab62"/>
  <text class="t h" x="337" y="449" text-anchor="middle" font-size="16">ZHONGZHIYUAN</text><text class="t" x="337" y="477" text-anchor="middle" font-size="15">isolate / stop / restore</text>
  <text class="t h" x="552" y="449" text-anchor="middle" font-size="17">ORIGIN</text><text class="t" x="552" y="477" text-anchor="middle" font-size="15">street / withdraw / quiet</text>
  <text class="t h" x="742" y="449" text-anchor="middle" font-size="17">DAZHONGSI</text><text class="t" x="742" y="477" text-anchor="middle" font-size="15">commute / correct / staff</text>
  <text class="t xs h" x="90" y="526">ONE KERNEL: JZ-AIOS + G0–G3 + evidence gates + rights; four state axes stay separate</text>

  <rect x="910" y="165" width="835" height="380" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="940" y="204" fill="#167fa5">B · SIX DUTIES, SIX REVIEW QUESTIONS</text>
  <g font-size="17">
    <rect x="940" y="228" width="370" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="962" y="258">1 MASTER CONCEPT</text><text class="t" x="962" y="286">Spatial relation or slogan?</text>
    <rect x="1330" y="228" width="385" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="1352" y="258">2 ECOSYSTEM</text><text class="t" x="1352" y="286">Space + factors + public value?</text>
    <rect x="940" y="328" width="370" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="962" y="358">3 AI+ SCENARIOS</text><text class="t" x="962" y="386">Human review, stop, ordinary return?</text>
    <rect x="1330" y="328" width="385" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="1352" y="358">4 PUBLIC SPACE</text><text class="t" x="1352" y="386">Non-AI, access and daily life first?</text>
    <rect x="940" y="428" width="370" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="962" y="458">5 CULTURE</text><text class="t" x="962" y="486">Verifiable, correctable, screen-free?</text>
    <rect x="1330" y="428" width="385" height="82" rx="14" fill="#f5f8fa" stroke="#d4dee7"/><text class="t h" x="1352" y="458">6 OPERATIONS</text><text class="t" x="1352" y="486">Ordinary value or event heat?</text>
  </g>

  <rect x="55" y="580" width="1120" height="405" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="85" y="620" fill="#b67610">C · EIGHT REAL INPUTS TRIGGER REPLACEMENT + RECALCULATION</text>
  <g font-size="16">
    <rect x="85" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="105" y="680">D01 OFFICIAL GEOMETRY</text><text class="t" x="105" y="708">compare / replace / recalc</text><text class="t m" x="105" y="732">provisional_only</text>
    <rect x="350" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="370" y="680">D02 SITE SURVEY</text><text class="t" x="370" y="708">verify / revise / delete</text><text class="t m" x="370" y="732">not_measured</text>
    <rect x="615" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="635" y="680">D03 CONTROL + TITLE</text><text class="t" x="635" y="708">conflict check before siting</text><text class="t m" x="635" y="732">not_authorized</text>
    <rect x="880" y="650" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="900" y="680">D04 PUBLIC PARITY</text><text class="t" x="900" y="708">group test / redraw</text><text class="t m" x="900" y="732">design intent only</text>
    <rect x="85" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="105" y="800">D05 PEAK MOVEMENT</text><text class="t" x="105" y="828">stress-test civic route</text><text class="t m" x="105" y="852">conceptual</text>
    <rect x="350" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="370" y="800">D06 CONSTRAINTS</text><text class="t" x="370" y="828">override or remove concept</text><text class="t m" x="370" y="852">not verified</text>
    <rect x="615" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="635" y="800">D07 DUTY + OPERATION</text><text class="t" x="635" y="828">no schedule before proof</text><text class="t m" x="635" y="852">role types only</text>
    <rect x="880" y="770" width="245" height="96" rx="14" fill="#fff5df" stroke="#ddb970"/><text class="t h" x="900" y="800">D08 RIGHTS + REUSE</text><text class="t" x="900" y="828">block reuse until cleared</text><text class="t m" x="900" y="852">not_fully_cleared</text>
  </g>
  <text class="t xs h" x="85" y="925">FREEZE grammar → REPLACE placeholders → RECALCULATE downstream → VERIFY professionally</text>
  <text class="t xs" x="85" y="955">Then synchronize three carriers, bilingual figures/PDFs, manifest and the file-level rights ledger.</text>

  <rect x="1210" y="580" width="535" height="405" rx="24" fill="#fff" stroke="#ccd9e2" stroke-width="2"/>
  <text class="t label" x="1240" y="620" fill="#c74f3c">D · SEVEN DISCIPLINES + STOP LINE</text>
  <g font-size="17">
    <text class="t" x="1240" y="662">01 Planning / urban design</text><text class="t" x="1495" y="662">02 Landscape / access</text>
    <text class="t" x="1240" y="700">03 Transport</text><text class="t" x="1495" y="700">04 Architecture / interface</text>
    <text class="t" x="1240" y="738">05 Rail / heritage / municipal / fire</text>
    <text class="t" x="1240" y="776">06 Data / AI / rights</text><text class="t" x="1495" y="776">07 Operations / community</text>
  </g>
  <rect x="1240" y="815" width="475" height="82" rx="14" fill="#fff0ec" stroke="#cf6a58" stroke-width="2"/>
  <text class="t h" x="1477" y="848" text-anchor="middle" font-size="23" fill="#b53e2f">ANY MATERIAL GAP = NO-GO</text>
  <text class="t" x="1477" y="877" text-anchor="middle" font-size="16">protect civic rights, stop proof, revise or retire</text>
  <text class="t xs" x="1240" y="932">Real replacement inputs 0 · accepted duties 0</text>
  <text class="t xs" x="1240" y="960">99 slots submitted 0 · approvals 0 · field tests 0 · GO 0</text>

  <rect x="55" y="1015" width="1690" height="55" rx="12" fill="#17324d"/>
  <text x="80" y="1050" font-family="Inter,Segoe UI,Arial" font-size="17" fill="#fff">Concept / G0 / provisional / not to scale · file or PR PASS is not site, planning, construction, operation, rights, or deployment authorization</text>
</svg>
