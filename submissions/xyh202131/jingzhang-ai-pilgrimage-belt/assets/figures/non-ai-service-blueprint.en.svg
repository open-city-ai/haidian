<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Non-AI-First Public-Service Blueprint</title>
  <desc id="desc">Seven permanent public rights, a primary non-AI route and optional AI route to the same basic task, three place-specific services, four group acceptance structures, and a stop/recovery loop. Everything remains G0 and field results are unknown.</desc>
  <defs>
    <style>
      text{font-family:Arial,"Noto Sans",sans-serif;fill:#14243b}.h1{font-size:38px;font-weight:800;letter-spacing:1px}.sub{font-size:18px;fill:#526178}.cap{font-size:15px;font-weight:700;letter-spacing:1.2px}.chip{font-size:15px;font-weight:700}.ttl{font-size:22px;font-weight:800}.body{font-size:15px}.small{font-size:13px;fill:#526178}.tiny{font-size:11px;fill:#637087}.num{font-size:20px;font-weight:800}.white{fill:#fff}.muted{fill:#7c8799}.green{fill:#12765b}.blue{fill:#2769a8}.amber{fill:#b56b08}.orange{fill:#bd4d2d}
    </style>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#12765b"/></marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2769a8"/></marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd4d2d"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#f5f7f8"/><rect width="1800" height="118" fill="#13253d"/>
  <text x="70" y="54" class="h1 white">NON-AI-FIRST PUBLIC CITY</text>
  <text x="70" y="88" class="sub white">ONE BASIC TASK · TWO PATHS OF EQUAL DIGNITY</text>
  <rect x="1408" y="25" width="320" height="68" rx="10" fill="#203955" stroke="#67809b"/>
  <text x="1432" y="52" class="cap white">REALITY GATE</text><text x="1432" y="78" class="body white">G0 · approvals 0 · staff 0 · results unknown</text>

  <text x="70" y="157" class="cap muted">SEVEN PERMANENT PUBLIC RIGHTS</text>
  <g transform="translate(70 177)">
    <g><rect width="224" height="62" rx="12" fill="#e6f3ee" stroke="#75ae99"/><circle cx="29" cy="31" r="17" fill="#12765b"/><text x="29" y="38" text-anchor="middle" class="num white">1</text><text x="57" y="27" class="chip">No account or QR</text><text x="57" y="48" class="tiny">enter · serve · appeal · leave</text></g>
    <g transform="translate(239)"><rect width="224" height="62" rx="12" fill="#e6f3ee" stroke="#75ae99"/><circle cx="29" cy="31" r="17" fill="#12765b"/><text x="29" y="38" text-anchor="middle" class="num white">2</text><text x="57" y="27" class="chip">Complete non-AI path</text><text x="57" y="48" class="tiny">paper · oral · physical · staff</text></g>
    <g transform="translate(478)"><rect width="224" height="62" rx="12" fill="#e6f3ee" stroke="#75ae99"/><circle cx="29" cy="31" r="17" fill="#12765b"/><text x="29" y="38" text-anchor="middle" class="num white">3</text><text x="57" y="27" class="chip">Accessibility intent</text><text x="57" y="48" class="tiny">survey · co-test · review pending</text></g>
    <g transform="translate(717)"><rect width="224" height="62" rx="12" fill="#e9f0f8" stroke="#8ba9ca"/><circle cx="29" cy="31" r="17" fill="#2769a8"/><text x="29" y="38" text-anchor="middle" class="num white">4</text><text x="57" y="27" class="chip">Staffed handoff</text><text x="57" y="48" class="tiny">receive · explain · refuse · transfer</text></g>
    <g transform="translate(956)"><rect width="224" height="62" rx="12" fill="#fff3dc" stroke="#d4a85c"/><circle cx="29" cy="31" r="17" fill="#b56b08"/><text x="29" y="38" text-anchor="middle" class="num white">5</text><text x="57" y="27" class="chip">Withdraw consent</text><text x="57" y="48" class="tiny">passage and basic service remain</text></g>
    <g transform="translate(1195)"><rect width="224" height="62" rx="12" fill="#fff3dc" stroke="#d4a85c"/><circle cx="29" cy="31" r="17" fill="#b56b08"/><text x="29" y="38" text-anchor="middle" class="num white">6</text><text x="57" y="27" class="chip">Appeal + correction</text><text x="57" y="48" class="tiny">same queue · status · review</text></g>
    <g transform="translate(1434)"><rect width="224" height="62" rx="12" fill="#edf0f4" stroke="#aeb7c2"/><circle cx="29" cy="31" r="17" fill="#536273"/><text x="29" y="38" text-anchor="middle" class="num white">7</text><text x="57" y="27" class="chip">Screen-free + quiet</text><text x="57" y="48" class="tiny">daily passage and rest first</text></g>
  </g>

  <text x="70" y="282" class="cap muted">PUBLIC-SERVICE BLUEPRINT</text>
  <rect x="70" y="302" width="1660" height="300" rx="18" fill="#fff" stroke="#ced6de"/>
  <rect x="95" y="333" width="180" height="232" rx="14" fill="#eef2f5"/>
  <text x="185" y="371" text-anchor="middle" class="ttl">COMMON ENTRY</text><text x="185" y="401" text-anchor="middle" class="small">physical rights legend</text><text x="185" y="425" text-anchor="middle" class="small">six civic signals</text>
  <rect x="117" y="453" width="136" height="50" rx="25" fill="#13253d"/><text x="185" y="484" text-anchor="middle" class="chip white">NO SIGN-UP</text><text x="185" y="535" text-anchor="middle" class="tiny">no default collection</text>
  <path d="M275 420H340" stroke="#12765b" stroke-width="7" marker-end="url(#arrowG)"/><path d="M275 506H340" stroke="#2769a8" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arrowB)"/>

  <rect x="350" y="322" width="1090" height="108" rx="14" fill="#e6f3ee" stroke="#75ae99"/><text x="374" y="350" class="cap green">PRIMARY ROUTE / NON-AI FIRST</text>
  <g class="body"><rect x="370" y="365" width="150" height="45" rx="9" fill="#fff" stroke="#75ae99"/><text x="445" y="393" text-anchor="middle">Paper / oral task</text><path d="M520 388H550" stroke="#12765b" stroke-width="4" marker-end="url(#arrowG)"/>
  <rect x="560" y="365" width="145" height="45" rx="9" fill="#fff" stroke="#75ae99"/><text x="632" y="393" text-anchor="middle">Screen-free wait</text><path d="M705 388H735" stroke="#12765b" stroke-width="4" marker-end="url(#arrowG)"/>
  <rect x="745" y="355" width="174" height="65" rx="9" fill="#2769a8"/><text x="832" y="382" text-anchor="middle" class="white chip">DUAL-ENTRY DESK</text><text x="832" y="404" text-anchor="middle" class="tiny white">receive / explain / transfer</text><path d="M919 388H949" stroke="#12765b" stroke-width="4" marker-end="url(#arrowG)"/>
  <rect x="959" y="365" width="165" height="45" rx="9" fill="#fff" stroke="#75ae99"/><text x="1041" y="393" text-anchor="middle">Same basic task</text><path d="M1124 388H1154" stroke="#12765b" stroke-width="4" marker-end="url(#arrowG)"/>
  <rect x="1164" y="365" width="248" height="45" rx="9" fill="#fff" stroke="#75ae99"/><text x="1288" y="393" text-anchor="middle">Appeal / withdraw / correct / exit</text></g>

  <rect x="350" y="458" width="1090" height="86" rx="14" fill="#e9f0f8" stroke="#8ba9ca" stroke-dasharray="10 7"/><text x="374" y="486" class="cap blue">OPTIONAL AI — PLAIN-LANGUAGE DISCLOSURE + SEPARATE VOLUNTARY CONSENT</text>
  <rect x="630" y="497" width="205" height="34" rx="17" fill="#fff" stroke="#8ba9ca"/><text x="732" y="520" text-anchor="middle" class="small">bounded AI assistance</text><path d="M835 514H950" stroke="#2769a8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowB)"/><text x="1100" y="520" class="small">rejoins the same desk, outcome, and accountable queue</text>

  <rect x="1464" y="322" width="240" height="258" rx="14" fill="#fff0ec" stroke="#d68d78"/><text x="1584" y="354" text-anchor="middle" class="ttl orange">FAILURE SIDING</text>
  <text x="1486" y="385" class="body">1  stop automation</text><text x="1486" y="414" class="body">2  retain ordinary route</text><text x="1486" y="443" class="body">3  staffed accountable queue</text><text x="1486" y="472" class="body">4  remove temporary overlay</text><text x="1486" y="501" class="body">5  independent retest + restore</text><path d="M1465 548H1428" stroke="#bd4d2d" stroke-width="4" marker-end="url(#arrowO)"/><text x="1584" y="555" text-anchor="middle" class="tiny">if not closed: remain stopped or retire</text>

  <text x="70" y="646" class="cap muted">THREE PLACE-SPECIFIC INTERFACES — DO NOT COPY MECHANICALLY</text>
  <g transform="translate(70 665)">
    <rect width="530" height="225" rx="16" fill="#fff" stroke="#8ba9ca"/><rect width="530" height="48" rx="16" fill="#203955"/><rect y="32" width="530" height="16" fill="#203955"/><text x="22" y="32" class="ttl white">ZHONGZHIYUAN · VERIFY</text><text x="22" y="79" class="cap blue">BYPASS + PHYSICAL STATUS + STAFFED TAKEOVER</text><text x="22" y="111" class="body">Ordinary: observe / pass / paper stop or appeal</text><text x="22" y="140" class="body">Optional: bounded offline proof after future gates</text><text x="22" y="169" class="body orange">Stop: isolate equipment; retain the ordinary route</text><text x="22" y="198" class="small">Recover: remove kit, cables, enclosure, sound, light, queue; recheck</text>
    <rect x="565" width="530" height="225" rx="16" fill="#fff" stroke="#d4a85c"/><rect x="565" width="530" height="48" rx="16" fill="#6e5521"/><rect x="565" y="32" width="530" height="16" fill="#6e5521"/><text x="587" y="32" class="ttl white">ORIGIN COMMUNITY · CO-CREATE</text><text x="587" y="79" class="cap amber">DAILY STREET + SCREEN-FREE WAIT + WITHDRAWAL</text><text x="587" y="111" class="body">Ordinary: resident passage / oral-paper issue / staff</text><text x="587" y="140" class="body">Optional: voluntary learning separate from basic service</text><text x="587" y="169" class="body orange">Stop: stop collection; retain paper and staffed service</text><text x="587" y="198" class="small">Recover: remove screen, sound, event kit, and collection state</text>
    <rect x="1130" width="530" height="225" rx="16" fill="#fff" stroke="#75ae99"/><rect x="1130" width="530" height="48" rx="16" fill="#195b4d"/><rect x="1130" y="32" width="530" height="16" fill="#195b4d"/><text x="1152" y="32" class="ttl white">DAZHONGSI · PUBLISH</text><text x="1152" y="79" class="cap green">FOUR-WAY WALK + SOURCE STATE + DUAL-ENTRY DESK</text><text x="1152" y="111" class="body">Ordinary: commute / staffed task / paper correction</text><text x="1152" y="140" class="body">Optional: sourced navigation beside staffed service</text><text x="1152" y="169" class="body orange">Stop: automation offline; staff and source list remain</text><text x="1152" y="198" class="small">Recover: correct queue, clear event kit, retest four movement arms</text>
  </g>

  <text x="70" y="933" class="cap muted">GROUP-SPECIFIC ACCEPTANCE — NEVER HIDE EXCLUSION INSIDE AN OVERALL AVERAGE</text>
  <g transform="translate(70 951)">
    <rect width="390" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="20" y="31" class="chip">OLDER PEOPLE</text><text x="20" y="56" class="small">ask orally · wait screen-free · complete account-free</text><text x="326" y="34" class="cap orange">unknown</text>
    <rect x="414" width="390" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="434" y="31" class="chip">DISABLED / REDUCED MOBILITY</text><text x="434" y="56" class="small">same route · needed support · no activity obstruction</text><text x="740" y="34" class="cap orange">unknown</text>
    <rect x="828" width="390" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="848" y="31" class="chip">LOW DIGITAL LITERACY</text><text x="848" y="56" class="small">discover non-AI first · understand · query · correct</text><text x="1154" y="34" class="cap orange">unknown</text>
    <rect x="1242" width="418" height="76" rx="12" fill="#fff" stroke="#ced6de"/><text x="1262" y="31" class="chip">NO ACCOUNT / SMART DEVICE</text><text x="1262" y="56" class="small">same outcome · cost · queue · review</text><text x="1594" y="34" class="cap orange">unknown</text>
  </g>
  <line x1="70" y1="1052" x2="1730" y2="1052" stroke="#c7d0d9"/><text x="70" y="1080" class="small">Concept service contract · provisional geometry unchanged · not approved · not operated · no field test · rights not_fully_cleared</text><text x="1730" y="1080" text-anchor="end" class="small">JZ-NON-AI-PARITY-V2 · 2026-08-11</text>
</svg>
