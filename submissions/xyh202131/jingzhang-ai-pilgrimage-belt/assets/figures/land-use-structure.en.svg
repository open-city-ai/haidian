<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">Thirty-six concept envelopes grow along civic ground instead of forming a parcel checklist</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="168" class="sans sub" fill="#526675" text-anchor="start"><tspan x="56" dy="0">Colours denote function families only; irregular envelopes, six cross-links and three ground-level duties</tspan><tspan x="56" dy="25">describe urban structure without creating statutory land use or development intensity.</tspan></text>
