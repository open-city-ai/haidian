<title id="title">Thirty-six concept envelopes grow along civic ground instead of forming a parcel checklist</title><desc id="desc">Thirty-six numbered conceptual envelopes arranged as two irregular urban fronts along one continuous civic-ground spine, with six cross-links and three distinct public-ground duties.</desc>
