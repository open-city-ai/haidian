<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Industry–Public Value State Map: Problem-Led Industry and Talent Translation</title>
  <desc id="desc">The public-task lifecycle runs from problem publication through the problem-quality gate, fair small-team entry, offline prototyping, independent retest to result reflow and exit or retirement; four-axis separation distinguishes runtime, maturity, authorization and service states; the authorization ladder separates prototype procurement, limited trial, procurement and normal deployment, each requiring its own written authorization; public-benefit reflow does not depend on investment amounts. All content is G0 concept, not a statement of current status, approval, procurement, partnership or operation.</desc>
  <rect width="1800" height="1100" fill="#f5f3e9"/>
  <style>
    text{font-family:'Noto Sans','Arial',sans-serif;fill:#162c2b}
    .h1{font-size:40px;font-weight:700}.h2{font-size:24px;font-weight:700}.h3{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:13px}.foot{font-size:12px}.white{fill:#fff}.muted{fill:#556866}
    .line{stroke:#173d39;stroke-width:6;fill:none}.thin{stroke:#52736c;stroke-width:2;fill:none}.dash{stroke:#286f86;stroke-width:5;stroke-dasharray:14 12;fill:none}
  </style>
  <text x="70" y="65" class="h1">Industry–Public Value State Map</text>
  <text x="70" y="100" class="h2">Problem-led industry and talent translation</text>
  <text x="70" y="128" class="h2">Passing a test is not procurement or deployment authorization</text>
  <rect x="1240" y="38" width="490" height="90" rx="16" fill="#173d39"/>
  <text x="1265" y="72" class="h3 white">G0 · conceptual · provisional</text>
  <text x="1265" y="100" class="small white">mechanism only · tasks 0 · teams 0</text>
  <text x="1265" y="119" class="small white">retests 0 · written confirmations 0</text>

  <!-- A Public-task lifecycle -->
  <rect x="60" y="150" width="1680" height="250" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="192" class="h2">A  Public-task lifecycle | problem-quality gate first; any step fails fail-closed</text>
  <g>
    <rect x="90" y="220" width="205" height="130" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="110" y="252" class="h3">① Publication</text>
    <text x="110" y="278" class="small muted">Real public problem</text>
    <text x="110" y="300" class="small muted">No account needed</text>
    <text x="110" y="325" class="small" fill="#8a7338">Role to be confirmed</text>
    <path d="M300 285 H320" class="thin"/>
    <rect x="325" y="220" width="205" height="130" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="345" y="252" class="h3">② Quality gate</text>
    <text x="345" y="278" class="small muted">Falsifiable problem</text>
    <text x="345" y="300" class="small muted">Pass ≠ authorization</text>
    <text x="345" y="325" class="small" fill="#8a7338">Not passed, not queued</text>
    <path d="M535 285 H555" class="thin"/>
    <rect x="560" y="220" width="205" height="130" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="580" y="252" class="h3">③ Fair entry</text>
    <text x="580" y="278" class="small muted">No account barrier</text>
    <text x="580" y="300" class="small muted">Small teams in same pool</text>
    <text x="580" y="325" class="small" fill="#577c55">Manual + non-AI paths</text>
    <path d="M770 285 H790" class="thin"/>
    <rect x="795" y="220" width="205" height="130" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="815" y="252" class="h3">④ Prototype</text>
    <text x="815" y="278" class="small muted">Prototype ≠ purchase</text>
    <text x="815" y="300" class="small muted">IP boundary unresolved</text>
    <text x="815" y="325" class="small" fill="#577c55">G0 concept validation</text>
    <path d="M1005 285 H1025" class="thin"/>
    <rect x="1030" y="220" width="205" height="130" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="1050" y="252" class="h3">⑤ Retest gate</text>
    <text x="1050" y="278" class="small muted">Independent reviewer</text>
    <text x="1050" y="300" class="small muted">Retests run: 0</text>
    <text x="1050" y="325" class="small" fill="#286f86">Role to be confirmed</text>
    <path d="M1240 285 H1260" class="thin"/>
    <rect x="1265" y="220" width="205" height="130" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1285" y="252" class="h3">⑥ Result reflow</text>
    <text x="1285" y="278" class="small muted">To ordinary users</text>
    <text x="1285" y="300" class="small muted">No investment amounts</text>
    <text x="1285" y="325" class="small" fill="#577c55">Feedback ≠ promise</text>
    <path d="M1475 285 H1495" class="thin"/>
    <rect x="1500" y="220" width="210" height="130" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1520" y="252" class="h3">⑦ Exit</text>
    <text x="1520" y="278" class="small muted">Any failure closes</text>
    <text x="1520" y="300" class="small muted">Exit ≠ hiring ranking</text>
    <text x="1520" y="325" class="small" fill="#b75233">Ordinary path continues</text>
  </g>

  <!-- B Four-axis separation -->
  <rect x="60" y="420" width="1680" height="220" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="462" class="h2">B  Four-axis separation | one field cannot mean test, authorization, procurement and deployment</text>
  <g>
    <rect x="90" y="485" width="385" height="120" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="110" y="517" class="h3">Runtime state</text>
    <text x="110" y="543" class="small muted">Ordinary · validation · failure · recovery</text>
    <text x="110" y="568" class="small" fill="#8a7338">Ordinary state + manual service on</text>
    <rect x="500" y="485" width="385" height="120" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="520" y="517" class="h3">Maturity G0–G3</text>
    <text x="520" y="543" class="small muted">Concept—proposal—pilot—operation</text>
    <text x="520" y="568" class="small" fill="#577c55">All stay G0; not upgraded by figures</text>
    <rect x="910" y="485" width="385" height="120" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="930" y="517" class="h3">Authorization scope</text>
    <text x="930" y="543" class="small muted">Prototype·trial·procurement·deployment separated</text>
    <text x="930" y="568" class="small" fill="#286f86">Each: written authorization + validity</text>
    <rect x="1320" y="485" width="390" height="120" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="1340" y="517" class="h3">Service state</text>
    <text x="1340" y="543" class="small muted">What the public can currently access</text>
    <text x="1340" y="568" class="small" fill="#577c55">Currently 0 items; 0 written confirmations</text>
  </g>

  <!-- C Authorization ladder -->
  <rect x="60" y="660" width="1680" height="190" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="702" class="h2">C  Authorization ladder | prototype → limited trial → procurement → deployment; each separately authorized</text>
  <g>
    <rect x="90" y="725" width="370" height="95" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="110" y="757" class="h3">Prototype procurement</text>
    <text x="110" y="783" class="small muted">Validates method, not deployment</text>
    <text x="110" y="803" class="small" fill="#577c55">IP ownership agreed separately in writing</text>
    <path d="M470 772 H510" class="thin"/>
    <rect x="520" y="725" width="370" height="95" rx="16" fill="#dcebf0" stroke="#286f86" stroke-width="2"/>
    <text x="540" y="757" class="h3">Limited trial</text>
    <text x="540" y="783" class="small muted">Scope·responsibility·validity in writing</text>
    <text x="540" y="803" class="small" fill="#286f86">Normal operation cannot be inferred</text>
    <path d="M900 772 H940" class="thin"/>
    <rect x="950" y="725" width="370" height="95" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="970" y="757" class="h3">Procurement</text>
    <text x="970" y="783" class="small muted">Discussed after independent retest gate</text>
    <text x="970" y="803" class="small" fill="#8a7338">≠ deployment · has not occurred</text>
    <path d="M1330 772 H1370" class="thin"/>
    <rect x="1380" y="725" width="330" height="95" rx="16" fill="#f6dfd6" stroke="#b75233" stroke-width="2"/>
    <text x="1400" y="757" class="h3">Normal deployment</text>
    <text x="1400" y="783" class="small muted">Full authorization + accountable owner</text>
    <text x="1400" y="803" class="small" fill="#b75233">Not claimed</text>
  </g>

  <!-- D Public-benefit reflow -->
  <rect x="60" y="870" width="1680" height="190" rx="26" fill="#fff" stroke="#b9c7ba" stroke-width="2"/>
  <text x="90" y="912" class="h2">D  Public-benefit reflow | independent of investment amounts; back to ordinary corridor users</text>
  <g>
    <rect x="90" y="935" width="470" height="95" rx="16" fill="#dfe9d5" stroke="#577c55" stroke-width="2"/>
    <text x="110" y="967" class="h3">Task results + failure archives</text>
    <text x="110" y="993" class="small muted">Failure disclosure not used for hiring/ranking</text>
    <text x="110" y="1013" class="small" fill="#577c55">Published in understandable form</text>
    <path d="M570 982 H610" class="thin"/>
    <rect x="620" y="935" width="470" height="95" rx="16" fill="#e7efe9" stroke="#577c55" stroke-width="2"/>
    <text x="640" y="967" class="h3">Independent-retest conclusions</text>
    <text x="640" y="993" class="small muted">Decide continue·correct·stop·retire</text>
    <text x="640" y="1013" class="small" fill="#577c55">Few metrics that decide</text>
    <path d="M1100 982 H1140" class="thin"/>
    <rect x="1150" y="935" width="560" height="95" rx="16" fill="#f1e6c7" stroke="#8a7338" stroke-width="2"/>
    <text x="1170" y="967" class="h3">Ordinary corridor users</text>
    <text x="1170" y="993" class="small muted">Screen-free / non-AI / manual paths complete</text>
    <text x="1170" y="1013" class="small" fill="#8a7338">Feedback only feeds the next problem definition</text>
  </g>

  <text x="70" y="1084" class="foot muted">Legend: ▲ public fact ◆ public reporting ● in-package source ◎ mechanism contract (not occurred) | non-AI and manual paths stay continuous | restore ordinary state before revision</text>
</svg>
