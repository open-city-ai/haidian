<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">长期公共运营：普通日常怎样在四季计划、昼夜、故障与恢复中不断轨</title>
  <desc id="desc">全年普通日与无活动日是底板，问题季、开源季、城市 Beta 季和 Proof Week 仅为未排期的条件窗口；同一居民任务贯穿昼间、夜间或低人员、故障和恢复；八类角色接入场景护照、公共时刻表和证据矩阵；年度同时公开失败并作保持、修正、扩展或退役决定。全部为 G0 概念，不是排班、活动、预算、伙伴或运营结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506a66"/></marker>
    <pattern id="quietPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#65827b" stroke-width="3" opacity=".35"/></pattern>
  </defs>
  <rect width="1800" height="1100" fill="#f4f2e8"/>
  <style>
    text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#142c2b}
    .h1{font-size:42px;font-weight:700}.h2{font-size:25px;font-weight:700}.h3{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:13px}.white{fill:#fff}.muted{fill:#586b69}.red{fill:#a7442c}.green{fill:#426f58}.blue{fill:#236a82}.amber{fill:#8a6b2e}
    .panel{fill:#fff;stroke:#b7c5bb;stroke-width:2}.line{stroke:#506a66;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#236a82;stroke-width:4;stroke-dasharray:12 10;fill:none}.stop{stroke:#a7442c;stroke-width:5;stroke-dasharray:5 8;fill:none}
  </style>

  <text x="65" y="68" class="h1">长期公共运营：普通日常不断轨</text>
  <text x="65" y="104" class="h2">全年普通日优先｜四季计划是条件窗口｜同一居民任务贯穿昼／夜／故障／恢复</text>
  <rect x="1260" y="36" width="475" height="92" rx="16" fill="#173d39"/>
  <text x="1286" y="70" class="h3 white">G0 · 概念日历 · 临时边界</text>
  <text x="1286" y="98" class="body white">活动 0 · 班次 0 · 预算 0 · 伙伴 0 · 结果 unknown</text>
  <text x="1286" y="118" class="small white">不是排班、运营、采购、建设或部署授权</text>

  <!-- A calendar -->
  <rect x="55" y="150" width="1690" height="265" rx="25" class="panel"/>
  <text x="85" y="190" class="h2">A  全年公共时刻表｜普通公共日是底板，无活动日不是空档</text>
  <rect x="85" y="212" width="1630" height="56" rx="14" fill="#dfe9d5" stroke="#426f58" stroke-width="2"/>
  <text x="108" y="246" class="h3">全年普通日：连续日常轨 · 无账户/扫码 · 非 AI 完整任务 · 无屏信息 · 维护与投诉入口</text>
  <g>
    <rect x="85" y="286" width="230" height="96" rx="14" fill="url(#quietPattern)" stroke="#65827b" stroke-width="2"/>
    <text x="105" y="316" class="h3">无活动日</text><text x="105" y="341" class="small muted">设计上必须保留</text><text x="105" y="363" class="small red">确认日期 0</text>
    <path d="M325 334 H345" class="line"/>
    <rect x="355" y="286" width="275" height="96" rx="14" fill="#f1e5c5" stroke="#8a6b2e" stroke-width="2"/>
    <text x="375" y="316" class="h3">① 问题季</text><text x="375" y="341" class="small muted">口头/纸面/现场议题</text><text x="375" y="363" class="small amber">not_scheduled</text>
    <path d="M640 334 H660" class="line"/>
    <rect x="670" y="286" width="275" height="96" rx="14" fill="#e4ecd8" stroke="#426f58" stroke-width="2"/>
    <text x="690" y="316" class="h3">② 开源季</text><text x="690" y="341" class="small muted">纸面任务/来源/离线基线</text><text x="690" y="363" class="small green">not_scheduled</text>
    <path d="M955 334 H975" class="line"/>
    <rect x="985" y="286" width="315" height="96" rx="14" fill="#dceaf0" stroke="#236a82" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="1005" y="316" class="h3">③ 城市 Beta 季</text><text x="1005" y="341" class="small muted">未来获批限域叠层才可进入</text><text x="1005" y="363" class="small blue">not_scheduled / not_authorized</text>
    <path d="M1310 334 H1330" class="line"/>
    <rect x="1340" y="286" width="375" height="96" rx="14" fill="#f5ddd4" stroke="#a7442c" stroke-width="2"/>
    <text x="1360" y="316" class="h3">④ Proof Week／证据周</text><text x="1360" y="341" class="small muted">通过 + 失败 + 投诉 + 纠错 + 退役</text><text x="1360" y="363" class="small red">not_scheduled → 问题回流</text>
  </g>
  <text x="90" y="404" class="tiny muted">22:00—07:00 仅为继承的 G0 静音/无屏设计窗口，不是现实开放时段、夜班、噪声或照度承诺；活动不得占用普通路径。</text>

  <!-- B journey -->
  <rect x="55" y="435" width="1690" height="235" rx="25" class="panel"/>
  <text x="85" y="475" class="h2">B  同一居民任务｜进入 → 通行 → 读状态 → 提交/查询社区问题 → 离开</text>
  <g>
    <rect x="85" y="500" width="365" height="135" rx="16" fill="#e4ecd8" stroke="#426f58" stroke-width="2"/>
    <text x="105" y="532" class="h3">昼间 · 普通</text><text x="105" y="558" class="body">日常/无障碍意图线先行</text><text x="105" y="582" class="small muted">纸面双语 → 同任务非 AI</text><text x="105" y="607" class="small green">人工：在线/离线/unknown 如实显示</text>
    <path d="M460 568 H480" class="line"/>
    <rect x="490" y="500" width="365" height="135" rx="16" fill="url(#quietPattern)" stroke="#65827b" stroke-width="2"/>
    <text x="510" y="532" class="h3">夜间/低人员 · 普通静音</text><text x="510" y="558" class="body">普通路径、安全离开、无屏信息</text><text x="510" y="582" class="small muted">不虚构夜班，不用 AI 冒充人工</text><text x="510" y="607" class="small amber">验证/活动/扩声/屏幕关闭</text>
    <path d="M865 568 H885" class="line"/>
    <rect x="895" y="500" width="365" height="135" rx="16" fill="#f5ddd4" stroke="#a7442c" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="915" y="532" class="h3">故障 · 停止</text><text x="915" y="558" class="body">隔离验证叠层，普通非 AI 绕行</text><text x="915" y="582" class="small muted">停止权/交接角色待确认</text><text x="915" y="607" class="small red">三载体同事件保守回写</text>
    <path d="M1270 568 H1290" class="line"/>
    <rect x="1300" y="500" width="415" height="135" rx="16" fill="#dceaf0" stroke="#236a82" stroke-width="2"/>
    <text x="1320" y="532" class="h3">恢复 · 先还普通使用</text><text x="1320" y="558" class="body">路径/无屏/静音/同任务先恢复</text><text x="1320" y="582" class="small muted">根因 + 责任 + 复测 + 还场闭合</text><text x="1320" y="607" class="small blue">不自动升级 G0 或授权重启</text>
  </g>
  <text x="90" y="660" class="tiny muted">四窗恒定权利：无账户/扫码进入 · 非 AI 完整路径 · 无障碍意图待核 · 人工状态真实 · 可撤回 · 可申诉 · 无屏安静</text>

  <!-- C roles and writeback -->
  <rect x="55" y="690" width="1025" height="330" rx="25" class="panel"/>
  <text x="85" y="730" class="h2">C  角色责任 + 三载体回写｜角色类型 ≠ 人员/班次</text>
  <g>
    <rect x="85" y="755" width="215" height="74" rx="13" fill="#f1e5c5" stroke="#8a6b2e"/><text x="100" y="782" class="h3">普通服务</text><text x="100" y="807" class="small muted">同任务/安全拒绝</text>
    <rect x="315" y="755" width="215" height="74" rx="13" fill="#f1e5c5" stroke="#8a6b2e"/><text x="330" y="782" class="h3">社区议程</text><text x="330" y="807" class="small muted">口头/纸面/理由回执</text>
    <rect x="545" y="755" width="215" height="74" rx="13" fill="#f5ddd4" stroke="#a7442c"/><text x="560" y="782" class="h3">事故 + 停止</text><text x="560" y="807" class="small muted">接收/立即停</text>
    <rect x="775" y="755" width="275" height="74" rx="13" fill="#e4ecd8" stroke="#426f58"/><text x="790" y="782" class="h3">维护退役 + 权利复核</text><text x="790" y="807" class="small muted">劳动/资源/还场/隐私</text>
  </g>
  <text x="85" y="858" class="small muted">另有：证据回写 + 独立复核｜确认角色 0 · 人数 0 · 班次 0 · 值班表 0 · 志愿劳动时长 unknown</text>
  <path d="M565 875 V900" class="line"/>
  <g>
    <rect x="85" y="905" width="285" height="88" rx="14" fill="#e4ecd8" stroke="#426f58" stroke-width="2"/>
    <text x="105" y="936" class="h3">场景护照</text><text x="105" y="961" class="small muted">四轴 · 责任空缺 · 版本/到期</text><text x="105" y="981" class="tiny green">后台事实</text>
    <path d="M380 949 H400" class="line"/>
    <rect x="410" y="905" width="285" height="88" rx="14" fill="#dceaf0" stroke="#236a82" stroke-width="2"/>
    <text x="430" y="936" class="h3">公共时刻表</text><text x="430" y="961" class="small muted">普通/静音 · 人工状态 · 绕行</text><text x="430" y="981" class="tiny blue">公众现在能做什么</text>
    <path d="M705 949 H725" class="line"/>
    <rect x="735" y="905" width="315" height="88" rx="14" fill="#f1e5c5" stroke="#8a6b2e" stroke-width="2"/>
    <text x="755" y="936" class="h3">证据矩阵</text><text x="755" y="961" class="small muted">主张/锚点/申诉/复测/决定</text><text x="755" y="981" class="tiny amber">不能推出什么</text>
  </g>

  <!-- D annual decision -->
  <rect x="1100" y="690" width="645" height="330" rx="25" class="panel"/>
  <text x="1130" y="730" class="h2">D  年度公开与去留｜只报成功 = 失败</text>
  <rect x="1130" y="753" width="585" height="105" rx="15" fill="#f5ddd4" stroke="#a7442c" stroke-width="2"/>
  <text x="1150" y="782" class="h3">必须同时公开</text>
  <text x="1150" y="807" class="small">普通/无活动使用 · 失败/投诉/纠错 · 责任空缺 · 劳动</text>
  <text x="1150" y="831" class="small">维护/退役缺口 · 独立复测 · 本地公共收益 · 不同意见</text>
  <path d="M1422 867 V890" class="line"/>
  <g>
    <rect x="1130" y="900" width="132" height="70" rx="13" fill="#e4ecd8" stroke="#426f58"/><text x="1166" y="930" class="h3">保持</text><text x="1147" y="953" class="tiny muted">不自动扩展</text>
    <rect x="1275" y="900" width="132" height="70" rx="13" fill="#f1e5c5" stroke="#8a6b2e"/><text x="1311" y="930" class="h3">修正</text><text x="1291" y="953" class="tiny muted">新版本+责任</text>
    <rect x="1420" y="900" width="132" height="70" rx="13" fill="#dceaf0" stroke="#236a82" stroke-dasharray="7 5"/><text x="1456" y="930" class="h3">扩展</text><text x="1434" y="953" class="tiny muted">现实证据+授权</text>
    <rect x="1565" y="900" width="150" height="70" rx="13" fill="#f5ddd4" stroke="#a7442c"/><text x="1608" y="930" class="h3">退役</text><text x="1582" y="953" class="tiny muted">五类回执闭合</text>
  </g>
  <text x="1130" y="998" class="tiny muted">国际复测仅在改善本地决定/无障碍/维护/安全/普通服务时计收益；传播热度不计。</text>

  <text x="65" y="1055" class="small muted">图例：绿色实线=普通公共底板｜蓝色虚线=条件性验证/扩展｜红色点线=停止/退役｜斜线纹理=静音/无活动｜unknown≠0，0≠已完成</text>
  <text x="65" y="1080" class="small muted">十轮审计：双轨总纲未换牌 · 三处原型不互换 · 12 场景/8 项目/3 重点区不增加 · geometry 不变 · 全部 G0 / provisional / not_fully_cleared</text>
</svg>
