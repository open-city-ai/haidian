<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Field evidence intake and replacement pack</title>
  <desc id="desc">A route from provisional baseline through eight empty replacement packets, custody, seven professional gates and return, conflict, rejection, recalculation or expiry, with three differentiated future field routes. Field collections, approvals and professional acceptances are all zero.</desc>
  <defs><style>.t{font-family:Arial,"Noto Sans",sans-serif;fill:#17324d}.w{fill:#fff}.h{font-weight:700}.m{fill:#64758a}.s{font-size:16px}.box{fill:#fff;stroke:#cfdae3;stroke-width:2}.amber{fill:#fff4dd;stroke:#d5a54e;stroke-width:2}.blue{fill:#e9f3f7;stroke:#4b91ac;stroke-width:2}.green{fill:#e8f4ee;stroke:#4d9b7a;stroke-width:2}.red{fill:#fff0ec;stroke:#c76351;stroke-width:2}</style></defs>
  <rect width="1800" height="1100" fill="#f2f5f6"/><rect width="1800" height="132" fill="#17324d"/>
  <text class="t w h" x="68" y="58" font-size="38">Field evidence intake and replacement pack</text><text class="t" x="68" y="99" font-size="22" fill="#d8e5ec">D01-D08 empty packets × H01-H07 professional gates × three differentiated future routes</text>
  <rect x="1390" y="31" width="340" height="68" rx="14" fill="#2a465f" stroke="#88aabb"/><text class="t w h" x="1560" y="59" text-anchor="middle" font-size="19">Template ≠ evidence</text><text class="t w" x="1560" y="86" text-anchor="middle" font-size="17">0 collections · 0 approvals · G0 NO-GO</text>
  <rect class="box" x="50" y="165" width="1700" height="190" rx="22"/><text class="t h" x="82" y="207" font-size="23">A · Freeze the ordinary baseline before receiving material; no sample field value</text>
  <rect class="green" x="82" y="232" width="300" height="86" rx="14"/><text class="t h" x="232" y="260" text-anchor="middle" font-size="19">Ordinary public rights</text><text class="t" x="232" y="284" text-anchor="middle" font-size="14">movement / non-AI / screen-free</text><text class="t" x="232" y="304" text-anchor="middle" font-size="14">staffed alternative</text>
  <path d="M395 275 H475" stroke="#65758a" stroke-width="3"/><polygon points="475,275 460,266 460,284" fill="#65758a"/>
  <rect class="amber" x="490" y="220" width="690" height="112" rx="14"/><text class="t h" x="835" y="252" text-anchor="middle" font-size="20">Initial state of every D01-D08 packet</text><text class="t s" x="835" y="282" text-anchor="middle">not_collected · artifact_count 0 · field_value null</text><text class="t s" x="835" y="309" text-anchor="middle">source / time / version / rights / hash / limits remain empty</text>
  <path d="M1195 275 H1275" stroke="#65758a" stroke-width="3"/><polygon points="1275,275 1260,266 1260,284" fill="#65758a"/>
  <rect class="red" x="1290" y="232" width="420" height="86" rx="14"/><text class="t h" x="1500" y="263" text-anchor="middle" font-size="19">Any gap remains NO-GO</text><text class="t s" x="1500" y="293" text-anchor="middle">A complete form is not obtained evidence</text>
  <rect class="box" x="50" y="385" width="1080" height="305" rx="22"/><text class="t h" x="82" y="427" font-size="23">B · Eight replacement packets: record both proof and non-proof</text>
  <g font-size="14">
    <rect class="amber" x="82" y="452" width="235" height="92" rx="12"/><text class="t h" x="100" y="482">D01 Official geometry</text><text class="t" x="100" y="510">scope / CRS / version</text><text class="t m" x="100" y="533">≠ proposal approval</text>
    <rect class="amber" x="337" y="452" width="235" height="92" rx="12"/><text class="t h" x="355" y="482">D02 Condition survey</text><text class="t" x="355" y="510">coverage / method / precision</text><text class="t m" x="355" y="533">≠ all-time condition</text>
    <rect class="amber" x="592" y="452" width="235" height="92" rx="12"/><text class="t h" x="610" y="482">D03 Control and rights</text><text class="t" x="610" y="510">authority / conditions / expiry</text><text class="t m" x="610" y="533">≠ construction permit</text>
    <rect class="amber" x="847" y="452" width="235" height="92" rx="12"/><text class="t h" x="865" y="482">D04 Same-task parity</text><text class="t" x="865" y="510">groups / consent / withdrawal</text><text class="t m" x="865" y="533">≠ universal compliance</text>
    <rect class="amber" x="82" y="568" width="235" height="92" rx="12"/><text class="t h" x="100" y="598">D05 Transport peak</text><text class="t" x="100" y="622" font-size="12">denominator / window</text><text class="t" x="100" y="640" font-size="12">conflict · ≠ future demand</text>
    <rect class="amber" x="337" y="568" width="235" height="92" rx="12"/><text class="t h" x="355" y="598">D06 Specialist limits</text><text class="t" x="355" y="626">discipline / scope / veto</text><text class="t m" x="355" y="649">≠ all-discipline release</text>
    <rect class="amber" x="592" y="568" width="235" height="92" rx="12"/><text class="t h" x="610" y="598">D07 Duty and operation</text><text class="t" x="610" y="622" font-size="12">acceptance / backup</text><text class="t" x="610" y="640" font-size="12">resources · ≠ future availability</text>
    <rect class="amber" x="847" y="568" width="235" height="92" rx="12"/><text class="t h" x="865" y="598">D08 Rights and reuse</text><text class="t" x="865" y="626">asset / use / term</text><text class="t m" x="865" y="649">≠ package clearance</text>
  </g>
  <rect class="box" x="1160" y="385" width="590" height="305" rx="22"/><text class="t h" x="1192" y="427" font-size="23">C · Custody and professional disposition</text>
  <text class="t s" x="1192" y="468">identity → source → time/version → rights/privacy → SHA-256</text><text class="t s" x="1192" y="500">→ completeness/conflict → H01-H07 professional decision</text>
  <rect class="blue" x="1192" y="527" width="250" height="52" rx="10"/><text class="t h" x="1317" y="560" text-anchor="middle" font-size="17">return / conflict hold</text>
  <rect class="red" x="1462" y="527" width="250" height="52" rx="10"/><text class="t h" x="1587" y="560" text-anchor="middle" font-size="17">reject / expire</text>
  <rect class="green" x="1192" y="598" width="520" height="58" rx="10"/><text class="t h" x="1452" y="619" text-anchor="middle" font-size="14">Accepted for recalculation ≠ site / planning / build</text><text class="t h" x="1452" y="637" text-anchor="middle" font-size="14">or operation approval</text><text class="t" x="1452" y="652" text-anchor="middle" font-size="11">Professional evidence may revise, reject or delete the concept</text>
  <rect class="box" x="50" y="720" width="1700" height="300" rx="22"/><text class="t h" x="82" y="762" font-size="23">D · Three non-interchangeable future field routes (0 completed walks)</text>
  <rect class="green" x="82" y="790" width="510" height="185" rx="16"/><text class="t h" x="105" y="825" font-size="19">Zhongzhiyuan · isolation and restoration</text><text class="t s" x="105" y="858">Freeze observation bypass and before-state first</text><text class="t s" x="105" y="888">No activation; check isolation / stop / takeover fields only</text><text class="t s" x="105" y="918">Missing baseline or stop right → stop overlay, keep bypass</text><text class="t m" x="105" y="950" font-size="15">D02 / D06 / D07 · not a resident co-learning route</text>
  <rect class="blue" x="645" y="790" width="510" height="185" rx="16"/><text class="t h" x="668" y="825" font-size="19">Origin · consent and withdrawal</text><text class="t s" x="668" y="858">Daily street and screen-free same task stay complete</text><text class="t s" x="668" y="888">Paper/staffed consent; record group barriers, not identity</text><text class="t s" x="668" y="918">Safeguarding or quiet failure → stop collection</text><text class="t m" x="668" y="950" font-size="15">D04 / D07 / D08 · not an equipment test route</text>
  <rect class="amber" x="1208" y="790" width="510" height="185" rx="16"/><text class="t h" x="1231" y="825" font-size="19">Dazhongsi · peak and source correction</text><text class="t s" x="1231" y="858">Four-way commute stays; release and service sit off-route</text><text class="t s" x="1231" y="888">Count denominator / peak definition / source version start empty</text><text class="t s" x="1231" y="918">Route intrusion or source dispute → remove release overlay</text><text class="t m" x="1231" y="950" font-size="15">D02 / D05 / D08 · not a proof court</text>
  <rect x="50" y="1042" width="1700" height="38" rx="10" fill="#17324d"/><text class="t w" x="900" y="1068" text-anchor="middle" font-size="17">G0 concept method · provisional boundary · not to scale · no field data · no approval · no duty acceptance · not_fully_cleared</text>
</svg>
