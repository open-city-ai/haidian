<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Long-term civic operations: keeping ordinary public life continuous through seasons, day, night, failure and recovery</title>
  <desc id="desc">Ordinary and no-event days form the year-round base. Question Season, Open-source Season, Urban Beta Season and Proof Week are unscheduled conditional windows. The same resident task continues through day, night or low staffing, failure and recovery. Eight role types write back to the scenario passport, public timetable and evidence matrix. Annual disclosure includes failures and decides keep, correct, expand or retire. All content is G0 concept work, not a roster, event, budget, partner or performance claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#506a66"/></marker>
    <pattern id="quietPattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#65827b" stroke-width="3" opacity=".35"/></pattern>
  </defs>
  <rect width="1800" height="1100" fill="#f4f2e8"/>
  <style>
    text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#142c2b}
    .h1{font-size:36px;font-weight:700}.h2{font-size:25px;font-weight:700}.h3{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:13px}.white{fill:#fff}.muted{fill:#586b69}.red{fill:#a7442c}.green{fill:#426f58}.blue{fill:#236a82}.amber{fill:#8a6b2e}
    .panel{fill:#fff;stroke:#b7c5bb;stroke-width:2}.line{stroke:#506a66;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#236a82;stroke-width:4;stroke-dasharray:12 10;fill:none}.stop{stroke:#a7442c;stroke-width:5;stroke-dasharray:5 8;fill:none}
  </style>

  <text x="65" y="68" class="h1">Long-term civic operations: ordinary life stays continuous</text>
  <text x="65" y="104" class="h2">Ordinary days first | four conditional seasons | one task through day / night / failure / recovery</text>
  <rect x="1260" y="36" width="475" height="92" rx="16" fill="#173d39"/>
  <text x="1286" y="70" class="h3 white">G0 · concept calendar · provisional boundary</text>
  <text x="1286" y="98" class="body white">events 0 · shifts 0 · budgets 0 · partners 0 · results unknown</text>
  <text x="1286" y="118" class="small white">Not an operating, procurement, works or deployment approval</text>

  <!-- A calendar -->
  <rect x="55" y="150" width="1690" height="265" rx="25" class="panel"/>
  <text x="85" y="190" class="h2">A  Year-round public timetable | ordinary days are the base; no-event days are not gaps</text>
  <rect x="85" y="212" width="1630" height="56" rx="14" fill="#dfe9d5" stroke="#426f58" stroke-width="2"/>
  <text x="108" y="246" class="h3">All-year ordinary use: daily track · no account/QR · complete non-AI task · screen-free info · maintenance/complaints</text>
  <g>
    <rect x="85" y="286" width="230" height="96" rx="14" fill="url(#quietPattern)" stroke="#65827b" stroke-width="2"/>
    <text x="105" y="316" class="h3">No-event days</text><text x="105" y="341" class="small muted">must remain by design</text><text x="105" y="363" class="small red">confirmed dates 0</text>
    <path d="M325 334 H345" class="line"/>
    <rect x="355" y="286" width="275" height="96" rx="14" fill="#f1e5c5" stroke="#8a6b2e" stroke-width="2"/>
    <text x="375" y="316" class="h3">1  Question Season</text><text x="375" y="341" class="small muted">spoken / paper / on-site agenda</text><text x="375" y="363" class="small amber">not_scheduled</text>
    <path d="M640 334 H660" class="line"/>
    <rect x="670" y="286" width="275" height="96" rx="14" fill="#e4ecd8" stroke="#426f58" stroke-width="2"/>
    <text x="690" y="316" class="h3">2  Open-source Season</text><text x="690" y="341" class="small muted">paper task / provenance / offline base</text><text x="690" y="363" class="small green">not_scheduled</text>
    <path d="M955 334 H975" class="line"/>
    <rect x="985" y="286" width="315" height="96" rx="14" fill="#dceaf0" stroke="#236a82" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="1005" y="316" class="h3">3  Urban Beta Season</text><text x="1005" y="341" class="small muted">only a future approved bounded overlay</text><text x="1005" y="363" class="small blue">not_scheduled / not_authorized</text>
    <path d="M1310 334 H1330" class="line"/>
    <rect x="1340" y="286" width="375" height="96" rx="14" fill="#f5ddd4" stroke="#a7442c" stroke-width="2"/>
    <text x="1360" y="316" class="h3">4  Proof Week</text><text x="1360" y="341" class="small muted">passes + failures + complaints + fixes + retirement</text><text x="1360" y="363" class="small red">not_scheduled → agenda return</text>
  </g>
  <text x="90" y="404" class="tiny muted">22:00–07:00 is an inherited G0 quiet/screen-free design window—not real opening hours, night shifts, noise or lighting promises. Events never occupy the ordinary path.</text>

  <!-- B journey -->
  <rect x="55" y="435" width="1690" height="235" rx="25" class="panel"/>
  <text x="85" y="475" class="h2">B  The same resident task | enter → pass through → read status → submit/check an issue → leave</text>
  <g>
    <rect x="85" y="500" width="365" height="135" rx="16" fill="#e4ecd8" stroke="#426f58" stroke-width="2"/>
    <text x="105" y="532" class="h3">Day · ordinary</text><text x="105" y="558" class="body">daily/accessibility desire line first</text><text x="105" y="582" class="small muted">bilingual paper → same non-AI task</text><text x="105" y="607" class="small green">human status: online/offline/unknown, stated truthfully</text>
    <path d="M460 568 H480" class="line"/>
    <rect x="490" y="500" width="365" height="135" rx="16" fill="url(#quietPattern)" stroke="#65827b" stroke-width="2"/>
    <text x="510" y="532" class="h3">Night/low staffing · quiet</text><text x="510" y="558" class="body">ordinary path, safe exit, screen-free info</text><text x="510" y="582" class="small muted">no invented shift; AI never impersonates staff</text><text x="510" y="607" class="small amber">validation/events/amplification/screens off</text>
    <path d="M865 568 H885" class="line"/>
    <rect x="895" y="500" width="365" height="135" rx="16" fill="#f5ddd4" stroke="#a7442c" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="915" y="532" class="h3">Failure · stop</text><text x="915" y="558" class="body">isolate validation; non-AI ordinary detour</text><text x="915" y="582" class="small muted">stop and handover roles remain unconfirmed</text><text x="915" y="607" class="small red">conservative writeback to all three carriers</text>
    <path d="M1270 568 H1290" class="line"/>
    <rect x="1300" y="500" width="415" height="135" rx="16" fill="#dceaf0" stroke="#236a82" stroke-width="2"/>
    <text x="1320" y="532" class="h3">Recovery · ordinary use first</text><text x="1320" y="558" class="body">restore path/screen-free/quiet/same task first</text><text x="1320" y="582" class="small muted">close root cause + duty + retest + reinstatement</text><text x="1320" y="607" class="small blue">no automatic G0 upgrade or restart approval</text>
  </g>
  <text x="90" y="660" class="tiny muted">Rights constant across all windows: no account/QR · complete non-AI route · accessibility intent pending survey · truthful human status · withdraw · appeal · screen-free quiet</text>

  <!-- C roles and writeback -->
  <rect x="55" y="690" width="1025" height="330" rx="25" class="panel"/>
  <text x="85" y="730" class="h2">C  Role duties + three-carrier writeback | role types ≠ staff or shifts</text>
  <g>
    <rect x="85" y="755" width="215" height="74" rx="13" fill="#f1e5c5" stroke="#8a6b2e"/><text x="100" y="782" class="h3">Ordinary service</text><text x="100" y="807" class="small muted">same task / safe refusal</text>
    <rect x="315" y="755" width="215" height="74" rx="13" fill="#f1e5c5" stroke="#8a6b2e"/><text x="330" y="782" class="h3">Community agenda</text><text x="330" y="807" class="small muted">spoken/paper/reasoned receipt</text>
    <rect x="545" y="755" width="215" height="74" rx="13" fill="#f5ddd4" stroke="#a7442c"/><text x="560" y="782" class="h3">Incident + stop</text><text x="560" y="807" class="small muted">receive / immediate stop</text>
    <rect x="775" y="755" width="275" height="74" rx="13" fill="#e4ecd8" stroke="#426f58"/><text x="790" y="782" class="h3">Maintenance + retirement</text><text x="790" y="807" class="small muted">labour/resources/reinstate/rights</text>
  </g>
  <text x="85" y="858" class="small muted">Also: evidence writeback + independent review | confirmed roles 0 · people 0 · shifts 0 · duty rosters 0 · volunteer hours unknown</text>
  <path d="M565 875 V900" class="line"/>
  <g>
    <rect x="85" y="905" width="285" height="88" rx="14" fill="#e4ecd8" stroke="#426f58" stroke-width="2"/>
    <text x="105" y="936" class="h3">Scenario passport</text><text x="105" y="961" class="small muted">four axes · duty gaps · version/expiry</text><text x="105" y="981" class="tiny green">backstage facts</text>
    <path d="M380 949 H400" class="line"/>
    <rect x="410" y="905" width="285" height="88" rx="14" fill="#dceaf0" stroke="#236a82" stroke-width="2"/>
    <text x="430" y="936" class="h3">Public timetable</text><text x="430" y="961" class="small muted">ordinary/quiet · human status · detour</text><text x="430" y="981" class="tiny blue">what the public can do now</text>
    <path d="M705 949 H725" class="line"/>
    <rect x="735" y="905" width="315" height="88" rx="14" fill="#f1e5c5" stroke="#8a6b2e" stroke-width="2"/>
    <text x="755" y="936" class="h3">Evidence matrix</text><text x="755" y="961" class="small muted">claim/anchor/appeal/retest/decision</text><text x="755" y="981" class="tiny amber">what cannot be inferred</text>
  </g>

  <!-- D annual decision -->
  <rect x="1100" y="690" width="645" height="330" rx="25" class="panel"/>
  <text x="1130" y="730" class="h2">D  Annual disclosure + disposition | success-only = failure</text>
  <rect x="1130" y="753" width="585" height="105" rx="15" fill="#f5ddd4" stroke="#a7442c" stroke-width="2"/>
  <text x="1150" y="782" class="h3">Publish together</text>
  <text x="1150" y="807" class="small">ordinary/no-event use · failures/complaints/fixes · duty gaps · labour</text>
  <text x="1150" y="831" class="small">maintenance/retirement gaps · independent retest · local benefit · dissent</text>
  <path d="M1422 867 V890" class="line"/>
  <g>
    <rect x="1130" y="900" width="132" height="70" rx="13" fill="#e4ecd8" stroke="#426f58"/><text x="1166" y="930" class="h3">KEEP</text><text x="1147" y="953" class="tiny muted">no auto expansion</text>
    <rect x="1275" y="900" width="132" height="70" rx="13" fill="#f1e5c5" stroke="#8a6b2e"/><text x="1300" y="930" class="h3">CORRECT</text><text x="1291" y="953" class="tiny muted">new version + duty</text>
    <rect x="1420" y="900" width="132" height="70" rx="13" fill="#dceaf0" stroke="#236a82" stroke-dasharray="7 5"/><text x="1444" y="930" class="h3">EXPAND</text><text x="1434" y="953" class="tiny muted">evidence + approval</text>
    <rect x="1565" y="900" width="150" height="70" rx="13" fill="#f5ddd4" stroke="#a7442c"/><text x="1599" y="930" class="h3">RETIRE</text><text x="1582" y="953" class="tiny muted">five receipts closed</text>
  </g>
  <text x="1130" y="998" class="tiny muted">Remote retest must improve local public service; publicity does not count.</text>

  <text x="65" y="1055" class="small muted">Legend: green solid=ordinary base | blue dash=conditional validation/expansion | red dot=stop/retire | hatch=quiet/no-event | unknown≠0; 0≠complete</text>
  <text x="65" y="1080" class="small muted">Ten-round audit: Twin-track unchanged · three prototypes not interchangeable · 12 scenes/8 projects/3 areas unchanged · geometry unchanged · all G0/provisional/not_fully_cleared</text>
</svg>
