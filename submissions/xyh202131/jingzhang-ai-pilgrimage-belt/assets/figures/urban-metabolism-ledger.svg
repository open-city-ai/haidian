<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">京张 AI 城市代谢账本</title>
  <desc id="desc">十二个既有 G0 场景、七类完整系统资源、三处差异化负担、组件退出去向和公共 NO-GO 门。所有现实资源结果均未测量。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6f2"/><stop offset="1" stop-color="#e8eef2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10243a" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#315d72"/></marker>
    <style>
      text{font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#14263b} .b{font-weight:700}.muted{fill:#5f6f7e}.white{fill:#fff}.light{fill:#d7e6ed}.warm{fill:#f5cfae}.mono{font-family:Consolas,'Microsoft YaHei',monospace}.card{fill:#fff;stroke:#c7d2d8;stroke-width:2}.tiny{font-size:17px}.small{font-size:20px}.body{font-size:23px}.head{font-size:29px}.title{font-size:46px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <rect x="0" y="0" width="1800" height="148" fill="#142b44"/>
  <text x="58" y="66" class="title white">京张 AI 城市代谢账本</text>
  <text x="60" y="108" class="body light">十二场景 × 七类资源 × 完整系统边界 × 可追溯退出｜ROUND 5</text>
  <g transform="translate(1260 34)"><rect width="482" height="78" rx="18" fill="#203e58" stroke="#7da0ad"/><text x="24" y="32" class="small b white">G0 · 概念合同 · NO-GO</text><text x="24" y="61" class="tiny light">实测 0｜供应商 0｜批准 0｜运行 0</text></g>

  <g transform="translate(42 174)" filter="url(#shadow)">
    <rect width="300" height="672" rx="22" class="card"/>
    <text x="24" y="44" class="head b">七类资源边界</text>
    <text x="24" y="74" class="tiny muted">不能只算服务器</text>
    <g transform="translate(20 100)">
      <g><rect width="260" height="62" rx="13" fill="#dcecf0"/><circle cx="28" cy="31" r="12" fill="#176b77"/><text x="52" y="28" class="small b">算力</text><text x="52" y="50" class="tiny muted">云 / 边缘 / 网络 / 终端</text></g>
      <g transform="translate(0 72)"><rect width="260" height="62" rx="13" fill="#e3eedc"/><circle cx="28" cy="31" r="12" fill="#4e7c43"/><text x="52" y="28" class="small b">能源</text><text x="52" y="50" class="tiny muted">运行 / 待机 / 人工基线</text></g>
      <g transform="translate(0 144)"><rect width="260" height="62" rx="13" fill="#f1e9d7"/><circle cx="28" cy="31" r="12" fill="#9a6b20"/><text x="52" y="28" class="small b">设备与材料</text><text x="52" y="50" class="tiny muted">维修 / 寿命 / 部件 / 去向</text></g>
      <g transform="translate(0 216)"><rect width="260" height="62" rx="13" fill="#e4e6f1"/><circle cx="28" cy="31" r="12" fill="#5e5d94"/><text x="52" y="28" class="small b">数据</text><text x="52" y="50" class="tiny muted">最小化 / 留存 / 导出 / 删除</text></g>
      <g transform="translate(0 288)"><rect width="260" height="62" rx="13" fill="#f3dfdf"/><circle cx="28" cy="31" r="12" fill="#a54f54"/><text x="52" y="28" class="small b">人工复核</text><text x="52" y="50" class="tiny muted">交接 / 保障 / 纠正 / 恢复</text></g>
      <g transform="translate(0 360)"><rect width="260" height="62" rx="13" fill="#e2e9ee"/><circle cx="28" cy="31" r="12" fill="#42657d"/><text x="52" y="28" class="small b">供应商依赖</text><text x="52" y="50" class="tiny muted">互操作 / 导出 / 维修 / 退出</text></g>
      <g transform="translate(0 432)"><rect width="260" height="62" rx="13" fill="#f0ddd4"/><circle cx="28" cy="31" r="12" fill="#a7502c"/><text x="52" y="28" class="small b">失败与退出成本</text><text x="52" y="50" class="tiny muted">停机 / 清场 / 普通基线恢复</text></g>
    </g>
    <rect x="20" y="612" width="260" height="40" rx="10" fill="#142b44"/><text x="150" y="639" text-anchor="middle" class="tiny b white">任务分母未关闭 → 不得比较</text>
  </g>

  <path d="M350 506H392" stroke="#315d72" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(390 174)">
    <text x="0" y="38" class="head b">三处空间原型中的十二本护照</text>
    <text x="0" y="70" class="tiny muted">字段覆盖 12/12；资源结果不是 12/12，而是全部未知或待确认</text>
    <g transform="translate(0 96)" filter="url(#shadow)">
      <rect width="344" height="572" rx="22" fill="#f9fcfc" stroke="#77a5ad" stroke-width="3"/>
      <rect width="344" height="92" rx="22" fill="#176b77"/><rect y="70" width="344" height="22" fill="#176b77"/>
      <text x="24" y="39" class="head b white">众智园 · VERIFY</text><text x="24" y="70" class="tiny" fill="#dff1f2">设备隔离 × 人工接管</text>
      <g transform="translate(20 116)">
        <rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-001</text><text x="16" y="47" class="tiny">配送沙盒｜车、电池、观察员</text>
        <g transform="translate(0 68)"><rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-002</text><text x="16" y="47" class="tiny">能耗助手｜全系统能耗对照</text></g>
        <g transform="translate(0 136)"><rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-003</text><text x="16" y="47" class="tiny">安全研判｜高后果人工复核</text></g>
        <g transform="translate(0 204)"><rect width="304" height="58" rx="12" fill="#e7f1f3"/><text x="16" y="25" class="small b mono">SCENE-004</text><text x="16" y="47" class="tiny">失败档案｜长期存储与纠正</text></g>
      </g>
      <line x1="24" y1="406" x2="320" y2="406" stroke="#a6bec4"/>
      <text x="24" y="442" class="small b">退出焦点</text><text x="24" y="472" class="tiny">隔离 → 返修/回收 → 最小日志</text><text x="24" y="498" class="tiny">→ 连续绕行 → 场所独立验收</text>
      <rect x="20" y="518" width="304" height="34" rx="10" fill="#dcecef"/><text x="172" y="541" text-anchor="middle" class="tiny b">测量 0 · 供应商 0 · NO-GO</text>
    </g>
    <g transform="translate(366 96)" filter="url(#shadow)">
      <rect width="344" height="572" rx="22" fill="#fcfcf8" stroke="#9bad71" stroke-width="3"/>
      <rect width="344" height="92" rx="22" fill="#5f7f43"/><rect y="70" width="344" height="22" fill="#5f7f43"/>
      <text x="24" y="39" class="head b white">原点社区 · CO-CREATE</text><text x="24" y="70" class="tiny" fill="#eaf3df">同意撤回 × 居民日常</text>
      <g transform="translate(20 116)">
        <rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-005</text><text x="16" y="47" class="tiny">文化导览｜来源、媒体、策展</text>
        <g transform="translate(0 68)"><rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-006</text><text x="16" y="47" class="tiny">协作匹配｜画像撤回与删除</text></g>
        <g transform="translate(0 136)"><rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-007</text><text x="16" y="47" class="tiny">教育工坊｜共享设备与保障</text></g>
        <g transform="translate(0 204)"><rect width="304" height="58" rx="12" fill="#edf2e6"/><text x="16" y="25" class="small b mono">SCENE-008</text><text x="16" y="47" class="tiny">气候无障碍｜共测与校准</text></g>
      </g>
      <line x1="24" y1="406" x2="320" y2="406" stroke="#bdc9a3"/>
      <text x="24" y="442" class="small b">退出焦点</text><text x="24" y="472" class="tiny">撤回/删除 → 构件清走 → 静音</text><text x="24" y="498" class="tiny">→ 两院一街先回居民日常</text>
      <rect x="20" y="518" width="304" height="34" rx="10" fill="#e8efdd"/><text x="172" y="541" text-anchor="middle" class="tiny b">测量 0 · 供应商 0 · NO-GO</text>
    </g>
    <g transform="translate(732 96)" filter="url(#shadow)">
      <rect width="344" height="572" rx="22" fill="#fcfaf8" stroke="#bc8f72" stroke-width="3"/>
      <rect width="344" height="92" rx="22" fill="#9a5938"/><rect y="70" width="344" height="22" fill="#9a5938"/>
      <text x="24" y="39" class="head b white">大钟寺 · PUBLISH</text><text x="24" y="70" class="tiny" fill="#fae9df">来源更新 × 四向通勤</text>
      <g transform="translate(20 116)">
        <rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-009</text><text x="16" y="47" class="tiny">无障碍路径｜路线新鲜度</text>
        <g transform="translate(0 68)"><rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-010</text><text x="16" y="47" class="tiny">拥堵提示｜传感、隐私、待机</text></g>
        <g transform="translate(0 136)"><rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-011</text><text x="16" y="47" class="tiny">企业服务｜权威来源与人工台</text></g>
        <g transform="translate(0 204)"><rect width="304" height="58" rx="12" fill="#f5eae3"/><text x="16" y="25" class="small b mono">SCENE-012</text><text x="16" y="47" class="tiny">健康导航｜敏感推断与转介</text></g>
      </g>
      <line x1="24" y1="406" x2="320" y2="406" stroke="#d0b7a9"/>
      <text x="24" y="442" class="small b">退出焦点</text><text x="24" y="472" class="tiny">自动层下线 → 导出/纠正 → 人工台</text><text x="24" y="498" class="tiny">→ 清场 → 四向步行复测</text>
      <rect x="20" y="518" width="304" height="34" rx="10" fill="#f2e3da"/><text x="172" y="541" text-anchor="middle" class="tiny b">测量 0 · 供应商 0 · NO-GO</text>
    </g>
  </g>

  <path d="M1474 506H1514" stroke="#315d72" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(1514 174)" filter="url(#shadow)">
    <rect width="244" height="672" rx="22" class="card"/>
    <text x="22" y="44" class="head b">退出去向</text><text x="22" y="72" class="tiny muted">每个组件都要有凭证</text>
    <g transform="translate(18 98)" class="tiny">
      <rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">01 保留既有设施</text><text x="14" y="46" class="muted">状态 + 责任确认</text>
      <g transform="translate(0 66)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">02 现场维修复用</text><text x="14" y="46" class="muted">部件 + 安全 + 责任</text></g>
      <g transform="translate(0 132)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">03 异地再部署</text><text x="14" y="46" class="muted">接收方接受</text></g>
      <g transform="translate(0 198)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">04 供应商回收</text><text x="14" y="46" class="muted">约束条款 + 回执</text></g>
      <g transform="translate(0 264)"><rect width="208" height="56" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">05 合规回收处置</text><text x="14" y="46" class="muted">材料链 + 回执</text></g>
      <g transform="translate(0 330)"><rect width="208" height="70" rx="12" fill="#e7edf0"/><text x="14" y="25" class="b">06 数据与日志关闭</text><text x="14" y="47" class="muted">导出 / 删除 / 最小记录</text></g>
      <g transform="translate(0 410)"><rect width="208" height="86" rx="12" fill="#dce9df"/><text x="14" y="25" class="b">07 普通场所恢复</text><text x="14" y="47" class="muted">线缆/固定件/排队清除</text><text x="14" y="68" class="muted">人工与非 AI 同任务恢复</text></g>
    </g>
    <rect x="18" y="616" width="208" height="36" rx="10" fill="#9a3d38"/><text x="122" y="641" text-anchor="middle" class="tiny b white">任一去向无证据 = 停止</text>
  </g>

  <g transform="translate(42 874)">
    <rect width="1716" height="174" rx="22" fill="#142b44"/>
    <text x="28" y="40" class="head b white">公共决定门｜字段齐全 ≠ 环境绩效 ≠ 部署授权</text>
    <text x="28" y="77" class="small light">分母 + 完整边界 + 来源 + 责任 + 非 AI 同任务基线 + 供应商退出条款 + 组件去向 + 独立复核</text>
    <line x1="28" y1="98" x2="1688" y2="98" stroke="#49647a"/>
    <text x="28" y="135" class="tiny b warm">五类显式状态：</text>
    <text x="184" y="135" class="tiny white">not_applicable · not_measured · external_confirmation_required · not_yet_authorized · not_fully_cleared</text>
    <rect x="1350" y="112" width="338" height="40" rx="12" fill="#9a3d38"/><text x="1519" y="139" text-anchor="middle" class="small b white">缺一项：NO-GO / 保持 G0</text>
  </g>
</svg>
