<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">反脆弱失败治理：三载体回写与恢复故事板</title>
  <desc id="desc">显示六类失败、停止恢复七步、运行成熟度授权服务四轴、场景护照公共时刻表证据矩阵三载体原子回写、申诉和退役边界。</desc>
  <defs>
    <style>
      text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#12202f}.h1{font-size:42px;font-weight:700}.h2{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.white{fill:#fff}.muted{fill:#5b6975}.mono{font-family:Consolas,monospace}.line{stroke:#90a0aa;stroke-width:3;fill:none}.dash{stroke-dasharray:10 8}.arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#657483"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#f3f4ef"/>
  <rect x="0" y="0" width="1800" height="102" fill="#12202f"/>
  <text x="56" y="58" class="h1 white">反脆弱失败治理｜三载体回写，不以 PASS 冒充授权</text>
  <text x="56" y="88" class="small white">JZ-AIOS 内部合同 · G0 概念层 · 不按比例 · 不是现实事故、现场恢复或部署许可</text>

  <text x="56" y="145" class="h2">01｜六类失败先分类，再决定停止强度</text>
  <g>
    <rect x="56" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d96850" stroke-width="3"/><text x="76" y="204" class="h2">安全与无障碍</text><text x="76" y="236" class="body">碰撞 · 越界 · 普通路径受阻</text>
    <rect x="328" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d96850" stroke-width="3"/><text x="348" y="204" class="h2">权利与同意</text><text x="348" y="236" class="body">禁采 · 撤回失败 · 唯一技术入口</text>
    <rect x="600" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d49a36" stroke-width="3"/><text x="620" y="204" class="h2">来源与版本</text><text x="620" y="236" class="body">过期 · 冲突 · 旧证据被覆盖</text>
    <rect x="872" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#d49a36" stroke-width="3"/><text x="892" y="204" class="h2">服务与交接</text><text x="892" y="236" class="body">人工缺席 · 普通服务被占用</text>
    <rect x="1144" y="170" width="258" height="92" rx="16" fill="#fff" stroke="#246b83" stroke-width="3"/><text x="1164" y="204" class="h2">证据与决策</text><text x="1164" y="236" class="body">分母失效 · 申诉不进决策</text>
    <rect x="1416" y="170" width="328" height="92" rx="16" fill="#fff" stroke="#246b83" stroke-width="3"/><text x="1436" y="204" class="h2">场所恢复与退出</text><text x="1436" y="236" class="body">不可拆 · 无去向 · 普通使用未恢复</text>
  </g>

  <text x="56" y="314" class="h2">02｜失败—停止—恢复—复测故事板（T-02 过期来源合成示例）</text>
  <g>
    <path d="M165 390 H1610" class="line arrow"/>
    <g transform="translate(56,338)"><circle cx="80" cy="52" r="38" fill="#246b83"/><text x="69" y="61" class="h2 white">1</text><text x="20" y="112" class="body">发现边界</text><text x="8" y="137" class="small muted">不生成实质回答</text></g>
    <g transform="translate(284,338)"><circle cx="80" cy="52" r="38" fill="#d96850"/><text x="69" y="61" class="h2 white">2</text><text x="30" y="112" class="body">立即停止</text><text x="1" y="137" class="small muted">普通/非 AI 路径保留</text></g>
    <g transform="translate(512,338)"><circle cx="80" cy="52" r="38" fill="#d49a36"/><text x="69" y="61" class="h2 white">3</text><text x="22" y="112" class="body">人工交接</text><text x="3" y="137" class="small muted">角色待确认，不填机构</text></g>
    <g transform="translate(740,338)"><circle cx="80" cy="52" r="38" fill="#12202f"/><text x="69" y="61" class="h2 white">4</text><text x="16" y="112" class="body">三载体回写</text><text x="3" y="137" class="small muted">缺一项即 fail-closed</text></g>
    <g transform="translate(968,338)"><circle cx="80" cy="52" r="38" fill="#36a269"/><text x="69" y="61" class="h2 white">5</text><text x="27" y="112" class="body">追加纠正</text><text x="0" y="137" class="small muted">保留旧证据与旧版本</text></g>
    <g transform="translate(1196,338)"><circle cx="80" cy="52" r="38" fill="#246b83"/><text x="69" y="61" class="h2 white">6</text><text x="25" y="112" class="body">独立复测</text><text x="4" y="137" class="small muted">现实完成数仍为 0</text></g>
    <g transform="translate(1424,338)"><circle cx="80" cy="52" r="38" fill="#12202f"/><text x="69" y="61" class="h2 white">7</text><text x="17" y="112" class="body">恢复或退役</text><text x="-3" y="137" class="small muted">不自动升级 G0/授权</text></g>
  </g>

  <text x="56" y="530" class="h2">03｜一次状态变化，三份原子回写</text>
  <g>
    <rect x="56" y="554" width="510" height="230" rx="20" fill="#fff" stroke="#246b83" stroke-width="4"/>
    <text x="82" y="592" class="h2">场景护照｜后台事实</text><text x="82" y="626" class="body">四轴状态 · 失败类 · 停止权限角色</text><text x="82" y="657" class="body">前后版本 · 证据/申诉 · 到期/退役</text><text x="82" y="703" class="small mono">pilot-readiness-register.json#records</text><text x="82" y="744" class="small muted">成熟度与授权不能由“恢复”自动改变</text>
    <rect x="645" y="554" width="510" height="230" rx="20" fill="#fff" stroke="#36a269" stroke-width="4"/>
    <text x="671" y="592" class="h2">公共时刻表｜公众现在能做什么</text><text x="671" y="626" class="body">公开运行态 · 普通/非 AI 路径</text><text x="671" y="657" class="body">人工联系 · 下一更新 · 来源/退出</text><text x="671" y="703" class="small mono">twin_track_frontend_contract.civic_timetable</text><text x="671" y="744" class="small muted">无需账户、扫码或 AI；矛盾时显示更保守状态</text>
    <rect x="1234" y="554" width="510" height="230" rx="20" fill="#fff" stroke="#d49a36" stroke-width="4"/>
    <text x="1260" y="592" class="h2">证据矩阵｜主张怎样改变</text><text x="1260" y="626" class="body">主张暂停/缩小/更正 · 锚点与版本</text><text x="1260" y="657" class="body">范围/限制 · 复测 · go/no-go</text><text x="1260" y="703" class="small mono">antifragile_failure_governance_contract</text><text x="1260" y="744" class="small muted">旧证据保留；通过也必须写“不授权什么”</text>
    <path d="M566 670 H642" class="line dash arrow"/><path d="M1155 670 H1231" class="line dash arrow"/>
  </g>

  <text x="56" y="835" class="h2">04｜四轴分离 + 申诉 + 主动退役</text>
  <g>
    <rect x="56" y="858" width="274" height="112" rx="14" fill="#e8f0f3"/><text x="76" y="892" class="h2">运行态</text><text x="76" y="924" class="body">普通 / 验证 / 故障 / 恢复</text><text x="76" y="952" class="small muted">空间与服务此刻怎样</text>
    <rect x="346" y="858" width="274" height="112" rx="14" fill="#e9f4ed"/><text x="366" y="892" class="h2">成熟度</text><text x="366" y="924" class="body">G0 / G1 / G2 / G3</text><text x="366" y="952" class="small muted">本包全部仍为 G0</text>
    <rect x="636" y="858" width="274" height="112" rx="14" fill="#fbf0dc"/><text x="656" y="892" class="h2">授权态</text><text x="656" y="924" class="body">未授权 / 限域 / 撤回 / 退役</text><text x="656" y="952" class="small muted">当前现实服务未授权</text>
    <rect x="926" y="858" width="274" height="112" rx="14" fill="#f8e8e3"/><text x="946" y="892" class="h2">服务态</text><text x="946" y="924" class="body">普通可用 / AI 可选 / 人工接管</text><text x="946" y="952" class="small muted">概念要求，不是已运营事实</text>
    <rect x="1220" y="858" width="524" height="112" rx="14" fill="#fff" stroke="#12202f" stroke-width="3"/><text x="1242" y="892" class="h2">申诉必须影响决策，退役必须留下回执</text><text x="1242" y="924" class="body">口头/纸面/人工 → 暂停、缩小、更正、复测、撤回或退役</text><text x="1242" y="952" class="small muted">不公开身份、不做羞辱榜；构件/数据/服务/场所都有去向</text>
  </g>

  <rect x="56" y="1002" width="1688" height="66" rx="14" fill="#12202f"/>
  <text x="80" y="1032" class="body white">常驻授权边界｜文件检查、合成回放、机器 PASS、复测或恢复验收，仅对明确对象和范围有效；</text>
  <text x="80" y="1058" class="body white">不授权试用、采购、建设、部署、成熟度升级、场地/专业批准、权利清除或现实成效。</text>
</svg>
