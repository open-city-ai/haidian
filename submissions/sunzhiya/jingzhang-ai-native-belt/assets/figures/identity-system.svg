      <text x="45" y="80" text-anchor="middle" class="label">墨色</text>
      <text x="45" y="96" text-anchor="middle" class="mono">#3D3933</text>
      <text x="45" y="112" text-anchor="middle" class="label" font-size="11">text</text>
    </g>
    <g transform="translate(480,20)">
      <rect class="swatch" x="0" y="0" width="90" height="60" rx="4" fill="#F7F6F2" stroke="#C9C6BC"/>
      <text x="45" y="80" text-anchor="middle" class="label">纸白</text>
      <text x="45" y="96" text-anchor="middle" class="mono">#F7F6F2</text>
      <text x="45" y="112" text-anchor="middle" class="label" font-size="11">background</text>
    </g>
  </g>

