      <path d="M10 28 h40 v4 h-40 z" fill="#8A3324"/>
      <circle cx="42" cy="20" r="8" fill="#C9A86C"/>
      <text x="30" y="85" text-anchor="middle" class="label">屏幕 48 px</text>
    </g>
    <g transform="translate(200,25)">
      <rect x="0" y="0" width="60" height="60" fill="#FFFFFF" stroke="#C9C6BC"/>
      <path d="M10 28 h40 v4 h-40 z" fill="#8A3324"/>
      <circle cx="42" cy="20" r="8" fill="#C9A86C"/>
      <text x="30" y="85" text-anchor="middle" class="label">favicon 16 px</text>
    </g>
  </g>

  <!-- misuse / protection -->
  <g transform="translate(90,590)">
    <text x="0" y="0" class="subtitle" font-weight="700">禁止用法 / Don't</text>
    <g transform="translate(0,20)">
