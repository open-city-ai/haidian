<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <style>
      .bg { fill:#F7F6F2; }
      .rule { stroke:#C9C6BC; stroke-width:1; }
      .title { font-family:'Microsoft YaHei','SimHei',sans-serif; font-size:28px; font-weight:700; fill:#4A443D; }
      .subtitle { font-family:'Microsoft YaHei','SimHei',sans-serif; font-size:14px; fill:#6E6860; }
      .label { font-family:'Microsoft YaHei','SimHei',sans-serif; font-size:13px; fill:#5A554D; }
      .mono { font-family:Consolas,monospace; font-size:11px; fill:#6E6860; }
      .brand-rail { fill:#8A3324; }
      .brand-track { fill:#4E7C6F; }
      .brand-ai { fill:#C9A86C; }
      .brand-text { fill:#3D3933; }
      .swatch { stroke:#FFFFFF; stroke-width:2; }
    </style>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect class="bg" width="1200" height="720"/>

  <!-- header -->
  <text x="60" y="55" class="title">百年京张 · AI 原生创新带 识别系统 / Identity System</text>
  <text x="60" y="82" class="subtitle">v4.0 · kimik3 · 概念建议（provisional）/ Concept suggestion (provisional)</text>

  <!-- primary mark -->
  <g transform="translate(90,140)" filter="url(#drop)">
    <rect x="0" y="0" width="220" height="220" rx="8" fill="#FFFFFF" stroke="#E0DDD4"/>
    <!-- rail silhouette -->
    <path class="brand-rail" d="M30 100 L190 100 L190 108 L30 108 Z"/>
    <path class="brand-rail" d="M30 126 L190 126 L190 134 L30 134 Z"/>
    <!-- sleepers -->
    <g fill="#A89F90">
      <rect x="42" y="96" width="10" height="42" rx="2"/>
      <rect x="78" y="96" width="10" height="42" rx="2"/>
      <rect x="114" y="96" width="10" height="42" rx="2"/>
      <rect x="150" y="96" width="10" height="42" rx="2"/>
    </g>
    <!-- track curve (centenary continuity) -->
    <path class="brand-track" d="M30 145 C70 185, 150 185, 190 145" fill="none" stroke="#4E7C6F" stroke-width="10" stroke-linecap="round"/>
    <!-- AI node -->
    <circle cx="150" cy="75" r="22" class="brand-ai"/>
    <text x="150" y="82" text-anchor="middle" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#FFFFFF">AI</text>
    <!-- knot at intersection -->
    <circle cx="110" cy="117" r="8" fill="#3D3933"/>
    <text x="110" y="200" text-anchor="middle" class="label" font-size="12">主标志 Primary mark</text>
  </g>

  <!-- bilingual logotype -->
  <g transform="translate(360,150)">
    <text x="0" y="40" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="36" font-weight="700" fill="#3D3933">百年京张</text>
    <text x="0" y="75" font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="22" fill="#6E6860">AI 原生创新带</text>
    <text x="0" y="115" font-family="'Arial',sans-serif" font-size="18" font-weight="700" fill="#3D3933">Centennial Jing-Zhang</text>
    <text x="0" y="142" font-family="'Arial',sans-serif" font-size="15" fill="#6E6860">AI-Native Innovation Belt</text>
    <text x="0" y="185" class="mono">Clear space ≥ 0.5 × mark height on all sides</text>
    <!-- clear space box -->
    <rect x="-12" y="-50" width="360" height="220" fill="none" stroke="#C9C6BC" stroke-dasharray="4 3"/>
  </g>

  <!-- color palette -->
  <g transform="translate(90,420)">
