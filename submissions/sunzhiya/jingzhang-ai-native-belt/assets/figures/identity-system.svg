      <text x="45" y="80" text-anchor="middle" class="label">生态绿</text>
      <text x="45" y="96" text-anchor="middle" class="mono">#4E7C6F</text>
      <text x="45" y="112" text-anchor="middle" class="label" font-size="11">blue-green spine</text>
    </g>
    <g transform="translate(240,20)">
      <rect class="swatch" x="0" y="0" width="90" height="60" rx="4" fill="#C9A86C"/>
      <text x="45" y="80" text-anchor="middle" class="label">AI 金</text>
      <text x="45" y="96" text-anchor="middle" class="mono">#C9A86C</text>
      <text x="45" y="112" text-anchor="middle" class="label" font-size="11">AI node</text>
    </g>
    <g transform="translate(360,20)">
