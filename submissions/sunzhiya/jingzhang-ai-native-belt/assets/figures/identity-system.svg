  <!-- footer -->
  <text x="60" y="695" class="mono">Source: _v4/gen_identity.py · Output: assets/figures/identity-system.svg · Offline audit: node visual/assets/evidence-audit.js</text>
  <text x="60" y="710" class="mono">Concept suggestion. Geometry is provisional and must be recomputed once official data is released.</text>
