      <path d="M15 10 h40 v5 h-40 z" fill="#8A3324" opacity="0.3"/>
      <text x="35" y="62" text-anchor="middle" class="label" font-size="10">拉伸</text>
    </g>
    <g transform="translate(100,20)">
      <rect x="0" y="0" width="70" height="45" fill="#FFFFFF" stroke="#C9C6BC"/>
      <path d="M15 10 h40 v5 h-40 z" fill="#8A3324"/>
      <line x1="0" y1="0" x2="70" y2="45" stroke="#C9A86C" stroke-width="2"/>
      <text x="35" y="62" text-anchor="middle" class="label" font-size="10">改变比例</text>
    </g>
    <g transform="translate(200,20)">
      <rect x="0" y="0" width="70" height="45" fill="#FFFFFF" stroke="#C9C6BC"/>
      <text x="35" y="30" text-anchor="middle" font-family="Arial" font-size="10" fill="#8A3324">outlined</text>
      <text x="35" y="62" text-anchor="middle" class="label" font-size="10">描边化</text>
    </g>
    <g transform="translate(300,20)">
      <rect x="0" y="0" width="70" height="45" fill="#8A3324" stroke="#C9C6BC"/>
      <path d="M15 10 h40 v5 h-40 z" fill="#4E7C6F"/>
      <text x="35" y="62" text-anchor="middle" class="label" font-size="10">低对比底</text>
    </g>
