<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <rect width="1280" height="820" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1280" height="64" fill="#1f3a5f"/>
  <text x="40" y="40" fill="#ffffff" font-size="26" font-weight="700">交通慢行与蓝绿公共空间复合系统 (Mobility &amp; Blue-Green)</text>

  <!-- blue-green band (left) -->
  <path d="M180 720 C320 560 460 420 700 250 C860 150 980 130 1060 160 L1060 250 C980 220 860 240 700 340 C460 510 320 650 180 800 Z"
        fill="#d6efe0" stroke="#2e8b57" stroke-width="2"/>
  <text x="360" y="430" fill="#2e8b57" font-size="16" font-weight="700" transform="rotate(-32 360 430)">京张遗址公园活力带 + 小月河蓝绿复合带</text>

  <!-- slow corridor spine -->
  <path d="M260 700 C500 560 700 420 1000 210" fill="none" stroke="#e4572e" stroke-width="8" stroke-linecap="round"/>
  <text x="560" y="600" fill="#e4572e" font-size="15" font-weight="700" transform="rotate(-30 560 600)">智脉慢行主轴</text>

  <!-- east-west stitching links -->
  <g stroke="#1f3a5f" stroke-width="3" stroke-dasharray="6 6">
    <line x1="430" y1="585" x2="700" y2="560"/>
    <line x1="640" y1="430" x2="880" y2="410"/>
    <line x1="850" y1="285" x2="1040" y2="260"/>
  </g>
  <text x="500" y="640" fill="#1f3a5f" font-size="13">东西缝合联系道</text>

  <!-- nodes -->
  <g>
    <circle cx="430" cy="585" r="16" fill="#fff" stroke="#1f3a5f" stroke-width="3"/>
    <text x="430" y="618" fill="#1a2733" font-size="13" text-anchor="middle">大钟寺站 TOD</text>
    <circle cx="700" cy="420" r="16" fill="#fff" stroke="#1f3a5f" stroke-width="3"/>
    <text x="700" y="453" fill="#1a2733" font-size="13" text-anchor="middle">原点社区公共客厅</text>
    <circle cx="1000" cy="210" r="16" fill="#fff" stroke="#1f3a5f" stroke-width="3"/>
    <text x="1000" y="243" fill="#1a2733" font-size="13" text-anchor="middle">智脉原点驿站</text>
  </g>

  <!-- legend -->
  <g transform="translate(980,470)">
    <rect x="0" y="0" width="22" height="14" fill="#d6efe0" stroke="#2e8b57"/><text x="32" y="12" fill="#1a2733" font-size="13">蓝绿复合带</text>
    <path d="M0 34 L22 34" stroke="#e4572e" stroke-width="8"/><text x="32" y="40" fill="#1a2733" font-size="13">慢行主轴</text>
    <line x1="0" y1="62" x2="22" y2="62" stroke="#1f3a5f" stroke-width="3" stroke-dasharray="6 6"/><text x="32" y="68" fill="#1a2733" font-size="13">东西缝合</text>
    <circle cx="11" cy="90" r="10" fill="#fff" stroke="#1f3a5f" stroke-width="3"/><text x="32" y="94" fill="#1a2733" font-size="13">轨道/公共节点</text>
  </g>

  <text x="40" y="790" fill="#6b7d92" font-size="12">资料来源：geometry/roads.geojson, green_space.geojson, public_space.geojson；几何为临时边界(provisional_rough)</text>
</svg>
