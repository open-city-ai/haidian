<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <rect width="1280" height="820" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1280" height="64" fill="#1f3a5f"/>
  <text x="40" y="40" fill="#ffffff" font-size="26" font-weight="700">核心指标复算与证据链 (Metrics &amp; Evidence)</text>

  <!-- number cards -->
  <g>
    <rect x="40" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="140" y="170" fill="#e4572e" font-size="40" text-anchor="middle" font-weight="700">6</text>
    <text x="140" y="200" fill="#1a2733" font-size="14" text-anchor="middle">全球生态案例</text>

    <rect x="260" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="360" y="170" fill="#e4572e" font-size="40" text-anchor="middle" font-weight="700">12</text>
    <text x="360" y="200" fill="#1a2733" font-size="14" text-anchor="middle">AI场景卡 (★3测试)</text>

    <rect x="480" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="580" y="170" fill="#e4572e" font-size="40" text-anchor="middle" font-weight="700">6</text>
    <text x="580" y="200" fill="#1a2733" font-size="14" text-anchor="middle">用户画像</text>

    <rect x="700" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="800" y="170" fill="#e4572e" font-size="40" text-anchor="middle" font-weight="700">3</text>
    <text x="800" y="200" fill="#1a2733" font-size="14" text-anchor="middle">AI朝圣地标</text>

    <rect x="920" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <text x="1020" y="170" fill="#2e8b57" font-size="34" text-anchor="middle" font-weight="700">11.4</text>
    <text x="1020" y="200" fill="#1a2733" font-size="14" text-anchor="middle">总体设计 km²(官方)</text>
  </g>

  <!-- area bars: official vs provisional -->
  <g transform="translate(60,300)">
    <text x="0" y="0" fill="#1a2733" font-size="18" font-weight="700">重点区域面积：官方文本 vs 临时复算 (km²)</text>
    <g font-size="13" fill="#1a2733">
      <!-- 众智园 -->
      <text x="0" y="40">众智园</text>
      <rect x="110" y="28" width="192" height="20" fill="#1f3a5f"/><text x="310" y="43" fill="#1a2733">1.92 官方</text>
      <rect x="110" y="54" width="93" height="20" fill="#9fb3c8"/><text x="310" y="69" fill="#6b7d92">0.93 临时</text>
      <!-- 原点 -->
      <text x="0" y="100">原点社区</text>
      <rect x="110" y="88" width="104" height="20" fill="#1f3a5f"/><text x="310" y="103">1.04 官方</text>
      <rect x="110" y="114" width="131" height="20" fill="#9fb3c8"/><text x="310" y="129">1.31 临时</text>
      <!-- 大钟寺 -->
      <text x="0" y="160">大钟寺</text>
      <rect x="110" y="148" width="72" height="20" fill="#1f3a5f"/><text x="310" y="163">0.72 官方</text>
      <rect x="110" y="174" width="140" height="20" fill="#9fb3c8"/><text x="310" y="189">1.40 临时</text>
    </g>
    <text x="0" y="225" fill="#6b7d92" font-size="12">临时复算面积仅作可视化；官方面积以公告文本为准，待正式 polygon 补齐后重算。</text>
  </g>

  <!-- ratios -->
  <g transform="translate(720,300)">
    <text x="0" y="0" fill="#1a2733" font-size="18" font-weight="700">比例指标 (临时推算)</text>
    <g font-size="14" fill="#1a2733">
      <text x="0" y="40">绿地率 ≈ 18.1% (provisional)</text>
      <text x="0" y="74">公共空间率 ≈ 4.3% (provisional)</text>
      <text x="0" y="108">建筑密度 ≈ 4.9% (provisional)</text>
      <text x="0" y="142">示意容积率 2.5 (provisional)</text>
      <text x="0" y="176">慢行主轴连续度：贯通 (概念)</text>
    </g>
    <text x="0" y="220" fill="#6b7d92" font-size="12">规划控制指标缺失，比例均为 provisional_assumption，非审定指标。</text>
  </g>

  <!-- evidence chain -->
  <g transform="translate(60,640)">
    <text x="0" y="0" fill="#1a2733" font-size="15" font-weight="700">证据链：</text>
    <text x="90" y="0" fill="#1a2733" font-size="14">proposal.md → metrics.json / sources.json / compliance_matrix.json / standard_matrix.json / design_depth_matrix.json → geometry/*.geojson</text>
  </g>

  <text x="40" y="790" fill="#6b7d92" font-size="12">资料来源：metrics.json；绿地/公共/建筑密度由 geometry 临时复算，置信度低，待控规条件补齐</text>
</svg>
