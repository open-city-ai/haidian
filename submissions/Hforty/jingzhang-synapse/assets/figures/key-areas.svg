<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <rect width="1280" height="820" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1280" height="64" fill="#1f3a5f"/>
  <text x="40" y="40" fill="#ffffff" font-size="26" font-weight="700">三处重点区域索引与设计任务 (Key Areas)</text>

  <g transform="translate(60,120)">
    <rect width="360" height="600" rx="14" fill="#ffffff" stroke="#e4572e" stroke-width="3"/>
    <circle cx="40" cy="46" r="20" fill="#e4572e"/><text x="40" y="52" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">1</text>
    <text x="74" y="40" fill="#1a2733" font-size="19" font-weight="700">众智园AI自主创新加速区</text>
    <text x="74" y="64" fill="#6b7d92" font-size="13">北 · 官方面积 1.921 km²</text>
    <g font-size="14" fill="#1a2733">
      <text x="24" y="120">定位：全栈自主创新 + AI治理话语权</text>
      <text x="24" y="156">用地：工业中试 / 商务金融(算力·资本)</text>
      <text x="24" y="192">节点：智脉原点驿站(文化)</text>
      <text x="24" y="228">更新：旧厂房改造 + 新建中试载体</text>
      <text x="24" y="264">公共空间：沿智脉主轴连续展开</text>
      <text x="24" y="300">设计深度：规划综合实施方案</text>
      <text x="24" y="336">证据：geometry/key_areas.geojson#KEY-ZHONG</text>
    </g>
  </g>

  <g transform="translate(460,120)">
    <rect width="360" height="600" rx="14" fill="#ffffff" stroke="#e4572e" stroke-width="3"/>
    <circle cx="40" cy="46" r="20" fill="#e4572e"/><text x="40" y="52" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">2</text>
    <text x="74" y="40" fill="#1a2733" font-size="19" font-weight="700">北京AI原点社区</text>
    <text x="74" y="64" fill="#6b7d92" font-size="13">中 · 官方面积 1.043 km²</text>
    <g font-size="14" fill="#1a2733">
      <text x="24" y="120">定位：世界级AI创新生态</text>
      <text x="24" y="156">用地：AI企业总部 / AI+医疗 / 学院</text>
      <text x="24" y="192">节点：原点社区公共客厅(广场)</text>
      <text x="24" y="228">混合功能 + 24h 活力</text>
      <text x="24" y="264">场景—空间—运营一体化</text>
      <text x="24" y="300">居住—研发—生活闭环</text>
      <text x="24" y="336">证据：geometry/key_areas.geojson#KEY-BEIJING</text>
    </g>
  </g>

  <g transform="translate(860,120)">
    <rect width="360" height="600" rx="14" fill="#ffffff" stroke="#e4572e" stroke-width="3"/>
    <circle cx="40" cy="46" r="20" fill="#e4572e"/><text x="40" y="52" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">3</text>
    <text x="74" y="40" fill="#1a2733" font-size="19" font-weight="700">大钟寺AI产业集聚区</text>
    <text x="74" y="64" fill="#6b7d92" font-size="13">南 · 官方面积 0.72 km²</text>
    <g font-size="14" fill="#1a2733">
      <text x="24" y="120">定位：智能原生新业态</text>
      <text x="24" y="156">用地：商务金融核心 / 中试制造</text>
      <text x="24" y="192">节点：站点 TOD 一体化</text>
      <text x="24" y="228">借鉴：Station F 旧站—新业态</text>
      <text x="24" y="264">东西缝合 + 轨道接驳</text>
      <text x="24" y="300">设计深度：规划综合实施方案</text>
      <text x="24" y="336">证据：geometry/key_areas.geojson#KEY-DAZHONG</text>
    </g>
  </g>

  <text x="40" y="790" fill="#6b7d92" font-size="12">三处重点区几何为临时边界(provisional_constraint)，结论为方向性设计；官方面积以公告文本为准</text>
</svg>
