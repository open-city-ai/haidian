<text x="380" y="411.2" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">结构（按街区控规「一带一轴，两心多点」，背景参考）：</text>
<text x="380" y="440.4" font-size="13" fill="#475569" text-anchor="start" font-weight="normal">一带：京张铁路遗址公园产业创新带（9 km 绿廊）</text>
