<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <rect width="1280" height="820" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1280" height="64" fill="#1f3a5f"/>
  <text x="40" y="40" fill="#ffffff" font-size="26" font-weight="700">三层范围工作框架与用地结构 (Scope Framework &amp; Land Use)</text>

  <!-- nested scopes (concentric示意) -->
  <g transform="translate(360,460)">
    <rect x="-300" y="-210" width="600" height="420" rx="20" fill="#e8eef5" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="0" y="-185" fill="#6b7d92" font-size="15" text-anchor="middle">统筹研究范围 43.6 km² (provisional)</text>
    <rect x="-200" y="-150" width="400" height="300" rx="16" fill="#dbe6f1" stroke="#5a7da3" stroke-width="2"/>
    <text x="0" y="-128" fill="#1f3a5f" font-size="16" text-anchor="middle" font-weight="700">总体设计范围 11.4 km²</text>
    <rect x="-110" y="-90" width="220" height="180" rx="12" fill="#cfe0d2" stroke="#2e8b57" stroke-width="2"/>
    <text x="0" y="-66" fill="#2e8b57" font-size="15" text-anchor="middle" font-weight="700">重点区域 3.684 km²</text>
    <text x="0" y="-40" fill="#1a2733" font-size="12" text-anchor="middle">众智园 1.921</text>
    <text x="0" y="-22" fill="#1a2733" font-size="12" text-anchor="middle">原点 1.043</text>
    <text x="0" y="-4" fill="#1a2733" font-size="12" text-anchor="middle">大钟寺 0.72 km²</text>
  </g>

  <!-- land use partition color blocks -->
  <g transform="translate(720,150)">
    <text x="0" y="0" fill="#1a2733" font-size="18" font-weight="700">用地结构 (MNR 分类·临时)</text>
    <g font-size="13" fill="#1a2733">
      <rect x="0" y="20" width="26" height="16" fill="#b5651d"/><text x="34" y="33">1001 工业(中试) 2.82 km²</text>
      <rect x="0" y="46" width="26" height="16" fill="#3b6ea5"/><text x="34" y="59">0902 商务金融 4.54 km²</text>
      <rect x="0" y="72" width="26" height="16" fill="#7fb3d5"/><text x="34" y="85">0901 商业 1.45 km²</text>
      <rect x="0" y="98" width="26" height="16" fill="#8e44ad"/><text x="34" y="111">0803 文化 1.07 km²</text>
      <rect x="0" y="124" width="26" height="16" fill="#16a085"/><text x="34" y="137">0804 教育科研 1.79 km²</text>
      <rect x="0" y="150" width="26" height="16" fill="#e74c3c"/><text x="34" y="163">0806 医疗卫生 0.88 km²</text>
      <rect x="0" y="176" width="26" height="16" fill="#27ae60"/><text x="34" y="189">1401/1403 绿地广场 3.17 km²</text>
      <rect x="0" y="202" width="26" height="16" fill="#d4ac0d"/><text x="34" y="215">0701 住宅 1.06 km²</text>
      <rect x="0" y="228" width="26" height="16" fill="#566573"/><text x="34" y="241">1208 交通场站 (站点)</text>
    </g>
    <text x="0" y="280" fill="#6b7d92" font-size="12">面积由 geometry/land_use.geojson 复算(provisional_rough)</text>
  </g>

  <text x="40" y="790" fill="#6b7d92" font-size="12">资料来源：design_brief.json 官方面积文本 + land_use.geojson 临时复算；分层范围逐级落实产业战略→控规深度→重点区详细设计</text>
</svg>
