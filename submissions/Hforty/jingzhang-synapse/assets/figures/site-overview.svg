<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <rect width="1280" height="820" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1280" height="64" fill="#1f3a5f"/>
  <text x="40" y="40" fill="#ffffff" font-size="26" font-weight="700">京张智脉 · 总体概念与三层范围 (Site Overview)</text>

  <!-- faint provisional boundary -->
  <path d="M250 720 L250 250 Q250 210 300 200 L1020 130 Q1075 125 1085 175 L1090 640 Q1090 700 1035 705 L300 760 Q255 762 250 720 Z"
        fill="#e8eef5" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="300" y="745" fill="#6b7d92" font-size="14">临时粗略边界 (provisional_constraint, 非官方红线)</text>

  <!-- the Synapse spine (rail -> neural) -->
  <path d="M300 700 C520 560 720 420 1040 190" fill="none" stroke="#e4572e" stroke-width="10" stroke-linecap="round"/>
  <path d="M300 700 C520 560 720 420 1040 190" fill="none" stroke="#1f3a5f" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- three key area nodes -->
  <g>
    <circle cx="350" cy="640" r="26" fill="#e4572e"/>
    <text x="350" y="646" fill="#fff" font-size="16" text-anchor="middle" font-weight="700">3</text>
    <text x="350" y="690" fill="#1a2733" font-size="16" text-anchor="middle" font-weight="600">大钟寺AI产业集聚区</text>
    <text x="350" y="712" fill="#6b7d92" font-size="12" text-anchor="middle">智能原生新业态 · 0.72 km²</text>
  </g>
  <g>
    <circle cx="660" cy="420" r="26" fill="#e4572e"/>
    <text x="660" y="426" fill="#fff" font-size="16" text-anchor="middle" font-weight="700">2</text>
    <text x="660" y="470" fill="#1a2733" font-size="16" text-anchor="middle" font-weight="600">北京AI原点社区</text>
    <text x="660" y="492" fill="#6b7d92" font-size="12" text-anchor="middle">世界级AI创新生态 · 1.043 km²</text>
  </g>
  <g>
    <circle cx="985" cy="225" r="26" fill="#e4572e"/>
    <text x="985" y="231" fill="#fff" font-size="16" text-anchor="middle" font-weight="700">1</text>
    <text x="985" y="275" fill="#1a2733" font-size="16" text-anchor="middle" font-weight="600">众智园AI自主创新加速区</text>
    <text x="985" y="297" fill="#6b7d92" font-size="12" text-anchor="middle">全栈自主·AI治理 · 1.921 km²</text>
  </g>

  <!-- two wings -->
  <g>
    <rect x="120" y="430" width="150" height="70" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="195" y="462" fill="#1f3a5f" font-size="14" text-anchor="middle" font-weight="700">中关村科技服务翼</text>
    <text x="195" y="484" fill="#6b7d92" font-size="11" text-anchor="middle">要素全球化配置</text>
    <line x1="270" y1="465" x2="560" y2="445" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g>
    <rect x="1010" y="470" width="150" height="70" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <text x="1085" y="502" fill="#2e8b57" font-size="14" text-anchor="middle" font-weight="700">小月河场景赋能翼</text>
    <text x="1085" y="524" fill="#6b7d92" font-size="11" text-anchor="middle">AI场景赋能·活力城市</text>
    <line x1="1010" y1="505" x2="720" y2="430" stroke="#2e8b57" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <!-- legend -->
  <g transform="translate(40,560)">
    <rect x="0" y="0" width="22" height="10" fill="#e4572e"/><text x="32" y="10" fill="#1a2733" font-size="13">智脉主轴 (京张遗址公园活力带)</text>
    <circle cx="11" cy="34" r="9" fill="#e4572e"/><text x="32" y="38" fill="#1a2733" font-size="13">三处重点区域</text>
    <rect x="0" y="56" width="22" height="14" fill="#ffffff" stroke="#1f3a5f"/><text x="32" y="68" fill="#1a2733" font-size="13">两翼协同</text>
    <path d="M0 92 L22 92" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="8 6"/><text x="32" y="96" fill="#6b7d92" font-size="13">临时边界 (provisional)</text>
  </g>

  <text x="40" y="790" fill="#6b7d92" font-size="12">资料来源：资格预审公告(面积文本) + agent任务书；几何为临时粗略边界，仅作可视化</text>
</svg>
