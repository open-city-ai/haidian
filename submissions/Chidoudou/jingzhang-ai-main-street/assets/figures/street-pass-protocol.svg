<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">京张上街票三次盖章协议</title>
  <desc id="desc">一个真实问题依次经过众智园验证、AI原点社区转译和大钟寺限时首用，最终形成采用或退场记录。</desc>
  <rect width="1500" height="520" rx="36" fill="#f4f1e8"/>
  <text x="70" y="88" fill="#0b1530" font-size="46" font-family="Arial, sans-serif" font-weight="700">一张上街票 · 三次盖章 · 七项首用权</text>
  <text x="72" y="128" fill="#66728a" font-size="24" font-family="Arial, sans-serif">ONE STREET PASS · THREE STAMPS · SEVEN FIRST-USE RIGHTS</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="190" width="260" height="210" rx="24" fill="#0b1530"/>
    <text x="105" y="245" fill="#ffffff" font-size="28" font-weight="700">真实问题</text>
    <text x="105" y="286" fill="#c8d3e8" font-size="20">居民 · 小店 · 维护者</text>
    <text x="105" y="335" fill="#5fe1c2" font-size="22">目的 / 边界 / 退出</text>
    <path d="M340 295h75" stroke="#0b1530" stroke-width="10"/>
    <polygon points="415,295 390,279 390,311" fill="#0b1530"/>
    <rect x="430" y="190" width="260" height="210" rx="24" fill="#5fe1c2"/>
    <text x="465" y="245" fill="#0b1530" font-size="28" font-weight="700">01 PROVE</text>
    <text x="465" y="286" fill="#0b1530" font-size="20">众智园 · 可验证</text>
    <text x="465" y="335" fill="#0b1530" font-size="22">安全门 / 模型卡 / 急停</text>
    <path d="M700 295h75" stroke="#0b1530" stroke-width="10"/>
    <polygon points="775,295 750,279 750,311" fill="#0b1530"/>
    <rect x="790" y="190" width="260" height="210" rx="24" fill="#ffd66b"/>
    <text x="825" y="245" fill="#0b1530" font-size="28" font-weight="700">02 TRANSLATE</text>
    <text x="825" y="286" fill="#0b1530" font-size="20">原点社区 · 可转译</text>
    <text x="825" y="335" fill="#0b1530" font-size="22">解释 / 适配 / 人工服务</text>
    <path d="M1060 295h75" stroke="#0b1530" stroke-width="10"/>
    <polygon points="1135,295 1110,279 1110,311" fill="#0b1530"/>
    <rect x="1150" y="190" width="280" height="210" rx="24" fill="#ff9d56"/>
    <text x="1185" y="245" fill="#0b1530" font-size="28" font-weight="700">03 FIRST USE</text>
    <text x="1185" y="286" fill="#0b1530" font-size="20">大钟寺 · 可首用</text>
    <text x="1185" y="335" fill="#0b1530" font-size="22">限时 / 申诉 / 采用或退场</text>
  </g>
  <text x="72" y="465" fill="#ff6f91" font-size="23" font-family="Arial, sans-serif" font-weight="700">概念协议：真实试点须另行取得授权、专业审查与受影响使用者参与。</text>
</svg>
