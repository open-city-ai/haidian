<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <style>
      .bg{fill:#f4f6f3}.paper{fill:#fff}.ink{fill:#17262f}.muted{fill:#68757c}.teal{fill:#078985}.red{fill:#d64b3f}.green{fill:#4d9562}.line{stroke:#cdd5d4;stroke-width:2}.rail{stroke:#17262f;stroke-width:7}.rail2{stroke:#078985;stroke-width:3}.sans{font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.title{font-size:46px;font-weight:700}.sub{font-size:21px}.label{font-size:18px;font-weight:700}.value{font-size:36px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.gate{font-size:22px;font-weight:700}.station{font-size:23px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="2048" height="1152"/>
  <rect class="ink" width="2048" height="112"/>
  <text x="58" y="42" class="sans red label">JING-ZHANG PROOFLINE · v1.5</text>
  <text x="58" y="88" class="sans" font-size="38" font-weight="700" fill="#fff">核心指标 × 一构件一智证里程</text>
  <text x="1990" y="70" class="sans" font-size="20" text-anchor="end" fill="#b9cfcc">同一数据 · 同一机制 · 同一正式表达</text>

  <g transform="translate(58 140)">
    <rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">临时总体设计范围</text><text x="22" y="82" class="sans teal value">1141.3 ha</text><text x="22" y="112" class="sans muted small">EPSG:4548 · 非 official redline</text>
  </g>
  <g transform="translate(448 140)">
    <rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">概念绿地率</text><text x="22" y="82" class="sans teal value">18.0%</text><text x="22" y="112" class="sans muted small">metrics.json · 非法定指标</text>
  </g>
  <g transform="translate(838 140)">
    <rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">公共空间比例</text><text x="22" y="82" class="sans teal value">4.5%</text><text x="22" y="112" class="sans muted small">仅广场型 polygon</text>
  </g>
  <g transform="translate(1228 140)">
    <rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">概念建筑密度</text><text x="22" y="82" class="sans teal value">15.4%</text><text x="22" y="112" class="sans muted small">容量测试 · 法定 FAR unknown</text>
  </g>
  <g transform="translate(1618 140)">
    <rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">AI / 产业验证场景</text><text x="22" y="82" class="sans teal value">12 / 3</text><text x="22" y="112" class="sans muted small">8 个概念行动包</text>
  </g>

  <text x="58" y="330" class="sans ink title">每个构件凭自己的证据走完一里</text>
  <text x="1990" y="326" class="sans muted sub" text-anchor="end">一个构件通过 ≠ 全线通过 ≠ 工程批准</text>
  <line x1="120" y1="404" x2="1928" y2="404" class="rail"/>
  <line x1="120" y1="421" x2="1928" y2="421" class="rail2"/>
  <g class="sans">
    <circle cx="160" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="160" y="420" text-anchor="middle" class="red gate">CR0</text><text x="160" y="475" text-anchor="middle" class="ink label">证据锁定 / 勘察</text>
    <circle cx="590" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="590" y="420" text-anchor="middle" class="red gate">CR1</text><text x="590" y="475" text-anchor="middle" class="ink label">1:1 可逆样机</text>
    <circle cx="1024" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="1024" y="420" text-anchor="middle" class="red gate">CR2</text><text x="1024" y="475" text-anchor="middle" class="ink label">封闭控制测试</text>
    <circle cx="1458" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="1458" y="420" text-anchor="middle" class="red gate">CR3</text><text x="1458" y="475" text-anchor="middle" class="ink label">限时公共试点</text>
    <circle cx="1888" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="1888" y="420" text-anchor="middle" class="red gate">CR4</text><text x="1888" y="475" text-anchor="middle" class="ink label">保留 / 修改 / 拆除</text>
  </g>
  <g class="sans">
    <rect x="408" y="507" width="1232" height="42" rx="21" fill="#e8efed"/><text x="1024" y="535" text-anchor="middle" class="teal label">K01　K02　K03　K04　K05　K06　 ·　每个构件独立登记、独立停止、独立复原</text>
  </g>

  <rect x="58" y="590" width="930" height="450" rx="8" class="paper line"/>
  <text x="88" y="635" class="sans ink" font-size="29" font-weight="700">一个建设湾 · 三层空间</text>
  <text x="88" y="665" class="sans muted body">普通路线始终可用，试验退到授权口袋，证据回到现场。</text>
  <g class="sans">
    <rect x="88" y="700" width="870" height="82" rx="5" fill="#e7f2e9" stroke="#4d9562" stroke-width="2"/>
    <text x="112" y="733" class="green label">L1 普通服务基座</text><text x="112" y="763" class="ink body">断网、断电、无模型仍保证通行 / 导视 / 休息 / 人工帮助</text>
    <rect x="198" y="800" width="650" height="82" rx="5" fill="#fff4ec" stroke="#d87834" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="222" y="833" fill="#d87834" class="label">L2 可逆试验口袋</text><text x="222" y="863" class="ink body">授权、可拆、不侵占无障碍净宽、不把路人变成被迫参与者</text>
    <rect x="88" y="900" width="870" height="82" rx="5" fill="#eef7f5" stroke="#078985" stroke-width="2"/>
    <text x="112" y="933" class="teal label">L3 公共证据轨</text><text x="112" y="963" class="ink body">构件 / 当前闸门 / 责任人 / 非 AI 基线 / 负面结果 / 停止与拆除</text>
  </g>

  <rect x="1016" y="590" width="972" height="450" rx="8" class="paper line"/>
  <text x="1046" y="635" class="sans ink" font-size="29" font-weight="700">三座智证站 · 三次证据交接</text>
  <text x="1046" y="665" class="sans muted body">沿线传递的是可被否决的构件记录，不是设备数量。</text>
  <line x1="1120" y1="838" x2="1880" y2="838" class="rail"/>
  <g class="sans">
    <circle cx="1150" cy="838" r="42" fill="#fff" stroke="#078985" stroke-width="7"/><text x="1150" y="848" text-anchor="middle" class="teal gate">北</text>
    <text x="1150" y="729" text-anchor="middle" class="ink station">众智园</text><text x="1150" y="761" text-anchor="middle" class="red label">技术 · 安全 · 失效</text><text x="1150" y="932" text-anchor="middle" class="muted small">故障与停止证据也必须交接</text>
    <circle cx="1502" cy="838" r="42" fill="#fff" stroke="#078985" stroke-width="7"/><text x="1502" y="848" text-anchor="middle" class="teal gate">中</text>
    <text x="1502" y="729" text-anchor="middle" class="ink station">AI 原点</text><text x="1502" y="761" text-anchor="middle" class="red label">权利 · 维护 · 转移</text><text x="1502" y="932" text-anchor="middle" class="muted small">责任与退役先于规模化</text>
    <circle cx="1850" cy="838" r="42" fill="#fff" stroke="#078985" stroke-width="7"/><text x="1850" y="848" text-anchor="middle" class="teal gate">南</text>
    <text x="1850" y="729" text-anchor="middle" class="ink station">大钟寺</text><text x="1850" y="761" text-anchor="middle" class="red label">使用 · 退出 · 投诉</text><text x="1850" y="932" text-anchor="middle" class="muted small">非参与者影响同样计入</text>
  </g>
  <rect x="58" y="1068" width="1930" height="48" rx="4" fill="#f1e7e3"/>
  <text x="82" y="1099" class="sans red label">边界：</text><text x="148" y="1099" class="sans ink body">本轮不新增几何、数量、尺寸、强度、线位、工期或造价；CR 通过不替代专业签审、法定审批、资金与采购。</text>
</svg>
