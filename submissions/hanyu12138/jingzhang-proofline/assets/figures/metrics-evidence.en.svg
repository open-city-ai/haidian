<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <style>
      .bg{fill:#f4f6f3}.paper{fill:#fff}.ink{fill:#17262f}.muted{fill:#68757c}.teal{fill:#078985}.red{fill:#d64b3f}.green{fill:#4d9562}.line{stroke:#cdd5d4;stroke-width:2}.rail{stroke:#17262f;stroke-width:7}.rail2{stroke:#078985;stroke-width:3}.sans{font-family:Arial,"Segoe UI",sans-serif}.title{font-size:44px;font-weight:700}.sub{font-size:20px}.label{font-size:17px;font-weight:700}.value{font-size:35px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.gate{font-size:21px;font-weight:700}.station{font-size:22px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="2048" height="1152"/>
  <rect class="ink" width="2048" height="112"/>
  <text x="58" y="42" class="sans red label">JING-ZHANG PROOFLINE · v1.5</text>
  <text x="58" y="88" class="sans" font-size="37" font-weight="700" fill="#fff">CORE METRICS × ONE COMPONENT, ONE PROOF-MILE</text>
  <text x="1990" y="70" class="sans" font-size="19" text-anchor="end" fill="#b9cfcc">ONE DATASET · ONE MECHANISM · ONE FORMAL STORY</text>

  <g transform="translate(58 140)"><rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">PROVISIONAL OVERALL AREA</text><text x="22" y="82" class="sans teal value">1141.3 ha</text><text x="22" y="112" class="sans muted small">EPSG:4548 | not official redline</text></g>
  <g transform="translate(448 140)"><rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">CONCEPTUAL GREEN RATIO</text><text x="22" y="82" class="sans teal value">18.0%</text><text x="22" y="112" class="sans muted small">metrics.json | not statutory</text></g>
  <g transform="translate(838 140)"><rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">PUBLIC SPACE RATIO</text><text x="22" y="82" class="sans teal value">4.5%</text><text x="22" y="112" class="sans muted small">plaza polygons only</text></g>
  <g transform="translate(1228 140)"><rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">CONCEPTUAL BCR</text><text x="22" y="82" class="sans teal value">15.4%</text><text x="22" y="112" class="sans muted small">capacity test | statutory FAR unknown</text></g>
  <g transform="translate(1618 140)"><rect class="paper line" width="370" height="132" rx="6"/><text x="22" y="35" class="sans red label">AI / INDUSTRY SCENARIOS</text><text x="22" y="82" class="sans teal value">12 / 3</text><text x="22" y="112" class="sans muted small">8 conceptual action packages</text></g>

  <text x="58" y="330" class="sans ink title">EACH COMPONENT EARNS ITS OWN MILE</text>
  <text x="1990" y="326" class="sans muted sub" text-anchor="end">one pass ≠ line-wide pass ≠ construction approval</text>
  <line x1="120" y1="404" x2="1928" y2="404" class="rail"/><line x1="120" y1="421" x2="1928" y2="421" class="rail2"/>
  <g class="sans">
    <circle cx="160" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="160" y="420" text-anchor="middle" class="red gate">CR0</text><text x="160" y="475" text-anchor="middle" class="ink label">EVIDENCE LOCK / SURVEY</text>
    <circle cx="590" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="590" y="420" text-anchor="middle" class="red gate">CR1</text><text x="590" y="475" text-anchor="middle" class="ink label">1:1 REVERSIBLE MOCK-UP</text>
    <circle cx="1024" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="1024" y="420" text-anchor="middle" class="red gate">CR2</text><text x="1024" y="475" text-anchor="middle" class="ink label">CONTROLLED TEST</text>
    <circle cx="1458" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="1458" y="420" text-anchor="middle" class="red gate">CR3</text><text x="1458" y="475" text-anchor="middle" class="ink label">TIME-LIMITED PILOT</text>
    <circle cx="1888" cy="412" r="35" fill="#fff" stroke="#d64b3f" stroke-width="6"/><text x="1888" y="420" text-anchor="middle" class="red gate">CR4</text><text x="1888" y="475" text-anchor="middle" class="ink label">RETAIN / MODIFY / REMOVE</text>
  </g>
  <rect x="408" y="507" width="1232" height="42" rx="21" fill="#e8efed"/><text x="1024" y="535" text-anchor="middle" class="sans teal label">K01　K02　K03　K04　K05　K06　 |　SEPARATE RECORD · STOP · REINSTATEMENT</text>

  <rect x="58" y="590" width="930" height="450" rx="8" class="paper line"/>
  <text x="88" y="635" class="sans ink" font-size="29" font-weight="700">ONE CONSTRUCTION BAY · THREE LAYERS</text>
  <text x="88" y="665" class="sans muted body">The ordinary route works; the test retreats into a pocket; evidence returns on site.</text>
  <g class="sans">
    <rect x="88" y="700" width="870" height="82" rx="5" fill="#e7f2e9" stroke="#4d9562" stroke-width="2"/><text x="112" y="733" class="green label">L1 ORDINARY-SERVICE BASE</text><text x="112" y="763" class="ink body">Passage / wayfinding / rest / staffed help without model, power or network</text>
    <rect x="198" y="800" width="650" height="82" rx="5" fill="#fff4ec" stroke="#d87834" stroke-width="2" stroke-dasharray="9 7"/><text x="222" y="833" fill="#d87834" class="label">L2 REVERSIBLE TEST POCKET</text><text x="222" y="863" class="ink body">Authorized, removable, outside clear width, never compulsory</text>
    <rect x="88" y="900" width="870" height="82" rx="5" fill="#eef7f5" stroke="#078985" stroke-width="2"/><text x="112" y="933" class="teal label">L3 PUBLIC EVIDENCE RAIL</text><text x="112" y="963" class="ink body">Component / gate / operator / baseline / negative findings / stop / removal</text>
  </g>

  <rect x="1016" y="590" width="972" height="450" rx="8" class="paper line"/>
  <text x="1046" y="635" class="sans ink" font-size="29" font-weight="700">THREE PROOF STATIONS · THREE HANDOFFS</text>
  <text x="1046" y="665" class="sans muted body">A rejectable component record—not device count—moves along the line.</text>
  <line x1="1120" y1="838" x2="1880" y2="838" class="rail"/>
  <g class="sans">
    <circle cx="1150" cy="838" r="42" fill="#fff" stroke="#078985" stroke-width="7"/><text x="1150" y="848" text-anchor="middle" class="teal gate">N</text><text x="1150" y="729" text-anchor="middle" class="ink station">ZHONGZHIYUAN</text><text x="1150" y="761" text-anchor="middle" class="red label">TECH · SAFETY · FAILURE</text><text x="1150" y="932" text-anchor="middle" class="muted small">failure and stop evidence transfers too</text>
    <circle cx="1502" cy="838" r="42" fill="#fff" stroke="#078985" stroke-width="7"/><text x="1502" y="848" text-anchor="middle" class="teal gate">C</text><text x="1502" y="729" text-anchor="middle" class="ink station">AI ORIGIN</text><text x="1502" y="761" text-anchor="middle" class="red label">RIGHTS · CARE · TRANSFER</text><text x="1502" y="932" text-anchor="middle" class="muted small">accountability precedes scaling</text>
    <circle cx="1850" cy="838" r="42" fill="#fff" stroke="#078985" stroke-width="7"/><text x="1850" y="848" text-anchor="middle" class="teal gate">S</text><text x="1850" y="729" text-anchor="middle" class="ink station">DAZHONGSI</text><text x="1850" y="761" text-anchor="middle" class="red label">USE · OPT-OUT · COMPLAINT</text><text x="1850" y="932" text-anchor="middle" class="muted small">non-participant effects count</text>
  </g>
  <rect x="58" y="1068" width="1930" height="48" rx="4" fill="#f1e7e3"/>
  <text x="82" y="1099" class="sans red label">BOUNDARY:</text><text x="188" y="1099" class="sans ink body">No new geometry, quantity, dimension, strength, alignment, schedule or cost; CR passes never replace professional or statutory approval.</text>
</svg>
