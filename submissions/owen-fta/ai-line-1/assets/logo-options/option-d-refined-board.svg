<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">AI LINE 1 D方案配色优化</title>
  <desc id="desc">浅色标准版、深色反白版、独立符号及品牌色</desc>
  <rect width="1600" height="1200" fill="#F0F7F8"/>
  <text x="70" y="82" font-family="Arial,'PingFang SC',sans-serif" font-size="42" font-weight="800" fill="#064B5B">AI LINE 1 · D BRIGHT</text>
  <text x="70" y="124" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#365E67">开放交叉网络｜新叶绿 × 明亮青蓝 × 强烈正红</text>
  <rect x="60" y="170" width="1480" height="414" rx="28" fill="#FFF"/>
  <image href="option-d-open-network.svg" x="84" y="193" width="1432" height="366"/>
  <rect x="60" y="624" width="1000" height="456" rx="28" fill="#FFF"/>
  <image href="option-d-open-network-dark.svg" x="84" y="648" width="952" height="286"/>
  <text x="92" y="1003" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#174D45">深色反白版｜适合封面、夜景导视与数字界面</text>
  <rect x="1100" y="624" width="440" height="456" rx="28" fill="#FFF"/>
  <image href="option-d-symbol.svg" x="1130" y="648" width="380" height="285"/>
  <text x="1130" y="1003" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#174D45">独立符号</text>
  <g transform="translate(70 1120)" font-family="Arial,'PingFang SC',sans-serif">
    <circle cx="14" cy="0" r="14" fill="#16B85C"/><text x="38" y="7" font-size="18" fill="#405D69">新叶绿 #16B85C</text>
    <circle cx="254" cy="0" r="14" fill="#08B9E6"/><text x="278" y="7" font-size="18" fill="#405D69">明亮青蓝 #08B9E6</text>
    <circle cx="514" cy="0" r="14" fill="#F2383D"/><text x="538" y="7" font-size="18" fill="#405D69">强烈正红 #F2383D</text>
    <circle cx="794" cy="0" r="14" fill="#064B5B"/><text x="818" y="7" font-size="18" fill="#405D69">深青文字 #064B5B</text>
    <circle cx="1050" cy="0" r="14" fill="#FFFFFF" stroke="#CBD9D4"/><text x="1074" y="7" font-size="18" fill="#405D69">纯净白 #FFFFFF</text>
