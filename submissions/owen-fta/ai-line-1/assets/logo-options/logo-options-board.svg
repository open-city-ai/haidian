<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">AI LINE 1 Logo 四方向对比</title>
  <desc id="desc">四套AI LINE 1品牌标识及概念说明</desc>
  <rect width="1600" height="1160" fill="#EAF0F1"/>
  <text x="70" y="80" font-family="Arial,'PingFang SC',sans-serif" font-size="42" font-weight="800" fill="#081C2C">AI LINE 1 · LOGO DIRECTIONS</text>
  <text x="70" y="122" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#607782">四个方向均围绕：创新区珠链 · 轨道连接 · 核心创新引擎 · 数字1</text>
  <g transform="translate(60 170)">
    <rect width="710" height="620" rx="24" fill="#FFF"/>
    <image href="option-a-pearl-chain.svg" x="20" y="20" width="670" height="201"/>
    <text x="28" y="292" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="800" fill="#081C2C">A｜珠链一号线</text>
    <text x="28" y="344" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">最直接表达“创新区像珠子，</text>
    <text x="28" y="377" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">由轨道串成分布式网络”。</text>
    <text x="28" y="430" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">中心节点向下形成数字1，</text>
    <text x="28" y="463" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">强化公共品牌记忆。</text>
    <text x="28" y="552" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#118F8A">关键词：网络 / 珠链 / 识别清晰 / 适合导视</text>
  </g>
  <g transform="translate(830 170)">
    <rect width="710" height="620" rx="24" fill="#FFF"/>
    <image href="option-b-district-core.svg" x="20" y="20" width="670" height="201"/>
    <text x="28" y="292" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="800" fill="#081C2C">B｜创新区核心</text>
    <text x="28" y="344" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">外环是创新区，内核是超级创新元，</text>
    <text x="28" y="377" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">横线是交通网络。</text>
    <text x="28" y="430" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">概念最严谨，适合方法论、</text>
    <text x="28" y="463" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">认证体系与节点铭牌。</text>
    <text x="28" y="552" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#118F8A">关键词：创新区 / 核心引擎 / 专业 / 稳定</text>
  </g>
  <g transform="translate(60 850)">
    <rect width="710" height="620" rx="24" fill="#FFF"/>
    <image href="option-c-jingzhang-track.svg" x="20" y="20" width="670" height="201"/>
    <text x="28" y="292" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="800" fill="#081C2C">C｜京张轨迹</text>
    <text x="28" y="344" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">以京张铁路双轨和透视轨枕</text>
    <text x="28" y="377" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">建立项目专属性。</text>
    <text x="28" y="430" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">轨道汇聚为数字1，强调从历史通道</text>
    <text x="28" y="463" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">通向AI未来。</text>
    <text x="28" y="552" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#118F8A">关键词：京张记忆 / 时间轨迹 / 地域性 / 叙事感</text>
  </g>
  <g transform="translate(830 850)">
    <rect width="710" height="620" rx="24" fill="#FFF"/>
    <image href="option-d-open-network.svg" x="20" y="20" width="670" height="201"/>
    <text x="28" y="292" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="800" fill="#081C2C">D｜开放交叉网络</text>
    <text x="28" y="344" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">两类创新路径交叉，</text>
    <text x="28" y="377" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">在中心产生新的核心创新引擎。</text>
    <text x="28" y="430" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">强调交叉创新与开放协作，</text>
    <text x="28" y="463" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#405D69">造型更活跃、更国际化。</text>
    <text x="28" y="552" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#118F8A">关键词：交叉创新 / 开放 / 动态 / 国际表达</text>
  </g>
</svg>
