<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="t d">
  <title id="t">五高法则整体诊断与当期行动资源建议</title>
  <desc id="d">以成熟度雷达、问题紧迫度矩阵和诊断后资源建议环图表达产业生态、文化社群、服务网络、创新场景和政策治理</desc>
  <rect width="1800" height="1050" rx="42" fill="#F4F9FA"/>
  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" fill="#064B5B">
    <text x="70" y="82" font-size="42" font-weight="800">整体诊断｜基础成熟度 × 问题紧迫度 × 当期行动资源建议</text>
    <text x="70" y="125" font-size="23" fill="#52727A">比例由诊断结果推导，用于本轮行动排序；五项本体同等重要，不是预设权重或绩效得分</text>
  </g>

  <g transform="translate(42 170)">
    <rect width="550" height="810" rx="28" fill="#FFFFFF"/>
    <text x="34" y="54" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="800" fill="#064B5B">01｜基础成熟度</text>
    <text x="34" y="88" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#627A80">相对成熟度，仅表示本轮专业判断</text>
    <g transform="translate(277 357)" fill="none" stroke="#D9E8EB">
      <polygon points="0,-188 179,-58 111,152 -111,152 -179,-58"/>
      <polygon points="0,-141 134,-44 83,114 -83,114 -134,-44"/>
      <polygon points="0,-94 89,-29 55,76 -55,76 -89,-29"/>
      <polygon points="0,-47 45,-15 28,38 -28,38 -45,-15"/>
      <path d="M0 0V-188M0 0L179-58M0 0L111 152M0 0L-111 152M0 0L-179-58"/>
    </g>
    <polygon points="277,222 393,319 344,449 190,477 116,324" fill="#08B9E6" fill-opacity=".20" stroke="#08B9E6" stroke-width="7"/>
    <g fill="#F2383D"><circle cx="277" cy="222" r="8"/><circle cx="393" cy="319" r="8"/><circle cx="344" cy="449" r="8"/><circle cx="190" cy="477" r="8"/><circle cx="116" cy="324" r="8"/></g>
    <g font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#064B5B">
      <text x="229" y="145">产业生态</text><text x="426" y="310">文化社群</text><text x="374" y="510">服务网络</text><text x="88" y="541">创新场景</text><text x="26" y="310">政策治理</text>
    </g>
    <g transform="translate(34 600)" font-family="Arial,'PingFang SC',sans-serif">
      <rect width="482" height="165" rx="18" fill="#EAF8FB"/>
      <text x="22" y="39" font-size="20" font-weight="800" fill="#064B5B">判断</text>
      <text x="22" y="75" font-size="18" fill="#365E67">产业资源基础最强；服务入口、跨区</text>
      <text x="22" y="105" font-size="18" fill="#365E67">调用与场景规则尚未形成网络，成为</text>
      <text x="22" y="135" font-size="18" fill="#365E67">从“资源密度”走向“协作效率”的瓶颈。</text>
    </g>
  </g>

  <g transform="translate(625 170)">
    <rect width="585" height="810" rx="28" fill="#FFFFFF"/>
    <text x="34" y="54" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="800" fill="#064B5B">02｜问题紧迫度矩阵</text>
    <text x="34" y="88" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#627A80">越靠右上，越需优先配置行动资源</text>
    <g transform="translate(78 132)">
      <rect width="450" height="460" rx="12" fill="#F8FBFC" stroke="#D9E8EB"/>
      <path d="M0 230H450M225 0V460" stroke="#D9E8EB" stroke-dasharray="8 8"/>
      <text x="7" y="486" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#627A80">局部影响</text>
      <text x="370" y="486" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#627A80">网络影响</text>
      <text transform="translate(-38 390) rotate(-90)" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#627A80">紧迫度</text>
      <g font-family="Arial,'PingFang SC',sans-serif" font-weight="800">
        <circle cx="363" cy="92" r="48" fill="#F2383D"/><text x="319" y="99" font-size="20" fill="#FFF">服务网络</text>
        <circle cx="318" cy="150" r="43" fill="#E94F57"/><text x="276" y="157" font-size="19" fill="#FFF">政策治理</text>
        <circle cx="365" cy="219" r="40" fill="#08B9E6"/><text x="326" y="226" font-size="18" fill="#FFF">创新场景</text>
        <circle cx="230" cy="260" r="36" fill="#16B85C"/><text x="195" y="267" font-size="17" fill="#FFF">文化社群</text>
        <circle cx="145" cy="335" r="31" fill="#FF8A34"/><text x="114" y="341" font-size="15" fill="#FFF">产业生态</text>
      </g>
    </g>
    <g transform="translate(34 652)" font-family="Arial,'PingFang SC',sans-serif">
      <rect width="517" height="113" rx="18" fill="#FFF2F2"/>
      <text x="22" y="39" font-size="20" font-weight="800" fill="#C72C34">首要矛盾</text>
      <text x="22" y="75" font-size="18" fill="#5D5153">不是产业资源不足，而是服务、治理和场景</text>
      <text x="22" y="101" font-size="18" fill="#5D5153">尚未把分散资源转化为可进入的协作网络。</text>
    </g>
  </g>

  <g transform="translate(1243 170)">
    <rect width="515" height="810" rx="28" fill="#FFFFFF"/>
    <text x="34" y="54" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="800" fill="#064B5B">03｜行动资源建议</text>
    <text x="34" y="88" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#627A80">诊断后生成｜年度复盘后动态调整</text>
    <g transform="translate(257 312) rotate(-90)" fill="none" stroke-width="54">
      <circle r="139" stroke="#EAF0F1"/>
      <circle r="139" stroke="#F2383D" stroke-dasharray="227 647" stroke-dashoffset="0"/>
      <circle r="139" stroke="#E94F57" stroke-dasharray="210 664" stroke-dashoffset="-227"/>
      <circle r="139" stroke="#08B9E6" stroke-dasharray="184 690" stroke-dashoffset="-437"/>
      <circle r="139" stroke="#16B85C" stroke-dasharray="149 725" stroke-dashoffset="-621"/>
      <circle r="139" stroke="#FF8A34" stroke-dasharray="105 769" stroke-dashoffset="-770"/>
    </g>
    <g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">
      <text x="257" y="303" font-size="48" font-weight="900" fill="#064B5B">100%</text>
      <text x="257" y="337" font-size="17" fill="#627A80">本轮行动资源</text>
    </g>
    <g transform="translate(54 520)" font-family="Arial,'PingFang SC',sans-serif">
      <g><circle cx="11" cy="10" r="9" fill="#F2383D"/><text x="31" y="17" font-size="20" fill="#365E67">服务网络</text><text x="371" y="17" font-size="23" font-weight="900" fill="#064B5B">26%</text></g>
      <g transform="translate(0 46)"><circle cx="11" cy="10" r="9" fill="#E94F57"/><text x="31" y="17" font-size="20" fill="#365E67">政策治理</text><text x="371" y="17" font-size="23" font-weight="900" fill="#064B5B">24%</text></g>
      <g transform="translate(0 92)"><circle cx="11" cy="10" r="9" fill="#08B9E6"/><text x="31" y="17" font-size="20" fill="#365E67">创新场景</text><text x="371" y="17" font-size="23" font-weight="900" fill="#064B5B">21%</text></g>
      <g transform="translate(0 138)"><circle cx="11" cy="10" r="9" fill="#16B85C"/><text x="31" y="17" font-size="20" fill="#365E67">文化社群</text><text x="371" y="17" font-size="23" font-weight="900" fill="#064B5B">17%</text></g>
      <g transform="translate(0 184)"><circle cx="11" cy="10" r="9" fill="#FF8A34"/><text x="31" y="17" font-size="20" fill="#365E67">产业生态</text><text x="371" y="17" font-size="23" font-weight="900" fill="#064B5B">12%</text></g>
    </g>
    <rect x="34" y="757" width="447" height="1" fill="#D9E8EB"/>
    <text x="257" y="788" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#627A80">先打通瓶颈，再根据真实成效重新配置</text>
  </g>
</svg>
