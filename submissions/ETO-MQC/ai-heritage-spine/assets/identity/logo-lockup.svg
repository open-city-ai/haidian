<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">京张人字线 · 智脉共生带 Logo 与中英文标准字</title>
  <desc id="desc">由铁路人字形展线、AI 脉冲与公共绿脊构成的可视化品牌标志。</desc>
  <rect width="1600" height="900" fill="#F7F5EF"/>
  <g transform="translate(150,160)">
    <path d="M120 360 L310 90 L500 360" fill="none" stroke="#274E88" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 360 L310 590 L500 360" fill="none" stroke="#126A58" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M310 90 L310 590" fill="none" stroke="#D9822B" stroke-width="20" stroke-linecap="round" stroke-dasharray="12 34"/>
    <circle cx="310" cy="360" r="46" fill="#F7F5EF" stroke="#BE3A34" stroke-width="18"/>
    <circle cx="310" cy="360" r="13" fill="#BE3A34"/>
  </g>
  <g fill="#1C2635" font-family="Noto Sans CJK SC, Noto Sans CJK TC, sans-serif">
    <text x="760" y="290" font-size="68" font-weight="700" letter-spacing="3">京张人字线</text>
    <text x="760" y="375" font-size="42" fill="#126A58" letter-spacing="7">智脉共生带</text>
    <rect x="760" y="420" width="490" height="6" fill="#D9822B"/>
    <text x="760" y="505" font-size="32" font-family="DejaVu Sans, sans-serif" letter-spacing="1">JINGZHANG HERRINGBONE LINE</text>
    <text x="760" y="555" font-size="26" font-family="DejaVu Sans, sans-serif" fill="#5D6671" letter-spacing="1">LIVING INTELLIGENCE SPINE</text>
    <text x="760" y="670" font-size="23" fill="#5D6671">标志语义：铁路人字展线 · 智能节点 · 生态公共主脊</text>
    <text x="760" y="710" font-size="18" fill="#5D6671" font-family="DejaVu Sans, sans-serif">Meaning: rail herringbone · intelligence node · civic ecological spine</text>
  </g>
  <text x="150" y="830" fill="#5D6671" font-family="Noto Sans CJK SC, sans-serif" font-size="18">概念性品牌识别资产｜用于方案呈现；不主张已注册商标或官方标识。</text>
</svg>
