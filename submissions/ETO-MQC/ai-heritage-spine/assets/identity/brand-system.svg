  <text x="110" y="1140" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5D6671">概念性 VI 资产：服务提交方案的空间品牌表达；未声称任何官方授权、注册商标或既有合作关系。</text>
