<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">京张共振环三类可逆空间细部</title><desc id="d">遗址公园通行庭、近校知识前台与站城日常门从观察、临时布置到复核和专业交接的流程</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="760" fill="#fffdf7"/><rect width="1440" height="108" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="49" font-size="31" font-weight="700" fill="#fff">三类可逆空间细部：先观察，再布置，后交接</text><text x="56" y="80" font-size="17" fill="#d9e7df">不把效果图当建设清单｜不阻断无障碍和消防｜不跨越铁路安全边界｜不采集个人画像</text>
<g filter="url(#s)"><rect x="55" y="145" width="405" height="490" rx="18" fill="#fff" stroke="#b7d0c4"/><rect x="517" y="145" width="405" height="490" rx="18" fill="#fff" stroke="#e6cca5"/><rect x="979" y="145" width="405" height="490" rx="18" fill="#fff" stroke="#ccc2dd"/></g>
<rect x="55" y="145" width="405" height="68" rx="18" fill="#1e6b5a"/><text x="82" y="187" font-size="23" font-weight="700" fill="#fff">01 遗址公园 · 通行庭</text>
<rect x="517" y="145" width="405" height="68" rx="18" fill="#b98345"/><text x="544" y="187" font-size="23" font-weight="700" fill="#fff">02 近校界面 · 知识前台</text>
<rect x="979" y="145" width="405" height="68" rx="18" fill="#776b94"/><text x="1006" y="187" font-size="23" font-weight="700" fill="#fff">03 站城街角 · 日常门</text>
<g font-size="16" fill="#374e45"><text x="82" y="251" font-weight="700" fill="#1e6b5a">观察</text><text x="82" y="279">树荫、排水、遗存、交叉口</text><text x="82" y="304">无障碍通行与夜间照度</text><text x="544" y="251" font-weight="700" fill="#a46f2a">观察</text><text x="544" y="279">首层开口、疏散、课间高峰</text><text x="544" y="304">成果权利与日常维护</text><text x="1006" y="251" font-weight="700" fill="#776b94">观察</text><text x="1006" y="279">站口流线、过街、夜间照明</text><text x="1006" y="304">商户界面与无障碍连续性</text>
<line x1="82" y1="336" x2="433" y2="336" stroke="#d8d2c1"/><line x1="544" y1="336" x2="895" y2="336" stroke="#d8d2c1"/><line x1="1006" y1="336" x2="1357" y2="336" stroke="#d8d2c1"/>
<text x="82" y="374" font-weight="700" fill="#1e6b5a">最小可逆布置</text><text x="82" y="402">移动坐凳/遮阴 · 离线路径图</text><text x="82" y="427">问题牌 · 人工问询桌</text><text x="544" y="374" font-weight="700" fill="#a46f2a">最小可逆布置</text><text x="544" y="402">成果卡架 · 公共工作台</text><text x="544" y="427">署名/撤回说明 · 咨询时段牌</text><text x="1006" y="374" font-weight="700" fill="#776b94">最小可逆布置</text><text x="1006" y="402">静态导视 · 遮阴坐憩</text><text x="1006" y="427">人工问询点 · 夜间观察板</text>
<line x1="82" y1="459" x2="433" y2="459" stroke="#d8d2c1"/><line x1="544" y1="459" x2="895" y2="459" stroke="#d8d2c1"/><line x1="1006" y1="459" x2="1357" y2="459" stroke="#d8d2c1"/>
<text x="82" y="497" font-weight="700" fill="#1e6b5a">交接 / 撤回</text><text x="82" y="525">观察不同天气和人流后交景观</text><text x="82" y="550">积水、遮挡或安全疑虑即撤</text><text x="544" y="497" font-weight="700" fill="#a46f2a">交接 / 撤回</text><text x="544" y="525">权利、维护、疏散稳定后交专业</text><text x="544" y="550">权利不清或通行受阻即撤展</text><text x="1006" y="497" font-weight="700" fill="#776b94">交接 / 撤回</text><text x="1006" y="525">高峰/夜间完成观察后交交通团队</text><text x="1006" y="550">拥挤、误导或隐私争议即切回静态</text></g>
<rect x="55" y="672" width="1329" height="54" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="82" y="705" font-size="17" font-weight="700" fill="#173b35">四份概念阶段交接物：</text><text x="340" y="705" font-size="16" fill="#5b6b62">现场观察表　｜　临时布置图　｜　人工服务责任卡　｜　撤回 / 修订记录</text></g>
</svg>
