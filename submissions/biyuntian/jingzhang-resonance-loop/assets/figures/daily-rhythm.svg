<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc">
  <title id="title">京张共振环三核一日公共服务节奏</title><desc id="desc">众智园、AI原点和大钟寺在早高峰、日间、傍晚的公共服务节奏、人工基线与现场回执</desc>
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".10"/></filter></defs>
  <rect width="1440" height="770" fill="#fffdf7"/><rect x="0" y="0" width="1440" height="112" fill="#173b35"/>
  <text x="58" y="51" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">三核一日：让 AI 在日常中接受公共检验</text>
  <text x="58" y="83" font-family="Arial, sans-serif" font-size="17" fill="#d9e7df">早高峰先保障通行｜日间再开放协作｜傍晚回到人工复核；每一时段保留可离线使用的城市回响</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="150" width="250" height="84" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="78" y="185" font-size="23" font-weight="700" fill="#173b35">早高峰</text><text x="78" y="213" font-size="16" fill="#4c665c">先让通行与人工入口成立</text>
    <rect x="50" y="328" width="250" height="84" rx="14" fill="#fbf6ed" stroke="#e4c99e"/><text x="78" y="363" font-size="23" font-weight="700" fill="#a46f2a">日间</text><text x="78" y="391" font-size="16" fill="#6d6657">再让协作与解释可见</text>
    <rect x="50" y="506" width="250" height="84" rx="14" fill="#f3f0f8" stroke="#c9bfd8"/><text x="78" y="541" font-size="23" font-weight="700" fill="#776b94">傍晚</text><text x="78" y="569" font-size="16" fill="#625d6f">最后回到公共复核</text>
    <text x="50" y="680" font-size="17" font-weight="700" fill="#173b35">共同底线</text><text x="50" y="711" font-size="15" fill="#5b6b62">无手机 / 无账号 / 无算法时，仍能走、能懂、能问、能停留</text>
    <g filter="url(#s)">
      <rect x="330" y="130" width="335" height="480" rx="18" fill="#fff" stroke="#b6cfc2"/><rect x="330" y="130" width="335" height="58" rx="18" fill="#1e6b5a"/><text x="356" y="166" font-size="23" font-weight="700" fill="#fff">众智园 · 可信算力花园</text>
      <rect x="690" y="130" width="335" height="480" rx="18" fill="#fff" stroke="#e2c89e"/><rect x="690" y="130" width="335" height="58" rx="18" fill="#b98345"/><text x="716" y="166" font-size="23" font-weight="700" fill="#fff">AI 原点 · 开源前台</text>
      <rect x="1050" y="130" width="335" height="480" rx="18" fill="#fff" stroke="#c8c0d8"/><rect x="1050" y="130" width="335" height="58" rx="18" fill="#776b94"/><text x="1076" y="166" font-size="23" font-weight="700" fill="#fff">大钟寺 · 人机共行商街</text>
    </g>
    <g font-size="16" fill="#344b43"><text x="356" y="222"><tspan font-weight="700" fill="#1e6b5a">通行优先</tspan><tspan x="356" dy="28">测试设备不占主通道</tspan><tspan x="356" dy="25">纸质说明、人工预约、坐憩</tspan></text><text x="716" y="222"><tspan font-weight="700" fill="#a46f2a">近校优先</tspan><tspan x="716" dy="28">实体导览、人工问询</tspan><tspan x="716" dy="25">发布不挤占步行界面</tspan></text><text x="1076" y="222"><tspan font-weight="700" fill="#776b94">站城优先</tspan><tspan x="1076" dy="28">过街、无障碍、站口导向</tspan><tspan x="1076" dy="25">自动提示仅作补充</tspan></text>
    <line x1="348" y1="300" x2="645" y2="300" stroke="#d8d2c1"/><line x1="708" y1="300" x2="1005" y2="300" stroke="#d8d2c1"/><line x1="1068" y1="300" x2="1365" y2="300" stroke="#d8d2c1"/>
    <text x="356" y="354"><tspan font-weight="700" fill="#1e6b5a">可观察测试</tspan><tspan x="356" dy="28">非生产测试、低碳解释</tspan><tspan x="356" dy="25">人工答疑与可停留庭院</tspan></text><text x="716" y="354"><tspan font-weight="700" fill="#a46f2a">可理解协作</tspan><tspan x="716" dy="28">成果卡、公开课、权利咨询</tspan><tspan x="716" dy="25">无登录公共工作台</tspan></text><text x="1076" y="354"><tspan font-weight="700" fill="#776b94">可解释日常</tspan><tspan x="1076" dy="28">商户/居民服务与观察</tspan><tspan x="1076" dy="25">静态导视、坐等街角</tspan></text>
    <line x1="348" y1="478" x2="645" y2="478" stroke="#d8d2c1"/><line x1="708" y1="478" x2="1005" y2="478" stroke="#d8d2c1"/><line x1="1068" y1="478" x2="1365" y2="478" stroke="#d8d2c1"/>
    <text x="356" y="532"><tspan font-weight="700" fill="#1e6b5a">问题—人工答复</tspan><tspan x="356" dy="28">收束测试，公开异常与修订</tspan><tspan x="356" dy="25">回执：范围与接管说明</tspan></text><text x="716" y="532"><tspan font-weight="700" fill="#a46f2a">发布—撤回可见</tspan><tspan x="716" dy="28">开源交流、开发者散步道</tspan><tspan x="716" dy="25">回执：授权与修订入口</tspan></text><text x="1076" y="532"><tspan font-weight="700" fill="#776b94">夜间人工复核</tspan><tspan x="1076" dy="28">文化导览、照明提示、服务台</tspan><tspan x="1076" dy="25">回执：高峰/夜间观察状态</tspan></text></g>
  </g>
  <rect x="330" y="660" width="1055" height="70" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="358" y="690" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173b35">现场回执</text><text x="358" y="716" font-family="Arial, sans-serif" font-size="15" fill="#5b6b62">只记录汇总的空间与服务状态；不记录个人轨迹、身份、画像或未经授权的数据。条件不满足即缩小、转人工或暂停。</text>
</svg>
