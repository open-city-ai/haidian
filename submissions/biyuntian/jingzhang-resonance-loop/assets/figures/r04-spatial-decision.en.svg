<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">R04 Open Knowledge Front Desk spatial decision</title><desc id="desc">Three conceptual interface alternatives for the AI Origin open knowledge front desk: central display island rejected, distributed service points revised, side knowledge front desk advanced.</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173b35" flood-opacity=".14"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dce5df" stroke-width="1"/></pattern></defs>
<rect width="1600" height="940" fill="#fffdf7"/><rect width="1600" height="126" fill="#163c36"/><g font-family="Arial, sans-serif"><text x="62" y="57" font-size="34" font-weight="700" fill="#fff">R04 Open Knowledge Front Desk: three alternatives, one public-route decision</text><text x="62" y="94" font-size="18" fill="#d9e7df">Conceptual spatial-relation check only — not a survey, permitted plan, construction drawing or delivery claim</text>
<g transform="translate(60 168)"><rect width="460" height="548" rx="20" fill="#fff" stroke="#d8c4c0" stroke-width="2" filter="url(#shadow)"/><rect width="460" height="76" rx="20" fill="#8e3d38"/><text x="28" y="47" font-size="26" font-weight="700" fill="#fff">R04-A · Central island</text><text x="370" y="47" font-size="17" font-weight="700" fill="#ffe8e6">REJECT</text><g transform="translate(28 108)"><rect width="404" height="262" rx="12" fill="url(#grid)" stroke="#d8c4c0"/><path d="M18 132H386" stroke="#1f9b85" stroke-width="30" stroke-linecap="round"/><path d="M18 132H386" stroke="#fff" stroke-width="5" stroke-dasharray="14 11"/><rect x="151" y="72" width="102" height="120" rx="12" fill="#c45b51"/><text x="202" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Digital</text><text x="202" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">island</text><text x="202" y="234" text-anchor="middle" font-size="15" fill="#9a3f39">Ordinary route must detour</text></g><text x="28" y="416" font-size="19" font-weight="700" fill="#8e3d38">Fails P01 route / P02 no-login access</text><text x="28" y="454" font-size="17" fill="#53645d">A display occupies the movement centre.</text><text x="28" y="480" font-size="17" fill="#53645d">Walking and staffed help cannot arrive together.</text><rect x="28" y="506" width="404" height="24" rx="12" fill="#f6e3df"/><text x="230" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#8e3d38">REJECT DESIGN · no trial</text></g>
<g transform="translate(570 168)"><rect width="460" height="548" rx="20" fill="#fff" stroke="#dfcfb5" stroke-width="2" filter="url(#shadow)"/><rect width="460" height="76" rx="20" fill="#b87832"/><text x="28" y="47" font-size="26" font-weight="700" fill="#fff">R04-B · Distributed points</text><text x="365" y="47" font-size="17" font-weight="700" fill="#fff4dc">REVISE</text><g transform="translate(28 108)"><rect width="404" height="262" rx="12" fill="url(#grid)" stroke="#dfcfb5"/><path d="M18 132H386" stroke="#1f9b85" stroke-width="30" stroke-linecap="round"/><path d="M18 132H386" stroke="#fff" stroke-width="5" stroke-dasharray="14 11"/><rect x="66" y="54" width="82" height="64" rx="10" fill="#c78d46"/><rect x="256" y="145" width="92" height="64" rx="10" fill="#c78d46"/><rect x="168" y="60" width="82" height="64" rx="10" fill="#c78d46"/><text x="107" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Cards</text><text x="209" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Help</text><text x="302" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Table</text><text x="202" y="242" text-anchor="middle" font-size="15" fill="#a46d2d">Responsibility is scattered</text></g><text x="28" y="416" font-size="19" font-weight="700" fill="#a46d2d">Revise P03 human handoff / P04 withdrawal</text><text x="28" y="454" font-size="17" fill="#53645d">The route remains, but first-time visitors</text><text x="28" y="480" font-size="17" fill="#53645d">cannot read who explains or withdraws content.</text><rect x="28" y="506" width="404" height="24" rx="12" fill="#f8ecd9"/><text x="230" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#a46d2d">REVISE DESIGN · integrate interface</text></g>
<g transform="translate(1080 168)"><rect width="460" height="548" rx="20" fill="#fff" stroke="#abcdbd" stroke-width="2" filter="url(#shadow)"/><rect width="460" height="76" rx="20" fill="#1c7464"/><text x="28" y="47" font-size="26" font-weight="700" fill="#fff">R04-C · Side front desk</text><text x="355" y="47" font-size="17" font-weight="700" fill="#e3f5ec">ADVANCE</text><g transform="translate(28 108)"><rect width="404" height="262" rx="12" fill="url(#grid)" stroke="#abcdbd"/><path d="M18 132H386" stroke="#1f9b85" stroke-width="30" stroke-linecap="round"/><path d="M18 132H386" stroke="#fff" stroke-width="5" stroke-dasharray="14 11"/><rect x="260" y="42" width="104" height="164" rx="12" fill="#1b7666"/><rect x="274" y="55" width="76" height="33" rx="6" fill="#e5b768"/><rect x="274" y="100" width="76" height="33" rx="6" fill="#d6eee5"/><rect x="274" y="145" width="76" height="43" rx="6" fill="#e5b768"/><text x="312" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#173b35">Cards</text><text x="312" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#173b35">Rights</text><text x="312" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#173b35">Staff</text><text x="161" y="242" text-anchor="middle" font-size="15" fill="#1b7666">Route stays open; service is reversible</text></g><text x="28" y="416" font-size="19" font-weight="700" fill="#1b7666">Passes P01–P05 baseline and reversibility</text><text x="28" y="454" font-size="17" fill="#53645d">Static guidance, staffed help and rights notes</text><text x="28" y="480" font-size="17" fill="#53645d">are legible at one edge front desk.</text><rect x="28" y="506" width="404" height="24" rx="12" fill="#e2f1e9"/><text x="230" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#1b7666">ADVANCE DESIGN · conceptual detail</text></g>
<g transform="translate(60 758)"><rect width="1480" height="116" rx="18" fill="#edf5ef" stroke="#b9d3c2"/><text x="28" y="39" font-size="20" font-weight="700" fill="#173b35">Decision rule</text><text x="28" y="71" font-size="17" fill="#52645d">The public walking route, static orientation, staffed help, shade/seating and a withdrawal route must work on their own. AI enters only as an optional, side, removable and pausable layer.</text><text x="28" y="98" font-size="15" fill="#1b7666">This diagram tests design relations only; it does not verify site clearance, traffic, safety, permits, cost or operational performance. Field results: 0 / not field-run.</text></g></g>
</svg>
