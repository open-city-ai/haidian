<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Jingzhang Ecosystem Relay</title><desc id="desc">A six-stage ecosystem relay from basic research to city adoption. Each stage has a spatial front desk, one handoff item, staffed responsibility and a return path.</desc>
<rect width="1440" height="820" fill="#fffdf7"/><g font-family="Arial, sans-serif"><text x="66" y="80" font-size="42" font-weight="700" fill="#173b35">Ecosystem Relay: How Research Enters the City — and Returns for Review</text><text x="68" y="116" font-size="19" fill="#5b6b62">Not an investment-attraction pipeline: every stage hands over one readable, reviewable and reversible item.</text></g>
<g font-family="Arial, sans-serif"><path d="M120 275 H1320" stroke="#c7d8ce" stroke-width="12" stroke-linecap="round"/><path d="M120 275 H1320" stroke="#1e6b5a" stroke-width="5" stroke-linecap="round" stroke-dasharray="15 12"/>
<g transform="translate(80 190)"><circle cx="58" cy="85" r="46" fill="#173b35"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">01</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f3f7f4" stroke="#b7cec0"/><text x="18" y="185" font-size="20" font-weight="700" fill="#173b35">Basic research</text><text x="18" y="216" font-size="15" fill="#5b6b62">exchange / problem lecture</text><text x="18" y="254" font-size="15" fill="#173b35">Handoff: problem brief</text><text x="18" y="281" font-size="15" fill="#1e6b5a">Return: evidence check</text></g>
<g transform="translate(300 190)"><circle cx="58" cy="85" r="46" fill="#1e6b5a"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">02</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f3f7f4" stroke="#b7cec0"/><text x="18" y="185" font-size="20" font-weight="700" fill="#173b35">Open contribution</text><text x="18" y="216" font-size="15" fill="#5b6b62">front desk / project gallery</text><text x="18" y="254" font-size="15" fill="#173b35">Handoff: consent + attribution</text><text x="18" y="281" font-size="15" fill="#1e6b5a">Return: rights clarification</text></g>
<g transform="translate(520 190)"><circle cx="58" cy="85" r="46" fill="#3e8c83"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">03</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f3f7f4" stroke="#b7cec0"/><text x="18" y="185" font-size="20" font-weight="700" fill="#173b35">Trusted test</text><text x="18" y="216" font-size="15" fill="#5b6b62">test court / observatory</text><text x="18" y="254" font-size="15" fill="#173b35">Handoff: incident + takeover</text><text x="18" y="281" font-size="15" fill="#1e6b5a">Return: bounded test / stop</text></g>
<g transform="translate(740 190)"><circle cx="58" cy="85" r="46" fill="#b98345"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">04</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#fbf6ed" stroke="#ddc393"/><text x="18" y="185" font-size="20" font-weight="700" fill="#173b35">Incubation + fit</text><text x="18" y="216" font-size="15" fill="#5b6b62">workshop / scenario desk</text><text x="18" y="254" font-size="15" fill="#173b35">Handoff: fit + non-AI baseline</text><text x="18" y="281" font-size="15" fill="#a46f2a">Return: prototype revision</text></g>
<g transform="translate(960 190)"><circle cx="58" cy="85" r="46" fill="#93634b"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">05</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#fbf6ed" stroke="#ddc393"/><text x="18" y="185" font-size="20" font-weight="700" fill="#173b35">Capital service</text><text x="18" y="216" font-size="15" fill="#5b6b62">booked collaboration table</text><text x="18" y="254" font-size="15" fill="#173b35">Handoff: compliance + links</text><text x="18" y="281" font-size="15" fill="#a46f2a">Return: material preparation</text></g>
<g transform="translate(1180 190)"><circle cx="58" cy="85" r="46" fill="#776b94"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">06</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f6f3f9" stroke="#c7bfd7"/><text x="18" y="185" font-size="20" font-weight="700" fill="#173b35">City adoption</text><text x="18" y="216" font-size="15" fill="#5b6b62">public line / station edge</text><text x="18" y="254" font-size="15" fill="#173b35">Handoff: public-return ledger</text><text x="18" y="281" font-size="15" fill="#776b94">Return: revise / small / exit</text></g>
<rect x="70" y="590" width="1300" height="136" rx="18" fill="#edf4ee" stroke="#bad1c2"/><text x="102" y="632" font-size="23" font-weight="700" fill="#173b35">Public boundary for capital service</text><text x="102" y="668" font-size="18" fill="#5b6b62">It supports rights understanding, material preparation, scenario matching and professional-resource connection; it promises neither funding nor public value through valuation or investment size.</text><text x="102" y="700" font-size="18" fill="#1e6b5a">Every display still answers: what offline, maintainable, reviewable civic return does the public receive?</text></g>
</svg>
