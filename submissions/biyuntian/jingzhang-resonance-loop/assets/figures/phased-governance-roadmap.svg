<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">京张共振环三阶段共振路线图</title><desc id="d">从基线观察和轻量试点，经由可逆协同，到公共复核下长期治理的三阶段实施与决策框架</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="760" fill="#fffdf7"/><rect width="1440" height="110" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">三阶段共振路线图：每一阶段都能停、能回看、能留下</text><text x="56" y="81" font-size="17" fill="#d9e7df">不是固定建设时序｜先验证公共回响与人工责任｜再讨论是否进入下一阶段</text>
<g filter="url(#s)"><rect x="54" y="160" width="402" height="458" rx="18" fill="#fff" stroke="#b7d0c4"/><rect x="519" y="160" width="402" height="458" rx="18" fill="#fff" stroke="#e6cca5"/><rect x="984" y="160" width="402" height="458" rx="18" fill="#fff" stroke="#ccc2dd"/></g>
<rect x="54" y="160" width="402" height="76" rx="18" fill="#1e6b5a"/><text x="82" y="207" font-size="26" font-weight="700" fill="#fff">A · 看见与校准</text>
<rect x="519" y="160" width="402" height="76" rx="18" fill="#b98345"/><text x="547" y="207" font-size="26" font-weight="700" fill="#fff">B · 可逆试点与协同</text>
<rect x="984" y="160" width="402" height="76" rx="18" fill="#776b94"/><text x="1012" y="207" font-size="26" font-weight="700" fill="#fff">C · 留存与年度复核</text>
<g font-size="16" fill="#374e45"><text x="82" y="279" font-weight="700" fill="#1e6b5a">可先做</text><text x="82" y="307">步行观察 · 无障碍/夜间记录</text><text x="82" y="332">纸质导览 · 人工问询 · 权利梳理</text><text x="82" y="357">小规模开放日</text><text x="547" y="279" font-weight="700" fill="#a46f2a">可先做</text><text x="547" y="307">三类可逆细部 · 非生产测试</text><text x="547" y="332">成果卡/工作台 · 静态导视</text><text x="547" y="357">限定场景开放日</text><text x="1012" y="279" font-weight="700" fill="#776b94">可先做</text><text x="1012" y="307">专业深化已验证的公共改善</text><text x="1012" y="332">文化线 · 开放贡献 · 维护回路</text><text x="1012" y="357">年度公共复盘</text>
<line x1="82" y1="391" x2="428" y2="391" stroke="#d8d2c1"/><line x1="547" y1="391" x2="893" y2="391" stroke="#d8d2c1"/><line x1="1012" y1="391" x2="1358" y2="391" stroke="#d8d2c1"/>
<text x="82" y="429" font-weight="700" fill="#1e6b5a">阶段结束时公开</text><text x="82" y="457">继续观察 / 缩小试点 / 暂不入场</text><text x="82" y="487" font-weight="700" fill="#1e6b5a">留下</text><text x="82" y="515">问题地图、离线路径、人工服务时段</text><text x="82" y="540">观察与投诉摘要</text><text x="547" y="429" font-weight="700" fill="#a46f2a">阶段结束时公开</text><text x="547" y="457">保留 / 修订 / 撤回</text><text x="547" y="487" font-weight="700" fill="#a46f2a">留下</text><text x="547" y="515">临时布置图、责任卡、授权/撤回记录</text><text x="547" y="540">人工接管与夜间观察摘要</text><text x="1012" y="429" font-weight="700" fill="#776b94">阶段结束时公开</text><text x="1012" y="457">扩展 / 保持小规模 / 转人工 / 退出</text><text x="1012" y="487" font-weight="700" fill="#776b94">留下</text><text x="1012" y="515">地点—服务—留存物—维护人—复核日期</text><text x="1012" y="540">下一年度问题清单</text></g>
<path d="M456 385 L510 385" stroke="#9ab9aa" stroke-width="4"/><path d="M921 385 L975 385" stroke="#d2b57d" stroke-width="4"/><polygon points="510,385 494,376 494,394" fill="#9ab9aa"/><polygon points="975,385 959,376 959,394" fill="#d2b57d"/>
<rect x="54" y="663" width="1332" height="52" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="81" y="696" font-size="17" font-weight="700" fill="#173b35">扩展不是默认结果：</text><text x="258" y="696" font-size="16" fill="#5b6b62">普通人仍可通行｜人工帮助仍可获得｜留存物仍有人维护｜反馈仍能改变决定</text></g>
</svg>
