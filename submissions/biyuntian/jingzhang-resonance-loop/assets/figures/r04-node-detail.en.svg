<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">R04 Open Knowledge Front Desk four-part detail</title><desc id="desc">Concept plan, public-baseline section, four service states and four design-relation checks for the R04 side knowledge front desk.</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173b35" flood-opacity=".13"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e0e7e2" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1120" fill="#fffdf7"/><rect width="1600" height="120" fill="#163c36"/><g font-family="Arial, sans-serif"><text x="62" y="55" font-size="34" font-weight="700" fill="#fff">R04 Open Knowledge Front Desk: a four-part public-baseline detail</text><text x="62" y="92" font-size="18" fill="#d9e7df">AI Origin key area · conceptual interface relations and state rules · all site, permit and field results await professional verification</text>
<g transform="translate(60 162)"><rect width="730" height="410" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">01 / Concept plan: walking remains open; front desk stays at the edge</text><rect x="28" y="70" width="674" height="300" rx="12" fill="url(#grid)" stroke="#cddbd2"/><path d="M58 223H670" stroke="#1e9b85" stroke-width="46" stroke-linecap="round"/><path d="M58 223H670" stroke="#fff" stroke-width="7" stroke-dasharray="18 14"/><text x="84" y="195" font-size="17" font-weight="700" fill="#176e60">No-login public walking route</text><path d="M104 223v-100M104 123h70" stroke="#1e9b85" stroke-width="8"/><text x="70" y="107" font-size="15" fill="#52645d">Campus / street arrival</text><rect x="464" y="103" width="182" height="214" rx="16" fill="#f0e3ca" stroke="#bb853f" stroke-width="3"/><rect x="481" y="123" width="148" height="45" rx="7" fill="#dfae5b"/><rect x="481" y="181" width="148" height="45" rx="7" fill="#d9efe5"/><rect x="481" y="239" width="148" height="60" rx="7" fill="#1b7666"/><text x="555" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#173b35">Reversible result cards</text><text x="555" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#173b35">Attribution / withdrawal</text><text x="555" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Staffed desk / table</text><circle cx="379" cy="223" r="31" fill="#fff" stroke="#1b7666" stroke-width="5"/><text x="379" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#173b35">STOP</text><text x="303" y="286" font-size="15" fill="#52645d">Seating, shade, physical wayfinding</text><text x="475" y="346" font-size="14" fill="#a46d2d">Remove the optional layer; ordinary walking remains continuous</text></g>
<g transform="translate(820 162)"><rect width="720" height="410" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">02 / Concept section: three layers, not technology as basic infrastructure</text><rect x="28" y="70" width="664" height="300" rx="12" fill="#f7fbf8" stroke="#cddbd2"/><path d="M55 302H666" stroke="#53645d" stroke-width="5"/><rect x="70" y="256" width="220" height="46" fill="#64b39f"/><text x="180" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Public baseline: path / static orientation</text><rect x="306" y="243" width="114" height="59" fill="#e3b36a"/><text x="363" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#173b35">Seating / shade</text><rect x="445" y="196" width="166" height="106" fill="#1b7666"/><rect x="461" y="214" width="134" height="25" fill="#e3b36a"/><rect x="461" y="248" width="134" height="32" fill="#d9efe5"/><text x="528" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#173b35">Reversible cards</text><text x="528" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#173b35">Staffed desk</text><path d="M530 188V132" stroke="#1b7666" stroke-width="4"/><text x="448" y="119" font-size="15" fill="#1b7666">Removable AI / information layer</text><path d="M180 248V176" stroke="#1e9b85" stroke-width="4"/><text x="74" y="164" font-size="15" fill="#1b7666">Permanent public baseline</text><path d="M360 236V149" stroke="#b87832" stroke-width="4"/><text x="284" y="137" font-size="15" fill="#a46d2d">Everyday care layer</text><text x="55" y="346" font-size="14" fill="#52645d">Relations only: clearance, levels, trees, drainage, fire and equipment conditions all require survey and professional review.</text></g>
<g transform="translate(60 610)"><rect width="970" height="390" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">03 / Four states: ordinary service always works; the digital layer may enter, pause and exit</text><g transform="translate(28 82)"><g><rect width="205" height="220" rx="16" fill="#edf5ef" stroke="#b8d3c3"/><circle cx="102" cy="49" r="26" fill="#1b7666"/><text x="102" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">OPEN</text><text x="18" y="103" font-size="18" font-weight="700" fill="#173b35">Ordinary open</text><text x="18" y="134" font-size="15" fill="#52645d">Path, static orientation,</text><text x="18" y="157" font-size="15" fill="#52645d">staffed help, shade/seating</text><text x="18" y="190" font-size="14" fill="#1b7666">Works without digital layer</text></g><path d="M218 108H259" stroke="#1b7666" stroke-width="7"/><polygon points="259,108 245,99 245,117" fill="#1b7666"/><g transform="translate(274)"><rect width="205" height="220" rx="16" fill="#fff3dc" stroke="#dfc48d"/><circle cx="102" cy="49" r="26" fill="#b87832"/><text x="102" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">TRIAL</text><text x="18" y="103" font-size="18" font-weight="700" fill="#173b35">Bounded trial</text><text x="18" y="134" font-size="15" fill="#52645d">Edge cards, staffed explanation,</text><text x="18" y="157" font-size="15" fill="#52645d">no compression of public route</text><text x="18" y="190" font-size="14" fill="#a46d2d">Optional / removable / pausable</text></g><path d="M492 108H533" stroke="#b87832" stroke-width="7"/><polygon points="533,108 519,99 519,117" fill="#b87832"/><g transform="translate(548)"><rect width="205" height="220" rx="16" fill="#fae8e5" stroke="#ddbbb6"/><circle cx="102" cy="49" r="26" fill="#9a4841"/><text x="102" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PAUSE</text><text x="18" y="103" font-size="18" font-weight="700" fill="#173b35">Pause &amp; review</text><text x="18" y="134" font-size="15" fill="#52645d">Rights, movement, misleading</text><text x="18" y="157" font-size="15" fill="#52645d">information, takeover or care fails</text><text x="18" y="190" font-size="14" fill="#9a4841">Remove optional layer</text></g><path d="M766 108H807" stroke="#9a4841" stroke-width="7"/><polygon points="807,108 793,99 793,117" fill="#9a4841"/><g transform="translate(822)"><rect width="120" height="220" rx="16" fill="#edf5ef" stroke="#b8d3c3"/><circle cx="60" cy="49" r="26" fill="#1b7666"/><text x="60" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RETURN</text><text x="15" y="103" font-size="17" font-weight="700" fill="#173b35">Ordinary</text><text x="15" y="126" font-size="17" font-weight="700" fill="#173b35">service</text><text x="15" y="157" font-size="14" fill="#52645d">Record revision</text><text x="15" y="180" font-size="14" fill="#52645d">Do not blame users</text></g></g><text x="28" y="347" font-size="15" fill="#52645d">States are conceptual service rules, not operational facts. Field tests, performance, permits, costs and use results are not field-run / pending.</text></g>
<g transform="translate(1060 610)"><rect width="480" height="390" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">04 / Four relation checks</text><g font-size="17"><circle cx="48" cy="96" r="13" fill="#1b7666"/><text x="42" y="102" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="102" fill="#173b35">Public route remains open</text><circle cx="48" cy="154" r="13" fill="#1b7666"/><text x="42" y="160" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="160" fill="#173b35">No-login path reaches staffed desk</text><circle cx="48" cy="212" r="13" fill="#1b7666"/><text x="42" y="218" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="218" fill="#173b35">Remove cards; static guidance remains</text><circle cx="48" cy="270" r="13" fill="#1b7666"/><text x="42" y="276" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="276" fill="#173b35">Failure pauses, then returns to ordinary service</text></g><rect x="28" y="310" width="424" height="46" rx="10" fill="#edf5ef"/><text x="46" y="339" font-size="14" fill="#1b7666">4/4 are design-relation checks, not field tests or safety certification.</text></g>
</g></svg>
