<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="t d">
<title id="t">京张共振环公共价值证据台账</title><desc id="d">通行、理解、人工替代、维护和反馈五类非画像观察通向保留、修订、转人工或退出的公共决定</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".10"/></filter></defs>
<rect width="1440" height="770" fill="#fffdf7"/><rect width="1440" height="112" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">公共价值证据台账：只观察服务，不画像人群</text><text x="56" y="81" font-size="17" fill="#d9e7df">低数据｜可离线阅读｜服务与空间摘要｜不收集身份、脸部、设备标识、精确轨迹或可识别反馈</text>
<text x="58" y="156" font-size="20" font-weight="700" fill="#173b35">五类现场观察</text><text x="1108" y="156" font-size="20" font-weight="700" fill="#173b35">公共决定</text>
<g filter="url(#s)"><rect x="55" y="182" width="930" height="468" rx="18" fill="#fff" stroke="#c7d4cc"/><rect x="1030" y="182" width="355" height="468" rx="18" fill="#fff" stroke="#c7d4cc"/></g>
<g font-size="16" fill="#374e45"><rect x="76" y="208" width="888" height="64" rx="10" fill="#edf4ee"/><text x="96" y="238" font-weight="700" fill="#1e6b5a">01 通行与无障碍</text><text x="318" y="238">只看主通道、停留、纸质路径与现场是否一致</text><text x="730" y="238" fill="#5b6b62">不收集行程、位置、身份</text>
<rect x="76" y="292" width="888" height="64" rx="10" fill="#fbf6ed"/><text x="96" y="322" font-weight="700" fill="#a46f2a">02 理解与选择</text><text x="318" y="322">只看能否不登录理解、找到人工和撤回入口</text><text x="730" y="322" fill="#5b6b62">不收集点击画像、设备指纹</text>
<rect x="76" y="376" width="888" height="64" rx="10" fill="#f3f0f8"/><text x="96" y="406" font-weight="700" fill="#776b94">03 人工替代与安全</text><text x="318" y="406">只看人工接管、夜间服务和非 AI 路径可用性</text><text x="730" y="406" fill="#5b6b62">不收集健康、行为评分</text>
<rect x="76" y="460" width="888" height="64" rx="10" fill="#edf4ee"/><text x="96" y="490" font-weight="700" fill="#1e6b5a">04 维护与环境</text><text x="318" y="490">只看照明、积水、树木、坐憩和导视是否可用</text><text x="730" y="490" fill="#5b6b62">不公开报修人身份/联系方式</text>
<rect x="76" y="544" width="888" height="64" rx="10" fill="#fbf6ed"/><text x="96" y="574" font-weight="700" fill="#a46f2a">05 反馈与修订</text><text x="318" y="574">只看议题是否回应、修订是否回到现场</text><text x="730" y="574" fill="#5b6b62">不展示可识别原话或档案</text></g>
<path d="M985 416 L1015 416" stroke="#86aa98" stroke-width="5"/><polygon points="1015,416 1000,407 1000,425" fill="#86aa98"/>
<g font-size="18"><rect x="1054" y="216" width="307" height="68" rx="12" fill="#1e6b5a"/><text x="1208" y="258" text-anchor="middle" fill="#fff" font-weight="700">保留：继续提供公共回响</text><rect x="1054" y="305" width="307" height="68" rx="12" fill="#b98345"/><text x="1208" y="347" text-anchor="middle" fill="#fff" font-weight="700">修订：重写、增设人工或维护</text><rect x="1054" y="394" width="307" height="68" rx="12" fill="#776b94"/><text x="1208" y="436" text-anchor="middle" fill="#fff" font-weight="700">转人工：切回静态与人工系统</text><rect x="1054" y="483" width="307" height="68" rx="12" fill="#8a5d4c"/><text x="1208" y="525" text-anchor="middle" fill="#fff" font-weight="700">退出：条件不满足即停止</text></g>
<text x="1060" y="591" font-size="15" fill="#5b6b62">公开的只是：路段状态、问题类别、</text><text x="1060" y="616" font-size="15" fill="#5b6b62">责任状态、修订/复核日期与理由。</text>
<rect x="55" y="681" width="1330" height="52" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="82" y="713" font-size="17" font-weight="700" fill="#173b35">默认规则：</text><text x="190" y="713" font-size="16" fill="#5b6b62">证据不充分时不扩容；保持小规模、转人工或退出。台账不是评分仪表盘，也不是自动化通行证。</text></g>
</svg>
