<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="t d">
<title id="t">Four cultural-node family</title><desc id="d">Qinghuayuan, Dongsheng, Zhongguancun and Dazhongsi correspond to railway memory, question lecture, contribution front desk and city-return desk, each with daily stopping, narrative, action, retained benefit and boundary</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="770" fill="#fffdf7"/><rect width="1440" height="110" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">Four cultural nodes: three cultures take turns leading everyday life</text><text x="56" y="81" font-size="17" fill="#d9e7df">Not uniform photo spots | daily reason to stop first, then narrative, low-threshold action and an offline retained benefit</text>
<path d="M165 250 L1275 250" stroke="#173b35" stroke-width="7"/><path d="M165 270 L1275 270" stroke="#1e9b85" stroke-width="5"/>
<g filter="url(#s)"><rect x="48" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#c7d4cc"/><rect x="392" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#c7d4cc"/><rect x="736" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#dfcfb5"/><rect x="1080" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#d3c9df"/></g>
<g font-size="15" fill="#3a5048"><circle cx="206" cy="260" r="32" fill="#173b35"/><text x="206" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="72" y="337" font-size="20" font-weight="700" fill="#173b35">Qinghuayuan · Memory Desk</text><text x="72" y="373" font-weight="700" fill="#173b35">Stop</text><text x="72" y="399">shade, seat, route reading, observe</text><text x="72" y="438" font-weight="700" fill="#1e6b5a">Narrative</text><text x="72" y="464">connection is not only speed; care matters</text><text x="72" y="503" font-weight="700" fill="#1e6b5a">Action / retain</text><text x="72" y="529">printed route mark · map + issue list</text><text x="72" y="580" font-weight="700" fill="#8a5d4c">Must not</text><text x="72" y="606">closed scenery or forced digital check-in</text>
<circle cx="550" cy="260" r="32" fill="#1e6b5a"/><text x="550" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="416" y="337" font-size="20" font-weight="700" fill="#173b35">Dongsheng · Question Lecture</text><text x="416" y="373" font-weight="700" fill="#173b35">Stop</text><text x="416" y="399">discussion and walking pause</text><text x="416" y="438" font-weight="700" fill="#1e6b5a">Narrative</text><text x="416" y="464">a real question precedes an answer</text><text x="416" y="503" font-weight="700" fill="#1e6b5a">Action / retain</text><text x="416" y="529">staffed walk · question card + return date</text><text x="416" y="580" font-weight="700" fill="#8a5d4c">Must not</text><text x="416" y="606">collect stories or become a sales pitch</text>
<circle cx="894" cy="260" r="32" fill="#b98345"/><text x="894" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="760" y="337" font-size="20" font-weight="700" fill="#173b35">ZGC · Contribution Desk</text><text x="760" y="373" font-weight="700" fill="#173b35">Stop</text><text x="760" y="399">project reading, worktable, staff</text><text x="760" y="438" font-weight="700" fill="#a46f2a">Narrative</text><text x="760" y="464">contribution attributed; rights withdrawn</text><text x="760" y="503" font-weight="700" fill="#a46f2a">Action / retain</text><text x="760" y="529">cards + class · consent / attribution / table</text><text x="760" y="580" font-weight="700" fill="#8a5d4c">Must not</text><text x="760" y="606">advertising or unauthorised material</text>
<circle cx="1238" cy="260" r="32" fill="#776b94"/><text x="1238" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1104" y="337" font-size="20" font-weight="700" fill="#173b35">Dazhongsi · City-return Desk</text><text x="1104" y="373" font-weight="700" fill="#173b35">Stop</text><text x="1104" y="399">transfer seat, night guide, service</text><text x="1104" y="438" font-weight="700" fill="#776b94">Narrative</text><text x="1104" y="464">technology returns to ordinary routes</text><text x="1104" y="503" font-weight="700" fill="#776b94">Action / retain</text><text x="1104" y="529">night walk · static guide + receipt</text><text x="1104" y="580" font-weight="700" fill="#8a5d4c">Must not</text><text x="1104" y="606">commercial noise or unattended service</text></g>
<rect x="48" y="690" width="1348" height="49" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="74" y="721" font-size="16" font-weight="700" fill="#173b35">Light media grammar:</text><text x="255" y="721" font-size="15" fill="#5b6b62">railway navy = time/route | civic teal = public question/staffed entry | amber = contribution/night service; no continuous screens, uniform scans or behavioural data.</text></g>
</svg>
