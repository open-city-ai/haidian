<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">R04 开源知识前台四联节点图</title><desc id="desc">R04边侧知识前台的概念平面、公共基线与可拆插件剖面、四态服务转换和四条设计关系核验。</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173b35" flood-opacity=".13"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e0e7e2" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1120" fill="#fffdf7"/><rect width="1600" height="120" fill="#163c36"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="62" y="55" font-size="34" font-weight="700" fill="#fff">R04 开源知识前台：公共基线先行的四联节点图</text><text x="62" y="92" font-size="18" fill="#d9e7df">AI 原点重点区｜概念性界面关系与状态规则｜所有尺寸、现状、许可与现场结果待专业核验</text>
<g transform="translate(60 162)"><rect width="730" height="410" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">01 / 概念平面：公共慢行不断开，前台置于边侧</text><rect x="28" y="70" width="674" height="300" rx="12" fill="url(#grid)" stroke="#cddbd2"/><path d="M58 223H670" stroke="#1e9b85" stroke-width="46" stroke-linecap="round"/><path d="M58 223H670" stroke="#fff" stroke-width="7" stroke-dasharray="18 14"/><text x="84" y="195" font-size="17" font-weight="700" fill="#176e60">不登录公共慢行线</text><path d="M104 223v-100M104 123h70" stroke="#1e9b85" stroke-width="8"/><text x="70" y="107" font-size="15" fill="#52645d">校园 / 街区来向</text><rect x="464" y="103" width="182" height="214" rx="16" fill="#f0e3ca" stroke="#bb853f" stroke-width="3"/><rect x="481" y="123" width="148" height="45" rx="7" fill="#dfae5b"/><rect x="481" y="181" width="148" height="45" rx="7" fill="#d9efe5"/><rect x="481" y="239" width="148" height="60" rx="7" fill="#1b7666"/><text x="555" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#173b35">可撤回成果卡</text><text x="555" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#173b35">署名 / 撤回说明</text><text x="555" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">人工服务 / 工作台</text><circle cx="379" cy="223" r="31" fill="#fff" stroke="#1b7666" stroke-width="5"/><text x="379" y="229" text-anchor="middle" font-size="18" font-weight="700" fill="#173b35">停</text><text x="303" y="286" font-size="15" fill="#52645d">坐憩、遮阴、实体导视</text><text x="475" y="346" font-size="14" fill="#a46d2d">AI 层仅在边侧，撤下后公共慢行仍连续</text></g>
<g transform="translate(820 162)"><rect width="720" height="410" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">02 / 概念剖面：三层构件，不把技术当作基础设施</text><rect x="28" y="70" width="664" height="300" rx="12" fill="#f7fbf8" stroke="#cddbd2"/><path d="M55 302H666" stroke="#53645d" stroke-width="5"/><rect x="70" y="256" width="220" height="46" fill="#64b39f"/><text x="180" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">公共基线：连续步行 / 静态导向</text><rect x="306" y="243" width="114" height="59" fill="#e3b36a"/><text x="363" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#173b35">坐憩 / 遮阴</text><rect x="445" y="196" width="166" height="106" fill="#1b7666"/><rect x="461" y="214" width="134" height="25" fill="#e3b36a"/><rect x="461" y="248" width="134" height="32" fill="#d9efe5"/><text x="528" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#173b35">可撤回成果卡</text><text x="528" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#173b35">人工前台</text><path d="M530 188V132" stroke="#1b7666" stroke-width="4"/><text x="448" y="119" font-size="15" fill="#1b7666">可拆 AI / 信息插件</text><path d="M180 248V176" stroke="#1e9b85" stroke-width="4"/><text x="74" y="164" font-size="15" fill="#1b7666">永久公共基线</text><path d="M360 236V149" stroke="#b87832" stroke-width="4"/><text x="284" y="137" font-size="15" fill="#a46d2d">日常照护构件</text><text x="55" y="346" font-size="14" fill="#52645d">剖面仅表达关系；净宽、标高、树木、排水、消防与设备条件均待测绘及专业复核。</text></g>
<g transform="translate(60 610)"><rect width="970" height="390" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">03 / 四态服务：普通服务始终可用，数字层可进入、暂停并退出</text><g transform="translate(28 82)"><g><rect width="205" height="220" rx="16" fill="#edf5ef" stroke="#b8d3c3"/><circle cx="102" cy="49" r="26" fill="#1b7666"/><text x="102" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">OPEN</text><text x="18" y="103" font-size="18" font-weight="700" fill="#173b35">普通开放</text><text x="18" y="134" font-size="15" fill="#52645d">路径、静态导向、</text><text x="18" y="157" font-size="15" fill="#52645d">人工咨询、坐憩遮阴</text><text x="18" y="190" font-size="14" fill="#1b7666">没有数字层也成立</text></g><path d="M218 108H259" stroke="#1b7666" stroke-width="7"/><polygon points="259,108 245,99 245,117" fill="#1b7666"/><g transform="translate(274)"><rect width="205" height="220" rx="16" fill="#fff3dc" stroke="#dfc48d"/><circle cx="102" cy="49" r="26" fill="#b87832"/><text x="102" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">TRIAL</text><text x="18" y="103" font-size="18" font-weight="700" fill="#173b35">有限试用</text><text x="18" y="134" font-size="15" fill="#52645d">边侧成果卡、人工解释</text><text x="18" y="157" font-size="15" fill="#52645d">不压缩公共路径</text><text x="18" y="190" font-size="14" fill="#a46d2d">可选、可拆、可暂停</text></g><path d="M492 108H533" stroke="#b87832" stroke-width="7"/><polygon points="533,108 519,99 519,117" fill="#b87832"/><g transform="translate(548)"><rect width="205" height="220" rx="16" fill="#fae8e5" stroke="#ddbbb6"/><circle cx="102" cy="49" r="26" fill="#9a4841"/><text x="102" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PAUSE</text><text x="18" y="103" font-size="18" font-weight="700" fill="#173b35">暂停并复核</text><text x="18" y="134" font-size="15" fill="#52645d">权利、通行、误导、</text><text x="18" y="157" font-size="15" fill="#52645d">接管或维护问题出现</text><text x="18" y="190" font-size="14" fill="#9a4841">撤下可选服务层</text></g><path d="M766 108H807" stroke="#9a4841" stroke-width="7"/><polygon points="807,108 793,99 793,117" fill="#9a4841"/><g transform="translate(822)"><rect width="120" height="220" rx="16" fill="#edf5ef" stroke="#b8d3c3"/><circle cx="60" cy="49" r="26" fill="#1b7666"/><text x="60" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RETURN</text><text x="15" y="103" font-size="17" font-weight="700" fill="#173b35">普通</text><text x="15" y="126" font-size="17" font-weight="700" fill="#173b35">服务</text><text x="15" y="157" font-size="14" fill="#52645d">记录修订</text><text x="15" y="180" font-size="14" fill="#52645d">不责怪人</text></g></g><text x="28" y="347" font-size="15" fill="#52645d">状态是概念服务规则而非运营事实；当前现场试验、性能、许可、造价与使用结果均为未运行 / 待核验。</text></g>
<g transform="translate(1060 610)"><rect width="480" height="390" rx="20" fill="#fff" stroke="#b8d3c3" filter="url(#shadow)"/><text x="28" y="45" font-size="25" font-weight="700" fill="#173b35">04 / 四条规则核验</text><g font-size="17"><circle cx="48" cy="96" r="13" fill="#1b7666"/><text x="42" y="102" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="102" fill="#173b35">公共路径持续开放</text><circle cx="48" cy="154" r="13" fill="#1b7666"/><text x="42" y="160" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="160" fill="#173b35">无账号可抵达人工前台</text><circle cx="48" cy="212" r="13" fill="#1b7666"/><text x="42" y="218" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="218" fill="#173b35">撤下成果卡仍有静态导向</text><circle cx="48" cy="270" r="13" fill="#1b7666"/><text x="42" y="276" text-anchor="middle" font-weight="700" fill="#fff">✓</text><text x="75" y="276" fill="#173b35">风险触发暂停后回到普通服务</text></g><rect x="28" y="310" width="424" height="46" rx="10" fill="#edf5ef"/><text x="46" y="339" font-size="14" fill="#1b7666">4/4 为设计关系验证，不是现场测试或安全认证。</text></g>
</g></svg>
