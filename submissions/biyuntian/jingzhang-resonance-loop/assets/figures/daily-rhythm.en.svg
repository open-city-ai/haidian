<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="title desc">
  <title id="title">Jingzhang Resonance Loop: three anchors, one day</title><desc id="desc">Public-service rhythm, human baseline and site receipt across commute peak, daytime and evening at Zhongzhiyuan, AI Origin and Dazhongsi</desc>
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".10"/></filter></defs>
  <rect width="1440" height="770" fill="#fffdf7"/><rect x="0" y="0" width="1440" height="112" fill="#173b35"/>
  <text x="58" y="51" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">Three anchors, one day: AI tested through ordinary public life</text>
  <text x="58" y="83" font-family="Arial, sans-serif" font-size="17" fill="#d9e7df">Move first at commute peak | collaborate by day | return to people for evening review; every condition retains an offline civic benefit</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="150" width="250" height="84" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="78" y="185" font-size="23" font-weight="700" fill="#173b35">Commute peak</text><text x="78" y="213" font-size="16" fill="#4c665c">movement and staffed access first</text>
    <rect x="50" y="328" width="250" height="84" rx="14" fill="#fbf6ed" stroke="#e4c99e"/><text x="78" y="363" font-size="23" font-weight="700" fill="#a46f2a">Daytime</text><text x="78" y="391" font-size="16" fill="#6d6657">then make collaboration legible</text>
    <rect x="50" y="506" width="250" height="84" rx="14" fill="#f3f0f8" stroke="#c9bfd8"/><text x="78" y="541" font-size="23" font-weight="700" fill="#776b94">Evening</text><text x="78" y="569" font-size="16" fill="#625d6f">finally return to public review</text>
    <text x="50" y="680" font-size="17" font-weight="700" fill="#173b35">Shared baseline</text><text x="50" y="711" font-size="15" fill="#5b6b62">Without phone, account or algorithm: still walk, understand, ask and stop.</text>
    <g filter="url(#s)">
      <rect x="330" y="130" width="335" height="480" rx="18" fill="#fff" stroke="#b6cfc2"/><rect x="330" y="130" width="335" height="58" rx="18" fill="#1e6b5a"/><text x="356" y="166" font-size="23" font-weight="700" fill="#fff">Zhongzhiyuan · Compute Garden</text>
      <rect x="690" y="130" width="335" height="480" rx="18" fill="#fff" stroke="#e2c89e"/><rect x="690" y="130" width="335" height="58" rx="18" fill="#b98345"/><text x="716" y="166" font-size="23" font-weight="700" fill="#fff">AI Origin · Open-Source Front Desk</text>
      <rect x="1050" y="130" width="335" height="480" rx="18" fill="#fff" stroke="#c8c0d8"/><rect x="1050" y="130" width="335" height="58" rx="18" fill="#776b94"/><text x="1076" y="166" font-size="23" font-weight="700" fill="#fff">Dazhongsi · Co-walking Street</text>
    </g>
    <g font-size="16" fill="#344b43"><text x="356" y="222"><tspan font-weight="700" fill="#1e6b5a">Movement first</tspan><tspan x="356" dy="28">equipment clear of main route</tspan><tspan x="356" dy="25">printed notice, booking, seating</tspan></text><text x="716" y="222"><tspan font-weight="700" fill="#a46f2a">Campus edge first</tspan><tspan x="716" dy="28">physical guide and staff</tspan><tspan x="716" dy="25">no event crowds the route</tspan></text><text x="1076" y="222"><tspan font-weight="700" fill="#776b94">Station-city first</tspan><tspan x="1076" dy="28">crossing, access, exit guide</tspan><tspan x="1076" dy="25">automated prompts supplement</tspan></text>
    <line x1="348" y1="300" x2="645" y2="300" stroke="#d8d2c1"/><line x1="708" y1="300" x2="1005" y2="300" stroke="#d8d2c1"/><line x1="1068" y1="300" x2="1365" y2="300" stroke="#d8d2c1"/>
    <text x="356" y="354"><tspan font-weight="700" fill="#1e6b5a">Observable test</tspan><tspan x="356" dy="28">non-production, compute literacy</tspan><tspan x="356" dy="25">staffed Q&amp;A, usable court</tspan></text><text x="716" y="354"><tspan font-weight="700" fill="#a46f2a">Legible collaboration</tspan><tspan x="716" dy="28">cards, classes, rights advice</tspan><tspan x="716" dy="25">no-login public worktable</tspan></text><text x="1076" y="354"><tspan font-weight="700" fill="#776b94">Explainable daily use</tspan><tspan x="1076" dy="28">merchant/resident service</tspan><tspan x="1076" dy="25">static guide, sit-and-wait corner</tspan></text>
    <line x1="348" y1="478" x2="645" y2="478" stroke="#d8d2c1"/><line x1="708" y1="478" x2="1005" y2="478" stroke="#d8d2c1"/><line x1="1068" y1="478" x2="1365" y2="478" stroke="#d8d2c1"/>
    <text x="356" y="532"><tspan font-weight="700" fill="#1e6b5a">Question + human answer</tspan><tspan x="356" dy="28">reduce test, publish revision</tspan><tspan x="356" dy="25">receipt: scope + takeover</tspan></text><text x="716" y="532"><tspan font-weight="700" fill="#a46f2a">Release + visible withdrawal</tspan><tspan x="716" dy="28">open source and developer walk</tspan><tspan x="716" dy="25">receipt: consent + revision</tspan></text><text x="1076" y="532"><tspan font-weight="700" fill="#776b94">Night human review</tspan><tspan x="1076" dy="28">culture, cues and staffed desk</tspan><tspan x="1076" dy="25">receipt: peak/night state</tspan></text></g>
  </g>
  <rect x="330" y="660" width="1055" height="70" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="358" y="690" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#173b35">Site receipt</text><text x="358" y="716" font-family="Arial, sans-serif" font-size="15" fill="#5b6b62">Aggregate spatial and service state only—no personal journeys, identity, profiles or unauthorised data. If conditions fail: reduce, revert to people or pause.</text>
</svg>
