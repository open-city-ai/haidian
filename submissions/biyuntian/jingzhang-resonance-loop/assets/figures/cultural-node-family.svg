<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="t d">
<title id="t">京张共振环四个文化节点谱系</title><desc id="d">清华园、东升镇、中关村和大钟寺分别对应铁路记忆、问题讲堂、贡献前台和城市回望台，并各有日常停留、叙事、参与、留存物与边界</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="770" fill="#fffdf7"/><rect width="1440" height="110" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">四个文化节点：让三种文化轮流成为日常主角</text><text x="56" y="81" font-size="17" fill="#d9e7df">不是统一打卡点｜每处先有日常停留理由，再有公共叙事、低门槛参与和可离线留存物</text>
<path d="M165 250 L1275 250" stroke="#173b35" stroke-width="7"/><path d="M165 270 L1275 270" stroke="#1e9b85" stroke-width="5"/>
<g filter="url(#s)"><rect x="48" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#c7d4cc"/><rect x="392" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#c7d4cc"/><rect x="736" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#dfcfb5"/><rect x="1080" y="180" width="316" height="474" rx="18" fill="#fff" stroke="#d3c9df"/></g>
<g font-size="16" fill="#3a5048"><circle cx="206" cy="260" r="32" fill="#173b35"/><text x="206" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">01</text><text x="72" y="337" font-size="21" font-weight="700" fill="#173b35">清华园 · 铁路记忆台</text><text x="72" y="373" font-weight="700" fill="#173b35">停留</text><text x="72" y="399">遮阴、坐憩、读路径、观察</text><text x="72" y="438" font-weight="700" fill="#1e6b5a">叙事</text><text x="72" y="464">连接不是速度，维护也是创新</text><text x="72" y="503" font-weight="700" fill="#1e6b5a">参与 / 留存</text><text x="72" y="529">纸质路线标注 · 步行图与问题清单</text><text x="72" y="580" font-weight="700" fill="#8a5d4c">不应发生</text><text x="72" y="606">封闭布景或强制数字打卡</text>
<circle cx="550" cy="260" r="32" fill="#1e6b5a"/><text x="550" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">02</text><text x="416" y="337" font-size="21" font-weight="700" fill="#173b35">东升镇 · 问题讲堂</text><text x="416" y="373" font-weight="700" fill="#173b35">停留</text><text x="416" y="399">可坐可站的讨论与慢行暂停</text><text x="416" y="438" font-weight="700" fill="#1e6b5a">叙事</text><text x="416" y="464">真实问题先于技术答案</text><text x="416" y="503" font-weight="700" fill="#1e6b5a">参与 / 留存</text><text x="416" y="529">人工走读 · 问题卡、议程与回访日期</text><text x="416" y="580" font-weight="700" fill="#8a5d4c">不应发生</text><text x="416" y="606">采集个人故事或变成招商推介</text>
<circle cx="894" cy="260" r="32" fill="#b98345"/><text x="894" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">03</text><text x="760" y="337" font-size="21" font-weight="700" fill="#173b35">中关村 · 贡献前台</text><text x="760" y="373" font-weight="700" fill="#173b35">停留</text><text x="760" y="399">成果阅读、工作台、人工咨询</text><text x="760" y="438" font-weight="700" fill="#a46f2a">叙事</text><text x="760" y="464">贡献可署名，权利可撤回</text><text x="760" y="503" font-weight="700" fill="#a46f2a">参与 / 留存</text><text x="760" y="529">成果卡、公开课 · 授权/署名与工作台</text><text x="760" y="580" font-weight="700" fill="#8a5d4c">不应发生</text><text x="760" y="606">广告占据前台或展示未经授权内容</text>
<circle cx="1238" cy="260" r="32" fill="#776b94"/><text x="1238" y="267" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">04</text><text x="1104" y="337" font-size="21" font-weight="700" fill="#173b35">大钟寺 · 城市回望台</text><text x="1104" y="373" font-weight="700" fill="#173b35">停留</text><text x="1104" y="399">换乘前后坐憩、夜间导向、服务</text><text x="1104" y="438" font-weight="700" fill="#776b94">叙事</text><text x="1104" y="464">技术最后要回到普通人的路上</text><text x="1104" y="503" font-weight="700" fill="#776b94">参与 / 留存</text><text x="1104" y="529">夜间走读 · 静态导视与复核回执</text><text x="1104" y="580" font-weight="700" fill="#8a5d4c">不应发生</text><text x="1104" y="606">商业遮蔽方向或无人服务替代人工</text></g>
<rect x="48" y="690" width="1348" height="49" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="74" y="721" font-size="16" font-weight="700" fill="#173b35">轻量媒介语法：</text><text x="235" y="721" font-size="15" fill="#5b6b62">深铁蓝＝时间/路径｜蓝绿色＝公共问题/人工入口｜琥珀色＝贡献/夜间服务；不要求连续布屏、统一扫码或行为数据。</text></g>
</svg>
