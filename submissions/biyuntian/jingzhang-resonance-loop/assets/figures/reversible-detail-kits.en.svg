<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">Three reversible public-space detail kits</title><desc id="d">Heritage-park mobility court, campus-edge knowledge front desk and station-city daily gate move from observation to temporary setup, review and professional handoff</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="760" fill="#fffdf7"/><rect width="1440" height="108" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="49" font-size="31" font-weight="700" fill="#fff">Three reversible detail kits: observe, place, then hand over</text><text x="56" y="80" font-size="17" fill="#d9e7df">A rendering is not a construction list | preserve access and emergency routes | do not cross rail-safety limits | no personal profiling</text>
<g filter="url(#s)"><rect x="55" y="145" width="405" height="490" rx="18" fill="#fff" stroke="#b7d0c4"/><rect x="517" y="145" width="405" height="490" rx="18" fill="#fff" stroke="#e6cca5"/><rect x="979" y="145" width="405" height="490" rx="18" fill="#fff" stroke="#ccc2dd"/></g>
<rect x="55" y="145" width="405" height="68" rx="18" fill="#1e6b5a"/><text x="82" y="187" font-size="23" font-weight="700" fill="#fff">01 Heritage Park · Mobility Court</text>
<rect x="517" y="145" width="405" height="68" rx="18" fill="#b98345"/><text x="544" y="187" font-size="23" font-weight="700" fill="#fff">02 Campus Edge · Knowledge Desk</text>
<rect x="979" y="145" width="405" height="68" rx="18" fill="#776b94"/><text x="1006" y="187" font-size="23" font-weight="700" fill="#fff">03 Station City · Daily Gate</text>
<g font-size="16" fill="#374e45"><text x="82" y="251" font-weight="700" fill="#1e6b5a">Observe</text><text x="82" y="279">shade, drainage, rail traces, crossings</text><text x="82" y="304">access movement and night lighting</text><text x="544" y="251" font-weight="700" fill="#a46f2a">Observe</text><text x="544" y="279">ground floor, egress, class-change peak</text><text x="544" y="304">rights and daily maintenance</text><text x="1006" y="251" font-weight="700" fill="#776b94">Observe</text><text x="1006" y="279">station flow, crossing, night lighting</text><text x="1006" y="304">merchant edge and access continuity</text>
<line x1="82" y1="336" x2="433" y2="336" stroke="#d8d2c1"/><line x1="544" y1="336" x2="895" y2="336" stroke="#d8d2c1"/><line x1="1006" y1="336" x2="1357" y2="336" stroke="#d8d2c1"/>
<text x="82" y="374" font-weight="700" fill="#1e6b5a">Small reversible setup</text><text x="82" y="402">movable seating/shade · offline route</text><text x="82" y="427">question board · staffed table</text><text x="544" y="374" font-weight="700" fill="#a46f2a">Small reversible setup</text><text x="544" y="402">project-card rack · public worktable</text><text x="544" y="427">rights notice · staffed-hours sign</text><text x="1006" y="374" font-weight="700" fill="#776b94">Small reversible setup</text><text x="1006" y="402">static guide · shade/seating</text><text x="1006" y="427">staffed inquiry · night board</text>
<line x1="82" y1="459" x2="433" y2="459" stroke="#d8d2c1"/><line x1="544" y1="459" x2="895" y2="459" stroke="#d8d2c1"/><line x1="1006" y1="459" x2="1357" y2="459" stroke="#d8d2c1"/>
<text x="82" y="497" font-weight="700" fill="#1e6b5a">Hand over / withdraw</text><text x="82" y="525">after weather-and-flow review: landscape</text><text x="82" y="550">remove for ponding, obstruction or safety</text><text x="544" y="497" font-weight="700" fill="#a46f2a">Hand over / withdraw</text><text x="544" y="525">after rights, care and egress: specialists</text><text x="544" y="550">remove unclear material, restore passage</text><text x="1006" y="497" font-weight="700" fill="#776b94">Hand over / withdraw</text><text x="1006" y="525">after peak-and-night review: mobility team</text><text x="1006" y="550">static guide for crowding, misinformation, privacy</text></g>
<rect x="55" y="672" width="1329" height="54" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="82" y="705" font-size="17" font-weight="700" fill="#173b35">Four concept-stage handoff materials:</text><text x="415" y="705" font-size="16" fill="#5b6b62">site observation | temporary layout | staffed-service card | withdrawal / revision record</text></g>
</svg>
