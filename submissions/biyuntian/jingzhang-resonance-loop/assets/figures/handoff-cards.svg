<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">京张共振环：四张评审交接卡</title>
  <desc id="desc">以通行、权利、人工接管和日常维护四张交接卡，将三处重点区的空间动作转为可验证的公共成果、责任接口与退出处理。</desc>
  <style>
    .bg{fill:#fbfaf4}.ink{fill:#183c3b}.muted{fill:#60736f}.navy{fill:#16435f}.teal{fill:#16877e}.amber{fill:#c98232}.line{stroke:#cbd3ca;stroke-width:2}.card{fill:#fffef9;stroke:#b9c8be;stroke-width:2}.head{font:700 42px 'Noto Sans SC','PingFang SC',sans-serif}.sub{font:400 21px 'Noto Sans SC','PingFang SC',sans-serif}.label{font:700 24px 'Noto Sans SC','PingFang SC',sans-serif}.body{font:400 19px 'Noto Sans SC','PingFang SC',sans-serif}.small{font:400 16px 'Noto Sans SC','PingFang SC',sans-serif}.chip{font:700 17px 'Noto Sans SC','PingFang SC',sans-serif}
  </style>
  <rect class="bg" width="1600" height="920"/>
  <text x="76" y="82" class="head ink">京张共振环｜四张评审交接卡</text>
  <text x="78" y="122" class="sub muted">从概念图到可逆试点：每一项 AI 服务均须交出公共成果、责任接口与退出处理</text>
  <line x1="76" y1="152" x2="1524" y2="152" class="line"/>
  <text x="82" y="194" class="label navy">三处重点区的动作并不直接扩容，而是依次通过四张卡的核验</text>
  <path d="M270 246 H1330" fill="none" stroke="#9bb6ae" stroke-width="4" stroke-linecap="round"/>
  <circle cx="270" cy="246" r="17" class="teal"/><circle cx="800" cy="246" r="17" class="amber"/><circle cx="1330" cy="246" r="17" class="navy"/>
  <text x="204" y="286" class="label ink">众智园</text><text x="695" y="286" class="label ink">AI 原点</text><text x="1242" y="286" class="label ink">大钟寺</text>
  <text x="172" y="318" class="small muted">测试回响庭</text><text x="683" y="318" class="small muted">开源转化前台</text><text x="1201" y="318" class="small muted">人机共行城市门</text>
  <g transform="translate(76 362)"><rect width="700" height="224" rx="18" class="card"/><rect width="10" height="224" rx="5" class="teal"/><text x="36" y="47" class="label ink">01｜通行卡</text><text x="36" y="82" class="body muted">先检查：主通道、过街、无障碍、遮阴、夜间可读</text><text x="36" y="121" class="body ink">留下：实体路径图、地面导向、坐憩点、人工问询</text><text x="36" y="160" class="body ink">责任：公园／街区运维 + 无障碍专业人员</text><rect x="36" y="181" width="342" height="28" rx="14" fill="#e4f3ef"/><text x="50" y="202" class="chip teal">不通过：先修订路线，不叠加数字服务</text></g>
  <g transform="translate(824 362)"><rect width="700" height="224" rx="18" class="card"/><rect width="10" height="224" rx="5" class="amber"/><text x="36" y="47" class="label ink">02｜权利卡</text><text x="36" y="82" class="body muted">先检查：展示是否授权，署名与撤回是否可用</text><text x="36" y="121" class="body ink">留下：授权说明、撤回入口、人工咨询时段</text><text x="36" y="160" class="body ink">责任：高校转化 + 开源社区 + 知识产权服务</text><rect x="36" y="181" width="362" height="28" rx="14" fill="#fbedd9"/><text x="50" y="202" class="chip amber">不通过：下架或不公开，不以试点绕过权利</text></g>
  <g transform="translate(76 628)"><rect width="700" height="224" rx="18" class="card"/><rect width="10" height="224" rx="5" class="navy"/><text x="36" y="47" class="label ink">03｜人工接管卡</text><text x="36" y="82" class="body muted">先检查：误导、拥挤、异常时是否有人接手</text><text x="36" y="121" class="body ink">留下：人工服务台、停止条件、修订摘要</text><text x="36" y="160" class="body ink">责任：场景运营 + 现场安全责任人员</text><rect x="36" y="181" width="380" height="28" rx="14" fill="#e6eff4"/><text x="50" y="202" class="chip navy">不通过：缩小范围，关闭自动提示，保留静态信息</text></g>
  <g transform="translate(824 628)"><rect width="700" height="224" rx="18" class="card"/><rect width="10" height="224" rx="5" class="teal"/><text x="36" y="47" class="label ink">04｜日常维护卡</text><text x="36" y="82" class="body muted">先检查：雨天、夜间、高峰下设施是否仍被维护</text><text x="36" y="121" class="body ink">留下：维护责任卡、离线报修、复核日期</text><text x="36" y="160" class="body ink">责任：园林／设施／商户或场地维护责任人</text><rect x="36" y="181" width="380" height="28" rx="14" fill="#e4f3ef"/><text x="50" y="202" class="chip teal">不通过：撤回临时物或暂停活动，恢复日常维护</text></g>
</svg>
