  <g font-family="Arial, sans-serif" fill="#173b35"><text x="70" y="86" font-size="42" font-weight="700">Jingzhang Resonance Loop · Lasting Return System</text><text x="72" y="122" font-size="19" fill="#5b6b62">Every digital trial leaves an offline civic improvement that can be used, maintained and reviewed.</text><text x="1030" y="88" font-size="18" fill="#1e6b5a">Rail blue: heritage timeline</text><text x="1030" y="116" font-size="18" fill="#b98345">Amber: public return line</text></g>
