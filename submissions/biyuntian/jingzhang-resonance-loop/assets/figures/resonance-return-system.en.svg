  <g font-family="Arial, sans-serif"><g transform="translate(112 238)"><circle cx="22" cy="22" r="22" fill="#1e6b5a"/><path d="M12 23h20M22 13v20" stroke="#fff" stroke-width="3"/><text x="58" y="20" font-size="24" font-weight="700" fill="#173b35">Zhongzhiyuan Test Return Court</text><text x="58" y="47" font-size="16" fill="#5b6b62">Trusted test / mobility return</text><path d="M0 83h292" stroke="#d8d2c1"/><text x="0" y="119" font-size="19" font-weight="700" fill="#1e6b5a">Digital service</text><text x="0" y="148" font-size="17" fill="#33463e">test explanation · compute literacy · staffed Q&amp;A</text><text x="0" y="194" font-size="19" font-weight="700" fill="#1e6b5a">Civic return</text><text x="0" y="223" font-size="17" fill="#33463e">movable shade · seats · printed notice · help desk</text><text x="0" y="274" font-size="16" fill="#5b6b62">Still usable when the exhibit is off</text></g><g transform="translate(573 238)"><circle cx="22" cy="22" r="22" fill="#b98345"/><path d="M12 15h20v14H12zM16 11h12" fill="none" stroke="#fff" stroke-width="3"/><text x="58" y="20" font-size="24" font-weight="700" fill="#173b35">AI Origin Knowledge Return Gallery</text><text x="58" y="47" font-size="16" fill="#5b6b62">Open-source conversion / knowledge return</text><path d="M0 83h292" stroke="#d8d2c1"/><text x="0" y="119" font-size="19" font-weight="700" fill="#a46f2a">Digital service</text><text x="0" y="148" font-size="17" fill="#33463e">collaboration · rights notice · release · staffed advice</text><text x="0" y="194" font-size="19" font-weight="700" fill="#a46f2a">Civic return</text><text x="0" y="223" font-size="17" fill="#33463e">attribution ledger · offline guide · worktable · withdrawal</text><text x="0" y="274" font-size="16" fill="#5b6b62">Understand and join without login</text></g><g transform="translate(1034 238)"><circle cx="22" cy="22" r="22" fill="#776b94"/><path d="M12 25l10-12 10 12M16 25v10h12V25" fill="none" stroke="#fff" stroke-width="3"/><text x="58" y="20" font-size="24" font-weight="700" fill="#173b35">Dazhongsi Daily Return Gate</text><text x="58" y="47" font-size="16" fill="#5b6b62">Urban use / care return</text><path d="M0 83h292" stroke="#d8d2c1"/><text x="0" y="119" font-size="19" font-weight="700" fill="#776b94">Digital service</text><text x="0" y="148" font-size="17" fill="#33463e">transfer guide · night service · merchants · inquiry</text><text x="0" y="194" font-size="19" font-weight="700" fill="#776b94">Civic return</text><text x="0" y="223" font-size="17" fill="#33463e">static wayfinding · shade · access point · service desk</text><text x="0" y="274" font-size="16" fill="#5b6b62">Works at peaks, night and offline</text></g></g>
  <g font-family="Arial, sans-serif"><rect x="84" y="610" width="1272" height="92" rx="16" fill="#173b35"/><text x="116" y="650" font-size="20" font-weight="700" fill="#fffdf7">Public Return Ledger</text><text x="116" y="680" font-size="17" fill="#d9e7df">place — service — retained benefit — maintainer — review date</text><path d="M510 631v50M830 631v50M1110 631v50" stroke="#7ca891"/><text x="545" y="650" font-size="18" fill="#fffdf7">No maintainer</text><text x="545" y="679" font-size="16" fill="#d9e7df">No expansion</text><text x="865" y="650" font-size="18" fill="#fffdf7">No staffed entry</text><text x="865" y="679" font-size="16" fill="#d9e7df">No automation</text><text x="1145" y="650" font-size="18" fill="#fffdf7">Site conditions change</text><text x="1145" y="679" font-size="16" fill="#d9e7df">Return to review</text></g>
