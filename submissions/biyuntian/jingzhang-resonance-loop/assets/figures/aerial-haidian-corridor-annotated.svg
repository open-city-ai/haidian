<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <style>
    .label { font: 700 27px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #fffdf5; paint-order: stroke; stroke: #153b35; stroke-width: 8px; stroke-linejoin: round; }
    .sub { font: 500 17px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #fffdf5; paint-order: stroke; stroke: #153b35; stroke-width: 6px; }
    .call { fill:none; stroke:#f2c46f; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .node { fill:#d69040; stroke:#fff8e8; stroke-width:4; }
    .band { fill:#123d38; fill-opacity:.92; stroke:#e0ae5b; stroke-width:2; }
  </style>
  <image href="aerial-haidian-corridor.png" width="1672" height="941"/>
