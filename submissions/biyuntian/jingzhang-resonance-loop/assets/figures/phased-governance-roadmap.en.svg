<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
<title id="t">Three-stage Resonance Roadmap</title><desc id="d">A three-stage implementation and public-decision framework from baseline observation and light pilots through reversible collaboration to annual governance review</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="760" fill="#fffdf7"/><rect width="1440" height="110" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">Three-stage Resonance Roadmap: every stage can pause, look back and leave a benefit</text><text x="56" y="81" font-size="17" fill="#d9e7df">Not a fixed delivery timetable | verify public return and staffed responsibility first | then discuss the next stage</text>
<g filter="url(#s)"><rect x="54" y="160" width="402" height="458" rx="18" fill="#fff" stroke="#b7d0c4"/><rect x="519" y="160" width="402" height="458" rx="18" fill="#fff" stroke="#e6cca5"/><rect x="984" y="160" width="402" height="458" rx="18" fill="#fff" stroke="#ccc2dd"/></g>
<rect x="54" y="160" width="402" height="76" rx="18" fill="#1e6b5a"/><text x="82" y="207" font-size="26" font-weight="700" fill="#fff">A · See and calibrate</text>
<rect x="519" y="160" width="402" height="76" rx="18" fill="#b98345"/><text x="547" y="207" font-size="26" font-weight="700" fill="#fff">B · Reversible pilot + collaborate</text>
<rect x="984" y="160" width="402" height="76" rx="18" fill="#776b94"/><text x="1012" y="207" font-size="26" font-weight="700" fill="#fff">C · Retain + annual review</text>
<g font-size="16" fill="#374e45"><text x="82" y="279" font-weight="700" fill="#1e6b5a">May begin</text><text x="82" y="307">walking observation · access/night record</text><text x="82" y="332">printed guide · staffed inquiry · rights review</text><text x="82" y="357">small open day</text><text x="547" y="279" font-weight="700" fill="#a46f2a">May begin</text><text x="547" y="307">three detail kits · non-production test</text><text x="547" y="332">project cards/worktable · static guide</text><text x="547" y="357">bounded open day</text><text x="1012" y="279" font-weight="700" fill="#776b94">May begin</text><text x="1012" y="307">specialist delivery of verified improvements</text><text x="1012" y="332">culture line · open contribution · care loop</text><text x="1012" y="357">annual public review</text>
<line x1="82" y1="391" x2="428" y2="391" stroke="#d8d2c1"/><line x1="547" y1="391" x2="893" y2="391" stroke="#d8d2c1"/><line x1="1012" y1="391" x2="1358" y2="391" stroke="#d8d2c1"/>
<text x="82" y="429" font-weight="700" fill="#1e6b5a">Public decision</text><text x="82" y="457">observe / stay small / do not enter site</text><text x="82" y="487" font-weight="700" fill="#1e6b5a">Retain</text><text x="82" y="515">issue map, offline route, staffed hours</text><text x="82" y="540">observation + complaint digest</text><text x="547" y="429" font-weight="700" fill="#a46f2a">Public decision</text><text x="547" y="457">retain / revise / withdraw</text><text x="547" y="487" font-weight="700" fill="#a46f2a">Retain</text><text x="547" y="515">layout, service card, consent/withdrawal</text><text x="547" y="540">takeover + night-observation digest</text><text x="1012" y="429" font-weight="700" fill="#776b94">Public decision</text><text x="1012" y="457">expand / stay small / human-only / exit</text><text x="1012" y="487" font-weight="700" fill="#776b94">Retain</text><text x="1012" y="515">place—service—benefit—maintainer—date</text><text x="1012" y="540">next-year question list</text></g>
<path d="M456 385 L510 385" stroke="#9ab9aa" stroke-width="4"/><path d="M921 385 L975 385" stroke="#d2b57d" stroke-width="4"/><polygon points="510,385 494,376 494,394" fill="#9ab9aa"/><polygon points="975,385 959,376 959,394" fill="#d2b57d"/>
<rect x="54" y="663" width="1332" height="52" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="81" y="696" font-size="17" font-weight="700" fill="#173b35">Expansion is not the default:</text><text x="315" y="696" font-size="16" fill="#5b6b62">ordinary movement remains | staffed help remains | the benefit has a maintainer | feedback can still change a decision</text></g>
</svg>
