<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">京张共振环创新生态接力</title><desc id="desc">从基础研究到城市采用的六段生态接力，每段包含空间前台、唯一交接成果、人工责任入口与回退路径。</desc>
<rect width="1440" height="820" fill="#fffdf7"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="66" y="80" font-size="42" font-weight="700" fill="#173b35">创新生态接力：研究如何走进城市，又如何回到公共复核</text><text x="68" y="116" font-size="19" fill="#5b6b62">六段不是招商流水线；每段只交接一份可阅读、可复核、可回退的成果</text></g>
<g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><path d="M120 275 H1320" stroke="#c7d8ce" stroke-width="12" stroke-linecap="round"/><path d="M120 275 H1320" stroke="#1e6b5a" stroke-width="5" stroke-linecap="round" stroke-dasharray="15 12"/>
<g transform="translate(80 190)"><circle cx="58" cy="85" r="46" fill="#173b35"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">01</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f3f7f4" stroke="#b7cec0"/><text x="18" y="185" font-size="21" font-weight="700" fill="#173b35">基础研究</text><text x="18" y="216" font-size="16" fill="#5b6b62">研究交流点 / 问题讲堂</text><text x="18" y="254" font-size="15" fill="#173b35">交接：问题简报</text><text x="18" y="281" font-size="15" fill="#1e6b5a">回退：问题与资料核验</text></g>
<g transform="translate(300 190)"><circle cx="58" cy="85" r="46" fill="#1e6b5a"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">02</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f3f7f4" stroke="#b7cec0"/><text x="18" y="185" font-size="21" font-weight="700" fill="#173b35">开源贡献</text><text x="18" y="216" font-size="16" fill="#5b6b62">开源前台 / 成果卡廊</text><text x="18" y="254" font-size="15" fill="#173b35">交接：授权与署名</text><text x="18" y="281" font-size="15" fill="#1e6b5a">回退：权利澄清</text></g>
<g transform="translate(520 190)"><circle cx="58" cy="85" r="46" fill="#3e8c83"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">03</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f3f7f4" stroke="#b7cec0"/><text x="18" y="185" font-size="21" font-weight="700" fill="#173b35">可信测试</text><text x="18" y="216" font-size="16" fill="#5b6b62">测试庭 / 观测台</text><text x="18" y="254" font-size="15" fill="#173b35">交接：异常与接管摘要</text><text x="18" y="281" font-size="15" fill="#1e6b5a">回退：受控小试或停止</text></g>
<g transform="translate(740 190)"><circle cx="58" cy="85" r="46" fill="#b98345"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">04</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#fbf6ed" stroke="#ddc393"/><text x="18" y="185" font-size="21" font-weight="700" fill="#173b35">孵化与适配</text><text x="18" y="216" font-size="16" fill="#5b6b62">共享工坊 / 场景咨询桌</text><text x="18" y="254" font-size="15" fill="#173b35">交接：适配与非AI基线</text><text x="18" y="281" font-size="15" fill="#a46f2a">回退：原型修订</text></g>
<g transform="translate(960 190)"><circle cx="58" cy="85" r="46" fill="#93634b"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">05</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#fbf6ed" stroke="#ddc393"/><text x="18" y="185" font-size="21" font-weight="700" fill="#173b35">资本服务</text><text x="18" y="216" font-size="16" fill="#5b6b62">预约协作桌 / 会客厅</text><text x="18" y="254" font-size="15" fill="#173b35">交接：合规与资源对接</text><text x="18" y="281" font-size="15" fill="#a46f2a">回退：材料完善</text></g>
<g transform="translate(1180 190)"><circle cx="58" cy="85" r="46" fill="#776b94"/><text x="58" y="93" text-anchor="middle" font-size="23" fill="#fff">06</text><rect x="0" y="150" width="215" height="178" rx="16" fill="#f6f3f9" stroke="#c7bfd7"/><text x="18" y="185" font-size="21" font-weight="700" fill="#173b35">城市采用</text><text x="18" y="216" font-size="16" fill="#5b6b62">公园公共线 / 站城界面</text><text x="18" y="254" font-size="15" fill="#173b35">交接：公共回响台账</text><text x="18" y="281" font-size="15" fill="#776b94">回退：修订、缩小或退出</text></g>
<rect x="70" y="590" width="1300" height="136" rx="18" fill="#edf4ee" stroke="#bad1c2"/><text x="102" y="632" font-size="23" font-weight="700" fill="#173b35">资本服务的公共边界</text><text x="102" y="668" font-size="18" fill="#5b6b62">服务于权利理解、材料准备、场景匹配与专业资源连接；不承诺融资、不以估值或投资额判断公共空间价值。</text><text x="102" y="700" font-size="18" fill="#1e6b5a">所有展示仍须回答：公众获得了什么可离线使用、可维护、可复核的城市回响？</text></g>
</svg>
