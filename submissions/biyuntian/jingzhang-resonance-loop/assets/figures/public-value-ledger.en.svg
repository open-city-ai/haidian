<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="t d">
<title id="t">Public-value evidence ledger</title><desc id="d">Five non-profiling observations—movement, understanding, human alternative, care and feedback—lead to public decisions to retain, revise, return to people or exit</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".10"/></filter></defs>
<rect width="1440" height="770" fill="#fffdf7"/><rect width="1440" height="112" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">Public-value evidence ledger: observe service, not profile people</text><text x="56" y="81" font-size="17" fill="#d9e7df">Low data | offline readable | service + spatial digest | no identity, faces, device IDs, precise paths or identifiable feedback</text>
<text x="58" y="156" font-size="20" font-weight="700" fill="#173b35">Five site observations</text><text x="1108" y="156" font-size="20" font-weight="700" fill="#173b35">Public decisions</text>
<g filter="url(#s)"><rect x="55" y="182" width="930" height="468" rx="18" fill="#fff" stroke="#c7d4cc"/><rect x="1030" y="182" width="355" height="468" rx="18" fill="#fff" stroke="#c7d4cc"/></g>
<g font-size="16" fill="#374e45"><rect x="76" y="208" width="888" height="64" rx="10" fill="#edf4ee"/><text x="96" y="238" font-weight="700" fill="#1e6b5a">01 Movement + access</text><text x="318" y="238">route, stopping and match between printed route + site</text><text x="730" y="238" fill="#5b6b62">no journey, location or identity</text>
<rect x="76" y="292" width="888" height="64" rx="10" fill="#fbf6ed"/><text x="96" y="322" font-weight="700" fill="#a46f2a">02 Understanding + choice</text><text x="318" y="322">no-login understanding, staffed + withdrawal route</text><text x="730" y="322" fill="#5b6b62">no click profile or device fingerprint</text>
<rect x="76" y="376" width="888" height="64" rx="10" fill="#f3f0f8"/><text x="96" y="406" font-weight="700" fill="#776b94">03 Human alternative + safety</text><text x="318" y="406">takeover, night service and non-AI path available</text><text x="730" y="406" fill="#5b6b62">no health or behaviour scoring</text>
<rect x="76" y="460" width="888" height="64" rx="10" fill="#edf4ee"/><text x="96" y="490" font-weight="700" fill="#1e6b5a">04 Care + environment</text><text x="318" y="490">lighting, water, trees, seating and guidance usable</text><text x="730" y="490" fill="#5b6b62">no reporter identity/contact</text>
<rect x="76" y="544" width="888" height="64" rx="10" fill="#fbf6ed"/><text x="96" y="574" font-weight="700" fill="#a46f2a">05 Feedback + revision</text><text x="318" y="574">whether issues receive response and return to site</text><text x="730" y="574" fill="#5b6b62">no identifiable quote or file</text></g>
<path d="M985 416 L1015 416" stroke="#86aa98" stroke-width="5"/><polygon points="1015,416 1000,407 1000,425" fill="#86aa98"/>
<g font-size="18"><rect x="1054" y="216" width="307" height="68" rx="12" fill="#1e6b5a"/><text x="1208" y="258" text-anchor="middle" fill="#fff" font-weight="700">RETAIN: public return continues</text><rect x="1054" y="305" width="307" height="68" rx="12" fill="#b98345"/><text x="1208" y="347" text-anchor="middle" fill="#fff" font-weight="700">REVISE: explain, staff or maintain</text><rect x="1054" y="394" width="307" height="68" rx="12" fill="#776b94"/><text x="1208" y="436" text-anchor="middle" fill="#fff" font-weight="700">RETURN TO PEOPLE: static + staff</text><rect x="1054" y="483" width="307" height="68" rx="12" fill="#8a5d4c"/><text x="1208" y="525" text-anchor="middle" fill="#fff" font-weight="700">EXIT: stop when conditions fail</text></g>
<text x="1060" y="591" font-size="15" fill="#5b6b62">Publish only segment state, issue category,</text><text x="1060" y="616" font-size="15" fill="#5b6b62">responsibility state, review date and reason.</text>
<rect x="55" y="681" width="1330" height="52" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="82" y="713" font-size="17" font-weight="700" fill="#173b35">Default rule:</text><text x="210" y="713" font-size="16" fill="#5b6b62">without sufficient evidence, do not expand; stay small, return to people or exit. This is neither a score dashboard nor an automated pass.</text></g>
</svg>
