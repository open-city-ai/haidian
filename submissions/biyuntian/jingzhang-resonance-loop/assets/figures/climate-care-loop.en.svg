<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="t d">
<title id="t">Climate–space–service care loop</title><desc id="d">Across sun, rain and evening conditions, blue-green elements, human care and low-carbon compute explanation retain offline civic value</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="770" fill="#fffdf7"/><rect width="1440" height="110" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">Climate–space–service care loop: blue-green space serves daily resilience first</text><text x="56" y="81" font-size="17" fill="#d9e7df">Sun, rain, evening | movement, stopping, care and people first | low-carbon compute is non-live and explainable only</text>
<g filter="url(#s)"><rect x="48" y="165" width="390" height="440" rx="18" fill="#fff" stroke="#dfcfb5"/><rect x="525" y="165" width="390" height="440" rx="18" fill="#fff" stroke="#9fc8d5"/><rect x="1002" y="165" width="390" height="440" rx="18" fill="#fff" stroke="#cbc2dc"/></g>
<rect x="48" y="165" width="390" height="68" rx="18" fill="#b98345"/><text x="76" y="207" font-size="23" font-weight="700" fill="#fff">Sun / heat: shade + stopping</text>
<rect x="525" y="165" width="390" height="68" rx="18" fill="#377d95"/><text x="553" y="207" font-size="23" font-weight="700" fill="#fff">Rain: drainage + detour</text>
<rect x="1002" y="165" width="390" height="68" rx="18" fill="#776b94"/><text x="1030" y="207" font-size="23" font-weight="700" fill="#fff">Evening / night: light + service</text>
<g font-size="16" fill="#3a5048"><text x="76" y="279" font-weight="700" fill="#a46f2a">Space first</text><text x="76" y="307">shade · stopping · permeable ground</text><text x="76" y="332">continuous walking before display</text><text x="76" y="375" font-weight="700" fill="#a46f2a">Service may enter</text><text x="76" y="403">printed compute explanation · staff</text><text x="76" y="428">care observation</text><text x="76" y="471" font-weight="700" fill="#8a5d4c">If it fails</text><text x="76" y="499">remove exhibit taking shade, route or seating</text>
<text x="553" y="279" font-weight="700" fill="#377d95">Space first</text><text x="553" y="307">drainage check · detour · staffed check</text><text x="553" y="332">legible warning before activity</text><text x="553" y="375" font-weight="700" fill="#377d95">Service may enter</text><text x="553" y="403">human-reviewed route-state notice</text><text x="553" y="428">never a live-warning claim</text><text x="553" y="471" font-weight="700" fill="#8a5d4c">If it fails</text><text x="553" y="499">stop outdoors/automation; use offline guide</text>
<text x="1030" y="279" font-weight="700" fill="#776b94">Space first</text><text x="1030" y="307">continuous light · crossing · access rest</text><text x="1030" y="332">staffed service before night experience</text><text x="1030" y="375" font-weight="700" fill="#776b94">Service may enter</text><text x="1030" y="403">night walk · aggregate care status</text><text x="1030" y="428">bounded public activity</text><text x="1030" y="471" font-weight="700" fill="#8a5d4c">If it fails</text><text x="1030" y="499">reduce activity; restore staff/static service</text></g>
<path d="M438 386 L510 386" stroke="#9ab9aa" stroke-width="4"/><path d="M915 386 L987 386" stroke="#9ab9aa" stroke-width="4"/><polygon points="510,386 495,377 495,395" fill="#9ab9aa"/><polygon points="987,386 972,377 972,395" fill="#9ab9aa"/>
<rect x="48" y="658" width="1344" height="58" rx="14" fill="#edf4ee" stroke="#bad1c2"/><text x="75" y="691" font-size="17" font-weight="700" fill="#173b35">Three-anchor benefits:</text><text x="285" y="691" font-size="16" fill="#5b6b62">Zhongzhiyuan = shade/seat/compute explanation | AI Origin = physical information + rain detour | Dazhongsi = night guide/access/staff</text></g>
</svg>
