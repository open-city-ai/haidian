<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">京张共振环回响留存系统</title><desc id="desc">三处重点区将数字服务转化为通行、知识与维护三类可离线使用的公共空间成果。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8f3e7"/><stop offset="1" stop-color="#edf4ee"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#28433a" flood-opacity=".16"/></filter></defs>
  <rect width="1440" height="760" fill="url(#bg)"/><path d="M72 390 C260 160 420 618 600 390 S950 158 1090 390 S1282 550 1370 304" fill="none" stroke="#173b35" stroke-width="14" stroke-linecap="round" opacity=".15"/><path d="M72 371 C260 141 420 599 600 371 S950 139 1090 371 S1282 531 1370 285" fill="none" stroke="#1e6b5a" stroke-width="6" stroke-linecap="round"/><path d="M72 411 C260 181 420 639 600 411 S950 179 1090 411 S1282 571 1370 325" fill="none" stroke="#b98345" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 13"/>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" fill="#173b35"><text x="70" y="86" font-size="42" font-weight="700">京张共振环 · 回响留存系统</text><text x="72" y="122" font-size="19" fill="#5b6b62">每一次数字试验，均须留下可离线使用、可维护、可复核的公共空间改善</text><text x="1030" y="88" font-size="18" fill="#1e6b5a">深铁蓝：历史时间线</text><text x="1030" y="116" font-size="18" fill="#b98345">琥珀线：公共回响线</text></g>
  <g filter="url(#shadow)"><rect x="84" y="205" width="350" height="328" rx="20" fill="#fffdf7" stroke="#6f9f82" stroke-width="2"/><rect x="545" y="205" width="350" height="328" rx="20" fill="#fffdf7" stroke="#bc944e" stroke-width="2"/><rect x="1006" y="205" width="350" height="328" rx="20" fill="#fffdf7" stroke="#776b94" stroke-width="2"/></g>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><g transform="translate(112 238)"><circle cx="22" cy="22" r="22" fill="#1e6b5a"/><path d="M12 23h20M22 13v20" stroke="#fff" stroke-width="3"/><text x="58" y="20" font-size="27" font-weight="700" fill="#173b35">众智园 · 测试回响庭</text><text x="58" y="47" font-size="16" fill="#5b6b62">可信试验段 / 通行回响</text><path d="M0 83h292" stroke="#d8d2c1"/><text x="0" y="119" font-size="19" font-weight="700" fill="#1e6b5a">数字服务</text><text x="0" y="148" font-size="18" fill="#33463e">测试说明 · 低碳算力讲解 · 人工答疑</text><text x="0" y="194" font-size="19" font-weight="700" fill="#1e6b5a">留下的城市成果</text><text x="0" y="223" font-size="18" fill="#33463e">可移动遮阴 · 坐憩 · 纸质说明 · 咨询桌</text><text x="0" y="274" font-size="16" fill="#5b6b62">停用后仍可停留、阅读、问询与维护</text></g><g transform="translate(573 238)"><circle cx="22" cy="22" r="22" fill="#b98345"/><path d="M12 15h20v14H12zM16 11h12" fill="none" stroke="#fff" stroke-width="3"/><text x="58" y="20" font-size="27" font-weight="700" fill="#173b35">AI 原点 · 知识回响廊</text><text x="58" y="47" font-size="16" fill="#5b6b62">开源转化段 / 知识回响</text><path d="M0 83h292" stroke="#d8d2c1"/><text x="0" y="119" font-size="19" font-weight="700" fill="#a46f2a">数字服务</text><text x="0" y="148" font-size="18" fill="#33463e">成果协作 · 权利说明 · 开源发布 · 人工咨询</text><text x="0" y="194" font-size="19" font-weight="700" fill="#a46f2a">留下的城市成果</text><text x="0" y="223" font-size="18" fill="#33463e">贡献署名册 · 实体导览 · 公共工作台 · 撤回入口</text><text x="0" y="274" font-size="16" fill="#5b6b62">不登录也可理解、参与与提出修订</text></g><g transform="translate(1034 238)"><circle cx="22" cy="22" r="22" fill="#776b94"/><path d="M12 25l10-12 10 12M16 25v10h12V25" fill="none" stroke="#fff" stroke-width="3"/><text x="58" y="20" font-size="27" font-weight="700" fill="#173b35">大钟寺 · 日常回响门</text><text x="58" y="47" font-size="16" fill="#5b6b62">城市应用段 / 维护回响</text><path d="M0 83h292" stroke="#d8d2c1"/><text x="0" y="119" font-size="19" font-weight="700" fill="#776b94">数字服务</text><text x="0" y="148" font-size="18" fill="#33463e">换乘指引 · 夜间服务 · 商户协同 · 人工问询</text><text x="0" y="194" font-size="19" font-weight="700" fill="#776b94">留下的城市成果</text><text x="0" y="223" font-size="18" fill="#33463e">静态导视 · 遮阴坐憩 · 无障碍点 · 服务窗口</text><text x="0" y="274" font-size="16" fill="#5b6b62">高峰、夜间与离线时仍连续可用</text></g></g>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><rect x="84" y="610" width="1272" height="92" rx="16" fill="#173b35"/><text x="116" y="650" font-size="20" font-weight="700" fill="#fffdf7">公共回响台账</text><text x="116" y="680" font-size="17" fill="#d9e7df">地点 — 服务 — 留存物 — 维护人 — 复核日期</text><path d="M510 631v50M830 631v50M1110 631v50" stroke="#7ca891"/><text x="545" y="650" font-size="18" fill="#fffdf7">没有维护人</text><text x="545" y="679" font-size="16" fill="#d9e7df">不扩容</text><text x="865" y="650" font-size="18" fill="#fffdf7">没有人工入口</text><text x="865" y="679" font-size="16" fill="#d9e7df">不自动化</text><text x="1145" y="650" font-size="18" fill="#fffdf7">现场条件变化</text><text x="1145" y="679" font-size="16" fill="#d9e7df">回到复核</text></g>
