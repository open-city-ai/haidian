<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770" role="img" aria-labelledby="t d">
<title id="t">京张共振环天气—空间—服务照护环</title><desc id="d">晴天、降雨和傍晚三种情景下，蓝绿构件、人工维护和低碳算力解释共同留下可离线使用的公共价值</desc>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b35" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="770" fill="#fffdf7"/><rect width="1440" height="110" fill="#173b35"/><g font-family="Arial, sans-serif"><text x="56" y="50" font-size="31" font-weight="700" fill="#fff">天气—空间—服务照护环：蓝绿系统先服务于日常韧性</text><text x="56" y="81" font-size="17" fill="#d9e7df">晴天、降雨、傍晚｜先通行、停留、照护和人工服务｜低碳算力仅以非实时、可解释方式进入</text>
<g filter="url(#s)"><rect x="48" y="165" width="390" height="440" rx="18" fill="#fff" stroke="#dfcfb5"/><rect x="525" y="165" width="390" height="440" rx="18" fill="#fff" stroke="#9fc8d5"/><rect x="1002" y="165" width="390" height="440" rx="18" fill="#fff" stroke="#cbc2dc"/></g>
<rect x="48" y="165" width="390" height="68" rx="18" fill="#b98345"/><text x="76" y="207" font-size="23" font-weight="700" fill="#fff">晴天 / 高温：遮阴与停留</text>
<rect x="525" y="165" width="390" height="68" rx="18" fill="#377d95"/><text x="553" y="207" font-size="23" font-weight="700" fill="#fff">降雨：排水与避让</text>
<rect x="1002" y="165" width="390" height="68" rx="18" fill="#776b94"/><text x="1030" y="207" font-size="23" font-weight="700" fill="#fff">傍晚 / 夜间：照明与服务</text>
<g font-size="16" fill="#3a5048"><text x="76" y="279" font-weight="700" fill="#a46f2a">空间优先</text><text x="76" y="307">树荫 · 可坐可停 · 透水地面</text><text x="76" y="332">连续慢行先于展示</text><text x="76" y="375" font-weight="700" fill="#a46f2a">可进入服务</text><text x="76" y="403">纸质低碳算力解释 · 人工讲解</text><text x="76" y="428">维护观察</text><text x="76" y="471" font-weight="700" fill="#8a5d4c">条件不满足</text><text x="76" y="499">撤去占用阴影、通道、坐憩的展项</text>
<text x="553" y="279" font-weight="700" fill="#377d95">空间优先</text><text x="553" y="307">排水观察 · 避让路径 · 人工巡查</text><text x="553" y="332">可读警示先于活动</text><text x="553" y="375" font-weight="700" fill="#377d95">可进入服务</text><text x="553" y="403">人工复核的路段状态说明</text><text x="553" y="428">不冒充实时预警</text><text x="553" y="471" font-weight="700" fill="#8a5d4c">条件不满足</text><text x="553" y="499">停止室外演示与自动提示，转离线导向</text>
<text x="1030" y="279" font-weight="700" fill="#776b94">空间优先</text><text x="1030" y="307">照明连续 · 过街可读 · 无障碍停留</text><text x="1030" y="332">人工服务先于夜间体验</text><text x="1030" y="375" font-weight="700" fill="#776b94">可进入服务</text><text x="1030" y="403">夜间文化导览 · 聚合维护状态</text><text x="1030" y="428">限时公共活动</text><text x="1030" y="471" font-weight="700" fill="#8a5d4c">条件不满足</text><text x="1030" y="499">缩减活动并恢复常态人工与静态服务</text></g>
