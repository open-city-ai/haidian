<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">京张共振环文化运营回路</title><desc id="desc">清华园、东升镇、中关村与大钟寺构成四段文化导览线，四个季节主题以现场提问、三核协作、公共回响构成年度循环。</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8f3e7"/><stop offset="1" stop-color="#edf4ee"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#28433a" flood-opacity=".14"/></filter></defs>
<rect width="1440" height="780" fill="url(#bg)"/><g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="68" y="80" font-size="42" font-weight="700" fill="#173b35">文化运营回路：记忆—提问—共创—回响</text><text x="70" y="116" font-size="19" fill="#5b6b62">百年铁路文化、中关村开源文化与 AI 新文化，在同一条可步行、可复盘的公共线上相遇</text></g>
<path d="M140 270 C340 185 485 340 670 260 S1000 190 1285 300" fill="none" stroke="#173b35" stroke-width="12" opacity=".14"/><path d="M140 254 C340 169 485 324 670 244 S1000 174 1285 284" fill="none" stroke="#1e6b5a" stroke-width="6"/><path d="M140 286 C340 201 485 356 670 276 S1000 206 1285 316" fill="none" stroke="#b98345" stroke-width="4" stroke-dasharray="11 12"/>
<g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" filter="url(#sh)"><g transform="translate(110 202)"><circle cx="34" cy="34" r="34" fill="#173b35"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">01</text><rect x="-28" y="84" width="190" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="22" fill="#173b35" font-weight="700">清华园</text><text x="-10" y="146" font-size="16" fill="#5b6b62">铁路记忆 · 研究策源</text><text x="-10" y="171" font-size="15" fill="#1e6b5a">观察与提问</text></g><g transform="translate(440 246)"><circle cx="34" cy="34" r="34" fill="#1e6b5a"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">02</text><rect x="-28" y="84" width="190" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="22" fill="#173b35" font-weight="700">东升镇</text><text x="-10" y="146" font-size="16" fill="#5b6b62">校园—园区协同</text><text x="-10" y="171" font-size="15" fill="#1e6b5a">走读与共识</text></g><g transform="translate(770 202)"><circle cx="34" cy="34" r="34" fill="#b98345"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">03</text><rect x="-28" y="84" width="190" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="22" fill="#173b35" font-weight="700">中关村</text><text x="-10" y="146" font-size="16" fill="#5b6b62">开源转化 · 城市生活</text><text x="-10" y="171" font-size="15" fill="#a46f2a">共创与修订</text></g><g transform="translate(1100 246)"><circle cx="34" cy="34" r="34" fill="#776b94"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">04</text><rect x="-28" y="84" width="190" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="22" fill="#173b35" font-weight="700">大钟寺</text><text x="-10" y="146" font-size="16" fill="#5b6b62">站城界面 · 公共展示</text><text x="-10" y="171" font-size="15" fill="#776b94">回到日常</text></g></g>
<g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><text x="70" y="485" font-size="28" font-weight="700" fill="#173b35">四季主题：每次活动都回到现场</text><g transform="translate(72 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#6f9f82" stroke-width="2"/><text x="24" y="38" font-size="23" font-weight="700" fill="#1e6b5a">春 · 铁路记忆开放周</text><text x="24" y="69" font-size="16" fill="#5b6b62">口述记忆 · 步行观察</text><text x="24" y="103" font-size="16" fill="#173b35">留下：离线路径图与问题清单</text><text x="24" y="129" font-size="15" fill="#1e6b5a">公布：采用与待核验事项</text></g><g transform="translate(403 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#bc944e" stroke-width="2"/><text x="24" y="38" font-size="23" font-weight="700" fill="#a46f2a">夏 · 开源共创季</text><text x="24" y="69" font-size="16" fill="#5b6b62">成果卡 · 公开课 · 权利问询</text><text x="24" y="103" font-size="16" fill="#173b35">留下：工作台与署名/授权说明</text><text x="24" y="129" font-size="15" fill="#a46f2a">公布：撤回与修订摘要</text></g><g transform="translate(734 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#776b94" stroke-width="2"/><text x="24" y="38" font-size="23" font-weight="700" fill="#776b94">秋 · 城市应用观察周</text><text x="24" y="69" font-size="16" fill="#5b6b62">商户走读 · 夜间导视观察</text><text x="24" y="103" font-size="16" fill="#173b35">留下：静态导视与人工问询点</text><text x="24" y="129" font-size="15" fill="#776b94">公布：是否继续测试</text></g><g transform="translate(1065 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#173b35" stroke-width="2"/><text x="24" y="38" font-size="23" font-weight="700" fill="#173b35">冬 · 公共复盘会</text><text x="24" y="69" font-size="16" fill="#5b6b62">年度台账 · 公众纠错</text><text x="24" y="103" font-size="16" fill="#173b35">留下：责任卡与维护清单</text><text x="24" y="129" font-size="15" fill="#173b35">公布：暂停、保留或修订决定</text></g><text x="72" y="728" font-size="17" fill="#5b6b62">活动热度不构成扩容依据；无许可、人工值守、无障碍条件或维护人时，活动缩减或暂停。</text></g>
</svg>
