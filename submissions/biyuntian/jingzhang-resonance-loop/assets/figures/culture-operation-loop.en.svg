<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">Jingzhang Resonance Loop Culture and Operation Cycle</title><desc id="desc">Qinghuayuan, Dongsheng, Zhongguancun and Dazhongsi form four cultural-route segments. Four seasonal themes operate through site questions, three-anchor collaboration and public return.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8f3e7"/><stop offset="1" stop-color="#edf4ee"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#28433a" flood-opacity=".14"/></filter></defs>
<rect width="1440" height="780" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="68" y="80" font-size="42" font-weight="700" fill="#173b35">Culture and Operation Cycle: Memory — Question — Co-create — Return</text><text x="70" y="116" font-size="19" fill="#5b6b62">Railway heritage, Zhongguancun’s open culture and AI culture meet on one walkable, reviewable public line.</text></g>
<path d="M140 270 C340 185 485 340 670 260 S1000 190 1285 300" fill="none" stroke="#173b35" stroke-width="12" opacity=".14"/><path d="M140 254 C340 169 485 324 670 244 S1000 174 1285 284" fill="none" stroke="#1e6b5a" stroke-width="6"/><path d="M140 286 C340 201 485 356 670 276 S1000 206 1285 316" fill="none" stroke="#b98345" stroke-width="4" stroke-dasharray="11 12"/>
<g font-family="Arial, sans-serif" filter="url(#sh)"><g transform="translate(110 202)"><circle cx="34" cy="34" r="34" fill="#173b35"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">01</text><rect x="-28" y="84" width="205" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="21" fill="#173b35" font-weight="700">Qinghuayuan</text><text x="-10" y="146" font-size="15" fill="#5b6b62">railway memory · research</text><text x="-10" y="171" font-size="15" fill="#1e6b5a">observe and question</text></g><g transform="translate(440 246)"><circle cx="34" cy="34" r="34" fill="#1e6b5a"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">02</text><rect x="-28" y="84" width="205" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="21" fill="#173b35" font-weight="700">Dongsheng</text><text x="-10" y="146" font-size="15" fill="#5b6b62">campus—park collaboration</text><text x="-10" y="171" font-size="15" fill="#1e6b5a">walk and agree</text></g><g transform="translate(770 202)"><circle cx="34" cy="34" r="34" fill="#b98345"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">03</text><rect x="-28" y="84" width="205" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="21" fill="#173b35" font-weight="700">Zhongguancun</text><text x="-10" y="146" font-size="15" fill="#5b6b62">open conversion · city life</text><text x="-10" y="171" font-size="15" fill="#a46f2a">co-create and revise</text></g><g transform="translate(1100 246)"><circle cx="34" cy="34" r="34" fill="#776b94"/><text x="34" y="41" text-anchor="middle" font-size="20" fill="#fff">04</text><rect x="-28" y="84" width="205" height="102" rx="14" fill="#fffdf7" stroke="#d8d2c1"/><text x="-10" y="116" font-size="21" fill="#173b35" font-weight="700">Dazhongsi</text><text x="-10" y="146" font-size="15" fill="#5b6b62">station-city public front</text><text x="-10" y="171" font-size="15" fill="#776b94">return to daily life</text></g></g>
<g font-family="Arial, sans-serif"><text x="70" y="485" font-size="28" font-weight="700" fill="#173b35">Four seasonal themes: every event returns to site</text><g transform="translate(72 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#6f9f82" stroke-width="2"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1e6b5a">Spring · Railway Memory</text><text x="24" y="69" font-size="15" fill="#5b6b62">memory collection · walk observation</text><text x="24" y="103" font-size="15" fill="#173b35">Keep: offline route + problem list</text><text x="24" y="129" font-size="14" fill="#1e6b5a">Publish: adopted / to verify</text></g><g transform="translate(403 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#bc944e" stroke-width="2"/><text x="24" y="38" font-size="20" font-weight="700" fill="#a46f2a">Summer · Open-source</text><text x="24" y="69" font-size="15" fill="#5b6b62">project cards · class · rights inquiry</text><text x="24" y="103" font-size="15" fill="#173b35">Keep: worktable + attribution notice</text><text x="24" y="129" font-size="14" fill="#a46f2a">Publish: withdrawal / revision</text></g><g transform="translate(734 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#776b94" stroke-width="2"/><text x="24" y="38" font-size="20" font-weight="700" fill="#776b94">Autumn · Urban Use</text><text x="24" y="69" font-size="15" fill="#5b6b62">merchant walk · night observation</text><text x="24" y="103" font-size="15" fill="#173b35">Keep: static guide + staffed inquiry</text><text x="24" y="129" font-size="14" fill="#776b94">Publish: continue or pause</text></g><g transform="translate(1065 520)"><rect width="294" height="150" rx="18" fill="#fffdf7" stroke="#173b35" stroke-width="2"/><text x="24" y="38" font-size="20" font-weight="700" fill="#173b35">Winter · Public Review</text><text x="24" y="69" font-size="15" fill="#5b6b62">annual ledger · public correction</text><text x="24" y="103" font-size="15" fill="#173b35">Keep: responsibility + maintenance</text><text x="24" y="129" font-size="14" fill="#173b35">Publish: pause / retain / revise</text></g><text x="72" y="728" font-size="17" fill="#5b6b62">Attention is not a basis for expansion. Without permission, staffed presence, access conditions or a maintainer, an event shrinks or pauses.</text></g>
</svg>
