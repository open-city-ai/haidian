<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">R04 开源知识前台空间裁决图</title><desc id="desc">AI原点开源知识前台的三个概念性空间备选，中央展示岛被否决，分散服务点需修订，边侧知识前台进入深化。</desc>
<defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173b35" flood-opacity=".14"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dce5df" stroke-width="1"/></pattern></defs>
<rect width="1600" height="940" fill="#fffdf7"/><rect width="1600" height="126" fill="#163c36"/><g font-family="Arial, 'Noto Sans SC', sans-serif"><text x="62" y="57" font-size="34" font-weight="700" fill="#fff">R04 开源知识前台：三个界面备选，一次公共路径裁决</text><text x="62" y="94" font-size="18" fill="#d9e7df">概念性空间关系验证｜不代表现状测绘、工程尺寸、许可或实施结论</text>
<g transform="translate(60 168)"><rect width="460" height="548" rx="20" fill="#fff" stroke="#d8c4c0" stroke-width="2" filter="url(#shadow)"/><rect width="460" height="76" rx="20" fill="#8e3d38"/><text x="28" y="47" font-size="26" font-weight="700" fill="#fff">R04-A · 中央展示岛</text><text x="370" y="47" font-size="17" font-weight="700" fill="#ffe8e6">否决</text><g transform="translate(28 108)"><rect width="404" height="262" rx="12" fill="url(#grid)" stroke="#d8c4c0"/><path d="M18 132H386" stroke="#1f9b85" stroke-width="30" stroke-linecap="round"/><path d="M18 132H386" stroke="#fff" stroke-width="5" stroke-dasharray="14 11"/><rect x="151" y="72" width="102" height="120" rx="12" fill="#c45b51"/><text x="202" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">数字</text><text x="202" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">展示岛</text><path d="M83 95 C115 70 137 76 151 86" fill="none" stroke="#c45b51" stroke-width="7" marker-end="url(#x)"/><path d="M321 169 C286 195 269 186 253 178" fill="none" stroke="#c45b51" stroke-width="7"/><text x="202" y="234" text-anchor="middle" font-size="15" fill="#9a3f39">公共慢行线被迫绕行</text></g><text x="28" y="416" font-size="20" font-weight="700" fill="#8e3d38">未通过：P01 路径连续 / P02 不登录抵达</text><text x="28" y="454" font-size="17" fill="#53645d">展示占据通行中心，普通穿行与人工问询</text><text x="28" y="480" font-size="17" fill="#53645d">不能在同一条无障碍公共路径上自然抵达。</text><rect x="28" y="506" width="404" height="24" rx="12" fill="#f6e3df"/><text x="230" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#8e3d38">REJECT DESIGN · 不进入试用</text></g>
<g transform="translate(570 168)"><rect width="460" height="548" rx="20" fill="#fff" stroke="#dfcfb5" stroke-width="2" filter="url(#shadow)"/><rect width="460" height="76" rx="20" fill="#b87832"/><text x="28" y="47" font-size="26" font-weight="700" fill="#fff">R04-B · 分散服务点</text><text x="365" y="47" font-size="17" font-weight="700" fill="#fff4dc">修订</text><g transform="translate(28 108)"><rect width="404" height="262" rx="12" fill="url(#grid)" stroke="#dfcfb5"/><path d="M18 132H386" stroke="#1f9b85" stroke-width="30" stroke-linecap="round"/><path d="M18 132H386" stroke="#fff" stroke-width="5" stroke-dasharray="14 11"/><rect x="66" y="54" width="82" height="64" rx="10" fill="#c78d46"/><rect x="256" y="145" width="92" height="64" rx="10" fill="#c78d46"/><rect x="168" y="60" width="82" height="64" rx="10" fill="#c78d46"/><text x="107" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">成果卡</text><text x="209" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">咨询</text><text x="302" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">工作台</text><text x="202" y="242" text-anchor="middle" font-size="15" fill="#a46d2d">责任与撤回入口分散</text></g><text x="28" y="416" font-size="20" font-weight="700" fill="#a46d2d">需修订：P03 人工交接 / P04 撤回可读</text><text x="28" y="454" font-size="17" fill="#53645d">公共路径保留，但首次到访者难以判断</text><text x="28" y="480" font-size="17" fill="#53645d">谁负责解释、何处修改或撤下成果。</text><rect x="28" y="506" width="404" height="24" rx="12" fill="#f8ecd9"/><text x="230" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#a46d2d">REVISE DESIGN · 回到界面整合</text></g>
<g transform="translate(1080 168)"><rect width="460" height="548" rx="20" fill="#fff" stroke="#abcdbd" stroke-width="2" filter="url(#shadow)"/><rect width="460" height="76" rx="20" fill="#1c7464"/><text x="28" y="47" font-size="26" font-weight="700" fill="#fff">R04-C · 边侧知识前台</text><text x="355" y="47" font-size="17" font-weight="700" fill="#e3f5ec">深化</text><g transform="translate(28 108)"><rect width="404" height="262" rx="12" fill="url(#grid)" stroke="#abcdbd"/><path d="M18 132H386" stroke="#1f9b85" stroke-width="30" stroke-linecap="round"/><path d="M18 132H386" stroke="#fff" stroke-width="5" stroke-dasharray="14 11"/><rect x="260" y="42" width="104" height="164" rx="12" fill="#1b7666"/><rect x="274" y="55" width="76" height="33" rx="6" fill="#e5b768"/><rect x="274" y="100" width="76" height="33" rx="6" fill="#d6eee5"/><rect x="274" y="145" width="76" height="43" rx="6" fill="#e5b768"/><text x="312" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#173b35">成果卡</text><text x="312" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#173b35">权利说明</text><text x="312" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#173b35">人工前台</text><text x="161" y="242" text-anchor="middle" font-size="15" fill="#1b7666">主路径不断开 · 服务在边侧可撤回</text></g><text x="28" y="416" font-size="20" font-weight="700" fill="#1b7666">通过：P01—P05 公共基线与可逆服务</text><text x="28" y="454" font-size="17" fill="#53645d">静态导向、人工服务、权利入口与可拆成果卡</text><text x="28" y="480" font-size="17" fill="#53645d">由同一前台读取；撤下数字层仍保留普通服务。</text><rect x="28" y="506" width="404" height="24" rx="12" fill="#e2f1e9"/><text x="230" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#1b7666">ADVANCE DESIGN · 进入概念深化</text></g>
<g transform="translate(60 758)"><rect width="1480" height="116" rx="18" fill="#edf5ef" stroke="#b9d3c2"/><text x="28" y="39" font-size="20" font-weight="700" fill="#173b35">裁决规则</text><text x="28" y="71" font-size="17" fill="#52645d">公共慢行、静态导向、人工帮助、坐憩遮阴与撤回入口必须独立成立；AI 仅以边侧、可选、可拆、可暂停的方式进入。</text><text x="28" y="98" font-size="15" fill="#1b7666">本图验证设计关系，不验证现场净宽、客流、安全、许可、造价或运营绩效；所有现场结果为 0 / 未运行。</text></g></g>
</svg>
