fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">topology checking only.</text><text x="945.0" y="205.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="start" letter-spacing="0">Path separation and handoff nodes</text><rect x="945.0" y="255.0" width="1365.0" height="130.0" rx="12" fill="#fffdfa" stroke="#4a7eaa" stroke-width="3"/><text x="975.0" y="302.0" fill="#4a7eaa" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">01</text><text x="1045.0" y="297.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">public and accessible service | centre lines 01–02</text><text x="1045.0" y="329.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">walking/accessibility priority; any cycling needs later safe separation/management and never crosses control or unloading.</text><rect x="945.0" y="415.0" width="1365.0" height="130.0" rx="12" fill="#fffdfa" stroke="#715fa8" stroke-width="3"/><text x="975.0" y="462.0" fill="#715fa8" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">02</text><text x="1045.0" y="457.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">controlled observation | centre line 03</text><text x="1045.0" y="489.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">enter only with passport, human responsibility, and safety condition; otherwise return to observation court.</text><rect x="945.0" y="575.0" width="1365.0" height="130.0" rx="12" fill="#fffdfa" stroke="#d96552" stroke-width="3"/><text x="975.0" y="622.0" fill="#d96552" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">03</text><text x="1045.0" y="617.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">maintenance, reverse logistics, exit | centre line 04</text><text x="1045.0" y="649.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">arrival, disconnect, inventory, removal, exit use rear side; never public main flow.</text><rect x="945.0" y="735.0" width="1365.0" height="130.0" rx="12" fill="#fffdfa" stroke="#e6a23d" stroke-width="3"/><text x="975.0" y="782.0" fill="#e6a23d" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">04</text><text x="1045.0" y="777.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">emergency takeover and ordinary recovery | centre line 05</text><text x="1045.0" y="809.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">retains human and non-AI service during network/device/vendor failure.</text><rect x="945.0" y="942.0" width="1365.0" height="225.0" rx="12" fill="#ffffff" stroke="#a9b0ad" stroke-width="1"/><text x="975.0" y="985.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Typical transverse relation (not an engineering section)</text><line x1="980.0" y1="1110.0" x2="2265.0" y2="1110.0" stroke="#17222b" stroke-width="3" stroke-linecap="round"/><rect x="1010.0" y="1072.0" width="185.0" height="38.0" rx="5" fill="#c2dbbe" stroke="#6daa7e" stroke-width="2"/><text x="1102.5" y="1093.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">shade/buffer</text><rect x="1240.0" y="1072.0" width="240.0" height="38.0" rx="5" fill="#f0efe7" stroke="#4a7eaa" stroke-width="2"/><text x="1360.0" y="1093.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">public/access</text><rect x="1530.0" y="1050.0" width="250.0" height="60.0" rx="5" fill="#fffdfa" stroke="#715fa8" stroke-width="2"/><text x="1655.0" y="1093.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">controlled observe</text><rect x="1830.0" y="1050.0" width="220.0" height="60.0" rx="5" fill="#fff8f3" stroke="#d96552" stroke-width="2"/><text x="1940.0" y="1093.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">maintain/exit</text><rect x="2105.0" y="1072.0" width="135.0" height="38.0" rx="5" fill="#f8f4de" stroke="#e6a23d" stroke-width="2"/><text x="2172.5" y="1093.0" fill="#17222b" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0">human return</text><text x="975.0" y="1205.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Crossing occurs only at visible handoff courts H1/H2/H3: the public reaches the front; controlled, maintenance, and exit have</text><text x="975.0" y="1229.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">separate edges; pause retains public and human paths.</text><line x1="70.0" y1="1430.0" x2="2330.0" y2="1430.0" stroke="#a9b0ad" stroke-width="1" stroke-linecap="round"/><text x="70.0" y="1466.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Provisional container: official_boundary=false · provisional_constraint · provisional_rough; design/topology only, not redline/existing-condition/approval evidence.</text><text x="2330.0" y="1466.0" fill="#64717a" font-family="WenQuanYi Zen Hei, DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="end" letter-spacing="0">JINGZHANG OPEN COMPUTE COMMONS · v1.3 · Blue-green proposes shade, buffer, quiet observation, and return space only; blue denotes resource-observation method, not a verified water system; no unmeasured environmental benefit is claimed.</text></svg>
