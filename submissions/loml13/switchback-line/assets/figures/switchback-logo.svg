<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <title>人字线 THE SWITCHBACK LINE · Logo 概念（原创概念稿，供专业团队深化）</title>
  <desc>一撇一捺两条轨道在折返点交汇：左撇为砖红色历史轨，右捺为靛蓝色数据轨，交点为折返站圆点。原创概念图形，不含第三方素材。</desc>
  <rect width="640" height="640" fill="#FBFAF7"/>
  <!-- heritage rail: left falling stroke, drawn as twin rails -->
  <g stroke-linecap="round" fill="none">
    <path d="M196 128 L296 322" stroke="#B4443C" stroke-width="22"/>
    <path d="M240 116 L340 310" stroke="#B4443C" stroke-width="22" opacity="0.45"/>
    <!-- data rail: right falling stroke -->
    <path d="M444 128 L344 322" stroke="#2C4A7C" stroke-width="22"/>
    <path d="M400 116 L300 310" stroke="#2C4A7C" stroke-width="22" opacity="0.45"/>
    <!-- running tracks continuing after the switchback -->
    <path d="M320 372 L320 540" stroke="#1F2A33" stroke-width="26"/>
  </g>
  <!-- switchback sleepers -->
  <g stroke="#1F2A33" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="292" y1="410" x2="348" y2="410"/>
    <line x1="292" y1="452" x2="348" y2="452"/>
    <line x1="292" y1="494" x2="348" y2="494"/>
  </g>
  <!-- switchback station node -->
  <circle cx="320" cy="346" r="34" fill="#FBFAF7" stroke="#C99B3F" stroke-width="12"/>
  <circle cx="320" cy="346" r="10" fill="#C99B3F"/>
  <!-- wordmark -->
  <text x="320" y="600" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="40" font-weight="700" fill="#1F2A33">人字线 · THE SWITCHBACK LINE</text>
</svg>
