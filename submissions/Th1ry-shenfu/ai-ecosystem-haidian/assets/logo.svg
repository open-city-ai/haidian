<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><style>.f{fill:#0a0a12}.o{stroke:#00fff7;fill:none;stroke-width:10}.p{stroke:#ff00aa;fill:none;stroke-width:6}</style></defs>
  <rect class="f" width="200" height="200"/>
  <!-- 道钉（京张铁路钉形） -->
  <path class="o" d="M100 30 L100 170 M60 170 L140 170"/>
  <path class="p" d="M60 170 L40 150 M140 170 L160 150"/>
