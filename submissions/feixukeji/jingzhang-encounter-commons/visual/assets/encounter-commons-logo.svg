<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Jingzhang Encounter Commons open-ring and twin-rail mark</title>
  <desc id="desc">Two rail-like paths meet inside an open circular commons. The opening represents voluntary entry and exit.</desc>
  <rect width="640" height="240" rx="24" fill="#F5F2EA"/>
  <g transform="translate(36 24)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M126 22 A76 76 0 1 0 181 150" stroke="#18232D" stroke-width="16"/>
    <path d="M18 150 C66 150 72 86 124 86 C161 86 172 107 206 107" stroke="#C4513A" stroke-width="10"/>
    <path d="M18 170 C73 170 86 106 129 106 C162 106 174 127 214 127" stroke="#2468A2" stroke-width="10"/>
    <circle cx="126" cy="96" r="15" fill="#D59B2D" stroke="#F5F2EA" stroke-width="6"/>
    <path d="M206 107 L229 94 M214 127 L238 140" stroke="#0B7A75" stroke-width="8"/>
  </g>
  <g fill="#18232D" font-family="Noto Sans, Arial, sans-serif">
    <text x="304" y="72" font-size="20" letter-spacing="3">JINGZHANG</text>
    <text x="304" y="116" font-size="34" font-weight="700">ENCOUNTER</text>
    <text x="304" y="156" font-size="34" font-weight="700">COMMONS</text>
    <text x="304" y="190" font-size="16" fill="#69757B">OPEN TASKS · OPEN SPACE · OPEN EXIT</text>
  </g>
</svg>
