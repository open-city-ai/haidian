<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">公共证据织网：AI 空间测试与人工决策闭环</title><desc id="desc">概念性流程图，说明从公共问题和场所条件，经可撤除构件、非个人化观察和人工复核，到保留、调整或撤除的闭环。</desc>
  <rect width="1600" height="900" fill="#f7f4ed"/><rect width="1600" height="130" fill="#173f4f"/>
  <text x="70" y="82" font-family="Microsoft YaHei, sans-serif" font-size="46" fill="white">公共证据织网｜AI 空间测试与人工决策闭环</text>
  <text x="72" y="175" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#405450">概念协议：不采集身份、轨迹或生物特征；算法不得作出准入、分配、执法、评价或拒绝服务决定。</text>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g fill="#e6e1fb" stroke="#5b45c5" stroke-width="3"><rect x="70" y="300" width="250" height="170" rx="18"/><rect x="370" y="300" width="250" height="170" rx="18"/><rect x="670" y="300" width="250" height="170" rx="18"/><rect x="970" y="300" width="250" height="170" rx="18"/></g><g font-size="27" fill="#173f4f"><text x="195" y="355">公共问题</text><text x="195" y="395">与场所条件</text><text x="495" y="355">可撤除构件</text><text x="495" y="395">纸质优先服务</text><text x="795" y="355">非个人化观察</text><text x="795" y="395">设施/纸质总量</text><text x="1095" y="350">安全、无障碍、</text><text x="1095" y="390">权利、服务人工复核</text></g><g stroke="#23815b" stroke-width="10" fill="none"><path d="M320 385H365"/><path d="M620 385H665"/><path d="M920 385H965"/><path d="M1220 385H1370"/></g><g fill="#23815b"><path d="M365 370l30 15-30 15z"/><path d="M665 370l30 15-30 15z"/><path d="M965 370l30 15-30 15z"/><path d="M1370 370l30 15-30 15z"/></g><g fill="#dcefd7" stroke="#23815b" stroke-width="3"><rect x="1300" y="255" width="240" height="260" rx="18"/></g><g font-size="28" fill="#173f4f"><text x="1420" y="325">人工决定</text><text x="1420" y="375">保留</text><text x="1420" y="420">调整</text><text x="1420" y="465">撤除/暂停</text></g></g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#405450"><text x="90" y="600">T-01 步行与导视：连续替代路径 + 纸质导视 + 无障碍专员走查</text><text x="90" y="655">T-02 公共咨询与反馈：人工柜台 + 纸质受理 + 具名结案责任人</text><text x="90" y="710">T-03 可撤除构件与维护：净空 + 维护主体 + 开场/运行/撤场记录</text><text x="90" y="790">空间锚点、责任、条件和退出规则：visual/assets/implementation_spatial_register.json（临时概念数据，非工程或审批依据）</text></g>
