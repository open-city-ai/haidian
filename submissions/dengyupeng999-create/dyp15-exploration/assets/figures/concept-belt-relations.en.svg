small" text-anchor="start" fill="#D17824">Dazhongsi ≈0.720 km²</text><text x="1268" y="765" class="small" text-anchor="start" fill="#A95049"><tspan x="1268" dy="0">Halos/inset are not boundaries.</tspan><tspan x="1268" dy="20">No parcels, roads, buildings,</tspan><tspan x="1268" dy="20">demolition or metrics are derived.</tspan></text><text x="1268" y="865" class="body" text-anchor="start"><tspan x="1268" dy="0">ORDINARY CITY = persistent</tspan><tspan x="1268" dy="25">AI TEST / ADOPTION = optional</tspan><tspan x="1268" dy="25">not transport infrastructure</tspan></text><text x="1535" y="975" class="small" text-anchor="end">study only / not official planning geometry</text></svg>
