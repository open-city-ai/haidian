7A69" stroke-width="3" stroke-dasharray=""/><text x="1180" y="335" class="label" text-anchor="middle">commerce</text><ellipse cx="1380" cy="300" rx="72" ry="48" fill="#DDECE5" fill-opacity="0.88" stroke="#287A69" stroke-width="3" stroke-dasharray=""/><text x="1380" y="305" class="label" text-anchor="middle">culture</text><ellipse cx="1420" cy="520" rx="72" ry="48" fill="#DDECE5" fill-opacity="0.88" stroke="#287A69" stroke-width="3" stroke-dasharray=""/><text x="1420" y="525" class="label" text-anchor="middle">transit</text><ellipse cx="1225" cy="565" rx="72" ry="48" fill="#DDECE5" fill-opacity="0.88" stroke="#287A69" stroke-width="3" stroke-dasharray=""/><text x="1225" y="570" class="label" text-anchor="middle">human service</text><ellipse cx="1325" cy="705" rx="88" ry="48" fill="#DDECE5" fill-opacity="0.88" stroke="#287A69" stroke-width="3" stroke-dasharray=""/><text x="1325" y="710" class="label" text-anchor="middle">rest / community</text><polyline points="1225.0,565.0 1155.0,735.0" fill="none" stroke="#D17824" stroke-width="3" stroke-dasharray="2 8" opacity="1.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-orange)"/><ellipse cx="1155" cy="735" rx="65" ry="40" fill="#F6E5D0" fill-opacity="1.0" stroke="#D17824" stroke-width="2" stroke-dasharray="2 8"/><text x="1155" y="740" class="label" text-anchor="middle">optional AI</text><polyline points="1155.0,735.0 1135.0,835.0" fill="none" stroke="#D17824" stroke-width="2.5" stroke-dasharray="2 8" opacity="1.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-orange)"/><rect x="1077" y="804" width="116" height="62" rx="12" fill="#F5ECE5" stroke="#17324D" stroke-width="2" stroke-dasharray="2 8"/><text x="1135.0" y="831.0" class="label" text-anchor="middle"><tspan x="1135.0" dy="0">maintenance</tspan><tspan x="1135.0" dy="20">/ exit</tspan></text><polyline points="1490.0,620.0 1450.0,600.0 1415.0,570.0" fill="none" stroke="#287A69" stroke-width="3" stroke-dasharray="" opacity="1.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><text x="1220" y="830" class="small" text-anchor="start" fill="#5D7082"><tspan x="1220" dy="0">ordinary network remains complete without AI</tspan><tspan x="1220" dy="18">AI is a branch; maintenance / exit stays behind it</tspan></text><text x="65" y="950" class="small" text-anchor="start">Evidence: solid Known | thin solid Existing use known | dashed Strong proxy | dotted Candidate only</text><text x="1535" y="950" class="small" text-anchor="end">study only / not official planning geometry</text></svg>
