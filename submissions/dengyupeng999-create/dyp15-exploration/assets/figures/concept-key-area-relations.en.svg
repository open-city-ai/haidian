<text x="65" y="52" class="title" text-anchor="start">Diagram B | Three areas, three different spatial relations — not a pipeline</text><text x="65" y="82" class="body" text-anchor="start" fill="#5D7082">AI Origin = permeability | Zhongzhiyuan = controlled gradient | Dazhongsi = ordinary network + optional AI</text><rect x="45" y="112" width="480" height="805" rx="22" fill="#FFFFFF" stroke="#2D67B7" stroke-width="3"/><text x="69" y="153" class="h2" text-anchor="start">AI Origin | permeability</text><rect x="550" y="112" width="480" height="805" rx="22" fill="#FFFFFF" stroke="#7055A3" stroke-width="3"/><text x="574" y="153" class="h2" text-anchor="start">Zhongzhiyuan | controlled gradient</text><rect x="1055" y="112" width="480" height="805" rx="22" fill="#FFFFFF" stroke="#D17824" stroke-width="3"/><text x="1079" y="153" class="h2" text-anchor="start">Dazhongsi | ordinary network + optional AI</text><ellipse cx="285" cy="525" rx="205" ry="295" fill="#DDECE5" fill-opacity="0.72" stroke="#287A69" stroke-width="3" stroke-dasharray=""/><text x="285" y="220" class="label" text-anchor="middle" fill="#287A69">ordinary life surrounds the interface</text><ellipse cx="285" cy="520" rx="150" ry="190" fill="#DCE8F5" fill-opacity="0.62" stroke="#2D67B7" stroke-width="2" stroke-dasharray="10 6"/><text x="285" y="370" class="label" text-anchor="middle">public edge</text><ellipse cx="285" cy="520" rx="92" ry="108" fill="#FFFFFF" fill-opacity="1.0" stroke="#2D67B7" stroke-width="2" stroke-dasharray=""/><text x="285" y="500" class="label" text-anchor="middle"><tspan x="285" dy="0">visible</tspan><tspan x="285" dy="22">innovation</tspan></text><rect x="323" y="665" width="158" height="92" rx="16" fill="#E7ECF2" stroke="#17324D" stroke-width="2" stroke-dasharray=""/><text x="402.0" y="707.0" class="label" text-anchor="middle"><tspan x="402.0" dy="0">controlled</tspan><tspan x="402.0" dy="20">project work</tspan></text><rect x="398" y="785" width="92" height="62" rx="12" fill="#F5ECE5" stroke="#17324D" stroke-width="2" stroke-dasharray="2 8"/><text x="444.0" y="812.0" class="label" text-anchor="middle"><tspan x="444.0" dy="0">service rear</tspan><tspan x="444.0" dy="20">need</tspan></text><polyline points="90.0,480.0 170.0,500.0 220.0,515.0" fill="none" stroke="#287A69" stroke-width="3" stroke-dasharray="" opacity="0.82" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><polyline points="120.0,660.0 190.0,600.0 225.0,555.0" fill="none" stroke="#287A69" stroke-width="3" stroke-dasharray="" opacity="0.82" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><polyline points="445.0,400.0 365.0,445.0 330.0,485.0" fill="none" stroke="#287A69" stroke-width="3" stroke-dasharray="" opacity="0.82" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><polyline points="160.0,300.0 220.0,400.0 250.0,455.0" fill="none" stroke="#287A69" stroke-width="3" stroke-dasharray="" opacity="0.82" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-green)"/><polyline points="360.0,610.0 392.0,650.0 405.0,684.0" fill="none" stroke="#2D67B7" stroke-width="2.5" stroke-dasharray="9 6" opacity="1.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><line x1="340" y1="642" x2="470" y2="642" stroke="#A95049" stroke-width="2" stroke-dasharray="6 6"/><text x="405" y="630" class="small" text-anchor="middle" fill="#A95049">controlled threshold</text><text x="78" y="860" class="small" text-anchor="start" fill="#5D7082"><tspan x="78" dy="0">open work / service / display types are evidenced</tspan><tspan x="78" dy="18">exact rooms and back-of-house remain unknown</tspan></text><rect x="590" y="205" width="400" height="620" rx="105" fill="#DDECE5" stroke="#287A69" stroke-width="3"/><text x="790" y="235" class="label" text-anchor="middle" fill="#287A69">urban / ecological edge</text><path d="M 605,340 Q 650,290 705,315 L 705,715 Q 650,742 605,690 Z" fill="#DCE8F5" stroke="