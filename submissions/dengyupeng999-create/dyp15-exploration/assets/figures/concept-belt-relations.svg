<text x="65" y="52" class="title" text-anchor="start">图 A｜京张普通城市底板上的多向创新关系</text><text x="65" y="82" class="body" text-anchor="start" fill="#5D7082">普通城市结构为主；AI关系为可选叠加。所有线均为研究表达，不是道路、管线或实施计划。</text><rect x="50" y="105" width="1170" height="900" rx="18" fill="#FFFFFF" stroke="#D5DCE1"/><ellipse cx="140.60765957466947" cy="491.66955128205166" rx="105" ry="64" fill="#EEE8D7" opacity="0.85"/><ellipse cx="486.5542127659031" cy="487.54807692306167" rx="92" ry="58" fill="#EEE8D7" opacity="0.85"/><text x="62.60765957466947" y="445.66955128205166" class="small" text-anchor="start" fill="#746A55">校园 / 教育环境</text><path d="M 388.4,485.2 C 426.4,540.2 413.3,617.9 445.3,687.9" fill="none" stroke="#6FA68E" stroke-width="54" opacity="0.26" stroke-linecap="round"/><path d="M 388.4,485.2 C 426.4,540.2 413.3,617.9 445.3,687.9" fill="none" stroke="#287A69" stroke-width="4" opacity="0.82" stroke-dasharray="13 8"/><text x="447.88868085115377" y="561.0201282051322" class="small" text-anchor="start" fill="#287A69"><tspan x="447.88868085115377" dy="0">京张普通公共空间底板</tspan><tspan x="447.88868085115377" dy="18">步行 / 休闲 / 生态 / 文化</tspan><tspan x="447.88868085115377" dy="18">已知锚点 + 示意连续关系</tspan></text><polyline points="140.6,491.7 301.0,561.4 398.4,540.2" fill="none" stroke="#C9C0B2" stroke-width="7" stroke-dasharray="" opacity="0.47" stroke-linecap="round" stroke-linejoin="round"/><polyline points="140.6,491.7 301.0,561.4 398.4,540.2" fill="none" stroke="#AAA193" stroke-width="1.3" stroke-dasharray="" opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/><polyline points="486.6,487.5 398.4,540.2" fill="none" stroke="#C9C0B2" stroke-width="7" stroke-dasharray="" opacity="0.47" stroke-linecap="round" stroke-linejoin="round"/><polyline points="486.6,487.5 398.4,540.2" fill="none" stroke="#AAA193" stroke-width="1.3" stroke-dasharray="" opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/><polyline points="398.4,540.2 437.3,617.9 397.3,733.3" fill="none" stroke="#C9C0B2" stroke-wid