271.7 961.8,331.7" fill="none" stroke="#77AFC5" stroke-width="2" stroke-dasharray="8 7"/><text x="651.8085106384276" y="291.7115384615298" class="small" text-anchor="start" fill="#4E849A">清河 / 小月河环境（示意）</text><ellipse cx="309.4" cy="513.6" rx="185" ry="95" fill="#DCE8F5" fill-opacity="0.16" stroke="#2D67B7" stroke-width="1.5" stroke-dasharray="10 7"/><text x="309.3845106383779" y="435.5529700854636" class="small" text-anchor="middle" fill="#2D67B7">面向高校的创新边缘｜关系场</text><ellipse cx="484.6" cy="738.4" rx="145" ry="86" fill="#DDECE5" fill-opacity="0.20" stroke="#287A69" stroke-width="1.5" stroke-dasharray="10 7"/><text x="484.6353191489347" y="812.3572435897631" class="small" text-anchor="middle" fill="#287A69">普通商业 / 文化 / 交通界面</text><ellipse cx="796.8" cy="389.7" rx="118" ry="88" fill="#E9E2F2" fill-opacity="0.12" stroke="#7055A3" stroke-width="1.5" stroke-dasharray="10 7"/><text x="796.8085106384276" y="467.7115384615298" class="small" text-anchor="middle" fill="#7055A3">受控创新场｜近似证据</text><text x="210" y="835" class="small" text-anchor="start" fill="#756E63">普通城市生活 / 居住环境｜示意</text><ellipse cx="300.99165957456114" cy="561.4412820512773" rx="82" ry="62" fill="#2D67B7" fill-opacity="0.045" stroke="#2D67B7" stroke-width="1.5" stroke-dasharray="3 8"/><ellipse cx="796.8085106384276" cy="389.7115384615298" rx="92" ry="68" fill="#7055A3" fill-opacity="0.045" stroke="#7055A3" stroke-width="1.5" stroke-dasharray="3 8"/><ellipse cx="542.5661276596594" cy="746.8187820512946" rx="100" ry="68" fill="#D17824" fill-opacity="0.045" stroke="#D17824" stroke-width="1.5" stroke-dasharray="3 8"/><text x="85" y="930" class="small" text-anchor="start" fill="#A95049">淡色光晕 = 临时研究环境 / 不是边界</text><circle cx="140.60765957466947" cy="491.66955128205166" r="7" fill="#F5EDDA" class="use"/><text x="128.60765957466947" y="479.66955128205166" class="small" text-anchor="end">清华</text><circle cx="486.5542127659031" cy="487.54807692306167" r="7" fill="#F5EDDA" class="use"/><text x="498.5542127659031" y="477.54807692306167" class="small" text-anchor="start">北林</text><circle cx="300.99165957456114" cy="561.4412820512773" r="9" fill="#FFFFFF" class="use"/><text x="288.99165957456114" y="585.4412820512773" class="small" text-anchor="end">AI原点 / 东升大厦</text><circle cx="701.1462127660182" cy="394.57198717951235" r="7" fill="#FFFFFF" class="known"/><text x="713.1462127660182" y="384.57198717951235" class="small" text-anchor="start">东升园地图锚点</text><circle cx="1131.7480851064809" cy="524.1449358974221" r="7" fill="#FFFFFF" class="known"/><text x="1121.7480851064809" y="514.1449358974221" class="small" text-anchor="end">604地图锚点</text><circle cx="398.42927659582676" cy="540.1668589743467" r="7" fill="#DDECE5" class="use"/><text x="386.42927659582676" y="530.1668589743467" class="small" text-anchor="end">京张公园锚点</text><circle cx="437.34808510648077" cy="617.8733974359177" r="7" fill="#DDECE5" class="use"/><text x="425.34808510648077" y="640.8733974359177" class="small" text-anchor="end">京张公园锚点</text><circle cx="397.31165957452725" cy="733.3303846153923" r="7" fill="#FFF5DE" class="use"/><text x="385.31165957452725" y="721.3303846153923" class="small" text-anchor="end">古钟博物馆</text><circle cx="542.5661276596594" cy="746.8187820512946" r="8" fill="#DCE8F5" class="use"/><text x="554.5661276596594" y="770.8187820512946" class="small" text-anchor="start">大钟寺站</text><circle cx="533.3678297871755" cy="732.7197435897798" r="7" fill="#FFF5DE" class="use"/><text x="545.3678297871755" y="720.7197435897798" class="small" text-anchor="start">蓝景丽家</text><circle cx="465.29565957437654" cy="740.560064102586" r="7" fill="#FFF5DE" class="use"/><text x="453.29565957437654" y="764.560064102586" class="small" text-anchor="end">方恒广场</text><polyline points="140.6,491.7 301.0,561.4 321.0,619.4 542.6,746.8" fill="none" stroke="#2D67B7" stroke-width="3" stroke-dasharray="11 7" opacity="0.92" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><polyline points="306.0,556.4 796.8,389.7 554.6,743.8" fill="none" stroke="#D17824" stroke-width="3" stroke-dasharray="7 6" opacity="0.92" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-orange)"/><polyline points="788.8,397.7 731.8,534.7 533.6,749.8" fill="none" stroke="#7055A3" stroke-width="3" stroke-dasharray="2 8" opacity="0.92" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-purple)"/><polyline points="534.6,760.8 279.0,631.4 301.0,561.4" fill="none" stroke="#A95049" stroke-width="2.5" stroke-dasharray="13 7" opacity="0.86" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/><text x="775" y="225" class="small" text-anchor="start" fill="#2D67B7"><tspan x="775" dy="0">软件 / 模型</tspan><tspan x="775" dy="18">空间负担较轻</tspan><tspan x="775" dy="18">有限服务 ↔ 人工反馈</tspan></text><text x="875" y="438" class="small" text-anchor="start" fill="#D17824"><tspan x="875" dy="0">智能终端</tspan><tspan x="875" dy="18">安装 / 供电 / 维护 / 撤出</tspan></text><text x="665" y="595" class="small" text-anchor="start" fill="#7055A3"><tspan x="665" dy="0">具身 AI（候选）</tspan><tspan x="665" dy="18">受控验证 / 人工接管 / 回收</tspan></text><text x="575" y="765" class="small" text-anchor="start" fill="#A95049">反馈返回｜责任复核 → 修改</text><rect x="1240" y="105" width="320" height="900" rx="18" fill="#FFFFFF" stroke="#D5DCE1"/><text x="1268" y="150" class="h2" text-anchor="start">读图优先级</text><text x="1268" y="183" class="body" text-anchor="start"><tspan x="1268" dy="0">1  普通城市 / 公共生活</tspan><tspan x="1268" dy="26">2  已知锚点</tspan><tspan x="1268" dy="26">3  可选 AI 关系</tspan><tspan x="1268" dy="26">4  仅供研究的环境</tspan></text><text x="1268" y="310" class="h2" text-anchor="start">证据线型</text><line x1="1268" y1="346" x2="1355" y2="346" stroke="#17324D" stroke-width="3" stroke-dasharray=""/><text x="1373" y="351" class="small" text-anchor="start">已知存在</text><line x1="1268" y1="382" x2="1355" y2="382" stroke="#17324D" stroke-width="2" stroke-dasharray=""/><text x="1373" y="387" class="small" text-anchor="start">已知用途</text><line x1="1268" y1="418" x2="1355" y2="418" stroke="#17324D" stroke-width="2" stroke-dasharray="11 7"/><text x="1373" y="423" class="small" text-anchor="start">强近似证据</text><line x1="1268" y1="454" x2="1355" y2="454" stroke="#17324D" stroke-width="2" stroke-dasharray="2 8"/><text x="1373" y="459" class="small" text-anchor="start">仅候选</text><text x="1268" y="505" class="h2" text-anchor="start">技术插图｜仅临时研究</text><line x1="1308" y1="545" x2="1308" y2="725" stroke="#98A5B1" stroke-width="2" stroke-dasharray="5 7"/><ellipse cx="1308" cy="570" rx="24" ry="17" fill="#7055A3" fill-opacity="0.08" stroke="#7055A3" stroke-dasharray="3 6"/><text x="1345" y="575" class="small" text-anchor="start" fill="#7055A3">众智园 ≈1.921 km²</text><ellipse cx="1308" cy="625" rx="24" ry="17" fill="#2D67B7" fill-opacity="0.08" stroke="#2D67B7" stroke-dasharray="3 6"/><text x="1345" y="630" class="small" text-anchor="start" fill="#2D67B7">AI原点 ≈1.043 km²</text><ellipse cx="1308" cy="690" rx="24" ry="17" fill="#D17824" fill-opacity="0.08" stroke="#D17824" stroke-dasharray="3 6"/><text x="1345" y="695" class="small" text-anchor="start" fill="#D17824">大钟寺 ≈0.720 km²</text><text x="1268" y="765" class="small" text-anchor="start" fill="#A95049"><tspan x="1268" dy="0">光晕 / 插图不是边界。</tspan><tspan x="1268" dy="20">不由此推导地块、道路、建筑、</tspan><tspan x="1268" dy="20">拆除或指标。</tspan></text><text x="1268" y="865" class="body" text-anchor="start"><tspan x="1268" dy="0">普通城市 = 持久底板</tspan><tspan x="1268" dy="25">AI 测试 / 采用 = 可选</tspan><tspan x="1268" dy="25">非交通基础设施关系线</tspan></text><text x="1535" y="975" class="small" text-anchor="end">study only / not official planning geometry</text></svg>
