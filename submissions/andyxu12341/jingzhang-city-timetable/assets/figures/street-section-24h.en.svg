<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="90" y="90" font-size="48" font-weight="700">24H REVERSIBLE STREET SECTION</text><text x="90" y="140" font-size="25" fill="#555">The section changes; T0 continuity does not.</text></g><line x1="90" y1="175" x2="1510" y2="175" stroke="#111" stroke-width="2"/><g font-family="Arial,sans-serif"><g transform="translate(90,230)"><text x="0" y="0" font-size="28" font-weight="700">07:30 · T1 COMMUTE</text><text x="0" y="36" font-size="20" fill="#666">people first · machine activity restricted</text><rect x="0" y="70" width="330" height="260" rx="18" fill="#f6f6f6" stroke="#111"/><rect x="25" y="220" width="280" height="50" fill="#fff" stroke="#111"/><text x="55" y="252" font-size="19">T0 accessible / emergency lane</text><text x="25" y="310" font-size="18" fill="#555">commute / school / basic access</text></g><g transform="translate(465,230)"><text x="0" y="0" font-size="28" font-weight="700">11:00 · T2 BOUNDED USE</text><text x="0" y="36" font-size="20" fill="#666">controlled window · T0 protected</text><rect x="0" y="70" width="330" height="260" rx="18" fill="#f6f6f6" stroke="#111"/><rect x="25" y="220" width="280" height="50" fill="#fff" stroke="#111"/><text x="55" y="252" font-size="19">T0 accessible / emergency lane</text><text x="25" y="310" font-size="18" fill="#555">flex zone only</text></g><g transform="translate(840,230)"><text x="0" y="0" font-size="28" font-weight="700">19:30 · T2/T3 ACTIVITY</text><text x="0" y="36" font-size="20" fill="#666">youth / community / Demo Night</text><rect x="0" y="70" width="330" height="260" rx="18" fill="#f6f6f6" stroke="#111"/><rect x="25" y="220" width="280" height="50" fill="#fff" stroke="#111"/><text x="55" y="252" font-size="19">T0 accessible / emergency lane</text><text x="25" y="310" font-size="18" fill="#555">human confirmation for T3</text></g><g transform="translate(1215,230)"><text x="0" y="0" font-size="28" font-weight="700">23:00 · QUIET</text><text x="0" y="36" font-size="20" fill="#666">essential access + low-noise fallback</text><rect x="0" y="70" width="300" height="260" rx="18" fill="#111"/><rect x="25" y="220" width="250" height="50" fill="#fff"/><text x="45" y="252" font-size="18">T0 remains continuously open</text><text x="25" y="310" font-size="18" fill="#fff">quiet / resident rights / emergency</text></g></g><line x1="90" y1="650" x2="1510" y2="650" stroke="#111" stroke-width="2"/><text x="90" y="710" font-family="Arial,sans-serif" font-size="29" font-weight="700">THE DESIGN OBJECT IS A SECTION + SCHEDULE + RIGHTS CONTRACT.</text><text x="90" y="760" font-family="Arial,sans-serif" font-size="22" fill="#555">Stop: T0 continuity breaks, abnormal crowding, system degradation, or named human stop request.</text><text x="90" y="805" font-family="Arial,sans-serif" font-size="22" fill="#555">Rollback: remove machine/event state → restore T0/T1 → log → human review before restart.</text></svg>