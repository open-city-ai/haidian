<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><g font-family="Arial,sans-serif" fill="#111"><text x="100" y="115" font-size="64" font-weight="700">JINGZHANG TIME RIGHTS</text><text x="100" y="175" font-size="30" fill="#555">From spatial use rights to temporal use rights</text><text x="100" y="235" font-size="24" fill="#555">THE CITY TIMETABLE = a public, auditable and reversible space × time operating contract</text></g><line x1="100" y1="280" x2="1500" y2="280" stroke="#111" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="110" y="355" font-size="28" font-weight="700">SPATIAL RIGHT</text><text x="110" y="395" font-size="22" fill="#666">Who may use this place?</text><rect x="100" y="430" width="360" height="240" rx="20" fill="#f5f5f5" stroke="#111"/><text x="145" y="500" font-size="22">street / square / park</text><text x="145" y="565" font-size="20">people + robots</text><text x="620" y="355" font-size="28" font-weight="700">TEMPORAL RIGHT</text><text x="620" y="395" font-size="22" fill="#666">When, with what priority and stop rule?</text><rect x="610" y="430" width="380" height="240" rx="20" fill="#f5f5f5" stroke="#111"/><text x="650" y="485" font-size="20">07:30 T1 · people first</text><text x="650" y="535" font-size="20">11:00 T2 · bounded use</text><text x="650" y="585" font-size="20">19:30 T2/T3 · youth / event</text><text x="650" y="635" font-size="20">23:00 T0/T1 · quiet + access</text><text x="1140" y="355" font-size="28" font-weight="700">PUBLIC GUARANTEE</text><text x="1140" y="395" font-size="22" fill="#666">AI may schedule; it cannot erase rights.</text><rect x="1130" y="430" width="370" height="240" rx="20" fill="#111"/><text x="1170" y="490" font-size="23" font-weight="700" fill="#fff">T0 CONSTANT RIGHTS</text><text x="1170" y="540" font-size="20" fill="#fff">accessible continuous route</text><text x="1170" y="580" font-size="20" fill="#fff">emergency passage</text><text x="1170" y="620" font-size="20" fill="#fff">basic walking + non-AI service</text></g><line x1="100" y1="745" x2="1500" y2="745" stroke="#111" stroke-width="2"/><text x="100" y="805" font-family="Arial,sans-serif" font-size="30" font-weight="700">SPACE × TIME × RIGHTS × HUMAN ACCOUNTABILITY</text><text x="100" y="850" font-family="Arial,sans-serif" font-size="22" fill="#555">A planning framework for mixed human–robot public space, not autonomous operating permission.</text></svg>