<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#111111">
    <text x="90" y="90" font-size="48" font-weight="700">THREE KEY AREAS × 24H TIMETABLE</text>
    <text x="90" y="140" font-size="25" fill="#555555">三重点区时序矩阵 · same rights grammar, different urban problems</text>
  </g>
  <line x1="90" y1="175" x2="1510" y2="175" stroke="#111111" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <text x="360" y="240" font-size="22" font-weight="700">07:30</text>
    <text x="635" y="240" font-size="22" font-weight="700">11:00</text>
    <text x="910" y="240" font-size="22" font-weight="700">19:30</text>
    <text x="1185" y="240" font-size="22" font-weight="700">23:00</text>
    <text x="1420" y="240" font-size="20" font-weight="700">T0</text>

    <text x="95" y="335" font-size="25" font-weight="700">众智园</text>
    <text x="95" y="368" font-size="18" fill="#666666">AI test field</text>
    <text x="95" y="455" font-size="25" font-weight="700">AI 原点社区</text>
    <text x="95" y="488" font-size="18" fill="#666666">24h co-creation</text>
    <text x="95" y="575" font-size="25" font-weight="700">大钟寺</text>
    <text x="95" y="608" font-size="18" fill="#666666">station-city life</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" fill="#111111">
    <!-- row 1 -->
    <rect x="310" y="285" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="340" y="320">people / staff arrival</text><text x="340" y="350">machine tests paused</text>
    <rect x="585" y="285" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="615" y="320">controlled robot test</text><text x="615" y="350">logged + observable</text>
    <rect x="860" y="285" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="890" y="320">public demo window</text><text x="890" y="350">human supervisor</text>
    <rect x="1135" y="285" width="245" height="90" rx="14" fill="#111111"/><text x="1165" y="320" fill="#ffffff">quiet / maintenance</text><text x="1165" y="350" fill="#ffffff">fallback baseline</text>
    <rect x="1415" y="285" width="100" height="90" rx="14" fill="#ffffff" stroke="#111111"/><text x="1440" y="325">always</text><text x="1435" y="350">open</text>

    <!-- row 2 -->
    <rect x="310" y="405" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="340" y="440">school / commute</text><text x="340" y="470">resident access first</text>
    <rect x="585" y="405" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="615" y="440">learning / service</text><text x="615" y="470">non-App route equal</text>
    <rect x="860" y="405" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="890" y="440">Demo Night / study</text><text x="890" y="470">noise threshold applies</text>
    <rect x="1135" y="405" width="245" height="90" rx="14" fill="#111111"/><text x="1165" y="440" fill="#ffffff">resident quiet</text><text x="1165" y="470" fill="#ffffff">essential service only</text>
    <rect x="1415" y="405" width="100" height="90" rx="14" fill="#ffffff" stroke="#111111"/><text x="1440" y="445">always</text><text x="1435" y="470">open</text>

    <!-- row 3 -->
    <rect x="310" y="525" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="340" y="560">station peak</text><text x="340" y="590">people-flow priority</text>
    <rect x="585" y="525" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="615" y="560">off-peak replenishment</text><text x="615" y="590">controlled logistics</text>
    <rect x="860" y="525" width="245" height="90" rx="14" fill="#f5f5f5" stroke="#111111"/><text x="890" y="560">culture + consumption</text><text x="890" y="590">crowd-triggered exit</text>
    <rect x="1135" y="525" width="245" height="90" rx="14" fill="#111111"/><text x="1165" y="560" fill="#ffffff">quiet logistics only</text><text x="1165" y="590" fill="#ffffff">T0/T1 baseline</text>
    <rect x="1415" y="525" width="100" height="90" rx="14" fill="#ffffff" stroke="#111111"/><text x="1440" y="565">always</text><text x="1435" y="590">open</text>
  </g>

  <line x1="90" y1="690" x2="1510" y2="690" stroke="#111111" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#111111">
    <text x="90" y="745" font-size="28" font-weight="700">DIFFERENT PROGRAMS, SAME PUBLIC-RIGHTS LOGIC</text>
    <text x="90" y="792" font-size="22" fill="#555555">Zhongzhiyuan tests safety; AI Origin tests 24h co-creation versus resident rights; Dazhongsi tests peak/off-peak station-city sharing.</text>
    <text x="90" y="835" font-size="21" fill="#555555">T0 accessibility, emergency passage and basic non-digital service remain non-negotiable in every cell.</text>
  </g>
</svg>
