<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#111111">
    <text x="90" y="90" font-size="48" font-weight="700">24H REVERSIBLE STREET SECTION</text>
    <text x="90" y="140" font-size="25" fill="#555555">24小时可逆街道剖面 · the section changes, T0 continuity does not</text>
  </g>
  <line x1="90" y1="175" x2="1510" y2="175" stroke="#111111" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(90,230)">
      <text x="0" y="0" font-size="28" font-weight="700">07:30 · T1 COMMUTE</text>
      <text x="0" y="36" font-size="20" fill="#666666">people first · machine activity restricted</text>
      <rect x="0" y="70" width="330" height="260" rx="18" fill="#f6f6f6" stroke="#111111"/>
      <rect x="25" y="220" width="280" height="50" fill="#ffffff" stroke="#111111"/>
      <text x="55" y="252" font-size="19">T0 accessible / emergency lane</text>
      <line x1="45" y1="165" x2="285" y2="165" stroke="#111111" stroke-width="5"/>
      <circle cx="95" cy="135" r="18" fill="#111111"/><line x1="95" y1="153" x2="95" y2="195" stroke="#111111" stroke-width="5"/><line x1="95" y1="170" x2="65" y2="190" stroke="#111111" stroke-width="5"/><line x1="95" y1="170" x2="125" y2="190" stroke="#111111" stroke-width="5"/>
      <circle cx="205" cy="135" r="18" fill="#111111"/><line x1="205" y1="153" x2="205" y2="195" stroke="#111111" stroke-width="5"/>
      <text x="25" y="310" font-size="18" fill="#555555">commute / school / basic access</text>
    </g>

    <g transform="translate(465,230)">
      <text x="0" y="0" font-size="28" font-weight="700">11:00 · T2 DELIVERY</text>
      <text x="0" y="36" font-size="20" fill="#666666">controlled robot window · T0 protected</text>
      <rect x="0" y="70" width="330" height="260" rx="18" fill="#f6f6f6" stroke="#111111"/>
      <rect x="25" y="220" width="280" height="50" fill="#ffffff" stroke="#111111"/>
      <text x="55" y="252" font-size="19">T0 accessible / emergency lane</text>
      <rect x="75" y="135" width="70" height="48" rx="8" fill="#111111"/><circle cx="92" cy="190" r="10" fill="#111111"/><circle cx="130" cy="190" r="10" fill="#111111"/>
      <circle cx="230" cy="140" r="18" fill="#111111"/><line x1="230" y1="158" x2="230" y2="197" stroke="#111111" stroke-width="5"/>
      <text x="25" y="310" font-size="18" fill="#555555">delivery uses flex zone only</text>
    </g>

    <g transform="translate(840,230)">
      <text x="0" y="0" font-size="28" font-weight="700">19:30 · T3 EVENT</text>
      <text x="0" y="36" font-size="20" fill="#666666">Demo Night / youth public living room</text>
      <rect x="0" y="70" width="330" height="260" rx="18" fill="#f6f6f6" stroke="#111111"/>
      <rect x="25" y="220" width="280" height="50" fill="#ffffff" stroke="#111111"/>
      <text x="55" y="252" font-size="19">T0 accessible / emergency lane</text>
      <rect x="70" y="130" width="190" height="70" rx="12" fill="#ffffff" stroke="#111111"/>
      <text x="115" y="172" font-size="21" font-weight="700">EVENT ZONE</text>
      <text x="25" y="310" font-size="18" fill="#555555">human confirmation required</text>
    </g>

    <g transform="translate(1215,230)">
      <text x="0" y="0" font-size="28" font-weight="700">23:00 · QUIET</text>
      <text x="0" y="36" font-size="20" fill="#666666">essential access + low-noise fallback</text>
      <rect x="0" y="70" width="300" height="260" rx="18" fill="#111111"/>
      <rect x="25" y="220" width="250" height="50" fill="#ffffff" stroke="#ffffff"/>
      <text x="45" y="252" font-size="18" fill="#111111">T0 remains continuously open</text>
      <circle cx="150" cy="150" r="42" fill="#ffffff"/>
      <circle cx="170" cy="135" r="42" fill="#111111"/>
      <text x="25" y="310" font-size="18" fill="#ffffff">quiet / resident rights / emergency</text>
    </g>
  </g>

  <line x1="90" y1="650" x2="1510" y2="650" stroke="#111111" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#111111">
    <text x="90" y="710" font-size="29" font-weight="700">THE DESIGN OBJECT IS NOT ONE SECTION — IT IS A SECTION + SCHEDULE + RIGHTS CONTRACT.</text>
    <text x="90" y="760" font-size="22" fill="#555555">Stop condition: accessible/emergency continuity breaks, abnormal crowding, sensor/communications degradation, or named human stop request.</text>
    <text x="90" y="805" font-size="22" fill="#555555">Rollback: remove machine/event state → restore T0/T1 baseline → log event → human review before restart.</text>
  </g>
</svg>
