<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="90" y="90" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111111">TIME RIGHTS · PROOF-OF-METHOD</text>
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="23" fill="#555555">12 nodes × 96 time layers = 1,152 space-time states · conceptual, not field-calibrated</text>
  <line x1="90" y1="180" x2="1510" y2="180" stroke="#111111" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="245" width="430" height="390" rx="18" fill="#f7f7f7" stroke="#222222"/>
    <text x="125" y="300" font-size="25" fill="#555555">Peak human–machine conflict</text>
    <text x="125" y="390" font-size="66" font-weight="700" fill="#111111">10h → 3h</text>
    <text x="125" y="465" font-size="48" font-weight="700" fill="#111111">−70%</text>
    <text x="125" y="540" font-size="20" fill="#555555">Same machine-service volume preserved.</text>
    <text x="125" y="575" font-size="20" fill="#555555">高峰人机冲突时长</text>

    <rect x="585" y="245" width="430" height="390" rx="18" fill="#f7f7f7" stroke="#222222"/>
    <text x="620" y="300" font-size="25" fill="#555555">Reversible-space availability</text>
    <text x="620" y="390" font-size="56" font-weight="700" fill="#111111">63.0% → 88.9%</text>
    <text x="620" y="465" font-size="48" font-weight="700" fill="#111111">+25.9 pp</text>
    <text x="620" y="540" font-size="20" fill="#555555">Peak-period usable share.</text>
    <text x="620" y="575" font-size="20" fill="#555555">高峰可逆公共空间可用率</text>

    <rect x="1080" y="245" width="430" height="390" rx="18" fill="#f7f7f7" stroke="#222222"/>
    <text x="1115" y="300" font-size="25" fill="#555555">30-min temporal opportunities</text>
    <text x="1115" y="390" font-size="56" font-weight="700" fill="#111111">3.70 → 3.91</text>
    <text x="1115" y="465" font-size="48" font-weight="700" fill="#111111">+5.7%</text>
    <text x="1115" y="540" font-size="20" fill="#555555">Peak time-expanded accessibility.</text>
    <text x="1115" y="575" font-size="20" fill="#555555">30分钟高峰时序可达机会</text>
  </g>

  <line x1="90" y1="700" x2="1510" y2="700" stroke="#111111" stroke-width="2"/>
  <text x="90" y="755" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111111">CONTROL CHECK</text>
  <text x="300" y="755" font-family="Arial, sans-serif" font-size="25" fill="#333333">Machine service = 10 h/day → 10 h/day</text>
  <text x="300" y="800" font-family="Arial, sans-serif" font-size="21" fill="#555555">The improvement comes from temporal redistribution, not from reducing service.</text>
  <text x="90" y="850" font-family="Arial, sans-serif" font-size="17" fill="#666666">Claim boundary: proof-of-method only. Recompute after site-grounded OSM/official schedules and local demand evidence are assembled.</text>
</svg>
