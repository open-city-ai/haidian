<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#111111">
<text x="90" y="90" font-size="48" font-weight="700">AI 原点 × 京张一期 · TIME RIGHTS 1.0</text>
<text x="90" y="137" font-size="23" fill="#555555">首个场地实证小试｜已建公共空间，不等待大型建设</text>
<line x1="90" y1="175" x2="1510" y2="175" stroke="#111111" stroke-width="2"/>
<text x="90" y="225" font-size="20" font-weight="700">REAL SITE</text>
<rect x="90" y="250" width="430" height="135" rx="16" fill="#f5f5f5" stroke="#111111"/>
<text x="120" y="295" font-size="28" font-weight="700">2.5 km / 16.8 ha</text><text x="120" y="330" font-size="20">京张一期 · 清华东路—知春路</text><text x="120" y="360" font-size="17" fill="#666666">2023 已全面建成开放</text>
<rect x="550" y="250" width="430" height="135" rx="16" fill="#f5f5f5" stroke="#111111"/>
<text x="580" y="295" font-size="28" font-weight="700">约 3 km²</text><text x="580" y="330" font-size="20">AI 原点社区</text><text x="580" y="360" font-size="17" fill="#666666">30+ 高校科研机构 · 230+ AI 企业 · 10万+相关学生</text>
<rect x="1010" y="250" width="500" height="135" rx="16" fill="#f5f5f5" stroke="#111111"/>
<text x="1040" y="295" font-size="28" font-weight="700">WHY HERE</text><text x="1040" y="330" font-size="20">真实公共空间 × 青年 × 企业 × 高校</text><text x="1040" y="360" font-size="17" fill="#666666">先验证治理，再讨论扩建</text>
<text x="90" y="455" font-size="20" font-weight="700">PILOT LADDER</text>
<rect x="90" y="480" width="400" height="130" rx="16" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="120" y="525" font-size="28" font-weight="700">P0 · 2周</text><text x="120" y="560" font-size="20">人工基线：通行 / 无障碍 / 时段 / 投诉接口</text><text x="120" y="590" font-size="17" fill="#666666">不记录个人轨迹</text>
<path d="M510 545 H565" stroke="#111111" stroke-width="3"/><path d="M555 535 L570 545 L555 555" fill="none" stroke="#111111" stroke-width="3"/>
<rect x="590" y="480" width="400" height="130" rx="16" fill="#111111"/><text x="620" y="525" font-size="28" font-weight="700" fill="#ffffff">P1 · 4周</text><text x="620" y="560" font-size="20" fill="#ffffff">可逆时权：T1 人流优先 / T2 有界活动</text><text x="620" y="590" font-size="17" fill="#dddddd">首轮关闭 T3 大型事件</text>
<path d="M1010 545 H1065" stroke="#111111" stroke-width="3"/><path d="M1055 535 L1070 545 L1055 555" fill="none" stroke="#111111" stroke-width="3"/>
<rect x="1090" y="480" width="420" height="130" rx="16" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="1120" y="525" font-size="28" font-weight="700">P2 · 条件式</text><text x="1120" y="560" font-size="20">所有 Gate 通过才扩时段 / 节点 / 场景</text><text x="1120" y="590" font-size="17" fill="#666666">失败即回 P0</text>
<text x="90" y="680" font-size="20" font-weight="700">FIRST GATES</text>
<text x="90" y="725" font-size="22">T0 阻断分钟 = 0</text><text x="390" y="725" font-size="22">应急/无障碍阻断 = 0</text><text x="800" y="725" font-size="22">非 AI fallback 目标 = 100%</text>
<text x="90" y="775" font-size="22">T2 责任人+停止条件记录目标 = 100%</text><text x="640" y="775" font-size="22">P1 高峰冲突分钟必须与 P0 实测基线比较</text>
<line x1="90" y1="825" x2="1510" y2="825" stroke="#111111" stroke-width="2"/>
<text x="90" y="860" font-size="16" fill="#666666">所有时间窗、责任链与 KPI 均为待运营/管理主体确认的 Pilot 协议，不是已授权活动或已实现绩效。</text>
</g></svg>
