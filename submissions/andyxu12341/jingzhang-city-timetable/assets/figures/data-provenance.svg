<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#111111">DATA PROVENANCE · 数据证据分层</text>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="24" fill="#555555">What may enter the Time Rights model, and with what claim boundary</text>
  <line x1="90" y1="185" x2="1510" y2="185" stroke="#111111" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="245" width="260" height="420" rx="18" fill="#f5f5f5" stroke="#222222"/>
    <text x="120" y="295" font-size="34" font-weight="700">A · OFFICIAL</text>
    <text x="120" y="335" font-size="22">官方公开事实</text>
    <text x="120" y="390" font-size="20" fill="#444444">• planning notices</text>
    <text x="120" y="425" font-size="20" fill="#444444">• park phase facts</text>
    <text x="120" y="460" font-size="20" fill="#444444">• regulations</text>
    <text x="120" y="535" font-size="19" font-weight="700">USE</text>
    <text x="120" y="570" font-size="18">formal factual claims</text>
    <text x="120" y="605" font-size="18">within source scope</text>

    <rect x="380" y="245" width="260" height="420" rx="18" fill="#f5f5f5" stroke="#222222"/>
    <text x="410" y="295" font-size="34" font-weight="700">B · OSM</text>
    <text x="410" y="335" font-size="22">公开映射现状</text>
    <text x="410" y="390" font-size="20" fill="#444444">• roads / crossings</text>
    <text x="410" y="425" font-size="20" fill="#444444">• rail / stations</text>
    <text x="410" y="460" font-size="20" fill="#444444">• POI / hours</text>
    <text x="410" y="535" font-size="19" font-weight="700">USE</text>
    <text x="410" y="570" font-size="18">analytical baseline</text>
    <text x="410" y="605" font-size="18">not legal redline</text>

    <rect x="670" y="245" width="260" height="420" rx="18" fill="#f5f5f5" stroke="#222222"/>
    <text x="700" y="295" font-size="34" font-weight="700">C · METHOD</text>
    <text x="700" y="335" font-size="22">仓库可重跑方法</text>
    <text x="700" y="390" font-size="20" fill="#444444">• network flow</text>
    <text x="700" y="425" font-size="20" fill="#444444">• queue logic</text>
    <text x="700" y="460" font-size="20" fill="#444444">• calibration fields</text>
    <text x="700" y="535" font-size="19" font-weight="700">USE</text>
    <text x="700" y="570" font-size="18">reimplement method</text>
    <text x="700" y="605" font-size="18">do not inherit result</text>

    <rect x="960" y="245" width="260" height="420" rx="18" fill="#f5f5f5" stroke="#222222"/>
    <text x="990" y="295" font-size="34" font-weight="700">D · SYNTHETIC</text>
    <text x="990" y="335" font-size="22">合成 / 示意模拟</text>
    <text x="990" y="390" font-size="20" fill="#444444">• synthetic OD</text>
    <text x="990" y="425" font-size="20" fill="#444444">• assumed capacity</text>
    <text x="990" y="460" font-size="20" fill="#444444">• proof scenarios</text>
    <text x="990" y="535" font-size="19" font-weight="700">USE</text>
    <text x="990" y="570" font-size="18">sensitivity only</text>
    <text x="990" y="605" font-size="18">never “observed”</text>

    <rect x="1250" y="245" width="260" height="420" rx="18" fill="#f5f5f5" stroke="#222222"/>
    <text x="1280" y="295" font-size="34" font-weight="700">E · DESIGN</text>
    <text x="1280" y="335" font-size="22">他人设计推论</text>
    <text x="1280" y="390" font-size="20" fill="#444444">• design routes</text>
    <text x="1280" y="425" font-size="20" fill="#444444">• performance claims</text>
    <text x="1280" y="460" font-size="20" fill="#444444">• visual assets</text>
    <text x="1280" y="535" font-size="19" font-weight="700">USE</text>
    <text x="1280" y="570" font-size="18">comparison only</text>
    <text x="1280" y="605" font-size="18">not our baseline</text>
  </g>

  <line x1="90" y1="730" x2="1510" y2="730" stroke="#111111" stroke-width="2"/>
  <text x="90" y="785" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111111">TIME RIGHTS INPUT RULE</text>
  <text x="395" y="785" font-family="Arial, sans-serif" font-size="24" fill="#333333">A + independently reconstructed B → site baseline</text>
  <text x="395" y="825" font-family="Arial, sans-serif" font-size="24" fill="#333333">C → method; D → proof only; E → never copied as design evidence</text>
</svg>
