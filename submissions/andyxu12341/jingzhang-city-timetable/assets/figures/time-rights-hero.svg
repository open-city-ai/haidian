<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#111111">
    <text x="100" y="115" font-size="64" font-weight="700">JINGZHANG TIME RIGHTS</text>
    <text x="100" y="175" font-size="30" fill="#555555">京张时权 · 从空间使用权到时间使用权</text>
    <text x="100" y="235" font-size="24" fill="#555555">THE CITY TIMETABLE = a public, auditable and reversible space × time operating contract</text>
  </g>
  <line x1="100" y1="280" x2="1500" y2="280" stroke="#111111" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <text x="110" y="355" font-size="28" font-weight="700" fill="#111111">SPATIAL RIGHT</text>
    <text x="110" y="395" font-size="22" fill="#666666">Who may use this place?</text>
    <rect x="100" y="430" width="360" height="240" rx="20" fill="#f5f5f5" stroke="#111111"/>
    <rect x="145" y="485" width="270" height="55" rx="12" fill="#ffffff" stroke="#111111"/>
    <text x="175" y="522" font-size="22" fill="#111111">street / square / park</text>
    <rect x="145" y="565" width="115" height="55" rx="12" fill="#ffffff" stroke="#111111"/>
    <rect x="300" y="565" width="115" height="55" rx="12" fill="#ffffff" stroke="#111111"/>
    <text x="171" y="600" font-size="20" fill="#111111">people</text>
    <text x="326" y="600" font-size="20" fill="#111111">robots</text>

    <text x="620" y="355" font-size="28" font-weight="700" fill="#111111">TEMPORAL RIGHT</text>
    <text x="620" y="395" font-size="22" fill="#666666">When, with what priority and stop rule?</text>
    <rect x="610" y="430" width="380" height="240" rx="20" fill="#f5f5f5" stroke="#111111"/>
    <g font-size="20" fill="#111111">
      <text x="650" y="485">07:30  T1 · commute / people first</text>
      <text x="650" y="535">11:00  T2 · controlled delivery</text>
      <text x="650" y="585">19:30  T3 · youth / Demo Night</text>
      <text x="650" y="635">23:00  T0/T1 · quiet + essential access</text>
    </g>

    <text x="1140" y="355" font-size="28" font-weight="700" fill="#111111">PUBLIC GUARANTEE</text>
    <text x="1140" y="395" font-size="22" fill="#666666">AI may schedule; it cannot erase rights.</text>
    <rect x="1130" y="430" width="370" height="240" rx="20" fill="#111111"/>
    <g fill="#ffffff">
      <text x="1170" y="490" font-size="23" font-weight="700">T0 CONSTANT RIGHTS</text>
      <text x="1170" y="540" font-size="20">accessible continuous route</text>
      <text x="1170" y="580" font-size="20">emergency passage</text>
      <text x="1170" y="620" font-size="20">basic walking + non-AI service</text>
    </g>
  </g>

  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M475 550 L595 550"/>
    <path d="M1005 550 L1115 550"/>
  </g>
  <g fill="#111111">
    <path d="M595 550 l-16 -9 v18 z"/>
    <path d="M1115 550 l-16 -9 v18 z"/>
  </g>

  <line x1="100" y1="745" x2="1500" y2="745" stroke="#111111" stroke-width="2"/>
  <text x="100" y="805" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111111">SPACE × TIME × RIGHTS × HUMAN ACCOUNTABILITY</text>
  <text x="100" y="850" font-family="Arial, sans-serif" font-size="22" fill="#555555">A planning research framework for mixed human–robot public space, not an autonomous operating permission.</text>
</svg>
