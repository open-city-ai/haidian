<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><text x="90" y="95" font-family="Arial,sans-serif" font-size="48" font-weight="700">FROM SPACE TO SPACE × TIME</text><text x="90" y="145" font-family="Arial,sans-serif" font-size="25" fill="#555">Static network → time-expanded network · 15 min × 96 layers/day</text><line x1="90" y1="185" x2="1510" y2="185" stroke="#111" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="100" y="255" font-size="28" font-weight="700">1 · SITE BASELINE</text><rect x="90" y="285" width="310" height="300" rx="18" fill="#f6f6f6" stroke="#222"/><text x="120" y="335" font-size="23">roads / crossings</text><text x="120" y="380" font-size="23">rail / stations</text><text x="120" y="425" font-size="23">POI + opening hours</text><text x="120" y="470" font-size="23">official park facts</text><text x="120" y="535" font-size="18" fill="#555">No redline claim.</text><text x="475" y="255" font-size="28" font-weight="700">2 · TIME LAYERS</text><rect x="465" y="285" width="310" height="300" rx="18" fill="#f6f6f6" stroke="#222"/><text x="495" y="335" font-size="23">07:30 commute peak</text><text x="495" y="380" font-size="23">12:00 routine service</text><text x="495" y="425" font-size="23">19:30 youth / event</text><text x="495" y="470" font-size="23">23:00 quiet / fallback</text><text x="495" y="535" font-size="18" fill="#555">96 slices per day.</text><text x="850" y="255" font-size="28" font-weight="700">3 · TIME RIGHTS</text><rect x="840" y="285" width="310" height="300" rx="18" fill="#f6f6f6" stroke="#222"/><text x="870" y="335" font-size="23">T0 constant rights</text><text x="870" y="380" font-size="23">T1 routine rhythm</text><text x="870" y="425" font-size="23">T2 flexible booking</text><text x="870" y="470" font-size="23">T3 human-confirmed</text><text x="870" y="535" font-size="18" fill="#555">T0 cannot be overridden.</text><text x="1225" y="255" font-size="28" font-weight="700">4 · READOUT</text><rect x="1215" y="285" width="295" height="300" rx="18" fill="#f6f6f6" stroke="#222"/><text x="1245" y="335" font-size="22">Cᵢ(t) centrality</text><text x="1245" y="380" font-size="22">30-min opportunities</text><text x="1245" y="425" font-size="22">conflict minutes</text><text x="1245" y="470" font-size="22">T0 continuity</text><text x="1245" y="515" font-size="22">rollback time</text></g><line x1="90" y1="670" x2="1510" y2="670" stroke="#111" stroke-width="2"/><text x="90" y="725" font-family="Arial,sans-serif" font-size="28" font-weight="700">PROOF-OF-METHOD → SITE-GROUNDED MODEL</text><text x="90" y="775" font-family="Arial,sans-serif" font-size="23">Current proof: 12 nodes × 96 time layers = 1,152 space-time states.</text><text x="90" y="815" font-family="Arial,sans-serif" font-size="23">Upgrade: real mapped network + verified operating windows; synthetic demand stays separated.</text></svg>