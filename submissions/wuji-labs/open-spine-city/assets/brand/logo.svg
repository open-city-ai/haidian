<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <title>脉开新城 · The Open Spine — 回环脉线标</title>
  <desc>「回」字双重方环 + 贯穿脉线（京张人字形展线意象）+ 外环 24 节气刻点。WUJI-Labs 原创，AI 生成并如实标识。</desc>
  <defs>
    <style>
      .ring { fill: none; stroke: #3a4148; }
      .spine { fill: none; stroke: #1f7a8c; stroke-linecap: round; }
      .tick { stroke: #c8a45a; stroke-width: 3; stroke-linecap: round; }
      .wordmark { font-family: "Noto Serif SC", "SimSun", serif; fill: #3a4148; }
      .wordmark-en { font-family: "Georgia", serif; fill: #1f7a8c; letter-spacing: 0.22em; }
    </style>
  </defs>
  <!-- 外环 24 节气刻点（亦为道钉） -->
  <g>
    <line class="tick" x1="120" y1="8"  x2="120" y2="20"/>
    <line class="tick" x1="147" y1="12" x2="144" y2="23"/>
    <line class="tick" x1="172" y1="22" x2="166" y2="32"/>
    <line class="tick" x1="193" y1="38" x2="185" y2="46"/>
    <line class="tick" x1="208" y1="59" x2="198" y2="65"/>
    <line class="tick" x1="217" y1="83" x2="206" y2="86"/>
    <line class="tick" x1="220" y1="108" x2="208" y2="108"/>
    <line class="tick" x1="217" y1="133" x2="206" y2="130"/>
    <line class="tick" x1="208" y1="157" x2="198" y2="151"/>
    <line class="tick" x1="193" y1="178" x2="185" y2="170"/>
    <line class="tick" x1="172" y1="194" x2="166" y2="184"/>
    <line class="tick" x1="147" y1="204" x2="144" y2="193"/>
    <line class="tick" x1="120" y1="208" x2="120" y2="196"/>
    <line class="tick" x1="93"  y1="204" x2="96"  y2="193"/>
    <line class="tick" x1="68"  y1="194" x2="74"  y2="184"/>
    <line class="tick" x1="47"  y1="178" x2="55"  y2="170"/>
    <line class="tick" x1="32"  y1="157" x2="42"  y2="151"/>
    <line class="tick" x1="23"  y1="133" x2="34"  y2="130"/>
    <line class="tick" x1="20"  y1="108" x2="32"  y2="108"/>
    <line class="tick" x1="23"  y1="83"  x2="34"  y2="86"/>
    <line class="tick" x1="32"  y1="59"  x2="42"  y2="65"/>
    <line class="tick" x1="47"  y1="38"  x2="55"  y2="46"/>
    <line class="tick" x1="68"  y1="22"  x2="74"  y2="32"/>
    <line class="tick" x1="93"  y1="12"  x2="96"  y2="23"/>
  </g>
  <!-- 「回」外环（圆角方，象城郭） -->
  <rect class="ring" x="52" y="40" width="136" height="136" rx="18" stroke-width="10"/>
  <!-- 「回」内环 -->
  <rect class="ring" x="88" y="76" width="64" height="64" rx="8" stroke-width="8"/>
  <!-- 贯穿脉线：自下而上,中段人字形折返（青龙桥展线） -->
  <path class="spine" stroke-width="9"
        d="M 120 200
           L 120 156
           L 100 128
           L 140 100
           L 120 76
           L 120 16"/>
  <!-- 脉线上的三核节点 -->
  <circle cx="120" cy="156" r="6.5" fill="#c8a45a"/>
  <circle cx="120" cy="108" r="6.5" fill="#c8a45a" transform="translate(0,0)"/>
  <circle cx="120" cy="52"  r="6.5" fill="#c8a45a"/>
  <!-- 字标 -->
  <text class="wordmark" x="120" y="248" font-size="30" text-anchor="middle">脉开新城</text>
  <text class="wordmark-en" x="120" y="274" font-size="13" text-anchor="middle">THE OPEN SPINE</text>
</svg>
