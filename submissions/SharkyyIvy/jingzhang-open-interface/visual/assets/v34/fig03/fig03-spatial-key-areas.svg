<svg viewBox="0 0 2400 1500" width="2400" height="1500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FIG-03 three interfaces generate three urban forms">
  <style>
    text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:0}
    .ink{fill:#172027}.muted{fill:#52616a}.small{font-size:15px;font-weight:800}.micro{font-size:12px;font-weight:700}.label{font-size:13px;font-weight:900;fill:#40515b}.stage{font-size:20px;font-weight:900}.form{font-size:41px;font-weight:900}.line{fill:none;stroke:#172027;stroke-width:5}.hair{fill:none;stroke:#53636c;stroke-width:3}
  </style>
  <defs>
    <pattern id="fieldGrid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" fill="none" stroke="#c9d2cf" stroke-width="2"/></pattern>
    <pattern id="roomGrid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#b9d6d6" stroke-width="2"/></pattern>
    <marker id="arrowCoral" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#ef5a3c"/></marker>
    <marker id="arrowTeal" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#009aa5"/></marker>
  </defs>

  <rect width="2400" height="1500" fill="#f4f5f1"/><rect width="28" height="1500" fill="#172027"/>
  <text x="86" y="76" font-size="25" font-weight="900" fill="#ef5a3c">JZOI 90 / FIG-03 / SPATIAL KEY AREAS</text>
  <text id="title" x="86" y="178" font-size="72" font-weight="900" class="ink">三个界面，生成三种城市空间。</text>
  <text id="subtitle" x="90" y="226" font-size="24" font-weight="800" class="muted">THREE INTERFACES → THREE URBAN FORMS</text>
  <line x1="88" y1="265" x2="1688" y2="265" stroke="#172027" stroke-width="5"/>
  <text x="1740" y="82" font-size="16" font-weight="800" class="muted">CIVIC PROTOCOL MODERNISM</text>
  <text id="sequencePrimary" x="1740" y="122" font-size="28" font-weight="900" class="ink">场域 → 院落网络 → 城市客厅</text>
  <text id="sequenceSecondary" x="1740" y="160" font-size="18" font-weight="900" class="muted">FIELD → COURTYARD NETWORK → CIVIC ROOM</text>
  <text id="cautionPrimary" x="1740" y="211" font-size="15" font-weight="800" fill="#7c898e">概念设计 / 暂定几何 / 非法定依据</text>
  <text id="cautionSecondary" x="1740" y="237" font-size="13" font-weight="700" fill="#7c898e">CONCEPT / PROVISIONAL / NON-STATUTORY</text>

  <!-- ZZY: controlled field -->
  <g id="zzyPanel">
    <text x="86" y="322" class="stage" fill="#ef5a3c">01 / ZZY · VERIFY</text>
    <text id="zzyForm" x="86" y="370" class="form ink">FIELD</text>
    <text id="zzyLead" x="86" y="405" class="small muted">受控测试场：公众观察，不成为测试对象。</text>
    <rect x="74" y="438" width="690" height="650" fill="#edf0ed" stroke="#aab6b2" stroke-width="2"/>
    <text id="zzyResearch" x="100" y="468" class="label">相邻研究建筑 / ADJACENT RESEARCH</text>
    <rect x="96" y="482" width="174" height="51" fill="#cfd5d2" stroke="#53636c" stroke-width="3"/><rect x="291" y="482" width="151" height="51" fill="#cfd5d2" stroke="#53636c" stroke-width="3"/><rect x="463" y="482" width="119" height="51" fill="#cfd5d2" stroke="#53636c" stroke-width="3"/>
    <path d="M608 507H735V588M704 602H742V874H700" class="hair" stroke-width="11"/>
    <text id="zzyLogistics" x="612" y="617" class="label">物流 / 应急</text>
    <path d="M707 635V847" fill="none" stroke="#ef5a3c" stroke-width="6" marker-end="url(#arrowCoral)"/>
    <rect x="147" y="576" width="528" height="377" fill="#f5ece8" fill-opacity=".65" stroke="#ef5a3c" stroke-width="4" stroke-dasharray="14 12"/>
    <text id="zzyBuffer" x="216" y="610" class="label">安全 / 测试缓冲</text>
    <rect x="194" y="620" width="431" height="285" fill="url(#fieldGrid)" stroke="#172027" stroke-width="8"/>
    <path d="M225 666H595M225 737H595M225 808H595" stroke="#9aadaa" stroke-width="3" stroke-dasharray="11 10"/>
    <text id="zzyField" x="410" y="766" text-anchor="middle" class="label">受控测试场</text>
    <rect x="165" y="927" width="493" height="38" fill="#efd05d" stroke="#9e7c0d" stroke-width="3"/>
    <circle cx="237" cy="946" r="8" fill="#172027"/><circle cx="324" cy="946" r="8" fill="#172027"/><circle cx="411" cy="946" r="8" fill="#172027"/><circle cx="498" cy="946" r="8" fill="#172027"/><circle cx="585" cy="946" r="8" fill="#172027"/>
    <text id="zzyObserve" x="177" y="918" class="label">观察边界</text>
    <path d="M330 908V978M500 908V978" stroke="#172027" stroke-width="5"/><circle cx="415" cy="908" r="12" fill="#ef5a3c"/>
    <text id="zzyStop" x="335" y="892" class="label">物理停止 / 闸门</text>
    <rect x="355" y="966" width="119" height="55" fill="#f7ca4d" stroke="#ef5a3c" stroke-width="4"/><text id="zzyHuman" x="415" y="999" text-anchor="middle" class="label">人工复核</text>
    <path d="M96 1013H735" stroke="#009aa5" stroke-width="18"/><path d="M96 1013H735" stroke="#fff" stroke-width="3" stroke-dasharray="20 15"/>
    <text id="zzyBypass" x="514" y="998" class="label">公众绕行</text>
    <path d="M96 1072H722" stroke="#172027" stroke-width="4"/><rect x="168" y="1043" width="113" height="29" fill="#cfd5d2" stroke="#53636c" stroke-width="2"/><rect x="296" y="1033" width="26" height="39" fill="#efd05d" stroke="#9e7c0d" stroke-width="2"/><rect x="340" y="1025" width="147" height="47" fill="#cfd5d2" stroke="#53636c" stroke-width="2"/><rect x="503" y="1026" width="31" height="46" fill="#f7ca4d" stroke="#ef5a3c" stroke-width="3"/><rect x="553" y="1040" width="112" height="32" fill="#cfd5d2" stroke="#53636c" stroke-width="2"/>
  </g>

  <!-- ORG: porous courtyard network -->
  <g id="orgPanel">
    <text x="840" y="322" class="stage" fill="#4b8060">02 / ORG · CO-CREATE</text>
    <text x="840" y="370" class="form ink">COURTYARD NETWORK</text>
    <text id="orgLead" x="840" y="405" class="small muted">多院落与开放通道共同承载原型、邻里与公共服务。</text>
    <rect x="828" y="438" width="690" height="650" fill="#edf0ed" stroke="#aab6b2" stroke-width="2"/>
    <path d="M866 1015L1165 941L1480 1000L1166 1070Z" fill="#dce8df" stroke="#4b8060" stroke-width="3"/>
    <path d="M905 555L1120 602L1075 738L882 686ZM1175 523L1450 575L1388 707L1134 648ZM921 739L1110 781L1055 918L891 875ZM1190 747L1446 804L1381 953L1142 892Z" fill="#cdd4d1" stroke="#53636c" stroke-width="4"/>
    <path d="M905 555L930 518L1140 555L1120 602M1175 523L1201 493L1470 537L1450 575M921 739L946 712L1132 747L1110 781M1190 747L1215 719L1472 771L1446 804" fill="#eef1ef" stroke="#172027" stroke-width="3"/>
    <path d="M942 620L1079 650L1061 716L926 684Z" fill="#dfad4d" stroke="#172027" stroke-width="3"/>
    <path d="M1208 622L1358 656L1337 729L1186 695Z" fill="#ead9a4" stroke="#ae8008" stroke-width="4"/>
    <path d="M1038 775L1184 808L1152 902L1000 866Z" fill="#d9e4d8" stroke="#4b8060" stroke-width="5"/>
    <path d="M1298 838L1449 871L1428 964L1277 932Z" fill="#f7ca4d" stroke="#ef5a3c" stroke-width="4"/>
    <ellipse cx="1126" cy="772" rx="78" ry="36" fill="#efd05d" stroke="#ae8008" stroke-width="4"/>
    <path d="M848 695L1492 840M865 859L1474 642M1159 500V1038" fill="none" stroke="#fff" stroke-width="25"/>
    <path d="M848 695L1492 840M865 859L1474 642" fill="none" stroke="#4b8060" stroke-width="5" stroke-dasharray="15 11"/><path d="M1159 500V1038" fill="none" stroke="#82ae91" stroke-width="4" stroke-dasharray="15 11"/>
    <text id="orgEdge" x="894" y="515" class="label">开放 / 共享边界</text><text id="orgProto" x="948" y="654" class="label">原型室</text><text id="orgClinic" x="1268" y="748" class="label">公共服务</text><text id="orgTable" x="1084" y="779" class="label">共用桌</text><text id="orgNeighbor" x="1290" y="851" class="label">邻里节点</text><text id="orgPassage" x="1074" y="1028" class="label">多孔通道 / 开放首层</text>
    <text id="orgCourts" x="1177" y="598" class="label">多个院落</text>
  </g>

  <!-- DZS: convergent civic room -->
  <g id="dzsPanel">
    <text x="1594" y="322" class="stage" fill="#009aa5">03 / DZS · ADOPT</text>
    <text x="1594" y="370" class="form ink">CIVIC ROOM</text>
    <text id="dzsLead" x="1594" y="405" class="small muted">城市在公共场所决定采用、修改、复测或退出。</text>
    <rect x="1582" y="438" width="690" height="650" fill="#edf0ed" stroke="#aab6b2" stroke-width="2"/>
    <path d="M1690 583L1924 520L2160 583L2119 878L1924 944L1731 878Z" fill="#d6dcda" stroke="#172027" stroke-width="7"/>
    <path d="M1760 623L1924 580L2089 623L2058 838L1924 884L1790 838Z" fill="#d7eff0" stroke="#009aa5" stroke-width="7"/>
    <path d="M1812 725L1924 692L2036 725L2018 824L1924 853L1830 824Z" fill="url(#roomGrid)" stroke="#172027" stroke-width="4"/>
    <path d="M1728 605L1847 576L1864 680L1748 710ZM2000 576L2119 605L2099 710L1983 680ZM1740 776L1844 748L1857 845L1758 873ZM2004 748L2108 776L2090 873L1991 845Z" fill="#dfad4d" stroke="#172027" stroke-width="3"/>
    <rect x="1873" y="824" width="102" height="63" fill="#f7ca4d" stroke="#ef5a3c" stroke-width="5"/>
    <path d="M1726 864H2121" stroke="#fff" stroke-width="20" stroke-dasharray="28 14"/><path d="M1726 881H2121" stroke="#ef5a3c" stroke-width="8"/>
    <path d="M1658 1032H2191M1710 1072L1854 928M1924 1080V895M2138 1072L1997 928" stroke="#53636c" stroke-width="8"/>
    <path d="M1710 1032H2138" stroke="#009aa5" stroke-width="18"/><circle cx="1710" cy="1032" r="25" fill="#fff" stroke="#009aa5" stroke-width="6"/><circle cx="2138" cy="1032" r="25" fill="#fff" stroke="#009aa5" stroke-width="6"/>
    <path d="M1924 1032V887" fill="none" stroke="#009aa5" stroke-width="10" marker-end="url(#arrowTeal)"/><path d="M1660 992L1815 862M2188 992L2032 862" stroke="#009aa5" stroke-width="5" marker-end="url(#arrowTeal)"/>
    <rect x="2180" y="640" width="38" height="238" fill="#fff" stroke="#172027" stroke-width="4"/><path d="M2199 846V677" stroke="#ef5a3c" stroke-width="6"/><circle cx="2199" cy="637" r="28" fill="#ef5a3c" stroke="#fff" stroke-width="8"/><path d="M2077 823L2198 910" fill="none" stroke="#ef5a3c" stroke-width="4" stroke-dasharray="12 10"/>
    <text id="dzsRoom" x="1924" y="503" text-anchor="middle" class="label">城市客厅 / 公共大厅</text><text id="dzsConsent" x="1749" y="596" class="label">知情同意</text><text id="dzsAppeal" x="2019" y="596" class="label">申诉 / 复核</text><text id="dzsDecision" x="1924" y="759" text-anchor="middle" class="label">公共决策场</text><text id="dzsHuman" x="1924" y="861" text-anchor="middle" class="label">人工服务台</text><text id="dzsArrival" x="1924" y="1004" text-anchor="middle" class="label">公众汇聚 / 到达</text><text id="dzsSwitch" x="2150" y="608" class="label">城市开关 / 退出</text>
  </g>

  <!-- concise comparison -->
  <rect x="74" y="1122" width="2198" height="214" fill="#e2e7e4" stroke="#172027" stroke-width="3"/>
  <line x1="806" y1="1145" x2="806" y2="1312" stroke="#a9b4b0" stroke-width="2"/><line x1="1538" y1="1145" x2="1538" y2="1312" stroke="#a9b4b0" stroke-width="2"/>
  <text x="110" y="1164" class="small" fill="#ef5a3c">ZZY / VERIFY</text><text x="110" y="1219" class="form ink">FIELD</text><text id="bottom1a" x="110" y="1260" font-size="20" font-weight="900" class="muted">控制 · 观察</text><text id="bottom1b" x="110" y="1300" class="small muted">边界 · 缓冲 · 停止</text>
  <text x="842" y="1164" class="small" fill="#4b8060">ORG / CO-CREATE</text><text x="842" y="1219" class="form ink">COURTYARD NETWORK</text><text id="bottom2a" x="842" y="1260" font-size="20" font-weight="900" class="muted">混合 · 共创</text><text id="bottom2b" x="842" y="1300" class="small muted">多孔 · 通道 · 修改</text>
  <text x="1574" y="1164" class="small" fill="#009aa5">DZS / ADOPT</text><text x="1574" y="1219" class="form ink">CIVIC ROOM</text><text id="bottom3a" x="1574" y="1260" font-size="20" font-weight="900" class="muted">决定 · 选择</text><text id="bottom3b" x="1574" y="1300" class="small muted">汇聚 · 复核 · 退出</text>

  <text id="footer" x="82" y="1422" font-size="14" font-weight="700" class="muted">FIG-03 V3.4 · 概念空间原型与相对关系；不构成测绘、地籍、法定边界、安全距离或工程实施依据。</text>
  <text x="2274" y="1422" text-anchor="end" font-size="14" font-weight="900" class="ink">JINGZHANG OPEN INTERFACE</text>

  <script><![CDATA[
    const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en';
    if(lang==='en'){
      const t=(id,value)=>document.getElementById(id).textContent=value;
      t('title','THREE INTERFACES GENERATE THREE URBAN FORMS.');document.getElementById('title').setAttribute('font-size','48');
      t('subtitle','ZZY / VERIFY → FIELD   ·   ORG / CO-CREATE → COURTYARD NETWORK   ·   DZS / ADOPT → CIVIC ROOM');document.getElementById('subtitle').setAttribute('font-size','20');
      t('sequencePrimary','FIELD → COURTYARD NETWORK → CIVIC ROOM');document.getElementById('sequencePrimary').setAttribute('font-size','18');t('sequenceSecondary','THREE SPATIAL ARCHETYPES');
      t('cautionPrimary','CONCEPT / PROVISIONAL / NON-STATUTORY');t('cautionSecondary','NO SURVEYED, CADASTRAL OR APPROVED BOUNDARY CLAIM');
      t('zzyLead','CONTROLLED TEST FIELD · OBSERVE WITHOUT EXPOSURE.');t('zzyResearch','ADJACENT RESEARCH BUILDINGS');t('zzyLogistics','LOGISTICS / EMERGENCY');t('zzyBuffer','SAFETY / TEST BUFFER');t('zzyField','CONTROLLED TEST FIELD');t('zzyObserve','OBSERVATION EDGE');t('zzyStop','PHYSICAL STOP / GANTRY');t('zzyHuman','HUMAN REVIEW');t('zzyBypass','PUBLIC BYPASS');
      t('orgLead','POROUS COURTYARDS LINK PROTOTYPE, NEIGHBORHOOD + SERVICE.');t('orgEdge','OPEN / SHARED EDGE');t('orgProto','PROTOTYPE ROOM');t('orgClinic','PUBLIC SERVICE');t('orgTable','COMMON TABLE');t('orgNeighbor','NEIGHBORHOOD NODE');t('orgPassage','PASSAGES / OPEN GROUND FLOOR');t('orgCourts','MULTIPLE COURTYARDS');
      t('dzsLead','PUBLIC ARRIVAL · HUMAN REVIEW · CHOOSE OR EXIT.');t('dzsRoom','CIVIC ROOM / PUBLIC HALL');t('dzsConsent','CONSENT');t('dzsAppeal','APPEAL / REVIEW');t('dzsDecision','PUBLIC DECISION FLOOR');t('dzsHuman','HUMAN DESK');t('dzsArrival','PUBLIC CONVERGENCE / ARRIVAL');t('dzsSwitch','CIVIC SWITCH / EXIT');
      t('bottom1a','CONTROL · OBSERVE');t('bottom1b','BOUNDARY · BUFFER · STOP');t('bottom2a','MIX · CO-CREATE');t('bottom2b','POROSITY · PASSAGES · MODIFICATION');t('bottom3a','DECIDE · CHOOSE');t('bottom3b','CONVERGENCE · REVIEW · EXIT');
      t('footer','FIG-03 V3.4 · CONCEPT SPATIAL PROTOTYPES AND RELATIVE RELATIONSHIPS; NOT SURVEYED, CADASTRAL, STATUTORY, CERTIFIED-SAFETY OR CONSTRUCTION GEOMETRY.');
    }
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  ]]></script>
</svg>
