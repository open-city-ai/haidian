<text x="78" y="61" font-size="23" font-weight="900" fill="#ef5a3c">JZOI 90 / FIG-08 / ZZY · VERIFY · THRESHOLD FIELD</text>
<text id="title1" x="78" y="126" font-size="53" font-weight="900" fill="#172027">安全测试不是封闭黑箱，</text>
<text id="title2" x="78" y="188" font-size="53" font-weight="900" fill="#172027">而是有边界、可观察、可停止的公共过程。</text>
<text id="subtitle" x="78" y="226" font-size="22" font-weight="900" fill="#52616a">SAFE TESTING IS BOUNDED, OBSERVABLE, AND STOPPABLE.</text><line x1="78" y1="250" x2="1608" y2="250" stroke="#172027" stroke-width="5"/>
<text x="1668" y="67" font-size="15" font-weight="900" fill="#66737d">CIVIC PROTOCOL MODERNISM</text><text id="seqzh" x="1668" y="108" font-size="24" font-weight="900" fill="#172027">公共 → 复核 → 受控测试</text><text id="seqen" x="1668" y="139" font-size="16" font-weight="900" fill="#52616a">PUBLIC → REVIEW → CONTROLLED TEST</text><text id="cautionzh" x="1668" y="184" font-size="13" font-weight="800" fill="#7a8589">概念详细设计 / 暂定空间关系 / 非法定依据</text><text id="cautionen" x="1668" y="207" font-size="13" font-weight="800" fill="#7a8589">CONCEPT DETAIL / PROVISIONAL RELATIONS / NON-STATUTORY</text>
