<rect x="1644" y="280" width="692" height="768" fill="#fff" stroke="#172027" stroke-width="3"/><text x="1680" y="322" font-size="16" font-weight="900" fill="#66737d">ZZY / VERIFY / CONTROLLED TEST FIELD</text><text id="boundaryzh" x="1680" y="362" font-size="25" font-weight="900" fill="#172027">边界先于测试。</text><text id="boundaryen" x="1680" y="392" font-size="16" font-weight="900" fill="#52616a">THE BOUNDARY COMES BEFORE THE TEST.</text><line x1="1680" y1="423" x2="2299" y2="423" stroke="#d5dbd8" stroke-width="2"/><text id="protocol" x="1680" y="458" font-size="13" font-weight="800" fill="#66737d">SECONDARY PROTOCOL / 次要协议证据</text>
<text x="1680" y="501" font-size="16" font-weight="800" fill="#009aa5">ENTER</text><text id="penter" x="1780" y="501" font-size="12" font-weight="700" fill="#52616a">进入公共基底 / PUBLIC BASE</text><text x="1680" y="548" font-size="16" font-weight="800" fill="#8a7015">OBSERVE</text><text id="pobserve" x="1780" y="548" font-size="12" font-weight="700" fill="#52616a">不进入测试 / WITHOUT ENTRY</text><text x="1680" y="595" font-size="16" font-weight="800" fill="#ef5a3c">REVIEW</text><text id="preview" x="1780" y="595" font-size="12" font-weight="700" fill="#52616a">人工确认 / STAFFED CHECK</text><text x="1680" y="642" font-size="16" font-weight="800" fill="#172027">TEST</text><text id="ptest" x="1780" y="642" font-size="12" font-weight="700" fill="#52616a">有界激活 / BOUNDED ACTIVE</text><text x="1680" y="689" font-size="16" font-weight="800" fill="#ef5a3c">STOP / EXIT</text><text id="pstop" x="1812" y="689" font-size="12" font-weight="700" fill="#52616a">物理停止 + 退出</text><line x1="1680" y1="727" x2="2299" y2="727" stroke="#172027" stroke-width="3"/><text id="proof" x="1680" y="766" font-size="15" font-weight="900" fill="#66737d">SPATIAL PROOF / 空间证明</text><text x="1680" y="805" font-size="14" font-weight="900" fill="#009aa5">01  PUBLIC BYPASS REMAINS OPEN</text><text x="1680" y="841" font-size="14" font-weight="900" fill="#8a7015">02  OBSERVATION WITHOUT TEST ENTRY</text><text x="1680" y="877" font-size="14" font-weight="900" fill="#ef5a3c">03  HUMAN REVIEW + PHYSICAL STOP</text><text x="1680" y="913" font-size="14" font-weight="900" fill="#52616a">04  LOGISTICS / EMERGENCY SEPARATED</text><line x1="1680" y1="947" x2="2299" y2="947" stroke="#d5dbd8" stroke-width="2"/><text id="evidence" x="1680" y="982" font-size="14" font-weight="900" fill="#66737d">EVIDENCE BOUNDARY / 证据边界</text><text id="ev1" x="1680" y="1009" font-size="11" font-weight="800" fill="#788488">PROV-KEY-001 IS A ROUGH FRAME, NOT AN OFFICIAL BOUNDARY.</text><text id="ev2" x="1680" y="1028" font-size="11" font-weight="800"