<rect width="2400" height="1500" fill="#f4f5f1"/><rect width="28" height="1500" fill="#172027"/><text x="86" y="76" font-size="25" font-weight="800" fill="#ef5a3c">JZOI 90 / FIG-01 / URBAN LIFECYCLE FIELD</text><text id="title" x="86" y="178" font-size="82" font-weight="900" fill="#172027">AI进入城市之前，先经过城市。</text><text id="subtitle" x="90" y="229" font-size="25" font-weight="700" fill="#52616a">AI MUST PASS THROUGH THE CITY BEFORE IT ENTERS EVERYDAY URBAN LIFE</text><line x1="88" y1="269" x2="1678" y2="269" stroke="#172027" stroke-width="5"/><text x="1732" y="84" font-size="16" font-weight="700" fill="#66737d">CIVIC PROTOCOL MODERNISM</text><text id="protocolzh" x="1732" y="121" font-size="28" font-weight="900" fill="#172027">城市验证 → 共同塑造 → 公共采用</text><text id="protocolen" x="1732" y="158" font-size="19" font-weight="700" fill="#52616a">VERIFY → CO-CREATE → ADOPT</text><text id="cautionzh" x="1732" y="210" font-size="14" font-weight="700" fill="#7c898e">概念设计 / 暂定几何 / 非法定依据</text><text id="cautioen" x="1732" y="235" font-size="14" font-weight="700" fill="#7c898e">CONCEPT / PROVISIONAL / NON-STATUTORY</text>
