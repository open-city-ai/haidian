<g font-weight="900"><text id="zzy" x="218" y="608" font-size="25" fill="#ef5a3c">01 / ZZY · 众智园</text><text x="218" y="674" font-size="57" fill="#172027">VERIFY</text><text id="zzysub" x="218" y="714" font-size="22" fill="#52616a">受控验证场 / CONTROLLED TEST FIELD</text><text x="218" y="784" font-size="21" fill="#172027">TEST · OBSERVE · STOP</text><text id="zzydesc" x="218" y="821" font-size="16" fill="#66737d">证明系统可以被观察、拒绝，并安全失败。</text><text id="org" x="953" y="608" font-size="25" fill="#4b8060">02 / ORG · AI原点社区</text><text x="953" y="674" font-size="57" fill="#172027">CO-CREATE</text><text id="orgsub" x="953" y="714" font-size="22" fill="#52616a">开放共创场 / POROUS COMMONS</text><text x="953" y="784" font-size="21" fill="#172027">OPEN · MODIFY · SHARE</text><text id="orgdesc" x="953" y="821" font-size="16" fill="#66737d">能力与问题在真实社区中被共同修改。</text><text id="dzs" x="1688" y="608" font-size="25" fill="#009aa5">03 / DZS · 大钟寺</text><text x="1688" y="674" font-size="57" fill="#172027">ADOPT</text><text id="dzssub" x="1688" y="714" font-size="22" fill="#52616a">城市选择台 / CIVIC SWITCHBOARD</text><text x="1688" y="784" font-size="21" fill="#172027">CHOOSE · REVIEW · EXIT</text><text id="dzsdesc" x="1688" y="821" font-size="16" fill="#66737d">城市决定采用、修改、复测或退出。</text></g>
<rect x="188" y="910" width="2024" height="61" fill="#fff" stroke="#172027" stroke-width="3"/><line x1="258" y1="941" x2="2050" y2="941" stroke="#ef5a3c" stroke-width="4" stroke-dasharray="7 12"/><text x="217" y="949" font-size="19" font-weight="900">H</text><text x="2080" y="949" font-size="19" font-weight="900">H</text><rect x="548" y="921" width="1304" height="39" fill="#fff"/><text x="575" y="947" font-size="15" font-weight="900">HUMAN-EQUIVALENT SERVICE NETWORK</text><text id="human" x="962" y="947" font-size="15" font-weight="800" fill="#52616a">人员值守 · 静态指引 · 纸面流程 · 解释 · 申诉 · 复核 · 退出</text>
<path d="M2110 1014C2110 1108 1897 1130 1665 1130H680C430 1130 294 1098 294 1020" fill="none" stroke="#299fa7" stroke-width="5" marker-end="url(#cyan)"/><rect x="770" y="1099" width="865" height="59" fill="#f4f5f1"/><text x="800" y="1125" font-size="15" font-weight="800" fill="#238e96">REAL URBAN USE → FAILURE / COMPLAINT / EXIT → RESEARCH / NEXT ITERATION</text><text id="loop" x="978" y="1148" font-size="12" font-weight="700" fill="#7c898e">真实使用反馈不在终点消失，而是返回验证端。</text>
<rect x="82" y="1250" width="2244" height="140" fill="#e4e9e6" stroke="#172027" stroke-width="3"/><text id="scales" x="116" y="1282" font-size="14" font-weight="800" fill="#66737d">THREE SCALES / 三重尺度</text><text x="116" y="1332" font-size="36" font-weight="900">43.6 km²</text><text x="116" y="1367" font-size="13" fill="#66737d">COMPETITION STUDY AREA</text><text x="492" y="1332" font-size="36" font-weight="900">≈11.4 km²</text><text x="492" y="1367" font-size="13" fill="#66737d">PROVISIONAL OVERALL DESIGN AREA</text><text x="970" y="1332" font-size="36" font-weight="900">3 KEY AREAS</text><text x="970" y="1367" font-size="13" fill="#66737d">VERIFY · CO-CREATE · ADOPT</text><text x="1420" y="1282" font-size="14" font-weight="800" fill="#66737d">JZOI 90 / PILOT 01 · CIVIC WAYFINDING</text><text x="1420" y="1320" font-size="20" font-weight="900">TEST → REPAIR → PILOT</text><text x="1420" y="1351" font-size="17" font-weight="800" fill="#9b7b00">ADOPT / MODIFY / RETEST / EXIT</text><text x="82" y="1455" font-size="14" fill="#66737d">FIG-01 V3.4 · URBAN LIFECYCLE FIELD · PROVISIONAL GEOMETRY IS NOT A CADASTRAL, STATUTORY OR CONSTRUCTION CLAIM.</text><text x="2274" y="1455" text-anchor="end" font-size="14" font-weight="900">JINGZHANG OPEN INTERFACE</text>
<script><![CDATA[const l=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en';if(l==='en'){const t=(i,v)=>document.getElementById(i).textContent=v;t('title','AI MUST PASS THROUGH THE CITY');t('subtitle','BEFORE IT ENTERS EVERYDAY URBAN LIFE.');document.getElementById('title').setAttribute('font-size','62');document.getElementById('subtitle').setAttribute('font-size','34');t('protocolzh','VERIFY → CO-CREATE → ADOPT');t('protocolen','URBAN LIFECYCLE');t('cautionzh','CONCEPT / PROVISIONAL / NON-STATUTORY');t('cautioen','NO SURVEYED OR STATUTORY GEOMETRY CLAIM');t('wing1','TECHNOLOGY SERVICE WING');t('wing2','SCENARIO + FEEDBACK WING');t('zzy','01 / ZZY · CONTROLLED TEST FIELD');t('zzysub','VERIFY');t('zzydesc','OBSERVE · REFUSE · STOP · FAIL SAFELY');t('org','02 / ORG · POROUS COMMONS');t('orgsub','CO-CREATE');t('orgdesc','CAPABILITIES AND PROBLEMS ARE MODIFIED TOGETHER');t('dzs','03 / DZS · CIVIC SWITCHBOARD');t('dzssub','ADOPT');t('dzsdesc','ADOPT · MODIFY · RETEST · EXIT');t('human','STAFFED HELP · STATIC SIGNS · PAPER · EXPLANATION · APPEAL · REVIEW · EXIT');t('loop','REAL-USE FEEDBACK RETURNS TO RESEARCH');t('scales','THREE SCALES');}document.documentElement.lang=l==='zh'?'zh-CN':'en';]]></script></svg>
