<svg viewBox="0 0 2400 1500" width="2400" height="1500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JZOI 90 pilot evidence and decision architecture">
  <style>
    text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:0}.ink{fill:#172027}.muted{fill:#52616a}.micro{font-size:12px;font-weight:800}.small{font-size:15px;font-weight:900}.label{font-size:17px;font-weight:900}.stage{font-size:28px;font-weight:900}.family{font-size:24px;font-weight:900}.outcome{font-size:34px;font-weight:900}
  </style>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#172027"/></marker>
    <marker id="return" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#ef5a3c"/></marker>
    <pattern id="measureGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#b8cbc7" stroke-width="1"/></pattern>
  </defs>

  <rect width="2400" height="1500" fill="#f4f5f1"/><rect width="28" height="1500" fill="#172027"/>
  <text x="86" y="72" font-size="24" font-weight="900" fill="#ef5a3c">JZOI 90 / PILOT 01 / EVIDENCE + DECISION ARCHITECTURE</text>
  <text id="thesis" x="86" y="170" font-size="74" font-weight="900" class="ink">先测试，再采用；先测量，再扩大。</text>
  <text id="thesis-en" x="90" y="219" font-size="27" font-weight="900" class="muted">TEST BEFORE ADOPT. MEASURE BEFORE SCALE.</text>
  <line x1="88" y1="258" x2="1668" y2="258" stroke="#172027" stroke-width="5"/>
  <text x="1720" y="78" font-size="16" font-weight="800" class="muted">CIVIC PROTOCOL MODERNISM</text>
  <text id="assumption" x="1720" y="121" font-size="25" font-weight="900" class="ink">不要假定 AI 有效。</text>
  <text id="assumption-en" x="1720" y="155" font-size="18" font-weight="900" class="muted">DO NOT ASSUME AI WORKS.</text>
  <text id="knowledge" x="1720" y="194" font-size="20" font-weight="900" class="ink">设计如何知道。</text>
  <text id="knowledge-en" x="1720" y="224" font-size="16" font-weight="900" class="muted">DESIGN HOW TO KNOW.</text>

  <!-- primary evidence sequence -->
  <text x="84" y="307" class="small muted">HOW DO WE KNOW WHETHER THE PILOT SHOULD CONTINUE?</text>
  <path d="M188 408H2180" fill="none" stroke="#172027" stroke-width="8" marker-end="url(#arrow)"/>
  <g>
    <circle cx="220" cy="408" r="85" fill="#fff" stroke="#172027" stroke-width="6"/><text x="220" y="401" text-anchor="middle" class="stage ink">BASELINE</text><text x="220" y="429" text-anchor="middle" class="micro muted">先测现状 / NO VALUE ASSUMED</text>
    <rect x="508" y="339" width="292" height="138" fill="#fff" stroke="#ef5a3c" stroke-width="6"/><text x="654" y="397" text-anchor="middle" class="stage ink">PILOT</text><text x="654" y="429" text-anchor="middle" class="small" fill="#ef5a3c">JZOI 90 / TIMEBOXED</text><text x="654" y="454" text-anchor="middle" class="micro muted">STAGING TO BE CONFIRMED</text>
    <rect x="964" y="329" width="330" height="158" fill="url(#measureGrid)" stroke="#4b8060" stroke-width="7"/><text x="1129" y="397" text-anchor="middle" class="stage ink">MEASURE</text><text x="1129" y="429" text-anchor="middle" class="small" fill="#4b8060">COMPARE WITH BASELINE</text><text x="1129" y="454" text-anchor="middle" class="micro muted">NO FABRICATED TARGET OR RESULT</text>
    <path d="M1531 337H1771V479H1531Z" fill="#172027"/><path d="M1571 337V479M1731 337V479" stroke="#fff" stroke-width="5"/><text x="1651" y="400" text-anchor="middle" class="stage" fill="#fff">REVIEW</text><text x="1651" y="432" text-anchor="middle" class="micro" fill="#dbe2df">HUMAN + PROFESSIONAL</text>
    <path d="M2050 322L2186 408L2050 494L1914 408Z" fill="#fff" stroke="#009aa5" stroke-width="7"/><text x="2050" y="401" text-anchor="middle" class="stage ink">DECIDE</text><text x="2050" y="431" text-anchor="middle" class="micro muted">BENEFIT PROVEN?</text>
  </g>
  <g font-size="17" font-weight="900" class="muted"><text x="376" y="389">→</text><text x="861" y="389">→</text><text x="1405" y="389">→</text><text x="1830" y="389">→</text></g>

  <!-- five evidence families -->
  <rect x="74" y="526" width="2252" height="390" fill="#e9eeeb" stroke="#172027" stroke-width="3"/>
  <text x="104" y="563" class="small muted">MEASUREMENT FIELD / VALUES REMAIN UNKNOWN UNTIL BASELINE + PILOT OBSERVATION</text>
  <line x1="524" y1="582" x2="524" y2="892" stroke="#adb9b5" stroke-width="2"/><line x1="974" y1="582" x2="974" y2="892" stroke="#adb9b5" stroke-width="2"/><line x1="1424" y1="582" x2="1424" y2="892" stroke="#adb9b5" stroke-width="2"/><line x1="1874" y1="582" x2="1874" y2="892" stroke="#adb9b5" stroke-width="2"/>

  <g transform="translate(104 0)"><rect x="0" y="590" width="14" height="46" fill="#ef5a3c"/><text x="28" y="612" class="family ink">A / CIVIC TASK</text><text x="28" y="638" class="family ink">PERFORMANCE</text><text x="0" y="675" class="small" fill="#ef5a3c">DESIGN MEASUREMENT FRAME</text><text x="0" y="713" class="label muted">TASK COMPLETION</text><text x="0" y="744" class="label muted">FAILURE / WRONG TURNS</text><text x="0" y="775" class="label muted">TIME + HELP REQUESTS</text><text x="0" y="829" class="micro muted">TO BE MEASURED</text><text x="0" y="852" class="micro muted">NO CURRENT BASELINE</text></g>
  <g transform="translate(554 0)"><rect x="0" y="590" width="14" height="46" fill="#4b8060"/><text x="28" y="612" class="family ink">B / ACCESS</text><text x="28" y="638" class="family ink">+ EQUITY</text><text x="0" y="675" class="small" fill="#4b8060">REGISTRY + MEASUREMENT FRAME</text><text x="0" y="713" class="label muted">NON-AI COMPLETION</text><text x="0" y="744" class="label muted">ACCESSIBILITY FAILURE</text><text x="0" y="775" class="label muted">FALLBACK / SERVICE CONTINUITY</text><text x="0" y="829" class="micro muted">SUPPORTED: FALLBACK COVERAGE,</text><text x="0" y="852" class="micro muted">SERVICE COVERAGE · VALUES UNKNOWN</text></g>
  <g transform="translate(1004 0)"><rect x="0" y="590" width="14" height="46" fill="#009aa5"/><text x="28" y="612" class="family ink">C / PUBLIC</text><text x="28" y="638" class="family ink">ACCOUNTABILITY</text><text x="0" y="675" class="small" fill="#009aa5">REGISTRY + CASE LEDGER FRAME</text><text x="0" y="713" class="label muted">COMPLAINT + APPEAL</text><text x="0" y="744" class="label muted">HUMAN REVIEW</text><text x="0" y="775" class="label muted">UNRESOLVED CASES</text><text x="0" y="829" class="micro muted">SUPPORTED: APPEAL RESPONSE +</text><text x="0" y="852" class="micro muted">HUMAN REVIEW DEFINITIONS · NO SLA</text></g>
  <g transform="translate(1454 0)"><rect x="0" y="590" width="14" height="46" fill="#efd05d"/><text x="28" y="612" class="family ink">D / SAFETY</text><text x="28" y="638" class="family ink">+ OPERATIONS</text><text x="0" y="675" class="small" fill="#9b7b00">DESIGN EVENT-LEDGER FRAME</text><text x="0" y="713" class="label muted">SAFETY + STOP EVENTS</text><text x="0" y="744" class="label muted">FALLBACK ACTIVATION</text><text x="0" y="775" class="label muted">SERVICE INTERRUPTION</text><text x="0" y="829" class="micro muted">SUPPORTED: STAFFED / FALLBACK</text><text x="0" y="852" class="micro muted">SERVICE STATE · VALUES UNKNOWN</text></g>
  <g transform="translate(1904 0)"><rect x="0" y="590" width="14" height="46" fill="#172027"/><text x="28" y="612" class="family ink">E / AI</text><text x="28" y="638" class="family ink">MARGINAL VALUE</text><text x="0" y="675" class="small ink">FUTURE MONITORING + FRAME</text><text x="0" y="713" class="label muted">BASELINE VS PILOT</text><text x="0" y="744" class="label muted">MEASURABLE PUBLIC BENEFIT</text><text x="0" y="775" class="label muted">DOCUMENTED DECISION</text><text x="0" y="829" class="micro muted">SUPPORTED: PROTOTYPE → ADOPTION</text><text x="0" y="852" class="micro muted">DEFINITION · BENEFIT NOT ASSUMED</text></g>

  <!-- stop-review rail -->
  <rect x="74" y="944" width="2252" height="142" fill="#fff" stroke="#ef5a3c" stroke-width="5"/>
  <rect x="74" y="944" width="246" height="142" fill="#ef5a3c"/><text x="197" y="995" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">STOP / REVIEW</text><text x="197" y="1027" text-anchor="middle" class="small" fill="#fff">NOT AUTO-ADOPT</text><text x="197" y="1053" text-anchor="middle" class="micro" fill="#fff">THRESHOLDS TO BE DEFINED</text>
  <text x="354" y="979" class="small" fill="#ef5a3c">SUPPORTED PACKAGE LOGIC / CAUTIOUS TRIGGERS</text>
  <text x="354" y="1015" class="label ink">SAFETY INCIDENT  ·  ACCESS INEQUITY  ·  FALLBACK UNAVAILABLE  ·  UNRESOLVED COMPLAINT / APPEAL</text>
  <text x="354" y="1051" class="label ink">PRIVACY / DATA ISSUE  ·  INSUFFICIENT EVIDENCE  ·  OPERATIONAL FAILURE</text>
  <path d="M2130 944V900H1680" fill="none" stroke="#ef5a3c" stroke-width="5" marker-end="url(#return)"/><text x="1845" y="928" class="micro" fill="#ef5a3c">RETURN TO REVIEW / RETEST</text>

  <!-- four equal outcomes -->
  <text x="84" y="1134" class="small muted">DECISION OUTCOMES / EQUAL STATUS / ADOPTION IS NOT THE DEFAULT</text>
  <g>
    <rect x="74" y="1154" width="531" height="137" fill="#fff" stroke="#172027" stroke-width="4"/><rect x="74" y="1154" width="531" height="14" fill="#4b8060"/><text x="339" y="1217" text-anchor="middle" class="outcome ink">ADOPT</text><text x="339" y="1250" text-anchor="middle" class="small muted">TIME-BOUNDED + REVIEWABLE</text>
    <rect x="638" y="1154" width="531" height="137" fill="#fff" stroke="#172027" stroke-width="4"/><rect x="638" y="1154" width="531" height="14" fill="#efd05d"/><text x="903" y="1217" text-anchor="middle" class="outcome ink">MODIFY</text><text x="903" y="1250" text-anchor="middle" class="small muted">REPAIR DESIGN / PROTOCOL</text>
    <rect x="1201" y="1154" width="531" height="137" fill="#fff" stroke="#172027" stroke-width="4"/><rect x="1201" y="1154" width="531" height="14" fill="#009aa5"/><text x="1467" y="1217" text-anchor="middle" class="outcome ink">RETEST</text><text x="1467" y="1250" text-anchor="middle" class="small muted">NEW EVIDENCE REQUIRED</text>
    <rect x="1765" y="1154" width="561" height="137" fill="#fff" stroke="#172027" stroke-width="4"/><rect x="1765" y="1154" width="561" height="14" fill="#ef5a3c"/><text x="2045" y="1217" text-anchor="middle" class="outcome ink">EXIT</text><text x="2045" y="1250" text-anchor="middle" class="small muted">DO NOT SCALE / KEEP BASIC SERVICE</text>
  </g>

  <!-- responsibility and evidence caution -->
  <rect x="74" y="1320" width="2252" height="94" fill="#e2e7e4" stroke="#172027" stroke-width="3"/>
  <text x="104" y="1350" class="small muted">RESPONSIBILITY / HIGH-LEVEL ROLES</text>
  <text x="104" y="1384" class="label ink">OPERATOR / IMPLEMENTATION</text><text x="595" y="1384" class="label ink">STAFFED SERVICE / HUMAN REVIEW</text><text x="1225" y="1384" class="label ink">PROFESSIONAL / INDEPENDENT REVIEW</text><text x="1880" y="1384" class="label ink">USERS / PUBLIC FEEDBACK</text>
  <text x="82" y="1460" font-size="19" font-weight="900" fill="#ef5a3c">NO EVIDENCE ≠ SUCCESS.</text><text x="375" y="1460" font-size="16" font-weight="900" class="muted">FAILURE TO PROVE PUBLIC BENEFIT REMAINS A VALID REASON NOT TO SCALE.</text><text x="2274" y="1460" text-anchor="end" class="small ink">CONCEPT MEASUREMENT FRAME · NO OBSERVED VALUES OR APPROVAL CLAIM</text>
  <script><![CDATA[
    const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
    if (lang === 'en') {
      document.getElementById('thesis').textContent = 'TEST BEFORE ADOPT. MEASURE BEFORE SCALE.';
      document.getElementById('thesis').setAttribute('font-size', '58');
      document.getElementById('thesis-en').textContent = 'EVIDENCE BEFORE EXPANSION. PUBLIC BENEFIT MUST BE PROVEN.';
      document.getElementById('assumption').textContent = 'DO NOT ASSUME AI WORKS.';
      document.getElementById('assumption-en').textContent = 'PUBLIC BENEFIT MUST BE PROVEN.';
      document.getElementById('knowledge').textContent = 'DESIGN HOW TO KNOW.';
      document.getElementById('knowledge-en').textContent = 'MEASURE. REVIEW. DECIDE.';
      document.querySelectorAll('text').forEach(node => {
        if (node.textContent.includes('先测现状 / ')) node.textContent = 'MEASURE CURRENT STATE / NO VALUE ASSUMED';
      });
    }
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelector('svg').setAttribute('aria-label', lang === 'zh' ? 'JZOI 90 试点证据与决策架构' : 'JZOI 90 pilot evidence and decision architecture');
  ]]></script>
</svg>
