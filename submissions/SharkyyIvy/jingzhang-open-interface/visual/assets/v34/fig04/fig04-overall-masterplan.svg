  <text x="86" y="76" font-size="25" font-weight="900" fill="#ef5a3c">JZOI 90 / FIG-04 / 11.4 km² OVERALL MASTERPLAN</text>
  <text id="title" x="86" y="178" font-size="70" font-weight="900" class="ink">一条公共接口，把三处端点组织成一座连续城市。</text>
  <text id="subtitle" x="90" y="226" font-size="24" font-weight="800" class="muted">ONE PUBLIC INTERFACE ORGANIZES THREE ENDPOINTS INTO A CONTINUOUS CITY.</text>
