<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t d">
  <title id="t">京张尺规线 Logo / Jingzhang The Gauge Line logo</title>
  <desc id="d">双轨度量母题：白色实轨为空间之尺，金色虚轨为智能之尺；上方金色人字形取自詹天佑京张铁路人字形展线，亦是一把展开的圆规。纯几何原创图形，无字体依赖。</desc>
  <rect x="8" y="8" width="224" height="224" rx="26" fill="#0b1f3a"/>
  <rect x="8" y="8" width="224" height="224" rx="26" fill="none" stroke="#c79838" stroke-width="4"/>
  <!-- 蓝图网格暗示（细白线，低透明） -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.10">
    <line x1="60" y1="8" x2="60" y2="232"/>
    <line x1="120" y1="8" x2="120" y2="232"/>
    <line x1="180" y1="8" x2="180" y2="232"/>
    <line x1="8" y1="60" x2="232" y2="60"/>
    <line x1="8" y1="120" x2="232" y2="120"/>
    <line x1="8" y1="180" x2="232" y2="180"/>
  </g>
  <!-- 人字形展线 / 展开的圆规（金色） -->
  <polyline points="58,116 120,58 182,116" fill="none" stroke="#c79838" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="58" r="9" fill="#c79838"/>
  <!-- 双轨：白实轨（空间之尺） + 金虚轨（AI 之尺） -->
  <line x1="38" y1="152" x2="202" y2="152" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="38" y1="176" x2="202" y2="176" stroke="#c79838" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 10"/>
  <!-- 枕木刻度（青绿） -->
  <g stroke="#9fd7c0" stroke-width="5" stroke-linecap="round">
    <line x1="54" y1="140" x2="54" y2="188"/>
    <line x1="92" y1="140" x2="92" y2="188"/>
    <line x1="130" y1="140" x2="130" y2="188"/>
    <line x1="168" y1="140" x2="168" y2="188"/>
    <line x1="202" y1="140" x2="202" y2="188" opacity="0"/>
  </g>
  <!-- 刻度齿（轨距尺意象，底部） -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="44" y1="206" x2="44" y2="214"/>
    <line x1="64" y1="206" x2="64" y2="218"/>
    <line x1="84" y1="206" x2="84" y2="214"/>
    <line x1="104" y1="206" x2="104" y2="218"/>
    <line x1="124" y1="206" x2="124" y2="214"/>
    <line x1="144" y1="206" x2="144" y2="218"/>
    <line x1="164" y1="206" x2="164" y2="214"/>
    <line x1="184" y1="206" x2="184" y2="218"/>
  </g>
</svg>
