<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title"><title id="title">REN BELT visual identity specification</title><rect width="1400" height="900" fill="#F7F4EE"/><text x="72" y="92" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#19324A">REN BELT / VISUAL IDENTITY KIT</text><text x="72" y="132" font-family="Arial,sans-serif" font-size="20" fill="#667788">A compact, reproducible identity for maps, wayfinding and public programmes.</text><rect x="72" y="184" width="580" height="300" rx="16" fill="#FFFFFF" stroke="#D6DED9"/><text x="104" y="226" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#19324A">01 / MASTER MARK</text><g transform="translate(112 252) scale(.7)"><path d="M80 38 L260 168 L330 112 L400 168 L580 38" fill="none" stroke="#19324A" stroke-width="13" stroke-linecap="round"/><path d="M93 25 L273 155 L330 109 L387 155 L567 25" fill="none" stroke="#D78B4A" stroke-width="5"/><circle cx="330" cy="112" r="18" fill="#2F8F72" stroke="#F7F4EE" stroke-width="7"/></g><text x="104" y="454" font-family="Arial,sans-serif" font-size="17" fill="#667788">Minimum digital size: 96 px wide; print: 24 mm wide.</text><rect x="688" y="184" width="640" height="300" rx="16" fill="#101827"/><text x="720" y="226" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">02 / REVERSE MARK</text><g transform="translate(728 252) scale(.7)"><path d="M80 38 L260 168 L330 112 L400 168 L580 38" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/><path d="M93 25 L273 155 L330 109 L387 155 L567 25" fill="none" stroke="#F5C96A" stroke-width="5"/><circle cx="330" cy="112" r="18" fill="#9FD7C0" stroke="#101827" stroke-width="7"/></g><text x="720" y="454" font-family="Arial,sans-serif" font-size="17" fill="#D8E3EF">Use on dark rail, event and night-wayfinding surfaces.</text><text x="72" y="560" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#19324A">03 / PALETTE</text><g font-family="Arial,sans-serif" font-size="17"><rect x="72" y="590" width="180" height="100" fill="#19324A"/><text x="90" y="720" fill="#19324A">Rail Navy #19324A</text><rect x="292" y="590" width="180" height="100" fill="#D78B4A"/><text x="310" y="720" fill="#19324A">Rail Amber #D78B4A</text><rect x="512" y="590" width="180" height="100" fill="#2F8F72"/><text x="530" y="720" fill="#19324A">Origin Green #2F8F72</text><rect x="732" y="590" width="180" height="100" fill="#F5C96A"/><text x="750" y="720" fill="#19324A">Signal Gold #F5C96A</text><rect x="952" y="590" width="180" height="100" fill="#F7F4EE" stroke="#D6DED9"/><text x="970" y="720" fill="#19324A">Paper #F7F4EE</text></g><text x="72" y="820" font-family="Arial,sans-serif" font-size="18" fill="#667788">Typography: system sans / Microsoft YaHei for Chinese; Arial or system sans for English. Wayfinding: one mark, one destination, one action.</text></svg>