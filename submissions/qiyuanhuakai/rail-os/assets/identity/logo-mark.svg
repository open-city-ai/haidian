<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">三时共轨 · 京张共智带 — 标志 / THREE TIMES, ONE LINE — Jing-Zhang Civic AI Commons — Mark</title>
  <desc id="logo-desc">一线穿三时：同一条线自左足升起，在人字折返点折返，经右足折回成环，象征源—试—享的共智循环；三根枕木横越一线，代表钟之时、轨之时、算之时。</desc>
  <!-- 一线：人字折返 + 底部回环，闭合无端点 = 共智循环。黛蓝 #17283B -->
  <path d="M 56 140 L 128 36 L 200 140 A 72 72 0 0 1 128 212 A 72 72 0 0 1 56 140 Z" fill="none" stroke="#17283B" stroke-width="18" stroke-linejoin="round"/>
  <!-- 折返点：砖红 #A44738 -->
  <circle cx="128" cy="36" r="13" fill="#A44738"/>
  <!-- 三时枕木：琥珀 #D49A38 -->
  <g stroke="#D49A38" stroke-width="14" stroke-linecap="round">
    <path d="M 78.02 78.32 L 105.98 97.68"/>
    <path d="M 150.02 97.68 L 177.98 78.32"/>
    <path d="M 128 195 L 128 229"/>
  </g>
</svg>
