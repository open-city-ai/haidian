<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#1a1a2e"/>
  <!-- title -->
  <text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e0e0ff">百年京张AI创新带 · 总体空间结构示意</text>
  <text x="400" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaaacc">（临时粗略边界 · 概念示意 · 待正式数据补齐）</text>
  <!-- site boundary -->
  <polygon points="200,520 440,520 440,360 420,220 440,80 300,80 290,200 270,360 200,520"
    fill="none" stroke="#4488ff" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- green corridor -->
  <rect x="310" y="220" width="80" height="280" fill="#2d6a4f" opacity="0.6"/>
  <text x="350" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#74c69d">京张遗址</text>
  <text x="350" y="344" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#74c69d">公园绿廊</text>
  <!-- Key Area 1: Zhongzhiyuan (North) -->
  <rect x="285" y="88" width="145" height="112" rx="6" fill="#16213e" stroke="#00b4d8" stroke-width="2"/>
  <text x="357" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00b4d8">众智园</text>
  <text x="357" y="134" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#90e0ef">AI自主创新加速区</text>
  <text x="357" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ade8f4">192.1 ha</text>
  <!-- Key Area 2: AI Origin (Mid) -->
  <rect x="275" y="228" width="150" height="88" rx="6" fill="#16213e" stroke="#7b2fbe" stroke-width="2"/>
  <text x="350" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c77dff">北京AI</text>
  <text x="350" y="272" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c77dff">原点社区</text>
  <text x="350" y="288" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e0aaff">104.3 ha</text>
  <!-- Key Area 3: Dazhongsi (South) -->
  <rect x="210" y="428" width="170" height="68" rx="6" fill="#16213e" stroke="#f77f00" stroke-width="2"/>
  <text x="295" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f77f00">大钟寺</text>
  <text x="295" y="471" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f77f00">AI产业聚集区</text>
  <text x="295" y="487" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ffba08">72.0 ha</text>
  <!-- Wings -->
  <text x="560" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaaacc">中关村</text>
  <text x="560" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaaacc">科技服务翼</text>
  <line x1="430" y1="210" x2="510" y2="210" stroke="#888" stroke-dasharray="4,3"/>
  <text x="560" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaaacc">小月河</text>
  <text x="560" y="394" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaaacc">场景赋能翼</text>
  <line x1="426" y1="390" x2="510" y2="390" stroke="#888" stroke-dasharray="4,3"/>
  <!-- North arrow -->
  <text x="720" y="96" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">N</text>
  <line x1="720" y1="104" x2="720" y2="130" stroke="white" stroke-width="2"/>
  <polygon points="720,100 714,116 720,112 726,116" fill="white"/>
  <!-- Legend -->
  <rect x="30" y="440" width="160" height="130" rx="4" fill="#0d0d1a" stroke="#333" stroke-width="1"/>
  <text x="110" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cccccc" font-weight="bold">图例</text>
  <rect x="40" y="465" width="14" height="10" fill="none" stroke="#4488ff" stroke-dasharray="4,2"/>
  <text x="62" y="474" font-family="sans-serif" font-size="10" fill="#cccccc">总体设计范围（临时）</text>
  <rect x="40" y="480" width="14" height="10" fill="#2d6a4f" opacity="0.7"/>
  <text x="62" y="489" font-family="sans-serif" font-size="10" fill="#cccccc">京张遗址公园绿廊</text>
  <rect x="40" y="495" width="14" height="10" fill="none" stroke="#00b4d8" stroke-width="2"/>
  <text x="62" y="504" font-family="sans-serif" font-size="10" fill="#cccccc">众智园加速区</text>
  <rect x="40" y="510" width="14" height="10" fill="none" stroke="#7b2fbe" stroke-width="2"/>
  <text x="62" y="519" font-family="sans-serif" font-size="10" fill="#cccccc">AI原点社区</text>
  <rect x="40" y="525" width="14" height="10" fill="none" stroke="#f77f00" stroke-width="2"/>
  <text x="62" y="534" font-family="sans-serif" font-size="10" fill="#cccccc">大钟寺聚集区</text>
  <text x="400" y="582" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666688">数据来源: 北京市规划和自然资源委员会海淀分局公告（2026-05-09）；边界为临时粗略范围，待正式数据替换</text>
</svg>