<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0d1117"/>
  <text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e0e0ff">核心指标与设计目标证据</text>
  <text x="400" y="56" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888aaa">（设计目标值 · 基于临时几何 · 待正式数据重新复算）</text>
  <!-- Card 1: Site Area -->
  <rect x="30" y="80" width="220" height="140" rx="10" fill="#0a1628" stroke="#00b4d8" stroke-width="2"/>
  <text x="140" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#90e0ef" font-weight="bold">总体设计面积</text>
  <text x="140" y="148" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#00b4d8">11.4</text>
  <text x="140" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ade8f4">km²</text>
  <text x="140" y="194" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666888">来源：官方公告文字值</text>
  <!-- Card 2: Green ratio -->
  <rect x="290" y="80" width="220" height="140" rx="10" fill="#052e1e" stroke="#52b788" stroke-width="2"/>
  <text x="400" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#74c69d" font-weight="bold">绿地率（设计目标）</text>
  <text x="400" y="148" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#52b788">35%</text>
  <text x="400" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#74c69d">绿地/总面积</text>
  <text x="400" y="194" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666888">置信度：低·待控规核实</text>
  <!-- Card 3: Public space ratio -->
  <rect x="550" y="80" width="220" height="140" rx="10" fill="#15052e" stroke="#c77dff" stroke-width="2"/>
  <text x="660" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#c77dff" font-weight="bold">公共空间率（设计目标）</text>
  <text x="660" y="148" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="bold" fill="#c77dff">20%</text>
  <text x="660" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0aaff">公共空间/总面积</text>
  <text x="660" y="194" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666888">置信度：低·待控规核实</text>
  <!-- Key area table -->
  <text x="400" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0e0ff" font-weight="bold">三大重点区域面积（官方公告值）</text>
  <rect x="50" y="268" width="700" height="34" rx="4" fill="#161b22"/>
  <text x="200" y="291" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">区域</text>
  <text x="450" y="291" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">面积</text>
  <text x="650" y="291" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">置信度</text>
  <rect x="50" y="302" width="700" height="38" rx="4" fill="#0a1628"/>
  <text x="200" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#00b4d8">众智园AI自主创新加速区</text>
  <text x="450" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">192.1 ha</text>
  <text x="650" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52b788">高（官方文字值）</text>
  <rect x="50" y="340" width="700" height="38" rx="4" fill="#15052e"/>
  <text x="200" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c77dff">北京AI原点社区</text>
  <text x="450" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">104.3 ha</text>
  <text x="650" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52b788">高（官方文字值）</text>
  <rect x="50" y="378" width="700" height="38" rx="4" fill="#1e1000"/>
  <text x="200" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f77f00">大钟寺AI产业聚集区</text>
  <text x="450" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">72.0 ha</text>
  <text x="650" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52b788">高（官方文字值）</text>
  <!-- Disclaimer -->
  <rect x="50" y="435" width="700" height="60" rx="6" fill="#1a1a00" stroke="#888800" stroke-width="1"/>
  <text x="400" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cccc00">数据说明</text>
  <text x="400" y="478" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaaa66">三项核心视觉指标（面积/绿地率/公共空间率）基于临时粗略边界计算，为设计模型目标值，置信度中低。</text>
  <text x="400" y="492" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#aaaa66">官方精确边界及控规发布后，所有指标须重新复算替换。容积率/建筑高度等依赖官方控规，暂标为unknown。</text>
  <text x="400" y="582" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555577">数据来源：北京市规划和自然资源委员会海淀分局公告（2026-05-09）；设计目标值基于临时几何</text>
</svg>