  <text x="400" y="582" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666688">概念方案用地结构，基于临时边界；正式数据到位后重新核算 | 来源：北京市规划和自然资源委员会海淀分局（2026-05-09）</text>
