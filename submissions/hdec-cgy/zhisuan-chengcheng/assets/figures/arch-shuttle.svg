<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrowNavy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0d3c53"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e07a5f"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#fbfdfc"/>

  <!-- 标题块 -->
  <text x="30" y="42" font-size="20" font-weight="700" fill="#0d3c53">智脊无人驾驶接驳环架构图</text>
  <text x="30" y="64" font-size="12" fill="#667085">端—边—云 · 人才流动</text>

  <!-- 云层 -->
  <rect x="60" y="84" width="880" height="120" rx="14" fill="#f4f7fa" stroke="#0d3c53" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="108" font-size="15" font-weight="700" fill="#0d3c53">云 · 接驳调度平台</text>
  <g>
    <rect x="90" y="128" width="260" height="56" rx="8" fill="#0d3c53"/>
    <text x="220" y="153" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">预约</text>
    <text x="220" y="172" font-size="11" fill="#cde0e9" text-anchor="middle">行程预约 · 停靠点管理</text>

    <rect x="370" y="128" width="260" height="56" rx="8" fill="#0d3c53"/>
    <text x="500" y="153" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">客流预测</text>
    <text x="500" y="172" font-size="11" fill="#cde0e9" text-anchor="middle">三核之间客流 · 高峰预判</text>

    <rect x="650" y="128" width="260" height="56" rx="8" fill="#0d3c53"/>
    <text x="780" y="153" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">轨道时刻表联动</text>
    <text x="780" y="172" font-size="11" fill="#cde0e9" text-anchor="middle">与清河站/大钟寺站联动</text>
  </g>

  <!-- 边层 -->
  <rect x="60" y="244" width="880" height="96" rx="14" fill="#f4f7fa" stroke="#087f72" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="268" font-size="15" font-weight="700" fill="#087f72">边 · 门户接驳站边缘计算</text>
  <g>
    <rect x="90" y="288" width="390" height="44" rx="8" fill="#087f72"/>
    <text x="285" y="315" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">低时延避障</text>
    <rect x="520" y="288" width="390" height="44" rx="8" fill="#087f72"/>
    <text x="715" y="315" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">停靠决策</text>
  </g>

  <!-- 端层 -->
  <rect x="60" y="380" width="880" height="96" rx="14" fill="#f4f7fa" stroke="#3a9d5d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="404" font-size="15" font-weight="700" fill="#3a9d5d">端 · 感知 / 执行</text>
  <g>
    <rect x="90" y="424" width="390" height="44" rx="8" fill="#3a9d5d"/>
    <text x="285" y="447" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">车端感知</text>
    <text x="285" y="462" font-size="10" fill="#eaf7f4" text-anchor="middle">激光雷达 · 毫米波雷达 · 摄像头</text>
    <rect x="520" y="424" width="390" height="44" rx="8" fill="#3a9d5d"/>
    <text x="715" y="447" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">路侧感知</text>
    <text x="715" y="462" font-size="10" fill="#eaf7f4" text-anchor="middle">RSU · 全息路口</text>
  </g>

  <!-- 上行箭头（数据） -->
  <line x1="110" y1="372" x2="110" y2="350" stroke="#0d3c53" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="110" y1="236" x2="110" y2="214" stroke="#0d3c53" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="130" y="366" font-size="11" fill="#667085">感知数据上行</text>
  <text x="130" y="230" font-size="11" fill="#667085">处理数据上行</text>

  <!-- 下行箭头（指令） -->
  <line x1="890" y1="214" x2="890" y2="236" stroke="#e07a5f" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="890" y1="350" x2="890" y2="372" stroke="#e07a5f" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="870" y="230" font-size="11" fill="#e07a5f" text-anchor="end">调度指令下行</text>
  <text x="870" y="366" font-size="11" fill="#e07a5f" text-anchor="end">控制指令下行</text>

  <!-- 数据闭环 -->
  <rect x="60" y="500" width="880" height="46" rx="8" fill="#e6f0ef" stroke="#d7dee8"/>
  <text x="80" y="528" font-size="13" font-weight="600" fill="#0d3c53">数据闭环</text>
  <text x="180" y="528" font-size="13" fill="#0d3c53">感知 → 定位 → 路径规划 → 控制 → 到站反馈 → 调度优化</text>

  <text x="950" y="654" font-size="11" fill="#999" text-anchor="end">概念示意</text>
</svg>
