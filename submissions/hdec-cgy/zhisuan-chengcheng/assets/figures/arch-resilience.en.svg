  <rect x="100" y="128" width="400" height="56" rx="8" fill="#0d3c53"/>
  <text x="300" y="153" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Cross-Agency Coordination</text>
  <text x="300" y="172" font-size="11" fill="#cde0e9" text-anchor="middle">Mobility · Emergency · Water Coordination</text>
  <rect x="500" y="128" width="400" height="56" rx="8" fill="#0d3c53"/>
  <text x="700" y="153" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Emergency Command</text>
  <text x="700" y="172" font-size="11" fill="#cde0e9" text-anchor="middle">Evacuation · Road Closure · Dispatch</text>

  <rect x="60" y="244" width="880" height="96" rx="14" fill="#f4f7fa" stroke="#087f72" stroke-width="1.5" stroke-dasharray="6 4"/>
