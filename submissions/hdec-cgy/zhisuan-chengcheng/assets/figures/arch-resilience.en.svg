  <rect x="60" y="380" width="880" height="96" rx="14" fill="#f4f7fa" stroke="#3a9d5d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="404" font-size="15" font-weight="700" fill="#3a9d5d">Device · Sense / Act</text>
  <rect x="100" y="424" width="800" height="44" rx="8" fill="#3a9d5d"/>
  <text x="500" y="447" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Air–Space–Ground–Water Sensor Network</text>
  <text x="500" y="462" font-size="10" fill="#eaf7f4" text-anchor="middle">Rainfall · Water Level · Footfall · Traffic</text>

  <line x1="110" y1="372" x2="110" y2="350" stroke="#0d3c53" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="110" y1="236" x2="110" y2="214" stroke="#0d3c53" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="130" y="366" font-size="11" fill="#667085">Monitoring Data Upload</text>
