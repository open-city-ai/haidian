  <line x1="890" y1="214" x2="890" y2="236" stroke="#e07a5f" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="890" y1="350" x2="890" y2="372" stroke="#e07a5f" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="870" y="230" font-size="11" fill="#e07a5f" text-anchor="end">Dispatch Commands</text>
  <text x="870" y="366" font-size="11" fill="#e07a5f" text-anchor="end">Response Commands</text>

  <rect x="60" y="500" width="880" height="46" rx="8" fill="#e6f0ef" stroke="#d7dee8"/>
  <text x="80" y="528" font-size="13" font-weight="600" fill="#0d3c53">Data Feedback Loop</text>
  <text x="180" y="528" font-size="13" fill="#0d3c53">Sense → Forecast → Review → Human Decision → Action Feedback</text>

  <text x="950" y="654" font-size="11" fill="#999" text-anchor="end">Concept Diagram</text>
