<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <rect width="960" height="780" fill="#fbfdfc"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#0d3c53">五类 AI+ 交通场景落位</text>
  <text x="30" y="66" font-size="12" fill="#667085">场景与一带三核的空间关系(概念示意,非精确底图)</text>

  <!-- 主脊 -->
  <rect x="450" y="90" width="60" height="620" fill="#e6f0ef" stroke="#087f72" stroke-width="2"/>
  <text x="480" y="400" font-size="12" fill="#087f72" text-anchor="middle" transform="rotate(-90 480 400)">京张主脊</text>

  <!-- 三环 -->
  <g stroke="#d9485f" stroke-width="2.5" opacity="0.7">
    <line x1="40" y1="180" x2="920" y2="180"/>
    <line x1="40" y1="380" x2="920" y2="380"/>
    <line x1="40" y1="590" x2="920" y2="590"/>
  </g>
  <text x="40" y="170" font-size="12" fill="#d9485f" font-weight="700">北五环</text>
  <text x="40" y="370" font-size="12" fill="#d9485f" font-weight="700">北四环</text>
  <text x="40" y="580" font-size="12" fill="#d9485f" font-weight="700">北三环</text>

  <!-- 三核 -->
  <g>
    <rect x="360" y="105" width="200" height="62" rx="10" fill="#087f72"/>
    <text x="460" y="132" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">众智园</text>
    <text x="460" y="154" font-size="11" fill="#d8fff7" text-anchor="middle">清河站门户 · 开放共赢·创新发展</text>

    <rect x="600" y="325" width="240" height="62" rx="10" fill="#18a38f"/>
    <text x="720" y="352" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">AI 原点社区</text>
    <text x="720" y="374" font-size="11" fill="#eaf7f4" text-anchor="middle">五道口·清华东路西口门户 · 强化优势·年轻图强</text>

    <rect x="390" y="545" width="220" height="62" rx="10" fill="#0d3c53"/>
    <text x="500" y="572" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">大钟寺</text>
    <text x="500" y="594" font-size="11" fill="#cde0e9" text-anchor="middle">大钟寺站门户 · 要素集聚·生态协同</text>
  </g>

  <!-- 五场景点位 -->
  <g>
    <circle cx="460" cy="88" r="16" fill="#f4a93a" stroke="#fff" stroke-width="2.5"/>
    <text x="460" y="94" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="488" y="92" font-size="13" font-weight="700" fill="#f4a93a">① 智脊无人驾驶接驳环(人才流动)</text>

    <circle cx="650" cy="305" r="16" fill="#7b61ff" stroke="#fff" stroke-width="2.5"/>
    <text x="650" y="311" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="678" y="309" font-size="13" font-weight="700" fill="#7b61ff">② 无人配送"最后一公里"</text>

    <circle cx="460" cy="470" r="16" fill="#22b8cf" stroke="#fff" stroke-width="2.5"/>
    <text x="460" y="476" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="488" y="474" font-size="13" font-weight="700" fill="#22b8cf">③ 车路协同精准公交(13号线走廊)</text>

    <circle cx="700" cy="415" r="16" fill="#3a9d5d" stroke="#fff" stroke-width="2.5"/>
    <text x="700" y="421" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="728" y="419" font-size="13" font-weight="700" fill="#3a9d5d">④ AI 慢行导航 + MaaS</text>

    <circle cx="460" cy="690" r="16" fill="#d9485f" stroke="#fff" stroke-width="2.5"/>
    <text x="460" y="696" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="488" y="694" font-size="13" font-weight="700" fill="#d9485f">⑤ 大客流/暴雨韧性切换(数字孪生)</text>
  </g>

  <text x="30" y="740" font-size="11" fill="#667085">五场景对应第 9 节;数据最小化 · 可解释 · 人工复核 · 明确运营主体</text>
  <text x="940" y="772" font-size="11" fill="#999" text-anchor="end">概念示意 · 待官方边界精调</text>
</svg>
