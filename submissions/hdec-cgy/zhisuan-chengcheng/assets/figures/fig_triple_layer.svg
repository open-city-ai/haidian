<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#fbfdfc"/>
<text x="28" y="32" font-size="15" font-weight="700" fill="#0b3b57">地下—地面—高架三层复合轨道线路分布（竖向断面）</text>
<text x="28" y="50" font-size="11" fill="#5b6b72">京张高铁入地、13 号线上天，叠加地面公园绿廊，形成“地下—地面—高架”三层复合体系，竖向衔接复杂</text>

<!-- elevation bands -->
<rect x="60" y="92" width="640" height="300" fill="#f4faf9" stroke="#e2e8ec" rx="10"/>
<!-- underground -->
<rect x="60" y="300" width="640" height="92" fill="#eaf1fb" stroke="#2f6bff" stroke-width="1.5"/>
<text x="74" y="320" font-size="11" font-weight="700" fill="#2f6bff">地下层 · 京张高铁（入地）</text>
<rect x="120" y="330" width="520" height="34" rx="17" fill="#2f6bff" opacity="0.85"/>
<rect x="150" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<rect x="210" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<rect x="270" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<rect x="330" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<rect x="390" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<rect x="450" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<rect x="510" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<rect x="570" y="338" width="40" height="18" rx="6" fill="#dbeafe"/>
<!-- ground -->
<rect x="60" y="206" width="640" height="94" fill="#eefcf4" stroke="#14b8a6" stroke-width="1.5"/>
<text x="74" y="226" font-size="11" font-weight="700" fill="#0b5750">地面层 · 遗址公园绿廊 + 城市道路</text>
<rect x="90" y="250" width="560" height="20" rx="10" fill="#cfeee6"/>
<circle cx="130" cy="244" r="7" fill="#16a34a"/><circle cx="200" cy="244" r="7" fill="#16a34a"/>
<circle cx="270" cy="244" r="7" fill="#16a34a"/><circle cx="340" cy="244" r="7" fill="#16a34a"/>
<circle cx="410" cy="244" r="7" fill="#16a34a"/><circle cx="480" cy="244" r="7" fill="#16a34a"/>
<circle cx="550" cy="244" r="7" fill="#16a34a"/><circle cx="620" cy="244" r="7" fill="#16a34a"/>
<text x="74" y="292" font-size="10" fill="#0b5750">公园绿廊（连续慢行 + 生态）</text>
<!-- elevated -->
<rect x="60" y="92" width="640" height="94" fill="#e7f6f4" stroke="#0f766e" stroke-width="1.5"/>
<text x="74" y="112" font-size="11" font-weight="700" fill="#0f766e">高架层 · 13 号线（上天）</text>
<rect x="100" y="140" width="560" height="16" rx="8" fill="#0f766e" opacity="0.85"/>
<rect x="120" y="146" width="520" height="3" fill="#0b5750"/>
<rect x="150" y="124" width="40" height="14" rx="4" fill="#bdf0e8"/>
<rect x="230" y="124" width="40" height="14" rx="4" fill="#bdf0e8"/>
<rect x="310" y="124" width="40" height="14" rx="4" fill="#bdf0e8"/>
<rect x="390" y="124" width="40" height="14" rx="4" fill="#bdf0e8"/>
<rect x="470" y="124" width="40" height="14" rx="4" fill="#bdf0e8"/>
<rect x="550" y="124" width="40" height="14" rx="4" fill="#bdf0e8"/>
<!-- piers -->
<g stroke="#0f766e" stroke-width="3">
  <line x1="160" y1="156" x2="160" y2="206"/>
  <line x1="320" y1="156" x2="320" y2="206"/>
  <line x1="480" y1="156" x2="480" y2="206"/>
  <line x1="640" y1="156" x2="640" y2="206"/>
</g>

<!-- vertical dimension labels -->
<g font-size="10" fill="#5b6b72" text-anchor="middle">
  <text x="44" y="140">高架</text>
  <text x="44" y="254">地面</text>
  <text x="44" y="348">地下</text>
</g>
<line x1="48" y1="100" x2="48" y2="388" stroke="#94a3a8" stroke-width="1"/>
<line x1="44" y1="100" x2="52" y2="100" stroke="#94a3a8"/>
<line x1="44" y1="206" x2="52" y2="206" stroke="#94a3a8"/>
<line x1="44" y1="300" x2="52" y2="300" stroke="#94a3a8"/>
<line x1="44" y1="388" x2="52" y2="388" stroke="#94a3a8"/>

<!-- people flow arrows (transfer) -->
<g stroke="#be123c" stroke-width="2" fill="none">
  <path d="M360 156 C 360 180, 360 188, 360 206" marker-end="url(#ah)"/>
  <path d="M380 206 C 380 240, 380 280, 380 300" marker-end="url(#ah)"/>
</g>
<defs>
  <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0 0 L8 4 L0 8 z" fill="#be123c"/>
  </marker>
</defs>
<text x="392" y="180" font-size="10" fill="#be123c" font-weight="700">竖向换乘 / 疏散</text>
<text x="392" y="280" font-size="10" fill="#be123c" font-weight="700">人车流耦合</text>

<!-- note: 7 sections -->
<g transform="translate(60,402)">
  <rect x="0" y="0" width="640" height="22" rx="6" fill="#eefcf9" stroke="#14b8a6"/>
  <text x="10" y="15" font-size="10.5" fill="#0b5750">7 种典型竖向断面（大钟寺 / 知春路 / 五道口等位于多层交通耦合节点）· 换乘、疏散、管线避让构成新的复杂性</text>
</g>
</svg>
