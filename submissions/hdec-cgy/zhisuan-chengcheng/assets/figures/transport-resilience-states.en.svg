<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="400" fill="#fbfdfc"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0d3c53">Mobility Resilience: Normal → Watch → Load Limit → Emergency → Recovery</text>
  <text x="30" y="62" font-size="12" fill="#667085">Triggered by observable indicators and linked to water-safety forecasting; humans approve evacuation, closures and dispatch</text>
<g>
    <circle cx="150" cy="230" r="66" fill="#e6f0ef" stroke="#087f72" stroke-width="3"/>
    <text x="150" y="222" font-size="15" fill="#087f72" text-anchor="middle" font-weight="700">Normal</text>
    <text x="150" y="244" font-size="11" fill="#667085" text-anchor="middle">Normal Operations</text>

    <circle cx="330" cy="230" r="66" fill="#fef7e6" stroke="#f4a93a" stroke-width="3"/>
    <text x="330" y="222" font-size="15" fill="#b97800" text-anchor="middle" font-weight="700">Watch</text>
    <text x="330" y="244" font-size="11" fill="#667085" text-anchor="middle">Flow / Water Deviation</text>

    <circle cx="510" cy="230" r="66" fill="#fdeee6" stroke="#e07a5f" stroke-width="3"/>
    <text x="510" y="222" font-size="15" fill="#c0562b" text-anchor="middle" font-weight="700">Load Limit</text>
    <text x="510" y="244" font-size="11" fill="#667085" text-anchor="middle">Degrade + More Shuttles</text>

    <circle cx="690" cy="230" r="66" fill="#fdeaea" stroke="#d9485f" stroke-width="3"/>
    <text x="690" y="222" font-size="15" fill="#b3261e" text-anchor="middle" font-weight="700">Emergency</text>
    <text x="690" y="244" font-size="11" fill="#667085" text-anchor="middle">Isolate + Node Takeover</text>

    <circle cx="870" cy="230" r="66" fill="#e8f1f8" stroke="#2b7db5" stroke-width="3"/>
    <text x="870" y="222" font-size="15" fill="#1f5f8b" text-anchor="middle" font-weight="700">Recovery</text>
    <text x="870" y="244" font-size="11" fill="#667085" text-anchor="middle">Phased Recovery</text>
  </g>
<g stroke="#0d3c53" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d3c53"/></marker></defs>
    <line x1="216" y1="230" x2="262" y2="230"/>
    <line x1="396" y1="230" x2="442" y2="230"/>
    <line x1="576" y1="230" x2="622" y2="230"/>
    <line x1="756" y1="230" x2="802" y2="230"/>
  </g>
<path d="M870,300 C690,340 330,340 150,300" stroke="#2b7db5" stroke-width="2" fill="none" stroke-dasharray="7 5"/>
  <text x="510" y="360" font-size="11" fill="#2b7db5" text-anchor="middle">Return to normal after checking power, structure, cooling, data integrity and user return</text>
<g font-size="11" fill="#667085">
    <text x="150" y="320" text-anchor="middle">—</text>
    <text x="330" y="320" text-anchor="middle">Trigger: Water alert escalates</text>
    <text x="510" y="320" text-anchor="middle">Trigger: Local disruption</text>
    <text x="690" y="320" text-anchor="middle">Trigger: Flooding alert</text>
  </g>

  <text x="930" y="394" font-size="11" fill="#999" text-anchor="end">Concept diagram · Digital-twin simulation; AI advises, humans decide</text>
</svg>
