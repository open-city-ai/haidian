<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="400" fill="#fbfdfc"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0d3c53">交通韧性切换:常态 → 关注态 → 限载态 → 应急态 → 恢复态</text>
  <text x="30" y="62" font-size="12" fill="#667085">以可观测指标触发,与 4.5 节水安全"四预"衔接;疏散/封路/调度由人确认</text>

  <!-- 五态圆环 -->
  <g>
    <circle cx="150" cy="230" r="66" fill="#e6f0ef" stroke="#087f72" stroke-width="3"/>
    <text x="150" y="222" font-size="15" fill="#087f72" text-anchor="middle" font-weight="700">常态</text>
    <text x="150" y="244" font-size="11" fill="#667085" text-anchor="middle">常态运行</text>

    <circle cx="330" cy="230" r="66" fill="#fef7e6" stroke="#f4a93a" stroke-width="3"/>
    <text x="330" y="222" font-size="15" fill="#b97800" text-anchor="middle" font-weight="700">关注态</text>
    <text x="330" y="244" font-size="11" fill="#667085" text-anchor="middle">客流/水位偏离</text>

    <circle cx="510" cy="230" r="66" fill="#fdeee6" stroke="#e07a5f" stroke-width="3"/>
    <text x="510" y="222" font-size="15" fill="#c0562b" text-anchor="middle" font-weight="700">限载态</text>
    <text x="510" y="244" font-size="11" fill="#667085" text-anchor="middle">降级 + 接驳加密</text>

    <circle cx="690" cy="230" r="66" fill="#fdeaea" stroke="#d9485f" stroke-width="3"/>
    <text x="690" y="222" font-size="15" fill="#b3261e" text-anchor="middle" font-weight="700">应急态</text>
    <text x="690" y="244" font-size="11" fill="#667085" text-anchor="middle">隔离 + 跨节点接管</text>

    <circle cx="870" cy="230" r="66" fill="#e8f1f8" stroke="#2b7db5" stroke-width="3"/>
    <text x="870" y="222" font-size="15" fill="#1f5f8b" text-anchor="middle" font-weight="700">恢复态</text>
    <text x="870" y="244" font-size="11" fill="#667085" text-anchor="middle">分阶段恢复</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#0d3c53" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d3c53"/></marker></defs>
    <line x1="216" y1="230" x2="262" y2="230"/>
    <line x1="396" y1="230" x2="442" y2="230"/>
    <line x1="576" y1="230" x2="622" y2="230"/>
    <line x1="756" y1="230" x2="802" y2="230"/>
  </g>

  <!-- 恢复回到常态 -->
  <path d="M870,300 C690,340 330,340 150,300" stroke="#2b7db5" stroke-width="2" fill="none" stroke-dasharray="7 5"/>
  <text x="510" y="360" font-size="11" fill="#2b7db5" text-anchor="middle">恢复后回到常态(检查供电、结构、冷却、数据完整性与人才/企业回流)</text>

  <!-- 触发条件 -->
  <g font-size="11" fill="#667085">
    <text x="150" y="320" text-anchor="middle">—</text>
    <text x="330" y="320" text-anchor="middle">触发:关键要素/水位预警升级</text>
    <text x="510" y="320" text-anchor="middle">触发:局部冲击,需保核心</text>
    <text x="690" y="320" text-anchor="middle">触发:极端天气/内涝/告警</text>
  </g>

  <text x="930" y="394" font-size="11" fill="#999" text-anchor="end">概念示意 · 数字孪生推演,AI 仅输出建议、人做决定</text>
</svg>
