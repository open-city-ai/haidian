<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrowNavy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0d3c53"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e07a5f"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#fbfdfc"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#0d3c53">大客流与暴雨韧性切换架构图</text>
  <text x="30" y="64" font-size="12" fill="#667085">端—边—云</text>

  <rect x="60" y="84" width="880" height="120" rx="14" fill="#f4f7fa" stroke="#0d3c53" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="108" font-size="15" font-weight="700" fill="#0d3c53">云 · 城市运行/交通/应急联动平台</text>
  <rect x="100" y="128" width="400" height="56" rx="8" fill="#0d3c53"/>
  <text x="300" y="153" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">跨部门联动</text>
  <text x="300" y="172" font-size="11" fill="#cde0e9" text-anchor="middle">交通 · 应急 · 水务协同</text>
  <rect x="500" y="128" width="400" height="56" rx="8" fill="#0d3c53"/>
  <text x="700" y="153" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">应急指挥</text>
  <text x="700" y="172" font-size="11" fill="#cde0e9" text-anchor="middle">疏散 · 封路 · 调度</text>

  <rect x="60" y="244" width="880" height="96" rx="14" fill="#f4f7fa" stroke="#087f72" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="268" font-size="15" font-weight="700" fill="#087f72">边 · 众智园城市推理中心</text>
  <rect x="100" y="288" width="800" height="44" rx="8" fill="#087f72"/>
  <text x="500" y="315" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">多智能体"四预"闭环</text>

  <rect x="60" y="380" width="880" height="96" rx="14" fill="#f4f7fa" stroke="#3a9d5d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="404" font-size="15" font-weight="700" fill="#3a9d5d">端 · 感知 / 执行</text>
  <rect x="100" y="424" width="800" height="44" rx="8" fill="#3a9d5d"/>
  <text x="500" y="447" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">天空地水工感知网</text>
  <text x="500" y="462" font-size="10" fill="#eaf7f4" text-anchor="middle">雨量 · 水位 · 客流 · 路况</text>

  <line x1="110" y1="372" x2="110" y2="350" stroke="#0d3c53" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <line x1="110" y1="236" x2="110" y2="214" stroke="#0d3c53" stroke-width="2" marker-end="url(#arrowNavy)"/>
  <text x="130" y="366" font-size="11" fill="#667085">监测数据上行</text>
  <text x="130" y="230" font-size="11" fill="#667085">四预结果上行</text>
  <line x1="890" y1="214" x2="890" y2="236" stroke="#e07a5f" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="890" y1="350" x2="890" y2="372" stroke="#e07a5f" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="870" y="230" font-size="11" fill="#e07a5f" text-anchor="end">调度指令下行</text>
  <text x="870" y="366" font-size="11" fill="#e07a5f" text-anchor="end">处置指令下行</text>

  <rect x="60" y="500" width="880" height="46" rx="8" fill="#e6f0ef" stroke="#d7dee8"/>
  <text x="80" y="528" font-size="13" font-weight="600" fill="#0d3c53">数据闭环</text>
  <text x="180" y="528" font-size="13" fill="#0d3c53">感知 → 四预 → 复盘 → 人工决策 → 执行反馈</text>

  <text x="950" y="654" font-size="11" fill="#999" text-anchor="end">概念示意</text>
</svg>
