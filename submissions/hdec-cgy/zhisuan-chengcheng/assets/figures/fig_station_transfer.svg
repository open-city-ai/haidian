<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#fbfdfc"/>
<text x="28" y="32" font-size="15" font-weight="700" fill="#0b3b57">城市轨道与站点换乘关系</text>
<text x="28" y="50" font-size="11" fill="#5b6b72">13 号线（高架）与京张高铁（入地 / 隧道 / U 型槽）交织，西直门—大钟寺—知春路—五道口—清华东路西口—学院南路等站点换乘关系复杂</text>

<rect x="28" y="78" width="704" height="300" rx="10" fill="#f4faf9" stroke="#e2e8ec"/>

<!-- 13号线 (elevated, teal solid) -->
<path d="M60 150 C 200 130, 320 175, 440 150 S 640 130, 700 160" fill="none" stroke="#0f766e" stroke-width="3.5"/>
<text x="64" y="120" font-size="11" font-weight="700" fill="#0f766e">13 号线（高架）</text>
<!-- 京张高铁 (underground, blue dashed) -->
<path d="M60 300 C 200 320, 320 280, 440 305 S 640 325, 700 295" fill="none" stroke="#2f6bff" stroke-width="3" stroke-dasharray="8 5"/>
<text x="64" y="340" font-size="11" font-weight="700" fill="#2f6bff">京张高铁（入地 / 隧道 / U 型槽）</text>

<!-- stations on 13号线 -->
<g>
  <circle cx="120" cy="146" r="7" fill="#0f766e"/><text x="120" y="132" font-size="9.5" fill="#1f2a30" text-anchor="middle">西直门</text>
  <circle cx="270" cy="156" r="8" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="270" y="138" font-size="9.5" fill="#1f2a30" text-anchor="middle">大钟寺</text>
  <circle cx="420" cy="150" r="8" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="420" y="136" font-size="9.5" fill="#1f2a30" text-anchor="middle">知春路</text>
  <circle cx="560" cy="148" r="8" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="560" y="134" font-size="9.5" fill="#1f2a30" text-anchor="middle">五道口</text>
  <circle cx="680" cy="158" r="7" fill="#0f766e"/><text x="680" y="144" font-size="9.5" fill="#1f2a30" text-anchor="middle">学院南路</text>
</g>
<!-- stations on 京张高铁 -->
<g>
  <circle cx="120" cy="300" r="7" fill="#2f6bff"/>
  <circle cx="270" cy="304" r="8" fill="#fff" stroke="#2f6bff" stroke-width="3"/>
  <circle cx="420" cy="300" r="8" fill="#fff" stroke="#2f6bff" stroke-width="3"/>
  <circle cx="560" cy="303" r="8" fill="#fff" stroke="#2f6bff" stroke-width="3"/>
  <circle cx="680" cy="298" r="7" fill="#2f6bff"/>
</g>

<!-- transfer connectors (problem stations) -->
<g stroke="#be123c" stroke-width="2" fill="none">
  <line x1="270" y1="156" x2="270" y2="304"/>
  <line x1="420" y1="150" x2="420" y2="300"/>
  <line x1="560" y1="148" x2="560" y2="303"/>
</g>
<!-- warning markers -->
<g fill="#be123c">
  <circle cx="270" cy="230" r="10"/>
  <circle cx="420" cy="225" r="10"/>
  <circle cx="560" cy="226" r="10"/>
</g>
<g fill="#fff" font-size="11" font-weight="700" text-anchor="middle">
  <text x="270" y="234">!</text><text x="420" y="229">!</text><text x="560" y="230">!</text>
</g>
<text x="600" y="234" font-size="10" fill="#be123c" font-weight="700">换乘不畅</text>

<!-- 清华东路西口 note -->
<text x="430" y="345" font-size="9.5" fill="#be123c">大钟寺 / 知春路 / 五道口 / 清华东路西口：出入口少、慢行衔接差、桥下违停干扰</text>

<!-- legend -->
<g font-size="10.5" fill="#1f2a30">
  <line x1="28" y1="398" x2="50" y2="398" stroke="#0f766e" stroke-width="3.5"/>
  <text x="56" y="402">13 号线（高架）</text>
  <line x1="200" y1="398" x2="222" y2="398" stroke="#2f6bff" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="228" y="402">京张高铁（入地）</text>
  <line x1="380" y1="398" x2="400" y2="398" stroke="#be123c" stroke-width="2"/>
  <text x="406" y="402">换乘节点（问题）</text>
</g>
</svg>
