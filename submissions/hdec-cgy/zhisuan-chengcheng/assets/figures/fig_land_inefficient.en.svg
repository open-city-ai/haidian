<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<defs>
  <pattern id="win" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#e6f7f4"/>
    <rect x="3" y="3" width="6" height="6" fill="#9fe3da"/>
  </pattern>
  <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="9" height="9" fill="#fde8e8"/>
    <line x1="0" y1="0" x2="0" y2="9" stroke="#f3b6b6" stroke-width="2"/>
  </pattern>
</defs>
<rect width="760" height="430" fill="#fbfdfc"/>

<text x="28" y="32" font-size="15" font-weight="700" fill="#0b5750">Corridor Land Use: Realized Potential and Existing Inefficiency</text>
<text x="28" y="50" font-size="11" fill="#5b6b72">High-quality industry demand to the north and inefficient land to the south form a mismatch along the green corridor</text>
<text x="28" y="80" font-size="12" font-weight="700" fill="#0f766e">▲ High-Quality Demand (Potential Realized)</text>
<g stroke="#0f766e" stroke-width="1.5">
  <rect x="48" y="94" width="92" height="64" rx="4" fill="url(#win)"/>
  <rect x="156" y="90" width="92" height="68" rx="4" fill="url(#win)"/>
  <rect x="264" y="98" width="92" height="60" rx="4" fill="url(#win)"/>
  <rect x="372" y="92" width="92" height="66" rx="4" fill="url(#win)"/>
</g>
<text x="48" y="178" font-size="10.5" fill="#1f2a30">AI Innovation Belt</text>
<text x="156" y="178" font-size="10.5" fill="#1f2a30">High-Quality Industry</text>
<text x="264" y="178" font-size="10.5" fill="#1f2a30">Contiguous Parcels</text>
<text x="372" y="178" font-size="10.5" fill="#1f2a30">Mixed Uses</text>
<text x="486" y="108" font-size="13" font-weight="700" fill="#0f766e">Land Value ↑</text>
<text x="486" y="128" font-size="11" fill="#5b6b72">Demand for Quality Uses</text>
<text x="486" y="144" font-size="11" fill="#5b6b72">Clustered Along Corridor</text>
<rect x="28" y="206" width="704" height="54" rx="10" fill="#d9f2ee" stroke="#14b8a6" stroke-width="1.5"/>
<line x1="40" y1="221" x2="720" y2="221" stroke="#0f766e" stroke-width="3"/>
<line x1="40" y1="245" x2="720" y2="245" stroke="#2f6bff" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="48" y="216" font-size="10" fill="#0b5750" font-weight="700">Elevated Line 13</text>
<text x="48" y="240" font-size="10" fill="#2f6bff" font-weight="700">Underground Jingzhang HSR</text>
<text x="430" y="240" font-size="12" font-weight="700" fill="#0b5750">Jingzhang Railway Heritage Park Green Corridor</text>
<g fill="#0b5750" font-size="9.5" text-anchor="middle">
  <circle cx="120" cy="206" r="3" fill="#0f766e"/><text x="120" y="200">Xizhimen</text>
  <circle cx="280" cy="206" r="3" fill="#0f766e"/><text x="280" y="200">Dazhongsi</text>
  <circle cx="440" cy="206" r="3" fill="#0f766e"/><text x="440" y="200">Zhichun Road</text>
  <circle cx="600" cy="206" r="3" fill="#0f766e"/><text x="600" y="200">Wudaokou</text>
  <circle cx="700" cy="206" r="3" fill="#0f766e"/><text x="700" y="200">Qinghua East Road</text>
</g>
<text x="28" y="298" font-size="12" font-weight="700" fill="#be123c">▼ Existing Inefficiency (Renewal Lag Δt)</text>
<g stroke="#be123c" stroke-width="1.5">
  <rect x="48" y="310" width="92" height="60" rx="4" fill="url(#hatch)"/>
  <rect x="156" y="306" width="92" height="64" rx="4" fill="url(#hatch)"/>
</g>
<g stroke="#b45309" stroke-width="1.5">
  <rect x="264" y="314" width="92" height="56" rx="4" fill="#fef3e2"/>
  <rect x="372" y="310" width="92" height="60" rx="4" fill="#fef3e2"/>
</g>
<text x="48" y="388" font-size="10.5" fill="#1f2a30">Inefficient Market</text>
<text x="156" y="388" font-size="10.5" fill="#1f2a30">Aging Commerce</text>
<text x="264" y="388" font-size="10.5" fill="#1f2a30">Temporary Buildings</text>
<text x="372" y="388" font-size="10.5" fill="#1f2a30">Informal / Derelict Land</text>
<text x="486" y="324" font-size="13" font-weight="700" fill="#be123c">Spatial Quality ↓</text>
<text x="486" y="344" font-size="11" fill="#5b6b72">Renewal Lag / Uses</text>
<text x="486" y="360" font-size="11" fill="#5b6b72">Persisting Inefficiency</text>
<path d="M300 172 C 300 200, 230 250, 230 306" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="6 5"/>
<text x="206" y="244" font-size="11" font-weight="700" fill="#be123c" transform="rotate(-90 206 244)">Potential–Existing Mismatch</text>
<g font-size="10.5" fill="#1f2a30">
  <rect x="28" y="404" width="14" height="10" fill="url(#win)" stroke="#0f766e"/>
  <text x="48" y="413">Quality Demand</text>
  <rect x="200" y="404" width="14" height="10" fill="url(#hatch)" stroke="#be123c"/>
  <text x="220" y="413">Inefficient Land</text>
  <rect x="360" y="404" width="14" height="10" fill="#d9f2ee" stroke="#14b8a6"/>
  <text x="380" y="413">Dual-Rail Greenway</text>
</g>
</svg>
