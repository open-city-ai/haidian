<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#fbfdfc"/>
<text x="28" y="32" font-size="15" font-weight="700" fill="#0b5750">教育科研用地分布与院校边界（72% 背向公园）</text>
<text x="28" y="50" font-size="11" fill="#5b6b72">沿线 45% 为教育科研用地；院校以围墙 / 栅栏面向廊道，空间封闭、更新主体分散（示意）</text>

<!-- map panel -->
<rect x="28" y="78" width="704" height="300" rx="10" fill="#f4faf9" stroke="#e2e8ec"/>

<!-- corridor -->
<rect x="28" y="300" width="704" height="40" fill="#d9f2ee" stroke="#14b8a6" stroke-width="1.5"/>
<line x1="28" y1="312" x2="732" y2="312" stroke="#0f766e" stroke-width="2.5"/>
<line x1="28" y1="328" x2="732" y2="328" stroke="#2f6bff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="36" y="296" font-size="9.5" fill="#0b5750" font-weight="700">13 号线高架 / 京张高铁入地（廊道）</text>
<g fill="#0b5750" font-size="9.5" text-anchor="middle" font-weight="700">
  <text x="120" y="292">西直门</text><text x="280" y="292">大钟寺</text>
  <text x="440" y="292">知春路</text><text x="600" y="292">五道口</text><text x="700" y="292">清华东路</text>
</g>

<!-- 7 街镇 boundary -->
<line x1="404" y1="90" x2="404" y2="296" stroke="#94a3a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="404" y="104" font-size="9.5" fill="#64748b" text-anchor="middle" transform="rotate(-90 404 104)">行政边界 × 7 街镇</text>

<!-- institutions -->
<g font-size="9.5" text-anchor="middle">
  <!-- B1 back -->
  <rect x="50" y="120" width="80" height="74" rx="4" fill="#eef2f4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="90" y="162" fill="#1f2a30">院校 A</text>
  <line x1="90" y1="194" x2="90" y2="300" stroke="#94a3a8" stroke-width="6"/>
  <text x="90" y="206" font-size="8.5" fill="#64748b">背向·围墙</text>
  <!-- B2 front -->
  <rect x="170" y="112" width="80" height="82" rx="4" fill="#eef2f4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="210" y="156" fill="#1f2a30">院校 B</text>
  <line x1="210" y1="194" x2="210" y2="300" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="210" y="206" font-size="8.5" fill="#16a34a">面向·开放</text>
  <!-- B3 back -->
  <rect x="290" y="124" width="80" height="70" rx="4" fill="#eef2f4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="330" y="164" fill="#1f2a30">院校 C</text>
  <line x1="330" y1="194" x2="330" y2="300" stroke="#94a3a8" stroke-width="6"/>
  <text x="330" y="206" font-size="8.5" fill="#64748b">背向·围墙</text>
  <!-- B4 back -->
  <rect x="440" y="118" width="80" height="76" rx="4" fill="#eef2f4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="480" y="160" fill="#1f2a30">院校 D</text>
  <line x1="480" y1="194" x2="480" y2="300" stroke="#94a3a8" stroke-width="6"/>
  <text x="480" y="206" font-size="8.5" fill="#64748b">背向·围墙</text>
  <!-- B5 front -->
  <rect x="560" y="122" width="80" height="72" rx="4" fill="#eef2f4" stroke="#0f766e" stroke-width="1.5"/>
  <text x="600" y="162" fill="#1f2a30">院校 E</text>
  <line x1="600" y1="194" x2="600" y2="300" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="600" y="206" font-size="8.5" fill="#16a34a">面向·开放</text>
</g>

<!-- info card -->
<g transform="translate(648,96)">
  <rect x="0" y="0" width="78" height="120" rx="8" fill="#fff" stroke="#e2e8ec"/>
  <text x="10" y="22" font-size="10" fill="#5b6b72">科研院校</text>
  <text x="10" y="42" font-size="20" font-weight="800" fill="#0b5750">18 处</text>
  <rect x="10" y="56" width="58" height="14" fill="#94a3a8"/>
  <rect x="10" y="56" width="42" height="14" fill="#be123c"/>
  <text x="10" y="86" font-size="10" fill="#be123c" font-weight="700">72% 背向公园</text>
  <text x="10" y="104" font-size="9" fill="#5b6b72">45% 教育科研用地</text>
</g>

<!-- legend -->
<g font-size="10.5" fill="#1f2a30">
  <rect x="28" y="392" width="14" height="10" fill="#eef2f4" stroke="#0f766e"/>
  <text x="48" y="401">院校地块</text>
  <rect x="148" y="392" width="14" height="10" fill="#94a3a8"/>
  <text x="168" y="401">背向·围墙封闭</text>
  <rect x="300" y="392" width="14" height="10" fill="#16a34a"/>
  <text x="320" y="401">面向·开放共享</text>
  <line x1="470" y1="397" x2="488" y2="397" stroke="#94a3a8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="494" y="401">行政边界</text>
</g>
</svg>
