<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#fbfdfc"/>
<text x="28" y="32" font-size="15" font-weight="700" fill="#0b3b57">研究范围道路系统与东西向通道（被廊道切割）</text>
<text x="28" y="50" font-size="11" fill="#5b6b72">铁路 / 轨道 / 转河 / 快速路共同构成东西向隔断；路网密度 5.72 &lt; 8，断头路 30 处、丁字路 64 处，跨廊道绕行成本高</text>

<rect x="28" y="78" width="704" height="300" rx="10" fill="#f4faf9" stroke="#e2e8ec"/>

<!-- corridor barrier (horizontal) -->
<rect x="28" y="218" width="704" height="34" fill="#d9f2ee" stroke="#14b8a6" stroke-width="1.5"/>
<line x1="28" y1="226" x2="732" y2="226" stroke="#0f766e" stroke-width="2.5"/>
<line x1="28" y1="244" x2="732" y2="244" stroke="#2f6bff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="36" y="214" font-size="9.5" fill="#0b5750" font-weight="700">双铁廊道 + 转河 + 快速路（东西向隔断）</text>

<!-- roads north of corridor -->
<g stroke="#cbd5e1" stroke-width="3" fill="none">
  <!-- horizontal roads (east-west) above -->
  <line x1="40" y1="110" x2="720" y2="110"/>
  <line x1="40" y1="150" x2="720" y2="150"/>
  <line x1="40" y1="185" x2="720" y2="185"/>
  <!-- vertical roads (north-south) that mostly STOP at corridor = 断头 -->
  <line x1="120" y1="110" x2="120" y2="205"/>
  <line x1="250" y1="150" x2="250" y2="205"/>
  <line x1="470" y1="110" x2="470" y2="205"/>
  <line x1="610" y1="150" x2="610" y2="205"/>
</g>
<!-- a through crossing road (green) -->
<line x1="360" y1="110" x2="360" y2="252" stroke="#16a34a" stroke-width="3"/>
<line x1="700" y1="150" x2="700" y2="252" stroke="#16a34a" stroke-width="3"/>

<!-- T-junctions (丁字路): vertical meets horizontal but no cross -->
<g stroke="#b45309" stroke-width="3" fill="none">
  <line x1="190" y1="110" x2="190" y2="150"/>
  <line x1="540" y1="150" x2="540" y2="185"/>
  <line x1="660" y1="110" x2="660" y2="150"/>
</g>

<!-- south roads -->
<g stroke="#cbd5e1" stroke-width="3" fill="none">
  <line x1="40" y1="300" x2="720" y2="300"/>
  <line x1="40" y1="340" x2="720" y2="340"/>
  <line x1="150" y1="252" x2="150" y2="300"/>
  <line x1="300" y1="252" x2="300" y2="340"/>
  <line x1="520" y1="252" x2="520" y2="300"/>
</g>
<g stroke="#b45309" stroke-width="3" fill="none">
  <line x1="220" y1="300" x2="220" y2="340"/>
  <line x1="430" y1="300" x2="430" y2="340"/>
</g>
<line x1="640" y1="252" x2="640" y2="340" stroke="#16a34a" stroke-width="3"/>

<!-- 断头 markers (red X at corridor edge) -->
<g stroke="#be123c" stroke-width="2">
  <line x1="114" y1="200" x2="126" y2="212"/><line x1="126" y1="200" x2="114" y2="212"/>
  <line x1="244" y1="200" x2="256" y2="212"/><line x1="256" y1="200" x2="244" y2="212"/>
  <line x1="464" y1="200" x2="476" y2="212"/><line x1="476" y1="200" x2="464" y2="212"/>
  <line x1="604" y1="200" x2="616" y2="212"/><line x1="616" y1="200" x2="604" y2="212"/>
  <line x1="144" y1="296" x2="156" y2="308"/><line x1="156" y1="296" x2="144" y2="308"/>
  <line x1="294" y1="336" x2="306" y2="348"/><line x1="306" y1="336" x2="294" y2="348"/>
  <line x1="514" y1="296" x2="526" y2="308"/><line x1="526" y1="296" x2="514" y2="308"/>
</g>

<!-- 绕行 arrow -->
<path d="M120 195 C 120 175, 360 175, 360 240" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="6 5"/>
<text x="200" y="165" font-size="10" fill="#be123c" font-weight="700">绕行</text>

<!-- legend -->
<g font-size="10.5" fill="#1f2a30">
  <line x1="28" y1="398" x2="50" y2="398" stroke="#cbd5e1" stroke-width="3"/>
  <text x="56" y="402">城市道路</text>
  <line x1="148" y1="398" x2="170" y2="398" stroke="#16a34a" stroke-width="3"/>
  <text x="176" y="402">贯通跨廊道</text>
  <line x1="290" y1="398" x2="312" y2="398" stroke="#b45309" stroke-width="3"/>
  <text x="318" y="402">丁字路</text>
  <path d="M430 394 l 6 -5 l 6 5 l -6 5 z" fill="none" stroke="#be123c"/>
  <text x="448" y="402">断头路</text>
</g>
</svg>
