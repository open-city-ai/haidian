<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="760" height="430" fill="#fbfdfc"/>
<text x="28" y="32" font-size="15" font-weight="700" fill="#0b5750">廊道沿线老旧临时建筑与低效地块分布</text>
<text x="28" y="50" font-size="11" fill="#5b6b72">西直门—大钟寺—知春路—五道口—清华东路等节点周边，低效图斑点状散布、难以成片整合</text>

<!-- map panel -->
<rect x="28" y="78" width="704" height="294" rx="10" fill="#f4faf9" stroke="#e2e8ec"/>
<!-- corridor -->
<rect x="28" y="232" width="704" height="34" fill="#d9f2ee" stroke="#14b8a6" stroke-width="1.5"/>
<line x1="28" y1="240" x2="732" y2="240" stroke="#0f766e" stroke-width="2.5"/>
<line x1="28" y1="258" x2="732" y2="258" stroke="#2f6bff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="36" y="227" font-size="9.5" fill="#0b5750" font-weight="700">13 号线高架 / 京张高铁入地（廊道）</text>

<!-- cluster ellipses -->
<ellipse cx="285" cy="140" rx="60" ry="46" fill="#fde8e8" opacity="0.5"/>
<ellipse cx="615" cy="142" rx="58" ry="46" fill="#fde8e8" opacity="0.5"/>
<ellipse cx="290" cy="330" rx="58" ry="40" fill="#fef3e2" opacity="0.5"/>

<!-- station labels -->
<g fill="#0b5750" font-size="9.5" text-anchor="middle" font-weight="700">
  <text x="120" y="222">西直门</text>
  <text x="280" y="222">大钟寺</text>
  <text x="440" y="222">知春路</text>
  <text x="600" y="222">五道口</text>
  <text x="700" y="222">清华东路</text>
</g>

