<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <!-- 京衡联锁带 Logo：人字岔口 + 接口符号 -->
  <!-- 轨线（钢轨灰） -->
  <line x1="40" y1="280" x2="240" y2="60" stroke="#4a4a4a" stroke-width="14" stroke-linecap="round"/>
  <line x1="440" y1="280" x2="240" y2="60" stroke="#4a4a4a" stroke-width="14" stroke-linecap="round"/>
  <line x1="40" y1="280" x2="440" y2="280" stroke="#4a4a4a" stroke-width="14" stroke-linecap="round"/>
  <!-- 轨线细线（铁轨感） -->
  <line x1="66" y1="280" x2="240" y2="84" stroke="#e8e8e8" stroke-width="4"/>
  <line x1="414" y1="280" x2="240" y2="84" stroke="#e8e8e8" stroke-width="4"/>
  <!-- 接口符号（海淀蓝绿） -->
  <rect x="205" y="30" width="70" height="70" rx="10" fill="#0f7490"/>
  <rect x="218" y="43" width="44" height="44" rx="5" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- 信号点（红黄） -->
  <circle cx="240" cy="110" r="12" fill="#d1495b"/>
  <circle cx="120" cy="280" r="9" fill="#e8a33d"/>
  <circle cx="360" cy="280" r="9" fill="#e8a33d"/>
  <!-- 文字 -->
  <text x="240" y="312" text-anchor="middle" font-family="SimHei, sans-serif" font-size="20" fill="#101827">京衡 · 联锁带</text>
</svg>
