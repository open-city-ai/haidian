<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-label="MICROLOOP logo: a robot silhouette on a loop track">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2f52"/>
      <stop offset="1" stop-color="#1f4e79"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="480" height="480" rx="90" fill="url(#bg)"/>
  <!-- loop track -->
  <circle cx="240" cy="240" r="178" fill="none" stroke="#0277bd" stroke-width="10" stroke-dasharray="22 14" stroke-linecap="round"/>
  <circle cx="240" cy="240" r="132" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <!-- hub dots on loop -->
  <circle cx="240" cy="62" r="14" fill="#d9480f"/>
  <circle cx="62" cy="240" r="14" fill="#d9480f"/>
  <circle cx="418" cy="240" r="14" fill="#d9480f"/>
  <circle cx="240" cy="418" r="14" fill="#d9480f"/>
  <!-- robot silhouette -->
  <g transform="translate(240,238)">
    <!-- body -->
    <rect x="-46" y="-14" width="92" height="62" rx="18" fill="#ffffff"/>
    <!-- head + antenna -->
    <rect x="-30" y="-52" width="60" height="38" rx="12" fill="#ffffff"/>
    <rect x="-4" y="-64" width="8" height="14" rx="4" fill="#ffffff"/>
    <circle cx="0" cy="-66" r="6" fill="#d9480f"/>
    <!-- eyes -->
    <circle cx="-14" cy="-34" r="7" fill="#0d2f52"/>
    <circle cx="14" cy="-34" r="7" fill="#0d2f52"/>
    <!-- screen -->
    <rect x="-14" y="-4" width="28" height="16" rx="3" fill="#0277bd" opacity="0.85"/>
    <!-- arms -->
    <circle cx="-58" cy="6" r="11" fill="#ffffff"/>
    <circle cx="58" cy="6" r="11" fill="#ffffff"/>
    <!-- wheels -->
    <circle cx="-28" cy="44" r="13" fill="#d9480f"/>
    <circle cx="28" cy="44" r="13" fill="#d9480f"/>
  </g>
  <!-- wordmark -->
  <text x="240" y="436" text-anchor="middle" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="4">MICROLOOP</text>
</svg>
