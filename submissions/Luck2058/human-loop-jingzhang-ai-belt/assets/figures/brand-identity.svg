    <circle cx="34" cy="24" r="20" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M34 10 L22 40" stroke="#E8833A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M34 10 L46 40" stroke="#E8833A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <text class="ff" x="34" y="60" font-size="10" fill="#FFFFFF" text-anchor="middle">反白 Reversed</text>
  </g>
  <text class="ff sm" x="758" y="344">禁止：拉伸变形、更换主色、旋转、添加投影　Prohibited: distort / recolour / rotate / shadow</text>

  <!-- ============ ROW 2 ============ -->
  <!-- Panel D: colour -->
