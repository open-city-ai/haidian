    <path d="M26 10 L12 44" stroke="#E8833A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M26 10 L40 44" stroke="#E8833A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <text class="fs" x="62" y="24" font-size="17" font-weight="700" fill="#1F3A5F">人字·回环</text>
    <text class="ff" x="62" y="42" font-size="11" fill="#6E8CA0">HUMAN-LOOP　JING-ZHANG AI BELT</text>
  </g>
  <text class="ff sm" x="766" y="212">横版 Horizontal — 用于文件页眉、网页导航</text>
  <!-- vertical lockup -->
  <g transform="translate(776,232)">
