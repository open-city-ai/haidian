  <text class="ff" x="758" y="490" font-size="16" fill="#22262B">以人为本的城市智能 Human-centred urban AI</text>
  <text class="ff en" x="758" y="506">Noto Sans SC — 正文与导视 / Body &amp; wayfinding · SIL OFL 1.1</text>
  <text x="758" y="536" font-size="15" fill="#22262B" font-family="'Noto Sans Mono','JetBrains Mono',monospace">0123456789 · 24.9 ha · 1.68</text>
  <text class="ff en" x="758" y="552">Noto Sans Mono — 数据标注 / Metrics · SIL OFL 1.1</text>
  <text class="ff sm" x="758" y="570">字体均为开源许可，未内嵌于本包，仅声明引用。</text>

