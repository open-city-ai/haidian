    <text class="ff en" x="454" y="503">#EFE7DA · 月台混凝土 platform</text>
    <text class="ff en" x="454" y="518">底纹 / 留白</text>

    <rect x="586" y="418" width="118" height="52" fill="#22262B"/>
    <text class="ff lb" x="586" y="488">墨黑 Ink Black</text>
    <text class="ff en" x="586" y="503">#22262B · 正文字色 body text</text>
    <text class="ff en" x="586" y="518">正文 / 线框</text>
  </g>
  <text class="ff sm" x="58" y="548">对比度：墨蓝底反白文字 ≥ 8.6:1；浅砂底墨黑文字 ≥ 12:1，满足 WCAG 2.1 AA 正文要求（自查值，需实测复核）。</text>
  <text class="ff en" x="58" y="566">Contrast ratios are agent-calculated and require physical verification before fabrication.</text>

  <!-- Panel E: typography -->
  <rect x="740" y="380" width="420" height="200" fill="#F7F4EF" stroke="#DED5C7"/>
  <text class="ff h2" x="758" y="406">E　字体系统 Typography（SIL OFL）</text>
