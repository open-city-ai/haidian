  <text class="ff h2" x="58" y="406">D　色彩体系 Colour System</text>
  <g>
    <rect x="58" y="418" width="118" height="52" fill="#1F3A5F"/>
    <text class="ff lb" x="58" y="488">京张墨蓝 Ink Blue</text>
    <text class="ff en" x="58" y="503">#1F3A5F · 钢轨与夜空 rail &amp; night</text>
    <text class="ff en" x="58" y="518">主色 / 底色 / 标题</text>

    <rect x="190" y="418" width="118" height="52" fill="#E8833A"/>
    <text class="ff lb" x="190" y="488">智脉暖橙 Warm Amber</text>
    <text class="ff en" x="190" y="503">#E8833A · 灯火与人本 warmth</text>
    <text class="ff en" x="190" y="518">强调 / 导视主色</text>

    <rect x="322" y="418" width="118" height="52" fill="#6E8CA0"/>
