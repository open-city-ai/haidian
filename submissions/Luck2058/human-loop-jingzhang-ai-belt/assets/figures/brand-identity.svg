    <path d="M26 10 L14 40" stroke="#E8833A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M26 10 L38 40" stroke="#E8833A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <text class="fs" x="26" y="64" font-size="13" font-weight="700" fill="#1F3A5F" text-anchor="middle">人字·回环</text>
    <text class="ff" x="26" y="78" font-size="8.5" fill="#6E8CA0" text-anchor="middle">HUMAN-LOOP</text>
  </g>
  <!-- monochrome + reversed -->
  <g transform="translate(890,232)">
    <circle cx="26" cy="24" r="20" fill="none" stroke="#22262B" stroke-width="4"/>
    <path d="M26 10 L14 40" stroke="#22262B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M26 10 L38 40" stroke="#22262B" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <text class="ff sm" x="26" y="64" text-anchor="middle">单色 Mono</text>
  </g>
  <g transform="translate(1000,222)">
