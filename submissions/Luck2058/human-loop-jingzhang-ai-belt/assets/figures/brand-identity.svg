<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="人字·回环 Human-Loop 品牌识别体系概念板 / Brand identity system concept board">
  <title>人字·回环 / Human-Loop — 品牌识别体系概念板 Brand Identity System (Concept Draft)</title>
  <desc>agent-generated provisional concept draft. Logo mark, construction logic, lockups, colour system, typography and application examples. Fonts are declared (SIL OFL) and not embedded.</desc>

  <defs>
    <style><![CDATA[
      .ff { font-family: 'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif; }
      .fs { font-family: 'Noto Serif SC','Source Han Serif SC','Songti SC',serif; }
      .h1 { font-size: 26px; font-weight: 700; fill: #1F3A5F; }
      .h2 { font-size: 15px; font-weight: 700; fill: #1F3A5F; }
      .lb { font-size: 12px; fill: #22262B; }
      .sm { font-size: 10.5px; fill: #5A6672; }
      .en { font-size: 10px; fill: #6E8CA0; }
      .wt { font-size: 11px; fill: #FFFFFF; }
    ]]></style>
  </defs>

  <rect width="1200" height="820" fill="#FFFFFF"/>

  <!-- ============ HEADER ============ -->
  <rect x="0" y="0" width="1200" height="72" fill="#1F3A5F"/>
  <rect x="0" y="68" width="1200" height="4" fill="#E8833A"/>
  <text class="fs h1" x="40" y="38" fill="#FFFFFF">人字·回环 / Human-Loop　品牌识别体系（概念草案）</text>
  <text class="ff en" x="40" y="58" fill="#C7D4E2">Brand Identity System — Concept Draft · agent-generated provisional · not an official approved identity</text>
  <text class="ff en" x="1160" y="44" text-anchor="end" fill="#E8833A">agent.1 / 图 F-01</text>

  <!-- ============ ROW 1 ============ -->
  <!-- Panel A: Logo mark -->
  <rect x="40" y="96" width="330" height="264" fill="#F7F4EF" stroke="#DED5C7"/>
  <text class="ff h2" x="58" y="122">A　主标识 Logo Mark</text>
  <!-- construction grid -->
  <g stroke="#C9BFAE" stroke-width="0.8" stroke-dasharray="4 4">
    <line x1="205" y1="140" x2="205" y2="340"/>
    <line x1="105" y1="240" x2="305" y2="240"/>
    <rect x="125" y="160" width="160" height="160" fill="none"/>
  </g>
  <!-- 回环 double ring -->
  <circle cx="205" cy="240" r="76" fill="none" stroke="#1F3A5F" stroke-width="9"/>
  <circle cx="205" cy="240" r="50" fill="none" stroke="#1F3A5F" stroke-width="3.5" opacity="0.45"/>
  <!-- loop arrow head : human-in-the-loop -->
  <path d="M263 191 l16 -6 -3 17 z" fill="#1F3A5F"/>
  <!-- 人字 strokes -->
  <path d="M205 178 L153 302" fill="none" stroke="#E8833A" stroke-width="13" stroke-linecap="round"/>
  <path d="M205 178 L257 302" fill="none" stroke="#E8833A" stroke-width="13" stroke-linecap="round"/>
  <!-- three key-area nodes -->
  <circle cx="205" cy="178" r="8.5" fill="#1F3A5F"/>
  <circle cx="153" cy="302" r="8.5" fill="#E8833A"/>
  <circle cx="257" cy="302" r="8.5" fill="#E8833A"/>
  <text class="ff sm" x="205" y="348" text-anchor="middle">最小使用尺寸 20mm　Min. size 20mm</text>

  <!-- Panel B: construction logic -->
  <rect x="390" y="96" width="330" height="264" fill="#FFFFFF" stroke="#DED5C7"/>
  <text class="ff h2" x="408" y="122">B　构成逻辑 Construction Logic</text>
  <g>
    <circle cx="424" cy="152" r="9" fill="#1F3A5F"/><text class="ff wt" x="424" y="156" text-anchor="middle">1</text>
    <text class="ff lb" x="444" y="150">回环 Loop — 京张环线 + 人机回环</text>
    <text class="ff en" x="444" y="166">Rail loop &amp; human-in-the-loop governance</text>

    <circle cx="424" cy="200" r="9" fill="#E8833A"/><text class="ff wt" x="424" y="204" text-anchor="middle">2</text>
    <text class="ff lb" x="444" y="198">人字 Human Glyph — 以人为本双笔</text>
    <text class="ff en" x="444" y="214">Two strokes: supply side &amp; demand side</text>

    <circle cx="424" cy="248" r="9" fill="#6E8CA0"/><text class="ff wt" x="424" y="252" text-anchor="middle">3</text>
    <text class="ff lb" x="444" y="246">三节点 Three Nodes — 三处重点区</text>
    <text class="ff en" x="444" y="262">Zhongzhi Park · Origin Community · Dazhongsi</text>

    <circle cx="424" cy="296" r="9" fill="#22262B"/><text class="ff wt" x="424" y="300" text-anchor="middle">4</text>
    <text class="ff lb" x="444" y="294">箭头 Arrow — 反馈闭环、可回退</text>
    <text class="ff en" x="444" y="310">Feedback loop, reversible by design</text>
  </g>
  <text class="ff sm" x="408" y="344">命名体系：带（人字·回环）— 核（众智园/原点社区/大钟寺）— 环（回环步道）</text>

