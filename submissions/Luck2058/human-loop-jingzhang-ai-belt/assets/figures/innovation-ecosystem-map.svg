<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="创新生态图谱：七要素、转化回环与空间载体映射 / Innovation ecosystem map">
  <title>创新生态图谱 Innovation Ecosystem Map — 七要素 · 转化回环 · 空间载体映射</title>
  <desc>agent-generated provisional diagram. Seven ecosystem elements, conversion loop, international benchmarks and spatial carrier mapping. No administrative boundaries or precise locations are shown.</desc>

  <defs>
    <style><![CDATA[
      .ff { font-family: 'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif; }
      .fs { font-family: 'Noto Serif SC','Source Han Serif SC','Songti SC',serif; }
      .h1 { font-size: 26px; font-weight: 700; }
      .h2 { font-size: 15px; font-weight: 700; fill: #1F3A5F; }
      .lb { font-size: 12px; fill: #22262B; }
      .sm { font-size: 10.5px; fill: #5A6672; }
      .en { font-size: 10px; fill: #6E8CA0; }
      .wt { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .wts{ font-size: 9.5px; fill: #FFFFFF; }
    ]]></style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8833A"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6E8CA0"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="72" fill="#1F3A5F"/>
  <rect x="0" y="68" width="1200" height="4" fill="#E8833A"/>
  <text class="fs h1" x="40" y="38" fill="#FFFFFF">创新生态图谱　Innovation Ecosystem Map</text>
  <text class="ff en" x="40" y="58" fill="#C7D4E2">七要素 Seven elements · 转化回环 Conversion loop · 国际对标 Benchmarks · 空间载体映射 Spatial carriers</text>
  <text class="ff en" x="1160" y="44" text-anchor="end" fill="#E8833A">agent.2 / 图 F-02</text>

  <!-- LEFT: ring -->
  <rect x="30" y="90" width="660" height="590" fill="#FAF8F4" stroke="#DED5C7"/>
  <text class="ff h2" x="48" y="114">一、七要素与回环引擎　Seven Elements &amp; the Human-Loop Engine</text>

  <!-- governance outer ring -->
  <circle cx="360" cy="420" r="252" fill="none" stroke="#6E8CA0" stroke-width="1.4" stroke-dasharray="7 7" opacity="0.8"/>
  <text class="ff sm" x="360" y="182" text-anchor="middle" fill="#6E8CA0">外圈：规则与治理层（数据最小化 · 伦理审查 · 人工复核 · 可关闭）</text>
  <text class="ff en" x="360" y="196" text-anchor="middle">Outer ring: rules &amp; governance — data minimisation, ethics review, human review, opt-out</text>

  <!-- spokes -->
  <g stroke="#C9BFAE" stroke-width="1.2">
    <line x1="360" y1="420" x2="360" y2="230"/>
    <line x1="360" y1="420" x2="508" y2="302"/>
    <line x1="360" y1="420" x2="545" y2="462"/>
    <line x1="360" y1="420" x2="442" y2="591"/>
    <line x1="360" y1="420" x2="278" y2="591"/>
    <line x1="360" y1="420" x2="175" y2="462"/>
    <line x1="360" y1="420" x2="212" y2="302"/>
  </g>

  <!-- loop arrows between nodes (the "回环") -->
  <g fill="none" stroke="#E8833A" stroke-width="2.4" opacity="0.85" marker-end="url(#ar)">
    <path d="M410 253 A 190 190 0 0 1 481 279"/>
    <path d="M536 353 A 190 190 0 0 1 545 411"/>
    <path d="M531 512 A 190 190 0 0 1 489 552"/>
    <path d="M389 604 A 190 190 0 0 1 331 604"/>
    <path d="M231 552 A 190 190 0 0 1 189 512"/>
    <path d="M175 411 A 190 190 0 0 1 184 353"/>
    <path d="M239 279 A 190 190 0 0 1 310 253"/>
  </g>

  <!-- centre -->
  <circle cx="360" cy="420" r="74" fill="#1F3A5F"/>
  <text class="fs" x="360" y="410" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">回环引擎</text>
  <text class="ff" x="360" y="430" font-size="10" fill="#E8833A" text-anchor="middle">HUMAN-LOOP ENGINE</text>
  <text class="ff" x="360" y="448" font-size="9" fill="#C7D4E2" text-anchor="middle">场景发榜→揭榜→验证→复盘</text>

  <!-- node helper: circle r=48 -->
  <!-- 1 源头创新 -->
  <circle cx="360" cy="230" r="48" fill="#1F3A5F"/>
  <text class="ff wt" x="360" y="222" text-anchor="middle">源头创新</text>
  <text class="ff wts" x="360" y="238" text-anchor="middle">Research</text>
  <text class="ff sm" x="360" y="256" text-anchor="middle" fill="#FFFFFF">①</text>
  <text class="ff sm" x="360" y="164" text-anchor="middle">高校院所 · 新型实验室｜对标：鹏城实验室</text>

  <!-- 2 中试转化 -->
  <circle cx="508" cy="302" r="48" fill="#2E5F8A"/>
  <text class="ff wt" x="508" y="294" text-anchor="middle">中试转化</text>
  <text class="ff wts" x="508" y="310" text-anchor="middle">Translation</text>
  <text class="ff sm" x="508" y="328" text-anchor="middle" fill="#FFFFFF">②</text>
  <text class="ff sm" x="600" y="252" text-anchor="middle">共享中试｜对标：MaRS</text>

  <!-- 3 企业主体 -->
  <circle cx="545" cy="462" r="48" fill="#4A7FA5"/>
  <text class="ff wt" x="545" y="454" text-anchor="middle">企业主体</text>
  <text class="ff wts" x="545" y="470" text-anchor="middle">Enterprises</text>
  <text class="ff sm" x="545" y="488" text-anchor="middle" fill="#FFFFFF">③</text>
  <text class="ff sm" x="612" y="530" text-anchor="middle">龙头+专精特新｜对标：南山/坪山</text>

  <!-- 4 资本 -->
  <circle cx="442" cy="591" r="48" fill="#6E8CA0"/>
  <text class="ff wt" x="442" y="583" text-anchor="middle">资本</text>
  <text class="ff wts" x="442" y="599" text-anchor="middle">Capital</text>
  <text class="ff sm" x="442" y="617" text-anchor="middle" fill="#FFFFFF">④</text>
  <text class="ff sm" x="470" y="654" text-anchor="middle">引导基金·耐心资本｜Station F</text>

  <!-- 5 人才 -->
  <circle cx="278" cy="591" r="48" fill="#C96C2E"/>
  <text class="ff wt" x="278" y="583" text-anchor="middle">人才</text>
  <text class="ff wts" x="278" y="599" text-anchor="middle">Talent</text>
  <text class="ff sm" x="278" y="617" text-anchor="middle" fill="#FFFFFF">⑤</text>
  <text class="ff sm" x="230" y="654" text-anchor="middle">青年科学家·工程师｜Station F</text>

  <!-- 6 场景 -->
  <circle cx="175" cy="462" r="48" fill="#E8833A"/>
  <text class="ff wt" x="175" y="454" text-anchor="middle">场景</text>
  <text class="ff wts" x="175" y="470" text-anchor="middle">Scenarios</text>
  <text class="ff sm" x="175" y="488" text-anchor="middle" fill="#FFFFFF">⑥</text>
  <text class="ff sm" x="112" y="530" text-anchor="middle">开放场景·首试首用｜Helsinki</text>

  <!-- 7 服务与治理 -->
  <circle cx="212" cy="302" r="48" fill="#8A6D3B"/>
  <text class="ff wt" x="212" y="294" text-anchor="middle">服务治理</text>
  <text class="ff wts" x="212" y="310" text-anchor="middle">Services</text>
  <text class="ff sm" x="212" y="328" text-anchor="middle" fill="#FFFFFF">⑦</text>
  <text class="ff sm" x="126" y="252" text-anchor="middle">法务·标准·算力｜Sidewalk 教训</text>

  <!-- RIGHT TOP: conversion funnel -->
  <rect x="710" y="90" width="460" height="330" fill="#FFFFFF" stroke="#DED5C7"/>
  <text class="ff h2" x="728" y="114">二、转化漏斗与回流　Conversion Funnel &amp; Feedback</text>
  <g>
    <rect x="736" y="130" width="400" height="34" fill="#1F3A5F"/>
    <text class="ff wt" x="748" y="152">① 创新供给 Research supply</text>
    <text class="ff" x="1124" y="152" font-size="11" fill="#C7D4E2" text-anchor="end">院所 / 实验室</text>

    <rect x="766" y="172" width="340" height="34" fill="#2E5F8A"/>
    <text class="ff wt" x="778" y="194">② 中试验证 Pilot &amp; validation</text>
    <text class="ff" x="1094" y="194" font-size="11" fill="#C7D4E2" text-anchor="end">共享中试基地</text>

    <rect x="796" y="214" width="280" height="34" fill="#4A7FA5"/>
    <text class="ff wt" x="808" y="236">③ 场景首用 First-use in city</text>
    <text class="ff" x="1064" y="236" font-size="11" fill="#C7D4E2" text-anchor="end">12 张场景卡</text>

    <rect x="826" y="256" width="220" height="34" fill="#C96C2E"/>
    <text class="ff wt" x="838" y="278">④ 产业化 Scale-up</text>
    <text class="ff" x="1034" y="278" font-size="11" fill="#FBE3CE" text-anchor="end">企业落地</text>

    <rect x="856" y="298" width="160" height="34" fill="#E8833A"/>
    <text class="ff wt" x="868" y="320">⑤ 复盘回流 Feedback</text>
  </g>
  <path d="M1016 315 C 1150 315, 1152 100, 1010 118 L 900 132" fill="none" stroke="#E8833A" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text class="ff sm" x="728" y="356">回流内容：真实数据集、失败案例库、标准草案、政策建议、下一轮场景榜单。</text>
  <text class="ff en" x="728" y="372">Feedback assets: datasets, failure archive, draft standards, policy notes, next scenario list.</text>
  <text class="ff sm" x="728" y="396">停止条件：连续两轮场景验证未达 KPI 或出现合规事件，即暂停该场景并公开复盘。</text>
  <text class="ff en" x="728" y="410">Stop rule: two consecutive KPI misses or a compliance incident suspends the scenario.</text>

  <!-- RIGHT BOTTOM: benchmarks -->
  <rect x="710" y="436" width="460" height="244" fill="#FAF8F4" stroke="#DED5C7"/>
  <text class="ff h2" x="728" y="460">三、国际对标与借鉴　Benchmarks (6)</text>
  <g class="ff" font-size="10.5" fill="#22262B">
    <rect x="728" y="470" width="8" height="26" fill="#1F3A5F"/>
    <text x="744" y="482">Sidewalk Toronto（加拿大）</text><text class="en" x="744" y="494">教训：数据治理失信导致项目终止 → 本方案前置告知与可关闭</text>

    <rect x="728" y="504" width="8" height="26" fill="#2E5F8A"/>
    <text x="744" y="516">Station F（法国巴黎）</text><text class="en" x="744" y="528">超大孵化聚合 → 本方案“原点社区”一站式服务与资本聚合</text>

    <rect x="728" y="538" width="8" height="26" fill="#4A7FA5"/>
    <text x="744" y="550">MaRS Discovery District（加拿大多伦多）</text><text class="en" x="744" y="562">院—城—企中介机制 → 本方案共享中试与技术经理人制度</text>

    <rect x="728" y="572" width="8" height="26" fill="#6E8CA0"/>
    <text x="744" y="584">鹏城实验室（中国深圳）</text><text class="en" x="744" y="596">大装置+开源生态 → 本方案算力与开源社区节点</text>

    <rect x="728" y="606" width="8" height="26" fill="#C96C2E"/>
    <text x="744" y="618">深圳南山 / 坪山产业空间（中国深圳）</text><text class="en" x="744" y="630">工业上楼与混合用地 → 本方案弹性载体与容积激励</text>

    <rect x="728" y="640" width="8" height="26" fill="#E8833A"/>
    <text x="744" y="652">Helsinki AI 城市试验（芬兰）</text><text class="en" x="744" y="664">算法登记册与公众参与 → 本方案感知告知牌与申诉入口</text>
  </g>

  <!-- BOTTOM: spatial carrier mapping -->
  <rect x="30" y="700" width="1140" height="130" fill="#FFFFFF" stroke="#DED5C7"/>
  <text class="ff h2" x="48" y="724">四、空间载体映射　Spatial Carrier Mapping（三核两翼 · 概念关系，不含精确定位）</text>
  <g>
    <rect x="48" y="736" width="250" height="76" rx="4" fill="#EFE7DA" stroke="#1F3A5F"/>
    <text class="ff lb" x="60" y="756" font-weight="700">众智园　Zhongzhi Park</text>
    <text class="ff sm" x="60" y="774">承载 ①源头创新 ②中试转化 ⑦服务治理</text>
    <text class="ff en" x="60" y="790">Research · pilot · shared services</text>
    <text class="ff en" x="60" y="804">主责：园区平台公司 + 院所联合体</text>

    <rect x="312" y="736" width="250" height="76" rx="4" fill="#EFE7DA" stroke="#E8833A"/>
    <text class="ff lb" x="324" y="756" font-weight="700">原点社区　Origin Community</text>
    <text class="ff sm" x="324" y="774">承载 ④资本 ⑤人才 ⑥场景</text>
    <text class="ff en" x="324" y="790">Capital · talent · living-lab scenarios</text>
    <text class="ff en" x="324" y="804">主责：属地街道 + 运营商 + 社区自治</text>

    <rect x="576" y="736" width="250" height="76" rx="4" fill="#EFE7DA" stroke="#6E8CA0"/>
    <text class="ff lb" x="588" y="756" font-weight="700">大钟寺　Dazhongsi</text>
    <text class="ff sm" x="588" y="774">承载 ③企业主体 ⑥场景 + 文化叙事</text>
    <text class="ff en" x="588" y="790">Enterprises · scenarios · culture</text>
    <text class="ff en" x="588" y="804">主责：更新实施主体 + 文化运营方</text>

    <rect x="840" y="736" width="310" height="76" rx="4" fill="#F7F4EF" stroke="#C9BFAE" stroke-dasharray="5 4"/>
    <text class="ff lb" x="852" y="756" font-weight="700">两翼协同　Two Wings (concept only)</text>
    <text class="ff sm" x="852" y="774">西翼：中试外溢与制造配套；北翼：区域协同与人才通勤</text>
    <text class="ff en" x="852" y="790">Node-link concept diagram; no boundaries, no coordinates</text>
    <text class="ff en" x="852" y="804">跨区事项以协同机制表述，不做行政区划表达</text>
  </g>

  <!-- FOOTER -->
  <text class="ff en" x="40" y="866" fill="#5A6672">agent-generated provisional diagram · 概念关系图，不含行政边界、不含精确坐标 · 待官方几何数据下发后复核空间载体对应关系</text>
  <text class="ff en" x="1160" y="866" text-anchor="end" fill="#5A6672">human-loop-jingzhang-ai-belt</text>
