<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Jing-Zhang AI Symbiosis Belt — cultural symbol system (concept, not final)">
  <title>京张智脉共生带 · 文化符号体系（概念稿，非最终）</title>
  <desc>Eight core symbols fusing Jing-Zhang railway heritage, Zhongguancun innovation culture and AI new culture, plus a wayfinding icon set. Pure geometry; all marks require rights clearance before public use.</desc>
  <defs>
    <linearGradient id="belt2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8a9c"/>
      <stop offset="1" stop-color="#5fc26b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="60" fill="#162033"/>
  <text x="28" y="29" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">京张智脉共生带 · 文化符号体系</text>
  <text x="28" y="48" font-family="sans-serif" font-size="11" fill="#9fd7c0">Cultural Symbol System · 百年京张—AI 共生 · CONCEPT 概念稿</text>
  <text x="932" y="36" font-family="sans-serif" font-size="11" fill="#7c8aa0" text-anchor="end">8 核心符号 + 导视图标组</text>

  <!-- symbol grid: 4 columns x 2 rows -->
  <!-- S1 智脉光带 -->
  <g transform="translate(28,84)">
    <rect x="0" y="0" width="212" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <rect x="20" y="46" width="172" height="14" rx="7" fill="url(#belt2)" opacity="0.6"/>
    <line x1="26" y1="53" x2="186" y2="53" stroke="#1f8a9c" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="20" y="92" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">① 智脉光带</text>
    <text x="20" y="112" font-family="sans-serif" font-size="10" fill="#475467">“一带三核”空间母题</text>
    <text x="20" y="128" font-family="sans-serif" font-size="10" fill="#667085">线性光带 + 轨道断面</text>
  </g>
  <!-- S2 轨道断面 -->
  <g transform="translate(256,84)">
    <rect x="0" y="0" width="212" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <line x1="40" y1="40" x2="172" y2="40" stroke="#1f8a9c" stroke-width="4"/>
    <line x1="40" y1="74" x2="172" y2="74" stroke="#1f8a9c" stroke-width="4"/>
    <g stroke="#162033" stroke-width="3">
      <line x1="56" y1="38" x2="56" y2="76"/><line x1="88" y1="38" x2="88" y2="76"/>
      <line x1="120" y1="38" x2="120" y2="76"/><line x1="152" y1="38" x2="152" y2="76"/>
    </g>
    <text x="20" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">② 轨道断面</text>
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#475467">京张铁路遗产转译</text>
    <text x="20" y="134" font-family="sans-serif" font-size="10" fill="#667085">双轨 + 枕木母题</text>
  </g>
  <!-- S3 智核节点 -->
  <g transform="translate(484,84)">
    <rect x="0" y="0" width="212" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <circle cx="106" cy="56" r="22" fill="url(#belt2)"/>
    <circle cx="106" cy="56" r="34" fill="none" stroke="#5fc26b" stroke-width="2" opacity="0.6"/>
    <text x="20" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">③ 智核节点</text>
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#475467">AI 创新锚点（三核）</text>
    <text x="20" y="134" font-family="sans-serif" font-size="10" fill="#667085">脉冲环 = 活着的社区</text>
  </g>
  <!-- S4 共生环 -->
  <g transform="translate(712,84)">
    <rect x="0" y="0" width="220" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <circle cx="80" cy="56" r="20" fill="none" stroke="#1f8a9c" stroke-width="6"/>
    <circle cx="120" cy="56" r="20" fill="none" stroke="#d9534f" stroke-width="6"/>
    <text x="20" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">④ 共生环</text>
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#475467">历史—创新—公共生活</text>
    <text x="20" y="134" font-family="sans-serif" font-size="10" fill="#667085">双环交叠 = 共生</text>
  </g>
  <!-- S5 百年齿轮/遗址 -->
  <g transform="translate(28,238)">
    <rect x="0" y="0" width="212" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <g transform="translate(86,56)">
      <circle r="20" fill="none" stroke="#162033" stroke-width="5"/>
      <g stroke="#162033" stroke-width="5">
        <line x1="0" y1="-26" x2="0" y2="-20"/><line x1="0" y1="20" x2="0" y2="26"/>
        <line x1="-26" y1="0" x2="-20" y2="0"/><line x1="20" y1="0" x2="26" y2="0"/>
        <line x1="-18" y1="-18" x2="-14" y2="-14"/><line x1="14" y1="14" x2="18" y2="18"/>
        <line x1="-18" y1="18" x2="-14" y2="14"/><line x1="14" y1="-18" x2="18" y2="-14"/>
      </g>
    </g>
    <text x="20" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">⑤ 百年齿轮</text>
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#475467">京张工程精神</text>
    <text x="20" y="134" font-family="sans-serif" font-size="10" fill="#667085">自主创新里程碑</text>
  </g>
  <!-- S6 数据最小化锁 -->
  <g transform="translate(256,238)">
    <rect x="0" y="0" width="212" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <rect x="78" y="44" width="36" height="30" rx="5" fill="#162033"/>
    <path d="M84 44 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#162033" stroke-width="5"/>
    <text x="20" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">⑥ 数据最小化锁</text>
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#475467">可信 AI 治理</text>
    <text x="20" y="134" font-family="sans-serif" font-size="10" fill="#667085">不采集个人画像</text>
  </g>
  <!-- S7 无障碍导视 -->
  <g transform="translate(484,238)">
    <rect x="0" y="0" width="212" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <circle cx="106" cy="50" r="12" fill="#162033"/>
    <path d="M88 96 q18 -34 36 0" fill="none" stroke="#162033" stroke-width="5"/>
    <line x1="106" y1="62" x2="106" y2="88" stroke="#162033" stroke-width="5"/>
    <text x="20" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">⑦ 无障碍导视</text>
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#475467">图标 + 中英 + 触觉</text>
    <text x="20" y="134" font-family="sans-serif" font-size="10" fill="#667085">多模态可达</text>
  </g>
  <!-- S8 人文节点 -->
  <g transform="translate(712,238)">
    <rect x="0" y="0" width="220" height="138" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <circle cx="92" cy="48" r="10" fill="#d9534f"/>
    <circle cx="128" cy="48" r="10" fill="#2fae8f"/>
    <circle cx="110" cy="78" r="10" fill="#1f8a9c"/>
    <text x="20" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">⑧ 人文节点</text>
    <text x="20" y="120" font-family="sans-serif" font-size="10" fill="#475467">居民/开发者/访客</text>
    <text x="20" y="134" font-family="sans-serif" font-size="10" fill="#667085">公共生活共同体</text>
  </g>

  <!-- combination rule -->
  <g transform="translate(28,398)">
    <rect x="0" y="0" width="904" height="58" rx="8" fill="#162033"/>
    <text x="18" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#9fd7c0">组合规则 Combination rule</text>
    <text x="18" y="46" font-family="sans-serif" font-size="11" fill="#d8e3ef">① 智脉光带为统领母题；② 轨道断面用于历史叙事；③ 智核节点标注三核；④ 共生环表达共生关系。导视统一叠加 ⑥数据最小化 + ⑦无障碍 提示。</text>
  </g>

  <text x="28" y="486" font-family="sans-serif" font-size="11" fill="#9aa6b6">所有符号为几何概念稿，不含受版权或商标保护的形象；对外使用前须完成标识清权与文保确认。</text>
</svg>
