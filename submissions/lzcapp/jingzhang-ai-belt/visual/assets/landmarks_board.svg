<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="京张智脉共生带 · 三处 AI 朝圣地标可识别视觉（概念稿 · 重设计）">
  <title>京张智脉共生带 · 三处 AI 朝圣地标可识别视觉（概念稿）</title>
  <desc>LM-01 Open-Source Launch Lighthouse, LM-02 Rail Heritage AI Time Corridor, LM-03 Dazhongsi Smart-Economy Gate</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a2d"/><stop offset="1" stop-color="#1a2e44"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f0a35e" stop-opacity="0.0"/>
      <stop offset="0.4" stop-color="#f0a35e" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#f5c4b3" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f5c4b3" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a35e" stop-opacity="0.0"/>
      <stop offset="0.4" stop-color="#f0a35e" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#f5c4b3" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f5c4b3" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#154e5c"/><stop offset="1" stop-color="#1f8a9c"/>
    </linearGradient>
    <linearGradient id="timeSky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d1b0e"/><stop offset="0.45" stop-color="#1e2a38"/><stop offset="1" stop-color="#0d1a2d"/>
    </linearGradient>
    <linearGradient id="trackFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b42318"/><stop offset="0.6" stop-color="#1f8a9c"/><stop offset="1" stop-color="#5fc26b"/>
    </linearGradient>
    <linearGradient id="gatePillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#154e5c"/><stop offset="1" stop-color="#1f8a9c"/>
    </linearGradient>
    <linearGradient id="cityGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1a2e44"/><stop offset="1" stop-color="#0d1a2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0a35e" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#f0a35e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f0a35e" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fae8f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2fae8f" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- ====== header ====== -->
  <rect x="0" y="0" width="960" height="56" fill="#162033"/>
  <text x="28" y="28" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">三处 AI 朝圣地标 · 可识别视觉</text>
  <text x="28" y="46" font-family="sans-serif" font-size="11" fill="#9fd7c0">3 AI Pilgrimage Landmarks · recognizability board · CONCEPT 概念稿</text>
  <text x="932" y="34" font-family="sans-serif" font-size="11" fill="#7c8aa0" text-anchor="end">LM-01 / 02 / 03</text>

  <!-- ====== LM-01 开源发布厅灯塔 ====== -->
  <g transform="translate(28,72)">
    <rect x="0" y="0" width="288" height="350" rx="10" fill="url(#sky)" stroke="#2a3a50"/>
    <!-- stars -->
    <g fill="#85b7eb" opacity="0.4">
      <circle cx="240" cy="30" r="1.2"/><circle cx="210" cy="55" r="0.8"/><circle cx="260" cy="70" r="1.0"/>
      <circle cx="40" cy="40" r="1.0"/><circle cx="70" cy="25" r="0.8"/><circle cx="250" cy="100" r="0.7"/>
    </g>

    <!-- light beams -->
    <polygon points="120,120 10,80 10,50 120,120" fill="url(#beamL)"/>
    <polygon points="120,120 278,80 278,50 120,120" fill="url(#beamR)"/>

    <!-- glow rings -->
    <circle cx="120" cy="120" r="30" fill="url(#glow)"/>
    <circle cx="120" cy="120" r="50" fill="url(#glow)" opacity="0.4"/>

    <!-- tower body -->
    <path d="M120,125 L145,285 L95,285 Z" fill="url(#tower)" opacity="0.95"/>
    <!-- band stripes -->
    <path d="M102,200 L138,200" stroke="#f6f8fb" stroke-width="3" opacity="0.25"/>
    <path d="M105,170 L135,170" stroke="#f6f8fb" stroke-width="3" opacity="0.25"/>
    <path d="M108,145 L132,145" stroke="#f6f8fb" stroke-width="3" opacity="0.2"/>
    <path d="M100,230 L140,230" stroke="#f6f8fb" stroke-width="3" opacity="0.2"/>
    <path d="M97,260 L143,260" stroke="#f6f8fb" stroke-width="3" opacity="0.2"/>

    <!-- lantern room -->
    <rect x="107" y="108" width="26" height="18" rx="3" fill="#162033"/>
    <rect x="110" y="111" width="20" height="12" rx="2" fill="#f0a35e"/>
    <!-- lantern cap -->
    <rect x="104" y="104" width="32" height="5" rx="2" fill="#2a3a50"/>

    <!-- base -->
    <rect x="80" y="285" width="80" height="16" rx="4" fill="#2fae8f"/>
    <rect x="88" y="301" width="64" height="12" rx="3" fill="#1a3a30"/>
    <!-- base steps -->
    <rect x="72" y="313" width="96" height="8" rx="3" fill="#0d1a2d" opacity="0.6"/>

    <!-- water/ground reflection -->
    <rect x="0" y="320" width="288" height="30" fill="#0d1a2d" opacity="0.3"/>

    <!-- card header overlay -->
    <rect x="0" y="0" width="288" height="52" rx="10" fill="#162033" opacity="0.0"/>
    <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">LM-01 开源发布厅灯塔</text>
    <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#9fd7c0">Open-Source Launch Lighthouse</text>

    <!-- feature text -->
    <text x="16" y="338" font-family="sans-serif" font-size="10" fill="#9fd7c0">顶部脉冲光 + 底层发布厅 · 低眩光夜景</text>
    <text x="16" y="353" font-family="sans-serif" font-size="9" fill="#7c8aa0">分时段调暗 · 无障碍入口 · 北京AI原点社区</text>
  </g>

  <!-- ====== LM-02 铁路遗址 AI 时光廊 ====== -->
  <g transform="translate(336,72)">
    <rect x="0" y="0" width="288" height="350" rx="10" fill="url(#timeSky)" stroke="#2a3a50"/>

    <!-- railway track (perspective: heritage → future) -->
    <g stroke="#5f5e5a" stroke-width="2" opacity="0.6">
      <line x1="30" y1="268" x2="258" y2="268"/>
      <line x1="30" y1="280" x2="258" y2="280"/>
    </g>
    <!-- sleepers -->
    <g stroke="#7c8aa0" stroke-width="2" opacity="0.4">
      <line x1="50" y1="264" x2="50" y2="284"/>
      <line x1="80" y1="264" x2="80" y2="284"/>
      <line x1="110" y1="264" x2="110" y2="284"/>
      <line x1="140" y1="264" x2="140" y2="284"/>
      <line x1="170" y1="264" x2="170" y2="284"/>
      <line x1="200" y1="264" x2="200" y2="284"/>
      <line x1="230" y1="264" x2="230" y2="284"/>
    </g>

    <!-- elevated corridor tube -->
    <path d="M44,210 Q144,170 244,210 L244,244 Q144,260 44,244 Z" fill="url(#trackFade)" opacity="0.35"/>
    <path d="M44,210 Q144,170 244,210" fill="none" stroke="url(#trackFade)" stroke-width="3" opacity="0.8"/>

    <!-- heritage side: warm amber glow -->
    <circle cx="70" cy="227" r="12" fill="#b42318" opacity="0.8"/>
    <circle cx="70" cy="227" r="20" fill="none" stroke="#b42318" stroke-width="1" opacity="0.3"/>

    <!-- ai side: teal nodes -->
    <circle cx="218" cy="227" r="8" fill="#5fc26b" opacity="0.8"/>
    <circle cx="218" cy="227" r="16" fill="none" stroke="#5fc26b" stroke-width="1" opacity="0.3"/>

    <!-- flow particles along the corridor -->
    <g fill="#2fae8f" opacity="0.7">
      <circle cx="100" cy="222" r="2.5"/><circle cx="120" cy="218" r="2.0"/><circle cx="140" cy="215" r="3.0"/>
      <circle cx="160" cy="218" r="2.5"/><circle cx="180" cy="220" r="2.0"/><circle cx="200" cy="222" r="2.5"/>
    </g>

    <!-- support pillars -->
    <g stroke="#334155" stroke-width="4" opacity="0.7">
      <line x1="60" y1="245" x2="60" y2="290"/>
      <line x1="110" y1="245" x2="110" y2="290"/>
      <line x1="160" y1="245" x2="160" y2="290"/>
      <line x1="210" y1="245" x2="210" y2="290"/>
    </g>

    <!-- labels -->
    <text x="52" y="106" font-family="sans-serif" font-size="13" font-weight="700" fill="#f0a35e">百年京张</text>
    <text x="52" y="124" font-family="sans-serif" font-size="9" fill="#f0a35e" opacity="0.7">京张铁路遗址</text>
    <text x="236" y="106" font-family="sans-serif" font-size="13" font-weight="700" fill="#5fc26b" text-anchor="end">AI 共生</text>
    <text x="236" y="124" font-family="sans-serif" font-size="9" fill="#5fc26b" opacity="0.7" text-anchor="end">智轨走廊</text>

    <!-- central connector: heritage ↔ AI -->
    <line x1="80" y1="260" x2="144" y2="190" stroke="#b42318" stroke-width="1" opacity="0.3"/>
    <line x1="208" y1="260" x2="144" y2="190" stroke="#5fc26b" stroke-width="1" opacity="0.3"/>
    <circle cx="144" cy="190" r="6" fill="#f5c4b3"/>

    <!-- ground -->
    <rect x="0" y="290" width="288" height="60" fill="#0d1a2d" opacity="0.15"/>

    <!-- card header overlay -->
    <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">LM-02 铁路遗址 AI 时光廊</text>
    <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#9fd7c0">Rail Heritage AI Time Corridor</text>

    <!-- feature text -->
    <text x="16" y="338" font-family="sans-serif" font-size="10" fill="#9fd7c0">线性光带 + 轨道枕木 · 夜间低能耗</text>
    <text x="16" y="353" font-family="sans-serif" font-size="9" fill="#7c8aa0">触觉地图 · 遗址公园活力带</text>
  </g>

  <!-- ====== LM-03 大钟寺智能经济之门 ====== -->
  <g transform="translate(644,72)">
    <rect x="0" y="0" width="288" height="350" rx="10" fill="url(#cityGrad)" stroke="#2a3a50"/>

    <!-- city skyline silhouette -->
    <g fill="#0f1e33" opacity="0.7">
      <rect x="10" y="260" width="30" height="40"/>
      <rect x="45" y="240" width="22" height="60"/>
      <rect x="72" y="250" width="35" height="50"/>
      <rect x="180" y="245" width="28" height="55"/>
      <rect x="212" y="255" width="24" height="45"/>
      <rect x="240" y="235" width="20" height="65"/>
      <rect x="115" y="270" width="25" height="30"/>
    </g>

    <!-- four-quadrant marker dots -->
    <g fill="#7c8aa0" opacity="0.4">
      <circle cx="40" cy="110" r="3"/><circle cx="248" cy="110" r="3"/>
      <circle cx="40" cy="230" r="3"/><circle cx="248" cy="230" r="3"/>
    </g>

    <!-- gate structure -->
    <!-- left pillar -->
    <rect x="86" y="110" width="22" height="180" rx="4" fill="url(#gatePillar)"/>
    <rect x="82" y="102" width="30" height="10" rx="3" fill="#162033"/>
    <!-- right pillar -->
    <rect x="180" y="110" width="22" height="180" rx="4" fill="url(#gatePillar)"/>
    <rect x="176" y="102" width="30" height="10" rx="3" fill="#162033"/>
    <!-- top beam -->
    <rect x="86" y="92" width="116" height="18" rx="4" fill="#1f8a9c"/>
    <rect x="86" y="92" width="116" height="18" rx="4" fill="none" stroke="#162033" stroke-width="1.5"/>

    <!-- central screen -->
    <rect x="108" y="145" width="72" height="80" rx="5" fill="#0d1a2d"/>
    <rect x="108" y="145" width="72" height="80" rx="5" fill="none" stroke="#2a3a50" stroke-width="1"/>
    <!-- screen glow -->
    <rect x="108" y="145" width="72" height="40" rx="5" fill="url(#screenGlow)"/>
    <!-- screen content: data lines -->
    <g stroke="#2fae8f" stroke-width="1.5" opacity="0.8">
      <line x1="118" y1="160" x2="170" y2="160"/><line x1="118" y1="170" x2="162" y2="170"/>
      <line x1="118" y1="180" x2="168" y2="180"/><line x1="118" y1="190" x2="155" y2="190"/>
    </g>
    <!-- screen content: dots -->
    <g fill="#5fc26b" opacity="0.7">
      <circle cx="118" cy="160" r="2"/><circle cx="118" cy="170" r="2"/>
      <circle cx="118" cy="180" r="2"/><circle cx="118" cy="190" r="2"/>
    </g>

    <!-- gate center node -->
    <circle cx="144" cy="235" r="8" fill="#f0a35e"/>
    <circle cx="144" cy="235" r="16" fill="none" stroke="#f0a35e" stroke-width="1.5" opacity="0.4"/>
    <circle cx="144" cy="235" r="26" fill="none" stroke="#f0a35e" stroke-width="1" opacity="0.2"/>

    <!-- data flow through gate -->
    <g fill="#f0a35e" opacity="0.4">
      <circle cx="130" cy="210" r="1.5"/><circle cx="150" cy="195" r="2.0"/><circle cx="155" cy="220" r="1.5"/>
      <circle cx="135" cy="240" r="1.5"/><circle cx="148" cy="245" r="2.0"/>
    </g>

    <!-- ground mark -->
    <line x1="60" y1="290" x2="228" y2="290" stroke="#2a3a50" stroke-width="2"/>

    <!-- card header overlay -->
    <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">LM-03 大钟寺智能经济之门</text>
    <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#9fd7c0">Dazhongsi Smart-Economy Gate</text>

    <!-- feature text -->
    <text x="16" y="338" font-family="sans-serif" font-size="10" fill="#9fd7c0">站城门户 + 动态信息幕 · 可熄屏</text>
    <text x="16" y="353" font-family="sans-serif" font-size="9" fill="#7c8aa0">四象限无障碍连通 · 大钟寺站四象限</text>
  </g>

  <!-- ====== footer ====== -->
  <text x="28" y="460" font-family="sans-serif" font-size="10" fill="#7c8aa0">地标为概念方向稿，非工程图；实施前需工程设计、文保与标识清权、无障碍专项审查。</text>
</svg>
