<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Jing-Zhang AI Symbiosis Belt — three AI pilgrimage landmarks (concept visuals)">
  <title>京张智脉共生带 · 三处 AI 朝圣地标可识别视觉（概念稿）</title>
  <desc>LM-01 Open-Source Launch Lighthouse, LM-02 Rail Heritage AI Time Corridor, LM-03 Dazhongsi Smart-Economy Gate. Recognizable concept silhouettes; engineering and rights clearance required before implementation.</desc>

  <rect x="0" y="0" width="960" height="56" fill="#162033"/>
  <text x="28" y="28" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">三处 AI 朝圣地标 · 可识别视觉</text>
  <text x="28" y="46" font-family="sans-serif" font-size="11" fill="#9fd7c0">3 AI Pilgrimage Landmarks · recognizability board · CONCEPT 概念稿</text>
  <text x="932" y="34" font-family="sans-serif" font-size="11" fill="#7c8aa0" text-anchor="end">LM-01 / 02 / 03</text>

  <!-- LM-01 lighthouse -->
  <g transform="translate(28,76)">
    <rect x="0" y="0" width="288" height="316" rx="10" fill="#f6f8fb" stroke="#d7dee8"/>
    <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#d9534f">LM-01 开源发布厅灯塔</text>
    <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#667085">Open-Source Launch Lighthouse · 北京AI原点社区</text>
    <!-- tower -->
    <path d="M120 110 L150 270 L90 270 Z" fill="#1f8a9c"/>
    <rect x="104" y="86" width="32" height="26" rx="4" fill="#162033"/>
    <circle cx="120" cy="74" r="12" fill="url(#lmg)"/>
    <g stroke="#d9534f" stroke-width="3" opacity="0.8">
      <line x1="120" y1="62" x2="120" y2="44"/><line x1="132" y1="74" x2="150" y2="74"/><line x1="108" y1="74" x2="90" y2="74"/>
    </g>
    <rect x="70" y="270" width="100" height="22" rx="4" fill="#2fae8f"/>
    <text x="16" y="318" font-family="sans-serif" font-size="10" fill="#475467">可识别特征：顶部脉冲光 + 底层发布厅</text>
    <text x="16" y="336" font-family="sans-serif" font-size="10" fill="#667085">低眩光、分时段调暗；无障碍入口</text>
  </g>

  <!-- LM-02 time corridor -->
  <g transform="translate(336,76)">
    <rect x="0" y="0" width="288" height="316" rx="10" fill="#f6f8fb" stroke="#d7dee8"/>
    <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#d9534f">LM-02 铁路遗址 AI 时光廊</text>
    <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#667085">Rail Heritage AI Time Corridor · 遗址公园活力带</text>
    <!-- corridor -->
    <rect x="40" y="120" width="208" height="36" rx="18" fill="url(#lmg)" opacity="0.45"/>
    <line x1="48" y1="138" x2="240" y2="138" stroke="#1f8a9c" stroke-width="3" stroke-dasharray="10 8"/>
    <g stroke="#162033" stroke-width="3">
      <line x1="70" y1="156" x2="70" y2="186"/><line x1="110" y1="156" x2="110" y2="186"/>
      <line x1="150" y1="156" x2="150" y2="186"/><line x1="190" y1="156" x2="190" y2="186"/>
    </g>
    <circle cx="120" cy="90" r="16" fill="#d9534f"/>
    <text x="44" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#162033">百年京张</text>
    <text x="160" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#162033">AI 共生</text>
    <text x="16" y="318" font-family="sans-serif" font-size="10" fill="#475467">可识别特征：线性光带 + 轨道枕木</text>
    <text x="16" y="336" font-family="sans-serif" font-size="10" fill="#667085">触觉地图、夜间低能耗照明</text>
  </g>

  <!-- LM-03 smart-economy gate -->
  <g transform="translate(644,76)">
    <rect x="0" y="0" width="288" height="316" rx="10" fill="#f6f8fb" stroke="#d7dee8"/>
    <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#d9534f">LM-03 大钟寺智能经济之门</text>
    <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#667085">Dazhongsi Smart-Economy Gate · 大钟寺站四象限</text>
    <!-- gate -->
    <path d="M70 270 L70 130 Q120 86 170 130 L170 270" fill="none" stroke="#1f8a9c" stroke-width="8"/>
    <rect x="96" y="150" width="48" height="30" rx="4" fill="#162033"/>
    <rect x="100" y="154" width="40" height="22" rx="2" fill="#2fae8f" opacity="0.7"/>
    <circle cx="120" cy="200" r="10" fill="#d9534f"/>
    <text x="16" y="318" font-family="sans-serif" font-size="10" fill="#475467">可识别特征：站城门户 + 动态信息幕</text>
    <text x="16" y="336" font-family="sans-serif" font-size="10" fill="#667085">四象限无障碍连通、可熄屏</text>
  </g>

  <defs>
    <linearGradient id="lmg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8a9c"/><stop offset="1" stop-color="#5fc26b"/>
    </linearGradient>
  </defs>
  <text x="28" y="412" font-family="sans-serif" font-size="11" fill="#9aa6b6">地标为概念方向稿，非工程图；实施前需工程设计、文保与标识清权、无障碍专项审查。</text>
</svg>
