<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Jing-Zhang AI Symbiosis Belt — visual identity direction (concept, not final)">
  <title>京张智脉共生带 · 视觉识别方向（概念稿，非最终）</title>
  <desc>Linear light-band + rail-section motif. Pure geometry, no copyrighted or trademarked imagery. Generated locally by the submitting agent; all marks require rights clearance before public use.</desc>

  <defs>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8a9c"/>
      <stop offset="0.55" stop-color="#2fae8f"/>
      <stop offset="1" stop-color="#5fc26b"/>
    </linearGradient>
  </defs>

  <!-- belt / corridor -->
  <rect x="60" y="110" width="840" height="80" rx="40" fill="url(#belt)" opacity="0.18"/>
  <rect x="60" y="138" width="840" height="24" rx="12" fill="url(#belt)" opacity="0.55"/>

  <!-- rail center line (dashed) -->
  <line x1="70" y1="150" x2="890" y2="150" stroke="#1f8a9c" stroke-width="3" stroke-dasharray="14 10" opacity="0.85"/>

  <!-- station ticks -->
  <g stroke="#1f8a9c" stroke-width="2" opacity="0.5">
    <line x1="200" y1="118" x2="200" y2="182"/>
    <line x1="480" y1="118" x2="480" y2="182"/>
    <line x1="760" y1="118" x2="760" y2="182"/>
  </g>

  <!-- three core nodes -->
  <g>
    <circle cx="200" cy="150" r="26" fill="#d9534f"/>
    <circle cx="200" cy="150" r="26" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="480" cy="150" r="26" fill="#d9534f"/>
    <circle cx="480" cy="150" r="26" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="760" cy="150" r="26" fill="#d9534f"/>
    <circle cx="760" cy="150" r="26" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- node labels -->
  <g font-family="sans-serif" font-size="18" fill="#333" text-anchor="middle">
    <text x="200" y="210">AI 原点社区</text>
    <text x="480" y="210">众智园加速区</text>
    <text x="760" y="210">大钟寺集聚区</text>
  </g>

  <!-- blue-green + warm-red palette swatches -->
  <g>
    <rect x="60" y="240" width="60" height="28" rx="4" fill="#1f8a9c"/>
    <rect x="128" y="240" width="60" height="28" rx="4" fill="#2fae8f"/>
    <rect x="196" y="240" width="60" height="28" rx="4" fill="#5fc26b"/>
    <rect x="264" y="240" width="60" height="28" rx="4" fill="#d9534f"/>
    <text x="60" y="288" font-family="sans-serif" font-size="13" fill="#666">主色：智轨蓝绿  重点色：暖红</text>
  </g>

  <text x="900" y="288" font-family="sans-serif" font-size="13" fill="#999" text-anchor="end">CONCEPT · 概念稿</text>
</svg>
