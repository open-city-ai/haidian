<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Jing-Zhang AI Symbiosis Belt — brand identity system (concept, not final)">
  <title>京张智脉共生带 · 品牌识别系统（概念稿，非最终）</title>
  <desc>Logo lockups, color palette, typography direction and application board. Pure geometry, no copyrighted or trademarked imagery. Generated locally by the submitting agent; all marks require rights clearance before public use.</desc>
  <defs>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8a9c"/>
      <stop offset="0.55" stop-color="#2fae8f"/>
      <stop offset="1" stop-color="#5fc26b"/>
    </linearGradient>
  </defs>

  <!-- header -->
  <rect x="0" y="0" width="960" height="64" fill="#162033"/>
  <text x="28" y="30" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">京张智脉共生带 · 品牌识别系统</text>
  <text x="28" y="50" font-family="sans-serif" font-size="12" fill="#9fd7c0">Brand Identity System — Jing-Zhang AI Symbiosis Belt · CONCEPT 概念稿</text>
  <text x="932" y="40" font-family="sans-serif" font-size="12" fill="#7c8aa0" text-anchor="end">agent-generated · 需清权</text>

  <!-- section 1: logo lockups -->
  <text x="28" y="96" font-family="sans-serif" font-size="14" font-weight="700" fill="#162033">① 标志组合 Logo lockups</text>

  <!-- horizontal lockup -->
  <g transform="translate(28,110)">
    <rect x="0" y="0" width="300" height="92" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <rect x="20" y="40" width="150" height="12" rx="6" fill="url(#belt)" opacity="0.55"/>
    <line x1="24" y1="46" x2="166" y2="46" stroke="#1f8a9c" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="60" cy="46" r="11" fill="#d9534f"/><circle cx="60" cy="46" r="11" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="110" cy="46" r="11" fill="#d9534f"/><circle cx="110" cy="46" r="11" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="160" cy="46" r="11" fill="#d9534f"/><circle cx="160" cy="46" r="11" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="190" y="42" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">京张</text>
    <text x="190" y="60" font-family="sans-serif" font-size="11" fill="#475467">智脉共生带</text>
    <text x="20" y="84" font-family="sans-serif" font-size="10" fill="#667085">横向组合 · 主用</text>
  </g>

  <!-- vertical lockup -->
  <g transform="translate(344,110)">
    <rect x="0" y="0" width="220" height="92" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <rect x="84" y="12" width="52" height="10" rx="5" fill="url(#belt)" opacity="0.55"/>
    <circle cx="110" cy="44" r="11" fill="#d9534f"/><circle cx="110" cy="44" r="11" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="110" cy="68" r="11" fill="#d9534f"/><circle cx="110" cy="68" r="11" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="110" y="86" font-family="sans-serif" font-size="11" font-weight="700" fill="#162033" text-anchor="middle">京张智脉</text>
    <text x="20" y="86" font-family="sans-serif" font-size="10" fill="#667085">纵向组合</text>
  </g>

  <!-- monochrome -->
  <g transform="translate(580,110)">
    <rect x="0" y="0" width="170" height="92" rx="8" fill="#162033"/>
    <rect x="20" y="40" width="130" height="10" rx="5" fill="#ffffff" opacity="0.75"/>
    <circle cx="55" cy="45" r="10" fill="#ffffff"/>
    <circle cx="100" cy="45" r="10" fill="#ffffff"/>
    <circle cx="145" cy="45" r="10" fill="#ffffff"/>
    <text x="20" y="82" font-family="sans-serif" font-size="10" fill="#cbd5e1">单色 / 反白</text>
  </g>

  <!-- safe area -->
  <g transform="translate(766,110)">
    <rect x="0" y="0" width="166" height="92" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <rect x="34" y="26" width="98" height="40" rx="6" fill="none" stroke="#c79838" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="83" cy="46" r="13" fill="url(#belt)"/>
    <text x="83" y="84" font-family="sans-serif" font-size="10" fill="#667085" text-anchor="middle">安全区 / 最小尺寸</text>
  </g>

  <!-- section 2: color palette -->
  <text x="28" y="236" font-family="sans-serif" font-size="14" font-weight="700" fill="#162033">② 色彩系统 Color palette</text>
  <g font-family="sans-serif">
    <g transform="translate(28,250)">
      <rect x="0" y="0" width="142" height="56" rx="6" fill="#1f8a9c"/>
      <text x="0" y="74" font-size="12" font-weight="700" fill="#162033">智轨蓝 #1F8A9C</text>
      <text x="0" y="92" font-size="10" fill="#667085">主色 / 智脉光带</text>
    </g>
    <g transform="translate(184,250)">
      <rect x="0" y="0" width="142" height="56" rx="6" fill="#2fae8f"/>
      <text x="0" y="74" font-size="12" font-weight="700" fill="#162033">智轨青绿 #2FAE8F</text>
      <text x="0" y="92" font-size="10" fill="#667085">主色中段</text>
    </g>
    <g transform="translate(340,250)">
      <rect x="0" y="0" width="142" height="56" rx="6" fill="#5fc26b"/>
      <text x="0" y="74" font-size="12" font-weight="700" fill="#162033">共生绿 #5FC26B</text>
      <text x="0" y="92" font-size="10" fill="#667085">点缀 / 活力</text>
    </g>
    <g transform="translate(496,250)">
      <rect x="0" y="0" width="142" height="56" rx="6" fill="#d9534f"/>
      <text x="0" y="74" font-size="12" font-weight="700" fill="#162033">重点暖红 #D9534F</text>
      <text x="0" y="92" font-size="10" fill="#667085">三核 / 强调</text>
    </g>
    <g transform="translate(652,250)">
      <rect x="0" y="0" width="142" height="56" rx="6" fill="#162033"/>
      <text x="0" y="74" font-size="12" font-weight="700" fill="#162033">墨色 #162033</text>
      <text x="0" y="92" font-size="10" fill="#667085">文字 / 负形</text>
    </g>
    <g transform="translate(808,250)">
      <rect x="0" y="0" width="124" height="56" rx="6" fill="#ffffff" stroke="#d7dee8"/>
      <text x="0" y="74" font-size="12" font-weight="700" fill="#162033">纸白 #FFFFFF</text>
      <text x="0" y="92" font-size="10" fill="#667085">背景 / 负空间</text>
    </g>
  </g>

  <!-- section 3: typography -->
  <text x="28" y="386" font-family="sans-serif" font-size="14" font-weight="700" fill="#162033">③ 字体方向 Typography</text>
  <g transform="translate(28,398)">
    <rect x="0" y="0" width="904" height="58" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <text x="20" y="30" font-family="sans-serif" font-size="22" font-weight="700" fill="#162033">中文：思源黑体 / PingFang / 微软雅黑（无衬线，几何感）</text>
    <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#475467">English: a clean geometric sans (e.g. Inter / Helvetica Neue). 中英混排保持字怀与行距一致；地标以粗体层级区分。</text>
  </g>

  <!-- section 4: application board -->
  <text x="28" y="486" font-family="sans-serif" font-size="14" font-weight="700" fill="#162033">④ 应用示意 Application board（概念）</text>
  <g transform="translate(28,498)">
    <rect x="0" y="0" width="280" height="86" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <rect x="14" y="18" width="120" height="12" rx="6" fill="url(#belt)" opacity="0.55"/>
    <circle cx="40" cy="48" r="9" fill="#d9534f"/><circle cx="74" cy="48" r="9" fill="#d9534f"/><circle cx="108" cy="48" r="9" fill="#d9534f"/>
    <text x="150" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#162033">导视牌</text>
    <text x="150" y="62" font-family="sans-serif" font-size="10" fill="#667085">线性光带母题</text>
    <text x="14" y="78" font-family="sans-serif" font-size="10" fill="#667085">街道/站点导视</text>
  </g>
  <g transform="translate(324,498)">
    <rect x="0" y="0" width="280" height="86" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <rect x="14" y="20" width="14" height="46" rx="3" fill="#1f8a9c"/>
    <rect x="40" y="20" width="14" height="46" rx="3" fill="#2fae8f"/>
    <rect x="66" y="20" width="14" height="46" rx="3" fill="#5fc26b"/>
    <text x="96" y="44" font-family="sans-serif" font-size="12" font-weight="700" fill="#162033">贡献墙芯片</text>
    <text x="96" y="62" font-family="sans-serif" font-size="10" fill="#667085">开源贡献可视化</text>
    <text x="14" y="78" font-family="sans-serif" font-size="10" fill="#667085">年度荣誉展示</text>
  </g>
  <g transform="translate(620,498)">
    <rect x="0" y="0" width="312" height="86" rx="8" fill="#f6f8fb" stroke="#d7dee8"/>
    <text x="14" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#162033">Jing-Zhang AI Symbiosis Belt</text>
    <text x="14" y="56" font-family="sans-serif" font-size="11" fill="#475467">从百年京张到 AI 共生</text>
    <text x="14" y="74" font-family="sans-serif" font-size="10" fill="#667085">国际传播 / 活动主视觉</text>
  </g>

  <text x="28" y="610" font-family="sans-serif" font-size="11" fill="#9aa6b6">本识别系统为概念方向稿，非最终设计；所有标志、字体与图形对外使用前须完成商标与名称查重、官方与权利方确认。</text>
</svg>
