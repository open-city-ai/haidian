  <rect width="2400" height="1350" fill="#f3f0e8"/><rect width="22" height="1350" fill="#1d6570"/>
  <text x="110" y="66" class="k" >F-05 · METRICS–EVIDENCE</text><text x="110" y="132" class="t" >指标、证据与完成状态｜事实、复算与缺口分开</text><text x="110" y="185" class="c" >评价不是一个总分：先区分事实状态，再为“走得通、走得远、走进生活”建立本地基线</text>
  <line x1="110" y1="218" x2="2290" y2="218" stroke="#17313b" stroke-width="2"/><rect x="110" y="255" width="590" height="870" fill="#eef0e9" stroke="#718384" stroke-width="2"/><text x="145" y="300" class="h" >三类结果指标树</text><text x="145" y="332" class="s" >全部待建立本地基线，不是已实现绩效</text><rect x="145" y="370" width="520" height="170" fill="#f7f4ec" stroke="#b34f2d" stroke-width="3"/><text x="175" y="412" class="h" >走得通</text><line x1="175" y1="432" x2="620" y2="432" stroke="#718384" stroke-width="1.5"/><text x="175" y="465" class="s" >接口发现 · 跨机构匹配</text><text x="175" y="495" class="s" >站点/慢行/无障碍可达</text><text x="175" y="524" class="mini" >基线：待样本、周期、分母与责任人</text><rect x="145" y="580" width="520" height="170" fill="#f7f4ec" stroke="#b34f2d" stroke-width="3"/><text x="175" y="622" class="h" >走得远</text><line x1="175" y1="642" x2="620" y2="642" stroke="#718384" stroke-width="1.5"/><text x="175" y="675" class="s" >项目延续 · 能力复用</text><text x="175" y="705" class="s" >责任/维护/退出闭环</text><text x="175" y="734" class="mini" >基线：待样本、周期、分母与责任人</text><rect x="145" y="790" width="520" height="170" fill="#f7f4ec" stroke="#b34f2d" stroke-width="3"/><text x="175" y="832" class="h" >走进生活</text><line x1="175" y1="852" x2="620" y2="852" stroke="#718384" stroke-width="1.5"/><text x="175" y="885" class="s" >公共服务采用 · 人工替代</text><text x="175" y="915" class="s" >自愿参与 · 居民基本权利</text><text x="175" y="944" class="mini" >基线：待样本、周期、分母与责任人</text><rect x="730" y="255" width="940" height="870" fill="none" stroke="#718384" stroke-width="2"/><text x="765" y="300" class="h" >三类数值状态｜不可混排为同等事实</text>
  <rect x="765" y="335" width="275" height="580" fill="#f7f4ec" stroke="#17313b" stroke-width="3"/><text x="790" y="375" class="tag" >A 正式任务书事实</text><text x="790" y="425" class="s" >协同研究</text><text x="790" y="465" class="big" >43.6km²</text><text x="790" y="530" class="s" >总体设计</text><text x="790" y="570" class="big" >11.4km²</text><text x="790" y="635" class="s" >三个重点区</text><text x="790" y="675" class="big" >368.4ha</text><text x="790" y="740" class="s" >北 / 中 / 南</text><text x="790" y="780" class="h" >192.1 / 104.3</text><text x="790" y="812" class="h" >72.0ha</text><rect x="1060" y="335" width="285" height="580" fill="#eaded5" stroke="#b34f2d" stroke-width="3"/><text x="1085" y="375" class="tag" >B 临时/概念复算</text><text x="1085" y="420" class="s" >临时范围复算</text><text x="1085" y="450" class="b" >11.413km²</text><text x="1085" y="516" class="s" >概念建筑基底</text><text x="1085" y="546" class="b" >34,432m²</text><text x="1085" y="612" class="s" >概念蓝绿底盘</text><text x="1085" y="642" class="b" >1,384,092m² · 12.13%</text><text x="1085" y="708" class="s" >概念P/T公共界面</text><text x="1085" y="738" class="b" >71,551m² · 0.63%</text><text x="1085" y="804" class="s" >四类概念功能分区</text><text x="1085" y="834" class="b" >2.675 / 2.589 / 3.366 / 2.783km²</text><text x="1085" y="872" class="mini" >不是法定指标</text><text x="1085" y="890" class="mini" >正式数据到位后重算</text>
  <rect x="1365" y="335" width="270" height="580" fill="#eef0e9" stroke="#7d8b8b" stroke-width="3" stroke-dasharray="9 7"/><text x="1390" y="375" class="tag" >C 待正式资料/实测</text><text x="1390" y="425" class="s" >—  容积率 FAR</text><text x="1390" y="493" class="s" >—  建筑高度</text><text x="1390" y="561" class="s" >—  建筑密度</text><text x="1390" y="629" class="s" >—  法定绿地率</text><text x="1390" y="697" class="s" >—  正式退线</text><text x="1390" y="765" class="s" >—  三类结果</text><text x="1390" y="789" class="s" >    本地实测基线</text><text x="1390" y="860" class="b" >未知值保持“—”</text><text x="1390" y="890" class="s" >不以0替代</text>
  <rect x="765" y="940" width="870" height="145" fill="#e8e8df" stroke="#718384" stroke-width="2"/><text x="790" y="975" class="tag" >任务与包计数｜不是规划指标</text><rect x="790" y="995" width="185" height="32" fill="#f7f4ec" stroke="#718384" stroke-width="1.5"/><text x="882" y="1017" class="mini" text-anchor="middle">7案例</text><rect x="995" y="995" width="185" height="32" fill="#f7f4ec" stroke="#718384" stroke-width="1.5"/><text x="1087" y="1017" class="mini" text-anchor="middle">12场景</text><rect x="1200" y="995" width="185" height="32" fill="#f7f4ec" stroke="#718384" stroke-width="1.5"/><text x="1292" y="1017" class="mini" text-anchor="middle">4验证场景</text><rect x="1405" y="995" width="185" height="32" fill="#f7f4ec" stroke="#718384" stroke-width="1.5"/><text x="1497" y="1017" class="mini" text-anchor="middle">6人物</text><rect x="790" y="1040" width="185" height="32" fill="#f7f4ec" stroke="#718384" stroke-width="1.5"/><text x="882" y="1062" class="mini" text-anchor="middle">4共同路标</text><rect x="995" y="1040" width="185" height="32" fill="#f7f4ec" stroke="#718384" stroke-width="1.5"/><text x="1087" y="1062" class="mini" text-anchor="middle">5并列接口</text><rect x="1200" y="1040" width="185" height="32" fill="#f7f4ec" stroke="#718384" stroke-width="1.5"/><text x="1292" y="1062" class="mini" text-anchor="middle">8类生态资源</text><rect x="1700" y="255" width="590" height="870" fill="#eef0e9" stroke="#718384" stroke-width="2"/><text x="1735" y="300" class="h" >证据链与机器审计关系</text><rect x="1760" y="345" width="470" height="62" fill="#f7f4ec" stroke="#718384" stroke-width="2"/><text x="1995" y="383" class="b" text-anchor="middle">来源 / 任务书</text><line x1="1995" y1="407" x2="1995" y2="440" stroke="#17313b" stroke-width="2" marker-end="url(#at)"/><rect x="1760" y="445" width="470" height="62" fill="#f7f4ec" stroke="#718384" stroke-width="2"/><text x="1995" y="483" class="b" text-anchor="middle">九层GeoJSON</text><line x1="1995" y1="507" x2="1995" y2="540" stroke="#17313b" stroke-width="2" marker-end="url(#at)"/><rect x="1760" y="545" width="470" height="62" fill="#f7f4ec" stroke="#b34f2d" stroke-width="2"/><text x="1995" y="583" class="b" text-anchor="middle">metrics + assumptions</text><line x1="1995" y1="607" x2="1995" y2="640" stroke="#17313b" stroke-width="2" marker-end="url(#at)"/><rect x="1760" y="645" width="470" height="62" fill="#f7f4ec" stroke="#17313b" stroke-width="2"/><text x="1995" y="683" class="b" text-anchor="middle">合规 / 标准 / 深度矩阵</text><line x1="1995" y1="707" x2="1995" y2="740" stroke="#17313b" stroke-width="2" marker-end="url(#at)"/><rect x="1760" y="745" width="470" height="62" fill="#f7f4ec" stroke="#17313b" stroke-width="2"/><text x="1995" y="783" class="b" text-anchor="middle">人读图件与正文</text><rect x="1760" y="865" width="470" height="205" fill="#f7f4ec" stroke="#718384" stroke-width="2"/><text x="1790" y="900" class="tag" >机器审计关系｜持续追踪，不用100%掩盖缺口</text>
    <text x="1790" y="935" class="s" >23项任务覆盖映射</text><text x="1790" y="963" class="s" >15项设计深度追踪</text><text x="1790" y="991" class="s" >专业标准矩阵</text><text x="1790" y="1019" class="s" >来源 ↔ 假设 ↔ 指标</text><text x="1790" y="1047" class="s" >自检与未决风险</text>
