<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <title>交通、蓝绿与公共服务底盘｜普通生活优先</title><desc>快、慢、发现三类连接各司其职；专业物流与数字设施不侵入普通公共生活</desc><defs>
    <style>
      text{font-family:"Source Han Sans CN","PingFang SC","Microsoft YaHei",sans-serif;fill:#17313b}
