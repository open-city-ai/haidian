  <text x="1120" y="1095" class="mini" text-anchor="middle">深色实线快连接｜青色粗线慢连接｜青色点线发现连接｜橙色点划线受控物流</text>
  <rect x="1710" y="255" width="580" height="870" fill="#eef0e9" stroke="#718384" stroke-width="2"/><text x="1745" y="300" class="h" >普通生活优先，专业设施受控</text>
  <rect x="1745" y="340" width="510" height="165" fill="#dce8e3" stroke="#1d6570" stroke-width="2"/><use href="#P" transform="translate(1790 382)"/><text x="1830" y="380" class="b" >公共P｜无设备也可使用</text><text x="1775" y="420" class="s" >遮阴 · 雨洪 · 生境 · 休憩</text><text x="1775" y="445" class="s" >遗产解释 · 无障碍 · 非消费停留</text>
  <rect x="1785" y="465" width="430" height="145" fill="#e8e8df" stroke="#718384" stroke-width="2" rx="18"/><use href="#T" transform="translate(1830 505)"/><text x="1870" y="505" class="s" >过渡T｜预约、告知、可退出</text>
  <rect x="1825" y="565" width="350" height="115" fill="url(#hatch)" stroke="#b34f2d" stroke-width="3"/><use href="#C" transform="translate(1870 615)"/><text x="1910" y="608" class="s" >专业C｜设备、物流、责任</text><text x="1910" y="638" class="mini" >不进入普通公共空间</text>
  <text x="1745" y="735" class="tag" >新型基础设施：最小必要、可维护、可降级</text>
  <text x="1775" y="775" class="s" >• 最小必要感知 + 边缘处理</text><text x="1775" y="810" class="s" >• 明确保存期限与责任主体</text><text x="1775" y="845" class="s" >• 人工接管 + 低技术替代</text><text x="1775" y="880" class="s" >• 断网时离线降级，基本服务继续</text>
