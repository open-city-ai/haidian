  <rect width="2400" height="1350" fill="#f3f0e8"/><rect width="22" height="1350" fill="#1d6570"/>
  <text x="110" y="66" class="k" >F-04 · MOBILITY–BLUEGREEN</text><text x="110" y="132" class="t" >交通、蓝绿与公共服务底盘｜普通生活优先</text><text x="110" y="185" class="c" >快、慢、发现三类连接各司其职；专业物流与数字设施不侵入普通公共生活</text>
  <line x1="110" y1="218" x2="2290" y2="218" stroke="#17313b" stroke-width="2"/><rect x="110" y="255" width="420" height="870" fill="#eef0e9" stroke="#718384" stroke-width="2"/><text x="145" y="300" class="h" >三类连接，各有边界</text><rect x="145" y="340" width="350" height="124" fill="#f7f4ec" stroke="#718384" stroke-width="2"/><line x1="165" y1="365" x2="245" y2="365" stroke="#17313b" stroke-width="4" /><text x="165" y="398" class="b" >快连接</text><text x="165" y="425" class="s" >轨道/公交接驳与专业设备到达</text><text x="165" y="448" class="s" >正式站点、客流与线位待核验</text><rect x="145" y="490" width="350" height="124" fill="#f7f4ec" stroke="#718384" stroke-width="2"/><line x1="165" y1="515" x2="245" y2="515" stroke="#1d6570" stroke-width="6" /><text x="165" y="548" class="b" >慢连接</text><text x="165" y="575" class="s" >南北连续无障碍慢行 + 东西缝合</text><text x="165" y="598" class="s" >遮阴、休憩、雨洪与非消费停留</text><rect x="145" y="640" width="350" height="124" fill="#f7f4ec" stroke="#718384" stroke-width="2"/><line x1="165" y1="665" x2="245" y2="665" stroke="#1d6570" stroke-width="4" stroke-dasharray="10 7"/><text x="165" y="698" class="b" >发现连接</text><text x="165" y="725" class="s" >FIND信息与服务接口</text><text x="165" y="748" class="s" >不是道路，不画成物理线位</text><rect x="145" y="810" width="350" height="270" fill="#f7f4ec" stroke="#718384" stroke-width="2"/><text x="170" y="845" class="tag" >站点最后500—800m概念服务圈</text>
