  <line x1="110" y1="218" x2="2290" y2="218" stroke="#17313b" stroke-width="2"/><rect x="110" y="255" width="590" height="870" fill="#eef0e9" stroke="#718384" stroke-width="2"/><text x="145" y="300" class="h" >THREE OUTCOME INDICATOR TREES</text><text x="145" y="332" class="s" >All require local baselines; none is achieved performance</text><rect x="145" y="370" width="520" height="170" fill="#f7f4ec" stroke="#b34f2d" stroke-width="3"/><text x="175" y="412" class="h" >FLOW ACROSS BOUNDARIES</text><line x1="175" y1="432" x2="620" y2="432" stroke="#718384" stroke-width="1.5"/><text x="175" y="465" class="s" >interface discovery · cross-institution matching</text><text x="175" y="495" class="s" >station / slow mobility / accessible completion</text><text x="175" y="524" class="mini" >BASELINE: sample, period, denominator + reviewer pending</text><rect x="145" y="580" width="520" height="170" fill="#f7f4ec" stroke="#b34f2d" stroke-width="3"/><text x="175" y="622" class="h" >GROW FOR THE LONG TERM</text><line x1="175" y1="642" x2="620" y2="642" stroke="#718384" stroke-width="1.5"/><text x="175" y="675" class="s" >project continuation · capability reuse</text><text x="175" y="705" class="s" >responsibility / maintenance / exit closure</text><text x="175" y="734" class="mini" >BASELINE: sample, period, denominator + reviewer pending</text><rect x="145" y="790" width="520" height="170" fill="#f7f4ec" stroke="#b34f2d" stroke-width="3"/><text x="175" y="832" class="h" >ENTER DAILY LIFE</text><line x1="175" y1="852" x2="620" y2="852" stroke="#718384" stroke-width="1.5"/><text x="175" y="885" class="s" >public-service adoption · human alternatives</text><text x="175" y="915" class="s" >voluntary participation · resident rights</text><text x="175" y="944" class="mini" >BASELINE: sample, period, denominator + reviewer pending</text><rect x="730" y="255" width="940" height="870" fill="none" stroke="#718384" stroke-width="2"/><text x="765" y="300" class="h" >THREE VALUE STATES｜DO NOT MIX AS EQUAL FACTS</text>
  <rect x="765" y="335" width="275" height="580" fill="#f7f4ec" stroke="#17313b" stroke-width="3"/><text x="790" y="375" class="tag" >A  FORMAL BRIEF FACTS</text><text x="790" y="425" class="s" >Coordinated study</text><text x="790" y="465" class="big" >43.6km²</text><text x="790" y="530" class="s" >Overall design</text><text x="790" y="570" class="big" >11.4km²</text><text x="790" y="635" class="s" >Three key areas</text><text x="790" y="675" class="big" >368.4ha</text><text x="790" y="740" class="s" >North / Middle / South</text><text x="790" y="780" class="h" >192.1 / 104.3</text><text x="790" y="812" class="h" >72.0ha</text><rect x="1060" y="335" width="285" height="580" fill="#eaded5" stroke="#b34f2d" stroke-width="3"/><text x="1085" y="375" class="mini" >B  PROVISIONAL / CONCEPT RECALC</text><text x="1085" y="420" class="s" >Provisional extent</text><text x="1085" y="450" class="b" >11.413km²</text><text x="1085" y="516" class="s" >Conceptual building footprint</text><text x="1085" y="546" class="b" >34,432m²</text><text x="1085" y="612" class="s" >Conceptual blue-green Base</text><text x="1085" y="642" class="b" >1,384,092m² · 12.13%</text><text x="1085" y="708" class="s" >Conceptual P/T interfaces</text><text x="1085" y="738" class="b" >71,551m² · 0.63%</text><text x="1085" y="804" class="s" >Four conceptual partitions</text><text x="1085" y="834" class="b" >2.675 / 2.589 / 3.366 / 2.783km²</text><text x="1085" y="872" class="mini" >NOT STATUTORY</text><text x="1085" y="890" class="mini" >RECALCULATE WITH OFFICIAL DATA</text>
