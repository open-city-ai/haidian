<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D3436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#636E72;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0984E3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B894;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Railway track motif -->
  <line x1="30" y1="130" x2="370" y2="130" stroke="url(#rail)" stroke-width="3" stroke-dasharray="20,8"/>
  <line x1="30" y1="140" x2="370" y2="140" stroke="url(#rail)" stroke-width="2" stroke-dasharray="20,8"/>
  <!-- Railway ties -->
  <g stroke="#636E72" stroke-width="2">
    <line x1="50" y1="125" x2="50" y2="145"/>
    <line x1="80" y1="125" x2="80" y2="145"/>
    <line x1="110" y1="125" x2="110" y2="145"/>
    <line x1="140" y1="125" x2="140" y2="145"/>
    <line x1="170" y1="125" x2="170" y2="145"/>
    <line x1="200" y1="125" x2="200" y2="145"/>
    <line x1="230" y1="125" x2="230" y2="145"/>
    <line x1="260" y1="125" x2="260" y2="145"/>
    <line x1="290" y1="125" x2="290" y2="145"/>
    <line x1="320" y1="125" x2="320" y2="145"/>
    <line x1="350" y1="125" x2="350" y2="145"/>
  </g>
  <!-- AI neural node network -->
  <circle cx="200" cy="70" r="18" fill="url(#ai)" opacity="0.9"/>
  <circle cx="130" cy="55" r="10" fill="#0984E3" opacity="0.7"/>
  <circle cx="270" cy="55" r="10" fill="#00B894" opacity="0.7"/>
  <circle cx="150" cy="100" r="8" fill="#74B9FF" opacity="0.6"/>
  <circle cx="250" cy="100" r="8" fill="#55EFC4" opacity="0.6"/>
  <circle cx="100" cy="85" r="6" fill="#74B9FF" opacity="0.5"/>
  <circle cx="300" cy="85" r="6" fill="#55EFC4" opacity="0.5"/>
  <!-- Neural connections -->
  <line x1="200" y1="70" x2="130" y2="55" stroke="#0984E3" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="70" x2="270" y2="55" stroke="#00B894" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="70" x2="150" y2="100" stroke="#74B9FF" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="70" x2="250" y2="100" stroke="#55EFC4" stroke-width="1.5" opacity="0.5"/>
  <line x1="130" y1="55" x2="100" y2="85" stroke="#74B9FF" stroke-width="1" opacity="0.4"/>
  <line x1="270" y1="55" x2="300" y2="85" stroke="#55EFC4" stroke-width="1" opacity="0.4"/>
  <line x1="130" y1="55" x2="150" y2="100" stroke="#0984E3" stroke-width="1" opacity="0.4"/>
  <line x1="270" y1="55" x2="250" y2="100" stroke="#00B894" stroke-width="1" opacity="0.4"/>
  <!-- Symbiosis bridge connecting rail and AI -->
  <path d="M 130,85 Q 200,115 270,85" stroke="url(#ai)" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4,3"/>
  <!-- Text -->
  <text x="200" y="175" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2D3436">京张智脉共生带</text>
  <text x="200" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#636E72">JINGZHANG INTELLIGENT SYMBIOSIS BELT</text>
</svg>
