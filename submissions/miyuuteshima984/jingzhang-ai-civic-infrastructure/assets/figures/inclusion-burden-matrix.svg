<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">京张城市完整度 v0.6 包容性与负担矩阵</title><desc id="desc">九类设计画像的公共利益、潜在负担、非AI等价路径与人工帮助或申诉要求。画像为设计审查工具，不是人口统计事实。</desc>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:42px;font-weight:700}.sub{font-size:18px;fill:#5d6a78}.th{font-size:16px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#5d6a78}.grid{fill:#fff;stroke:#d6dde7}.head{fill:#eef3f8}.risk{fill:#fff7e8}.base{fill:#eef9f2}.appeal{fill:#eef6ff}.line{stroke:#d6dde7}</style>
<rect width="1600" height="1120" fill="#f7f9fc"/><text x="60" y="68" class="h1">v0.6｜包容性与负担矩阵：谁受益，谁承担，谁能退出</text><text x="60" y="104" class="sub">九类 persona 仅用于设计审查，不是人口统计结论。任何 AI 增强都不得把“没有手机、没有账号、不愿追踪、需要人工帮助”变成失去基本城市服务的理由。</text>
<g transform="translate(45,145)">
<rect width="1510" height="70" class="head"/><rect width="1510" height="885" class="grid" fill="none"/>
<text x="18" y="43" class="th">设计画像</text><text x="260" y="43" class="th">主要公共利益</text><text x="610" y="43" class="th">潜在负担 / 排斥风险</text><text x="980" y="43" class="th">非 AI 等价路径</text><text x="1280" y="43" class="th">人工帮助 / 申诉</text>
<line x1="235" y1="0" x2="235" y2="885" class="line"/><line x1="585" y1="0" x2="585" y2="885" class="line"/><line x1="955" y1="0" x2="955" y2="885" class="line"/><line x1="1255" y1="0" x2="1255" y2="885" class="line"/>

<g transform="translate(0,70)"><rect width="1510" height="90" fill="#fff"/><text x="18" y="34" class="th">1 长期居民 / 家庭</text><text x="18" y="59" class="s">long-term residents</text><text x="260" y="34" class="b">短距离日常、照护、公共客厅</text><text x="260" y="58" class="b">稳定服务而非一次性展示</text><text x="610" y="34" class="b">社区被试验化、噪声、隐私外溢</text><text x="980" y="34" class="b">普通住房/商业/社区服务照常运行</text><text x="1280" y="34" class="b">社区人工服务台；公开停止/纠错入口</text></g>
<g transform="translate(0,160)"><rect width="1510" height="90" fill="#fbfcfe"/><text x="18" y="34" class="th">2 老年居民</text><text x="18" y="59" class="s">older residents</text><text x="260" y="34" class="b">照护可达、休息、清晰导视</text><text x="610" y="34" class="b">数字门槛、误导、服务迁移到 App</text><text x="980" y="34" class="b">实体导视、电话/现场人工、可坐可停</text><text x="1280" y="34" class="b">优先人工复核；家属/本人均可申诉</text></g>
<g transform="translate(0,250)"><rect width="1510" height="90" fill="#fff"/><text x="18" y="34" class="th">3 残障 / 感知受限使用者</text><text x="18" y="59" class="s">disabled / sensory-limited users</text><text x="260" y="34" class="b">连续无障碍、可理解信息、独立到达</text><text x="610" y="34" class="b">AI 把错误当个性化；物理障碍被“数字补丁”掩盖</text><text x="980" y="34" class="b">先有真实物理无障碍，再允许数字增强</text><text x="1280" y="34" class="b">无障碍专业复核；错误路径可立即人工纠正</text></g>
<g transform="translate(0,340)"><rect width="1510" height="90" fill="#fbfcfe"/><text x="18" y="34" class="th">4 儿童与照护者</text><text x="18" y="59" class="s">children and carers</text><text x="260" y="34" class="b">托育/教育、慢行安全、家庭日常</text><text x="610" y="34" class="b">不必要画像、过度自动化、测试与儿童混行</text><text x="980" y="34" class="b">人工照护、实体安全边界、普通游憩空间</text><text x="1280" y="34" class="b">监护者知情；高风险场景默认不进入儿童路径</text></g>
<g transform="translate(0,430)"><rect width="1510" height="90" fill="#fff"/><text x="18" y="34" class="th">5 学生 / 科研人员</text><text x="18" y="59" class="s">students / researchers</text><text x="260" y="34" class="b">学习、设备共享、成果转译</text><text x="610" y="34" class="b">账号锁定、科研数据越界、创新服务商业化排他</text><text x="980" y="34" class="b">公开目录、人工预约、线下学习与交流</text><text x="1280" y="34" class="b">研究/服务责任方人工复核；IP/数据争议升级</text></g>
<g transform="translate(0,520)"><rect width="1510" height="90" fill="#fbfcfe"/><text x="18" y="34" class="th">6 创业者 / 企业员工</text><text x="18" y="59" class="s">founders / enterprise workers</text><text x="260" y="34" class="b">测试、转译、企业服务、市场采用</text><text x="610" y="34" class="b">把公共资源变成封闭企业通道；数据/资本承诺被夸大</text><text x="980" y="34" class="b">公开准入规则、人工企业服务、非 AI 办事路径</text><text x="1280" y="34" class="b">准入/退出规则公开；利益冲突人工处理</text></g>
<g transform="translate(0,610)"><rect width="1510" height="90" fill="#fff"/><text x="18" y="34" class="th">7 服务劳动者 / 通勤者</text><text x="18" y="59" class="s">service workers / commuters</text><text x="260" y="34" class="b">稳定到达、休息、人工服务、普通就业</text><text x="610" y="34" class="b">自动化转嫁劳动、等待时间、通行风险</text><text x="980" y="34" class="b">正常班次/人工岗位/普通通勤路径不被 AI 阻断</text><text x="1280" y="34" class="b">现场值守；工作与通行问题可人工升级</text></g>
<g transform="translate(0,700)"><rect width="1510" height="90" fill="#fbfcfe"/><text x="18" y="34" class="th">8 访客 / 国际使用者</text><text x="18" y="59" class="s">visitors / international users</text><text x="260" y="34" class="b">多语到达、遗产理解、公共交流</text><text x="610" y="34" class="b">翻译误导、默认授权、只服务熟悉本地 App 的人</text><text x="980" y="34" class="b">中英实体导视 + 人工咨询 + 无账号访问</text><text x="1280" y="34" class="b">多语人工纠错；错误信息可报告</text></g>
<g transform="translate(0,790)"><rect width="1510" height="95" fill="#fff"/><text x="18" y="34" class="th">9 无手机 / 不愿注册或追踪者</text><text x="18" y="59" class="s">no-phone / no-account / opt-out users</text><text x="260" y="34" class="b">保有完整城市使用权与公共服务</text><text x="610" y="34" class="b">数字排斥、默认同意、拒绝追踪即降级待遇</text><text x="980" y="34" class="b">L1/L2 永久导视、人工入口、纸面/现场流程</text><text x="1280" y="34" class="b">拒绝 AI 不需解释；人工渠道与申诉同等有效</text></g>
</g>
<rect x="45" y="1050" width="1510" height="48" class="base"/><text x="65" y="1080" class="b">共同规则：任何 persona 都可以使用 non-AI baseline；拒绝被追踪、拒绝注册或 AI 关闭不得导致住房、通行、基本公共服务和公共空间使用权下降。</text>
</svg>