<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">京张 AI 全要素生态图谱</title><desc id="desc">土地、空间、产业、资金、人才、算力、数据、场景八类要素通过研究、转译、测试、采用与长期生活形成闭环。</desc>
<style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:44px;font-weight:700}.h2{font-size:25px;font-weight:700}.b{font-size:19px}.s{font-size:16px}.node{fill:#fff;stroke:#73849a;stroke-width:2}.core{fill:#edf7f2;stroke:#428a70;stroke-width:3}.stage{fill:#edf5ff;stroke:#4b78b2;stroke-width:2}.warn{fill:#fff8e8;stroke:#a87c31;stroke-width:2}.ln{stroke:#637489;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#637489"/></marker></defs>
<rect width="1600" height="1050" fill="#fbfcfe"/><text x="70" y="72" class="h1">京张 AI 全要素生态图谱｜从资源堆叠到城市验证闭环</text><text x="70" y="108" class="b">八类要素不以“园区清单”并列，而是进入研究—转译—测试—采用—长期生活的连续流程。</text>
<text x="70" y="168" class="h2">八类要素</text>
<g><rect x="70" y="195" width="300" height="85" rx="14" class="node"/><text x="220" y="230" text-anchor="middle" class="h2">土地 LAND</text><text x="220" y="258" text-anchor="middle" class="s">承载功能，但不创造“AI 用地”新法定类别</text>
<rect x="410" y="195" width="300" height="85" rx="14" class="node"/><text x="560" y="230" text-anchor="middle" class="h2">空间 SPACE</text><text x="560" y="258" text-anchor="middle" class="s">实验场、社区、公园、站城与公共界面</text>
<rect x="750" y="195" width="300" height="85" rx="14" class="node"/><text x="900" y="230" text-anchor="middle" class="h2">产业 INDUSTRY</text><text x="900" y="258" text-anchor="middle" class="s">科研、中试、企业服务、智能原生业态</text>
<rect x="1090" y="195" width="300" height="85" rx="14" class="node"/><text x="1240" y="230" text-anchor="middle" class="h2">资金 CAPITAL</text><text x="1240" y="258" text-anchor="middle" class="s">概念性资本/IP/服务接口，不预设承诺</text>
<rect x="70" y="315" width="300" height="85" rx="14" class="node"/><text x="220" y="350" text-anchor="middle" class="h2">人才 TALENT</text><text x="220" y="378" text-anchor="middle" class="s">研究者、创业者、服务劳动者与长期家庭</text>
<rect x="410" y="315" width="300" height="85" rx="14" class="node"/><text x="560" y="350" text-anchor="middle" class="h2">算力 COMPUTE</text><text x="560" y="378" text-anchor="middle" class="s">共享设备/算力服务，强调准入与容量边界</text>
<rect x="750" y="315" width="300" height="85" rx="14" class="node"/><text x="900" y="350" text-anchor="middle" class="h2">数据 DATA</text><text x="900" y="378" text-anchor="middle" class="s">最小化、授权、保留、删除与人工复核</text>
<rect x="1090" y="315" width="300" height="85" rx="14" class="node"/><text x="1240" y="350" text-anchor="middle" class="h2">场景 SCENARIOS</text><text x="1240" y="378" text-anchor="middle" class="s">10 个可测试场景 + 非 AI 基线 + 退出路径</text></g>

<text x="70" y="470" class="h2">五阶段转化链</text>
<g><rect x="70" y="500" width="250" height="105" rx="18" class="stage"/><text x="195" y="540" text-anchor="middle" class="h2">1 研究</text><text x="195" y="572" text-anchor="middle" class="b">高校 / 实验室 / 人才</text>
<rect x="370" y="500" width="250" height="105" rx="18" class="stage"/><text x="495" y="540" text-anchor="middle" class="h2">2 转译</text><text x="495" y="572" text-anchor="middle" class="b">技术 → 城市问题</text>
<rect x="670" y="500" width="250" height="105" rx="18" class="stage"/><text x="795" y="540" text-anchor="middle" class="h2">3 测试</text><text x="795" y="572" text-anchor="middle" class="b">众智园受控验证</text>
<rect x="970" y="500" width="250" height="105" rx="18" class="stage"/><text x="1095" y="540" text-anchor="middle" class="h2">4 采用</text><text x="1095" y="572" text-anchor="middle" class="b">大钟寺 / 市场 / 交通</text>
<rect x="1270" y="500" width="250" height="105" rx="18" class="stage"/><text x="1395" y="540" text-anchor="middle" class="h2">5 长期生活</text><text x="1395" y="572" text-anchor="middle" class="b">AI 原点社区日常</text></g>
<path d="M320 553 L370 553" class="ln"/><path d="M620 553 L670 553" class="ln"/><path d="M920 553 L970 553" class="ln"/><path d="M1220 553 L1270 553" class="ln"/>

<rect x="70" y="675" width="1450" height="190" rx="22" class="core"/><text x="105" y="720" class="h2">共同治理合同：C7 城市完整度 + 可退出 AI</text><text x="105" y="765" class="b">HOME / LEARN / CARE / MOVE / GREEN / WORK / COMMON LIFE：技术只有在不破坏普通城市能力、且非 AI 基线持续可用时才允许扩围。</text><text x="105" y="805" class="b">测试证据至少记录：服务对象、空间位置、数据输入、责任角色、人工接管、停止阈值、维护责任、验收 KPI 与公众反馈。</text><text x="105" y="842" class="s">要素不是一次性“投入”：运营结果与公众反馈返回研究和资源配置端，形成下一轮迭代；未经验证的合作、资本、数据或算力安排均保持为概念建议。</text>
<path d="M1395 605 C1510 640 1515 690 1450 730" class="ln"/><path d="M120 675 C35 640 35 250 70 235" class="ln"/>

<rect x="70" y="900" width="1450" height="90" rx="16" class="warn"/><text x="105" y="935" class="h2">空间对应关系</text><text x="105" y="968" class="b">众智园：研发/测试｜AI 原点社区：长期生活/公共服务｜大钟寺：采用/商业/交通｜中关村科技服务翼：资本/IP/服务｜小月河场景赋能翼：公共空间与连续场景验证</text>
<text x="70" y="1025" class="s">概念建议，不构成官方功能分区、资源承诺、投资承诺、数据授权或实施审批。</text></svg>