<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img"><style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK TC",Arial,sans-serif;fill:#172033}.h1{font-size:50px;font-weight:700}.sub{font-size:20px;fill:#5f6b79}.h2{font-size:30px;font-weight:700}.b{font-size:19px}.s{font-size:15px;fill:#64748b}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.ground{fill:#d9dce1}.green{fill:#dff2e4}.water{fill:#d9eef8}.research{fill:#dcecff}.home{fill:#fde9d6}.civic{fill:#efe5ff}.retail{fill:#fff2b9}.test{fill:#edf2ff;stroke:#2563eb;stroke-width:3;stroke-dasharray:10 7}.route{fill:none;stroke:#0f766e;stroke-width:8;stroke-linecap:round}.walk{fill:none;stroke:#334155;stroke-width:5;stroke-linecap:round}.ai{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:9 7}.exit{fill:none;stroke:#b91c1c;stroke-width:3;stroke-dasharray:7 7}.thin{stroke:#94a3b8;stroke-width:2}.white{fill:#fff}</style><rect width="1800" height="1350" fill="#f7f9fc"/><text x="70" y="78" class="h1">v0.7｜三处重点区：三种不同的完整城市空间</text><text x="70" y="118" class="sub">不是三张 AI 展厅效果图：创新校园、长期社区、站城生活区在首层、公共空间、测试/服务接口和失败退出方式上必须不同。</text><g transform="translate(60,160)"><rect width="1680" height="330" rx="20" class="panel"/><text x="30" y="48" class="h2">01 众智园｜完整创新校园</text><text x="30" y="80" class="s">研发楼 + 公共绿脊 + 吃饭/休息 + 人工监护 + 受控测试口袋；测试不占普通通行。</text><rect x="30" y="250" width="1620" height="28" class="ground"/><rect x="95" y="125" width="250" height="125" rx="6" class="research"/><rect x="115" y="105" width="205" height="20" class="research"/><rect x="375" y="178" width="245" height="72" rx="8" class="retail"/><rect x="690" y="198" width="300" height="52" rx="8" class="green"/><rect x="1070" y="155" width="360" height="95" rx="12" class="test"/><rect x="1465" y="185" width="145" height="65" rx="8" class="civic"/><path d="M55 235 H1030" class="route"/><path d="M1030 235 H1450" class="walk"/><path d="M1110 180 C1210 125 1320 125 1400 180" class="ai"/><path d="M1100 275 C1220 3