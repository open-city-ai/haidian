anslate(60,880)"><rect width="1680" height="330" rx="20" class="panel"/><text x="30" y="48" class="h2">03 Dazhongsi | Complete Station-City Everyday District</text><text x="30" y="80" class="s">Fixed bilingual signs—staffed help—accessible interchange—ordinary retail/waiting—Jing-Zhang heritage public interface; dynamic information only enhances.</text><rect x="30" y="250" width="1620" height="28" class="ground"/><rect x="80" y="120" width="250" height="130" rx="6" class="research"/><rect x="365" y="175" width="210" height="75" rx="8" class="civic"/><rect x="650" y="190" width="250" height="60" rx="8" class="retail"/><rect x="980" y="165" width="240" height="85" rx="8" class="retail"/><rect x="1290" y="190" width="275" height="60" rx="8" class="green"/><path d="M55 235 H1600" class="route"/><path d="M90 165 C170 100 260 100 335 165" class="ai"/><path d="M75 278 C170 310 270 310 350 278" class="exit"/><circle cx="55" cy="217" r="7" fill="#172033"/><rect x="50" y="224" width="10" height="23" rx="4" fill="#172033"/><circle cx="340" cy="217" r="7" fill="#172033"/><rect x="335" y="224" width="10" height="23" rx="4" fill="#172033"/><circle cx="610" cy="217" r="7" fill="#172033"/><rect x="605" y="224" width="10" height="23" rx="4" fill="#172033"/><circle cx="930" cy="217" r="7" fill="#172033"/><rect x="925" y="224" width="10" height="23" rx="4" fill="#172033"/><circle cx="1260" cy="217" r="7" fill="#172033"/><rect x="1255" y="224" width="10" height="23" rx="4" fill="#172033"/><circle cx="1580" cy="217" r="7" fill="#172033"/><rect x="1575" y="224" width="10" height="23" rx="4" fill="#172033"/><rect x="1327.0" y="217.0" width="6.0" height="21.0" fill="#7c5b3e"/><circle cx="1330" cy="209.5" r="15.0" fill="#86c99a"/><rect x="1407.0" y="217.0" width="6.0" height="21.0" fill="#7c5b3e"/><circle cx="1410" cy="209.5" r="15.0" fill="#86c99a"/><rect x="1497.0" y="217.0" width="6.0" height="21.0" fill="#7c5b3e"/><circle cx="1500" cy="209.5" r="15.0" fill="#86c99a"/><text x="105" y="160" class="b">fixed bilingual signs / arrival</text><text x="395" y="210" class="b">staffed help</text><text x="680" y="220" class="b">accessible interchange</text><text x="1010" y="205" class="b">ordinary retail / waiting</text><text x="1320" y="220" class="b">heritage + civic green spine</text></g><text x="70" y="1265" class="b">Shared design discipline: after AI is off, devices are removed or accounts are refused, the three areas still function as a campus, a long-term neighborhood and a legible station-city district.</text><text x="70" y="1305" class="s">Concept-only · provisional key-area geometry · not a survey, regulatory plan, station engineering boundary or approved implementation.</text></svg>