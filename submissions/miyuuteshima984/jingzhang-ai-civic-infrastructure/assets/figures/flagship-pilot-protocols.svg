<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">京张城市完整度 v0.6 三个旗舰试点协议</title>
<desc id="desc">众智园低速机器人、AI原点社区无障碍照护导航、大钟寺换乘与多语导览三项概念测试协议，分别列出非AI基线、前置证据、责任角色、时间窗、验证指标、停止阈值和退出收据。</desc>
<style>
text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:42px;font-weight:700}.sub{font-size:19px;fill:#536273}.cardTitle{font-size:26px;font-weight:700}.label{font-size:15px;font-weight:700;fill:#4b5b6b}.body{font-size:16px}.small{font-size:14px;fill:#5f6c79}.box{fill:#fff;stroke:#cfd8e3;stroke-width:2}.headA{fill:#eef7ff}.headB{fill:#eef9f2}.headC{fill:#fff5eb}.note{fill:#fff9df;stroke:#d3a43d;stroke-width:2}.rule{stroke:#d8dee8;stroke-width:1}</style>
<rect width="1600" height="1120" fill="#f7f9fc"/>
<text x="70" y="72" class="h1">v0.6｜三个旗舰试点协议：先验证，再扩围</text>
<text x="70" y="108" class="sub">所有数量与时间均为概念测试配置，不代表已获批预算、合同、许可、场地或合作承诺；真实实施前必须由现实责任方核验。</text>

<g transform="translate(55,150)">
<rect width="480" height="820" rx="18" class="box"/><rect width="480" height="94" rx="18" class="headA"/><rect y="74" width="480" height="20" class="headA"/>
<text x="28" y="42" class="cardTitle">01 众智园｜低速机器人受控测试</text><text x="28" y="72" class="small">问题：研发测试如何不把普通公共通道变成默认试验场</text>
<text x="28" y="132" class="label">NON-AI BASELINE</text><text x="28" y="158" class="body">普通步行 + 人工配送 + 人工现场指引始终可用</text>
<line x1="28" y1="178" x2="452" y2="178" class="rule"/>
<text x="28" y="208" class="label">概念测试配置</text><text x="28" y="234" class="body">1 个封闭/可控测试院；2–4 台低速设备；</text><text x="28" y="258" class="body">每个活跃测试窗至少 2 名人工现场监护角色</text>
<text x="28" y="302" class="label">前置证据门</text><text x="28" y="328" class="body">场地许可、消防/疏散、设备安全、保险/责任、</text><text x="28" y="352" class="body">物理隔离与人工接管流程均确认后才可启动</text>
<text x="28" y="396" class="label">时间窗 / 决策</text><text x="28" y="422" class="body">14–30 天受控试验 → GO / REVISE / STOP</text>
<text x="28" y="466" class="label">KPI</text><text x="28" y="492" class="body">零进入未授权公共路线；人工接管可达；</text><text x="28" y="516" class="body">不降低普通通行能力；事件记录可复核</text>
<text x="28" y="560" class="label">自动停止阈值</text><text x="28" y="586" class="body">越界、失联、阻塞无障碍通道、人工接管失败</text>
<text x="28" y="630" class="label">退出收据</text><text x="28" y="656" class="body">设备撤离 + 临时设施复位 + 事件/数据清理记录</text>
<text x="28" y="700" class="label">责任结构</text><text x="28" y="726" class="body">A：现实运营责任方（待确认）</text><text x="28" y="750" class="body">R：现场测试负责人；C：安全/无障碍/运维；</text><text x="28" y="774" class="body">I：公众与场地管理方</text>
</g>

<g transform="translate(560,150)">
<rect width="480" height="820" rx="18" class="box"/><rect width="480" height="94" rx="18" class="headB"/><rect y="74" width="480" height="20" class="headB"/>
<text x="28" y="42" class="cardTitle">02 AI 原点｜无障碍 / 照护导航</text><text x="28" y="72" class="small">问题：数字辅助如何增强而不替代物理无障碍与人工服务</text>
<text x="28" y="132" class="label">NON-AI BASELINE</text><text x="28" y="158" class="body">连续物理无障碍 + 永久导视 + 人工服务台</text>
<line x1="28" y1="178" x2="452" y2="178" class="rule"/>
<text x="28" y="208" class="label">概念测试配置</text><text x="28" y="234" class="body">1 条已先完成物理走查的样板路径；</text><text x="28" y="258" class="body">10–20 次自愿、可撤回的使用会话作为概念上限</text>
<text x="28" y="302" class="label">前置证据门</text><text x="28" y="328" class="body">无障碍专业复核、服务时段、人工帮助、数据最小化、</text><text x="28" y="352" class="body">同意/退出与不注册账号的等价服务均确认</text>
<text x="28" y="396" class="label">时间窗 / 决策</text><text x="28" y="422" class="body">2–4 周小规模共测 → GO / REVISE / STOP</text>
<text x="28" y="466" class="label">KPI</text><text x="28" y="492" class="body">路径完成率不低于 baseline；人工帮助始终可达；</text><text x="28" y="516" class="body">拒绝追踪者不损失基本服务；错误可申诉</text>
<text x="28" y="560" class="label">自动停止阈值</text><text x="28" y="586" class="body">误导至不可达路径、敏感数据越界、人工复核不可用</text>
<text x="28" y="630" class="label">退出收据</text><text x="28" y="656" class="body">关闭个性化层 + 删除/迁移记录 + baseline 继续运行</text>
<text x="28" y="700" class="label">责任结构</text><text x="28" y="726" class="body">A：现实公共服务责任方（待确认）</text><text x="28" y="750" class="body">R：人工服务负责人；C：无障碍/隐私/社区；</text><text x="28" y="774" class="body">I：居民、照护者与使用者代表</text>
</g>

<g transform="translate(1065,150)">
<rect width="480" height="820" rx="18" class="box"/><rect width="480" height="94" rx="18" class="headC"/><rect y="74" width="480" height="20" class="headC"/>
<text x="28" y="42" class="cardTitle">03 大钟寺｜换乘 / 多语导览</text><text x="28" y="72" class="small">问题：复杂到达环境中 AI 能否提升可读性而不制造依赖</text>
<text x="28" y="132" class="label">NON-AI BASELINE</text><text x="28" y="158" class="body">静态导视 + 人工咨询 + 可独立理解的路径信息</text>
<line x1="28" y1="178" x2="452" y2="178" class="rule"/>
<text x="28" y="208" class="label">概念测试配置</text><text x="28" y="234" class="body">1 个经现场核验后的到达门户；2–3 条候选路径；</text><text x="28" y="258" class="body">中文 / 英文与无手机模式同时存在</text>
<text x="28" y="302" class="label">前置证据门</text><text x="28" y="328" class="body">真实站点/出入口/开放时段、物业/运营接口、</text><text x="28" y="352" class="body">无障碍与应急导向核验后才允许测试</text>
<text x="28" y="396" class="label">时间窗 / 决策</text><text x="28" y="422" class="body">14 天限期验证 → GO / REVISE / STOP</text>
<text x="28" y="466" class="label">KPI</text><text x="28" y="492" class="body">找路时间/求助次数相对 baseline 改善；</text><text x="28" y="516" class="body">静态导视独立可用；错误建议可人工纠正</text>
<text x="28" y="560" class="label">自动停止阈值</text><text x="28" y="586" class="body">出现危险导向、与现场状态冲突、人工更新失效</text>
<text x="28" y="630" class="label">退出收据</text><text x="28" y="656" class="body">关闭 AI 层 + 保留实体导视 + 发布纠错/关闭说明</text>
<text x="28" y="700" class="label">责任结构</text><text x="28" y="726" class="body">A：现实站城/公共界面责任方（待确认）</text><text x="28" y="750" class="body">R：现场信息服务负责人；C：交通/无障碍/运营；</text><text x="28" y="774" class="body">I：通勤者、访客、周边居民</text>
</g>

<rect x="55" y="1000" width="1490" height="78" rx="12" class="note"/><text x="80" y="1032" class="label">共同资源与成本边界</text><text x="80" y="1058" class="body">v0.6 只给出数量基础、人员角色和测试时长；货币预算、FTE 总量、采购、保险、合同与许可在现场和责任主体确认前保持 UNKNOWN，不用假数字换取“实施感”。</text>
<text x="55" y="1102" class="small">Concept proposal only. Provisional geometry remains non-official; no pilot above is represented as executed, funded, approved or contracted.</text>
</svg>