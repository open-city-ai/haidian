<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:44px;font-weight:700}.sub{font-size:18px;fill:#5f6b79}.h2{font-size:24px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#64748b}.c{fill:#fff;stroke:#d8e0ea;stroke-width:2}.g{fill:#d9f1df}.bl{fill:#dcecff}.ln{stroke:#0f766e;stroke-width:6}.ai{stroke:#2563eb;stroke-width:4;stroke-dasharray:9 8;fill:none}.x{stroke:#b91c1c;stroke-width:4;stroke-dasharray:7 7;fill:none}</style><rect width="1600" height="1000" fill="#f7f9fc"/><text x="60" y="68" class="h1">v0.7｜AI 改变城市形态：六类可逆物理接口</text><text x="60" y="104" class="sub">ordinary city baseline → 空间补齐 → 可选 AI → 退出后仍可用</text><g transform="translate(55,150)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">A｜测试口袋</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">测试边界与普通通行分开；撤设备后恢复普通院落。</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(565,150)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">B｜无障碍求助节点</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">坐凳、遮阴、实体导视、人工服务先成立，导航/翻译后叠加。</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(1075,150)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">C｜连续站城到达界面</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">固定双语导视、人工问询、休息与普通商业组成基础到达链。</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(55,500)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">D｜可替换服务节点</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">端侧算力、充电、维护做成可拆换节点，而不是永久巨构。</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(565,500)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">E｜人优先的公共首层</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">可坐、可停、可吃饭、可会面、可人工服务的空间优先于设备。</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(1075,500)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">F｜可回退空间版本链</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">观察 → 小范围原型 → 公共/专业复核 → 合并或回退。</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><text x="60" y="900" class="sub">共同原则：AI 不是第八类用地，而是让测试、服务、到达、基础设施与规划过程需要“可开 / 可停 / 可替换”的空间接口。</text><text x="60" y="940" class="s">Concept-only · all dimensions and engineering interfaces require later verification.</text></svg>