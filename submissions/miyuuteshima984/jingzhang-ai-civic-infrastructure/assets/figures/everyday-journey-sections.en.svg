<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:44px;font-weight:700}.sub{font-size:18px;fill:#5f6b79}.h2{font-size:26px;font-weight:700}.b{font-size:17px}.s{font-size:14px;fill:#64748b}.p{fill:#fff;stroke:#d7dee8;stroke-width:2}.g{fill:#d8f1df}.bl{fill:#dcecff}.w{fill:#fde8d0}.r{fill:none;stroke:#0f766e;stroke-width:8;stroke-linecap:round}.ai{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8}.x{fill:none;stroke:#b91c1c;stroke-width:4;stroke-dasharray:7 7}.human{fill:#172033}</style><rect width="1600" height="1000" fill="#f7f9fc"/><text x="60" y="68" class="h1">v0.7 | Three everyday journeys: start with a day in the city, then place AI</text><text x="60" y="104" class="sub">Black=people/ordinary city · Green=physical repair · Blue dash=optional AI · Red dash=functioning exit path</text><g transform="translate(55,145)"><rect width="1490" height="235" rx="18" class="p"/><text x="25" y="42" class="h2">01 Zhongzhiyuan | researcher + service worker</text><path d="M70 150 H1420" class="r"/><rect x="100" y="82" width="250" height="75" rx="12" class="bl"/><text x="116" y="126" class="b">arrival / work</text><rect x="455" y="82" width="250" height="75" rx="12" class="g"/><text x="471" y="126" class="b">food + rest</text><rect x="810" y="82" width="250" height="75" rx="12" class="w"/><text x="826" y="126" class="b">ordinary walking</text><rect x="1165" y="82" width="250" height="75" rx="12" class="g"/><text x="1181" y="126" class="b">bounded test yard</text><circle cx="72" cy="136" r="12" class="human"/><rect x="65" y="148" width="14" height="28" rx="5" class="human"/><path d="M1160 118 C1240 62 1340 62 1410 118" class="ai"/><path d="M1160 180 C1240 214 1340 214 1420 178" class="x"/><text x="25" y="215" class="s">Testing is physically separated from ordinary circulation; the campus still works after devices exit.</text></g><g transform="translate(55,405)"><rect width="1490" height="235" rx="18" class="p"/><text x="25" y="42" class="h2">02 AI Origin | older resident + carer + no-phone user</text><path d="M70 150 H1420" class="r"/><rect x="100" y="82" width="250" height="75" rx="12" class="bl"/><text x="116" y="126" class="b">home</text><rect x="455" y="82" width="250" height="75" rx="12" class="g"/><text x="471" y="126" class="b">shade + seating</text><rect x="810" y="82" width="250" height="75" rx="12" class="w"/><text x="826" y="126" class="b">care + staffed help</text><rect x="1165" y="82" width="250" height="75" rx="12" class="g"/><text x="1181" y="126" class="b">civic commons</text><circle cx="72" cy="136" r="12" class="human"/><rect x="65" y="148" width="14" height="28" rx="5" class="human"/><path d="M1160 118 C1240 62 1340 62 1410 118" class="ai"/><path d="M1160 180 C1240 214 1340 214 1420 178" class="x"/><text x="25" y="215" class="s">AI navigation layers onto physical accessibility and staffed help; refusing an account never degrades basic service.</text></g><g transform="translate(55,665)"><rect width="1490" height="235" rx="18" class="p"/><text x="25" y="42" class="h2">03 Dazhongsi | commuter + international visitor + service worker</text><path d="M70 150 H1420" class="r"/><rect x="100" y="82" width="250" height="75" rx="12" class="bl"/><text x="116" y="126" class="b">fixed bilingual signs</text><rect x="455" y="82" width="250" height="75" rx="12" class="g"/><text x="471" y="126" class="b">staffed interchange help</text><rect x="810" y="82" width="250" height="75" rx="12" class="w"/><text x="826" y="126" class="b">ordinary retail / rest</text><rect x="1165" y="82" width="250" height="75" rx="12" class="g"/><text x="1181" y="126" class="b">heritage + green spine</text><circle cx="72" cy="136" r="12" class="human"/><rect x="65" y="148" width="14" height="28" rx="5" class="human"/><path d="M1160 118 C1240 62 1340 62 1410 118" class="ai"/><path d="M1160 180 C1240 214 1340 214 1420 178" class="x"/><text x="25" y="215" class="s">Dynamic information may enhance legibility; bad advice falls back immediately to physical routes and human service.</text></g><text x="60" y="965" class="s">Concept-only · provisional geometry · real entrances, roads, permits, insurance and accountable parties require verification.</text></svg>