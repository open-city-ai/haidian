<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.t{font-weight:700;fill:#111827}.s{fill:#64748b}.h{font-weight:700;fill:#0f766e}.b{fill:#334155}</style><text x="60" y="72" font-size="42" class="t">v0.10｜三条公共城市承诺</text><text x="60" y="112" font-size="20" class="s">先把城市任务做成，再让 AI 成为可关闭增强层</text><rect x="60.0" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="60.0" y="170" width="477.3333333333333" height="14" rx="7" fill="#0f766e"/><text x="88.0" y="232" font-size="27" class="t">ARRIVE WITHOUT APP</text><circle cx="96.0" cy="281" r="8" fill="#0f766e"/><text x="118.0" y="288" font-size="19" class="h">普通城市</text><text x="118.0" y="319" font-size="16" class="b">固定双语导视 + 人工换乘 + 连续到达</text><circle cx="96.0" cy="373" r="8" fill="#0f766e"/><text x="118.0" y="380" font-size="19" class="h">空间</text><text x="118.0" y="411" font-size="16" class="b">站城首层可读、可停留、有人可问</text><circle cx="96.0" cy="465" r="8" fill="#0f766e"/><text x="118.0" y="472" font-size="19" class="h">AI OFF</text><text x="118.0" y="503" font-size="16" class="b">动态信息失效仍完成到达任务</text><rect x="561.3333333333333" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="561.3333333333333" y="170" width="477.3333333333333" height="14" rx="7" fill="#2563eb"/><text x="589.3333333333333" y="232" font-size="27" class="t">CARE WITHOUT ACCOUNT</text><circle cx="597.3333333333333" cy="281" r="8" fill="#2563eb"/><text x="619.3333333333333" y="288" font-size="19" class="h">普通城市</text><text x="619.3333333333333" y="319" font-size="16" class="b">家门 → 遮阴坐凳 → 人工照护 → 公共客厅</text><circle cx="597.3333333333333" cy="373" r="8" fill="#2563eb"/><text x="619.3333333333333" y="380" font-size="19" class="h">空间</text><text x="619.3333333333333" y="411" font-size="16" class="b">无手机/无账号不降低基本服务</text><circle cx="597.3333333333333" cy="465" r="8" fill="#2563eb"/><text x="619.3333333333333" y="472" font-size="19" class="h">AI OFF</text><text x="619.3333333333333" y="503" font-size="16" class="b">电话/纸质/人工与实体路径继续工作</text><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="14" rx="7" fill="#b45309"/><text x="1090.6666666666665" y="232" font-size="27" class="t">TEST WITHOUT BLOCKING</text><circle cx="1098.6666666666665" cy="281" r="8" fill="#b45309"/><text x="1120.6666666666665" y="288" font-size="19" class="h">普通城市</text><text x="1120.6666666666665" y="319" font-size="16" class="b">研究/服务/休息/步行路线先连续</text><circle cx="1098.6666666666665" cy="373" r="8" fill="#b45309"/><text x="1120.6666666666665" y="380" font-size="19" class="h">空间</text><text x="1120.6666666666665" y="411" font-size="16" class="b">测试口袋与公共通行物理分离</text><circle cx="1098.6666666666665" cy="465" r="8" fill="#b45309"/><text x="1120.6666666666665" y="472" font-size="19" class="h">STOP</text><text x="1120.6666666666665" y="503" font-size="16" class="b">测试可关可撤，不占普通城市底座</text><text x="60" y="848" font-size="16" class="s">三条承诺是城市设计验收问题，不是营销口号；真实位置、尺寸、工程与许可仍待现场和专业阶段核实。</text></svg>