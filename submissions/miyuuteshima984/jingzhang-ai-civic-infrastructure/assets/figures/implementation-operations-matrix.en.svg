<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc"><title id="title">Jing-Zhang Implementation and Long-Term Operations Matrix</title><desc id="desc">Eight work packages with space, proposed roles, prerequisites, start/stop thresholds, maintenance responsibility, and acceptance KPIs.</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:44px;font-weight:700}.h2{font-size:22px;font-weight:700}.b{font-size:16px}.s{font-size:13px}.head{fill:#eaf1f8;stroke:#697c92;stroke-width:2}.cell{fill:#fff;stroke:#a3adba;stroke-width:1.4}.core{fill:#edf7f2;stroke:#428a70;stroke-width:2}.warn{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}</style><rect width="2000" height="1400" fill="#fbfcfe"/><text x="55" y="70" class="h1">Jing-Zhang City Completeness v0.5 | Implementation &amp; Long-Term Operations Matrix</text><text x="55" y="108" class="b">All “roles” are proposed responsibility types. Real organizations, budgets, contracts, and approvals require later professional confirmation.</text>
<g transform="translate(55,150)"><rect width="1890" height="70" class="head"/><text x="115" y="44" text-anchor="middle" class="h2">Package</text><text x="340" y="44" text-anchor="middle" class="h2">Space</text><text x="590" y="44" text-anchor="middle" class="h2">Proposed roles</text><text x="865" y="44" text-anchor="middle" class="h2">Prerequisites</text><text x="1190" y="44" text-anchor="middle" class="h2">Start / stop thresholds</text><text x="1515" y="44" text-anchor="middle" class="h2">Maintenance</text><text x="1780" y="44" text-anchor="middle" class="h2">Acceptance KPI</text>
<g transform="translate(0,70)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">Public green spine</text><text x="250" y="40" class="b">north–south overall backbone</text><text x="470" y="40" class="b">planning / park / street</text><text x="470" y="68" class="s">operations + community reps</text><text x="740" y="38" class="s">official boundary/survey;</text><text x="740" y="66" class="s">fire, stormwater, accessibility review</text><text x="1030" y="36" class="s">start: walking/green baseline works</text><text x="1030" y="64" class="s">stop AI layer: blocks movement,</text><text x="1030" y="92" class="s">safety/privacy red line or poor maintenance</text><text x="1390" y="40" class="b">facility + landscape inspection</text><text x="1390" y="68" class="s">AI layer can shut down independently</text><text x="1680" y="38" class="s">continuous access, accessibility,</text><text x="1680" y="66" class="s">shade/stay, fault recovery</text></g>
<g transform="translate(0,205)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">Open test yard</text><text x="250" y="40" class="b">controlled Zhongzhiyuan zone</text><text x="470" y="40" class="b">test operations + safety officer</text><text x="470" y="68" class="s">R&amp;D team / site management</text><text x="740" y="38" class="s">boundary, speed, hours,</text><text x="740" y="66" class="s">human takeover + incident process</text><text x="1030" y="36" class="s">start: enclosure/review/takeover ready</text><text x="1030" y="64" class="s">stop: boundary breach, severe near miss,</text><text x="1030" y="92" class="s">takeover failure or unresolved complaint</text><text x="1390" y="40" class="b">daily opening check</text><text x="1390" y="68" class="s">logs + incident review</text><text x="1680" y="38" class="s">no unauthorized breach,</text><text x="1680" y="66" class="s">takeover success, recovery time</text></g>
<g transform="translate(0,340)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">Community commons</text><text x="250" y="40" class="b">AI Origin Community</text><text x="470" y="40" class="b">community operations + residents</text><text x="470" y="68" class="s">public-service/property interface</text><text x="740" y="38" class="s">free core hours, accessibility,</text><text x="740" y="66" class="s">human booking + appeal route</text><text x="1030" y="36" class="s">start: ordinary public function opens first</text><text x="1030" y="64" class="s">stop algorithmic scheduling: fairness drops,</text><text x="1030" y="92" class="s">complaints backlog or human route fails</text><text x="1390" y="40" class="b">daily staffing + monthly review</text><text x="1390" y="68" class="s">nonessential devices removable</text><text x="1680" y="38" class="s">free hours, conflict rate,</text><text x="1680" y="66" class="s">group fairness, complaint closure</text></g>
<g transform="translate(0,475)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">Station-city guidance</text><text x="250" y="40" class="b">Dazhongsi / south</text><text x="470" y="40" class="b">transport / district service</text><text x="470" y="68" class="s">wayfinding + accessibility expertise</text><text x="740" y="38" class="s">verified entrances/closures,</text><text x="740" y="66" class="s">statutory accessible paths</text><text x="1030" y="36" class="s">start: physical signs + staff complete</text><text x="1030" y="64" class="s">stop AI: route-error risk,</text><text x="1030" y="92" class="s">stale data or emergency mode</text><text x="1390" y="40" class="b">named information updater</text><text x="1390" y="68" class="s">switch to human mode in emergencies</text><text x="1680" y="38" class="s">error rate, transfer time,</text><text x="1680" y="66" class="s">accessible-route success</text></g>
<g transform="translate(0,610)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">AI retail pilot</text><text x="250" y="40" class="b">Dazhongsi / scenario node</text><text x="470" y="40" class="b">retail ops + consumer protection</text><text x="470" y="68" class="s">site/data responsibility</text><text x="740" y="38" class="s">term, exit clause, normal payment,</text><text x="740" y="66" class="s">complaint/refund/data permission</text><text x="1030" y="36" class="s">start: exit cost + restoration plan clear</text><text x="1030" y="64" class="s">stop: complaint/refund anomaly,</text><text x="1030" y="92" class="s">public-space impact or term expiry</text><text x="1390" y="40" class="b">weekly operations review</text><text x="1390" y="68" class="s">mandatory re-review at expiry</text><text x="1680" y="38" class="s">complaints/refunds, exit cost,</text><text x="1680" y="66" class="s">restoration completion</text></g>
<g transform="translate(0,745)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">Heritage guide</text><text x="250" y="40" class="b">heritage park / civic nodes</text><text x="470" y="40" class="b">cultural content editor</text><text x="470" y="68" class="s">public-space operator</text><text x="740" y="38" class="s">source ledger, fixed multilingual text,</text><text x="740" y="66" class="s">fact-correction route</text><text x="1030" y="36" class="s">start: all core narratives traceable</text><text x="1030" y="64" class="s">stop generation: source invalid,</text><text x="1030" y="92" class="s">fact errors cannot be corrected promptly</text><text x="1390" y="40" class="b">content version control</text><text x="1390" y="68" class="s">periodic factual review</text><text x="1680" y="38" class="s">source hit, correction,</text><text x="1680" y="66" class="s">multilingual/offline coverage</text></g>
<g transform="translate(0,880)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">Developer Open Week</text><text x="250" y="40" class="b">Zhongzhiyuan + civic nodes</text><text x="470" y="40" class="b">community/developer operations</text><text x="470" y="68" class="s">safety + public communication</text><text x="740" y="38" class="s">event boundary, public schedule,</text><text x="740" y="66" class="s">safety and IP rules</text><text x="1030" y="36" class="s">start: event/safety owner assigned</text><text x="1030" y="64" class="s">stop: safety event or</text><text x="1030" y="92" class="s">license/IP/privacy conditions fail</text><text x="1390" y="40" class="b">annual events calendar</text><text x="1390" y="68" class="s">post-event review each time</text><text x="1680" y="38" class="s">participation diversity,</text><text x="1680" y="66" class="s">problem conversion, event closure</text></g>
<g transform="translate(0,1015)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">Annual C7 audit</text><text x="250" y="40" class="b">overall area / three key areas</text><text x="470" y="40" class="b">planning / operations / public</text><text x="470" y="68" class="s">independent professional review</text><text x="740" y="38" class="s">versioned metrics/evidence ledger,</text><text x="740" y="66" class="s">open unresolved data gaps</text><text x="1030" y="36" class="s">start: annual data/feedback archived</text><text x="1030" y="64" class="s">stop scaling: any C7 capability</text><text x="1030" y="92" class="s">degrades materially without remedy</text><text x="1390" y="40" class="b">annual public review</text><text x="1390" y="68" class="s">next-iteration action list</text><text x="1680" y="38" class="s">C7 gap closure, provenance,</text><text x="1680" y="66" class="s">public-question closure</text></g></g>
<rect x="55" y="1290" width="1890" height="65" rx="14" class="warn"/><text x="85" y="1330" class="b">Operating principle: the AI layer must be independently stoppable. Ordinary city functions cannot disappear with an algorithm, vendor, or account system. Real roles, budgets, events, and cross-institution arrangements require separate confirmation.</text><text x="55" y="1382" class="s">Concept-stage validation matrix; not an organizational appointment, fiscal commitment, procurement contract, operating concession, or implementation approval.</text></svg>