<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250" role="img" aria-labelledby="title desc"><title id="title">京张城市完整度品牌与 VI 概念方向</title><desc id="desc">C7 城市完整度的品牌核心符号、命名层级、七项能力图标语法、中英传播和活动 IP 延展规则。</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:46px;font-weight:700}.h2{font-size:25px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.panel{fill:#fff;stroke:#8c9aac;stroke-width:2}.green{fill:#eaf7f1;stroke:#3f876c;stroke-width:2}.blue{fill:#edf5ff;stroke:#4b78b2;stroke-width:2}.warm{fill:#fff6e5;stroke:#a87c31;stroke-width:2}.dark{fill:#14213d}.rail{stroke:#14213d;stroke-width:12;stroke-linecap:round}.thin{stroke:#60748c;stroke-width:2;fill:none}</style><rect width="1900" height="1250" fill="#fbfcfe"/><text x="60" y="72" class="h1">京张城市完整度 v0.5｜品牌 / VI 概念方向</text><text x="60" y="110" class="b">定位：不是给城市贴“AI 科技皮肤”，而是让“普通城市能力 + 可退出 AI”成为可识别、可传播、可运营的共同语言。</text>
<rect x="60" y="155" width="600" height="440" rx="24" class="panel"/><text x="95" y="200" class="h2">核心符号方向：C7 COMPLETE LOOP</text><circle cx="360" cy="350" r="130" fill="none" stroke="#3f876c" stroke-width="24" stroke-dasharray="620 120" transform="rotate(-18 360 350)"/><line x1="290" y1="255" x2="290" y2="455" class="rail"/><line x1="430" y1="255" x2="430" y2="455" class="rail"/><g fill="#a87c31"><circle cx="290" cy="285" r="13"/><circle cx="290" cy="350" r="13"/><circle cx="290" cy="415" r="13"/><circle cx="430" cy="285" r="13"/><circle cx="430" cy="350" r="13"/><circle cx="430" cy="415" r="13"/><circle cx="360" cy="492" r="13"/></g><text x="360" y="365" text-anchor="middle" class="h1">C7</text><text x="360" y="535" text-anchor="middle" class="b">“未闭合的环” = 城市持续补齐，不宣称完成</text><text x="95" y="570" class="s">轨道双线来自京张线性记忆；七节点对应 C7。图形不得替代官方赛事/政府标识，也不模拟印章、徽章或审批章。</text>

<rect x="700" y="155" width="1140" height="440" rx="24" class="panel"/><text x="735" y="200" class="h2">命名与传播层级</text><text x="735" y="245" class="h1">京张城市完整度</text><text x="735" y="285" class="h2">JING-ZHANG CITY COMPLETENESS</text><text x="735" y="330" class="b">主张 / Proposition：先把城市做完整，再让 AI 进入日常。</text><text x="735" y="365" class="b">English proposition: Complete the city first, then let AI enter daily life.</text><line x1="735" y1="395" x2="1800" y2="395" class="thin"/><text x="735" y="435" class="b">二级识别：C7 能力标签 + 三重点区角色</text><text x="735" y="470" class="s">众智园 / ZHONGZHIYUAN — complete innovation campus</text><text x="735" y="500" class="s">AI 原点社区 / AI ORIGIN COMMUNITY — complete long-term community</text><text x="735" y="530" class="s">大钟寺 / DAZHONGSI — complete station-city life district</text><text x="735" y="565" class="s">“爽粉堡垒社区”仅为局部社区命名彩蛋，不进入城市级主品牌、不生成城堡造型或封闭空间语法。</text>

<text x="60" y="655" class="h2">C7 符号语法：文字优先、图标辅助，不让颜色成为唯一信息载体</text>
<g transform="translate(60,690)"><rect width="245" height="125" rx="16" class="green"/><text x="122" y="43" text-anchor="middle" class="h2">HOME 居</text><text x="122" y="77" text-anchor="middle" class="s">住房 / 长期生活</text><text x="122" y="102" text-anchor="middle" class="s">符号：屋檐 + 门</text></g><g transform="translate(320,690)"><rect width="245" height="125" rx="16" class="blue"/><text x="122" y="43" text-anchor="middle" class="h2">LEARN 学</text><text x="122" y="77" text-anchor="middle" class="s">学校 / 科研 / 学习</text><text x="122" y="102" text-anchor="middle" class="s">符号：展开页</text></g><g transform="translate(580,690)"><rect width="245" height="125" rx="16" class="warm"/><text x="122" y="43" text-anchor="middle" class="h2">CARE 护</text><text x="122" y="77" text-anchor="middle" class="s">托育 / 照护 / 服务</text><text x="122" y="102" text-anchor="middle" class="s">符号：双手 / 点</text></g><g transform="translate(840,690)"><rect width="245" height="125" rx="16" class="blue"/><text x="122" y="43" text-anchor="middle" class="h2">MOVE 行</text><text x="122" y="77" text-anchor="middle" class="s">步行 / 骑行 / 换乘</text><text x="122" y="102" text-anchor="middle" class="s">符号：连续路径</text></g><g transform="translate(1100,690)"><rect width="245" height="125" rx="16" class="green"/><text x="122" y="43" text-anchor="middle" class="h2">GREEN 绿</text><text x="122" y="77" text-anchor="middle" class="s">绿地 / 雨洪 / 遮阴</text><text x="122" y="102" text-anchor="middle" class="s">符号：叶 / 水滴</text></g><g transform="translate(1360,690)"><rect width="245" height="125" rx="16" class="warm"/><text x="122" y="43" text-anchor="middle" class="h2">WORK 工</text><text x="122" y="77" text-anchor="middle" class="s">研发 / 工作 / 创业</text><text x="122" y="102" text-anchor="middle" class="s">符号：连接节点</text></g><g transform="translate(1620,690)"><rect width="220" height="125" rx="16" class="green"/><text x="110" y="43" text-anchor="middle" class="h2">COMMON LIFE 交</text><text x="110" y="77" text-anchor="middle" class="s">公共生活 / 相遇</text><text x="110" y="102" text-anchor="middle" class="s">符号：共享圆桌</text></g>

<rect x="60" y="865" width="870" height="290" rx="20" class="panel"/><text x="95" y="910" class="h2">活动 / IP 延展（概念名称）</text><text x="95" y="952" class="b">City Completeness Week｜城市完整度开放周</text><text x="95" y="985" class="s">年度公开走查、C7 缺口发布、公众问题与下一轮行动清单</text><text x="95" y="1025" class="b">Open Test Yard｜开放测试场</text><text x="95" y="1058" class="s">众智园受控技术测试与 teach-back / 安全复盘</text><text x="95" y="1098" class="b">City Commons Hall + Jing-Zhang Civic Station</text><text x="95" y="1131" class="s">公共客厅与公共荣誉节点：先承担真实公共功能，再承担传播</text>
<rect x="970" y="865" width="870" height="290" rx="20" class="panel"/><text x="1005" y="910" class="h2">VI 使用规则</text><text x="1005" y="952" class="b">1. 中英文同级，不把英文缩成装饰性脚注。</text><text x="1005" y="990" class="b">2. 每张场景图同时出现 C7 能力标签与“AI 可退出”状态。</text><text x="1005" y="1028" class="b">3. 任何官方边界/审批状态与品牌传播层严格分开。</text><text x="1005" y="1066" class="b">4. 不使用政府徽记、官方印章、未经授权机构 Logo 或“已落地”措辞。</text><text x="1005" y="1104" class="b">5. 图标必须配文字/形状冗余，保证色觉差异用户仍可识别。</text><text x="1005" y="1142" class="s">最终视觉识别需在真实版权、商标、字体和赛事品牌规范确认后深化。</text>
<text x="60" y="1225" class="s">本图为投稿方案的原创概念 VI 方向，不是征集活动、海淀区或任何政府/机构的官方视觉识别系统。</text></svg>