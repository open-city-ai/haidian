<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Three Positionings—Five Functions—Three Areas and Two Wings—C7 City Completeness Loop</title>
<desc id="desc">Jing-Zhang City Completeness v0.5 coordination diagram linking three positionings, five functions, the three areas and two wings, key areas, and the C7 city-completeness feedback loop.</desc>
<style>
text{font-family:sans-serif;fill:#14213d}.h1{font-size:42px;font-weight:700}.h2{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px}.box{fill:#fff;stroke:#52627a;stroke-width:2}.soft{fill:#f4f7fb;stroke:#8a9bb2;stroke-width:2}.accent{fill:#eef8f4;stroke:#428a70;stroke-width:2}.warm{fill:#fff7e9;stroke:#aa7a2d;stroke-width:2}.blue{fill:#edf5ff;stroke:#4b78b2;stroke-width:2}.line{stroke:#5c6f86;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5c6f86"/></marker></defs>
<rect width="1600" height="1000" fill="#fbfcfe"/>
<text x="70" y="72" class="h1">Jing-Zhang City Completeness v0.5 | Taskbook Coordination Loop</text>
<text x="70" y="108" class="body">Complete the city first, then let AI enter daily life · all relationships are concept proposals for open-call review</text>

<text x="70" y="165" class="h2">Three positionings</text>
<rect x="70" y="185" width="360" height="82" rx="16" class="warm"/><text x="250" y="220" text-anchor="middle" class="h2">Centennial Jing-Zhang Cultural Belt</text><text x="250" y="248" text-anchor="middle" class="small">memory · civic narrative · global communication</text>
<rect x="470" y="185" width="360" height="82" rx="16" class="accent"/><text x="650" y="220" text-anchor="middle" class="h2">Urban AI Life Experience Belt</text><text x="650" y="248" text-anchor="middle" class="small">daily life · opt-out AI · public interest</text>
<rect x="870" y="185" width="360" height="82" rx="16" class="blue"/><text x="1050" y="220" text-anchor="middle" class="h2">AI Integrated Innovation Belt</text><text x="1050" y="248" text-anchor="middle" class="small">research · translation · testing · adoption</text>

<text x="70" y="330" class="h2">Five functions</text>
<rect x="70" y="352" width="270" height="92" rx="14" class="soft"/><text x="205" y="387" text-anchor="middle" class="body">Full-stack AI innovation</text><text x="205" y="416" text-anchor="middle" class="small">research / compute / testing</text>
<rect x="365" y="352" width="270" height="92" rx="14" class="soft"/><text x="500" y="387" text-anchor="middle" class="body">World-class AI ecosystem</text><text x="500" y="416" text-anchor="middle" class="small">talent / firms / civic life</text>
<rect x="660" y="352" width="270" height="92" rx="14" class="soft"/><text x="795" y="387" text-anchor="middle" class="body">AI+ scenario empowerment</text><text x="795" y="416" text-anchor="middle" class="small">scenarios / validation / feedback</text>
<rect x="955" y="352" width="270" height="92" rx="14" class="soft"/><text x="1090" y="387" text-anchor="middle" class="body">Vibrant AI-enabled city</text><text x="1090" y="416" text-anchor="middle" class="small">life / mobility / services</text>
<rect x="1250" y="352" width="270" height="92" rx="14" class="soft"/><text x="1385" y="387" text-anchor="middle" class="body">Global AI governance voice</text><text x="1385" y="416" text-anchor="middle" class="small">responsibility / transparency / exit</text>

<text x="70" y="510" class="h2">Three areas and two wings: turning functions into urban interfaces</text>
<rect x="70" y="535" width="275" height="122" rx="16" class="blue"/><text x="208" y="570" text-anchor="middle" class="h2">Zhongzhiyuan</text><text x="208" y="600" text-anchor="middle" class="body">AI Innovation Acceleration Area</text><text x="208" y="630" text-anchor="middle" class="small">R&amp;D—controlled tests—governance</text>
<rect x="370" y="535" width="275" height="122" rx="16" class="accent"/><text x="508" y="570" text-anchor="middle" class="h2">AI Origin Community</text><text x="508" y="600" text-anchor="middle" class="body">Long-term urban-life validation</text><text x="508" y="630" text-anchor="middle" class="small">housing—services—non-AI baseline</text>
<rect x="670" y="535" width="275" height="122" rx="16" class="warm"/><text x="808" y="570" text-anchor="middle" class="h2">Dazhongsi</text><text x="808" y="600" text-anchor="middle" class="body">AI Industry Cluster</text><text x="808" y="630" text-anchor="middle" class="small">market—mobility—urban adoption</text>
<rect x="995" y="535" width="250" height="122" rx="16" class="box"/><text x="1120" y="570" text-anchor="middle" class="h2">Zhongguancun Tech Service Wing</text><text x="1120" y="602" text-anchor="middle" class="small">capital · IP · professional services</text><text x="1120" y="630" text-anchor="middle" class="small">global factor allocation</text>
<rect x="1270" y="535" width="250" height="122" rx="16" class="box"/><text x="1395" y="570" text-anchor="middle" class="h2">Xiaoyuehe Scenario Wing</text><text x="1395" y="602" text-anchor="middle" class="small">public space · community · mobility</text><text x="1395" y="630" text-anchor="middle" class="small">continuous scenario validation</text>

<path d="M250 267 L205 352" class="line"/><path d="M650 267 L795 352" class="line"/><path d="M1050 267 L500 352" class="line"/>
<path d="M205 444 L208 535" class="line"/><path d="M500 444 L508 535" class="line"/><path d="M795 444 L1395 535" class="line"/><path d="M1090 444 L808 535" class="line"/><path d="M1385 444 L208 535" class="line"/>

<rect x="70" y="720" width="1450" height="190" rx="22" class="accent"/>
<text x="105" y="760" class="h2">C7 City Completeness = the shared acceptance floor for every AI and spatial proposal</text>
<text x="105" y="803" class="body">HOME · LEARN · CARE · MOVE · GREEN · WORK · COMMON LIFE</text>
<text x="105" y="844" class="body">Every scenario must answer: which ordinary city capability improves, what trade-off is created, and how does the non-AI baseline continue if AI fails or a resident opts out?</text>
<text x="105" y="880" class="small">Loop: research/service factors → three positionings → five functions → three areas/two wings → three key areas + 10 scenarios → C7 acceptance → operations/public feedback → next iteration</text>
<path d="M1395 657 C1500 680 1530 720 1480 765" class="line"/>
<path d="M165 720 C40 690 35 260 105 230" class="line"/>
<text x="70" y="960" class="small">Note: this diagram is not an official redline, statutory functional zoning, approval decision, or committed inter-district partnership. Spatial details and responsibilities require official data and professional review.</text>
</svg>