<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.t{font-weight:700;fill:#111827}.s{fill:#64748b}.h{font-weight:700;fill:#0f766e}.b{fill:#334155}</style><text x="60" y="72" font-size="42" class="t">C7 CIVIC STATION | One 1:1 city-completeness prototype</text><text x="60" y="112" font-size="20" class="s">ordinary city → staffed service → optional AI → controlled test → AI-OFF recovery</text><rect x="60.0" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="60.0" y="170" width="477.3333333333333" height="14" rx="7" fill="#0f766e"/><text x="88.0" y="232" font-size="27" class="t">Ordinary-city base</text><circle cx="96.0" cy="281" r="8" fill="#0f766e"/><text x="118.0" y="288" font-size="19" class="h">01 Shade + seating</text><text x="118.0" y="319" font-size="16" class="b">Stay first; interact later</text><circle cx="96.0" cy="373" r="8" fill="#0f766e"/><text x="118.0" y="380" font-size="19" class="h">02 Continuous access</text><text x="118.0" y="411" font-size="16" class="b">AI cannot patch a physical barrier</text><circle cx="96.0" cy="465" r="8" fill="#0f766e"/><text x="118.0" y="472" font-size="19" class="h">03 Fixed bilingual wayfinding</text><text x="118.0" y="503" font-size="16" class="b">Arrival still works offline</text><rect x="561.3333333333333" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="561.3333333333333" y="170" width="477.3333333333333" height="14" rx="7" fill="#2563eb"/><text x="589.3333333333333" y="232" font-size="27" class="t">Staffed + optional AI</text><circle cx="597.3333333333333" cy="281" r="8" fill="#2563eb"/><text x="619.3333333333333" y="288" font-size="19" class="h">04 No-account counter</text><text x="619.3333333333333" y="319" font-size="16" class="b">Paper/phone/human same task</text><circle cx="597.3333333333333" cy="373" r="8" fill="#2563eb"/><text x="619.3333333333333" y="380" font-size="19" class="h">05 Optional AI</text><text x="619.3333333333333" y="411" font-size="16" class="b">Minimal data; refusal allowed</text><circle cx="597.3333333333333" cy="465" r="8" fill="#2563eb"/><text x="619.3333333333333" y="472" font-size="19" class="h">06 Human takeover</text><text x="619.3333333333333" y="503" font-size="16" class="b">High-risk or failure goes human</text><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="14" rx="7" fill="#b45309"/><text x="1090.6666666666665" y="232" font-size="27" class="t">Controlled test + recovery</text><circle cx="1098.6666666666665" cy="281" r="8" fill="#b45309"/><text x="1120.6666666666665" y="288" font-size="19" class="h">07 Test pocket</text><text x="1120.6666666666665" y="319" font-size="16" class="b">Physically separate from passage</text><circle cx="1098.6666666666665" cy="373" r="8" fill="#b45309"/><text x="1120.6666666666665" y="380" font-size="19" class="h">08 Immediate stop</text><text x="1120.6666666666665" y="411" font-size="16" class="b">Stop right before scaling</text><circle cx="1098.6666666666665" cy="465" r="8" fill="#b45309"/><text x="1120.6666666666665" y="472" font-size="19" class="h">09 AI-OFF</text><text x="1120.6666666666665" y="503" font-size="16" class="b">Basic city function remains</text><text x="60" y="848" font-size="16" class="s">Concept prototype only; no site approval, construction, field performance or engineering clearance is claimed.</text></svg>