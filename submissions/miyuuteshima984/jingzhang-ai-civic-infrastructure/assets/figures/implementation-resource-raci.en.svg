<g transform="translate(55,870)"><rect width="1490" height="190" rx="16" class="gate"/><text x="28" y="42" class="h2">Shared decision gate: PRECONDITION → TEST → RECEIPT → DECISION</text>
<rect x="28" y="68" width="300" height="70" rx="12" class="pill"/><text x="178" y="98" text-anchor="middle" class="th">1 Preconditions evidenced</text><text x="178" y="121" text-anchor="middle" class="s">not complete = do not start</text>
<rect x="385" y="68" width="300" height="70" rx="12" class="pill"/><text x="535" y="98" text-anchor="middle" class="th">2 Time-bounded controlled test</text><text x="535" y="121" text-anchor="middle" class="s">AI-off baseline runs in parallel</text>
<rect x="742" y="68" width="300" height="70" rx="12" class="pill"/><text x="892" y="98" text-anchor="middle" class="th">3 Exit / fault receipt</text><text x="892" y="121" text-anchor="middle" class="s">remove, correct, delete, reset</text>
<rect x="1099" y="68" width="360" height="70" rx="12" class="go"/><text x="1279" y="98" text-anchor="middle" class="th">4 GO / REVISE / STOP</text><text x="1279" y="121" text-anchor="middle" class="s">scaling is never the default</text>
<text x="28" y="170" class="b">Shared boundary: if accountable parties, permits, safety, insurance, service hours or field conditions cannot be verified, the proposal remains a concept protocol; no fake budget, partnership or schedule fills the gap.</text></g>
<text x="55" y="1110" class="s">Concept-only implementation framework. Provisional geometry is non-official and is not a procurement, approval, contract or construction basis.</text>
