<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250" role="img" aria-labelledby="title desc"><title id="title">Jing-Zhang Regional Collaboration Validation Matrix</title><desc id="desc">Potential roles, exchanged factors, interfaces, data boundaries, and validation methods for Beiyuwei Community, Future Science City, Huairou Science City, Beijing E-Town, and Beijing–Tianjin–Hebei.</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:44px;font-weight:700}.h2{font-size:23px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.head{fill:#eaf1f8;stroke:#697c92;stroke-width:2}.cell{fill:#fff;stroke:#a3adba;stroke-width:1.5}.warn{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}.core{fill:#edf7f2;stroke:#428a70;stroke-width:2}</style><rect width="1900" height="1250" fill="#fbfcfe"/><text x="60" y="70" class="h1">Jing-Zhang City Completeness v0.5 | Regional Collaboration Validation Matrix</text><text x="60" y="108" class="b">Regional collaboration is framed as verifiable interfaces, not as unconfirmed institutional relationships presented as facts.</text>
<g transform="translate(60,155)"><rect width="1780" height="70" class="head"/><text x="140" y="44" text-anchor="middle" class="h2">Potential counterpart</text><text x="410" y="44" text-anchor="middle" class="h2">Proposed role</text><text x="730" y="44" text-anchor="middle" class="h2">Factors exchanged</text><text x="1040" y="44" text-anchor="middle" class="h2">Spatial/operating interface</text><text x="1360" y="44" text-anchor="middle" class="h2">Data/commitment boundary</text><text x="1640" y="44" text-anchor="middle" class="h2">Validation method</text>
<g transform="translate(0,70)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">Beiyuwei Community</text><text x="280" y="42" class="b">daily-life scenario comparison</text><text x="280" y="72" class="b">and service-feedback node</text><text x="580" y="42" class="b">resident needs, public-service</text><text x="580" y="72" class="b">experience, accessibility feedback</text><text x="900" y="42" class="b">community walk audits / public issues</text><text x="900" y="72" class="b">no assumed cross-area facility sharing</text><text x="1220" y="38" class="s">public/cleared material only;</text><text x="1220" y="66" class="s">no personal health/home data exchange;</text><text x="1220" y="94" class="s">no claim of existing agreement</text><text x="1540" y="42" class="b">shared issue list,</text><text x="1540" y="72" class="b">small service comparison</text><text x="1540" y="102" class="s">human review remains final</text></g>
<g transform="translate(0,230)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">Future Science City</text><text x="280" y="42" class="b">potential external node for</text><text x="280" y="72" class="b">research-to-city translation</text><text x="580" y="42" class="b">methods, talent exchange,</text><text x="580" y="72" class="b">public research outputs</text><text x="900" y="42" class="b">translation workshops,</text><text x="900" y="72" class="b">problem/case cross-checks</text><text x="1220" y="38" class="s">public/authorized material only;</text><text x="1220" y="66" class="s">no assumed compute, funding,</text><text x="1220" y="94" class="s">or institutional sharing</text><text x="1540" y="42" class="b">public-case review,</text><text x="1540" y="72" class="b">shared problem framing</text><text x="1540" y="102" class="s">PoC pre-review</text></g>
<g transform="translate(0,390)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">Huairou Science City</text><text x="280" y="42" class="b">reference for large-science</text><text x="280" y="72" class="b">and research-ecosystem methods</text><text x="580" y="42" class="b">public facility practices,</text><text x="580" y="72" class="b">cross-disciplinary methods</text><text x="900" y="42" class="b">method comparison and</text><text x="900" y="72" class="b">researcher-exchange concepts</text><text x="1220" y="38" class="s">no claim that facilities/capacity</text><text x="1220" y="66" class="s">are available; real operators</text><text x="1220" y="94" class="s">must confirm access separately</text><text x="1540" y="42" class="b">public-source comparison,</text><text x="1540" y="72" class="b">method-fit assessment</text><text x="1540" y="102" class="s">no resource reservation</text></g>
<g transform="translate(0,550)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">Beijing E-Town</text><text x="280" y="42" class="b">potential comparison for</text><text x="280" y="72" class="b">industrialization/market validation</text><text x="580" y="42" class="b">public industry cases,</text><text x="580" y="72" class="b">test-to-production practices</text><text x="900" y="42" class="b">case comparison and</text><text x="900" y="72" class="b">enterprise-needs methods</text><text x="1220" y="38" class="s">no assumed partnership, procurement,</text><text x="1220" y="66" class="s">investment, or orders; business data</text><text x="1220" y="94" class="s">requires authorization</text><text x="1540" y="42" class="b">anonymized case comparison,</text><text x="1540" y="72" class="b">market-exit review</text><text x="1540" y="102" class="s">test replicable mechanisms</text></g>
<g transform="translate(0,710)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">Beijing–Tianjin–Hebei</text><text x="280" y="42" class="b">research scale for cross-region</text><text x="280" y="72" class="b">talent/industry/governance questions</text><text x="580" y="42" class="b">public policy, industry-chain,</text><text x="580" y="72" class="b">commuting/innovation-network research</text><text x="900" y="42" class="b">research framework and case comparison;</text><text x="900" y="72" class="b">no unapproved new facility alignments</text><text x="1220" y="38" class="s">cross-region data must be aggregated,</text><text x="1220" y="66" class="s">public, or licensed; research links</text><text x="1220" y="94" class="s">are not administrative commitments</text><text x="1540" y="42" class="b">public-data cross-checks,</text><text x="1540" y="72" class="b">scenario testing + expert review</text><text x="1540" y="102" class="s">explicit uncertainty levels</text></g></g>
<rect x="60" y="1100" width="1780" height="95" rx="16" class="warn"/><text x="95" y="1138" class="h2">Collaboration admission rule</text><text x="325" y="1138" class="b">Verify public facts and counterpart authorization before joint testing. Naming an institution here marks only a potential interface; it does not mean consent, funding, data sharing, or implementation commitment.</text><text x="95" y="1174" class="s">Any personal, enterprise, health, household, location, or behavioral data requires separate minimization, permission, access, deletion, retention, and exit review.</text><text x="60" y="1230" class="s">Concept proposal for open-call review only; not a cooperation agreement, commercial contract, data authorization, planning approval, or administrative decision.</text></svg>