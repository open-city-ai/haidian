<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300" role="img" aria-labelledby="title desc"><title id="title">Jing-Zhang AI Scenario Data Flow and Privacy Governance</title><desc id="desc">Purpose, minimization, access, retention/deletion, human review, and opt-out rules for location, health/care, home environment, account identity, behavior/usage, and research/enterprise data.</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:44px;font-weight:700}.h2{font-size:22px;font-weight:700}.b{font-size:16px}.s{font-size:13px}.head{fill:#eaf1f8;stroke:#697c92;stroke-width:2}.cell{fill:#fff;stroke:#a3adba;stroke-width:1.4}.core{fill:#edf7f2;stroke:#428a70;stroke-width:2}.warn{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}</style><rect width="2000" height="1300" fill="#fbfcfe"/><text x="55" y="70" class="h1">Jing-Zhang City Completeness v0.5 | AI Scenario Data Flow &amp; Privacy Governance</text><text x="55" y="108" class="b">Principles: purpose limitation, data minimization, aggregation/anonymization by default, shortest necessary retention, access/deletion, human review, and no loss of basic city rights for opting out.</text>
<g transform="translate(55,150)"><rect width="1890" height="72" class="head"/><text x="125" y="46" text-anchor="middle" class="h2">Data class</text><text x="395" y="46" text-anchor="middle" class="h2">Allowed purpose</text><text x="690" y="46" text-anchor="middle" class="h2">Minimize / process</text><text x="995" y="46" text-anchor="middle" class="h2">Access control</text><text x="1290" y="46" text-anchor="middle" class="h2">Retention / deletion</text><text x="1590" y="46" text-anchor="middle" class="h2">Human review / opt-out</text><text x="1810" y="46" text-anchor="middle" class="h2">Scenarios</text>
<g transform="translate(0,72)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">Location / route</text><text x="270" y="40" class="b">navigation, accessible routing,</text><text x="270" y="70" class="b">controlled-test safety</text><text x="560" y="36" class="s">prefer ephemeral/on-device processing;</text><text x="560" y="64" class="s">use only precision needed for route/safety,</text><text x="560" y="92" class="s">no persistent travel-history profile</text><text x="860" y="36" class="s">user + authorized service role;</text><text x="860" y="64" class="s">operations receive aggregates</text><text x="1160" y="36" class="s">delete precise routes after session;</text><text x="1160" y="64" class="s">de-identify anomaly logs with limited term</text><text x="1460" y="36" class="s">route anomalies can go to staff;</text><text x="1460" y="64" class="s">physical wayfinding works with location off</text><text x="1760" y="50" class="s">01 / 04</text><text x="1760" y="78" class="s">08 / 10</text></g>
<g transform="translate(0,227)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">Health / care</text><text x="270" y="40" class="b">service navigation/referral only;</text><text x="270" y="70" class="b">no diagnosis/treatment decision</text><text x="560" y="36" class="s">avoid unnecessary records;</text><text x="560" y="64" class="s">prefer user-entered “what service</text><text x="560" y="92" class="s">is needed” rather than clinical detail</text><text x="860" y="36" class="s">user / authorized carer;</text><text x="860" y="64" class="s">high-risk requests go to humans</text><text x="1160" y="36" class="s">short-lived navigation session;</text><text x="1160" y="64" class="s">deletion request produces confirmation</text><text x="1460" y="36" class="s">high-risk advice requires human review;</text><text x="1460" y="64" class="s">direct staffed help remains available</text><text x="1760" y="50" class="s">04</text><text x="1760" y="78" class="s">service nav</text></g>
<g transform="translate(0,382)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">Home environment</text><text x="270" y="40" class="b">voluntary household-robot</text><text x="270" y="70" class="b">task validation</text><text x="560" y="36" class="s">on-device by default; no continuous</text><text x="560" y="64" class="s">purpose-free audio/video; visible notice</text><text x="560" y="92" class="s">when children/visitors are present</text><text x="860" y="36" class="s">authorized household members +</text><text x="860" y="64" class="s">necessary safety role only; R&amp;D gets de-ID results</text><text x="1160" y="36" class="s">raw home media not uploaded by default;</text><text x="1160" y="64" class="s">exit triggers deletion/revocation</text><text x="1460" y="36" class="s">one-step stop + human takeover;</text><text x="1460" y="64" class="s">refusal cannot reduce housing/community rights</text><text x="1760" y="50" class="s">05</text></g>
<g transform="translate(0,537)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">Account / identity</text><text x="270" y="40" class="b">booking, authorization, appeals</text><text x="270" y="70" class="b">where identity is necessary</text><text x="560" y="36" class="s">do not force registration where guest/</text><text x="560" y="64" class="s">anonymous use works; separate identity</text><text x="560" y="92" class="s">fields from behavioral data</text><text x="860" y="36" class="s">least privilege; role-based access;</text><text x="860" y="64" class="s">administrative access is audited</text><text x="1160" y="36" class="s">service-necessary term only;</text><text x="1160" y="64" class="s">account closure revokes permissions</text><text x="1460" y="36" class="s">staffed/no-account route required;</text><text x="1460" y="64" class="s">account failure cannot remove basic service</text><text x="1760" y="50" class="s">02 / 06</text><text x="1760" y="78" class="s">09</text></g>
<g transform="translate(0,692)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">Behavior / usage</text><text x="270" y="40" class="b">service quality, crowding,</text><text x="270" y="70" class="b">space-scheduling review</text><text x="560" y="36" class="s">prefer counts/aggregation; no face recognition;</text><text x="560" y="64" class="s">no cross-scenario individual profile</text><text x="860" y="36" class="s">operators see aggregates;</text><text x="860" y="64" class="s">individual debugging needs explicit reason</text><text x="1160" y="36" class="s">version aggregate stats;</text><text x="1160" y="64" class="s">delete individual logs quickly</text><text x="1460" y="36" class="s">humans can override scheduling;</text><text x="1460" y="64" class="s">public-space use cannot depend on tracking</text><text x="1760" y="50" class="s">06 / 08</text><text x="1760" y="78" class="s">09 / 10</text></g>
<g transform="translate(0,847)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">Research / enterprise</text><text x="270" y="40" class="b">equipment/compute matching,</text><text x="270" y="70" class="b">problem translation, pilot analysis</text><text x="560" y="36" class="s">public data first; trade secrets/research data</text><text x="560" y="64" class="s">need separate authorization and purpose limit</text><text x="860" y="36" class="s">project-level least privilege;</text><text x="860" y="64" class="s">no default cross-project reuse</text><text x="1160" y="36" class="s">project contract/authorization term;</text><text x="1160" y="64" class="s">delete or return at termination</text><text x="1460" y="36" class="s">sensitive content stays out of general models;</text><text x="1460" y="64" class="s">firms/researchers may reject automation</text><text x="1760" y="50" class="s">02 / 03</text><text x="1760" y="78" class="s">09</text></g></g>
<rect x="55" y="1125" width="1890" height="115" rx="16" class="warn"/><text x="90" y="1162" class="h2">Cross-scenario red lines</text><text x="300" y="1162" class="b">Do not trade tracking for movement, housing, basic services, or public-space access; do not delegate high-risk decisions to unsupervised models; do not extend one scenario’s authorization automatically to another.</text><text x="90" y="1198" class="s">Before real deployment, applicable data, cybersecurity, medical/care, transport, consumer-protection, and operating professionals must review the actual system under applicable law and contracts.</text><text x="55" y="1275" class="s">Concept-design governance requirements only. This does not claim completion of real-world DPIA, cybersecurity certification, medical compliance, cross-border data review, or any statutory approval.</text></svg>