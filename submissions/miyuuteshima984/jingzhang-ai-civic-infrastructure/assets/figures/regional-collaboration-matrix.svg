<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250" role="img" aria-labelledby="title desc"><title id="title">京张区域协同验证矩阵</title><desc id="desc">北纬社区、未来科学城、怀柔科学城、经开区、京津冀作为潜在协同对象的角色、交换要素、接口、数据边界与验证方式。</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:46px;font-weight:700}.h2{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.head{fill:#eaf1f8;stroke:#697c92;stroke-width:2}.cell{fill:#fff;stroke:#a3adba;stroke-width:1.5}.warn{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}.core{fill:#edf7f2;stroke:#428a70;stroke-width:2}</style><rect width="1900" height="1250" fill="#fbfcfe"/><text x="60" y="70" class="h1">京张城市完整度 v0.5｜区域协同验证矩阵</text><text x="60" y="108" class="b">把“区域协同”写成可验证接口，而不是把未确认的机构关系写成既成事实。</text>
<g transform="translate(60,155)"><rect width="1780" height="70" class="head"/><text x="140" y="44" text-anchor="middle" class="h2">潜在协同对象</text><text x="410" y="44" text-anchor="middle" class="h2">建议角色</text><text x="730" y="44" text-anchor="middle" class="h2">交换要素</text><text x="1040" y="44" text-anchor="middle" class="h2">空间/运营接口</text><text x="1360" y="44" text-anchor="middle" class="h2">数据与承诺边界</text><text x="1640" y="44" text-anchor="middle" class="h2">验证方式</text>
<!-- row 1 --><g transform="translate(0,70)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">北纬社区</text><text x="130" y="92" text-anchor="middle" class="s">Beiyuwei Community</text><text x="280" y="42" class="b">生活场景对照与</text><text x="280" y="72" class="b">社区服务反馈节点</text><text x="580" y="42" class="b">居民需求、公共服务</text><text x="580" y="72" class="b">体验、无障碍反馈</text><text x="900" y="42" class="b">社区走查/公开议题</text><text x="900" y="72" class="b">不预设跨区设施共享</text><text x="1220" y="38" class="s">仅用公开或清权资料；</text><text x="1220" y="66" class="s">不交换个人健康/家庭数据；</text><text x="1220" y="94" class="s">不声称已有合作协议</text><text x="1540" y="42" class="b">联合问题清单、</text><text x="1540" y="72" class="b">小规模服务对照</text><text x="1540" y="102" class="s">以人工复核为准</text></g>
<!-- row2 --><g transform="translate(0,230)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">未来科学城</text><text x="130" y="92" text-anchor="middle" class="s">Future Science City</text><text x="280" y="42" class="b">科研成果与城市问题</text><text x="280" y="72" class="b">转译的潜在外部节点</text><text x="580" y="42" class="b">研究方法、人才交流、</text><text x="580" y="72" class="b">公开技术成果</text><text x="900" y="42" class="b">研究—转译工作坊、</text><text x="900" y="72" class="b">问题/案例互证</text><text x="1220" y="38" class="s">仅公开成果与经授权材料；</text><text x="1220" y="66" class="s">不推定算力、机构、资金</text><text x="1220" y="94" class="s">已有共享安排</text><text x="1540" y="42" class="b">公开案例复核、</text><text x="1540" y="72" class="b">共同问题定义</text><text x="1540" y="102" class="s">PoC 前置审查</text></g>
<!-- row3 --><g transform="translate(0,390)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">怀柔科学城</text><text x="130" y="92" text-anchor="middle" class="s">Huairou Science City</text><text x="280" y="42" class="b">大科学装置/科研生态</text><text x="280" y="72" class="b">方法参考与人才接口</text><text x="580" y="42" class="b">公开科研设施经验、</text><text x="580" y="72" class="b">跨学科协作方法</text><text x="900" y="42" class="b">方法对照、研究者</text><text x="900" y="72" class="b">短期交流机制建议</text><text x="1220" y="38" class="s">不声称设备可用、容量可分配；</text><text x="1220" y="66" class="s">设施准入须由真实运营主体</text><text x="1220" y="94" class="s">另行确认</text><text x="1540" y="42" class="b">公开资料对照、</text><text x="1540" y="72" class="b">方法适配评估</text><text x="1540" y="102" class="s">不做资源预占</text></g>
<!-- row4 --><g transform="translate(0,550)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">北京经开区</text><text x="130" y="92" text-anchor="middle" class="s">Beijing E-Town</text><text x="280" y="42" class="b">产业化/制造/市场</text><text x="280" y="72" class="b">验证方法的潜在对照</text><text x="580" y="42" class="b">公开产业案例、</text><text x="580" y="72" class="b">测试—量产转化经验</text><text x="900" y="42" class="b">案例对照、企业</text><text x="900" y="72" class="b">需求定义方法</text><text x="1220" y="38" class="s">不假定企业合作、采购、</text><text x="1220" y="66" class="s">投资或订单；商业数据</text><text x="1220" y="94" class="s">必须授权</text><text x="1540" y="42" class="b">匿名案例比较、</text><text x="1540" y="72" class="b">市场退出复盘</text><text x="1540" y="102" class="s">验证可复制机制</text></g>
<!-- row5 --><g transform="translate(0,710)"><rect width="260" height="160" class="core"/><rect x="260" width="300" height="160" class="cell"/><rect x="560" width="320" height="160" class="cell"/><rect x="880" width="320" height="160" class="cell"/><rect x="1200" width="320" height="160" class="cell"/><rect x="1520" width="260" height="160" class="cell"/><text x="130" y="55" text-anchor="middle" class="h2">京津冀</text><text x="130" y="92" text-anchor="middle" class="s">Beijing–Tianjin–Hebei</text><text x="280" y="42" class="b">跨区域人才/产业/</text><text x="280" y="72" class="b">治理议题的研究尺度</text><text x="580" y="42" class="b">公开政策、产业链信息、</text><text x="580" y="72" class="b">通勤/创新网络研究</text><text x="900" y="42" class="b">研究框架与案例比较；</text><text x="900" y="72" class="b">不画未经批准的新设施线位</text><text x="1220" y="38" class="s">跨域数据必须聚合/公开/</text><text x="1220" y="66" class="s">有许可；不把研究联系</text><text x="1220" y="94" class="s">写成行政承诺</text><text x="1540" y="42" class="b">公开数据交叉验证、</text><text x="1540" y="72" class="b">情景推演与专家复核</text><text x="1540" y="102" class="s">逐级标注不确定性</text></g></g>
<rect x="60" y="1100" width="1780" height="95" rx="16" class="warn"/><text x="95" y="1138" class="h2">协同准入规则</text><text x="260" y="1138" class="b">先验证公开事实与对方授权，再进入联合测试；任何机构名称出现只表示潜在接口，不代表对方已同意、已出资、已共享数据或已作实施承诺。</text><text x="95" y="1174" class="s">涉及人员、企业、健康、家庭、位置或行为的数据必须另行通过最小化、许可、访问、删除、保留和退出审查。</text><text x="60" y="1230" class="s">本矩阵为开放征集阶段概念建议，不替代跨区合作协议、行业合同、数据授权、规划审批或行政决定。</text></svg>