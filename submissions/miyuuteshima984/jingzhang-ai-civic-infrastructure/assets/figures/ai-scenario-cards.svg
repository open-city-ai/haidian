<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1700" viewBox="0 0 2000 1700" role="img" aria-labelledby="title desc">
<title id="title">京张城市完整度 10 张 AI+ 场景卡</title><desc id="desc">十个 AI+ 场景的用户、地点、问题、AI 增强、非 AI 基线、退出与验收证据。</desc>
<style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:48px;font-weight:700}.h2{font-size:26px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.card{fill:#fff;stroke:#718096;stroke-width:2}.tag{fill:#edf7f2;stroke:#428a70;stroke-width:2}.foot{fill:#fff7e9;stroke:#a87c31;stroke-width:2}</style>
<rect width="2000" height="1700" fill="#fbfcfe"/><text x="70" y="72" class="h1">京张城市完整度 v0.5｜10 张 AI+ 场景卡</text><text x="70" y="112" class="b">统一合同：真实问题优先 · AI 为可选增强层 · 保留非 AI 基线 · 可人工接管 · 可停止/退出 · 用证据决定是否扩围</text>

<!-- left column -->
<g transform="translate(70,160)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-01</text><text x="155" y="50" class="h2">众智园低速机器人受控测试</text><text x="30" y="92" class="b">地点/用户：众智园封闭可审计测试区｜研发团队、园区使用者</text><text x="30" y="124" class="b">问题：具身设备进入真实环境前缺少安全、边界与人工接管验证</text><text x="30" y="156" class="b">AI 增强：低速导航、避障、任务执行；限定路线/时段/速度</text><text x="30" y="188" class="b">非 AI 基线/退出：普通通道永久保留；异常即人工接管并停止测试</text><text x="30" y="226" class="s">验收证据：人工接管率、近失事件、越界事件、测试停止后公共通行连续性</text></g>
<g transform="translate(70,440)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-02</text><text x="155" y="50" class="h2">科研设备与算力共享</text><text x="30" y="92" class="b">地点/用户：众智园科研服务节点｜高校、初创团队、研究人员</text><text x="30" y="124" class="b">问题：设备/算力信息碎片化，预约、容量和责任边界不透明</text><text x="30" y="156" class="b">AI 增强：需求匹配、排期建议、容量提醒；不自动授予权限</text><text x="30" y="188" class="b">非 AI 基线/退出：人工窗口与普通预约持续可用；争议转人工确认</text><text x="30" y="226" class="s">验收证据：排队时间、人工改派率、容量冲突率、无账号预约可达性</text></g>
<g transform="translate(70,720)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-03</text><text x="155" y="50" class="h2">高校成果—城市问题转译</text><text x="30" y="92" class="b">地点/用户：高校—众智园—社区接口｜研究者、公共服务方、居民</text><text x="30" y="124" class="b">问题：技术成果难被翻译成可验证的真实城市问题与责任边界</text><text x="30" y="156" class="b">AI 增强：问题归类、证据摘要、试验候选匹配；人类决定是否立项</text><text x="30" y="188" class="b">非 AI 基线/退出：公开问题清单、人工评议、纸面/线下参与渠道保留</text><text x="30" y="226" class="s">验收证据：问题闭环率、人工否决率、来源可追溯率、居民反馈覆盖</text></g>
<g transform="translate(70,1000)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-04</text><text x="155" y="50" class="h2">爽粉堡垒社区无障碍助手</text><text x="30" y="92" class="b">地点/用户：AI 原点社区｜老人、儿童家庭、行动/感知障碍者、访客</text><text x="30" y="124" class="b">问题：复杂路径、服务入口和临时障碍对部分人群不友好</text><text x="30" y="156" class="b">AI 增强：无障碍路径提示、服务导航、临时障碍提醒</text><text x="30" y="188" class="b">非 AI 基线/退出：实体导视、人工问询、连续无障碍设施先于算法存在</text><text x="30" y="226" class="s">验收证据：可达路径连续性、求助响应、错误引导率、无手机使用可达性</text></g>
<g transform="translate(70,1280)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-05</text><text x="155" y="50" class="h2">家庭机器人自愿测试</text><text x="30" y="92" class="b">地点/用户：AI 原点社区自愿家庭/公共模拟单元｜家庭、照护者、研发方</text><text x="30" y="124" class="b">问题：家庭环境测试涉及隐私、儿童/老人安全和退出后的服务连续性</text><text x="30" y="156" class="b">AI 增强：自愿任务辅助；场景级授权、最小化数据、可见状态提示</text><text x="30" y="188" class="b">非 AI 基线/退出：拒绝不损失社区权益；一键停止+人工/普通服务替代</text><text x="30" y="226" class="s">验收证据：主动退出恢复时间、数据删除确认、人工接管、事故/投诉记录</text></g>

<!-- right column -->
<g transform="translate(1030,160)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-06</text><text x="155" y="50" class="h2">社区共享空间调度</text><text x="30" y="92" class="b">地点/用户：AI 原点社区公共客厅/共享空间｜居民、社群、服务人员</text><text x="30" y="124" class="b">问题：空间预约冲突、弱势群体时段被挤占、运营信息不透明</text><text x="30" y="156" class="b">AI 增强：需求聚类、冲突提示、低利用时段建议；不自动取消预约</text><text x="30" y="188" class="b">非 AI 基线/退出：人工台账与现场窗口；公共基本时段不得算法化收费</text><text x="30" y="226" class="s">验收证据：冲突率、人工覆盖率、群体公平性、免费公共时段可用性</text></g>
<g transform="translate(1030,440)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-07</text><text x="155" y="50" class="h2">京张遗产多语导览</text><text x="30" y="92" class="b">地点/用户：京张遗址公园与公共节点｜居民、学生、国际访客</text><text x="30" y="124" class="b">问题：历史信息门槛高、语言覆盖不足、AI 容易生成无来源叙事</text><text x="30" y="156" class="b">AI 增强：多语问答与个性化路线；只基于可追溯资料输出</text><text x="30" y="188" class="b">非 AI 基线/退出：实体展签、人工导览、固定多语文本持续可读</text><text x="30" y="226" class="s">验收证据：来源命中率、事实纠错率、语言可达性、离线/无账号可用性</text></g>
<g transform="translate(1030,720)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-08</text><text x="155" y="50" class="h2">复杂换乘与步行辅助</text><text x="30" y="92" class="b">地点/用户：大钟寺及南段站城界面｜通勤者、访客、行动不便者</text><text x="30" y="124" class="b">问题：站城路径复杂、临时封闭与无障碍绕行信息难同步</text><text x="30" y="156" class="b">AI 增强：实时路径解释、拥挤提示、无障碍备选；不控制交通设施</text><text x="30" y="188" class="b">非 AI 基线/退出：实体导视、工作人员、法定无障碍路径是主系统</text><text x="30" y="226" class="s">验收证据：错误路线率、换乘耗时、无障碍路径成功率、人工求助量</text></g>
<g transform="translate(1030,1000)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-09</text><text x="155" y="50" class="h2">AI 原生商业限期试营</text><text x="30" y="92" class="b">地点/用户：大钟寺/场景赋能节点｜创业团队、顾客、周边普通商业</text><text x="30" y="124" class="b">问题：新业态需要真实市场验证，但不能长期占用公共资源或制造锁定</text><text x="30" y="156" class="b">AI 增强：试营服务、需求分析、运营辅助；时间/空间/数据边界预设</text><text x="30" y="188" class="b">非 AI 基线/退出：普通支付/服务入口；到期复盘，不达标即撤场恢复</text><text x="30" y="226" class="s">验收证据：试用转化、投诉/退款、退出恢复成本、公共空间占用影响</text></g>
<g transform="translate(1030,1280)"><rect width="900" height="260" rx="18" class="card"/><rect x="20" y="20" width="110" height="42" rx="10" class="tag"/><text x="75" y="49" text-anchor="middle" class="h2">SCN-10</text><text x="155" y="50" class="h2">C7 城市完整度巡检助手</text><text x="30" y="92" class="b">地点/用户：总体设计范围｜规划团队、运营方、公众参与者</text><text x="30" y="124" class="b">问题：方案升级容易只追技术亮点，忽略普通城市能力与证据缺口</text><text x="30" y="156" class="b">AI 增强：按 C7 检查缺口、证据、冲突与待复核项；不替代专业判断</text><text x="30" y="188" class="b">非 AI 基线/退出：人工清单、公开矩阵、专业审核始终为最终判断</text><text x="30" y="226" class="s">验收证据：缺口关闭率、人工推翻率、证据追溯率、公众问题闭环率</text></g>

<rect x="70" y="1580" width="1860" height="75" rx="14" class="foot"/><text x="100" y="1614" class="h2">扩围规则</text><text x="230" y="1614" class="b">只有安全、公共利益、隐私、非 AI 基线与维护责任同时满足，场景才从“小范围测试”进入下一阶段；任何红线触发都允许停止并恢复普通城市服务。</text><text x="100" y="1646" class="s">所有 KPI 为概念阶段的验证指标方向，不是已发生的绩效结果或政府承诺。</text></svg>