<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">京张城市完整度 v0.6 实施资源与 RACI 证据门</title><desc id="desc">三个旗舰试点的资源数量基础、责任结构、维护频率、审批安全前置门和 GO REVISE STOP 决策路径。所有货币预算与真实主体仍待确认。</desc>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:42px;font-weight:700}.sub{font-size:18px;fill:#5b6876}.h2{font-size:23px;font-weight:700}.th{font-size:15px;font-weight:700}.b{font-size:14px}.s{font-size:13px;fill:#596675}.box{fill:#fff;stroke:#d3dbe5;stroke-width:2}.head{fill:#edf3fa}.gate{fill:#fff7e8;stroke:#d1a044}.go{fill:#edf9f1;stroke:#5b9a6e}.line{stroke:#d3dbe5;stroke-width:1}.pill{fill:#eef6ff;stroke:#7ba2cc}</style>
<rect width="1600" height="1160" fill="#f7f9fc"/><text x="60" y="70" class="h1">v0.6｜实施资源与 RACI：把“可实施”拆成可核验前置门</text><text x="60" y="106" class="sub">本表只给概念数量基础、职责和维护节奏。货币预算、总 FTE、采购主体、保险合同和审批结论在现实核验前保持 UNKNOWN。</text>

<g transform="translate(55,150)">
<rect width="1490" height="680" rx="16" class="box"/><rect width="1490" height="68" rx="16" class="head"/><rect y="52" width="1490" height="16" class="head"/>
<text x="20" y="42" class="th">试点 / PILOT</text><text x="250" y="42" class="th">数量基础 / RESOURCE BASIS</text><text x="610" y="42" class="th">RACI 责任结构</text><text x="955" y="42" class="th">维护节奏</text><text x="1190" y="42" class="th">启动前证据门</text>
<line x1="225" y1="0" x2="225" y2="680" class="line"/><line x1="585" y1="0" x2="585" y2="680" class="line"/><line x1="930" y1="0" x2="930" y2="680" class="line"/><line x1="1165" y1="0" x2="1165" y2="680" class="line"/>

<g transform="translate(0,68)"><rect width="1490" height="190" fill="#fff"/><text x="20" y="38" class="h2">众智园</text><text x="20" y="70" class="b">低速机器人受控测试</text><text x="20" y="100" class="s">14–30 天概念窗</text>
<text x="250" y="36" class="b">• 1 个可控测试院</text><text x="250" y="62" class="b">• 2–4 台低速设备</text><text x="250" y="88" class="b">• 每活跃窗 ≥2 个人工监护角色</text><text x="250" y="114" class="b">• 临时隔离 / 停止标识可撤除</text><text x="250" y="144" class="s">成本等级：M（概念）｜货币值 UNKNOWN</text>
<text x="610" y="36" class="b">A：现实运营责任方（待确认）</text><text x="610" y="62" class="b">R：现场测试负责人</text><text x="610" y="88" class="b">C：安全 / 无障碍 / 运维 / 保险</text><text x="610" y="114" class="b">I：场地管理方 / 公众</text>
<text x="955" y="36" class="b">每日开场前设备与路线检查</text><text x="955" y="62" class="b">每个测试窗事件登记</text><text x="955" y="88" class="b">每日闭场复位</text><text x="955" y="114" class="b">每周 GO/REVISE/STOP 汇总</text>
<text x="1190" y="36" class="b">场地许可</text><text x="1190" y="62" class="b">消防 / 疏散</text><text x="1190" y="88" class="b">设备安全</text><text x="1190" y="114" class="b">责任 / 保险</text><text x="1190" y="140" class="b">物理隔离 + 人工接管</text></g>

<g transform="translate(0,258)"><rect width="1490" height="190" fill="#fbfcfe"/><text x="20" y="38" class="h2">AI 原点</text><text x="20" y="70" class="b">无障碍 / 照护导航</text><text x="20" y="100" class="s">2–4 周概念窗</text>
<text x="250" y="36" class="b">• 1 条已先物理走查的样板路径</text><text x="250" y="62" class="b">• 10–20 次自愿、可撤回会话上限</text><text x="250" y="88" class="b">• 1 个固定人工服务点 / 服务窗口</text><text x="250" y="114" class="b">• L1/L2 非 AI 导视持续可用</text><text x="250" y="144" class="s">成本等级：S–M（概念）｜货币值 UNKNOWN</text>
<text x="610" y="36" class="b">A：现实公共服务责任方（待确认）</text><text x="610" y="62" class="b">R：人工服务负责人</text><text x="610" y="88" class="b">C：无障碍 / 隐私 / 社区 / 照护</text><text x="610" y="114" class="b">I：居民 / 照护者 / 使用者代表</text>
<text x="955" y="36" class="b">每日开场检查实体路径</text><text x="955" y="62" class="b">每次错误建议人工复核</text><text x="955" y="88" class="b">每周删除 / 保留记录核对</text><text x="955" y="114" class="b">阶段末公开问题清单</text>
<text x="1190" y="36" class="b">无障碍专业复核</text><text x="1190" y="62" class="b">人工服务时段</text><text x="1190" y="88" class="b">最小化数据方案</text><text x="1190" y="114" class="b">同意 / 退出机制</text><text x="1190" y="140" class="b">无账号等价服务</text></g>

<g transform="translate(0,448)"><rect width="1490" height="190" fill="#fff"/><text x="20" y="38" class="h2">大钟寺</text><text x="20" y="70" class="b">换乘 / 多语导览</text><text x="20" y="100" class="s">14 天概念窗</text>
<text x="250" y="36" class="b">• 1 个现场核验后的到达门户</text><text x="250" y="62" class="b">• 2–3 条候选路径</text><text x="250" y="88" class="b">• 中文 / 英文 / 无手机三种入口</text><text x="250" y="114" class="b">• 静态导视保留并可独立使用</text><text x="250" y="144" class="s">成本等级：S–M（概念）｜货币值 UNKNOWN</text>
<text x="610" y="36" class="b">A：现实站城 / 公共界面责任方（待确认）</text><text x="610" y="62" class="b">R：现场信息服务负责人</text><text x="610" y="88" class="b">C：交通 / 无障碍 / 物业 / 运营</text><text x="610" y="114" class="b">I：通勤者 / 访客 / 周边居民</text>
<text x="955" y="36" class="b">每日开放前状态核验</text><text x="955" y="62" class="b">现场变化即时人工更新</text><text x="955" y="88" class="b">错误导向当天关闭 / 纠正</text><text x="955" y="114" class="b">第 7 / 14 天比较 baseline</text>
<text x="1190" y="36" class="b">真实出入口 / 开放时段</text><text x="1190" y="62" class="b">物业 / 运营接口</text><text x="1190" y="88" class="b">无障碍路线核验</text><text x="1190" y="114" class="b">应急导向一致性</text><text x="1190" y="140" class="b">人工更新责任明确</text></g>
</g>

<g transform="translate(55,870)"><rect width="1490" height="190" rx="16" class="gate"/><text x="28" y="42" class="h2">统一决策门：PRECONDITION → TEST → RECEIPT → DECISION</text>
<rect x="28" y="68" width="300" height="70" rx="12" class="pill"/><text x="178" y="98" text-anchor="middle" class="th">1 前置证据齐备</text><text x="178" y="121" text-anchor="middle" class="s">未齐备 = 不启动</text>
<rect x="385" y="68" width="300" height="70" rx="12" class="pill"/><text x="535" y="98" text-anchor="middle" class="th">2 限期受控测试</text><text x="535" y="121" text-anchor="middle" class="s">AI-off baseline 同时运行</text>
<rect x="742" y="68" width="300" height="70" rx="12" class="pill"/><text x="892" y="98" text-anchor="middle" class="th">3 退出 / 故障收据</text><text x="892" y="121" text-anchor="middle" class="s">撤除、纠错、删除、复位</text>
<rect x="1099" y="68" width="360" height="70" rx="12" class="go"/><text x="1279" y="98" text-anchor="middle" class="th">4 GO / REVISE / STOP</text><text x="1279" y="121" text-anchor="middle" class="s">扩围不是默认结果</text>
<text x="28" y="170" class="b">共同边界：若真实责任主体、许可、安全、保险、服务时段或现场条件无法确认，方案停留在概念协议层；不得用假预算、假合作或假实施时间表补齐证据。</text></g>
<text x="55" y="1110" class="s">Concept-only implementation framework. Provisional geometry is non-official and is not a procurement, approval, contract or construction basis.</text>
</svg>