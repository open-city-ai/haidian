<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:44px;font-weight:700}.sub{font-size:18px;fill:#5f6b79}.h2{font-size:26px;font-weight:700}.b{font-size:17px}.s{font-size:14px;fill:#64748b}.p{fill:#fff;stroke:#d7dee8;stroke-width:2}.g{fill:#d8f1df}.bl{fill:#dcecff}.w{fill:#fde8d0}.r{fill:none;stroke:#0f766e;stroke-width:8;stroke-linecap:round}.ai{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8}.x{fill:none;stroke:#b91c1c;stroke-width:4;stroke-dasharray:7 7}.human{fill:#172033}</style><rect width="1600" height="1000" fill="#f7f9fc"/><text x="60" y="68" class="h1">v0.7｜三条日常城市链：先看人怎么过一天，再看 AI 放在哪里</text><text x="60" y="104" class="sub">黑色=人和普通城市功能 · 绿色=物理空间补齐 · 蓝色虚线=可选 AI · 红色虚线=失败/退出后仍可走</text><g transform="translate(55,145)"><rect width="1490" height="235" rx="18" class="p"/><text x="25" y="42" class="h2">01 众智园｜研究者 + 服务劳动者</text><path d="M70 150 H1420" class="r"/><rect x="100" y="82" width="250" height="75" rx="12" class="bl"/><text x="116" y="126" class="b">到达 / 工作</text><rect x="455" y="82" width="250" height="75" rx="12" class="g"/><text x="471" y="126" class="b">吃饭 + 休息</text><rect x="810" y="82" width="250" height="75" rx="12" class="w"/><text x="826" y="126" class="b">普通步行</text><rect x="1165" y="82" width="250" height="75" rx="12" class="g"/><text x="1181" y="126" class="b">受控测试院</text><circle cx="72" cy="136" r="12" class="human"/><rect x="65" y="148" width="14" height="28" rx="5" class="human"/><path d="M1160 118 C1240 62 1340 62 1410 118" class="ai"/><path d="M1160 180 C1240 214 1340 214 1420 178" class="x"/><text x="25" y="215" class="s">测试空间与普通通行物理分开；设备退出后仍是完整创新校园。</text></g><g transform="translate(55,405)"><rect width="1490" height="235" rx="18" class="p"/><text x="25" y="42" class="h2">02 AI 原点｜老人 + 照护者 + 无手机使用者</text><path d="M70 150 H1420" class="r"/><rect x="100" y="82" width="250" height="75" rx="12" class="bl"/><text x="116" y="126" class="b">家门</text><rect x="455" y="82" width="250" height="75" rx="12" class="g"/><text x="471" y="126" class="b">遮阴 + 坐凳</text><rect x="810" y="82" width="250" height="75" rx="12" class="w"/><text x="826" y="126" class="b">照护 + 人工服务</text><rect x="1165" y="82" width="250" height="75" rx="12" class="g"/><text x="1181" y="126" class="b">公共客厅</text><circle cx="72" cy="136" r="12" class="human"/><rect x="65" y="148" width="14" height="28" rx="5" class="human"/><path d="M1160 118 C1240 62 1340 62 1410 118" class="ai"/><path d="M1160 180 C1240 214 1340 214 1420 178" class="x"/><text x="25" y="215" class="s">AI 导航只叠加在物理无障碍和人工求助上；拒绝账号不降低基本服务。</text></g><g transform="translate(55,665)"><rect width="1490" height="235" rx="18" class="p"/><text x="25" y="42" class="h2">03 大钟寺｜通勤者 + 国际访客 + 服务劳动者</text><path d="M70 150 H1420" class="r"/><rect x="100" y="82" width="250" height="75" rx="12" class="bl"/><text x="116" y="126" class="b">固定双语导视</text><rect x="455" y="82" width="250" height="75" rx="12" class="g"/><text x="471" y="126" class="b">人工换乘帮助</text><rect x="810" y="82" width="250" height="75" rx="12" class="w"/><text x="826" y="126" class="b">普通商业 / 休息</text><rect x="1165" y="82" width="250" height="75" rx="12" class="g"/><text x="1181" y="126" class="b">遗产 + 公共绿脊</text><circle cx="72" cy="136" r="12" class="human"/><rect x="65" y="148" width="14" height="28" rx="5" class="human"/><path d="M1160 118 C1240 62 1340 62 1410 118" class="ai"/><path d="M1160 180 C1240 214 1340 214 1420 178" class="x"/><text x="25" y="215" class="s">动态信息可增强可读性；错误建议时立即回到实体路径与人工服务。</text></g><text x="60" y="965" class="s">Concept-only · provisional geometry · 真实站口、道路、许可、保险与责任主体需另行核验。</text></svg>