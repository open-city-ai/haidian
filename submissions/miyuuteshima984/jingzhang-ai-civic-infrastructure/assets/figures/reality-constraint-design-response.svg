<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.t{font-weight:700;fill:#111827}.s{fill:#64748b}.h{font-weight:700;fill:#0f766e}.b{fill:#334155}</style><text x="60" y="72" font-size="42" class="t">REALITY → DESIGN｜现实资料必须改变空间判断</text><text x="60" y="112" font-size="20" class="s">3 组官方现实锚点 → 5 条设计响应；unknown 仍然可以是正确答案</text><rect x="60.0" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="60.0" y="170" width="477.3333333333333" height="14" rx="7" fill="#0f766e"/><text x="88.0" y="232" font-size="27" class="t">节点不是一种</text><circle cx="96.0" cy="281" r="8" fill="#0f766e"/><text x="118.0" y="288" font-size="19" class="h">知春路</text><text x="118.0" y="319" font-size="16" class="b">下穿铁路 → 竖向连续性待解</text><circle cx="96.0" cy="373" r="8" fill="#0f766e"/><text x="118.0" y="380" font-size="19" class="h">普通缝合</text><text x="118.0" y="411" font-size="16" class="b">只表达连接需求，不造工程线位</text><circle cx="96.0" cy="465" r="8" fill="#0f766e"/><text x="118.0" y="472" font-size="19" class="h">站城到达</text><text x="118.0" y="503" font-size="16" class="b">固定导视+人工服务先成立</text><rect x="561.3333333333333" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="561.3333333333333" y="170" width="477.3333333333333" height="14" rx="7" fill="#2563eb"/><text x="589.3333333333333" y="232" font-size="27" class="t">界面有优先级</text><circle cx="597.3333333333333" cy="281" r="8" fill="#2563eb"/><text x="619.3333333333333" y="288" font-size="19" class="h">京张绿廊</text><text x="619.3333333333333" y="319" font-size="16" class="b">连续步行与停留优先</text><circle cx="597.3333333333333" cy="373" r="8" fill="#2563eb"/><text x="619.3333333333333" y="380" font-size="19" class="h">公共首层</text><text x="619.3333333333333" y="411" font-size="16" class="b">人优先、可读、可进入</text><circle cx="597.3333333333333" cy="465" r="8" fill="#2563eb"/><text x="619.3333333333333" y="472" font-size="19" class="h">AI/物流模块</text><text x="619.3333333333333" y="503" font-size="16" class="b">退到不切断公共通行的位置</text><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="14" rx="7" fill="#b45309"/><text x="1090.6666666666665" y="232" font-size="27" class="t">数值只作标尺</text><circle cx="1098.6666666666665" cy="281" r="8" fill="#b45309"/><text x="1120.6666666666665" y="288" font-size="19" class="h">7 个地块</text><text x="1120.6666666666665" y="319" font-size="16" class="b">FAR 2.20–5.00 仅现实参照</text><circle cx="1098.6666666666665" cy="373" r="8" fill="#b45309"/><text x="1120.6666666666665" y="380" font-size="19" class="h">高度 24–80m</text><text x="1120.6666666666665" y="411" font-size="16" class="b">不转写为本案控制</text><circle cx="1098.6666666666665" cy="465" r="8" fill="#b45309"/><text x="1120.6666666666665" y="472" font-size="19" class="h">official 到位</text><text x="1120.6666666666665" y="503" font-size="16" class="b">整包重算，不手工平移</text><text x="60" y="848" font-size="16" class="s">v0.9 并行候选：来源不按数量加分，只按是否改变设计判断进入主叙事。</text></svg>