<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300" role="img" aria-labelledby="title desc"><title id="title">京张 AI 场景数据流与隐私治理表</title><desc id="desc">位置、健康照护、家庭环境、账号身份、行为使用、科研企业六类数据的目的、最小化、访问、保留删除、人工复核与退出规则。</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:46px;font-weight:700}.h2{font-size:23px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.head{fill:#eaf1f8;stroke:#697c92;stroke-width:2}.cell{fill:#fff;stroke:#a3adba;stroke-width:1.4}.core{fill:#edf7f2;stroke:#428a70;stroke-width:2}.warn{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}</style><rect width="2000" height="1300" fill="#fbfcfe"/><text x="55" y="70" class="h1">京张城市完整度 v0.5｜AI 场景数据流与隐私治理表</text><text x="55" y="108" class="b">原则：目的限定、数据最小化、默认聚合/匿名、最短必要保留、可访问/删除、人工复核、拒绝参与不损失基本城市权益。</text>
<g transform="translate(55,150)"><rect width="1890" height="72" class="head"/><text x="125" y="46" text-anchor="middle" class="h2">数据类别</text><text x="395" y="46" text-anchor="middle" class="h2">允许目的</text><text x="690" y="46" text-anchor="middle" class="h2">最小化 / 处理</text><text x="995" y="46" text-anchor="middle" class="h2">访问控制</text><text x="1290" y="46" text-anchor="middle" class="h2">保留 / 删除</text><text x="1590" y="46" text-anchor="middle" class="h2">人工复核 / 退出</text><text x="1810" y="46" text-anchor="middle" class="h2">适用场景</text>
<g transform="translate(0,72)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">位置 / 路径</text><text x="270" y="40" class="b">导航、无障碍路线、</text><text x="270" y="70" class="b">受控测试安全</text><text x="560" y="36" class="s">优先瞬时/端侧处理；</text><text x="560" y="64" class="s">只取完成路线或安全判断</text><text x="560" y="92" class="s">所需精度，不建长期轨迹</text><text x="860" y="36" class="s">用户本人 + 经授权服务角色；</text><text x="860" y="64" class="s">运营分析使用聚合结果</text><text x="1160" y="36" class="s">会话结束即删除精细轨迹；</text><text x="1160" y="64" class="s">异常日志去标识后限期保存</text><text x="1460" y="36" class="s">路线异常可转人工；</text><text x="1460" y="64" class="s">关闭定位后仍可看实体导视</text><text x="1760" y="50" class="s">01 / 04</text><text x="1760" y="78" class="s">08 / 10</text></g>
<g transform="translate(0,227)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">健康 / 照护</text><text x="270" y="40" class="b">仅服务导航、求助转介，</text><text x="270" y="70" class="b">不做诊断/治疗决策</text><text x="560" y="36" class="s">不收集不必要病历；</text><text x="560" y="64" class="s">优先由用户主动输入</text><text x="560" y="92" class="s">“需要何种服务”</text><text x="860" y="36" class="s">本人/照护授权人员；</text><text x="860" y="64" class="s">高风险请求直接转人工</text><text x="1160" y="36" class="s">导航会话短期保存；</text><text x="1160" y="64" class="s">删除请求可执行并记录结果</text><text x="1460" y="36" class="s">任何高风险建议必须人工；</text><text x="1460" y="64" class="s">不用 AI 可直接人工问询</text><text x="1760" y="50" class="s">04</text><text x="1760" y="78" class="s">服务导航</text></g>
<g transform="translate(0,382)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">家庭环境</text><text x="270" y="40" class="b">自愿家庭机器人</text><text x="270" y="70" class="b">任务验证</text><text x="560" y="36" class="s">默认端侧；禁做持续无目的录音录像；</text><text x="560" y="64" class="s">儿童/访客进入时可见提示</text><text x="860" y="36" class="s">家庭授权成员 + 必要安全员；</text><text x="860" y="64" class="s">研发只取去标识测试结果</text><text x="1160" y="36" class="s">原始家庭媒体默认不上传；</text><text x="1160" y="64" class="s">测试退出时执行删除/撤权</text><text x="1460" y="36" class="s">一键停止；人工接管；</text><text x="1460" y="64" class="s">拒绝测试不损失住房/社区权益</text><text x="1760" y="50" class="s">05</text></g>
<g transform="translate(0,537)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">账号 / 身份</text><text x="270" y="40" class="b">预约、授权、申诉</text><text x="270" y="70" class="b">必要身份确认</text><text x="560" y="36" class="s">能匿名/访客完成的不强制注册；</text><text x="560" y="64" class="s">身份字段与行为数据分离</text><text x="860" y="36" class="s">最小权限；角色分级；</text><text x="860" y="64" class="s">管理访问留审计记录</text><text x="1160" y="36" class="s">按服务必要期限；</text><text x="1160" y="64" class="s">账号注销同步撤销授权</text><text x="1460" y="36" class="s">必须提供人工/无账号渠道；</text><text x="1460" y="64" class="s">账号异常不得剥夺基本服务</text><text x="1760" y="50" class="s">02 / 06</text><text x="1760" y="78" class="s">09</text></g>
<g transform="translate(0,692)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">行为 / 使用</text><text x="270" y="40" class="b">服务质量、拥挤、</text><text x="270" y="70" class="b">空间调度复盘</text><text x="560" y="36" class="s">优先计数/聚合，不做人脸识别；</text><text x="560" y="64" class="s">不建立跨场景个人画像</text><text x="860" y="36" class="s">运营只看聚合指标；</text><text x="860" y="64" class="s">个案排错须有明确事由</text><text x="1160" y="36" class="s">聚合统计版本化保存；</text><text x="1160" y="64" class="s">个体日志按最短期限删除</text><text x="1460" y="36" class="s">算法调度可人工推翻；</text><text x="1460" y="64" class="s">公共空间使用不依赖被追踪</text><text x="1760" y="50" class="s">06 / 08</text><text x="1760" y="78" class="s">09 / 10</text></g>
<g transform="translate(0,847)"><rect width="250" height="155" class="core"/><rect x="250" width="290" height="155" class="cell"/><rect x="540" width="300" height="155" class="cell"/><rect x="840" width="300" height="155" class="cell"/><rect x="1140" width="300" height="155" class="cell"/><rect x="1440" width="300" height="155" class="cell"/><rect x="1740" width="150" height="155" class="cell"/><text x="125" y="52" text-anchor="middle" class="h2">科研 / 企业</text><text x="270" y="40" class="b">设备/算力匹配、</text><text x="270" y="70" class="b">问题转译与试营分析</text><text x="560" y="36" class="s">公开信息优先；商业秘密/研究数据</text><text x="560" y="64" class="s">必须单独授权并限定用途</text><text x="860" y="36" class="s">项目级最小权限；</text><text x="860" y="64" class="s">不得跨项目默认复用</text><text x="1160" y="36" class="s">按项目合同/授权期限；</text><text x="1160" y="64" class="s">终止后删除或归还</text><text x="1460" y="36" class="s">敏感内容不进入通用模型；</text><text x="1460" y="64" class="s">企业/研究者可拒绝自动分析</text><text x="1760" y="50" class="s">02 / 03</text><text x="1760" y="78" class="s">09</text></g></g>
<rect x="55" y="1125" width="1890" height="115" rx="16" class="warn"/><text x="90" y="1162" class="h2">跨场景红线</text><text x="250" y="1162" class="b">不以接受追踪换取通行、住房、基本服务或公共空间使用权；不把高风险判断交给无人监督模型；不把一次场景授权自动扩展到其他场景。</text><text x="90" y="1198" class="s">真实系统落地前须由相应的数据、网络安全、医疗/照护、交通、消费者保护和专业运营主体根据适用法律与合同进一步审查。</text><text x="55" y="1275" class="s">本表是概念设计阶段的数据治理要求，不声称已完成现实世界 DPIA、等保、医疗合规、数据出境评估或任何法定审批。</text></svg>