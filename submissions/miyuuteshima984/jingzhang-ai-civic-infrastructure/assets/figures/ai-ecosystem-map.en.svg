<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Jing-Zhang AI Full-Factor Ecosystem Map</title><desc id="desc">Land, space, industry, capital, talent, compute, data, and scenarios are linked through research, translation, testing, adoption, and long-term life.</desc>
<style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:42px;font-weight:700}.h2{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.node{fill:#fff;stroke:#73849a;stroke-width:2}.core{fill:#edf7f2;stroke:#428a70;stroke-width:3}.stage{fill:#edf5ff;stroke:#4b78b2;stroke-width:2}.warn{fill:#fff8e8;stroke:#a87c31;stroke-width:2}.ln{stroke:#637489;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#637489"/></marker></defs>
<rect width="1600" height="1050" fill="#fbfcfe"/><text x="70" y="72" class="h1">Jing-Zhang AI Full-Factor Ecosystem | From Resource Stack to Urban Validation Loop</text><text x="70" y="108" class="b">Eight factor classes enter one continuous research—translation—testing—adoption—long-term-life process rather than a static park inventory.</text>
<text x="70" y="168" class="h2">Eight factors</text>
<g><rect x="70" y="195" width="300" height="85" rx="14" class="node"/><text x="220" y="230" text-anchor="middle" class="h2">LAND</text><text x="220" y="258" text-anchor="middle" class="s">hosts uses; creates no new statutory “AI land” class</text>
<rect x="410" y="195" width="300" height="85" rx="14" class="node"/><text x="560" y="230" text-anchor="middle" class="h2">SPACE</text><text x="560" y="258" text-anchor="middle" class="s">testbeds, communities, parks, station-city interfaces</text>
<rect x="750" y="195" width="300" height="85" rx="14" class="node"/><text x="900" y="230" text-anchor="middle" class="h2">INDUSTRY</text><text x="900" y="258" text-anchor="middle" class="s">R&amp;D, pilots, enterprise services, AI-native businesses</text>
<rect x="1090" y="195" width="300" height="85" rx="14" class="node"/><text x="1240" y="230" text-anchor="middle" class="h2">CAPITAL</text><text x="1240" y="258" text-anchor="middle" class="s">conceptual capital/IP/service interfaces, no commitments</text>
<rect x="70" y="315" width="300" height="85" rx="14" class="node"/><text x="220" y="350" text-anchor="middle" class="h2">TALENT</text><text x="220" y="378" text-anchor="middle" class="s">researchers, founders, service workers, long-term families</text>
<rect x="410" y="315" width="300" height="85" rx="14" class="node"/><text x="560" y="350" text-anchor="middle" class="h2">COMPUTE</text><text x="560" y="378" text-anchor="middle" class="s">shared equipment/compute with access and capacity limits</text>
<rect x="750" y="315" width="300" height="85" rx="14" class="node"/><text x="900" y="350" text-anchor="middle" class="h2">DATA</text><text x="900" y="378" text-anchor="middle" class="s">minimization, consent, retention, deletion, human review</text>
<rect x="1090" y="315" width="300" height="85" rx="14" class="node"/><text x="1240" y="350" text-anchor="middle" class="h2">SCENARIOS</text><text x="1240" y="378" text-anchor="middle" class="s">10 testable scenarios + non-AI baselines + exit paths</text></g>

<text x="70" y="470" class="h2">Five-stage conversion chain</text>
<g><rect x="70" y="500" width="250" height="105" rx="18" class="stage"/><text x="195" y="540" text-anchor="middle" class="h2">1 RESEARCH</text><text x="195" y="572" text-anchor="middle" class="b">universities / labs / talent</text>
<rect x="370" y="500" width="250" height="105" rx="18" class="stage"/><text x="495" y="540" text-anchor="middle" class="h2">2 TRANSLATE</text><text x="495" y="572" text-anchor="middle" class="b">technology → city problem</text>
<rect x="670" y="500" width="250" height="105" rx="18" class="stage"/><text x="795" y="540" text-anchor="middle" class="h2">3 TEST</text><text x="795" y="572" text-anchor="middle" class="b">controlled Zhongzhiyuan trials</text>
<rect x="970" y="500" width="250" height="105" rx="18" class="stage"/><text x="1095" y="540" text-anchor="middle" class="h2">4 ADOPT</text><text x="1095" y="572" text-anchor="middle" class="b">Dazhongsi / market / mobility</text>
<rect x="1270" y="500" width="250" height="105" rx="18" class="stage"/><text x="1395" y="540" text-anchor="middle" class="h2">5 LIVE</text><text x="1395" y="572" text-anchor="middle" class="b">AI Origin Community daily life</text></g>
<path d="M320 553 L370 553" class="ln"/><path d="M620 553 L670 553" class="ln"/><path d="M920 553 L970 553" class="ln"/><path d="M1220 553 L1270 553" class="ln"/>

<rect x="70" y="675" width="1450" height="190" rx="22" class="core"/><text x="105" y="720" class="h2">Shared governance contract: C7 City Completeness + opt-out AI</text><text x="105" y="765" class="b">HOME / LEARN / CARE / MOVE / GREEN / WORK / COMMON LIFE: technology may scale only if ordinary city capabilities remain intact and a non-AI baseline stays usable.</text><text x="105" y="805" class="b">Test evidence records at least: user, place, data inputs, accountable role, human takeover, stop threshold, maintenance owner, acceptance KPI, and public feedback.</text><text x="105" y="842" class="s">Factors are not one-off inputs: operating evidence and public feedback return to research and resource allocation. Unverified partnerships, capital, data, or compute arrangements remain concept proposals.</text>
<path d="M1395 605 C1510 640 1515 690 1450 730" class="ln"/><path d="M120 675 C35 640 35 250 70 235" class="ln"/>

<rect x="70" y="900" width="1450" height="90" rx="16" class="warn"/><text x="105" y="935" class="h2">Spatial correspondence</text><text x="105" y="968" class="b">Zhongzhiyuan: R&amp;D/testing | AI Origin Community: long-term life/public services | Dazhongsi: adoption/commerce/mobility | Zhongguancun Service Wing: capital/IP/services | Xiaoyuehe Scenario Wing: public-space and continuous-scenario validation</text>
<text x="70" y="1025" class="s">Concept proposal only; not statutory zoning, resource commitment, investment commitment, data authorization, or implementation approval.</text></svg>