<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">三大定位—五大功能—三区两翼—C7 城市完整度协同闭环</title>
<desc id="desc">京张城市完整度 v0.5 协同框架图，展示三大定位、五大功能、三区两翼、三处重点区与 C7 城市完整度之间的反馈闭环。</desc>
<style>
text{font-family:sans-serif;fill:#14213d}.h1{font-size:44px;font-weight:700}.h2{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#52627a;stroke-width:2}.soft{fill:#f4f7fb;stroke:#8a9bb2;stroke-width:2}.accent{fill:#eef8f4;stroke:#428a70;stroke-width:2}.warm{fill:#fff7e9;stroke:#aa7a2d;stroke-width:2}.blue{fill:#edf5ff;stroke:#4b78b2;stroke-width:2}.line{stroke:#5c6f86;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5c6f86"/></marker></defs>
<rect width="1600" height="1000" fill="#fbfcfe"/>
<text x="70" y="72" class="h1">京张城市完整度 v0.5｜任务书协同闭环</text>
<text x="70" y="108" class="body">先把城市做完整，再让 AI 进入日常 · 所有协同关系均为开放征集阶段概念建议</text>

<text x="70" y="165" class="h2">三大定位</text>
<rect x="70" y="185" width="360" height="82" rx="16" class="warm"/><text x="250" y="220" text-anchor="middle" class="h2">百年京张文化带</text><text x="250" y="248" text-anchor="middle" class="small">记忆 · 公共叙事 · 国际传播</text>
<rect x="470" y="185" width="360" height="82" rx="16" class="accent"/><text x="650" y="220" text-anchor="middle" class="h2">都市 AI 生活体验带</text><text x="650" y="248" text-anchor="middle" class="small">真实日常 · 可退出 AI · 公共利益</text>
<rect x="870" y="185" width="360" height="82" rx="16" class="blue"/><text x="1050" y="220" text-anchor="middle" class="h2">AI 融合创新带</text><text x="1050" y="248" text-anchor="middle" class="small">研究 · 转译 · 测试 · 采用</text>

<text x="70" y="330" class="h2">五大功能</text>
<rect x="70" y="352" width="270" height="92" rx="14" class="soft"/><text x="205" y="387" text-anchor="middle" class="body">AI 全栈自主创新体系</text><text x="205" y="416" text-anchor="middle" class="small">科研 / 算力 / 测试</text>
<rect x="365" y="352" width="270" height="92" rx="14" class="soft"/><text x="500" y="387" text-anchor="middle" class="body">世界级 AI 创新生态</text><text x="500" y="416" text-anchor="middle" class="small">人才 / 企业 / 公共生活</text>
<rect x="660" y="352" width="270" height="92" rx="14" class="soft"/><text x="795" y="387" text-anchor="middle" class="body">AI+ 场景赋能新范式</text><text x="795" y="416" text-anchor="middle" class="small">场景 / 验证 / 反馈</text>
<rect x="955" y="352" width="270" height="92" rx="14" class="soft"/><text x="1090" y="387" text-anchor="middle" class="body">智能化 AI 活力城市</text><text x="1090" y="416" text-anchor="middle" class="small">生活 / 交通 / 服务</text>
<rect x="1250" y="352" width="270" height="92" rx="14" class="soft"/><text x="1385" y="387" text-anchor="middle" class="body">AI 治理全球话语权</text><text x="1385" y="416" text-anchor="middle" class="small">责任 / 透明 / 可退出</text>

<text x="70" y="510" class="h2">三区两翼：把功能变成城市接口</text>
<rect x="70" y="535" width="275" height="122" rx="16" class="blue"/><text x="208" y="570" text-anchor="middle" class="h2">众智园</text><text x="208" y="600" text-anchor="middle" class="body">自主创新加速区</text><text x="208" y="630" text-anchor="middle" class="small">研发—受控测试—治理</text>
<rect x="370" y="535" width="275" height="122" rx="16" class="accent"/><text x="508" y="570" text-anchor="middle" class="h2">AI 原点社区</text><text x="508" y="600" text-anchor="middle" class="body">长期城市生活验证</text><text x="508" y="630" text-anchor="middle" class="small">居住—服务—非 AI 基线</text>
<rect x="670" y="535" width="275" height="122" rx="16" class="warm"/><text x="808" y="570" text-anchor="middle" class="h2">大钟寺</text><text x="808" y="600" text-anchor="middle" class="body">AI 产业集聚区</text><text x="808" y="630" text-anchor="middle" class="small">市场—交通—城市采用</text>
<rect x="995" y="535" width="250" height="122" rx="16" class="box"/><text x="1120" y="570" text-anchor="middle" class="h2">中关村科技服务翼</text><text x="1120" y="602" text-anchor="middle" class="small">资本 · IP · 专业服务</text><text x="1120" y="630" text-anchor="middle" class="small">全球要素配置</text>
<rect x="1270" y="535" width="250" height="122" rx="16" class="box"/><text x="1395" y="570" text-anchor="middle" class="h2">小月河场景赋能翼</text><text x="1395" y="602" text-anchor="middle" class="small">公共空间 · 社区 · 移动</text><text x="1395" y="630" text-anchor="middle" class="small">连续场景验证</text>

<path d="M250 267 L205 352" class="line"/><path d="M650 267 L795 352" class="line"/><path d="M1050 267 L500 352" class="line"/>
<path d="M205 444 L208 535" class="line"/><path d="M500 444 L508 535" class="line"/><path d="M795 444 L1395 535" class="line"/><path d="M1090 444 L808 535" class="line"/><path d="M1385 444 L208 535" class="line"/>

<rect x="70" y="720" width="1450" height="190" rx="22" class="accent"/>
<text x="105" y="760" class="h2">C7 城市完整度 = 所有 AI 与空间提案的共同验收底盘</text>
<text x="105" y="803" class="body">HOME 居　 LEARN 学　 CARE 护　 MOVE 行　 GREEN 绿　 WORK 工　 COMMON LIFE 交</text>
<text x="105" y="844" class="body">每个场景必须回答：改善哪项普通城市能力？是否挤压另一项能力？AI 失效或居民拒绝使用时，非 AI 基线如何继续？</text>
<text x="105" y="880" class="small">闭环：研究/服务要素 → 三大定位 → 五大功能 → 三区两翼 → 三重点区与 10 个场景 → C7 验收 → 运营数据与公众反馈 → 下一轮迭代</text>
<path d="M1395 657 C1500 680 1530 720 1480 765" class="line"/>
<path d="M165 720 C40 690 35 260 105 230" class="line"/>
<text x="70" y="960" class="small">注：本图不构成官方红线、法定功能分区、审批结论或既定跨区协作承诺；具体空间与责任主体须随官方资料和专业深化复核。</text>
</svg>