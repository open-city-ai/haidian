<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.t{font-weight:700;fill:#111827}.s{fill:#64748b}.h{font-weight:700;fill:#0f766e}.b{fill:#334155}</style><text x="60" y="72" font-size="42" class="t">C7 CIVIC STATION｜一个 1:1 城市完整度原型</text><text x="60" y="112" font-size="20" class="s">普通城市底座 → 人工服务 → 可选 AI → 受控测试 → AI-OFF 恢复</text><rect x="60.0" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="60.0" y="170" width="477.3333333333333" height="14" rx="7" fill="#0f766e"/><text x="88.0" y="232" font-size="27" class="t">普通城市底座</text><circle cx="96.0" cy="281" r="8" fill="#0f766e"/><text x="118.0" y="288" font-size="19" class="h">01 遮阴+坐凳</text><text x="118.0" y="319" font-size="16" class="b">先能停留，再谈交互</text><circle cx="96.0" cy="373" r="8" fill="#0f766e"/><text x="118.0" y="380" font-size="19" class="h">02 无障碍连续</text><text x="118.0" y="411" font-size="16" class="b">不靠 AI 修补物理断点</text><circle cx="96.0" cy="465" r="8" fill="#0f766e"/><text x="118.0" y="472" font-size="19" class="h">03 实体双语导视</text><text x="118.0" y="503" font-size="16" class="b">无电/无网仍能到达</text><rect x="561.3333333333333" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="561.3333333333333" y="170" width="477.3333333333333" height="14" rx="7" fill="#2563eb"/><text x="589.3333333333333" y="232" font-size="27" class="t">人工 + 可选 AI</text><circle cx="597.3333333333333" cy="281" r="8" fill="#2563eb"/><text x="619.3333333333333" y="288" font-size="19" class="h">04 无账号窗口</text><text x="619.3333333333333" y="319" font-size="16" class="b">纸质/电话/人工同任务</text><circle cx="597.3333333333333" cy="373" r="8" fill="#2563eb"/><text x="619.3333333333333" y="380" font-size="19" class="h">05 可选 AI</text><text x="619.3333333333333" y="411" font-size="16" class="b">最少数据，可拒绝</text><circle cx="597.3333333333333" cy="465" r="8" fill="#2563eb"/><text x="619.3333333333333" y="472" font-size="19" class="h">06 人工接手</text><text x="619.3333333333333" y="503" font-size="16" class="b">高风险与失败转人</text><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="14" rx="7" fill="#b45309"/><text x="1090.6666666666665" y="232" font-size="27" class="t">受控测试 + 恢复</text><circle cx="1098.6666666666665" cy="281" r="8" fill="#b45309"/><text x="1120.6666666666665" y="288" font-size="19" class="h">07 测试口袋</text><text x="1120.6666666666665" y="319" font-size="16" class="b">与公共通行物理分离</text><circle cx="1098.6666666666665" cy="373" r="8" fill="#b45309"/><text x="1120.6666666666665" y="380" font-size="19" class="h">08 一键停机</text><text x="1120.6666666666665" y="411" font-size="16" class="b">停止权先于扩张</text><circle cx="1098.6666666666665" cy="465" r="8" fill="#b45309"/><text x="1120.6666666666665" y="472" font-size="19" class="h">09 AI-OFF</text><text x="1120.6666666666665" y="503" font-size="16" class="b">基本城市功能仍完整</text><text x="60" y="848" font-size="16" class="s">概念原型，不代表已选址、获批、建成或现场绩效；所有真实尺寸与工程条件待专业深化。</text></svg>