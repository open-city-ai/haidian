<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}.h1{font-size:44px;font-weight:700}.sub{font-size:18px;fill:#5f6b79}.h2{font-size:24px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#64748b}.c{fill:#fff;stroke:#d8e0ea;stroke-width:2}.g{fill:#d9f1df}.bl{fill:#dcecff}.ln{stroke:#0f766e;stroke-width:6}.ai{stroke:#2563eb;stroke-width:4;stroke-dasharray:9 8;fill:none}.x{stroke:#b91c1c;stroke-width:4;stroke-dasharray:7 7;fill:none}</style><rect width="1600" height="1000" fill="#f7f9fc"/><text x="60" y="68" class="h1">v0.7 | How AI changes urban form: six reversible physical interfaces</text><text x="60" y="104" class="sub">ordinary-city baseline → physical repair → optional AI → functioning exit state</text><g transform="translate(55,150)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">A | Test pockets</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">Separate testing from ordinary circulation; remove devices and keep an ordinary yard.</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(565,150)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">B | Accessible help nodes</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">Seating, shade, static signs and staffed help come first; navigation/translation layers later.</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(1075,150)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">C | Continuous station-city arrival</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">Fixed bilingual signs, staffed help, rest and ordinary retail form the basic arrival chain.</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(55,500)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">D | Replaceable service nodes</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">Edge compute, charging and maintenance become removable nodes, not permanent megastructures.</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(565,500)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">E | People-first public ground floors</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">Space for sitting, staying, food, meeting and staffed service takes priority over equipment.</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><g transform="translate(1075,500)"><rect width="470" height="310" rx="18" class="c"/><text x="22" y="42" class="h2">F | Reversible spatial versioning</text><rect x="30" y="78" width="410" height="105" rx="12" fill="#e9edf1"/><rect x="65" y="100" width="120" height="62" rx="9" class="g"/><rect x="265" y="100" width="120" height="62" rx="9" class="bl"/><path d="M185 130 H265" class="ln"/><path d="M270 92 C310 65 365 65 405 92" class="ai"/><path d="M270 172 C310 195 365 195 405 170" class="x"/><text x="25" y="225" class="b">Observe → bounded prototype → public/professional review → merge or rollback.</text><text x="25" y="270" class="s">AI is optional; physical city function remains after exit.</text></g><text x="60" y="900" class="sub">Shared principle: AI is not an eighth land-use category; it creates spatial interfaces that can start, stop and be replaced.</text><text x="60" y="940" class="s">Concept-only · all dimensions and engineering interfaces require later verification.</text></svg>