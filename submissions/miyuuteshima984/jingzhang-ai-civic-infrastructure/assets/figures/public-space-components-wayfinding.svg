<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1250" viewBox="0 0 1900 1250" role="img" aria-labelledby="title desc"><title id="title">京张公共空间组件与导视系统</title><desc id="desc">七类公共空间组件和三层导视系统，将普通城市功能、无障碍、遗产叙事与可退出 AI 叠加。</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:46px;font-weight:700}.h2{font-size:24px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.card{fill:#fff;stroke:#8291a5;stroke-width:2}.green{fill:#edf7f2;stroke:#428a70;stroke-width:2}.blue{fill:#edf5ff;stroke:#4b78b2;stroke-width:2}.warm{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}.line{stroke:#52677f;stroke-width:5;fill:none}</style><rect width="1900" height="1250" fill="#fbfcfe"/><text x="60" y="72" class="h1">京张城市完整度 v0.5｜公共空间组件库 + 三层导视系统</text><text x="60" y="110" class="b">设计顺序：永久可用的普通城市功能 → 可更新的运营信息 → 可选 AI 增强。任何数字层失效时，空间仍能被理解和使用。</text>
<text x="60" y="165" class="h2">七类可复制组件</text>
<g transform="translate(60,195)"><rect width="410" height="240" rx="18" class="green"/><text x="30" y="45" class="h2">01 C7 方向柱</text><line x1="75" y1="80" x2="75" y2="190" class="line"/><path d="M75 95 L160 95 L145 80 M160 95 L145 110" class="line"/><text x="190" y="95" class="b">永久层：方向 / 距离 / C7 标签</text><text x="190" y="128" class="s">中英文同级；图标配文字；不依赖二维码</text><text x="190" y="160" class="b">数字增强</text><text x="190" y="190" class="s">可选语音/多语问答；断网不影响基本导向</text></g>
<g transform="translate(490,195)"><rect width="410" height="240" rx="18" class="blue"/><text x="30" y="45" class="h2">02 遮阴停留岛</text><path d="M55 120 Q130 60 205 120" class="line"/><line x1="130" y1="120" x2="130" y2="175" class="line"/><line x1="70" y1="180" x2="190" y2="180" class="line"/><text x="225" y="95" class="b">GREEN + COMMON LIFE</text><text x="225" y="128" class="s">座椅、遮阴、饮水/充电预留、轮椅并席位</text><text x="225" y="160" class="b">数字增强</text><text x="225" y="190" class="s">环境提示可选，不采集身份即可使用</text></g>
<g transform="translate(920,195)"><rect width="410" height="240" rx="18" class="warm"/><text x="30" y="45" class="h2">03 机器人交接湾</text><rect x="55" y="85" width="120" height="90" rx="12" fill="none" stroke="#52677f" stroke-width="5"/><circle cx="85" cy="185" r="14" fill="#52677f"/><circle cx="145" cy="185" r="14" fill="#52677f"/><text x="205" y="95" class="b">MOVE + WORK</text><text x="205" y="128" class="s">机器人不占普通通道；交接点有物理边界</text><text x="205" y="160" class="b">安全规则</text><text x="205" y="190" class="s">低速、可关闭、可人工接管、越界即停</text></g>
<g transform="translate(1350,195)"><rect width="490" height="240" rx="18" class="green"/><text x="30" y="45" class="h2">04 人工服务台</text><rect x="55" y="95" width="145" height="85" rx="8" fill="none" stroke="#52677f" stroke-width="5"/><circle cx="128" cy="75" r="18" fill="#52677f"/><text x="230" y="95" class="b">CARE + 非 AI 基线</text><text x="230" y="128" class="s">预约、申诉、导航、帮助均有真人入口</text><text x="230" y="160" class="b">空间要求</text><text x="230" y="190" class="s">无障碍柜台、清晰开放时间、紧急联络方式</text></g>
<g transform="translate(60,455)"><rect width="410" height="240" rx="18" class="blue"/><text x="30" y="45" class="h2">05 社区共享桌</text><ellipse cx="115" cy="130" rx="80" ry="45" fill="none" stroke="#52677f" stroke-width="5"/><circle cx="45" cy="85" r="13" fill="#52677f"/><circle cx="185" cy="85" r="13" fill="#52677f"/><circle cx="45" cy="180" r="13" fill="#52677f"/><circle cx="185" cy="180" r="13" fill="#52677f"/><text x="225" y="95" class="b">COMMON LIFE</text><text x="225" y="128" class="s">免费基本时段、公开预约规则、现场可进入</text><text x="225" y="160" class="b">AI 调度</text><text x="225" y="190" class="s">只做建议；冲突/公平问题可人工推翻</text></g>
<g transform="translate(490,455)"><rect width="410" height="240" rx="18" class="green"/><text x="30" y="45" class="h2">06 无障碍连续节点</text><path d="M45 180 L150 180 L205 105 L290 105" class="line"/><circle cx="115" cy="150" r="25" fill="none" stroke="#52677f" stroke-width="5"/><text x="225" y="145" class="b">MOVE + CARE</text><text x="225" y="178" class="s">坡道/停留/触觉/照明先于算法存在</text><text x="225" y="210" class="s">临时障碍只作为附加提醒，不替代设施维护</text></g>
<g transform="translate(920,455)"><rect width="410" height="240" rx="18" class="warm"/><text x="30" y="45" class="h2">07 京张记忆轨</text><line x1="50" y1="110" x2="205" y2="110" class="line"/><line x1="50" y1="155" x2="205" y2="155" class="line"/><text x="230" y="95" class="b">文化 + LEARN</text><text x="230" y="128" class="s">年份、人物、工程与社区故事必须可追溯</text><text x="230" y="160" class="b">多语层</text><text x="230" y="190" class="s">固定中英文本 + 可选多语 AI；错误可纠正</text></g>
<g transform="translate(1350,455)"><rect width="490" height="240" rx="18" class="blue"/><text x="30" y="45" class="h2">组件共用规则</text><text x="30" y="88" class="b">• 任何组件先解决真实日常功能，再叠加传播/AI。</text><text x="30" y="122" class="b">• 不以屏幕替代座椅、照明、坡道、实体导视。</text><text x="30" y="156" class="b">• 设备安装不侵占消防、盲道、通行与维护空间。</text><text x="30" y="190" class="b">• 统一使用 C7 标签，但允许各重点区保留差异化材料。</text><text x="30" y="222" class="s">具体尺寸、结构、材料和设备需专业深化。</text></g>

<text x="60" y="770" class="h2">三层导视：从“断电仍可用”开始</text>
<rect x="60" y="805" width="550" height="270" rx="20" class="green"/><text x="95" y="850" class="h2">L1 永久物理层｜ALWAYS-ON</text><text x="95" y="892" class="b">方向、距离、无障碍、公共服务、危险边界、固定历史文本</text><text x="95" y="930" class="s">要求：中英同级、图标+文字、色彩非唯一编码、夜间可读</text><text x="95" y="968" class="s">失效模式：无电/无网/无手机时仍可完成基本通行和求助</text><text x="95" y="1006" class="b">责任：空间/设施运营主体维护</text>
<rect x="675" y="805" width="550" height="270" rx="20" class="blue"/><text x="710" y="850" class="h2">L2 运营信息层｜CHANGEABLE</text><text x="710" y="892" class="b">开放时间、临时封闭、活动、测试状态、排队与恢复信息</text><text x="710" y="930" class="s">要求：每条信息有更新时间和责任角色；过期自动下线</text><text x="710" y="968" class="s">失效模式：数据不确定/应急状态时切换为人工公告</text><text x="710" y="1006" class="b">责任：运营信息更新人 + 现场人工复核</text>
<rect x="1290" y="805" width="550" height="270" rx="20" class="warm"/><text x="1325" y="850" class="h2">L3 可选 AI 层｜OPT-IN</text><text x="1325" y="892" class="b">多语问答、个性化路径、场景解释、辅助预约</text><text x="1325" y="930" class="s">要求：可追溯来源、最小化数据、人工接管、退出恢复</text><text x="1325" y="968" class="s">失效模式：关闭 AI 后自动退回 L1/L2，不损失基本服务</text><text x="1325" y="1006" class="b">责任：AI 服务责任角色 + 对应公共服务主体</text>
<rect x="60" y="1110" width="1780" height="80" rx="16" class="card"/><text x="95" y="1146" class="h2">国际传播句法</text><text x="270" y="1146" class="b">“What is here? → What ordinary city capability does it support? → What does AI add? → How do I use it without AI? → Who is responsible?”</text><text x="95" y="1178" class="s">每个公共节点按这五问组织中英文信息，避免只用“未来感”口号替代功能、权利和责任。</text><text x="60" y="1230" class="s">概念组件库；不构成施工图、产品采购清单、设施许可或官方导视标准。</text></svg>