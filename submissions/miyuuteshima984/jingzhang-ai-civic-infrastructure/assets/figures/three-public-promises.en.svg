<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}.t{font-weight:700;fill:#111827}.s{fill:#64748b}.h{font-weight:700;fill:#0f766e}.b{fill:#334155}</style><text x="60" y="72" font-size="42" class="t">v0.10 | THREE PUBLIC PROMISES</text><text x="60" y="112" font-size="20" class="s">Make the ordinary urban task work first; AI remains a switchable enhancement</text><rect x="60.0" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="60.0" y="170" width="477.3333333333333" height="14" rx="7" fill="#0f766e"/><text x="88.0" y="232" font-size="27" class="t">ARRIVE WITHOUT APP</text><circle cx="96.0" cy="281" r="8" fill="#0f766e"/><text x="118.0" y="288" font-size="19" class="h">Ordinary city</text><text x="118.0" y="319" font-size="16" class="b">fixed bilingual wayfinding + staffed transfer + continuous arrival</text><circle cx="96.0" cy="373" r="8" fill="#0f766e"/><text x="118.0" y="380" font-size="19" class="h">Space</text><text x="118.0" y="411" font-size="16" class="b">legible, stayable station-city ground level with a person to ask</text><circle cx="96.0" cy="465" r="8" fill="#0f766e"/><text x="118.0" y="472" font-size="19" class="h">AI OFF</text><text x="118.0" y="503" font-size="16" class="b">arrival still works when dynamic information fails</text><rect x="561.3333333333333" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="561.3333333333333" y="170" width="477.3333333333333" height="14" rx="7" fill="#2563eb"/><text x="589.3333333333333" y="232" font-size="27" class="t">CARE WITHOUT ACCOUNT</text><circle cx="597.3333333333333" cy="281" r="8" fill="#2563eb"/><text x="619.3333333333333" y="288" font-size="19" class="h">Ordinary city</text><text x="619.3333333333333" y="319" font-size="16" class="b">home → shade/seating → staffed care → commons</text><circle cx="597.3333333333333" cy="373" r="8" fill="#2563eb"/><text x="619.3333333333333" y="380" font-size="19" class="h">Space</text><text x="619.3333333333333" y="411" font-size="16" class="b">no phone/account does not reduce basic service</text><circle cx="597.3333333333333" cy="465" r="8" fill="#2563eb"/><text x="619.3333333333333" y="472" font-size="19" class="h">AI OFF</text><text x="619.3333333333333" y="503" font-size="16" class="b">phone/paper/human entry and physical routes remain</text><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="620" rx="24" fill="white" stroke="#cbd5e1" stroke-width="2"/><rect x="1062.6666666666665" y="170" width="477.3333333333333" height="14" rx="7" fill="#b45309"/><text x="1090.6666666666665" y="232" font-size="27" class="t">TEST WITHOUT BLOCKING</text><circle cx="1098.6666666666665" cy="281" r="8" fill="#b45309"/><text x="1120.6666666666665" y="288" font-size="19" class="h">Ordinary city</text><text x="1120.6666666666665" y="319" font-size="16" class="b">research/work/service/rest/walking stay continuous</text><circle cx="1098.6666666666665" cy="373" r="8" fill="#b45309"/><text x="1120.6666666666665" y="380" font-size="19" class="h">Space</text><text x="1120.6666666666665" y="411" font-size="16" class="b">test pocket is physically separate from public passage</text><circle cx="1098.6666666666665" cy="465" r="8" fill="#b45309"/><text x="1120.6666666666665" y="472" font-size="19" class="h">STOP</text><text x="1120.6666666666665" y="503" font-size="16" class="b">test can close/remove without taking the city base with it</text><text x="60" y="848" font-size="16" class="s">These are urban-design acceptance questions, not marketing claims; real location, dimensions, engineering and permits remain pending field/professional verification.</text></svg>