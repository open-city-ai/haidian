<text x="55" y="64" class="h1">v0.6｜评审证据总表：普通城市先成立，AI 才能进入日常</text>
<text x="55" y="101" class="sub">不是自评分。把评审必须定位的证据、停止条件和主张边界前置；最终分数仍由 Review Agent / maintainer 决定。</text>

<g transform="translate(55,135)">
<rect width="1490" height="125" rx="16" class="box"/>
<g transform="translate(20,18)"><rect width="340" height="88" rx="12" class="blue"/><text x="20" y="36" class="h2">≈11.413 km²</text><text x="20" y="65" class="b">provisional 总体边界复算</text><text x="20" y="86" class="s">site_area_sqm</text></g>
<g transform="translate(385,18)"><rect width="340" height="88" rx="12" class="green"/><text x="20" y="36" class="h2">19.5008%</text><text x="20" y="65" class="b">概念绿地比例</text><text x="20" y="86" class="s">green_ratio</text></g>
<g transform="translate(750,18)"><rect width="340" height="88" rx="12" class="gold"/><text x="20" y="36" class="h2">3.3824%</text><text x="20" y="65" class="b">概念公共空间比例</text><text x="20" y="86" class="s">public_space_ratio</text></g>
<g transform="translate(1115,18)"><rect width="355" height="88" rx="12" class="violet"/><text x="20" y="36" class="h2">C7 + 3 + 10</text><text x="20" y="65" class="b">七项城市能力 + 3 旗舰试点 + 10 场景</text><text x="20" y="86" class="s">baseline / human takeover / exit</text></g>
</g>

<g transform="translate(55,285)"><rect width="1490" height="270" rx="16" class="box"/><text x="22" y="42" class="h2">三个旗舰试点｜PRECONDITION → TEST → RECEIPT → GO / REVISE / STOP</text>
<g transform="translate(20,65)"><rect width="465" height="180" rx="14" class="blue"/><text x="18" y="32" class="h2">01 众智园｜低速机器人受控测试</text><text x="18" y="66" class="b">非 AI 基线：普通步行 + 人工配送</text><text x="18" y="96" class="b">前置门：边界 / 安全 / 保险 / 责任人</text><text x="18" y="126" class="b">STOP：侵入人行、危险近失、无障碍受阻</text><text x="18" y="156" class="s">货币成本、合同与许可未核实时保持 UNKNOWN</text></g>
<g transform="translate(512,65)"><rect width="465" height="180" rx="14" class="green"/><text x="18" y="32" class="h2">02 AI 原点｜无障碍 / 照护导航</text><text x="18" y="66" class="b">非 AI 基线：实体导视 + 人工服务台</text><text x="18" y="96" class="b">前置门：物理无障碍 / 人工求助 / 数据最小化</text><text x="18" y="126" class="b">STOP：错误路线、排斥、敏感数据误用</text><text x="18" y="156" class="s">拒绝追踪或账号不得导致基本服务丧失</text></g>
<g transform="translate(1004,65)"><rect width="465" height="180" rx="14" class="gold"/><text x="18" y="32" class="h2">03 大钟寺｜换乘 + 多语导览</text><text x="18" y="66" class="b">非 AI 基线：固定导视 + 人工服务</text><text x="18" y="96" class="b">前置门：信息时效 / 队列安全 / 真实可达核验</text><text x="18" y="126" class="b">STOP：信息过期、排队伤害、基础通达失败</text><text x="18" y="156" class="s">provisional key-area 不作为真实站城工程定位</text></g></g>

<g transform="translate(55,580)"><rect width="720" height="250" rx="16" class="box"/><text x="22" y="42" class="h2">公共利益｜9 类人群显性检查</text><text x="22" y="78" class="b">长期居民 / 家庭 · 老人 · 残障 / 感知受限 · 儿童 / 照护者</text><text x="22" y="112" class="b">学生 / 科研 · 创业 / 企业 · 服务劳动者 / 通勤者 · 访客 / 国际使用者</text><text x="22" y="146" class="b">无手机 / 无账号 / 主动退出使用者</text><line x1="22" y1="168" x2="690" y2="168" class="line"/><text x="22" y="198" class="b">每类都检查：受益 → 负担 → 排斥风险 → non-AI 等价路径 → 人工帮助 / 申诉</text><text x="22" y="228" class="s">公共空间首先可走、可停、可求助、可不用账号；AI 关闭后基本服务继续。</text></g>

<g transform="translate(800,580)"><rect width="745" height="250" rx="16" class="box"/><text x="22" y="42" class="h2">实施与主张边界｜评审可直接核对</text><text x="22" y="78" class="b">RACI：A / R / C / I；概念数量基础；维护频率；启动前证据门；停止收据</text><text x="22" y="112" class="b">七维证据索引：brief 20% · originality 10% · AI planning 15% · feasibility 20%</text><text x="22" y="146" class="b">inclusion 10% · risk 10% · expression 15%；并一跳映射 agent.1–agent.6</text><rect x="20" y="170" width="705" height="58" rx="10" class="warn"/><text x="35" y="195" class="b">不声称：官方红线、审批、合作、投资、预算、现场绩效或已落地安排。</text><text x="35" y="219" class="s">机器 PASS 证明包结构 / 证据一致性，不证明法定或现场有效性。</text></g>
<text x="55" y="872" class="s">Concept-only · provisional geometry · bilingual evidence · v0.6 integration in progress</text>
</svg>