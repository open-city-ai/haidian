</style><rect width="1920" height="1080" fill="#f6f8fb"/><rect x="0" y="0" width="1920" height="178" fill="#111827"/><text x="78" y="82" font-size="48" font-weight="700" class="white">v0.11 | THREE CORES = THREE SPATIAL CONTRACTS</text><text x="78" y="130" font-size="19" class="light">One civic spine binds three different ordinary urban tasks. AI may enhance each place, but never becomes its gate.</text><rect x="70" y="220" width="485" height="780" rx="28" fill="#fff" stroke="#d7dee8" stroke-width="2"/><text x="108" y="275" font-size="22" font-weight="700">ONE CIVIC SPINE / THREE CORES</text><path d="M310 350 C265 470 355 570 310 690 C268 805 345 880 310 950" fill="none" stroke="#77b989" stroke-width="66" stroke-linecap="round" opacity=".88"/><circle cx="310" cy="395" r="70" fill="#b45309"/><text x="310" y="391" text-anchor="middle" font-size="22" font-weight="700" class="white">ZHONGZHIYUAN</text><text x="310" y="423" text-anchor="middle" font-size="14" class="white">INNOVATION CAMPUS</text><circle cx="310" cy="650" r="70" fill="#2563eb"/><text x="310" y="646" text-anchor="middle" font-size="22" font-weight="700" class="white">AI ORIGIN</text><text x="310" y="678" text-anchor="middle" font-size="14" class="white">LONG-TERM NEIGHBORHOOD</text><circle cx="310" cy="895" r="70" fill="#0f766e"/><text x="310" y="891" text-anchor="middle" font-size="22" font-weight="700" class="white">DAZHONGSI</text><text x="310" y="923" text-anchor="middle" font-size="14" class="white">STATION-CITY ARRIVAL</text><text x="108" y="980" class="s" text-anchor="start"><tspan x="108" dy="0">Concept diagram: relationships and acceptance logic only; provisional key-area geometry.</tspan></text><rect x="610" y="220" width="1235" height="224" rx="25" fill="#fff" stroke="#d7dee8" stroke-width="2"/><rect x="610" y="220" width="18" height="224" rx="9" fill="#b45309"/><text x="655" y="268" font-size="29" font-weight="700">TEST WITHOUT BLOCKING</text><text x="655" y="303" font-size="17" fill="#64748b">ZHONGZHIYUAN · INNOVATION CAMPUS</text><rect x="655" y="332" width="170" height="31" rx="15" fill="#ecfdf5"/><text x="740" y="353" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">ORDINARY BASELINE</text><text x="845" y="354" font-size="17">ordinary work / rest / walking remains continuous</text><rect x="655" y="380" width="170" height="31" rx="15" fill="#fff1f2"/><text x="740" y="401" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">EXIT / OFF STATE</text><text x="845" y="402" font-size="17">TEST-OFF: public route unchanged</text><rect x="610" y="470" width="1235" height="224" rx="25" fill="#fff" stroke="#d7dee8" stroke-width="2"/><rect x="610" y="470" width="18" height="224" rx="9" fill="#2563eb"/><text x="655" y="518" font-size="29" font-weight="700">CARE WITHOUT ACCOUNT</text><text x="655" y="553" font-size="17" fill="#64748b">AI ORIGIN · LONG-TERM NEIGHBORHOOD</text><rect x="655" y="582" width="170" height="31" rx="15" fill="#ecfdf5"/><text x="740" y="603" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">ORDINARY BASELINE</text><text x="845" y="604" font-size="17">home → care → shade/rest → commons works without account</text><rect x="655" y="630" width="170" height="31" rx="15" fill="#fff1f2"/><text x="740" y="651" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">EXIT / OFF STATE</text><text x="845" y="652" font-size="17">AI-OFF: care and public life unchanged</text><rect x="610" y="720" width="1235" height="224" rx="25" fill="#fff" stroke="#d7dee8" stroke-width="2"/><rect x="610" y="720" width="18" height="224" rx="9" fill="#0f766e"/><text x="655" y="768" font-size="29" font-weight="700">ARRIVE WITHOUT APP</text><text x="655" y="803" font-size="17" fill="#64748b">DAZHONGSI · STATION-CITY ARRIVAL</text><rect x="655" y="832" width="170" height="31" rx="15" fill="#ecfdf5"/><text x="740" y="853" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">ORDINARY BASELINE</text><text x="845" y="854" font-size="17">fixed bilingual signs + staffed transfer + accessible route</text><rect x="655" y="880" width="170" height="31" rx="15" fill="#fff1f2"/><text x="740" y="901" text-anchor="middle" font-size="13" font-weight="700" fill="#be123c">EXIT / OFF STATE</text><text x="845" y="902" font-size="17">APP/AI-OFF: arrival still works</text><rect x="610" y="970" width="1235" height="55" rx="14" fill="#111827"/><text x="1227" y="1005" text-anchor="middle" font-size="17" font-weight="700" class="white">ACCEPTANCE ORDER  ordinary task → spatial contract → optional AI → human takeover → safe exit</text></svg>