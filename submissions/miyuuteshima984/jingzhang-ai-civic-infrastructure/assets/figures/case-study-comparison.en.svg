<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320" role="img" aria-labelledby="title desc"><title id="title">Global AI Innovation Ecosystem Case Comparison</title><desc id="desc">Six first-party public cases compared by mechanism, Jing-Zhang translation, spatial/operating application, and explicit non-copy boundaries.</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:44px;font-weight:700}.h2{font-size:21px;font-weight:700}.b{font-size:15px}.s{font-size:12px}.head{fill:#eaf1f8;stroke:#697c92;stroke-width:2}.cell{fill:#fff;stroke:#a3adba;stroke-width:1.4}.case{fill:#edf7f2;stroke:#428a70;stroke-width:2}.warn{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}</style><rect width="2000" height="1320" fill="#fbfcfe"/><text x="55" y="70" class="h1">Jing-Zhang City Completeness v0.5 | Global AI Innovation Ecosystem Case Comparison</text><text x="55" y="108" class="b">Translate verifiable mechanisms only. Do not copy institutional scale, funding, logos, images, construction metrics or partnerships; cases do not establish Jing-Zhang statutory controls.</text>
<g transform="translate(55,150)"><rect width="1890" height="72" class="head"/><text x="150" y="46" text-anchor="middle" class="h2">Case</text><text x="495" y="46" text-anchor="middle" class="h2">First-party public mechanism</text><text x="940" y="46" text-anchor="middle" class="h2">Jing-Zhang translation</text><text x="1395" y="46" text-anchor="middle" class="h2">Spatial / operating application</text><text x="1740" y="46" text-anchor="middle" class="h2">Explicitly not copied</text>
<g transform="translate(0,72)"><rect width="300" height="155" class="case"/><rect x="300" width="390" height="155" class="cell"/><rect x="690" width="500" height="155" class="cell"/><rect x="1190" width="410" height="155" class="cell"/><rect x="1600" width="290" height="155" class="cell"/><text x="150" y="50" text-anchor="middle" class="h2">Vector Institute</text><text x="150" y="82" text-anchor="middle" class="s">Canada</text><text x="320" y="38" class="b">neutral connector among research,</text><text x="320" y="68" class="b">talent and industry adoption</text><text x="710" y="38" class="b">translate research results into real organizational/city</text><text x="710" y="68" class="b">problems before testing; a company list is not an ecosystem</text><text x="1210" y="38" class="b">Zhongzhiyuan research-translation interface;</text><text x="1210" y="68" class="b">SCN-03 problem translation</text><text x="1620" y="38" class="s">institution scale, partner list,</text><text x="1620" y="66" class="s">funding, brand assets</text></g>
<g transform="translate(0,227)"><rect width="300" height="155" class="case"/><rect x="300" width="390" height="155" class="cell"/><rect x="690" width="500" height="155" class="cell"/><rect x="1190" width="410" height="155" class="cell"/><rect x="1600" width="290" height="155" class="cell"/><text x="150" y="50" text-anchor="middle" class="h2">Mila</text><text x="150" y="82" text-anchor="middle" class="s">Québec, Canada</text><text x="320" y="38" class="b">university collaboration, open science,</text><text x="320" y="68" class="b">responsible AI, knowledge transfer</text><text x="710" y="38" class="b">put open research, talent and responsibility boundaries</text><text x="710" y="68" class="b">in one ecosystem; sharing technology is not unrestricted data sharing</text><text x="1210" y="38" class="b">university—Zhongzhiyuan interface;</text><text x="1210" y="68" class="b">Open Week + source governance</text><text x="1620" y="38" class="s">university-network count,</text><text x="1620" y="66" class="s">industry partners, historical scale</text></g>
<g transform="translate(0,382)"><rect width="300" height="155" class="case"/><rect x="300" width="390" height="155" class="cell"/><rect x="690" width="500" height="155" class="cell"/><rect x="1190" width="410" height="155" class="cell"/><rect x="1600" width="290" height="155" class="cell"/><text x="150" y="50" text-anchor="middle" class="h2">Alan Turing Institute</text><text x="150" y="82" text-anchor="middle" class="s">United Kingdom</text><text x="320" y="38" class="b">interdisciplinary research, knowledge</text><text x="320" y="68" class="b">exchange and public engagement</text><text x="710" y="38" class="b">put public questions, professional judgment and researchers</text><text x="710" y="68" class="b">inside one review loop rather than one-way technology display</text><text x="1210" y="38" class="b">annual C7 audit;</text><text x="1210" y="68" class="b">public issue list + teach-back</text><text x="1620" y="38" class="s">national-institute status,</text><text x="1620" y="66" class="s">resources and policy authority</text></g>
<g transform="translate(0,537)"><rect width="300" height="155" class="case"/><rect x="300" width="390" height="155" class="cell"/><rect x="690" width="500" height="155" class="cell"/><rect x="1190" width="410" height="155" class="cell"/><rect x="1600" width="290" height="155" class="cell"/><text x="150" y="50" text-anchor="middle" class="h2">AI Singapore 100E</text><text x="150" y="82" text-anchor="middle" class="s">Singapore</text><text x="320" y="38" class="b">real problem → PoC/MVP evidence</text><text x="320" y="68" class="b">before deciding continuation</text><text x="710" y="38" class="b">make scaling the second step after evidence;</text><text x="710" y="68" class="b">define start, stop, review and exit thresholds</text><text x="1210" y="38" class="b">Open Test Yard;</text><text x="1210" y="68" class="b">staged validation across 10 scenarios</text><text x="1620" y="38" class="s">program funding, term,</text><text x="1620" y="66" class="s">eligibility, government-support conditions</text></g>
