<g transform="translate(0,847)"><rect width="300" height="155" class="case"/><rect x="300" width="390" height="155" class="cell"/><rect x="690" width="500" height="155" class="cell"/><rect x="1190" width="410" height="155" class="cell"/><rect x="1600" width="290" height="155" class="cell"/><text x="150" y="50" text-anchor="middle" class="h2">Punggol Digital District</text><text x="150" y="82" text-anchor="middle" class="s">Singapore</text><text x="320" y="38" class="b">adjacency among industry, university,</text><text x="320" y="68" class="b">public space and community life</text><text x="710" y="38" class="b">innovation and long-term community are not islands;</text><text x="710" y="68" class="b">research, work and public life share one urban base</text><text x="1210" y="38" class="b">one spine / six segments / six stitches / three cores;</text><text x="1210" y="68" class="b">AI Origin long-term-life validation</text><text x="1620" y="38" class="s">land system, development model,</text><text x="1620" y="66" class="s">investment and technology stack</text></g></g>
