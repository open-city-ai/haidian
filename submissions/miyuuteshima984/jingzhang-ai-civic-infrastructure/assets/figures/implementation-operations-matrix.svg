<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1400" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc"><title id="title">京张实施与长期运营矩阵</title><desc id="desc">八类项目的空间、责任角色、前置条件、启动/停止阈值、维护责任和验收指标。</desc><style>text{font-family:sans-serif;fill:#14213d}.h1{font-size:46px;font-weight:700}.h2{font-size:23px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.head{fill:#eaf1f8;stroke:#697c92;stroke-width:2}.cell{fill:#fff;stroke:#a3adba;stroke-width:1.4}.core{fill:#edf7f2;stroke:#428a70;stroke-width:2}.warn{fill:#fff6e5;stroke:#aa7a2d;stroke-width:2}</style><rect width="2000" height="1400" fill="#fbfcfe"/><text x="55" y="70" class="h1">京张城市完整度 v0.5｜实施与长期运营矩阵</text><text x="55" y="108" class="b">“角色”均为建议责任类型；真实主体、预算、合同和审批必须在后续专业深化中确认。</text>
<g transform="translate(55,150)"><rect width="1890" height="70" class="head"/><text x="115" y="44" text-anchor="middle" class="h2">项目</text><text x="340" y="44" text-anchor="middle" class="h2">空间</text><text x="590" y="44" text-anchor="middle" class="h2">建议角色</text><text x="865" y="44" text-anchor="middle" class="h2">前置条件</text><text x="1190" y="44" text-anchor="middle" class="h2">启动 / 停止阈值</text><text x="1515" y="44" text-anchor="middle" class="h2">维护责任</text><text x="1780" y="44" text-anchor="middle" class="h2">验收 KPI</text>
<g transform="translate(0,70)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">公共绿脊</text><text x="250" y="40" class="b">总体范围南北骨架</text><text x="470" y="40" class="b">规划/公园/街道</text><text x="470" y="68" class="s">运营与社区代表</text><text x="740" y="38" class="s">官方边界与现状测绘；</text><text x="740" y="66" class="s">消防/雨洪/无障碍审查</text><text x="1030" y="36" class="s">启动：基本步行/绿地功能成立</text><text x="1030" y="64" class="s">停止附加 AI：设备妨碍通行、</text><text x="1030" y="92" class="s">安全/隐私红线或维护失效</text><text x="1390" y="40" class="b">设施巡检 + 绿化</text><text x="1390" y="68" class="s">AI 层可独立下线</text><text x="1680" y="38" class="s">连续通行、无障碍、</text><text x="1680" y="66" class="s">遮阴/停留、故障恢复</text></g>
<g transform="translate(0,205)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">开放测试场</text><text x="250" y="40" class="b">众智园受控区域</text><text x="470" y="40" class="b">测试运营 + 安全员</text><text x="470" y="68" class="s">研发方/场地管理</text><text x="740" y="38" class="s">边界、速度、时段、</text><text x="740" y="66" class="s">人工接管与事故流程</text><text x="1030" y="36" class="s">启动：封闭审查和人工接管就绪</text><text x="1030" y="64" class="s">停止：越界、严重近失、</text><text x="1030" y="92" class="s">接管失效或投诉未闭环</text><text x="1390" y="40" class="b">每日开场检查</text><text x="1390" y="68" class="s">日志/事故复盘</text><text x="1680" y="38" class="s">零未授权越界、</text><text x="1680" y="66" class="s">接管成功率、恢复时间</text></g>
<g transform="translate(0,340)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">社区公共客厅</text><text x="250" y="40" class="b">AI 原点社区</text><text x="470" y="40" class="b">社区运营 + 居民</text><text x="470" y="68" class="s">公共服务/物业接口</text><text x="740" y="38" class="s">免费基本时段、无障碍、</text><text x="740" y="66" class="s">人工预约与申诉机制</text><text x="1030" y="36" class="s">启动：普通公共功能先开放</text><text x="1030" y="64" class="s">停止算法调度：公平性下降、</text><text x="1030" y="92" class="s">投诉积压或人工入口失效</text><text x="1390" y="40" class="b">日常值守 + 月度评议</text><text x="1390" y="68" class="s">设备非必要可拆除</text><text x="1680" y="38" class="s">免费时段、冲突率、</text><text x="1680" y="66" class="s">群体公平、投诉闭环</text></g>
<g transform="translate(0,475)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">站城导航层</text><text x="250" y="40" class="b">大钟寺/南段</text><text x="470" y="40" class="b">交通/街区服务</text><text x="470" y="68" class="s">导视与无障碍专业</text><text x="740" y="38" class="s">真实出入口、封闭信息、</text><text x="740" y="66" class="s">法定无障碍路径核实</text><text x="1030" y="36" class="s">启动：实体导视和人工服务完备</text><text x="1030" y="64" class="s">停止 AI：错误路线风险、</text><text x="1030" y="92" class="s">数据过期或应急状态</text><text x="1390" y="40" class="b">信息更新责任人</text><text x="1390" y="68" class="s">应急时切人工模式</text><text x="1680" y="38" class="s">错误率、换乘时间、</text><text x="1680" y="66" class="s">无障碍成功率</text></g>
<g transform="translate(0,610)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">AI 商业试营</text><text x="250" y="40" class="b">大钟寺/场景节点</text><text x="470" y="40" class="b">商业运营 + 消保</text><text x="470" y="68" class="s">场地与数据责任人</text><text x="740" y="38" class="s">期限、退出条款、普通支付、</text><text x="740" y="66" class="s">投诉退款与数据许可</text><text x="1030" y="36" class="s">启动：退出成本和恢复方案明确</text><text x="1030" y="64" class="s">停止：投诉/退款异常、</text><text x="1030" y="92" class="s">公共空间影响超阈或期限届满</text><text x="1390" y="40" class="b">周度运营复盘</text><text x="1390" y="68" class="s">到期必须再审</text><text x="1680" y="38" class="s">投诉/退款、退出成本、</text><text x="1680" y="66" class="s">恢复完成度</text></g>
<g transform="translate(0,745)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">遗产导览</text><text x="250" y="40" class="b">京张遗址公园/节点</text><text x="470" y="40" class="b">文化内容编辑</text><text x="470" y="68" class="s">公共空间运营</text><text x="740" y="38" class="s">来源台账、多语固定文本、</text><text x="740" y="66" class="s">事实纠错入口</text><text x="1030" y="36" class="s">启动：所有核心叙事可追溯</text><text x="1030" y="64" class="s">停止生成：来源失效、</text><text x="1030" y="92" class="s">事实错误无法及时纠正</text><text x="1390" y="40" class="b">内容版本管理</text><text x="1390" y="68" class="s">定期事实复核</text><text x="1680" y="38" class="s">来源命中、纠错、</text><text x="1680" y="66" class="s">多语/离线覆盖</text></g>
<g transform="translate(0,880)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">开发者开放周</text><text x="250" y="40" class="b">众智园+公共节点</text><text x="470" y="40" class="b">社区/开发者运营</text><text x="470" y="68" class="s">安全与公众沟通</text><text x="740" y="38" class="s">活动边界、公开日程、</text><text x="740" y="66" class="s">安全和知识产权规则</text><text x="1030" y="36" class="s">启动：活动/安全负责人到位</text><text x="1030" y="64" class="s">停止：安全事件、</text><text x="1030" y="92" class="s">许可/IP/隐私条件不满足</text><text x="1390" y="40" class="b">年度活动日历</text><text x="1390" y="68" class="s">每次活动复盘</text><text x="1680" y="38" class="s">参与多样性、问题转化、</text><text x="1680" y="66" class="s">事件闭环</text></g>
<g transform="translate(0,1015)"><rect width="230" height="135" class="core"/><rect x="230" width="220" height="135" class="cell"/><rect x="450" width="270" height="135" class="cell"/><rect x="720" width="290" height="135" class="cell"/><rect x="1010" width="360" height="135" class="cell"/><rect x="1370" width="290" height="135" class="cell"/><rect x="1660" width="230" height="135" class="cell"/><text x="115" y="48" text-anchor="middle" class="h2">C7 年度走查</text><text x="250" y="40" class="b">总体范围/三重点区</text><text x="470" y="40" class="b">规划/运营/公众</text><text x="470" y="68" class="s">独立专业复核</text><text x="740" y="38" class="s">版本化指标、证据台账、</text><text x="740" y="66" class="s">未解决数据缺口公开</text><text x="1030" y="36" class="s">启动：年度数据/反馈归档完成</text><text x="1030" y="64" class="s">停止扩围：C7 任一能力</text><text x="1030" y="92" class="s">显著退化且无补救方案</text><text x="1390" y="40" class="b">年度公开复盘</text><text x="1390" y="68" class="s">下一轮更新清单</text><text x="1680" y="38" class="s">C7 缺口关闭率、</text><text x="1680" y="66" class="s">证据追溯/公众闭环</text></g></g>
<rect x="55" y="1290" width="1890" height="65" rx="14" class="warn"/><text x="85" y="1330" class="b">运营原则：AI 层必须可独立停机，普通城市功能不能随算法、供应商或账号系统退出而消失；任何角色、预算、活动和跨机构安排都需要真实主体另行确认。</text><text x="55" y="1382" class="s">概念阶段验证矩阵，不构成组织架构任命、财政安排、采购合同、运营特许或实施批准。</text></svg>