<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-label="智脉共生 Bio-Pulse Symbiosis">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b42318"/>
      <stop offset="1" stop-color="#0f7490"/>
    </linearGradient>
  </defs>

  <!-- ===== 标记：黏菌网络“生物脉冲” ===== -->
  <g transform="translate(75,75)">
    <!-- 脉冲环（外圈，暗示生长） -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#b42318" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#0f7490" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 4"/>
    <!-- 主静脉（中心到外层节点） -->
    <path d="M0,0 C 8,-20 14,-30 20,-42" fill="none" stroke="#b42318" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0,0 C 20,-8 30,-14 42,-20" fill="none" stroke="#b42318" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0,0 C 20,8 30,14 42,20" fill="none" stroke="#0f7490" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0,0 C 8,20 14,30 20,42" fill="none" stroke="#0f7490" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0,0 C -20,-8 -30,-14 -42,-20" fill="none" stroke="#b42318" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M0,0 C -20,8 -30,14 -42,20" fill="none" stroke="#0f7490" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 中间支点（次生节点） -->
    <circle cx="12" cy="-26" r="5" fill="#b42318"/>
    <circle cx="26" cy="-12" r="5" fill="#0f7490"/>
    <circle cx="26" cy="12" r="5" fill="#b42318"/>
    <circle cx="12" cy="26" r="5" fill="#0f7490"/>
    <circle cx="-12" cy="26" r="5" fill="#b42318"/>
    <circle cx="-26" cy="12" r="5" fill="#0f7490"/>
    <!-- 外层养分节点 -->
    <circle cx="20" cy="-42" r="7" fill="#b42318"/>
    <circle cx="42" cy="-20" r="7" fill="#b42318"/>
    <circle cx="42" cy="20" r="7" fill="#0f7490"/>
    <circle cx="20" cy="42" r="7" fill="#0f7490"/>
    <circle cx="-42" cy="-20" r="7" fill="#b42318"/>
    <circle cx="-42" cy="20" r="7" fill="#0f7490"/>
    <!-- 中心脉冲核 -->
    <circle cx="0" cy="0" r="11" fill="url(#pulse)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- ===== 字标 ===== -->
  <g transform="translate(158,78)">
    <text x="0" y="0" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#111827">智脉共生</text>
    <text x="2" y="34" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-style="italic" fill="#b42318">Bio-Pulse Symbiosis</text>
  </g>

  <!-- ===== 底部标识行 ===== -->
  <g transform="translate(158,132)">
    <rect x="0" y="0" width="36" height="4" fill="#b42318"/>
    <rect x="40" y="0" width="36" height="4" fill="#0f7490"/>
    <rect x="80" y="0" width="36" height="4" fill="#15803d"/>
  </g>
</svg>
