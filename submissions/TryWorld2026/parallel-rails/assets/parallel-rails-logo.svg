<?xml version="1.0" encoding="UTF-8"?>
<!--
  双轨·百年 The Parallel Rails — 概念 Logo（自绘原创矢量，无未授权字体/商标/素材）
  Design intent: 两条平行钢轨横贯 = 双轨（历史之轨 × 智能之轨）；
  轨枕化为刻度线 = 标准刻度；上轨刻度渐变为二进制序列 = 智能时代的轨距；
  数字端超级符号 "1.435m" = 标准轨距（概念，非工程值）；圆点 = 道岔/三站节点。
  Colors: 深海军蓝 #0F2B46（主）/ 金 #C9A227（强调）/ 公园绿 #1F7A4D（生态）
  Visual identity direction only; 供专业品牌团队深化。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="双轨·百年 The Parallel Rails concept logo">
  <defs>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F2B46"/>
      <stop offset="1" stop-color="#16395C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E0BE66"/>
    </linearGradient>
  </defs>

  <!-- 背景（透明，深色版本用） -->
  <rect width="960" height="360" fill="none"/>

  <!-- 上轨：历史之轨（深海军蓝，实线） -->
  <rect x="40" y="120" width="880" height="10" rx="5" fill="url(#railGrad)"/>
  <!-- 下轨：智能之轨（金，实线） -->
  <rect x="40" y="216" width="880" height="10" rx="5" fill="url(#goldGrad)"/>

  <!-- 轨枕：刻度线（轨枕化为标准刻度；上轨刻度渐变为二进制序列） -->
  <!-- 左侧为普通刻度，右侧渐变为二进制 0/1 -->
  <g fill="#5B6472">
    <rect x="60" y="106" width="4" height="134" rx="1"/>
    <rect x="110" y="106" width="4" height="134" rx="1"/>
    <rect x="160" y="106" width="4" height="134" rx="1"/>
    <rect x="210" y="106" width="4" height="134" rx="1"/>
    <rect x="260" y="106" width="4" height="134" rx="1"/>
    <rect x="310" y="106" width="4" height="134" rx="1"/>
    <rect x="360" y="106" width="4" height="134" rx="1"/>
    <rect x="410" y="106" width="4" height="134" rx="1"/>
    <rect x="460" y="106" width="4" height="134" rx="1"/>
  </g>
  <!-- 二进制渐变区（上轨侧）：0 低、1 高，象征数字化的轨道 -->
  <g fill="#0F2B46">
    <rect x="510" y="130" width="4" height="96" rx="1"/>
    <rect x="560" y="106" width="4" height="134" rx="1"/>
    <rect x="610" y="130" width="4" height="96" rx="1"/>
    <rect x="660" y="106" width="4" height="134" rx="1"/>
    <rect x="710" y="130" width="4" height="96" rx="1"/>
    <rect x="760" y="106" width="4" height="134" rx="1"/>
    <rect x="810" y="130" width="4" height="96" rx="1"/>
    <rect x="860" y="106" width="4" height="134" rx="1"/>
  </g>
  <!-- 二进制标注 0/1（概念示意） -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#16395C">
    <text x="508" y="102">0</text>
    <text x="558" y="102">1</text>
    <text x="608" y="102">0</text>
    <text x="658" y="102">1</text>
    <text x="708" y="102">0</text>
    <text x="758" y="102">1</text>
    <text x="808" y="102">0</text>
    <text x="858" y="102">1</text>
  </g>

  <!-- 道岔节点：三站（众智/原点/大钟），金圆点 + 刻度延伸 -->
  <g fill="#C9A227" stroke="#0F2B46" stroke-width="2">
    <circle cx="130" cy="168" r="9"/>
    <circle cx="480" cy="168" r="9"/>
    <circle cx="830" cy="168" r="9"/>
  </g>

  <!-- 超级符号：1.435m 标准轨距（概念数字） -->
  <g font-family="Georgia,'Times New Roman',serif">
    <text x="40" y="292" font-size="34" font-weight="bold" fill="#0F2B46">1.435</text>
    <text x="196" y="292" font-size="34" font-weight="bold" fill="#C9A227">m</text>
    <text x="40" y="322" font-size="15" fill="#5B6472" letter-spacing="2">THE STANDARD GAUGE · 标准轨距</text>
  </g>

  <!-- 品牌字标：双轨·百年 -->
  <g>
    <text x="620" y="292" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="bold" fill="#0F2B46">双轨·百年</text>
    <text x="620" y="322" font-family="Georgia,serif" font-size="16" letter-spacing="1" fill="#C9A227">THE PARALLEL RAILS · An Open Standard Belt</text>
  </g>
</svg>
