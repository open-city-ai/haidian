<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">The Second Track</title><desc id="d">A stable heritage track and a branching public-intelligence track connect six switch types into an open field.</desc><rect width="1200" height="520" fill="#f4f1ea"/><path d="M90 275 H1110" stroke="#635d55" stroke-width="24"/><text x="90" y="245" font-family="Arial" font-size="24" fill="#635d55">FIRST TRACK · HISTORY / HERITAGE / PARK</text><path d="M90 340 H1110" stroke="#087f8c" stroke-width="28"/><path d="M260 340 Q340 340 410 170 M510 340 Q600 340 670 145 M760 340 Q850 340 940 190" fill="none" stroke="#087f8c" stroke-width="18"/><g fill="#d18b24" stroke="#f4f1ea" stroke-width="5"><circle cx="410" cy="170" r="25"/><circle cx="670" cy="145" r="25"/><circle cx="940" cy="190" r="25"/><circle cx="330" cy="340" r="25"/><circle cx="590" cy="340" r="25"/><circle cx="850" cy="340" r="25"/></g><g font-family="Arial" font-size="22" font-weight="700" fill="#fff" text-anchor="middle"><text x="410" y="178">K</text><text x="670" y="153">C</text><text x="940" y="198">E</text><text x="330" y="348">M</text><text x="590" y="348">P</text><text x="850" y="348">H</text></g><text x="90" y="410" font-family="Arial" font-size="24" fill="#087f8c">SECOND TRACK · PEOPLE / NATURE / KNOWLEDGE / INDUSTRY / PUBLIC LIFE / TRUSTWORTHY AI</text><text x="90" y="470" font-family="Arial" font-size="19" fill="#7a2f5b">TEMPORARY → TEST → FEEDBACK → UPDATE → SCALE</text></svg>
