<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="railGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#8B1A1A"/>
    </linearGradient>
    <radialGradient id="nodeGlowH" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#2980B9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2980B9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Logo (left, 200x200 area, scaled down version of main logo) -->
  <g transform="translate(0, 0) scale(0.5)">
    <!-- Rail I-beam -->
    <path d="M 110 70 L 290 70 L 290 100 L 270 100 L 270 130 L 270 270 L 290 270 L 290 300 L 110 300 L 110 270 L 130 270 L 130 130 L 110 130 Z"
          fill="url(#railGradH)" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
    <rect x="170" y="100" width="60" height="200" fill="url(#railGradH)" stroke="#2C3E50" stroke-width="1.5"/>

    <!-- Neural network nodes -->
    <circle cx="200" cy="135" r="14" fill="url(#nodeGlowH)" stroke="#2980B9" stroke-width="2"/>
    <circle cx="200" cy="170" r="11" fill="url(#nodeGlowH)" stroke="#2980B9" stroke-width="2"/>
    <circle cx="200" cy="200" r="16" fill="url(#nodeGlowH)" stroke="#2980B9" stroke-width="2.5"/>
    <circle cx="200" cy="230" r="11" fill="url(#nodeGlowH)" stroke="#2980B9" stroke-width="2"/>
    <circle cx="200" cy="265" r="14" fill="url(#nodeGlowH)" stroke="#2980B9" stroke-width="2"/>
    <circle cx="150" cy="200" r="9" fill="#27AE60" stroke="#2C3E50" stroke-width="1.5"/>
    <circle cx="250" cy="200" r="9" fill="#27AE60" stroke="#2C3E50" stroke-width="1.5"/>

    <line x1="200" y1="135" x2="200" y2="170" stroke="#2980B9" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="170" x2="200" y2="200" stroke="#2980B9" stroke-width="2.5" opacity="0.85"/>
    <line x1="200" y1="200" x2="200" y2="230" stroke="#2980B9" stroke-width="2.5" opacity="0.85"/>
    <line x1="200" y1="230" x2="200" y2="265" stroke="#2980B9" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="200" x2="150" y2="200" stroke="#27AE60" stroke-width="2" opacity="0.7"/>
    <line x1="200" y1="200" x2="250" y2="200" stroke="#27AE60" stroke-width="2" opacity="0.7"/>

    <circle cx="200" cy="135" r="5" fill="#FFFFFF"/>
    <circle cx="200" cy="170" r="4" fill="#FFFFFF"/>
    <circle cx="200" cy="200" r="6" fill="#FFFFFF"/>
    <circle cx="200" cy="230" r="4" fill="#FFFFFF"/>
    <circle cx="200" cy="265" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Text (right) -->
  <text x="220" y="80" font-family="LXGW WenKai, Noto Serif SC, sans-serif" font-size="36" font-weight="700" fill="#2C3E50">京张100</text>
  <text x="220" y="115" font-family="LXGW WenKai, Noto Serif SC, sans-serif" font-size="28" font-weight="600" fill="#C0392B">AI 大动脉</text>
  <text x="220" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#BDC3C7" letter-spacing="2">JINGZHANG 100 · AI ARTERY</text>
  <text x="220" y="175" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#BDC3C7">Centennial Railway × Agent New Infrastructure</text>

  <!-- Brand color stripe at bottom -->
  <rect x="0" y="195" width="800" height="5" fill="#C0392B"/>
  <rect x="200" y="195" width="200" height="5" fill="#2980B9"/>
  <rect x="400" y="195" width="200" height="5" fill="#27AE60"/>
  <rect x="600" y="195" width="200" height="5" fill="#BDC3C7"/>
</svg>
