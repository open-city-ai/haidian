  <path d="M 90 -25 Q 200 -100 400 -180" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.6"/>
  <!-- Sub-nodes -->
  <g transform="translate(-100, 100)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">PIPL 第 26/28 条</text>
  </g>
  <line x1="-100" y1="85" x2="-100" y2="25" stroke="#fb7185" stroke-width="1" opacity="0.5"/>
  <g transform="translate(20, 100)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">数据安全法</text>
  </g>
  <line x1="20" y1="85" x2="0" y2="25" stroke="#fb7185" stroke-width="1" opacity="0.5"/>
</g>

<!-- Branch 6: 长期运营 (bottom-right) -->
<g transform="translate(920, 620)">
  <rect x="-100" y="-25" width="200" height="50" rx="25" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="2"/>
  <text x="0" y="5" fill="white" font-size="12" font-weight="600" text-anchor="middle">长期运营 / Annual Events</text>
  <path d="M -100 -25 Q -200 -100 -300 -180" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
  <!-- Sub-nodes -->
  <g transform="translate(-120, 100)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">5 月 AI 创新周</text>
  </g>
  <line x1="-120" y1="85" x2="-100" y2="25" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
  <g transform="translate(0, 100)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">9 月开发者大会</text>
  </g>
  <line x1="0" y1="85" x2="0" y2="25" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
  <g transform="translate(120, 100)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">11 月 AI 治理论坛</text>
  </g>
  <line x1="120" y1="85" x2="100" y2="25" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
</g>

<!-- Bottom legend -->
<text x="600" y="775" fill="#94a3b8" font-size="9" text-anchor="middle">中心 = 京张100·AI 大动脉 · 6 个一级分支 · 24 个二级节点 · 4 色品牌色（铁锈红+数字蓝+遗址绿+数据银）</text>
</svg>
