    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">开源成果展示节点</text>
  </g>
  <line x1="-140" y1="0" x2="-100" y2="0" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <g transform="translate(-200, 80)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
