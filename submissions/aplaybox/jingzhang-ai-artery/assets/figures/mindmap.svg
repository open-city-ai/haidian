  </g>
  <line x1="-140" y1="65" x2="-100" y2="25" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
</g>

<!-- Branch 4: 三期分期 (right) -->
<g transform="translate(1020, 400)">
  <rect x="-100" y="-25" width="200" height="50" rx="25" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="2"/>
  <text x="0" y="5" fill="white" font-size="12" font-weight="600" text-anchor="middle">三期分期 + 14 项目</text>
  <line x1="-100" y1="0" x2="-320" y2="0" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <!-- Sub-nodes -->
  <g transform="translate(180, -80)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">近期 2026-28</text>
  </g>
  <line x1="120" y1="-65" x2="100" y2="-25" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <g transform="translate(180, 0)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">中期 2028-30</text>
  </g>
  <line x1="120" y1="0" x2="100" y2="0" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <g transform="translate(180, 80)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">远期 2030-35</text>
  </g>
  <line x1="120" y1="65" x2="100" y2="25" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
</g>

<!-- Branch 5: 数据治理 (bottom-left) -->
<g transform="translate(280, 620)">
  <rect x="-100" y="-25" width="200" height="50" rx="25" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="2"/>
