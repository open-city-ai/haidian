<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">

<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
  </marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
  </marker>
  <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
  </marker>
  <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </marker>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
</defs>

<rect width="1200" height="800" fill="#0f172a"/>
<rect width="1200" height="800" fill="url(#grid)"/>

<!-- Title -->
<text x="30" y="30" fill="white" font-size="16" font-weight="700">京张100·AI 大动脉 概念思维导图 / Concept Mind Map</text>
<text x="30" y="48" fill="#94a3b8" font-size="9">中心概念 → 6 个一级分支 → 24 个二级节点</text>

<!-- Central node -->
<g transform="translate(600, 400)">
  <circle cx="0" cy="0" r="80" fill="rgba(192, 57, 43, 0.6)" stroke="#C0392B" stroke-width="3"/>
  <text x="0" y="-8" fill="white" font-size="16" font-weight="700" text-anchor="middle">京张100</text>
  <text x="0" y="14" fill="white" font-size="14" font-weight="600" text-anchor="middle">AI 大动脉</text>
</g>

<!-- Branch 1: 一带三核 (top-left) -->
<g transform="translate(280, 180)">
  <rect x="-90" y="-25" width="180" height="50" rx="25" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="0" y="5" fill="white" font-size="12" font-weight="600" text-anchor="middle">一带三核 / Belt + 3 Cores</text>
  <!-- Connector to center -->
  <path d="M 90 25 Q 200 100 400 220" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
  <!-- Sub-nodes -->
  <g transform="translate(-220, -80)">
    <rect x="-50" y="-15" width="100" height="30" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">京张走廊主轴</text>
  </g>
  <line x1="-50" y1="-65" x2="-50" y2="-25" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <g transform="translate(-100, -110)">
    <rect x="-50" y="-15" width="100" height="30" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">众智园（北）</text>
  </g>
  <line x1="-50" y1="-95" x2="-50" y2="-25" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <g transform="translate(20, -110)">
    <rect x="-50" y="-15" width="100" height="30" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">AI 原点社区（中）</text>
  </g>
  <line x1="20" y1="-95" x2="0" y2="-25" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <g transform="translate(140, -80)">
    <rect x="-50" y="-15" width="100" height="30" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">大钟寺（南）</text>
  </g>
  <line x1="90" y1="-65" x2="50" y2="-25" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
</g>

<!-- Branch 2: 12 AI 场景 (top-right) -->
<g transform="translate(920, 180)">
  <rect x="-100" y="-25" width="200" height="50" rx="25" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="0" y="5" fill="white" font-size="12" font-weight="600" text-anchor="middle">12 AI 场景卡 / 12 Scenarios</text>
  <path d="M -100 25 Q -200 100 -300 220" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <!-- Sub-nodes -->
  <g transform="translate(-120, -80)">
    <rect x="-55" y="-15" width="110" height="30" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">★ 3 产业测试</text>
  </g>
  <line x1="-120" y1="-65" x2="-100" y2="-25" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <g transform="translate(0, -100)">
    <rect x="-55" y="-15" width="110" height="30" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">5 类用户画像</text>
  </g>
  <line x1="0" y1="-85" x2="0" y2="-25" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <g transform="translate(120, -80)">
    <rect x="-55" y="-15" width="110" height="30" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">7 全球案例</text>
  </g>
  <line x1="120" y1="-65" x2="100" y2="-25" stroke="#34d399" stroke-width="1" opacity="0.5"/>
</g>

<!-- Branch 3: 4 AI 朝圣地标 (left) -->
<g transform="translate(180, 400)">
  <rect x="-100" y="-25" width="200" height="50" rx="25" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="0" y="5" fill="white" font-size="12" font-weight="600" text-anchor="middle">4 AI 朝圣地标</text>
  <line x1="100" y1="0" x2="320" y2="0" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <!-- Sub-nodes -->
  <g transform="translate(-200, -80)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="0" y="4" fill="white" font-size="9" text-anchor="middle">智能体贡献荣誉墙</text>
  </g>
  <line x1="-140" y1="-65" x2="-100" y2="-25" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
