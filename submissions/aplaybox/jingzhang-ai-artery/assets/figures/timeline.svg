<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">

<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
  </marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
  </marker>
  <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
  </marker>
  <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </marker>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
</defs>

<rect width="1200" height="500" fill="#0f172a"/>
<rect width="1200" height="500" fill="url(#grid)"/>

<!-- Title -->
<text x="30" y="30" fill="white" font-size="16" font-weight="700">百年京张时间线 / Centennial Jingzhang Timeline</text>
<text x="30" y="48" fill="#94a3b8" font-size="9">1909 京张铁路建成 → 2026 AI 创新带城市设计 · 铁路叙事 → 智能体新基建</text>

<!-- Horizontal axis -->
<line x1="80" y1="250" x2="1120" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Year markers on axis -->
<g font-family="JetBrains Mono, monospace" font-size="11" fill="#94a3b8">
  <text x="120" y="280" text-anchor="middle">1909</text>
  <text x="280" y="280" text-anchor="middle">1950s</text>
  <text x="440" y="280" text-anchor="middle">1980s</text>
  <text x="600" y="280" text-anchor="middle">2000s</text>
  <text x="760" y="280" text-anchor="middle">2016</text>
  <text x="880" y="280" text-anchor="middle">2022</text>
  <text x="1000" y="280" text-anchor="middle">2026</text>
  <text x="1090" y="280" text-anchor="middle">2035</text>
</g>

<!-- Event markers -->
<!-- 1909: 京张铁路建成 (above axis) -->
<g transform="translate(120, 250)">
  <circle cx="0" cy="0" r="10" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
  <line x1="0" y1="-10" x2="0" y2="-60" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="-90" y="-130" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="-90" y="-130" width="180" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="0" y="-105" fill="white" font-size="11" font-weight="600" text-anchor="middle">京张铁路建成</text>
  <text x="0" y="-89" fill="#94a3b8" font-size="9" text-anchor="middle">詹天佑主持 · 人字形铁路</text>
</g>

<!-- 1950s: 中关村科学城兴起 (below axis) -->
<g transform="translate(280, 250)">
  <circle cx="0" cy="0" r="10" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="60" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="0" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle">中关村科学城兴起</text>
  <text x="0" y="111" fill="#94a3b8" font-size="9" text-anchor="middle">中科院 + 院所集聚</text>
</g>

<!-- 1980s: 电子一条街 (above) -->
<g transform="translate(440, 250)">
  <circle cx="0" cy="0" r="10" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
  <line x1="0" y1="-10" x2="0" y2="-60" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="-90" y="-130" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="-90" y="-130" width="180" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="0" y="-105" fill="white" font-size="11" font-weight="600" text-anchor="middle">中关村电子一条街</text>
  <text x="0" y="-89" fill="#94a3b8" font-size="9" text-anchor="middle">"北京硅谷"雏形</text>
</g>

<!-- 2000s: 京张铁路停运 (below) -->
<g transform="translate(600, 250)">
  <circle cx="0" cy="0" r="10" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="0" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle">京张铁路清华园段停运</text>
  <text x="0" y="111" fill="#94a3b8" font-size="9" text-anchor="middle">转场地下 / 遗址化</text>
</g>

<!-- 2016: 京张遗址公园立项 (above) -->
<g transform="translate(760, 250)">
  <circle cx="0" cy="0" r="10" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="2"/>
  <line x1="0" y1="-10" x2="0" y2="-60" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="-90" y="-130" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="-90" y="-130" width="180" height="60" rx="6" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="0" y="-105" fill="white" font-size="11" font-weight="600" text-anchor="middle">京张遗址公园立项</text>
  <text x="0" y="-89" fill="#94a3b8" font-size="9" text-anchor="middle">遗址 + 公共空间</text>
</g>

<!-- 2022: 京张铁路遗址公园开放 (below) -->
<g transform="translate(880, 250)">
  <circle cx="0" cy="0" r="10" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="60" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="0" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle">京张铁路遗址公园开放</text>
  <text x="0" y="111" fill="#94a3b8" font-size="9" text-anchor="middle">9 km 绿色走廊</text>
</g>

<!-- 2026: AI 创新带城市设计 (above) -->
<g transform="translate(1000, 250)">
  <circle cx="0" cy="0" r="14" fill="#C0392B" stroke="white" stroke-width="3"/>
  <line x1="0" y1="-14" x2="0" y2="-60" stroke="#C0392B" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="-100" y="-130" width="200" height="60" rx="6" fill="#0f172a"/>
  <rect x="-100" y="-130" width="200" height="60" rx="6" fill="rgba(192, 57, 43, 0.4)" stroke="#C0392B" stroke-width="2"/>
  <text x="0" y="-105" fill="white" font-size="11" font-weight="700" text-anchor="middle">★ AI 创新带城市设计</text>
  <text x="0" y="-89" fill="#94a3b8" font-size="9" text-anchor="middle">百年京张AI创新带征集</text>
</g>

<!-- 2035: 远期完成 (below) -->
<g transform="translate(1090, 250)">
  <circle cx="0" cy="0" r="10" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="2"/>
  <line x1="0" y1="10" x2="0" y2="60" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="-90" y="70" width="180" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="0" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle">远期完成</text>
  <text x="0" y="111" fill="#94a3b8" font-size="9" text-anchor="middle">众智园全栈 + 全球活动</text>
</g>

<!-- Era spans -->
<g>
  <text x="200" y="425" fill="#fbbf24" font-size="9" font-weight="600" text-anchor="middle">铁路时代 / Railway Era</text>
  <line x1="100" y1="430" x2="500" y2="430" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
</g>
<g>
  <text x="680" y="425" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">遗址时代 / Heritage Era</text>
  <line x1="540" y1="430" x2="900" y2="430" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
</g>
<g>
  <text x="1050" y="425" fill="#C0392B" font-size="9" font-weight="600" text-anchor="middle">AI 时代 / AI Era</text>
  <line x1="940" y1="430" x2="1140" y2="430" stroke="#C0392B" stroke-width="2" opacity="0.5"/>
</g>

<!-- Legend -->
<g transform="translate(30, 470)">
  <circle cx="0" cy="0" r="4" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24"/>
  <text x="10" y="3" fill="#94a3b8" font-size="8">铁路遗产</text>
  <circle cx="100" cy="0" r="4" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee"/>
  <text x="110" y="3" fill="#94a3b8" font-size="8">科技创新</text>
  <circle cx="200" cy="0" r="4" fill="rgba(59, 130, 246, 0.3)" stroke="#60a5fa"/>
  <text x="210" y="3" fill="#94a3b8" font-size="8">公共空间</text>
  <circle cx="300" cy="0" r="4" fill="#C0392B"/>
  <text x="310" y="3" fill="#94a3b8" font-size="8">本方案</text>
</g>
</svg>
