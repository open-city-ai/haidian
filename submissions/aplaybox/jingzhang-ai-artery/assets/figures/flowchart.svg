<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">

<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
  </marker>
  <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
  </marker>
  <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
  </marker>
  <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
  </marker>
  <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </marker>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
</defs>

<rect width="1200" height="700" fill="#0f172a"/>
<rect width="1200" height="700" fill="url(#grid)"/>

<!-- Title -->
<text x="30" y="30" fill="white" font-size="16" font-weight="700">试点项目阶段门流程图 / Pilot Project Stage-Gate Flowchart</text>
<text x="30" y="48" fill="#94a3b8" font-size="9">5 个近期试点 × 3 阶段门 (G1→G2→G3) + 失败退出条件</text>

<!-- Start node -->
<g transform="translate(80, 350)">
  <rect x="0" y="-30" width="120" height="60" rx="30" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="60" y="-5" fill="white" font-size="11" font-weight="600" text-anchor="middle">启动 / Start</text>
  <text x="60" y="11" fill="#94a3b8" font-size="9" text-anchor="middle">现状基线 TBD</text>
</g>

<!-- Arrow to G1 -->
<line x1="200" y1="350" x2="260" y2="350" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

<!-- Stage Gate G1 -->
<g transform="translate(260, 350)">
  <polygon points="60,0 120,60 60,120 0,60" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="60" y="58" fill="white" font-size="11" font-weight="600" text-anchor="middle">G1</text>
  <text x="60" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">用地许可</text>
</g>

<!-- Decision arrow labels -->
<text x="160" y="335" fill="#22d3ee" font-size="9" font-weight="600">提交</text>
<text x="410" y="335" fill="#34d399" font-size="9" font-weight="600">通过</text>

<!-- Arrow G1 → G2 (pass) -->
<line x1="380" y1="350" x2="440" y2="350" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

<!-- Failure exit branch 1 -->
<line x1="320" y1="410" x2="320" y2="480" stroke="#fb7185" stroke-width="2" stroke-dasharray="5,3"/>
<text x="330" y="445" fill="#fb7185" font-size="9">未通过 (12 个月)</text>

<g transform="translate(200, 480)">
  <rect x="0" y="0" width="240" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="2"/>
  <text x="120" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">备选方案 / Fallback</text>
  <text x="120" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">转入"改造保留"或"临时展示节点"</text>
</g>

<!-- Arrow back to start (loop) for fallback -->
<path d="M 200 510 Q 100 510 100 410" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-open)"/>

<!-- Phase 1: 实施 -->
<g transform="translate(440, 320)">
  <rect x="0" y="0" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="0" y="0" width="180" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="90" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">主体实施 / Construction</text>
  <text x="90" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">KPI 监测</text>
</g>

<!-- Arrow Phase1 → G2 -->
<line x1="620" y1="350" x2="680" y2="350" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

<!-- Stage Gate G2 -->
<g transform="translate(680, 350)">
  <polygon points="60,0 120,60 60,120 0,60" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="60" y="58" fill="white" font-size="11" font-weight="600" text-anchor="middle">G2</text>
  <text x="60" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">主体结构</text>
</g>

<text x="830" y="335" fill="#34d399" font-size="9" font-weight="600">通过</text>

<!-- Arrow G2 → G3 -->
<line x1="800" y1="350" x2="860" y2="350" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

<!-- Failure exit branch 2 -->
<line x1="740" y1="410" x2="740" y2="480" stroke="#fb7185" stroke-width="2" stroke-dasharray="5,3"/>
<text x="750" y="445" fill="#fb7185" font-size="9">未通过 (24 个月)</text>

<g transform="translate(620, 480)">
  <rect x="0" y="0" width="240" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="2"/>
  <text x="120" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">备选方案 / Fallback</text>
  <text x="120" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">分期实施 或 缩减规模</text>
</g>

<!-- Phase 2: 投运准备 -->
<g transform="translate(860, 320)">
  <rect x="0" y="0" width="180" height="60" rx="6" fill="#0f172a"/>
  <rect x="0" y="0" width="180" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="90" y="22" fill="white" font-size="11" font-weight="600" text-anchor="middle">投运准备 / Commissioning</text>
  <text x="90" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">试运营</text>
</g>

<!-- Arrow Phase2 → G3 -->
<line x1="1040" y1="350" x2="1080" y2="350" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

<!-- Stage Gate G3 -->
<g transform="translate(1060, 320)">
  <polygon points="60,0 120,60 60,120 0,60" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="60" y="58" fill="white" font-size="11" font-weight="600" text-anchor="middle">G3</text>
  <text x="60" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">投运</text>
</g>

<!-- End node -->
<g transform="translate(1080, 450)">
  <rect x="0" y="-30" width="100" height="60" rx="30" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="50" y="-5" fill="white" font-size="11" font-weight="600" text-anchor="middle">完成 / Done</text>
  <text x="50" y="11" fill="#94a3b8" font-size="9" text-anchor="middle">KPI 达成</text>
</g>
<line x1="1120" y1="440" x2="1120" y2="420" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>

<!-- 5 pilot projects table (right side) -->
<g transform="translate(30, 580)">
  <text x="0" y="0" fill="white" font-size="11" font-weight="600">5 个近期试点项目 / 5 Near-term Pilot Projects</text>
  <text x="0" y="18" fill="#94a3b8" font-size="9">①大钟寺批发市场拆除重建  ②大钟寺站一体化改造  ③AI 里程碑公园建设  ④京张遗址公园走廊南段先导  ⑤AI 智能体贡献荣誉墙一期</text>
  <text x="0" y="36" fill="#94a3b8" font-size="9">每个项目应用同一阶段门流程；阶段门未通过即转入备选方案；资金假设不构成投资承诺</text>
</g>

<!-- Legend -->
<g transform="translate(900, 580)">
  <rect x="0" y="-12" width="20" height="20" rx="3" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24"/>
  <text x="25" y="3" fill="#94a3b8" font-size="9">阶段门</text>
  <rect x="80" y="-12" width="20" height="20" rx="3" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee"/>
  <text x="105" y="3" fill="#94a3b8" font-size="9">实施阶段</text>
  <rect x="170" y="-12" width="20" height="20" rx="3" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185"/>
  <text x="195" y="3" fill="#94a3b8" font-size="9">备选方案</text>
  <rect x="255" y="-12" width="20" height="20" rx="3" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399"/>
  <text x="280" y="3" fill="#94a3b8" font-size="9">起止节点</text>
</g>
</svg>
