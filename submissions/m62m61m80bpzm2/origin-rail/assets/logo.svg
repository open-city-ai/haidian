<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="京张初轨 ORIGIN RAIL 品牌标志：被铁轨穿过的零公里里程碑">
  <defs>
    <linearGradient id="or-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2a3d"/>
      <stop offset="1" stop-color="#3d4c63"/>
    </linearGradient>
    <radialGradient id="or-signal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.7" stop-color="#e03131"/>
      <stop offset="1" stop-color="#b81f1a"/>
    </radialGradient>
    <radialGradient id="or-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e03131" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e03131" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 轨道枕木（延伸向地平线） -->
  <g stroke="#c3ccd8" stroke-width="3">
    <line x1="24"  y1="88" x2="24"  y2="112"/>
    <line x1="40"  y1="88" x2="40"  y2="112"/>
    <line x1="56"  y1="88" x2="56"  y2="112"/>
    <line x1="72"  y1="88" x2="72"  y2="112"/>
    <line x1="244" y1="88" x2="244" y2="112"/>
    <line x1="260" y1="88" x2="260" y2="112"/>
    <line x1="276" y1="88" x2="276" y2="112"/>
    <line x1="292" y1="88" x2="292" y2="112"/>
    <line x1="308" y1="88" x2="308" y2="112"/>
    <line x1="324" y1="88" x2="324" y2="112"/>
    <line x1="340" y1="88" x2="340" y2="112"/>
    <line x1="356" y1="88" x2="356" y2="112"/>
    <line x1="372" y1="88" x2="372" y2="112"/>
    <line x1="388" y1="88" x2="388" y2="112"/>
    <line x1="404" y1="88" x2="404" y2="112"/>
  </g>
  <!-- 双轨 -->
  <line x1="8" y1="86" x2="472" y2="86" stroke="url(#or-steel)" stroke-width="6" stroke-linecap="round"/>
  <line x1="8" y1="114" x2="472" y2="114" stroke="url(#or-steel)" stroke-width="6" stroke-linecap="round"/>

  <!-- 零公里里程碑：被铁轨穿过的 “0” -->
  <circle cx="150" cy="100" r="72" fill="none" stroke="#1f2a3d" stroke-width="24"/>
  <circle cx="150" cy="100" r="72" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.28"/>
  <!-- 轨道穿过 0 的开口（遮罩效果：先画轨道再画环两侧盖板） -->
  <rect x="96"  y="86" width="60" height="6"  fill="#f4f6f9"/>
  <rect x="96"  y="108" width="60" height="6" fill="#f4f6f9"/>
  <rect x="150" y="86" width="54" height="6"  fill="#f4f6f9"/>
  <rect x="150" y="108" width="54" height="6" fill="#f4f6f9"/>
  <!-- 中心零点：数据青菱形 + 0 -->
  <rect x="140" y="90" width="20" height="20" transform="rotate(45 150 100)" fill="#1098ad"/>
  <text x="150" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">0</text>

  <!-- 出发信号（信号红） -->
  <circle cx="446" cy="56" r="14" fill="url(#or-glow)"/>
  <line x1="446" y1="70" x2="446" y2="86" stroke="#3d4c63" stroke-width="4"/>
  <circle cx="446" cy="54" r="9" fill="url(#or-signal)"/>

  <!-- 字标 -->
  <text x="258" y="76" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" fill="#1f2a3d">京张初轨</text>
  <text x="260" y="106" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="7" fill="#3d4c63">ORIGIN RAIL</text>
  <text x="260" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#e03131">O·R · FROM THE FIRST RAIL TO THE FIRST AGENT</text>
  <text x="260" y="158" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#7a8698">1909 京张铁路通车 → 2026 智能体共创</text>
</svg>
