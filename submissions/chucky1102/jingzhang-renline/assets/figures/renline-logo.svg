<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RENLINE 人字线 logo concept">
  <rect width="900" height="520" fill="#FAF7F2"/>
  <!-- left stroke: heritage track (撇) -->
  <path d="M 450 100 L 302 330" stroke="#B5442D" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- right stroke: life track (捺) -->
  <path d="M 450 100 L 598 330" stroke="#1F5FA8" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- rail centerlines: dashed white, reads as track -->
  <path d="M 444 118 L 314 320" stroke="#FAF7F2" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="15 13"/>
  <path d="M 456 118 L 586 320" stroke="#FAF7F2" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="15 13"/>
  <!-- data-stream dots continuing each stroke, ending above the wordmark -->
  <g fill="#B5442D">
    <circle cx="286" cy="352" r="9"/>
    <circle cx="269" cy="378" r="6.2"/>
    <circle cx="255" cy="400" r="4"/>
  </g>
  <g fill="#1F5FA8">
    <circle cx="614" cy="352" r="9"/>
    <circle cx="631" cy="378" r="6.2"/>
    <circle cx="645" cy="400" r="4"/>
  </g>
  <!-- junction node: signal light / neuron -->
  <circle cx="450" cy="88" r="29" fill="#1E7F4F"/>
  <circle cx="450" cy="88" r="29" fill="none" stroke="#FAF7F2" stroke-width="5"/>
  <circle cx="450" cy="88" r="42" fill="none" stroke="#1E7F4F" stroke-width="2.4" opacity="0.4"/>
  <circle cx="450" cy="88" r="54" fill="none" stroke="#1E7F4F" stroke-width="1.4" opacity="0.2"/>
  <!-- wordmark -->
  <text x="450" y="430" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="54" font-weight="700" fill="#2B2B2B">人字线 <tspan fill="#B5442D">RENLINE</tspan></text>
  <text x="450" y="464" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="18" letter-spacing="3" fill="#9C9890">THE JING-ZHANG AI SWITCHBACK</text>
  <text x="450" y="496" text-anchor="middle" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16.5" fill="#55504A">百年折返 · 一线登顶 | Climb by Iteration</text>
</svg>
