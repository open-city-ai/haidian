<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="heritage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d8b8"/>
      <stop offset="1" stop-color="#a88858"/>
    </linearGradient>
    <linearGradient id="newBldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d4c8"/>
      <stop offset="1" stop-color="#8a8270"/>
    </linearGradient>
    <pattern id="roofTile" patternUnits="userSpaceOnUse" width="8" height="6">
      <path d="M 0 3 Q 4 0 8 3" fill="none" stroke="#5a3a2a" stroke-width="0.6"/>
    </pattern>
    <pattern id="brick" patternUnits="userSpaceOnUse" width="10" height="6">
      <rect width="10" height="6" fill="#c8a878"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#7a5a38" stroke-width="0.3"/>
      <line x1="5" y1="0" x2="5" y2="6" stroke="#7a5a38" stroke-width="0.3"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#fafaf6"/>

  <rect x="0" y="0" width="1600" height="92" fill="#1a2332"/>
  <text x="60" y="50" fill="#f5e9c8" font-size="26" font-weight="700" letter-spacing="3">节点设计 · 大钟寺</text>
  <text x="60" y="78" fill="#c8bfa8" font-size="13" letter-spacing="2">DAZHONGSI  ·  HERITAGE &amp; CULTURAL REVIVAL</text>
  <text x="1540" y="50" fill="#f5e9c8" font-size="13" text-anchor="end" letter-spacing="2">SHEET 04 / 04</text>
  <text x="1540" y="78" fill="#c8bfa8" font-size="11" text-anchor="end">lc140606  /  INDEPENDENT</text>

  <!-- 总平面 -->
  <g transform="translate(40,120)">
    <rect width="960" height="720" fill="#f3f0e8" stroke="#bba97a" stroke-width="0.8"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#3a3320">总平面  ·  MASTER PLAN</text>
    <text x="20" y="52" font-size="11" fill="#6b5e3f">72.0 ha  ·  永乐大钟（46.5 t）文化遗产 + 当代文化设施</text>

    <!-- 场地轮廓 -->
    <path d="M 80 110 L 880 110 L 900 320 L 860 540 L 200 580 L 80 480 L 60 280 Z"
          fill="#f8f5e8" stroke="#5a4a2a" stroke-width="1.6"/>

    <!-- 永乐大钟寺（中轴核心） -->
    <g transform="translate(480,300)">
      <!-- 院墙 -->
      <rect x="-90" y="-80" width="180" height="160" fill="url(#brick)" stroke="#5a3a2a" stroke-width="1.2"/>
      <!-- 山门 -->
      <rect x="-50" y="-90" width="100" height="20" fill="url(#roofTile)" stroke="#5a3a2a" stroke-width="0.8"/>
      <rect x="-44" y="-70" width="88" height="22" fill="#c8a878" stroke="#5a3a2a" stroke-width="0.6"/>
      <!-- 钟楼 -->
      <rect x="-30" y="-50" width="60" height="60" fill="#c8a878" stroke="#5a3a2a" stroke-width="0.6"/>
      <polygon points="-32,-50 32,-50 28,-66 0,-78 -28,-66" fill="url(#roofTile)" stroke="#5a3a2a" stroke-width="0.8"/>
      <!-- 大钟示意 -->
      <ellipse cx="0" cy="-20" rx="14" ry="18" fill="#5a3a2a" stroke="#2a1a0a" stroke-width="1"/>
      <line x1="0" y1="-38" x2="0" y2="-44" stroke="#2a1a0a" stroke-width="0.8"/>
      <text x="0" y="100" font-size="12" text-anchor="middle" fill="#3a3320" font-weight="700">永乐大钟寺</text>
      <text x="0" y="114" font-size="9" text-anchor="middle" fill="#6b5e3f" font-style="italic">Yongle Great Bell Temple</text>
    </g>

    <!-- 文化设施（北侧） -->
    <g transform="translate(220,180)">
      <rect width="120" height="70" fill="url(#heritage)" stroke="#5a3a2a" stroke-width="0.8"/>
      <line x1="10" y1="20" x2="110" y2="20" stroke="#5a3a2a" stroke-width="0.5"/>
      <line x1="10" y1="40" x2="110" y2="40" stroke="#5a3a2a" stroke-width="0.5"/>
      <text x="60" y="12" font-size="10" text-anchor="middle" fill="#3a3320" font-weight="700">钟博文化馆</text>
      <text x="60" y="60" font-size="8" text-anchor="middle" fill="#3a3320">Bell Museum</text>
    </g>
    <g transform="translate(620,180)">
      <rect width="120" height="70" fill="url(#heritage)" stroke="#5a3a2a" stroke-width="0.8"/>
      <line x1="10" y1="20" x2="110" y2="20" stroke="#5a3a2a" stroke-width="0.5"/>
      <line x1="10" y1="40" x2="110" y2="40" stroke="#5a3a2a" stroke-width="0.5"/>
      <text x="60" y="12" font-size="10" text-anchor="middle" fill="#3a3320" font-weight="700">非遗展演工坊</text>
      <text x="60" y="60" font-size="8" text-anchor="middle" fill="#3a3320">Intangible Heritage</text>
    </g>

    <!-- 当代文化地标（南侧） -->
    <g transform="translate(380,450)">
      <rect width="200" height="80" fill="url(#newBldg)" stroke="#3a3a3a" stroke-width="0.8"/>
      <line x1="20" y1="20" x2="180" y2="20" stroke="#3a3a3a" stroke-width="0.5"/>
      <line x1="20" y1="50" x2="180" y2="50" stroke="#3a3a3a" stroke-width="0.5"/>
      <text x="100" y="46" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">大钟寺当代美术馆</text>
      <text x="100" y="100" font-size="9" text-anchor="middle" fill="#6b5e3f">Dazhongsi Contemporary Art Museum</text>
    </g>

    <!-- 文创街区（西） -->
    <g transform="translate(120,400)">
      <rect width="100" height="120" fill="none" stroke="#8a7a5a" stroke-width="0.8" stroke-dasharray="3 2"/>
      <line x1="0" y1="40" x2="100" y2="40" stroke="#8a7a5a" stroke-width="0.5"/>
      <line x1="0" y1="80" x2="100" y2="80" stroke="#8a7a5a" stroke-width="0.5"/>
      <line x1="50" y1="0" x2="50" y2="120" stroke="#8a7a5a" stroke-width="0.5"/>
      <text x="50" y="20" font-size="9" text-anchor="middle" fill="#3a3320" font-weight="700">文创</text>
      <text x="50" y="60" font-size="9" text-anchor="middle" fill="#3a3320">零售</text>
      <text x="50" y="100" font-size="9" text-anchor="middle" fill="#3a3320">工坊</text>
    </g>

    <!-- 中轴步道 -->
    <line x1="480" y1="110" x2="480" y2="540" stroke="#c93b3b" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="490" y="140" font-size="9" fill="#c93b3b" font-style="italic">中轴钟声步道  1.2 km</text>

    <!-- 街巷（窄巷） -->
    <g stroke="#8a7a5a" stroke-width="0.6" fill="none" opacity="0.6">
      <line x1="350" y1="120" x2="350" y2="540"/>
      <line x1="600" y1="120" x2="600" y2="540"/>
      <line x1="100" y1="300" x2="860" y2="300"/>
      <line x1="100" y1="400" x2="860" y2="400"/>
    </g>

    <!-- 现状水井（西南角） -->
    <circle cx="180" cy="540" r="14" fill="#5a8aa8" stroke="#1a3540" stroke-width="1"/>
    <text x="180" y="544" font-size="7" text-anchor="middle" fill="#fff">古井</text>
    <text x="180" y="566" font-size="8" text-anchor="middle" fill="#3a3320">古井遗址</text>

    <!-- 比例尺 -->
    <g transform="translate(820,680)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#3a3320" stroke-width="1.5"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#3a3320" stroke-width="1.5"/>
      <line x1="100" y1="-4" x2="100" y2="4" stroke="#3a3320" stroke-width="1.5"/>
      <text x="0" y="18" font-size="9" fill="#3a3320">0</text>
      <text x="100" y="18" font-size="9" text-anchor="middle" fill="#3a3320">200 m</text>
    </g>

    <!-- 指北针 -->
    <g transform="translate(900,140)">
      <circle r="20" fill="#fff" stroke="#3a3320" stroke-width="0.8"/>
      <polygon points="0,-16 4,0 0,-3 -4,0" fill="#c93b3b"/>
      <polygon points="0,16 4,0 0,3 -4,0" fill="#3a3320"/>
      <text x="0" y="-24" font-size="9" text-anchor="middle" fill="#3a3320" font-weight="700">N</text>
    </g>
  </g>

  <!-- 右侧栏 -->
  <g transform="translate(1020,120)">
    <rect width="540" height="720" fill="#f5f0e3" stroke="#bba97a" stroke-width="0.6"/>

    <text x="20" y="32" font-size="15" font-weight="700" fill="#3a3320">文化叙事  ·  CULTURAL NARRATIVE</text>
    <text x="20" y="52" font-size="11" fill="#6b5e3f">永乐大钟 · 46.5 t · 1420 年铸成</text>

    <g transform="translate(20,80)" font-size="11" fill="#3a3320">
      <text x="0" y="0" font-weight="700">·  物  /  OBJECT</text>
      <text x="0" y="18" fill="#6b5e3f">永乐大钟 46.5 t · 高 6.75 m · 口径 3.3 m</text>
      <text x="0" y="34" fill="#6b5e3f">世界铭文最多之大钟 · 国宝级文物</text>

      <text x="0" y="68" font-weight="700">·  场  /  PLACE</text>
      <text x="0" y="86" fill="#6b5e3f">大钟寺原为清雍正敕建 · 1985 年起</text>
      <text x="0" y="102" fill="#6b5e3f">作为古钟博物馆向公众开放</text>

      <text x="0" y="136" font-weight="700">·  今  /  PRESENT</text>
      <text x="0" y="154" fill="#6b5e3f">街区以"钟声"为隐喻，从博物馆出发，</text>
      <text x="0" y="170" fill="#6b5e3f">拓展为钟博、非遗、当代美术、文创四类场所。</text>

      <text x="0" y="204" font-weight="700">·  续  /  CONTINUITY</text>
      <text x="0" y="222" fill="#6b5e3f">每周日 10:00 钟声仪式 · 数字孪生</text>
      <text x="0" y="238" fill="#6b5e3f">永乐大钟 APP · 公众可远程敲响云钟</text>
    </g>

    <!-- 设计要点 -->
    <g transform="translate(20,400)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#3a3320">设计要点  ·  DESIGN INTENT</text>
      <line x1="0" y1="10" x2="200" y2="10" stroke="#bba97a" stroke-width="0.6"/>
      <g font-size="11" fill="#3a3320">
        <text x="0" y="32" font-weight="700">·  遗产活化  HERITAGE</text>
        <text x="0" y="50" fill="#6b5e3f">永乐大钟寺原址保护 · 中轴 1.2 km</text>
        <text x="0" y="66" fill="#6b5e3f">严格控制新建高度 ≤ 9 m</text>

        <text x="0" y="90" font-weight="700">·  当代延伸  CONTEMPORARY</text>
        <text x="0" y="108" fill="#6b5e3f">当代美术馆 / 非遗工坊 / 文创街区</text>
        <text x="0" y="124" fill="#6b5e3f">构筑街区"博物馆 + 工坊 + 市集"三联</text>

        <text x="0" y="148" font-weight="700">·  文化运营  PROGRAMMING</text>
        <text x="0" y="166" fill="#6b5e3f">钟声仪式 · 数字孪生 · 钟主题文创</text>
        <text x="0" y="182" fill="#6b5e3f">建立 24/7 可达的文化目的地</text>
      </g>
    </g>

    <!-- 关键指标 -->
    <g transform="translate(20,620)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#3a3320">关键指标  ·  METRICS</text>
      <line x1="0" y1="10" x2="200" y2="10" stroke="#bba97a" stroke-width="0.6"/>
      <g font-size="11">
        <text x="0" y="32" fill="#6b5e3f">用地面积</text>
        <text x="240" y="32" text-anchor="end" font-weight="700" fill="#3a3320">72.0 ha</text>
        <text x="0" y="54" fill="#6b5e3f">永乐大钟重量</text>
        <text x="240" y="54" text-anchor="end" font-weight="700" fill="#3a3320">46.5 t</text>
        <text x="0" y="76" fill="#6b5e3f">中轴钟声步道</text>
        <text x="240" y="76" text-anchor="end" font-weight="700" fill="#3a3320">1.2 km</text>
      </g>
    </g>
  </g>

  <text x="800" y="990" font-size="9" fill="#9c8a6a" text-anchor="middle" letter-spacing="1">© 2026  lc140606  /  JINGZHANG CENTURY LINK  ·  INDEPENDENT SUBMISSION</text>
</svg>
