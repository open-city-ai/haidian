<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="parkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe8d4"/>
      <stop offset="1" stop-color="#b6cca7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c8d8"/>
      <stop offset="1" stop-color="#6a96b0"/>
    </linearGradient>
    <pattern id="parkTree" patternUnits="userSpaceOnUse" width="12" height="12">
      <circle cx="6" cy="6" r="2.4" fill="#3a5a3a" opacity="0.55"/>
    </pattern>
    <pattern id="paving" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#e8e0c8"/>
      <line x1="0" y1="0" x2="14" y2="14" stroke="#c8b896" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#fafaf6"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="1600" height="92" fill="#1a2332"/>
  <text x="60" y="50" fill="#f5e9c8" font-size="26" font-weight="700" letter-spacing="3">节点设计 · 众智园</text>
  <text x="60" y="78" fill="#c8bfa8" font-size="13" letter-spacing="2">ZHONGZHI PARK  ·  PUBLIC SPACE &amp; LANDMARK</text>
  <text x="1540" y="50" fill="#f5e9c8" font-size="13" text-anchor="end" letter-spacing="2">SHEET 02 / 04</text>
  <text x="1540" y="78" fill="#c8bfa8" font-size="11" text-anchor="end">lc140606  /  INDEPENDENT</text>

  <!-- 总平面图（左 60%） -->
  <g transform="translate(40,120)">
    <rect width="960" height="720" fill="#f3f0e8" stroke="#bba97a" stroke-width="0.8"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#3a3320">总平面  ·  MASTER PLAN</text>
    <text x="20" y="52" font-size="11" fill="#6b5e3f">192.1 ha  ·  以中央林荫广场为核，串联 AI 公共客厅 / 市民运动环 / 智算云台</text>

    <!-- 场地轮廓 -->
    <path d="M 60 100 L 900 100 L 920 280 L 900 480 L 760 600 L 200 600 L 80 500 L 60 280 Z"
          fill="#f8f5e8" stroke="#5a4a2a" stroke-width="1.6"/>

    <!-- 中央大草坪 -->
    <ellipse cx="490" cy="370" rx="200" ry="120" fill="url(#parkGrad)" stroke="#3a5a3a" stroke-width="1.2"/>
    <ellipse cx="490" cy="370" rx="160" ry="90" fill="url(#parkTree)" opacity="0.7"/>
    <text x="490" y="375" font-size="14" text-anchor="middle" fill="#2a4a2a" font-weight="700">中央林荫广场</text>
    <text x="490" y="392" font-size="9" text-anchor="middle" fill="#2a4a2a" font-style="italic">Central Lawn</text>

    <!-- 智算云台（地标） -->
    <g transform="translate(490,250)">
      <rect x="-40" y="-50" width="80" height="50" fill="#1a2332"/>
      <polygon points="-50,0 50,0 30,30 -30,30" fill="#c93b3b"/>
      <rect x="-6" y="-30" width="12" height="30" fill="#5a8aa8" opacity="0.7"/>
      <rect x="14" y="-26" width="8" height="26" fill="#5a8aa8" opacity="0.7"/>
      <rect x="-22" y="-26" width="8" height="26" fill="#5a8aa8" opacity="0.7"/>
      <text x="0" y="48" font-size="10" text-anchor="middle" fill="#1a2332" font-weight="700">智算云台</text>
      <text x="0" y="60" font-size="8" text-anchor="middle" fill="#1a2332">AI Pavilion  ·  40m</text>
    </g>

    <!-- 滨水（西） -->
    <path d="M 60 100 Q 90 250 80 400 T 80 600" fill="url(#water)" stroke="#3a5a7a" stroke-width="1.2"/>
    <text x="40" y="380" font-size="9" fill="#1a3540" font-style="italic" transform="rotate(-90 40 380)">京密引水渠 · 滨水步道</text>

    <!-- AI 公共客厅（西侧） -->
    <g transform="translate(180,330)">
      <rect x="0" y="0" width="120" height="80" fill="#e8e0c8" stroke="#8a7a5a" stroke-width="1"/>
      <rect x="6" y="6" width="108" height="68" fill="url(#paving)"/>
      <line x1="20" y1="20" x2="100" y2="20" stroke="#5a4a2a" stroke-width="0.8"/>
      <line x1="20" y1="40" x2="100" y2="40" stroke="#5a4a2a" stroke-width="0.8"/>
      <line x1="20" y1="60" x2="100" y2="60" stroke="#5a4a2a" stroke-width="0.8"/>
      <text x="60" y="98" font-size="11" text-anchor="middle" fill="#3a3320" font-weight="700">AI 公共客厅</text>
      <text x="60" y="110" font-size="8" text-anchor="middle" fill="#6b5e3f">AI Living Room</text>
    </g>

    <!-- 市民运动环（环形跑道） -->
    <ellipse cx="490" cy="370" rx="280" ry="200" fill="none" stroke="#c93b3b" stroke-width="2.4" stroke-dasharray="6 3"/>
    <text x="780" y="280" font-size="10" fill="#c93b3b" font-style="italic">市民运动环  3.0 km</text>

    <!-- 儿童探索地（东） -->
    <g transform="translate(700,450)">
      <circle r="40" fill="#f0d8a8" stroke="#c97b3b" stroke-width="1.2"/>
      <circle r="28" fill="none" stroke="#c97b3b" stroke-width="0.8" stroke-dasharray="2 2"/>
      <circle r="14" fill="#c97b3b" opacity="0.7"/>
      <text x="0" y="58" font-size="10" text-anchor="middle" fill="#3a3320" font-weight="700">儿童探索地</text>
    </g>

    <!-- 京张铁路遗址（南） -->
    <line x1="60" y1="600" x2="900" y2="600" stroke="#5a3a2a" stroke-width="3.2"/>
    <g stroke="#5a3a2a" stroke-width="0.6">
      <line x1="80" y1="600" x2="80" y2="608"/>
      <line x1="100" y1="600" x2="100" y2="608"/>
      <line x1="120" y1="600" x2="120" y2="608"/>
      <line x1="140" y1="600" x2="140" y2="608"/>
    </g>
    <text x="120" y="592" font-size="9" fill="#5a3a2a" font-style="italic">京张铁路遗址（南界）</text>

    <!-- 主入口（北） -->
    <g transform="translate(490,100)">
      <rect x="-30" y="-12" width="60" height="12" fill="#c93b3b"/>
      <text x="0" y="-18" font-size="10" text-anchor="middle" fill="#3a3320" font-weight="700">主入口</text>
    </g>
    <g transform="translate(180,330)">
      <rect x="-12" y="-30" width="12" height="60" fill="#c93b3b" opacity="0"/>
    </g>

    <!-- 比例尺 -->
    <g transform="translate(820,680)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#3a3320" stroke-width="1.5"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#3a3320" stroke-width="1.5"/>
      <line x1="100" y1="-4" x2="100" y2="4" stroke="#3a3320" stroke-width="1.5"/>
      <text x="0" y="18" font-size="9" fill="#3a3320">0</text>
      <text x="100" y="18" font-size="9" text-anchor="middle" fill="#3a3320">200 m</text>
    </g>

    <!-- 指北针 -->
    <g transform="translate(900,140)">
      <circle r="20" fill="#fff" stroke="#3a3320" stroke-width="0.8"/>
      <polygon points="0,-16 4,0 0,-3 -4,0" fill="#c93b3b"/>
      <polygon points="0,16 4,0 0,3 -4,0" fill="#3a3320"/>
      <text x="0" y="-24" font-size="9" text-anchor="middle" fill="#3a3320" font-weight="700">N</text>
    </g>
  </g>

  <!-- 右侧栏：剖面 + 数据 -->
  <g transform="translate(1020,120)">
    <rect width="540" height="720" fill="#f5f0e3" stroke="#bba97a" stroke-width="0.6"/>

    <!-- 剖面示意 -->
    <text x="20" y="32" font-size="15" font-weight="700" fill="#3a3320">A — A'  剖面</text>
    <text x="20" y="52" font-size="11" fill="#6b5e3f">中央林荫广场 · 智算云台 · 滨水步道</text>

    <g transform="translate(20,80)">
      <!-- 剖面背景 -->
      <rect width="500" height="160" fill="#e8e0c8" stroke="#8a7a5a" stroke-width="0.6"/>
      <!-- 地坪线 -->
      <line x1="0" y1="140" x2="500" y2="140" stroke="#5a4a2a" stroke-width="1.4"/>
      <!-- 智算云台剖面 -->
      <g transform="translate(120,40)">
        <polygon points="0,100 80,100 60,40 20,40" fill="#1a2332"/>
        <rect x="20" y="0" width="40" height="40" fill="#1a2332"/>
        <rect x="24" y="6" width="6" height="14" fill="#5a8aa8"/>
        <rect x="34" y="6" width="6" height="14" fill="#5a8aa8"/>
        <rect x="44" y="6" width="6" height="14" fill="#5a8aa8"/>
        <text x="40" y="118" font-size="9" text-anchor="middle" fill="#3a3320">智算云台</text>
      </g>
      <!-- 树阵 -->
      <g fill="#3a5a3a" stroke="#2a4a2a" stroke-width="0.5">
        <circle cx="220" cy="132" r="6"/>
        <circle cx="240" cy="130" r="7"/>
        <circle cx="260" cy="132" r="6"/>
        <circle cx="280" cy="130" r="7"/>
        <circle cx="300" cy="132" r="6"/>
      </g>
      <!-- 水面 -->
      <path d="M 360 140 L 360 158 L 500 158 L 500 140 Z" fill="url(#water)" opacity="0.8"/>
      <text x="430" y="172" font-size="9" text-anchor="middle" fill="#1a3540">滨水步道</text>
      <!-- 标高 -->
      <line x1="0" y1="20" x2="500" y2="20" stroke="#c93b3b" stroke-width="0.6" stroke-dasharray="2 2"/>
      <text x="6" y="16" font-size="8" fill="#c93b3b">+40.0</text>
    </g>

    <!-- 设计要点 -->
    <text x="20" y="280" font-size="14" font-weight="700" fill="#3a3320">设计要点  ·  DESIGN INTENT</text>
    <line x1="20" y1="290" x2="200" y2="290" stroke="#bba97a" stroke-width="0.6"/>

    <g transform="translate(20,310)" font-size="11" fill="#3a3320">
      <text x="0" y="0" font-weight="700">·  公共性  PUBLIC</text>
      <text x="0" y="18" fill="#6b5e3f">中央林荫广场 12 000 m²，承载周末市集、</text>
      <text x="0" y="34" fill="#6b5e3f">户外 AI 公众开放日与跨学科沙龙；</text>
      <text x="0" y="62" font-weight="700">·  地标性  LANDMARK</text>
      <text x="0" y="80" fill="#6b5e3f">智算云台 40 m 高度，可 360° 环视科创园，</text>
      <text x="0" y="96" fill="#6b5e3f">夜间可作为低强度城市光环境点；</text>
      <text x="0" y="124" font-weight="700">·  活力度  ACTIVATION</text>
      <text x="0" y="142" fill="#6b5e3f">3.0 km 市民运动环串联六大主题广场，</text>
      <text x="0" y="158" fill="#6b5e3f">提供日常化、可停留的公共活动场所。</text>
    </g>

    <!-- 关键指标 -->
    <g transform="translate(20,500)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#3a3320">关键指标  ·  METRICS</text>
      <line x1="0" y1="10" x2="200" y2="10" stroke="#bba97a" stroke-width="0.6"/>
      <g font-size="11">
        <text x="0" y="34" fill="#6b5e3f">用地面积</text>
        <text x="240" y="34" text-anchor="end" font-weight="700" fill="#3a3320">192.1 ha</text>
        <text x="0" y="56" fill="#6b5e3f">中央林荫广场</text>
        <text x="240" y="56" text-anchor="end" font-weight="700" fill="#3a3320">≈ 12 000 m²</text>
        <text x="0" y="78" fill="#6b5e3f">智算云台高度</text>
        <text x="240" y="78" text-anchor="end" font-weight="700" fill="#3a3320">40 m</text>
        <text x="0" y="100" fill="#6b5e3f">运动环长度</text>
        <text x="240" y="100" text-anchor="end" font-weight="700" fill="#3a3320">3.0 km</text>
        <text x="0" y="122" fill="#6b5e3f">绿地率</text>
        <text x="240" y="122" text-anchor="end" font-weight="700" fill="#3a3320">≥ 65%</text>
        <text x="0" y="144" fill="#6b5e3f">广场年均活动</text>
        <text x="240" y="144" text-anchor="end" font-weight="700" fill="#3a3320">≥ 60 场</text>
      </g>
    </g>
  </g>

  <text x="800" y="990" font-size="9" fill="#9c8a6a" text-anchor="middle" letter-spacing="1">© 2026  lc140606  /  JINGZHANG CENTURY LINK  ·  INDEPENDENT SUBMISSION</text>
</svg>
