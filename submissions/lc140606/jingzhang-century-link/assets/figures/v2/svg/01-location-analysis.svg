<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="macroBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#ebe5d6"/>
    </linearGradient>
    <linearGradient id="midBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f1"/>
      <stop offset="1" stop-color="#dde6e2"/>
    </linearGradient>
    <linearGradient id="microBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef5"/>
      <stop offset="1" stop-color="#d2dce8"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9c8a6a" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 画布底色 -->
  <rect width="1600" height="1000" fill="#fafaf6"/>

  <!-- 顶部标题区 -->
  <rect x="0" y="0" width="1600" height="92" fill="#1a2332"/>
  <text x="60" y="50" fill="#f5e9c8" font-size="26" font-weight="700" letter-spacing="3">京张 AI 创新带 · 区位分析</text>
  <text x="60" y="78" fill="#c8bfa8" font-size="13" letter-spacing="2">LOCATION ANALYSIS  ·  CENTENNIAL JINGZHANG AI INNOVATION BELT</text>
  <text x="1540" y="50" fill="#f5e9c8" font-size="13" text-anchor="end" letter-spacing="2">SHEET 01 / 04</text>
  <text x="1540" y="78" fill="#c8bfa8" font-size="11" text-anchor="end">lc140606  /  INDEPENDENT</text>

  <!-- ============ 宏观层 ============ -->
  <g transform="translate(40,120)">
    <rect width="500" height="500" fill="url(#macroBg)" stroke="#bba97a" stroke-width="0.8"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#3a3320">I · 宏观区位  MACRO</text>
    <text x="20" y="52" font-size="11" fill="#6b5e3f">在首都功能核心区与西北生态涵养区之间的过渡带</text>

    <!-- 北京轮廓（示意） -->
    <path d="M 90 110 L 410 110 L 430 200 L 410 320 L 360 410 L 260 440 L 160 430 L 100 380 L 80 280 Z"
          fill="#fdfbf3" stroke="#9c8a6a" stroke-width="1.2"/>
    <!-- 山区纹理 -->
    <path d="M 100 380 L 160 430 L 260 440 L 360 410 L 410 320 L 360 280 L 280 300 L 200 320 L 130 360 Z"
          fill="url(#hatch)" opacity="0.7"/>
    <!-- 永定河水系 -->
    <path d="M 80 280 Q 200 300 320 270 T 430 220" fill="none" stroke="#7ea9c2" stroke-width="2.2" opacity="0.85"/>
    <text x="200" y="290" font-size="10" fill="#5a7a8a" font-style="italic">永定河 · 永引渠水系</text>

    <!-- 五环示意 -->
    <circle cx="250" cy="270" r="155" fill="none" stroke="#c9a96a" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
    <text x="320" y="190" font-size="9" fill="#a78f50">五环</text>

    <!-- 海淀位置（高亮） -->
    <circle cx="290" cy="240" r="38" fill="#c93b3b" opacity="0.85"/>
    <circle cx="290" cy="240" r="38" fill="none" stroke="#c93b3b" stroke-width="2.4"/>
    <line x1="328" y1="240" x2="380" y2="240" stroke="#c93b3b" stroke-width="1.2"/>
    <text x="385" y="244" font-size="12" font-weight="700" fill="#c93b3b">海淀区</text>
    <text x="385" y="258" font-size="9" fill="#8a3030">43.6 km² 协同研究</text>

    <!-- 指北针 -->
    <g transform="translate(450,120)">
      <circle r="22" fill="#fff" stroke="#3a3320" stroke-width="0.8"/>
      <polygon points="0,-18 4,0 0,-4 -4,0" fill="#c93b3b"/>
      <polygon points="0,18 4,0 0,4 -4,0" fill="#3a3320"/>
      <text x="0" y="-26" font-size="10" text-anchor="middle" fill="#3a3320" font-weight="700">N</text>
    </g>
    <!-- 比例尺 -->
    <g transform="translate(380,460)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#3a3320" stroke-width="1.5"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#3a3320" stroke-width="1.5"/>
      <line x1="40" y1="-3" x2="40" y2="3" stroke="#3a3320" stroke-width="1"/>
      <line x1="80" y1="-4" x2="80" y2="4" stroke="#3a3320" stroke-width="1.5"/>
      <text x="0" y="18" font-size="9" fill="#3a3320">0</text>
      <text x="40" y="18" font-size="9" text-anchor="middle" fill="#3a3320">10</text>
      <text x="80" y="18" font-size="9" text-anchor="middle" fill="#3a3320">20 km</text>
    </g>
  </g>

  <!-- ============ 中观层 ============ -->
  <g transform="translate(560,120)">
    <rect width="500" height="500" fill="url(#midBg)" stroke="#7e9e95" stroke-width="0.8"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#1d3530">II · 中观区位  MESO</text>
    <text x="20" y="52" font-size="11" fill="#4a5f5a">43.6 km² 协同研究范围 · 串联三山五园与中关村科学城</text>

    <!-- 协同研究范围 -->
    <path d="M 60 90 L 440 90 L 460 220 L 440 380 L 320 430 L 180 420 L 80 360 L 60 200 Z"
          fill="#cddcd3" stroke="#3a5a52" stroke-width="1.6" stroke-dasharray="6 3"/>

    <!-- 内部水系（京密引水渠/万泉河） -->
    <path d="M 100 180 Q 200 220 280 200 T 440 240" fill="none" stroke="#5a8a9a" stroke-width="2" opacity="0.7"/>
    <text x="180" y="195" font-size="9" fill="#4a6f7a" font-style="italic">京密引水渠</text>

    <!-- 三山五园生态核（西侧） -->
    <ellipse cx="110" cy="280" rx="38" ry="60" fill="#7e9e6c" opacity="0.7"/>
    <text x="110" y="284" font-size="9" text-anchor="middle" fill="#1d3530" font-weight="700">三山五园</text>
    <text x="110" y="296" font-size="8" text-anchor="middle" fill="#1d3530">生态文化核</text>

    <!-- 中关村科学城（核心） -->
    <ellipse cx="280" cy="240" rx="70" ry="46" fill="#c97b3b" opacity="0.78"/>
    <text x="280" y="240" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">中关村</text>
    <text x="280" y="252" font-size="9" text-anchor="middle" fill="#fff">科学城北区</text>

    <!-- 上地信息园 -->
    <ellipse cx="370" cy="180" rx="32" ry="22" fill="#c97b3b" opacity="0.5"/>
    <text x="370" y="183" font-size="8" text-anchor="middle" fill="#fff">上地</text>

    <!-- 学院路高校带 -->
    <line x1="240" y1="290" x2="240" y2="410" stroke="#3a5a8a" stroke-width="2.4" opacity="0.8"/>
    <circle cx="240" cy="320" r="5" fill="#3a5a8a"/>
    <circle cx="240" cy="360" r="5" fill="#3a5a8a"/>
    <circle cx="240" cy="400" r="5" fill="#3a5a8a"/>
    <text x="252" y="324" font-size="9" fill="#3a5a8a">清华</text>
    <text x="252" y="364" font-size="9" fill="#3a5a8a">北大</text>
    <text x="252" y="404" font-size="9" fill="#3a5a8a">北航</text>

    <!-- 京张铁路遗产廊道（西北-东南斜线） -->
    <line x1="100" y1="120" x2="430" y2="350" stroke="#5a3a2a" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="130" y="115" font-size="9" fill="#5a3a2a" font-style="italic">京张铁路遗产廊道</text>

    <!-- 11.4 km² 重点设计区 -->
    <rect x="220" y="180" width="140" height="100" fill="none" stroke="#c93b3b" stroke-width="2"/>
    <text x="290" y="225" font-size="10" text-anchor="middle" fill="#c93b3b" font-weight="700">11.4 km²</text>
    <text x="290" y="240" font-size="9" text-anchor="middle" fill="#c93b3b">总体设计范围</text>

    <!-- 比例尺 -->
    <g transform="translate(380,460)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#1d3530" stroke-width="1.5"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#1d3530" stroke-width="1.5"/>
      <line x1="80" y1="-4" x2="80" y2="4" stroke="#1d3530" stroke-width="1.5"/>
      <text x="0" y="18" font-size="9" fill="#1d3530">0</text>
      <text x="80" y="18" font-size="9" text-anchor="middle" fill="#1d3530">2 km</text>
    </g>
  </g>

  <!-- ============ 微观层 ============ -->
  <g transform="translate(1080,120)">
    <rect width="480" height="500" fill="url(#microBg)" stroke="#6a7e96" stroke-width="0.8"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#1d2a3a">III · 微观区位  MICRO</text>
    <text x="20" y="52" font-size="11" fill="#4a5566">11.4 km² 总体设计 · 368.4 ha 三大重点</text>

    <!-- 总体设计范围 -->
    <rect x="40" y="80" width="400" height="320" fill="#d2dce8" stroke="#3a4a6a" stroke-width="1.4"/>

    <!-- 三大重点（位置示意） -->
    <!-- 众智园 192.1 ha（北） -->
    <rect x="90" y="100" width="170" height="80" rx="3" fill="#c93b3b" opacity="0.85"/>
    <text x="175" y="135" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">众智园</text>
    <text x="175" y="155" font-size="11" text-anchor="middle" fill="#fff">192.1 ha</text>
    <text x="175" y="170" font-size="8" text-anchor="middle" fill="#fff" opacity="0.9">公共空间 · 地标</text>

    <!-- AI 原点社区 104.3 ha（中） -->
    <rect x="285" y="160" width="120" height="70" rx="3" fill="#3b6cc9" opacity="0.85"/>
    <text x="345" y="190" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">AI 原点社区</text>
    <text x="345" y="210" font-size="10" text-anchor="middle" fill="#fff">104.3 ha</text>

    <!-- 大钟寺 72.0 ha（南） -->
    <rect x="180" y="280" width="100" height="60" rx="3" fill="#3bc97b" opacity="0.85"/>
    <text x="230" y="308" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">大钟寺</text>
    <text x="230" y="324" font-size="9" text-anchor="middle" fill="#fff">72.0 ha</text>

    <!-- 京张铁路（横穿） -->
    <line x1="40" y1="240" x2="440" y2="240" stroke="#5a3a2a" stroke-width="2.6"/>
    <line x1="40" y1="240" x2="440" y2="240" stroke="#fff" stroke-width="0.6" stroke-dasharray="4 4"/>
    <text x="50" y="232" font-size="9" fill="#5a3a2a" font-style="italic">京张铁路  ·  清华园—大钟寺段</text>

    <!-- 三山五园生态引水（西） -->
    <path d="M 40 80 L 40 400" stroke="#5a8a6a" stroke-width="3" opacity="0.7"/>
    <text x="46" y="100" font-size="8" fill="#3a5a3a" font-style="italic">生态廊</text>

    <!-- 比例尺 -->
    <g transform="translate(340,460)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#1d2a3a" stroke-width="1.5"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#1d2a3a" stroke-width="1.5"/>
      <line x1="50" y1="-3" x2="50" y2="3" stroke="#1d2a3a" stroke-width="1"/>
      <line x1="100" y1="-4" x2="100" y2="4" stroke="#1d2a3a" stroke-width="1.5"/>
      <text x="0" y="18" font-size="9" fill="#1d2a3a">0</text>
      <text x="50" y="18" font-size="9" text-anchor="middle" fill="#1d2a3a">500</text>
      <text x="100" y="18" font-size="9" text-anchor="middle" fill="#1d2a3a">1000 m</text>
    </g>
  </g>

  <!-- ============ 底部图例 ============ -->
  <g transform="translate(40,660)">
    <rect width="1520" height="300" fill="#f5f0e3" stroke="#bba97a" stroke-width="0.6"/>

    <text x="30" y="36" font-size="14" font-weight="700" fill="#3a3320">图例与读图说明  ·  LEGEND &amp; KEY</text>
    <line x1="30" y1="46" x2="200" y2="46" stroke="#bba97a" stroke-width="0.8"/>

    <!-- 左侧：色块图例 -->
    <g transform="translate(30,70)">
      <rect width="14" height="14" fill="#c93b3b" opacity="0.85"/>
      <text x="22" y="12" font-size="11" fill="#3a3320">众智园 192.1 ha  ·  公共空间地标</text>
      <rect y="22" width="14" height="14" fill="#3b6cc9" opacity="0.85"/>
      <text x="22" y="34" font-size="11" fill="#3a3320">AI 原点社区 104.3 ha  ·  科创载体</text>
      <rect y="44" width="14" height="14" fill="#3bc97b" opacity="0.85"/>
      <text x="22" y="56" font-size="11" fill="#3a3320">大钟寺 72.0 ha  ·  文化复兴</text>
      <rect y="66" width="14" height="14" fill="#c97b3b" opacity="0.7"/>
      <text x="22" y="78" font-size="11" fill="#3a3320">现状产业组团（上地 / 中关村北区）</text>
      <rect y="88" width="14" height="14" fill="#7e9e6c" opacity="0.7"/>
      <text x="22" y="100" font-size="11" fill="#3a3320">三山五园生态文化核</text>

      <line x1="0" y1="116" x2="14" y2="116" stroke="#5a3a2a" stroke-width="2.6"/>
      <text x="22" y="120" font-size="11" fill="#3a3320">京张铁路遗产廊道（清华园—大钟寺段）</text>

      <line x1="0" y1="136" x2="14" y2="136" stroke="#3a5a8a" stroke-width="2.4"/>
      <text x="22" y="140" font-size="11" fill="#3a3320">学院路高校轴线（清华·北大·北航）</text>

      <line x1="0" y1="156" x2="14" y2="156" stroke="#5a8a6a" stroke-width="3"/>
      <text x="22" y="160" font-size="11" fill="#3a3320">京密引水渠生态廊</text>
    </g>

    <!-- 中部：空间叙事 -->
    <g transform="translate(380,70)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#3a3320">空间叙事  SPATIAL NARRATIVE</text>
      <line x1="0" y1="6" x2="180" y2="6" stroke="#bba97a" stroke-width="0.8"/>
      <text x="0" y="26" font-size="11" fill="#3a3320">· 京张铁路（1909 詹天佑）以 5‰ 坡度穿越海淀，</text>
      <text x="0" y="42" font-size="11" fill="#3a3320">  留下清华园站、青龙桥人字线等 8 处遗产节点；</text>
      <text x="0" y="62" font-size="11" fill="#3a3320">· 当代海淀承担全国 35% 的 AI 基础研究与算力，</text>
      <text x="0" y="78" font-size="11" fill="#3a3320">  中关村科学城聚集 1.4 万家高新技术企业；</text>
      <text x="0" y="98" font-size="11" fill="#3a3320">· 京张 AI 创新带衔接"古驿道—科创轴—生态核"</text>
      <text x="0" y="114" font-size="11" fill="#3a3320">  三条历史性脉络，转化为可被体验的城市公共空间。</text>
    </g>

    <!-- 右侧：数据 -->
    <g transform="translate(900,70)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#3a3320">关键尺度  KEY METRICS</text>
      <line x1="0" y1="6" x2="160" y2="6" stroke="#bba97a" stroke-width="0.8"/>
      <text x="0" y="28" font-size="10" fill="#6b5e3f">协同研究范围</text>
      <text x="200" y="28" font-size="13" font-weight="700" fill="#3a3320" text-anchor="end">43.6 km²</text>
      <text x="0" y="50" font-size="10" fill="#6b5e3f">总体设计范围</text>
      <text x="200" y="50" font-size="13" font-weight="700" fill="#3a3320" text-anchor="end">11.4 km²</text>
      <text x="0" y="72" font-size="10" fill="#6b5e3f">重点设计面积</text>
      <text x="200" y="72" font-size="13" font-weight="700" fill="#3a3320" text-anchor="end">368.4 ha</text>
      <text x="0" y="94" font-size="10" fill="#6b5e3f">遗产廊道长度</text>
      <text x="200" y="94" font-size="13" font-weight="700" fill="#3a3320" text-anchor="end">≈ 11.4 km</text>
      <text x="0" y="116" font-size="10" fill="#6b5e3f">京张铁路遗产点</text>
      <text x="200" y="116" font-size="13" font-weight="700" fill="#3a3320" text-anchor="end">8 处</text>
    </g>
  </g>

  <!-- 底部版权 -->
  <text x="800" y="990" font-size="9" fill="#9c8a6a" text-anchor="middle" letter-spacing="1">© 2026  lc140606  /  JINGZHANG CENTURY LINK  ·  INDEPENDENT SUBMISSION</text>
</svg>
