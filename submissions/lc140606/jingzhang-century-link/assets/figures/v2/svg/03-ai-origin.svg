        <text x="0" y="50" fill="#6b5e3f">窄街密网 · 4 级道路 · 可步行穿越</text>
        <text x="0" y="74" font-weight="700">· 中轴公共走廊  1.2 km</text>
        <text x="0" y="92" fill="#6b5e3f">贯通南北 · 串联 AI 原点塔 / 中央广场</text>
        <text x="0" y="116" font-weight="700">· 底层全开放  ≥ 60%</text>
        <text x="0" y="134" fill="#6b5e3f">首层咖啡、展厅、共享实验室可达</text>
