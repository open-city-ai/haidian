        <rect x="2" y="2" width="20" height="20" fill="#fff" opacity="0.4"/>
        <rect x="24" y="2" width="20" height="20" fill="#fff" opacity="0.4"/>
        <rect x="46" y="2" width="20" height="20" fill="#fff" opacity="0.4"/>
        <rect x="2" y="24" width="36" height="20" fill="#fff" opacity="0.4"/>
        <rect x="40" y="24" width="36" height="20" fill="#fff" opacity="0.4"/>
