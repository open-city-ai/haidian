  <rect width="1600" height="1000" fill="#fafaf6"/>

  <rect x="0" y="0" width="1600" height="92" fill="#1a2332"/>
  <text x="60" y="50" fill="#f5e9c8" font-size="26" font-weight="700" letter-spacing="3">节点设计 · AI 原点社区</text>
