      <rect x="220" y="430" width="90" height="80" fill="url(#bldgC)"/>
      <rect x="330" y="430" width="100" height="80" fill="url(#bldgB)"/>
      <rect x="450" y="430" width="100" height="80" fill="url(#bldgC)"/>
      <rect x="570" y="430" width="100" height="80" fill="url(#bldgA)"/>
