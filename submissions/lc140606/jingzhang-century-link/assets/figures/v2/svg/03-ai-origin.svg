      <rect x="220" y="120" width="90" height="90" fill="url(#bldgA)"/>
      <rect x="330" y="120" width="100" height="90" fill="url(#bldgB)"/>
      <rect x="450" y="120" width="100" height="90" fill="url(#bldgB)"/>
      <rect x="570" y="120" width="100" height="90" fill="url(#bldgC)"/>
      <rect x="690" y="120" width="90" height="90" fill="url(#bldgC)"/>

