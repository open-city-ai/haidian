      <line x1="320" y1="110" x2="320" y2="580"/>
      <line x1="440" y1="110" x2="440" y2="580"/>
      <line x1="560" y1="110" x2="560" y2="580"/>
      <line x1="680" y1="110" x2="680" y2="580"/>
      <line x1="100" y1="220" x2="860" y2="220"/>
