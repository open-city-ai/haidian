  <text x="1540" y="50" fill="#f5e9c8" font-size="13" text-anchor="end" letter-spacing="2">SHEET 03 / 04</text>
  <text x="1540" y="78" fill="#c8bfa8" font-size="11" text-anchor="end">lc140606  /  INDEPENDENT</text>

  <!-- 总平面 -->
