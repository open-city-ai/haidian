      <rect x="220" y="330" width="90" height="80" fill="url(#bldgC)"/>
      <rect x="330" y="330" width="100" height="80" fill="url(#bldgA)"/>
      <rect x="450" y="330" width="100" height="80" fill="url(#bldgB)"/>
