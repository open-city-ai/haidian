      <text x="20" y="28" font-size="13" font-weight="700" fill="#fff">A · 科创旗舰街区</text>
      <text x="20" y="48" font-size="10" fill="#fff">头部 AI 实验室 + 国家工程中心</text>
      <text x="20" y="68" font-size="9" fill="#fff">典型面积  6 — 9 ha  ·  容积 ≤ 2.0</text>
