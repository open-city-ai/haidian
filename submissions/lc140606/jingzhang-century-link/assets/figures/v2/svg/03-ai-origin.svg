      <text x="20" y="168" font-size="13" font-weight="700" fill="#fff">B · 加速器街区</text>
      <text x="20" y="188" font-size="10" fill="#fff">中小型科创企业 + 共享中试平台</text>
      <text x="20" y="208" font-size="9" fill="#fff">典型面积  3 — 6 ha  ·  容积 ≤ 1.6</text>
      <text x="20" y="224" font-size="9" fill="#fff">弹性预留 · 可分可合</text>
      <g transform="translate(360,180)">
