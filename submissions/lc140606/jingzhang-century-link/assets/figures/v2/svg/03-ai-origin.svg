      <rect x="450" y="230" width="100" height="80" fill="url(#bldgA)"/>
      <rect x="570" y="230" width="100" height="80" fill="url(#bldgA)"/>
      <rect x="690" y="230" width="90" height="80" fill="url(#bldgC)"/>

