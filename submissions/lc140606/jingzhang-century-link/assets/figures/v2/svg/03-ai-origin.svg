        <rect x="2" y="2" width="12" height="12" fill="#fff" opacity="0.4"/>
        <rect x="16" y="2" width="12" height="12" fill="#fff" opacity="0.4"/>
        <rect x="30" y="2" width="12" height="12" fill="#fff" opacity="0.4"/>
        <rect x="44" y="2" width="12" height="12" fill="#fff" opacity="0.4"/>
        <rect x="2" y="16" width="12" height="12" fill="#fff" opacity="0.4"/>
        <rect x="16" y="16" width="12" height="12" fill="#fff" opacity="0.4"/>
