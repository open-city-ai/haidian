        <rect x="2" y="6" width="14" height="14" fill="#fff" opacity="0.4"/>
        <rect x="20" y="6" width="14" height="14" fill="#fff" opacity="0.4"/>
        <rect x="2" y="24" width="14" height="14" fill="#fff" opacity="0.4"/>
