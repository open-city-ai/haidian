<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a878"/>
      <stop offset="0.5" stop-color="#c88858"/>
      <stop offset="1" stop-color="#9a5a3a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b888"/>
      <stop offset="1" stop-color="#8a6840"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a5a"/>
      <stop offset="1" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="duskGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a88858"/>
      <stop offset="1" stop-color="#5a3a20"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#fafaf6"/>

  <rect x="0" y="0" width="1600" height="92" fill="#1a2332"/>
  <text x="60" y="50" fill="#f5e9c8" font-size="26" font-weight="700" letter-spacing="3">效果图 · 大钟寺中轴</text>
  <text x="60" y="78" fill="#c8bfa8" font-size="13" letter-spacing="2">RENDERING  ·  DAZHONGSI CENTRAL AXIS</text>
  <text x="1540" y="50" fill="#f5e9c8" font-size="13" text-anchor="end" letter-spacing="2">SHEET 06 / 06</text>
  <text x="1540" y="78" fill="#c8bfa8" font-size="11" text-anchor="end">lc140606  /  INDEPENDENT</text>

  <!-- 主图：黄昏中轴 -->
  <g transform="translate(40,120)">
    <rect width="1000" height="720" fill="url(#dusk)" stroke="#bba97a" stroke-width="0.8"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#fff">中轴黄昏  ·  DUSK ON THE AXIS</text>

    <!-- 太阳 -->
    <circle cx="500" cy="280" r="38" fill="#f4d090" opacity="0.9"/>
    <circle cx="500" cy="280" r="80" fill="#f4d090" opacity="0.18"/>

    <!-- 远山 -->
    <path d="M 0 460 L 100 420 L 200 450 L 320 410 L 460 445 L 600 410 L 760 445 L 880 420 L 1000 450 L 1000 540 L 0 540 Z"
          fill="#5a3a2a" opacity="0.5"/>

    <!-- 中轴透视线 -->
    <line x1="0" y1="700" x2="500" y2="500" stroke="#5a3a2a" stroke-width="3" opacity="0.7"/>
    <line x1="1000" y1="700" x2="500" y2="500" stroke="#5a3a2a" stroke-width="3" opacity="0.7"/>
    <line x1="0" y1="700" x2="1000" y2="700" stroke="#5a3a2a" stroke-width="2" opacity="0.5"/>

    <!-- 永乐大钟寺（中轴端景） -->
    <g transform="translate(500,500)">
      <!-- 台基 -->
      <rect x="-180" y="-40" width="360" height="60" fill="url(#wall)" stroke="#5a3a2a" stroke-width="1.2"/>
      <rect x="-180" y="-46" width="360" height="6" fill="#7a5838"/>
      <!-- 院墙 -->
      <rect x="-150" y="-100" width="300" height="60" fill="url(#wall)" stroke="#5a3a2a" stroke-width="0.8"/>
      <!-- 屋顶（主殿） -->
      <polygon points="-160,-100 160,-100 130,-130 100,-140 -100,-140 -130,-130" fill="url(#tile)" stroke="#1a2332" stroke-width="0.8"/>
      <polygon points="-100,-140 100,-140 80,-150 -80,-150" fill="#1a2332"/>
      <polygon points="-80,-150 80,-150 60,-160 -60,-160" fill="#c93b3b"/>
      <!-- 立柱 -->
      <g fill="#5a3a2a">
        <rect x="-140" y="-100" width="6" height="20"/>
        <rect x="-80" y="-100" width="6" height="20"/>
        <rect x="-20" y="-100" width="6" height="20"/>
        <rect x="40" y="-100" width="6" height="20"/>
        <rect x="100" y="-100" width="6" height="20"/>
        <rect x="140" y="-100" width="6" height="20"/>
      </g>
      <!-- 大钟（窗口） -->
      <ellipse cx="0" cy="-70" rx="14" ry="20" fill="#5a3a2a" stroke="#2a1a0a" stroke-width="1"/>
      <line x1="0" y1="-90" x2="0" y2="-96" stroke="#2a1a0a" stroke-width="0.8"/>
      <circle cx="0" cy="-70" r="6" fill="#1a1a1a"/>
    </g>

    <!-- 钟声步道（中轴） -->
    <g stroke="#a88858" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.6">
      <line x1="500" y1="560" x2="500" y2="700"/>
    </g>

    <!-- 配殿（左右） -->
    <g transform="translate(220,540)">
      <rect x="0" y="0" width="120" height="80" fill="url(#wall)" stroke="#5a3a2a" stroke-width="0.8"/>
      <polygon points="-6,0 126,0 110,-20 -10,-20" fill="url(#tile)" stroke="#1a2332" stroke-width="0.6"/>
      <text x="60" y="50" font-size="11" text-anchor="middle" fill="#3a3320" font-weight="700">钟博</text>
      <text x="60" y="64" font-size="8" text-anchor="middle" fill="#3a3320">文化馆</text>
    </g>
    <g transform="translate(660,540)">
      <rect x="0" y="0" width="120" height="80" fill="url(#wall)" stroke="#5a3a2a" stroke-width="0.8"/>
      <polygon points="-6,0 126,0 110,-20 -10,-20" fill="url(#tile)" stroke="#1a2332" stroke-width="0.6"/>
      <text x="60" y="50" font-size="11" text-anchor="middle" fill="#3a3320" font-weight="700">非遗</text>
      <text x="60" y="64" font-size="8" text-anchor="middle" fill="#3a3320">工坊</text>
    </g>

    <!-- 地面（黄昏暖色） -->
    <rect x="0" y="620" width="1000" height="100" fill="url(#duskGround)"/>
    <g stroke="#3a2818" stroke-width="0.4" opacity="0.5">
      <line x1="60" y1="620" x2="60" y2="720"/>
      <line x1="160" y1="620" x2="160" y2="720"/>
      <line x1="260" y1="620" x2="260" y2="720"/>
      <line x1="360" y1="620" x2="360" y2="720"/>
      <line x1="460" y1="620" x2="460" y2="720"/>
      <line x1="540" y1="620" x2="540" y2="720"/>
      <line x1="640" y1="620" x2="640" y2="720"/>
      <line x1="740" y1="620" x2="740" y2="720"/>
      <line x1="840" y1="620" x2="840" y2="720"/>
      <line x1="940" y1="620" x2="940" y2="720"/>
    </g>

    <!-- 树 -->
    <g fill="#3a5a3a">
      <ellipse cx="80" cy="610" rx="40" ry="70"/>
      <ellipse cx="170" cy="620" rx="34" ry="58"/>
      <ellipse cx="270" cy="615" rx="38" ry="64"/>
      <ellipse cx="730" cy="615" rx="38" ry="64"/>
      <ellipse cx="830" cy="620" rx="34" ry="58"/>
      <ellipse cx="920" cy="610" rx="40" ry="70"/>
    </g>
    <g fill="#5a3a2a" opacity="0.7">
      <rect x="78" y="540" width="4" height="80"/>
      <rect x="168" y="560" width="4" height="64"/>
      <rect x="268" y="548" width="4" height="70"/>
      <rect x="728" y="548" width="4" height="70"/>
      <rect x="828" y="560" width="4" height="64"/>
      <rect x="918" y="540" width="4" height="80"/>
    </g>

    <!-- 行人剪影 -->
    <g fill="#1a1a1a" opacity="0.85">
      <g transform="translate(380,610)">
        <circle cx="0" cy="-22" r="6"/>
        <rect x="-3" y="-16" width="6" height="22"/>
        <rect x="-3" y="6" width="3" height="14"/>
        <rect x="0" y="6" width="3" height="14"/>
      </g>
      <g transform="translate(620,615)">
        <circle cx="0" cy="-20" r="5"/>
        <rect x="-3" y="-14" width="6" height="20"/>
        <rect x="-3" y="6" width="3" height="13"/>
        <rect x="0" y="6" width="3" height="13"/>
      </g>
    </g>

    <!-- 标题压角 -->
    <g transform="translate(20,690)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#fff">永乐大钟寺  ·  中轴端景  ·  黄昏</text>
      <text x="0" y="14" font-size="9" fill="#f4d090">Yongle Great Bell Temple  ·  Central Axis  ·  Dusk</text>
    </g>
  </g>

  <!-- 右侧栏 -->
  <g transform="translate(1060,120)">
    <rect width="500" height="720" fill="#f5f0e3" stroke="#bba97a" stroke-width="0.6"/>

    <text x="20" y="32" font-size="15" font-weight="700" fill="#3a3320">场景元素  ·  SCENE ELEMENTS</text>
    <text x="20" y="52" font-size="11" fill="#6b5e3f">永乐大钟 46.5 t  ·  中轴钟声步道 1.2 km</text>

    <g transform="translate(20,80)" font-size="11" fill="#3a3320">
      <text x="0" y="0" font-weight="700">·  物  /  OBJECT</text>
      <text x="0" y="18" fill="#6b5e3f">永乐大钟 · 永乐五年（1420）铸成</text>
      <text x="0" y="34" fill="#6b5e3f">钟体内外遍铸汉梵文经咒 22.7 万字</text>

      <text x="0" y="68" font-weight="700">·  场  /  PLACE</text>
      <text x="0" y="86" fill="#6b5e3f">大钟寺原为清雍正敕建</text>
      <text x="0" y="102" fill="#6b5e3f">1985 年起作为古钟博物馆开放</text>

      <text x="0" y="136" font-weight="700">·  时  /  TIME</text>
      <text x="0" y="154" fill="#6b5e3f">黄昏 · 17:30 至 18:30 钟声仪式</text>
      <text x="0" y="170" fill="#6b5e3f">"金声玉振" 沉浸声景</text>

      <text x="0" y="204" font-weight="700">·  人  /  PEOPLE</text>
      <text x="0" y="222" fill="#6b5e3f">行人 60 — 80 人/小时</text>
      <text x="0" y="238" fill="#6b5e3f">停留 8 — 15 分钟 / 钟声仪式日均 ≥ 4 场</text>
    </g>

    <g transform="translate(20,380)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#3a3320">设计要点  ·  DESIGN INTENT</text>
      <line x1="0" y1="10" x2="200" y2="10" stroke="#bba97a" stroke-width="0.6"/>
      <g font-size="11" fill="#3a3320">
        <text x="0" y="32" font-weight="700">·  严格控高  ≤ 9 m</text>
        <text x="0" y="50" fill="#6b5e3f">所有新建均以寺院为端景点</text>

        <text x="0" y="74" font-weight="700">·  材质  /  MATERIAL</text>
        <text x="0" y="92" fill="#6b5e3f">青砖 · 灰瓦 · 木构 · 暖色石材</text>
        <text x="0" y="108" fill="#6b5e3f">与寺院传统建筑取得协调</text>

        <text x="0" y="132" font-weight="700">·  体验  /  EXPERIENCE</text>
        <text x="0" y="150" fill="#6b5e3f">中轴端景 + 配殿围合 + 钟声仪式</text>
        <text x="0" y="166" fill="#6b5e3f">每一步都对应"听见" 永乐大钟</text>
      </g>
    </g>

    <g transform="translate(20,580)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#3a3320">关键指标  ·  METRICS</text>
      <line x1="0" y1="10" x2="200" y2="10" stroke="#bba97a" stroke-width="0.6"/>
      <g font-size="11">
        <text x="0" y="32" fill="#6b5e3f">永乐大钟重量</text>
        <text x="240" y="32" text-anchor="end" font-weight="700" fill="#3a3320">46.5 t</text>
        <text x="0" y="54" fill="#6b5e3f">大钟高度</text>
        <text x="240" y="54" text-anchor="end" font-weight="700" fill="#3a3320">6.75 m</text>
        <text x="0" y="76" fill="#6b5e3f">铭文字数</text>
        <text x="240" y="76" text-anchor="end" font-weight="700" fill="#3a3320">22.7 万</text>
        <text x="0" y="98" fill="#6b5e3f">钟声仪式</text>
        <text x="240" y="98" text-anchor="end" font-weight="700" fill="#3a3320">周日 10:00</text>
      </g>
    </g>
  </g>

  <text x="800" y="990" font-size="9" fill="#9c8a6a" text-anchor="middle" letter-spacing="1">© 2026  lc140606  /  JINGZHANG CENTURY LINK  ·  INDEPENDENT SUBMISSION</text>
</svg>
