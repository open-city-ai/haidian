<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">京张人民智城标志概念</title><desc id="desc">两条抽象铁轨构成人字，一侧为深红铁路与人民公共文化，一侧为银灰人工智能节点，两线汇入中央公共节点。</desc>
<rect width="960" height="320" rx="28" fill="#f6f2e9"/>
<g transform="translate(60 34)">
  <!-- two rails form an abstract 人 rather than a literal political emblem -->
  <path d="M235 225 C285 180 330 123 384 38" fill="none" stroke="#9f2d2d" stroke-width="28" stroke-linecap="round"/>
  <path d="M405 38 C458 126 512 181 582 225" fill="none" stroke="#6f7e8b" stroke-width="28" stroke-linecap="round"/>
  <path d="M248 225 C299 180 343 123 395 42" fill="none" stroke="#d7b7aa" stroke-width="5" stroke-linecap="round"/>
  <path d="M394 42 C447 126 501 181 570 225" fill="none" stroke="#d6dde0" stroke-width="5" stroke-linecap="round"/>
  <!-- public node -->
  <circle cx="395" cy="42" r="24" fill="#9f2d2d" stroke="#f6f2e9" stroke-width="7"/>
  <!-- AI nodes remain subordinate to the civic/public node -->
  <g fill="#6f7e8b"><circle cx="454" cy="125" r="9"/><circle cx="505" cy="181" r="9"/><circle cx="558" cy="217" r="9"/></g>
  <!-- rail sleepers / labor-memory rhythm -->
  <g stroke="#713033" stroke-width="6" stroke-linecap="round" opacity=".75">
    <line x1="261" y1="207" x2="287" y2="228"/><line x1="292" y1="176" x2="316" y2="196"/><line x1="319" y1="142" x2="342" y2="161"/><line x1="345" y1="105" x2="368" y2="121"/>
  </g>
  <text x="655" y="91" font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="46" font-weight="800" fill="#202326">京张人民智城</text>
  <text x="655" y="135" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700" fill="#6f7e8b">JING-ZHANG PEOPLE'S AI CITY</text>
  <text x="655" y="190" font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#9f2d2d">AI向前，人民在先</text>
  <text x="655" y="222" font-family="system-ui,Arial,sans-serif" font-size="18" fill="#60666d">AI Advances, People First.</text>
</g>
</svg>