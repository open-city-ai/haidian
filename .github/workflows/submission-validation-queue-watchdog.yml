name: submission-validation-queue-watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: submission-validation-queue-watchdog
  cancel-in-progress: true

jobs:
  inspect-stuck-runs:
    if: github.repository == 'open-city-ai/haidian'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Inspect and release pre-job zombies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPLY_CLEANUP: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$APPLY_CLEANUP" = "true" ]; then
            python3 scripts/cleanup_submission_validation_runs.py --apply
          else
            python3 scripts/cleanup_submission_validation_runs.py
          fi
