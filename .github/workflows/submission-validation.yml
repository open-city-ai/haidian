name: submission-validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  submission-validation:
    name: submission-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v6
        with:
          # pull_request_target's github.sha is the current default-branch tip.
          # A PR's base.sha can stay pinned to an old commit after main advances.
          ref: ${{ github.sha }}

      - name: Run deterministic submission validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTAINER_BYPASS_LOGINS: ${{ vars.MAINTAINER_BYPASS_LOGINS }}
        run: python3 scripts/github_pr_validation.py
