name: submission-validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Every validation run calls the GitHub API to enumerate and hydrate one PR.
# Isolate concurrency by PR: a new head cancels an obsolete run for the same
# PR, while independent PRs are not trapped behind one global pending slot.
# github_pr_validation.py already retries read-only secondary-rate-limit
# responses and rechecks the live head before every mutating side effect.
concurrency:
  group: submission-validation-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  submission-validation:
    name: submission-validation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout current trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run deterministic submission validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTAINER_BYPASS_LOGINS: ${{ vars.MAINTAINER_BYPASS_LOGINS }}
        run: python3 scripts/github_pr_validation.py
