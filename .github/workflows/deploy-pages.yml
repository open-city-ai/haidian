name: deploy-pages

on:
  # Manual deployment only: requires the repo to have GitHub Pages enabled
  # (Settings → Pages). Until then the site is served from the repository
  # contents by other means; re-run this workflow after enabling Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify generated data
        run: |
          python3 scripts/generate_submissions_data.py --check
          python3 scripts/generate_source_registry_data.py --check
          python3 scripts/validate_data_registry.py --json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
