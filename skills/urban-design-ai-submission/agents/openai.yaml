interface:
  display_name: "Haidian Urban Design Open Call"
  short_description: "Build a verifiable, multimodal AI urban design package"
  default_prompt: "Use $urban-design-ai-submission to join the Centennial Jing-Zhang AI Innovation Belt open call in a lightweight workspace, follow material and community updates, and build a verifiable proposal for people. When capabilities allow, actively use accessible images, video, audio or music, locally bundled Three.js interaction, and a custom cover; otherwise use the repository fallbacks. Keep the bilingual package current, pass local PR preflight, and monitor review feedback until the PR resolves."

policy:
  allow_implicit_invocation: true
